# One event, two groupings that both track the topic, different correct answers.
# The goal_discrimination metric is computed over EVERY case in evals/cases/, not
# just this file — pl-eastern-flank-summit, visegrad-named-bosacki-budapest-en and
# the treaty-anniversary pair all carry two groupings too. These two [now four] are
# the ones whose whole reason for existing is the contrast.
# This is the prompt-v7 premise under test: `defence` asks a different question of
# the E3 (keep the UK bound into European security) than of AUKUS (trilateral
# defence-industrial integration), so an identical score-and-quote pair across the
# two is a failure even when each score looks individually plausible.
# data/enriched/uk_fcdo/2026-07/2026-07-22-987e3337.yaml shows the live corpus
# doing exactly that.
#
# pl-defence24-days and pl-ukraine-accession-talks were added to grow this metric's
# denominator (n=8 at prompt v8, one flip = 0.125 — see evals/README.md) beyond the
# `defence`-topic pairs above: both are single-country Polish MFA items scored
# against the Weimar Triangle and the Visegrád Group's *differently worded* goals
# for a topic they both track, rather than the actor-overlap pattern the other four
# cases use to reach two groupings.
cases:
- id: uk-osce-aerial-attacks
  provenance: data/events/uk_fcdo/2026-07/2026-07-22-987e3337.yaml
  source_name: uk_fcdo
  source_lang: en
  date: '2026-07-22'
  title: 'Russia’s aerial attacks increase the risk of wider escalation: UK statement
    to the OSCE'
  text: UK Senior Military Adviser, Colonel Joby Rimmer, warns that Russia’s missile
    and drone attacks endanger civilians, violate neighbouring states’ airspace and
    increase the risk of miscalculation and escalation across Europe.
  expect:
    actors:
    - UK
    explicit_formats: []
    topics:
    - ukraine
    - defence
    relevant:
    - e3
    - aukus
    stances:
      e3:
        defence: 1
      aukus:
        defence: null
  notes: 'The live corpus rates this +1 with an identical quote for BOTH e3 and aukus.
    e3/defence is defensible — escalation across Europe speaks to keeping the UK bound
    into European security. aukus/defence must be null: nothing here touches defence-industrial
    integration, Pillar II, or export-control reform.'
- id: pl-fr-heads-of-missions
  provenance: data/events/polish_mfa/2026-07/2026-07-09-a25469bc.yaml
  source_name: polish_mfa
  source_lang: pl
  date: '2026-07-09'
  title: Minister Jean-Noël Barrot gościem honorowym Narady Kierowników Placówek Zagranicznych
    RP
  text: Podczas spotkania dwustronnego wicepremier Radosław Sikorski i minister Jean-Noël
    Barrot omówili bieżące sprawy dotyczące bezpieczeństwa, polityki europejskiej
    oraz współpracy bilateralnej między Warszawą a Paryżem. Zadeklarowali kontynuację
    ścisłego dialogu politycznego i rozwój współpracy w kluczowych obszarach, w tym
    m.in. gospodarce, obronności oraz kulturze. Szef polskiej dyplomacji podkreślał,
    że Francja jest naszym strategicznym partnerem w Europie, o podobnej percepcji
    wyzwań bezpieczeństwa i procesów zachodzących na płaszczyźnie europejskiej. Ministrowie
    omówili też kwestie związane z realizacją nowych inwestycji infrastrukturalnych
    i przemysłowych. Wicepremier Sikorski zaznaczył, że Polskę i Francję łączą silne
    relacje gospodarcze. Francja jest naszym trzecim najważniejszym partnerem handlowym
    i czwartym inwestorem w Polsce. Francuskie firmy utrzymują 227 tysięcy miejsc
    pracy w Polsce. Jesteśmy bardzo zainteresowani pogłębianiem dialogu z Francją.
    Jest naszym strategicznym partnerem w Europie i Trójkącie Weimarskim powiedział
    wicepremier Radosław Sikorski. Polskie przedsiębiorstwa także coraz częściej prowadzą
    działalność na francuskim rynku. Inwestują głównie w sektorze motoryzacyjnym,
    produkcji przemysłowej, budownictwie i usługach informacyjnych. Ważnym elementem
    spotkania była kwestia koordynacji współpracy na forum organizacji międzynarodowych.
    Wicepremier Sikorski apelował o poparcie polskich starań o stały udział w pracach
    Grupy G20. Ministrowie dyskutowali także o bieżących wyzwaniach związanych z bezpieczeństwem,
    w tym na Bliskim Wschodzie i w Ukrainie. W swoim wystąpieniu dla kierowników placówek
    zagranicznych minister Jean-Noël Barrot przedstawił francuską perspektywę wobec
    najważniejszych wyzwań stojących przed Europą i wspólnotą transatlantycką. Szef
    francuskiej dyplomacji mówił o kwestiach związanych z bezpieczeństwem i zaznaczył,
    że konieczne jest utrzymanie jedności państw europejskich. W swoim wystąpieniu
    podkreślał też wagę relacji łączących Polskę i Francję. Przyszłość Europy jest
    w rękach Europejczyków. Francja i Polska mają wyjątkową odpowiedzialność za to,
    jak będzie wyglądać jutro naszego kontynentu. Takie jest przesłanie Traktatu z
    Nancy. Wspólnie musimy budować silniejszą europejską architekturę bezpieczeństwa,
    której fundamentem będzie współpraca Francji i Polski. Nie chodzi o podział na
    starą i nową Europę. Chodzi o wybór między pokojem a wojną, między wolnością a
    niewolą Poprzednia wizyta francuskiego ministra spraw zagranicznych na polskiej
    Naradzie Kierowników Placówek Dyplomatycznych miała miejsce w 2012 r. Gościem
    honorowym był wtedy minister Laurent Fabius. Z kolei w styczniu 2025 r. wicepremier
    Radosław Sikorski uczestniczył w Paryżu w Konferencji Ambasadorów Francji.
  expect:
    actors:
    - PL
    - FR
    explicit_formats: []
    topics:
    - defence
    relevant:
    - weimar
    - visegrad
    stances:
      weimar:
        defence: 1
      visegrad:
        defence: null
  notes: Polish-language counterpart of fr-pl-no-format-named. Only the Weimar Triangle
    tracks this pairing, so it anchors the single-grouping baseline that the two-grouping
    cases are compared against.
- id: pl-defence24-days
  provenance: data/events/polish_mfa/2026-05/2026-05-06-0327a936.yaml
  source_name: polish_mfa
  source_lang: pl
  date: '2026-05-06'
  title: Wicepremier Radosław Sikorski na Defence24 Days
  text: Podczas konferencji wicepremier Radosław Sikorski podkreślił, że stanowisko
    Polski w zakresie bezpieczeństwa jest jednym z najważniejszych w Europie. Szef
    polskiego MSZ przypomniał, że jesteśmy liderem pod względem udziału PKB przeznaczonego
    na obronność. W 2025 roku łączne wydatki wyniosły ponad 186,5 mld zł (ok. 4,7%
    PKB), natomiast w 2026 roku budżet obronny (wraz z Funduszem Wsparcia Sił Zbrojnych)
    ma osiągnąć ponad 200 mld zł, co stanowi ok. 4,8% PKB. Wicepremier Sikorski zaznaczył,
    że wzmocnieniem polskiego bezpieczeństwa będzie też zakup uzbrojenia ze środków
    w ramach programu SAFE, czyli unijnego programu wsparcia dla obronności. Polska
    przystąpiła do programu jako pierwsze państw we Wspólnocie i jest największym
    beneficjentem programu. W ramach programu SAFE Polska ma otrzymać nawet 43,7
    mld euro w niskooprocentowanych pożyczkach. Do Polski trafią olbrzymie pieniądze
    w dodatku do naszego już dużego budżetu obronnego. Musimy za te pieniądze dać
    Wojsku Polskiemu to co najlepsze, najnowocześniejsze, to co najskuteczniej odstraszy
    wrogów, których niestety mamy za naszą wschodnią granicą Wicepremier odniósł
    się także do zmian dotyczących obecności amerykańskich żołnierzy w Europie. Podkreślił,
    że polskim interesie jest, żeby amerykańskich żołnierzy w Europie było jak najwięcej,
    a najlepiej w Polsce. Defence24 Days to kluczowe forum dotyczące obronności i
    przemysłu obronnego. W panelach, poza wicepremierem Radosławem Sikorskim, uczestniczyły
    delegacje z kilkudziesięciu krajów partnerskich, przedstawiciele administracji
    publicznej, eksperci wojskowi oraz przedsiębiorcy związani z sektorem zbrojeniowym.
  expect:
    actors:
    - PL
    explicit_formats: []
    topics:
    - defence
    relevant:
    - weimar
    - visegrad
    stances:
      weimar:
        defence: null
      visegrad:
        defence: 2
  notes: 'A single-country readout of Poland''s own defence budget (4.8% of GDP)
    and SAFE-programme procurement — no DE/FR, no European/joint framing at all.
    That is exactly the V4 goal (''higher national defence spending... pursued through
    each capital''s own build-up rather than joint V4 capability''), so visegrad/defence
    is a clean +2. It says nothing about a European pillar or joint capability with
    Germany and France, so weimar/defence must be null rather than borrowing the
    same quote — the inverse pairing from pl-eastern-flank-summit, where Weimar scored
    higher than the V4 on the same topic.'
- id: pl-ukraine-accession-talks
  provenance: data/events/polish_mfa/2026-05/2026-05-12-18fa974c.yaml
  source_name: polish_mfa
  source_lang: pl
  date: '2026-05-12'
  title: Spotkanie szefów dyplomacji Polski i Ukrainy
  text: 'Szefowie dyplomacji Polski i Ukrainy rozmawiali o możliwościach wzmocnienia
    bezpieczeństwa i stabilności w regionie.  Podczas sesji ministerialnej minister
    Andrij Sybiha mówił o sytuacji na froncie i zapewniał, że Kijów jest zainteresowany
    trwałym i długoterminowym zawieszeniem broni. Utrzymujemy pozycję, zamykamy przestrzeń
    powietrzną [dla rosyjskich dronów] i bardzo skutecznie wykorzystujemy nasze specjalne
    sankcje i inne operacje. I to naprawdę działa – mówił minister Sybiha i dodał,
    że konieczne jest utrzymanie presji na Rosję, zapewnienie zaangażowania USA i
    podniesienie ceny, jaką Rosja zapłaci za dalszą agresję. Z kolei wicepremier
    Sikorski zapewniał, że Polska nadal będzie wspierać Ukrainę: Ważne jest aby przeciwnik
    wiedział, że Ukraina jest gotowa walczyć dalej, a my jesteśmy gotowi nadal ją
    wspierać. Myślę, że to właśnie stabilizacja sytuacji na froncie przez Ukrainę
    oraz przełamanie paraliżu w Europie – dzięki wspaniałemu zwycięstwu sił prodemokratycznych
    na Węgrzech – zmuszają Putina do ponownego przemyślenia sytuacji. Musi on teraz
    rozważyć, czy będzie w stanie kontynuować tę wojnę przez kolejne dwa lata Podczas
    rozmów bilateralnych ministrowie rozmawiali o procesie akcesji Ukrainy do Unii
    Europejskiej. Omówili postępy reform, które są niezbędne do realizacji przez
    Ukrainę kolejnych etapów integracji. Podczas spotkania szefowie dyplomacji rozmawiali
    również o klimacie inwestycyjnym na Ukrainie, przede wszystkim sytuacji polskich
    przedsiębiorców, którzy prowadzą tam działalność. Ministrowie omówili główne
    wyzwania i szanse dotyczące dalszego rozwoju polskich inwestycji na Ukrainie.'
  expect:
    actors:
    - PL
    explicit_formats: []
    topics:
    - ukraine
    - enlargement
    relevant:
    - weimar
    - visegrad
    stances:
      weimar:
        ukraine: 1
        enlargement: 1
      visegrad:
        enlargement: null
  notes: 'enlargement is tracked by both groupings but means something different:
    the Weimar goal covers EU accession for Ukraine (among others); the V4 goal is
    specifically Western Balkans accession, applying the V4''s own experience to
    its southern neighbourhood. This item is entirely about Ukraine''s accession
    process (reform progress discussed bilaterally) — nothing about the Balkans —
    so weimar/enlargement is a defensible +1 and visegrad/enlargement must be null.
    visegrad has no ukraine topic at all, so only weimar rates that one.'
