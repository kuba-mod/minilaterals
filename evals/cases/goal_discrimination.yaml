    Nancy. Wspólnie musimy budować silniejszą europejską architekturę bezpieczeństwa,
    której fundamentem będzie współpraca Francji i Polski. Nie chodzi o podział na
    starą i nową Europę. Chodzi o wybór między pokojem a wojną, między wolnością a
    niewolą Poprzednia wizyta francuskiego ministra spraw zagranicznych na polskiej
    Naradzie Kierowników Placówek Dyplomatycznych miała miejsce w 2012 r. Gościem
    honorowym był wtedy minister Laurent Fabius. Z kolei w styczniu 2025 r. wicepremier
    Radosław Sikorski uczestniczył w Paryżu w Konferencji Ambasadorów Francji.
