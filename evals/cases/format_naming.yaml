  title: 'Premier: Grupa Wyszehradzka będzie jedną z największych potęg'
  text: Współpraca w ramach Grupy Wyszehradzkiej może wzmocnić wpływ państw regionu
    na kluczowe wydarzenia i decyzje podejmowane w Europie. Każde z naszych państw
    może ponownie odgrywać ważną rolę w kształtowaniu wydarzeń w Europie. Dzięki temu
    możliwa jest także współpraca ponad istniejącymi różnicami, w sprawach istotnych
    dla naszych krajów i całego regionu Współpraca w ramach V4 przynosi najlepsze
    rezultaty wtedy, gdy opiera się na wzajemnym zaufaniu oraz przekonaniu o dobrych
    intencjach partnerów. Jeśli zawsze będziemy rozumieli, że to, co nas łączy niezależnie
    od konfliktów, jest silniejsze niż to, co nas dzieli, to Europa zacznie nas słuchać
    Obszary takie jak bezpieczeństwo energetyczne, polityka klimatyczna, migracja,
    polityka spójności czy rolnictwo pozostają ważnymi obszarami współpracy między
    państwami regionu. Wtedy, kiedy V4 był lojalny i solidarny, dawał też takie światło
    nadziei wszystkim państwom ze wschodniej flanki, wszystkim tzw. nowym członkom
    Unii Europejskiej. Nie widzę żadnego powodu, żeby znowu V4 był takim drogowskazem
    dla tych wszystkich, którzy w konfrontacji z Niemcami, z Francją, z biurokracją
    brukselską w samotności nie mają szans Wspólne działania krajów Grupy Wyszehradzkiej
