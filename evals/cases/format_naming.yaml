    relevant:
    - weimar
    stances:
      weimar:
        rule_of_law: 1
  notes: Opens 'We, the Foreign Ministers of the Weimar Triangle' — the clearest possible
    positive. If this one misses, explicit_formats is broken outright.
- id: weimar-named-india-meeting
  provenance: data/events/polish_mfa/2026-01/2026-01-07-80eab241.yaml
