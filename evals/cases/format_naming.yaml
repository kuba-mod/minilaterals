# format, not when its member countries merely appear. Half of these are traps —
# the city of Weimar, a German minister called Weimer, and NB8 (a hub
# placeholder, deliberately not a tracked format key). A model that pattern-matches
# on the string "Weimar" scores badly here and nowhere else.
