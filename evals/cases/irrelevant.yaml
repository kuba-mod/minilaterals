    wyobrazić sobie lepszą przyszłość — i wspólnie, solidarnie ją budować. Dlatego
    marzmy odważnie i działajmy odpowiedzialnie zaapelował były premier Jerzy Buzek
    odbierając odznaczenie. Prezydium Parlamentu Europejskiego uhonorowywało osiągnięcia
    osób, które wniosły znaczący wkład w integrację europejską oraz w promowanie i
    obronę europejskich wartości. Były Prezydent Lech Wałęsa przyjął order jako uznanie
    dla zwycięskiej walki ruchu Solidarność. Zależy mi na tym, aby Unia i „pokolenie
