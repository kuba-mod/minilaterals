  title: Przygotowania do wizyty papieża Leona XIV w Polsce
  text: 'Wizyta papieska to wydarzenie, które będzie realizowane wspólnie przez stronę
    rządową i kościelną. Formalne zaproszenia do Polski zostały przekazane Papieżowi
    Leonowi XIV zarówno przez stronę państwową – w imieniu Rzeczypospolitej przez
    prezydentów Andrzeja Dudę i Karola Nawrockiego oraz premiera Donalda Tuska, jak
    i kościelną, reprezentowaną przez Prezydium Konferencji Episkopatu Polski. Ze
    względu na międzynarodowy charakter wizyty Ojca Świętego Ministerstwo Spraw Zagranicznych
    obejmie rolę koordynacyjną przygotowań po stronie rządowej. Termin pielgrzymki
    nie jest jeszcze znany. Po jego ustaleniu zostanie powołany Zespół do spraw organizacji
    pielgrzymki, w skład którego wejdą przedstawiciele odpowiednich podmiotów kościelnych
    i państwowych. Do tej pory Polskę odwiedziło trzech papieży, łącznie 11 razy.
    Jan Paweł II - 9 razy (w latach: 1979, 1983, 1987, 1991, 1995, 1997, 1999, 2002),
    Benedykt XVI w 2006 roku, a podczas Światowych Dni Młodzieży w 2016 roku wizytę
    w Polsce złożył papież Franciszek.'
