  notes: 'Re-recorded against the 49-case gold set grown by #77 (pl-defence24-days,
    pl-ukraine-accession-talks in goal_discrimination.yaml; de-fr-defence-council-preview
    in stance_scale.yaml), replacing the stale 46-case entry from 2026-08-07 (flip
    rate 0.042, eval.yml run 31216887818). Measured by eval.yml run 33608795085 on
    main (0f945ce), flip rate 0.047.

    The reason this run exists: prompt "9" (see that entry below) measured
    goal_discrimination at 0.375 against this stale 46-case v8 baseline of 0.583, a
    -0.208 drop that looked like a real regression at n=8. Re-measuring v8 itself on
    the grown 49-case set puts goal_discrimination at 0.333 (n=10) — indistinguishable
    from v9''s own 0.333 (n=10) on the same 49 cases (see vs-v9 comparison in the "9"
    entry''s notes). abstention_recall similarly lands at 0.221 for both versions.
    The apparent v9 regression was small-n noise in the old 8-case slice, not a
    prompt effect: v8 never actually discriminated goal pairs any better than v9
    once measured on a comparable sample.

    actors_exact fell from 0.911 (n=45, 46-case set) to 0.854 (n=48, 49-case set) —
    outside the flip-rate floor, and not yet root-caused; likely the 3 new cases
    grade harder on actor extraction, but this should be checked before treating it
    as a real capability change.'
