  notes: 'Re-measured after three cases were added to the gold set (pl-defence24-days,
    pl-ukraine-accession-talks in goal_discrimination.yaml; de-fr-defence-council-preview
    in stance_scale.yaml — added to raise goal_discrimination''s and abstention_recall''s
    n, see evals/README.md). This replaces the 2026-08-07 46-case entry rather than
    sitting alongside it, per this file''s one-entry-per-PROMPT_VERSION shape;
    the superseded numbers are in git history (eval.yml run 31216887818).
    eval.yml run 33607214158 on d96d577, flip rate 0.020 across the 3 repeats.

    goal_discrimination fell from 0.583 (n=8) to 0.267 (n=10, range 0.200-0.300)
    — well outside the new noise floor (max(0.020, 1/10)=0.100). Read this as a
    real finding, not noise: the two added cases reach two groupings through a
    single known-actor source rather than multi-country actor overlap, and the
    model does *worse* at giving the two groupings genuinely different answers
    in that shape than in the six pre-existing multi-country-overlap cases —
    the copy-paste defect goal_discrimination exists to catch is apparently more
    common, not less, for this pattern. abstention_recall held (0.216 vs 0.220,
    n=17, within noise) — the added null labels didn''t move it, so the v8
    abstention instruction''s ~78% miss rate is confirmed on a larger sample
    rather than newly explained.

    actors_exact (0.840 vs 0.911, n=48) and actors_f1 (0.917 vs 0.947, n=75) also
    read outside noise. Only 3 cases were added carrying actors labels, so this
    could be one or two of them scoring wrong rather than a broad regression —
    not yet root-caused; worth checking against the eval-results.json artifact
    from the run above before drawing a conclusion.'
