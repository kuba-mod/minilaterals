# Measured prompt-evaluation results, one entry per PROMPT_VERSION.
#
# Written by `python -m pipeline.evaluate --record`. This file is the record a
# claim about a prompt change has to cite: tests/test_evaluate.py fails if
# enrich.PROMPT_VERSION has no entry here, so a prompt cannot be revised without
# the revision being measured first.
#
# prompt_surface_sha is the hash of the prompt templates; rendered_surface_sha
# covers the goal sentences, format legend, topic list and actor codes that get
# interpolated into them. The second can move while the first stands still — a
# goals edit in data/groupings.yaml does exactly that — so two entries are only
# strictly comparable when both match.
