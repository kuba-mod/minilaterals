# Minilateral groupings — the one config file.
#
# Read by three consumers, and everything in here is read by at least one of
# them; nothing is documentation-only.
#
#   pipeline/enrich.py   `goals` per tracked grouping, as the goal each country's
#                        stance is scored against (-2..+2), plus `members`/`topics`
#                        for per-grouping relevance and the actor and issue-area
#                        vocabulary offered to the LLM.
#   pipeline/validate.py derives the known-actor and known-issue-area enums from
#                        the tracked entries, and checks each one's `goals` keys
#                        match its `topics` exactly.
#   pipeline/render.py   builds the hub cards from every top-level entry except `weimar`
#                        (whose card is the live tracker, templated in hub.html):
#                        name, members, `tags` keys, member_names, blurb. Only the
#                        accent gradients live in render.py.
#
# Two shapes of entry:
#
#   Tracked groupings carry `topics` and `goals`. Adding `topics` to an entry
#   widens what the LLM is asked to classify, so it is a pipeline change, not an
#   editorial one — see "Adding a new source" in CLAUDE.md.
#
#   Hub placeholders have neither, because nothing ingests them yet. They render
#   as "coming soon" cards and are invisible to the pipeline.
#
# GOALS ARE PER GROUPING, NOT PER TOPIC. `defence` is tracked by all five tracked
# formats and means something different in each — a European pillar weighted to
# the eastern flank for Weimar, keeping the UK bound in for the E3, national
# build-up for the V4, permanent allied presence for the Baltic Three, and
# industrial integration for AUKUS. Stances are therefore keyed by (grouping,
# topic): an event relevant to two groupings that both track a topic carries one
# rating per grouping, because those two ratings answer different questions.
#
# `tags` are the hub card's chips, each mapped to the objective it stands for. A
# chip is only legitimate if the grouping has a stated, agreed objective behind
# it — analytical framings the members never signed up to ("BRI alternative",
# "sovereigntism") describe a format rather than state its goal.
#
# Keys are the hub slug, except where a grouping was already wired into the
# pipeline under a different one — `baltic` names the `baltic_relevant` field and
# the `baltic` stance block across data/enriched/, so it keeps its key and
# carries `hub_slug` instead. `hub_name` is the card title where it differs from
# `name`, which is what the LLM sees in the format legend.
#
# NOTE: goal text is data, not prompt surface, so editing a sentence here does
# NOT move PROMPT_SURFACE_SHA or PROMPT_VERSION. Ratings already stored were made
# against the wording current at the time; re-rate with
# `pipeline.enrich --stances-only` when a change needs to apply retroactively.

# ==========================================================================
# --- Live tracker ---
# ==========================================================================
weimar:
  name: "Weimar Triangle"
  members: [DE, FR, PL]
  topics: [ukraine, defence, hybrid, enlargement, green_transition, rule_of_law]
  goals:
    ukraine:
      >-
        Sustained Franco-German-Polish support for Ukraine — military, economic and
        diplomatic — until a just and lasting peace, with the three arriving at EU
        tables having already settled a common line.
    defence:
      >-
        A European defence pillar complementary to NATO, weighted towards the eastern
        flank: joint capability development and mobility between the Union's three
        largest continental armies.
    hybrid:
      >-
        Joint response to hybrid pressure from Russia and Belarus — disinformation,
        cyber attack, sabotage, and the instrumentalisation of migrants against Poland's
        eastern border.
    enlargement:
      >-
        EU accession for Ukraine, Moldova and the Western Balkans, together with the
        institutional reform the Union needs before it can absorb them.
    green_transition:
      >-
        Aligning the three economies behind the Clean Industrial Deal and climate
        neutrality without splitting over who carries the industrial cost of the
        transition.
    rule_of_law:
      >-
        The rule of law and democratic resilience inside the Union treated as a security
        question rather than only a legal one.
  tags:
    "Ukraine":
      >-
        Coordinated long-term support for Ukraine across military, economic and
        diplomatic tracks.
    "Defence":
      >-
        A European defence pillar complementary to NATO, weighted towards the eastern
        flank.
    "Hybrid Threats":
      >-
        Joint response to disinformation, cyber attack, sabotage and border
        instrumentalisation.
    "Enlargement":
      >-
        Accession for Ukraine, Moldova and the Western Balkans, plus the reform needed
        to absorb them.
    "Green Transition":
      >-
        The Clean Industrial Deal and climate neutrality, without splitting over
        industrial cost.
    "Rule of Law":
      >-
        Rule of law and democratic resilience inside the Union treated as a security
        question.


# ==========================================================================
# --- Tracked by the pipeline (these carry `topics` and `goals`) ---
# ==========================================================================
e3:
  name: "E3"
  hub_name: "The E3"
  members: [DE, FR, UK]
  topics: [iran, defence]
  goals:
    iran:
      >-
        Preventing Iran from acquiring nuclear weapons — verifiable limits on enrichment
        and full IAEA access, backed by the willingness to use the snapback the three
        hold as JCPOA participants.
    defence:
      >-
        Keeping the United Kingdom bound into European security outside the EU framework
        — coordination between the continent's two nuclear powers and its largest
        defence spenders.
  member_names: "Germany · France · United Kingdom"
  blurb: "Europe's lead trio on Iran and hard security — Berlin, Paris and London coordinating outside the EU frame."
  tags:
    "Iran nuclear file":
      >-
        Verifiable limits on Iranian enrichment and full IAEA access, held as a single
        European negotiating position.
    "Sanctions snapback":
      >-
        Retaining and, where warranted, exercising the JCPOA snapback the three hold as
        participants — done jointly, in August 2025.
    "European security":
      >-
        Keeping the UK bound into European security outside the EU framework.

visegrad:
  name: "Visegrád Group"
  hub_name: "The Visegrád Group"
  members: [PL, CZ, SK, HU]
  topics: [migration, enlargement, defence, energy]
  goals:
    migration:
      >-
        Control of the EU's external border and resistance to mandatory relocation, with
        asylum policy set nationally rather than by qualified majority.
    enlargement:
      >-
        Accession for the Western Balkans — the V4's own accession experience applied to
        its southern neighbourhood.
    defence:
      >-
        Higher national defence spending and a credible NATO presence in Central Europe,
        pursued through each capital's own build-up rather than joint V4 capability.
    energy:
      >-
        Diversification away from Russian oil and gas through north-south
        interconnection, LNG and nuclear — an objective the four share while differing
        sharply on its pace.
  member_names: "Poland · Czechia · Slovakia · Hungary"
  blurb: "Central Europe's caucus inside the EU — four capitals that vote together more often than not."
  tags:
    "Migration & external borders":
      >-
        Control of the EU's external border and asylum policy set nationally rather than
        by qualified majority.
    "Energy security":
      >-
        Diversification away from Russian oil and gas via north-south interconnection,
        LNG and nuclear.
    "EU enlargement":
      >-
        Accession for the Western Balkans.

baltic:
  name: "Baltic Three"
  hub_slug: baltic_three
  hub_name: "The Baltic Three"
  members: [EE, LV, LT]
  topics: [defence, hybrid, energy]
  goals:
    defence:
      >-
        A permanent, division-scale allied presence on Baltic territory and spending
        well above the NATO floor — deterrence by denial, not reinforcement after the
        fact.
    hybrid:
      >-
        Collective resilience against Russian and Belarusian hybrid pressure — border
        provocations, GPS jamming, undersea cable and pipeline sabotage, and information
        operations aimed at Russian-speaking minorities.
    energy:
      >-
        Complete energy separation from Russia: desynchronisation from the BRELL grid,
        synchronisation with continental Europe, and regional LNG and interconnection.
  member_names: "Estonia · Latvia · Lithuania"
  blurb: "NATO's north-eastern frontier — Tallinn, Riga and Vilnius rarely more than a sentence apart."
  tags:
    "Deterrence":
      >-
        Permanent, division-scale allied presence on Baltic territory — deterrence by
        denial.
    "Energy security":
      >-
        Complete energy separation from Russia and synchronisation with the continental
        European grid.
    "Hybrid threats":
      >-
        Collective resilience against border provocations, GPS jamming, undersea
        sabotage and information operations.

aukus:
  name: "AUKUS"
  members: [AU, UK, US]
  topics: [indo_pacific, submarines, defence]
  goals:
    indo_pacific:
      >-
        An Indo-Pacific in which no single power can coerce its neighbours — upholding
        UNCLOS, freedom of navigation, and peaceful settlement of maritime disputes.
    submarines:
      >-
        Delivering Australia a conventionally-armed, nuclear-powered submarine fleet on
        the Optimal Pathway schedule — Virginia-class transfers from the early 2030s,
        then SSN-AUKUS — without weakening non-proliferation norms.
    defence:
      >-
        Deep trilateral defence-industrial integration: Pillar II work on cyber, AI,
        quantum, hypersonics and undersea capability, plus the export-control reform
        that lets technology actually move between the three.
  member_names: "Australia · United Kingdom · United States"
  blurb: "A Pacific security pact built around nuclear-powered submarines and shared defence technology."
  tags:
    "Submarines":
      >-
        A conventionally-armed, nuclear-powered submarine fleet for Australia on the
        Optimal Pathway schedule (Pillar I).
    "Indo-Pacific":
      >-
        An Indo-Pacific where no single power can coerce its neighbours.
    "Defence tech":
      >-
        Joint development of cyber, AI, quantum and undersea capability, and the export-
        control reform to move it (Pillar II).


