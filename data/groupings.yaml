# --- Hub placeholders — no ingester yet, so no `topics` ---
# ==========================================================================
quad:
  name: "The Quad"
  members: [US, JP, IN, AU]
  member_names: "United States · Japan · India · Australia"
  blurb: "The Indo-Pacific's flagship quartet — institutionally busy in 2026, but without a leaders' summit since 2024."
  tags:
    "Indo-Pacific":
      >-
        A region that is free, open, and — in the four's own founding phrase —
        unconstrained by coercion.
    "Critical minerals":
      >-
        Diversified critical-mineral supply chains that are not routed through a single
        supplier state.
    "Maritime security":
      >-
        Shared maritime domain awareness so regional states can see what is happening in
        their own waters.

squad:
  name: "The Squad"
  members: [US, JP, AU, PH]
  member_names: "United States · Japan · Australia · Philippines"
  blurb: "The Quad's operational cousin — four militaries coordinating against grey-zone pressure in the South China Sea."
  tags:
    "South China Sea":
      >-
        Freedom of navigation upheld against grey-zone pressure on Philippine vessels
        and features.
    "Deterrence":
      >-
        Raising the cost of unilateral attempts to change the status quo by force or
        coercion.
    "Defence":
      >-
        Combined maritime activities and interoperable force posture between the four
        militaries.

us_japan_rok:
  name: "US–Japan–ROK Trilateral"
  members: [US, JP, KR]
  member_names: "United States · Japan · South Korea"
  blurb: "Institutionalised at Camp David in 2023 — now navigating a change of government in all three capitals."
  tags:
    "Camp David process":
      >-
        Trilateral coordination institutionalised — a standing meeting calendar and a
        commitment to consult in a crisis — so it outlives any one government.
    "Trilateral exercises":
      >-
        Named, scheduled multi-domain exercises rather than ad hoc drills.
    "DPRK deterrence":
      >-
        Real-time DPRK missile-warning data sharing and a coordinated response to
        launches.

coalition_of_the_willing:
  name: "Coalition of the Willing"
  members: [UK, FR, DE]
  member_names: "UK & France (co-chairs) · Germany · ~35 countries in total"
  blurb: "Started in London in 2025 to backstop a Ukraine ceasefire — some 26 states have pledged troops to a planned reassurance force."
  tags:
    "Ukraine":
      >-
        Security guarantees credible enough that a ceasefire in Ukraine would hold.
    "Security guarantees":
      >-
        Commitments underwritten by named contributing states rather than declaratory
        support.
    "Reassurance force":
      >-
        A multinational force deployed in Ukraine with its consent, backed by force
        pledges from participating states.

e5:
  name: "The E5"
  members: [FR, DE, UK, IT, PL]
  member_names: "France · Germany · UK · Italy · Poland"
  blurb: "Europe's five biggest defence spenders, convened by their defence ministers since late 2024 to coordinate support for Ukraine and build out NATO's European pillar."
  tags:
    "Ukraine support":
      >-
        Coordinated military support for Ukraine from Europe's five largest defence
        budgets.
    "Capability & procurement":
      >-
        Jointly developed and procured capability — starting with low-cost drone strike
        at shared production scale.
    "European pillar of NATO":
      >-
        Europe carrying more of NATO's deterrence and defence load, with the Alliance
        still the framework.

jef:
  name: "Joint Expeditionary Force"
  members: [UK, NL, DK, "NO", IS, SE, FI, EE, LV, LT]
  member_names: "UK · Netherlands · Denmark · Norway · Iceland · Sweden · Finland · Estonia · Latvia · Lithuania"
  blurb: "A UK-led ten-nation coalition now tracking Russia's shadow fleet across the Baltic and North Seas."
  tags:
    "Baltic Sea & High North":
      >-
        A standing high-readiness force for the region the ten themselves call their
        core geostrategic area.
    "Shadow fleet":
      >-
        Tracking and deterring the vessels Russia uses to evade sanctions and threaten
        undersea infrastructure.
    "Hybrid threats":
      >-
        Response options below the Article 5 threshold, faster than the Alliance can
        convene.

lancaster_house:
  name: "Lancaster House 2.0"
  members: [UK, FR]
  member_names: "United Kingdom · France"
  blurb: "The 2010 treaties rebooted in 2025 — the Northwood Declaration opened the door to coordinating the two nuclear deterrents."
  tags:
    "Nuclear coordination":
      >-
        Two independent deterrents that can be coordinated — the furthest either state
        has gone with any partner.
    "Deep strike":
      >-
        A jointly developed successor to Storm Shadow/SCALP and the industrial base to
        sustain it.

b9:
  name: "Bucharest Nine"
  members: [BG, CZ, EE, HU, LV, LT, PL, RO, SK]
  member_names: "Bulgaria · Czechia · Estonia · Hungary · Latvia · Lithuania · Poland · Romania · Slovakia"
  blurb: "NATO's eastern-flank caucus, founded after Crimea — now debating whether to widen to the Black Sea's south-east."
  tags:
    "NATO eastern flank":
      >-
        The Baltic-to-Black-Sea line treated by the Alliance as one theatre rather than
        nine national cases.
    "Deterrence":
      >-
        Allied forward presence and national spending at levels the nine can point to
        collectively inside NATO.

nb8:
  name: "Nordic-Baltic Eight"
  members: [DK, FI, "NO", SE, IS, EE, LV, LT]
  member_names: "Denmark · Finland · Norway · Sweden · Iceland · Estonia · Latvia · Lithuania"
  blurb: "An informal Nordic-Baltic format since the 1990s, now doing double duty as Europe's most reliable security engine."
  tags:
    "Foreign policy coordination":
      >-
        Eight small states arriving at EU, NATO and UN tables with a line already
        settled between them.
    "Ukraine support":
      >-
        Sustaining the highest per-GDP support for Ukraine in Europe, and being seen to
        do so as a bloc.
    "Regional security":
      >-
        Civil, cyber and defence resilience across the Nordic-Baltic space.

three_seas:
  name: "Three Seas Initiative"
  members: [EE, LV, LT, PL, CZ, SK, HU, SI, AT, HR, RO, GR, BG]
  member_names: "13 states between the Baltic, Adriatic and Black Seas"
  blurb: "A north-south infrastructure club for the EU's eastern half — Spain and Turkey joined as strategic partners in 2025."
  tags:
    "Energy":
      >-
        North-south energy interconnection across the EU's eastern half.
    "Transport":
      >-
        Road, rail and port links along the same north-south axis, closing the gap left
        by east-west investment.
    "Digital infrastructure":
      >-
        Cross-border digital connection between the thirteen.

i2u2:
  name: "I2U2"
  members: [IN, IL, AE, US]
  member_names: "India · Israel · UAE · United States"
  blurb: "The 'West Asian Quad' — private-sector projects that stalled through 2024 and lean heavily on US engagement to move."
  tags:
    "Food security":
      >-
        Private capital mobilised into food production and distribution — the integrated
        food parks programme in India.
    "Clean energy":
      >-
        Joint renewable generation projects, beginning with hybrid wind-solar and
        storage in Gujarat.
    "Water":
      >-
        Water technology and management cooperation across the four.

negev_forum:
  name: "Negev Forum"
  members: [IL, US, AE, BH, EG, MA]
  member_names: "Israel · United States · UAE · Bahrain · Egypt · Morocco"
  blurb: "Six Abraham Accords-era working groups, suspended at ministerial level since the Gaza war."
  tags:
    "Regional security":
      >-
        A standing regional security channel between Israel and its Abraham Accords
        partners.
    "Regional integration":
      >-
        Initiatives that make regional integration and development concrete rather than
        declaratory.
    "Clean energy":
      >-
        Joint clean-energy projects under the Forum's chartered working group.

imec:
  name: "IMEC"
  members: [IN, US, FR, DE, IT, SA, AE]
  member_names: "India · US · EU · France · Germany · Italy · Saudi Arabia · UAE"
  blurb: "A rail-port-cable corridor pitched as an answer to China's Belt and Road — construction has started, funding hasn't firmed up."
  tags:
    "Connectivity":
      >-
        A trade route from India through the Gulf to Europe that shortens transit and
        reduces exposure to the Red Sea.
    "Rail & ports":
      >-
        The physical corridor — ship-to-rail transfer through Gulf ports and rail across
        the Arabian peninsula.
    "Energy & data cables":
      >-
        An electricity interconnector, clean hydrogen pipeline and data cable laid along
        the same route.

india_france_uae:
  name: "India–France–UAE Trilateral"
  members: [IN, FR, AE]
  member_names: "India · France · UAE"
  blurb: "A defence-and-energy trio watching the Western Indian Ocean, with an AI and space roadmap agreed in 2025."
  tags:
    "Indian Ocean":
      >-
        Coordinated presence and environmental cooperation across the western Indian
        Ocean.
    "Defence":
      >-
        Joint production of military hardware between the three.
    "Energy":
      >-
        Joint projects in solar and nuclear energy.

aes:
  name: "Alliance of Sahel States"
  members: [ML, BF, NE]
  member_names: "Mali · Burkina Faso · Niger"
  blurb: "Three juntas that quit ECOWAS and stood up a joint military force in 2025 — the clearest anti-Western minilateral."
  tags:
    "Collective defence":
      >-
        An attack on one treated as an attack on all, with a duty of armed assistance.
    "Joint military force":
      >-
        A standing joint force for the three-borders region, replacing the arrangements
        they left.
    "Confederation":
      >-
        Political, economic and monetary integration outside ECOWAS.

pacific_alliance:
  name: "Pacific Alliance"
  members: [CL, CO, MX, PE]
  member_names: "Chile · Colombia · Mexico · Peru"
  blurb: "Latin America's trade bright spot, representing roughly half the region's trade — though a presidency rift is testing it."
  tags:
    "Trade integration":
      >-
        An area of deep integration between the four economies, delivered through the
        Commercial Protocol.
    "Free movement":
      >-
        Free movement of goods, services, capital and — distinctively — people.
    "Asia-Pacific links":
      >-
        The four projected collectively into the Asia-Pacific rather than negotiating
        separately.

mekong_lancang:
  name: "Mekong-Lancang Cooperation"
  members: [CN, KH, LA, MM, TH, VN]
  member_names: "China · Cambodia · Laos · Myanmar · Thailand · Vietnam"
  blurb: "Beijing's mechanism for the Mekong basin — trade with the five downstream states topped $437bn over the decade."
  tags:
    "Water resources":
