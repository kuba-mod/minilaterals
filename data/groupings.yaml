    "Connectivity":
      >-
        Cross-border transport and economic corridors linking the five downstream states
        to China.
    "Law enforcement":
      >-
        Joint river patrols and action against cross-border crime, latterly the scam
        compounds.

china_pakistan_afghanistan:
