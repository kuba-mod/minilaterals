        Joint action against cross-border militancy and the narcotics trade.
    "CPEC extension":
      >-
        The China-Pakistan Economic Corridor extended into Afghanistan.

csc:
  name: "Colombo Security Conclave"
  members: [IN, LK, MV, MU, BD]
  member_names: "India · Sri Lanka · Maldives · Mauritius · Bangladesh"
  blurb: "An India-led Indian Ocean security format, widely read as a counterweight to Chinese influence in the region."
  tags:
    "Maritime security":
      >-
        Indian Ocean maritime safety and security coordinated between the littoral
        states (charter pillar one).
    "Counter-terrorism":
      >-
        Countering terrorism and radicalisation across the region (charter pillar two).
    "HADR":
      >-
        Coordinated humanitarian assistance and disaster relief (charter pillar five).

mikta:
  name: "MIKTA"
  members: [MX, ID, KR, TR, AU]
  member_names: "Mexico · Indonesia · South Korea · Turkey · Australia"
  blurb: "A cross-regional middle-power caucus of G20 members — its relevance is perennially debated, and it perennially persists."
  tags:
    "Global governance":
      >-
        Five cross-regional middle powers coordinating positions in the G20, the UN and
        beyond.
    "Multilateral reform":
      >-
        Defending and reforming the multilateral system itself, as the group's
        substantive contribution.

chip4:
  name: "Chip 4 / Fab 4"
  members: [US, JP, KR, TW]
  member_names: "United States · Japan · South Korea · Taiwan"
  blurb: "A proposed chip-supply alliance among states that together hold most of the world's semiconductor value chain — still more aspiration than institution."
  tags:
    "Semiconductors":
      >-
        Proposed, never agreed: geographically diversified fabrication across the four.
    "Supply chains":
      >-
        Proposed, never agreed: supply-chain resilience and aligned export controls —
        the element Seoul has never accepted.

