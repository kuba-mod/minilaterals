# Minilateral groupings: what each one is, what it exists to do, and how that
# goal was agreed.
#
# Single source of truth for two different consumers, which is why entries come
# in two shapes:
#
#   Tracked groupings carry `topics` — the issue areas the pipeline classifies
#   against. These are read by pipeline/enrich.py (per-grouping relevance, plus
#   the actor/topic vocabulary offered to the LLM) and pipeline/validate.py (the
#   known-actor and known-issue-area enums). The UNION of every tracked
#   grouping's `topics` is the global issue-area enum, and per-topic reference
#   goal sentences for it live in data/goals.yaml. Adding `topics` to an entry
#   widens what the LLM is asked to classify, so it is a pipeline change, not an
#   editorial one — see "Adding a new source" in CLAUDE.md.
#
#   Hub placeholders have no `topics` because nothing ingests them yet. They are
#   rendered as "coming soon" cards on the umbrella hub page and are invisible to
#   the pipeline.
#
# Every entry, tracked or not, states a `goal` and the instrument it was agreed
# in. That is the check on the hub cards: a card tag is only legitimate if the
# grouping has a stated, agreed objective behind it, traceable to a document its
# members signed or issued. Analytical framings the members never signed up to
# ("BRI alternative", "sovereigntism") describe a format rather than state its
# goal, and do not belong on a card. tests/test_hub_goals.py keeps the `tags`
# here identical to HUB_GROUPINGS in pipeline/render.py.
#
# Keys are the hub slug, except where a grouping was already wired into the
# pipeline under a different one — `baltic` names the `baltic_relevant` field
# across data/enriched/, so it keeps its key and carries `hub_slug` instead.
#
# Fields
#   members     canonical country codes (UK, not GB).
#   topics      tracked groupings only — see above.
#   goal        one sentence: what the members say the format is for.
#   agreed      the instrument that goal comes from. `instrument`/`date`/`level`
#               describe the founding act; `restated` names the later document
#               that is operative today, where the founding goal has been met,
#               superseded, or substantially widened.
#   status      active | intermittent | dormant | suspended | aspirational
#   tags        the hub card tags, each with the agreed basis it rests on.
#   notes       caveats worth carrying — goal drift, contested aims, inactivity.
#
# Dates are the date of the instrument, not of the first meeting, unless the two
# coincide. Where a format has no founding text at all, `agreed` says so plainly
# rather than inventing one. Topic assignments are editable judgment calls.

# ===========================================================================
# Live
# ===========================================================================

weimar:
  name: Weimar Triangle
  members: [DE, FR, PL]
  topics: [ukraine, defence, hybrid, enlargement, green_transition, rule_of_law]
  goal: >
    Concert French, German and Polish positions so the three act together on
    European security and the Union's eastern policy, rather than in parallel.
  agreed:
    instrument: >
      Weimar Declaration — Joint Declaration of the Foreign Ministers of France,
      Germany and Poland on the Future of Europe, issued at Weimar.
    date: 1991-08-29
    level: foreign ministers
    restated: >
      The substantive goals scored by this tracker are the ones set in the Weimar
      foreign ministers' joint declarations of February and May 2024 and the EU
      Affairs Ministers' meeting of December 2024 — the 1991 declaration set the
      format up, it did not set today's agenda.
  status: active
  tags:
    Ukraine: 2024 FM joint declarations — coordinated long-term support for Ukraine.
    Defence: 2024 FM joint declarations — a European defence pillar complementary to NATO.
    Hybrid Threats: 2024 FM joint declarations — joint response to disinformation, cyber and interference.
    Enlargement: December 2024 EU Affairs Ministers — accession of Ukraine and the Western Balkans plus internal reform.
    Green Transition: 2024 FM joint declarations — Clean Industrial Deal and climate neutrality.
    Rule of Law: 2024 FM joint declarations — democratic resilience as a security question.
  notes: >
    The only grouping here whose goals were re-agreed recently enough to score
    statements against directly. Everything else in this file states the goal;
    only Weimar has the per-topic reference sentences in data/goals.yaml.

# ===========================================================================
# Tracked by the pipeline (these carry `topics`)
# ===========================================================================

e3:
  name: E3
  members: [DE, FR, UK]
  topics: [iran, defence]
  goal: >
    Keep Iran from acquiring nuclear weapons by holding a common European
    negotiating position on the nuclear file, backed by the sanctions leverage
    the three retain as JCPOA participants.
  agreed:
    instrument: >
      Tehran Declaration — agreement between Iran and the governments of France,
      Germany and the United Kingdom on Iran's nuclear programme, the act that
      created the E3 as a standing format.
    date: 2003-10-21
    level: foreign ministers
    url: https://www.iranwatch.org/library/government/france/ministry-foreign-affairs/agreement-between-government-iran-and-governments-france-germany-and-united-kingdom-irans-nuclear
    restated: >
      E3 foreign ministers' joint statement activating the JCPOA snapback
      mechanism, 28 August 2025; UN sanctions reimposed 27 September 2025.
      https://www.auswaertiges-amt.de/en/newsroom/news/2737116-2737116
  status: active
  tags:
    Iran nuclear file: The founding and continuing purpose — Tehran Declaration 2003 through the 2025 snapback.
    Sanctions snapback: >
      The E3's distinctive instrument, exercised jointly on 28 August 2025 —
      the one thing this trio can do that no other European format can.
    European security: >
      The E3 label is increasingly used for wider FR/DE/UK coordination on
      Ukraine and European defence, but through ad hoc joint statements rather
      than a standing agreed agenda. Weakest of the three tags.
  notes: >
    The previous card carried both "Iran" and "Nuclear file", which are the same
    tag twice, and "Defence", which belongs to the E5 and Lancaster House
    formats rather than this one — E3 defence coordination has no founding
    instrument behind it.

visegrad:
  name: Visegrád Group
  members: [PL, CZ, SK, HU]
  topics: [migration, enlargement, defence, energy]
  goal: >
    Coordinate four Central European positions inside the EU and NATO — today
    principally on external borders and migration, energy security and
    enlargement — having achieved its founding goal of Euro-Atlantic accession.
  agreed:
    instrument: >
      Visegrád Declaration, signed at Visegrád by Havel, Antall and Wałęsa —
      goals were democratic consolidation, dismantling the totalitarian legal
      order, market economies, and Euro-Atlantic integration.
    date: 1991-02-15
    level: heads of state and government
    url: https://www.visegradgroup.eu/home/documents/visegrad-declarations/visegrad-declaration-110412-2
    restated: >
      No successor declaration. Since EU accession in 2004 the operative agenda
      is set annually by the rotating presidency programme, which is why the
      group's stated goals move with whichever capital holds the chair.
  status: intermittent
  tags:
    Migration & external borders: >
      The most consistently held common V4 position since 2015, restated in
      successive presidency programmes and joint statements.
    Energy security: Recurring presidency-programme priority; the V4's original North-South interconnection agenda.
    EU enlargement: >
      Western Balkans accession is the longest-running item of positive V4
      consensus, and the topic data/groupings.yaml already tracks.
  notes: >
    Weakest goal of any European format here. The 1991 declaration's objectives
    were met in 2004 and were never replaced, so "the V4 goal" is really a
    rolling presidency agenda that Ukraine policy has split since 2022. The old
    "EU funds" tag was dropped: budget and conditionality disputes are something
    individual members do, not something the V4 has ever agreed as an aim.

baltic:
  name: Baltic Three
  hub_slug: baltic_three
  members: [EE, LV, LT]
  topics: [defence, hybrid, energy]
  goal: >
    Present a single Estonian-Latvian-Lithuanian position on regional defence,
    energy independence and resilience, and build the shared infrastructure that
    position depends on.
  agreed:
    instrument: >
      Agreement on Baltic Parliamentary and Governmental Co-operation between
      Estonia, Latvia and Lithuania, signed in Tallinn — defined the Baltic
      Assembly (est. 8 November 1991) and created the Baltic Council of
      Ministers as the intergovernmental arm.
    date: 1994-06-13
    level: heads of government
    url: https://www.baltasam.org/cooperation/baltic-council-of-ministers
    restated: >
      Cooperation areas are set by Baltic Council of Ministers work programmes;
      foreign/security policy, defence, energy and transport are the standing
      four.
  status: active
  tags:
    Deterrence: Standing BCM cooperation area; the three coordinate NATO force-posture asks as a bloc.
    Energy security: >
      Standing BCM cooperation area, and the format's most concrete delivered
      objective — desynchronisation from the BRELL grid, completed February 2025.
    Hybrid threats: Standing BCM cooperation area; matches the `hybrid` topic already tracked in data/groupings.yaml.
  notes: >
    "Russia" was dropped as a tag. Every grouping in this half of the page is
    about Russia; a tag naming the adversary describes the context, not an
    objective the three agreed to pursue.

aukus:
  name: AUKUS
  members: [AU, UK, US]
  topics: [indo_pacific, submarines, defence]
  goal: >
    Give Australia a conventionally-armed, nuclear-powered submarine capability
    (Pillar I) and jointly develop advanced military technologies (Pillar II),
    to sustain deterrence in the Indo-Pacific.
  agreed:
    instrument: Joint Leaders Statement on AUKUS.
    date: 2021-09-15
    level: leaders
    url: https://www.pm.gov.au/media/joint-leaders-statement-aukus
    restated: >
      Optimal Pathway announcement, San Diego, 13 March 2023, which set the
      submarine delivery schedule the Pillar I goal is now measured against.
  status: active
  tags:
    Submarines: Pillar I, named in the founding statement.
    Indo-Pacific: The stated theatre and rationale in the founding statement's first paragraph.
    Defence tech: Pillar II — cyber, AI, quantum and undersea capabilities, named in the founding statement.
  notes: >
    The cleanest goal on the page: three tags, two of them literally the
    partnership's own numbered pillars.

# ===========================================================================
# Hub placeholders — no ingester yet, so no `topics`
