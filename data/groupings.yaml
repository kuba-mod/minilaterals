quad:
  name: The Quad
  members: [US, JP, IN, AU]
  goal: >
    Sustain a free and open Indo-Pacific, unconstrained by coercion, through
    practical cooperation on maritime domain awareness, critical technology and
    resilient supply chains.
  agreed:
    instrument: >
      "The Spirit of the Quad" — joint statement of the first Quad Leaders'
      Summit (held virtually), the first leader-level articulation of the
      format's purpose.
    date: 2021-03-12
    level: leaders
    url: https://2021-2025.state.gov/joint-statement-on-quad-cooperation-in-the-indo-pacific/
    restated: >
      Quad Foreign Ministers' joint statement, Washington, 1 July 2025, which
      launched the Quad Critical Minerals Initiative. Precursors: the 2004
      tsunami core group, the 2007 first officials' meeting, and the November
      2017 revival.
  status: intermittent
  tags:
    Indo-Pacific: The founding formulation — "free, open, inclusive, healthy, anchored by democratic values, and unconstrained by coercion".
    Critical minerals: Quad Critical Minerals Initiative, launched at the July 2025 foreign ministers' meeting.
    Maritime security: >
      The Indo-Pacific Partnership for Maritime Domain Awareness (2022) and
      successor maritime initiatives — the Quad's most operational workstream.
  notes: >
    Goals are clear and current; the cadence is not. India has held the chair
    since 2025 without convening a leaders' summit — the last was September
    2024 — so the working level is carrying the format.

squad:
  name: The Squad
  members: [US, JP, AU, PH]
  goal: >
    Deter coercion against the Philippines and uphold freedom of navigation in
    the South China Sea through combined maritime operations and interoperable
    force posture.
  agreed:
    instrument: >
      Joint readout of the first stand-alone Australia-Japan-Philippines-United
      States Defense Ministers' Meeting, Hawaii (2 May 2024), following an
      informal first gathering at the 2023 Shangri-La Dialogue. There is no
      founding charter — the format is defined by its successive joint readouts.
    date: 2024-05-04
    level: defence ministers
    url: https://www.minister.defence.gov.au/statements/2024-05-04/joint-readout-from-australia-japan-philippines-united-states-defense-ministers-meeting
  status: active
  tags:
    South China Sea: The named object of every joint readout since May 2024.
    Deterrence: Stated purpose — objecting to "dangerous conduct" and unilateral change of the status quo by force or coercion.
    Defence: Maritime Cooperative Activities, the format's concrete recurring output.
  notes: >
    No signed instrument, but the ministerial readouts are consistent enough
    that the goal is unambiguous. "Squad" is a Pentagon nickname, not a name the
    four use of themselves.

us_japan_rok:
  name: US–Japan–ROK Trilateral
  members: [US, JP, KR]
  goal: >
    Institutionalise three-way security coordination against DPRK and regional
    threats so that it survives changes of government — a commitment to consult
    in a crisis, an annual meeting calendar, and named recurring exercises.
  agreed:
    instrument: >
      "The Spirit of Camp David" joint statement plus the Camp David Principles
      and the Commitment to Consult, adopted at the first stand-alone trilateral
      leaders' summit.
    date: 2023-08-18
    level: leaders
    url: https://kr.usembassy.gov/081923-the-spirit-of-camp-david-joint-statement-of-japan-the-republic-of-korea-and-the-united-states/
  status: intermittent
  tags:
    Camp David process: >
      The institutionalisation itself is the agreed goal — annual leader,
      foreign, defence and NSA-level meetings.
    Trilateral exercises: Multi-domain exercises on a named, published schedule (Freedom Edge from June 2024).
    DPRK deterrence: >
      Real-time DPRK missile warning data sharing and coordinated response —
      the most concrete Camp David deliverable.
  notes: >
    "Export controls" was dropped. Camp David commits the three to economic
    security, supply-chain resilience and technology protection broadly;
    coordinated export controls are a US bilateral track, not a trilateral
    agreed objective. All three capitals have changed government since 2023,
    which is precisely the stress the institutionalisation goal was built for.

coalition_of_the_willing:
  name: Coalition of the Willing
  members: [UK, FR, DE]
  goal: >
    Underwrite any Ukraine ceasefire with credible security guarantees,
    including a multinational reassurance force deployed with Ukraine's consent.
  agreed:
    instrument: >
      Convened by the UK at the "Securing Our Future" leaders' summit in London;
      co-chaired with France. No treaty or charter — the coalition's goals are
      set in successive leaders' communiqués and its military planning cell.
    date: 2025-03-02
    level: leaders
    url: https://researchbriefings.files.parliament.uk/documents/CBP-10412/CBP-10412.pdf
    restated: >
      Coalition meeting of 6 January 2026, which established a US/Ukraine/
      coalition coordination cell within the operational headquarters in Ukraine.
  status: active
  tags:
    Ukraine: The sole subject of the format.
    Security guarantees: The stated purpose in the founding London communiqué.
    Reassurance force: >
      The specific deliverable — around 26 of the ~35 participating states have
      made force pledges.
  notes: >
    Tags are accurate. The card's three flags are the two co-chairs plus
    Germany; the member_names line already says "~35 countries in total", which
    is the honest framing for a format with no fixed membership.

e5:
  name: The E5
  members: [FR, DE, UK, IT, PL]
  goal: >
    Coordinate the five largest European defence budgets on support for Ukraine
    and on building a European pillar within NATO — capability targets, joint
    procurement and industrial capacity.
  agreed:
    instrument: >
      No founding declaration. The format was convened by the German defence
      minister at a first meeting in Berlin on 25 November 2024 and named "the
      E5" by the UK defence secretary there; goals are set in the joint
      statements issued from each subsequent ministerial.
    date: 2024-11-25
    level: defence ministers
    url: https://www.gov.pl/web/national-defence/strengthening-allied-relations-and-the-will-to-act-within-the-e5-group
  status: active
  tags:
    Ukraine support: The convening purpose of the Berlin meeting and every joint statement since.
    Capability & procurement: >
      The concrete agreed output — joint development and procurement of drone
      strike capability, including low-cost shared production.
    European pillar of NATO: >
      The standing framing of the E5 joint statements: NATO as the cornerstone,
      Europe carrying more of the deterrence and defence load.
  notes: >
    Two corrections to the card copy. The E5 was stood up in November 2024, not
    2025; and it is not "the E3 widened" — the E3 is a foreign-ministry format
    built around the Iran file, while the E5 is a defence-ministers format with
    a separate lineage. The old "Defence coordination" tag was too generic to
    distinguish this format from four others on the page.

jef:
  name: Joint Expeditionary Force
  members: [UK, NL, DK, "NO", IS, SE, FI, EE, LV, LT]
  goal: >
    Maintain a UK-led, high-readiness multinational force able to act in the
    Baltic Sea region, the High North and the North Atlantic — below the
    threshold of NATO Article 5 activation, and faster than it.
  agreed:
    instrument: >
      Letter of Intent signed by seven nations in the margins of the NATO Wales
      Summit (Denmark, Estonia, Latvia, Lithuania, the Netherlands, Norway, UK;
      Finland and Sweden joined 2017, Iceland 2021).
    date: 2014-09-05
    level: heads of state and government
    url: https://commonslibrary.parliament.uk/research-briefings/cbp-10074/
    restated: >
      JEF Policy Direction signed by defence ministers in Helsinki, 2021, which
      reoriented the force from expeditionary operations to regional deterrence
      and named the Baltic Sea and High North as its core area.
  status: active
  tags:
    Baltic Sea & High North: >
      Named in the 2021 Policy Direction and reaffirmed by leaders as the
      "core, interlinked, geostrategic area of concern" for the JEF.
    Shadow fleet: >
      Operation Nordic Warden, activated under JEF protocols on 5 January 2025
      after the Estlink 2 cable damage — the format's most visible activity.
    Hybrid threats: >
      Protection of critical undersea infrastructure and sub-threshold response
      options, the 2021 Policy Direction's central rationale.
  notes: >
    The tag was widened from "Baltic Sea" to "Baltic Sea & High North" to match
    the leaders' own formulation — the JEF's remit has never been Baltic-only.

lancaster_house:
  name: Lancaster House 2.0
  members: [UK, FR]
  goal: >
    Deepen UK-France defence integration to the point of coordinating the two
    European nuclear deterrents, alongside joint conventional strike and a
    shared expeditionary force.
  agreed:
    instrument: >
      Northwood Declaration, signed by the Prime Minister and the President at
      Northwood Headquarters — affirms the two nuclear forces are "independent,
      but can be coordinated" and creates the UK-France Nuclear Steering Group.
    date: 2025-07-10
    level: leaders
    url: https://hansard.parliament.uk/Commons/2025-07-11/debates/25071123000007/LancasterHouse20
    restated: >
      Builds on the 2010 Lancaster House Treaties (defence cooperation and the
      Teutates nuclear stockpile stewardship treaty). The Nuclear Steering Group
      first met in Paris on 10 December 2025.
  status: active
  tags:
    Nuclear coordination: The Northwood Declaration's central commitment, and the reason the 2025 package is a step change over 2010.
    Deep strike: >
      Joint development of the Future Cruise/Anti-Ship Weapon and the wider
      2025 munitions and industrial-resilience agenda.
  notes: >
    Both tags trace directly to signed text. The only thing arguably missing is
    the Combined Joint Expeditionary Force, which is the 2010 treaties' surviving
    deliverable rather than part of the 2025 refresh.

b9:
  name: Bucharest Nine
  members: [BG, CZ, EE, HU, LV, LT, PL, RO, SK]
  goal: >
    Speak with one voice inside NATO for a permanently reinforced eastern flank
    — allied forward presence, higher national defence spending, and treatment
    of the Baltic-to-Black-Sea line as a single theatre.
  agreed:
    instrument: >
      Joint declaration of the first B9 summit in Bucharest, convened on the
      initiative of the Romanian and Polish presidents.
    date: 2015-11-04
    level: heads of state
    url: https://www.gmfus.org/news/bucharest-nine-enhancing-security-natos-eastern-flank
    restated: >
      B9 summit declaration of 22 February 2023 (with the US President and NATO
      Secretary General present), condemning the invasion of Ukraine and calling
      for enhanced NATO presence on the eastern flank.
  status: active
  tags:
    NATO eastern flank: The format's defining and only real subject.
    Deterrence: Forward presence, force posture and spending targets — the substance of every B9 declaration.
  notes: >
    Both tags correct. B9 is a caucus for lobbying inside another organisation
    rather than a format that acts, which is worth keeping in mind when a
    tracker starts scoring how "aligned" its members are.

nb8:
  name: Nordic-Baltic Eight
  members: [DK, FI, "NO", SE, IS, EE, LV, LT]
  goal: >
    Keep eight small northern European states aligned across the whole span of
    foreign, security and civil policy through continuous consultation, so they
    arrive at EU, NATO and UN tables with a settled common line.
  agreed:
    instrument: >
      No founding treaty. The format began as "5+3" in 1992 after the first
      Nordic-Baltic foreign ministers' meeting (Copenhagen, December 1990), and
      was renamed NB8 by foreign ministers on 30 August 2000.
    date: 1992
    level: foreign ministers
    url: https://vm.ee/en/NB8
    restated: >
      The NB8 Wise Men Report (Birkavs-Gade), August 2010 — 38 recommendations
      across foreign policy dialogue, civil and cyber security, defence and
      energy, approved at the ministerial of 26-27 August 2011. This is the
      closest thing NB8 has to an agreed work programme.
      https://www.stjornarradid.is/media/utanrikisraduneyti-media/media/skyrslur/nb8-wise-men-report.pdf
  status: active
  tags:
    Foreign policy coordination: The Birkavs-Gade report's first recommendation area, and the format's actual product.
    Ukraine support: >
      The NB8 states have coordinated the highest per-GDP support levels in
      Europe and issue joint statements as a bloc.
    Regional security: >
      Defence and civil/cyber security are named Birkavs-Gade areas; Baltic Sea
      security is the live application.
  notes: >
    The old "Security" tag was too vague to mean anything. NB8's honest
    distinguishing feature is that the coordination *is* the goal — it has no
    single substantive objective, which makes it the hardest format on this page
    to score for convergence.

three_seas:
  name: Three Seas Initiative
  members: [EE, LV, LT, PL, CZ, SK, HU, SI, AT, HR, RO, GR, BG]
  goal: >
    Close the north-south infrastructure gap between the Baltic, Adriatic and
    Black Seas — cross-border energy, transport and digital connections — to
    complete the single market in the EU's eastern half.
  agreed:
    instrument: >
      Dubrovnik Joint Statement, adopted at the founding summit by twelve EU
      member states.
    date: 2016-08-25
    level: heads of state
    url: https://3si.politic.edu.pl/summit-in-dubrovnik/
    restated: >
      Tenth-anniversary summit, Warsaw, 28-29 April 2025: Türkiye and Spain
      admitted as strategic partners, Albania and Montenegro as associated
      participating states.
  status: active
  tags:
    Energy: Named pillar in the Dubrovnik Joint Statement.
    Transport: Named pillar in the Dubrovnik Joint Statement.
    Digital infrastructure: Named pillar in the Dubrovnik Joint Statement.
  notes: >
    The best-matched card on the page — the three tags are verbatim the three
    founding pillars. Worth noting the 2025 Warsaw summit split over language
    condemning Russia, which is exactly the kind of divergence this tracker
    would want to surface.

i2u2:
  name: I2U2
  members: [IN, IL, AE, US]
  goal: >
    Mobilise private capital and the four states' technology bases into joint
    infrastructure projects — water, energy, transport, space, health and food
    security — across India and the Middle East.
  agreed:
    instrument: Joint statement of the leaders of India, Israel, the UAE and the United States, first I2U2 leaders' meeting (virtual).
    date: 2022-07-14
    level: leaders
    url: https://ae.usembassy.gov/joint-statement-of-the-leaders-of-india-israel-united-arab-emirates-and-the-united-states-i2u2/
  status: dormant
  tags:
    Food security: >
      Named in the founding statement — the UAE's $2bn integrated food parks
      programme in India.
    Clean energy: Named in the founding statement — the 300 MW hybrid renewables project in Gujarat.
    Water: Named in the founding statement's list of focus areas.
  notes: >
    Tags are accurate to the founding text, which is unusually specific for a
    minilateral. The problem is delivery, not definition: the flagship projects
    have not moved since 2023 and there has been no leaders' meeting since the
    first. Card blurb already says so.

negev_forum:
  name: Negev Forum
  members: [IL, US, AE, BH, EG, MA]
  goal: >
    Turn the Abraham Accords into a standing regional architecture — six
    permanent working groups delivering joint projects in security, energy,
    food and water, health, education and tourism.
  agreed:
    instrument: >
      Negev Summit, Sde Boker (27-28 March 2022), where the six agreed to make
      the meeting a permanent process; structure set by the Negev Forum Steering
      Committee joint statement of 27 June 2022, which established the six
      working groups.
    date: 2022-06-27
    level: foreign ministers
    url: https://2021-2025.state.gov/negev-forum-steering-committee-joint-statement/
  status: suspended
  tags:
    Regional security: One of the six chartered working groups.
    Regional integration: >
      The Steering Committee's own statement of purpose — "initiatives that
      encourage regional integration, cooperation and development".
    Clean energy: One of the six chartered working groups.
  notes: >
    "Abraham Accords" was dropped as a tag. The Accords are the Forum's
    precondition and political frame, not an objective the Forum pursues — the
    Forum's objectives are its six working groups. Ministerial-level meetings
    have been suspended since the Gaza war; working-level contact continues.

imec:
  name: IMEC
  members: [IN, US, FR, DE, IT, SA, AE]
  goal: >
    Build a ship-to-rail trade corridor from India through the Gulf to Europe,
    with an electricity interconnector, clean hydrogen pipeline and data cable
    laid along the same route.
  agreed:
    instrument: >
      Memorandum of Understanding on the India-Middle East-Europe Economic
      Corridor, signed on the margins of the G20 Summit in New Delhi by India,
      the US, the UAE, Saudi Arabia, France, Germany, Italy and the EU.
    date: 2023-09-09
    level: leaders
    url: https://www.imec.international/about/
  status: intermittent
  tags:
    Connectivity: The corridor itself — the MoU's entire subject.
    Rail & ports: The named physical components of the MoU's two corridors.
    Energy & data cables: >
      Explicitly in the MoU: an electricity cable, a clean hydrogen pipeline and
      a data cable alongside the rail link.
  notes: >
    "BRI alternative" was dropped. It is the standard analytical framing of IMEC
    and it is probably true, but the MoU does not mention the Belt and Road and
    no signatory has stated it as an objective — it is commentary about the
    format, not a goal of it. Keeping it would have set the precedent that a
    card tag can be something no member has ever agreed to.

india_france_uae:
  name: India–France–UAE Trilateral
  members: [IN, FR, AE]
  goal: >
    Run joint projects in energy (solar and nuclear), defence industry, and
    climate and biodiversity protection, with the Indian Ocean region as the
    shared area of interest.
  agreed:
    instrument: >
      Joint statement of the governments of India, France and the UAE
      establishing the trilateral cooperation initiative, issued after a
      foreign ministers' phone call, together with an implementation roadmap.
    date: 2023-02-04
    level: foreign ministers
    url: https://www.mofa.gov.ae/en/mediahub/news/2023/2/5/05-02-2023-uae-cooperation
  status: intermittent
  tags:
    Indian Ocean: >
      Named in the founding statement as the focus region, including possible
      work with the Indian Ocean Rim Association.
    Defence: Named in the founding statement — joint production of military hardware.
    Energy: Named in the founding statement — solar and nuclear energy.
  notes: >
    All three tags trace to the founding joint statement. One thing to check
    before this card goes live: the blurb's claim of "an AI and space roadmap
    agreed in 2025" is not confirmed by the sources consulted here — the
    verified roadmap is the February 2023 one, subsequently reviewed at
    focal-points level.

aes:
  name: Alliance of Sahel States
  members: [ML, BF, NE]
  goal: >
    Mutual defence between three juntas — an attack on one treated as an attack
    on all — deepening into a confederation with a joint military force and
    shared economic institutions, outside ECOWAS and outside Western security
    arrangements.
  agreed:
    instrument: >
      Charter of Liptako-Gourma establishing the Alliance of Sahel States.
      Article VI makes any violation of one member's sovereignty an aggression
      against all, triggering a duty of assistance including armed force.
    date: 2023-09-16
    level: heads of state
    url: https://maliembassy.us/wp-content/uploads/2023/09/LIPTAKO-GOURMA-Engl___-2.pdf
    restated: >
      Treaty establishing the Confederation of Sahel States, adopted at the
      first AES summit in Niamey on 6 July 2024; the three formally left ECOWAS
      in January 2025 and stood up a 5,000-strong joint force.
  status: active
  tags:
    Collective defence: Article VI of the Liptako-Gourma Charter — the alliance's founding commitment.
    Joint military force: Agreed under the 2024 confederation treaty and activated in 2025.
    Confederation: The stated trajectory in the 2024 Niamey treaty — political, economic and monetary integration.
  notes: >
    "Sovereigntism" was dropped. It is an accurate label for the AES's ideology
    and the reason it exists, but it is not an objective stated in either
    instrument, and an -ism is not something the tracker could ever score a
    statement against. The concrete agreed goals — mutual defence, a joint
    force, confederation — are.

pacific_alliance:
  name: Pacific Alliance
  members: [CL, CO, MX, PE]
  goal: >
    Build an area of deep integration between the four economies — free
    movement of goods, services, capital and people — and project them
    collectively into the Asia-Pacific.
  agreed:
    instrument: >
      Declaration of Lima, establishing the Pacific Alliance, followed by the
      Framework Agreement signed at the fourth summit in Antofagasta on
      6 June 2012, which gave it legal and institutional form.
    date: 2011-04-28
    level: heads of state
    url: https://alianzapacifico.net/en/
  status: intermittent
  tags:
    Trade integration: The Lima Declaration's core objective, delivered via the 2016 Commercial Protocol.
    Free movement: >
      The Lima Declaration's own formulation — free flow of goods, services,
      capital *and persons*, which is what distinguishes it from a trade pact.
    Asia-Pacific links: The founding rationale for the bloc's westward orientation.
  notes: >
    "Trade" was expanded to "Trade integration" and "Free movement" added,
    because free movement of people is the founding text's distinctive claim and
    the card was underselling it. The bloc's summit cadence has been disrupted
    since the 2022-23 Mexico-Peru presidency dispute; Mexico holds the 2026
    pro tempore presidency.

mekong_lancang:
  name: Mekong-Lancang Cooperation
  members: [CN, KH, LA, MM, TH, VN]
  goal: >
    Bind the five downstream Mekong states to China through cooperation on
    shared water resources, connectivity and cross-border economic development,
    under the banner of a "community of shared future" for the basin.
  agreed:
    instrument: >
      Sanya Declaration of the first Lancang-Mekong Cooperation Leaders'
      Meeting — three pillars (political and security; economic and sustainable
      development; social and people-to-people) and five priority areas
      (connectivity, production capacity, cross-border economic cooperation,
      water resources, agriculture and poverty reduction).
    date: 2016-03-23
    level: leaders
    url: https://www.fmprc.gov.cn/eng/gjhdq_665435/2675_665437/2727_663458/2728_663460/202406/t20240607_11410269.html
    restated: >
      Five-Year Plan of Action on Lancang-Mekong Cooperation (2023-2027), with
      separate action frameworks for water resources, environment and poverty
      reduction.
  status: active
  tags:
    Water resources: One of the five Sanya priority areas; the LMC Water Resources Cooperation Centre is its institutional expression.
    Connectivity: One of the five Sanya priority areas.
    Law enforcement: >
      Falls under the Sanya "political and security" pillar and the joint
      Mekong law-enforcement mechanism, but is *not* one of the five founding
      priority areas — the tag reflects current prominence (river patrols,
      scam-compound operations), not founding intent.
  notes: >
    Tag renamed from "Water management" to "Water resources" to match the
    declaration's own term. This is the only card here for a format built by a
    great power around its own neighbours, so "goal" and "stated goal" diverge
    more than elsewhere — the tracker should read the joint communiqués as
    Beijing's agenda plus five signatures, not a negotiated common position.

china_pakistan_afghanistan:
  name: China–Pakistan–Afghanistan Trilateral
  members: [CN, PK, AF]
  goal: >
    Contain cross-border militancy through joint counterterrorism and law
    enforcement, and extend the China-Pakistan Economic Corridor into
    Afghanistan to bind it into regional trade.
  agreed:
    instrument: >
      Trilateral foreign ministers' dialogue, established in Beijing in December
      2017, suspended after 2021 and resumed in 2022. Goals are set in the
      dialogue's joint statements rather than a founding charter.
    date: 2017-12-26
    level: foreign ministers
    url: https://www.fmprc.gov.cn/mfa_eng/wjbzhd/202508/t20250822_11694221.html
    restated: >
      Sixth trilateral foreign ministers' dialogue, Kabul, 20 August 2025 —
      agreed to extend CPEC into Afghanistan and to deepen counterterrorism,
      law-enforcement and counter-narcotics cooperation.
  status: active
  tags:
    Counterterrorism: Named in the 2025 Kabul joint statement and every prior dialogue readout.
    CPEC extension: The concrete agreed deliverable of the August 2025 dialogue.
  notes: >
    Both tags correct. The format's difficulty is that its two members other
    than China are in periodic armed confrontation with each other, so joint
    statements overstate the degree of actual agreement — useful context for a
    convergence score.

csc:
  name: Colombo Security Conclave
  members: [IN, LK, MV, MU, BD]
  goal: >
    Coordinate Indian Ocean security across five agreed pillars — maritime
    safety and security, counter-terrorism and radicalisation, trafficking and
    transnational organised crime, cyber security and critical infrastructure,
    and humanitarian assistance and disaster relief.
  agreed:
    instrument: >
      CSC Charter and MoU establishing the permanent Secretariat, signed in
      Colombo. The format began as the India-Sri Lanka-Maldives NSA trilateral
      on maritime security (2011), was relaunched as the CSC in 2020, and added
      Mauritius (2022) and Bangladesh (2024).
    date: 2024-08-30
    level: national security advisers
    url: https://www.hcicolombo.gov.in/section/press-releases/colombo-security-conclave-founding-documents-signed/
  status: active
  tags:
    Maritime security: Charter pillar one.
    Counter-terrorism: Charter pillar two.
    HADR: Charter pillar five.
  notes: >
    Tags are three of the five chartered pillars — accurate, if a partial view.
    Unusually for this page, the CSC has a written charter and a standing
    secretariat, so its goals are the least ambiguous of any placeholder here.

mikta:
  name: MIKTA
  members: [MX, ID, KR, TR, AU]
  goal: >
    Give five cross-regional middle powers a standing channel to coordinate
    positions in the G20, the UN and other multilateral bodies, and to defend
    the multilateral system itself.
  agreed:
    instrument: >
      Inaugural foreign ministers' meeting on the margins of the 68th UN General
      Assembly, New York, which launched MIKTA as an informal cross-regional
      consultative mechanism. A vision statement and seven priority themes
      followed.
    date: 2013-09-25
    level: foreign ministers
    url: https://www.cfr.org/articles/mikta-middle-little-known-multilateral-group-turns-five
  status: active
  tags:
    Global governance: The founding purpose — supporting effective global governance.
    Multilateral reform: >
      Recurrent in MIKTA joint statements; the group's substantive contribution
      is procedural rather than regional.
  notes: >
    "Middle powers" was dropped as a tag. It describes who the members are, not
    what they have agreed to do — and if member identity were a legitimate tag,
    every card would carry one. MIKTA has a real vision statement but the
    thinnest substantive agenda on this page: its members share a size category,
    not an interest.

chip4:
  name: Chip 4 / Fab 4
  members: [US, JP, KR, TW]
  goal: >
    Proposed, not agreed — a US-initiated coordination group on semiconductor
    supply-chain resilience: diversifying fabrication geography, protecting IP,
    and aligning export controls toward China.
  agreed:
    instrument: >
      None. Proposed by the US administration in March 2022; the only realised
      body is the US-East Asia Semiconductor Supply Chain Resilience Working
      Group, whose first (virtual) meeting the American Institute in Taiwan
      hosted on 28 September 2022. No joint statement, charter or agreed
      objectives have ever been published by the four.
    date: 2022-03
    level: officials
    url: https://globaltaiwan.org/2022/11/challenges-and-opportunities-for-the-chip-4-group/
  status: aspirational
  tags:
    Semiconductors: The subject of the US proposal.
    Supply chains: The stated rationale of the working group that did convene.
  notes: >
    The one entry on this page that fails the test this file was written to
    apply: there is no agreed goal, because there is no agreed anything. Seoul
    has never accepted the export-control alignment that is the proposal's
    point. The tags are not wrong so much as attributed to a format that does
    not exist yet — worth deciding whether it belongs on the hub at all, or
    belongs there labelled as a proposal rather than as a grouping awaiting a
    tracker.
