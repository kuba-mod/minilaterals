  positions:
    ukraine: Germany pledges continued military, financial, and industrial support
      for Ukraine's sovereignty and territorial integrity until a just peace is achieved.
    defence: Germany aims to strengthen the European pillar of NATO and increase European
      autonomy in defense through a 360-degree approach and industrial cooperation.
    hybrid: Germany commits to developing robust countermeasures and a coordinated
      European response to protect democratic institutions from Russian hybrid activities
      and disinformation.
    enlargement: Germany supports a rigorous and performance-based EU enlargement
      process for Ukraine, Moldova, and the Western Balkans.
    green_transition: Germany advocates for an ambitious energy and climate policy
      that implements international agreements and strengthens resilience against
      climate change.
    energy: Germany seeks to ensure secure, diversified, and affordable energy supplies
      through a just energy transition.
    iran: Germany emphasizes the necessity of ensuring Iran does not acquire nuclear
      weapons and ceases its hostile activities in the region.
