title: Change of His Majesty’s Ambassador to Mali
text: Ms Catherine Mary Inglehearn OBE has been appointed His Majesty’s Ambassador
  to the Republic of Mali in succession to Mr Angus Philip McKee OBE, who will be
  transferring to another Diplomatic Service appointment.
