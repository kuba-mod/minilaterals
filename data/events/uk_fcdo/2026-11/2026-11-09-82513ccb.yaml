title: Change of His Majesty’s Ambassador to Chad
text: Ms Fiona Blyth MBE has been appointed His Majesty’s Ambassador to the Republic
  of Chad in succession to Ms Helena Owen, who will be leaving the Diplomatic Service.
  Ms Blyth will take up her appointment during December 2026.
