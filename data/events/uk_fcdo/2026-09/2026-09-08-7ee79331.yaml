title: UK Summons Serbian Chargé d'Affaires to the United Kingdom
text: The Foreign, Commonwealth and Development Office has today summoned the Serbian
  Chargé d'Affaires to condemn commemorations surrounding the funeral of convicted
  war criminal Ratko Mladić.
