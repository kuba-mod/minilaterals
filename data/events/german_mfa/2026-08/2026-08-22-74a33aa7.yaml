title: Beauftragter der Bundesregierung für Religions- und Weltanschauungsfreiheit
  MdB Thomas Rachel zum Internationalen Tag des Gedenkens an die Opfer von Gewalthandlungen
  aufgrund der Religion oder der Weltanschauung
text: 'Zum Internationalen Tag des Gedenkens an die Opfer von Gewalthandlungen aufgrund
  der Religion oder der Weltanschauung erklärte MdB Thomas Rachel, Beauftragter der
  Bundesregierung für Religions- und Weltanschauungsfreiheit, heute (22.08.2026):
  Alle Menschen auf der ganzen Welt haben ein unteilbares Recht auf Religions- und
  Weltanschauungsfreiheit. Dies wird ihnen nach dem Völkerrecht garantiert. In Deutschland
  ist dieses Recht zudem auch im Grundgesetz verankert. Dennoch haben wir in allen
  Weltregionen immer wieder Opfer von Gewalthandlungen aufgrund der Religion oder
  Weltanschauung zu beklagen. Die besorgniserregende Zahl solcher Gewalttaten in der
  Welt hat nicht zuletzt auch mit der global wachsenden Anzahl gewaltsamer Konflikte
  und der steigenden politischen Instabilität zu tun. Oft sind es nichtstaatliche
  Akteure oder Terrororganisationen, die Gewalttaten gegen religiöse oder weltanschauliche
  Minderheiten verüben, um dadurch ihre eigenen Interessen zu befördern. Aber auch
  Machenschaften autoritärer Regime sowie populistische Hetze und Desinformation führen
  weltweit immer wieder zu Gewalt gegen Andersgläubige oder Menschen, die keiner bestimmten
  Religion angehören wollen. Heute zum Internationalen Tag gedenken wir in tiefer
  Betroffenheit gemeinsam der Opfer solcher Gewalttaten. Als Beauftragter der Bundesregierung
  für Religions- und Weltanschauungsfreiheit hatte ich in Deutschland und auf internationalen
  Reisen die Gelegenheit, unmittelbar mit Betroffenen von Gewaltanwendungen sowie
  den Angehörigen zu sprechen. Meine Entschlossenheit möchte ich ausdrücklich bekräftigen,
  weiterhin kompromisslos für das universelle und unteilbare Menschenrecht auf Religions-
  und Weltanschauungsfreiheit einzutreten. Lassen Sie uns in der Verteidigung dieses
  Rechts solidarisch zusammenstehen und auch diejenigen aktiv schützen, die ihre Religion
  verlassen oder wechseln wollen, oder auch nur bestimmte Glaubensvorschriften anzweifeln
  und deswegen zur Zielscheibe von Diskriminierung, Hassrede oder gar physischer Gewalt
  werden.'
