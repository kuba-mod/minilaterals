date: '2026-08-19'
type: press_release
source_name: german_mfa
title: Rede von Außenminister Johann Wadephul im Rahmen der Schweizer Botschafterkonferenz
  in Bern
text: 'Das sagt man im Norden Deutschlands und ich versuche, es ähnlich populär zu
  machen wie das „Grüezi“. Es gelingt mir noch nicht ganz und ich hoffe, dass mein
  jetziges Amt mir dabei hilft, das auch international mehr umzusetzen. Vielen herzlichen
  Dank für die sehr freundliche Einladung. Als Herr Bundesrat Cassis und ich uns das
  letzte Mal trafen, war das in Berlin, Anfang Juni. Da haben wir mit einer gewissen
  Anspannung, ich jedenfalls – Dir hat lieber Ignazio, hat man das natürlich nicht
  angemerkt, da haben wir auf die Schweizer Innenpolitik geblickt. Die 10-Millionen-Initiative
  ist ja nun, wie es sich für die Schweiz gehört, entschieden worden. Und ehrlich
  gesagt glaube ich, viele in Deutschland atmen ein bisschen auf. Denn, das ist ja
  schon angesprochen worden: die Schweiz ist für die Deutschen mehr als nur eine schöne
  Bergkulisse: Sie ist für viele eine zweite Heimat geworden. Der Austausch zwischen
  unseren Ländern ist eng und intensiv. Das hätte sicherlich mit dem Erfolg der Initiative
  ein bisschen anders ausgesehen. Das hätte uns nie entzweit, dafür sind wir viel
  zu eng verflochten miteinander. Aber es hätte den Charakter unserer Beziehungen
  als Nachbarländer verändert. Und so bin ich sehr dankbar, dass die Schweizer Bürgerinnen
  und Bürger das anscheinend auch so gesehen haben. Aber was ich sagen möchte: Der
  Kernsatz, den Du, lieber Ignazio, hier wiederholt hast, ist auch der, der hier direkt
  auf der zweiten Seite meiner Rede steht: Innenpolitik ist Außenpolitik und Außenpolitik
  ist Innenpolitik. Das gilt für Deutschland und das gilt für fast alle Länder der
  Welt. Die Verknüpfung zwischen Innen- und Außenpolitik wird immer enger und darauf
  müssen wir auch als Außenpolitiker miteinander reagieren. Sie wird nämlich sehr
  viel deutlicher in diesen Zeiten der Anspannung, der Krise. Und an Krisen mangelt
  es ja nicht. Wir spüren ihre Auswirkungen ganz konkret tagtäglich in unserem Leben.
  Es ist aber gar nicht so einfach, die Verbindung herzustellen zwischen den Bildern
  einer fernen Krise und den Auswirkungen in unserem Alltag. Die Wirkzusammenhänge
  sind komplex. Dabei aber rasend schnell geworden, wie das sicherlich vor einigen
  Jahrzehnten noch nicht der Fall gewesen ist. Ich habe neulich mal gesagt: „Raketen,
  die wir nicht sehen, verändern den Sprit, den wir tanken“. Das gilt ja nicht nur
  für den Preis, sondern für die Substanz des Treibstoffs. Wussten Sie eigentlich,
  dass die Europäische Union im zurückliegenden Juni 25% ihres Kerosinbedarfs mit
  Angeboten aus Nigeria deckte? Als Ersatz für denjenigen Treibstoff, der wir normalerweise
  aus anderen Regionen, insbesondere aus der Golfregion, bezogen hätten. Das zeigt
  die Notwendigkeit unserer Diversifizierung. Ich glaube, das müssen wir in jeder
  Hinsicht. Was die wirtschaftlichen Abhängigkeiten angeht, was die Vulnerabilitäten
  angeht. Definitiv, was Märkte angeht, aber auch, was Bezugsquellen angeht. Diversifizieren
  ist eine der Konsequenzen, die wir gezogen haben. Dass wir verletzlicher sind, dass
  wir vulnerabler sind, das ist ein offenes Geheimnis. Es hätte dafür COVID-19 nicht
  gebraucht, die „EVERGIVEN“ im Suezkanal, der andauernde russische Völkerrechtsbruch
  in der Ukraine, die Disruptionen in der Handelspolitik, Auswirkungen von Extremwetterereignissen
  auf Transportwege und Lieferketten. Seit mehreren Jahren ist unsere Weltwirtschaft,
  die als globales Netzwerk hochsensibel auf Veränderungen reagiert, permanenten Erschütterungen
  ausgesetzt. Wir reagieren durch Diversifizierung unserer Wirtschaftsbeziehungen.
  Sie haben erlebt, dass die Europäische Union Freihandelsabkommen mit anderen Regionen
  in einer Geschwindigkeit abgeschlossen hat, die es vorher nicht gegeben hat. Mercosur
  ist ein Beispiel. Indien ein anderes. Neue Bezugsquellen, neue Absatzmärkte und
  dadurch höhere wirtschaftliche Resilienz, das sind einige der Wege, die wir gehen.
  Auf der anderen Seite konsolidieren wir das, was wir an verlässlichen Partnerschaften
  haben. Festigungen unserer Partnerschaften weltweit. Das gilt für unsere bilateralen
  Verhältnisse. Deswegen bin ich hier in der Schweiz. Das gilt natürlich auch für
  die Bündnisse, ich werde gleich etwas dazu sagen. Unsere Außenpolitik hat zunächst
  den Anspruch, in der Welt nach Lösungen für unsere eigenen, inneren Herausforderungen
  zu suchen. Die sind nämlich enorm: Die Wirtschaftslage ist angespannt, der technologische
  Fortschritt transformiert die Verfasstheit unseres Staates sehenden Auges, der Klimawandel
  verändert die Art und Weise, wie wir leben und die nicht immer einfache Energiewende
  strapaziert sowohl ihre Befürworter als auch ihre Gegner. Was das bedeutet, das
  sehen wir überall – auch in Europa. Das alles fordert Innovation und Zusammenarbeit.
  Und die Bereitschaft, auch von anderen zu lernen. In so einer Lage durch die Welt
  zu reisen und dann noch die Menschen belehren zu wollen, das schien mir dann doch
  etwas aus der Zeit gefallen zu sein. Deswegen versuche ich nicht, alle Auslandsreisen
  mit erhobenem Zeigefinger, sondern mit einer Wirtschaftsdelegation durchzuführen.
  Die sich dann vor Ort mit Politikern und Unternehmern vernetzt und neue Kooperationen
  anbahnt. Davon profitieren die Unternehmen, die Wirtschaft und am Ende die Menschen
  in den jeweiligen Ländern. Kooperationsmöglichkeiten finden sich nämlich fast überall,
  wenn wir bereit sind, pragmatisch und mit Respekt auf die Partner zuzugehen. Gerade
  erst war ich zu Gast in Mauretanien, Nigeria und Südafrika. Länder, mit denen wir
  bestimmt nicht immer sofort einer Meinung sind, beispielsweise mit Blick auf die
  deutsche Israel-Politik. Aber gerade in Südafrika, das sehr selbstbewusst auch auf
  der multilateralen Bühne agiert, standen unsere gemeinsamen Herausforderungen im
  Vordergrund, und die Aspekte in unserer internationalen Politik, die uns vereinen.
  Ebenso wie unsere beiden Länder sieht Südafrika das Völkerrecht nämlich nicht als
  eine freundliche Empfehlung der Vergangenheit, sondern als Richtschnur für internationale
  Politik. Dem kann ich nur zustimmen. Und das möchte ich auch gerade in diesen Stunden
  sagen, wo ein wichtiger Gerichtshof auf internationaler Bühne sich Kritik und auch
  Angriffen gegenübersieht. Ich möchte jedenfalls für die Bundesregierung klären,
  dass wir hinter dem internationalen Strafgerichtshof und allen Richterinnen und
  Richtern stehen und fest davon überzeugt sind, dass sie eine wertvolle Arbeit machen,
  um für mehr Frieden und mehr Gerechtigkeit in unserer Welt zu sorgen. Ich muss auch
  die wirtschaftlichen Interessen oder die unseres Bündnissystems einbeziehen in meine
  außenpolitische Betrachtung. Dafür bauen wir neue Partnerschaften weltweit auf.
  Wir festigen Bündnisse, die unsere Freiheit, unsere Sicherheit und unseren Wohlstand
  in Deutschland und Europa sichern: Das sind klassischerweise die NATO und insbesondere
  die Europäische Union. Ich versuche daher, in der Welt nicht nur als deutscher,
  sondern auch als einer der EU -Außenminister aufzutreten. Viele Länder und Regionen,
  ich denke da an die schon erwähnten Mercosur Staaten und Indien, aber ich könnte
  auch Australien hinzufügen, suchen Zugang zum EU -Binnenmarkt. Dadurch gewinnen
  wir unsererseits Zugang zu interessanten Märkten und Rohstoffquellen. Zugleich macht
  es uns in der Zollpolitik unabhängiger, weil es uns die Möglichkeit gibt, zusammen
  wirkungsvoll zu reagieren. Also: Deutsche Außenpolitik ist auf, ich nannte es vorhin:
  Konsolidierung, vielleicht jetzt noch etwas klarer: Sie ist auf die Festigung und
  die Stärkung der Europäischen Union gerichtet. Mir ist dabei bewusst, dass das Schweizer
  Verhältnis zur durchaus EU zwiegespalten ist. Viele möchten in Brüssel den Bürokratiemoloch
  sehen – einige bei uns ja auch -, dessen Kommissare mit Klemmbrett und Maßband den
  Alltag der Bürgerinnen und Bürger verregulieren. Und ich gebe zu: Manche Politikfelder
  wurden in guter theoretischer Absicht in der Praxis stark verkompliziert. Aber sehen
  wir nicht gerade in den aktuellen unruhigen Zeiten den Mehrwert, den ein Bündnis
  vieler Staaten ausmacht? Der gemeinsame Binnenmarkt ist ein Wachstums- und Innovationstreiber.
  Die EU kann als Sprachrohr Vieler, durch die gebündelte Marktmacht mit den USA ,
  anders verhandeln als Einzelne. Sie wird den Auswirkungen aggressiver chinesischer
  Wirtschaftspolitik die Stirn bieten. Und sie hält fest zusammen gegenüber einem
  imperialistischen Russland. Ich glaube, hier sind wir in unseren Interessen auch
  mit der Schweiz vereint und ich werbe ganz offen und voller Überzeugung dafür, dass
  wir weiter auf eine enge Partnerschaft setzen. Meine Überzeugung ist, dass unser
  Zusammenhalt in Europa über den Kreis der EU -Mitgliedsstaaten hinausgeht. Davon
  profitiert auch die Schweiz. Gemeinsam können wir die gesamteuropäische Wettbewerbsfähigkeit
  stärken. Deutschland steht bereit, um mit der Schweiz an unseren gemeinsamen europäischen
  Interessen zu arbeiten. Deutschlands Hand ist dafür immer ausgestreckt, und meine
  Tür steht Ihnen immer offen! Ein anderes Thema ist unsere Sicherheit. Da setzen
  wir selbstverständlich auf die NATO . Die wir ja massiv stärken. Sie haben das verfolgt.
  Das 5%-Ziel werden wir noch deutlich vor der Zeit erreichen. Deutschland hat hier
  lange gezögert, wir sind zurück, wir sind jetzt Frontrunner dabei, die Verteidigungsfähigkeit
  für das Land und das Bündnis zu erreichen. Zudem haben wir auf dem Gipfel in Ankara
  – die europäischen NATO -Alliierten und Kanada – uns geeinigt, gemeinsam die Ukraine
  mit militärischer Unterstützung im Umfang von mindestens 70 Milliarden Euro jeweils
  in diesem und im nächsten Jahr zu unterstützen. Wir wissen, dass wir der Ukraine
  Unterstützung schon aus Gründen der Selbstachtung schulden, weil wir das Völkerrecht
  verteidigen. Aber auch, weil wir wissen, was ein „Obsiegen“ Russlands politisch
  und wirtschaftlich für den ganzen Kontinent bedeuten würde. Deshalb appelliere ich
  überall in Europa für eine klare Haltung, eine Haltung an der Seite der Ukraine,
  natürlich auch hier in der Schweiz. In der Sicherheit setzen wir aber natürlich
  auch auf die transatlantische Solidarität. Die wird von so manchem internationalen
  Beobachter gerne schlechtgeschrieben, und ja, einige Äußerungen aus Washington führen
  auch in Berlin zu Stirnrunzeln. Ich sage aber in aller Deutlichkeit, und nach dem
  Gipfel in Ankara: Wir haben keinen Grund, an der Verlässlichkeit unserer amerikanischen
  Bündnispartner zu zweifeln. Wichtig ist dafür vor allem, dass wir in Europa die
  Verantwortung für die Sicherheit auf unserem Kontinent stärker übernehmen. Ich las
  dazu auf dem Hinflug einen interessanten Artikel, weil Sicherheit ja nicht nur auf
  klassische militärische Sicherheit zu reduzieren ist. Dieser Artikel von einem Schweizer
  Journalisten von Anfang Mai trug die Überschrift: „Die Alpen sind Europas Straße
  von Hormuz“. In seinem Artikel beschreibt er die strategische Rolle der Alpenländer
  und insbesondere der Schweiz im europäischen Sicherheitsgefüge. Wir schauen ja in
  unseren Analysen und Assessments gerne auf die Frontlinien in der Ukraine oder die
  Bedrohungslage entlang der NATO -Ostflanke. Wirklich vulnerabel sind wir aber dort,
  wo die grundlegende Versorgung unserer Bevölkerung in Frage gestellt wird. Wo Russland
  und andere feindlich gesinnte Akteure hybrid gegen unsere Interessen vorgehen. Hier
  im Alpenraum verlaufen strategische Versorgungsrouten im Bereich der Energie, des
  Verkehrs, der Daten. Und ganz basal: des Wassers, wenn ich nur auf den Rhein schaue.
  Die Sicherheit der Schweiz ist deshalb von herausragender Bedeutung für die umliegenden
  Länder. Erweitern wir das klassische Sicherheitsverständnis, dann zeigt sich, dass
  die Schweiz trotz der geografischen Vorteile genauso vulnerabel ist, wie jeder andere
  Frontstaat. Der Cyberangriff auf Liechtenstein vor wenigen Wochen hat gezeigt, dass
  auch ein Staat, der neutral und bündnisfrei agiert, Ziel eines Angriffs werden kann.
  Auch die Schweiz musste diese Erfahrungen jüngst machen, wenn auch in einem ganz
  anderen, kleineren Maßstab. Ich ziehe für mich daraus den Schluss, dass Neutralität
  alleine kein Garant für ein unbehelligtes Dasein ist. Sie kann Wehrhaftigkeit nicht
  ersetzen. Aber wem sage ich das. Die aktuelle Debatte dazu in der Schweiz verfolgen
  wir natürlich mit besonderem Interesse, und für mich ist es bemerkenswert zu sehen,
  in welcher Qualität diese Debatte geführt wird. Ich habe mir die Argumente beider
  Seiten genau angesehen. Denn auch der Ausgang dieses inneren Schweizer Disputs wird
  Auswirkungen haben auf den Charakter unserer Beziehung zueinander. „Sag, wie hältst
  du es mit der Neutralität?“, so könnte dieser Tage die Gretchenfrage der Schweizerinnen
  und Schweizer lauten. Ich persönlich stehe der weltoffenen Schweiz als festen Teil
  Europas und ihrem Wesen der Neutralität mit größtem Respekt gegenüber. Ich glaube,
  das gilt für praktisch alle Deutschen. Und wir dürfen nicht außer Acht lassen, und
  ich weiß das, wir wissen das, dass die Schweizer Neutralität uns in der Welt der
  Diplomatie immer wieder große Dienste erwiesen hat und weiterhin wird. Weil sie
  flexibel und pragmatisch gelebt, und in großer Transparenz und Aufrichtigkeit diskutiert
  und erklärt wurde. Die Schweizer Neutralität wurde oft zum Wohle der internationalen
  Gemeinschaft eingesetzt. Die Frage der Neutralität ist in meinen Augen auch eine
  Frage der politischen Glaubwürdigkeit. Vor den eigenen Bürgerinnen und Bürgern,
  aber auch vor den Partnern, Freunden und Nachbarn im Ausland. Ich glaube, Neutralität
  sollte nicht aus einer Schwäche und Angst heraus argumentieren und sich aus Kriegsbeschwörungen
  ableiten. Das tun sie auch nicht. Am Ende muss sie die Frage beantworten, wie sie
  die Verantwortung für die wirtschaftlichen und politischen Verflechtungen übernehmen
  möchte, die ihr Überleben sichern. Bei aller Freundschaft, Vertrautheit und Kooperation
  zwischen unseren Ländern müssen wir eben anerkennen, dass wir in einem geopolitischen
  Umfeld agieren, das rauer und feindseliger geworden ist. Ich bin davon überzeugt,
  dass wir noch enger zusammenstehen sollten. Meine sehr veehrten Damen und Herren,
  Exzellenzen, ich möchte mich noch einmal herzlich für die freundliche Einladung
  bedanken! Es gibt noch viele Themen, die unsere beiden Länder bewegen, und die wir
  beide, lieber Ignazio, noch weiter diskutieren werden. Ich freue mich, diese Diskussion
  jetzt mit Ihnen allen fortzusetzen und bedanke mich sehr herzlich für Ihre Aufmerksamkeit.'
