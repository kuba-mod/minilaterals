title: Gemeinsame Erklärung der Sprecherinnen der Außenministerien Deutschlands und
  Frankreichs zum Urteil gegen Chow Hang-tung, Preisträgerin des Deutsch-Französischen
  Menschenrechtspreises 2023
text: Deutschland und Frankreich bedauern zutiefst den Schuldspruch gegen die Menschenrechtsanwältin
  und Demokratie-Aktivistin Chow Hang-tung. Gemeinsam mit anderen Aktivistinnen und
  Aktivisten der Hong Kong Alliance in Support of Patriotic Democratic Movements of
  China hat sich Chow Hang-tung unermüdlich zur Förderung der Menschenrechte und der
  Demokratie in China und insbesondere in der Sonderverwaltungsregion Hongkong eingesetzt.
  Das friedliche Eintreten für die Menschenrechte stellt keine Straftat dar. Wir fordern
  ihre unverzügliche Freilassung und rufen die Behörden in Peking und Hongkong nachdrücklich
  dazu auf, alle bürgerlichen Rechte und Freiheiten zu achten. Chow Hang-tung, einer
  hoch angesehenen Anwältin, wurde in Anerkennung ihrer außerordentlichen Verdienste
  um die Förderung der Menschenrechte, einschließlich des friedlichen Erinnerns an
  die Niederschlagung der Demokratie-Bewegung auf dem Platz des Himmlischen Friedens
  am 4. Juni 1989, im Jahr 2023 der Deutsch-Französische Preis für Menschenrechte
  und Rechtsstaatlichkeit verliehen.
