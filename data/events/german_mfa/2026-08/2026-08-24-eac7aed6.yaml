title: Rede von Außenminister Johann Wadephul beim Internationalen Veteranenforum
  in Kyjiw
text: 'Für Soldaten und Diplomaten haben Flaggen eine ganz besondere Bedeutung: Sie
  stehen für unsere Werte und symbolisieren diejenigen, in deren Dienst wir stehen.
  An den meisten Orten, die ich besuche, steht in der Regel eine deutsche und natürlich
  eine europäische Flagge. Diese Flaggen werden oft schnell von Assistenten, Protokollreferenten
  und lokalen Beamten aufgestellt und kurz darauf wieder abgehängt. Es gibt jedoch
  eine Flagge, die ich selbst aufgehängt und seitdem nicht wieder abgenommen habe!
  Sie hängt in meinem Büro, direkt gegenüber von meinem Schreibtisch. Diese Flagge
  ist Ihre – die Flagge der Ukraine. Genauer gesagt: Es ist die Flagge des Ersten
  Separaten Sturmregiments. Ihre Kameraden haben sie mir vor ein paar Monaten gegeben.
  Diese Kommandeure kamen direkt von der Front, an der sie seit über vier Jahren kämpfen,
  nach Berlin und kehrten unmittelbar nach ihrem Deutschland-Besuch zu ihrer Einheit
  zurück. Was mich dabei am meisten bewegt hat, ist für Sie alle offensichtlich: Vor
  Russlands Angriffskrieg waren diese Männer keine Soldaten. Einer war Student. Einer
  Hausarzt. Einer Sozialarbeiter. Einer Historiker und einer Theaterregisseur. Nicht
  sie haben sich diesen Krieg ausgesucht, sondern der Kreml. Dennoch haben sie sich
  dazu entschieden, ihr Land, ihre Liebsten und ihre Lebensweise zu verteidigen. Wenn
  die Alternative klar ist, gibt es keine andere Wahl. Sollte Russland die Ukraine
  ihrer Freiheit, ihrer staatlichen Souveränität und ihrer europäischen Zukunft berauben,
  würde dies eine besorgniserregende Botschaft an Autokraten auf der ganzen Welt senden:
  Es gilt das Recht des Stärkeren. Die Flagge in meinem Büro steht daher auch für
  unsere Solidarität: Wir stehen an der Seite der Ukraine – bei der Verteidigung unserer
  gemeinsamen Werte und im Kampf gegen die Gewaltherrschaft. an dieser Stelle möchte
  ich etwas Persönliches sagen. Heute spreche ich nicht nur als deutscher Außenminister
  zu Ihnen, sondern auch als Soldat und Reserveoffizier. Ich habe als Zeitsoldat in
  der Bundeswehr gedient und bin nun Oberstleutnant der Reserve. Ich weiß aus eigener
  Erfahrung, was es bedeutet, Verantwortung für andere zu tragen und sich auf seine
  Kameraden zu verlassen. Ich weiß aber auch, dass sich meine Erfahrungen nicht mit
  Ihren vergleichen lassen. Sie haben in einem realen und brutalen Krieg gekämpft.
  Sie haben außerordentlichen Mut gezeigt. Sie haben unglaubliche Widerstandsfähigkeit
  bewiesen und unter schwierigsten Bedingungen Verantwortung übernommen. Sie sind
  ein zentraler Bestandteil der ukrainischen Gesellschaft. Viele von Ihnen sind von
  den Narben dieses Kriegs gezeichnet. Und für Soldatinnen und Soldaten enden die
  Folgen eines Krieges nicht mit dem Ende der Kampfhandlungen. Nach dem Einsatz heimzukehren,
  sich an das zivile Leben anzupassen und berufliche Karrieren und persönliche Beziehungen
  wiederaufzubauen sind ganz eigene, große Herausforderungen. Für mich und für mein
  Land ist klar, dass wir Sie unterstützen werden. Dabei ist es einerseits wichtig,
  dass ukrainische Strukturen bei der Bereitstellung umfassender Unterstützung für
  Veteraninnen und Veteranen im Zentrum stehen. Die Unterstützung muss die ganze Bandbreite
  an Bedürfnissen der Veteraninnen und Veteranen abdecken und von den eigenen Strukturen
  und Institutionen der Ukraine getragen werden. Genauso wichtig ist aber auch die
  Abstimmung mit den vielen anderen Akteuren und Organisationen, die Hilfe für Veteraninnen
  und Veteranen leisten. Es gibt viele ausgezeichnete Initiativen, darunter auch mit
  deutscher Hilfe errichtete Veteranenzentren, und zahlreiche engagierte Organisationen.
  Diese Bemühungen müssen wir bündeln und effektiv koordinieren, um die größtmögliche
  Wirkung zu erzielen. Ich kann Ihnen versichern, dass Deutschland dieser Sache verpflichtet
  bleibt. Und unsere Zusage ist konkret: Wir werden zusätzlich drei Millionen Euro
  zur Unterstützung der Veteraninnen und Veteranen bereitstellen. Denn die Veteraninnen
  und Veteranen und der Dienst, den sie leisten, verdienen unseren größten Respekt!
  Wir unterstützen nachdrücklich einen umfassenden Ansatz, der gewährleistet, dass
  den Bedürfnissen der Veteraninnen und Veteranen im Rahmen des bestehenden Sozialsystems
  der Ukraine Rechnung getragen wird. Das bedeutet, sicherzustellen, dass Veteraninnen
  und Veteranen die Fürsorge erhalten, die sie brauchen, und dass sie ins zivile Leben
  zurückkehren, ihre Fähigkeiten ins Arbeitsleben einbringen und ihr Land stärken
  können. Sie und alle Veteraninnen und Veteranen sollten ein zentraler Bestandteil
  der gesellschaftlichen Strukturen sein und sich nicht außerhalb dieser Strukturen
  befinden. Sie sind extrem wertvoll für die Ukraine. Wir müssen sicherstellen, dass
  die Ukraine aus diesem Potenzial schöpfen kann. In der Zeit nach dem Krieg werden
  die Veteraninnen und Veteranen in der Ukraine gebraucht werden: als Teil der Arbeitskräfte,
  die das Land wiederaufbauen, als Teil der militärischen Reserve und als Säulen der
  demokratischen Resilienz. Daher lauten die Fragen, die wir uns als Deutsche und
  Europäer selbst stellen müssen: Wie können wir die Ukraine dabei unterstützen, dieses
  Potenzial bestmöglich zu nutzen? Wie können wir Veteraninnen und Veteranen dabei
  helfen, ins zivile Leben zurückzukehren, und dabei gleichzeitig gewährleisten, dass
  ihre Erfahrungen, ihre Fähigkeiten und ihr Engagement wertvoll für ihr Land bleiben?
  Ich bin überzeugt, dass unser gemeinsames Ziel nicht nur darin bestehen muss, Sie
  nach Beendigung ihres Dienstes zu unterstützen, sondern Ihnen auch die Möglichkeit
  zu geben, die Zukunft der Ukraine gestalten. Sie haben die Ukraine mit großem Mut
  verteidigt. Sie sollten nun jede erdenkliche Chance bekommen, beim Aufbau der Ukraine
  mitzuhelfen, für die sie gekämpft haben.'
