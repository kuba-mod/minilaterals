title: Bundesaußenminister Johann Wadephul zum Welttag der humanitären Hilfe
text: 'Zum Welttag der humanitären Hilfe sagte Bundesaußenminister Wadephul (19.08.2026):
  Humanitäre Helferinnen und Helfer stehen dort an der Seite der Menschen, wo Not
  und Verzweiflung am größten sind. Sie leisten Hilfe unter schwierigsten Bedingungen
  – inmitten von Kriegen, Vertreibung und Naturkatastrophen. Für ihren aufopfernden
  Einsatz verdienen sie Respekt, Anerkennung und Schutz. 2025 wurden 350 humanitäre
  Helferinnen und Helfer getötet, unter ihnen viele lokale Mitarbeiterinnen und Mitarbeiter
  von Hilfsorganisationen. Am Welttag der humanitären Hilfe steht ihr Schicksal im
  Mittelpunkt: humanitäre Helferinnen und Helfer müssen sicheren und ungehinderten
  Zugang zu Menschen in Not erhalten. Angriffe auf sie sind niemals hinnehmbar, sie
  verstoßen gegen humanitäres Völkerrecht. Die Zahl der Menschen, die auf humanitäre
  Unterstützung angewiesen ist, bleibt dramatisch hoch. Bei fast 240 Millionen Menschen,
  deren Leben ohne humanitäre Hilfe in Gefahr wäre, ist Wegsehen keine Option: Familien,
  die vor Gewalt fliehen müssen; unterernährte Kinder; Menschen, die alles verloren
  haben. In einer Welt, in der Krisen zunehmen und Konflikte immer brutaler geführt
  werden, steigt die Not leider stärker als die Mittel zu ihrer Linderung. Deutschland
  bleibt daher ein unerlässlicher Partner der internationalen Hilfsorganisationen
  – besonders in akuten Notlagen. In Sudan hungern fast 20 Millionen Menschen, es
  ist die schwerste humanitäre Krise unserer Zeit – dringend benötigte Mittel, um
  schlimmste Not zu lindern, haben wir international im Rahmen der Berliner Sudankonferenz
  eingeworben. In der Ukraine leiden Menschen jeden Tag unter dem russischen Angriffskrieg
  und seinen verheerenden Folgen – hier helfen wir, damit Putins Entvölkerungsstrategie
  nicht aufgeht. In der Demokratischen Republik Kongo unterstützen wir dabei, den
  Ebola-Ausbruch einzudämmen. Damit schützen wir die Menschen vor Ort und reduzieren
  das Risiko für die gesamte Region. Und auch nach Naturkatastrophen wie den schweren
  Erdbeben in Venezuela zeigt sich: Schnelle und wirksame Hilfe entscheidet oft über
  Leben und Tod. In diesem Jahr hat die Bundesregierung dazu beigetragen, dass über
  80 Millionen Menschen in 54 Ländern weltweit mit überlebensnotwendiger Hilfe versorgt
  werden können. Humanitäre Hilfe lindert dabei nicht nur unmittelbares Leid. Indem
  sie Perspektiven schafft und Stabilität stärkt, dämmt sie Fluchtursachen ein und
  kann den Weg zu Frieden und Wiederaufbau ebnen. Humanitäre Hilfe ist deswegen nicht
  nur ein Gebot der Menschlichkeit - sie liegt auch im sicherheitspolitischen und
  im wirtschaftlichen Interesse Deutschlands. Ich werbe deswegen dafür, in diesem
  Bereich auch in den kommenden Jahren eine ausreichende Finanzierung sicher zu stellen.'
