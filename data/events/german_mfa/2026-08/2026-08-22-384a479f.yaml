title: Außenminister Wadephul bei seiner Ankunft in Kyjiw
text: 'Bei seiner Ankunft in Kyjiw erklärte Außenminister Wadephul heute (22. August
  2026): In den Tagen des 35. Unabhängigkeitstags der Ukraine ist es mir ein persönliches
  Anliegen, mir selbst ein Bild vor Ort zu machen und mit möglichst vielen Menschen
  in unterschiedlichen Lebenslagen zu sprechen. Darüber, wie Deutschland als wichtigster
  Partner in Europa gezielt unterstützen kann. Im täglichen Kampf um den Frieden und
  in Vorbereitung auf den nächsten Winter. Denn neben wahllosem Mord an Zivilisten
  greift Russland gezielt die Energieinfrastruktur der Ukraine an, um die Lebensgrundlagen
  zu zerstören und damit den Durchhaltewillen der Menschen zu brechen. Die Ferienwochen
  im Juli und August, für Menschen überall in Europa die schönste Zeit des Jahres,
  waren für die ukrainische Zivilbevölkerung die tödlichsten seit mehr als vier Jahren.
  Nie vorher feuerte Russland mehr Raketen auf sein Nachbarland ab. Jeden Tag werden
  Frauen, Männer und Kinder von Russland der Zukunft beraubt, auf die das ganze Land
  hofft und nach der das ganze Land strebt. Einer Zukunft in Frieden, einer Zukunft
  endlich ohne Angst um Freunde und Familie, ohne Angst vor dem, was die nächste Nacht
  bringt. Die täglichen Bilder der Zerstörung dürfen niemanden kalt lassen und können
  gleichzeitig doch nicht die ganze Geschichte der betroffenen Menschen in der Ukraine
  erzählen. Denn trotz unfassbarer Umstände verlieren die Ukrainerinnen und Ukrainer
  das Ziel eines „Danach“ nie aus den Augen, machen auf beeindruckende Weise weiter,
  kämpfen für Sicherheit und Freiheit – in und auch für Europa. Junge Menschen besuchen
  Universitäten, lernen buchstäblich im Untergrund. Helferinnen und Helfer bauen immer
  wieder auf, mitten in der Zerstörung, mitten im Krieg. Dass die Ukraine mit internationaler
  Unterstützung den längeren Atem hat und dass eine Fortführung des Krieges Russland
  nur weiter in den wirtschaftlichen Ruin führt, wird immer mehr Menschen in Russland
  klar. Die immer wirrere Propaganda und immer totalitärere Unterdrückung im Inneren
  ist auch ein Zeichen der Schwäche des Regimes. Der einzige Ausweg ist Frieden –
  dass Putin dies endlich akzeptiert und endlich aufhört, auch die Jugend seines eigenen
  Landes in den tausendfachen Tod zu schicken, ist das Ziel all unserer Maßnahmen.
  Gleichzeitig lernen wir von der Ukraine. Es gibt kaum ein anderes Land, in dem derart
  viel Initiative und Innovation jeden Tag gelebt wird. Bei meinem Besuch wird es
  deshalb auch um unsere technische und wirtschaftliche Zusammenarbeit gehen, etwa
  bei der gemeinsamen Entwicklung von Drohnensystemen. Und darum, wie wir unsere neue
  strategische Partnerschaft auf allen Ebenen weiter vertiefen können.'
