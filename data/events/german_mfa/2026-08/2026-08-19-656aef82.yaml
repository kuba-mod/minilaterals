title: Beauftragter der Bundesregierung für Menschenrechtspolitik und humanitäre Hilfe
  zum Welttag der humanitären Hilfe
text: 'Zum Welttag der humanitären Hilfe am 19. August erklärt Dr. Lars Castellucci,
  Beauftragter der Bundesregierung für Menschenrechtspolitik und humanitäre Hilfe:
  Humanitäre Helferinnen und Helfer retten jeden Tag Leben. Wo Menschen unter Krieg,
  Hunger oder Naturkatastrophen leiden, stehen sie ihnen bei und riskieren dabei immer
  häufiger ihr eigenes Leben. Die meisten der 350 humanitären Helferinnen und Helfer,
  die 2025 getötet wurden, waren lokale Mitarbeiterinnen und Mitarbeiter. Sie sind
  die Ersten vor Ort, tragen die Hauptlast der humanitären Arbeit und das größte Risiko.
  Ihnen gilt heute mein besonderer Dank. Weltweit sind 239 Millionen Menschen auf
  humanitäre Hilfe angewiesen, gleichzeitig fehlen Milliarden, um auch nur die dringendsten
  Bedarfe zu decken. Weitere Kürzungen in diesem Bereich wären falsch. Humanitäre
  Hilfe ist kein Luxus. Sie rettet Leben und sie ist eine menschliche Verpflichtung.
  Deshalb bleibt Deutschland ein verlässlicher Partner der humanitären Hilfe. Dafür
  stellen wir in diesem Jahr mehr als eine Milliarde Euro zur Verfügung. Doch Geld
  allein reicht nicht. Humanitäre Helferinnen und Helfer müssen die Menschen in Not
  auch erreichen können. In immer mehr Konflikten wird das humanitäre Völkerrecht
  missachtet und werden Zivilisten sowie zivile Infrastruktur angegriffen. Auch Helferinnen
  und Helfer selbst werden zu Opfern. Wer Menschen hilft, darf nicht zur Zielscheibe
  werden. Humanitäre Hilfe macht einen Unterschied. Sie ermöglicht Menschen, in ihrer
  Heimat zu bleiben, sie verhindert, dass Krisen weiter eskalieren, und sie trägt
  zu einer stabileren Welt bei. Das liegt auch in unserem Interesse. Es ist und bleibt
  richtig, Menschen in größter Not zu helfen.'
