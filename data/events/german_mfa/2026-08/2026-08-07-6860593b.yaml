title: 'Unity: Gemeinsam für gleiche Rechte bei der WorldPride Amsterdam 2026'
text: 'Die Equal Rights Coalition begrüßt die WorldPride Amsterdam, die 2026 unter
  dem Motto „ Unity “ gefeiert wird – in dem Jahr, in dem wir auch das zehnjährige
  Jubiläum unserer Coalition und das 25-jährige Jubiläum der Legalisierung gleichgeschlechtlicher
  Ehen in den Niederlanden feiern. Dies ist für uns eine Gelegenheit, die erreichten
  Fortschritte zu würdigen und zu bekräftigen, wie wichtig es ist, Gesellschaften
  aufzubauen, in denen alle Menschen in Würde, in Freiheit und ohne Diskriminierung
  leben können. Seit ihrer Gründung in Montevideo im Jahr 2016 versammelt die Equal
  Rights Coalition Staaten und zivilgesellschaftliche Organisationen aus unterschiedlichen
  Regionen und mit unterschiedlichen nationalen Voraussetzungen hinter einem gemeinsamen
  Ziel: die Menschenrechte der LGBTIQ + -Community zu fördern und zu schützen. Diese
  Arbeit stützt sich auf Dialog, Kooperation und Verständnis unter den Mitgliedern
  sowie auf die Erkenntnis, dass nachhaltiger Fortschritt nicht ohne kollektive Anstrengung
  erzielt werden kann. Die WorldPride Amsterdam bietet die Chance, erneut ganz klar
  zu sagen: Das Recht auf freie Meinungsäußerung, Vereinigungsfreiheit und friedliche
  Versammlung gehört ausnahmslos allen Menschen. Pride -Demonstrationen und -Feiern
  sind für LGBTIQ + -Communities ein Ort der Teilhabe, der Solidarität und des Protests
  – und ein Ort, an dem sie sich kollektiv Gehör verschaffen können. Sie müssen frei,
  friedlich und sicher stattfinden können, im Einklang mit den internationalen menschenrechtlichen
  Verpflichtungen, auf die sich die Staaten verständigt haben. Vor diesem Hintergrund
  sind wir besorgt angesichts der Gewalt, Belästigungen und Diskriminierung, denen
  LGBTIQ + -Personen in zahlreichen Teilen der Welt weiterhin ausgesetzt sind. Wir
  erklären uns darüber hinaus solidarisch mit den Opfern des Angriffs auf den Christopher
  Street Day in Berlin sowie mit ihren Familien und den betroffenen Communities .
  Diese Ereignisse verdeutlichen die Notwendigkeit, Gewalt zu verhindern, Intoleranz
  zu bekämpfen und die friedliche Ausübung von Grundrechten zu schützen. Anlässlich
  dieser wichtigen Zusammenkunft lädt die Equal Rights Coalition ihre Mitgliedstaaten,
  die internationale Gemeinschaft, internationale Organisationen und die Zivilgesellschaft
  ein, ihr Bekenntnis zur Förderung und zum Schutz der Menschenrechte von LGBTIQ +
  -Personen zu erneuern. Durch Kooperation, Dialog und Respekt für die unterschiedlichen
  nationalen Voraussetzungen können wir Schritt für Schritt Gesellschaften aufbauen,
  die inklusiver, sicherer und menschlicher sind und die Würde aller Menschen achten.
  Folgende ERC-Mitgliedstaaten sind Mitunterzeichner: Australien, Brasilien, Chile,
  Dänemark, Deutschland, Estland, Finnland, Frankreich, Irland, Kanada, Kolumbien,
  Luxemburg, Malta, Mexiko, Niederlande, Norwegen, Portugal, Schweden, Schweiz, Spanien,
  Uruguay, Vereinigtes Königreich.'
