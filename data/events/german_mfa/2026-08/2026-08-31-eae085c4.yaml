title: Außenminister Wadephul vor seiner Abreise nach Tunesien und Algerien
text: 'Vor seiner Abreise nach Tunesien und Algerien erklärte Außenminister Wadephul
  heute (31.08.2026): Angesichts globaler Umbrüche und Instabilität ist es für Deutschland
  und Europa entscheidend, gerade mit unseren geografischen Nachbarn in Nordafrika
  noch enger zusammenarbeiten. Mit Algerien und Tunesien teilen wir das Ziel, die
  Sahel-Region nachhaltig zu stabilisieren. Auch eine Beruhigung der Lage im Nahen
  Osten, insbesondere rund um die Seewege der arabischen Halbinsel, ist für unsere
  Versorgung und Sicherheit von größter Bedeutung. Gemeinsam werden wir deshalb die
  Chancen engerer Zusammenarbeit nutzen: Seit Regierungsantritt haben wir den Austausch
  zwischen unseren Ländern intensiviert – erst kürzlich durfte ich meinen tunesischen
  Kollegen Mohamed Nafti und meinen algerischen Kollegen Ahmed Attaf in Berlin begrüßen.
  An diesen engen Austausch werde ich mit meinem Besuch nun anknüpfen. Denn: Mit Tunesien
  und Algerien teilen wir zentrale wirtschaftliche und sicherheitspolitische Anliegen.
  Gerade bei der wirtschaftlichen Zusammenarbeit, wie etwa bei der Energiezusammenarbeit,
  können wir uns gegenseitig sehr viel anbieten, um gemeinsam mehr Wachstum und Wohlstand
  zu schaffen. Gemeinsam können wir das Mittelmeer zu einem Raum der Stärke zwischen
  unseren Kontinenten machen. Mit Tunesien feiern wir in diesem Jahr den 70. Jahrestag
  unserer diplomatischen Beziehungen. Unsere Staaten sind in diesen Jahrzehnten immer
  weiter zusammengewachsen: Deutschland ist für Tunesien der drittwichtigste Exportmarkt,
  für unsere Industrie – vor allem die Autoindustrie – sind widerstandsfähige Lieferbeziehungen
  zu Tunesien heute zentral. Auch der wissenschaftliche und berufliche Austausch zwischen
  unseren Staaten floriert: Rund 7500 junge Tunesierinnen und Tunesier studieren an
  deutschen Hochschulen, während tunesische Fachkräfte einen wertvollen Beitrag in
  unserem Gesundheitssystem leisten. Algerien ist für Deutschland ein strategischer
  Partner in der Energie- und auch in der Sicherheitspolitik. Algerien ist bereits
  heute einer der wichtigsten Gaslieferanten für die Europäische Union, als zukünftiger
  Lieferant mit riesigem Potenzial für die Produktion von grünem Wasserstoff wird
  Algeriens Bedeutung noch einmal zunehmen. Deshalb haben wir erst im Juli vereinbart,
  unsere Partnerschaft für die Energieversorgung und die Transformation des Energiesektors
  noch einmal deutlich zu vertiefen und neue Wege der wirtschaftlichen Zusammenarbeit
  zu beschreiten. Deshalb habe ich auch Vertreterinnen und Vertreter der deutschen
  Wirtschaft zur Begleitung der Reise und für Wirtschaftsgespräche nach Tunesien und
  Algerien eingeladen.'
