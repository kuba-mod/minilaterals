title: Warnhinweis an Länder, Unternehmen und andere Akteure betreffend nordkoreanische
  IT-Fachkräfte
text: Gemeinsamer Warnhinweis Japans, der Vereinigten Staaten von Amerika, der Republik
  Korea, Australiens, Deutschlands, Frankreichs, Italiens, Kanadas, Neuseelands, der
  Niederlande und des Vereinigten Königreichs Nordkorea stützt sich auf ein Netzwerk
  qualifizierter IT-Fachkräfte, die innerhalb und außerhalb Nordkoreas eingesetzt
  werden, um sich falsche Identitäten zu beschaffen und in Remote-Arbeit Einkommen
  zu erzielen, mit dem die rechtswidrigen Kernwaffen- und Raketenprogramme Nordkoreas
  finanziert werden. Nordkoreanische IT-Fachkräfte geben sich als Staatsangehörige
  anderer Länder aus, um über Online-Plattformen, die private Unternehmen zur Mitarbeitersuche,
  Beschaffung sowie Beauftragung von Dienstleistungen betreiben, Arbeit und Einkommen
  zu erhalten. Diese Personen versuchen, Verträge abzuschließen und ihre Gehälter
  an ihre übergeordneten nordkoreanischen Agenturen weiterzugeben. Zudem bedrohen
  sie Unternehmen von innen und sind an Datenabfluss sowie dem Diebstahl von Kryptowährungen
  und sensiblen Informationen beteiligt. Nordkoreanische IT-Fachkräfte setzen immer
  raffiniertere Methoden ein, auch unter Nutzung von KI, um ihre Identitäten zu verschleiern
  und ihre Aktivitäten weltweit auszuweiten. Unsere Länder haben wiederholt Informationen
  veröffentlicht, um die internationale Staatengemeinschaft und den Privatsektor vor
  der Bedrohung durch nordkoreanische IT-Fachkräfte zu warnen. Japan, die Vereinigten
  Staaten und die Republik Korea gaben im August 2025 eine „Gemeinsame Erklärung zu
  nordkoreanischen IT-Fachkräften“ ab, und das multilaterale Sanktionsüberwachungsteam
  (MSMT) veröffentlichte im Oktober 2025 seinen zweiten Bericht über die Verletzung
  und Umgehung von VN -Sanktionen durch Nordkorea mittels Cyber-Aktivitäten und IT-Fachkräften.
  Die Vereinigten Staaten, Japan, die Republik Korea, das Vereinigte Königreich, Australien
  und Kanada haben jeweils Leitfäden bezüglich der Risiken veröffentlicht, die von
  nordkoreanischen IT-Fachkräften für private Unternehmen, Regierungen und einzelne
  Bürgerinnen und Bürger ausgehen. Die Bedrohung durch nordkoreanische IT-Fachkräfte
  wird durch uns weiterhin aktiv beobachtet und bekämpft. Nach Maßgabe von Resolution
  2397 des VN -Sicherheitsrats müssen alle VN -Mitgliedstaaten alle nordkoreanischen
  Staatsangehörigen, die im Hoheitsgebiet des jeweiligen Mitgliedstaats Einkommen
  erzielen, nach Nordkorea repatriieren, vorbehaltlich begrenzter Ausnahmen. Darüber
  hinaus verstößt der Abschluss von Verträgen mit nordkoreanischen IT-Fachkräften
  und ihre Bezahlung für erbrachte Leistungen möglicherweise gegen die innerstaatlichen
  Gesetze vieler Länder, darunter Japan, die Vereinigten Staaten und die Republik
  Korea, und kann rechtliche Konsequenzen oder Geldstrafen nach sich ziehen. Die Arbeitsgruppe
  zur Geldwäschebekämpfung (FATF) stuft Nordkorea als Hochrisiko-Land (high-risk jurisdiction)
  ein, für das ein Aufruf zum Handeln besteht (schwarze Liste). Die FATF bekräftigt
  kontinuierlich die Notwendigkeit, robuste und zielgerichtete Finanzsanktionen im
  Einklang mit den einschlägigen Resolutionen des VN -Sicherheitsrats umzusetzen,
  und fordert alle Staaten und Gebiete auf, Gegenmaßnahmen zu ergreifen, um ihre Finanzsysteme
  vor den Risiken der nordkoreanischen Geldwäsche sowie Terrorismus- und Proliferationsfinanzierung
  zu schützen. Dessen ungeachtet vernetzt sich Nordkorea durch diversifizierte Maßnahmen
  zur Generierung von Einkommen, unter anderem das IT-Fachkräfte-System, immer stärker
  mit dem internationalen Finanzsystem. Wie im Bericht der FATF zu Typologien der
  komplexen Proliferationsfinanzierung und Sanktionsumgehung (Complex Proliferation
  Financing and Sanctions Evasion typologies report) hervorgehoben wird, nutzt Nordkorea
  häufig sein IT-Fachkräfte-System, um Einnahmen zur Finanzierung seines Programms
  für Massenvernichtungswaffen zu generieren. Wir fordern alle Länder, Unternehmen
  und andere Akteure dringend auf, sich eingehender mit dem nordkoreanischen IT-Fachkräfte-System
  zu befassen und Maßnahmen zur Bekämpfung der unten aufgeführten Taktiken zu ergreifen.
  Unternehmen, die Online-Plattformen betreiben, sollten ihre Gegenmaßnahmen weiter
  verstärken, etwa durch die Verbesserung von Identitätsprüfungsverfahren (strenge
  Prüfung von Ausweisdokumenten, Bestehen auf persönlichen Vorstellungsgesprächen
  usw. ) und die Erkennung verdächtiger Konten (Einführung von Systemen, die bei anomalen
  Dateneingaben benachrichtigen usw. ). Die folgenden Informationen werden von den
  Staaten bereitgestellt, die diesen Warnhinweis herausgeben. Darüber hinaus weisen
  Konten, die mit nordkoreanischen IT-Fachkräften in Verbindung stehen, häufig die
  nachfolgenden Merkmale auf. Wenn mehrere dieser Merkmale auf eine Person zutreffen,
  die sich um eine Stelle bewirbt, handelt es sich möglicherweise um eine nordkoreanische
  IT-Fachkraft, die in betrügerischer Absicht nach Arbeit sucht.
