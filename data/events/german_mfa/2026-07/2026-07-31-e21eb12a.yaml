title: Außenminister Wadephul zur Lage in Ceuta
text: Zur Lage in Ceuta sagte Außenminister Wadephul heute, 31.07.2026 Der Schutz
  der europäischen Außengrenze ist von überragender Bedeutung für die Europäische
  Union, um illegale Migration in Schach zu halten. Daher ist es wichtig, dass Spanien
  umgehend die vollständige Kontrolle über die besorgniserregende Situation in Ceuta
  zurückgewinnt, wo Zehntausende die Grenze zu Spanien illegal übertreten haben. Ich
  war dazu mit meinem spanischen Amtskollegen, José Manuel Albares, meinem marokkanischen
  Kollegen, Nasser Bourita, und Kolleginnen und Kollegen innerhalb der EU in Kontakt.
  Ich begrüße die Bereitschaft Marokkos, weiter eng mit Spanien zusammenzuarbeiten,
  um die Sicherheit der gemeinsamen Grenze zu gewährleisten und die Migranten aus
  Ceuta schnellstmöglich zurückzunehmen. Jetzt ist schnelles und gemeinsames Handeln
  im Sinne der Europäischen Union gefragt, um den Schengenraum – eine der größten
  Errungenschaften der EU – zu schützen und offenzuhalten.
