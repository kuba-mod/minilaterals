date: '2026-07-23'
type: press_release
source_name: german_mfa
title: Rede von Außenminister Johann Wadephul an der Universität Witwatersrand, Südafrikanisches
  Institut für Internationale Angelegenheiten (SAIIA)
text: '„Verantwortung und Ubuntu – gemeinsame deutsch‑südafrikanische Perspektiven
  in einer fragmentierten Welt“ Nelson Mandela hat Deutschland zum ersten Mal im Juni
  1990 besucht. Nur vier Monate nach seiner Freilassung aus 27 Jahren Haft in Apartheidsgefängnissen.
  Nur sieben Monate nach dem Fall der Berliner Mauer. Mein Land befand sich damals
  im Umbruch und war im Begriff, mehr als 40 Jahre Teilung zu überwinden. In diesem
  Geist des fundamentalen Wandels machten unsere beiden Länder die Erfahrung einer
  friedlichen Revolution. Aussöhnung und Wiedervereinigung waren gesellschaftliche
  und politische Herausforderungen, denen sich die Menschen unserer beiden Länder
  stellen wollten. Südafrika und Deutschland wollten außerdem den europäischen Markt
  für Südafrika öffnen. Unser Ziel war eine engere wirtschaftliche Zusammenarbeit
  und Investitionen zwischen unseren beiden Ländern – der Gedanke war, dass wir beide
  davon profitieren würden. Deutsche Unternehmen waren bereits seit den 1950er Jahren
  sehr aktiv in Südafrika. Diese starke Präsenz beruhte jedoch auf einer schwierigen
  und unbequemen Wahrheit: Zwar gab es für die Anti‑Apartheid‑Bewegung in der deutschen
  Zivilgesellschaft erhebliche Unterstützung, deutsche Unternehmen hatten jedoch –
  trotz Kritik aus Südafrika und anderen Ländern – mit dem Apartheidsregime kooperiert.
  Und westdeutsche Regierungen hatten durchaus enge Beziehungen zu dem Land aufrechterhalten,
  was nicht richtig war. Und reichte trotzdem die Hand zur Versöhnung. Er wollte mit
  Deutschland eine Freundschaft aufbauen, die nicht von der Vergangenheit überschattet
  wurde. Daraus entwickelte sich eine Freundschaft, deren Früchte wir nun seit über
  30 Jahren ernten. Im Zentrum unserer engen politischen Beziehungen steht unsere
  Binationale Kommission, eine bilaterale hochrangige Gruppe, die regelmäßig zusammenkommt,
  um unsere bilaterale Zusammenarbeit weiterzuentwickeln. Das letzte Treffen fand
  im April statt und wurde von Minister Lamola und mir geleitet. Gemeinsam haben wir
  in Berlin das 30-jährige Bestehen unserer Binationalen Kommission gefeiert. Zu diesem
  Anlass haben wir unsere Beziehung auf die neue Stufe einer Strategischen Partnerschaft
  gehoben – ein absolut wegweisender Schritt! Manch einer mag denken, das ist doch
  nur leere Symbolpolitik. Dieser Schritt steht dafür, dass unsere Zusammenarbeit
  von Anfang an, seit 1995, wirklich nutzbringend für beide Seiten war. Wenn Sie Beweise
  brauchen, könnten Sie mit den über 600 deutschen Unternehmen sprechen, die hier
  aktiv sind und für mehr als 100 000 Menschen Arbeitsplätze geschaffen haben. Diese
  Unternehmen stehen im Zentrum unserer engen Wirtschaftsbeziehungen, die ein jährliches
  Handelsvolumen von 20,1 Milliarden Euro zwischen unseren Ländern generieren – das
  sind mehr als 375 Milliarden Rand. Sie könnten auch die gut 300 000 deutschen Touristen
  fragen, die allein in den letzten zwölf Monaten Südafrika bereist haben und zu denen
  übrigens auch meine Tochter und ihr Mann gehören. Ihr Land, so viel ist sicher,
  ist für viele Deutsche ein Traumziel. Aber wir wollen nicht, dass es hier aufhört.
  Durch unseren neuen bilateralen Gemeinsamen Aktionsplan, den Minister Lamola und
  ich in Berlin unterzeichnet haben, werden wir unsere Zusammenarbeit durch mehr als
  90 geplante konkrete Maßnahmen systematisch intensivieren. Man kann mit Fug und
  Recht behaupten, dass das, was zwischen Südafrika und Deutschland Mitte der 1990er
  Jahre in Bewegung gesetzt wurde, nicht nur die Zeit überdauert, sondern kontinuierlich
  an Umfang und Tiefe gewonnen hat. Damals, zu Beginn der Ära der Globalisierung,
  ahnte man bereits, dass dies nicht nur Chancen, sondern auch erhebliche Herausforderungen
  für unsere beiden Länder mit sich bringen würde. Und man verstand, dass starke und
  verlässliche Partnerschaften überall in der Welt nötig sein würden, um große Herausforderungen
  anzugehen. Bilaterale und multilaterale Partnerschaften sind wichtiger denn je.
  Und dafür steht unsere neue strategische Partnerschaft zwischen Deutschland und
  Südafrika heute Modell. Wir arbeiten eng zusammen, weil wir wissen, dass die lokalen
  Herausforderungen von heute die globalen Probleme von morgen sind. Zum Beispiel
  die Sicherheit: Wir alle erkennen die weitreichenden Auswirkungen von Russlands
  völkerrechtswidrigem Krieg gegen die Ukraine. In Europa hat dieser Krieg lang gehegte
  Illusionen zerstört, insbesondere in meinem eigenen Land, nämlich den Glauben daran,
  dass aus wechselseitiger wirtschaftlicher Abhängigkeit und Handel automatisch stabile
  politische Beziehungen resultieren. Dass Krieg auf dem europäischen Kontinent der
  Vergangenheit angehört. Und er hat unser Sicherheitsgefühl in seinen Grundfesten
  erschüttert. Heute sehen wir nur allzu deutlich, dass Russland uns viele Jahre lang
  getäuscht hat und für uns weiterhin eine existenzielle Sicherheitsbedrohung darstellt.
  Damit Sie wissen, was ich meine: Die Iskander‑Raketen, die Russland in Kaliningrad
  stationiert hat, könnten Berlin innerhalb von Minuten erreichen. Das ist Teil der
  strategischen Realität im heutigen Europa. Und der Krieg betrifft nicht nur Europa,
  er untergräbt die internationale Ordnung insgesamt und hat weltweit verheerende
  Auswirkungen. Erinnern wir uns daran, dass Präsident Ramaphosa im Jahr 2023 in die
  Ukraine gereist ist und gemeinsam mit einer Delegation afrikanischer Staatsmänner
  Butscha besucht hat. Die Stadt, in der russische Streitkräfte ein grauenvolles Massaker
  an der ukrainischen Zivilbevölkerung verübt haben. Ich glaube, dass diese historisch
  bedeutsame Initiative nie die Anerkennung erfahren hat, die sie auch über ihren
  symbolischen Wert hinaus verdient: Afrikanische Staatsmänner reisen nach Europa,
  um bei der Schaffung von Frieden zu helfen. Wir alle wissen, dass die afrikanische
  Friedensinitiative nicht zum Ende des Krieges geführt hat. Aber sie war ein einzigartiges
  Beispiel afrikanischer Handlungsmacht in einer globalisierten Welt. Südafrika verfügt
  über langjährige Erfahrung mit Vermittlung und Friedensprozessen und hat entschieden,
  diese Erfahrung nach Europa zu bringen. Wir Europäer sollten daraus lernen, wenn
  wir in die Zukunft blicken. Und wie unsere beiden Länder wissen, gehört Beharrlichkeit
  ganz wesentlich zum politischen Geschäft, insbesondere auf internationaler Bühne.
  Das ist einer der Gründe, warum wir im April dieses Jahres in Berlin die Sudan‑Konferenz
  ausgerichtet haben. Sudan leidet unter der größten vom Menschen verursachten humanitären
  Katastrophe unserer Zeit. Doch das Land bekommt nicht die internationale Aufmerksamkeit,
  die es verdient. Es ist unsere Absicht und unsere Verpflichtung, das zu ändern.
  Gemeinsam mit der Afrikanischen Union und den Vereinten Nationen haben wir 60 Länder,
  Vertreter von über 50 nichtstaatlichen und internationalen Organisationen sowie
  Akteure der sudanesischen Zivilgesellschaft zusammengebracht. Die Konferenz hat
  nicht nur dazu beigetragen, dringend benötigte zusätzliche humanitäre Hilfe für
  die Menschen in Sudan zu mobilisieren. Sie hat es uns auch ermöglicht, uns auf Grundsätze
  für eine friedliche Beilegung des Konflikts zu einigen. Grundsätze, die in der Folge
  von 22 Staaten und Organisationen gebilligt wurden, darunter Länder, die an dem
  Konflikt beteiligt sind. Trotz dieses erheblichen internationalen Drucks gibt es
  noch keinen Frieden in Sudan. Es bleibt jedoch unsere Pflicht, weiter darauf hinzuarbeiten,
  und zwar ohne nachzulassen und ohne die Hoffnung zu verlieren! Zu wissen, dass unsere
  Länder sich in dieser Frage einig sind, erfüllt mich mit Freude und Erleichterung.
  Als Nelson Mandela bei seinem Besuch im Jahr 1996 eine Rede vor dem Deutschen Bundestag
  hielt, erkannte er in der friedlichen deutschen Wiedervereinigung ein fundamentales
  Prinzip. Er beschrieb dieses Prinzip als „das Wunder der Schöpfung: dass aus dem
  Schlimmsten das Beste erwachsen kann.“ Gleichzeitig verstehe ich sie als Warnung:
  Aus dem Besten kann stets auch wieder das Schlimmste erwachsen! Denn Frieden ist
  niemals selbstverständlich. Nicht in Europa, nicht in Afrika, nicht im Nahen Osten
  und auch nirgendwo sonst. Die internationalen Regeln, Normen und auch die multilateralen
  Institutionen, die wir über Jahrzehnte aufgebaut haben, stehen heute unter massivem
  Druck. Und nirgendwo wird dies so deutlich wie am Beispiel der Vereinten Nationen.
  Die VN können ihr volles Potenzial nicht mehr entfalten, da ihr gesamtes System
  zunehmend ganz grundsätzlich infrage gestellt wird. Gleichzeitig ist ein großer
  Teil der Kritik gegenüber der Organisation tatsächlich gerechtfertigt. Die aktuelle
  Struktur der VN ist nicht länger ein Spiegel der realen Welt, in der wir heute leben.
  Viel zu oft spiegelt sie vielmehr die Weltordnung der Vergangenheit und nicht der
  Gegenwart. Viele Länder fühlen sich berechtigterweise ungenügend repräsentiert.
  Dies gilt in besonderem Maße für den Sicherheitsrat. Ohne eine ständige Vertretung
  Afrikas im Sicherheitsrat kann es keine wahrhaft repräsentativen Vereinten Nationen
  geben. Doch die Krise des Multilateralismus geht darüber hinaus. Der enorm erfolgreiche
  G20 -Gipfel im vergangenen Jahr in Johannesburg hat gezeigt, dass Südafrika ein
  unverzichtbares Mitglied der G20 ist. Wer Südafrika ausschließt, schließt eine wichtige
  afrikanische Stimme aus – und einen mächtigen Akteur in der regionalen Wirtschaft
  und Politik. Denn gerade in Zeiten wachsender Unsicherheit in der Weltwirtschaft
  brauchen wir mehr Zusammenarbeit und nicht weniger! Südafrika und Deutschland erfahren
  wie viele andere Länder ökonomischen Gegenwind. Die Konflikte in der Ukraine und
  im Nahen Osten sowie die Unterbrechung der Schifffahrt durch die Straße von Hormus
  und das Rote Meer haben unsere Volkswirtschaften ebenfalls erheblich belastet. Wir
  wissen, dass drei Dinge für den afrikanischen Kontinent von herausragender Bedeutung
  sind: Kraftstoff. Lebensmittel. Düngemittel. Aus deutscher und südafrikanischer
  Sicht ist die aktuelle Situation außerdem ein großes Hindernis für Exporte in die
  Golfregion. Kein Land kann Herausforderungen wie diese allein durch Anpassungen
  im Inland bewältigen. Das ist meine feste Überzeugung. Außen- und Innenpolitik sind
  heute untrennbar miteinander verbunden. Unsere bilaterale Zusammenarbeit ist dafür
  das beste Beispiel. Wie bereits erwähnt, sind die Beziehungen zwischen Deutschland
  und Südafrika zum beiderseitigen Vorteil. Wir haben den europäischen Markt für Südafrika
  und die Entwicklungsgemeinschaft des Südlichen Afrika geöffnet. Im Gegenzug hat
  Südafrika deutschen Unternehmen den Zugang zu Märkten im gesamten südlichen Afrika
  ermöglicht. Unsere beiden Länder haben hiervon stark profitiert. Doch nur weil wir
  so eng zusammenarbeiten, müssen wir nicht in allem einer Meinung sein. Genauso wenig
  müssen wir dieselben Werte oder unsere politischen Positionen zu jedem Thema teilen.
  Und ich bin mir vollkommen darüber im Klaren, dass die deutsche Politik in einigen
  Bereichen hier in Südafrika kritisch betrachtet wird. Dessen ungeachtet sehe ich
  es als ein Zeichen echter Freundschaft und echten Vertrauens, dass wir die Welt
  auch durch die Augen des jeweils anderen betrachten können. In einigen strittigen
  Fragen können wir akzeptieren, dass wir schlicht unterschiedlicher Meinung sind
  und gleichzeitig unsere Zusammenarbeit fortsetzen. Denn was zählt, das ist unser
  gemeinsamer Einsatz für dieselben internationalen Prinzipien und die Tatsache, dass
  wir einander, unsere jeweilige Geschichte, unseren politischen Hintergrund und unsere
  nationalen Interessen mit Respekt und Anstand behandeln. Dieses „Verantwortungsbewusstsein“
  kann in der Außenpolitik ganz unterschiedliche Dinge bedeuten. Selbstverständlich
  ist es meine oberste Pflicht als Außenminister der Bundesrepublik Deutschland, die
  Interessen meines Landes zu wahren. Alles andere wäre eine Fehlinterpretation meines
  Amtes. Doch sich für unsere nationalen Interessen einzusetzen bedeutet nicht, gegenüber
  anderen rücksichtslos zu agieren. Liegt es nicht in unserem Interesse, wenn Konflikte
  friedlich beigelegt werden? Liegt es nicht in unserem Interesse, wenn die Ursachen
  von Vertreibung bekämpft werden? Liegt es nicht in unserem Interesse, wenn unsere
  Freunde und Partner wohlhabender und widerstandsfähiger werden? Nationale Interessen
  und internationales Verantwortungsbewusstsein schließen sich gegenseitig nicht aus.
  Ganz im Gegenteil: In den meisten Fällen verstärken sie einander. Ich sage dies
  als jemand, der im christlichen Glauben erzogen wurde und dessen Menschenbild durch
  dieselben christlichen Werte geprägt wurde, die viele von Ihnen teilen. Vielleicht
  ist das auch der Grund, warum eine Kernüberzeugung der Ubuntu-Philosophie – ausgedrückt
  mit den Worten Umuntu ngumuntu ngabantu – mich so stark anspricht: „Ein Mensch ist
  ein Mensch durch andere Menschen“. Oder, wie es auch oft verstanden wird: Mir ist
  klargeworden, dass diese Überzeugung sich fundamental darauf auswirkt, wie die Menschen
  im südlichen Afrika die Welt sehen und in ihr agieren. Sie prägt die Art und Weise
  der zwischenmenschlichen Beziehungen. Sie ist Ausdruck des Respekts, den wir einander
  schulden, weil uns bewusst ist, dass unser Leben auf tiefe Weise miteinander verbunden
  ist. Und genau dieser Geist des Respekts und des ehrlichen Interesses füreinander
  muss auch die Partnerschaft zwischen Nationen prägen. Wie die Partnerschaft zwischen
  Südafrika und Deutschland.'
