title: Staatsministerin Güler vor ihrer Abreise nach Ruanda, Burundi und in die Demokratische
  Republik Kongo
text: 'Vor ihrer Abreise nach Ruanda, Burundi und in die Demokratische Republik Kongo
  erklärte Staatsministerin Serap Güler heute (19.10.2026): Ebola ist zurück – und
  das in der Region der Großen Seen in Afrika, die schon seit über dreißig Jahren
  unter einem der tödlichsten Konflikte und größten humanitären Krisen der Welt leidet.
  Gleichzeitig hat diese Region so viel Potenzial und große Vorkommen kritischer Rohstoffe,
  die auch für die deutsche Industrie von strategischer Bedeutung sind. Ich reise
  heute nach Ruanda, Burundi und in die Demokratische Republik Kongo, weil Deutschland
  ein Interesse an Frieden, Stabilität und Fortschritt in der Region der Großen Seen
  hat. Wir müssen die Ebola-Epidemie stoppen. Deutschland kämpft entschlossen gegen
  die Ausbreitung des Virus, zum Beispiel mit Trainings für Gesundheitspersonal; davon
  möchte ich mir vor Ort ein Bild machen. Zum Ostkongokonflikt werde ich mit allen
  drei Regierungen sprechen. Für Deutschland und Europa ist klar: Nur ein nachhaltiger
  Frieden kann das Leid beenden und das volle Potenzial dieser Region zur Entfaltung
  bringen. Meine Botschaft an die Entscheidungsträger wird sein: militärische Lösungen
  zu suchen ist unverantwortlich – dieser Konflikt braucht endlich eine politische
  Lösung. Wir verfolgen das eng und bieten Unterstützung an. Burundi ist eines der
  ärmsten Länder der Welt und hat allein im letzten Jahr hunderttausende Flüchtlinge
  aus dem Ostkongo aufgenommen. Das ist vorbildlich. Auch hier unterstützt Deutschland
  und ich werde mir in einem Flüchtlingslager ein Bild von der Lage vor Ort machen.
  Gleichzeitig stehen Ruanda, Burundi und die Demokratische Republik Kongo für so
  viel mehr als Konflikt und Not. Die Region ist jung und dynamisch. Sie bietet auch
  für die deutsche und europäische Wirtschaft große Wachstumschancen – von Landwirtschaft
  und nachhaltiger Energie bis hin zu kritischen Rohstoffen, Industrie und digitaler
  Technologie. Bei deutschen Investitionen in der Region gibt es aber noch viel Potenzial.
  Ich freue mich daher, dass mich deutsche Wirtschaftsvertreter zu einzelnen Terminen
  begleiten werden, um konkrete Vorhaben voran zu bringen. Es ist eine Priorität dieser
  Bundesregierung, unsere Wirtschaft weltweit zu unterstützen – im beidseitigen Interesse
  mit unseren Partnern. In Kigali werde ich auch das Mahnmal für die Opfer des Völkermords
  an den Tutsi besuchen. Was 1994 in Ruanda geschah, darf sich nicht wiederholen.
  Auch deswegen braucht es Frieden und Versöhnung in der Region. Deutschland arbeitet
  mit seinen Partnern in der Region an einer gemeinsamen Zukunft in Sicherheit, Freiheit
  und Wohlstand – das ist das Ziel meiner Reise. Staatsministerin Serap Güler wird
  sich am 20. und 21. Oktober in Ruanda, am 21. und 22. Oktober in Burundi, und am
  23. und 24. Oktober in der Demokratischen Republik Kongo aufhalten. In Ruanda wird
  Staatsministerin Güler politische Gespräche mit der Regierung führen und Wirtschaftsvertreter
  von vor Ort ansässigen deutschen und europäischen Firmen treffen. Außerdem wird
  sie unter anderem mit Vertreterinnen und Vertretern der Zivilgesellschaft, lokaler
  deutscher Mittler- und Kulturorganisationen sowie deren ruandischen Partnern zusammenkommen.
  Sie wird auch eine Frauenkooperative besuchen, die Frauen ein selbstständiges Einkommen
  ermöglicht und sich gegen Diskriminierung und geschlechtsbasierte Gewalt einsetzt.
  In Burundi wird Staatsministerin Güler neben politischen Gesprächen mit der Regierung
  auch ein Flüchtlingslager für Flüchtlinge aus dem Ostkongo besuchen. Außerdem wird
  sie das Militärkrankenhaus in Bujumbura besichtigen, in dem deutsche Ärzte über
  das Projekt „Kinderherzen“ das weltweit erste mobile Labor für Herz-OPs an Kindern
  betreiben. Zur Aufarbeitung der deutschen Kolonialvergangenheit in Burundi wird
  sie sich mit der Regierung und Zivilgesellschaft austauschen. In der Demokratischen
  Republik Kongo wird Staatsministerin Güler Gespräche mit der Regierung sowie mit
  Vertreterinnen und Vertretern der UN -Friedensmission MONUSCO und verschiedener
  Gruppender Zivilgesellschaft führen. Staatsministerin Güler wird eine Ebola-Teststation
  besuchen und dort auch mit kongolesischen Medizinern sprechen, die an der Spitze
  der aktuellen Ebola-Forschung stehen. Die Bundesregierung hat bisher ca. 25 Millionen
  Euro zur Eindämmung des Ebola-Ausbruchs in Ostkongo beigetragen und gemeinsam mit
  Großbritannien die „International Partners Group (IPG)“ zur Ebola-Unterstützung
  ins Leben gerufen. Der Ostkongo-Konflikt ist eine der größten Krisen Afrikas. Gleichzeitig
  die zweitgrößte Ernährungskrise und drittgrößte Binnenvertriebenen-Krise weltweit.
  Insgesamt ca. 5,9 Millionen Menschen sind binnenvertrieben und 27 Millionen Menschen
  von Ernährungsunsicherheit betroffen. Sexualisierte Gewalt grassiert: Laut den Vereinten
  Nationen wird im Ostkongo alle vier Minuten eine Frau vergewaltigt, alle dreißig
  Minuten ein Kind. Staatsministerin Güler wird daher die Panzi-Klinik des Nobelpreisträgers
  Dr. Mukwege in Kinshasa besuchen und mit Überlebenden sprechen. Gemeinsam mit Vertretern
  deutscher Unternehmen wird sie mit Entscheidungsträgern und Firmen im Energie- und
  Rohstoffbereich zu Möglichkeiten vertiefter Zusammenarbeit sprechen. Staatsministerin
  Güler wird zudem Gespräche zur humanitären Lage und dem deutschen Engagement führen.
  Deutschland hat die Menschen in der Demokratischen Republik Kongo seit 2022 mit
  humanitärer Hilfe im Wert von 231 Millionen Euro unterstützt.'
