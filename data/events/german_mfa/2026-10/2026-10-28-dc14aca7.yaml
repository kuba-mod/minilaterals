title: Außenminister Wadephul vor seiner Abreise nach Panama und in die USA zum G20
  Außenministertreffen
text: 'Vor seiner Abreise nach Panama und in die USA zum G20 Außenministertreffen
  sagte Außenminister Johann Wadephul (28.10.2026): Ich fahre zum G20 -Außenministertreffen
  nach Atlanta, um für das Prinzip Freiheit in den internationalen Wirtschaftsbeziehungen
  zu werben. Als exportorientierte Nation sind wir auf offene Handelsrouten, stabile
  Energiepreise, resiliente Lieferketten und einen verlässlichen Zugang zu globalen
  Märkten angewiesen. Heute stehen viele dieser Wachstums-Voraussetzungen auf dem
  Spiel: In der Straße von Hormus und am Bab-al-Mandab wird die freie Seefahrt massiv
  eingeschränkt, was die Energiepreise weltweit in die Höhe treibt. Russlands immer
  aggressiveres Vorgehen, auch gegen Handelsschiffe im Schwarzen Meer, gefährdet die
  globale Ernährungssicherheit. Auch wenn wir im G20 -Kreis teils aus sehr unterschiedlichen
  Perspektiven auf die Welt schauen, so ist für die überwältigende Mehrheit doch klar:
  Russland und der Iran müssen endlich aufhören, Handelswege in Geiselhaft zu nehmen
  und damit Wirtschaftskrisen und Hunger zu provozieren. Denen, die in einer Zeit
  der Zerrüttung nach fairer Zusammenarbeit suchen, bieten wir unser Netz globaler
  Partnerschaften. Die G20 sind dafür prädestiniert, dieses Netz noch enger zu spannen:
  Mit Ländern wie etwa Indien, Indonesien, Saudi-Arabien, der Türkei, Brasilien oder
  Mexiko teilen auch zahlreiche strategische Interessen. Mit ihnen wollen wir unsere
  Wirtschaftsbeziehungen vertiefen und uns im gemeinsamen Interesse für belastbare
  internationale Regeln einsetzen. So erschließen wir Chancen für unsere Unternehmen,
  sichern Arbeitsplätze und erreichen eine verlässliche Versorgung mit kritischen
  Rohstoffen. Vor dem G20 -Treffen werde ich nach Panama reisen: Das Land setzt sich
  gemeinsam mit uns für eine starke multilaterale Ordnung ein und ist der wichtigste
  Markt für die deutsche Wirtschaft in Zentralamerika. Der Panamakanal verbindet Weltmeere
  und ist damit eine Lebensader des globalen Handels. Mit den Einschränkungen der
  Navigationsfreiheit auf anderen Seewegen ist der Kanal heute wichtiger denn je –
  in den vergangenen 12 Monaten durchquerte ihn eine Rekordmenge von 521 Millionen
  Tonnen an Gütern. Er ist damit auch für die deutsche Wirtschaft von strategischer
  Bedeutung. Ich bin Panama sehr dankbar dafür, dass es diesen Seeweg so verantwortungsvoll
  unterhält und zukunftssicher macht, aber auch grundsätzlich eine auf Ausgleich bedachte
  Rolle in seiner Region spielt.'
