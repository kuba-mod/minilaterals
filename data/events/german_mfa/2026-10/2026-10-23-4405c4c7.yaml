title: Außenminister Wadephul vor seiner Abreise nach Istanbul
text: 'Vor seiner Abreise nach Istanbul zur Teilnahme am Treffen der Außenminister
  der E4 (Deutschland, Frankreich, Großbritannien, Italien) und R4 (Ägypten, Pakistan,
  Saudi-Arabien, Türkei) erklärte Außenminister Wadephul heute (23.10.2026): Der Konflikt
  um die Straße von Hormus, die Angriffe der Huthi im Jemen, auf Saudi-Arabien und
  die freie Seeschifffahrt, aber auch die Folgen immer stärker eskalierender russischer
  Angriffe auf Getreidelieferungen im Schwarzen Meer – diese massiven Herausforderungen
  können wir nur bewältigen, wenn wir über etablierte Formate hinaus an einem Strang
  ziehen. Deswegen treffe ich heute auf Initiative Deutschlands und der Türkei in
  Istanbul unsere Partner aus Frankreich, Großbritannien, Italien sowie Ägypten, Pakistan,
  Saudi-Arabien und der Türkei. Uns eint, dass diese festgefahrenen Konflikte auch
  massive Auswirkungen auf die wirtschaftliche Lage und Sicherheit unserer Länder
  haben – und der Wille, neue Wege für Lösungen zu suchen. Wir acht setzen gemeinsam
  ein Zeichen: Wir nehmen nicht hin, dass Iran und die Huthi-Milizen den Welthandel
  erpressen und die Versorgung der Welt mit Energie und Düngemitteln weiter im Würgegriff
  halten. Die willkürlichen Angriffe auf die freie Schifffahrt und die Nachbarländer
  müssen enden. Denn für die Menschen in der Region, die Hunger leiden oder Sorge
  haben, in den eigenen vier Wänden nicht mehr sicher zu sein, ist die andauernde
  Unsicherheit nicht akzeptabel. Das gilt darüber hinaus auch für uns in Europa und
  die ganze Welt. Wir alle spüren die Auswirkungen der Angriffe auf die Seewege –
  sei es an der Tankstelle oder im Supermarkt. Andernorts drohen Hungersnöte, wenn
  Düngemittel nicht rechtzeitig dort ankommen, wo sie zentral für die Grundversorgung
  sind. Auch Russland hat die freie Schifffahrt im Schwarzen Meer und mit ihr die
  Lebensader für so viele Menschen ins Fadenkreuz genommen. Mit Angriffen auf Getreidelieferungen
  nimmt Russland eine Nahrungsmittelknappheit im globalen Süden wissentlich in Kauf.
  Dies trifft die Ärmsten der Welt, deren Versorgung ganz besonders von Weizen abhängt
  – und auch unsere Partner, die Türkei zum Beispiel als größtes weizenverarbeitendes
  Land für den Welthandel. Bei unserem ersten Treffen in diesem Format wollen wir
  Europäer und die vier Regionalmächte vereint ausloten, wie wir Bewegung in die Konflikte
  in der Straße von Hormus, am Bab al-Mandab und im Schwarzen Meer bringen können.'
