title: Gemeinsame Erklärung zu den Sanktionen gegen die Demokratische Volksrepublik
  Korea (DVRK)
text: Der Wortlaut der folgenden Erklärung wurde von Australien, Deutschland, Frankreich,
  Italien, Japan, Kanada, der Republik Korea, Neuseeland, den Niederlanden, dem Vereinigten
  Königreich, den Vereinigten Staaten und der Europäischen Union veröffentlicht. Im
  Laufe des Oktobers und am heutigen Tag haben die Europäische Union ( EU ) sowie
  die Regierungen Australiens und der Vereinigten Staaten Sanktionen umgesetzt, die
  sich gegen den Einsatz von Arbeitskräften im Ausland durch die Demokratische Volksrepublik
  Korea (DVRK), gegen böswillige Cyberaktivitäten sowie Akteure richten, die an illegaler
  Zusammenarbeit zwischen der DVRK und Russland beteiligt sind. Ihre Maßnahmen stehen
  für ihre Bemühungen, die Fähigkeit der DVRK zur rechtswidrigen Entwicklung von Massenvernichtungswaffen
  (MVW) und ballistischen Raketen zu unterbinden sowie der illegalen militärischen
  Zusammenarbeit zwischen der DVRK und Russland entgegenzuwirken. Diese Einschätzungen
  haben detaillierte Berichte des Multilateralen Sanktionsüberwachungsteams (MSMT)
  zur Grundlage, das die Nichteinhaltung von Resolutionen des VN -Sicherheitsrats
  durch die DVRK beobachtet und darüber berichtet, solange das nach Resolution 1718
  des VN -Sicherheitsrats eingesetzte Expertenpanel nicht tagt, weil Russland 2024
  gegen die Verlängerung seines Mandats ein Veto eingelegt hat. Die ersten beiden
  Berichte des MSMT zeichneten die rechtswidrige militärische Zusammenarbeit der DVRK
  mit Russland sowie Betrugsfälle durch IT-Arbeitskräfte mittels Cyber-Technologien
  nach; beides dient der Finanzierung der illegalen Waffenprogramme Pjöngjangs. Im
  September 2026 veröffentlichte das MSMT seinen dritten Bericht, in dem der Einsatz
  von Arbeitskräften durch die DVRK im Ausland, mit dem sie Einnahmen für ihre Programme
  zur Entwicklung von MVW und ballistischen Raketen generiert, detailliert beschrieben
  wird. Das MSMT wird weiterhin die Versuche der DVRK, gegen VN -Sanktionen zu verstoßen
  oder diese zu umgehen, beobachten, offenlegen und darüber Bericht erstatten. Das
  MSMT und die EU bekräftigen unser Bekenntnis zu einer vollständigen, nachprüfbaren
  und unwiderruflichen Entnuklearisierung der DVRK, fordern sie auf, ihre illegalen
  Programme zur Entwicklung von MVW und ballistischen Raketen aufzugeben, und ergreifen
  Maßnahmen, um Versuchen der DVRK, gegen VN -Sanktionen zu verstoßen oder diese zu
  umgehen, entgegenzuwirken. Wir setzen uns weiterhin mit Nachdruck für die Umsetzung
  aller DVRK-bezogenen Resolutionen des VN -Sicherheitsrats ein. Wir rufen alle VN
  -Mitgliedstaaten und insbesondere die ständigen Mitglieder des Sicherheitsrats dazu
  auf, diese Resolutionen in vollem Umfang umzusetzen.
