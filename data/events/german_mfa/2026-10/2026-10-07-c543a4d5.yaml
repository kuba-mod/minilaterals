title: Rede von Außenminister Wadephul im Bundestag zum Partnerschaftsabkommen der
  EU mit den vier Mercosur-Staaten
text: 'Kaum etwas hören wir lieber als Nachrichten über positive Aussichten für die
  deutsche Wirtschaft und steigende Handelsvolumina. Ich kann dazu sagen: Zum Glück
  haben wir Mercosur; denn dieses Freihandelsabkommen liefert uns genau diese erfreulichen
  Nachrichten. Es geht hier um eine der weltweit größten Freihandelszonen mit über
  715 Millionen Einwohnern. Seit gut 150 Tagen wird der Handelsteil vorläufig angewandt
  und bringt seitdem ganz reale Erleichterungen für unsere Wirtschaft. Wir sehen Zölle,
  die sinken. Wir erleben einen besseren Zugang zu öffentlicher Beschaffung und Dienstleistungsmärkten
  in Lateinamerika. Liebe Kolleginnen und Kollegen, Mercosur wirkt. Nehmen wir das
  Beispiel Brasilien: Im August 2026 sind die EU -Exporte nach Brasilien im Vergleich
  zum Vorjahr um fast 12 Prozent gestiegen. Andersherum sind die Exporte aus Brasilien
  in die Europäische Union sogar um über 46 Prozent gestiegen. Wir sehen also sehr
  deutlich, wie viel Dynamik in diesen neuen Partnerschaften steckt. Wir hören von
  begeisterten deutschen Unternehmen, die den jetzt vereinfachten Zugang zu kritischen
  Rohstoffen nutzen wollen. Da geht es um Seltene Erden aus Brasilien oder Kupfer
  aus Argentinien. Das ist Diversifizierung. Und das in Zeiten, in denen manch ein
  Staat auf Protektionismus setzt, in denen Handelsbarrieren und Zölle als Druckmittel
  eingesetzt werden. Wir setzen auf Freihandel! Gerade bei Rohstoffbezugsquellen ist
  es unerlässlich, dass wir unabhängiger werden. Das EU -Mercosur-Abkommen führt uns
  da auf den richtigen Weg. Davon profitiert die deutsche, die europäische Industrie.
  Davon profitieren die deutschen, die europäischen Unternehmen und natürlich die
  Unternehmen in den Mercosur-Ländern. Von günstigen Preisen und von gemeinsamen Standards
  profitieren die Menschen in den beteiligten Ländern, und um die geht es ja am Ende.
  Lassen Sie mich den Blick etwas weiter nach vorne bis zum Jahr 2040 richten. Das
  EU -Mercosur-Abkommen wird, so die Prognose, das Bruttoinlandsprodukt der Europäischen
  Union um über 77 Milliarden Euro steigern. Das ist enorm. Besonders Kernbereiche
  unserer deutschen Wirtschaft, unser Maschinenbau, die Automobilindustrie und die
  Chemiebranche, werden hier einen ordentlichen Rückenwind spüren. Aber auch in anderen
  Branchen, wie Cleantech oder auch Dienstleistungen, steckt großes Potenzial. Das
  ist mir besonders wichtig: Das EU -Mercosur-Abkommen ist mehr als ein cleverer Wirtschaftsdeal.
  Dieser wirtschaftliche Meilenstein ist auch ein wichtiges politisches Signal, ein
  Zeichen, dass wir als Demokratien weltweit zusammenstehen und auf regelbasierten
  Handel setzen, dass wir handlungsfähig sind, auch wenn uns räumlich Tausende von
  Kilometern trennen. Wir als Bundesregierung pflegen daher einen kurzen Draht in
  die entsprechenden Länder. Ich selbst bin zuletzt im Juni in Begleitung einer Wirtschaftsdelegation
  nach Paraguay, Argentinien und Brasilien gereist; denn das ist Außenpolitik, die
  wirtschaftliche Vernunft mit gemeinsamen Werten verbindet. Wenn ich auf diesen Reisen
  bin, dann agiere ich entlang unserer nationalen Interessen, aber auch entlang europäischer
  Ziele. Denn damit wir uns auf der Weltbühne überhaupt behaupten können, müssen wir
  unser gesamtes europäisches Gewicht in die Waagschale werfen. Genau deswegen setze
  ich mich weiterhin für eine ambitionierte, aktive EU -Freihandelsagenda ein. Nicht
  nur mit Mercosur oder mit Kanada, wo das Abkommen CETA für den Anstieg des Handels
  um über 80 Prozent gesorgt hat, sondern auch mit anderen Weltregionen sind wir an
  solchen Abkommen dran, zum Beispiel mit Indien oder Indonesien. Abkommen, die wir
  schon haben, optimieren wir, damit unsere deutschen, unsere europäischen Unternehmen
  sie noch besser nutzen können, damit aus unseren dicken Vertragswerken spürbare
  wirtschaftliche Vorteile werden. Liebe Kolleginnen und Kollegen, zur Wahrheit gehört
  auch: Beim EU -Mercosur-Abkommen ist die Reise noch nicht zu Ende. Damit das Abkommen
  vollständig in Kraft treten kann, brauchen wir die Ratifizierung aller EU -Mitgliedstaaten
  und die Zustimmung des Europäischen Parlamentes. Es ist richtig, dass das Europäische
  Parlament das Abkommen zur Prüfung an den EuGH verwiesen hat. Die Bundesregierung
  ist jedoch fest davon überzeugt, dass das Abkommen mit den EU -Verträgen im Einklang
  steht. Das haben wir auch in unserer eigenen Stellungnahme im Verfahren noch einmal
  deutlich unterstrichen. Und wir sind ebenso sicher, dass die vorläufige Anwendung
  und die greifbaren Ergebnisse, die wir schon jetzt haben, die Kritiker des Abkommens
  überzeugen werden. Liebe Kolleginnen und Kollegen, wir haben einen Motor gestartet,
  der bereits auf den ersten Metern erfolgreich läuft. Jetzt müssen wir dafür sorgen,
  dass wir den ganzen Wagen stabil und vor allem langfristig auf der Straße halten.
  Unterstützen Sie bitte diesen Abschluss!'
