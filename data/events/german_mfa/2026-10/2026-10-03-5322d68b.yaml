title: Staatsministerin Güler vor ihrer Abreise in die Vereinigten Staaten von Amerika
text: 'Bei ihrer Abreise in die Vereinigten Staaten von Amerika erklärte Staatsministerin
  Serap Güler heute (03.10.2026): Am Tag der deutschen Einheit werden wir heute in
  St. Louis, Missouri, ein neues Goethe-Institut eröffnen. Im Mittleren Westen der
  USA verbinden sich Tradition und Zukunftsgewandtheit. Diese Region ist Deutschland
  auf vielfältige Weise nah. Viele Menschen haben deutsche Wurzeln, fühlen sich Deutschland
  persönlich verbunden. Außerdem sind renommierte deutsche Industrie- und Technologieunternehmen
  hier ansässig. Hier kann das Goethe-Institut ein neuer Raum der Begegnung werden.
  Indem Deutschland hier präsent ist, stärken wir gleichzeitig kulturelles Erbe und
  Zukunftstechnologien. Hier können wir Menschen erreichen, die jenseits der Küsten
  in den amerikanischen „Heartlands“ leben. Das nun achte Goethe-Institut in den USA
  wird ein vielfältiges Programm zu Kultur- und Bildung anbieten. Dieser gesellschaftspolitische
  Dialog wird den deutsch-amerikanischen Austausch weiter stärken. Ich könnte mir
  keinen besseren Tag für diese Eröffnung vorstellen als den deutschen Nationalfeiertag.
  Wir unterstreichen damit ganz konkret die engen deutsch-amerikanischen Beziehungen
  und die Freundschaft zwischen unseren Ländern. Hier werde ich auch das Bayer-Werk
  besichtigen, ein herausragendes Beispiel für unsere enge Zusammenarbeit in den Bereichen
  Wirtschaft und Forschung. Über 6.000 deutsche Unternehmen haben fast eine Million
  Arbeitsplätze in den USA geschaffen. Deutschland zählt zu den größten ausländischen
  Investoren in den USA und ist der zweitgrößte ausländische Arbeitgeber in Missouri.
  In St. Louis und anschließend in Chicago, Illinois, werde ich auch Vertreterinnen
  und Vertreter von Vereinen treffen, die sich für die Förderung der deutschen Kultur,
  das zivilgesellschaftliche Miteinander unserer Länder und den transatlantischen
  Austausch stark machen. Außerdem freue ich mich darauf, die Zukunft der deutsch-amerikanischen
  Freundschaft zu erleben, wenn ich in Chicago eine unserer 134 deutschen Auslandschulen
  besuchen darf.'
