title: Staatsminister Gunther Krichbaum zu seiner Abreise nach Kanada
text: 'Zu seiner Reise nach Kanada erklärte Staatsminister Gunther Krichbaum (27.10.2026):
  Mit Kanada sind wir traditionell eng und freundschaftlich verbunden. Dieses Jahr
  feiern wir 75 Jahre diplomatische Beziehungen. In dieser Zeit haben Deutschland
  und Kanada eine Partnerschaft aufgebaut, die auf Vertrauen, geteilter Verantwortung,
  geteilten Werten und dem gemeinsamen Einsatz für eine regelbasierte internationale
  Ordnung beruht. Unsere Länder stehen zusammen: als Verbündete in der NATO , als
  Partner in der G7 – dem Zusammenschluss führender Industrienationen – sowie den
  Vereinten Nationen. Wir stehen zudem zusammen als gleichgesinnte Demokratien, die
  sich für Frieden, Sicherheit und Stabilität in einer immer volatileren Welt einsetzen.
  In Zeiten geopolitischer Unsicherheiten ist diese Partnerschaft wichtiger denn je.
  Nicht nur für Deutschland, sondern auch für die Europäische Union ist Kanada ein
  Wunsch- und Schlüsselpartner. Daher ist Deutschland ein überzeugter Unterstützer
  einer engeren Partnerschaft zwischen der EU und Kanada. Auch als NATO -Verbündete
  stehen wir füreinander ein und unterstützen gemeinsam die Ukraine. In Kanada treffe
  ich unter anderem meine Kollegin im Au ßenministerium, die Parlamentarische Staatssekretärin
  Mona Fortier. Zudem spreche ich mit Multiplikatorinnen und Multiplikatoren aus Politik
  & Wirtschaft. Mit Studierenden aus Kanada, Deutschland und Frankreich werde ich
  mich zum Thema „Europa & Kanada in geopolitisch stürmischen Zeiten“ austauschen.
  Der Staatsminister für Europa im Auswärtigen Amt und Mitglied des Deutschen Bundestags,
  Gunther Krichbaum, reist vom 27.10.-01.11.2026 nach Kanada. Im Zentrum der Reise
  stehen Gespräche mit der Parlamentarischen Staatssekretärin im Au ßenministerium
  Mona Fortier und mit kanadischen Parlamentsabgeordneten. Zudem trifft Staatsminister
  Krichbaum Vertreterinnen und Vertreter aus der kanadischen Politik, Wirtschaft und
  Gesellschaft. Hauptthemen sind die bilateralen Beziehungen und die Beziehungen der
  EU mit Kanada.'
