title: Gemeinsame Erklärung der Außenministerinnen und -minister Dänemarks, Deutschlands,
  Frankreichs, Italiens, Japans, Kanadas, der Niederlande und des Vereinigten Königreichs
text: Wir, die Unterzeichnerstaaten des Römischen Statuts des Internationalen Strafgerichtshofs
  ( IStGH ), bekräftigen unsere fortgesetzte und unbeirrbare Unterstützung der Unabhängigkeit,
  Unparteilichkeit und Integrität des IStGH . Als engagierte Unterstützer des IStGH
  bedauern wir die Ankündigung der Vereinigten Staaten, Sanktionen gegen den Gerichtshof
  zu verhängen, und sprechen uns entschieden dagegen aus. Mit Anerkennung nehmen wir
  die Arbeit des Gerichtshofs zur Kenntnis, sich auf solche Maßnahmen vorzubereiten,
  damit die weitere Wahrnehmung seines Mandats im Rahmen des Römischen Statuts gewährleistet
  ist, und unterstreichen, dass wir uns konsequent dafür einsetzen, dem Gerichtshof
  dies zu ermöglichen. Dennoch werden diese Sanktionen, einmal in Kraft gesetzt, erhebliche
  Auswirkungen auf die Arbeit des Gerichtshofs sowie auf sein engagiertes Personal
  und dessen Familien haben. Dieses Personal setzt sich tagtäglich dafür ein, dass
  diejenigen, denen schwerste Völkerrechtsverbrechen zur Last gelegt werden, vor Gericht
  gebracht werden und ihre Opfer Unterstützung erhalten. Wir bleiben geeint in unserem
  Eintreten für die Unterstützung des IStGH und sind weiterhin entschlossen, in Vorbereitung
  der im Dezember 2026 stattfindenden Versammlung der Vertragsstaaten konstruktive
  und inklusive Gespräche mit Nichtvertragsstaaten zu führen. Wir werden auch in Zukunft
  zusammenarbeiten, um die wichtige Arbeit des Gerichtshofs zu unterstützen, das regelbasierte
  internationale System aufrechtzuerhalten und dem Recht zur Durchsetzung zu verhelfen.
