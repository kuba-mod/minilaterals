title: Gemeinsame Erklärung der für Europaangelegenheiten zuständigen Staatssekretäre
  beziehungsweise Staatsminister Ignacy Niemczycki, Benjamin Haddad und Gunther Krichbaum,
  Giżycko, 25.–26. Oktober 2026
text: 'Seit nunmehr 35 Jahren dient das Weimarer Dreieck als wertvolle Plattform der
  europabezogenen Zusammenarbeit zwischen Deutschland, Frankreich und Polen: europäische
  Integration, europäische Identität sowie Stärke und Sicherheit Europas. Unsere Zusammenarbeit
  entwickelt sich – wie dies schon unsere Außenminister Genscher, Dumas und Skubiszewski
  einst so treffend dargelegt haben – in dem Bewusstsein, dass Polen, Deutschland
  und Frankreich gemeinsam Verantwortung für eine gedeihliche Zukunft Europas tragen.
  Wir treffen uns in Giżycko, in der Woiwodschaft Ermland-Masuren, einer der östlichen
  Grenzregionen Polens, die an den russischen Oblast Kaliningrad grenzt. Diese Regionen
  sehen sich aufgrund der aggressiven und feindseligen Politik Russlands mit erheblichen
  sicherheitspolitischen und wirtschaftlichen Herausforderungen konfrontiert. Bis
  auf Weiteres stellt Russland die größte Bedrohung der euroatlantischen Sicherheit
  dar. Deshalb sind wir weiterhin entschlossen, die Ostflanke der EU und der NATO
  zu stärken und die Sicherheit aller Land-, Luft- und Seegrenzen der EU und der NATO
  zu gewährleisten sowie gleichzeitig Europas Verteidigungsfähigkeiten und seine rüstungsindustrielle
  Basis zu stärken. Europa muss mehr Verantwortung für seine eigene Verteidigung übernehmen
  und sich besser ausrüsten, damit es handlungsfähig ist und heutige sowie künftige
  Herausforderungen und Bedrohungen eigenständig und in abgestimmter Weise bewältigen
  kann. Wir setzen uns ferner für die Entwicklung einer robusteren und wettbewerbsfähigeren
  technologischen und industriellen Basis der europäischen Verteidigung ein, auch
  im Rahmen bestehender EU -Programme wie SAFE und EDIP sowie des nächsten mehrjährigen
  Finanzrahmens. Aufbauend auf der Weimarer Erklärung der Außenminister unserer drei
  Länder vom 3. September erörterten wir die folgenden Themen unserer Europapolitik:
  Unterstützung der Ukraine, ausländische Informationsmanipulation und Einflussnahme
  (foreign information manipulation and interference, FIMI), Erweiterung, mehrjähriger
  Finanzrahmen, Wettbewerbsfähigkeit und Industrie. Wir sind entschlossen, im Geiste
  des gegenseitigen Vertrauens und des gemeinsamen Engagements für ein starkes und
  sicheres Europa im Lichte dieser Prioritäten weiter zusammenzuarbeiten.'
