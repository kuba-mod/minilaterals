title: Außenminister Wadephul vor seiner Abreise nach Warschau
text: 'Vor seiner Abreise nach Warschau erklärte Außenminister Wadephul heute (13.10.2026):
  Die Ukraine braucht unsere Unterstützung dringender denn je. Mit massiven Luftangriffen
  setzt das russische Regime voll auf Eskalation. Allein in der vergangenen Woche
  hat Putins Raketenterror über 150 unschuldigen Menschen das Leben geraubt und noch
  viel mehr verletzt. Menschen, die nichts anderes wollten, als in Frieden und Freiheit
  zu leben. Jeden Tag führt Putin uns aufs Neue vor Augen, dass wir Freiheit und Sicherheit
  in Europa keine Selbstverständlichkeiten mehr sind. Europas Verteidigung beginnt
  mit der Ukraine – aber sie endet dort nicht. Auch wir sind im Fadenkreuz. Deswegen
  komme ich heute in Warschau mit unseren engen Freunden aus Polen, Norwegen und dem
  Vereinigten Königreich beim „Warsaw Security Forum“ zusammen. Wir sind verlässliche
  Unterstützer der Ukraine und stärken unsere gemeinsame Sicherheit und Verteidigungsfähigkeit
  in der NATO . Gemeinsam übernehmen wir Verantwortung, damit Europas Freiheit auch
  von uns als Europäern verteidigt wird. Jetzt ist der Zeitpunkt, um den Druck auf
  Russland zu erhöhen, statt unsere eigene Deckung fallen zu lassen. Gemeinsam mit
  unseren EU -Partnern haben wir deshalb gestern die bisher umfangreichsten Sanktionen
  in der Geschichte der EU auf den Weg gebracht. Diese Sanktionen treffen Unternehmen
  und Personen, die für Russlands Kriegsführung kritisch sind. Darunter sind Drohnenhersteller,
  Hersteller ballistischer Raketen und ihre Vorstände. Das verdeutlicht Putin: Seine
  Versuche, uns zu spalten oder zu verunsichern, werden scheitern. Gemeinsam mit meinen
  europäischen Kollegen senden wir klares Signal aus Warschau nach Moskau: Europa
  ist handlungsfähig und steht geschlossen hinter der Ukraine.'
