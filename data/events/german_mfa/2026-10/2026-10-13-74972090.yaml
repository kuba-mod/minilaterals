title: Außenminister Wadephul zur Wahl Deutschlands in den UN-Menschenrechtsrat
text: 'Zur Wahl Deutschlands in den UN -Menschenrechtsrat sagte Außenminister Wadephul
  heute (13.10.2026): Kein Mensch darf dafür bestraft werden, Freiheit und Rechtsstaatlichkeit
  zu fordern. Kinder müssen die Möglichkeit haben, zur Schule zu gehen - unabhängig
  von ihrem Geschlecht. Alle Menschen müssen sicheren Zugang zu Trinkwasser haben.
  Diese Beispiele zeigen, dass Menschenrechte keine abstrakten Formeln sind. Im Gegenteil:
  Sie sind die Grundlage für ein Leben in Würde. Menschenrechte zu verletzen bedeutet
  auch, grundlegende menschliche Errungenschaften zu bedrohen. Wir sind fest entschlossen,
  diese Errungenschaften und die Würde jedes und jeder Einzelnen zu verteidigen. Das
  hat unsere Bewerbung für einen Sitz im UN -Menschenrechtsrat in Genf geleitet -
  und das wird auch unser Handeln dort bestimmen. Ich danke der UN -Generalversammlung
  für ihr Vertrauen bei der heutigen Wahl in New York. Wir werden uns dieses Vertrauens
  würdig erweisen. Wir stehen an der Seite aller Menschen in Not und setzen uns für
  den Erhalt ihrer Rechte ein. Wir werden unsere Mitgliedschaft nutzen, um gemeinsam
  mit unseren Partnern den Menschenrechtsrat zu stärken und den Schutz von Menschenrechten
  weltweit zu verbessern.'
