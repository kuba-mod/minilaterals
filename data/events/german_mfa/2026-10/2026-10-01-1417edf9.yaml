title: Rede von Außenminister Wadephul zum Tag der Deutschen Einheit in Rom
text: 'Sehr geehrter Präsident des Verfassungsgerichts, Sehr geehrter Vizepräsident
  der Abgeordnetenkammer, Sehr geehrter Herr Abgeordneter Calovini, Sehr geehrte Damen
  und Herren Abgeordnete und Senatoren, Sehr geehrter Herr Zentralbankgouverneur,
  Exzellenzen, sehr geehrte Vertreterinnen und Vertreter des Diplomatischen Korps,
  Signor Presidente della Corte Costituzionale, Signor Vice Presidente della Camera
  dei Deputati, Eccelence, stimati rappresentanti del corpo diplomatico, es ist eine
  große Freude, mit Ihnen allen hier zusammenzukommen. Sehr geehrter Herr Botschafter,
  lieber Herr Bagger, vielen Dank, dass Sie uns dies zusammen mit Ihrem Team ermöglichen.
  Der Tag der deutschen Einheit erinnert uns an einen epochalen Umbruch. È per me
  una grande gioia essere qui con tutti Voi. Stimati Ambasciatore, caro Signor Bagger,
  grazie per avere reso questo possible insieme al Suo team. Il Giorno dell’Unità
  tedesca ci ricorda una transformazione epocale. Die Menschen in der DDR kämpften
  friedlich für ihre Freiheit gegen eine kommunistische Diktatur, und schufen ein
  Momentum, in dem die zwei deutschen Staaten wiedervereinigt werden konnten. Was
  für ein Glück lag in dieser Freiheitsbewegung. Sie zeigt uns: wenn Menschen die
  Zuversicht haben, dass sie auch angesichts der Krisen in der Welt ihre Zukunft selbst
  gestalten können, dann vollbringen sie scheinbar Unmögliches. Meine Damen und Herren,
  vergangene Woche war ich in New York. Ich habe dort eine Verunsicherung, eine große
  Unruhe gespürt, angesichts der vielen Krisen in der Welt. Das war Kernthema der
  vielen bi- und multilaterale Gespräche und Diskussionen. Doch es ging eben auch
  um Handeln, um Engagement, es ging darum, wie wir gemeinsam, als Partner etwas bewegen
  können, um uns den Krisen entgegenzustellen. Und genau aus solchen Partnerschaften
  ziehe ich die Zuversicht, die es angesichts dieser Krisen braucht. So auch aus der
  engen Partnerschaft, aus der echten Freundschaft zwischen unseren Ländern, zwischen
  Italien und Deutschland. Heute haben wir einen Baum gepflanzt, eine Eiche, hier
  im Garten der Residenz. Diese Eiche ist der erste von 75 Bäumen, die bis Ende des
  Jahres in ganz Italien gepflanzt werden. Ein Baum für jedes Jahr der diplomatischen
  Beziehungen unserer Länder. Das was damals unter Adenauer und de Gasperi begann,
  ist heute eine feste Partnerschaft geworden. Adenauer und Gasperi führten unsere
  Länder aus den Trümmern des zweiten Weltkriegs in eine freie, demokratische und
  vor allem europäische Zukunft. In den vergangenen 75 Jahren ist aus unseren Ländern
  ein europäisches Kraftzentrum entstanden. Das ist sozusagen der Baum, den Adenauer
  und Gasperi damals einpflanzten. Diese Errungenschaften sind nicht selbstverständlich.
  Meine Damen und Herren, ich möchte zum Tag der deutschen Einheit auch ein paar Worte
  zu den jüngsten Landtagswahlen in Deutschland sagen. Ihre Ergebnisse wurden im Ausland
  zur Kenntnis genommen, auch hier in Italien. Die deutschen Institutionen und unser
  Grundgesetz sind demokratisch, wehrhaft und stabil. Wir sind uns in der Bundesregierung
  der Verantwortung Deutschlands in Europa auch angesichts unserer Geschichte sehr
  bewusst. Die freiheitlich demokratische Verfasstheit unseres Staates halten wir
  aufrecht, so wie die feste Verankerung Deutschlands in Europa. Wir setzen uns jeden
  Tag für ein starkes und verlässliches europäisches Deutschland ein. Das Stabilität
  zeigt, angesichts der Krisenlagen in der Welt. Dafür braucht es politische Stabilität,
  aber auch eine stabile wirtschaftliche Basis. Und hier sind Deutschland und Italien
  nach wie vor führend. Liebe Gäste, unsere Länder sind heute die größten Industrienationen
  Europas. Gemeinsam stehen sie für 40 % der Industrieproduktion der Europäischen
  Union. Deutschland und Italien sind auch die größten Exportnationen Europas. Ca.
  38 % der europäischen Exporte in Länder außerhalb der EU kommen aus unseren Ländern
  – insbesondere Industrieexporte. Wir wollen, dass wir diese starken Positionen nicht
  nur aufrechterhalten, sondern ausbauen. Auch deswegen hatten wir sehr erfolgreiche
  Regierungskonsultationen Anfang dieses Jahres hier in Rom. Deutschland und Italien
  sind die Heimat von europäischen Erfolgsgeschichten. Ich blicke da sehr konkret
  auf Erfolge wie die deutsch-italienische Forschungskooperationen für die Raumfahrt,
  Partnerschaften im Verteidigungsbereich wie zwischen Leonardo und Rheinmetall. Unsere
  engste Abstimmung über verschiedene Gesetzesvorhaben in Brüssel, wie zum Beispiel
  zur Migration oder gemeinsame Initiativen u.a. zur Steigerung der Wettbewerbsfähigkeit.
  Und ich blicke auf mehr als 400 kommunale Partnerschaften, die die Bürgerinnen und
  Bürger unserer Länder tagtäglich zusammenbringen. Meine Damen und Herren, 2026 haben
  wir das „Jahr der Gelegenheiten“ genannt. Mir ist besonders wichtig, dass aus dem
  Momentum dieses Jahres Projekte und Initiativen entstehen, die bleiben. Und unsere
  Länder mit Zuversicht erfüllen. Und in 75 Jahren ist aus dem Baum hier im Garten
  eine mächtige Eiche geworden, die unseren Nachfahren Schatten spenden wird – auch
  dieser Gedanke erfüllt mich mit Zuversicht. Meine Damen und Herren: „E viva l’amicizia
  tra Italia e Germania“!'
