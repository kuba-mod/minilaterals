title: Rede von Staatsministerin Güler im Deutschen Bundestag zur Verlängerung des
  UNMISS-Mandats
text: 'Sehr geehrte Damen und Herren Abgeordnete, die Lage in Südsudan bleibt besorgniserregend.
  Drei Viertel der Bevölkerung sind für ihr Überleben auf humanitäre Hilfe angewiesen.
  Wir haben es mit einer der drängendsten humanitären Krisen überhaupt zu tun; einer
  Krise, die weltweit viel zu wenig Aufmerksamkeit erfährt und die auch 15 Jahre nach
  der Unabhängigkeit des Südsudan weiter anhält. Südsudan bleibt einer der fragilsten
  Staaten der Welt. Die Gründe dafür sind vielfältig: langanhaltende, bewaffnete Konflikte,
  große politische Instabilität schlechte Regierungsführung, ein eklatantes Maß an
  Korruption sowie Dürren und Überschwemmungen. Hinzu kommt der verheerende Krieg
  im Nachbarland Sudan, der seine negativen Folgen auch in Südsudan zeigt. Über 1,4
  Mio. Flüchtlinge und Rückkehrer sind seit Kriegsbeginn in Südsudan angekommen. Und
  leider stellen wir auch fest, dass die Regierung in Südsudan zu wenig unternimmt,
  um die Situation für die Menschen im eigenen Land zu verbessern. Wir lassen die
  Menschen in Südsudan nicht alleine. Politisch kommt es vor allem darauf an, dass
  die südsudanesische Regierung sich an das Revitalisierte Friedensabkommen hält.
  Dieses enthält die Verpflichtung, Wahlen durchzuführen, die frei, fair, transparent
  und glaubwürdig ablaufen. Dafür setzen wir uns ein, im Gespräch mit der Regierung
  des Südsudan und mit regionalen Partnern. Allgemein gilt: Nur ein inklusiver politischer
  Dialog zwischen den Parteien kann zu einer dauerhaften Befriedung und einer Verbesserung
  der Lebensbedingungen führen. Gleichzeitig bleibt UNMISS ein unverzichtbarer Stabilitätsanker.
  Die Mission schützt jeden Tag Menschen und ermöglicht humanitäre Hilfe. Sie berichtet
  über Verletzungen von Menschenrechten und dem humanitären Völkerrecht. Sie ist Ausdruck
  der internationalen Solidarität für den jüngsten Staat der Welt. Ich bin den Soldatinnen
  und Soldaten der Bundeswehr, den Polizistinnen und Polizisten des Bundes der Länder
  einschließlich dem deutschen Leiter der UNMISS -Polizeikomponente und den Entwicklungshelferinnen
  und Entwicklungshelfern, unserer Botschaft in Dschuba und all denen, die sich für
  humanitäre Hilfe in Südsudan engagieren dankbar, dass sie unter schwersten Bedingungen
  ihren Dienst leisten. Dies verdient auch die Anerkennung des Deutschen Bundestages.
  Über unser Engagement in der Mission hinaus engagieren wir uns im Bereich der Stabilisierung,
  der humanitären Hilfe und der regierungsfernen Entwicklungszusammenarbeit. Wir leisten
  lebensnotwendige Ernährungshilfe und unterstützen die Gesundheits- und Wasser-,
  Sanitär- und Hygieneversorgung für geflüchtete Personen und Aufnahmegemeinden. Im
  Flüchtlingslager Renk unterstützen unsere Partner beispielsweise ankommende Familien
  und unbegleitete Kinder durch psychosoziale Betreuung, Familienzusammenführungen
  und den Ausbau von Wasser- und Sanitäranlagen, um Krankheitsausbrüche vorzubeugen.
  All das ist konkrete Hilfe, die vor Ort ankommt. Klar ist, die südsudanesische Regierung
  trägt die Verantwortung dafür, dass sich die Situation nachhaltig verbessert – nicht
  die VN -Friedensmission UNMISS . Ohne UNMISS wäre die Lage jedoch noch deutlich
  schlechter. Dies würde zu noch größeren humanitären Bedarfen und Migrationsbewegungen
  führen. Das ist nicht in unserem Interesse. Dieses Interesse wird auch im VN -Sicherheitsrat
  geteilt, der die Mission am 30.04.2026 mit einer klaren Mehrheit der Stimmen verlängert
  hat. Durch die Fortsetzung unserer militärischen Beteiligung an UNMISS zeigen wir
  auch, dass wir uns weiterhin für Blauhelmmissionen engagieren. Wir verdeutlichen,
  dass wir ein verlässlicher Partner der Vereinten Nationen sind, der bereit ist,
  Verantwortung zu übernehmen. Für die Bundesregierung bitte ich Sie deswegen, der
  Fortsetzung des UNMISS -Einsatzes zuzustimmen.'
