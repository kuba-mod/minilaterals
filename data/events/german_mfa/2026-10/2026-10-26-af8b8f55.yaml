title: Erklärung der Mitglieder der Koalition zur Verhinderung von Gräueltaten und
  für Gerechtigkeit in Sudan zu den Gräueltaten in Al-Faschir am 26. Oktober 2025
text: 'Vor einem Jahr, am 26. Oktober 2025, erreichte die Gewalt in und um Al-Faschir
  nach Monaten der Belagerung und eskalierender Angriffe durch die Rapid Support Forces
  (RSF) einen verheerenden Höhepunkt. Zivilistinnen und Zivilisten wurden Opfer entsetzlicher
  Gräueltaten, darunter Massentötungen, ethnisch motivierte Tötungen, summarische
  Hinrichtungen, Folter, Verschwindenlassen, Zwangsrekrutierung, willkürliche Inhaftierungen
  und weit verbreitete sexualisierte und geschlechtsspezifische Gewalt. Ganze Gemeinschaften
  wurden gewaltsam vertrieben und der humanitäre Zugang wurde blockiert, was Hunger,
  Unsicherheit, menschliches Leid und Not verschlimmerte. Die Koalition zur Verhinderung
  von Gräueltaten und für Gerechtigkeit in Sudan steht heute geeint, um an das Leid
  der Opfer und Überlebenden zu erinnern und dieses anzuerkennen und unsere gemeinsame
  Entschlossenheit, weitere Gräueltaten zu verhindern und Verantwortliche zur Rechenschaft
  zu ziehen, zu bekräftigen. Die Ergebnisse der Unabhängigen Internationalen Ermittlungsmission
  der Vereinten Nationen für Sudan haben das Ausmaß und die Schwere der Verstöße gegen
  das humanitäre Völkerrecht sowie die in und um Al-Faschir begangenen Verletzungen
  und Verstöße mit Blick auf die internationalen Menschenrechtsnormen offengelegt.
  Die Koalition unterstützt die VN -Ermittlungsmission und ihre Arbeit und begrüßt
  die kürzlich erfolgte Erneuerung ihres Mandats. Wir begrüßen ferner die Arbeit der
  Ermittlungsmission der Afrikanischen Union sowie ihre Zusammenarbeit mit den VN
  . Ein Jahr später haben noch immer viele Zivilistinnen und Zivilisten mit den Folgen
  dieser Gräueltaten zu kämpfen. Überall in Sudan leidet die Zivilbevölkerung weiterhin
  unter Gewalt, darunter systematische und weit verbreitete sexualisierte Gewalt,
  Vertreibung, Angriffe auf zivile Infrastruktur und Beschränkungen der humanitären
  Hilfe. Der zunehmende Einsatz von Drohnen bei Angriffen, die Auswirkungen auf die
  Zivilbevölkerung haben, sowie auf zivile Infrastruktur erhöht den humanitären Bedarf
  und die Risiken in Bezug auf den Schutz der Bevölkerung. Zusammengenommen zeigt
  dies, dass die Gefahr akut bleibt, dass Gräueltaten in Sudan weiter in großem Umfang
  verübt werden. Die Beschränkungen des humanitären Zugangs und die wiederholten Angriffe
  auf humanitäre Akteure sowie lokale und an vorderster Front tätige Helferinnen und
  Helfer sind inakzeptabel und verstärken das Leid von Millionen sudanesischer Zivilistinnen
  und Zivilisten. Dieser Jahrestag ist eine Mahnung, dass wir gemeinsam handeln müssen,
  um zu verhindern, dass sich solche Ereignisse wiederholen. Gerechtigkeit und Rechenschaftspflicht
  sind unerlässlich, um zu einem dauerhaften Frieden in Sudan zu gelangen. Opfer und
  Überlebende verdienen Gerechtigkeit und Rechenschaftspflicht für die während dieses
  Konflikts begangenen abscheulichen Verbrechen. Diejenigen, die für die schwerwiegenden
  Verstöße und Verletzungen verantwortlich sind, müssen ermittelt und zur Rechenschaft
  gezogen werden. Die Koalition wird weiter mit sudanesischen und internationalen
  Partnern zusammenarbeiten, um glaubwürdige Rechenschaftsprozesse zu fördern, was
  auch die Arbeit des Internationalen Strafgerichtshofs in Bezug auf Darfur umfasst,
  und eine substanzielle Unrechtsaufarbeitung im Transitionsprozess für die Menschen
  in Sudan zu unterstützen. Sudanesische Menschenrechtsverteidigerinnen und -verteidiger
  sowie zivilgesellschaftliche Organisationen in Sudan spielen eine entscheidende
  Rolle bei der Unterstützung von Opfern und Überlebenden, indem sie Missbrauch dokumentieren
  und sicherstellen, dass sudanesische Perspektiven Eingang in die Gestaltung der
  zukünftigen Bemühungen um Rechenschaftspflicht und Gerechtigkeit finden. Sie arbeiten
  oft unter großem persönlichen Risiko und sind unverzichtbare Partner im Streben
  nach Frieden, Gerechtigkeit und Rechenschaftspflicht. Opfer von konfliktbezogener
  sexualisierter Gewalt müssen einen sicheren und vertraulichen Zugang zu medizinischer,
  psychosozialer und juristischer Unterstützung haben. Es gibt keine militärische
  Lösung für diesen Konflikt. Dieser Krieg muss enden. Die Koalition fordert alle
  Parteien auf, das humanitäre Völkerrecht vollumfänglich einzuhalten, auch durch
  den Schutz der Zivilbevölkerung und das Erleichtern eines sicheren, raschen und
  ungehinderten humanitären Zugangs. Ferner fordern wir alle Staaten auf, das Völkerrecht
  einzuhalten und ihren Einfluss zu nutzen, um Zivilpersonen zu schützen, weitere
  Gräueltaten zu verhindern und dazu beizutragen, dass dieser verheerende Konflikt
  endet, unter anderem indem sie den Krieg in Sudan nicht länger mit Waffen unterstützen,
  finanzieren oder anderweitig ermöglichen und indem sie die VN -Sanktionen einschließlich
  des Waffenembargos für Darfur vollständig einhalten. Ein Jahr nach Al-Faschir lautet
  unsere Botschaft ganz klar: Die Opfer werden nicht in Vergessenheit geraten, die
  Stimmen der Überlebenden werden gehört und wir werden uns weiterhin dafür einsetzen,
  dass die Verantwortlichen zur Rechenschaft gezogen werden. Mitglieder der Koalition
  – Dänemark, Deutschland, Europäische Union, Frankreich, Irland, Kanada, Niederlande,
  Norwegen, Schweden, Sierra Leone, Vereinigtes Königreich'
