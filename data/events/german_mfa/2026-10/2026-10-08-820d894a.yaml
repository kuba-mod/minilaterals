title: Eröffnungsrede von Außenminister Wadephul beim Berlin Peace Dialogue 2026
text: 'Sehr geehrte Frau Dr. Leininger, sehr geehrter Herr von Borries, liebe Mitglieder
  des Deutschen Bundestags, wenn ein Land nach einem Krieg zum Frieden zurückfindet,
  liegt das nicht einfach daran, dass die Waffen schweigen. Natürlich endet damit
  die physische Zerstörung, doch enden nicht zwangsläufig auch die inneren Konflikte.
  Um einen gerechten und dauerhaften Frieden zu erreichen, braucht es mehr als nur
  die Einstellung der Feindseligkeiten. Im Dezember 2024 endete die Ära des Assad-Regimes
  – endlich, nach einem brutalen, 14 Jahre währenden Krieg gegen das syrische Volk.
  Das war ein historischer Augenblick, den wir in Deutschland aufmerksam beobachtet
  haben. Denn wir nehmen großen Anteil am Schicksal Syriens, nicht zuletzt, weil mehr
  als eine Million Menschen aus Syrien hier bei uns in Deutschland Zuflucht gefunden
  haben und für viele von ihnen Deutschland ein neues Zuhause geworden ist. Aber auch,
  weil wir als Europäer ein strategisches Interesse an der langfristigen Stabilität
  und am Wiederaufbau des syrischen Staates haben. Ein Staatswesen aufzubauen, das
  Sicherheit, Freiheit und ein Leben in Würde garantiert, ist eine gewaltige Aufgabe.
  Ohne Gerechtigkeit kann es keinen Frieden geben, und ohne Rechenschaftspflicht keine
  Gerechtigkeit. Wenn wir darüber reden, schwerste Menschenrechtsverletzungen der
  Vergangenheit aufzuarbeiten, um einem Land den Weg aus dem Konflikt zu ebnen, dann
  sprechen wir von „Übergangsjustiz“, der Aufarbeitung von Unrecht in Übergangsprozessen.
  Wir müssen die Beweise für Gräueltaten sichern. Wir müssen diese Beweise systematisch
  kategorisieren und dafür sorgen, dass sie auf Dauer erhalten bleiben. Denn nur durch
  ein solches gründliches Vorgehen legen wir den Grundstein für einen wahrhaften und
  gründlichen Prozess der Aufarbeitung. Über die Erhebung von Beweismitteln hinaus
  geht es bei der Unrechtsaufarbeitung in Übergangsprozessen auch darum, zu einem
  neuen Miteinander zu finden. Denn nicht über jede Gräueltat kann vor Gericht verhandelt
  werden. Neben Gerechtigkeit brauchen wir auch Mechanismen, die den Gesellschaften
  zu heilen ermöglichen. Beides ist für den Frieden unerlässlich. Das trifft zu auf
  Syrien, wo Hunderttausende noch immer vermisst werden, wo die gesellschaftlichen
  Gräben tief sind und das massive Trauma des Krieges fortbesteht. Und dennoch leisten
  einheimische Friedensaktivisten jeden Tag Großartiges, indem sie Menschen zusammenbringen
  und den Dialog zwischen Nachbarn in Homs, Aleppo, Latakia und Damaskus anstoßen.
  Städte, in denen Gemeinschaften – nach allem, was geschehen ist – nach Wegen suchen,
  die ein Miteinander wieder möglich machen. Nicht nur, weil das Auswärtige Amt die
  Arbeit einheimischer Friedensaktivisten in Syrien unterstützt. Sondern weil ihr
  Vorbild uns etwas ganz Grundlegendes über Friedenskonsolidierung lehrt: Dauerhafter
  Frieden und langfristige Sicherheit kommen selten auf hochrangigen Treffen zustande,
  sondern sind das Ergebnis beharrlicher Gespräche innerhalb einer Gemeinschaft, angeführt
  von Menschen, die Teil der Gesellschaft vor Ort und am besten mit der Konfliktlage
  vertraut sind. wir kommen heute hier in Zeiten zusammen, die man nicht anders als
  turbulent nennen kann. Wir finden uns in einer Welt wieder, die im Auseinanderbrechen
  begriffen scheint. Die Zahl der Konflikte und Krisen steigt beständig. Wie wir diese
  Krisen und Konflikte gemeinsam angehen, war eines der Hauptthemen zahlreicher bilateraler
  und multilateraler Gespräche am Rande der VN -Generalversammlung in New York. In
  unserer immer stärker vernetzten Welt haben Konflikte, die auf den ersten Blick
  regionaler Natur scheinen, globale Folgen. Denn terroristische Aktivitäten, die
  Auswirkungen unterbrochener Handelsrouten und des Klimawandels oder Desinformationskampagnen
  in den sozialen Medien machen nicht an Landesgrenzen halt. Wenn russische Angriffe
  auf ukrainische Häfen die Ausfuhr ukrainischen Getreides verhindern, hungern Menschen
  in Afrika. Wenn Terrorismus im Sahel für regionale Instabilität sorgt, suchen Menschen
  andernorts Zuflucht. Oft in Europa. Daher liegt es in unserem ureigenen Interesse,
  regionale Stabilisierungsinitiativen zu unterstützen. Wer wüsste das besser als
  die Mitglieder des Beirats der Bundesregierung für zivile Krisenprävention und Friedensförderung,
  die heute hier sind? Denn regionale Stabilisierung sorgt dafür, dass Krisen und
  Kriege in unserer Nachbarschaft nicht weiter eskalieren und nicht auf uns übergreifen.
  Dass die Ursachen von Krisen, Flucht und Vertreibung am Ort ihres Entstehens angegangen
  werden können. Und dass dem Terrorismus nicht die Möglichkeit gegeben wird, Gesellschaften
  zu infiltrieren. Beim Blick auf die Regionen in der unmittelbaren Nachbarschaft
  Deutschlands und Europas ist die Kriegsgefahr unübersehbar. Erstmals seit dem Kalten
  Krieg waren wir gezwungen, massiv in unser Militär zu investieren, um uns gegen
  die wachsende Bedrohung, allen voran durch Russland, zur Wehr setzen zu können.
  Und wir haben investiert. Und wir werden die Ukraine selbstverständlich auch weiterhin
  unterstützen. Nicht nur militärisch und finanziell, sondern auch mit Blick auf den
  Zivilschutz. Denn Zivilschutz ist dringend erforderlich, um die Wasserversorgung
  und das Stromnetz nach den tagtäglichen Angriffen durch Russland wiederherzustellen.
  Wir dürfen jedoch nicht vergessen, dass über unsere Sicherheit nicht allein in Europa
  entschieden wird. Neben unseren Anstrengungen im Bereich der Selbstverteidigung
  müssen wir auch in ziviles Krisenengagement, Mediation und Friedenskonsolidierung
  weltweit investieren. Das liegt in unserem ureigenen Interesse. Wir müssen in Dialog
  investieren, nicht in Spaltung. In den Kampf um Verständigung und in die friedliche
  Beilegung von Konflikten. In Menschen, die für den Zusammenhalt von Gesellschaften
  stehen. Daher unterstützen wir Stabilisierungsprogramme in der Sahelregion und in
  Westafrika, um gewalttätigen Extremismus zu verhindern oder zurückzudrängen und
  lokale Gemeinschaften widerstandsfähig gegenüber einer Anwerbung durch terroristische
  Gruppierungen wie Boko Haram zu machen. In Libanon unterstützen wir die Rückkehr
  staatlicher Institutionen sowie den Dialog zwischen christlichen, drusischen, schiitischen
  und sunnitischen Gemeinschaften. jede neue regionale Ordnung, jede neue Sicherheitsarchitektur
  beginnt mit Dialog. Ich bin aufrichtig überzeugt, dass es möglich ist, eine Ordnung
  zu schaffen, die dauerhaften Frieden gewährleistet. Nur sechs Jahre nach der von
  Deutschland im Zweiten Weltkrieg verursachten Verwüstung waren Frankreich und Deutschland
  bereit, auf der Grundlage von Dialog und Zusammenarbeit den Weg in eine friedliche
  Zukunft zu beschreiten. Ihre Vereinbarung über einen gemeinsamen Markt für Kohle
  und Stahl bildete den ersten Schritt hin zu dem, was zum größten Friedensprojekt
  der Menschheitsgeschichte werden sollte: Damals hielten nur ganz wenige Visionäre
  einen solchen Weg für möglich. Sie hielten unermüdlich an ihrer Vision fest und
  behielten Recht. Heute liegt es in unserer gemeinsamen Verantwortung, die Zukunft
  im Interesse von Frieden und Sicherheit zu gestalten. Dieses Forum bietet uns eine
  wunderbare Plattform für Gespräche und den Austausch von Sichtweisen. Es ist ein
  Ort, an dem neue Ideen entstehen und Kräfte mit dem Ziel gebündelt werden, Wege
  aus dem Krieg in den Frieden zu finden. Deutschland wird in diesem Bemühen ein engagierter
  Partner bleiben.'
