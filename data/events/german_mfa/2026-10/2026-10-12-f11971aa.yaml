title: Außenminister Wadephul zur Verabschiedung neuer EU-Sanktionen gegen Russland
text: 'Außenminister Wadephul sagte zur Verabschiedung neuer EU -Sanktionen gegen
  Russland heute (12.10.2026): Europa setzt einen beispiellosen Sanktionsschlag gegen
  Putins Kriegswirtschaft. Die EU listet heute so viele Personen und Unternehmen wie
  noch nie – insgesamt weit über 1.600. Fast alle sind unmittelbar oder mittelbar
  für Russlands Kriegsführung wichtig. Wir erschweren es für Putin damit, seinen völkerrechtswidrigen
  Invasionskrieg fortzusetzen – und seinen zynischen Versuch, die ukrainische Zivilbevölkerung
  mit mörderischem Bombenterror zu zermürben. Denn Putin setzt voll auf Eskalation:
  Die Zivilbevölkerung der Ukraine, darunter viele Kinder, hat gerade eine der tödlichsten
  Wochen in diesem Jahr erleben müssen. Mit der Listung von Drohnenherstellern reagieren
  wir zugleich auf Russlands zunehmende hybride Angriffe auf EU -Mitgliedstaaten.
  Der versuchte Drohnenanschlag am Flughafen Leipzig/Halle hat gezeigt, wie unmittelbar
  diese Bedrohung auch Deutschland trifft. Deshalb hat sich die Bundesregierung besonders
  für zusätzliche Listungen in diesem Bereich eingesetzt. Wir erhöhen den Druck, bis
  Putin bereit ist, ernsthaft über Frieden in der Ukraine zu verhandeln. Die Botschaft
  ist klar: Russland kann und wird diesen Krieg nicht gewinnen.'
