title: Rede von Außenminister Wadephul bei der Berlin Climate and Security Conference
  2026
text: 'Meine Damen und Herren, liebe Kolleginnen und Kollegen, verehrte Gäste, verdient
  er den Zusatz „Super“ oder nicht? So könnte man die Berichterstattung der letzten
  Wochen und Monate zum Thema „Super-El-Niño“ zusammenfassen. Ich finde, Krisen müssen
  keinen besonderen Namen tragen, um Anlass zur Sorge geben. Denn auch ohne Superlative
  können wir schon jetzt sehen, wie zunehmend extreme Wetterbedingungen Einfluss auf
  viele Krisen und Konflikte weltweit haben und diese verstärken. Und wir sehen, wie
  Akteure versuchen, dies in ihren eigenen Vorteil umzumünzen. Auf perfide Weise nutzen
  sie die Auswirkungen des Klimawandels als Waffe. Im April sind wir hier in Berlin
  zur dritten Sudan-Konferenz zusammengekommen. Gemeinsam mit der internationalen
  Staatengemeinschaft und zivilgesellschaftlichen Akteuren haben wir nach politischen
  Lösungen für die Zukunft Sudans gesucht und humanitäre Unterstützung für die sudanesische
  Bevölkerung eingeworben. Jetzt müssen wir zusehen, wie die ausbleibenden Regenfälle
  in Sudan die Dürre auf den Feldern verschärfen. Die Wasserstände entlang des Nils
  sind in diesem Sommer drastisch gesunken. Viele Bäuerinnen und Bauern wissen nicht,
  ob ihr Saatgut aufgehen oder es überhaupt eine Ernte geben wird. Und das alles in
  einem Land, in dem die Konfliktparteien Hunger und Verknappung ganz bewusst gegen
  die Bevölkerung vor Ort einsetzen. Gut 12.000 Kilometer von Sudan entfernt führen
  geringere Niederschlagsmengen zu sinkenden Pegelständen auf einer der wichtigsten
  Wasserstraßen des internationalen Handels: dem Panama-Kanal. Dort zeigen sich die
  Folgen von El Niño unmittelbar: Die Zahl der täglich durchfahrenden Schiffe musste
  reduziert werden und es wurden Beschränkungen in Bezug auf ihren maximalen Tiefgang
  erlassen. Diese Beschränkungen werden globale Auswirkungen haben. Wenn weniger Schiffe
  den Kanal passieren können, steigen Wartezeiten und Kosten, was zusätzlichen Druck
  für die globalen Lieferketten bedeutet. Wir können also beobachten, wie ein regionales
  Klimaphänomen Konsequenzen nach sich zieht, die weit über die Region selbst hinausreichen.
  Ich könnte auch auf den Nahen Osten und die gesamte Region verweisen, auf die Folgen,
  die die Lage in der Straße von Hormus auf die Versorgung mit Düngemitteln hat. Und
  auf die Energiepreise. Diese betreffen uns alle, wenn auch in unterschiedlichem
  Maße. Dort, wo die Menschen schon heute in Not sind, werden die Auswirkungen der
  Konflikte im Nahen Osten das Leid von morgen noch vergrößern. Wir könnten auch über
  Asien sprechen, wo El Niño die Gefahr von Ernteausfällen bei Reis, Palmöl, Kaffee,
  Mais und anderen Getreidepflanzen birgt. Sie alle wissen, dass wir diese Liste an
  Beispielen immer weiter fortsetzen können. Und jeder Krieg und jede Krise werden
  durch den Klimawandel noch weiter verstärkt. Seit 2019 prägt diese strategische
  Herausforderung die Agenda der Berlin Climate and Security Conference. Inzwischen
  hat sich die Lage weiter zugespitzt. Wir sehen alle, dass die Auswirkungen des Klimawandels
  beständig zunehmen: Extremhitze, Dürren, Waldbrände, Niedrigwasser – all das erleben
  wir hautnah, hier in Deutschland und überall ein Europa. Und ich glaube, wir verstehen
  diese Herausforderung heute viel besser als im Jahr 2019. Wir sehen die globalen
  Zusammenhänge, die Auswirkungen auf Ernährungssicherheit, Lieferketten, Mobilität,
  Industrieproduktion, Gesundheit, Energieversorgung und Preise. Konferenzen wie diese
  und Fachleute wie Sie haben hier einen wesentlichen Beitrag geleistet. Heute wollen
  wir diesen Geist der Zusammenarbeit fortführen. Hier in Berlin werfen wir heute
  einen Blick auf die jüngsten Entwicklungen und die neuesten wissenschaftlichen Erkenntnisse.
  Wir haben Themen auf die Agenda gesetzt, die bisher viel zu wenig Aufmerksamkeit
  erfahren haben. Wir hier im Auswärtigen Amt sind Expertinnen und Experten, wenn
  es darum geht, die richtigen Worte zu finden. Aber den Worten müssen auch Taten
  folgen. Egal, um welches Thema es geht, ob Energiesicherheit und KI, ob klimabedingte
  Fragilität, Klimaanpassung oder die Minderung klimabezogener Sicherheitsrisiken:
  Unser Ansatz muss es sein, konkrete Lösungen für drängende Probleme aufzuzeigen.
  Der Blick auf die heutige Agenda stimmt mich zuversichtlich. Hier in Berlin werden
  wir wichtige Impulse für die Gespräche über den klimaresilienten Wiederaufbau in
  Syrien beisteuern, und ich möchte insbesondere den syrischen Vertretern danken,
  dass sie heute hier bei uns sind. Solares Geoengineering steht zum ersten Mal auf
  der Agenda, was Ausdruck der Notwendigkeit ist, sich nicht nur mit seinen potenziellen
  Auswirkungen auf das Klima zu befassen, sondern auch mit den möglichen Sicherheitsrisiken
  und ordnungspolitischen Herausforderungen, die aus in globalem Maßstab einsetzbaren
  Technologien erwachsen könnten. Sie werden heute auch über die Auswirkungen von
  Klimafolgen auf Extremismus und Terrorismus sprechen. Denn wenn die Grundlagen des
  täglichen Lebens schwinden und sich humanitäre Notlagen festsetzen, wenden sich
  die Menschen zunehmend bewaffneten Gruppen zu, die vorgeben, über schnelle und einfache
  Lösungen für langwierige und komplexe Probleme zu verfügen. Wir haben heute eine
  ehrgeizige Agenda vor uns! Die Liste der Teilnehmenden zeigt jedoch, dass wir genau
  die richtigen Leute hier versammelt haben, um diese Themen anzugehen. Wir haben
  heute Vertreterinnen und Vertreter aus der ganzen Welt und aus diversen Fachrichtungen
  zu Gast. Denn blinde Flecken können wir uns nicht leisten. Wir müssen auf die globalen
  Zusammenhänge blicken. Und eine stärkere internationale Zusammenarbeit ist der einzige
  Weg, dies wirksam anzugehen. Außenpolitik, Sicherheitspolitik und Klimapolitik sowie
  humanitäre Hilfe und wirtschaftliche Entwicklung müssen Hand in Hand arbeiten, um
  Resilienz zu stärken. Deutschland steht an der Seite der Staaten, die am stärksten
  von Konflikten und Klimawandel betroffen sind. Hier setzen wir auf integrierte Ansätze,
  die Klima, Frieden und Sicherheit zusammendenken. Auf Ebene der Vereinten Nationen
  haben wir daran mitgewirkt, den Klima-Sicherheits-Mechanismus einzurichten. Und
  gemeinsam mit Naoero haben wir den Ko-Vorsitz der Freundesgruppe „Klima und Sicherheit“
  inne, die inzwischen auf 81 Mitglieder angewachsen ist. Wir setzen auf Zusammenarbeit
  durch besondere Partnerschaften. Gemeinsam mit Kenia wollen wir durch das Nairobi-Instrumentarium
  im Rahmen des Globalen Forums Terrorismusbekämpfung die Auswirkungen des Klimawandels
  auf gewalttätigen Extremismus abmildern. Deutschland unterstützt Projekte zur Friedenskonsolidierung
  in Ländern, die stark vom Klimawandel betroffen sind. Beispielsweise durch die Initiative
  „Weathering Risk“ und in Form von Beiträgen zu klimaintelligenten humanitären Maßnahmen
  in fragilen Kontexten durch Initiativen wie das Konto für Klimamaßnahmen des Zentralen
  Fonds für die Reaktion auf Notsituationen ( CERF ). In Äthiopien, Kenia und Somalia
  entwickelt Deutschland grenzübergreifende Projekte, die durch Klimafinanzierung
  die Klimaanpassung und die Friedenskonsolidierung fördern. Und Deutschland ist hierbei
  nicht alleine. Auch innerhalb der Europäischen Union arbeiten wir daran, gemeinsame
  Lösungen zu finden. Denn angesichts des Klimawandels kann es kein „du und ich“,
  sondern nur ein „wir“ geben. wir wollen gemeinsam vorausschauend handeln, anstatt
  im Nachhinein die Scherben wieder zusammenzufügen. Dazu können wir heute hier in
  Berlin einen großen Beitrag leisten.'
