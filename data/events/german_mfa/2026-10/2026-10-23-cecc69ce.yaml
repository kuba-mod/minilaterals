title: Gemeinsame Pressemitteilung Deutschlands, Frankreichs, Italiens und des Vereinigten
  Königreichs sowie Ägyptens, Pakistans, Saudi-Arabiens und der Türkei über das Treffen
  der Außenminister in Istanbul am 23. Oktober 2026
text: Die Außenminister der Republik Türkei, der Arabischen Republik Ägypten, der
  Islamischen Republik Pakistan und des Königreichs Saudi-Arabien (R4) sowie die Außenminister
  Deutschlands, Frankreichs, Italiens und des Vereinigten Königreichs sind am 23.
  Oktober 2026 in Istanbul zusammengekommen. Die Minister erörterten verschiedene
  Themen von regionaler und internationaler Bedeutung, namentlich den Konflikt zwischen
  den USA /Israel und Iran, den israelisch-palästinensischen Konflikt und die Notwendigkeit
  einer verhandelten Zwei-Staaten-Lösung, die empörenden Angriffe der Huthi-Miliz
  auf das Königreich Saudi-Arabien und die Regierung von Jemen, die Sicherheit und
  Freiheit der Schifffahrt und die bereits eskalierten Spannungen in der Straße von
  Hormus und am Bab al-Mandab sowie im Schwarzen Meer. Sie brachten ihre Entschlossenheit
  zum Ausdruck, weiterhin zu diplomatischen Bemühungen beizutragen, die auf die Förderung
  von Frieden und Stabilität in der Region und darüber hinaus abzielen und die sicherheitspolitischen,
  wirtschaftlichen und handelspolitischen Auswirkungen dieser Probleme angehen. Die
  Minister stimmten darin überein, dass es dringend notwendig ist, regionale Konflikte
  mithilfe von Dialog, Diplomatie und Deeskalation zu bewältigen. Im Einklang mit
  den einschlägigen VN -Resolutionen betonten sie die Notwendigkeit, für alle bestehenden
  Konflikte belastbare ausgehandelte Lösungen zu finden. Die Minister vereinbarten,
  den Dialog in diesem Format fortzusetzen, um Konflikten vorzubeugen sowie Frieden
  und Stabilität in der Region zu fördern.
