title: Gemeinsame Ministererklärung des Vereinigten Königreichs mit 31 weiteren Partnern
  zum Risiko einer Hungersnot in Sudan
text: 'Die Verschlechterung der Ernährungssicherheit in Sudan ist alarmierend. Das
  Risiko einer Hungersnot in den kommenden Monaten, vor dem die Integrierte Phasenklassifikation
  zur Ernährungssicherheit warnt, erfordert unverzügliches Handeln. Wir dürfen keine
  Zeit verlieren, Menschenleben zu retten und eine Hungersnot abzuwenden. Schätzungsweise
  19,5 Millionen Menschen (41 % der sudanesischen Bevölkerung) sind von einem hohen
  Ausmaß an akuter Ernährungsunsicherheit betroffen, unter ihnen fünf Millionen, bei
  denen das Ausmaß alarmierend ist. Ohne Sofortmaßnahmen für eine Umkehr der aktuellen
  Entwicklung könnte die Zahl der Kinder, die unter schwerer akuter Mangelernährung
  leiden, die Prognose von 825 000 noch übertreffen. Die ursprünglich auf 14 geschätzte
  Zahl der Gebiete, in denen Ernährungsunsicherheit herrscht, wird sich voraussichtlich
  verdoppeln. Haupttreiber für die Hungerkrise in Sudan ist der Konflikt, zu dessen
  Folgen Millionen Binnenvertriebene, die Beschädigung kritischer Infrastruktur und
  die Unterbrechung der Gesundheitsversorgung, der Lebensmittelproduktion sowie von
  Lieferketten und Märkten gehören. Verschärft wird die Lage durch die systematische
  Behinderung der Hilfe und durch die Auswirkungen von El Niño mit reduzierten Niederschlägen
  und zunehmender Dürre, wovon mehr als die Hälfte des Landes betroffen ist. Die Konfliktparteien
  tragen die Hauptverantwortung dafür, das Leiden der sudanesischen Bevölkerung zu
  lindern. Wir rufen die Parteien nachdrücklich dazu auf, sämtliche Hindernisse für
  humanitäre Hilfe zu beseitigen, einen uneingeschränkten, sicheren, zügigen und ungehinderten
  humanitären Zugang zu gewähren und zu erleichtern, und humanitäres Personal zu schützen.
  Andernfalls werden diese Hindernisse die Möglichkeit von humanitären Maßnahmen angesichts
  des Risikos einer Hungersnot beeinträchtigen. Konkret rufen wir die Konfliktparteien
  zu folgenden Schritten auf: Angesichts einer drohenden Hungersnot rufen wir alle
  Mitglieder der internationalen Gemeinschaft auf, als Reaktion auf den gestiegenen
  Bedarf umgehend ihre Finanzhilfen zu erhöhen und Anstrengungen zu unterstützen,
  die gewährleisten sollen, dass die Hilfe diejenigen erreicht, die sie am dringendsten
  benötigen. Ferner ermutigen wir die Entwicklungs- und Finanzinstitutionen, ihre
  laufenden Programme an die Lage hinsichtlich der Ernährungssicherheit anzupassen
  und ihren Schwerpunkt auf die Gebiete mit dem größten Bedarf zu legen. Gemeinsam
  müssen wir unverzüglich handeln, um eine Hungersnot abzuwenden, indem wir den Lebensmittelanbau
  in der Wintersaison fördern und Maßnahmen unter lokaler Führung stärken. Wir stehen
  an der Seite der Menschen in Sudan und der humanitären Organisationen, die unermüdlich
  und unter extrem herausfordernden Bedingungen arbeiten, um lebensrettende Hilfe
  zu leisten. Dr. Anne Aly, Ministerin für internationale Entwicklung von Australien
  Beate Meinl-Reisinger, Bundesministerin für europäische und internationale Angelegenheiten
  der Republik Österreich Maxime Prévot, stellvertretender Premierminister und Minister
  für auswärtige Angelegenheiten, europäische Angelegenheiten und Entwicklungszusammenarbeit,
  Belgien Hristo Dikanski, stellvertretender Minister für auswärtige Angelegenheiten
  der Republik Bulgarien Randeep Sarai, Minister für internationale Entwicklung, Kanada
  Gordan Grlić Radman, Minister für auswärtige und europäische Angelegenheiten der
  Republik Kroatien Petr Macinka, stellvertretender Ministerpräsident und Minister
  für auswärtige Angelegenheiten der Tschechischen Republik Lars Løkke Rasmussen,
  Minister für auswärtige Angelegenheiten, Dänemark Hadja Lahbib, EU -Kommissarin
  für Gleichberechtigung, Krisenvorsorge und -management Margus Tsahkna, Minister
  für auswärtige Angelegenheiten der Republik Estland Ville Tavio, Minister für Außenhandel
  und Entwicklung, Finnland Jean-Noël Barrot, Minister für Europa und auswärtige Angelegenheiten,
  Frankreich Dr. Johann Wadephul, Bundesminister des Auswärtigen, Deutschland Helen
  McEntee, Ministerin für auswärtige Angelegenheiten und Handel, Irland Antonio Tajani,
  stellvertretender Ministerpräsident und Minister für auswärtige Angelegenheiten
  und internationale Zusammenarbeit von Italien Baiba Braže, Ministerin für auswärtige
  Angelegenheiten der Republik Lettland Xavier Bettel, Minister für Entwicklungszusammenarbeit
  und humanitäre Angelegenheiten, Luxemburg Christopher Fearne, Minister für auswärtige
  und europäische Angelegenheiten, Republik Malta S.W. Sjoerdsma, Minister für Außenhandel
  und Entwicklungszusammenarbeit, Niederlande Åsmund Aukrust, Minister für internationale
  Entwicklung, Norwegen Radosław Sikorski, stellvertretender Ministerpräsident, Minister
  für auswärtige Angelegenheiten der Republik Polen Paulo Rangel, Minister für auswärtige
  Angelegenheiten, Portugal Sebastian Dănuț Neculăescu, Minister für auswärtige Angelegenheiten,
  Rumänien Juraj Blanár, Minister für auswärtige und europäische Angelegenheiten der
  Slowakischen Republik Tone Kajzer, Minister für auswärtige und europäische Angelegenheiten
  der Republik Slowenien José Manuel Albares, Minister für auswärtige Angelegenheiten,
  Europäische Union und Zusammenarbeit von Spanien Benjamin Dousa, Minister für internationale
  Entwicklungszusammenarbeit und Außenhandel, Schweden Dominik Stillhart, Leiter des
  Schweizerischen Korps für humanitäre Hilfe, stellvertretender Direktor der schweizerischen
  Direktion für Entwicklung und Zusammenarbeit Massad Boulos, leitender Berater für
  arabische und afrikanische Angelegenheiten, Vereinigte Staaten von Amerika Kirsty
  McNeill, Ministerin für internationale Entwicklung des Vereinigten Königreichs'
