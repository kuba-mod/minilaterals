title: Erklärung der Hohen Vertreterin im Namen der Europäischen Union zu dem eskalierenden
  Konflikt in Äthiopien und den Auswirkungen auf die Region
text: Die Europäische Union ist beunruhigt angesichts der fortwährenden Eskalation
  der Gewalt in Äthiopien und verstärkter regionaler Spannungen, insbesondere zwischen
  Äthiopien und Eritrea. Dies birgt das Risiko, dass ein größerer regionaler Konflikt
  mit schwerwiegenden Folgen für den Frieden und die Stabilität am Horn von Afrika
  ausgelöst wird. Die EU ruft zu einer umgehenden Deeskalation an allen Fronten auf
  und fordert alle Beteiligten nachdrücklich auf, von Handlungen oder Äußerungen abzusehen,
  die die Spannungen verstärken könnten. Die Parteien des Abkommens über die dauerhafte
  Einstellung der Feindseligkeiten (CoHA) sollten sich erneut zu dessen vollständiger
  Umsetzung innerhalb des Rahmens der Afrikanischen Union bekennen. Die Achtung des
  humanitären Völkerrechts ist zwingend erforderlich. Die Zivilbevölkerung muss jederzeit
  geschützt und der ungehinderte humanitäre Zugang muss sichergestellt sein. Die EU
  bekräftigt nachdrücklich, dass die Souveränität und die territoriale Unversehrtheit
  aller Staaten gewahrt werden müssen. Externe Akteure sollten von einer Einmischung
  absehen, ihren Einfluss nutzen, um eine weitere Eskalation zu verhindern und politische
  Lösungen sowie die Diplomatie vorantreiben. Die EU hält an ihrem Engagement für
  die regionale Stabilität, friedliche Zusammenarbeit und wirtschaftliche Integration
  am Horn von Afrika fest. Wir sind bereit, diplomatische Bemühungen hin zu einem
  substanziellen Dialog und einer friedlichen Beilegung von Konflikten zu unterstützen.
