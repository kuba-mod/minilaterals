title: Rede von Außenminister Wadephul im Deutschen Bundestag zur Beratung des Antrags
  der Bundesregierung zur Fortsetzung der Beteiligung bewaffneter deutscher Streitkräfte
  an der von der Europäischen Union geführten Operation European Naval Force ASPIDES
  (EUNAVFOR ASPIDES)
text: 'Meine sehr geehrten Damen und Herren Abgeordnete, Die Huthis und Iran nehmen
  die freien Seewege in Geiselhaft. Circa 12 Prozent des weltweiten Seehandels werden
  normalerweise allein durch das Bab al-Mandab abgewickelt. Das betrifft Öl, Gas,
  Düngemittel, Containerverkehr mit den Waren des täglichen Bedarfs und humanitären
  Gütern. Seit Ende Juli haben die Huthis eine Reihe von Angriffen auf zivile Schiffe
  durchgeführt. Durch die Übernahme der Kontrolle der gesamten Rotmeerküste des Jemen,
  insbesondere der Hafenstadt Mokka und der Insel Perim, können sie sogar noch wesentlich
  einfacher Schiffe angreifen, die das Bab al-Mandab passieren. Sie alle wissen, die
  Lage vor Ort entwickelt sich, während wir hier sprechen. Aber klar ist: Mit einer
  Schließung des Bab al-Mandab durch die Huthis wären zusammen mit den Angriffen auf
  die Schifffahrt in der Straße von Hormus durch Iran nun gleich zwei Chokepoints
  des internationalen Handels bedroht. Da ist es nicht entscheidend, dass die Huthis
  behaupten, es gehe ihnen vornehmlich um eine Blockade saudischen Seeverkehrs. Die
  Angriffe auf zivile Handelsschiffe sind völkerrechtswidrig und gefährden globale
  Handelswege mit großer Bedeutung für Europa und Deutschland, und sie erhöhen das
  Risiko für alle. Das zeigt, wie wichtig die militärische Präsenz der Europäischen
  Union in diesem maritimen Raum ist. EUNAVFOR ASPIDES erstellt ein eigenes Lagebild
  über die Region, dient der Begleitung von Handelsschiffen und der Abwehr von Angriffen
  auf diese Schiffe. In einer Region, in der viele Interessen miteinander im Wettstreit
  liegen, ist allein schon eine eigene, unabhängige europäische Lagebeurteilung von
  großem Wert. Wir profitieren davon unmittelbar. Und die Mission hilft auch konkret:
  Seit Beginn des Einsatzes 2024 hat ASPIDES mehr als 700 Schiffe begleitet. Über
  1 600 weitere Schiffe wurden zu Sicherheitsaspekten beraten. Wir sehen auch: Seit
  Anfang September steigt die Zahl der Anfragen nach Schutz von Schiffen im Transit
  substanziell. Der Einsatz, liebe Kolleginnen und Kollegen, lohnt sich. Deutschland
  trägt mit Hochwertfähigkeiten wie Seefernaufklärung, rotierend und temporär eingesetzt,
  und Stabspersonal einen Teil der europäischen Verantwortung. Die Mandatsobergrenze
  von 350 Soldatinnen und Soldaten verleiht uns die notwendige Flexibilität, um lageangepasst
  auch einen größeren Beitrag zu leisten, wenn notwendig. ASPIDES ist ein defensives
  Mandat. Dennoch - und das möchte ich hier unterstreichen: Es ermöglicht europäische
  Handlungsfähigkeit und den Schutz unserer wirtschaftlichen Interessen. Und es ist
  ein wichtiges Signal an unsere Partner in der Region, die unsere Präsenz und Solidarität
  einfordern. Wir wissen, dass nur eine umfassende Konfliktbewältigung einen nachhaltigen
  Frieden schaffen kann. Doch für den kurz- und mittelfristigen Schutz unserer Interessen
  braucht es die militärische Präsenz in der Region. Dazu leistet EUNAVFOR ASPIDES
  einen entscheidenden Beitrag. Daher bitte ich Sie um Zustimmung zu diesem Einsatz.
  Ich möchte zugleich noch einmal betonen: Wir müssen den Blick weiten. Der seit Jahren
  bestehende Konflikt mit den Huthis im Jemen, der jetzt wieder neu entbrannt ist,
  bringt vor allem Leid für die Menschen im Jemen. Zugleich birgt er ein enormes regionales
  Destabilisierungspotenzial. Wir sehen es ja: Flüchtlinge aus dem Jemen, die nach
  Dschibuti fliehen, Huthi-Angriffe auf saudische Städte, Flughäfen und Energieinfrastruktur,
  um nur einige Beispiele zu nennen. Wir müssen also gemeinsam mit unseren europäischen
  und regionalen Partnern intensiv darüber nachdenken, was wir noch tun können, um
  die Lage zu stabilisieren und unseren Partnern vor Ort zu helfen. Welche politischen,
  humanitären und stabilisierenden, vielleicht auch militärischen Mittel können wir
  noch einsetzen? Da dürfen wir keine Scheuklappen haben. Ich habe dazu auch mit meiner
  jemenitischen Amtskollegin, mit den Kollegen aus Oman, Saudi-Arabien, Ägypten und
  vielen anderen zuletzt in New York gesprochen. Diese Gespräche und diese Bemühungen
  werde ich intensiv fortsetzen. Unsere Partner setzen auf Deutschland. Wir wollen
  und wir werden sie nicht enttäuschen. Denn freie Schifffahrt durch das Rote Meer
  und regionale Stabilität liegt auch im deutschen und europäischen Interesse. Deswegen
  bitte ich in diesem Sinne um eine positive Beratung in diesem Hause.'
