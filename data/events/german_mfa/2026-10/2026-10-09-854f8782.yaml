title: Außenminister Wadephul zur Entscheidung, den Friedensnobelpreis an Navanethem
  Pillay zu verleihen
text: Navi Pillay steht für die Idee, dass Frieden auf Recht gründet. Als Richterin
  und Präsidentin des Internationalen Strafgerichtshofs für Ruanda hat sie mit wegweisenden
  Urteilen die Rechtsprechung zu Völkermord geprägt, insbesondere zur sexualisierten
  Gewalt als Mittel des Völkermords. Von 2003 bis 2008 war sie Richterin am Internationalen
  Strafgerichtshof in Den Haag, in der Aufbauphase einer Institution, die bis heute
  für das Ende der Straflosigkeit steht. Als UN -Hochkommissarin für Menschenrechte
  hat sie dieses Anliegen später auf die politische Bühne getragen. Der Friedensnobelpreis
  ist eine Würdigung ihres Lebenswerks und gleichzeitig ein wichtiges Bekenntnis zur
  internationalen Strafgerichtsbarkeit.
