title: Thomas Rachel, Religions- und Weltanschauungsfreiheitsbeauftragter der Bundesregierung,
  vor seiner Abreise zum Friedenstreffen von Assisi
text: 'Vor seiner Abreise zum Friedenstreffen von Assisi sagte Thomas Rachel, Religions-
  und Weltanschauungsfreiheitsbeauftragter der Bundesregierung (22.10.): Angesichts
  der zahlreichen Krisen in der Welt ist es heute wichtiger denn je, religiöse Akteure
  in Friedensbemühungen einzubeziehen und Möglichkeiten des interreligiösen Dialogs
  und weltweiten Friedensengagements auszuloten. Religiöse Akteure sind in vielen
  Teilen der Welt durch ihren besonderen gesellschaftlichen Einfluss oft wirkmächtiger
  als staatliche Akteure. Bei der Bewältigung globaler Herausforderungen können sie
  maßgeblich zur Lösung beitragen. Der Papst hat darum vor 40 Jahren Vertreter verschiedener
  Weltreligionen nach Assisi eingeladen, um für den Weltfrieden zu beten. Es ist mir
  ein besonderes Anliegen, diesem historischen Jubiläum beizuwohnen und in Assisi
  Gespräche mit Vertreterinnen und Vertretern von Religion, Politik und Gesellschaft
  zu führen. Am 27. Oktober 1986 lud Papst Johannes Paul II. erstmals Vertreter verschiedener
  Weltreligionen nach Assisi in Italien ein, um für den Weltfrieden zu beten. Der
  „Geist von Assisi“ wird seitdem maßgeblich von der katholischen Laienbewegung Gemeinschaft
  Sant’Egidio weitergetragen und in Form von regelmäßigen Internationalen Friedenstreffen
  verstetigt. Der Beauftragte der Bundesregierung für Religions- und Weltanschauungsfreiheit,
  Thomas Rachel MdB , wird zum 40. Jahrestag vom 25.-27. Oktober 2026 am Internationalen
  Friedenstreffen in Assisi teilnehmen und im Rahmen eines Forums „Europe - A Gentle
  Force?“ sprechen.'
