title: Der Beauftragte der Bundesregierung für Menschenrechtspolitik und humanitäre
  Hilfe Dr. Lars Castellucci zum Welttag gegen die Todesstrafe
text: 'Zum Welttag gegen die Todesstrafe und zum Europäischen Tag gegen die Todesstrafe
  erklärt Dr. Lars Castellucci, Beauftragter der Bundesregierung für Menschenrechtspolitik
  und humanitäre Hilfe: Die Todesstrafe ist mit der Würde des Menschen unvereinbar,
  denn sie ist eine unmenschliche und besonders grausame Form der Bestrafung. Deutschland
  und alle anderen EU -Mitgliedstaaten lehnen die Todesstrafe unter allen Umständen
  ab. Wir setzen uns weltweit für die Abschaffung und Ächtung der Todesstrafe ein.
  Diese Position verteidigen wir vehement in wichtigen internationalen Gremien wie
  der Generalversammlung oder dem Menschenrechtsrat der Vereinten Nationen und kritisieren
  auch enge Partner, wenn sie die Todesstrafe beibehalten. Wir unterstützen auch zivilgesellschaftliche
  Initiativen, die sich für die Abschaffung der Todesstrafe einsetzen. Es zeigt sich,
  dass dieses unermüdliche Engagement Früchte trägt: Immer weniger Staaten wenden
  die Todesstrafe an. Seit 2018 führen laut Amnesty International jedes Jahr weniger
  als 20 Staaten Hinrichtungen durch. 2025 waren es noch nur noch 17 Staaten. Die
  Anzahl der Hinrichtungen weltweit ist allerdings alarmierend hoch: Mit mindestens
  2.707 hingerichteten Personen gab es 2025 den höchsten Stand seit 1981. Von den
  Hinrichtungen, die bekannt sind, finden die meisten in Iran statt. Laut Amnesty
  International wurden 2025 in Iran mindestens 2.159 Menschen hingerichtet – mehr
  als doppelt so viele wie im Vorjahr. Die meisten dieser Hinrichtungen erfolgten
  wegen Drogendelikten oder Kapitalverbrechen – und als zynisches Instrument der Abschreckung
  gegenüber Protestierenden und Aktivisten. Besonders betroffen sind Angehörige ethnischer
  Gruppen wie Balutschen, Kurden und afghanische Staatsangehörige. Ich fordere das
  iranische Regime auf, unverzüglich ein Hinrichtungsmoratorium zu verhängen, alle
  Todesurteile auszusetzen und die Todesstrafe vollständig abzuschaffen. Zugleich
  begrüße ich die Abschaffung der Todesstrafe im Libanon – dem ersten Staat im Nahen
  Osten, der diesen Schritt vollzogen hat. Nach mehr als 20 Jahren ohne vollstreckte
  Todesurteile hat das libanesische Parlament im August die Todesstrafe für alle Straftaten
  abgeschafft und damit einen wichtigen Schritt für den Schutz des Rechts auf Leben
  und der Menschenrechte getan. Dieser historische Entschluss setzt ein bedeutendes
  Zeichen in der Region und stärkt die weltweiten Bemühungen für eine endgültige Abschaffung
  der Todesstrafe. Ich gratuliere dem Libanon zu diesem wichtigen Meilenstein.'
