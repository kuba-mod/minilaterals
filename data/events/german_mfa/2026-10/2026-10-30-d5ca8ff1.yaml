title: Gemeinsame Erklärung der Internationalen Kontaktgruppe für die Region der Großen
  Seen (ICG)
text: 'Belgien, Dänemark, Deutschland, die Europäische Union, Frankreich, Kanada,
  die Niederlande, Schweden, die Schweiz, das Vereinigte Königreich und die Vereinigten
  Staaten von Amerika geben als Mitglieder der Internationalen Kontaktgruppe für die
  Region der Großen Seen (ICG), deren Vorsitz Frankreich innehat, folgende Erklärung
  zur Lage in der Demokratischen Republik Kongo ab: Die Internationale Kontaktgruppe
  für die Region der Großen Seen (ICG) ermutigt alle Parteien der Washingtoner Vereinbarungen
  und des Rahmenabkommens von Doha, bei ihren Zusagen zu bleiben und redliche Anstrengungen
  für eine dauerhafte und friedliche Beilegung des Konflikts zu unternehmen sowie
  ihren Verpflichtungen unverzüglich nachzukommen. Die ICG unterstützt die Bemühungen
  der Vermittler, unter anderem die vom Präsidenten des Ministerrats der Republik
  Togo geleiteten Bemühungen der Afrikanischen Union, begrüßt den jüngsten Besuch
  der Ko-Fazilitatoren in der Region und bekräftigt, wie wichtig regionale Führung
  ist. Angesichts der jüngsten politischen und sicherheitsbezogenen Entwicklungen
  in der Demokratischen Republik Kongo ( DRK ) begrüßt die ICG die vom Vorsitzenden
  der Kommission der Afrikanischen Union veröffentlichte Erklärung, in der alle Parteien
  aufgefordert werden, Zurückhaltung zu üben. Die ICG lehnt Gewaltanwendung zur Durchsetzung
  politischer Ziele, wie sie von der jüngst geschaffenen Front für die Neugründung
  der Nation ( Front pour la Refondation de la Nation, FRN ) befürwortet wird, unmissverständlich
  ab. Sie unterstreicht, dass alle Parteien Rechtsstaatlichkeit und die Verfassung
  der Demokratischen Republik Kongo achten müssen, und bekräftigt ihr Bekenntnis zur
  Souveränität, Unabhängigkeit, Einheit und territorialen Unversehrtheit der DRK .
  Sie erinnert daran, wie wichtig ein friedlicher und integrativer interkongolesischer
  Dialog unter Einbeziehung aller wesentlichen kongolesischen Akteure als unerlässliche
  Voraussetzung eines dauerhaften Friedens in der DRK ist. Politische Differenzen
  und Missstände können nicht mit militärischen Mitteln beseitigt werden. Die Gewährleistung
  von Rechtsstaatlichkeit und der Schutz der Grundrechte ist unabdingbar, um sicherzustellen,
  dass alle politischen Parteien und zivilgesellschaftlichen Organisationen ihre Funktionen
  frei ausüben können. Die ICG bekräftigt ihre tiefe Sorge über die fortgesetzten
  Kämpfe im Osten der DRK und beklagt das Leid, das der Zivilbevölkerung zugefügt
  wird. Sie fordert alle Parteien nachdrücklich auf, ihren am 19. Juli 2025 in Doha
  eingegangenen Verpflichtungen zur Einhaltung einer Waffenruhe nachzukommen. Der
  eskalierende Einsatz von Drohnen hat schwerwiegende Folgen für Zivilpersonen und
  humanitäres Personal. Die ICG ermahnt die Parteien zur Umsetzung der Resolution
  2773 des Sicherheitsrats der Vereinten Nationen, in der die Verteidigungskräfte
  Ruandas aufgefordert werden, die Unterstützung für die Bewegung des 23. März einzustellen
  und sich unverzüglich und ohne Vorbedingungen aus dem Hoheitsgebiet der Demokratischen
  Republik Kongo zurückzuziehen, sowie die Rücknahme unrechtmäßiger Parallelverwaltungen
  auf dem Hoheitsgebiet der Demokratischen Republik Kongo und die Neutralisierung
  der Demokratischen Kräfte zur Befreiung Ruandas gefordert wird. Mit Blick auf den
  letzten Punkt ermutigt die ICG die Parteien unter Verweis auf ihre Erklärung vom
  August, in der sie den von der Regierung der DRK vorgestellten Plan aufmerksam zur
  Kenntnis nimmt, einen konkreten Aktionsplan und Zeitrahmen vorzulegen, der auf eine
  zügige Umsetzung des Protokolls zur Entwaffnung, Demobilisierung und Wiedereingliederung
  für Gruppen der Demokratischen Kräfte zur Befreiung Ruandas abzielt. Vor dem Hintergrund
  des steigenden humanitären Bedarfs und der Ebola-Epidemie fordert die ICG alle Parteien
  und bewaffneten Gruppen nachdrücklich auf, das humanitäre Völkerrecht einzuhalten
  und sicherzustellen, dass humanitäre Akteure uneingeschränkten, sicheren und ungehinderten
  Zugang zu hilfsbedürftigen Bevölkerungsgruppen haben.'
