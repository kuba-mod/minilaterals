title: 'Rede von Außenminister Wadephul zur deutsch-ukrainischen Partnerschaftskonferenz:
  „Freunde stehen zusammen“'
text: 'Liebe Bürgermeisterinnen und Bürgermeister, Liebe Kolleginnen und Kollegen
  aus dem Bundestag, ich möchte heute von einer Begegnung berichten, die mich sehr
  berührt hat. Ich bin, liebe Reem, wie Du auch und der Bundeskanzler, im Sommer in
  die Ukraine gereist. Und habe dort ein Versprechen einlösen können. Ein Versprechen,
  das ich bei meinem ersten Besuch in Kyjiw gegeben hatte. Russische Raketen hatten
  damals gerade ein Wohnviertel getroffen, meine Delegation und ich haben die Trümmer
  besichtigt. Und mit Menschen gesprochen, deren Häuser und Wohnungen zerstört waren.
  Unter ihnen war auch die Familie einer Kollegin, die als Lokalbeschäftigte an der
  deutschen Botschaft in Kyjiw arbeitet. Die für uns dort wichtige Arbeit leistet.
  Ihr Mann kämpft übrigens an der Front. Wir standen gemeinsam vor den Ruinen ihres
  Wohnzimmers. Und ich sagte ihr damals: Ich komme wieder. Und wenn ich wiederkomme,
  dann bringe ich einen Kuchen mit und den essen wir gemeinsam in Ihrem Wohnzimmer.
  Weil es dann wieder aufgebaut sein wird. Auch mit der Hilfe vieler Kolleginnen und
  Kollegen aus der deutschen Botschaft. Das haben wir dann in diesem Sommer endlich
  tun können. Wir saßen auf dem Sofa. Wir haben uns umarmt. Wir haben uns gefreut.
  Wir haben Kaffee getrunken und Kuchen gegessen. Und sie hat mir einen Satz mitgegeben,
  den ich hier heute weitergeben möchte. Und das ist auch so. Im Grunde könnte es
  das inoffizielle Motto dieser Konferenz sein. Weil kommunale Partnerschaften ein
  Ausdruck von Freundschaft sind. Einem ganzen Netz von Freundschaften sogar, das
  geht ja schon weit über bilaterale Partnerschaften hinaus. Und dieses Netz ist fester
  Bestandteil deutscher Außenpolitik. Weil es eben die klassische Diplomatie ergänzt.
  Ob nach russischen Angriffen Strom und Wärme weiter funktionieren, Schulen und Krankenhäuser
  geöffnet bleiben, Schutzräume erreichbar sind und die Menschen verlässliche Informationen
  bekommen – all das entscheidet sich jeden Tag in Städten und Gemeinden der Ukraine.
  Ich habe das auf meinen Reisen in die Ukraine immer wieder gesehen, zuletzt diesen
  Sommer. Da bin ich, nachdem ich in Kyjiw war, weiter nach Charkiw gereist – dort
  gibt es übrigens eine große Dankbarkeit für eine Partnerschaft mit Nürnberg. Das
  ist etwa 30 Kilometer vor der Front. Auf dem Weg dahin, in der Region Poltawa, tauschte
  ich mich mit Bürgermeistern aus. Die drei Männer haben mir von ihren täglichen Herausforderungen
  erzählt. Wir lesen ja immer davon, dass Russland gezielt die ukrainische Infrastruktur
  angreift. Aber was das konkret bedeutet, das sieht und erfährt man erst durch die
  Reisen, durch das Anschauen oder durch die Gespräche. Und die Gesprächspartner haben
  mir von den Schwierigkeiten erzählt, Tankstellen am Strom zu halten. In einer Gemeinde
  waren sogar alle Tankstellen zerstört. Die, die noch funktionierten, brauchten dringend
  eine dezentrale Stromversorgung. Deutschland konnte an dieser Stelle zum Glück schon
  einige Male Hilfe leisten. Und das kam oft von kommunaler Ebene. Aus diesem Gedanken
  heraus wollen wir im kommenden Jahr einen runden Tisch mit Bürgermeisterinnen und
  Bürgermeistern aus Deutschland und der Ukraine organisieren. Um den Austausch mal
  praktisch zu gestalten: Was funktioniert vor Ort? Wie können sich Städte und Gemeinden
  gegenseitig unterstützen? Dieser Austausch kann der Ukraine zum Beispiel auf ihrem
  herausfordernden Weg in die EU -Mitgliedschaft helfen. Viele EU -Regeln müssen letztlich
  in Rathäusern und kommunalen Verwaltungen umgesetzt werden. Aber diese Partnerschaften
  sind natürlich keine Einbahnstraße. Das ist ein ganz wichtiger Punkt, wie ich finde:
  Deutsche Kommunen können auch sehr viel von den Erfahrungen ihrer ukrainischen Freunde
  lernen. Wie schützen wir unsere Versorgungsinfrastruktur noch besser, zum Beispiel?
  Wie können wir uns auf Ausfälle bei Energieversorgung oder Kommunikation vorbereiten?
  Wie stärken wir den Katastrophenschutz? Und wie schützen wir unsere Gesellschaft
  vor hybriden Bedrohungen und Desinformationskampagnen? Das sind alles Fragen, die
  wir – wenn freilich auch in einem ganz anderen Ausmaß – uns auch hier in Deutschland,
  stellen. Stellen müssen. Weil die russische Aggression eben nicht an der Grenze
  zur Ukraine endet. Auch wir erleben hybride russische Bedrohungen, wir haben das
  jüngst in Leipzig gesehen. Wir haben darauf als Bundesregierung sehr entschieden
  reagiert. Ich habe das Thema auch noch einmal in New York bei den Vereinten Nationen
  auf den Tisch gebracht. Als mir gegenüber Herr Lawrow saß, der russische Außenminister.
  Ich habe klar gemacht, dass wir diese Angriffe Russlands nicht tolerieren und uns
  gegen jede Gefährdung der Sicherheit unseres Landes wehren. Dass wir uns nicht einschüchtern
  lassen. Wie der Bundeskanzler und die Bundeswirtschaftsministerin bei ihrem Besuch
  am vergangenen Wochenende noch einmal unterstrichen haben. Zudem sprach ich über
  die Getreideexporte, die wegen der gezielten russischen Angriffe in den ukrainischen
  Häfen feststecken. In der Ukraine droht, ein Drittel der Ernte zu verderben. Und
  gleichzeitig ist die Welt auf diese Exporte angewiesen – wenn die Lieferungen nicht
  bald auf den Weg kommen, dann drohen Hungersnöte. Und zwar in ohnehin schon instabilen
  Regionen. Was wieder neue Fluchtbewegungen verursachen kann. Auch das ist eine Form
  der Destabilisierung, die Russland mit seiner rücksichtlosen, expansiven Aggression
  weiter vorantreibt. Eine Aggression, die übrigens auch in Russland von einzelnen
  Mutigen selbst schon früh gesehen und auch kritisiert wurde. Heute ist ein Tag,
  der Anlass gibt, auch dazu noch etwas zu sagen. Denn heute vor 20 Jahren wurde Anna
  Politkowskaja ermordet. Eine Journalistin, die sich gegen das russische System aus
  Repression, Korruption und expansiver Machtpolitik stellte. Und die dieses System
  öffentlich anprangerte. Der Mord an Anna Politkowskaja war ein frühes Mahnmal für
  das, was sich in Russland mittlerweile jeden Tag abspielt: Ein Kampf gegen die Freiheit
  der Menschen. Weil die Machthaber in Russland wissen, dass die Freiheit der Menschen
  ihr vielleicht größter Gegner ist. Deswegen musste Anna Politkowskaja sterben. Und
  das bedeutet, dass wir unerschütterlich an der Seite der Ukraine bleiben.'
