title: Außenminister Wadephul zum Start der Berlin Climate and Security Conference
text: 'Zum Start der Berlin Climate and Security Conference sagte Außenminister Wadephul
  heute, 06.10.2026: Extremtemperaturen mit Hitzetoten und niedrige Flusspegel, die
  Lieferketten unterbrechen – die Auswirkungen des Klimawandels haben wir zuletzt
  auch in Deutschland dramatisch zu spüren bekommen. Anderswo führen extreme Ereignisse
  wie Hitze, Dürre, Stürme oder Fluten zu Ernteausfällen, Hunger und Migrationsdruck
  – und damit auch zu Konflikten um knapper werdende Ressourcen. Gerade in fragilen
  Staaten verstärkt der Klimawandel Not und Hunger – und kann so auch zum Nährboden
  für Extremismus und Terrorismus werden oder zu Migrationswellen führen. Der aktuelle
  Super-El-Niño droht die Lebensgrundlage hunderttausender Menschen zu zerstören.
  Und dies in einer Zeit, in der Getreidepreise weltweit steigen, weil Russland Schiffe
  mit Getreide im Schwarzen Meer angreift und so Menschen weltweit von der Versorgung
  abschneidet, die auf den Import besonders angewiesen sind. Gut gemachter Klimaschutz
  trägt insgesamt zu Sicherheit bei – auch indem er Staaten resilienter macht: Wenn
  Russland diesen Winter erneut gezielt die Energieinfrastruktur der Ukraine angreift,
  könnten dezentrale, erneuerbare Energiequellen zur Lebensversicherung werden – weil
  sie schwieriger zu zerstören sind und nicht vom Import fossiler Energieträger abhängen.
  Investitionen in den Klimaschutz sind auch Investitionen in unsere Sicherheit –
  genau das ist wichtiges Thema auf der Berlin Climate and Security Conference in
  diesem Jahr.'
