title: Außenminister Wadephul zu russischer Urheberschaft bei Anschlagsversuch in
  Leipzig bei der gemeinsamen Pressekonferenz mit Innenminister Dobrindt
text: 'Außenminister Wadephul sagte bei der gemeinsamen Pressekonferenz mit Innenminister
  Dobrindt am 1. September 2026: Das beschriebene gefährliche Verhalten der russischen
  Föderation fügt sich in eine lange Reihe von Versuchen der Destabilisierung, der
  Desinformation, der Drohungen, der Sabotage und der Aggression gegenüber Europa.
  Deutschland bildet leider keine Ausnahme. Russlands Führung tritt unserem Land mit
  offener Feindseligkeit entgegen. Ich möchte betonen: Dieser Zustand unserer Beziehungen
  liegt nicht im Interesse der Bundesregierung. Wir bedauern ihn ausdrücklich. Wir
  haben seit Beginn des völkerrechtswidrigen Angriffskrieges gegen die Ukraine immer
  wieder unterstrichen, dass es unser Ziel ist, zu einem Ende des Krieges, zu einer
  Wiederherstellung der Friedensordnung in Europa und zu einer Rückkehr zu einem konstruktiven
  Verhältnis zu gelangen. Dies setzt allerdings ein Mindestmaß an Bereitschaft von
  russischer Seite voraus. Wir müssen feststellen, Russland zeigt keine Bereitschaft
  zum Ausgleich. Im Gegenteil: Mit dem Anschlagsversuch in Leipzig hat die russische
  Führung sich vielmehr bewusst entschlossen, unser bereits massiv belastetes bilaterales
  Verhältnis nochmals erheblich zu beschädigen. Deswegen gilt die Linie der Bundesregierung,
  die der Bundesinnenminister gerade angesprochen hat. Deutschland bleibt sicher und
  Deutschland wehrt sich gegen Gegner, die Unsicherheit stiften wollen. Die Bundesregierung
  geht deshalb gegen Russland als Urheber des hybriden Angriffs von Leipzig vor. Sie
  erschwert so, weitere hybride Maßnahmen in Deutschland und Europa durchzuführen.
  Deutschland hat starke Partner. Die Bundesregierung stimmt sich eng mit den Partnern
  in der NATO und der Europäischen Union ab. Sie hat deren Unterstützung und unterstützt
  sie ihrerseits. Deutschland hält sicherheitspolitisch Kurs. Die Bundesregierung
  setzt die Unterstützung der Ukraine und die Stärkung der deutschen Verteidigungsfähigkeit
  entschlossen fort. Hybride Angriffe, wie der von Leipzig, zeigen, dass das notwendig
  ist. Neben der Stärkung unserer Sicherheit setzt die Bundesregierung Maßnahmen gegen
  Russland in Kraft. Folgende Maßnahmen habe ich in Absprache mit dem Bundeskanzler
  angeordnet: Das russische Generalkonsulat in Bonn wird zum 18. September geschlossen.
  Der Vertrag über das russische Haus in Berlin wird gekündigt. Wir werden in der
  Europäischen Union neue Listungen von Personen aus Russland im Kontext hybrider
  Angriffe vorschlagen. Wir verschärfen die Einreisekontrollen für russische Staatsangehörige.
  Wir erhöhen den Druck auf die russische Schattenflotte. Die Bundesregierung setzt
  sich zudem weiter für Geschlossenheit in der NATO und der Europäischen Union ein.
  Sie unterrichtet ihre Partner und hat sich ihrer Solidarität versichert. Und der
  Kurs der Bundesregierung bleibt auch in der Sicherheitspolitik klar. Sie setzt ihre
  zivile und militärische Unterstützung der Ukraine fort. Zudem wird sie weitere Maßnahmen
  im nachrichtendienstlichen Bereich ergreifen. Ebenso setzt die Bundesregierung ihre
  Anstrengungen in der NATO fort, die eigene Verteidigungsfähigkeit zu stärken und
  Russland wirkungsvoll abzuschrecken. Die Bundesregierung teilt dies Russland in
  angemessener Form mit. Ich habe daher angeordnet, den russischen Botschafter einzubestellen.
  Diese Einbestellung findet zur Stunde statt. Meine Damen und Herren, unsere Botschaft
  an Russlands Führung ist klar: Wir halten entschlossen Kurs in unserem sicherheitspolitischen
  Handeln. Der Angriff von Leipzig zeigt, wie dringend das notwendig ist. Wir werden
  uns durch Russlands Angriffe nicht in unserem gesellschaftlichen Zusammenhalt spalten
  oder einschüchtern lassen. Wir bleiben bereit, gemeinsam mit unseren starken Partnern
  entschlossen zu reagieren, wenn der Schutz der Bevölkerung und unserer Partner dies
  erfordert. Und wir werden unsere Solidarität mit der Ukraine in ihrem Verteidigungskampf
  gegen Russlands Aggressionskampf entschlossen fortführen.'
