title: Erklärung der Hohen Vertreterin im Namen der EU zu den vom 18. bis zum 20.
  September 2026 abgehaltenen Wahlen zur russischen Staatsduma und ihrer Unzulässigkeit
  in ukrainischem Hoheitsgebiet
text: Die von Russland vom 18. bis zum 20. September abgehaltenen Staatsduma-Wahlen
  unterstrichen die fortgesetzte und fortschreitende Aushöhlung der Demokratie in
  Russland und fanden in einem zunehmend autoritären politischen Umfeld statt. Das
  Fehlen gerechter Ausgangsbedingungen wurde durch Russlands illegalen Angriffskrieg
  gegen die Ukraine und die fortwährende illegale Besetzung von ukrainischen Gebieten
  weiter verschärft. Die russischen Behörden haben die systematische und institutionalisierte
  innerstaatliche wie grenzübergreifende Unterdrückung weiter verstärkt, um jegliche
  demokratischen Oppositionskräfte daran zu hindern, den Status quo infrage zu stellen.
  Die Entscheidung, Kandidatinnen und Kandidaten der Partei Jabloko von der föderalen
  Liste auszuschließen, hat die Wahlmöglichkeiten für russische Wählerinnen und Wähler
  weiter reduziert, da damit eine der letzten verbliebenen Oppositionskräfte und die
  einzige Partei, die gegen den Krieg eintritt, vom Wahlprozess ausgeschlossen wurde.
  Bereits im Vorfeld der Wahlen berichteten unabhängige Analystinnen und Analysten
  sowie Beobachterinnen und Beobachter von einem umfangreichen Missbrauch administrativer
  und juristischer Mittel, um all jene, die gegen Russlands illegalen Angriffskrieg
  sind, auszuschließen, um den russischen Wählerinnen und Wählern die Möglichkeit
  einer echten Wahl über die Zukunft ihres Landes vorzuenthalten und um den Zugang
  der russischen Bevölkerung zu unabhängigen Informationen rigoros einzuschränken.
  Die Europäische Union und ihre Mitgliedstaaten werden die wichtige Arbeit von russischen
  zivilgesellschaftlichen Organisationen, Menschenrechtsverteidigerinnen und -verteidigern
  sowie unabhängigen Medien weiter unterstützen. Die Europäische Union bedauert die
  Entscheidung der Russischen Föderation, keine OSZE -Beobachter zu diesen Wahlen
  einzuladen. Hierdurch zeigt sich ein weiteres Mal, dass die Russische Föderation
  von allen OSZE -Teilnehmerstaaten eingegangene bindende Verpflichtungen immer wieder
  missachtet und den russischen Wählerinnen und Wählern sowie russischen Institutionen
  eine unparteiische und unabhängige Bewertung dieser Wahlen verwehrt hat. Ferner
  verurteilt die Europäische Union unmissverständlich die rechtswidrige Durchführung
  sogenannter „Wahlen“ durch die Russische Föderation in den vorübergehend besetzten
  Gebieten der Ukraine, nämlich der Autonomen Republik Krim und der Stadt Sewastopol
  sowie in Teilen der Regionen Donezk, Luhansk, Saporischschja und Cherson. Diese
  sogenannten „Wahlen“ stellen eine weitere eklatante Verletzung des Völkerrechts
  einschließlich der Charta der Vereinten Nationen sowie der Unabhängigkeit, Souveränität
  und territorialen Unversehrtheit der Ukraine durch Russland dar. Die Europäische
  Union fordert Russland mit Nachdruck auf, die international anerkannten Grenzen
  sowie die Souveränität der Ukraine zu respektieren. Die Europäische Union bekräftigt,
  dass sie diese sogenannten „Wahlen“ in den vorübergehend besetzten Gebieten der
  Ukraine sowie ihre Ergebnisse nicht anerkennt und auch in Zukunft niemals anerkennen
  wird. Die mit der Durchführung dieser Scheinwahlen in den vorübergehend besetzten
  Gebieten der Ukraine befassten oder dabei kandidierenden Personen sowie diejenigen,
  die für das Untergraben der Möglichkeit freier und fairer Wahlen innerhalb Russlands
  die Verantwortung tragen, werden Sanktionen unterworfen. Die Europäische Union bekräftigt
  ihr unbeirrbares Eintreten für die Unabhängigkeit, Souveränität und territoriale
  Unversehrtheit der Ukraine innerhalb ihrer international anerkannten Grenzen. Russland
  muss seinen illegalen Angriffskrieg gegen die Ukraine einstellen, einem vollständigen,
  unverzüglichen und bedingungslosen Waffenstillstand zustimmen und seine Streitkräfte
  und sein militärisches Gerät aus dem gesamten Hoheitsgebiet der Ukraine unverzüglich,
  vollständig und bedingungslos abziehen.
