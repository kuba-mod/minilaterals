title: Außenminister Wadephul vor seiner Abreise nach Ungarn
text: 'Vor seiner Abreise nach Budapest erklärte Außenminister Wadephul heute (14.09.2026):
  Ungarn und Deutschland schlagen gemeinsam ein neues Kapitel auf. Nach fast sieben
  Jahren werde ich als erster deutscher Außenminister heute wieder nach Ungarn reisen.
  Das zeigt: Wir haben extrem viel aufzuholen. Der politische Wechsel in Ungarn eröffnet
  jedoch die Chance, unsere Beziehungen mit großer Geschwindigkeit wieder auf ein
  Fundament des gegenseitigen Vertrauens und der Verlässlichkeit zu stellen. Ich komme
  also mit der Hoffnung, dass Ungarn sein großes europäisches Herz wiederentdeckt
  und ganz Europa das spürt. Ungarns neue Regierung hat in kurzer Zeit zentrale Reformen
  angestoßen. Die Rückkehr zu Rechtsstaatlichkeit und die Umsetzung europäischer Vorgaben
  sind gute Nachrichten – für Europa, vor allem aber für die Menschen in Ungarn selbst.
  Denn Rechtsstaatlichkeit und verlässliche Regeln sind entscheidend dafür, ob Bürgerinnen
  und Bürger ihrem Staat vertrauen und Unternehmen aus dem In- und Ausland bereit
  sind, entschlossen zu investieren. Wenn für Unternehmen aus allen EU -Mitgliedstaaten
  wieder faire und verlässliche Wettbewerbsbedingungen gelten, wird Ungarns Wirtschaft
  erheblich davon profitieren. Deutsche Unternehmen sind schon heute für 250.000 Arbeitsplätze
  in Ungarn verantwortlich. Ich freue mich deshalb sehr, dass mich heute eine Delegation
  deutscher Unternehmen begleitet, um ganz konkret zu besprechen, welche weiteren
  Schritte nun erforderlich sind. Mir war es aber auch mit Blick auf unsere gemeinsame
  Geschichte wichtig, die Chance auf einen Neuanfang mit unseren Freunden in Ungarn
  zu nutzen. Wir sind den Ungarinnen und Ungarn für immer verbunden, dass sie es waren,
  die 1989 den Stein ins Rollen brachten, der am Ende den Eisernen Vorhang zerriss
  und die deutsche Wiedervereinigung ermöglichte. Ungarn erlaubte mit der Öffnung
  seiner Grenzen tausenden DDR -Bürgerinnen und -Bürgern den Weg in die Freiheit.
  Diese Geschichte verbindet uns – und sie erinnert uns daran, dass die Freiheit immer
  wieder unseren Einsatz verlangt. Heute ist unsere Freiheit von außen wie von innen
  unter Druck, oft wirken diese Kräfte im Konzert. Russlands hybride Angriffe auf
  Europa nehmen zu: Desinformation, Sabotage und Einflussoperationen machen nicht
  an unseren Grenzen halt. Im Gegenteil: Sie nutzen unsere Freiheit und Offenheit
  aus. Der Angriff in Leipzig hat uns gezeigt, dass diese Bedrohung so handfest wie
  akut ist. Ungarn hat mit der Ausweisung von zehn russischen Diplomaten zuletzt ein
  klares Signal gesetzt - und auch Ungarns Solidarität nach dem Anschlagsversuch am
  Flughafen Leipzig und die gemeinsam beschlossenen EU -Sanktionen zeigen Russlands
  Führung deutlich: Wir verteidigen die Friedensordnung in Europa gegen Russlands
  Aggression. Jetzt ist die Gelegenheit für Deutschland und Ungarn, Verpasstes aufzuholen
  und Neues zu schaffen. Mit meiner Reise will ich unterstreichen, dass die Bundesregierung
  entschlossen ist, diese Chance für unsere beiden Länder zu nutzen.'
