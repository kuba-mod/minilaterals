title: Der Beauftragte der Bundesregierung für Religions- und Weltanschauungsfreiheit
  Thomas Rachel vor seiner Abreise nach Pakistan
text: Pakistan ist für Deutschland ein wichtiger Partner, mit dem wir dieses Jahr
  75 Jahre diplomatischer Beziehungen feiern. Wir arbeiten sowohl in der Entwicklungszusammenarbeit,
  als auch in politischen, wirtschaftlichen und kulturellen Bereichen zusammen. Pakistan
  ist außerdem ein wichtiger Vermittler in Konflikten in der Region. In Pakistan ist
  der Islam laut Verfassung Staatsreligion und spielt im Alltag der Menschen eine
  große Rolle. Die pakistanische Verfassung garantiert Religionsfreiheit, gleichzeitig
  gibt es gesellschaftliche und rechtliche Diskriminierung gegenüber einigen religiösen
  Gruppen. Aus diesen Gründen habe ich mich entschieden, nach Pakistan zu reisen,
  um die Lage vor Ort besser zu verstehen. Vor Ort werde ich mit muslimischen Geistlichen,
  Würdenträgern verschiedener religiöser Minderheiten, z.B. der Christen sowie Humanisten
  ins Gespräch kommen, um ein eigenes Bild über die Lage der Religions- und Weltanschauungsfreiheit
  zu bekommen. Gespräche mit Regierung und Zivilgesellschaft sollen dazu beitragen,
  unterschiedliche Perspektiven kennenzulernen. Der Beauftragte der Bundesregierung
  für Religions- und Weltanschauungsfreiheit reist vom 14. bis 18. September nach
  Pakistan. Deutschland und Pakistan pflegen seit 1951 enge und vielfältige Beziehungen.
  Deutschland hat großes Interesse an einer demokratischen und friedlichen Entwicklung
  in Pakistan sowie einer konstruktiven Rolle Pakistans in der Region.
