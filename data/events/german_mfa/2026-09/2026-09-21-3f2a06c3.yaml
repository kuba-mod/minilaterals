title: Außenminister Wadephul vor seiner Abreise nach New York zur Teilnahme an der
  Generaldebatte der 81. UN-Generalversammlung
text: 'Vor seiner Abreise nach New York zur Teilnahme an der Generaldebatte der 81.
  UN -Generalversammlung erklärte Außenminister Wadephul heute (21.09.2026): Die Blicke
  der Welt richten sich in den kommenden Tagen auf New York: ein Ort, der wie kein
  anderer Menschen von allen Kontinenten zusammenbringt und für viele weltweit Hoffnung
  auf ein freies Leben bedeutet. Ein Ort, der selbst im Angesicht tiefster Erschütterungen
  wie den Terroranschlägen vor 25 Jahren für Zusammenhalt und die Kraft der Erneuerung
  steht. Der Ort, an dem die Vereinten Nationen ihren Sitz haben. Die Staaten der
  Welt haben die UN vor über 80 Jahren gegründet, um der Menschheit nach dem Entsetzen
  des Zweiten Weltkriegs eine Schaltzentrale für eine friedliche internationale Ordnung
  zu geben. Die Perspektive auf ein nachhaltiges konfliktfreies Miteinander ist heute
  einem Modus der Dauereskalation gewichen. Daran können und wollen wir uns nicht
  gewöhnen. Wir haben eine Verpflichtung, unsere Kräfte zu bündeln, damit eine Umkehr
  möglich ist. Die zahllosen Gespräche dieser Woche bieten eine der wenigen Gelegenheiten
  dazu. Deutschland wird seinen Teil dafür tun und darauf hinarbeiten, die beklemmende
  Sprachlosigkeit zwischen den Konfliktparteien zu überwinden - sowohl in Europa als
  auch im Mittleren Osten. Denn wenn die Staatengemeinschaft in diesen Tagen in New
  York zusammenkommt, dann darf es nicht nur um eine reine Bestandsaufnahme all der
  Krisen, Konflikte und Kriege gehen. Dann sollten alle politisch Verantwortlichen
  bereit sein, ernsthaft um jeden noch so kleinen Schritt zur Lösung zu ringen. Wir
  wollen gerade dort nicht nachlassen, wo unsere Interessen besonders betroffen sind:
  Putins Krieg mit immer tödlicheren Angriffen auf zivile Infrastruktur lässt die
  Ukrainerinnen und Ukrainer bange auf den nächsten Winter blicken – und führt auch
  sein Land in den wirtschaftlichen Abgrund und abertausendfachen Tod. Russland muss
  zur Erkenntnis gebracht werden, dass es an der Zeit ist, auf einen Kurs ernsthafter
  Verhandlungen einzuschwenken. Auf dem Weg dorthin wollen wir die Ukraine so stärken,
  dass sie mit internationaler Unterstützung den längeren Atem hat. Gleichzeitig bedroht
  Russland EU - und NATO -Mitgliedstaaten immer unverhohlener, verletzt Lufträume,
  zerstört Unterseekabel, verübt hybride Angriffe. Wir werden uns daher mit unseren
  Partnern darüber abstimmen, wie wir unsere kritische Infrastruktur unter Wasser
  besser schützen und wie wir vor unseren Küsten wirksamer gegen die maroden Tanker
  der russischen Schattenflotte vorgehen können. Wir werden auch beraten, wie die
  Staatengemeinschaft gemeinsam mehr Verantwortung für maritime Sicherheit übernehmen
  kann. Denn an der Straße von Hormus und am Bab al-Mandab halten Iran und seine Milizen
  seit Monaten die Lebensadern des freien Handelsverkehrs im Würgegriff. Energielieferungen,
  Düngemittel und Hilfsgüter werden unbezahlbar oder kommen kaum mehr da an, wo sie
  dringend benötigt werden. Unter den Folgen leiden wir in Deutschland und Europa
  – und noch dramatischer viele Länder des globalen Südens, wo steigende Preise und
  Ernteausfälle existenzbedrohend sind. Die UN -Generaldebatte bietet Möglichkeiten
  wie kein zweites Forum, sich zu diesen und weiteren grundlegenden Herausforderungen
  international breit abzustimmen. Ich treffe daher unsere engsten Partner der G7
  und werde die Gelegenheit nutzen, Partnerschaften auf der ganzen Welt weiter zu
  vertiefen. Mit den kleinen Inselstaaten werden wir darüber sprechen, wie wir resilienter
  gegen die Bedrohung durch den Klimawandel werden können. Oder uns mit lateinamerikanischen
  Staaten abstimmen, wie wir wirtschaftlich enger zusammenarbeiten. Bei all dem ist
  klar: Für die Perspektive einer stabilen internationalen Ordnung braucht es Vereinte
  Nationen, die die Krisen und Konflikte unserer Zeit nicht vor allem verwalten, sondern
  den Boden für Lösungen bereiten. Als handelnder Arm der Staatengemeinschaft, der
  beispielsweise im Krieg im Sudan vermittelt, an der Deblockade von Handelsrouten
  mitarbeitet oder gegen Menschenrechtsverletzungen vorgeht. Und die UN muss Verantwortung
  bei den Fragen der Gegenwart übernehmen, etwa beim gemeinsamen Umgang mit Chancen
  und Herausforderungen künstlicher Intelligenz. Dabei ist auch klar: Die Vereinten
  Nationen benötigen heute selbst die Kraft der Erneuerung und der Reform, die sie
  einst aus der Taufe gehoben hat. Darin liegt die Schicksalsaufgabe des neuen UN
  -Generalsekretärs oder der neuen UN -Generalsekretärin. Deutschland steht als einer
  der größten Unterstützer der UN bereit, diesen Weg mitzugestalten.'
