title: Gemeinsame Erklärung von Dr. Anita Orbán, stellvertretende Ministerpräsidentin
  und Außenministerin von Ungarn, und Dr. Johann Wadephul, Bundesminister des Auswärtigen
  der Bundesrepublik Deutschland
text: 'Im Herzen Europas verbindet Ungarn und Deutschland eine langjährige Freundschaft,
  die auf tief verwurzelte historische, kulturelle, wirtschaftliche und gesellschaftliche
  Bindungen baut. Fast fünfunddreißig Jahre nach der Unterzeichnung des deutsch-ungarischen
  Freundschaftsvertrags im Jahr 1992 wollen wir unsere Partnerschaft stärken, ein
  neues, auf Vertrauen basierendes Kapitel in den deutsch-ungarischen Beziehungen
  aufschlagen und unsere Zukunft in der Europäischen Union gemeinsam gestalten. In
  diesem Sinne halten wir mit Blick auf die Erneuerung der bilateralen Beziehungen
  fest: In Zeiten geopolitischer und geoökonomischer Herausforderungen setzen wir
  uns im Geiste der europäischen Solidarität als Mitgliedstaaten der Europäischen
  Union und NATO -Alliierte gemeinsam für ein starkes, sicheres, freies und wettbewerbsfähiges
  Europa ein. Bereits heute leistet die deutsch-ungarische Zusammenarbeit in der Automobilindustrie,
  aber auch in vielen anderen Wirtschaftszweigen, einen gewichtigen Beitrag zu unseren
  Volkswirtschaften. Wir wollen unsere bilateralen Wirtschaftsbeziehungen weiter ausbauen,
  gezielt vertiefen und auf zusätzliche Wirtschaftssektoren ausweiten. Zugleich wollen
  wir den europäischen Binnenmarkt als Grundlage für ein attraktives, innovationsfreundliches
  und verlässliches Investitionsumfeld in Deutschland und Ungarn weiter stärken und
  vertiefen. Unsere gemeinsamen Anstrengungen für den Erhalt und die Weiterentwicklung
  einer wettbewerbsfähigen industriellen Basis in Europa wollen wir konsequent intensivieren,
  damit Europa im globalen Wettbewerb dauerhaft bestehen kann. Wir sind überzeugt,
  dass wir damit zugleich einen wesentlichen Beitrag dazu leisten, unser europäisches
  Wirtschafts- und Gesellschaftsmodell zukunftsfest zu machen und unsere freiheitliche
  europäische Lebensweise auch für kommende Generationen zu bewahren. Wir drängen
  auf ein gemeinsames Vorgehen auf europäischer Ebene zur Wahrung unserer Energiesicherheit.
  Wir stimmen darin überein, dass unsere Region unter erheblichem Migrationsdruck
  steht. Unser Ziel ist die Unterbindung der illegalen Migration sowie die Stärkung
  des Schutzes der EU -Außengrenzen. Im Jahre 2026 gedenken wir des 70. Jahrestages
  des ungarischen Aufstands und des Freiheitskampfes von 1956, bei dem für Freiheit
  und Selbstbestimmung gekämpft wurde. Dies bestärkt uns in unserem Bekenntnis zu
  den Grundwerten der Europäischen Union, auf denen unser friedliches europäisches
  Zusammenleben beruht: der Achtung der Menschenwürde, der Freiheit, der Demokratie,
  der Gleichheit, der Rechtsstaatlichkeit und der umfassenden Wahrung der Menschenrechte.
  Der kürzlich erfolgte Beitritt Ungarns zur Europäischen Staatsanwaltschaft unterstreicht
  das Bekenntnis zur Zusammenarbeit zur weiteren Stärkung der Rechtsstaatlichkeit.
  Als Mitgliedstaaten der Vereinten Nationen treten wir dafür ein, die regelbasierte
  internationale Ordnung aufrechtzuerhalten. Deutschland und Ungarn stehen daher weiterhin
  für die Souveränität und territoriale Integrität der Ukraine ein. Deutschland und
  Ungarn bekräftigen die Schlussfolgerungen des Europäischen Rates vom 18./19. Juni
  2026 und werden sich auf dieser Grundlage weiter für einen sofortigen Waffenstillstand
  sowie einen umfassenden, gerechten und dauerhaften Frieden in Freiheit im Ukraine-Krieg
  einsetzen. Angesichts der Instabilität im Nahen und Mittleren Osten wollen Ungarn
  und Deutschland ihre Bemühungen zur Förderung von Frieden und Sicherheit verstärken.
  Wir stehen für das Recht Israels auf Selbstverteidigung ein. Im Westbalkan liegt
  es in unserem gemeinsamen Interesse, Frieden, Stabilität, eine erfolgreiche Integration
  in die Europäische Union und wirtschaftliche Entwicklung zu gewährleisten. Wir sind
  fest entschlossen, alle Beitrittsländer im Prozess des Beitritts zur Europäischen
  Union zu unterstützen. In einem sich rasch verändernden globalen Umfeld wollen wir
  die Zusammenarbeit zwischen Ungarn und Deutschland intensivieren. Dazu haben wir
  uns verständigt: I. das Deutsch-Ungarische Forum für den Dialog zwischen Politik
  und Zivilgesellschaft zu stärken. Das nächste Forum im Herbst 2026 in Berlin verstehen
  wir als sichtbares Zeichen des Neubeginns in den deutsch-ungarischen Beziehungen.
  II. unsere Zusammenarbeit auf bilateraler, europäischer und multinationaler Ebene,
  insbesondere in der NATO , zu intensivieren, um Freiheit, Sicherheit, Wettbewerbsfähigkeit
  sowie eine zuverlässige und nachhaltige Energieversorgung zu stärken. III. Konsultationen
  auf fachlicher Ebene zwischen unseren Außenministerien zu Fragen der bilateralen
  Beziehungen und der Europapolitik sowie in den Bereichen Geoökonomie und Rüstungspolitik
  durchzuführen, soweit diese Themen unsere Ministerien betreffen. IV. den Austausch
  zwischen unseren Ministerien zur Stärkung strategischer Planung und Kommunikation
  angesichts aktueller Herausforderungen im Umgang mit Desinformation zu intensivieren.
  V. einen regelmäßigen deutsch-ungarischen Dialog zur besseren Vernetzung von Thinktanks
  zu schaffen. VI. den Austausch zwischen jungen Diplomatinnen und Diplomaten zu stärken
  und unsere Ausbildungsprogramme für den diplomatischen Dienst zu vernetzen. VII.
  die Entsendung von Austauschbeamtinnen und -beamten zwischen unseren Ministerien
  zu intensivieren. VIII. die enge Zusammenarbeit mit der Andrássy Universität Budapest,
  Jugendaustauschorganisationen sowie weiteren Partnerorganisationen im Kultur-, Sprach-
  und Bildungsbereich fortzusetzen und die Durchführung eines deutsch-ungarischen
  Kulturjahres 2028 zu prüfen. Wir begrüßen den unschätzbaren Beitrag von Wissenschaft,
  Bildung, Kultur, Zivilgesellschaft und Jugendaustausch für die deutsch-ungarischen
  Beziehungen und das gegenseitige Verständnis zwischen den Gesellschaften. IX. Wir
  widmen der bedeutenden ungarischen Diaspora in Deutschland, die einen besonders
  wichtigen Faktor in unseren bilateralen Beziehungen darstellt, sowie der deutschen
  Gemeinschaft in Ungarn, die die zweitgrößte Minderheit in Ungarn bildet, weiterhin
  besondere Aufmerksamkeit. Darüber hinaus liegen uns die Zukunft und der Zugang zum
  Deutschunterricht in Ungarn nach wie vor sehr am Herzen.'
