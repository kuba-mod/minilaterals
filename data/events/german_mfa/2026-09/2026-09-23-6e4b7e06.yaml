title: Statement von Außenminister Wadephul zur Sitzung des Sicherheitsrats zur Ukraine
text: 'Einmal mehr sind wir hier in der Runde der Ministerinnen und Minister zusammengekommen,
  um über den unprovozierten, ungerechtfertigten, illegalen und extrem brutalen Angriffskrieg
  zu sprechen, den Russland gegen die Ukraine führt. Und über Russlands Kampagne der
  hybriden Kriegsführung. Seit der letzten hochrangigen Versammlungswoche haben sich
  zwei Dinge geändert. Zum einen hat Russland seinen brutalen Angriffskrieg intensiviert.
  Vor einigen Wochen war ich in der Ukraine. Ich bin nach Charkiw gereist, wo stündlich
  die Luftalarmsirenen heulen. Und dennoch führen die Menschen – die tapferen Frauen
  und Männer der Ukraine – ihr Leben weiter, so gut es geht. Ich war in Kyjiw, dessen
  Einwohnerinnen und Einwohner inzwischen im Grunde genommen an der Front leben, da
  Raketen und Drohnen Tag und Nacht auf sie herabregnen und dabei immer mehr zivile
  Ziele angreifen. Im fünften Kriegsjahr bleibt es Russlands Ziel, den Widerstand
  der Ukraine zu brechen. Doch der Wille des ukrainischen Volkes, seine Freiheit zu
  verteidigen, bleibt ungebrochen. Genau wie unsere Unterstützung hierfür. Das Zweite,
  was sich geändert hat, ist dies: Russlands hybride Angriffe auf die Unterstützer
  der Ukraine, die Unterstützer des Völkerrechts, haben ein neues Ausmaß erreicht.
  Am 4. August versuchte Russland, mit einer mit Sprengstoff bestückten Drohne am
  Leipziger Flughafen zwei Frachtmaschinen zur Explosion zu bringen. Dabei handelt
  es sich bei Weitem nicht um das einzige Beispiel für Russlands unverantwortliche
  und gefährliche Eskalation in Europa. Und wir dürfen auch nicht vergessen, dass
  die Folgen dieses Krieges überall auf der Welt spürbar sind. Die diesjährige Getreideernte
  in der Ukraine war sehr ertragreich. Aber aufgrund der russischen Angriffe auf ukrainische
  Häfen kann das Getreide nicht auf den Weltmarkt exportiert werden. Dadurch verschärft
  Russland Hunger und Elend weltweit. Lassen Sie uns dafür sorgen, dass diese Spirale
  der Gewalt und Zerstörung durchbrochen wird. Ich bin überzeugt, dass das gelingen
  kann. Zuerst brauchen wir einen sofortigen und vollständigen Waffenstillstand, der
  am Schwarzen Meer beginnt, damit die lebenswichtigen Lieferungen von Getreide und
  Nahrungsmitteln erfolgen können. Zweitens muss ein umfassender Austausch von Kriegsgefangenen
  erfolgen, damit all jene heimkehren können, die lange genug gelitten haben. Und
  drittens bedarf es einer Rückkehr an den Verhandlungstisch, in redlicher Absicht
  und auf Grundlage der Prinzipien des Völkerrechts, um einem umfassenden, gerechten
  und dauerhaften Frieden den Weg zu ebnen. Die Ukraine ist seit Langem zu solchen
  Verhandlungen bereit. Russland jedoch lehnt sie weiterhin ab. Und kommt damit seiner
  Verantwortung als ständiges Mitglied des Sicherheitsrats nicht nach. Und Deutschland
  steht bereit, zu der Friedenslösung beizutragen, die wir so dringend brauchen.'
