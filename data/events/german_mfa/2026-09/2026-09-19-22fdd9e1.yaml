title: 'Außenminister Wadephul beim Harbourfront Literaturfestival: Impuls zum Panel
  „Szenario – die Zukunft steht auf dem Spiel!“'
text: 'ich freue mich, heute Abend hier zu sein, und in der Tat ist es eine Premiere
  für mich, auf dieser Bühne zu stehen. Anders als bei den Stücken, die Sie hier normalerweise
  sehen, ist das Drehbuch des heutigen Abends noch nicht geschrieben. Sie haben beschlossen,
  sich heute Abend mit der Zukunft auseinanderzusetzen. Nichts Großes also, bloß eine
  der größten Fragen der Menschheit. Es wurde mit meinem 40 jährigen Abo-Jubiläum
  ja bereits verraten, dass ich einen gewissen Teil von dem, was für mich mal „Zukunft“
  war, heute bereits als Geschichte betrachten kann. Wissen Sie, was mir in der Rückschau
  auffällt? Das, was für mich einmal Zukunft war, war damals eine vage Vorstellung.
  Eine Hoffnung vielleicht, Erwartungen und manches Mal auch Sorgen. Nichts erschien
  wirklich als zwangsläufig, und glaubte man zu wissen, was kommt, dann entpuppte
  sich das oft genug als Illusion. In der Retrospektive, auch in der Geschichtsschreibung,
  wird Geschichte oft als linearer Verlauf dargestellt. Eine Kette an zwangsläufigen
  Ereignissen, die so und so verlaufen mussten. Diese Betrachtung greift aus meiner
  Sicht fehl. Karl Schlögel würde hier von Geschichte als Gleichzeitigkeit von Ereignissen
  sprechen. Er nennt das „Gleich-Zeitigkeit und Gleich-Örtlichkeit“. Geschichte passiert
  nicht als Abfolge von Daten, sondern als unterschiedlichste Erfahrungen an Orten.
  Mir persönlich fällt da „Weimar“ als für uns höchst aktuelles Beispiel ein. Mir
  scheint, dass wir heute unter dem Schlagwort „Weimar“ von einer historischen Zwangsläufigkeit
  sprechen, die nicht aufgeht. Einer meiner Lieblingsautoren ist ja Sebastian Haffner,
  und aus seinen Texten lese ich immer wieder: Nichts war zwangsläufig oder vorherbestimmt!
  Sondern wir hatten es mit einer Koexistenz der Extreme zu tun, die in einer Katastrophe
  endete. Es war die Generation meiner Eltern, die als junge Menschen in diese Zeit
  hineingeboren wurden, und in einem Deutschland in Trümmern eine Vision für eine
  Zukunft entwerfen mussten. Was folgte, waren Jahre des Wiederaufbaus. Des Erfolgs
  der sozialen Marktwirtschaft. Des Wirtschaftswunders, das Deutschland wieder groß
  machte. Die schwierige Versöhnung mit Frankreich, durch die in einer gemeinsamen
  Anstrengung aus Feinden erst Partner und schließlich Freunde und Verbündete wurden.
  Um dann Europa in einer Gemeinschaft zusammenzuführen. Das alles waren keine linearen
  Ereignisse, keine Wenn-Dann Beziehungen. Manches, was gewiss und logisch schien,
  erfüllte sich nicht. Letztlich war das, was entstand, das Ergebnis beherzter Taten
  von Menschen, die die Zukunft in die eigene Hand nahmen. Die eine gemeinsame Vision
  von Freiheit, Sicherheit und Wohlstand schufen und danach handelten. Wann haben
  Sie das letzte Mal eine Vision für ihre Zukunft entworfen? Nicht der Zeitung entnommen,
  oder einem Podcast. Wann haben Sie das letzte Mal mit Optimismus in die Zukunft
  geblickt und dem Gefühl, es selbst in der Hand zu haben? Meine Damen und Herren,
  ich wage den Verdacht, dass uns das in Deutschland aktuell recht schwerfällt. Zum
  einen sehen wir die Krisen in der Welt. Extreme Wetterereignisse, die sich häufen.
  Technologischen Fortschritt, der sich scheinbar verselbstständigt. Und dann stellen
  wir fest, dass diese Krisen keine fernen Ereignisse an unserer Peripherie sind,
  sondern reale Auswirkungen auf unseren Alltag haben. Beispielsweise wird ein abstrakter
  „Hybrider Krieg“ auf einmal sehr real, wenn Russland bewaffnete Drohnen in unserem
  Land einsetzt. Das verdeutlicht: Unser Land ist in der Tat in einer ernsten Lage.
  Bedrohungen sind kein fernes Szenario mehr, sondern real geworden. Und ich kann
  verstehen, wenn angesichts der gefühlten Omnipräsenz von Krisen ein Gefühl der Ohnmacht
  um sich greift. Wie soll das auch anders sein, wenn wir tagtäglich apokalyptischen
  Schlagzeilen ausgesetzt sind? Wie soll das auch anders sein, wenn Nachrichten in
  den Kategorien Angst, Neid, Furcht und Hass naturgemäß höhere Reichweiten entfalten,
  als andere? Der vermeintliche Niedergang der Wirtschaft, eine als sicher vermutete
  Konfrontation, sogar der vielfach beschworene Untergang des Abendlandes. Die geopolitische
  Lage in der Welt ist für mich als Außenminister jeden Tag ein call to action . Und
  ich sehe sehr konkret, was da passiert. Ja, die Welt hält gefühlt jeden Tag eine
  neue Krise bereit, während wir noch dabei sind Lösungswege für die bereits existierenden
  auszuloten. Nächste Woche werde ich zur UN -Generalversammlung fahren. Eigentlich
  der Ort, an dem wir als Weltgemeinschaft zusammenkommen, um genau diese Lösungswege
  gemeinsam zu finden. Ich sage „eigentlich“, weil die UN in einer Phase der größten
  Anspannung seit ihrer Gründung steht. Eine UN , die der Wettstreit der Großmächte
  seit Jahren Stück für Stück untergräbt und deren Sicherheitsrat durch immergleiche
  Vetomuster in die Untätigkeit verbannt zu sein scheint. Deswegen ist es eine umso
  größere Herausforderung, international wieder handlungsfähig zu werden. Wenn wir
  eines gelernt haben, gerade als Deutschland, dann, dass wir es nur im gemeinsamen
  Verbund schaffen können. Und daran dürfen wir nicht aufhören zu glauben. Ich nehme
  als Politiker das Wort „Vision“ normalerweise nicht oft in den Mund. Das mag auch
  an meiner norddeutschen Seele liegen, oder daran, dass Helmut Schmidt es für immer
  in Verruf gebracht hat. Dennoch glaube ich, dass wir uns gerade heute, mehr denn
  je, vergegenwärtigen müssen, dass unsere Zukunft nicht festgelegt ist. Errungenschaften
  wie die liberale Verfasstheit unseres Staates verleihen jedem von uns die Freiheit,
  sich seiner oder ihrer Zukunft zu bemächtigen. Dafür braucht es aber einen Zukunfts-Willen.
  Die Überzeugung, dass unser gemeinsames Handeln einen besseren Weg für uns bereithält
  als den, der sich vermeintlich abzeichnet. Wenn Freiheit, Sicherheit und Wohlstand
  ein greifbares Ziel wird, dann folgt auch die kollektive Anstrengung es zu erreichen.
  Heute ist es an uns, es zu verteidigen und diese Geschichte fortzuschreiben. Es
  folgt zum Schluss ein Zitat, natürlich, wir sind ja bei einem Literaturfestival.
  Es stammt vom österreichischen Schriftstelle Arno Geiger: „Krisen bekommen ihre
  Bedeutung vom Ende her zugewiesen“ [1] Das sollten wir uns viel öfter vor Augen
  führen. Denn Ja, unsere Zukunft steht auf dem Spiel. Aber sie liegt auch in den
  besten Händen. [1] Arno Geiger in „Twist“, arte, 06.09.2026'
