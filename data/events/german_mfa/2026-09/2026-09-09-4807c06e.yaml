title: Rede von Außenminister Johann Wadephul in der Haushaltsdebatte des Bundestages
  (Haushaltsjahr 2027)
text: 'Ich darf mich zunächst bei allen Berichterstattern sehr herzlich für die konstruktiven
  Beratungen schon im Vorfeld der Haushaltsaufstellung bedanken. Wir werden diese
  jetzt intensiviert fortsetzen. Das Parlament ist der Ort, an dem am Ende das letzte
  Wort über den Haushalt des Auswärtigen Amtes und des Bundeshaushalts insgesamt gesprochen
  wird. Ich nehme die Anregungen, die wir hier schon bekommen haben, sehr gerne auf.
  Und Sie finden mich auch an Ihrer Seite, etwa wenn es darum geht, zu schauen, wo
  dieser Entwurf, der für das Auswärtige Amt in der Tat erneut schmerzhafte Einschnitte
  vorsieht, verbessert werden kann. Damit will ich nicht in Abrede stellen, dass auch
  das Auswärtige Amt einen Beitrag zur Konsolidierung des Bundeshaushaltes zu leisten
  hat. Wir haben im Auswärtigen Amt bereits 250 Stellen eingespart. Ich sage dazu,
  dass es in anderen Ressorts einen erheblichen Stellenzuwachs gibt. Wir haben eine
  Strukturreform in der Zentrale durchgeführt, Abteilungen zusammengefasst und dort
  eine erhebliche Zahl an Stellen eingespart. Wir stellen uns der Verantwortung. Aber,
  meine sehr verehrten Damen und Herren, ich muss an dieser Stelle natürlich darauf
  aufmerksam machen: Wer von uns erwartet, dass Visa schneller vergeben werden - das
  ist auch im wirtschaftlichen Interesse dieses Landes, der Unternehmerinnen und Unternehmer,
  die Handelspartner erwarten, die Fachkräfte erwarten -, der muss dem Auswärtigen
  Amt die notwendigen Stellen zur Verfügung stellen, damit Entscheider im konsularischen
  Bereich eingestellt werden können. Es ist auch eine Frage der Wirtschaftsförderung
  in Deutschland, wenn wir dafür Stellen zur Verfügung gestellt bekommen. Zum anderen
  geht es um die diplomatischen Anstrengungen. Diese kann man natürlich nur mit Personen
  vor Ort unternehmen. Diplomatie ist People Business. Sie findet von Angesicht zu
  Angesicht im persönlichen Gespräch statt. Deswegen habe ich entschieden, dass wir
  gerade in diesem Bereich keine Kürzungen vornehmen, sondern dass wir in den Auslandsvertretungen
  präsent bleiben. Ich möchte an dieser Stelle - das darf hier bei den großen politischen
  Diskussionen, die wir natürlich zu führen haben, nicht untergehen - auch eine Lanze
  für die Mitarbeitenden im Auswärtigen Amt brechen. Viele von ihnen haben wir in
  den letzten Wochen und Monaten zurückrufen müssen: aus Teheran, aus Bagdad, aus
  Erbil, um nur einige Beispiele zu nennen, aber auch aus Ländern in Lateinamerika.
  Denn es gab dort Kriege, Konflikte und andere Situationen, durch die Leib und Leben
  in Gefahr gewesen ist. Deswegen ein herzliches Dankeschön an alle Beschäftigten
  im Auswärtigen Amt, die dort tätig sind! Und ich verbinde das mit der herzlichen
  Bitte, sich bei den Haushaltsberatungen auch noch einmal die sächlichen Mittel für
  die Gebäudeinstandsetzung anzuschauen. Viele kennen das berühmte Beispiel vom Konsulargebäude
  in Neu-Delhi, wo die Mitarbeiter - einige waren ja da - mittlerweile neben Querstützen
  sitzen und Sorge haben müssen, dass ihnen im wahrsten Sinne des Wortes die Decke
  auf den Kopf fällt. Das sind keine zumutbaren Bedingungen. Deswegen darf ich Sie
  bitten, das abzuwägen und zu schauen, ob dort nicht mehr Mittel möglich sind; denn
  wir schulden unseren Beschäftigten wirklich gute Arbeitsbedingungen, und die können
  wir zum jetzigen Zeitpunkt nicht immer gewährleisten. Ein Dankeschön an alle Beschäftigten
  im Auswärtigen Dienst an dieser Stelle! Das Nächste ist das auch zu Recht angesprochene
  Feld der humanitären Hilfe. Ich habe auch in diesem Kreis schon mehrfach dafür plädiert,
  dort nicht zu kürzen, und ich werde das auch bei den parlamentarischen Beratungen
  erneut einbringen und natürlich auch parallel noch einmal Gespräche mit dem Herrn
  Finanzminister darüber führen. Die Mittel sind bedauerlicherweise erneut gekürzt
  worden. Es bleibt eine Verpflichtung Deutschlands, die wir ethisch haben, humanitäre
  Hilfe zu leisten. Das wird übrigens mehr. Ich konnte in der Ukraine jetzt noch mal
  50 Millionen Euro an Mitteln zusagen. Aber wenn Sie auf die Krisen und Konflikte
  dieser Welt schauen, wenn Sie sehen, dass die südliche Erdhalbkugel, insbesondere
  Südamerika, wahrscheinlich mit den Folgen eines El Niños konfrontiert sein wird,
  dann muss man erkennen, dass wir dort neue Herausforderungen haben. Und auch das
  dient deutschen Interessen. Die finanzielle Unterstützung bei jeder Krise und jeder
  Not, die wir vor Ort bekämpfen, mit der wir es den Menschen ermöglichen, da zu bleiben,
  wo sie eigentlich leben, und sie davon abhalten, zu migrieren, ist gut investiertes
  Geld und auch im deutschen und im europäischen Interesse, liebe Kolleginnen und
  Kollegen. Letztlich möchte ich noch einmal sagen: Es ist natürlich die Politik der
  Bundesregierung, dass wir fest an der Seite der Ukraine stehen. Meine lieben Kolleginnen
  und Kollegen, dazu muss ich und will ich aus voller Überzeugung auch nach meiner
  Reise in die Ukraine im fünften Jahr des Krieges wieder aufrufen. Ich bin vor wenigen
  Tagen dort gewesen. Wer erlebt, wie in einer Stadt wie Charkiw Studentinnen und
  Studenten zurückkehren in den Präsenzunterricht, der sieht ein Volk, das sich verteidigen
  will, das sich diesem Angriffskrieg nicht unterwerfen will, und an der Seite dieser
  Ukraine müssen wir weiter stehen. Das schulden wir den Menschen dort; das schulden
  wir der Friedensarchitektur Europas, und das ist eine sichere und eine notwendige
  Investition in Frieden und Sicherheit auch für Deutschland, meine sehr verehrten
  Damen und Herren. Ich möchte parallel darauf hinweisen - weil Sie das möglicherweise
  nicht wissen -, dass wir selbstverständlich auf allen diplomatischen Kanälen nicht
  nur an der Lösung des Hauptkonfliktes arbeiten, sondern auch daran, dass etwa die
  Getreidetransporte aus der Ukraine ermöglicht werden. Darüber habe ich erst gestern
  wieder mit dem ukrainischen Kollegen gesprochen, am Sonntag mit dem Kollegen aus
  Saudi-Arabien, und morgen wird das auch ein Thema mit dem Kollegen aus den Vereinigten
  Arabischen Emiraten sein. Wir versuchen dort, einen Weg zu finden, wie Russland
  und die Ukraine sich darauf verständigen können, dass das Getreide transportiert
  werden kann; aber Russland ist dazu derzeit nicht bereit. Ich hoffe, dass das möglich
  wird. Ich will nur darauf hinweisen: Das schadet Russland, das schadet der Ukraine,
  das schadet aber natürlich auch den Ländern, wohin das geliefert wird, nämlich beispielsweise
  Ägypten, das ein Drittel seines Getreides aus der Ukraine bezieht. Wenn das nicht
  dahin geliefert wird, dann haben wir eine weitere Fluchtursache gelegt, weil sich
  dann dort eine Hungersnot ausbreiten wird. Also: Wir sind klar an der Seite der
  Ukraine; aber wir versuchen auch, alles dazu beizutragen, dass dieser Konflikt auf
  dem friedlichen Weg beendet werden kann. Es scheitert bisher an Russland.'
