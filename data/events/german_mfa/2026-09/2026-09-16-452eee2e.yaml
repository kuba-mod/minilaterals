title: Gemeinsame Erklärung des Multilateralen Sanktionsüberwachungsteams (MSMT) über
  den Bericht zum Programm der Demokratischen Volksrepublik Korea bezüglich Arbeitskräften
  im Ausland
text: Der Wortlaut der folgenden Erklärung wurde von den Regierungen Australiens,
  Deutschlands, Frankreichs, Italiens, Japans, Kanadas, der Republik Korea, Neuseelands,
  der Niederlande, des Vereinigten Königreichs und der Vereinigten Staaten von Amerika
  anlässlich der Veröffentlichung des jüngsten Berichts des multilateralen Sanktionsüberwachungsteams
  veröffentlicht. Wir, die am multilateralen Sanktionsüberwachungsteam beteiligten
  Staaten, haben heute einen Bericht über die Verletzungen und Umgehungen der VN -Sicherheitsratsresolutionen
  durch die Demokratische Volksrepublik Korea durch den fortgesetzten Einsatz von
  nordkoreanischen Arbeitskräften im Ausland veröffentlicht. Das multilaterale Sanktionsüberwachungsteam
  ist ein im Oktober 2024 ins Leben gerufener multilateraler Mechanismus zur Überwachung
  und Berichterstattung über die Umsetzung der VN -Sanktionsmaßnahmen bezüglich der
  Demokratischen Volksrepublik Korea. Der Bericht ist auf der offiziellen Website
  des MSMT verfügbar ( https://msmt.info ). In diesem Bericht wird die systematische
  Umgehung der VN -Sanktionen durch die Demokratische Volksrepublik Korea und andere
  Länder durch ein globales Netzwerk unrechtmäßig im Ausland arbeitender Arbeitskräfte,
  was durch die VN -Sicherheitsratsresolutionen 2375 und 2397 verboten wird, detailliert
  beschrieben. In dem Bericht werden Informationen von am multilateralen Sanktionsüberwachungsteam
  teilnehmenden Staaten und öffentlich zugängliche Informationen zusammengeführt,
  um zu zeigen, wie die Demokratische Volksrepublik Korea nach wie vor geschätzt 35
  600 bis 101 280 Arbeitskräfte im Ausland einsetzt, von denen sich nahezu alle in
  der Volksrepublik China und in der Russischen Föderation aufhalten. Trotz der in
  VNSR-Resolution 2397 enthaltenen Frist für die Repatriierung bis 2019 wird vermutet,
  dass in mindestens 17 Ländern nach wie vor Arbeitskräfte eingesetzt werden, die
  2025 Einkünfte in Höhe von etwa 450 bis 800 Mio. US-Dollar erwirtschaftet haben,
  durch die die rechtswidrigen Kernwaffen- und Raketenprogramme der Demokratischen
  Volksrepublik Korea finanziert werden. Der Bericht unterstreicht, dass die Einkommen,
  die von nordkoreanischen Arbeitskräften im Ausland erzielt werden, nahezu vollständig
  von der Demokratischen Volksrepublik Korea beschlagnahmt werden. Das multilaterale
  Sanktionsüberwachungsteam gibt diese Informationen an die internationale Staatengemeinschaft
  weiter, um auf die mit der Beschäftigung nordkoreanischer Arbeitskräfte im Ausland
  einhergehenden erheblichen Risiken sowie die Notwendigkeit, von der Beschäftigung
  solcher Arbeitskräfte abzuschrecken, hinzuweisen. Wir ermutigen alle VN -Mitgliedstaaten,
  bei Parteien und Mittelsmännern, die für Verletzungen der VN -Sicherheitsratsresolutionen
  verantwortlich sind, das Bewusstsein zu schärfen und sie zur Rechenschaft zu ziehen,
  auch durch Maßnahmen im Inland. Dieser Bericht befasst sich mit der Überwachungslücke
  aufgrund der Auflösung des Expertenpanels des VN -Sicherheitsrats zur Überwachung
  von Resolution 1718 im April 2024 aufgrund des Vetos Russlands im März 2024. Der
  Bericht wird die internationale Staatengemeinschaft darin unterstützen, die einschlägigen
  VN -Sicherheitsratsresolutionen vollumfänglich umzusetzen. In Anbetracht der fortgesetzten
  Verletzungen und Umgehungen einschlägiger VN -Sicherheitsratsresolutionen rufen
  wir den Sicherheitsrat der Vereinten Nationen nachdrücklich auf, das Expertenpanel
  in der gleichen Stärke und Struktur wie vor seiner Auflösung wiedereinzusetzen.
  Wir unterstreichen einmal mehr unsere gemeinsame Entschlossenheit, die VN -Sicherheitsratsresolutionen
  uneingeschränkt umzusetzen. Das multilaterale Sanktionsüberwachungsteam wird weiterhin
  die Umsetzung der VN -Sicherheitsratsresolutionen in Bezug auf die Demokratische
  Volksrepublik Korea überwachen und fortgesetzte Versuche durch die Demokratische
  Volksrepublik Korea und andere Akteure, gegen diese Maßnahmen zu verstoßen und sie
  zu umgehen, öffentlich machen.
