title: 'Erneuerung und klare Zielsetzung: Wie müssen die VN in fünf Jahren aussehen
  – Runder Tisch auf Ministerebene im Rahmen der VN-Generalversammlung 2026'
text: Anlässlich der Tagungswoche auf hoher Ebene zum Auftakt der 81. Generalversammlung
  der Vereinten Nationen kam am 22. September 2026 eine Gruppe von Außenministerinnen
  und -ministern bzw. stellvertretenden Außenministerinnen und -ministern aus Ländern
  verschiedener Regionen der Welt in New York zusammen, um gemeinsame Ansätze zur
  Unterstützung der künftigen Generalsekretärin bzw. des künftigen Generalsekretärs
  bei der Einleitung entschlossener Maßnahmen zur Reform der VN zu erörtern. Die Veranstaltung
  wurde gemeinsam vom deutschen Außenminister Johann Wadephul, der singapurischen
  Außenministerin Vivian Balakrishnan und dem Außenminister Ghanas, Samuel Okudzeto
  Ablakwa, ausgerichtet. Des Weiteren nahmen die Außenministerinnen und Außenminister
  Fidschis, Finnlands, Kasachstans, Kenias und Mexikos sowie ein beigeordneter Minister
  aus Ägypten und hochrangige Vertreterinnen und Vertreter aus Brasilien und Frankreich
  an dem Treffen teil. Die Teilnehmerinnen und Teilnehmer am runden Tisch machten
  deutlich, dass sie dafür eintreten, die VN stärker und effizienter zu machen sowie
  besser dazu zu befähigen, die in der Charta der Vereinten Nationen verankerten Ziele
  zu verwirklichen. Sie stimmten darin überein, dass in einer Phase globaler Umbrüche
  reformierte und neu ausgerichtete Vereinte Nationen von zentraler Bedeutung für
  die Stabilisierung der internationalen Ordnung sind. Mit Blick auf die Leitfrage,
  welche Art von Vereinten Nationen die Weltgemeinschaft in fünf Jahren brauchen wird,
  unterstrichen die Ministerinnen und Minister ihre Entschlossenheit, die neue VN
  -Spitze dabei zu unterstützen, den Geist der Zusammenarbeit zwischen den Mitgliedstaaten
  neu zu beleben und multilaterale Lösungen für drängende Probleme unserer Zeit zu
  ermöglichen. Die Diskussionsrunde machte deutlich, dass strukturelle Reformen auf
  allen Ebenen und in allen Arbeitsbereichen auch weiterhin dazu beitragen müssen,
  das System effizienter und leistungsfähiger zu machen sowie seine Rechenschaftspflicht
  und Wirkmächtigkeit zu stärken und zugleich das Gleichgewicht zwischen den Säulen
  der VN aufrechtzuerhalten. Bündnisse zwischen Mitgliedstaaten aus verschiedenen
  Regionen und mit unterschiedlichen Hintergründen werden unerlässlich sein, um die
  erforderliche Dynamik beizubehalten. In Anbetracht der Wahl zwischen anspruchsvollen
  Reformen durch die Mitgliedstaaten und von außen erzwungenen Veränderungen durch
  Konflikte, Rivalitäten und Krisen sprachen sich die Ministerinnen und Minister für
  die gemeinsame Antwort eines entschlossenen Reformprozesses aus. Sie stimmten darin
  überein, dass eine Fortsetzung des Gesprächs zwischen den Ständigen Vertretern der
  Teilnehmerstaaten mit der Perspektive, weitere interessierte Partner einzubinden,
  wünschenswert ist.
