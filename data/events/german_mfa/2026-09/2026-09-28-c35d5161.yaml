title: Außenminister Wadephul vor seiner Abreise nach Den Haag, Bratislava und Straßburg
text: 'Vor seiner Abreise nach Den Haag, Bratislava und Straßburg erklärte Außenminister
  Wadephul heute (28.09.2026): Internationale Regeln sind nur so stark wie unsere
  Bereitschaft, für sie einzustehen. Gerade in einer Zeit, in der internationale Institutionen
  zunehmend infrage gestellt werden, müssen wir uns gemeinsam mit unseren weltweiten
  Partnern klar an ihre Seite stellen. Einer unserer engsten Partner überhaupt sind
  unsere Nachbarn in den Niederlanden. Mit ihnen verbindet uns die feste Überzeugung,
  dass verlässliche Regeln ein Gewinn für alle Beteiligten sind - sowohl in Wirtschaft
  und Handel, wie auch bei der Verteidigung grundlegender internationaler Normen.
  Neben meinem Antrittsbesuch im niederländischen Außenministerium werde ich in Den
  Haag gemeinsam mit meinem niederländischen Amtskollegen Tom Berendsen den Internationalen
  Strafgerichtshof besuchen. Er bekämpft Straflosigkeit bei den schwersten Verbrechen,
  die die internationale Gemeinschaft betreffen und sorgt gerade dort für Recht, wo
  nationale Justiz dazu nicht in der Lage oder nicht willens ist. Deutschland wird
  seinen Beitrag dazu leisten, dass der IStGH auch unter Druck handlungsfähig bleibt.
  Wir sind der zweitgrößte Beitragszahler des Gerichtshofs und arbeiten gemeinsam
  mit anderen Staaten daran, seine Funktionsfähigkeit zu erhalten. Deutschland weiß
  aus seiner eigenen Geschichte, wohin es führt, wenn staatliche Macht sich über Recht
  und Menschlichkeit hinwegsetzt. Die Unterstützung des IStGH ist für Deutschland
  deshalb keine rein außenpolitische Frage. Sie ist auch Teil unserer historischen
  Verantwortung. Um die Stärkung der internationalen Gerichtsbarkeit geht es auch
  beim Europarat in Straßburg, wo ich morgen unter anderem bei der Parlamentarischen
  Versammlung zu Gast bin. Die Europäische Menschenrechtskonvention und der Europäische
  Gerichtshof für Menschenrechte sind zentrale Errungenschaften unseres Kontinents,
  um Demokratie und Rechtsstaatlichkeit zu verteidigen. Für diese Werte selbstbewusst
  einzustehen, ist in Zeiten antidemokratischer und autoritärer Tendenzen wichtiger
  denn je. Wir wollen deswegen den Europarat als gesamteuropäische Stimme für das
  Recht stärken. Auch bei meinem Besuch in der Slowakei werde ich unterstreichen,
  wie wichtig es ist, dass wir die Werte, für die unser Kontinent steht, gemeinsam
  verteidigen und schützen. Deutschland und die Slowakei sind Partner in EU und NATO
  . Wir müssen uns in Europa darauf verlassen können, dass wir gemeinsam handeln -
  gerade wenn unsere Sicherheit bedroht ist. Um Russland von gefährlichen weiteren
  Abenteuern abzuschrecken, ist es unerlässlich, dass wir gemeinsam unsere Verteidigungsfähigkeit
  stärken und unsere Unterstützung für die Ukraine fortsetzen. Wenn Europa handlungsfähig
  sein will, müssen alle Mitgliedstaaten dafür Verantwortung übernehmen.'
