title: Gemeinsame Erklärung der Außenministerinnen und -minister sowie der hochrangigen
  Vertreterinnen und Vertreter Australiens, Deutschlands, Frankreichs, Japans, der
  Republik Korea, Neuseelands, Polens und des Vereinigten Königreichs
text: Wir, die Außenministerinnen und -minister sowie hochrangigen Vertreterinnen
  und Vertreter der europäischen und indopazifischen Partner (EIPP) — Australien,
  Deutschland, Frankreich, Japan, die Republik Korea, Neuseeland, Polen und das Vereinigten
  Königreich —, kommen heute am Rande der Generalversammlung der Vereinten Nationen
  in New York zu unserem zweiten Treffen zusammen. Wir erkennen an, dass das strategische
  Umfeld volatiler und zersplitterter ist als bei unserem letzten Treffen im September
  2025. Wir stellen fest, dass unsere Zusammenarbeit in gemeinsamen Grundsätzen und
  Interessen einschließlich Demokratie, Rechtsstaatlichkeit, Menschenrechten und Völkerrecht
  wurzelt. Wir bekräftigen unsere Überzeugung, dass wir Frieden, Stabilität, Nachhaltigkeit
  und Wohlstand im gesamten indopazifischen Raum und in ganz Europa wirksam fördern
  können, wenn wir geschlossen zusammenstehen, und dass VN -Mitgliedstaaten zur Erreichung
  dieser Ziele beitragen können und sollten. Wir lassen in unserer Entschlossenheit
  nicht nach, das auf dem Völkerrecht beruhende multilaterale System, in dessen Mittelpunkt
  die Charta der Vereinten Nationen steht, zu schützen und zu stärken, einschließlich
  der internationalen Rechtsprechungsorgane. Wir werden partnerschaftlich dabei zusammenarbeiten,
  die VN -Reformen voranzubringen, um die Organisation zu stärken und ihre Effizienz
  und Resilienz zu verbessern. In Anerkennung der Tatsache, dass Sicherheit und Wohlstand
  in Europa und im indopazifischen Raum zunehmend miteinander verknüpft sind, verpflichten
  wir uns, unsere Zusammenarbeit bei der Bewältigung gemeinsamer Herausforderungen
  zu intensivieren. Wir bekräftigen die Notwendigkeit, hybride Bedrohungen in allen
  Bereichen zu bekämpfen und die Widerstandsfähigkeit unserer Gesellschaften sicherzustellen.
  Wir bekräftigen unsere Unterstützung für die Souveränität und die territoriale Unversehrtheit
  aller Staaten. Mit Blick auf Russlands Angriffskrieg gegen die Ukraine betonen wir,
  wie wichtig eine vollständige Waffenruhe ist, und bekräftigen die Notwendigkeit
  eines gerechten und dauerhaften Friedens im Einklang mit den Grundsätzen der VN
  -Charta und des Völkerrechts, einschließlich Unabhängigkeit, Souveränität und territoriale
  Unversehrtheit. Wir unterstreichen, wie wichtig die Aufrechterhaltung von Frieden
  und Stabilität im indopazifischen Raum ist. Wir ermutigen zu Dialog und lehnen alle
  einseitigen Versuche zur Änderung des Status quo in der Taiwanstraße ab. Gemeinsam
  bekennen wir uns zu unserer Verpflichtung, das Seerechtsübereinkommen der Vereinten
  Nationen aufrechtzuerhalten. Störungen der Schifffahrtswege, einschließlich der
  Straße von Hormus und der Meerenge Bab al-Mandab, egal ob durch Gewalt, Drohungen
  oder die Einführung rechtswidriger Gebühren oder Bedingungen für den Transit, gefährden
  die Sicherheit und den Wohlstand aller, insbesondere der weltweit am stärksten Gefährdeten,
  und sind inakzeptabel. Wir fordern alle Länder auf, ihre Stimme zu erheben, wann
  immer dies geschieht.
