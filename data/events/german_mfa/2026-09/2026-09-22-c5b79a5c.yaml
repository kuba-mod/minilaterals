title: Gemeinsame G4-Ministererklärung zur Reform des Sicherheitsrats der Vereinten
  Nationen
text: 1. Die Außenminister der G4-Staaten – Mauro Vieira, Außenminister von Brasilien,
  Dr. Johann David Wadephul, Bundesminister des Auswärtigen von Deutschland, Dr. Subrahmanyam
  Jaishankar, Minister für auswärtige Angelegenheiten von Indien, und Motegi Toshimitsu,
  Minister für auswärtige Angelegenheiten von Japan – kamen am 22. September 2026
  in New York am Rande der 81. Tagung der Generalversammlung der Vereinten Nationen
  ( VN ) zusammen. 2. Die G4-Minister blickten zurück auf die Diskussionen, die im
  Rahmen der Regierungsverhandlungen (IGN) hinsichtlich der Reform des Sicherheitsrats
  der Vereinten Nationen (VNSR) während der 80. Tagung der VN -Generalversammlung
  stattgefunden hatten. Sie erörterten darüber hinaus die allgemeine Lage in den VN
  mit Blick auf die Aussichten für eine Reform des VN -Sicherheitsrats. Sie unterstrichen,
  dass die Reform des VN -Sicherheitsrats aufgrund des zunehmend herausfordernden
  geopolitischen Umfelds wichtiger denn je ist. 3. Die G4-Minister nahmen zur Kenntnis,
  dass der VN -Sicherheitsrat derzeit nicht in der Lage ist, seine zentrale Aufgabe,
  den Weltfrieden und die internationale Sicherheit aufrechtzuerhalten, wirksam zu
  erfüllen. Repräsentativität, Legitimität, Glaubwürdigkeit und Handlungsfähigkeit
  des VN -Sicherheitsrats stehen infrage. Die Ministerstellten fest, dass ein zentraler
  Grund hierfür eine anachronistische, acht Jahrzehnte alte Architektur ist, die die
  heutigen geopolitischen Realitäten nicht widerspiegelt und ein Hindernis für einen
  angemessenen Umgang mit gegenwärtigen und künftigen Herausforderungen darstellt,
  mit denen die Menschheit hinsichtlich Frieden und Sicherheit konfrontiert ist. 4.
  Vor diesem Hintergrund betonten die G4-Minister, dass es von entscheidender Bedeutung
  ist, die Reform des VN -Sicherheitsrats so schnell wie möglich umzusetzen, damit
  der Rat für seine Aufgaben gerüstet ist und die aktuellen geopolitischen Realitäten
  tatsächlich widerspiegelt. Sie unterstrichen, dass die Erweiterung des VN -Sicherheitsrats
  sowohl in der Kategorie der ständigen als auch der nichtständigen Mitgliedschaft
  zentral für eine solche Reform ist und dass diese Position von einer Mehrheit der
  Mitgliedstaaten unterstützt wird. In diesem Zusammenhang bekräftigten sie, wie wichtig
  es ist, die Vertretung der unter- oder nichtrepräsentierten Regionen und Gruppen
  wie Afrika, Asien-Pazifik sowie Lateinamerika und die Karibik in diesen beiden Kategorien
  zu verbessern. In Anerkennung der historischen Ungerechtigkeiten hinsichtlich der
  Vertretung im VN -Sicherheitsrat unterstrichen sie ferner die Bedeutung einer stärkeren
  Beteiligung der unter- oder nichtrepräsentierten Regionen und Gruppen wie Afrika,
  Asien-Pazifik sowie Lateinamerika und die Karibik; sie unterstrichen darüber hinaus
  die Bedeutung einer stärkeren Beteiligung der Mitgliedstaaten, die in bedeutender
  Weise zum Erhalt des Weltfriedens und der internationalen Sicherheit und zu den
  anderen Zielen der Vereinten Nationen beitragen. 5. Die G4-Minister begrüßten die
  Vorstellung des Reformmodells der Afrikanischen Gruppe in den IGN während der 80.
  Tagung. Sie unterstrichen ihre fortgesetzte Unterstützung für das überzeugende Anliegen
  Afrikas für eine bessere Vertretung im VN -Sicherheitsrat, auch in der Kategorie
  der ständigen Mitglieder. 6. Die G4-Minister nahmen zur Kenntnis, dass der IGN-Rahmen
  trotz seines 18-jährigen Bestehens weitgehend wirkungslos geblieben ist, wenn es
  um das Erzielen konkreter Ergebnisse für eine echte Reform des VN -Sicherheitsrats
  geht. Sie äußerten ihre große Sorge bezüglich der auch während der vorangehenden
  IGN-Sitzung ausgebliebenen Fortschritte. Insbesondere brachten sie ihre ernsthaften
  Vorbehalte hinsichtlich der Vorstellung eines so genannten Übergangsvorschlags noch
  vor der Aufnahme textbasierter Verhandlungen an. Sie bedauerten, dass der Vorschlag
  die Standpunkte einer klaren Mehrheit der Mitgliedstaaten, die eine Erweiterung
  in beiden Kategorien der Mitgliedschaft befürwortet, nicht berücksichtigt. Sie erinnerten
  ferner daran, dass im Einklang mit der VN -Charta und dem Mandat der IGN Konsens
  nicht der Maßstab für die Entscheidungsfindung über die Reform des VN -Sicherheitsrats
  ist. 7. Mit Blick auf die Zukunft wird die G4 weiter mit anderen reformorientierten
  Gruppen zusammenarbeiten und Synergien ausloten, um ein konsolidiertes Modell zu
  entwickeln, das die Stimme der Mehrheit der Mitgliedstaaten angemessen widerspiegelt,
  und mit hoher Priorität textbasierte Verhandlungen aufzunehmen, die der Schlüssel
  zur Verwirklichung einer echten und wirkungsvollen Reform des VN -Sicherheitsrats
  sind. Dies ist von entscheidender Bedeutung, um die Repräsentativität, Legitimität,
  Glaubwürdigkeit und Handlungsfähigkeit eines zentralen Organs der Vereinten Nationen
  wiederherzustellen und das multilaterale System mit den VN im Zentrum als Ganzes
  zu stärken. Sie bekräftigten, dass Diskussionen über die Reform nicht den IGN vorbehalten
  sind, und brachten ihre Bereitschaft zum Ausdruck, diese Frage mit einem breiteren
  Kreis der VN -Mitgliedstaaten in anderen Foren aufzunehmen, auch in der VN -Generalversammlung.
  8. Als Vertreter von Demokratien, die gemeinsame politische Werte einschließlich
  eines tiefen und unerschütterlichen Bekenntnisses zum Multilateralismus, der Rechtsstaatlichkeit
  und den Zielen und Grundsätzen der Charta der Vereinten Nationen teilen und die
  Bereitschaft sowie erwiesenermaßen die Fähigkeit besitzen, die wichtigste Aufgabe
  des VN -Sicherheitsrats, nämlich die Aufrechterhaltung des Weltfriedens und der
  internationalen Sicherheit, zu schultern, werden sich die G4-Minister im Rahmen
  der 81. Tagung der VN -Generalversammlung weiterhin eng abstimmen. Sie beauftragten
  hochrangige Beamte ihrer Länder, diese Diskussionen weiterzuverfolgen und während
  des nächsten Treffens auf Abteilungsleiterebene in New Delhi Bilanz zu ziehen.
