title: Rede von Außenminister Wadephul vor der Generalversammlung der Vereinten Nationen
text: 'man stelle sich vor, Kernwaffen würden von privaten Unternehmen entwickelt,
  sie würden auf dem Gelände von Unternehmen gelagert, und die Codes zur Zündung würden
  in einem Safe im Büro der Geschäftsführung aufbewahrt. Wenn eine Technologie die
  Macht hat, die Welt grundlegend zu verändern oder vielleicht sogar das Schicksal
  der Menschheit zu bestimmen, dann müssen wir uns folgende Fragen stellen: Heute
  steht die Menschheit wieder vor einer technologischen Revolution, die genau diese
  Fragen aufwirft. IT-Ingenieurinnen und -Ingenieure haben eine Technologie entwickelt,
  die den Lauf der Geschichte ändern kann, ohne dass sie mit Raketen oder von U-Booten
  aus eingesetzt werden muss. Natürlich spreche ich hier von künstlicher Intelligenz
  – einer Technologie mit scheinbar unbegrenzter Macht. Gerät sie in falsche Hände,
  kann sie unsere Volkswirtschaften aus den Angeln heben und unsere Existenzgrundlagen
  gefährden. Sie kann durch das Verbreiten vermeintlich echter, tatsächlich aber falscher
  Informationen das Vertrauen innerhalb unserer Gesellschaft potenziell untergraben.
  KI kann eine Gefahr für die Infrastruktur darstellen, auf deren Grundlage unsere
  Gesellschaft funktioniert. Letztendlich kann sie Entscheidungen beeinflussen, die
  über Frieden und Sicherheit auf der Welt bestimmen. Gleichzeitig birgt künstliche
  Intelligenz ein enormes Potenzial. Sie kann die Gewinnung wissenschaftlicher Erkenntnisse
  beschleunigen, die Gesundheitsversorgung und Bildung auf der ganzen Welt verbessern,
  Chancen für wirtschaftliche Entwicklung schaffen, Ungleichheiten beseitigen und
  uns bei der Überwindung von Herausforderungen helfen, die kein Land allein bewältigen
  kann. Man stelle sich nur einmal eine Welt vor, in der man mit der Hilfe von KI
  Hungersnöte verhindern und Krebs heilen kann. Genau das macht KI so mächtig – im
  guten wie im schlechten Sinne. Es bestehen jedoch gefährliche Spannungen. Die Unternehmen,
  die über den weitaus größten Anteil aller KI-Patente weltweit verfügen, haben ihren
  Sitz in nur zwei wichtigen Ländern. Das verleiht einer sehr kleinen Gruppe enormen
  Einfluss. Eine solche Macht zieht Verantwortung nach sich, nicht nur gegenüber Kunden,
  Aktionären oder Regierungen, Und wenn Macht global wird, muss auch die Verantwortung
  global werden. Die Vereinten Nationen wurden genau für einen solchen Moment geschaffen:
  wenn eine Herausforderung zu groß ist, als dass eine Nation allein sie stemmen kann.
  Wenn Risiken gemindert werden müssen, um die Menschen weltweit zu schützen. Und
  wenn Chancen so genutzt werden müssen, dass die größten und die kleinsten, die reichsten
  und die ärmsten Mitgliedstaaten davon profitieren. Heute jedoch stehen die Vereinten
  Nationen selbst unter Druck. Es gibt Großmächte, die glauben, sie kommen weiter,
  wenn sie die in der VN -Charta niedergelegten Regeln missachten. Durch die Aushöhlung
  des Völkerrechts wird der gewaltige zivilisatorische Fortschritt gefährdet, für
  den die Vereinten Nationen stehen. Der Grundsatz der souveränen Gleichheit aller
  Staaten. Die Überzeugung, dass jedem menschlichen Wesen Würde innewohnt. Die Untergrabung
  dieser Grundsätze mag den Interessen einiger weniger dienen – sie glauben, sie seien
  mächtig genug, um in einer Welt ohne Normen zu überleben oder ihre eigenen Regeln
  aufzustellen. Für uns, die überwältigende Mehrheit der 193 Staaten, die in der Generalversammlung
  vertreten sind, ist das schlecht. Wir wissen, dass die Menschen weltweit den Preis
  dafür zahlen müssen, wenn die Achtung des Völkerrechts untergraben wird. Und wenn
  die Institutionen, die es bewahren, angegriffen werden. Wenn sich dieser Prozess
  der Untergrabung fortsetzt, werden wir alle zu Verlierern. Doch dieser Druck auf
  die internationale Ordnung geht nicht nur von politischen Akteuren aus. Er entsteht
  auch durch die Kräfte der technologischen Revolution. Daraus ergibt sich eine entscheidende
  Frage: Wie befähigen wir unsere internationalen Institutionen dazu, mit den Technologien
  Schritt zu halten, die unsere Welt neu gestalten? Angesichts dieser Frage wird es
  nicht ausreichen, wenn wir uns nur auf das berufen, was wir an den Vereinten Nationen
  noch haben oder in der Vergangenheit hatten. Und es wird auch nicht helfen, ihre
  Schwächen auszublenden. Wir brauchen Ehrlichkeit, Realismus und Kooperation. Ehrlichkeit
  in unseren Analysen, Realismus bei unserer Zielsetzung und Kooperation als unsere
  Arbeitsmethode. Wir müssen anerkennen, dass viele der Pfeiler unseres gemeinsamen
  Hauses die Last, die wir ihnen aufbürden, nicht tragen können. Wir müssen entscheiden,
  welche Teile des Hauses wir erhalten und welche wir neu bauen wollen. Damit dieses
  Unterfangen gelingt, muss der neue Generalsekretär oder die neue Generalsekretärin
  einen tiefgreifenden Reformprozess anführen. Vor allem müssen wir die Lücke schließen
  zwischen den Erwartungen, die wir an die Vereinten Nationen haben, und den Fähigkeiten,
  mit denen wir sie ausstatten. Erstens brauchen wir funktionierende Vereinte Nationen,
  die eine aktive Rolle bei der Lösung von Konflikten spielen, anstatt sie nur zu
  verwalten. In Zeiten, in denen der Sicherheitsrat als zentrales Gremium der Entscheidungsfindung
  gelähmt ist, ist dies schwieriger als je zuvor. Seine Reform muss nach wie vor weit
  oben auf unserer Agenda stehen. Deutschland steht für Frieden und Sicherheit ein.
  Heute sind mehr Menschen als je zuvor von gewaltsamen Konflikten betroffen. Gleichzeitig
  stehen für jeden Mitgliedstaat nur begrenzte Ressourcen zur Verfügung. Deshalb müssen
  wir unsere Kräfte bündeln, um Konflikte zu beenden. Deutschland ist heute der größte
  Unterstützer der Ukraine bei ihrer Verteidigung gegen die russische Aggression.
  Diese Aggression wird von einer überwältigenden Mehrheit in der Generalversammlung
  konsequent verurteilt. Russlands Krieg richtet sich gegen das Leben von Millionen
  unschuldiger Menschen, die Existenz des ukrainischen Staates und der ukrainischen
  Kultur sowie die europäische Friedensordnung. Er gefährdet lebenswichtige Getreidelieferungen
  für Millionen von Menschen, insbesondere in Afrika, in Asien und im Nahen Osten.
  Er zeugt von Verachtung für die VN -Charta und die gemeinsame Ordnung, auf die wir
  uns stützen. Deshalb werden wir Russland weiterhin nachdrücklich auffordern, endlich
  an den Verhandlungstisch zu kommen. Ich rufe jeden Mitgliedstaat auf, Russland gemeinsam
  mit uns davon zu überzeugen, dass über die Zukunft am Verhandlungstisch entschieden
  wird und nicht durch das Töten von Menschen in Städten und Dörfern. Der Tag, an
  dem es endlich zu Verhandlungen kommt, wird ein guter Tag für die Vereinten Nationen
  sein. Deutschland übernimmt auch außerhalb Europas Verantwortung für Frieden und
  Sicherheit, etwa in Haiti, wo wir unseren Beitrag zur internationalen Mission für
  die Bekämpfung der Bandenkriminalität erheblich aufgestockt haben. Auch Sudan dürfen
  wir nicht vergessen. Auf der Sudan‑Konferenz im April in Berlin haben wir gemeinsam
  mit unseren Partnern über 1,7 Milliarden US-Dollar mobilisiert, um die größte humanitäre
  Katastrophe unserer Zeit einzudämmen. Zweitens stehen wir für eine friedliche und
  gerechte internationale Zusammenarbeit auf der Grundlage der Gleichheit. Ganz gleich,
  was seine Vertreter prophezeien: In Wahrheit würde unser Leben dadurch eingeschränkter,
  ärmer und weniger sicher. Stattdessen müssen die weltweiten Handelsbeziehungen diversifiziert
  und vertieft werden, und zwar im Rahmen einer gerechten Handelsordnung. Kein Land
  sollte es hinnehmen müssen, dass Rohstoffe dafür benutzt werden, Gehorsam zu erzwingen.
  Oder dass Lieferketten zu Druckmitteln werden. Keiner von uns ist demgegenüber machtlos.
  Dort, wo wir zusammenarbeiten, befreien wir uns von einseitigen Abhängigkeiten und
  eröffnen neue Freiräume. Gemeinsam mit unseren Partnern in der Europäischen Union
  haben wir durch neue Handelsvereinbarungen, Kooperationsabkommen und Partnerschaften
  mit dieser Arbeit begonnen. Diese Partnerschaften bauen auf gegenseitigem Respekt,
  gemeinsamen Regeln und der gemeinsamen Achtung des Völkerrechts auf. Sie tragen
  auch dem glücklichen Umstand Rechnung, dass sich viele Länder des globalen Südens
  außerordentlich erfolgreich entwickeln. Der gleiche Grundsatz der Partnerschaft
  und Kooperation gilt auch für Technologie. Der Zugang zu Rechenleistung, Daten,
  Fachwissen und Infrastruktur wird zunehmend darüber bestimmen, wer Innovationen
  einführen kann und wer die Regeln, die von anderen festgelegt werden, einfach akzeptieren
  muss. Zusammenarbeit muss daher Fähigkeiten schaffen, nicht neue Abhängigkeiten.
  Drittens wollen wir auf die großen globalen Fragen unserer Zeit gemeinsame Antworten
  finden. Niemand hier schafft das allein – nicht einmal die größten Staaten unter
  uns. Gemeinsam mit all denen, die bereit dazu sind, werden wir unsere Anstrengungen
  zur Bewältigung des menschengemachten Klimawandels und seiner verheerenden Folgen
  zügig und effektiv fortführen. Wir sind gezwungen, neue Wege zu beschreiten, und
  zwar schnell. Doch nirgendwo ist das zwingender nötig als auf dem Gebiet der künstlichen
  Intelligenz. Wir tragen gemeinsam Verantwortung dafür, sicherzustellen, dass diese
  Technologie im Dienste der Menschenwürde steht. Dies ist besonders dringend, da
  sie bereits das Fundament unserer Gesellschaft verändert. Die KI wartet nicht darauf,
  dass unsere Institutionen aufholen. Unsere Institutionen müssen die KI einholen.
  Zu Beginn meiner Ausführungen habe ich drei Fragen gestellt: Wir können sie nicht
  beantworten, indem wir einfach darauf vertrauen, dass diejenigen mit den größten
  Fähigkeiten stets im Interesse aller anderen handeln werden. Wir müssen gewährleisten,
  dass der technologische Fortschritt in einem Rahmen stattfindet, dessen Ausgestaltung
  wir alle mitbestimmen. Das heißt, wir müssen die Kapazitäten aufbauen, um zunehmend
  leistungsfähige KI-Systeme verstehen und bewerten zu können. Das heißt, wir müssen
  sicherstellen, dass alle Regionen an der Formulierung der Regeln mitwirken können.
  Und es heißt auch, dass wir von freiwilligen Zusagen zu mehr Transparenz gelangen
  und gemeinsame Standards entwickeln müssen. Deshalb ruft Deutschland alle VN -Mitgliedstaaten
  auf, sich für gemeinsame Sicherheitsanforderungen für die leistungsfähigsten KI-Modelle
  einzusetzen. Es sollte vorgeschrieben sein, dass Anbieter diese Modelle vor der
  Veröffentlichung testen und schwere Sicherheitsmängel melden. Diese Anforderungen
  sollten auf nationaler und regionaler Ebene wirksam kontrolliert werden. Die KI-Branche
  wird ihren Beitrag dazu leisten müssen und auch weiterhin dafür verantwortlich sein,
  den Weg zu gestalten, den diese Technologie nehmen wird. Gleichzeitig müssen wir
  für Rechenschaftspflicht sorgen – insbesondere dann, wenn potenziell der globale
  Frieden und die globale Sicherheit betroffen sind. Im Lauf dieser Woche haben wir
  unsere Gespräche zu diesen Fragen vertieft. Wie wir gemeinsam mit KI umgehen, ist
  eines der untrüglichsten Zeichen dafür, ob wir die Stärke und den Willen besitzen,
  die Vereinten Nationen für die heutige Welt zu rüsten. Der nächste Generalsekretär
  oder die nächste Generalsekretärin kann auf diesem Weg auf Deutschland zählen. Durch
  unsere Geschichte, unsere Geografie und unsere Verfassung sind wir an die VN -Charta
  und die Allgemeine Erklärung der Menschenrechte gebunden. Sie stehen im Zentrum
  unserer Staatlichkeit. Doch ein Grundsatz bleibt: Macht muss mit Verantwortung einhergehen.
  Und Fortschritt muss im Dienste der Menschenwürde stehen. Die Welt befindet sich
  seit langem in einem Modus permanenter Eskalation. Gleichzeitig navigieren die VN
  durch stürmische See. Wir müssen uns entscheiden: Wollen wir das Boot, in dem wir
  alle sitzen, wirklich kentern lassen, oder werden wir unsere Stärken bündeln und
  es zurück auf Kurs bringen? Gemeinsam können wir uns für Erneuerung einsetzen und
  eine friedliche Zukunft für kommende Generationen schaffen.'
