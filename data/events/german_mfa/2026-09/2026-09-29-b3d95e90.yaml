title: Gemeinsame Erklärung des Ministers für Auswärtige und Europäische Angelegenheiten
  der Slowakischen Republik und des Bundesministers des Auswärtigen der Bundesrepublik
  Deutschland über die Fortsetzung des vertieften Dialogs
text: 'Die partnerschaftlichen Beziehungen zwischen der Slowakischen Republik und
  der Bundesrepublik Deutschland beruhen auf gegenseitigem Vertrauen sowie auf einem
  offenen und konstruktiven Dialog. Sie basieren auf gemeinsamen Werten und Zielen
  und haben sich seit der Unterzeichnung des Vertrags über gute Nachbarschaft und
  freundschaftliche Zusammenarbeit zwischen der Tschechischen und Slowakischen Föderativen
  Republik und der Bundesrepublik Deutschland vom 27. Februar 1992 sowie seit der
  Gründung der Slowakischen Republik am 1. Januar 1993 kontinuierlich weiterentwickelt.
  Am 4. August 2017 begründeten der Minister für Auswärtige und Europäische Angelegenheiten
  der Slowakischen Republik und der Bundesminister des Auswärtigen der Bundesrepublik
  Deutschland den vertieften Dialog zwischen der Slowakischen Republik und der Bundesrepublik
  Deutschland. Er bietet eine Plattform für den Austausch und die Abstimmung von Positionen
  sowie für die Erarbeitung gemeinsamer Antworten auf aktuelle Herausforderungen,
  denen sich Europa gegenübersieht. Anlässlich des bevorstehenden zehnten Jahrestages
  seiner Einrichtung bekunden wir unsere Bereitschaft, die vertiefte Zusammenarbeit
  auch in der kommenden Zeit fortzuführen. Anknüpfend an den bisherigen politischen
  Dialog und wirtschaftlichen Austausch zwischen beiden Ländern sowie an das gemeinsame
  Interesse, zur Sicherheit und zum Wohlstand Europas beizutragen, vereinbaren wir
  gemeinsame Aktivitäten, die im Rahmen des vertieften Dialogs zur weiteren Intensivierung
  der bilateralen Beziehungen sowie zur Stärkung der europäischen und transatlantischen
  Strukturen im Geiste europäischer Solidarität und gemeinsamer Verantwortung beitragen
  sollen. Als Bereiche gemeinsamen Interesses betrachten wir insbesondere: die umfassende
  Erhöhung des Drucks auf die Russische Föderation auch mittels Sanktionen, um diese
  zur Beendigung des brutalen Angriffskriegs und zur Beteiligung an konstruktiven
  Verhandlungen zu bewegen, mit dem Ziel, einen sofortigen Waffenstillstand und einen
  umfassenden, dauerhaften und gerechten Frieden in der Ukraine zu erreichen. Beide
  Länder stimmen überein, auf der Grundlage der allgemeinen Grundsätze des Völkerrechts,
  die Souveränität und territoriale Integrität der Ukraine innerhalb ihrer international
  anerkannten Grenzen zu achten und Russlands Versuch, die Grenzen durch seinen völkerrechtswidrigen
  Angriffskrieg gewaltsam neu zu ziehen, nicht zu akzeptieren, die umfangreiche Unterstützung
  der Ukraine in ihrer Verteidigung gegen den unprovozierten, ungerechtfertigten und
  völkerrechtswidrigen Angriffskrieg der Russischen Föderation, die Bekräftigung der
  Unterstützung der europäischen Perspektive für die Ukraine, Moldau und die Staaten
  des westlichen Balkans, die Stärkung der Wettbewerbsfähigkeit, Diversifizierungsagenda
  und Wirtschaftssicherheit der Europäischen Union inklusive eines gemeinsamen Verständnisses
  über den Umgang mit geoökonomischen Herausforderungen. Beide Länder stimmen zudem
  überein, die Handlungsfähigkeit und Zukunftsfähigkeit der Europäischen Union sowie
  die Nachhaltigkeit, Unabhängigkeit, Sicherheit und Diversifizierung der europäischen
  Energieversorgung zu stärken, im Einklang mit den Zielen von REPowerEU, unter Berücksichtigung
  der besonderen Situation der einzelnen Mitgliedstaaten der Europäischen Union, die
  Stärkung der euro-atlantischen Sicherheits- und Verteidigungsarchitektur durch enge
  Zusammenarbeit und Komplementarität mit der NATO , einschließlich der Erfüllung
  des in Den Haag beschlossenen 5%-Ziels; Stärkung der Europäischen Union, unter anderem
  durch Mobilisierung von Mitteln für die Verteidigungsfinanzierung und die Stärkung
  der europäischen Sicherheits- und Verteidigungsindustrie; Stärkung des Europarats,
  der Organisation für Sicherheit und Zusammenarbeit in Europa sowie der Organisation
  für wirtschaftliche Zusammenarbeit und Entwicklung, die Stärkung der regelbasierten
  internationalen Ordnung angesichts der gegenwärtigen sicherheitspolitischen Herausforderungen,
  insbesondere in der Ukraine und im Nahen und Mittleren Osten, durch die Zusammenarbeit
  in internationalen Organisationen, insbesondere im Rahmen der Vereinten Nationen,
  den Schutz der Gründungsprinzipien, Rechte, Freiheiten und Werte der Europäischen
  Union, durch welche die Rechtsstaatlichkeit in der gesamten Europäischen Union gewahrt
  und gefördert wird, den Schutz der Menschenrechte und Bürgerrechte gemäß der Allgemeinen
  Erklärung der Menschenrechte, der Konvention zum Schutze der Menschenrechte und
  Grundfreiheiten sowie der Charta der Grundrechte der Europäischen Union, im Rahmen
  der Zuständigkeit der jeweiligen Fachressorts die Bildung eines attraktiven Investitionsumfelds
  mit dem Ziel, die Verbindungen zwischen beiden Ländern zu vertiefen und die Voraussetzungen
  für mehr Beschäftigung und Wirtschaftswachstum zu schaffen, die Stärkung des kulturellen
  Austauschs und Unterstützung der Entwicklung von Partnerschaften zwischen Regionen,
  Städten und Gemeinden beider Länder. Ausdruck der engen Zusammenarbeit zwischen
  dem Ministerium für Auswärtige und Europäische Angelegenheiten der Slowakischen
  Republik und dem Auswärtigen Amt der Bundesrepublik Deutschland sind regelmäßige
  Konsultationen auf hochrangiger Ebene sowie auf Arbeitsebene, um grundlegende politische
  Leitlinien strategisch weiterzuentwickeln und Gemeinsamkeiten in den Positionen
  zu aktuellen Fragen der Außen-, Sicherheits- und Europapolitik zu identifizieren
  und die oben genannten Ziele umzusetzen. Zudem finden Sitzungen der Slowakisch-Deutschen
  Reflexionsgruppe statt, die sich aus Vertreterinnen und Vertretern der Außenministerien
  sowie aus Expertinnen und Experten nichtstaatlicher Einrichtungen beider Länder
  zusammensetzt.'
