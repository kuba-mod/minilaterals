title: Außenminister Wadephul reist nach München und nach Genf
text: 'Vor seiner Abreise nach München und Genf erklärte Außenminister Dr. Johann
  Wadephul heute: Die Goethe-Institute in 100 Ländern sind unsere Botschaften deutscher
  Sprache und Kultur in der Welt. Dies möchte ich am Hauptsitz des Goethe Instituts
  im 75. Jahr seines Bestehens würdigen und gleichzeitig verdeutlichen, dass es in
  diesen unsicheren Zeiten darauf ankommt, intensiver denn je für unser Land zu werben.
  Sprachunterricht, Vermittlung deutscher Kultur und kulturelle Zusammenarbeit mit
  den Gastländern können starke Instrumente sein, um ein positives Deutschlandbild
  zu vermitteln. Ein Deutschlandbild, mit dem wir ambitionierte Menschen für unser
  Land gewinnen. Denn genau diese Menschen brauchen wir für ein leistungsfähiges,
  wirtschaftlich starkes Deutschland. Hierfür müssen alle Akteure der Außenpolitik
  als Team Deutschland mehr als je zuvor an einem Strang ziehen. Um dieses Team Deutschland
  geht es mir auch bei meiner Teilnahme an der Sitzung des bayerischen Kabinetts,
  zu dem mich Ministerpräsident Söder eingeladen hat. Als Auswärtiges Amt arbeiten
  wir weltweit für Deutschland. Und dabei vertreten wir nicht nur die Interessen der
  gesamten Bundesregierung, sondern selbstverständlich auch die Interessen aller Bundesländer
  und insgesamt aller Bürgerinnen und Bürger. Ein ganz zentrales Anliegen ist dabei
  die Sicherung unseres Wohlstands. Ich verstehe das Auswärtige Amt deswegen auch
  als ein Außenwirtschaftsministerium, das unsere Unternehmen weltweit unterstützt.
  Auf meinen Reisen begleiten mich häufig Unternehmerinnen und Unternehmer aus Bayern,
  die mich mit der Weltoffenheit und der Innovationskraft beeindrucken, die das Rückgrat
  der deutschen Wirtschaft bilden. Wie hoch hinaus Bayern will und kann, hat in der
  vergangenen Woche Isar Aerospace gezeigt. Mit dem ersten privaten Orbitalflug aus
  Kontinentaleuropa leistet ein bayerisches Unternehmen einen wichtigen Beitrag zur
  europäischen Weltraumsouveränität. Welche Wirkung Wirtschaftsdiplomatie haben kann,
  hat auch der Staatsbesuch von Scheich Mohamed bin Zayed Al Nahyan vergangene Woche
  gezeigt, bei dem die Vereinigten Arabischen Emirate 40 Milliarden Euro an Investitionen
  in Deutschlands Zukunft zugesagt haben – ein Viertel davon in Bayern. Das sichert
  und schafft Arbeitsplätze hier bei uns in Deutschland. Deutschlands Engagement in
  einer Welt der Kriege und Krisen steht im Fokus meiner Reise in die Hauptstadt der
  Menschenrechte - nach Genf zu den Vereinten Nationen und humanitären Organisationen.
  In Zeiten, in denen Menschenrechte weltweit zunehmen unter Druck stehen, wollen
  wir UN -Organisationen und Mechanismen stärken, die den Menschen ins Zentrum stellen.
  Deshalb kandidiert Deutschland für einen Sitz im UN -Menschenrechtsrat. Bei meinem
  Besuch werde ich auch die Führungsspitzen der Weltgesundheitsorganisation WHO und
  des Internationalen Komitees vom Roten Kreuz treffen. Das Rote Kreuz leistet Humanitäre
  Hilfe an den Frontlinien dieser Welt, dort wo andere oft keinen Zugang haben. Die
  WHO bekämpft Krankheitsausbrüche, ebenfalls unter schwierigsten Bedingungen, derzeit
  insbesondere Ebola. Der weltweite Bedarf für Humanitäre Hilfe steigt, gleichzeitig
  sinken die Mittel. Mit meiner Reise will ich verdeutlichen: Deutschland bleibt weiter
  engagiert. Humanitäre Hilfe ist unverzichtbar, rettet Menschenleben, lindert Not
  dort wo sie entsteht und beugt damit Fluchtursachen vor. Humanitäre Hilfe ist somit
  nicht nur ein Gebot der Menschlichkeit, sie dient auch den Sicherheitsinteressen
  unseres Landes.'
