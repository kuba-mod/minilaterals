title: Rede von Außenminister Wadephul zur Eröffnung des öffentlichen Abschlusspanels
  der Botschafterkonferenz 2026 mit NATO Generalsekretär Mark Rutte
text: 'Diese Woche werden in Berlin nicht nur im Auswärtigen Amt wichtige Diskussionen
  zur Außen- und Sicherheitspolitik geführt. Gestern sprach ich zur Haushaltsdebatte
  im Deutschen Bundestag. Dort begannen auch die Beratungen des sogenannten Einzelplan
  5, unserem Haushalt. Kenner wissen: Die härtesten Kämpfe führen Politiker nicht
  um Inhalte, sondern um die finanziellen Mittel, die diese Inhalte erst ermöglichen.
  Die größten Investitionen fließen derzeit in unsere Verteidigung. Gute Außenpolitik
  ist die beste Sicherheitspolitik. Und dafür brauchen wir auch den finanziellen Rückhalt.
  Dafür mache ich mich in der Bundesregierung, Parlament und Öffentlichkeit stark!
  Erst unsere Außenpolitik macht Deutschland sicher. Mit Leipzig ist die Bedrohung
  bei uns zuhause angekommen, sie ist greifbar. Der russische Anschlagsversuch auf
  dem Flughafen in Leipzig ist aber nur der jüngste Vorfall in einer Reihe konstant
  wachsender russischer Aggressionen gegen Europa, gegen die NATO . Russland und seine
  Partner agieren global vernetzt gegen unsere Interessen und für den eigenen imperialistischen
  Großmachts-Anspruch. Die Bundesregierung und wir als Teil dieser treten dem entgegen.
  Sie, unsere Leiterinnen und Leiter tun das sehr konkret durch ihr Wirken in unseren
  Botschaften und Konsulaten weltweit. Und das im Dienst eines Staates, der sicherheitspolitisch
  einen grundlegenden Wandel vollzieht. Etwas mehr als 70 Jahre nachdem Deutschland
  in die NATO aufgenommen wurde, sind wir eine der führenden Nationen im Bündnis geworden.
  In diesem Jahr investiert Deutschland 124,7 Milliarden Euro in „harte“ Fähigkeiten
  zur Verteidigung – voraussichtlich rund 2,7 Prozent unseres Bruttoinlandsprodukts.
  Bis 2029 werden es voraussichtlich mindestens 3,5 Prozent sein – wahrscheinlich
  dann über 150 Milliarden Euro. Hinzu kommen jeweils die Investitionen in die verteidigungsrelevante
  Infrastruktur. Hier liegen wir schon jetzt bei 1,5 Prozent. Diese Zahlen sind Ausdruck
  unserer politischen Prioritäten, die sich aus einem veränderten Sicherheitsumfeld
  ableiten. Wir gehen da voran und erwarten, dass unsere Partner in der NATO mitziehen.
  Wir investieren damit in die Zukunft der euro-atlantischen Sicherheit, in den europäischen
  Pfeiler der NATO und damit in die Stärkung der NATO insgesamt. Ich kann sagen: Im
  Ausland begegnet mir keine Skepsis angesichts unserer Investitionen in das Militär,
  sondern vielmehr Dankbarkeit und Vertrauen. Und wachsende Erwartungen, verbunden
  mit dem Wunsch nach mehr Kooperation. Auch das ist ein Auftrag an Sie, liebe Leiterinnen
  und Leiter. Stärken Sie Kooperationen mit unseren Partnern und in Ihren Gastländern.
  Wir stärken den europäischen Pfeiler in der NATO , weil dies die Allianz als Ganzes
  stärkt – ebenso wie unsere transatlantische Verbindung. Gerade in einer Zeit, in
  der die NATO einem politischen Stresstest unterzogen wird. Von außen, durch die
  Bedrohung durch Russland. Aber auch von innen, wenn der transatlantische Zusammenhalt
  in Frage gestellt wird. Und ganz konkret auch in unserem Land von interessierten
  Kreisen. Das konnte und kann jeder sehen, der die drei Landtagswahlkämpfe dieses
  Spätsommers verfolgt hat beziehungsweise mitverfolgt. Fragen zur NATO , zu unserem
  Zusammenhalt, werden Ihnen, liebe Kolleginnen und Kollegen, aber auch im Ausland
  zunehmend gestellt. Die Welt schaut auf uns, auf unser sicherheitspolitisches Handeln
  und ob wir uns in dieser Zeit der geopolitischen Spannung bewähren. Mit Blick auf
  uns als NATO , aber auch mit Blick auf die Ukraine. Dort kämpfen die Menschen für
  ein freies und sicheres Land in einem freien und sicheren Europa. Erst vor kurzem
  war ich in Charkiw, ca. 30 km von der Frontlinie entfernt, und habe mich mit der
  aktuellen Lage vertraut gemacht. Was ich sah: Die Ukraine ist heute ein starkes,
  resilientes und geeinigtes Land auf dem Weg in die Europäische Union. Ein ukrainischer
  Brigadegeneral sagte zu mir, dass für ihn jede weitere Flugabwehrrakete, mit der
  wir die Ukraine unterstützen, einen weiteren „Atemzug“ bedeute. Auch aufgrund dieser
  persönlichen Erlebnisse fühle ich mich dazu verpflichtet, dass Deutschland als inzwischen
  der größte bilaterale Unterstützer der Ukraine weiter an ihrer Seite steht. Wir
  tun das für die Ukraine, aber wir tun das auch für unsere Sicherheit in Europa.
  Daher werben auch Sie, liebe Leiterinnen und Leiter, in Ihren Gastländern für mehr
  Unterstützung der Ukraine. Lieber Mark, du bist der erste NATO -Generalsekretär
  auf einer Botschafterkonferenz des Auswärtigen Amts. Ich glaube, das ist auch ein
  Zeichen der gegenseitigen Wertschätzung. Du selbst hast nach dem Gipfel in Ankara
  gesagt: „Die NATO ist heute stärker denn je – geeint und bereit, jeden Zentimeter
  unseres Bündnisgebiets zu verteidigen.“ Dass wir heute an diesem Punkt stehen, ist
  auch Dir zu verdanken. Du führst die Allianz mit Umsicht, mit diplomatischem Geschick
  und mit einer Zuversicht, die ansteckend ist. Wir alle können viel von dir und deiner
  Art als zupackender Optimist lernen.'
