title: Erklärung der Hohen Vertreterin im Namen der Europäischen Union zu den sogenannten
  Präsidentschaftswahlen in der besetzten abtrünnigen Region Südossetien
text: Die Europäische Union erkennt die verfassungsrechtlichen und sonstigen rechtlichen
  Rahmenbedingungen einschließlich ihrer jüngsten Änderungen, unter denen die sogenannten
  Präsidentschaftswahlen in Georgiens besetzter abtrünniger Region Südossetien am
  18. September 2026 durchgeführt wurden, nicht an. Ihre Ergebnisse sind null und
  nichtig. Die Europäische Union verurteilt nachdrücklich die Maßnahmen, die von Moskau
  ergriffen wurden, damit ein russischer Amtsträger als De-facto-Präsident der besetzten
  abtrünnigen Region Südossetien in Georgien ernannt wird, missbilligt die Unterzeichnung
  des sogenannten Vertrags zur Vertiefung der Interaktion der Verbündeten am 9. Mai
  2026 und verurteilt in aller Schärfe die fortgesetzten Versuche Russlands, seine
  Kontrolle zu festigen, indem Südossetien in Russlands politische, militärische,
  wirtschaftliche und juristische Einflusssphäre eingebunden wird. Diese Maßnahmen
  laufen einer friedlichen Beilegung des Konflikts zuwider und stellen Schritte hin
  zu einer zukünftigen illegalen Annexion der besetzten abtrünnigen Region durch Russland
  dar. Solche Handlungen verfestigen systematisch Spaltungen, gefährden die regionale
  Sicherheit und Stabilität und verletzen auf eklatante Weise das Völkerrecht. Die
  Europäische Union bekräftigt ihr Bekenntnis zu einer friedlichen Beilegung des Konflikts
  in Georgien, auch durch ihren Ko-Vorsitz der internationalen Genfer Gespräche und
  die Beobachtermission der Europäischen Union ( EUMM ) in Georgien. Die Europäische
  Union fordert Russland auf, die Souveränität Georgiens zu respektieren und alle
  Aktivitäten einzustellen, die die territoriale Unversehrtheit des georgischen Staates
  untergraben. Die Europäische Union bekräftigt ihr unbeirrbares Eintreten für die
  Souveränität und territoriale Unversehrtheit Georgiens innerhalb seiner international
  anerkannten Grenzen.
