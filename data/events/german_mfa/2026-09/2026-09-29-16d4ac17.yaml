title: Rede von Außenminister Wadephul vor der Parlamentarischen Versammlung des Europarats
  in Straßburg
text: 'ein herzliches Dankeschön für das Willkommen und in der Tat: Es ist für mich
  auch eine Rückkehr – in die Parlamentarische Versammlung, der ich selber viele Jahre
  angehört habe. Als ich 1995 in den Bundestag gewählt wurde, bin ich gleich in die
  deutsche Delegation integriert worden. Später war ich dann stellvertretendes Mitglied
  und ich erinnere mich heute immer noch gerne an diese Zeit zurück, die bis heute
  meinen Politikansatz prägt. An die Themen, die wir damals als Parlamentarier besprochen
  haben – von Menschenrechten im Allgemeinen zur Pressefreiheit im Speziellen – bis
  hin zur Durchführung freier und fairer Wahlen. An den offenen Austausch mit den
  Kolleginnen und Kollegen – unabhängig von der politischen Konstellation im Herkunftsland.
  Und an neue Perspektiven, die sich daraus ergaben, wenn man die Dinge einmal aus
  einem anderen Blickwinkel und mit neuen Argumenten betrachtet hat. Übrigens erwies
  sich eine Abstimmung, an der ich 2012 beteiligt war, als besonders weise Voraussicht:
  Nämlich die Einführung von Italienisch und Deutsch als offizielle Sprachen der Parlamentarischen
  Versammlung ermöglicht es mir, dass ich heute hier als deutscher Außenminister auf
  Deutsch sprechen darf. der Europarat hat aber nicht nur für mich persönlich, sondern
  auch für mein ganzes Land eine besondere Bedeutung: Denn der Europarat war die allererste
  multilaterale Institution, der die Bundesrepublik Deutschland nach dem Zweiten Weltkrieg
  beigetreten ist. Noch vor der Neugründung eines deutschen Staats nach dem Zweiten
  Weltkrieg war die deutsche Delegation dabei, als 1948 über die Gründung des Europarats
  gesprochen wurde. Alle Gründungsmitglieder hatten damals die unbeschreiblichen Verbrechen
  des Nazi-Regimes vor Augen: Sie hatten selbst miterlebt, wie Deutschland den europäischen
  Kontinent in einen brutalen Vernichtungskrieg gestürzt hatte. Sie einte daher die
  Überzeugung, dass Frieden in Europa dauerhaft nur auf gemeinsamen Werten aufgebaut
  werden könnte. Und dass „ Demokratie, Menschenrechte und Rechtsstaatlichkeit “ die
  drei Säulen des Europarats sein sollten. Diese Überzeugung ist heute wichtiger denn
  je. Denn wir erleben seit über vier Jahren Putins brutalen, völkerrechtswidrigen
  Angriffskrieg gegen die Ukraine. Weil Putin den Krieg bis heute nicht zu seinen
  Gunsten entscheiden konnte, sucht er unablässig nach Wegen, den Widerstandswillen
  der Ukrainerinnen und Ukrainer zu brechen. Gerade mit Blick auf den bevorstehenden
  Winter zielt Russland systematisch auf die zivile Wärme- und Energieinfrastruktur.
  Dafür nimmt Putin abertausende Tote und Verletzte – nicht zuletzt auch in seiner
  eigenen Bevölkerung – in Kauf. Deshalb war es richtig, dass Russland am 16.03.2022
  vom Europarat ausgeschlossen wurde. Noch 2019 war die russische Delegation in die
  parlamentarische Versammlung zurückgekehrt. Doch auch diese ausgestreckte Hand hat
  Putin ausgeschlagen. Wer völkerrechtswidrige Angriffskriege führt, hat hier keinen
  Platz! Aber: Das ist nicht alles. Russlands Aggression endet schon lange nicht mehr
  an der Grenze der Ukraine. Russland verhindert durch gezielte Angriffe auf ukrainische
  Häfen die Ausfuhr lebenswichtiger Getreidelieferungen. Wir reden hier von Millionen
  von Menschen, die darunter leiden. Dazu kommen hybride Angriffe, wir haben das ja
  kürzlich selbst miterlebt in Deutschland mit dem Drohnenvorfall in Leipzig. Und
  wir sind damit nicht allein: In vielen unserer Mitgliedstaaten erleben wir Cyberangriffe
  und Sabotage kritischer Infrastruktur. Erst heute haben auch unsere estnischen Freunde
  bezüglich des Brandanschlags in Tallinn am 14. Und 15 August klar die Verantwortung
  Russlands festgestellt. Dazu kommen breitgestreute Propaganda- und Desinformationskampagnen.
  Weil Putin dem Irrglauben unterliegt, dass er unsere freien Gesellschaften dadurch
  verunsichern könnte. Weil er unsere demokratischen Institutionen schwächen und unsere
  Unterstützung für die Ukraine unterbinden möchte. Wir stehen fest an der Seite der
  Ukrainerinnen und Ukrainer. Weil sie nicht nur ihre eigene, sondern unser aller
  Freiheit verteidigen. Es ist Putin, der einen Weg zu einem Waffenstillstand verhindert.
  Trotz internationaler Vermittlungsversuche, trotz steigendem Sanktionsdruck und
  trotz immenser eigener Verluste zeigt er keinen ernsthaften Verhandlungswillen.
  Auch dieser schreckliche Krieg wird ein Ende haben. Und gerade mit Blick auf das
  „Danach“, den Wiederaufbau der Ukraine und den Umgang mit den vergangenen Kriegsverbrechen
  kann der Europarat eine wichtige Rolle einnehmen. Denn er setzt bereits jetzt auf
  Accountability : Um sicherzustellen, dass das Leid der Ukrainerinnen und Ukrainer
  dokumentiert wird. Dass die für die Verbrechen der Aggression Verantwortlichen zur
  Rechenschaft gezogen werden können. Der Europarat trägt dazu bei, die institutionellen
  Grundlagen für Gerechtigkeit und Wiedergutmachung zu schaffen: Mit dem Schadensregister,
  der Internationalen Schadensersatzkommission und dem Sondertribunal für das Verbrechen
  der Aggression gegen die Ukraine. Wir werden unser Ratifikationsverfahren für den
  deutschen Beitritt zur Schadensersatzkommission bis Ende des Jahres abschließen.
  Und wir setzen uns dafür ein, dass auch das Sondertribunal baldmöglichst eingerichtet
  werden kann. Damit verteidigt der Europarat Rechtsstaatlichkeit und Menschenrechte
  als Basis unserer Demokratien – und zwar weit über die Ukraine hinaus: Er setzt
  sich dafür ein, dass jeder Einzelne darauf vertrauen kann, dass seine individuellen
  Rechte und Grundfreiheiten geschützt werden. Dafür, dass Menschen frei ihre Meinung
  äußern und sich versammeln können. Dafür, dass Gerichte ihre Urteile unabhängig
  von der politischen Führung fällen können und diese auch umgesetzt werden. Dafür,
  dass Wahlen nicht nur so genannt werden – wie jüngst erneut von der Russischen Führung
  –, sondern tatsächlich frei und fair sind. Dafür, dass staatliche Macht Grenzen
  hat. Und Sie, meine Damen und Herren, ringen als Parlamentarier Ihrer Mitgliedsstaaten
  um die besten rechtlichen Grundlagen für Ihre Gesellschaft, in dem Sie Gesetze schaffen
  und dabei auch das Konventionssystem des Europarats berücksichtigen. Sie – wir!
  – haben das größte Interesse daran, dass diese Gesetze dann auch respektiert werden.
  Damit Rechtsstaatlichkeit keine leere Hülle bleibt! Der Europarat ist aber nicht
  nur eine Organisation, die auf Kriege und Krisen reagiert. Er ist ein Ort, der uns
  an etwas besonders Wichtiges erinnert: Daran, dass Demokratie kein Zustand ist,
  den man einmal erreicht hat und der dann für immer anhält. Daran, dass Demokratie
  vielmehr immer wieder auf’s Neue verteidigt, erneuert und gelebt werden muss. Jeden
  Tag! Gerade heute, da unsere gemeinsamen Werte vielerorts in Frage gestellt werden.
  In Zeiten, in denen digitale Einflussnahme und neue Technologien – insbesondere
  künstliche Intelligenz – unsere öffentlichen Debatten verändern. In Zeiten, in denen
  unsere demokratischen Institutionen und die Unabhängigkeit der Justiz von Außen
  und von Innen bedroht werden. Die Antwort darauf darf nicht weniger Demokratie sein.
  Sie muss mehr Demokratie sein – und vor allem: widerstandsfähigere Demokratie. Hierin
  sehe ich eine besondere Stärke der Parlamentarischen Versammlung des Europarats:
  Sie bringt die demokratisch gewählten Vertreterinnen und Vertreter unserer Staaten
  zusammen. Sie versammelt Parlamentarier, die nicht immer einer Meinung sind, aber
  gemeinsame europäische Grundlagen haben. Gerade diese Fähigkeit zum Dialog ist heute
  von unschätzbarem Wert. Diesen Dialog aufrecht zu erhalten – als Basis unserer Demokratien
  – darin sehe ich die zentrale Aufgabe der parlamentarischen Versammlung – auch in
  der Zukunft! Und ich bin überzeugt: In den heutigen Zeiten des Umbruchs sollte sich
  der Europarat auf das besinnen, was ihn und seine PV unverwechselbar macht. Nämlich,
  sein Kernmandat – nämlich Demokratie, Menschenrechte und Rechtsstaatlichkeit in
  seiner Arbeit zu priorisieren. Aber auch, das Kernmandat weiterzuentwickeln – dort,
  wo neue Herausforderungen es erfordern. Dazu gehört, bestehende Konventionen fortzuentwickeln
  und neue gemeinsame Standards zu schaffen. Beim Thema KI, war der Europarat beispielweise
  von Anfang an vorne mit dabei und hat als Pionier Normen gesetzt. Wir brauchen diese
  Zukunftsorientiertheit, aber auch die Fokussierung auf das Wesentliche. der Russische
  Angriffskrieg, die Situation in Nahost, der Großmächtewettbewerb zwischen den USA
  und China, Migrationsbewegungen und die Auswirkungen des Klimawandels, das Erstarken
  von Autokratien, die Zusammenarbeit mit unseren Nachbarstaaten und die Einbindung
  der Jugend – für deren Belange der Europarat ganz besonders eintritt – das sind
  nur einige Beispiele, die Sie, die mich täglich beschäftigen. Die heutige geopolitische
  Lage ist alles andere als einfach. Oft hält die Welt schon wieder eine neue Krise
  bereit, während wir noch dabei sind, Lösungswege für bereits existierende auszuloten.
  Gerade in diesen bewegten Zeiten möchte ich als deutscher Außenminister, aber auch
  als ehemaliges Mitglied, eine Lanze für den Europarat und die Parlamentarische Versammlung
  brechen. Diese Organisation ist eine historische Errungenschaft! Ohne den Europarat
  wäre Europa ärmer, instabiler, weniger rechtssicher, weniger frei und weniger demokratisch!
  Er ermöglicht es Ihnen, liebe Kolleginnen und Kollegen, unser aller Zukunft aktiv
  mitzugestalten und die Herausforderungen von heute und morgen gemeinsam zu bewältigen.
  Genau darin liegt Ihre Stärke – und unsere gemeinsame Verantwortung. Herzlichen
  Dank für die Aufmerksamkeit, ich freue mich auf den Austausch.'
