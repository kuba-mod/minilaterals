title: Rede von Außenminister Wadephul anlässlich des Empfangs zur deutschen Kandidatur
  für den Menschrechtsrat der Vereinten Nationen
text: 'Wir kommen hier heute nicht nur als Vertreterinnen und Vertreter von Staaten
  oder Organisationen zusammen, sondern auch als Hüterinnen und Hüter eines Versprechens.
  Eines Versprechens, das mit der Gründungsresolution des Menschenrechtsrats 2006
  gegeben wurde. Nämlich, dass der Rat für die „Förderung der allgemeinen Achtung
  des Schutzes aller Menschenrechte und Grundfreiheiten für alle“ verantwortlich sein
  würde. Dieses Versprechen mag abstrakt klingen, doch das ist es nicht. Denn Menschenrechte
  sind keine abstrakten Rechtsformeln. Sie wirken sich unmittelbar und konkret auf
  das Leben der Menschen aus. Sie wirken sich auf diejenigen aus, die ihre Rechte
  wahrnehmen und für sie kämpfen: Die Journalistin, die es wagt, einer autoritären
  Regierung die Wahrheit ins Gesicht zu sagen. Der Gläubige, der sich weigert, seinen
  täglich praktizierten Glauben zu verstecken. Das Kind, das inmitten von Kriegswirren
  von Schulbildung träumt. Die Frauen, die darauf hoffen, dass Gleichberechtigung
  Wirklichkeit wird. Diejenigen, deren Würde ganz grundlegend von einem Glas sauberen
  Trinkwassers und sicheren Sanitäranlagen abhängt. Und Menschenrechte bilden einen
  Schutzschild gegen den Albtraum von Sklaverei und Folter. An dieser Stelle möchte
  ich Ihnen die deutsche Künstlerin Paula Doepfner vorstellen, die mich heute begleitet.
  Ich möchte Sie einladen, sich später ihre Werke anzusehen, die heute hier ausgestellt
  sind. Auf den ersten Blick mögen sie abstrakt erscheinen. Erst bei genauerem Hinsehen
  kann man in ganz kleinen Buchstaben den Wortlaut des Istanbul‑Protokolls auusmachen
  – eines Handbuchs der Vereinten Nationen über die Untersuchung und Dokumentation
  von Folter. um es mit anderen Worten auszudrücken: Menschenrechte wahren den Kern
  dessen, was uns als Menschen ausmacht. Ob im bürgerlichen, politischen, wirtschaftlichen,
  gesellschaftlichen oder kulturellen Bereich – alle Menschenrechte sind wichtig.
  Denn ohne Gerechtigkeit kann es keinen Frieden geben. Ohne Würde kann es keine Entwicklung
  geben. Ohne Kultur kann es keine Freiheit geben. Die Geschichte meines eigenen Landes
  hat gezeigt, was passiert, wenn Menschenrechte systematisch zerstört werden und
  mörderischer Terror an ihre Stelle tritt. Menschenrechte sind, bis zum heutigen
  Tag, niemals eine Selbstverständlichkeit. Deutschland ist sich seiner Verantwortung
  bewusst: der Verantwortung, dort für Menschenrechte einzustehen, wo sie verletzt
  oder infrage gestellt werden – im unserem eigenen Land und weltweit. Wir werden
  – wie wir das bereits zuvor getan haben – gemeinsam mit Ihnen daran arbeiten zu
  gewährleisten, dass niemand schutzlos bleibt und dass Menschenrechte unabhängig
  von persönlicher Herkunft oder politischem System bewahrt werden. Wenn wir in den
  Menschenrechtsrat gewählt werden, werden wir uns weiterhin für die weltweite Geltung,
  Unteilbarkeit und Interdependenz der Menschenrechte einsetzen. Wir werden auch in
  Zukunft die internationale Menschenrechtsarchitektur mitgestalten und stärken. Gleichzeitig
  müssen wir anerkennen, dass sich die Welt um uns verändert und der Druck auf das
  multilaterale System rapide wächst. Der Rat muss sich diesen Entwicklungen anpassen!
  Wir müssen als Institution mehr Wirkung entfalten und auch unsere Instrumente gründlich
  überprüfen. Wenn wir gewählt werden, wird Deutschland aktiv an der Reform des Rates
  mitwirken: Wir wollen einen Rat mitgestalten, der nicht nur wirksamer, sondern auch
  integrativer und ergebnisorientierter arbeitet. Wir wollen die kritische Rolle der
  Zivilgesellschaft wahren, den Schutz von Menschenrechtsverteidigerinnen und -verteidigern
  vor Repressalien weltweit verbessern und Mechanismen stärken, um Straflosigkeit
  für Menschenrechtsverletzungen zu verhindern, auch durch internationale Gerichte.
  Deshalb setzen wir uns derzeit für die Ausweitung des Mandats der Sonderberichterstatterin
  über Russland ein. Die internationale Gemeinschaft muss über die systematische Unterdrückung
  in Russland informiert werden. Russische Menschenrechtsverteidigerinnen und -verteidiger
  brauchen eine Institution, an die sie sich wenden können – heute mehr denn je! Deshalb
  haben wir auch mitgeholfen, das Mandat der Untersuchungskommission für Syrien anzupassen,
  um den Übergang zu einem neuen Syrien in enger Zusammenarbeit mit der syrischen
  Regierung zu unterstützen. Und deshalb fordern wir schließlich eine Rechenschaftspflicht
  und die Ausweitung der Erkundungsmission für Sudan. Um zu gewährleisten, dass vom
  Krieg zerrüttete Gesellschaften eine echte Chance auf die Wiederherstellung von
  Frieden haben und dass die Stimme der Opfer gehört wird. Reformen, wirksame Instrumente
  und einzelne Vorhaben brauchen Ressourcen – um die Lücke zwischen unseren Ansprüchen
  und der Wirklichkeit vor Ort zu schließen. Deshalb ist Deutschland auch der zweitgrößte
  Beitragszahler des gesamten Systems der Vereinten Nationen und finanziert maßgeblich
  den Hochkommissar der Vereinten Nationen für Menschenrechte sowie die Sonderverfahren
  des Rates. Deutschland ist entschlossen, das System am Leben zu erhalten! Ich freue
  mich sehr, Ihnen heute Abend mitteilen zu können, dass Deutschland einen zusätzlichen
  freiwilligen Beitrag in Höhe von sechs Millionen Euro für den Hochkommissar für
  Menschenrechte leisten wird. wir alle kennen die Herausforderungen der heutigen
  Welt. Aber wir kennen auch die Kraft gemeinsamen Handelns. Menschenrechte brauchen
  unsere gemeinsamen Anstrengungen – und ich möchte in diesem Zusammenhang auch unseren
  hochgeschätzten Mitbewerber Irland würdigen, wie wir selbst Mitglied der Gruppe
  der westeuropäischen und anderen Staaten. Ich möchte dem irischen Vertretern danken,
  dass er heute Abend hier ist. Exzellenzen, liebe Kolleginnen und Kollegen, wir möchten
  mit Ihnen allen zusammenarbeiten. Wir möchten zuhören, Gräben überbrücken und in
  unserem kollektiven Einsatz für Menschenrechte und Menschenwürde einen gemeinsamen
  Nenner finden. Machen wir zusammen deutlich, dass die Grundsätze des Menschenrechtsrates
  nicht abstrakter Natur sind. Setzen wir sie in die Tat um – miteinander.'
