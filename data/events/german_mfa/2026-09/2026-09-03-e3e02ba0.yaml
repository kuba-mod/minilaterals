date: '2026-09-03'
type: press_release
source_name: german_mfa
title: Gemeinsame Erklärung der Außenminister des Weimarer Dreiecks Johann Wadephul,
  Jean-Noël Barrot und Radosław Sikorski aus Anlass des 35-jährigen Bestehens des
  Formats
text: '„Europa steht an einem historischen Wendepunkt seiner Geschichte. Seine Völker
  und Staaten haben den Weg zu neuen Formen des Zusammenlebens beschritten. Wir sind
  uns bewusst, dass für das Gelingen zukunftsfähiger Strukturen europäischer Nachbarschaft
  Polen, Deutsche und Franzosen maßgebliche Verantwortung tragen.“ (Hans-Dietrich
  Genscher, Roland Dumas, Krzysztof Skubiszewski, Weimar, 29. August 1991 aus Anlass
  des ersten Treffens des Weimarer Dreiecks) Als Außenminister des Weimarer Dreieck
  sind wir heute in Weimar zusammengekommen, um den Geist zu feiern, der vor 35 Jahren
  entstanden ist. Seit dreieinhalb Jahrzehnten arbeiten Deutschland, Frankreich und
  Polen für europäische Innovation und Integration, für europäischen Wohlstand und
  Fortschritt. Gemeinsam haben wir Impulse für ein geeintes, starkes und sicheres
  Europa gesetzt. Die Europäische Union bleibt ein unverzichtbarer Rahmen für das
  Streben nach Freiheit, Wohlstand und Sicherheit. Im Weimarer Dreieck werden wir
  gemeinsam, Seite an Seite mit allen EU -Mitgliedstaaten, daran arbeiten, unsere
  EU souveräner, resilienter und handlungsfähiger zu machen. Als Verbündete in der
  NATO sind wir entschlossen, ein stärkeres Europa in einer stärkeren NATO aufzubauen,
  die Frieden, Sicherheit und Stabilität im euroatlantischen Raum gewährleistet. Wir
  sehen das Weimarer Dreieck als Integrationskraft, die dazu beiträgt, unterschiedliche
  Perspektiven innerhalb der Europäischen Union in Einklang zu bringen und einen gemeinsamen,
  zukunftsorientierten Weg einzuschlagen. Indem wir Partnerländer und wichtige regionale
  Akteure zu unseren Konsultationen einladen, möchten wir das Weimarer Dreieck in
  seiner Eigenschaft als breiter angelegte Plattform zur Integration verschiedener
  Perspektiven noch effizienter nutzen. Heute kommen Ministerinnen und Minister aus
  allen Ressorts unserer Regierungen regelmäßig zusammen und unterstreichen damit
  die zentrale Bedeutung unserer Zusammenarbeit. Unserer Zivilgesellschaften und unsere
  wissenschaftlichen und kulturellen Einrichtungen arbeiten eng zum Wohle Europas
  zusammen, etwa als gemeinsame Gastländer der Leipziger Buchmesse 2027. Angesichts
  der aktuellen geopolitischen Entwicklungen betont das Weimarer Dreieck die Notwendigkeit,
  die Funktionsweise des auswärtigen Handelns der EU zu reformieren, damit sie schlagkräftiger,
  schneller und koordinierter reagieren kann. Dies sollte auch die Rolle und den institutionellen
  Aufbau der einschlägigen EU -Institutionen und -Einrichtungen betreffen, einschließlich
  des Hohen Vertreters/Vizepräsidenten, des Europäischen Auswärtigen Dienstes, des
  Generalsekretariats des Rates sowie der Kommission. Die Arbeit an der Stärkung der
  Rolle und Autorität des HV/VP bei der Koordinierung des auswärtigen Handelns der
  EU soll baldmöglichst aufgenommen werden. Unser Ziel ist ferner, die Entscheidungsprozesse
  der EU durch bestmögliche Nutzung aller in den Verträgen vorgesehenen Optionen zu
  verbessern. Darüber hinaus setzen wir die folgenden Prioritäten, um den Zusammenhalt
  in Europa zu stärken und die Fähigkeit der EU zu entschlossenem Handeln aufzuzeigen:
  Vor dem Hintergrund wachsender Sicherheitsherausforderungen spielen unsere drei
  Nationen bei der Stärkung der europäischen Sicherheit eine entscheidende Rolle.
  Wir sind geeint in unserer Entschlossenheit, die europäische Säule der NATO zu stärken,
  die nach wie vor die Grundlage für die Sicherheit und Verteidigung Europas darstellt.
  Unser Bekenntnis zu unserem Bündnis ist felsenfest. Wir übernehmen mehr Verantwortung
  für unsere Verteidigung, arbeiten dabei mit anderen Bündnispartnern zusammen und
  bekräftigen die fundamentale Bedeutung des transatlantischen Bundes in allen seinen
  Dimensionen. Wir sind entschlossen, das Abschreckungs- und Verteidigungsdispositiv
  der NATO weiter zu stärken. In Anerkennung der unmittelbaren Bedrohungen an der
  Ostflanke der NATO und der EU sagen wir zu, die Verteidigung aller Land-, Luft-
  und Seegrenzen von NATO und EU sicherzustellen. Europa muss souveräner werden, mehr
  Verantwortung für seine eigene Verteidigung übernehmen und besser ausgerüstet werden,
  um auf der Grundlage eines 360-Grad-Ansatzes autonom und abgestimmt handeln und
  auf unmittelbare und künftige Herausforderungen und Bedrohungen reagieren zu können.
  Wir unterstützen außerdem die Entwicklung einer robusteren und wettbewerbsfähigeren
  technologischen und industriellen Basis der europäischen Verteidigung, auch durch
  EU -Programme wie SAFE und EDIP sowie im Rahmen des nächsten MFR . Russlands Angriffskrieg
  gegen die Ukraine hat die Sicherheit unseres Kontinents grundlegend verändert. In
  Anbetracht der langfristigen Bedrohung durch Russland werden wir als Weimarer Dreieck
  uns weiterhin mit Russlands breitem Spektrum an Aktivitäten befassen, darunter hybride
  Aktivitäten, Provokationen, Spionage- bzw. Sabotageakte oder Informationsmanipulation.
  Der jüngste Drohnenvorfall am Flughafen Leipzig/Halle unterstreicht überdeutlich,
  dass wir angesichts der wachsenden hybriden Bedrohungslage, der wir aktuell ausgesetzt
  sind, weitere Maßnahmen ergreifen müssen. Das Weimarer Dreieck wird weiterhin dafür
  sorgen, dass solche Aktivitäten sowohl auf nationaler als auch auf europäischer
  Ebene Kosten nach sich ziehen, so geschehen etwa durch die am 13. Juli verabschiedete
  koordinierte europäische Reaktion auf die Cyberangriffe Russlands gegen die EU und
  die Interessen ihrer Mitgliedstaaten, bei der das Weimarer Dreieck eine tragende
  Rolle gespielt hat. Wir werden weiterhin robuste Gegenmaßnahmen erarbeiten, um unsere
  Bürgerinnen und Bürger, unsere demokratischen Institutionen und unsere kritischen
  Systeme vor hybrider Einflussnahme zu schützen und sie dagegen abzusichern. Das
  Weimarer Dreieck spielt eine bedeutende Rolle bei der Organisation und Konsolidierung
  unserer fortgesetzten Unterstützung für die Unabhängigkeit, Souveränität und territoriale
  Unversehrtheit der Ukraine innerhalb ihrer international anerkannten Grenzen. Wir
  sind entschlossen, einen umfassenden, gerechten und dauerhaften Frieden für die
  Ukraine herbeizuführen, der im Einklang mit dem Völkerrecht steht. Wir sind bereit,
  einen Beitrag zu robusten und glaubhaften Sicherheitsgarantien für die Ukraine zu
  leisten, auch im Rahmen der Koalition der Willigen, und die Fähigkeit der Ukraine
  zur wirksamen Abschreckung und Selbstverteidigung zu stärken. Wir werden die Ukraine
  weiterhin unterstützen, solange dies erforderlich ist, und zwar durch militärische
  Unterstützung, die Finanzierung und Schenkung prioritärer Ausrüstung, industrielle
  Beschaffung, Zusammenarbeit im Bereich Forschung und Entwicklung, gemeinsame Produktionen,
  die Stärkung der europäischen Verteidigungsindustrie mit dem Ziel der Gewährleistung
  schneller und langfristiger Lieferungen sowie finanzielle Unterstützung für die
  ukrainische Produktion. Gleichzeitig werden wir den Druck auf die russische Kriegswirtschaft
  durch gezielte und wirkungsvolle Sanktionen weiter erhöhen. Wir werden mit unseren
  Maßnahmen weiterhin gegen Russlands Einnahmen aus dem Energiesektor, die russische
  Schattenflotte, den russischen Finanzsektor sowie Russlands militärisch-industriellen
  Komplex vorgehen. Inmitten geopolitischer Spannungen und einer fragmentierten Weltwirtschaft
  besteht Europas einzige Chance auf Wohlstand darin, seine Wettbewerbsfähigkeit zu
  stärken und seine wirtschaftliche und technologische Souveränität zu erhalten. Der
  Fahrplan „Ein Europa, ein Markt“ stellt die Weichen für eine Verbesserung der langfristigen
  Wettbewerbsfähigkeit der EU durch Stärkung der Grundlagen des Binnenmarkts und Abbau
  unnötiger Bürokratie. Wir begrüßen das jüngst beschlossene Paket zur technologischen
  Souveränität Europas. Wir werden die wirtschaftliche Widerstandsfähigkeit der EU
  erhöhen und unsere gemeinsamen Regeln für fairen Wettbewerb in der Digitalwirtschaft
  verteidigen; dabei werden wir faire Wettbewerbsbedingungen für die europäische Industrie
  gewährleisten, indem wir drittstaatliche Subventionen und Wettbewerbsverzerrungen
  durch die angemessene Anwendung bestehender Instrumente sowie global durch eine
  führende Rolle bei der Reform und Wiederbelebung des multilateralen Handelssystems
  angehen, uns für wechselseitigen Marktzugang einsetzen und strukturelle Ungleichgewichte
  durch konstruktive Zusammenarbeit beheben. Zusätzlich werden wir die Europäische
  Kommission dabei unterstützen, die handelspolitischen Schutzinstrumente und die
  wirtschaftliche Sicherheit der EU rasch zu stärken, auch durch neue Instrumente
  zur Verringerung strategischer Anfälligkeiten und zur Reduzierung von Schwachstellen
  in den Lieferketten. Das Weimarer Dreieck geht diese Herausforderungen in enger
  Abstimmung an. Gleichzeitig werden wir unsere globalen Partnerschaften durch den
  Abschluss neuer ambitionierter und für alle Seiten vorteilhafter Handelsabkommen
  uneingeschränkt nutzen und fördern, um für EU -Unternehmen neue Exportmärkte zu
  sichern und zur Diversifizierung unserer Wertschöpfungsketten beizutragen. Wir unterstreichen
  unser Bekenntnis zu fairem und regelbasiertem Handel. Wir betonen die Bedeutung
  stabiler und ausgewogener Handelsbeziehungen zwischen der EU und den USA , die für
  Unternehmen sowie Verbraucherinnen und Verbraucher auf beiden Seiten des Atlantiks
  positive Auswirkungen haben, sowie unser beiderseitiges Bekenntnis zur Aufrechterhaltung
  des Turnberry-Abkommens zwischen der EU und den USA . Wir bekräftigen die Bedeutung
  unserer Beziehungen mit China sowie die Notwendigkeit, mit China ausgewogenere Wirtschaftsbeziehungen
  auf der Grundlage fairer Wettbewerbsbedingungen aufzubauen, da die nicht marktorientierten
  Strategien des Landes in Kombination mit einer unterbewerteten Währung die Gefahr
  bergen, dass unsere industrielle Grundlage ausgehöhlt wird und aus Abhängigkeiten
  strategische Anfälligkeiten werden. Wir begrüßen daher die Arbeit der Kommission
  zur Verbesserung und Weiterentwicklung des geoökonomischen Instrumentariums der
  EU . Um Innovation als zentralen Motor des europäischen Wohlstands zu fördern, werden
  wir durch die Weimarer Exzellenzinitiative, die im Rahmen der Allianz der Initiative
  „Europäische Hochschulen“ die trilaterale wissenschaftliche Zusammenarbeit stärkt,
  europäische Forschungsinnovation unterstützen. Unser neues Wachstumsmodell umfasst
  eine ehrgeizige Energie- und Klimapolitik, die sichere, diversifizierte und erschwingliche
  Energie und eine gerechte Energiewende garantiert, internationale Klimaabkommen
  uneingeschränkt umsetzt und die europäische Resilienz gegen Extremwetterereignisse,
  den Klimawandel und Umweltzerstörung stärkt. Das Weimarer Dreieck trägt dazu bei,
  Freiheit, Stabilität und Wohlstand in unserer europäischen Nachbarschaft voranzubringen.
  Die Sicherheit und Stabilität unserer östlichen und südlichen Nachbarn, einschließlich
  ihrer stetigen Bemühungen im Sinne einer engeren Anbindung an die Europäische Union,
  sind untrennbar mit unserer eigenen Sicherheit verbunden. Wir möchten die Eröffnung
  von Verhandlungsclustern und den leistungsbezogenen Erweiterungsprozess mit der
  Ukraine und der Republik Moldau rigoros vorantreiben; dasselbe gilt für einen maßgeschneiderten
  Ansatz, um allen Beitrittskandidaten, einschließlich der Länder des westlichen Balkans,
  im Einklang mit den Fortschritten in ihrem jeweiligen Reformprozess umgehend greifbare
  Fortschritte zu ermöglichen. Auf dem Weg zur Vollmitgliedschaft kann ein schrittweises
  Vorgehen der Integration der Beitrittskandidaten in die Europäische Union neue Dynamik
  verleihen und gleichzeitig die Integrität und das Funktionieren der EU gewährleisten.
  Die Lage im Nahen Osten bleibt fragil und erfüllt uns weiterhin mit großer Sorge.
  Was die Golfregion angeht, bekräftigen wir, wie wichtig es ist, eine Einigung mit
  Blick auf die dringend notwendige Öffnung der Straße von Hormus, die mit bedingungsloser
  und uneingeschränkter Freiheit der Schifffahrt einhergeht, zu erzielen und zu gewährleisten,
  dass Iran nicht über Atomwaffen verfügt und seine feindseligen Aktivitäten in der
  Region einstellt. Wir bekräftigen unser Bekenntnis zu einer auf dem Verhandlungsweg
  erzielten Zweistaatenlösung. Wir bekräftigen, dass die uneingeschränkte Umsetzung
  von Resolution 2803 des VN -Sicherheitsrats für Gaza dringend erforderlich ist.
  In diesem Zusammenhang rufen wir die Hamas dringend auf, endlich ihre Waffen abzugeben
  und ihre Feindseligkeiten gegenüber Israel einzustellen. Wir bekräftigen unsere
  entschiedene Ablehnung aller illegalen Siedlungen und rufen die israelische Regierung
  auf, sämtliche Siedlungsaktivitäten zu beenden. Mit Blick auf Libanon stehen wir
  bereit, die Umsetzung des von Libanon und Israel in Washington unterzeichneten Rahmenabkommens
  zu unterstützen, in dem zur Entwaffnung der Hisbollah aufgerufen wird, um der israelischen
  Armee einen schrittweisen Rückzug aus libanesischem Hoheitsgebiet zu ermöglichen.
  In einer Zeit wachsender Polarisierung und zunehmender hybrider Bedrohungen müssen
  wir den sozialen Zusammenhalt in Europa stärken und uns gemeinsam gegen ausländische
  Einflussnahme und Informationsmanipulation sowie gegen Versuche, die demokratischen
  Standards in Europa auszuhöhlen, zur Wehr setzen. Im Weimarer Dreieck beobachten
  wir gemeinsam Bedrohungen im Informationsbereich und koordinieren unsere Reaktion,
  insbesondere wenn unsere demokratischen Standards ins Visier genommen werden. Wir
  stehen solidarisch zusammen, wenn es darum geht, Bedrohungen durch ausländische
  Akteure anzuzeigen, auch indem wir uns gegenseitig bei der Attribuierung von Angriffen
  unterstützen. Wir müssen ferner gewährleisten, dass unser reaktives und effizientes
  wechselseitiges Alarmsystem weiterhin robuste Ergebnisse liefert. Durch die uneingeschränkte
  Umsetzung des Gesetzes über digitale Dienste sind unsere Gesellschaften besser vor
  ausländischer Einflussnahme geschützt. Das Weimarer Dreieck muss eine Triebkraft
  sein, um dieses Gesetz zu stärken und uneingeschränkt umzusetzen und somit die Regulierung
  von Plattformen zu beschleunigen. Mit ihrer verlässlichen und unabhängigen Berichterstattung
  arbeiten Deutsche Welle, France Médias Monde und Ośrodek Mediów dla Zagranicy TVP
  zusammen, um auch die Menschen jenseits unserer Grenzen zu erreichen und die Widerstandsfähigkeit
  von Gesellschaften gegenüber Desinformation zu stärken. Das Weimarer Dreieck wird
  die Finanzierung dieses Informationsschutzschilds durch die EU langfristig unterstützen.
  Durch ihre Zusammenarbeit in der EU , der NATO und anderen multilateralen Formaten
  verteidigen die Länder des Weimarer Dreiecks aktiv die regelbasierte internationale
  Ordnung sowie unsere europäischen Werte und Demokratien. Da wir zu den Ländern gehören,
  die am häufigsten zum Ziel feindlicher Aktivitäten werden, teilen wir dieselbe Bewertung
  der Bedrohungslage und setzen einen gemeinsamen Fokus auf den Aufbau demokratischer
  Resilienz und die Förderung europäischer Grundsätze.'
