title: Außenminister Wadephul vor seiner Abreise nach Podgorica, Rom und Ljubljana
text: 'Vor seiner Abreise nach Podgorica, Rom und Ljubljana erklärte Außenminister
  Wadephul heute (30.09.2026): Die EU -Erweiterung auf dem Westlichen Balkan ist eine
  Nagelprobe für Europa. Sie entscheidet, welchen Einfluss die EU in den nächsten
  Jahrzehnten haben wird. Nur wenn wir den Westbalkanstaaten eine glaubwürdige EU
  -Perspektive bieten und sie enger an uns binden, sichern wir uns dauerhaft geopolitischen
  Spielraum. Gegenüber geopolitischen Kontrahenten und Rivalen geht es um nicht weniger
  als um unsere Kerninteressen: Sicherheit, Einfluss und Handlungsfähigkeit unseres
  Kontinents. Beim EU -Beitrittsprozess müssen wir deshalb jetzt Tempo machen. Montenegro
  steht als „Spitzenreiter“ im EU -Beitrittsprozess beispielhaft für die erfolgreiche
  EU -Annäherung des Berlin Prozesses, zu dessen Außenministertreffen ich heute nach
  Montenegro reise. Die EU -Erweiterung ist für unsere europäische Sicherheit und
  Zukunft entscheidend. Wir müssen als EU -Mitgliedstaaten unsere Versprechen gegenüber
  den Beitrittskandidaten einlösen. Wer bei Reformen vorankommt, muss auch beim Beitrittsprozess
  vorankommen. Angesichts geopolitischer Herausforderungen müssen wir Widerstände
  schnell abbauen, anstatt uns in kleinteiligen Forderungen an Beitrittskandidaten
  zu verlieren. Die Länder des Westlichen Balkans müssen zugleich begonnene Reformen
  beherzt vorantreiben, wenn sie Teil der EU werden wollen. Dazu gehören Rechtsstaatlichkeit,
  die Bekämpfung von organisierter Kriminalität und Korruption, die Annäherung der
  Länder untereinander – und insbesondere ein angemessener Umgang mit ihrer schmerzhaften
  Vergangenheit. Nur wer die Weichen in der Nachbarschaft auf Versöhnung stellt, nähert
  sich dem europäischen Miteinander in der EU an. Mit Italien wissen wir einen wichtigen
  EU -Partner an unserer Seite, wenn es darum geht, den Westbalkan fest in der EU
  zu verankern. Bei meinem morgigen Besuch in Rom werde ich mich mit meinem Kollegen
  Antonio Tajani darüber austauschen, was wir tun können, um die Westbalkanstaaten
  noch schneller an die EU heranzuführen – und wie wir uns als EU in Brüssel aufstellen
  müssen, um diese Aufgabe institutionell zu bewältigen. Zugleich will ich in Rom
  besprechen, wie wir Herausforderungen für Europa bewältigen – von mehr Wettbewerbsfähigkeit
  und Wachstum bis zu unserer gemeinsamen Sicherheit. Deutschland und Italien sind
  sich bei den außen- und wirtschaftspolitischen Schwerpunkten einiger denn je: Gemeinsam
  stehen wir für 40 Prozent der europäischen Industrieproduktion. Deshalb tragen wir
  gemeinsam dafür Sorge, Europa als Industriestandort im weltweiten Wettbewerb zu
  stärken. Dafür brauchen wir eine handlungsfähigere EU , die für unseren Wohlstand
  und unsere Sicherheit die richtigen Prioritäten setzt – auch beim EU -Haushalt für
  die kommenden Jahre. Bei meinem Aufenthalt in Rom werde ich auch den Vatikan besuchen,
  um dort Kardinalstaatssekretär Pietro Parolin und Erzbischof Paul Richard Gallagher
  zu treffen. Der Heilige Stuhl hat ein weltweites diplomatisches Netzwerk – und über
  den Glauben besonderen Zugang zu vielen Menschen und Regionen weltweit. Papst Leo
  XIV. hat sich in dieser Woche für geduldigen Dialog und kreative Anstrengungen für
  den Frieden ausgesprochen. Der Heilige Stuhl ist ein wichtiger Partner, wenn es
  darum geht, Frieden ins Zentrum internationaler Diplomatie zu rücken: Denn auch
  die Bundesregierung stellt in ihren humanitären Bemühungen den Menschen und seine
  Würde in den Mittelpunkt – gerade in Kriegen, Konflikten und Not. Das gilt insbesondere
  für die Ukraine, wo die Menschen nichts mehr herbeisehnen, als ein schnelles Ende
  des Kriegs und der Unterwerfungsfantasien Putins. Zum Abschluss reise ich am Freitag
  noch zu meinem Antrittsbesuch nach Slowenien. Im Austausch mit der neuen Regierung
  und meinem Kollegen Tone Kajzer ist es mir besonders wichtig, darüber zu sprechen,
  wie wir unsere enge wirtschaftliche, politische und gesellschaftliche Vernetzung
  mit Slowenien, das eine wichtige Brücke zwischen Mittel- und Südosteuropa ist, noch
  weiter ausbauen können. Als ein Land, das den oft mühsamen Beitrittsprozess noch
  aus eigener Erfahrung kennt und das zugleich in über 20 Jahren seiner EU -Mitgliedschaft
  Motor unseres europäischen Zusammenhalts geworden ist, ist Slowenien ein Vorbild
  für die EU -Beitrittskandidaten.'
