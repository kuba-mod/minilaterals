title: 'UNESCO-Weltbildungsbericht: Bildungsgerechtigkeit bleibt zentrale Herausforderung'
text: 'Gemeinsame Pressemitteilung des Auswärtigen Amts, des Bundesministeriums für
  Bildung, Familie, Senioren, Frauen und Jugend, des Bundesministeriums für wirtschaftliche
  Zusammenarbeit und Entwicklung und der Deutschen UNESCO -Kommission „Zugang und
  Chancengerechtigkeit“ ist der Titel des Weltbildungsberichts 2026. Die deutschsprachige
  Kurzfassung wurde heute gemeinsam vom Auswärtigen Amt, dem Bundesministerium für
  Bildung, Familie, Senioren, Frauen und Jugend, vom Bundesministerium für wirtschaftliche
  Zusammenarbeit und Entwicklung sowie der Deutschen UNESCO -Kommission in Berlin
  vorgestellt und gemeinsam mit der Bildungsministerkonferenz sowie Bildungsfachleuten
  diskutiert. Die UNESCO machte deutlich, dass die Bildungsgerechtigkeit weltweit
  eine große Herausforderung bleibt. Trotz erheblicher Erfolge in den vergangenen
  Jahrzehnten gehen weltweit 273 Millionen Kinder und Jugendliche nicht zur Schule.
  Die Fortschritte haben sich zuletzt sogar verlangsamt. Zugleich zeigt der Bericht,
  dass langfristige Investitionen, inklusive Bildungspolitik und die gezielte Unterstützung
  benachteiligter Gruppen den Zugang zu Bildung und den Bildungserfolg insgesamt verbessern
  können. Chancengerechtigkeit sollte nach Einschätzung der UNESCO daher das Leitprinzip
  der Bildungspolitik sein. Serap Güler, Staatsministerin im Auswärtigen Amt, erklärt:
  Bildung ist ein Menschenrecht und eine Voraussetzung für gesellschaftliche Teilhabe
  und Zukunftsperspektiven. Gerade in Zeiten von Krisen und Konflikten müssen wir
  darauf achten, dass Kindern und Jugendlichen der Zugang zu Bildung nicht verwehrt
  wird und bestehende Ungleichheiten sich nicht weiter verschärfen. Der Weltbildungsbericht
  zeigt, dass Fortschritte möglich sind, wenn wir langfristig investieren und besonders
  diejenigen in den Blick nehmen, die bislang benachteiligt sind. Dafür brauchen wir
  eine starke internationale Zusammenarbeit. Michael Brand, Parlamentarischer Staatssekretär
  im Bundesministerium für Bildung, Familie, Senioren, Frauen und Jugend, sagt: Das
  Startchancen-Programm baut als zentrale Initiative des Bildungsministeriums Bildungsungleichheit
  ab und bringt für alle mehr Bildungschancen. Inzwischen im dritten Jahr hilft dieses
  breit angelegte Programm von Bund und Ländern über eine Million Schülerinnen und
  Schülern, unabhängig vom sozialen Hintergrund besser zu werden, etwa durch zusätzliche
  Leseförderung, Unterstützung von Elternarbeit oder auch Schubpsychologen. Das stärkt
  das Bildungssystem insgesamt und auch später berufliche Möglichkeiten. Über die
  Laufzeit von zehn Jahren investieren wir insgesamt 20 Milliarden in ein besseres
  Lernumfeld, mithilfe von Chancenbudgets auf kommunaler und schulischer Ebene, durch
  Schul- und Unterrichtsentwicklung, multiprofessionelle Teams und andere Maßnahmen.
  Wir verbessern Chancen gleich von Anfang an, mit großer Wirkung für das weitere
  Leben. Johann Saathoff, Parlamentarischer Staatssekretär im Bundesministerium für
  wirtschaftliche Zusammenarbeit und Entwicklung, stellt fest: SDG 4 ist ein zentrales
  Anliegen der deutschen Entwicklungszusammenarbeit. Unser besonderes Augenmerk gilt
  den Kindern, die am häufigsten von Bildung ausgeschlossen werden: Mädchen und junge
  Frauen, Kinder mit Behinderungen sowie Kinder in Konflikt- und Krisengebieten. Ein
  zentraler Hebel unseres Bildungsengagements weltweit sind die globalen Bildungsfonds
  Global Partnership for Education und Education Cannot Wait. Beide Fonds tragen mit
  beeindruckenden Wirkungen dazu bei, dass alle Kinder einen gerechten Zugang zu Bildung
  erhalten. Mit unseren langjährigen Zusagen zeigen wir, dass wir uns langfristig,
  auch über die Laufzeit der Agenda 2030 hinaus, für Bildungsgerechtigkeit weltweit
  einsetzen werden. Maria Böhmer, die Präsidentin der Deutschen UNESCO -Kommission,
  unterstreicht: Der UNESCO -Weltbildungsbericht ist ein Weckruf: Wir müssen mehr
  tun für die Chancengerechtigkeit, auch im deutschen Bildungssystem. Mit dem Startchancen-Programm
  und früher Förderung geht Deutschland schon einen wichtigen Schritt in die richtige
  Richtung. Aber wir dürfen hier nicht nachlassen. Wir müssen Lehrkräfte, Schulen
  und Bildungseinrichtungen so unterstützen, dass sie alle Schülerinnen und Schüler
  bestmöglich fördern können, unabhängig von ihrem sozialen Hintergrund. Der aktuelle
  Weltbildungsbericht wurde im Frühjahr von der UNESCO veröffentlicht. Er untersucht
  die Bildungsgerechtigkeit weltweit. Eine der Länderstudien widmet sich der Situation
  in Deutschland. Hier verließen im Jahr 2024 rund 62.000 Menschen die Schule ohne
  Abschluss – fast acht Prozent aller Schülerinnen und Schüler. Nach wie vor hängt
  der Bildungserfolg stark von der sozialen Herkunft ab. Die Welt wird die Bildungsziele
  der Vereinten Nationen bis 2030 verfehlen. Dennoch hat die globale Bildungsagenda
  erhebliche Fortschritte bei Zugang, Inklusion und Chancengerechtigkeit angestoßen:
  Die Welt wird den Zugang für alle bis 2030 nicht erreichen. Doch das bedeutet nicht,
  dass die globale Bildungsagenda gescheitert ist. Weltweit besuchen heute deutlich
  mehr Kinder, Jugendliche und junge Erwachsene Bildungseinrichtungen als noch vor
  25 Jahren. Gleichzeitig haben viele Staaten Bildungssysteme inklusiver gestaltet
  und gezielt benachteiligte Gruppen gefördert. Die Bildungsziele wurden zwar verfehlt,
  haben aber wichtige Fortschritte angestoßen. Seit 2015 haben sich die Fortschritte
  bei der Reduzierung der Out-of-school Rate in allen Regionen verlangsamt. 273 Millionen
  Kinder und Jugendliche gehen weltweit nicht zur Schule, tatsächlich dürfte die Zahl
  noch höher liegen. Dennoch zeigen viele Länder, dass deutliche Verbesserungen möglich
  sind, wenn langfristig in Bildung investiert wird. Bei den derzeitigen Raten werden
  wir möglicherweise niemals allen Lernenden den Abschluss der Sekundarschule ermöglichen
  können. Zwar steigen die Abschlussquoten weltweit kontinuierlich an, allerdings
  zu langsam. Besonders späte Einschulung bremsen die Fortschritte in vielen ärmeren
  Ländern aus. Die Art und Weise, wie wir Fortschritte definieren, muss verbessert
  werden. Der Bericht fordert stärker kontextbezogene Maßstäbe für Bildungsfortschritte.
  Nationale Ziele, realistische Vergleichsmaßstäbe und eine differenzierte Betrachtung
  von Ungleichheiten liefern aussagekräftigere Ergebnisse als globale Durchschnittswerte
  allein. Einige Messinstrumente müssen angepasst werden, um aussagekräftigere Ergebnisse
  zu liefern. Mehrere Bildungsindikatoren überschätzen Fortschritte oder bilden Ungleichheiten
  nur unzureichend ab. Bessere Daten und präzisere Messmethoden sind notwendig, um
  Bildungsbeteiligung und Chancengerechtigkeit verlässlich zu bewerten. Es gibt keine
  einfachen Erklärungen für langfristige Fortschritte in Bezug auf Zugang und Chancengerechtigkeit.
  Nachhaltige Verbesserungen entstehen selten durch einzelne Reformen. Erfolgreich
  sind vielmehr langfristige, auf den jeweiligen Kontext abgestimmte Maßnahmenpakete.
  Um den Zugang zu Bildung zu verbessern, wurden umfassende politische Anstrengungen
  unternommen. Immer mehr Staaten verankern inklusive Bildung gesetzlich, verlängern
  die Schulpflicht und bauen den Anspruch auf kostenlose Bildung aus. Die politische
  Bedeutung von Teilhabe und Inklusion hat weltweit deutlich zugenommen. Es gibt eine
  Dynamik hin zu politischen Maßnahmen, die Ressourcen umverteilen, um so die Chancengerechtigkeit
  im Bildungswesen zu erhöhen. Viele Länder setzen verstärkt auf gezielte Finanzierungsinstrumente,
  um benachteiligte Regionen, Schulen und Lernende zu unterstützen. Der Bericht sieht
  darin einen wichtigen Hebel für mehr Bildungsgerechtigkeit. Mit der Verabschiedung
  der Globalen Nachhaltigkeitsagenda hat sich die Weltgemeinschaft verpflichtet, bis
  2030 für alle Menschen inklusive, chancengerechte und hochwertige Bildung sicherzustellen.
  Die UNESCO koordiniert die Umsetzung dieses Ziels, evaluiert die Fortschritte und
  veröffentlicht jährlich den Weltbildungsbericht. Die Deutsche UNESCO -Kommission
  gibt eine deutschsprachige Kurzfassung des Berichts heraus. UNESCO -Weltbildungsbericht
  2026, deutschsprachige Kurzfassung UNESCO -Weltbildungsbericht 2026, englischsprachige
  Langfassung'
