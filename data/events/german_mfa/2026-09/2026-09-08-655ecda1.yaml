title: Rede von Außenminister Johann Wadephul beim Wirtschaftstag der Konferenz der
  Leiterinnen und Leiter deutscher Auslandsvertretungen
text: 'Ich heiße Sie herzlich zum Wirtschaftstag der Konferenz der Leiterinnen und
  Leiter deutscher Auslandsvertretungen hier im Auswärtigen Amt willkommen. Auch dieses
  Jahr freue ich mich wieder auf die anstehenden Gespräche und Begegnungen. Eine besondere
  Freude ist es mir, meinen guten Freund Maroš Šefčovič, Europäischer Kommissar für
  Handel und wirtschaftliche Sicherheit, hier willkommen zu heißen. Lieber Maroš,
  ich möchte meine kurzen einleitenden Bemerkungen sogar mit einem Zitat von Dir beginnen.
  Und zwar einem Witz, den Du einmal erzählt hast: Ein Lehrer fragt die Kinder in
  seiner Klasse, was sie einmal werden möchten, wenn sie groß sind. Ein Kind antwortet:
  „Etwas mit Zukunft – ein Mercosur-Verhandler. So wie mein Vater. Und wie mein Großvater.“
  Lieber Maroš – ich sage voller Stolz: Dank unserer äußerst engen Zusammenarbeit
  sind wir die letzte Generation von Mercosur-Verhandlern. Die Schulkinder werden
  sich nach anderen Laufbahnen umsehen müssen, aber das ist für ihre Zukunft nur von
  Vorteil. Wenn ich den Blick in die Zukunft richte, sehe ich eine grundlegend veränderte
  Weltwirtschaftslage. Wie wir alle wissen, wird ein großer Teil des deutschen Wohlstands
  im Ausland erwirtschaftet. Etwa jeder vierte Arbeitsplatz hängt von Exporten ab,
  sogar fast jeder zweite Arbeitsplatz in der Industrie! Aber unsere Wirtschaft ist
  nicht nur exportorientiert. Ich würde sie als partnerschaftsorientiert bezeichnen:
  Sie hängt auch von Produktionsfaktoren wie Energie und kritischen Rohstoffen ab.
  Deutschland und Europa sind insbesondere auf offene Märkte, verlässliche Handelsregeln
  und diversifizierte wirtschaftliche Beziehungen angewiesen. Ich verrate Ihnen nichts
  Neues, wenn ich sage, dass dieses System unter Druck steht – aus offensichtlichen
  Gründen. Der russische Angriffskrieg gegen die Ukraine tobt weiter und bindet sowohl
  wirtschaftliche als auch militärische Ressourcen. Die anhaltende Krise in der Straße
  von Hormus wirkt sich stark auf die weltweiten Energiepreise aus und setzt unseren
  Volkswirtschaften massiv zu. Unsere Wirtschaftsbeziehungen zu China werden immer
  unausgewogener. Marktfremde Politik und eine unterbewertete Währung drohen, unsere
  industrielle Basis auszuhöhlen und aus kritischen Abhängigkeiten strategische Schwachstellen
  zu machen. Zugleich haben wir mit unsteten und herausfordernden Handelsbeziehungen
  mit den Vereinigten Staaten – traditionell der engste Handelspartner der EU – umzugehen.
  Und es kommt noch hinzu: Der Klimawandel und extreme Wetterereignisse führen zu
  erheblichen wirtschaftlichen Verlusten und unterbrechen Lieferketten. Die wichtigste
  Frage für Deutschland ist: Wie gehen wir mit diesen veränderten Bedingungen um –
  denn sie bleiben ja Realität. In erster Linie muss es eine europäische Antwort sein:
  auch in der Weltwirtschaft von morgen die EU als geoökonomisches Kraftzentrum zu
  stärken, unsere Werte zu verteidigen und unseren Wohlstand zu sichern. Meine Damen
  und Herren, wir sind hier als Institution zu unseren eigenen Schlüssen gekommen.
  Wenn die Geopolitik anfängt, die Weltwirtschaft zu bestimmen oder sogar zu diktieren,
  müssen wir die Konsequenzen ziehen. Daher haben wir unser Ministerium grundlegend
  reformiert. Wir haben eine neue Abteilung geschaffen, in der Geoökonomie und EU
  -Politik zusammengefasst sind, sodass wir rasch auf die Lage in der Welt reagieren
  können. Ferner wollen wir dem Bundeshaushalt und dem Koalitionsvertrag folgen, mit
  der Vorgabe, unser Personal um 8 % zu kürzen. Wir machen das Beste aus der Situation,
  indem wir eine schlankere und agilere Organisation schaffen. Aber es geht nicht
  nur um uns. In einer Zeit politisch umkämpfter Märkte müssen der Staat und die Wirtschaft
  Hand in Hand zusammenarbeiten. Die deutsche Regierung und die deutsche Wirtschaft
  kommen nur durch diese Krise, wenn sie an einem Strang ziehen. Für mich sind die
  zwei wichtigsten Punkte: Erstens möchte ich auf meinen Reisen niemanden belehren
  – ich möchte Partnerschaften stärken. Daher werde ich auch von Wirtschaftsdelegationen
  begleitet. Zweitens hat mein Ministerium einen klaren Auftrag: deutschen und europäischen
  wirtschaftlichen Interessen den Weg zu bereiten und so viel Unterstützung wie möglich
  für Ihre – und hier schaue ich auf die Vertreter der Wirtschaft – Projekte im Ausland
  zu leisten. Wir leben in einer Zeit fragmentierter Handelsbeziehungen. Unternehmen
  drohen durch fremde Mächte instrumentalisiert zu werden – ein Ansatz, der unserer
  Auffassung von Wirtschaft und dem Wirtschaftsmodell, das seit Jahrzehnten die Grundlage
  für unseren Erfolg bildet, völlig entgegengesetzt ist. Daher müssen wir unsere Denkweise
  ändern. Ihre Unternehmen arbeiten nicht mehr in einem geopolitisch vorhersagbaren
  Umfeld oder in einem regelbasierten globalen System. Sie arbeiten in Ländern, deren
  wirtschaftspolitische Maßnahmen und ihre Auswirkungen unsere traditionell erfolgreichsten
  Branchen und Unternehmen erschüttern. Zugleich erfährt die Weltwirtschaft einen
  grundlegenden Wandel durch neu entstehende Wachstumsbranchen wie KI und umweltschonende
  Technologien. Heute müssen politische Risiken und kritische Anfälligkeiten, auch
  solche, die noch in der Zukunft liegen, in die Risikobewertung jedes einzelnen Unternehmens
  einbezogen werden: Wir werden beim Schutz Ihrer Interessen manchmal auch an Grenzen
  stoßen. Mit Mercosur bieten wir Ihnen einen Ausweg. Wir eröffnen Ihnen die Möglichkeit,
  Ihre Exportmärkte, aber auch Ihre Quellen für Produktionsfaktoren – wie kritische
  Rohstoffe – zu diversifizieren. Und wir arbeiten bereits erfolgreich an vielen weiteren
  wichtigen Freihandelsabkommen – Maroš geht hier voran. Vielen Dank dafür! Zusammen,
  lieber Maroš, gehören wir zum „Team Europa“. Unser Ziel ist ganz klar: Wir müssen
  die Europäische Union zu einem noch stärkeren geoökonomischen Kraftzentrum machen.
  Wir müssen unsere wirtschaftliche Basis stärken, um künftige geoökonomische Konflikte
  bewältigen zu können. Und wir müssen unsere Wettbewerbsfähigkeit umfassend stärken.
  Der EU -Binnenmarkt ist dafür von zentraler Bedeutung – und er ist in diesem Jahr
  der wichtigste Treiber für das Wirtschaftswachstum, während die Exporte in zwei
  unserer wichtigsten Handelspartner außerhalb Europas dramatisch zurückgegangen sind.
  Wir dürfen die Vertiefung des Binnenmarkts nicht aus den Augen verlieren; dazu müssen
  wir die Spar- und Investitionsunion voranbringen und industriepolitische Maßnahmenpakete
  umsetzen, um kritische Lieferketten in Europa zu sichern. Denn wenn globale Märkte
  wegbrechen und der Handel mit China und den Vereinigten Staaten schwächer wird,
  ist die EU unser Sicherheitsnetz. Sie ist unser Anker und der wahre Motor unseres
  Wachstums. Die Zahlen sprechen für sich: Der Binnenmarkt hat für mehr als zwei Drittel
  unseres BIP -Wachstums gesorgt. Das ist noch keine vollständige Erholung, aber es
  ist ein Anfang. Und hier ist der zweite Punkt: Wettbewerbsfähig zu sein reicht nicht.
  Europa, wir alle, müssen härter für unsere Interessen kämpfen. Wir brauchen entschlossenes
  De-Risking, um unsere wirtschaftliche Verwundbarkeit strategisch zu verringen. Wir
  müssen dafür sorgen, dass unsere Verwundbarkeit nicht ausgenutzt wird. Wir müssen
  unsere kritische Infrastruktur, insbesondere kritische Komponenten, schützen. Wir
  müssen strategische Abhängigkeiten verringern. meine Mitarbeitenden und ich haben
  diese geoökonomischen Herausforderungen im Blick. Und wir gehen sie mit voller Kraft
  an – hier in Berlin, in Brüssel und auf unseren zahlreichen Auslandsreisen. Aber
  wie gesagt: Wir brauchen Sie, die Wirtschaft, die Unternehmen. Auf Sie kommt es
  an. Für „Team Europa“ als geoökonomische Macht.'
