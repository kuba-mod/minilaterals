title: Grußwort von Außenminister Wadephul zur Eröffnung des Rohstoffgipfels im Auswärtigen
  Amt
text: 'Vielen Dank, lieber Herr Wüllenweber, liebe Kollegen aus dem Bundestag, nicht
  wissend, dass ich Chemie-Leistungskurs hatte, haben die Kolleginnen und Kollegen
  mir hier in einer Rede aufgeschrieben, dass ich überrascht gewesen sei, dass Kenntnisse
  der anorganischen Chemie manchmal auch für einen Außenminister von Belang sind.
  Das fällt mir in der Tat ehrlich gesagt wirklich leicht. Ich habe lange überlegt,
  ob ich nicht Chemie studiere. Es ist dann doch Jura geworden, aber das war ein schwieriger
  Abwägungsprozess. Mein Vater hatte mir eigentlich gesagt: Du bist doch besser in
  Chemie, da hast Du doch eine Eins geschrieben. Aber ok. Jedenfalls hilft es mir
  zuweilen. Und falls Sie die ein oder andere Diskussion mit Ihren Kindern haben:
  Man kann das immer gut gebrauchen. Aber es hat ja alles einen ernsten Hintergrund.
  Wir leben, was kritische Rohstoffe anbetrifft, ja in gefährlichen Abhängigkeiten.
  Diese Abhängigkeiten machen uns verwundbar. Und jede Form der Verwundbarkeit ist
  etwas Problematisches, das wissen Sie. Wenn ein einziger Staat die Hebel über unsere
  Wertschöpfungsketten in der Hand hält, ist das nicht mehr nur ein wirtschaftliches
  Risiko – dann ist das auch ein enormes Risiko für unsere Sicherheit in Deutschland
  und Europa. Wir haben ja bereits erlebt, wie wirtschaftliche Abhängigkeiten politisch
  instrumentalisiert wurden. Bis vor wenigen Jahren betrieb man Wirtschaftspolitik
  in Deutschland meist isoliert von der Außen- und Sicherheitspolitik. Oder um es
  auf eine kürzere Formel zu bringen: Diplomatie ist heute auch Rohstoffsicherung.
  Dass wir alle heute hier versammelt sind, zeigt ja: Wir haben kein Erkenntnisproblem.
  Wir müssen diese Abhängigkeiten so schnell wie möglich drastisch reduzieren. Und
  die entscheidende Frage – nämlich wie wir schneller und wirksamer in die Umsetzung
  kommen, – die wollen wir heute nicht nur hier diskutieren, sondern entscheidend
  voranbringen. Die Initiative der Industrie zur Gründung eines Handelshauses ist
  dafür ein sehr wichtiger Baustein. Dass wir heute im Auswärtigen Amt durch eine
  MoU-Zeichnung den Grundstein dafür gelegt haben, ist ein starkes Signal. Und ich
  begrüße es sehr, dass es die Wirtschaft ist, die hier die Initiative ergreift. Das
  ist eine Dynamik, die wir unterstützen. Für die großen geoökonomischen Player wie
  China oder die USA geht es heute nicht mehr nur um den Preis. Also darum, wer billiger
  und effizienter ist. Sondern darum, wer die Ressourcen kontrolliert. Weder deutsche
  Unternehmen noch der Bund können diese Mammutaufgabe alleine bewältigen. Deshalb
  ist der Titel der heutigen Veranstaltung – „Rohstoffsicherung im Schulterschluss
  voranbringen“ – genau richtig. Das Bundesministerium für Wirtschaft und Energie
  leistet hervorragende Arbeit, die deutsche Rohstoffversorgung sicher aufzustellen.
  Auch das Auswärtige Amt hat sich hier neu ausgerichtet und wird die Industrieinitiative
  zur Gründung des Handelshauses durch eine operativ ausgerichtete gemeinsame Rohstoffaußenpolitik
  mit dem BMWE und dem BMZ unterstützen. Wir helfen, konkrete Projekte und Kooperationspotenziale
  zu identifizieren und Investitionen sowie Abnahmen politisch zu flankieren. Wir
  haben ja schon ein dichtes Netz an Anlaufstellen im Ausland. Und schaffen damit
  verbindliche Ansprechpartner. Unsere Arbeit weltweit wird in Berlin in eine Anlaufstelle
  zusammenfließen. Denn – und das zeigt auch dieser Abend hier – es mangelt in Deutschland
  nicht an Akteuren in der Rohstoffpolitik und Wirtschaft. Aber unser gemeinsamer
  Anspruch im In- und Ausland muss sein: weniger Fragmentierung, mehr Fokus und Geschwindigkeit,
  mehr konkrete Projekte und am Ende mehr gesicherte Rohstofflieferungen für die deutsche
  Wirtschaft. Es reicht dafür natürlich nicht aus, wenn wir wissen, wo die Rohstoffe
  der Zukunft liegen. Sondern wir müssen dazu beitragen, dass sie auch tatsächlich
  ihren Weg in die deutschen und europäischen Wertschöpfungsketten finden. Ich bin
  zum Beispiel nach Brasilien gereist und nach Argentinien – einige von Ihnen waren
  ja auch mit dabei. Denn unsere Partner dort teilen unser Interesse, Lieferketten
  zu diversifizieren. Sie spüren ja auch das umgekehrte Risiko, nämlich von wenigen,
  vielleicht auch nur von einem Abnehmer, abhängig zu sein. Auch in meinen Gesprächen
  mit anderen Partnern aus dem Indo-Pazifik, aus Afrika und auch Europa ist das Thema
  kritische Rohstoffe aus diesem Grund gesetzt. Wir machen aus unserem weltweiten
  diplomatischen Netzwerk gemeinsam mit Partnern vor Ort ein operatives Netzwerk für
  die deutsche Rohstoffsicherheit. Wir sind überzeugt: Nur wenn Industrie, Wirtschaftspolitik
  und Außenpolitik ihre jeweiligen Stärken zusammenbringen, dann werden wir im internationalen
  Wettbewerb letztlich erfolgreich sein. Die heutige Industrieinitiative ist ein Zeichen
  für die Stärke und Weitsicht der deutschen Industrie. Wir stehen an Ihrer Seite.
  Und freuen uns auf die Zusammenarbeit.'
