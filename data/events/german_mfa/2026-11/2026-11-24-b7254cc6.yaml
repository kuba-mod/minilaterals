title: Rede von Außenminister Wadephul zur Eröffnung des Berliner Forum Außenpolitik
  der Körber Stiftung 2026
text: 'Jeden November steht die Körber-Stiftung im Fokus aller außenpolitisch Interessierten.
  Denn zum einen ruft das Berliner Forum Außenpolitik Vertreterinnen und Vertreter
  aus aller Welt zusammen, um zu diskutieren. Und zum anderen bietet die Körber Stiftung
  auch selbst gleich mit der „Berlin Pulse“-Umfrage immer wieder auch Stoff für diese
  Diskussionen. Sie zeigt jedes Jahr, was die außenpolitisch Interessierten bewegt,
  wie Trends verlaufen und wie unterschiedlich doch Eigen- und Fremdwahrnehmung sind.
  Welche Entwicklung haben wir über-, und welche unterbewertet? Die Zahlen der Körber-Stiftung
  lassen zu all diesen Fragen eine Indikation zu. So verleiht der „Berlin Pulse“ manchem
  diffusen Gefühl eine klare Prozentzahl, liefert Denkanstöße und zeigt Entwicklungen,
  die für uns in der Politik relevant sind. Einen ähnlichen Denkanstoß erhielt ich
  auch im vergangenen Juli in Südafrika, bei einer Rede an der Universität Pretoria.
  Die Carney Rede war damals schon in aller Munde und so wurde ich im Nachgang der
  Rede in der Diskussionsrunde gefragt: „ Herr Minister, sehen Sie Deutschland als
  Middle Power an ?“ Ich gebe zu, ich bin der Frage damals etwas ausgewichen. Weil
  ich in diesem „Middle Power“-Stempel eher eine Zuschreibung sehe als einen Begriff,
  den ich mir zu eigen machen würde. Und weil ich glaube, dass der Begriff „Middle
  Powers“ uns auch nur bedingt weiterhilft, wenn wir auf die Welt schauen. Was mir
  aber klar wurde: Im Ausland blickt man auf Deutschland als „Middle Power“. Wir sind
  die drittgrößte Volkswirtschaft der Welt. Eine gestaltende Kraft in der Europäischen
  Union, eine wachsende Einflussgröße in der NATO . Und trotz oder gerade wegen diesjähriger
  Rückschläge ein starker Multilateralist in den Vereinten Nationen. Und wir haben
  eine große Bevölkerung, eine starke Bundeswehr, die international agieren kann.
  Ich glaube, einige der gängigen Definitionen einer „Middle Power“ dürften auf Deutschland
  zutreffen. Aber was heißt das für uns und unsere Außenpolitik? Eine Frage, die sich
  mir neulich auch im Roten Rathaus, hier in Berlin stellte. Da war ich vor wenigen
  Wochen zur Verleihung des Shimon Peres Preises. Dort im Festsaal hängt ein imposantes
  Gemälde. Es zeigt Reichskanzler Bismarck 1878, umgeben von Vertretern der damaligen
  Großmächte des europäischen Kontinents. Er hatte eingeladen zum „Berliner Kongress“,
  um die Neuordnung des Balkans zu verhandeln. Und als ich das Bild so ansah, kam
  mir der Gedanke: Bismarck hätte dem Konzept der „Middle Powers“, wie es seit der
  Carney-Rede in Davos in aller Munde ist, wahrscheinlich viel abgewinnen können.
  Seine Bündnisse, Verträge und Absprachen sollten das Deutsche Reich in alle Richtungen
  absichern und andere Staaten in einem Netz von Verbindlichkeiten binden. Er folgte
  dem Grundsatz, dass Staaten keine Freunde haben, sondern Interessen. Ein Grundsatz,
  der leitend war. Zum Beispiel, wenn er Äquidistanzen im Verhältnis zu anderen Mächten
  bewusst in Kauf nahm, um au ßenpolitisch auch wirklich flexibel zu bleiben. Und
  noch ein zweiter Gedanke kam mir beim Blick auf das Gemälde: Der Berliner Kongress
  ist ein prägnantes historisches Beispiel für den einen Satz, der uns seit der Konferenz
  von Davos in diesem Frühjahr beschäftigt: „If we’re not at the table, we’re on the
  menu.“ Denn am Verhandlungstisch saßen damals nur die Einflussgrößen, die Großmächte
  und „Middle Powers“ ihrer Zeit. Viele andere saßen da aber nicht. Die „Small States“
  des Balkans, sie standen beim Berliner Kongress auf der Speisekarte. Und waren nicht
  stimmberechtigt, während ihre Grenzen neu verhandelt wurden. Ich blicke dieser Tage
  sehr bewusst auf das Gemälde im Roten Rathaus. Und ich frage mich: Welche Lehren
  können wir für das heutige Verständnis von Middle Power-Kooperation ziehen? Und
  wie sollte die Zusammenarbeit zwischen den Middle Powers aussehen? der Nachhall
  auf die zurecht gelobte Rede von Mark Carney in Davos dauert bis heute an. Seine
  Worte haben die außen- und sicherheitspolitische, auch die Think Tank-Debatte, nachhaltig
  geprägt. Seine Darstellung des internationalen Systems aus den Augen eines pragmatischen
  Realisten war ehrlich und schonungslos zutreffend. Ein Aufruf, den Bruch im internationalen
  System anzuerkennen und vor allem: entsprechend zu handeln. Carney gab dem, was
  viele Beobachter des internationalen Systems bereits seit längerem diagnostizieren,
  einen Namen. Und mit dem Middle Powers-Konzept, dem Zusammenschließen der Middle
  Powers in Abgrenzung zu Hegemonialmächten, präsentiert er einen schlüssigen Ansatz,
  um sich in dieser veränderten Welt zu behaupten. Sein Ansatz der „variablen Geometrie“,
  das Schließen von ad-hoc Koalitionen, ausgerichtet an nationalen Interessen, alles
  das trifft den Ton unserer Zeit. Und der findet sich auch überall in der gelebten
  außenpolitischen Praxis wieder. Doch wenn wir den Ansatz etwas weiter nach vorne
  denken, wenn wir uns fragen „ Was heißt das denn eigentlich ?“, dann komme ich durchaus
  auch ins Zögern. Denn schon die Grundfrage des Konzepts der „Middle Powers“ ist
  nicht klar: Wer legt denn eigentlich fest, wer eine „Middle Power“ ist? „Middle
  Powers“, das lässt sich ja je nach Interpretation auf viele anwenden. Manche möchten
  sich so nennen, ohne es zu sein. Und gerade Atommächte weisen es zurück, auch nur
  in irgendeiner Hinsicht „ Middle “ zu sein. Diese Kategorie lässt sich also irgendwie
  auf manche Staaten zurechtbiegen. Auf viele Staaten aber nicht. Ich sehe das in
  der gelebten Praxis eines Außenministers. Weil ich oft in Staaten reise, die sich
  in keine der Schubladen einordnen lassen. Und das auch gar nicht wollen. Singapur
  zum Beispiel, da war ich im Februar. Flächenmäßig kleiner als Berlin. Aber ein global
  einflussreicher Staat mit beeindrucken Ressourcen. Vor allem aber ein Staat, der
  sich selbst augenzwinkernd, aber selbstbewusst als „ Little Red Dot on the Map “
  bezeichnet. Gleichzeitig aber ist Singapur ein geopolitischer Akteur, ohne den im
  Indo-Pazifik nichts geht. Wo findet sich also Singapur im Konzept der Middle Powers
  wieder? Wir wollen mit Singapur zusammenarbeiten, weil wir gemeinsame Interessen
  haben, und gemeinsam besser werden können. Middle Power hin oder her. Weiteres Beispiel,
  aus derselben Region: Indonesien. Die Zuordnung fällt allein angesichts der Größe
  und Bevölkerung des Landes leicht. Gerade erst haben wir als Europäische Union mit
  Indonesien ein Freihandelsabkommen geschlossen. Das wird nach Umsetzung dazu führen,
  dass die gegenseitigen Zölle nahezu komplett wegfallen werden. Und es ist kein Zufall,
  dass nach zehnjähriger Verhandlung genau jetzt der Durchbruch erzielt wurde. Weil
  beide Seiten solche neuen Kooperationen heute mehr denn je brauchen, um sich als
  Wirtschaftsnationen zu behaupten. Der Einfluss von Staaten wie Indonesien wird global
  wachsen, zusammen mit seiner Wirtschaft. Ich war auch mehrmals in Südamerika, gerade
  in den letzten Monaten. Da könnten die Staaten diverser nicht sein und die Zuordnung
  zu Middle Power oder nicht, könnte sicher eine ganze Reihe von Seminaren füllen.
  Viel zentraler ist deshalb, dass die Staaten dieses Subkontinents dabei sind ihr
  Potenzial auf der Weltbühne immer weiter zu entfalten – egal ob klein oder groß,
  ob „Middle Power“ oder nicht. Und alle wollen mit Deutschland, mit Europa zusammenarbeiten,
  Stichwort MERCOSUR. Natürlich sind zwischenstaatliche Kooperationen immer einfacher,
  wenn man nicht nur Interessen, sondern auch Werte teilt. Das stellt Kooperationen
  auf einen gemeinsamen Grund. Das festigt sie auch jenseits tagespolitischer Flexibilität.
  Was ich aber auch feststelle: Eine große Schnittmenge an Interessen ist durchaus
  in der Lage, Differenzen in anderen Belangen zu überwiegen. Und sie vielleicht dann
  auch in Zukunft zu überwinden. Wenn man den kleinsten gemeinsamen Nenner findet,
  dann ist das vielleicht wenig auf den ersten Blick. Aber es ist ein Anfang, da kann
  viel mehr daraus entstehen. Und dieser Prozess, das ist auch die Aufgabe von einer
  interessengeleiteten, vernunftbasierten Außenpolitik. Denn diesen kleinsten gemeinsame
  Nenner, den findet man oftmals nur, wenn man bereit ist realistisch auf die Dinge
  zu schauen. Und ich sehe, dass dieser Ansatz aufgeht. Genau deswegen wehre ich mich
  auch dagegen, wenn manche Beobachter des internationalen Systems in einen finalen
  Abgesang auf die internationale regelbasierte Ordnung einstimmen wollen. Denn auch
  das höre ich immer wieder, wenn über das „Middle Power Concept“ gesprochen wird.
  Dass ja die internationale Ordnung tot sei und wir deswegen jetzt nur noch auf „ad-hoc
  Koalitionen“ setzen müssten, könnten und dürften. Ich gewinne da den Eindruck, dass
  eine gewisse, auch öffentlich-mediale Lust am Untergang droht, die nüchterne Betrachtung
  zu überflügeln. Denn dieses Urteil, das deckt sich einfach nicht mit dem, was ich
  fast jeden Tag erlebe. Staaten, mit denen wir durchaus politisch auseinanderliegen.
  Etwa in der Position gegenüber Russland, die kommen auf uns zu, die wollen mit mir
  sprechen und fragen: Wie können wir mehr gemeinsam machen? Und darin liegt ja eine
  große Chance, denn wir fokussieren uns nicht auf das, worin wir uneinig sind, sondern
  auf das, wo wir gemeinsam unsere Interessen zum Tragen und in Einklang bringen können.
  Und genau das ist doch der Anfang jedes Multilateralismus: Der Wille zur Gemeinsamkeit!
  Dieser Wille entsteht eben meist nicht über Altruismus, sondern über Interessen
  – „knallharte Interessen“ möchte man sagen. Und trotzdem ist da ein Wille zu kooperieren
  und nicht wie ein Bulldozer den eigenen Interessen eine Bahn zu brechen, egal, was
  dabei alles kaputt geht. Das müssen wir bei der Idee der „Middle Powers“ immer mitdenken.
  Dass eine „Middle Power Cooperation“ per se nicht eine Vision des Zusammenlebens
  der Staaten ersetzen kann. Aber: „Middle Power Cooperations“, die können den Weg
  dahin öffnen. Sie sind für mich eher eine Gebrauchsanweisung für ein „ Leben in
  der Lage “, aber nicht das eigentliche Ziel. Und gerade dieses „Leben in der Lage
  “, das ist gar nicht so einfach in einer Welt, die immer rücksichtsloser wird, in
  der die Krisen gefühlt mit jedem Tag zunehmen. Es ist eine Welt geworden, in der
  die aktuelle Schwäche des internationalen Systems besonders ins Gewicht fällt. Ich
  sage es einmal drastisch: In einer Welt des „Urzustands“ nach Thomas Hobbes, da
  überleben am Ende nur die Staaten ab „Middle Power“ aufwärts. Da wird der Wunsch,
  im internationalen Miteinander eben nicht zum Spielball anderer zu werden, für die
  Staaten ein Wunsch bleiben, die nicht die Mittel haben, anderen ihre Grenze aufzuzeigen.
  Gerade dann, wenn die internationale Ordnung wegbricht, die diese Grenzen für alle
  festlegt. Für kleinere Staaten sind darum Bündnisse die einzige Überlebensstrategie.
  Ich sage bewusst Bündnisse, nicht „Kooperationen“. Denn ich bin davon überzeugt:
  Nur belastbare Bündnisse und Allianzen können einander auch durch schwere Zeiten
  tragen. Das ist die Crux an Ad-hoc-Koalitionen: Sie werden per definitionem nur
  auf eine bestimmte Zeit geschlossen. Bis das gemeinsame Ziel erreicht ist. Die interessenbasierte
  Kooperation kann zweifelsohne einiges leisten. Aber sie kann langfristige Übereinkünfte,
  Allianzen und Zusammenschlüsse nicht ersetzen. Und für diese braucht es mehr als
  nur ein klar definiertes und geteiltes Interesse. Für die braucht es auch eine gemeinsame
  Wertebasis. Schauen wir doch nur mal auf Europa. Auf die Europäische Union. Das
  Friedensversprechen, das wir uns gegeben haben, es wäre als ad-hoc-Koalition, die
  nur auf Interessen basiert, völlig wertlos. Die Strahlkraft der Europäischen Union
  würde auch nicht über ihre Grenzen hinaus reichen. Wir dürfen heute hier die Ministerin
  für die Europäische Integration der Republik Moldau begrüßen. Willkommen, liebe
  Cristina Gherasimov! Die Freiheit der Republik Moldau, die sieht Moskau heute als
  „ on the menu“ an. Die Antwort darauf kann nur ein fester Platz in Europa sein,
  als Mitglied der Europäischen Union. Und die Europäische Union ist eben gerade nicht
  ein Staatenbund der „Middle Powers“. In der Europäischen Union haben wir viele kleinere
  Staaten, die sich ihr angeschlossen haben. Gleiches gilt für die NATO . Weil diese
  Bündnisse auch in Krisenzeiten füreinander einstehen. Für solche, die als „Middle
  Powers“ gelten, und die vermeintlichen „Small States“. Ich sehe Deutschland, in
  Anlehnung an die politische Grundüberzeugung eines Helmut Kohl, immer als Anwalt
  und Fürsprecher derjenigen, die von den sogenannten „Großen“ häufig übersehen werden.
  Wir setzen uns für diese Staaten ein. Dass sie zu Wort kommen, Gehör finden und
  mitentscheiden. wir haben im vergangenen Jahr die deutsche Außenpolitik mit einem
  realistischen Blick auf die Welt neu ausgerichtet. Und heute erschließen wir in
  neuen globalen Partnerschaften Rohstoffabkommen und sichern uns Energiequellen.
  Gerade gestern Abend habe ich gemeinsam mit der deutschen Wirtschaft über die Industrieinitiative
  zur Gründung eines Handelshauses für Rohstoffe gesprochen. Wir suchen Kooperation
  mit Schlüsselstaaten auch dort, wo wir bisher global wenig Präsenz und Aufmerksamkeit
  gezeigt haben. Ich bin als Außenminister, wir sind im Auswärtigen Amt für alle anspielbar
  und wissen gleichzeitig, wo wir ethisch und politisch verwurzelt sind. Das ist gesunder
  Menschenverstand, strategische Notwendigkeit und mein Verständnis von Außenpolitik.
  Manche Beobachter und Kommentatoren glauben, das würde auch verlangen, Äquidistanz
  zwischen den sich bildenden Blöcken zu wahren. Das sehen wir auch in den Ergebnissen
  des „Berlin Pulse“. Ich sage dazu klar: Das halte ich für einen Fehler. Deutschland
  ist nicht neutral. Und sollte es auch nicht werden. Wir wissen, wo wir stehen: In
  der Mitte eines vereinten Europas, der Europäischen Union, als überzeugte Transatlantiker
  und engagiert in und für die regelbasierte Weltordnung. Und ich glaube, das ist
  auch eine Stärke, dass man international weiß, woran man an Deutschland ist. Daran
  lasse ich auch keinen Zweifel aufkommen. Und wir sehen ja: Unsere Kooperationen
  wachsen! Und all dieses internationale Kooperieren, alt, neu, fest, lose, transaktional,
  werte- und oder interessensbasiert; das hat das Potenzial, das gemeinsame Streben
  für eine gerechte, regelbasierte Ordnung wiederzubeleben. Es gibt immer einen kleinsten
  gemeinsamen Nenner. Und aus dem kann sich Großes entwickeln. Das ist ein Ziel, das
  ich nicht aus den Augen verliere, wenn ich für eine interessensorientierte und wertebasierte
  Außenpolitik einstehe. Letzte Woche trafen sich bei der „ Coalition of the Willing
  “ in Berlin über vierzig Staaten, um miteinander Lösungen füreinander zu finden.
  Für Frieden in der Ukraine und Sicherheit für Europa. Gleichzeitig trafen sich andere
  Staaten tausende Kilometer entfernt, um untereinander Lösungen für andere zu diskutieren.
  Das zeigt für mich sehr klar: Das „Middle Power Concept“ kann nur dann aufgehen,
  wenn es nicht alleine der Logik der eigenen Interessen folgt. Sondern das Wohl der
  anderen im Blick hat. Gute Politik muss miteinander errungen werden. Wir, die Middle
  Powers, die ernannten und die selbsterklärten, die die Ressourcen haben, die sich
  in einem festen Netz von Allianzen befinden, wir tragen eine Verantwortung. Für
  uns und zugleich eine Verantwortung für die Staaten, die ohne die internationale
  Ordnung alleine zurückgelassen werden. Wir müssen das Konzept der „Middle Powers
  Cooperation“ um diesen existenziellen Aspekt erweitern. Weil es sich eben nicht
  um ein „zero sum game“ handelt, sondern umfassende Kooperation Sicherheit und Wohlstand
  für alle mehrt. Und meine Außenpolitik steht dafür ein, dass Deutschland dieser
  Verantwortung gerecht wird.'
