title: 'Deutschland auf der Weltklimakonferenz in Antalya: Pariser Klimaabkommen schneller
  umsetzen'
text: 'Am Montag, dem 9. November 2026, beginnt im türkischen Antalya die 31. Weltklimakonferenz
  der Vereinten Nationen (COP31). Bis zum 20. November beraten die Vertragsstaaten
  darüber, wie sie das Pariser Klimaabkommen schneller umsetzen können. Die bisherigen
  nationalen Klimaschutzbeiträge für 2035 reichen in der Summe nicht aus, um die Erderwärmung
  auf 1,5 Grad zu begrenzen. In Antalya geht es deshalb darum, die vorliegenden Beiträge
  umzusetzen und weitere ehrgeizige Maßnahmen voranzubringen. Weitere Themen sind
  die Anpassung an Klimafolgen und die Umsetzung des neuen globalen Klimafinanzierungsziels.
  Bundesumweltminister Carsten Schneider steigt in der zweiten Konferenzwoche vor
  Ort in die Verhandlungen ein. Das Bundesumweltministerium ist innerhalb der Bundesregierung
  für die internationale Klimapolitik federführend. Das Entwicklungsministerium bringt
  seine entwicklungspolitische Expertise ein, verhandelt federführend zum Thema Anpassung
  und unterstützt die Umsetzung und Finanzierung klimapolitischer Maßnahmen und Partnerschaften.
  Das Auswärtige Amt begleitet die Konferenz mit seiner Arbeit in den Bereichen Klimaaußenpolitik
  und Klima und Sicherheit. Bundesumweltminister Carsten Schneider: „Je schneller
  die weltweiten Emissionen sinken, desto schneller können wir die Temperaturkurve
  wieder auf 1,5 Grad drücken. Zugleich müssen wir die Menschen besser vor den Folgen
  von Hitze, Dürren und Überschwemmungen schützen. In Antalya wollen wir dabei so
  konkret wie möglich werden. Die geoökonomische Lage mit den Preisschocks für Benzin,
  Diesel und Gas ist neben dem Klimaschutz ein weiterer dringender Grund, jetzt engagiert
  voranzugehen: Drei Viertel der Menschheit lebt in Ländern, die wie wir von fossilen
  Importen abhängig sind. All diese Länder haben jetzt einen starken neuen Anreiz,
  etwas an ihrem Wirtschaftsmodell zu verändern. Neben erneuerbaren Energien und Energieeffizienz
  ist die Elektrifizierung das richtige Gegenmittel gegen die fossile Krise. Die Bundesregierung
  wird die Elektrifizierungs-Initiative der Präsidentschaft unterstützen. Weitere
  Länder werden folgen. Das Ziel ist ein starkes Signal an die weltweiten Märkte,
  dass modernen und effizienten elektrischen Technologien die Zukunft gehört. Jedes
  neue Elektroauto, jede neue Wärmepumpe und jedes Werk, das Prozesswärme mit erneuerbarem
  Strom erzeugt, macht uns einen Schritt unabhängiger von den andauernden Preisschocks
  bei Öl und Gas.“ Bundesaußenminister Dr. Johann Wadephul: „Die Lage der kleinen
  Inselstaaten zeigt uns sehr konkret, wie existenziell die Folgen des Klimawandels
  schon heute sind: Viele drohen buchstäblich im Meer zu versinken. Ihre Stimme muss
  bei der Weltklimakonferenz deshalb gehört werden. Denn für sie ist der Klimawandel
  eine ganz akute Sicherheitsbedrohung, das habe ich bei meinem Besuch in Tonga Anfang
  des Jahres erlebt. Wenn anderswo Konflikte um Wasser und fruchtbare Böden eskalieren,
  Menschen ihre Heimat verlassen müssen, Extremisten Zulauf finden, dann betrifft
  das auch unsere Sicherheit hier in Deutschland und Europa. Die Blockade der Straße
  von Hormus zeigt, wie Energie als Waffe eingesetzt werden kann – Investitionen in
  die heimischen Erneuerbaren sind deswegen nicht nur Klimaschutz, sondern auch eine
  Investition in unsere Sicherheit. Mit unserer Klimaaußenpolitik, unseren Klimapartnerschaften
  und Klimabotschaften tragen wir im täglichen Austausch mit vielen Ländern rund um
  den Globus dazu bei, dass der Klimawandel nicht nur einmal im Jahr bei der COP im
  Fokus steht. Wir setzen uns ganzjährig zusammen mit starken Partnern ambitioniert
  für das Klima ein und gehen die Folgen des Klimawandels entschlossen an. Denn der
  Klimawandel kennt keine Grenzen, er betrifft uns alle.“ Bundesentwicklungsministerin
  Reem Alabali Radovan: „Die Auswirkungen der Klimakrise haben wir in diesem Sommer
  einmal mehr zu spüren bekommen: extreme Hitze, Flusspegel auf Niedrigständen und
  Aufrufe zum Wassersparen. Die Menschen im Globalen Süden trifft der Klimawandel
  jedoch am härtesten. Hitzewellen und Überschwemmungen werden dort immer wieder zur
  Überlebensfrage. Die Klimakrise ist eine zentrale globale Gerechtigkeitsfrage unserer
  Zeit. Unsere Antwort muss internationale Solidarität sein. Gerade das leistet die
  deutsche Entwicklungspolitik. Wenn wir über die Klimakrise sprechen, müssen wir
  auch über Wasser sprechen. Wasser und Klima gehören untrennbar zusammen. Wir brauchen
  flächendeckende Anpassungspläne, Frühwarnsysteme und eine gute Klimarisikofinanzierung.
  Dafür setzen wir uns bei der COP31 ein. Denn die 1,5-Grad-Grenze wird bereits zeitweise
  überschritten. Jedes Zehntelgrad zählt.“ Die 31. Weltklimakonferenz wird erstmals
  von zwei Präsidentschaften geleitet: Die Türkei ist als COP -Präsidentschaft unter
  anderem für die Ausrichtung sowie Organisation und für die sogenannte Action Agenda
  (zur Umsetzung des Pariser Abkommens) verantwortlich. Australien firmiert als Verhandlungs-Präsidentschaft.
  Zu Australiens Aufgaben gehören die Vorbereitung und Leitung der Verhandlungen,
  Konsultationen mit den Staaten und die Erarbeitung von Beschlüssen. Bundesumweltminister
  Carsten Schneider wird im Auftrag der australischen Verhandlungspräsidentschaft
  gemeinsam mit dem indischen Umweltminister Bhupender Yadav die politischen Konsultationen
  zum zentralen Thema der Minderung von Treibhausgasen übernehmen. Grundlage für das
  gemeinsame Auftreten der Europäischen Union sind die Schlussfolgerungen des EU -Umweltrats
  vom 12. Oktober. Zu den Prioritäten gehören der Ausbau erneuerbarer Energien, mehr
  Energieeffizienz und die schrittweise Abkehr von fossilen Brennstoffen. Deutschland
  hat dazu einen nationalen Fahrplan vorgelegt. In Antalya setzt sich die Bundesregierung
  auch dafür ein, Methanemissionen zu senken, das klimaschädliche Gas Schwefelhexafluorid
  (SF₆) in Stromnetzen zu ersetzen und die Kreislaufwirtschaft zu stärken. Deutschland
  unterstützt die Elektrifizierungsinitiative der türkischen COP -Präsidentschaft.
  Ihr Ziel ist es, den Anteil von Strom am weltweiten Endenergieverbrauch bis 2035
  von gut 20 auf 35 Prozent zu erhöhen. Deutschland unterstützt die Initiative unter
  anderem mit der Verteilnetzinitiative D-Grids. Leistungsfähige Stromnetze und Speicher
  sind eine Voraussetzung dafür, dass mehr erneuerbarer Strom in Gebäuden, im Verkehr
  und in der Industrie genutzt werden kann. Bei der Klimaanpassung setzt sich Deutschland
  dafür ein, besonders gefährdeten Ländern den Zugang zu Klimafinanzierung zu erleichtern
  und naturbasierte Lösungen stärker zu nutzen. So können intakte Mangroven Kohlenstoff
  speichern und Küsten vor Sturmfluten schützen. Auch der Schutz der Ozeane rückt
  in Antalya stärker in den Blick. Die COP31-Vorbereitungskonferenz (Pre- COP ) in
  Fidschi unter australischem Vorsitz hat dafür bereits erste Impulse gesetzt.'
