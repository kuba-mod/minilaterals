title: Der Beauftragte der Bundesregierung für Religions- und Weltanschauungsfreiheit
  Rachel zum Anschlag auf Christen in Hmoud, Jordanien
text: 'Zum Anschlag auf Christen in Hmoud, Jordanien sowie seinem Besuch vor Ort sagte
  der Beauftragte der Bundesregierung für Religions- und Weltanschauungsfreiheit Rachel
  heute, 01.11.2026: Als Beauftragter der Bundesregierung für Religions- und Weltanschauungsfreiheit
  habe ich wenige Tage nach dem grausamen Terroranschlag auf Christen den Ort des
  Anschlags, Hmoud in Jordanien, besucht. Der Besuch und die bewegenden Gespräche
  mit den trauernden Familienangehörigen haben mir das Leid der Opfer und ihrer Angehörigen
  unmittelbar vor Augen geführt. Der Schock sitzt tief – in den betroffenen Familien
  ebenso wie in der gesamten jordanischen Gesellschaft. Ich verurteile diesen schrecklichen
  Terroranschlag auf das Schärfste. Er ist nicht nur ein Angriff auf Christen, sondern
  auch auf die jordanische Gesellschaft insgesamt und auf das friedliche Zusammenleben
  der Religionen. Jordanien steht für ein Zusammenleben von Menschen unterschiedlicher
  Religionen und Glaubensüberzeugungen, das von gegenseitigem Respekt und gesellschaftlichem
  Zusammenhalt geprägt ist. Dieses Miteinander darf durch Terror und religiösen Extremismus
  nicht erschüttert werden. Im Gegenteil: Es gilt, den Zusammenhalt weiter zu stärken,
  Hass und Extremismus entschieden entgegenzutreten und die Religionsfreiheit für
  alle Menschen zu schützen und zu fördern. Es darf den Tätern nicht gelingen, Menschen
  unterschiedlichen Glaubens gegeneinander aufzubringen. Gerade jetzt kommt es darauf
  an, gemeinsam für ein friedliches und respektvolles Miteinander einzustehen und
  dieses auch in Zukunft weiter zu festigen.'
