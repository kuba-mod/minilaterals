date: '2026-11-11'
type: press_release
source_name: german_mfa
title: Gemeinsame Erklärung im Anschluss an das Treffen der Außenministerinnen und
  ‑minister der G7 am 9. und 10. November 2026 in Paris
text: Wir, die G7 -Außenministerinnen und -minister Deutschlands, Frankreichs, Italiens,
  Japans, Kanadas, des Vereinigten Königreichs und der Vereinigten Staaten von Amerika
  sowie die Hohe Vertreterin der Europäischen Union, kamen am 9. und 10. November
  2026 im Rahmen des diesjährigen französischen G7 -Vorsitzes in Paris zusammen. Wir
  bekräftigten unsere unerschütterliche Unterstützung der Ukraine und ihres mutigen
  Volkes bei der Verteidigung ihrer territorialen Unversehrtheit, Souveränität, Freiheit
  und Unabhängigkeit. Wir stehen in uneingeschränkter Solidarität an der Seite der
  ukrainischen Bevölkerung, die unter den täglichen russischen Angriffen auf Wohngebäude,
  zivile Infrastruktur und Kulturerbe sowie böswilligen hybriden Aktivitäten gegen
  die Ukraine und andere Partner leidet. Wir verurteilten die Serie gezielter Angriffe
  auf die zivile Schifffahrt in der Schwarzmeerregion, die erhebliche Auswirkungen
  auf die weltweite Ernährungssicherheit haben, und verstärkten unser Bekenntnis zur
  Sicherung der Lieferketten für Lebensmittel. Wir bekräftigten unsere Unterstützung
  der laufenden Bemühungen um Ermöglichung eines Friedens durch direkte und ernsthafte
  Verhandlungen unter Führung der Vereinigten Staaten. Wir betonten erneut, wie wichtig
  die Gewährleistung einer uneingeschränkten, umfassenden und gegenseitigen Waffenruhe
  ist. Eine beiderseitige Einstellung der Angriffe auf sämtliche Energieinfrastruktur
  und im Schwarzen Meer zum Schutz der Zivilbevölkerung, zur Eindämmung von Unterbrechungen
  bei der Versorgung mit Energie einschließlich Wärme, der Wasser- und Sanitärversorgung
  sowie der Lebensmittelversorgung und zur Förderung einer größeren Stabilität der
  globalen Märkte ist ein wichtiger erste Schritt hin zu einem gerechten und dauerhaften
  Frieden. Wir betonten erneut, dass Verhandlungen über die künftige Sicherheit in
  Europa unter Einbindung der Europäer stattfinden müssen. Wie auf dem G7 -Gipfel
  in Évian zugesagt, zogen wir eine Bilanz der Fortschritte bei der Versorgung der
  Ukraine mit Luftabwehrfähigkeiten, Luftabwehrsystemen und Abfangraketen sowie Langstreckenfähigkeiten
  und Lizenzen, die es dem Land ermöglichen werden, seine militärische Produktion
  zu steigern und sein naturgegebenes Recht auf Selbstverteidigung auszuüben. Wir
  sind weiterhin entschlossen, unsere diesbezüglichen Anstrengungen fortzusetzen und
  zu verstärken. Wir erkannten die Notwendigkeit an, den dringenden Finanzierungsbedarf
  der Ukraine für 2027 und darüber hinaus zur Unterstützung des Landes auf abgestimmte
  Art und Weise anzugehen. Wir verurteilten die Bereitstellung militärischer Hilfe
  an Russland durch Nordkorea und Iran sowie die Bereitstellung von Waffen, militärischer
  Ausbildung und Dual-Use-Komponenten durch China, wodurch die Fortsetzung des Krieges
  ermöglicht wird. Wir machten deutlich, dass wir beabsichtigen, weiterhin Maßnahmen
  gegen diese Länder zu ergreifen. Aufbauend auf dem Konsens unserer Staats- und Regierungschefinnen
  und -chefs in Évian sprachen wir darüber, den Druck auf Russlands Kriegswirtschaft,
  auch durch Sanktionen, zu erhöhen. Wir bekräftigten die Zusage unserer Staats- und
  Regierungschefinnen und -chefs, Sanktionen gegen Russland eng abzustimmen. Wir betonten
  erneut unsere Entschlossenheit, Schiffe, die unter falscher Flagge fahren, sowie
  staatenlose Schiffe und strukturelle Helfershelfer wie Versicherer, Ölhändler und
  Mittelsleute in den Blick zu nehmen, um Schiffe der Schattenflotte, mit denen Sanktionen
  umgangen werden, weiter aufzuhalten und abzuschrecken. Wir bekräftigten erneut unsere
  Unterstützung der Energiesicherheit und -resilienz der Ukraine und beschlossen,
  unsere finanzielle und materielle Unterstützung aufzustocken, um dem Land durch
  den Winter zu helfen. Wir begrüßten Anstrengungen, die Reparatur der neuen Schutzkonstruktion
  in Tschernobyl prioritär auf der internationalen Agenda zu belassen, wie sie auf
  der am 9. November in Paris von Frankreich, der EBWE und der Ukraine ausgerichteten
  Geberkonferenz unter Beweis gestellt wurden. Wir begrüßten ferner die laufenden
  im Rahmen des Tallinn-Mechanismus unter italienischer Führung koordinierten Projekte
  zur Unterstützung der ukrainischen Cyberresilienz. In Bezug auf Iran würdigten wir
  die Arbeit der regionalen Mediatoren und bekräftigten unsere Unterstützung für alle
  diplomatischen Bemühungen um die Herbeiführung einer dauerhaften Lösung, die die
  internationalen Bedenken in Bezug auf Irans Nuklearprogramm berücksichtigt und zur
  regionalen Sicherheit beiträgt. Wir bekräftigten, dass es Iran niemals gelingen
  darf, eine Kernwaffe zu entwickeln oder zu erlangen. Wir forderten Iran auf, seine
  Unterstützung für nichtstaatliche bewaffnete Gruppen in der Region einzustellen.
  In Ermangelung einer diplomatischen Lösung bekannten wir uns dazu, unsere Abstimmung
  dahingehend fortzusetzen, die Fähigkeit des iranischen Regimes, in der Region und
  überall auf der Welt Instabilität zu verbreiten, wirtschaftlich und politisch einzuschränken.
  Wir verurteilten nachdrücklich Irans Angriffe auf seine Nachbarn und die Störung
  des internationalen Handels, der Energiesicherheit und der Weltwirtschaft, die durch
  die Behinderung der Durchfahrt durch die Straße von Hormus verursacht wurde. Wir
  bekräftigten, wie wichtig der Schutz der Zivilbevölkerung und ziviler Objekte ist,
  und riefen Iran zur Achtung seiner internationalen menschenrechtlichen und humanitären
  Verpflichtungen auf. Wir riefen Iran ferner auf, seine fortwährenden Angriffe auf
  zivile Schiffe in der Straße von Hormus einzustellen. Wir erneuerten unser Bekenntnis
  zum Recht auf sichere und freie Durchfahrt sowie unsere Ablehnung jeglicher Mautzahlungen,
  Gebühren, unrechtmäßiger Kosten sowie Diskriminierung oder sonstiger Begrenzung
  der Seeschifffahrt durch die Meerenge. Wir unterstrichen, wie wichtig die Defensivmaßnahmen
  des Zentralkommandos der Vereinigten Staaten zur Minenräumung und zum Geleitschutz
  für zivile Schiffe in der Straße von Hormus sind. Wir erkannten an, dass die multinationale,
  unabhängige und defensiv ausgerichtete Initiative unter der Führung von Frankreich
  und dem Vereinigten Königreich eine wichtige Rolle spielen kann, wenn es darum geht,
  die Wiederaufnahme des Schiffsverkehrs durch die Straße von Hormus auch durch die
  Unterstützung bei der Überprüfung einer vollständigen Minenräumung zu erleichtern.
  Wir bekräftigten unser Bekenntnis zur vollständigen Umsetzung der Verpflichtungen
  im Zusammenhang mit den sich aus allen einschlägigen Resolutionen des VN -Sicherheitsrats
  ergebenden Sanktionen und damit zusammenhängenden restriktiven Maßnahmen, die im
  September 2025 mittels des mit Resolution 2231 des VN -Sicherheitsrats vorgesehenen
  Snapback-Mechanismus wieder in Kraft gesetzt wurden, und riefen alle VN -Mitgliedstaaten
  auf, dies ebenfalls zu tun. Wir forderten Iran nachdrücklich auf, seine internationalen
  Verpflichtungen wieder einzuhalten und insbesondere die uneingeschränkte Zusammenarbeit
  mit der Internationalen Atomenergie-Organisation ( IAEO ) wieder aufzunehmen, um
  die Transparenz hinsichtlich der Natur seines Nuklearprogramms wiederherzustellen.
  Wir äußerten uns ferner zutiefst besorgt über die Beteiligung Irans an zahlreichen
  gewaltsamen Handlungen gegen unsere Bürgerinnen und Bürger sowie unsere Hoheitsgebiete.
  Wir nahmen die Attribuierung der Beteiligung Irans an dem Vorfall am RAF-Stützpunkt
  Fairford am 27. September durch das Vereinigte Königreich zur Kenntnis. Iran sollte
  sich im Klaren sein, dass wir geeint sind und dem Schutz unserer Souveränität verpflichtet
  bleiben. In Bezug auf Jemen verurteilten wir auf das Schärfste die fortwährenden,
  nicht hinnehmbaren Angriffe der Huthi in Jemen und gegen das Königreich Saudi-Arabien,
  die sich auch gegen Zivilpersonen und zivile Infrastruktur richten. Wir riefen die
  Huthi auf, sämtliche militärische Handlungen und Drohungen unverzüglich einzustellen
  und von jeglicher weiteren Eskalation abzusehen, um eine Rückkehr zu einem alle
  Seiten einbeziehenden politischen Prozess zu ermöglichen. Wir bekundeten unsere
  Solidarität mit der Regierung Jemens und dem Königreich Saudi-Arabien und bekräftigten
  deren Recht, ihre Sicherheit, Souveränität und territoriale Unversehrtheit im Einklang
  mit dem Völkerrecht zu verteidigen. Wir riefen alle Akteure einschließlich Iran
  dazu auf, die Bewaffnung und Unterstützung der Huthi, die gegen mehrere Resolutionen
  des Sicherheitsrats der Vereinten Nationen verstößt, einzustellen. Wir äußerten
  uns zutiefst besorgt über die sich verschärfenden humanitären Auswirkungen des Konflikts
  und riefen dazu auf, die Zivilbevölkerung zu schützen und mit der zügigen Öffnung
  eines humanitären Korridors in Taiz für sicheren und ungehinderten humanitären Zugang
  zu sorgen. Wir fordern erneuert die umgehende und bedingungslose Freilassung aller
  humanitären Helferinnen und Helfer, unter ihnen die 70 VN -Mitarbeitenden, die von
  den Huthi unrechtmäßig festgehalten werden. Wir betonten erneut, wie wichtig maritime
  Sicherheit und Gefahrenabwehr im Roten Meer und der Meerenge Bab al-Mandab sind.
  Wir waren uns einig darüber, dass es wichtig ist, die Regierung Jemens, auch durch
  den Aufbau von Kapazitäten, weiter zu unterstützen. Wir erkennen den positiven Beitrag
  der maritimen Defensivoperationen EUNAVFOR ASPIDES und EUNAVFOR ATALANTA der EU
  an, deren Aufgabe es ist, in der Meerenge Bab al-Mandab, im Roten Meer und im Golf
  von Aden die maritime Sicherheit wiederherzustellen und für den Schutz der Schifffahrt
  und der Seeleute zu sorgen. In Bezug auf Libanon betonten wir die Notwendigkeit,
  dass alle Konfliktparteien die Waffenruhe uneingeschränkt einhalten, und bekundeten
  unsere Unterstützung für die Umsetzung des trilateralen Rahmenabkommens und der
  Resolution 1701 des VN -Sicherheitsrats. Wir bekräftigten, dass die Entwaffnung
  aller nichtstaatlichen bewaffneten Gruppen, allen voran der Hisbollah, wesentlich
  dafür bleibt, dass alle Waffen der Zuständigkeit und Kontrolle des libanesischen
  Staates unterstellt werden. Wir riefen Libanon und Israel zu Fortschritten bei der
  Einrichtung von Pilotzonen auf, um die vollständige und nachprüfbare Entwaffnung
  der Hisbollah und den israelischen Rückzug bei gleichzeitiger Kontrollübernahme
  durch die libanesischen Streitkräfte (LAF) zu ermöglichen. Wir bekräftigten unsere
  Unterstützung der Bemühungen der libanesischen Behörden um Entwaffnung aller nichtstaatlichen
  bewaffneten Gruppen sowie um die Souveränität und die territoriale Unversehrtheit
  Libanons. Angesichts des Auslaufens des Mandats der Interimstruppe der Vereinten
  Nationen in Libanon ( UNIFIL ) Ende des Jahres unterstrichen wir die Notwendigkeit
  einer robusten, glaubwürdigen und dauerhaften Sicherheitsarchitektur in Libanon
  zur Unterstützung der libanesischen Streitkräfte im Einklang mit Resolution 1701
  des VN -Sicherheitsrats und zur Begünstigung der weiteren Umsetzung des trilateralen
  Rahmenabkommens. Im Zuge der Forderung nach gestärkten LAF begrüßten wir die Einrichtung
  der EU -Unterstützungsmission in Libanon (EUSM Libanon), einer GSVP -Mission der
  EU . Wir riefen libanesische Akteure zu Fortschritten bei der Verabschiedung und
  Umsetzung von Finanzreformen mit Blick auf die Verhandlungen über ein IWF -Programm
  auf. In Bezug auf Gaza blieben wir der zügigen Umsetzung der Resolution 2803 des
  VN -Sicherheitsrats ebenso verpflichtet wie beschleunigten Anstrengungen in den
  Bereichen humanitäre Hilfe, wirtschaftliche Erholung und Wiederaufbau mit dem Ziel
  langfristiger Stabilität. Wir verurteilten die von der Hamas am 7. Oktober 2023
  verübten Angriffe unmissverständlich und bekräftigten, dass die Hamas in der Zukunft
  Gazas keine Rolle spielen darf und ihr Waffenarsenal auflösen muss. Israel muss
  sich im Einklang mit den in Resolution 2803 des VN -Sicherheitsrats aufgeführten
  Bedingungen schrittweise aus dem Gazastreifen zurückziehen. Wir betonten die dringende
  Notwendigkeit der sicheren, zügigen, andauernden und ungehinderten Bereitstellung
  humanitärer Hilfe in ganz Gaza und der Öffnung weiterer Übergänge sowie der Wiederherstellung
  der humanitären Infrastruktur und des Schutzes der Zivilbevölkerung. Es ist von
  entscheidender Bedeutung, dass sich alle Parteien weiterhin konstruktiv an den nächsten
  Schritten beteiligen, die in dem umfassenden Plan skizziert werden, und zwar im
  Sinne einer politischen Perspektive eines friedlichen, durch Wohlstand gekennzeichneten
  Zusammenlebens der israelischen und der palästinensischen Bevölkerung, wodurch Frieden
  und Stabilität im Nahen Osten vorangetrieben werden. Wir riefen zu einem Ende der
  Terrorangriffe und weiterer Handlungen auf, die die Spannungen und das Risiko einer
  Eskalation im Westjordanland erhöhen. In Bezug auf Syrien bekräftigten wir unsere
  nachdrückliche Unterstützung für einen friedlichen und inklusiven politischen Übergang
  in ein geeintes, souveränes und stabiles Syrien, in dem die Menschenrechte und Grundfreiheiten
  aller Syrerinnen und Syrer geachtet werden. Wir betonten, wie wichtig die vollständige
  Umsetzung der Vereinbarungen über die friedliche Eingliederung Nordostsyriens ist,
  und erneuerten unser Bekenntnis zur Bekämpfung des Terrorismus. Wir äußerten uns
  besorgt über die Lage in Südsyrien und riefen zum Schutz der Zivilbevölkerung und
  zur Achtung der Souveränität und territorialen Unversehrtheit Syriens auf. Wir bekräftigten
  ferner, wie wichtig die Unterstützung der wirtschaftlichen Erholung und des Wiederaufbaus
  in Syrien für langfristige Stabilität und verbesserte regionale Konnektivität ist.
  Wir betonten die Bedeutung eines freien und offenen indopazifischen Raums, der wohlhabend
  und sicher ist und gemeinsame Grundsätze schützt, darunter Souveränität, territoriale
  Unversehrtheit, Rechtsstaatlichkeit und die friedliche Beilegung von Streitigkeiten.
  Wir bekräftigten unsere Verpflichtung, die Freiheit der Schifffahrt und des Überflugs
  in der Region aufrechtzuerhalten, und forderten die Vertragsstaaten auf, ihren völkerrechtlichen
  Verpflichtungen nachzukommen, wie im Seerechtsübereinkommen der Vereinten Nationen
  ( SRÜ ) niedergelegt. Wir brachten unsere tiefe Besorgnis über die Lage im Ost-
  und im Südchinesischen Meer zum Ausdruck. Wir bekräftigten, dass wir jegliche einseitigen
  Bestrebungen, den Status quo insbesondere durch Gewaltanwendung oder Zwangausübung
  zu ändern, sowie alle Handlungen, die Spannungen verschärfen und die Gefahr einer
  Eskalation bergen, entschieden ablehnen. Wir wiesen erneut darauf hin, dass die
  Entscheidung des Schiedsgerichts vom 12. Juli 2016 einen bedeutenden Meilenstein
  darstellt, der endgültig und für die Verfahrensbeteiligten rechtlich bindend ist.
  Wir betonten, wie wichtig die Aufrechterhaltung von Frieden und Stabilität in der
  gesamten Taiwanstraße ist. Im Zusammenhang mit Chinas zunehmend selbstbewussten
  Auftreten in den Gewässern östlich von Taiwan, welches die regionale Stabilität,
  die Freiheit der Schifffahrt und die Sicherheit des internationalen Seeverkehrs
  gefährdet, bekräftigten wir unsere Ablehnung jeglicher einseitigen Bestrebungen,
  den Status quo insbesondere durch Gewaltanwendung oder Zwangausübung beziehungsweise
  deren Androhung zu ändern. Wir ermutigten dazu, die Probleme zwischen beiden Seiten
  der Taiwanstraße durch konstruktiven Dialog friedlich zu lösen. Wir äußerten ferner
  unsere Unterstützung für eine echte Mitwirkung Taiwans in internationalen Organisationen.
  Wir verurteilten in aller Schärfe Nordkoreas rechtswidrige Programme für Kernwaffen
  und ballistische Flugkörper und bekräftigten unser Bekenntnis zur vollständigen
  Entnuklearisierung Nordkoreas in Übereinstimmung mit allen einschlägigen Resolutionen
  des Sicherheitsrats der Vereinten Nationen. Wir betonten, dass die verstärkte Zusammenarbeit
  zwischen Russland und Nordkorea gravierende Folgen für die europäische und indopazifische
  Sicherheit hat. Wir forderten Nordkorea nachdrücklich auf, unverzüglich jegliche
  Unterstützung einzustellen und seine Truppen abzuziehen. Wir bekräftigten unsere
  Besorgnis angesichts der von Nordkorea begangenen Krypto-Diebstähle und Straftaten
  im Cyberbereich und brachten zum Ausdruck, dass eine Reaktion auf Nordkoreas Programm
  bezüglich unrechtmäßig im Ausland arbeitender Arbeitskräfte notwendig ist. Wir forderten
  Nordkorea mit Nachdruck auf, unverzüglich die Frage der Entführungen zu klären.
  Wir sind nach wie vor zutiefst besorgt über die Verschlechterung der menschenrechtlichen
  und der humanitären Lage in ganz Myanmar. Wir bekräftigen die Notwendigkeit einer
  unverzüglichen Deeskalation der Gewalt, eines ungehinderten Durchlasses von humanitärer
  Hilfe und eines echten und inklusiven demokratischen Prozesses, der den Willen der
  Menschen von Myanmar widerspiegelt. Wir waren alarmiert angesichts der verheerenden
  Konsequenzen, die der Krieg für die Menschen in Sudan hat, und angesichts der zunehmenden
  Gefahr von Hungersnöten in Teilen von Darfur und Kordofan. Durch anhaltende Kämpfe,
  Beschränkungen des humanitären Zugangs sowie Angriffe, unter anderem durch Drohnen,
  mit Auswirkungen auf Gesundheitseinrichtungen, Lager von Geflüchteten und die Infrastruktur,
  auf die die Zivilbevölkerung für die Versorgung mit Lebensmittel angewiesen ist,
  sind Menschenleben in Gefahr, was durch den Einfluss von El Niño noch verstärkt
  wird. Ein Jahr nach den Gräueltaten in Al -Faschir verurteilten wir entschieden
  jegliche Gewaltanwendung und alle Übergriffe in Bezug auf die Zivilbevölkerung,
  einschließlich konfliktbezogener sexueller Gewalt gegen Frauen und Mädchen. Wir
  forderten alle externen Akteure auf, die Bereitstellung oder Erleichterung bewaffneter,
  logistischer und finanzieller Unterstützung für die Kriegsteilnehmer einzustellen,
  ihren Einfluss dazu zu nutzen, die gegnerischen Parteien zum Schutz der Zivilbevölkerung
  und zivilen Infrastruktur, zur Aufhebung der Zugangsbeschränkungen für humanitäre
  Hilfe und zur Unterstützung einer Deeskalation zu ermutigen, sowie jegliche Handlungen
  zu vermeiden, die den Konflikt aufrechterhalten könnten. Wir unterstrichen, dass
  neben einer sofortigen Waffenruhe eine friedliche und dauerhafte Beilegung des Konflikts
  unabdingbar ist, um die Einheit und langfristige Stabilität Sudans sicherzustellen.
  Im Einklang mit den im April dieses Jahres auf der Sudan-Ministerkonferenz in Berlin
  erklärten Grundsätzen bekräftigten wir, dass ein glaubwürdiger, von der sudanesischen
  Zivilbevölkerung angeführter, inklusiver und transparenter politischer Dialogprozess,
  in dessen Verlauf historische Missstände angegangen und die Souveränität und territoriale
  Unversehrtheit Sudans geachtet werden, für die Gewährleistung eines dauerhaften
  Friedens von zentraler Bedeutung ist. Wir forderten, dass die Rapid Support Forces
  und die sudanesischen Streitkräfte sich an humanitäres Völkerrecht halten, mit Blick
  auf die Erreichung einer dauerhaften Waffenruhe an Verhandlungen, unter anderem
  mit dem Quad-Format, teilnehmen sowie einen zügigen und ungehinderten humanitären
  Zugang gewährleisten. Wir bekräftigten ferner unsere uneingeschränkte Unterstützung
  für die Arbeit des Quintetts, die darauf abzielt, einen solchen Dialog zu erleichtern,
  und zwar im Rahmen eines Prozesses, der parallel und in enger Abstimmung mit den
  Bemühungen um die Sicherstellung einer Waffenruhe ablaufen sollte. Wir fordern die
  breitere internationale Staatengemeinschaft auf, diese Anstrengungen zu unterstützen.
  Wir nahmen mit großer Sorge die sich verschlechternde Sicherheitslage am Horn von
  Afrika, insbesondere bezüglich Äthiopien und Eritrea, zur Kenntnis, die inmitten
  zunehmender grenzüberschreitender Spannungen das Risiko einer regionalen Eskalation
  birgt. Wir hoben die schwerwiegenden Folgen hervor, die eine weitere Eskalation
  für die regionale Stabilität, die ohnehin schon katastrophalen humanitären Krisen,
  die Sicherheit und den internationalen Handel, auch im Roten Meer, haben könnte.
  Wir forderten alle Konfliktparteien zu äußerster Zurückhaltung, zu Bemühungen um
  diplomatische Lösungen und zur Gewährleistung eines sicheren und ungehinderten humanitären
  Zugangs und des Schutzes der Zivilbevölkerung, insbesondere von Frauen und Kindern,
  auf. Wir bekräftigten, wie wichtig die Achtung der Souveränität, politischen Unabhängigkeit
  und territorialen Unversehrtheit aller Länder in der Region ist. Insbesondere brachten
  wir unserer Unterstützung für die Bemühungen der Vereinten Nationen und der Afrikanischen
  Union zum Ausdruck, Spannungen abzubauen und einen Dialog zwischen den Konfliktparteien
  zu erleichtern. Wir begrüßten und unterstützten die Verlängerung des Mandats der
  Truppe zur Bekämpfung von Banden (GSF) bis Ende März 2027, welche die haitianischen
  Streitkräfte bei der Wiederherstellung von Sicherheit und Stabilität in Haiti unterstützen
  soll. Wir begrüßten ferner die Verlängerung des Sanktionsregimes der Vereinten Nationen,
  mit dem die Rechenschaftspflicht von Personen und Einrichtungen, die den Frieden,
  die Sicherheit und die Stabilität in Haiti gefährden, gefördert wird. Wir riefen
  zu internationaler Unterstützung auf, um die haitianische Nationalpolizei und die
  Streitkräfte Haitis zu stärken, Rechtsstaatlichkeit zu bewahren und Straflosigkeit
  entgegenzuwirken. Wir riefen ferner alle sicherheitspolitischen Akteure, die in
  Haiti aktiv sind, auf, dem Schutz der haitianischen Zivilbevölkerung bei allen Sicherheitseinsätzen
  Priorität einzuräumen. Wir betonten, wie wichtig es ist, dass in Haiti demokratische
  Wahlen organisiert werden, und nahmen zur Kenntnis, dass die erste Runde der Wahlen
  auf Juli 2027 verschoben wurde. In Kenntnisnahme der Fortschritte, die die Regierung
  und der Provisorische Wahlrat bei ihren Bemühungen erzielt haben, Haiti auf seinem
  Weg hin zu einer gewählten Staatsführung voranzubringen, unterstrichen wir die Notwendigkeit,
  die Glaubwürdigkeit und Integrität des Wahlprozesses zu wahren, und betonten die
  Verantwortung der haitianischen Behörden, die vollständige und unparteiische Durchführung
  des Wahldekrets zu gewährleisten. Wir riefen zu konkreten Ergebnissen auf, mit denen
  das Vertrauen der Öffentlichkeit in den Wahlprozess gestärkt und zu einer glaubwürdigen
  Rückkehr zu einer demokratischen Staatsführung beigetragen wird. Wir nahmen zur
  Kenntnis, dass es Bedenken dahingehend gibt, dass mit Sanktionen belegte Personen
  am politischen Prozess teilnehmen, womit Rechenschaftspflicht und öffentliches Vertrauen
  untergraben werden. Die Menschen Haitis haben das Recht, ihre Zukunft durch glaubwürdige
  demokratische Prozesse und Führungspersönlichkeiten, die integer den öffentlichen
  Interessen dienen, zu bestimmen. Wir sind nach wie vor tief besorgt angesichts der
  fortwährenden humanitären Krise, der weitverbreiteten Gewalt und der Berichte über
  Menschenrechtsverletzungen in Haiti. Wir forderten die internationale Staatengemeinschaft
  nachdrücklich auf, die finanziellen Beiträge für den Treuhandfonds der Vereinten
  Nationen zu erhöhen, wobei wir anerkennen, dass der Erfolg der hybriden Mission
  unter VN -Mandat von kontinuierlicher multilateraler Unterstützung als Grundlage
  für ihre Einsätze abhängt. Wir forderten mit Nachdruck unabdingbare internationale
  Unterstützung der humanitären Hilfe für Haiti, um die vielfachen Krisen zu bewältigen,
  mit denen die Bevölkerung Haitis konfrontiert ist. Wir unterstrichen ferner, wie
  wichtig es ist, mit Unterstützung internationaler Finanzinstitutionen und anderen
  multilateralen Partnern den Grundstein für die wirtschaftliche Erholung Haitis zu
  legen. Wir begrüßten die Vereinbarung der Weltbank mit den haitianischen Behörden,
  die als gemeinsames Rahmenwerk dient, um die von Haiti angeführten Reformbemühungen
  zu prüfen und die Verantwortlichkeit für Ergebnisse zu stärken. Wir verpflichteten
  uns, mit vielfältigen haitianischen und internationalen Partnern zusammenzuarbeiten,
  um eine bessere Abstimmung und wechselseitige Ergänzung der Bemühungen zu fördern.
  Wir brachten unsere Besorgnis zum Ausdruck angesichts der tiefgreifenden wirtschaftlichen
  Krise und der humanitären Not, unter denen die Bevölkerung Kubas leidet, was auch
  den Mangel an Lebensmitteln, Treibstoffen und Medikamenten einschließt. Wir betonten,
  wie wichtig es ist, die Mechanismen zur Lieferung humanitärer Hilfe in Kuba und
  Bereitstellung im ganzen Land zu verbessern, um das Wohlergehen der kubanischen
  Bevölkerung zu fördern. Wir forderten die kubanischen Behörden dazu auf, wesentliche
  und wirksame politische wie wirtschaftliche Reformen zu verfolgen und umzusetzen,
  um Wohlstand sowie die Achtung der Menschenrechte und der legitimen Erwartungen
  der kubanischen Bevölkerung zu fördern, sowie dazu, konkrete Maßnahmen hin zu einer
  Mehrparteiendemokratie, Pressefreiheit, freier Meinungsäußerung und Versammlungsfreiheit
  zu ergreifen. Wir forderten die kubanischen Behörden ferner auf, alle Personen freizulassen,
  die willkürlich inhaftiert wurden. Wir ermutigten zu einem konstruktiven und alle
  Seiten einbeziehenden Dialog, um einen Ausweg aus der Krise zu finden. Wir nahmen
  den Willen der Bevölkerung Venezuelas zur Kenntnis, der langanhaltenden politischen
  und wirtschaftlichen Krise des Landes ein Ende zu setzen. In diesem Zusammenhang
  bekräftigten wir unsere uneingeschränkte Unterstützung für die laufenden Gespräche
  zur Aussöhnung, in deren Rahmen die Übergangsregierung und die Delegation, die die
  2015 gewählte Nationalversammlung vertritt, zusammenkommen und die bereits messbare
  Fortschritte erbracht haben. Wir forderten alle Seiten auf, weiterhin redliche Anstrengungen
  auf dem Weg von der Wiederherstellung von Institutionen und Rechtsstaatlichkeit
  hin zum Abhalten freier und fairer Wahlen zu unternehmen. Wir betonten, dass es
  besonders wichtig ist, allen Seiten und zivilgesellschaftlichen Organisationen Garantien
  zu gewähren, um ihnen die Beteiligung an dem demokratischen Prozess zu ermöglichen.
  Wir forderten, alle politischen Gefangenen freizulassen. Wir nahmen zur Kenntnis,
  dass die wirtschaftliche Erholung Venezuelas untrennbar mit dem politischen Aussöhnungsprozess
  verbunden ist, und ermutigten zu Investitionen und Wirtschaftsvereinbarungen, die
  zum Aufbau einer stabileren und wohlhabenderen Zukunft für die venezolanische Bevölkerung
  beitragen. Wir boten ferner als Reaktion auf die beiden verheerenden Erdbeben am
  24. Juni 2026 humanitäre Soforthilfe und Maßnahmen im Bereich Katastrophenschutz
  an. Im Sinne der Verpflichtung, die Vereinten Nationen effizienter und leistungsfähiger
  zu machen und ihre Rechenschaftspflicht und Wirkmächtigkeit zu stärken, begrüßten
  wir die fortwährenden Bemühungen im Rahmen der Initiative UN80 sowie Reforminitiativen
  im Bereich der humanitären Hilfe, darunter die Initiative Humanitarian Reset . Ziel
  dieser letztgenannten Initiativen ist es, das humanitäre System durch eine bessere
  Abstimmung, Abgrenzung von Mandaten und Konsolidierung gemeinsamer Dienste und unerlässlicher
  Instrumente zu stärken, während es gleichzeitig weiterhin allen unparteiischen humanitären
  Akteuren uneingeschränkt offensteht und vollumfänglich im Einklang mit dem Völkerrecht
  sowie der Charta der Vereinten Nationen steht. Wir bekräftigten, wie wichtig es
  ist, an diesem für die Vereinten Nationen kritischen Punkt die nachhaltige Dynamik
  beim Vorantreiben von Reformen beizubehalten. Wir würdigten die Bemühungen der G7
  -Arbeitsgruppe zur Effizienz der humanitären Lieferkette (LOG+7), einer der strategischsten
  Einflussfaktoren, um die Wirkung von humanitärer Hilfe im Kontext erheblich sinkender
  finanzieller Mittel und sich drastisch verschlimmernder Krisen zu erhöhen. Diese
  Bemühungen hin zu einer besser integrierten Lieferkette, was auch die Stärkung der
  bestehenden Zentren der humanitären Hilfe und die Bündelung von Ressourcen umfasst,
  werden dazu beitragen, dass ohne Budgetänderungen ein größerer Teil der hilfsbedürftigen
  Bevölkerung erreicht werden kann und dadurch dabei helfen, den zunehmenden Bedarf
  an humanitärer Hilfe, auch in Bezug auf Ernährungsunsicherheit sowie Fehl- und Mangelernährung
  in all ihren Formen, zu decken. Diese Arbeit soll im Rahmen der von der Europäischen
  Union angeführten Initiative Humanitarian Leadership Group on Supply Chain (HLGSC)
  und durch die Initiative von UN80 zu integrierten Lieferketten fortgesetzt werden.
  Wir erneuerten unser Bekenntnis zu Ernährungssicherheit und Ernährung, um die Folgen
  von Konflikten und Instabilität anzugehen und die Resilienz von Ernährungssystemen
  zu stärken. Wir riefen zu fortgesetztem Handeln auf, um die Unterbrechungen des
  Handels mit Lebensmitteln im Schwarzen Meer im Zusammenhang mit dem Krieg in der
  Ukraine, der Blockade der Straße von Hormus und dem Klimaphänomen El Niño anzugehen.
  Gemeinsam haben wir 2026 2,5 Milliarden US‑Dollar an internationalen Finanzmitteln
  mobilisiert, um in der Krise im Nahen Osten Unterstützung und somit einen weiteren
  Beitrag zu unserem langfristigen Bekenntnis zu widerstandsfähigeren Ernährungssystemen
  und Düngemittelmärkten zu leisten. Wir nahmen Kenntnis von den schwerwiegenden Folgen
  von Konflikten, Gewalt und Instabilität auf betroffene Länder und Regionen sowie
  auf die regionale und internationale Sicherheit im Allgemeinen, was sich auf die
  Sicherheit der Zivilbevölkerung auswirkt. Dies ist eine Triebkraft für Flucht und
  Vertreibung und irreguläre Migration und hat zur Folge, dass Opfer von Menschenhandel
  akuten Formen von Missbrauch und Ausbeutung ausgesetzt sind. Wir verurteilten anhaltende
  böswillige hybride Aktivitäten von Staaten und nichtstaatlichen Akteuren, die darauf
  abzielen, die Sicherheit und Stabilität von G7 ‑Mitgliedern und Partnerländern durch
  koordinierte und bewusste Kampagnen zu untergraben, auch durch Sabotageakte gegen
  kritische Infrastruktur, böswillige Cyberaktivitäten, ausländische Informationsmanipulation
  und Einflussnahme und die Instrumentalisierung von Migration. Bei solchen Aktivitäten
  besteht die Gefahr von unbeabsichtigten Auswirkungen, Eskalation und Fehlkalkulation.
  Wir bekräftigten unsere Entschlossenheit zu resolutem und koordiniertem Handeln,
  um hybriden Kampagnen entgegenzuwirken, wobei wir alle verfügbaren Instrumente nutzen
  möchten, um diese Aktionen zu verhindern, Abschreckung zu leisten und auf sie zu
  reagieren, unabhängig von ihrem Ursprung, ihrem Umfang und ihrer Intensität. Wir
  betonten, wie wichtig es ist, unsere gemeinsamen Anstrengungen zu verstärken und
  die Arbeit in allen einschlägigen Arbeitsbereichen zu beschleunigen, um die Resilienz
  zu stärken, besser vorbereitet zu sein und kritische Infrastruktur zu schützen.
  Wir äußerten unsere Sorge über die immer raffinierteren Methoden, die Gewaltbereitschaft
  und die Reichweite grenzüberschreitend organisierter krimineller Gruppierungen,
  insbesondere in den Bereichen Drogenhandel, Menschenhandel und Schleusung von Migranten,
  und unterstrichen die Bedeutung internationaler Zusammenarbeit für eine Stärkung
  der maritimen Sicherheit, die Bekämpfung illegaler Schleuser- und Handelsnetze und
  die Zerschlagung dieser Gruppierungen. Wir erkannten ferner an, dass Internet‑Betrug
  eine rapide um sich greifende Form der grenzüberschreitenden organisierten Kriminalität
  darstellt, die Frieden und Sicherheit sowohl auf regionaler als auch auf internationaler
  Ebene bedroht, und betonten, wie wichtig es ist, die Zusammenarbeit, gegebenenfalls
  auch mit der Privatwirtschaft, zu stärken und Betrugsnetzwerke zu zerschlagen, die
  wiederum Verbindungen zu anderen Formen der grenzüberschreitenden organisierten
  Kriminalität aufweisen können. Wir bekräftigten die zwingende Notwendigkeit, im
  Einklang mit dem Völkerrecht und wie im Seerechtsübereinkommen der Vereinten Nationen
  ( SRÜ ) niedergelegt, die maritime Sicherheit und Gefahrenabwehr zu gewährleisten
  und die Freiheit der Schifffahrt weltweit zu schützen, um eine dauerhafte Störung
  der globalen Lieferketten zu verhindern, insbesondere mit Blick auf Energie, Düngemittel
  und Nahrungsmittelprodukte, da sich dies massiv auf vulnerable Volkswirtschaften
  und Bevölkerungsgruppen auswirken kann. Wir erinnerten an die von der EU angestoßene
  globale Verpflichtung “No Fees, No Tolls” vom 12. Oktober 2026 über die Aufrechterhaltung
  der Integrität des internationalen Seerechts. Wir unterstrichen ferner, dass Widerstandsfähigkeit
  und Schutz kritischer Infrastruktur unter Wasser verbessert werden müssen, insbesondere
  bei Energieinfrastruktur und Telekommunikationskabeln und deren Landestationen,
  auch durch Verbesserungen bei internationaler Zusammenarbeit, Informationsaustausch,
  Redundanz und Kapazitäten zur schnellen Reparatur. Wir ermutigten zur praktischen
  Zusammenarbeit mit der Industrie, um im Einklang mit geltendem Völkerrecht und nationalen
  Anforderungen den Zugang zu Reparaturschiffen, Ausrüstung und Ersatzteilen zu verbessern
  und zügige Genehmigungen sowie Hafenzugang für Reparaturarbeiten zu erleichtern.
  Um die praktische Zusammenarbeit zwischen unseren wichtigsten Seehäfen beziehungsweise
  den einschlägigen Behörden zu stärken, haben wir gemeinsam mit Brasilien und der
  Republik Korea das G7 +-Hafennetzwerk zur Bekämpfung des Drogenhandels ( G7 + Ports
  Network to Combat Drug Trafficking ) ins Leben gerufen. Mit diesem Netzwerk sollen
  die operative Zusammenarbeit sowie der Austausch von Informationen und bewährten
  Verfahren verbessert werden, um unsere Häfen vor Drogenhandel zu schützen, und zwar
  in Abstimmung und Kohärenz mit bestehenden Initiativen wie der Europäischen Hafenallianz,
  der Europäischen Koalition gegen Drogen und dem Schiffssicherheitsausschuss sowie
  mit Unterstützung internationaler Organisationen, insbesondere dem Büro der Vereinten
  Nationen für Drogen- und Verbrechensbekämpfung. Wir begrüßten die Arbeit der Mitglieder
  der G7 ++‑Gruppe der Freunde des Golfs von Guinea an der Schaffung von Möglichkeiten
  für eine engere Vernetzung mit der Jaunde-Architektur, um Partnerschaften in den
  Bereichen Aus- und Fortbildung, Kapazitätsaufbau und gemeinsame Einsätze ebenso
  zu stärken wie unsere justizielle Zusammenarbeit mit dem Ziel, die Strafverfolgung
  von auf See festgenommenen Drogenhändlern zu erleichtern. Wir begrüßten die Arbeit
  der Mitglieder der Arbeitsgruppe Schattenflotte der G7 und der Nordic Baltic 8++
  und bekräftigten unsere Entschlossenheit, die Zusammenarbeit der G7 mit Partnern
  zu verbessern, um die globale Schattenflotte, die in illegale, unsichere oder ökologisch
  gefährliche Aktivitäten verstrickt ist, weiter zu zerschlagen und Abschreckung zu
  leisten. Wie erkannten ferner die Notwendigkeit einer Stärkung der Resilienz kritischer
  Satelliteninfrastruktur an, darunter Satelliten, Bodenstationen und Kontrollzentren,
  sowie ihrer terrestrischen Anbindungen und ihrer Energieversorgung. Wir sprachen
  uns für einen besseren Schutz gegen physische und Cyberbedrohungen sowie schädliche
  Einflussnahme und für Redundanz- und Notfallregelungen aus, um grundlegende Dienste
  aufrechtzuerhalten. Mit Blick auf die Unabhängigkeit von Satelliten- und Unterwassernetzen
  sowie von terrestrischen Netzen ermunterten wir zur Zusammenarbeit zwischen zuständigen
  Behörden und Netzbetreibern auf den Gebieten Risikobewertung, rascher und sicherer
  Informationsaustausch bei Vorfällen sowie Notfallübungen. Im Rahmen einer solchen
  Zusammenarbeit sollte die schnelle Wiederherstellung der Dienste gefördert werden,
  auch durch ergänzende Konnektivitätsoptionen für unbedingt erforderliche Kommunikation,
  wobei vertrauliche Informationen zu schützen sind. Wir erkennen die Chancen, die
  Frontier‑Modelle für den Fortschritt der Wissenschaft und die Stärkung unserer Volkswirtschaften
  bieten, stellen aber auch fest, dass die Entwicklung dieser fortschrittlichen Systeme
  und Modelle durch adäquate Sicherungssysteme und eine menschenzentrierte Einführung
  auf sichere und zuverlässige Weise erfolgen muss, wobei zu berücksichtigen ist,
  dass sie auch ein Risiko darstellen können, unter anderem für die Gesellschaft und
  die wirtschaftliche Sicherheit. Wir erkannten an, dass Frontier‑Modelle von staatlichen
  und nichtstaatlichen böswilligen Akteuren missbraucht werden können, auch für böswillige
  Cyberaktivitäten und kriminelle Handlungen oder auch dafür, chemische, biologische,
  radiologische, nukleare oder sprengstoffbezogene Fähigkeiten zu erwerben oder auszubauen.
  Wir erkannten, wie wichtig es ist, die Sicherheit und Resilienz von Frontier‑Modellen
  zu stärken, um Innovation, wirtschaftlichen Wohlstand und die nationale Sicherheit
  voranzubringen. Die Entwicklungen und Themen sind komplex, weswegen es von zentraler
  Bedeutung ist, dass Regierungen, internationale Organisationen, Wirtschaft und Wissenschaft
  miteinander über die Einführung von Modellen ins Gespräch kommen. Wie werden unsere
  Gespräche fortführen, um ein sicheres Innovations‑Ökosystem für den Einsatz vertrauenswürdiger
  Frontier‑Modelle zu fördern, auch durch die Bemühungen, die mit dem KI‑Prozess von
  Hiroshima ihren Anfang genommen haben. Wir bekräftigten unsere gemeinsame Sorge
  über den Einsatz von nicht marktorientierten Strategien und Praktiken und wirtschaftlichem
  Zwang, vor allem im Bereich kritischer Mineralien und der damit zusammenhängenden
  Dual-Use-Güter. Wir werden auf die Stärkung unserer Wettbewerbsfähigkeit und die
  Bekämpfung der Ursachen unserer gemeinsamen Herausforderungen hinarbeiten. Wir bestätigten
  die Bedeutung der Koordinierungsplattform der G7 zu wirtschaftlichem Zwang, wenn
  es darum geht, eine gemeinsame Antwort auf wirtschaftlichen Zwang zu finden und
  die Zusammenarbeit mit Partnern außerhalb der G7 weiter zu fördern. Wir erkannten
  ferner an, wie wichtig es ist, die Wettbewerbsfähigkeit unserer Branchen im Midstream
  - und Downstream ‑Bereich auch mit Blick auf kritische Mineralien durch den Schutz
  kritischer Technologien aufrechtzuerhalten und zu stärken, und bekennen uns dazu,
  zur Abstimmung über Technologiekontrollmaßnahmen innerhalb der G7 und mit Partnern
  zusammenzuarbeiten. In der Erkenntnis, dass die Wertschöpfungsketten kritischer
  Mineralien eine strategische Rolle für den wirtschaftlichen Wohlstand und die Sicherheit
  unserer Länder spielen, sowie im Lichte der hohen Marktkonzentration im Bereich
  der kritischen Mineralien in manchen Volkswirtschaften bekräftigten wir, dass es
  dringend notwendig ist, strategische Abhängigkeiten und Vulnerabilitäten durch eine
  Diversifizierung und Sicherung vertrauenswürdiger Lieferketten zu verringern, um
  unsere kollektive Resilienz zu stärken. In diesem Zusammenhang erkannten wir an,
  wie wichtig die im Rahmen des Gipfeltreffens von Evian angekündigten Maßnahmen sind,
  um die Resilienz und Sicherheit der Lieferketten für kritische Mineralien zu gewährleisten.
  Wir würdigten die Ausweitung der G7 ‑Allianz bezüglich Resilienz und Produktion
  im Bereich kritischer Mineralien, die auf der 2025 unter kanadischem G7 ‑Vorsitz
  ins Leben gerufenen G7 ‑Allianz für die Produktion kritischer Mineralien aufbaut.
  Diese erweiterte Allianz und andere Plattformen bieten ein Forum für eine Zusammenarbeit
  innerhalb der G7 sowie mit Partnerländern mit dem Ziel, Gespräche zu erleichtern,
  datengestützte Entscheidungsprozesse zu unterstützen und die Abstimmung zwischen
  Mitgliedern zu fördern, um die Wertschöpfungsketten kritischer Mineralien stärker
  zu diversifizieren und resilienter zu gestalten.
