title: Bundesregierung stellt die Rohstoffaußenpolitik neu auf - Gemeinsame Pressemitteilung
  des BMWE, AA, BMZ
text: 'Das Bundesministerium für Wirtschaft und Energie ( BMWE ), das Auswärtige Amt
  ( AA ) und das Bundesministerium für wirtschaftliche Zusammenarbeit und Entwicklung
  ( BMZ ) stellen die gemeinsame Rohstoffaußenpolitik strategischer auf. Im Mittelpunkt
  stehen bilaterale Rohstoffpartnerschaften, eine stärkere Verzahnung der Instrumente
  und Akteure und eine engere Einbindung der deutschen Wirtschaft. Bundeswirtschaftsministerin
  Katherina Reiche hat heute im Kabinett dargelegt, wie BMWE , AA und BMZ gemeinsam
  die deutsche Rohstoffaußenpolitik strategischer auf das Ziel der Sicherung der Rohstoffversorgung
  der deutschen Wirtschaft ausrichten. Angesichts bestehender Abhängigkeiten sind
  Diversifizierung und damit eine resilientere Aufstellung der Rohstoffversorgung
  dringend geboten. Im Mittelpunkt der strategischen Neuaufstellung der Rohstoffaußenpolitik
  stehen die Priorisierung starker bilateraler Rohstoffpartnerschaften, eine noch
  bessere Verzahnung vorhandener Instrumente und eine engere Einbindung der Wirtschaft
  – mit dem klaren Ziel, gemeinsam Wertschöpfung zu schaffen und Zugang zu verlässlichen
  Lieferketten aufzubauen. Die strategische Neuausrichtung der Rohstoffaußenpolitik
  richtet sich an drei Schwerpunkten aus: das kohärentere Zusammenwirken der deutschen
  Instrumente und Akteure, die stärkere Priorisierung bestehender Partnerschaften
  anhand der deutschen Rohstoffinteressen und eine engere Einbindung der Wirtschaft.
  Deutschland verfügt bereits über ein weltweites Netzwerk, das die Zusammenarbeit
  im Rohstoffbereich unterstützt. Dazu gehören die deutschen Auslandsvertretungen,
  Auslandshandelskammern, Rohstoffkompetenzzentren, Germany Trade & Invest ( GTAI
  ), die Kreditanstalt für Wiederaufbau ( KfW ), die Bundesanstalt für Geowissenschaften
  und Rohstoffe (BGR) sowie die Deutsche Gesellschaft für Internationale Zusammenarbeit
  ( GIZ ) und weitere Akteure der Entwicklungszusammenarbeit. Diese Akteure sollen
  künftig noch enger zusammenarbeiten. Dafür werden im Ausland zentrale Anlaufstellen
  für Rohstofffragen eingerichtet. Sie koordinieren die deutschen Aktivitäten vor
  Ort und bieten Partnerländern und deutschen Unternehmen einen zentralen Ansprechpartner.
  Außerdem sollen sie Rohstoffprojekte bekannter machen, politische Flankierung vereinfachen
  und die deutsche Wirtschaft dabei unterstützen, Geschäftskontakte auf- und auszubauen.
  Die Bundesregierung priorisiert ihre Zusammenarbeit mit rohstoffreichen Ländern
  künftig noch gezielter anhand der konkreten Bedarfe der deutschen Wirtschaft. Bestehende
  Partnerschaften mit Australien, Brasilien, Chile, Kanada und Südafrika sind dabei
  besonders wichtig und sollen gezielt vertieft werden. Die Strategie nimmt darüber
  hinaus Länder in den Blick, deren Potenzial für die Rohstoffversorgung mittel- oder
  längerfristig erschlossen werden soll. Der Ansatz verbindet den Aufbau unmittelbarer
  Resilienz bereits bestehender Lieferketten mit dem frühzeitigen und strategischen
  Aufbau zukunftsfähiger Partnerschaften. Langfristig tragfähige Rohstoffpartnerschaften
  setzen wirtschaftliches Interesse voraus und beinhalten auch die Unterstützung der
  Partnerländer beim Aufbau lokaler Wertschöpfungsketten, um wirtschaftliche Perspektiven
  vor Ort zu schaffen. Darüber hinaus stärkt Deutschland die Zusammenarbeit mit Ländern,
  die selbst vor allem Rohstoffe nachfragen und das Interesse Deutschlands am Aufbau
  diversifizierter, nachhaltiger und resilienter Lieferketten teilen. Dazu gehört
  auch, langfristige Abnahmeverträge und gemeinsame Finanzierungen zu ermöglichen.
  Bilaterale Rohstoffpartnerschaften dienen der sicheren Rohstoffversorgung der deutschen
  Wirtschaft. Sie orientieren sich an konkreten wirtschaftlichen Bedarfen. Die Bundesregierung
  wird die deutsche Wirtschaft deshalb stärker in die Rohstoffaußenpolitik einbinden,
  ihre Angebote transparenter machen und konkrete Abnahmeinteressen der Industrie
  flankieren. Bundeswirtschaftsministerin Katherina Reiche stellt heraus: Deutschlands
  industrielle Stärke hängt auch davon ab, dass unsere Unternehmen jederzeit Zugang
  zu den Rohstoffen haben, die sie für ihre Produktion brauchen. Deshalb müssen wir
  heimische Rohstoffpotenziale besser nutzen und mehr Rohstoffe durch Recycling zurückgewinnen.
  Zugleich werden internationale Lieferbeziehungen unverzichtbar bleiben. Wir vertiefen
  daher im direkten Austausch mit unseren Partnerländern bestehende Kooperationen
  und erschließen neue Bezugsquellen. Unsere Rohstoffaußenpolitik richten wir konsequenter
  an den konkreten Bedarfen der deutschen Wirtschaft aus. So verringern wir einseitige
  Abhängigkeiten und stärken die Versorgungssicherheit unserer Industrie. Seit dem
  ersten Tag arbeitet diese Bundesregierung daran, dass wir globale Partnerschaften
  ausbauen, um gerade bei der Rohstoffversorgung ein breiteres Fundament zu schaffen.
  Wir dürfen in einer so volatilen Weltlage, in der Rohstoffe und Seewege als Druckmittel
  eingesetzt werden, nicht von Einzelnen abhängig sein. Deshalb stelle ich das Thema
  der Rohstoffsicherheit auf vielen meiner Reisen rund um den Globus ins Zentrum.
  Durch das enge Einbinden der deutschen Wirtschaft wollen wir als Team Deutschland
  weltweit gemeinsam vorangehen, um Wachstum und Resilienz in Deutschland zu stärken.
  All das wird die neue Rohstoffaußenpolitik-Strategie der Bundesregierung nun bündeln
  – für unseren Wohlstand und Sicherheit in Deutschland und in Europa. Bundesentwicklungsministerin
  Reem Alabali Radovan: Eine sichere Rohstoffversorgung braucht verlässliche Partnerschaften.
  Partnerschaften, von denen beide Seiten profitieren. Mit der gemeinsamen Strategie
  nehmen wir auch Länder in den Blick, die mittel- und langfristig wichtige Rohstoffpartner
  werden können. Unsere Entwicklungszusammenarbeit hilft, dafür die Voraussetzungen
  zu schaffen. So stärken wir nachhaltige, vielfältige Lieferketten und schaffen wirtschaftliche
  Perspektiven – in Deutschland und in unseren Partnerländern. Das BMWE wird auf seiner
  Internetseite über bestehende Rohstoffpartnerschaften und Rohstoffkompetenzzentren
  informieren. Eine zentrale Kontaktadresse soll Unternehmen den Zugang zu passenden
  Ansprechpartnern erleichtern.'
