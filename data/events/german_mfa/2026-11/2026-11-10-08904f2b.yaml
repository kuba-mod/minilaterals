title: Grußwort von Staatssekretär Dr. Géza Andreas von Geyr zur Eröffnung des 35.
  Deutsch-Hungarischen Forums in der Europäischen Akademie Berlin
text: 'Ich freue mich sehr - und das ist jetzt nicht nur eine diplomatische Floskel,
  wie man so sagt - ich freue mich auch persönlich wirklich sehr, dass ich heute bei
  diesem Forum sein kann. Sie haben schon darauf hingewiesen: zwei Tage voller deutsch-ungarischer
  Begegnungen. Das sind zwei gute, zwei wichtige Tage für Deutschland, für Ungarn,
  und ich würde sagen auch für Europa! Und dazu möchte ich gerne ein paar Bemerkungen
  machen. Zum einen: diese zwei Tage zeigen, dass wir eine große Nähe haben. Dass
  unsere Wege wieder enger zusammenführen in Politik, Wirtschaft, auch Gesellschaft,
  aber vor allem ist, nach meinem Empfinden, die Atmosphäre wieder besser geworden.
  Sie ist positiver. Und sie ist, und darum geht es mir, zukunftsgerichtet. Das ist
  wichtig. Es geht bei alldem, das ist schon immer wieder zu unterstreichen, eben
  nicht nur um die Menschen in zwei Ländern, sondern es geht um Europa. Das war ja
  auch ein Kern dessen, was der ungarische Ministerpräsident gestern Abend gesagt
  hat. Was bedeutet das? Das bedeutet, dass wir uns einsetzen für Einheit und Vielfalt,
  für Toleranz, für die Suche nach Kompromissen. Und im Kern geht es bei meinem und
  ich hoffe unserem Verständnis von Europa um Freiheit, heute mehr denn je. Warum
  betone ich das hier bei diesem Forum? Europa, Freiheit – das passt natürlich hier
  zum Ort, zur Europäischen Akademie, das passt zur gestrigen Rede des Ministerpräsidenten.
  Es passt zu unserer Geschichte. Darauf hatten Sie hingewiesen. Und es passt vor
  allem zu unserer Zukunft. Unsere Länder sind eng verbunden, denn – es ist viel zur
  Geschichte gesagt worden, deswegen von mir nur eine Bemerkung – ich glaube, die
  Menschen in unseren beiden Ländern, Deutschland und Ungarn, wissen, was Freiheit
  bedeutet. Sie wurde im vergangenen Jahrhundert gewonnen und verloren, ist gerade
  von meinem Land vielen anderen genommen worden. Dann wiedererlang worden. Aber wir
  haben auch erfahren, 1953 hier in Berlin und 1956 in Ungarn, wie das Streben nach
  Freiheit brutal von sowjetischen Panzern niedergemacht worden ist. Und das dürfen
  wir nicht vergessen. Ich betone das deshalb, weil ich glaube, dass es gefährlich
  ist, wenn es Geschichtsvergessenheit gibt. Geschichtsvergessenheit in Europa ist
  besonders gefährlich. Wir sind beide Teil des europäischen Integrationsprozesses.
  Ein Integrationsprozess, der nach dem Zweiten Weltkrieg viel Wohlstand gebracht
  hat auf diesem Kontinent, aber der vor allem Frieden gebracht hat. Frieden und Freiheit.
  Das dürfen wir nicht vergessen. Das ist nicht nur Geschichte, sondern das ist Gegenwart
  und das ist Zukunft. Hier stehen diese beiden Länder für ein Europa in Freiheit.
  Warum erwähne ich das? Weil ich glaube, dass das unser ganz wesentliches gemeinsames
  Interesse ist, heute und für die absehbare Zukunft. Es geht um ein starkes Europa,
  um unsere Freiheit in einem starken Europa, um unsere europäische Freiheit, die
  vielleicht anders ist, als das Freiheitsgefühl in anderen Staaten und auf anderen
  Kontinenten. Es geht um unsere europäische Freiheit. Die müssen wir erhalten, das
  ist unsere Aufgabe in der Politik, das ist unsere Aufgabe im Miteinander der Regierungen
  und ich würde sagen, das ist die Aufgabe von jedem einzelnen von Ihnen, von uns,
  die wir heute hier sind. Wir können und wir müssen alle mitmachen. Ich sage das
  deshalb, weil dieses Europa der Freiheit, ein freiheitliches Europa, unter Druck
  ist. Es ist unter Druck von außen und auch von innen. Wir müssen es gemeinsam schützen
  und stark halten. Auch dabei kommt es auf die Regierungen an, aber es kommt auch
  auf jeden Einzelnen, jede Einzelne von uns an, wie wir uns zueinander verhalten.
  Das betrifft alle Themen, über die gesprochen wird, gestern auch bei Ihrem Jugendforum,
  heute beim Forum, heute wenn die Regierungen zusammen sprechen und auch wenn die
  Staatschefs sich mal wieder treffen werden. Es betrifft sehr konkret alles was wir
  tun. Es betrifft die Außen- und Sicherheitspolitik: beim Beutekrieg Russlands gegen
  die Ukraine und bei alldem wie wir, unsere Länder, uns dazu verhalten, geht es um
  unsere Freiheit auf unserem Kontinent. Und es geht genauso darum, was wir in diesem
  Kontext tun können. Ungarn, Deutschland, und viele andere Europäer. Wir müssen uns
  engagieren, um unserer Freiheit Willen. Das gleiche gilt auch in anderen Bereichen.
  Zurzeit wird über europäische Finanzen diskutiert. In Brüssel, in allen europäischen
  Hauptstädten. Es wird schwer gerungen um die Finanzen für die nächsten Jahre in
  Europa. Da geht es auch darum, wie wir einen fairen Konsens untereinander finden,
  um in unsere Zukunft gemeinsam zu investieren, in unsere Wettbewerbsfähigkeit, die
  auch Bedingung sein wird für unsere Wissenschaftsfähigkeit als Europäer. Unsere
  gemeinsame Wissenschaftsfähigkeit in Europa wird eine wesentliche Bedingung sein
  für die langfristige Freiheit und Sicherheit auf unserem Kontinent. Und das gilt
  auch wieder in einem ganz anderen Bereich im Umgang mit sozialen Medien: In einer
  Zeit, in der die Wahrheit manipulierbar ist wie sie selten vorher war. Da geht es
  um die Frage, wie wir Wahrheit und Lüge sehen, wie wir damit umgehen, wo wir Grenzen
  setzen, wo wir was kontrollieren wollen. Auch da werden wir unseren europäischen
  Weg finden müssen und finden wollen, der vielleicht anders ist, als der Weg auf
  anderen Kontinenten. Auch dabei geht es um die Freiheit unseres Kontinents. Dieses
  Europa der Freiheit, das ist kompliziert, komplex. Es zeigt und beweist aber jeden
  Tag, dass Freiheit und Wohlstand hier bei uns möglich sind, wenn sich alle darum
  kümmern, wenn alle bereit sind beizutragen. Ich glaube, dazu müssen zwei Prinzipien
  in alle Köpfe: Das erste Prinzip, das glaube ich ganz oben steht: Es gab einmal
  einen berühmten Europäer Jean Monet, der gesagt hat, „wenn in Europa einer glaubt,
  dass er mehr sein kann als der zweite, dann ist in Europa der Teufel los“. Ich erwähne
  das deshalb, weil das eben auch heute gilt und auch für morgen. Europa ist eben
  nicht „Brüssel“, Europa – das sind alle europäischen Länder gemeinsam. Das ist die
  Art und Weise wie wir uns zueinander verhalten. Wie wir miteinander umgehen. Auch
  wie Sie beim Forum diskutieren. Das alles ist Europa. Sie prägen Europa mit. Das
  ist nicht nur Brüssel, das sind nicht nur die größten oder wirtschaftlich stärksten
  Staaten. Das zweite Prinzip: Wesenskern dieser europäischen Integration, die ja
  auf den Trümmern des Zweiten Weltkriegs erst gelungen ist, bleibt die ständige Bereitschaft
  aller, zu Kompromissen. Und die ständige Bereitschaft zu Kompromissen heißt: die
  ständige Bereitschaft zur Zusammenarbeit. Anders geht es nicht. Stolze Nationalstaaten
  auf diesem Kontinent, die jahrhundertelang Kriege gegeneinander geführt haben, sind
  ständig bereit zu Kompromissen. Europa, das ist im Grunde eine einzige große Kompromissmaschine
  von stolzen Nationen, die wissen, dass ihre Stärke, ihr Einfluss in der Welt, ihr
  Wohlstand, die Sicherheit, die Freiheit, davon abhängt, dass sie ständig bereit
  sind zur Zusammenarbeit und zu Kompromissen untereinander und das heißt auch mit
  anderen in der Welt. Ich glaube diese Bereitschaft ist ein wesentlicher Charakterzug
  Europas geworden und genau deswegen müssen wir gar keine Bange haben vor der Zukunft
  in einer vielleicht noch globalisierteren Welt, denn wir wissen wie man kompromisshaft
  mit anderen umgeht. Und andere wissen, dass wir Europäer zur Kooperation bereit
  sind. Wir werden andere nicht dominieren wollen. Wir werden zusammenarbeiten wollen.
  Und das können wir. Genau diese beiden Prinzipien machen Europa stark. Das heißt
  wir können stolz sein auf Toleranz, auf Vielfalt von Ideen, die Vielfalt von wissenschaftlichen
  Lösungen, die Vielfalt, die im Wettbewerb der Wirtschaft die besten Lösungen hervorbring,
  und auch die Vielfalt von politischen Ideen und Meinungen. Das alles macht uns zukunftsfähig,
  macht Deutschland, macht Ungarn zukunftsfähig, macht diese Zusammenarbeit zukunftsfähig.
  Ich glaube, die Atmosphäre, und damit komme ich zurück zum Anfang, ist wieder gut
  - nutzen Sie das. Seien Sie gerade als junge Deutsche und Ungarn der Freiheit verbunden,
  seien Sie Europa verbunden.'
