title: 'Kunst trifft Außenpolitik: Das Auswärtige Amt und das Berliner Künstlerprogramm
  des DAAD starten neue Alumni-Residenz im Auswärtigen Amt'
text: 'Im Dachatelier des Auswärtigen Amts in Berlin werden 2026 und 2027 internationale
  Künstlerinnen und Künstler zu Gast sein und sich mit aktuellen außenpolitischen
  Themen auseinandersetzen. Den Auftakt macht seit Ende Oktober die Pulitzer-Preisträgerin
  Susie Ibarra mit einem Aufenthalt zum Thema „Arktis“. Das neue Residenzprogramm
  mit dem Namen „Bureau de Passage“ wird vom Berliner Künstlerprogramm des Deutschen
  Akademischen Austauschdienstes ( DAAD ) umgesetzt. „Außenpolitik braucht frische
  Ideen und Menschen, die ungewöhnliche Fragen stellen. Darum öffnen wir mit unserer
  Alumni-Residenz die Türen des Auswärtigen Amts: für internationale Künstlerinnen
  und Künstler, die Deutschland bereits durch frühere Stipendien und Aufenthalte verbunden
  sind. Wir freuen uns auf den Austausch und neue Impulse aus künstlerischer Perspektive
  für unsere Außenpolitik und die Herausforderungen unserer Zeit,“ so die Staatsministerin
  im Auswärtigen Amt, Serap Güler. „Wir leben in einer Zeit großer geopolitischer
  Veränderungen und Umbrüche. Gerade in einer solchen Zeit sind persönliche Verbindungen
  nach Deutschland an vielen Stellen weltweit von unschätzbarem Wert“, ergänzte DAAD
  -Präsident Prof. Dr. Joybrato Mukherjee. „Mit den Residenzaufenthalten internationaler
  Künstlerinnen und Künstler im Dachatelier des Auswärtigen Amts wollen wir gemeinsam
  mit dem Ministerium deutlich machen, dass Kunst und freier Dialog wichtige Beiträge
  zu einer offenen Gesellschaft leisten können.“ Die US-amerikanische Komponistin
  und Pulitzer-Preisträgerin Susie Ibarra, Alumna des Berliner Künstlerprogramms des
  DAAD , ist die erste Alumna im „Bureau de Passage“. Sie zählt zu den international
  renommierten Klangkünstlerinnen. Ihr Aufenthalt steht unter dem Motto „Arktis“.
  Gemeinsam mit der Glaziologin Michele Koppes hat Ibarra für ihr Projekt „Water Rhythms“
  unter anderem Klänge des grönländischen Inlandeises und von Gletschern im Himalaya
  aufgenommen und künstlerisch verarbeitet. Während ihres Aufenthalts wird Ibarra
  in Austausch mit Mitarbeitenden des Auswärtigen Amts sowie Fachleuten aus Kultur,
  Wissenschaft und Sicherheitspolitik treten. Geplant sind unter anderem Gespräche
  mit Staatssekretär Dr. Bernhard Kotsch und Dr. Florence Gaub, Leiterin der Forschungsabteilung
  des NATO Defense College in Rom und selbst DAAD -Alumna. 2027 werden drei weitere
  Einladungen an herausragende internationale Künstlerinnen und Künstler, die besondere
  Verbindungen zu Deutschland pflegen, erfolgen. Vorgeschlagen werden können ehemalige
  internationale Stipendiatinnen und Stipendiaten deutscher internationaler Residenzprogramme
  und Schutzprogramme, die vom Auswärtigen Amt gefördert wurden. Die Bewerbung erfolgt
  auf Vorschlag der ehemaligen Gastgeber-Institutionen.'
