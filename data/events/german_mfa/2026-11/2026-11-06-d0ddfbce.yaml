title: Außenminister Wadephul vor seiner Abreise nach Warschau
text: 'Vor seiner Abreise nach Warschau erklärte Außenminister Wadephul heute (06.11.2026):
  Es geht um Krieg oder Frieden: Die Zukunft unseres Miteinanders in Europa entscheidet
  sich in der Ukraine. Deshalb muss Europa ein integraler Teil der Lösungsfindung
  in der Ukraine sein. Insbesondere dabei, wie wir Putins imperialer Aggression wirksam
  entgegentreten - und wie wir als Europäer unsere Sicherheitsinteressen verteidigen.
  Dazu erhalten wir unseren Druck auf Moskau aufrecht und schützen uns gemeinsam gegen
  hybride Bedrohungen. Denn auch wir werden längst bedroht, vor allem im Ostseeraum,
  wo Putins Schattenflotten-Tanker Öl-Devisen für Russlands Kriegskasse beschaffen
  sollen und immer wieder Infrastruktur in der Ostsee beschädigen. Deshalb reise ich
  heute nach Warschau, um mit den Außenministerinnen und Außenministern des Ostseerats,
  dem ukrainischen Außenminister und der Hohen Vertreterin der EU zu beraten. Als
  Partner im Ostseerat, aber auch in der EU und der NATO , gilt für uns ein unumstößlicher
  Grundsatz: Über die Zukunft der Ukraine darf nicht ohne die Ukraine entschieden
  werden. Und über die Sicherheit Europas nicht ohne Europa. Das ist der Maßstab für
  alle Bemühungen, die wir für ein Ende des russischen Angriffskriegs anstrengen und
  der Grund, warum Europa hier eine zentrale Rolle zukommen muss. Auch die Ergebnisse
  der US-Zwischenwahlen verdeutlichen, wie wichtig es ist, dass wir die Ukraine weiter
  mit der nötigen Ausdauer unterstützen. Nur dadurch wird es möglich sein, eine dauerhafte
  Friedenslösung für die Ukraine und Sicherheit für Europa zu erreichen. Darum gilt
  es, dass wir als transatlantisches Bündnis, als Europäer und Amerikaner, gemeinsam
  und geschlossen gegenüber Russland auftreten. Dafür stehen wir weiter im engen Schulterschluss
  mit der US-Regierung ebenso wie mit dem US-Kongress, wo die transatlantische Partnerschaft
  ein einigendes Element zwischen den Parteien ist. Dies habe ich bei meinen Gesprächen
  in Washington immer wieder erfahren. Unsere Unterstützung für die Ukraine muss gerade
  jetzt – vor dem fünften Kriegswinter – dort ankommen, wo sie Leben schützt: Bei
  der Energieversorgung, der Wärmeversorgung und als humanitäre Hilfe. Deutschland
  hat dafür noch einmal weitere 200 Millionen Euro zugesagt. Die Ukraine wird diese
  weitere Zerreißprobe kraft ihrer eigenen Widerstandsfähigkeit und mit unserer Unterstützung
  überstehen. Russland wird hingegen scheitern, wenn es weiter die brutale Eskalation
  gegen die Ukraine sucht. Die Sicherheit in Europa wird längst auch jenseits der
  ukrainischen Frontlinie auf die Probe gestellt. Das zeigen zuletzt auch ungeklärte
  Bombendrohungen gegen Flugzeuge in Europa, Cyberangriffe auf Lebensmittelmärkte
  und Drohnenvorfälle zu Land und auf See. Wir nehmen diese Bedrohungen sehr ernst
  und reagieren darauf. Denn sie zielen darauf, uns als Gesellschaft zu verunsichern,
  das Vertrauen in unsere Institutionen zu erschüttern – und dass wir Maß und Mitte
  verlieren. Auch das wird nicht gelingen, denn wir halten zusammen, im Ostseerat,
  in der EU und in der NATO .'
