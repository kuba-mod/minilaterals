title: Rede von Außenminister Johann Wadephul zur Verleihung des Shimon Peres-Preises
  im Roten Rathaus
text: 'Vor gut einem Monat habe ich ein Video auf einem meiner Social-Media-Kanäle
  gepostet. Normalerweise versuchen wir dort immer, Außenpolitik mit einem Augenzwinkern
  zu erklären und für Diplomatie zu werben. Es ging um die Erinnerung an den 7. Oktober
  2023. Um diese Zäsur in der Geschichte Israels. Ich wollte an diejenigen erinnern,
  die die Hamas an diesem Tag ermordet hat. Grausam geschändet hat. Meine Solidarität
  mit denen bekunden, die die Hamas an diesem Tag in eine unmenschliche Geiselhaft
  verschleppt hat. Die für einige bis zu 738 Tage andauerte. Die viele von ihnen mit
  dem Leben bezahlten. Ein Zeichen des Mitgefühls und der Verbundenheit mit den Angehörigen
  all dieser Opfer. Weil das Leben, das die Hamas auslöschen wollte, nicht vergessen
  werden darf. Mein Video war keine zwei Stunden online. Dann mussten wir die Kommentarfunktion
  abschalten. Weil das, was dort in den Kommentaren – die ja auf Dialog angelegt sind!
  – gesagt und geschrieben wurde, nicht auf irgendeine Diskussion zielte. Oder in
  irgendeiner Weise auf eine vernünftige Antwort hin angelegt war. Ich bin sicher,
  dass viele von Ihnen sehr genau wissen, wovon ich spreche. Dass viele von Ihnen
  eigene Begegnungen mit diesem Hass erfahren haben. Der lauter und lauter schreit,
  um jeden Dialog im Keim zu ersticken. Und ja, auch ich denke: Es hat sich etwas
  verschoben in unserem Land. Der Hass wird lauter – und er wird offen und schamlos
  herausgebrüllt: auf den Straßen, im Internet, an den Stammtischen und in den Salonkneipen.
  Einer der Gründe, warum wir uns heute hier treffen, ist, dass wir uns damit nicht
  abfinden wollen. Weil wir wissen: Ohne Dialog gibt es keinen Frieden. Ich habe in
  Vorbereitung auf diesen Termin ein wenig in der Biografie von Shimon Peres geblättert.
  Für den das Gefühl dieser Eigen-Verantwortung ja ein Lebensthema war. Ein Leitmotiv
  sozusagen. Er schildert in seinen Erinnerungen eine Szene aus dem Jahr 2007. Mit
  83 Jahren wurden er als Präsident des Staates Israel vereidigt, da hatte er ja schon
  eine erfüllte Karriere, er war damals Außenminister, hinter sich. Während der Feierlichkeiten
  sprach ihn ein junger Mann an. „Herr Präsident! Bei allem Respekt! Warum wollen
  Sie nach einer so langen Karriere in Ihrem Alter noch weiterarbeiten?“ Peres entgegnete:
  „Warum ich meinem Land weiter dienen will? Etwas anderes kam für mich nie in Frage!“
  Etwas anderes kam für ihn nie in Frage. Der Dienst an seinem Land, der Dienst an
  einem Leben in Frieden, an einem Leben für den Ausgleich, stand für ihn über allem.
  Und das war keine Frage des persönlichen Ehrgeizes oder der Eitelkeit. Das sich
  aus dem Gefühl des Verantwortungs-Bewusstseins für das „Wir“, für die Gemeinschaft
  speist. Dass viele diesem Gefühl folgen, ganz besonders die junge Generation, das
  hat Peres sich immer gewünscht. Dass dieser Wille zum Dienst an der Gesellschaft
  besteht, auch und gerade, wenn das nicht immer ganz einfach ist. Er hat diese Einstellung,
  seinen Anspruch an sich selbst, ganz gut auf einen Punkt gebracht, wie ich finde.
  „Wir brauchen Führungsgestalten, die lieber aus den richtigen Gründen umstritten
  sein wollen, als aus den falschen Gründen beliebt.“ ich habe den alarmierenden Eindruck,
  dass heute jeder und jede Deutsche, der angesichts des grassierenden und unsäglichen
  Antisemitismus an unsere besondere Verantwortung gegenüber Juden oder auch gegenüber
  Israel appelliert, schnell als „umstritten“ gilt. Wohingegen diejenigen, die sich
  dem Hass gegen Judentum verschreiben, nicht mehr nur auf zustimmendes Raunen, sondern
  zunehmend auf Applaus verlassen können. Auch wenn er sich als Ablehnung von Zionismus
  und der Regierung und des Staates Israel tarnt. Wobei ich sage: Selbstverständlich
  ist auch in Deutschland Kritik an der Politik der jeweiligen Regierung des Staates
  Israel erlaubt. Das ist in einer freien Gesellschaft, in einer offenen Demokratie
  und auch unter engsten Freunden und Partnern selbstverständlich. Was wir jedoch
  niemals akzeptieren dürfen, wo wir immer aufstehen müssen, ist, wenn die Existenz
  des Staates Israel in Frage gestellt wird. Sie, die Existenz dieses Staates – und
  es gibt es Existenzrecht von Staaten – und die Sicherheit des Staates Israel als
  jüdischer und als demokratischer Staat, sind das Fundament deutscher Politik. Antisemitismus
  oder blanker Israelhass dürfen hier keinen Platz haben. Und dass ich so etwas 2026
  betonen muss, hier in unserer Hauptstadt, erfüllt mich auch mit Scham. Wie können
  wir akzeptieren, dass Menschen ihre jüdische Identität nicht mehr in der Öffentlichkeit
  zeigen können? Wie können wir akzeptieren, dass sich Judenhass nahezu ungezügelt
  Bahn brechen kann? Was sagt das über den Zustand unserer Demokratie aus, wenn wir
  nicht in der Lage sind, unsere religiösen oder ethnischen Gemeinschaften zu schützen?
  Ich als Außenminister der Bundesrepublik Deutschland, als Mitglied des Deutschen
  Bundestags und ja, auch als deutscher Staatsbürger bin verpflichtet: Auf unsere
  Verantwortung gegenüber Israel und dem jüdischen Leben in Deutschland. der menschenverachtende
  Terrorangriff der Hamas war eine tiefe Zäsur, ich sagte es bereits. Wir dürfen nicht
  zulassen, dass diese Verbrechen in Vergessenheit geraten oder relativiert werden.
  Wir müssen eben auch verstehen, dass dieser Tag und das weltweite Aufflammen von
  Antisemitismus danach für Israel bis heute ein Trauma ist und nachwirkt. Bei jedem
  täglichen Blick in die Nachrichten in Richtung Iran, in Richtung Hisbollah, in Richtung
  Jemen und verbunden mit der Frage, wann das Gefühl der Bedrohung jemals enden wird.
  Und natürlich lassen wir den Blick nicht dort enden. Die Hamas hat Israel einen
  Krieg aufgezwungen. Dieser hat auch der palästinensischen Zivilbevölkerung immenses
  Leid gebracht. Das ist real, und das dürfen wir auch nicht akzeptieren. Beides gehört
  zur Wirklichkeit dieses Konflikts: Israels Recht, sich gegen den Terror der Hamas
  zu verteidigen. Und Israels Pflicht, die palästinensische Zivilbevölkerung zu schützen
  und das humanitäre Völkerrecht zu achten, im Gaza-Streifen wie auch im Westjordanland.
  Ich sage das so deutlich, weil am Ende nur der Mut zu Frieden und Versöhnung – von
  beiden Seiten – die Sicherheit Israels garantieren wird. Echter Friede braucht Sicherheit,
  aber Sicherheit braucht auch Verständnis, Empathie und immer auch Vertrauen. Ich
  habe daher auch ganz konkrete Wünsche und Hoffnungen für Israel. Wir wollen hoffen,
  wir hoffen, dass Israel endlich als ein sicheres, nicht mehr bedrohtes Land in einer
  Region existieren kann, in der alle Menschen der Region in Sicherheit und Würde
  leben können. Dass Israel im Frieden mit seinen Nachbarn leben kann. Dass es völlig
  normal für junge Israelinnen und Israelis wird, in den Nachbarstaaten zu leben,
  zu arbeiten oder diese zu bereisen. Planungen und Ideen für so etwas existieren
  ja. Und es waren wir Deutsche, die den ersten offiziellen Jugendaustausch zwischen
  Israel, Bahrain und eben auch Berlin organisiert haben. Dieser Weg der Normalisierung
  und des Austauschs ist der einzig richtige und im Übrigen auch der einzige, um den
  Konflikt in der Region dauerhaft zu befrieden. Und für den Konflikt mit den Palästinensern
  kann dies nach meiner festen Überzeugung nur über eine ausgehandelte Zwei-Staaten-Lösung
  führen. Nur eine solche schützt die Existenz von Israel als jüdischer und demokratischer
  Staat und wahrt die Rechte der Palästinenserinnen und Palästinenser. Zur verhandelten
  Zwei-Staaten Lösung sehe ich keine überzeugende Alternative. Deswegen setzen wir
  uns auch unerschütterlich dafür ein. Dazu gehört auch, dass die realen Bedingungen
  für eine verhandelte Zwei-Staaten-Lösung erhalten bleiben. Ich weiß auch, wir alle
  wissen, dass dies kein einfacher Weg ist, und dass das Thema nicht gerade im Zentrum
  der laufenden Koalitionsgespräche in Israel steht. Aber gerade deshalb braucht es
  mutige Menschen, die bereit sind, diesen Weg zu gehen. Die den Dialog aufrechterhalten.
  Die Verständigung suchen. Die Vorschläge für Frieden anbieten. So wie die Preisträger
  heute. Die genau darin ihre Verantwortung für die Gesellschaft sehen, im Geiste
  dessen, was Shimon Peres darunter verstand: Die Eigen-Verantwortung für die Gesellschaft
  – weil etwas anderes nicht in Frage kommt. Und dass man nicht Shimon Peres sein
  muss, um diesem Gefühl zu folgen, das sehen wir ja auch heute Abend. Wenn wir gleich
  Preisträger in seinem Namen ehren. Junge Menschen. Sie zeigen, dass Verantwortung
  keine Frage des Alters ist. Dass es nicht erst ein politisches Amt oder eine besondere
  gesellschaftliche Stellung braucht, um etwas zu bewegen. Verantwortung ist nichts,
  was wir einmal erklären und dann zu den Akten legen. Sie muss sich immer wieder
  bewähren. Im Alltag, auf den Straßen, in der politischen Gemeinschaft, und insbesondere
  in den Parlamenten. Der Stadt, wo es seit Jahrhunderten jüdisches Leben und Kultur
  gibt, das jetzt nicht gezwungen sein darf, sich zu verstecken.'
