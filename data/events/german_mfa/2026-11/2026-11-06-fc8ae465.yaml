title: Erklärung zur Urteilsverkündung gegen Joshua Wong
text: Gemeinsame Erklärung der Außenministerien von Australien, Deutschland, Frankreich,
  Italien, Japan, Kanada, Neuseeland, den Niederlanden, dem Vereinigten Königreich
  und den Vereinigten Staaten von Amerika Joshua Wong wurde in einem weiteren Anklagepunkt
  nach dem von Sicherheitsgesetz (NSL) zu zehn Jahren Haft verurteilt, nur wenige
  Monate, nachdem führende Kräfte der Hongkong-Allianz auf derselben Rechtsgrundlage
  schuldig gesprochen worden waren. Hier zeigt sich einmal mehr, wie das NSL dazu
  eingesetzt wird, Personen aufgrund ihrer politischen Meinungsäußerung und Teilhabe
  ins Visier zu nehmen. Wir fordern die unverzügliche Einstellung aller unberechtigten
  Strafverfahren gegen nach dem NSL angeklagte Personen und rufen die Behörden in
  China und Hongkong mit Nachdruck dazu auf, ihren internationalen Verpflichtungen
  nachzukommen und die Rechte und Freiheiten zu achten, die der Bevölkerung Hongkongs
  nach der Gemeinsamen Britisch-Chinesischen Erklärung von 1984 gewährt werden.
