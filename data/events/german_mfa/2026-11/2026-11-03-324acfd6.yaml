title: Rede von Außenminister Wadephul bei der 5. Kiel-CEPR-Konferenz zu Geoökonomie
text: 'Mehr als 50 Millionen verkaufte Exemplare, in mehr als 100 Länder exportiert
  – die die meisten in die Vereinigten Staaten. Fünf Rohstoffe, ein Ziel: Beim Brettspiel
  CATAN, einem der kulturellen Exportschlager Deutschlands, wird um Lehm, Holz, Wolle,
  Getreide und Erz gespielt. Die Spieler kämpfen um Rohstoffe, die über Sieg oder
  Niederlage entscheiden. Vielleicht möchten Sie am kommenden Samstagabend mit Freunden
  und Familie einen schönen altmodischen Handelskrieg genießen? CATAN ist eine Welt,
  in der Monopole und Abhängigkeiten zugunsten des Wachstums und des eigenen Vorteils
  schamlos ausgenutzt werden. Natürlich gibt es einen Unterschied zwischen einem Brettspiel
  und der echten Welt, in der sich die meisten Staaten an transparente Regeln halten.
  In CATAN stehen eine Handvoll Rohstoffe und möglicherweise ein paar Freundschaften
  auf dem Spiel. In der echten Welt geht es um Wohlstand und strategische Autonomie
  sowie im Endeffekt um unsere Fähigkeit, unsere eigene Zukunft zu gestalten. Die
  zugrunde liegende Dynamik aber gleicht sich auf erstaunliche Weise: Es kommt auf
  Zugang zu Rohstoffen an. Handel eröffnet Möglichkeiten, kann aber auch Abhängigkeiten
  schaffen. Und diese Abhängigkeiten können zu Werkzeugen der Macht werden. Bis vor
  wenigen Jahren betrachtete und betrieb man Wirtschaftspolitik in Deutschland zumeist
  isoliert von Außen- und Sicherheitspolitik. Wir sehen ganz klar: Unsere Partner,
  Wettbewerber und Rivalen denken und handeln immer stärker transaktionsbezogen. Wir
  erleben auch, dass wirtschaftliche Abhängigkeiten politisch instrumentalisiert werden.
  Das globale Handelssystem bricht zunehmend auseinander. Regeln, die allen nutzen
  sollten, werden unterminiert. Die Bedingungen, unter denen wir agieren, haben sich
  in den vergangenen Jahren grundlegend verändert. Dass der Teaser für diese Konferenz
  sich auf ein wachsendes Gefühl der Unsicherheit beruft, ist kein Zufall. Was also
  braucht es, um die zunehmenden geopolitischen Herausforderungen zu bewältigen, sei
  es in CATAN oder in der echten Welt? Strategisches Denken auf jeden Fall – gespeist
  von vielen der heute hier anwesenden Fachleute. Aber vor allem braucht es Diplomatie
  – das Schmieden strategischer Partnerschaften, das Aushandeln von Handelsvereinbarungen
  und die Gewährleistung des Zugangs zu kritischen Rohstoffen unter Ausgleich widersprüchlicher
  Interessen. Denn in einer global vernetzten Welt ist Wirtschaftswachstum untrennbar
  mit Diplomatie verbunden. Sicherheit, Freiheit und Wohlstand gehören zusammen. Ein
  Beispiel, das auf der Hand liegt, sind unsere unermüdlichen europäischen Anstrengungen,
  die Ukraine militärisch und wirtschaftlich zu unterstützen und dabei Russlands Einnahmen
  zu verringern, mit denen es seinen völkerrechtswidrigen Angriffskrieg finanziert.
  Dazu gehören Sanktionen ebenso wie die Diversifizierung der Energiequellen. Entscheidend
  ist wirtschaftliche und diplomatische Staatskunst. Deswegen haben wir eine neue
  Abteilung eingerichtet, die EU -Politik mit Geoökonomie verbindet. Sie arbeitet
  national eng mit den einschlägigen Einrichtungen des Bundes zusammen, pflegt gute
  Beziehungen zur Europäischen Kommission und trägt zur Erarbeitung von Strategien
  bei, die das wirtschaftspolitische Instrumentarium Europas stärken. Als Auswärtiges
  Amt insgesamt nehmen wir eine bereichsübergreifende Perspektive ein. Sie führt Wettbewerbsfähigkeit,
  De-Risking, die Diversifizierung von Partnerschaften und den Schutz wichtiger Industriezweige,
  die aufgrund unfairer Handelspraktiken unter Druck geraten sind, zusammen. Wir stehen
  im Austausch mit allen Interessenträgern und behalten dabei die Belange unserer
  engsten Partner fest im Blick. Wir treten ein für eine strategische Industriepolitik,
  die industrielle Schlüsselbereiche wirksam unterstützt, ohne die EU zu isolieren
  oder ihre Märkte abzuschotten. In der Praxis ist dieser Ausgleich oft schwierig.
  Entscheidend dafür, dass er dennoch gelingt, sind unsere 250 Botschaften und Auslandsvertretungen.
  Sie vertreten die wirtschaftlichen Interessen unseres Landes. Im Wege der Diplomatie
  bauen wir Handelsbeziehungen auf und unterstützen deutsche Unternehmen überall auf
  der Welt. Wir sind dafür da, den deutschen Interessen zu dienen, und dazu gehören
  auch unsere wirtschaftlichen Interessen im Ausland. Unsere diplomatischen Vertretungen
  stellen wertvolle lokale Netzwerke bereit. Weltweit unterstützen sie deutsche Unternehmen
  und helfen bei der Suche nach Projekten, die wirksam zum De-Risking, beispielsweise
  im Bereich kritischer Mineralien, beitragen. Darüber hinaus weitet die Bundesregierung
  ihr Engagement zugunsten resilienter Lieferketten für kritische Mineralien auch
  durch entsprechende diplomatische Anstrengungen aus. Ein neuer, aber wesentlicher
  Aspekt unserer Wirtschaftsdiplomatie ist die sogenannte Techplomacy. Mithilfe der
  Techplomacy bauen wir strategische Partnerschaften auf, bringen Deutschlands Stärken
  in globalen KI-Lieferketten zum Tragen und verbessern unsere Fähigkeit, die globale
  Technologieordnung mitzugestalten. Meine Damen und Herren, wir benötigen eine verbesserte
  Zusammenarbeit mit neuen Partnern. Dazu brauchen wir eine aktivere Wirtschaftsdiplomatie,
  wozu offizielle Besuche in Begleitung von Delegationen der deutschen Wirtschaft
  gehören. Und ich kann Ihnen sagen, diese Delegationen werden überall auf der Welt
  herzlich empfangen. Unsere Besuche helfen, Herzen und Türen zu öffnen, und sie schaffen
  neue Möglichkeiten. Darüber hinaus unterstützen wir die Freihandelsagenda der EU
  , auch durch neue Handelsinitiativen wie die von Bundeskanzler Merz während seiner
  jüngsten Besuche bei Partnerländern in Asien angekündigten. Neue Horizonte allein
  werden jedoch nicht ausreichen. Wir erleben gerade eine massive, mit nicht nachhaltigen
  globalen Ungleichgewichten einhergehende industrielle Transformation, die das europäische
  Wirtschaftsmodell erschüttert. Diese Transformation hat viele Ursachen, darunter
  nicht marktorientierte Praktiken und Strategien und eine intransparente Geldpolitik.
  Gemeinsam mit Frankreich sprechen wir uns für eine substanzielle Erweiterung des
  geoökonomischen Instrumentariums der EU aus. Wahrscheinlich haben sich viele von
  Ihnen bereits mit unserem gemeinsamen Vorschlag vertraut gemacht. Das Weißbuch ist
  ein wichtiger und weitreichender Schritt, durch den die Debatte in Brüssel auf einer
  ganz neuen Ebene geführt wird. Es erfährt von vielen unserer anderen EU -Partner
  große Wertschätzung. Auf die Stärkung unserer wirtschaftlichen Souveränität kommt
  es an. Das Wirtschaftsmodell der Vergangenheit genügt dem veränderten geopolitischen
  und geoökonomischen Umfeld nicht mehr. Die Europäische Kommission verfolgt ganz
  zurecht den Ansatz “Promote, Protect, Partner” . Wir unterstützen diesen Ansatz
  und müssen dafür sorgen, dass wir alle drei seiner Säulen gleichermaßen stärken.
  die Welt ist komplexer als ein Brettspiel aus den Neunzigern, und deutlich weniger
  berechenbar. Aber sowohl bei CATAN als auch im wahren Leben hängt der Erfolg davon
  ab, dass man Beziehungen aufbaut, Deals aushandelt und weiß, wann man miteinander
  anstatt gegeneinander arbeiten sollte.'
