title: Gemeinsame Erklärung der Bundesrepublik Deutschland und des Königreichs Tonga
  anlässlich des offiziellen Besuchs Seiner Majestät König Tupou VI in der Bundesrepublik
  Deutschland
text: 'Die Bundesrepublik Deutschland und das Königreich Tonga (im Folgenden als „Deutschland“
  und „Tonga“ bezeichnet) erkennen die tiefe, historisch gewachsene Verbundenheit
  ihrer beiden Nationen an, die ihre Wurzeln im Freundschaftsvertrag vom 1. November
  1876 hat und durch den am 2. Januar 1978 in Kraft getretenen Vertrag über freundschaftliche
  Beziehungen und Zusammenarbeit weiter gefestigt wurde. Sie feiern den 150. Jahrestag
  des Freundschaftsvertrags sowie 50 Jahre diplomatischer Beziehungen und erkennen
  diese Vereinbarungen als beständige Symbole der unverbrüchlichen Partnerschaft zwischen
  Deutschland und Tonga an. Sie sind davon überzeugt, dass die Herausforderungen des
  21. Jahrhunderts, allen voran die Klima- und Biodiversitätskrise und die Notwendigkeit
  einer regelbasierten internationalen Ordnung, eine verstärkte bilaterale und multilaterale
  Zusammenarbeit erfordern, die auf einer gemeinsamen Vision und der Abstimmung strategischer
  Interessen beruht. Sie erkennen ferner an, dass eine solche Zusammenarbeit ihre
  Wirkung am besten entfaltet, wenn Partner gemeinsame Ziele verfolgen und sich zu
  einer nachhaltigen und sicheren Zukunft des Planeten bekennen. Deutschland und Tonga
  betonen ihren gemeinsamen politischen Willen, ihre Zusammenarbeit auszubauen, und
  verleihen ihrer gemeinsamen Auffassung zu folgenden Fragen Ausdruck: Stärkung der
  bilateralen Beziehungen und des kulturellen Austauschs Deutschland und Tonga haben
  das Ziel, ihre politischen, wirtschaftlichen und kulturellen Beziehungen zu intensivieren.
  Dies schließt Folgendes ein: Engagement in der Pazifikregion und im Forum der pazifischen
  Inseln (PIF) Deutschland würdigt die zentrale Rolle des Forums der pazifischen Inseln
  (PIF) bei der Gewährleistung von Sicherheit und Wohlstand in der Region und erachtet
  die Ernennung zum Strategischen Partner des PIF als eine Ehre und wichtigen Ausdruck
  des gegenseitigen Vertrauens, wodurch Deutschland bestärkt wird, sein Engagement
  in der Region zu intensivieren und sich substantiell für die prioritären Ziele der
  2050-Strategie für den Blauen Pazifischen Kontinent einzusetzen. Klimaschutz und
  die Pazifische Resilienzfazilität (PRF) Deutschland und Tonga erkennen an, dass
  der Klimawandel und der Anstieg des Meeresspiegels für Tonga und andere kleine Inselstaaten,
  die Entwicklungsländer sind, eine existenzielle Bedrohung darstellen. Zusammenarbeit
  innerhalb der Vereinten Nationen und internationale Ordnungspolitik Deutschland
  und Tonga erneuern ihr Bekenntnis zur regelbasierten internationalen Ordnung, den
  Zwecken, Regeln und Grundsätzen der Charta der Vereinten Nationen ( VN ) und einem
  wirkungsvollen Multilateralismus.'
