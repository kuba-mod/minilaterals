title: Bundesregierung stellt weitere Mittel für Ukraine-Winterhilfe bereit
text: '-- Gemeinsame Pressemitteilung des Auswärtigen Amts und des Bundesministeriums
  für wirtschaftliche Zusammenarbeit und Entwicklung -- Russland setzt weiter auf
  Eskalation - und scheut sich dabei nicht, den Winter abermals als Waffe gegen Zivilistinnen
  und Zivilisten in der Ukraine einzusetzen. Seit geraumer Zeit intensiviert Russland
  drastisch seine Angriffe auf ukrainische Städte, Energie-, Wasser-, Transport- und
  Logistikinfrastruktur. Die Stromversorgung in der Ukraine ist täglich unterbrochen,
  die Wasserversorgung beeinträchtigt. Gleichzeitig dehnt Russland die Frontzone durch
  den Einsatz von Drohnen mit höherer Reichweite aus, immer mehr Menschen müssen aus
  ihren Wohnorten fliehen. Vor dem anbrechenden Winter braucht die Ukraine dringend
  weitere Unterstützung, um die Menschen mit dem Nötigsten zu versorgen und die Energie-
  und Wasserversorgung aufrechtzuerhalten. Das Auswärtige Amt und das Bundesministerium
  für wirtschaftliche Zusammenarbeit und Entwicklung stellen deswegen kurzfristig
  zusätzliche Mittel in Höhe von insgesamt 200 Millionen Euro für die Winterhilfe
  bereit. Der Haushaltsausschuss des Bundestages hat dafür heute den Weg freigemacht.
  In der Ukraine entscheidet sich, ob es gelingt, die Sicherheitsordnung in Europa
  wiederherzustellen und zum Frieden zurückzufinden. Russlands gezielte Angriffe auf
  die zivile Infrastruktur der Ukraine lassen nur einen Schluss zu: Statt jetzt endlich
  auf ernsthafte Verhandlungen zu setzen, wähnt Moskau die Winterkälte auf seiner
  Seite. Um die Ukrainerinnen und Ukrainer im fünften Kriegswinter in die Knie zu
  zwingen, ist Russland dabei jedes Mittel recht: Wärme-, Wasser- und Energieinfrastruktur
  werden immer gezielter angegriffen. Dieses Kalkül wird scheitern, denn Putin unterschätzt
  weiter die Widerstandskraft der Ukraine und ihrer Partner. In dieser akuten Notlage
  leistet das Auswärtige Amt noch mehr dringend benötigte humanitäre Hilfe. Wir unterstützen
  Familien in Not, sichern den überlebensnotwendigen Zugang zu Wärme und Trinkwasser
  und helfen, die medizinische Versorgung aufrechtzuerhalten. Unsere Botschaft ist
  klar: Wir stehen der Ukraine zur Seite und stärken sie – solange es nötig ist. Bundesentwicklungsministerin
  Reem Alabali Radovan: Keine tausend Kilometer von Deutschland entfernt werden Schulen,
  Hilfsgüter und die Energieversorgung zerstört. Menschen kommen bei Angriffen ums
  Leben. Millionen Menschen frieren wegen gezielter Angriffe auf die Stromversorgung.
  Aus vielen Wasserleitungen kommt kein Tropfen. Russland will die Ukraine unbewohnbar
  machen. Damit darf Putin keinen Erfolg haben. Während der Krieg Kälte, Tod und Angst
  bringt, helfen wir mit Wärme und Strom. Unsere Unterstützung ist ein Zeichen der
  Solidarität, aber auch ein Beitrag zur Sicherheit in Europa – und sie hilft, dass
  die Ukrainerinnen und Ukrainer weiter in ihrem Land leben können. Dieser Krieg und
  dieses Leid müssen enden. Ein Energiewaffenstillstand wäre ein erster Schritt. Die
  Ukraine behauptet sich mit fortgesetzter Widerstandskraft gegen den russischen Angriffskrieg,
  allein dadurch kann die Ukraine über einen gerechten und dauerhaften Frieden verhandeln.
  Die Winterhilfe der Bundesregierung leistet einen Beitrag dazu, die staatliche Handlungsfähigkeit,
  wirtschaftliche Funktionsfähigkeit und gesellschaftliche Widerstandskraft der Ukraine
  bei der Abwehr der russischen Aggression dauerhaft zu stärken. So werden mit Mitteln
  für den Krisentitel des BMZ Maßnahmen zur Strom-, Wärme- und Wasserversorgung finanziert,
  für Schulen und Kindergärten, in der Landwirtschaft und im Katastrophenschutz. Das
  Auswärtige Amt leistet humanitäre Hilfe und unterstützt damit vor allem Menschen
  in frontnahen Gebieten, Binnenvertriebene und Geflüchtete in direkten Nachbarländern
  wie der Republik Moldau. Außerdem wird die Wintervorbereitung in Städten gefördert,
  mit besonderem Fokus auf Wasser-, Sanitär- und Gesundheitsversorgung.'
