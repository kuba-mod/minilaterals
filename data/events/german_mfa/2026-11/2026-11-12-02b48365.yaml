date: '2026-11-12'
type: press_release
source_name: german_mfa
title: Key Note von Staatssekretär Dr. Géza Andreas von Geyr beim „NATO Talk“ der
  Deutsch-Atlantischen Gesellschaft in Berlin
text: 'Ich freue mich sehr hier zu sein. 70 Jahre Deutsch-Atlantische Gesellschaft,
  sie ist 70 Jahre jung - und ich darf vielleicht dazu sagen, dass die Gegebenheiten
  in der Welt die Gesellschaft weiterhin jung und engagiert halten werden. Der Titel
  der heutigen Konferenz lautet „zwischen Westalgie und Vision“, Sie haben darauf
  bereits angespielt. Ich werde versuchen, Ihnen einen sehr realistischen Blick auf
  das zu vermitteln, was das Transatlantische in unserem täglichen Tun bedeutet. Ich
  werde dabei ein paar strategische Bemerkungen machen, aber ich werde auch versuchen,
  so konkret wie möglich zu sein und zu zeigen, wo wir stehen und wo sich das Transatlantische
  hinbewegt. Und ich werde auch viel über Interessen sprechen. Diese Bundesregierung
  hat sich ja verpflichtet, eine Interessen-geleitete Außen- und Sicherheitspolitik
  zu verfolgen. Deswegen werde ich immer wieder auf Interessen zurückkommen und versuchen,
  nicht nur die deutschen oder europäischen, sondern auch die amerikanischen Interessen
  - so wie ich sie verstehe und so wie sie sich eben im täglichen Tun darstellen -
  aufzuzeigen. Vielleicht vorneweg meine Sicht auf das Transatlantische, damit Sie
  sehen, worauf ich raus will. Es sind zwei Bemerkungen, die ich dazu mache: Die eine
  zu den Vereinigten Staaten: Ich war bewegt, und erstaunt, als ich zum ersten Mal
  auf dem Campus in Stanford war und die Flagge der Universität gesehen habe, die
  auf Deutsch den Titel trägt: „Der Wind der Freiheit weht“. Ich sage das deshalb,
  weil ich mir sehr wünsche und sehr zuversichtlich bin, dass genau das die Rolle
  der Vereinigten Staaten bleibt. Meine zweite Bemerkung greift zurück auf viele Gespräche,
  die wir in den letzten anderthalb Jahren hatten, bei uns im Auswärtigen Amt, auch
  mit anderen Ressorts. Weil wir eben eine Interessen- geleitete Außen- und Sicherheitspolitik
  verfolgen wollen. Was ist denn dabei der Kern des Kerns? Was ist denn das eine ganz
  zentrale Interesse, was wir verfolgen müssen? Meine Antwort, das wird auch das Fazit
  dieses Vortrags sein, meine Antwort ist: Nichts ist wichtiger im Moment als Europa
  zu stärken, auf allen Gebieten. Nichts ist wichtiger als Europa zu stärken. Und
  wenn beides zusammenkommt, der Spirit der Freiheit, dem wir uns transatlantisch
  verbunden fühlen, und ein stärkeres Europa, dann habe ich keine Bange, dass das
  Transatlantische sich sehr, sehr gut entwickeln kann. Ich habe für mich selber jetzt
  diesen Vortrag unter die Überschrift gesetzt: „Wohin bewegt sich das Transatlantische?“
  - und ich möchte, wie gesagt, so konkret wie möglich sein. Ich werde ein paar grundsätzliche
  Bemerkungen machen in einem ersten Teil zu außen- und sicherheitspolitischen Interessen,
  beiderseits des Atlantiks. Und dann ins Konkrete schauen und Ihnen zeigen: was funktioniert
  gut, was ist schwierig. Es ist ein gemischtes Bild, das nicht unbedingt dem Bild
  entspricht, das der öffentliche Diskurs derzeit vermittelt. Dann werde ich ein gehen
  auf die zwei Kriege, die vor unserer europäischen Haustür stattfinden. Auch die
  haben transatlantische Aspekte der Sicherheitspolitik. Und dann auf die NATO in
  Europa. Ich fange also an mit einem Blick auf unsere Interessen. Fangen wir mit
  den deutschen Interessen an, die sich doch sehr stark auch europäisch zeigen. Wir
  haben das definiert in der Bundesregierung mit drei großen Schlagwörtern: Sicherheit,
  Freiheit, Wohlstand. Sicherheit, Freiheit, Wohlstand - davon lässt sich, das ist
  unser Anspruch, von Ableiten, was wir an außen- und sicherheitspolitischen Entscheidungen
  treffen. Da passt rein das, was wir in der NATO tun, „fünf Prozent“. Da passt rein
  unsere Haltung zum internationalen Strafgerichtshof. Da passt rein das, was wir
  für den Schutz der Wasserstraßen im Nahen- und Mittleren Osten, am Golf von Aden
  und der Straße von Hormus tun. Da passt hinein, wie wir uns für Freihandelsabkommen
  einsetzen. Da passt hinein, wie wir zukunftsgerichtet KI-Diplomatie exerzieren wollen.
  All das ist „Sicherheit, Freiheit, Wohlstand“. Aber natürlich, die nächste Frage
  stellt sich: mit wem wollen wir das denn umsetzen? Alleine können wir das nicht.
  Wir sind natürlich in erster Linie ausgerichtet auf die Europäer. Dabei sehen wir
  unterschiedliche Konfigurationen. Für mich, für uns bleibt weiterhin die große Präferenz,
  Außen- und Sicherheitspolitik mit den EU27 zu betreiben - das geht nicht immer.
  Aus sehr praktischen Gründen hat sich herausgeschält die Formel „E3“. Das verlässt
  gewissermaßen den Kreis der Europäischen Union, weil die Briten dabei sind. Deutschland,
  Frankreich, Großbritannien, das macht Sinn. Dann gibt es die E5, von denen Sie öfters
  lesen, mit Italien und Polen. Und dann andere Konfigurationen - das alles ist wichtig.
  Aber das europäische Miteinander steht ganz vorne. Dann das Transatlantische. Und
  da gilt, ich komme wieder zu unserem Interesse, das will ich Ihnen ganz klar sagen:
  Wir wollen transatlantisch bleiben, wir wollen transatlantische Außen- und Sicherheitspolitik
  betreiben. Ich sage jetzt dazu: so lange und so intensiv wie möglich. Denn: wir
  müssen europäischer werden, das wissen wir. Und auch diesen Weg gehen wir. Und das
  so schnell wie möglich. Und ich sage in diesem Kreis gerne dazu, dass sich in den
  letzten Monaten gezeigt hat, dass das Transatlantische auch einen immer stärkeren
  kanadischen Charakter bekommt – und das ist auch gut so. Neben europäisch und transatlantisch
  geht es darum, uns zu konzentrieren auf Schlüsselpartner auf allen Kontinenten.
  Wir haben da einen intensiven Prozess durchgeführt, um zu sehen, wie wir unser Engagement
  bündeln, fokussieren können. Wir können nicht überall alles mit jedem tun, wir müssen
  uns auf Schlüsselpartner konzentrieren. Da gibt es ein System, das wir in der Bundesregierung
  aufgesetzt haben - also nicht das Auswärtige Amt allein - nach unterschiedlichen
  Kriterien ausgerichtet. Und ich nehme noch einen vierten Punkt zu europäisch, transatlantisch,
  Schlüsselpartner in der Welt. Das vierte: wir müssen Außen- und Sicherheitspolitik
  gestalten mit immer weniger Abhängigkeiten. Die Reduktion von massiven Abhängigkeiten
  gehört mit zu unseren wesentlichen außen- und sicherheitspolitischen Interessen.
  Hier Stichwort: China. Wie sieht nun ein solcher Interessenkanon der Vereinigten
  Staaten aus, so wie er sich uns im praktischen Tun, in der täglichen Politik auftut?
  Hierzu aus meiner, Berliner Sicht, ein paar Anmerkungen: Ich glaube, es sind drei
  ganz zentrale Bereiche, um die sich das wesentliche US Interesse dreht: Das Erste
  ist der absolute Perspektiven-Fixpunkt dieser Regierung, die Rivalität mit der Volksrepublik
  China und ich sage dazu: das Gewinnen der Rivalität mit der Volksrepublik China.
  Das Zweite ist der Blick auf die eigene Hemisphäre. Das müssen wir Europäer lernen,
  wir kommen als Europa erst später. Und das Dritte: wahrscheinlich der Nahe und Mittlere
  Osten und die amerikanische Rolle dort. Vielleicht dann auch das Verhältnis zu Russland.
  Europa, das müssen wir wissen, gehört nicht zu diesen drei Top Prioritäten. Auch
  für die Vereinigten Staaten geht es natürlich um die Frage, wie wird das umgesetzt,
  wie ist die Methodik. Da wiederum - und ich fokussiere mich jetzt auf die gegenwärtige
  Regierung - sehe ich vier Komponenten, die sich immer klarer auftun, mit denen wir
  dann auch umgehen müssen. Die vier Komponenten: Die Erste, das Abschütteln als lästig
  verstandener Bindungen im Internationalen und Multilateralen. Das hat natürlich
  Konsequenzen für uns Europäer. Das Zweite, eine maximale Flexibilität. Ich sage
  es jetzt mit meinen Worten: „alles ist verhandelbar“. Zu diesem Punkt hat der polnische
  Ministerpräsident Tusk bei der letzten Münchner Sicherheitskonferenz gesagt: „Vorsicht:
  wer glaubt, alles sei verhandelbar, muss auch wissen, dass dann jeder verkaufbar
  ist.“ Der dritte Punkt: die Bereitschaft und auch der Wille zur Disruption und zu
  Verknüpfungen von unterschiedlichen Politikbereichen, die eigentlich nicht zusammengehören.
  Sicherheitspolitische Verpflichtungen mit Zöllen als Strafe - um nur ein Beispiel
  zu nennen. Auch damit müssen wir Europäer umgehen. Und das Vierte ist dann militärische
  Dominanz, ich würde sagen militärische Dominanz gegenüber jedem potentiellen Gegner.
  Wir müssen lernen, damit als eine Selbstverständlichkeit umzugehen. Das ist im deutschen
  öffentlichen Diskurs vielleicht noch nicht der Fall. Und wir müssen einen gewissen
  Druck auch aushalten, was militärische Dominanz anbelangt, wenn man sie gemeinsam
  gestalten will. Da komme ich zu rüstungsindustriepolitischen Fragen, Sie, Herr General,
  haben das angesprochen. Auch wir müssen da ein überzeugter und überzeugender Player
  sein. Zu all dem, wie ich jetzt die US sicherheitspolitischen Strategien, die außen-
  und sicherheitspolitischen Interessen skizziert habe, zu all dem, kommt nach den
  Mid-Term Wahlen sicherlich eine neue Qualität in der Diskussion. Aber ich sehe keine
  Zeichen einer tatsächlichen faktischen Umsteuerung durch die Regierung. Sicherlich
  wird im Kongress anders diskutiert werden. Ein wirkliches Umsteuern wird es aber
  wohl nicht geben. Was heißt das für uns Europäer? Wo ist unsere Rolle? So wie ich
  vorhin versucht habe, einen transatlantischen Reflex in unseren Interessen zu beschreiben,
  so gibt es den europäischen Reflex, im amerikanisch-strategischen Denken heute nicht.
  Es muss ihn auch nicht geben, aber wir müssen das wissen, wir müssen das verstehen.
  Das heißt, der Umgang mit den Europäern ist ein Umgang, ich sage es mit meinen Worten
  etwas flapsig: ein „je nachdem Umgang“. Je nachdem, wie wir als Partner zur Verfügung
  stehen und taugen. Daran müssen wir uns gewöhnen. Aber noch viel wichtiger, und
  das ist die Kernmessage für mich: Es hängt eben auch von uns ab. Wir müssen an uns
  arbeiten, wenn wir ein vitales transatlantisches Miteinander wollen. Jetzt zum zweiten
  Teil, was heißt das konkret? Wie zeigt sich dieses Transatlantische unter den Umständen
  konkreter Politik, konkreter Herausforderungen? Davon gibt es viele, ich greife
  nur einige heraus. Unsere Grundhaltung ist: wir wollen transatlantisch bleiben,
  wissen aber, dass wir viel schneller als bislang europäischer werden müssen, auch
  damit das Transatlantische weiterhin gut klappt. Ich fange mal an mit drei Themen,
  die nicht oft beschrieben werden, die aber zeigen, dass das Transatlantische gut,
  teilweise sehr gut läuft: Sudan: Gemeinsam haben wir - deutsch, amerikanisch, europäisch
  - im Frühjahr eine Berliner Sudan-Konferenz ausgerichtet. Erstmals ist es gelungen,
  gemeinsam Prinzipien festzuhalten mit allen Stakeholdern und vielen internationalen
  Gästen. Prinzipien festzuhalten für einen dauerhaften Frieden in diesem Konflikt.
  Jetzt setzen wir uns gemeinsam in unterschiedlichen Foren und Gremien ein für einen
  dauerhaften Waffenstillstand. Hoffentlich gibt es bald einen, wir sind noch weit
  entfernt. Ich will nicht zu optimistisch klingen, aber der gemeinsame Einsatz des
  transatlantischen ist der Punkt, den ich machen möchte. Syrien, zweites Beispiel:
  Nach dem Sturz Assads hat es eine enge Kooperation der Europäer und Amerikaner gegeben,
  um Stabilität in das Land zu bringen. Gerade im Nordosten Syriens haben die Amerikaner
  auch gemeinsam mit den E3, Schritte unternommen, dass es nicht zu einem Wiederaufflammen
  der Konflikte gekommen ist. Ein gutes Beispiel exzellenter Kooperation. Das dritte
  Beispiel ist Haiti: Dort unterstützen wir gemeinsam die Aufstellung der Gang Suppression
  Force der Vereinten Nationen. Auch wir Deutsche zahlen in den Fonds der Vereinten
  Nationen ein. Und wir sorgen auch für Lufttransport. Das alles in enger Abstimmung.
  Dies für Sie einfach drei Beispiele aus der Welt, wo das transatlantisch wirklich
  gut läuft, teilweise unterberichtet. Wir passen im Transatlantischen unseren Reflex
  an. Ich komme jetzt mit zwei Themen, die zeigen, dass es auch hakt. Auch das gehört
  zu unseren transatlantischen Realitäten. Grönland: Auch heute noch ist es für mich
  und für viele unfassbar, dass innerhalb der NATO von den USA territoriale Ansprüche
  dieser Art gestellt worden sind gegenüber einem souveränen Alliierten. Und das begleitet
  von handfesten Drohungen mit Zoll- und Handelssanktionen. Aber zugleich haben wir
  es dann transatlantisch geschafft, das Ganze in sinnvolle Bahnen zu bringen. Es
  gab Verhandlungen derer, die verhandeln müssen: Dänemark, Grönland und die Vereinigten
  Staaten. Und man hat einen guten Lösungsweg gefunden, einen Lösungsprozess der etwas
  gebracht hat, was uns allen wichtig ist: und das sind zusätzliche Sicherheitskomponenten
  in dieser Region der transatlantischen Sicherheit. Dazu nötig war ein starker europäischer
  Reflex der Europäer. Der hat funktioniert. Weil der, ich nenne es mal „Angriff“,
  inakzeptabel war, haben wir auch einen starken Reaktionsprozess aufgebaut, mit dem
  in Aussicht stellen sehr harter Gegenmaßnahmen im Wirtschafts- und Handelsbereich.
  Und damit haben wir gezeigt, dass wir Europäer Sicherheit, Freiheit, Wohlstand zu
  schützen bereit sind. Gleichzeitig bleibt natürlich in Erinnerung der Zwist. Das
  kann man nicht unter den Teppich kehren. Das zweite Beispiel, das nenne ich nur
  als Überschrift, da geht es um die Frage der Nachbesetzung Ihres Postens als Hoher
  Repräsentant für Bosnien-Herzegovina, den Sie hervorragend ausgeführt haben, Herr
  Schmidt. Die Nachbesetzung ist transatlantisch nicht gut gelöst und ich sage das
  als Europäer. Es ist uns wichtig hier jetzt rasch zu einer guten Lösung zu kommen,
  die eine europäisch stark geprägte sein muss, denn die Stabilität Bosnien-Herzegowinas
  ist ein Teil der europäischen Stabilität, der Stabilität und der Sicherheit auf
  unserem Kontinent. Damit komme ich zu ein paar Bemerkungen zu den zwei Kriegen,
  die derzeit an unserer Haustür stattfinden: In der Ukraine und im Nahen und Mittleren
  Osten - an unserer Haustür, das heißt natürlich auch: an der transatlantischen Haustür,
  und damit haben beide auch transatlantische Aspekte, und auf die möchte ich eingehen.
  Eben nicht auf den konkreten Stand der Auseinandersetzungen, sondern die transatlantischen
  Aspekte dabei, weil ich konkret sein möchte: was tut sich im Transatlantischen bei
  sehr klaren, konkreten Fragen des täglichen Politikmachens. Ich fange an mit Russlands
  Krieg gegen die Ukraine. Heute ist Tag 1.722 und wir zählen hunderttausende Tote
  und Verwundete. Wo stehen wir transatlantisch? Meine erste Bemerkung: Wir wissen
  alle ganz genau, was im Februar 2022 passiert ist. Ein durch nichts zu rechtfertigender
  Angriff Russlands auf einen souveränen Nachbarn, dessen Grenzen Moskau selbst vorher
  anerkannt hat. Dass Moskau seine Begründung seither x-mal geändert hat, tut dem
  keinen Abbruch und wird daran nichts ändern. Deswegen stehen wir, ich sage jetzt
  wir: Deutschland, die Europäer, zumindest die allermeisten Europäer, ganz klar weiterhin
  auf der Seite der Ukraine - und das heißt: auf der Seite des Völkerrechts, auf der
  Seite unserer Sicherheit in Europa und auf der Seite des Friedens. Das „Verlängerungscamp“
  ist das von Präsident Putin geführte. Nicht unseres, was auch immer die Propaganda
  da erzählen mag. Die Vereinigten Staaten, das ist jetzt mein transatlantischer Punkt,
  haben sich unter Präsident Trump entschlossen, in die Rolle eines Mediators zu wechseln.
  Das unterscheidet uns. Meine zweite Bemerkung. Wir übernehmen seither als Europäer
  einen Großteil der Lasten und der Unterstützung der Ukraine zu dessen Überleben
  im militärischen Bereich und auch im zivilen Bereich. Auch das unterscheidet uns
  mittlerweile vom amerikanischen Ansatz. Und meine dritte Bemerkung, wir Europäer
  organisieren ständig wachsenden Druck auf Moskau, gerade im wirtschaftlichen Bereich,
  und Moskaus makroökonomische Indikatoren sind und entwickeln sich verheerend. Dazu
  passt nicht der sogenannte „Diesel-Deal“ der USA mit dem Kreml der vergangenen Wochen,
  der geht einen anderen Weg, wobei unklar bleibt, ob russischer Diesel bislang in
  den Vereinigten Staaten auch tatsächlich angekommen ist. Und: Als in den vergangenen
  Tagen in Abu Dhabi verhandelt wurde, sollte es, laut amerikanischen Verhandlern,
  auch um die Sicherheitsarchitektur Europas gehen. Heute früh war zu lesen die Aussage
  Herrn Kushners, dass es um eine, ich zitiere, „neue“ Sicherheitsarchitektur Europas
  gehen solle, die verhandelt werde. Was auch immer man sich in Washington darunter
  versteht, ich bin mir sicher, Moskau weiß genau, was es will in diesen Verhandlungen.
  Und zwar: Dominanz über europäische Nachbarn, Veto-Rechte über Bündnisse, die Liste
  ist lang. Der Kreml will die Zeit zurückdrehen und jeder, der sich näher damit befasst
  hat, weiß, dass das in zwei Dokumenten aus dem November, Dezember 2021, aus dem
  Kreml gesandt an die amerikanische Regierung, damals detailliert festgehalten ist.
  Auch da, muss ich sagen, sind wir Europäer klar. Der Bundesaußenminister hat es
  vor ein paar Tagen am Rande des G7 -Außenministertreffens nochmal klar gesagt: Wir
  brauchen und wir wollen keine neue Sicherheitsarchitektur für Europa. Es gibt eine
  sehr solide Sicherheitsarchitektur hier mit NATO , EU , OSZE , Europarat, den Regelwerken
  der Vereinten Nationen. Allein es geht darum, dass diese Regeln einzuhalten sind.
  Auch durch Moskau und das muss Moskau klargemacht werden. Gehen muss es jetzt, dass
  mein nächster Punkt, zunächst und zuvorderst um einen Waffenstillstand und einen
  haltbaren und fairen Frieden. Mit Sicherheitsgarantien für die Ukraine. Und nicht
  um eine neue Sicherheitsarchitektur. Wir dürfen Moskau nicht auf den Leim gehen.
  Dazu gehört auch die Diskussion, dies meine letzte Bewertung zu diesem Komplex,
  um die Frage, die Sie auch in der Presse mitverfolgt haben, „wie nahe“ die Europäer
  bei Verhandlungen zwischen Russland, der Ukraine und den Vereinigten Staaten dabei
  sein dürfen. Auch diese Diskussion zeigt einen der unterschiedlichen Zustände des
  Transatlantischen. Denn es geht um die Sicherheit in Europa, deren Teil die Ukraine
  zweifelhaft ist und bleiben wird. Wie kann es dann nicht selbstverständlich sein,
  auch aus dem transatlantischen Denken heraus, dass wir Europäer mit am Tisch sitzen?
  Der Bundesaußenminister hat dies gegenüber dem amerikanischen Außenminister auch
  nochmal in den vergangenen Tagen sehr klar gemacht. Dies also einige Bemerkungen
  zu den transatlantischen Aspekten des Krieges in der Ukraine, der für uns, für die
  europäische Sicherheit, für die europäische Seite des Atlantiks höchste Priorität
  hat. Für Washington dürfte eine andere Sicherheitskonstellation vor unserer Haustür
  noch höher priorisiert sein. Es geht um den Iran. Auch da möchte ich mich konzentrieren
  auf transatlantische Aspekte dessen, was wir im Moment im Nahen und Mittleren Osten,
  am Golf von Aden und an der Straße von Hormus sehen. Die Entscheidung zum Krieg
  war nicht unsere. Und es wird auch ganz sicher nicht unser Krieg werden. Aber die
  Konsequenzen haben auch wir Europäer zu tragen, wie die ganze Welt. Denn mit der
  Entscheidung, die Meerenge an der Straße von Hormus zu blockieren und anzugreifen,
  hat der Iran dann ganz bewusst quasi die ganze Welt angegriffen und in den Krieg
  hineingezogen. Deswegen auch hier, wo vieles ineinander und zueinander kommt - auch
  die Frage Gaza, Westbank, alles ist miteinander verbunden, bis zum Horn von Afrika
  - auch hier möchte ich versuchen, die Interessen kurz zu ordnen: Die amerikanischen
  Interessen hat der amerikanische Präsident intensiv kommuniziert, so was im vergangenen
  Jahr Gaza anging – die Gründung des Board of Peace mit seinen Konsequenzen - wie
  auch die Entscheidung zum Krieg gegen den Iran. Deswegen jetzt nur ein paar Bemerkungen
  zu unseren Interessen, in diesem hochkomplexen geografischen Raum. Ich sehe aus
  deutscher Sicht vier Kerninteressen, die wir verfolgen wollen und müssen: Das erste
  ist aus deutscher Sicht die unbedingte Sicherheit des Staates Israel. Das zweite
  ist die Lebensfähigkeit der Palästinenser in ihrem eigenen Land. Das dritte ist
  das unbedingte Verhindern einer Nuklearwaffe in den Händen Teherans. Und das vierte
  ist, dass wir unsere europäischen Interessen wahren müssen, bei dem, was sich neu
  ordnet an Sicherheitsarchitektur am Golf, in dieser Region, dazu gehört die Sicherheit
  der Wasserstraßen, die ich erwähnt habe. Unser Interesse der Zusammenarbeit mit
  Schlüsselstaaten hatte ich ja vorher auch grundsätzlich erwähnt, dies konkretisiert
  sich auch hier. Ich greife jetzt aus transatlantischer Sicht nur ganz wenige Aspekte
  heraus, gerade weil es sich um unsere unmittelbare europäische Nachbarschaft handelt:
  Wer verhandelt mit wem? Zum Iran verhandeln derzeit, so wie es aussieht, die Amerikaner
  direkt und auf Basis von Mediatoren, wahrscheinlich Katar, vielleicht auch andere.
  Gleichzeitig verhandelt der Oman mit Iran präzise über die Wasserstraße, über zivile
  Schifffahrt. Aber auch wir müssen unsere Interessen wahren. Wir müssen unsere Interessen
  kennen und wahren als Europäer. Das gilt für uns, die wir in der EU sind, das gilt
  aber auch darüber hinaus für Staaten der Region. Und so hat sich ein Format ergeben,
  das, wie ich glaube, Zukunft haben wird: Das heißt E4, vier Europäer (Deutschland,
  Frankreich Großbritannien, Italien) und R4, vier Regionalstaaten, die hier wesentliche
  Interessen haben (Ägypten, Saudi-Arabien, Türkei, Pakistan). Sie haben sich jetzt
  einmal getroffen, in Istanbul auf Ebene der Außenminister. Es wird ein nächstes
  Treffen geben, das wir vorbereiten, das hier in Berlin stattfinden soll. Also auch
  wir müssen unsere Interessen wahren. Wir Europäer sind nicht tatenlos. Wir waren
  bereit, Mienen zu räumen in der Straße von Hormus. Das ist so nicht abgerufen worden.
  Wenn es abgerufen wird, glaube ich, stehen wir weiterhin bereit - wenn die Umstände,
  die Sicherheit, das erlauben. Wir sind nicht tatenlos auch am Golf von Aden. Wir
  unterstützen die jemenitische, legitime Regierung. Wir versuchen Djibouti zu stützen.
  Nochmals aus transatlantischer Sicht: auch wir haben die Konsequenzen zu tragen
  und werden unsere Interessen in diesem Raum wahren müssen. Nur kurz erwähnen möchte
  ich aus transatlantischer Sicht das Thema Gaza, es ist eine katastrophale Situation,
  in der die Menschen dort leben müssen. Die Konstruktion des Board of Peace hat an
  Elan verloren. Wir, Deutschland, sind, das hatte ich vorhin gesagt, an der Seite
  der Sicherheit Israels, sind aber auch der größte Geber im Moment für die Palästinenser,
  soweit Material und Versorgungsgüter hineinkönnen in deren Wohngebiete. Man könnte
  kurz erwähnen den Libanon. Auch da - transatlantisch gedacht - unterstützen wir,
  die USA und die Europäer, die Regierung des Libanon. Das sind positive Punkte. Die
  Vereinigten Staaten tun dies intensiv, sie verhandeln mit dem Libanon und mit der
  Regierung Israels. Wir Europäer sind dabei, gerade jetzt ein neues Mandat fertigzustellen,
  mit dem wir die Sicherheitsstrukturen, die militärischen Strukturen mit Ausbildungsmaßnahmen
  für die libanesischen Streitkräfte unterstützen, damit sie dann die Sicherheit in
  ihrem Land, besser selbst umsetzen können. Damit komme ich zur NATO , zur Allianz.
  Für mich steht außer Zweifel, dass weiterhin die Allianz für unsere europäische
  Sicherheitspolitik das wesentliche Kerninteresse darstellt und ich glaube, auch
  für die amerikanische Politik wird es ein wesentliches Interesse bleiben, dass die
  Allianz kräftig, schlagkräftig, abschreckungsfähig und abwehrbereit ist. Bei der
  gegenwärtigen amerikanischen Regierung zeigt sich ein nuanciertes Bild dazu. So
  wie ich es wahrnehme, ist es folgendermaßen: Eine stark veränderte, fordernde amerikanische
  Rhetorik den Europäern gegenüber, und ich sage dazu, diese Rhetorik hat was das
  Fähigkeitenprofil der Allianz anbelangt, auch positiv gewirkt. Zum Zweiten ein höchst
  verlässliches militärisches Miteinander in der NATO , im konventionellen Bereich
  und im Nuklearen ohnehin. Das sollte auch niemand anders darstellen. Und als drittes
  - das ist wichtig - der gemeinsame transatlantische, amerikanische, deutsche, europäische
  Wille, der gemeinsame Wille also, die Allianz in ihren Fähigkeiten massiv zu stärken.
  Wie sind die Interessenlagen bei all dem, was diese Trias ausmacht, auf unserer
  Seite? Die deutschen Interessenlagen: wir tragen die Beschlüsse zum 5% Ziel mit,
  sind, glaube ich, anerkannt starker Partner, was Investments anbelangt. Wir tragen
  bei den Fähigkeitsentwicklungen und Fähigkeitsplanungen der Allianz das zweitgrößte
  Paket. Das ist richtig und das werden wir weiterhin so tun. Wir investieren mit
  anderen Europäern gemeinsam in die Sicherheit der Allianz. Und nutzen als Europäer
  auch die Möglichkeiten, die die Europäische Union neu aufgesetzt hat. Wir kümmern
  uns also um den „europäischen Pfeiler“ zur Stärkung dieser Allianz. Auch da sind
  wir im Konsens. mit unseren amerikanischen Partnern und Alliierten. Wie sind die
  amerikanischen Interessen? Bislang, und das gilt für mich weiterhin, gab es drei
  wesentliche Ziele der amerikanischen NATO -Politik. Das sehe ich so als Linie die
  durch Jahrzehnte gilt: Erstens, der Schutz der Europäer. Zweitens, das Abschrecken
  Russlands. Und drittens, die Nutzung all dessen für die amerikanische Power Projection,
  auch außerhalb unseres Kontinents. Bislang gilt das für mich weiterhin so. Wir werden
  in den kommenden Wochen, das ist von Ihnen, Herr Schmidt, erwähnt worden, mit der
  US-Posture-Review sehen, wie weit hier sich Änderungen im amerikanischen Dispositiv
  ergeben sollten. Für uns, da spreche ich aus deutscher und europäischer Sicht, für
  uns ist das vitalste derzeitige Sicherheitsinteresse, dass die Synchronisation,
  sollte es zu Reduktionen auf amerikanischer Seite kommen oder zu Umgruppierungen,
  dass die Synchronisation dieses Prozesses mit den Aufwuchs-Möglichkeiten von Substituierungen
  durch Europäer, dass diese Synchronisation stimmig ist und dass auf keinen Fall
  bei diesen beiden Prozessen, die wir erwarten dürfen, Sicherheitslücken entstehen,
  die Sicherheitslücken für uns, für unseren Kontinent, wären. Das ist für mich unser
  vitalstes Sicherheitsinteresse. Und auch hier gilt: es hängt eben auch an uns Europäern.
  Wir müssen über uns nachdenken, wir müssen schneller werden und wir müssen bissiger
  werden beim Aufbau unserer eigenen Sicherheitskomponenten für eine weiterhin starke
  euro-atlantische Sicherheitsstruktur. Kein Zweifel, wir erwarten in den nächsten
  Tagen, vielleicht wird es etwas länger dauern, die amerikanischen Entscheidungen.
  Das wird ein Stresstest werden für das Transatlantische, auch für uns. Und ich sage
  dazu, weil wir vorhin auch über Kommunikation und den öffentlichen Raum gesprochen
  haben: es ist viel passiert im sicherheitspolitischen Diskurs in meinem Land in
  den letzten Jahren. Es sind neue Selbstverständlichkeiten da, über die auch öffentlich
  diskutiert wird. Ich möchte sagen, im Zusammenhang mit diesem Stresstest werden
  wir auch lernen müssen, gut in der politischen Kommunikation umzugehen, beispielsweise
  damit, was „Readiness to Fight“ eigentlich bedeutet. Das muss ja das gemeinsame
  Ziel von Abschreckungs- und Verteidigungsfähigkeiten sein. „Readiness to Fight“
  - wenige wagen das diskursiv in den Mund zu nehmen. Ich glaube, das muss kommen.
  Jetzt habe ich viel von „wir“ gesprochen bei der Allianz, das ist natürlich transatlantisch
  gedacht, aber es ist auch europäisch und ich hatte ganz am Anfang schon darauf hingewiesen:
  unsere transatlantische Zukunft hängt sehr stark von uns ab. Wir müssen an uns arbeiten,
  an Europa arbeiten. Europa zu stärken ist aus vielen Gründen für mich die wesentlichste
  Aufgabe. Ich hoffe, das ist durch die vielen Beispiele auch klar geworden, die ich
  gebracht habe. Vor allem um eine starke NATO , eine starke Allianz zu erhalten.
  Für mich ist nichts wichtiger im Moment, als diese Stärkung Europas. Und das ist
  keine Europa-Nostalgie, sondern wir müssen nach vorne blicken und wir dürfen dabei
  Europa nicht überschätzen, aber wir dürfen es auch auf keinen Fall unterschätzen.
  Natürlich, in Vielem sind wir abhängig und ich möchte dazu sagen, in vielen sind
  wir „noch“ abhängig und an diesem „noch“ müssen wir intensiv arbeiten. Sie haben
  zu Recht die Frage der Fähigkeiten, Herr General, in den Mittelpunkt gerückt. Es
  geht um Fähigkeiten mit Tempo. Wir machen bereits Tempo bei Fähigkeitsentwicklungen
  im Militärischen. Vielleicht wird auch das zukünftige Miteinander mit der Ukraine
  für uns Europäer da hilfreich sein, wir können viel lernen. Wir können, wenn ich
  das Thema weiten darf, auch innovativ sein als Europäer. Auch da, der öffentliche
  Diskurs malt oft ein anderes Bild: Wir, Deutschland, sind bei Patentanmeldungen
  in der Welt die Nummer 5. Wenn man alle Europäer zusammentut… - ja, wir können innovativ
  sein, wir müssen aber schneller umsetzen. Ich glaube, das ist das Wesentliche. Das
  hat dann auch seine sicherheitspolitischen Auswirkungen, wenn wir das können. Und
  zwar positive für die Allianz, für uns. Wir können auch europäische Ansätze in der
  Tech-Diplomatie bündeln, in der KI-Diplomatie bündeln, da gemeinsam als Europäer
  auftreten. Wir können, wenn ich in die Welt blicke und mir zukünftige Konstellationen
  anschaue, wir können darauf rekurrieren, dass wir Europäer nichts und niemanden
  außerhalb unseres Kontinents dominieren wollen. Wir sind kein Andere dominierender
  Kontinent. Wir können uns öffnen für Partnerschaften. Wir wissen um die Kraft von
  Kompromissen. Teilweise unterschätzt auch im öffentlichen Diskurs in letzter Zeit.
  Ich halte das für die wesentliche Kraftquelle der Europäer, dass wir hier auf unserem
  Kontinent es geschafft haben, viele Jahrzehnte, zum ersten Mal in der Geschichte
  des Kontinents, Frieden zu erhalten auf der Basis der ständigen Bereitschaft aller
  Europäer zu Kompromissen. Nicht einfach, aber das ist ein Kapital, aus dem wir auch
  in unseren Partnerschaften in der Welt Nutzen ziehen können und müssen. Wir stehen
  für einen Freiheitsbegriff, der ein europäischer ist, der nicht unbedingt kompatibel
  ist, gerade wenn ich an soziale Medien, an die Kommunikationsebene, die Kommunikationswelt
  denke, mit der amerikanischen. Aber wir werden selbstbewusst unseren Freiheitsbegriff
  schützen, den viele akzeptieren und attraktiv finden. Wir gehen Wege zum freien
  Welthandel. Der Bundeskanzler hat bei seiner Reise in Asien wichtige Reden dazu
  gehalten. Die Vernetzung von Freihandelszonen in der Welt. Das mag ein großes Ziel
  sein, aber es ist ein mögliches, großes Ziel. Wir werden standfest bleiben bei der
  Kernfrage des Politischen im internationalen Raum: Was ist alles verhandelbar? Für
  uns ist eben nicht alles verhandelbar. Menschenrechte sind es nicht. Die Bindung
  an regelbasiertes Entscheiden, an das Völkerrecht ist es nicht. Und ich würde auch
  sagen, Artikel 5 der NATO ist für uns nicht verhandelbar und konditionierbar, verbindbar
  mit völlig anderen Themen. Wir können also standfest bleiben. Kurzum, wir Europäer
  werden stärker in Hard Power. Wir haben viel Soft Power. Der Trend ist nicht schlecht
  und wir müssen das einbringen in das transatlantische Miteinander. Wir können eine
  starke transatlantische Agenda erarbeiten. Aus vielen der Punkte, die ich jetzt
  erwähnt habe. Ich will nur ganz wenige noch dazu geben: Wir können eine transatlantische
  Agenda bauen aus der Frage, wie wir Abhängigkeiten verringern. Wir Europäer wollen
  sie verringern, die Amerikaner auch. Wir müssen aus Abhängigkeiten herauskommen.
  Wir können eine positive Agenda daraus bauen. Wir können gemeinsam die Widerstandsfähigkeit
  von Lieferketten stärken. Wir können gemeinsam uns Überkapazitäten entgegenstellen
  und maßlosen Industrie-Subventionen durch andere. Wir können eine gute und richtige
  Balance finden - das war ein dominierendes Thema am Rande der Generalversammlung
  bei den Vereinten Nationen in vielen Gesprächen - eine gute und sinnvolle Balance
  finden bei künstlicher Intelligenz: zwischen den enormen Chancen und den unbedingten
  Notwendigkeiten auch zu Kontroll-Regelungen zu kommen. Also, es gibt die Möglichkeit
  für eine starke transatlantische Agenda. Ich glaube, es gibt die Notwendigkeit für
  eine starke transatlantische Agenda. Auch deshalb müssen wir Europäer vor allem
  an uns arbeiten. Nichts ist wichtiger als das. Wir müssen da beherzt rangehen.'
