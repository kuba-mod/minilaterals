title: Eingangsstatement von Außenminister Wadephul beim Forum Menschenrechte 2026
text: 'Das ist heute unser zweites Zusammentreffen – da kann man ja bereits von einer
  gewissen Tradition sprechen. Beziehungsweise lassen Sie es uns gern zu einer Tradition
  werden. Es freut mich sehr, dass wir heute wieder zusammenkommen können und dass
  wir unseren offenen Austausch fortführen. Denn wie Sie wissen: Die weltweite Situation
  hat sich, was Menschenrechte angeht, seit unserem letzten Gespräch nicht verbessert.
  Ganz im Gegenteil: Autokratien festigen sich. Die Zivilgesellschaften stehen weltweit
  unter Druck. Der Einsatz für Menschenrechte, Rechtsstaatlichkeit und Freiheit ist
  keine Selbstverständlichkeit – vielerorts ist er gefährlich. Vielen Dank an dieser
  Stelle auch für Ihr mutiges Engagement! Dieses konnte ich auf meinen Reisen in viele
  Krisenregionen selbst miterleben. Gerade, weil das keine einfache Ausgangslage ist,
  brauchen wir eine internationale Menschenrechtsarchitektur. Also diejenigen Institutionen,
  die weltweit für die universelle Gültigkeit von Menschenrechten einstehen – allen
  voran die Vereinten Nationen. Aber auch sie stehen unter Druck: Vor allem autoritäre
  Staaten nutzen ihre Stimmen, um kritische Länderresolutionen oder Untersuchungsmandate
  zu blockieren. Menschenrechtsverteidigerinnen und -verteidiger sehen sich immer
  mehr Angriffen ausgesetzt – Sie selbst wissen das am besten. Und manche großen Geber
  senken aus ideologischen Gründen ihre Finanzierung. Andere stehen unter erheblichen
  Haushaltszwängen, sodass dem internationalen System immer weniger Mittel zur Verfügung
  stehen. Das ist nicht schön, aber leider die Realität. Die Realität, die uns dazu
  drängt, in den Vereinten Nationen die nötigen Reformen voranzutreiben und klar zu
  priorisieren. Das begleiten und unterstützen wir in der Bundesregierung eng. In
  diesen herausfordernden Zeiten setzen wir auf Menschenwürde, Rechtsstaatlichkeit
  und Demokratie als Grundlage unserer Freiheit. Das alles können wir nur bewahren,
  wenn Menschenrechte auch international geachtet werden. Als Deutschland tragen wir
  eine globale Verantwortung dafür. Und fühlen uns den Menschenrechten verpflichtet.
  Deshalb haben wir uns erneut – erfolgreich – für einen Sitz im Menschenrechtsrat
  der Vereinten Nationen beworben! Ich möchte zwei Prioritäten herausstellen: Wie
  können wir auf aktuelle Krisenlagen am besten reagieren, diese klar adressieren
  und gemeinsam mit Partnern angehen? Menschenrechtspolitik steht dabei nie für sich
  allein, sondern ist elementarer Teil unserer Außenpolitik – unseres Einsatzes für
  Frieden und Sicherheit. Das gilt für unser Engagement im Menschenrechtsrat, genauso
  wie bei bilateralen Gesprächen und bei Gipfeltreffen. Nehmen wir Sudan als Beispiel
  – eine der größten, humanitären und Menschenrechtskrisen der Gegenwart und ein Schwerpunkt
  unseres heutigen Gesprächs: Ich halte es für unsere Pflicht, dafür zu sorgen, dass
  die Welt nicht wegsieht. Dass die Verantwortlichen perspektivisch zur Rechenschaft
  gezogen werden können. Deswegen habe ich im April dieses Jahres für die dritte Internationale
  Sudan-Konferenz ins Auswärtige Amt eingeladen. Diese Berlin-Konferenz war ein Meilenstein,
  weil sie die Krise nicht isoliert betrachtet hat: Neben unserem politischen Einsatz
  für Konfliktlösung haben wir Mittel für humanitäre Hilfe mobilisiert und über die
  desolate Menschenrechtslage gesprochen. Nun dürfen wir nicht nachlassen. Das schulden
  wir den leidenden Menschen vor Ort. Das gilt natürlich nicht nur für Sudan, sondern
  auch für andere Regionen. Anfang des Jahres haben wir uns im Menschenrechtsrat für
  eine Sondersitzung und eine zweijährige Verlängerung der Fact Finding Mission eingesetzt
  – mit Erfolg. Weil wir diese schweren Menschenrechtsverletzungen nicht aus dem Blick
  verlieren dürfen. Und weil die Fact Finding Mission dazu beiträgt, dass Beweise
  gesammelt und dokumentiert werden – ein erster Schritt zur Aufarbeitung. Themen,
  deren Einfluss auf Menschenrechte wir erst beginnen zu verstehen. Vor der VN -Generalversammlung
  in New York habe ich in meiner diesjährigen Rede über Künstliche Intelligenz gesprochen.
  Weil ich davon überzeugt bin: KI bietet gleichermaßen Chancen und Risiken. Je nachdem
  wie man sie entwickelt und einsetzt, kann sie zum Beispiel ein hilfreiches Werkzeug
  zur Dokumentation von Menschenrechtsverbrechen sein, das heißt, Opfern dabei helfen,
  gehört zu werden. Oder aber dazu genutzt werden, Falschinformationen zu verbreiten
  und oppositionelle Stimmen zu unterdrücken – auch über Landesgrenzen hinweg. Daher
  sollten wir uns mit folgenden Fragen auseinandersetzen: Wer kontrolliert diese neue
  Technologie? Wer legt internationale Regeln fest? Wie können wir Menschen vor KI-unterstützter
  Repression schützen? Und wie können wir dazu beitragen, dass der technische Fortschritt
  am Ende im Dienst der Menschenwürde steht? Auch darüber können und sollten wir heute
  ins Gespräch kommen. Sie alle stellen sich in Ihrer täglichen Arbeit Angriffen auf
  Menschenrechte entgegen – in Deutschland und mit Ihren Partnerorganisationen weltweit.
  Für diesen Einsatz, für Ihre Analysen und Ihren heutigen Input möchte ich mich bedanken!
  Und nun freue ich mich auf den Austausch mit Ihnen.'
