title: Rede von Außenminister Wadephul anlässlich der Haushaltsdebatte 2027 zum Einzelplan
  05 im Bundestag
text: 'Ich bedanke mich zunächst bei den Damen und Herren Berichterstattern für die
  außerordentlich angenehme Zusammenarbeit und im Übrigen auch bei sehr vielen von
  Ihnen für die sehr gute Zusammenarbeit in vielen außenpolitischen Dossiers. Es zeichnet
  diesen Bundestag aus, dass es uns über die Koalitionsfraktionen hinweg gelingt,
  zu vielen zentralen Fragen eine gemeinsame deutsche Position zu vertreten. Ich glaube,
  das ist in diesen Zeiten der Unsicherheit, der Erschütterung der Welt mit Krisen
  und Konflikten eine Auszeichnung der deutschen Politik, die aus meiner Sicht noch
  etwas unterschätzt wird und auf die wir stolz sein können. Die zweite Bemerkung
  ist, dass der Haushalt natürlich insgesamt verantwortbar ist und getragen wird,
  auch von mir. Aber, ehrlich gesagt, ein sehr viel besseres Prädikat kann ich meinem
  Haushalt nicht geben. Mit Blick darauf, dass wir in zahlreichen Bereichen die sogenannte
  Bereichsausnahme anwenden, die ja Rücksicht darauf nimmt, dass wir uns in einer
  sicherheitspolitisch wirklich prekären Situation befinden; dass ich feststelle,
  dass über den Etat des Bundesverteidigungsministers hinaus auch in anderen Etats
  entsprechende Regelungen Anwendung finden, aber nicht ein einziger Eurocent des
  Einzelplans 05 darunter subsumiert wird, ist das schwer nachvollziehbar, meine Damen
  und Herren. Denn selbstverständlich ist das, was wir außenpolitisch machen - und
  das ist ja in vielen Reden hier zum Ausdruck gekommen -, ein erheblicher Beitrag
  für Frieden, Sicherheit und Stabilität in Europa und für unser Land. Es gibt eine
  Versuchung in Deutschland - wir haben das jetzt auch in jüngeren Umfragen verfolgen
  können -, und die möchte ich mal „Schneckenhausversuchung“ nennen, also die Fühler
  einzuziehen, sich zurückzuziehen ins Gehäuse, wo es warm und kuschelig ist, wo man
  sich vermeintlich sicher fühlt. Das ist eine Illusion; denn diese Schneckenhausmetapher
  ist eben nicht nur eine Metapher. Das Ganze lässt sich auch messen und verleiht
  einer wachsenden Meinung, die ich für gefährlich halte, Ausdruck: dass man sich
  nämlich außenpolitisch zurückhalten sollte. Ich warne davor; denn dieser kuschelige
  Rückzug hat ein entscheidendes Problem: Wer sich versteckt, der gibt seine Handlungsfähigkeit
  auf, der macht sich zum Objekt. Und übrigens: Einen Hinterausgang gibt es aus dem
  Schneckenhaus auch nicht, und ein echter Schutz ist es auch nicht, wie viele Schnecken
  gemerkt haben. Wenn einer drauftritt, dann ist es zu Ende. Das ist also ein Moment,
  in dem aus einer scheinbar gemütlichen Rückzugsstrategie eine gefährliche Haltung
  werden kann. Deswegen möchte ich sagen: Wenn wir uns zurückziehen, bleiben andere
  auf der Welt nicht stehen. Wenn wir unsere Fühler einziehen, dann würden andere
  die Welt gestalten. Sie setzen dann Regeln, sie verschieben Grenzen - im ganz wortwörtlichen
  Sinne -, sie treffen Entscheidungen über unsere Sicherheit, über unsere Freiheit,
  über unseren Wohlstand. Deswegen nehmen wir im Auswärtigen Amt mit allen Diplomatinnen
  und Diplomaten und allen Beschäftigten das auf, was in der Welt geschieht: Wir erspüren
  Gefahren, erkennen Chancen, knüpfen Kontakte, pflegen Beziehungen. Und vor allem:
  Wir gestalten die Rolle Deutschlands in der Welt. Kurz gesagt: Deutschland wird
  seine Fühler nicht einziehen. Das Auswärtige Amt wird sich öffnen, und Deutschland
  wird mit dieser Bundesregierung vorangehen und mit Beispiel führen in dieser Welt.
  Denn wenn Russland seinen brutalen Angriffskrieg gegen die Ukraine und seinen Schattenkrieg
  gegen Europa unbeirrt fortsetzt und tagtäglich eskaliert, dann braucht es mehr deutschen
  Einsatz für ein schützenswertes Europa und eine abschreckende NATO . Hier hat es
  eine Zusammenkunft von über 40 Staaten gegeben. 26 Staats- und Regierungschefs hat
  der deutsche Bundeskanzler hier in Berlin zusammengerufen. Wir stehen in der Mitte
  Europas, wir stehen auf der Seite von Freiheit und Sicherheit, sind ein Leuchtturm
  dafür. Das war eine Meisterleistung. Wir müssen sehen: Krisen halten sich nicht
  aus Deutschland heraus. Deutschland ist groß und vernetzt in dieser Welt und braucht
  Kontakte zu allen. Deswegen müssen wir in der internationalen Ordnung, die gerade
  neu verhandelt wird, dabei sein, eine Rolle spielen und die Chancen, die Möglichkeiten
  für unser Land nutzen. Wir schließen Handelsverträge über die Europäische Union,
  ein Freihandelsabkommen nach dem anderen. Die deutsche Bundesregierung hat das Mercosur-Abkommen
  durchgesetzt. Das ist ein konkreter Beitrag für Arbeitsplätze und Wirtschaftswachstum
  in Deutschland, meine sehr verehrten Damen und Herren. Im Übrigen hält das die Europäische
  Union zusammen. Ich bin dankbar, dass die Frauen und Männer des Auswärtigen Amtes
  in unseren rund 230 Auslandsvertretungen diesen Auftrag des Nach-draußen-Gehens
  annehmen, in Kyjiw auch bei russischen Raketenangriffen weiterarbeiten oder in Brüssel
  um den Zusammenhalt der NATO ringen, in Kanada oder Kasachstan neue Rohstoffquellen
  für unsere Industrie erschließen, in São Paulo und Neu-Delhi die neuen Handelsabkommen
  mit Mercosur und Indien für den Mittelstand nutzbar machen; Menschen, die in den
  Visastellen heute digital dafür sorgen, dass die Pflegekraft aus Manila schneller
  in einer deutschen Station anfangen kann; Menschen, die bei jeder Krise zu jeder
  Tages- und Nachtzeit bereit sind, deutsche Familien mit ihren Kindern nach Hause
  zu holen, wenn die Lage vor Ort zu gefährlich ist. Diesen Kolleginnen und Kollegen
  möchte ich hier an dieser Stelle sehr herzlich danken und dafür plädieren, dass
  der Haushalt im nächsten Jahr etwas üppiger ausfällt.'
