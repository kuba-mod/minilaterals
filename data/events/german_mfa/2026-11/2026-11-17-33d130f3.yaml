title: Außenminister Wadephul vor seiner Reise nach Aserbaidschan und Armenien
text: 'Außenminister Wadephul sagte vor seiner Abreise nach Aserbaidschan und Armenien
  heute (17.11.2026): Der Südkaukasus steht an einem Wendepunkt – mit der historischen
  Chance, Jahrzehnte von Krieg, Gewalt und Vertreibung endgültig zu überwinden. Was
  lange kaum vorstellbar schien, ist in greifbare Nähe gerückt. Die Chance auf Frieden
  im Südkaukasus muss jetzt genutzt werden. Der Mut und die Verantwortung, die Präsident
  Alijew und Ministerpräsident Paschinjan für Armenien und Aserbaidschan gezeigt haben,
  können den Weg zu dauerhaftem Frieden ebnen. Die Paraphierung des Friedensvertrags
  im vergangenen Jahr war ein Meilenstein auf diesem Weg. Jetzt kommt es darauf an,
  diesen entschlossen weiterzugehen. Perspektivisch kann so gegenseitiges Vertrauen
  zwischen den Menschen in der gesamten Region entstehen. Für die Menschen auf beiden
  Seiten der Grenze muss spürbar werden, dass sich Mut und Vertrauen auszahlen: Durch
  mehr Sicherheit, offene Verkehrswege und eine Perspektive, die wirtschaftliche Hoffnung
  macht und Aussöhnung fördert. Deutschland steht Armenien und Aserbaidschan dabei
  als verlässlicher Partner und Freund zur Seite. Ich reise – erstmals als Außenminister
  – nach Baku und Eriwan, um darüber zu sprechen, wie wir Schritte der Entspannung
  und zum Frieden unterstützen können. Deutschland hat seine Beziehungen mit Armenien
  und Aserbaidschan im vergangenen Jahr auf eine neue, strategische Grundlage gestellt.
  Die gemeinsam beschlossene, strategische Agenda mit beiden Staaten wollen wir jetzt
  mit praktischen Vorhaben umsetzen. Die Region des Südkaukasus ist ein historischer
  Dreh- und Angelpunkt zwischen Europa und Asien. Diese Rolle bietet auch heute wieder
  riesiges Potenzial für Handel, Energiepartnerschaften und neue Verkehrsverbindungen.
  Dauerhafter Frieden und offene Grenzen wären nicht nur ein Gewinn für die Menschen
  der Region, sondern für die Sicherheit und Stabilität unserer gesamten europäischen
  Nachbarschaft. Zugleich machen Russlands Angriffskrieg gegen die Ukraine und immer
  unverhohlenere Drohungen aus Moskau eines deutlich: Präsident Putin will keine europäische
  Ordnung souveräner Staaten, in der jedes Land über sein eigenes Schicksal entscheidet.
  Auch im Südkaukasus erleben wir, dass Russland versucht, seinen Einfluss zu erhalten
  – auf Kosten der Menschen und ihrer Zukunft. Über eine Annäherung seiner Nachbarn
  an Europa darf aber nicht in Moskaus entschieden werden. Gerade deshalb ist es wichtig,
  dass Armenien und Aserbaidschan ihre Zukunft selbstbestimmt gestalten. Es ist Zeit,
  ihre Stimme zu hören und auf ihre Interessen einzugehen.'
