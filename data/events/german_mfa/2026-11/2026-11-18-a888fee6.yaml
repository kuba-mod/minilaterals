title: 'Beauftragter für Religions- und Weltanschauungsfreiheit Rachel legt Regierungsbericht
  vor: Religiöse Minderheiten unter wachsendem Druck'
text: 'Am 18.11.2026 hat das Bundeskabinett den vierten Bericht der Bundesregierung
  zur weltweiten Lage der Religions- und Weltanschauungsfreiheit verabschiedet. Der
  Beauftragte der Bundesregierung für Religions- und Weltanschauungsfreiheit, Thomas
  Rachel, kommt damit dem Auftrag des Deutschen Bundestages nach, alle zwei Jahre
  über die weltweite Lage der Religions- und Weltanschauungsfreiheit zu berichten.
  Der Bericht umfasst den Zeitraum 2023-2025. Thomas Rachel, Beauftragter der Bundesregierung
  für Religions- und Weltanschauungsfreiheit: Die weltweite Lage der Religion- und
  Weltanschauungsfreiheit hat sich im Berichtszeitraum verschlechtert. Weltweit werden
  Kinder, Frauen und Männer aufgrund ihrer Religion und Weltanschauung zunehmend sozial
  ausgegrenzt, gesetzlich schikaniert, willkürlich verhaftet und gewaltsam angegriffen.
  In autoritären Staaten werden religiöse Minderheiten durch diskriminierende Gesetze
  und bürokratische Hürden gezielt unter Druck gesetzt. Ein besorgniserregender Trend
  ist die transnationale Repression: Staaten überwachen, bedrohen und attackieren
  Angehörige missliebiger religiöser Gruppen zunehmend über ihre eigenen Landesgrenzen
  hinaus. Der neue Bericht widmet diesem Phänomen erstmals ein eigenes Kapitel. Das
  Menschenrecht, seine Religion frei wählen, wechseln oder eben keiner angehören zu
  können, ist nicht abstrakt. Für viele Kinder, Frauen und Männer ist es eine Frage
  von Freiheit oder Verfolgung, Leben oder Tod. Neben staatlicher Verfolgung finden
  Angriffe durch nicht-staatliche, extremistische und kriminelle Gruppen statt. Einige
  der betroffenen Staaten versäumen es, ihre Bürgerinnen und Bürger unabhängig von
  ihrer Glaubensrichtung wirksam zu schützen. Durch die Verankerung des Amtes des
  Beauftragten der Bundesregierung für Religions- und Weltanschauungsfreiheit seit
  Mai 2025 im Auswärtigen Amt hat die Bundesregierung ihren außenpolitischen Fokus
  auf den weltweiten Schutz und die Förderung des Rechts auf Religions- und Weltanschauungsfreiheit
  weiter geschärft und die internationale Zusammenarbeit in diesem Bereich vorangetrieben.'
