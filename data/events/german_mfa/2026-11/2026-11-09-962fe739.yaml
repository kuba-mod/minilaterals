title: Außenminister Wadephul vor seiner Abreise nach Paris zum G7-Außenministertreffen
text: 'Vor seiner Abreise nach Paris zum G7 -Außenministertreffen erklärte Außenminister
  Wadephul heute (09.11.2026): In dieser Zeit ist die enge Abfolge internationaler
  Treffen notwendiger denn je: Das Zusammentreffen der E4 mit vier regionalen Partnern
  in Istanbul. Vor gut einer Woche das Treffen der G20 in Atlanta, am vergangenen
  Freitag der Ostseerat in Warschau und jetzt ein G7 -Außenministertreffen in Paris
  zeigen: die Diplomatie läuft auf Hochtouren. Deutschland ist in allen diesen Gremien
  durchgehend vertreten und wir nutzen unsere Rolle im Sinne der Wahrung europäischer
  Interessen. Das heißt für den Iran-Konflikt jetzt konkrete Verhandlungen und keine
  neue militärische Eskalation. Und das heißt für den russischen Aggressionskrieg
  gegen die Ukraine, dass Europa Teil des Lösungsweges sein muss. Deswegen werden
  wir zusammen mit Frankreich und Großbritannien die europäischen Positionen einbringen.
  Ganz klar ist: Europa braucht keine neue Sicherheitsarchitektur, wie Russland uns
  glauben machen will, sondern schlicht die Wiederherstellung der bestehenden Sicherheitsarchitektur.
  Dazu gehören die Helsinki-Schlussakte, die Charta von Paris und das Budapester Memorandum.
  Sie alle zielen auf die Garantie aller Grenzen und der souveränen Gleichheit aller
  Staaten. Das alles sind dringende Voraussetzungen für die Wiederbelebung der Weltwirtschaft,
  was zentrale Aufgabe für die sieben wirtschaftsstärksten Demokratien der Welt ist.'
