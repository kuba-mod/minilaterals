title: 'Välisminister Tsahkna Prantsusmaa välisministrile: Venemaa ei otsusta Euroopa
  julgeoleku üle'
text: Täna, 22. oktoobril kohtus välisminister Margus Tsahkna Pariisis Prantsusmaa
  välisministri Jean-Noël Barrot’ga. Kohtumise keskmes olid kahepoolsete suhete edendamine,
  sealhulgas koostöö kaitse- ja majandusvaldkonnas, Euroopa julgeolek ja kaitsevõime
  tugevdamine, Venemaa täiendav survestamine, Ukraina toetamine, viimased arengud
  Lähis-Idas ning 2027. aasta jaanuaris Tallinnas toimuva Ukraina ülesehituskonverentsi
  ettevalmistused.
