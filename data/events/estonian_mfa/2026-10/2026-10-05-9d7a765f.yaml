title: 'Välisminister Tsahkna Chișinăus: äsja avatud Eesti suursaatkond võimaldab
  Moldova Euroopa teekonnal tugevamalt toeks olla'
text: Täna, 5. oktoobril avas välisminister Margus Tsahkna koos Moldova välisministri
  Mihai Popșoiga Chișinăus Eesti suursaatkonna. Saatkonna avamine kindlustab Eesti
  diplomaatilist kohalolu Moldovas ning võimaldab Eestil senisest veelgi tõhusamalt
  toetada Moldova liikumist Euroopa Liidu liikmesuse suunas, edendada kahepoolseid
  suhteid ja majanduskoostööd ning arengukoostööd. Eesti esimene Moldovas resideeriv
  suursaadik on Siiri Königsberg.
