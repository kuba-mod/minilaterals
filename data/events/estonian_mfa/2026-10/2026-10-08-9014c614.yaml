title: 'Tsahkna Londonis: järeleandmised Venemaale ei too Euroopale rahu'
text: Täna, 8. oktoobril osales välisminister Margus Tsahkna Londonis Euroopa julgeoleku
  aruteludes GZERO Summitil ja mõttekojas RUSI, kus rõhutas, et Euroopa pikaajalise
  julgeoleku kindlustamiseks ei tohi teha Venemaale järeleandmisi ja tuleb kindlustada,
  et Venemaa agressioon enam kunagi ei korduks.
