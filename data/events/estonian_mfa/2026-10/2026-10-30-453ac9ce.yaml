title: 'Tsahkna kohtumisel Tsihhanovskajaga: vaba ja demokraatlik Valgevene on Eesti
  julgeoleku huvides'
text: Välisminister Margus Tsahkna kohtus täna, 30. oktoobril Tallinnas Valgevene
  demokraatlike jõudude juhi Svjatlana Tsihhanovskajaga. Kohtumisel arutati olukorda
  Valgevenes, poliitvangide vabastamist, rahvusvaheliste sanktsioonide jätkamist ning
  Eesti toetust Valgevene demokraatlikele jõududele.
