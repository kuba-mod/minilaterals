title: 'Tsahkna kohtumisel Ühendkuningriigi välisministriga: Briti väed kindlustavad
  Eestis iga päev kogu NATO julgeolekut'
text: Täna, 7. oktoobril kohtus välisminister Margus Tsahkna Londonis Ühendkuningriigi
  välisministri Ed Milibandiga, et arutada Eesti ja Ühendkuningriigi kaitsekoostööd,
  Ukraina toetamist ja Venemaa survestamist, Euroopa julgeolekut ning 2027. aasta
  jaanuaris Eestis toimuvat Ukraina ülesehituskonverentsi. Samuti kohtus välisminister
  visiidi raames nende teemade arutamiseks Ühendkuningriigi peaministri riikliku julgeoleku
  nõuniku Jonathan Powelliga.
