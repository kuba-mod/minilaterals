title: 'Asekantsler Minna-Liina Lind Korea Vabariigis AI-teemalisel tippkohtumisel:
  tehisintellekti taristu peab olema riikidele võrdsemalt kättesaadav'
text: Välisministeeriumi globaalküsimuste asekantsler Minna-Liina Lind osales 19.–22.
  oktoobril tippkohtumisel „Global AI and Digital Summit“ Korea Vabariigis Soulis,
  kus ta kohtus eri riikide digiministritega ning tutvustas Eesti kandidaati Nele
  Leoski Rahvusvahelise Telekommunikatsiooni Liidu (ITU) arengusuuna büroodirektori
  kohale.
