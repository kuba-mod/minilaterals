title: 'Välisminister Tsahkna Budapestis: uus hingamine Eesti ja Ungari suhetes aitab
  ehitada tugevat Euroopat'
text: Täna, 1. oktoobril viibis välisminister Margus Tsahkna visiidil Budapestis,
  kus ta kohtus Ungari presidendi András Baka ja välisministri Anita Orbaniga. Kohtumistel
  arutati uue hingamise andmist Eesti ja Ungari kahepoolsetele suhetele, koostööd
  Euroopa Liidus ja NATOs ning Venemaa agressiooni Ukraina vastu. Tegemist oli üle
  seitsme aasta esimese Eesti välisministri visiidiga Ungarisse.
