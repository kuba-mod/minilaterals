title: 'Välisminister Tsahkna: Ukraina ja Moldova astusid taas sammu lähemale Euroopa
  Liidule'
text: Täna, 13. oktoobril avas Euroopa Liit Ukraina ja Moldovaga kaks täiendavat ühinemisläbirääkimiste
  teemaplokki, mis võimaldab mõlemal riigil jätkata täiendavate reformidega ja liikuda
  edasi Euroopa Liiduga ühinemise suunas.
