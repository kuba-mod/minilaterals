title: 'Välisminister Tsahkna: Schengeni viisade väljastamine Venemaa turistidele
  tuleb täielikult keelustada'
text: Eesti ühines täna, 13. oktoobril Soome välisministeeriumi algatatud üleskutsega,
  milles kutsutakse Euroopa Liitu ja liikmesriike üles lõpetama turismi eesmärgil
  viisade väljastamise Venemaa Föderatsiooni kodanikele ning karmistama Venemaa kodanike
  suhtes kehtivat viisarežiimi kogu Euroopa Liidus.
