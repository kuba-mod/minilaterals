title: 'Välisminister Tsahkna: vaid surve tugevdamine Venemaale sunnib teda rahuläbirääkimisi
  tõsiselt võtma'
text: Välisminister Margus Tsahkna sõnul on ta saanud oma Soome ja Norra kolleegidelt
  ülevaate tänasest Soome presidendi ja Norra peaministri telefonikõnest Venemaa liidriga,
  milles puudutati nii Venemaa agressioonisõda Ukraina vastu kui laiemalt Euroopa
  julgeolekuga seonduvat.
