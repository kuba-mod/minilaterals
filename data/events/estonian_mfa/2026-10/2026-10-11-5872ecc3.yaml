title: 'Välisminister Tsahkna: sagenevate huthide rünnakute tõttu soovitame tungivalt
  vältida reisimist Saudi Araabiasse ja piirkonda'
text: Jeemeni huthi mässulised on viimastel päevadel märkimisväärselt intensiivistanud
  rünnakuid Saudi Araabia vastu, võttes sihikule nii tsiviilelanikke kui ka tsiviiltaristut.
  Täna öösel korraldati Riyadhi King Khalidi rahvusvahelise lennujaama vastu viimase
  kümne aasta ohvriterohkeim terrorirünnak, milles on esialgsetel andmetel hukkunud
  12 ja vigastada saanud üle 300 inimese.
