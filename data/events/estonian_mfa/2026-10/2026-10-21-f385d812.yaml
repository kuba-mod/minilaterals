title: 'Välisminister Tsahkna telefonikõnes Ukraina välisministrile: tugevdame Eesti
  praktilist toetust Ukrainale enne rasket talveperioodi'
text: Täna, 21. oktoobril toimus välisminister Margus Tsahkna ja Ukraina välisministri
  Andrii Sõbiha telefonikõne, mille keskmes olid rahukõneluste hetkeseis, vajadus
  jätkata Venemaa survestamist ning toetus Ukrainale ajal, mil Venemaa rünnakud tsiviilelanike
  ja kriitilise taristu vastu on veelgi ägenenud. Samuti arutati ettevalmistusi jaanuaris
  Tallinnas toimuvaks Ukraina ülesehituskonverentsiks.
