title: 'Tsahkna: Koos Euroopa rahastusega tuleb Silmetile seada tähtaeg Vene toorme
  sõltuvusest vabanemiseks'
text: Euroopa peab vabanema oma strateegiliste tööstusharude sõltuvusest Venemaa toorainest
  ning seadma selleks konkreetsed tähtajad, rõhutas välisminister Margus Tsahkna.
  „Seame koostöös Euroopa Komisjoniga NPM Silmetile selge tähtaja Venemaa toorainest
  loobumiseks,“ ütles Tsahkna. Komisjoni tänane otsus valida Silmeti arendusprojekt
  Silmet 2.0 Euroopa Liidu 46 uue strateegilise projekti hulka annab ettevõttele olulise
  tõuke vajalikke muudatusi kiirendada.
