title: Välisministeeriumis avati näitus, mis keskendub Nõukogude pärandi ümberraamistamisele
text: 'Täna, 15. oktoobril avati välisministeeriumi fuajees näitus „Monumendi uued
  raamid: kunstilised sekkumised Nõukogude pärandisse“. Näituse ja sellele järgnenud
  seminari avasid kantsler Jonatan Vseviov ja Eesti Kunstiakadeemia rektor Hilkka
  Hiiop.'
