title: 'Tsahkna: Silmeti emafirma sai toetuse, mis aitab ettevõttel vabaneda agressorriigi
  toormest'
text: Täna, 19. oktoobril, otsustas Euroopa Komisjon toetada 77 Euroopa puhta tehnoloogia
  projekti kokku 3,4 miljardi euroga. Toetuse saajate hulgas on ka Silmeti tehase
  emaettevõte Neo Performance Materials (NPM), kes saab toetust haruldastel muldmetallidel
  põhinevate püsimagnetite tootmise rajamiseks Eestisse. See aitab tugevdada Euroopa
  tööstuse vastupanuvõimet ja lõpetada toorme tarned Venemaalt.
