title: 'Välisminister Tsahkna: president Zelenskõi allkirjastas Tallinna Ukraina ülesehituskonverentsile
  kutsutavate maailma liidrite ametlikud kutsed'
text: Välisminister Margus Tsahkna vestles täna, 28. oktoobril telefoni teel Ukraina
  välisministri Andri Sõbihaga, kellega arutati viimaseid arenguid Venemaa agressioonisõjas
  Ukraina vastu ja 2027. aasta jaanuaris Tallinnas toimuva Ukraina ülesehituskonverentsi
  ettevalmistusi. Ukraina president Volodõmõr Zelenskõi on tänaseks allkirjastanud
  maailma liidritele saadetavad ametlikud kutsed.
