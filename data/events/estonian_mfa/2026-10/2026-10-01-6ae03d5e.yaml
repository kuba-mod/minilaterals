title: 'Tsahkna: Eesti keelab Vene ja Valgevene teravilja transiidi läbi Eesti sadamate'
text: Valitsus otsustas täna keelata riikliku sanktsiooniga Venemaalt ja Valgevenest
  pärineva teravilja transiidi läbi Eesti. Venemaa otsib oma viljale Musta mere kõrval
  uusi väljaveoteid, kuid Eesti sadamatest üht neist ei saa.
