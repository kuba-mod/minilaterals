title: 'Tsahkna Varssavis: Euroopa ja Ukraina tagavad vastastikku teineteise julgeolekut'
text: Täna, 13. oktoobril osales välisminister Margus Tsahkna Varssavi julgeolekufoorumi
  pealaval arutelus liberaalse maailmakorra tuleviku üle. Tsahkna rõhutas, et Euroopa
  julgeolekut ja reeglitel põhinevat maailmakorda kaitstakse praegu Ukrainas ning
  Euroopa peab Ukraina toetamiseks ja Venemaa survestamiseks kasutusele võtma ka seni
  soiku jäänud meetmed.
