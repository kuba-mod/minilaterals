title: Eesti ja Kõrgõzstani poliitilistel konsultatsioonidel keskenduti kahepoolsetele
  suhetele ja piirkondlikule julgeolekule
text: Täna, 8. oktoobril toimusid Tallinnas Eesti ja Kõrgõzstani välisministeeriumide
  poliitilised konsultatsioonid. Kohtumise avas poliitikaküsimuste asekantsler Martin
  Roger ning konsultatsioone juhtis välisministeeriumi Ida-Euroopa ja Kesk-Aasia osakonna
  peadirektor Erika Ellamaa-Ots. Toimus ka töölõuna globaalküsimuste asekantsleri
  Minna-Liina Linnu juhtimisel.
