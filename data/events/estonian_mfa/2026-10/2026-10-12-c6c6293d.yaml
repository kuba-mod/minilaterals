title: Välisministeerium kuulutab välja kolm konkurssi magistritööde stipendiumitele
text: 'Välisministeerium kuulutab välja magistristipendiumite konkursi, et toetada
  noorte teadustegevust Eesti välispoliitika kujundamisel ja arendamisel. Tänavu sügisel
  annab ministeerium välja kokku kuus stipendiumit kolmes valdkonnas: poliitika planeerimine,
  digi- ja küberdiplomaatia ning ühendatus ja kliimadiplomaatia.'
