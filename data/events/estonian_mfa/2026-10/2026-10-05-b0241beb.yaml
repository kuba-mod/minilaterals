title: 'Tsahkna kohtumisel Moldova presidendiga: Moldova julgeolek on Euroopa julgeoleku
  lahutamatu osa'
text: Täna, 5. oktoobril kohtus välisminister Margus Tsahkna Chișinăus Moldova presidendi
  Maia Sandu ja välisminister Mihai Popșoiga. Kohtumistel rõhutas Tsahkna vajadust
  tiheda koostöö järele olukorras, kus Venemaa agressioon mõjutab nii Eesti, Moldova
  kui Euroopa julgeolekut laiemalt.
