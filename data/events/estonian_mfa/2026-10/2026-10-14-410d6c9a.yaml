title: 'Tsahkna kohtumisel Ruttega: kaitseinvesteeringute suurendamine tagab ka tulevikus
  toimiva heidutuse'
text: Täna, 14. oktoobril kohtus välisminister Margus Tsahkna Eestis visiidil viibiva
  NATO peasekretäri Mark Ruttega, kellega arutati NATO Ankara tippkohtumise otsuste
  elluviimist, Ukraina jätkuvat toetamist, regionaalset julgeolekut ja Venemaa sabotaažiakte
  NATO liitlaste vastu.
