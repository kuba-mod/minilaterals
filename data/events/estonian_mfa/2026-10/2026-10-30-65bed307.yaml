title: 'Kübersaadik Helen Popp Tallinna mehhanismi kohtumisel Itaalias: näeme suurenenud
  rahvusvahelist huvi Ukraina kübervastupidavuse toetamise vastu'
text: 29.–30. oktoobril toimus Roomas Itaalia eesistumisel Tallinna mehhanismi korraline
  poolaastakohtumine, kus osalesid mehhanismi liikmesriikide ja vaatlejate esindajad.
  Eestit esindas kohtumisel digi- ja küberdiplomaatia erisaadik Helen Popp koos delegatsiooniga.
  Kohtumisel tervitati muu hulgas Hispaania liitumist mehhanismiga.
