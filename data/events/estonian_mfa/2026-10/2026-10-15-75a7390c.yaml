title: 'Välisminister Tsahkna: ebastabiilsuse eest Mustal merel vastutab Venemaa'
text: Viimase nädala jooksul on vähemalt viit kaubalaeva Mustal merel Rumeenia ja
  Bulgaaria territoriaalvete läheduses tabanud droonirünnakud. Osa laevu on uppunud
  ning mitmed laevameeskondade liikmeid on saanud vigastada, hukkunud või jäänud merel
  kadunuks. Välisminister Margus Tsahkna sõnul on piirkonnas kasvavate pingete ja
  ebastabiilsuse süvenemises ainsana süüdi Venemaa.
