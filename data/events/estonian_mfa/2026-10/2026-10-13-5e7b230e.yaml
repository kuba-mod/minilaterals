title: Välisministeerium eraldab 122 000 eurot humanitaarabiks Süüriale
text: Välisministeerium otsustas täna eraldada strateegilistele humanitaarabipartneritele
  122 478 eurot, et leevendada humanitaarkriisi Süürias ning toetada eelkõige kodumaale
  tagasipöördujaid ja kõige haavatavamaid elanikkonnarühmi.
