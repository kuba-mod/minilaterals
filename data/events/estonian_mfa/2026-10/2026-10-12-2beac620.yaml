title: 'Tsahkna Luxembourgis: EL tugevdab sanktsioonisurvet ligi 1600 Venemaa isiku
  ja üksuse lisamisega sanktsiooninimekirja'
text: Täna, 12. oktoobril osaleb välisminister Margus Tsahkna Euroopa Liidu välisministrite
  kohtumisel Luxembourgis, kus kiideti äsja heaks ligi 1600 Venemaa sõjatööstuskompleksiga
  seotud isiku ja üksuse lisamine sanktsiooninimekirja. Tsahkna sõnul näitab see,
  et Euroopa püsib senisel kursil ja jätkab Venemaa-vastase sanktsioonisurve tugevdamist.
