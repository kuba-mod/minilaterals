title: 'Tsahkna: Iraani seotus Fairfordi juhtumiga puudutab ka Eesti julgeolekut'
text: „Ühendkuningriik on omistanud Iraanile osaluse 27. septembril RAF Fairfordi
  lennubaasi lähistel toimunud juhtumis. Eesti ühineb teiste riikide välisministrite
  ühisavaldusega, milles tunnustame Ühendkuningriigi omistamist ning mõistame hukka
  Iraani vägivaldsed rünnakud ja muu hübriidtegevuse.
