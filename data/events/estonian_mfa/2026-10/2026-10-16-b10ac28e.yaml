title: 'Tsahkna kohtumisel Euroopa Liidu Lähis-Ida rahuprotsessi eriesindajaga: Eesti
  toetab kahe riigi lahendust, mis on ainus tee kestva rahuni'
text: Välisminister Margus Tsahkna kohtus täna, 16. oktoobril Euroopa Liidu Lähis-Ida
  rahuprotsessi eriesindajaga Christophe Bigot’ga. Kohtumisel arutati viimaseid arenguid
  Lähis-Idas, sealhulgas Gaza rahuplaani elluviimist ning olukorda Jordani jõe läänekaldal.
