title: Eesti uus projekt aitab tuua Põhja-Moldovasse rohkem investeeringuid
text: Täna, 6. oktoobril avas välisminister Margus Tsahkna Moldova visiidi käigus
  Eesti Arengukoostöö Keskuse (ESTDEV) ja Tartumaa Arendusseltsi programmi „IMPACT
  North“. Põhja-Moldovas käivitatav uus regionaalarengu programm aitab kohalikel omavalitsustel
  kaasata investeeringuid, hoogustada piirkonna arengut ja toetada Moldova teekonda
  Euroopa Liitu.
