title: Eesti nimetas Gotlandil ametisse uue aukonsuli
text: Neljapäeval, 10. septembril osalesid üleilmse eestluse erivolitustega diplomaatiline
  esindaja Marti Mätas ja Eesti suursaadik Rootsis Margus Laidre Rootsis Ojamaa saarel
  (Gotlandil) Eesti uue aukonsuli Marion Norrby pidulikul ametisse nimetamisel. Ühtlasi
  tänati senist aukonsulit Riina Noodaperat tema pikaajalise panuse eest.
