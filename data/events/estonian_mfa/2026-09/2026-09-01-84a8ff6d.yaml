title: 'Vseviov kohtumisel Iiri Euroopa ministriga: Euroopa vajab suurtele väljakutsetele
  vastavat eelarvet'
text: Täna, 1. septembril kohtus välisministeeriumi kantsler Jonatan Vseviov Dublinis
