title: 'Tsahkna Kiievis: Ukrainat kui Euroopa rindejoont ja kaitsekilpi tuleb talve
  eel maksimaalselt tugevdada'
text: Välisminister Margus Tsahkna juhtis eile, 11. septembril Kiievis Põhjala ja
  Balti riikide koostööformaadi (NB8) esindajate visiiti, mille raames rõhutas vajadust
  eesootava talve eel langetada kiireid otsuseid, mis toetaks Ukraina vastupanu agressorile
  ja võimaldaksid liikuda lähemale õiglasele ja püsivale rahule. Kiievis toimusid
  kohtumised Ukraina asepeaministriga Euroopa Liidu integratsiooni küsimustes Vsevolod
  Tšentsoviga, asevälisministri Oleksandr Mištšenkoga ja Ukraina inimõiguste voliniku
  Dmõtro Lubinetsiga.
