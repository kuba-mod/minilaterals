title: 'Asekantsler Veski CAHDI kohtumisel: Euroopa Nõukogu ja liikmesriigid peavad
  tegema kõik, et agressioonikuriteo eritribunal ning Venemaa tekitatud kahjude hüvitamine
  teoks saaksid'
text: Sel nädalal, 24.-25. septembril, toimus Tallinnas Euroopa Nõukogu rahvusvahelise
  õiguse õigusnõunike komitee (Committee of Legal Advisers on Public International
  Law, CAHDI) kohtumine, mida juhtis välisministeeriumi juriidiliste ja konsulaarküsimuste
  asekantsler Kerli Veski. Kaks korda aastas toimuval kohtumisel arutatakse erinevaid
  rahvusvahelise õiguse päevakajalisi ja regulaarseid küsimusi.
