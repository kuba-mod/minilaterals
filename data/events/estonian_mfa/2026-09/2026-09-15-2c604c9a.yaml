title: 'Välisminister Tsahkna: Leedus alla tulistatud droon kinnitab NATO suutlikkust
  liitlasi kaitsta'
text: Välisminister Margus Tsahkna ütles täna, 15. septembril, et NATO reageeris ööl
  vastu teisipäeva Leedu õhuruumi sisenenud droonile kiiresti ja otsustavalt, kinnitades
  sellega liitlaste valmisolekut ja suutlikkust kaitsta NATO territooriumi.
