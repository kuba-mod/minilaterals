title: 'Tsahkna: Montenegro liikmesus tugevdaks Euroopa Liitu'
text: Välisminister Margus Tsahkna kohtus täna, 14. septembril Tallinnas Montenegro
  Euroopa ministri Maida Gorčevićiga. Kohtumise keskmes oli Montenegro jõudmine Euroopa
  Liitu ja Eesti toetus sellele, et liikmesus saaks teoks võimalikult kiiresti. Samuti
  räägiti olukorrast Lääne-Balkanil, Ukraina toetamisest ning surve suurendamisest
  Venemaale.
