title: 'Välisminister Tsahkna Helsingis: Tallinna-Helsingi tunnel looks lisaks ühendusele
  ka julgeolekukindlust'
text: Täna, 29. septembril viibis välisminister Margus Tsahkna visiidil Helsingis,
  kus ta kohtus Soome välisministri Elina Valtoneniga. Kohtumisel arutati Venemaa
  agressioonisõda Ukrainas, regiooni ja Euroopa julgeolekut, Eesti ja Soome kahepoolseid
  suhteid, majanduskoostööd ning Tallinna-Helsingi tunneli rajamist.
