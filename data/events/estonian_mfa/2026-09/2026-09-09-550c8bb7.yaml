title: Muutused Tai Kuningriiki reisimisel
text: Alates teisipäevast, 15. septembrist 2026 muutuvad Tai Kuningriigis viisavabalt
  viibimise tingimused. Uue korra järgi saavad 60 riigi ja territooriumi, sealhulgas
  Eesti, kodanikud viibida Tai Kuningriigis turismi eesmärgil viisavabalt kuni 30
  päeva.
