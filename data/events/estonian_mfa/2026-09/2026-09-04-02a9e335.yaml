title: Eesti toob tehisaru ja hariduse tuleviku arutelu UNICEFi täitevnõukogusse
text: Sel nädalal, 3.–4. septembril viibis välisministeeriumi välismajanduse ja arengukoostööküsimuste
  asekantsler Mariin Ratnik New Yorgis, kus toimus Eesti eestvedamisel ÜRO Lastefondi
  (UNICEF) täitevnõukogu erisessioon. Arutelu keskmes oli tehisaru, digilahenduste
  ja tehnoloogia sügavam lõimimine haridusvaldkonnaga. Eesti juhib 2026. aastal UNICEFi
  täitevnõukogu tööd ning selle president on Eesti alaline esindaja ÜRO juures suursaadik
  Rein Tammsaar.
