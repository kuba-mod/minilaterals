title: 'Välisminister Tsahkna maailmakoristuspäeval: Venemaa peab Ukrainas põhjustatud
  keskkonnakahjude eest vastutama'
text: Täna, 20. septembril tähistatakse rahvusvahelist maailmakoristuspäeva, mis on
  juba kolmandat aastat ametlik ÜRO tähtpäev. Tänavuse maailmakoristuspäeva fookuses
  on toiduraiskamise vähendamine ja teadlikkuse suurendamine. Päeva puhul toimus Tallinnas
  Linnahalli juures välisministeeriumi ja diplomaatilise korpuse ühine koristusaktsioon.
