title: Välisministeerium kutsus Milrem Roboticsi vastase sabotaažiakti tõttu välja
  Venemaa saatkonna ajutise asjuri
text: Eesti välisministeerium kutsus täna, 29. septembril välja Venemaa Föderatsiooni
  saatkonna ajutise asjuri, et väljendada tugevat hukkamõistu möödunud kuul kaitsetööstusettevõtte
  Milrem Roboticsi vastu toime pandud süütamisele. Kaitsepolitseiameti kogutud andmete
  kohaselt oli tegemist Venemaa Föderatsiooni tellitud sabotaažiaktiga.
