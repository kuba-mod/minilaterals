title: Välisminister Margus Tsahkna osaleb New Yorgis ÜRO Peaassamblee 81. istungjärgu
  kõrgetasemelisel nädalal
text: 21.–24. septembril osaleb välisminister Margus Tsahkna New Yorgis ÜRO Peaassamblee
  81. istungjärgu kõrgetasemelisel nädalal, kus Eesti tänavusteks fookusteemadeks
  on toetuse tõstmine Ukrainale ja surve suurendamine Venemaale ning tegutsemine ÜRO
  tugevdamiseks ja organisatsiooni mõjukuse suurendamiseks. Eesti delegatsiooni juhib
  president Alar Karis.
