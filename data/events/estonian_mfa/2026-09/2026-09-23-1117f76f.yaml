title: 'Tsahkna New Yorgis: Venemaa agressioon seab ohtu ülemaailmse toidujulgeoleku'
text: Välisminister Margus Tsahkna rõhutas eile, 22. septembril New Yorgis ÜRO kõrgetasemelise
  nädala raames toimunud Musta mere ja globaalse toidujulgeoleku teemalisel kohtumisel,
  et Venemaa sõda Ukraina vastu on muutnud Musta mere sõjatandriks ning seadnud ohtu
  miljonite inimeste toiduga varustamise üle maailma.
