title: 'Välisminister Tsahkna: Fitburgi juhtumi uurimine näitab, et kriitilise taristu
  kahjustamisse suhtutakse täie tõsidusega'
text: Välisminister Margus Tsahkna sõnul näitab Fitburgi juhtumi jõudmine kohtusse,
  et Läänemereäärsed riigid suhtuvad kriitilise taristu kahjustamise juhtumitesse
  täie tõsidusega, neid uuritakse ja tehakse kõik selleks, et süüdlased vastutusele
  võtta.
