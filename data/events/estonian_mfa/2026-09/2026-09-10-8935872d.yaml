title: 'Tsahkna: Eesti sadamatest ei saa Vene vilja uut väljaveoteed'
text: Välisminister Margus Tsahkna sõnul on Venemaa teravilja transiit Eesti kaudu
  praegu sisuliselt olematu – ja nii peab see ka jääma. Venemaa otsib Musta mere asemel
  oma viljale uusi väljaveoteid ning Eesti on valmis astuma samme, et transiit siia
  ei liiguks.
