title: Valitsus toetab Euroopa Liidu ja Indoneesia majanduspartnerluslepingu sõlmimist
text: Täna, 24. septembril otsustas valitsus toetada Euroopa Liidu ja Indoneesia laiaulatusliku
  majanduspartnerluslepingu ning investeeringute kaitse lepingu allkirjastamist. Lepingud
  avavad Eesti ettevõtetele ukse enam kui 280 miljoni elanikuga turule.
