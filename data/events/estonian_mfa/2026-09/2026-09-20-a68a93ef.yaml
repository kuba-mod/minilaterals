title: 'Välisminister Tsahkna Venemaa riigiduuma valimistest: tegemist on Putini võimu
  kinnistamise poliitilise etendusega'
text: 'Välisminister Margus Tsahkna rõhutas seoses Venemaa riigiduuma valimistega,
  et Eesti hinnang neile on jätkuvalt sama: tegemist ei ole vabade ega ausate valimistega.
  Nende ainus eesmärk on kindlustada Vladimir Putini võimu ja luua illusioon demokraatliku
  protsessi toimimisest.'
