title: 'Tsahkna komisjoni presidendi aastakõnest: Eesti toetab geopoliitiliselt tugevama
  Euroopa kujundamist'
text: Välisminister Margus Tsahkna ütles täna, 16. septembril, et Euroopa Komisjoni
  president Ursula von der Leyen rõhutas oma tänavuses aastakõnes julgeoleku- ja kaitsevaldkonna
  tähtsust ning vajadust kujundada Euroopast senisest tugevam geopoliitiline tegija.
  Välisministri sõnul oleks ta oodanud siiski tugevamaid sõnumeid selle kohta, kuidas
  Ukrainat konkreetselt karmi talve eel majanduslikult toetada, kuidas suurendada
  survet Venemaale, et saavutada kiiresti õiglane ja püsiv rahu, ning kuidas kindlustada
  Euroopa pikaajaline julgeolek sõja järel.
