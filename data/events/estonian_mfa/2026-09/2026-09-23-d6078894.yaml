title: 'Tsahkna New Yorgis: Kanada ja NB8 tugevdavad ühiselt atlandiülest julgeolekut'
text: Eile, 22. septembril korraldasid Eesti välisminister Margus Tsahkna ja Kanada
  välisminister Anita Anand New Yorgis Põhjala ja Balti riikide koostööformaadi (NB8)
  ja Kanada välisministrite kohtumise, kus arutasid ühise julgeoleku, Ukraina toetamise,
  Venemaa survestamise ja majanduskoostööga seotud teemasid.
