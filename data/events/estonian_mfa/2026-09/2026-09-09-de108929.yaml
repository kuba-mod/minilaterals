title: 'Tsahkna: Eesti ja Iirimaa süvendavad koostööd Ukraina toetamisel'
text: Välisminister Margus Tsahkna kohtus täna, 9. septembril Tallinnas Iirimaa välis-,
  kaitse- ja väliskaubandusministri Helen McEnteega. Kohtumise keskmes olid Ukraina
  toetuse suurendamine, Venemaale tugevama surve avaldamine, sealhulgas täiendavad
  majandussanktsioonid ja külmutatud Vene varade kasutamine Ukraina toetuseks, ning
  Euroopa julgeoleku ja kaitsevõime tugevdamine. Ministrid allkirjastasid ühiste kavatsuste
  avalduse, millega Iirimaa eraldab miljon eurot Eesti juhitavale tervishoiu- ja haridusprojektile
  Ukrainas. Samuti arutati Iirimaa Euroopa Liidu Nõukogu eesistumist ja kahepoolseid
  suhteid.
