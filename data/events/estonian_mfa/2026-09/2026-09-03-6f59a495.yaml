title: Välisministeerium kutsus välja Venemaa saatkonna ajutise asjuri seoses Leipzigi
  lennujaama droonirünnakuga
text: Eesti välisministeerium kutsus täna, 3. septembril välja Venemaa Föderatsiooni
  ajutise asjuri, et väljendada tugevat hukkamõistu möödunud kuu Leipzigi lennujaama
  droonirünnakule, mille Saksamaa ametivõimud omistasid Venemaale.
