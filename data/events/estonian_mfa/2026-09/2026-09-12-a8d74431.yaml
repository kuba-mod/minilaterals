title: 'Tsahkna Kiievis YES konverentsil: Tugeva Euroopa vundament on Ukraina toetamine
  ja julgus Venemaale vastu seista'
text: Välisminister Margus Tsahkna esines reedel, 11. septembril Kiievis Jalta Euroopa
  Strateegia konverentsi avavestlusringis, kus arutati Venemaa agressioonisõja lõpetamist.
  Tsahkna rõhutas, et õiglase ja püsiva rahu saavutamiseks ei ole paremat valemit
  kui Ukraina jätkuv toetamine, Venemaa survestamine ja Venemaale näitamine, et Euroopa
  püsib kindlameelselt senisel rajal.
