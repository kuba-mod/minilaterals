title: Täna Eesti toel avatud hariduskeskused annavad tuhandetele Ukraina lastele
  ja õpetajatele võimaluse ehitada tulevikku
text: Täna, 12. septembril avasid välisminister Margus Tsahkna ja ESTDEVi tegevjuht
  Andrea Kivi Ukrainas Zõtomõri oblastis Eesti toel valminud Malõni huvikooli ja Žõtomõri
  alushariduse kompetentsikeskuse EDUHUB. Nende kahe projekti kaudu toetab Eesti nii
  sõjas kannatada saanud haridustaristu taastamist kui ka õpetajate ja haridussüsteemi
  arengut.
