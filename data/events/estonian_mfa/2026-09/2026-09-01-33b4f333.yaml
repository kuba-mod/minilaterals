title: 'Välisminister Tsahkna: Leipzigi juhtum tõestab Venemaast lähtuvat ohtu kogu
  Euroopale'
text: Välisminister Margus Tsahkna ütles täna, 1. septembril, et Saksamaa võimude
  teade Venemaa otsesest seotusest 4. augustil aset leidnud Leipzigi lennujaama droonijuhtumiga
  kinnitab Venemaa üha jultunumat ja ohtlikumat tegutsemist Euroopas. Eesti toetab
  kõiki Saksamaa vastusamme.
