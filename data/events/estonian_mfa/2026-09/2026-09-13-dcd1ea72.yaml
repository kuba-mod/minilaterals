title: 'Tsahkna kohtumisel Sõbihaga: kiire rahaline abi võimaldaks Ukrainal tugevdada
  süvalöökidega survet Venemaale'
text: Välisminister Margus Tsahkna kohtus täna, 13. septembril Kiievis oma Ukraina
  kolleegi Andri Sõbihaga, et arutada Ukraina kõige pakilisemaid vajadusi talveks
  valmistumisel ja surve tõstmist Venemaale Ukraina süvalöökide abil.
