title: 'Välisminister Tsahkna: sanktsioonipaketi eelnõu heakskiitmine USA kongressis
  võimaldab suurendada survet Venemaale'
text: Välisminister Margus Tsahkna sõnul on sanktsioonisurve suurendamine Venemaale
  üks olulisem vahend õiglase ja püsiva rahu saavutamiseks ning seetõttu on senaatorite
  Richard Blumenthali ja hiljuti lahkunud Lindsey Grahami Venemaa-vastase sanktsioonipaketi
  eelnõu heakskiitmine Ameerika Ühendriikide kongressis väga tervitatav samm.
