title: 'Asekantsler Lind Torontos: iga küüditatud Ukraina laps tuleb turvaliselt koju
  tuua'
text: Sel nädalal, 28.–29. septembril viibis välisministeeriumi globaalküsimuste asekantsler
  Minna-Liina Lind Torontos ja osales teisel rahvusvahelisel konverentsil, mis keskendus
  Venemaa poolt ebaseaduslikult küüditatud Ukraina laste, ümberasustatud inimeste,
  kinnipeetud tsiviilisikute ja sõjavangide toetamisele ning nende tagasitoomisele.
