title: Eesti suursaadik Aino Lepik von Wirén valiti agressioonikuriteo eritribunali
  töörühma juhiks
text: Täna, 9. septembril valiti Eesti alaline esindaja Euroopa Nõukogu juures suursaadik
  Aino Lepik von Wirén Euroopa Nõukogu ministrite asemike komitee (MAK) istungil Ukraina
  vastu toime pandud agressioonikuriteo eritribunali töörühma juhiks.
