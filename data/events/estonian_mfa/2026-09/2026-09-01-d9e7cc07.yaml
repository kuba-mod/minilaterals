title: 'Välisminister Tsahkna tarkusepäeval: Ukraina lastel peab olema Putini agressioonist
  hoolimata võimalus haridusele'
text: Täna, 1. septembril tähistatakse ülemaailmset tarkusepäeva ning Eestis algab
  uus kooliaasta. Välisminister Margus Tsahkna sõnul tuletab päev meelde, et hariduse
  kättesaadavus on ühtaegu sotsiaalne väärtus ja julgeolekuküsimus – eriti olukorras,
  kus Ukraina lapsed ja täiskasvanud peavad jätkama õpinguid sõja keskel.
