title: 'Tsahkna: Euroopa Liit pikendas isikuvastaste sanktsioonide kehtivust kolmele
  aastale'
text: Täna, 22. septembril leppisid Euroopa Liidu liikmesriigid kokku ligi 3000 Venemaa
  agressiooniga seotud inimese ja üksuse suhtes kehtestatud sanktsioonide pikendamises
  senise kuue kuu asemel kolmeks aastaks. Kokkuleppe saavutamiseks nimekirjast poliitilistel
  põhjustel eemaldatud Venemaa ärimeeste Ališer Usmanovi ja Mihhail Fridmani suhtes
  kehtestab Eesti riiklikud sanktsioonid.
