title: 'Välisminister Tsahkna: Eesti on Venemaa hübriidrünnakutele keeruline sihtmärk'
text: Välisminister Margus Tsahkna ütles täna, 29. septembril, et Milrem Roboticsi
  süütamisjuhtum tõestab, et Eesti on Venemaa jaoks sabotaažiaktide toimepanekuks
  keeruline sihtmärk, sest meie julgeolekuasutused töötavad riigi julgeoleku tagamisel
  otsustavalt ja tõhusalt. Välisministri sõnul kutsub välisministeerium täna välja
  Venemaa ajutise asjuri.
