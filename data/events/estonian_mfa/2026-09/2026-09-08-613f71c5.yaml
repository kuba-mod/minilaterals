title: 'Tsahkna: Madalmaade panus meie regiooni julgeolekusse on ülioluline'
text: Välisminister Margus Tsahkna kohtus täna, 8. septembril Tallinnas Eestisse visiidile
  saabunud Madalmaade välisministri Tom Berendseniga, kellega arutati Eesti ja Madalmaade
  kahepoolseid suhteid, Ukraina toetamist ning Euroopa julgeoleku ja kaitse tugevdamist.
