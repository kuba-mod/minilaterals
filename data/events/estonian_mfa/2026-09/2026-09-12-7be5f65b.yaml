title: 'Kübersaadik Helen Popp Washingtonis: Eesti ja USA otsivad võimalusi küberkaitsekoostöö süvendamiseks'
text: Eesti digi- ja küberküsimuste erivolitustega diplomaatiline esindaja Helen Popp
  viibis 7.–10. septembril visiidil Washingtonis, kus ta kõneles Billingtoni küberjulgeoleku
  konverentsil ja Allied Forumi küberliidrite ümarlaual. Ühtlasi kohtus Popp USA riikliku
  küberturvalisuse direktori, Valge Maja riikliku julgeolekunõukogu ekspertide ja
  USA välisministeeriumi kübersaadikuga.
