title: 'Välisminister Tsahkna Riias: Vene vilja transiidi peatamine peab olema Balti
  riikide ühine jõupingutus'
text: Täna, 30. septembril kohtus välisminister Margus Tsahkna Riias Läti presidendi
  Edgars Rinkēvičsi ja välisministri Baiba Bražega. Kohtumistel keskenduti Euroopa
  julgeolekule, Ukraina toetamisele ja Venemaa survestamisele ning piirkonna konkurentsivõime
  ja ühenduste tugevdamisele. Visiidi käigus külastati ka Baltimaade suurimat drooniharjutuskeskust
  ja anti üle Eesti-Läti keeleauhind.
