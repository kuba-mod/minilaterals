title: 'Asekantsler Ratnik Brüsselis: Ukraina toetamist tuleb jätkata kõigi võimalike
  vahenditega'
text: Eile, 29. septembril viibis välisministeeriumi välismajanduse ja arengukoostöö
  küsimuste asekantsler Mariin Ratnik Brüsselis, kus toimus G7+ Ukraina doonorplatvormi
  (UDP) juhtkomitee mitteametlik kohtumine. Eesti osales kohtumisel esimest korda
  ajutise liikmena kui 2027. aasta Ukraina ülesehituskonverentsi korraldaja.
