title: 'Kantsler Vseviov Gymnichil: Venemaa tegevusele Euroopas tuleb vastata Ukraina
  toetamise ja surve suurendamisega'
text: Välisministeeriumi kantsler Jonatan Vseviov osales 1.–2. septembril Iirimaal
  Wicklow’s toimunud Euroopa Liidu välisministrite mitteametlikul kohtumisel, kus
  arutati Venemaa agressiooni Ukraina vastu, olukorda Lähis-Idas ja Euroopa Liidu
  välispoliitika tugevdamist.
