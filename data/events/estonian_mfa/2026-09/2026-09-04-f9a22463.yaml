title: 'Välisminister Tsahkna kohtumisel linnapea Raudsepaga: Tallinn-Helsingi tunneliprojekt
  tugevdaks kogu Põhjala Balti regiooni julgeolekut'
text: Täna, 4. septembril kohtus välisminister Margus Tsahkna Tallinna linnapea Peeter
  Raudsepaga, et arutada Tallinn-Helsingi tunneli projekti ja selle strateegilist
  mõju Eestile, Soomele ning laiemale Põhjala Balti piirkonnale.
