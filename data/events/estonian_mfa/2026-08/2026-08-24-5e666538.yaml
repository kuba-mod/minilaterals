title: Välisminister Tsahkna arutas Läti ja Leedu justiitsministritega Venemaa vastutusele
  võtmist
text: Välisminister Margus Tsahkna kohtus täna, 24. augustil Tallinnas Läti justiitsministri
  Edvards Smiltēnsi ja Leedu justiitsministri Rita Tamašunienėga. Kohtumise keskmes
  oli Venemaa vastutusele võtmine Ukraina-vastase agressiooni ja rahvusvaheliste kuritegude
  eest, mis ei tohi jääda karistuseta. Samuti räägiti rändega seotud küsimustest ning
  piirkonda ühendavatest projektidest, sealhulgas Rail Balticust.
