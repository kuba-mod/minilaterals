title: 'Uuring: välispoliitilistest suundadest on Eesti elanikkonnale olulisimad regionaalne
  koostöö, NATO kollektiivkaitse ja Eesti ettevõtete toetamine välisturgudel'
text: 'Täna avaldas välisministeerium järjekorras kolmanda avaliku arvamuse uuringu
  elanikkonna suhtumisest välispoliitilistesse teemadesse. Kolm kõige olulisemat suunda
  on uuringu järgi pea võrdselt: regionaalse koostöö tugevdamine Põhjamaade ja Balti
  riikidega (37% vastanutest), NATO kollektiivkaitse tugevdamine (36%) ja Eesti ettevõtetele
  võimaluste loomine välisturgudel (36%). Järgmiste prioriteetsete suundadena märgiti
  Ukraina toetamist (22%) ja Eestile oluliste väärtuste (inimõigused, demokraatia,
  sõnavabadus) edendamist maailmas (21%).'
