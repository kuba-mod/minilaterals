title: 'Kantsler Vseviov üleilmsetele Eesti noortele: „Teie olete osa meist“'
text: Ligi 50 Eesti juurtega noort enam kui 20 riigist veetsid möödunud nädala Eestis,
  osaledes esimeses Global Estoniani noorsaadikute suvekoolis, mille korraldas välisministeerium
  koostöös Vabamuga. Suvekooli eesmärk oli tugevdada noorte sidet Eestiga ning tutvustada
  neile tänapäeva Eestit, selle ühiskonda ja võimalusi.
