title: 'Välisminister Tsahkna: Eesti töötas mullu julgeoleku kindlustamise ja rahvusvahelise
  mõju kasvatamise nimel'
text: Välisministeeriumi 2025. aasta tegevuste raporti põhjal olid mullused olulisemad
  välispoliitilised saavutused NATO liitlaste kokkulepe tõsta kaitsekulutuste sihttase
  5 protsendini SKP-st, NATO artikkel 4 konsultatsioonid ja ÜRO Julgeolekunõukogu
  istung Eesti õhupiiri rikkumise järel, Venemaa-vastaste sanktsioonide ja varilaevastiku
  vastaste meetmete tugevdamine, Eesti valimine ÜRO Inimõiguste Nõukogusse ning enam
  kui tuhande Eesti ettevõtte toetamine välisturgudel.
