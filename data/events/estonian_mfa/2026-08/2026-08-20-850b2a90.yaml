title: 'Välisminister Margus Tsahkna: 35 aastat iseseisvuse taastamisest tuletab meelde,
  et vabadus on väärtus, mida tuleb kaitsta iga päev'
text: Täna, 35 aastat tagasi, 20. augustil 1991, taastas Eesti oma iseseisvuse. 69
  Ülemnõukogu saadiku otsus avas meile taas tee vabade riikide hulka ja andis võimaluse
  ehitada oma riiki üles nii, nagu meie inimesed seda näevad.
