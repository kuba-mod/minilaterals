title: 'Välisminister Tsahkna: anname endast kõik, et Nepalis kadunuks jäänud Eesti
  kodanikud üles leida'
text: Välisministeeriumi info kohaselt on Nepali ulatuslike üleujutuste tagajärjel
  kadunute seas ka kaks Eesti kodanikku. Välisminister Margus Tsahkna kinnitas, et
  ministeerium teeb kõik, et kadunud inimesed üles leida ja turvalisusse tuua.
