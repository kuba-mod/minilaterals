title: 'Tsahkna kohtumisel Costaga: ettevõtlus, konkurentsivõime ja julgeolek moodustavad
  tugeva Euroopa vundamendi'
text: Välisminister Margus Tsahkna kohtus täna, 25. augustil Eestis visiidil viibiva
  Euroopa Ülemkogu eesistuja António Costaga. Ühiselt osaleti välisministeeriumi esindusjuhtide
  ja partnerite kohtumisel, kus arutati Euroopa ees seisvaid väljakutseid, konkurentsivõime
  tugevdamist ja Euroopa Liidu tulevikku.
