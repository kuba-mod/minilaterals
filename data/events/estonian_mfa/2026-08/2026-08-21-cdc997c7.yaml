title: 'Välisminister Tsahkna: Toronto KESKUS tõestab väliseestluse elujõulisust'
text: Välisminister Margus Tsahkna sõnul on eile, 20. augustil Kanadas Torontos avatud
  rahvusvaheline Eesti KESKUS selge märk väliseestluse elujõulisusest, väliseesti
  kogukonna tahtest hoida ja edendada eesti keelt, kultuuri ja sidet Eestiga. Tegemist
  on viimase poole sajandi suurima väliseestlaste projektiga.
