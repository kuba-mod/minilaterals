title: 'Välisminister Tsahkna: uuenenud Islandi väljak aitab meeles pidada väikeriikide
  võimet määrata ajaloo kulgu'
text: Välisminister Margus Tsahkna ütles täna, 21. augustil Islandi presidendi riigivisiidi
  raames toimunud uuenenud Islandi väljaku avamisel, et Islandi julge otsus tunnustada
  1991. aastal esimese riigina Eesti iseseisvuse taastamist püsib eeskujuna sellest,
  kuidas väikeriik võib õigel hetkel tehtud julge otsusega olla eeskujuks ja mõjutada
  ajaloo kulgu.
