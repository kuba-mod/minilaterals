title: 'Välisminister Tsahkna: Eesti toetab ELi kaubandussoodustusi Armeenia päritolu
  toodetele'
text: Eesti valitsus otsustas täna, 13. augustil toetada Euroopa Liidu määrust, millega
  võimaldatakse Armeenia päritolu toodetele ajutisi kaubandussoodustusi ELi turule
  sisenemiseks. Välisminister Margus Tsahkna sõnul võimaldab määrus ELil toetada Armeeniat
  olukorras, kus Venemaa kasutab ulatuslikke majandussanktsioone eesmärgiga pidurdada
  riigi lähenemist ELile, takistada rahuprotsessi Aserbaidžaaniga ning suurendada
  sisepoliitilist survet.
