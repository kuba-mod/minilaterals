title: Eesti toetab Ukraina elanike talveks valmistumist 340 000 euroga
text: Nagu varasematel sõja-aastatel, toetab Eesti ka sel aastal Ukrainat talveks
  valmistumisel humanitaarabiga. Välisministeerium eraldab 340 000 eurot selleks,
  et aidata rindejoone lähedal elavatel inimestel tulla toime Venemaa jätkuvatest
  rünnakutest põhjustatud energiataristu kahjustustega.
