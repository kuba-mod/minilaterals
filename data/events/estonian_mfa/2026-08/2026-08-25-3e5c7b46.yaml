title: Välisministeerium ja EIS avavad ettevõtjatele ekspordiportaali
text: Täna, 25. augustil koguneb Tallinnas kuuendat korda traditsiooniline esindusjuhtide
  ekspordiklubi, mis toob kokku Eesti suursaadikud kogu maailmast ning mitusada eksportivat
  Eesti ettevõtjat. Ekspordiklubis tutvustavad välisministeerium ja Ettevõtluse ja
  Innovatsiooni Sihtasutus (EIS) ettevõtjatele ekspordiportaali, mis koondab seni
  eri kanalites paiknenud eksporditeenused, sihtturgude info ja sündmused ühte keskkonda.
