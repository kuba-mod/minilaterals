title: 'Välisminister Tsahkna suursaadikutele: tuleviku Euroopa kujundamine on meie
  endi kätes'
text: Täna, 24. augustil algas Eesti välisesinduste juhtide konverents, mis toob Tallinnasse
  Eesti suursaatkondade ja esinduste juhid kogu maailmast. Välisminister Margus Tsahkna
  tänas konverentsi avakõnes suursaadikuid pühendumise ning Eesti julgeoleku, heaolu
  ja huvide kaitsmise eest. Ühtlasi kõneles välisminister Eesti prioriteetidest algaval
  välispoliitikahooajal.
