title: Arvamusfestivali välispoliitika alal arutletakse Eesti julgeoleku ja rahvusvaheliste
  väljakutsete üle
text: 8. augustil keskenduvad Paides arvamusfestivali välispoliitika ala arutelud
  sellele, kuidas rahvusvahelised kriisid mõjutavad Eesti julgeolekut ja inimeste
  igapäevaelu ning milline on Eesti roll Ukraina toetamisel, rahvusvahelise õiguse
  kaitsmisel, inimõiguste edendamisel ja demokraatia tugevdamisel. Päev varem, 7.
  augustil, toimub koostöös Euroopa Komisjoni Eesti esindusega arutelu Euroopa Liidu
  laienemise tulevikust.
