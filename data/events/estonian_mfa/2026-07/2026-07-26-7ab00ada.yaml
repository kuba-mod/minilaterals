title: Global Estonian noorsaadikute suvekool toob Eestisse ligi 50 väliseesti noort
  enam kui 20 riigist
text: Täna algab Eestis esimest korda Global Estonian noorsaadikute suvekool, mis
  toob nädalaks kokku ligi 50 Eesti juurtega noort enam kui 20 riigist. Suvekooli
  korraldab välisministeerium koostöös Vabamuga.
