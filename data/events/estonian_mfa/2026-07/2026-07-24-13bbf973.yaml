title: 'Asekantsler Martin Roger: USA Kongressi toetus on aidanud tugevdada Eesti
  julgeolekut'
text: Välisministeeriumi poliitikaküsimuste asekantsler Martin Roger kohtus 24. juulil
  Eestis visiidil viibiva Ameerika Ühendriikide Kongressi delegatsiooniga, kuhu kuuluvad
  esindajatekoja kaitsevaldkonna teemadega tegelevad rahvaesindajad Ken Calvert, Betty
  McCollum, Jake Ellzey, John Rutherford, Scott Franklin, Nick LaLota ning Norma Torres.
  Kohtumisel olid kõne all piirkonna julgeolekuolukord, NATO heidutus- ja kaitsevõime
  tugevdamine ning atlandiüleste suhete tugevdamine, sh Eesti-USA kahepoolne koostöö.
