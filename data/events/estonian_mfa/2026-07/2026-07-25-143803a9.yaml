title: 'Asekantsler Minna-Liina Lind Paapua Uus-Guineas: laiendame küber- ja digikoostööd
  Vaikse ookeani piirkonnaga'
text: Välisministeeriumi globaalküsimuste asekantsler Minna-Liina Lind viibis 20.–23.
  juulil visiidil Paapua Uus-Guineas, kus ta osales Pacific Cyber Week’il, mis on
  Vaikse ookeani piirkonna küberjulgeoleku keskne kohtumisformaat. Paralleelselt toimus
  Pacific Islands Forumi IKT-ministrite kohtumine, mille raames toimusid kohtumised
  regiooni digiministrite ja teiste kõrgetasemeliste ametnikega ning Paapua Uus-Guinea
  välisministeeriumi kantsleriga, et tutvustada Nele Leoski kampaaniat Rahvusvahelise
  Telekommunikatsiooni Liidu arengusuuna büroodirektori kohale.
