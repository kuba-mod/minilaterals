title: 'Välisminister Tsahkna: Venemaa ulatuslike raketirünnakute käigus sai tabamuse
  Läti aukonsulaat'
text: Täna, 24. juuli hommikul korraldas Venemaa ulatusliku raketirünnaku mitmete
  Ukraina linnade vastu. Rünnakutes Kiievi vastu on praeguse seisuga hukkunud vähemalt
  kuus inimest ning vigastada saanud kümneid. Slovjanski pommitamises hukkus viis
  inimest ja vigastada sai üheksa. Raketitabamuse sai ka Läti aukonsulaat Slovjanskis.
