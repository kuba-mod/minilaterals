title: 'Tsahkna: liikmesriigid peavad Venemaa mõjutustest vabanemiseks investeeringute
  kaitse lepingud lõpetama'
text: Eile, 2. novembril saatsid Eesti, Läti, Leedu ja Poola Euroopa Komisjonile ühisavalduse
  üleskutsega lõpetada investeeringute kaitse lepingud, mis 17-l Euroopa Liidu liikmesriigil
  Venemaaga tänaseni kehtivad.
