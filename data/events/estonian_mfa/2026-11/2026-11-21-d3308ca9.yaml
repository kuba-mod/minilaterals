title: Asekantsler Roger osales Washingtonis USA ning Põhjala ja Balti riikide poliitilistel
  konsultatsioonidel
text: Välisministeeriumi poliitikaküsimuste asekantsler Martin Roger viibis 18.–20.
  novembril Washingtonis, kus osales USA ning Põhjala ja Balti riikide poliitilistel
  konsultatsioonidel E-PINE koostööformaadis (Enhanced Partnership in Northern Europe).
