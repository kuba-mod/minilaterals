title: 'Arktika erisaadik Toomas Lukk polaarkonverentsil: Eesti julgeolek on otseselt
  seotud arengutega Arktikas'
text: 'Täna, 27. novembril toimus läheneva rahvusvahelise Antarktika päeva eel Eesti
  Teaduste Akadeemias rahvusvaheline polaarkonverents „Governance in the Cold: Science
  and Geopolitics in Arctic and Antarctic Decision-Making“, mille korraldasid Välisministeerium,
  Eesti Teaduste Akadeemia, Eesti Polaarklubi ja Kliimaministeerium.'
