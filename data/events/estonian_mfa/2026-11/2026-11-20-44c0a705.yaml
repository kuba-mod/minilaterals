title: Välisministeerium kutsus välja Venemaa ajutise asjuri
text: Eesti välisministeerium kutsus täna, 20. novembril välja Venemaa Föderatsiooni
  ajutise asjuri. Välisministeeriumi esindajad väljendasid tugevat hukkamõistu Venemaa
  viimaste päevade ulatuslikele raketi- ja droonirünnakutele Kiievi vastu, mistõttu
  said eile kahjustada mitme Euroopa riigi diplomaatilised esindused, sealhulgas Austria
  ja Madalmaade saatkonnahooned.
