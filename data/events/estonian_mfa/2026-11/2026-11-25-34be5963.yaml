title: 'Välisministeerium: meie ühine eesmärk peaks olema ühiskond, kus seksuaalvägivald
  on mõeldamatu'
text: Täna, 25. novembril tähistatakse rahvusvahelist naistevastase vägivalla vastu
  võitlemise päeva. Välisministeeriumis toimunud üritusel rõhutas kantsleri kohusetäitja
  Rasmus Lumi, et naistevastane vägivald on üks levinumaid inimõiguste rikkumisi maailmas
  ning selle lõpetamine nõuab nii riikide kui ka kogu ühiskonna panust.
