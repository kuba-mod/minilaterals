title: 'Välisminister Tsahkna Tallinn Digital Summitil: Eesti jaoks tähendab digitaalne
  suveräänsus valikuvabadust, mitte isolatsiooni'
text: Välisminister Margus Tsahkna esines täna, 5. novembril konverentsil Tallinn
  Digital Summit. Ühtlasi kohtus välisminister konverentsil OECD peasekretäri Mathias
  Cormanniga. Tänavuse konverentsi keskmes on tehisaru ja agentne riik, sealhulgas
  tehisintellekti, digiriigi, küberturvalisuse mõju ühiskonnale.
