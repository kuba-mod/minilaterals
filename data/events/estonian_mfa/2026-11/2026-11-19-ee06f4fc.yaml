title: 'Tsahkna Briti parlamendiliikmetele: Venemaa ründab Euroopat juba praegu ning
  sellele tuleb ühiselt vastata'
text: Välisminister Margus Tsahkna kohtus 19. novembril Tallinnas Ühendkuningriigi
  parlamendi väliskomisjoni delegatsiooniga, mida juhtis komisjoni esimees Emily Thornberry.
  Kohtumisel arutati Venemaast lähtuvaid julgeolekuohte, Ukraina toetamist ning Eesti
  ja Ühendkuningriigi kaitsekoostööd.
