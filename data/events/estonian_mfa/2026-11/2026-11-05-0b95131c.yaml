title: 'Välisminister Tsahkna: Fitburgi meeskonnaliikmete süüdimõistmine näitab, et
  kriitilise taristu kahjustamine ei jää karistuseta'
text: Välisminister Margus Tsahkna sõnul näitab tänane Helsingi esimese astme kohtu
  otsus, millega mõisteti süüdi kaubalaeva Fitburg kapten ja pootsman Eesti ja Soome
  vaheliste sidekaablite kahjustamise eest, et kriitilise taristu kahjustamise juhtumeid
  uuritakse põhjalikult ning nende toimepanijad võetakse vastutusele.
