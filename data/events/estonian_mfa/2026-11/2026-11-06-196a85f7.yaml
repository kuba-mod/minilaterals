title: 'Tsahkna Varssavis: Ukrainas saavutatav rahu peab tagama Euroopa pikaajalise
  julgeoleku'
text: Välisminister Margus Tsahkna osales täna, 6. novembril Varssavis toimunud Läänemeremaade
  Nõukogu kohtumisel, kus Ukraina tugevamad toetajad arutasid järgmisi samme Venemaa
  survestamiseks ja Ukraina toetamiseks enne saabuvat talve ning arenguid rahuläbirääkimistel.
  Kohtumisel osalesid ka Ukraina välisminister Andri Sõbiha ning Euroopa Liidu välisasjade
  ja julgeolekupoliitika kõrge esindaja Kaja Kallas.
