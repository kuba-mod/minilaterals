title: Välisministeeriumi kultuuripreemia pälvis tänavu Duo Ruut
text: Välisminister Margus Tsahkna andis täna, 20. novembril välisministeeriumi kultuuripreemia
  üle Duo Ruudu muusikutele Ann-Lisett Rebasele ja Katariina Kivile. 2015. aastal
  asutatud pärimusmuusika töötlusi esitava duo looming on jõudnud kuulajateni enam
  kui 30 riigis.
