title: 'Välisminister Tsahkna: ei Eesti ega Euroopa hakka Putiniga arutama Soome lahkumist
  NATOst'
text: On hea, et Euroopa on jõudnud üksmeelele küsimuses, kes esindab läbirääkimistel.
  Kuid Venemaa poolt 2021. aastal esitatud ultimaatumite kordamine näitab taas, et
  Moskva ei ole oma eesmärke muutnud. Ei Eesti ega Euroopa hakka kunagi Putiniga arutama
  Soome lahkumist NATOst ega muid küsimusi, mis puudutavad Euroopa riikide suveräänseid
  julgeolekuvalikuid. Euroopa julgeoleku üle otsustavad Euroopa riigid ise, mitte
  Venemaa.
