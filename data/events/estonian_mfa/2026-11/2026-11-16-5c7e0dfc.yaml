title: 'Tsahkna Brüsselis: EL lisas sanktsiooninimekirja ligi 150 isikut ja üksust,
  kuid Venemaa survestamist tuleb jätkata'
text: Täna, 16. novembril kiitsid Euroopa Liidu välisministrid Brüsselis heaks ligi
  150 isiku ja üksuse lisamise Venemaa-vastastesse sanktsiooninimekirjadesse. Välisminister
  Margus Tsahkna rõhutas kohtumisel, et Euroopa peab jätkama Venemaa survestamist
  ja Ukraina toetamist. Uued sanktsioonid on oluline samm, kuid Venemaa sõjapidamise
  võime piiramiseks tuleb teha veelgi rohkem.
