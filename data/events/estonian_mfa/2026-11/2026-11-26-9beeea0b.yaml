title: Välisministeerium tunnustab kodanikupäeval 40 rahvadiplomaati ja kodanikuühendust
text: Täna, 26. novembril ehk kodanikupäeval tunnustab välisministeerium 40 rahvadiplomaati
  ja kodanikuühendust 19 riigist, kes on oma tegevusega aidanud Eestil maailmas silma
  paista. Tänukirjaga tunnustatakse nende pühendumust Eesti tutvustamisel, keele ja
  kultuuri hoidmisel, eestlaste kogukondade ühendamisel, Eesti ettevõtete toetamisel
  ning rahvusvaheliste koostöösidemete loomisel.
