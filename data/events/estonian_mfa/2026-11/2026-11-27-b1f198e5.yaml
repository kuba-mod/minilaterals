title: 'Välisminister Tsahkna Aserbaidžaanis: Euroopa otsustavust oodatakse ka Lõuna-Kaukaasias'
text: Välisminister Margus Tsahkna viibib täna, 27. novembril visiidil Bakuus, kus
  ta kohtus Aserbaidžaani presidendi İlham Əliyeviga. Arutelu keskmes olid Eesti ja
  Aserbaidžaani kahepoolsete suhete arendamine, majandus- ja digikoostöö, Venemaa
  jätkuv agressioon Ukraina vastu ning Lõuna-Kaukaasia ja Läänemere julgeolek.
