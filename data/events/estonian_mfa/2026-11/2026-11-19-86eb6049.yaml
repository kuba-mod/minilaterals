title: 'Tsahkna karjäärikonverentsil: reeglitel põhineva maailmakorra eelduseks on
  rahvusvaheliste organisatsioonide töös missioonitundega osalevad inimesed'
text: 19.–20. novembril toimub Tallinnas rahvusvaheline konverents „Career Development
  Roundtable“, mis toob Eestisse personalijuhtimise, organisatsiooni- ja talendiarenduse
  eksperdid enam kui 100 rahvusvahelisest organisatsioonist ja finantsinstitutsioonist.
  Esindatud on muu hulgas ÜRO, Euroopa Liidu institutsioonid, NATO ja OECD. Ühtlasi
  toimub 21. novembril Eesti Rahvusraamatukogus rahvusvaheliste organisatsioonide
  karjääripäev, kus tudengid, noored spetsialistid ja kogenud eksperdid saavad tutvuda
  karjääri- ja praktikavõimalustega 35 rahvusvahelises organisatsioonis.
