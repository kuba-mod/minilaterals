title: Nele Leosk valiti juhtima Rahvusvahelise Telekommunikatsiooni Liidu arengusuunda
text: Täna, 13. novembril valiti Dohas toimunud Rahvusvahelise Telekommunikatsiooni
  Liidu (ITU) täievolilisel konverentsil Nele Leosk uueks ITU arengusuuna büroodirektoriks.
  Nele Leosk on endine Eesti digisaadik ning rahvusvaheliselt tunnustatud digiriigi
  ja digiarengu ekspert. Leosk on töötanud rohkem kui 140 riigiga digipöörde, e-valitsemise
  ja digitaalse võimekuse arendamisel.
