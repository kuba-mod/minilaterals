title: 'Asekantsler Ratnik Lvivis: Ukraina toetuseks tuleb koondada kõik jõud ja võimalused'
text: Täna, 10. novembril viibis välisministeeriumi välismajanduse ja arengukoostöö
  küsimuste asekantsler Mariin Ratnik Ukrainas Lvivis, kus toimus Ukraina doonorplatvormi
  (UDP) kohtumine. Arutelude keskmes olid Ukraina järgmise aasta eelarve toetamise
  vajadused, ELiga ühinemisega seotud reformide protsess, sealhulgas olukord majanduses,
  kiireloomulised vajadused enne talve ning rahvusvahelise toetuse suurendamine.
