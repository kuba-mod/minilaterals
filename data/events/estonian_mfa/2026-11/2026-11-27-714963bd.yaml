title: 'Välisminister Tsahkna: värske raport kinnitab, miks Eesti idapiiri sulgemine
  on vältimatu samm'
text: Välisminister Margus Tsahkna sõnul kinnitab äsja avaldatud Rahvusvahelise Strateegiliste
  Uuringute Instituudi (IISS) raport „Russia’s Unconventional War on Europe“, et „Venemaa
  peab Euroopa vastu üha ulatuslikumat varisõda, kasutades selleks sabotaaži, luuretegevust
  ja kohalikke vahendajaid. Raport annab sellest põhjaliku ülevaate ning aitab mõista,
  miks Eesti otsus sulgeda maismaapiir Venemaaga on vältimatu samm kogu Euroopa julgeoleku
  tugevdamisel.
