title: 'Tsahkna kohtumisel Jordaania kroonprintsiga: Venemaa agressiooni läbikukkumine
  Ukrainas on nii Euroopa kui Lähis-Ida julgeolekuhuvides'
text: Välisminister Margus Tsahkna kohtus täna, 5. novembril Tallinnas Tema Kuningliku
  Kõrguse kroonprints Al Hussein bin Abdullah II-ga, kes külastab Eestit Tallinn Digital
  Summiti tippkonverentsi raames. Kohtumisel arutati kahepoolseid suhteid ning julgeolekuolukorda
  Euroopas ja Lähis-Idas.
