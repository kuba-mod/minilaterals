title: 'Tsahkna NB8 kohtumisel: esimese sammuna peab Venemaa nõustuma relvarahuga'
text: Välisminister Margus Tsahkna kutsus täna, 12. novembril kokku Põhjala ja Balti
  riikide koostööformaadi (NB8) välisministrite videokohtumise, et arutada Venemaa
  agressioonisõjaga seonduvaid viimaseid arenguid, Abu Dhabis toimunud läbirääkimiste
  järelmeid ja julgeolekuolukorda meie regioonis.
