title: Välisministeerium kutsus Threod Systemsi vastase sabotaažikatse tõttu välja
  Venemaa ajutise asjuri
text: Eesti välisministeerium kutsus täna, 16. novembril välja Venemaa Föderatsiooni
  ajutise asjuri, et väljendada tugevat hukkamõistu laupäeva öösel kaitsetööstusettevõtte
  Threod Systems vastu toime pandud süütamiskatsele. Kaitsepolitseiameti andmetel
  tellis sabotaažiakti Venemaa Föderatsiooni sõjaväeluure GRU.
