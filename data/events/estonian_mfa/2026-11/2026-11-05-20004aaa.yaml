title: Eesti ja Usbekistani poliitilistel konsultatsioonidel keskenduti kahepoolsetele
  suhetele, regionaalsele julgeolekule ning koostööle rahvusvahelistes organisatsioonides
text: Eile, 4. novembril toimusid Tallinnas Eesti ja Usbekistani välisministeeriumide
  poliitilised konsultatsioonid. Eesti delegatsiooni juhtis poliitikaküsimuste asekantsler
  Martin Roger ning Usbekistani delegatsiooni asevälisminister Muzaffarbek Madrahimov.
  Delegatsioone tervitas ka välisminister Margus Tsahkna.
