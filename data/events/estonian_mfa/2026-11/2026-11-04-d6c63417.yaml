title: 'Välisminister Tsahkna: Eesti ja Aserbaidžaani partnerlus liigub uude etappi'
text: Täna, 4. novembril avas välisminister Margus Tsahkna Tallinnas Eesti ja Aserbaidžaani
  valitsuste vahelise koostöökomisjoni neljanda istungi, kus keskenduti kahepoolsete
  kaubandus- ja majandussuhete edendamisele ning koostöö arendamisele hariduse, kultuuri,
  digi- ja innovatsioonivaldkonnas. Istungit juhtisid Eesti digi- ja justiitsminister
  Liisa-Ly Pakosta ning Aserbaidžaani digiarengu ja transpordiminister Rašad Nabijev.
