title: 'Asekantsler Lind Vahemere Liidu foorumil: turvaline Läänemeri ja stabiilne
  Vahemere piirkond on Euroopa julgeoleku jaoks hädavajalikud'
text: Eile, 25. novembril osales välisministeeriumi globaalküsimuste asekantsler Minna-Liina
  Lind Vahemere Liidu 11. piirkondlikul foorumil Barcelonas, kus asekantsler esindas
  Eestit. Foorumil arutasid riikide kõrgetasemelised esindajad Euroopa ja Vahemere
  piirkonna ühiseid väljakutseid, piirkondliku koostöö tugevdamist ning Vahemere pakti
  eesmärkide täitmist.
