title: Vene vägede lahkumisest Ukraina toetamiseni – uus raamat avab 12 välisministri
  kõnede kaudu Eesti 30 aasta valikuid
text: Täna, 20. novembril esitlesid Välisministeerium ja Tartu Ülikooli Kirjastus
  raamatut „Õpipoisist meistriks. Kolmkümmend aastat välisministri kõnet Riigikogus,
  1994–2024“. Kogumikus on 12 välisministri 41 kõnet, mis aitavad mõista, kuidas Eesti
  pürgis Euroopa Liidu ja NATO liikmeks ning kuidas on Eesti hiljem koos liitlastega
  kujundanud otsuseid, millest sõltub kogu Euroopa julgeolek.
