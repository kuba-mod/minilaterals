title: 'Tsahkna: Euroopa Liidu laienemine tugevdab julgeolekut ja suurendab Euroopa
  geopoliitilist mõju'
text: Valitsus kiitis täna, 26. novembril heaks Eesti täiendavad seisukohad Euroopa
  Liidu laienemiseks valmistumise kohta. Eesti toetab ELi laienemist ning peab oluliseks,
  et liit alustaks aegsasti ettevalmistusi uute liikmesriikide vastuvõtmiseks, säilitades
  samal ajal oma toimimisvõime ja kõigi liikmesriikide võrdse osaluse.
