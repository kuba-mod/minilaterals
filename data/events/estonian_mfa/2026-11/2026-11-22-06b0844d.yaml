title: Eesti suursaatkonna heategevusüritusel Londonis koguti Ukraina haigla toetuseks
  üle 28 000 euro
text: Neljapäeval, 19. novembril korraldas Eesti suursaatkond Londonis Ukraina toetuseks
  tuluõhtu „Build for Ukraine“, mille käigus koguti üle 28 000 euro Eesti Rahvusvahelise
  Arengukoostöö Keskuse (ESTDEV) projekti „HEAL Berdõtšiv“ raames sealse haigla intensiivraviosakonna
  rekonstrueerimiseks. Projekt jõuab lõpukorrale 2027. aasta kevadel.
