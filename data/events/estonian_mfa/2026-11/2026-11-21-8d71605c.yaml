title: 'Välisminister Tsahkna laevaintsidendist: teeme Soome lahel koostööd põhjanaabrite
  ja liitlastega'
text: Täna, 21. novembril, sai Eesti Politsei- ja Piirivalveameti lennu- ja merepääste
  koordinatsioonikeskus signaali, et Vene kaitseministeeriumi asutusele kuuluv kuivlastilaev
  „Sparta II“ on saanud tabamuse ja põleb. Laev triivis seejärel Eesti majandusvööndist
  välja, jõudes Soome majandusvööndisse ning hiljem Soome territoriaalvetesse.
