title: Eesti valiti Keemiarelvade Keelustamise Organisatsiooni täitevnõukogusse
text: Täna, 24. novembril valiti Eesti Keemiarelvade Keelustamise Organisatsiooni
  (OPCW) täitevnõukogu liikmeks aastateks 2027–2029. Ida-Euroopa grupi kahele vabanevale
  kohale kandideerisid Eesti, Poola ja Venemaa. Eesti ja Poola valituks osutumine
  tähendab, et Venemaa jäi neljandat aastat järjest OPCW täitevnõukogu ukse taha.
