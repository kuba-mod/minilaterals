title: 'Välisminister Tsahkna: ELi 45 miljardi euro suurune lisalaen tugevdaks Ukraina
  positsiooni nii lahinguväljal kui ka läbirääkimistel'
text: Euroopa Komisjon tegi eile ettepaneku eraldada Ukrainale täiendav 45 miljardi
  euro suurune laen, mis kataks ligikaudu kaks kolmandikku Ukraina 70 miljardi euro
  suurusest rahastamisvajadusest. Välisminister Margus Tsahkna sõnul aitaks lisarahastus
  oluliselt tugevdada Ukraina kaitsevõimet ning tagada majanduse ja elutähtsate teenuste
  toimimise.
