title: Välisminister Tsahkna osaleb Varssavis Läänemeremaade Nõukogu kohtumisel
text: Täna, 6. novembril osaleb välisminister Margus Tsahkna Poola pealinnas Varssavis
  toimuval Läänemeremaade Nõukogu (LMN) kohtumisel, kus Läänemere piirkonna välisministrid
  arutavad piirkonna julgeolekuolukorda, Venemaa agressioonisõda Ukraina vastu ning
  ühiseid samme Ukraina toetamiseks. Kohtumisel osaleb ka Ukraina välisminister Andri
  Sõbiha.
