title: 'Välisminister Tsahkna: Eesti kiire ja otsustav tegutsemine teeb Venemaa sabotaažioperatsioonide
  läbiviimise keeruliseks'
text: Eesti kaitsepolitsei kinnitas täna, et 14. novembri ööl pandi julgeolekuettevõtte
  Threod Systemsi vastu toime süütamiskatse, mille tellis Venemaa Föderatsiooni sõjaväeluure
  GRU. Välisminister Margus Tsahkna sõnul on nurjunud süütamiskatse ehtne näide sellest,
  kui kiiresti ja otsustavalt tegutsevad nii Eesti julgeolekuasutused kui ettevõtete
  enda julgeolekustruktuurid. Seetõttu on Eesti Venemaa sabotööridele järjest keerulisem
  sihtmärk.
