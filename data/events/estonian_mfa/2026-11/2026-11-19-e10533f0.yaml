title: Valitsus toetas ELi-India vabakaubanduslepingut, mis on mõlema poole ajaloo
  suurim
text: Täna, 19. novembril kiitis valitsus heaks Euroopa Liidu ja India Vabariigi vabakaubanduslepingu
  sõlmimise. Tegu on mõlema poole läbi aegade suurima vabakaubanduslepinguga, mille
  üle peeti läbirääkimisi 19 aastat ning millega luuakse vabakaubandusturg ligi 2
  miljardile inimesele.
