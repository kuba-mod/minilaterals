title: Välisministeeriumi aastapäev tõi Tallinna Leedu, Rootsi ja Armeenia välisministrid
text: Välisminister Margus Tsahkna kohtus täna, 9. novembril Tallinnas Armeenia välisministri
  Ararat Mirzojani, Leedu välisministri Kęstutis Budryse ja Rootsi välisministri Maria
  Stenergardiga, kes viibisid Eestis välisministeeriumi 108. aastapäeva puhul. Kohtumistel
  keskenduti päevakajalistele julgeolekuküsimustele, Venemaa jätkuvale agressioonile,
  Ukraina toetamisele ning Eesti kahepoolsele koostööle kolme riigiga. Samuti arutati
  jaanuaris Tallinnas toimuva Ukraina ülesehituskonverentsi ettevalmistusi ja praktilisi
  tulemeid.
