title: 'Välisminister Tsahkna: Venemaa propagandamasin püüab enda tegudelt tähelepanu
  kõrvale juhtida'
text: Välisminister Margus Tsahkna sõnul püüab Venemaa Eesti-vastaste alusetute süüdistustega
  juhtida tähelepanu kõrvale omaenda tegevuselt Euroopa julgeoleku õõnestamisel, kuigi
  viimaste nädalate sündmused näitavad ilmekalt Venemaast lähtuvate julgeolekuohtude
  tõsidust.
