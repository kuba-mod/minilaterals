title: 'Minister Tsahkna välisministeeriumi 108. aastapäeval: iseseisvuse kaitsmine
  on meie ühine ja pidev vastutus – Euroopa julgeolekut ei saa panna pausile'
text: Täna, 9. novembril toimus Estonia kontserdisaalis välisministeeriumi 108. aastapäeva
  pidulik tähistamine, mille avas välisminister Margus Tsahkna. Minister Tsahkna rõhutas
  oma kõnes, et Eesti tugevus on alati olnud võime seista meie kõige olulisemate huvide
  eest ühiselt ning täna on Euroopa jõudnud otsustavasse ajajärku, kus tuleb võtta
  senisest otsusekindlam vastutus oma julgeoleku ja tuleviku eest.
