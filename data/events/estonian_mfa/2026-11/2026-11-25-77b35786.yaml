title: 'Välisminister Tsahkna Kiievis: valmistume koos Ukrainaga praktiliste tulemitega
  ülesehituskonverentsiks'
text: Välisminister Margus Tsahkna viibib täna, 25. novembril visiidil Kiievis, kus
  ta kohtus Ukraina peaministri Serhi Koretskõi, välisministri Andrii Sõbiha ning
  majandus- ja keskkonnaministri Oleksandr Kravtšenkoga. Kohtumiste keskmes oli Ukraina
  toetamine ning 2027. aasta Ukraina ülesehituskonverentsi ettevalmistused ja oodatavad
  tulemid. Samuti andis Eesti välisminister Ukraina välisministrile üle ajaloolise
  dokumentide kollaaži, millega tähistatakse Eesti ja Ukraina peatselt saabuvat diplomaatiliste
  suhete sõlmimise 35. aastapäeva.
