title: Välisminister tunnustas välisministeeriumi teeneteristidega Eesti huvide pühendunud
  edendajaid ja iseseisvuse hoidjaid
text: Täna, 9. novembril, välisministeeriumi 108. aastapäeva pidulikul tähistamisel,
  tunnustas väliminister Margus Tsahkna välisministeeriumi teeneteristidega teenistujaid
  ja koostööpartnereid nii Eestist kui välismaalt silmapaistva panuse eest Eesti välisteenistuse,
  välispoliitika ja seeläbi Eesti riikluse edendamisel.
