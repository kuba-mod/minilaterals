title: 'Välisminister Tsahkna: drooniparv tuli Vene sõjalaeva juurde Venemaa territooriumilt'
text: Välisminister Margus Tsahkna ütles täna, 11. novembril pärast Vabariigi Valitsuse
  julgeolekukabineti istungit, et Politsei- ja Piirivalveameti esialgsetel andmetel
  liikus Soome lahes viibinud Vene sõjalaeva juurde drooniparv Venemaa territooriumilt.
