title: Poliitikaküsimuste asekantsler Martin Roger pidas Uus-Meremaal ja Austraalias
  poliitilisi konsultatsioone
text: Sel nädalal, 23.–27. novembril viibis poliitikaküsimuste asekantsler Martin
  Roger visiidil Uus-Meremaal ja Austraalias, kus asekantsler pidas poliitilisi konsultatsioone
  Uus-Meremaa välis- ja kaubandusministeeriumi Euroopa, Lähis-Ida, Aafrika ja Austraalia
  valdkonna asekantsleri kohusetäitja Catherine Nicoli ning Austraalia välis- ja kaubandusministeeriumi
  Euroopa küsimuste asekantsleri kohusetäitja Craig Chittickuga.
