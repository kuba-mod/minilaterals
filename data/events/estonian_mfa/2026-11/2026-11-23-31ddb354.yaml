title: 'Tsahkna: Euroopa Komisjon esitas uue sanktsioonipaketi vastuseks Venemaa veelgi
  agressiivsemale käitumisele'
text: Euroopa Komisjon esitas täna, 23. novembril ELi 22. Venemaa-vastase sanktsioonipaketi
  ettepaneku, millega soovitakse hakata rakendama viisakeeldu Ukraina vastu sõdinud
  praegustele ja endistele Venemaa võitlejate. Lisaks kavandatakse piiranguid Venemaa
  osalemisele Euroopa spordi- ja kultuurielus ning uusi meetmeid Venemaa pankade,
  energiasektori, varilaevastiku ja sõjatööstuse vastu. Välisminister Margus Tsahkna
  sõnul on tegemist olulise sammuga Venemaa survestamisel ja Euroopa julgeoleku tugevdamisel.
