title: Tartu rahu ajalooline läbirääkimislaud jõudis Välisministeeriumisse
text: Tartu Linnamuuseumi, Tartu linna ja Eesti Välisministeeriumi koostöös jõudis
  Tartu rahu ajalooline läbirääkimislaud Välisministeeriumi peahoonesse Tallinnas.
  Eesti diplomaatia ühe olulisema sümbolina hakkab laud tutvustama Tartu rahu pärandit
  väliskülalistele, diplomaatidele ja rahvusvahelistele delegatsioonidele ning leiab
  kasutust ka esinduslikel allkirjastamistseremooniatel.
