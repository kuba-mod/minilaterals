title: International Court of Justice - Election of Francois Alabrune as a judge
text: France congratulates M. François Alabrune on his election as a judge at the
  International Court of Justice for a nine-year term, from 2027 to 2036, following
  ballots held at the United Nations General Assembly and Security Council on 3 November
  2026. It thanks all the United Nations member States which lent their support to
  his candidacy, as it did. This election is a continuation of France’s longstanding,
  unshakeable commitment to the International Court of Justice, whose contribution
  to maintaining peace and international security is more essential than ever. France
  reaffirms its commitment to respect for international law, multilateralism and the
  peaceful settlement of disputes. A renowned diplomat and jurist, M. Alabrune’s election
  testifies to his steadfast commitment to international law and international courts.
  France extends its congratulations to Mr Dapo Akande (United Kingdom), Ms Rena Lee
  (Singapore), Mr Mahmoud Daifallah Hmoud (Jordan) and Ms Phoebe Okowa (Kenya), who
  were also elected.
