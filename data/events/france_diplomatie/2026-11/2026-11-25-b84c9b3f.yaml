title: International day for the elimination of violence against women
text: In 2026, one in three women in the world say they have suffered physical or
  sexual violence during their lives (UN Women). In the face of this reality, France
  has made combating violence against women and girls a priority of its international
  strategy of feminist diplomacy (2025-2030). France is taking action to strengthen
  the normative framework and international efforts to tackle gender-based violence.
  Together with the Netherlands, it championed a resolution on the fight against femicide,
  adopted by the United Nations General Assembly’s Third Committee on 17 November
  2026. On the legal aspect, it is also campaigning for the global adoption of the
  Council of Europe Convention on preventing and combating violence against women
  and domestic violence, known as the Istanbul Convention. In 2026, France joined
  the International Coalition to End Violence against Women and Girls, launched by
  the United Kingdom ahead of its G20 presidency. In conjunction with UN Women and
  the United Nations Population Fund (UNFPA), France supports programmes to protect
  women and girls who are survivors of violence, and combats impunity for sexual violence
  in times of conflict. In this regard, it supports the first international network
  of prosecutors tasked with investigating sexual violence in cases of conflict. It
  also supports the Global Survivors Fund, which facilitates access to psychological,
  medical, financial and legal redress for survivors of conflict-related sexual violence.
  2. Ongoing support for civil society and practical initiatives on the ground France
  supports feminist organizations working closely with people on the ground. Since
  2020, the Support Fund for Feminist Organizations has supported more than 1,400
  organizations in 93 countries. In Yemen, the Brave Women project has, among other
  things, raised awareness among over 35,000 people about technology-facilitated gender-based
  violence, while helping to create a local police helpline. The emergence of new
  technology is exacerbating gender-based violence. To address this, in 2024 France
  launched the Laboratory for Women’s Rights Online, an incubator supporting practical
  projects geared to combating violence perpetrated in the digital space. In 2026
  and 2027, these projects are being deployed in seven countries. 3 . Increased protection
  for female French nationals abroad The Ministry for Europe and Foreign Affairs is
  increasing its support for French women who are victims of violence abroad. All
  embassies now have a web page dedicated to providing information for victims, and
  more than 200 consular staff have received special training to assist them. The
  Ministry is also developing its partnerships with voluntary organizations such as
  SAVE YOU and bodies such as the Paris Bar Association. It is offering resources
  to victims preparing to return to France so they have better guidance and know their
  rights. For emergency care, information is available in particular on the network
  of women’s/health centres, which are linked to a hospital in every French department.
  The aim is to guarantee every French woman, wherever she may be, easy, confidential
  access to a trained member of staff, a sympathetic ear, administrative and social
  support and guidance on protection and recovery schemes.
