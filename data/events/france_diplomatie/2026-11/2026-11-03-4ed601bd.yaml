title: Conversation between Minister for Europe and Foreign Affairs Jean-Noël Barrot…
text: Minister for Europe and Foreign Affairs Jean-Noël Barrot hosted Yemen’s Minister
  of Foreign Affairs and Expatriates, Afrah Al-Zouba, on November 3. As the Houthis
  continue to step up their military offensive, the Minister strongly condemned the
  destabilizing actions and attacks carried out by that organization, particularly
  the attacks on the presidential palace in Aden on October 15 and 20, which represent
  a threat to Yemeni and regional security and stability. He expressed France’s full
  support for Yemen’s legitimate government, whose sovereignty must extend to the
  entire country. The Ministers discussed the very serious consequences of the Houthi
  attacks on civilians and civilian infrastructure. The Minister for Europe and Foreign
  Affairs strongly condemned the siege of the city of Taiz – a flagrant violation
  of international law. He emphasized France’s unwavering support for the Yemeni population
  through the delivery of humanitarian aid and cooperation with the country’s legitimate
  authorities. Lastly, the Minister stressed the importance of restarting, in due
  time, an inclusive political process under the auspices of the UN, the only way
  to achieve a lasting solution to the conflict.
