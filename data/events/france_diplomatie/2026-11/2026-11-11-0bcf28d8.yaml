title: The Pall Mall Process Industry Guidelines
text: 'The Pall Mall Process Industry Guidelines was launched at the Third meeting
  of the Pall Mall Process hosted by France and the UK in Paris 10 and 11 November
  2026. France and the UK launched the Pall Mall Process in February 2024. This brought
  together representatives from States, companies and civil society groups who signed
  the Pall Mall Declaration , a non-binding set of guidelines agreeing on the need
  to take forward international action to tackle this shared threat, around the four
  guiding pillars of: accountability, precision, oversight and transparency. This
  marked the beginning of the Pall Mall Process - an iterative and ongoing process
  which aims to establish a framework for responsible behaviour across the market
  which includes clear guidelines for those developing, selling and using commercial
  cyber intrusion tools. In April 2025, the UK and France launched the landmark Code
  of Practice for States which sets out commitments for State action in relation to
  the development, facilitation, purchase, and use of CCICs, against the four pillars
  underpinning the Pall Mall Process. It establishes a set of good practice policy
  and regulatory recommendations to help ensure States’ use of CCICs in a responsible
  manner. This was an important first step towards the action to shape broader CCIC
  market, with recommendations across States role as regulators, customers, and responsible
  users of these tools. This was followed by the launch of the Pall Mall Process Industry
  Guidelines in November 2026. Complementary to the Code of Practice for States, and
  informed by the four guiding pillars, the Industry Guidelines provide practical
  recommendations to be endorsed by States and implemented by the commercial cyber
  intrusion industry. Through the Industry Guidelines, we aim to disincentivise irresponsible
  activity across the market for CCICs; improve transparency for regulators, vendors
  and customers; and provide clarity for businesses operating both within and peripherally
  to the industry. The Guidelines were informed by substantial consultation and negotiation,
  which invited views from States, industry, academia and civil society on good practice
  in the cyber intrusion industry. Read the Pall Mall Process Industry Guidelines
