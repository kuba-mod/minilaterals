title: Israel/Palestine - Israeli settler attacks in the West Bank during the night
  of…
text: France condemns the very serious attacks perpetrated by violent settlers in
  several Palestinian West Bank communities during the night of 21 to 22 November
  2026. France calls on the Israeli authorities to arrest the perpetrators of these
  acts of terror and bring them to justice. In addition, the Israeli authorities must
  take all necessary steps to put a stop to this criminal violence and guarantee the
  safety of civilians, as they are obliged to do under international law. France reiterates
  its condemnation of the settlements policy. Settlement activity is against international
  law. It seriously undermines Palestinians’ rights, threatens stability in the West
  Bank and jeopardizes the two-state solution.
