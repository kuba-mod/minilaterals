title: Denmark - Response to the attribution to Russia of the attempted murder of
  a us…
text: France lends its full support to Denmark, which has just officially attributed
  to Russia the attempted murder of a US-Ukrainian national on its territory. It also
  stands by all its European partners and allies which, in recent days, have faced
  Russia’s continued, aggressive attempts to undermine our collective security. We
  shall not weaken in the face of the drone use, acts of sabotage, cyber attacks and
  direct threats that the Russian State is directing against our people. The increasing
  number of these attacks is a sign of a Russia under pressure. Far from intimidating
  us, it strengthens our unity and our determination to work tirelessly as Europeans
  for peace, stability and security on our continent.
