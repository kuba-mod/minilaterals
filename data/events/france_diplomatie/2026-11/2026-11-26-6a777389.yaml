title: Jean-Noël Barrot’s meeting with Khalilur Rahman, President of the United…
text: The Minister had a meeting today, 26 November, with Mr Khalilur Rahman, President
  of the United Nations General Assembly and Foreign Minister of Bangladesh. They
  talked about the ongoing work at the United Nations General Assembly to promote
  an effective multilateralism and the resolution of conflicts and crises. The Foreign
  Minister of Bangladesh pledged that his country would join the Franco-Mexican initiative
  to regulate the use of the veto at the Security Council in cases of mass atrocities.
  The two ministers also discussed how to coordinate their action within the General
  Assembly to make further progress on this initiative. The two ministers signalled
  their commitment to fighting against impunity following the decision by the International
  Court of Justice (ICJ) on the Rohingyas’ situation. The two ministers also expressed
  their desire to strengthen bilateral relations as regards the economy, culture,
  academic cooperation and sustainable development.
