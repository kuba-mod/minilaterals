title: Conversation between Minister for Europe and Foreign Affairs Jean-Noël Barrot…
text: Minister for Europe and Foreign Affairs Jean-Noël Barrot spoke with OECD Secretary-General
  Mathias Cormann on November 2. The Minister reaffirmed France’s backing for the
  Secretary-General’s efforts to support OECD member states. He called for continuing
  the efforts under way to achieve a consensus-based renewal of the organization’s
  work program and budget. He also stressed the importance of the organization’s role
  in producing reliable baseline data and analyses. He reiterated France’s commitment
  to maintaining all of the organization’s initiatives, including the decarbonization
  of our economies and gender equality.
