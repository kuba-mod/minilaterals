title: Minister's meeting with his highness Prince Rahim Aga Khan Vrel
text: M. Jean-Noël Barrot, Minister for Europe and Foreign Affairs, had a meeting
  today with His Highness Prince Rahim Aga Khan V, on the sidelines of the Paris Peace
  Forum. The Minister welcomed the deepening of relations between France and the Ismaili
  Imamat, following the visit paid by His Highness Prince Rahim Aga Khan V in July
  2025 and the signing of the framework convention aimed at strengthening these ties.
  The Minister and Prince Rahim Aga Khan V discussed international matters of shared
  interest and existing and future cooperation projects in many areas, in particular
  in terms of global challenges, development, health, culture and heritage conservation.
  The Minister and  Prince Rahim Aga Khan V agreed to continue and strengthen their
  cooperation.
