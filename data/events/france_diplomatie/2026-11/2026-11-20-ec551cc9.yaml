title: Ukraine – Russian drone attacks
text: France utterly condemns Russia’s drone attacks against Kyiv on November 19,
  in which several civilians lost their lives.  Our thoughts go out to their loved
  ones. We also condemn last night’s massive missile and drone strikes against Ukraine,
  which killed additional civilians and targeted civilian and energy infrastructure,
  particularly in Kyiv and Lviv These strikes, which also damaged the Austrian and
  Dutch embassies, in defiance of the inviolability of diplomatic premises, are serious
  violations of international law. They show yet again that Russia does not want peace.
  France has asked for a Security Council meeting in which Russia must be held accountable.
  France expresses its full support for Ukraine, as well as Austria and the Netherlands.
  Together with our partners, we will continue to support Ukraine to force Russia
  to end its war of aggression.
