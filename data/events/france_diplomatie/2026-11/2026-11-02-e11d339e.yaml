title: Summary of the UN Biodiversity Conference (CBD-COP 17)
text: France applauds the excellent job by the Armenian presidency, which enabled
  the COP 17 to take place in a constructive atmosphere, despite the difficult geopolitical
  context. Nevertheless, the results of this COP fell below our expectations and were
  not on a par with the urgent situation created by biodiversity collapse. Differences
  between the parties hindered the progress that is needed for the full implementation
  of the Kunming-Montreal Global Biodiversity Framework (GBF), particularly with regard
  to the reduction of subsidies that are damaging to biodiversity. However, some progress
  was made on financing. The need to expand the base of contributing countries was
  acknowledged for the first time within the framework of a Rio Convention. A process
  was initiated to move forward on this issue by the COP 18. The roles of the Global
  Environment Fund and the Global Biodiversity Framework Fund were also expanded.
  France also mobilized to defend science. We obtained recognition of the essential
  contribution made by the Intergovernmental Scientific Policy Platform on Biodiversity
  and Ecosystem Services (IPBES) in the face of attempts to challenge its work. Our
  collective effort must remain science-based. France also applauded decisions strengthening
  the participation of indigenous peoples and local communities, whose rights, knowledge
  and role in protecting biodiversity must be fully recognized. This COP reminds us
  of the need to continue our efforts to enhance the vitality of these formats, which
  must respond to the urgent needs of our time.
