title: Poland - France 'solidarity
text: France utterly condemns the unacceptable incursion of missiles and drones into
  Polish airspace and expresses its wholehearted solidarity with Poland. In the face
  of Russia’s irresponsible actions, France, alongside its partners, reaffirms its
  full commitment and its contribution to European security and to collective defence
  under NATO. France will continue to strengthen its support for Ukraine, for its
  independence and sovereignty, and remains determined to step up pressure on Russia
  in order to halt its war effort and put a stop to its hostile actions. With its
  partners and allies, France continues to increase the protection of our countries,
  our democracies and our citizens against any destabilization attempts.
