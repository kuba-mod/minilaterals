title: G7 Foreign Ministers' Meeting - The Ministers' meeting with Cho Hyun, Foreign…
text: The Minister for Europe and Foreign Affairs, Jean-Noël Barrot, met with Cho
  Hyun, Minister of Foreign Affairs of the Republic of Korea, on the sidelines of
  the G7 Foreign Ministers’ Meeting in Paris. The Minister thanked the Republic of
  Korea for supporting the work of the French G7 Presidency. The discussions covered
  the situation in the Korean peninsula and major international issues. They also
  covered bilateral matters, building on the two respective state visits in 2026 that
  helped upgrade the France-Korea relationship to the level of global strategic partnership.
  In the face of international security and stability challenges, the Ministers recalled
  their commitment to an international order based on multilateralism and law.
