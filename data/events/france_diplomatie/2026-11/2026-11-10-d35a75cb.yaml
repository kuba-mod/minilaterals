title: G7 Foreign Ministers' Meeting - The Minister's meeting with his Highness Prince…
text: The Minister for Europe and Foreign Affairs, Jean-Noël Barrot, met with his
  counterpart from the Kingdom of Saudi Arabia, Prince Faisal bin Farhan Al Saud,
  on the sidelines of the G7+ ministerial meeting in Paris on 9 November 2026. The
  two Ministers discussed the situation in the Middle East. The Minister reiterated
  France’s staunch condemnation of Houthi attacks targeting Saudi Arabia and full
  solidarity with Saudi Arabia in the defence of its territory. The Minister reaffirmed
  France’s commitment to the diplomatic resolution of the Iranian crisis, which makes
  it possible to deal with all of the threats posed by Iran. He recalled that freedom
  of navigation in the Strait of Hormuz must be restored. He also reiterated France’s
  readiness to help to achieve this with his partners, within the framework of a strictly
  defensive multinational military mission, when conditions so allow. The two Ministers
  also spoke about the situation in Lebanon and the need to work on strengthening
  the sovereignty and stability of the Lebanese State. They reaffirmed their commitment
  to the two-state solution. They emphasized the importance of ending the conflict
  in Sudan. The two Ministers agreed to pursue their close coordination in contributing
  to regional stability and ongoing diplomatic efforts. Lastly, they reiterated their
  determination to deepen the France-Saudi Arabia Strategic Partnership in all areas,
  building on the visit of the Prime Minister of Saudi Arabia, Mohammed bin Salman,
  to France on 23 and 24 August 2026, and the visit of the President of the French
  Republic to Saudi Arabia on 21 October 2026.
