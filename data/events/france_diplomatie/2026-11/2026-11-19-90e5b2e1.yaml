title: Joint Statement by the Foreign Ministries of France and Germany regarding the…
text: France and Germany are following with concern the recent developments regarding
  the situation of journalists and media professionals in Egypt, including the arrest
  of the editorial team of the Matsada2sh website as well as the criminal conviction
  and the arrest of Lina Attalah, co-founder and editor-in-chief of the independent
  media outlet Mada Masr, which resulted in the decision of the media’s closure. In
  2022, Lina Attalah was awarded the Franco-German Prize for Human Rights and the
  Rule of Law for her long-standing personal commitment to independent high-quality
  journalism and the rule of law in Egypt. Independent media outlets are key elements
  of the pluralistic society and diversity of opinions worldwide that constitute fundamental
  values that Egypt and we share. In this regard, we strongly encourage Egypt to continue
  implementing its National Human Rights Strategy.
