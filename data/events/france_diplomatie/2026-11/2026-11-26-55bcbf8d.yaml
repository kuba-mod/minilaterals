title: Libya – Attack on the Benghazi naval base
text: France extends its condolences to the families and close friends of the two
  Libyan soldiers who died following the attack on the Benghazi naval base on 22 November.
  It reaffirms its commitment to Libya’s unity, stability and sovereignty and to security
  in the Mediterranean.
