title: Central African Republic – Renewal of MINUSCA’s mandate
text: France welcomes the unanimous renewal of MINUSCA’s mandate by the members of
  the United Nations Security Council on 12 November 2026. The decision is the result
  of France’s commitment and the negotiations it conducted in New York, as well as
  sustained, constructive dialogue with the Central African authorities and the members
  of the Security Council. This new mandate enables clear objectives to be set for
  the UN mission to benefit the Central African population. MINUSCA will continue
  its security support to the Central African armed forces, in order to guarantee
  the State’s authority over the whole territory and protect civilians, in a context
  in which several pockets of insecurity remain, particularly in the north-east and
  south-east of the country. The mission will also have to pave the way for a gradual,
  sequenced, conditional transfer of responsibilities, carried out in consultation
  with the Central African Government, to consolidate the achievements of recent years.
  France conducted the negotiations in a spirit of openness and consensus-seeking.
  We therefore welcome the unanimous adoption of a balanced text that directly contributes
  to the Central African Republic’s stability. This unanimity among the Security Council
  members is the practical manifestation of a multilateralism that works. United Nations
  peace missions bring tangible results on the ground, and MINUSCA is an illustration
  of that.
