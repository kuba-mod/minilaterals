title: Iran - Sentencing of Parastoo Ahmadi
text: France was appalled and horrified to learn of the Iranian singer Parastoo Ahmadi’s
  punishment of 74 lashes, to which she had been sentenced for singing without wearing
  a veil. On the eve of the International Day for the Elimination of Violence against
  Women, this cruel, inhuman punishment sends a terrible signal to all Iranian women
  who aspire to freedom and equality. This intolerable repression of Iranian women
  must stop. The Iranian people must be able to express themselves freely and their
  fundamental rights must be respected.
