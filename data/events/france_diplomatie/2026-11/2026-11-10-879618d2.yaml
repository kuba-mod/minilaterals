title: G7 Foreign Ministers' Meeting - The Minister's meeting with Mr Johann Wadephul,…
text: M. Jean-Noël Barrot, Minister for Europe and Foreign Affairs, had a meeting
  with his German counterpart, Mr Johann Wadephul, on the sidelines of the G7 Foreign
  Ministers’ Meeting in Paris on 10 November 2026. The two ministers welcomed the
  close coordination between France and Germany in the context of the work done under
  France’s G7 presidency, illustrating the exceptional partnership between France
  and Germany following on from German Federal President Frank-Walter Steinmeier’s
  state visit to France on 8 and 9 October. The ministers discussed European issues
  of common interest, particularly security and the European Union’s competitiveness.
  They also reaffirmed Europe’s unfailing support for Ukraine, as the country prepares
  to face its fifth winter in wartime. The two ministers also talked about the situation
  in the Middle East, and Palestine in particular.
