title: G7 Foreign Ministers' Meeting - The Minister's meeting with Antinio Tajani,…
text: Jean-Noël Barrot, French Minister for Europe and Foreign Affairs, met with Antonio
  Tajani, Deputy Prime Minister and Minister of Foreign Affairs and International
  Cooperation of the Italian Republic, on Monday, 9 November. Building on the 36 th
  Bilateral Summit held on 25 June in Antibes, and ahead of the fifth anniversary
  of the signature of the Quirinal Treaty, the Ministers recalled that greater cooperation
  between France and Italy has helped strengthen European autonomy. They discussed,
  in particular, their more extensive bilateral ties in the energy sector, including
  from an industrial standpoint. The Ministers talked about the initiatives being
  implemented to address the developments in the Middle East, particularly efforts
  to tackle higher energy prices, focusing particular attention to the situation in
  Lebanon. They reaffirmed their long-term support for Ukraine, particularly within
  the Coalition of the Willing, while Russia is increasing its strikes on Ukraine’s
  energy infrastructures as winter approaches. They strongly condemned the recent
  hybrid and cyber attacks that targeted our respective countries.
