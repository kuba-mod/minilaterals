title: Conversation between Minister for Europe and Foreign Affairs Jean-Noël Barrot…
text: Le ministre de l’Europe et des Affaires étrangères, M. Jean-Noël Barrot, s’est
  entretenu le 3 novembre 2026 à Paris avec Mme Thérèse Wagner, ministre d’Etat, ministre
  des Affaires étrangères, de la Coopération internationale et de la Francophonie
  de la République démocratique du Congo (RDC). Un mois après sa visite en République
  démocratique du Congo, où il s’était rendu à Kinshasa et Bunia, épicentre de l’épidémie
  d’Ebola, le ministre a renouvelé auprès de Mme Wagner la solidarité de la France
  envers les autorités et les populations congolaises victimes de l’épidémie. Il a
  pu annoncer l’envoi par la France de 1,5 tonnes de médicaments à destination des
  ONG se trouvant en première ligne de la riposte, notamment ALIMA et Première Urgence
  Internationale. Le ministre a également rappelé le soutien de la France aux populations
  congolaises victimes du conflit dans les Grands Lacs. La position de la France est
  celle du respect de l’intégrité territoriale de la République démocratique du Congo
  et du rétablissement de sa souveraineté sur les Kivu. Les ministres ont échangé
  sur les médiations en cours portées par les États-Unis, le Qatar et l’Union africaine
  ainsi que sur le renouvellement du mandat de la MONUSCO qui doit intervenir avant
  la fin de l’année et pour lequel la France est engagée en tant que plume au Conseil
  de sécurité. Enfin, les ministres ont échangé sur la préparation du prochain Sommet
  de la Francophonie, qui se tiendra à Phnom Penh les 15 et 16 novembre prochains.
