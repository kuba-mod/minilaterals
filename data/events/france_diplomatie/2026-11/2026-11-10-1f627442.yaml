title: G7 Foreign Ministers' Meeting - The Minister's meeting with Andrii Sybiha,…
text: On 10 November, the Minister for Europe and Foreign Affairs met with his Ukrainian
  counterpart, Andrii Sybiha, on the sidelines of the G7 Foreign Ministers’ Meeting
  in Paris. They took stock on the support provided to Ukraine by the G7 during the
  French Presidency. While fresh talks are starting today in Abu Dhabi, in which France
  is represented, they commended the efforts of the United States to revitalize negotiations
  and achieve partial truces, which should be a first step on the path towards a complete
  and unconditional ceasefire. Jean-Noël Barrot reaffirmed our unwavering support
  for Ukraine, until a just and enduring peace is achieved. The Ministers discussed
  the international conference that was held in Paris on 9 November on the restoration
  of the confinement structure of the Chernobyl Nuclear Power Plant, struck by Russian
  drones on 14 February 2025. The Minister for Europe and Foreign Affairs hailed the
  €278 million raised for this construction, which was a priority of the French G7 Presidency.
  The Minister also expressed France’s support amid Russia’s attacks on energy infrastructure
  and reiterated France’s commitment to supporting Ukraine as winter approaches, in
  liaison with its partners. The Ministers also discussed the situation in the Black
  Sea, where Russian attacks on commercial vessels transporting grain and on port
  infrastructure are a threat to global food security.
