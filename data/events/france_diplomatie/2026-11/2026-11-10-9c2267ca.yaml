title: G7 Foreign Ministers' Meeting - The Minister's meeting with Kaja Kallas, High…
text: The Minister for Europe and Foreign Affairs, Jean-Noël Barrot, met with the
  High Representative of the Union for Foreign Affairs and Security Policy and Vice-President
  of the European Commission, Kaja Kallas, on the sidelines of the G7 Foreign Ministers’
  Meeting in Paris on 9 November 2026. At this meeting, they reviewed progress, ahead
  of the Foreign Affairs Council of 16 November, on the European Union’s international
  action and the mobilization of its Member States, concerning the Middle East and
  Ukraine, and our action in terms of sanctions, particularly in the face of the recent
  cyber attacks that targeted France and other European countries
