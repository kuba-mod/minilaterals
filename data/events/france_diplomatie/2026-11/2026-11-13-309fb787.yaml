title: Minister's meeting with Nasser Bourita, minister of Foreign affairs, african…
text: 'M. Jean-Noël Barrot, Minister for Europe and Foreign Affairs, had a meeting
  with his Moroccan counterpart, Mr Nasser Bourita, in Essaouira on 13 November 2026.
  The two ministers reviewed the strengthened exceptional partnership linking France
  and Morocco, nearly two years after the state visit to Morocco made by President
  Macron at the invitation of His Majesty Mohammed VI. They discussed the many areas
  where the Franco-Moroccan relationship has developed in particularly fruitful ways,
  and worked towards strengthening this with a view to the conclusion of a Franco-Moroccan
  bilateral treaty during His Majesty King Mohammed VI’s future state visit to France.
  Regarding Western Sahara, the Minister called for the continuation of dialogue and
  renewed his support for the UN Secretary-General’s Personal Envoy in his mission
  as facilitator on the basis of Resolution 2797. The Minister reiterated France’s
  inviolable position: that Western Sahara’s present and future come under Moroccan
  sovereignty. In this respect, the autonomy plan proposed by Morocco in 2007 constitutes
  the sole basis for reaching a fair, lasting, negotiated political solution. France
  remains committed to a definitive political settlement of the issue. The two ministers
  also spoke about regional and international issues of mutual interest, in particular
  the situation in the Middle East and the Sahel. The Minister reaffirmed his desire
  to put Franco-Moroccan cooperation at the service of crisis resolution. During the
  visit, the two ministers took part in a high-level panel discussion in the framework
  of the World Women’s Peace Forum, organized by the voluntary organization Les Guerrières
  de la Paix [Women Warriors for Peace]. They reaffirmed France and Morocco’s shared
  commitment to the two-state solution and emphasized the importance of civil society
  initiatives in building and defending peace.'
