title: 'Botswana – Paris Declaration on Natural Diamonds : Drivers of Responsible,…'
text: On the sidelines of the Paris Peace Forum, M. Nicolas Forissier, Minister Delegate
  for Foreign Trade and Economic Attractiveness, attached to the Ministry for Europe
  and Foreign Affairs, met Ms Bogolo Joy Kenewendo, Botswana’s Minister of Minerals
  and Energy, on 10 November 2026. Together they reaffirmed their commitment to the
  partnership between France and Botswana and signed the Paris Declaration on Natural
  Diamonds. Through this declaration, and in the light of their 60 years of diplomatic
  relations, France and Botswana renew their commitment to protecting and promoting
  the uniqueness and integrity of natural diamonds, drivers of responsible, sustainable
  and inclusive growth. France and Botswana emphasize the importance of providing
  buyers with clear, reliable information about the products they purchase, and supporting
  the African continent’s economic transformations to make them sustainable.
