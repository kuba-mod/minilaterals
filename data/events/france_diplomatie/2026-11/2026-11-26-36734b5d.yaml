title: Saudi Arabia – Houthi attacks
text: France strongly condemns the repeated Houthi attacks on Saudi Arabia, particularly
  civilian infrastructure in Riyadh. France expresses its wholehearted solidarity
  with the Kingdom of Saudi Arabia. It stands by it in the defence of its territory
  and infrastructure in the face of these attacks. The Houthis must immediately cease
  their attacks and provocations, which destabilize the region and aggravate the Yemeni
  people’s suffering. France calls on all the parties to show restraint.
