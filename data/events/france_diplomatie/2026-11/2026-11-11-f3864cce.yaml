title: G7 Foreign ministers' meeting - Minister's meeting with Marco Rubio, United…
text: On the sidelines of the G7 Foreign Ministers’ Meeting in Paris, M. Jean-Noël
  Barrot, Minister for Europe and Foreign Affairs, had a meeting with Mr Marco Rubio,
  United States Secretary of State. They talked about the major international crises.
  Regarding Iran in particular, the Minister recalled the priority given by France
  to a diplomatic solution and the need to avoid any further regional escalation.
  On Lebanon, the Minister expressed his desire to avoid any security vacuum and work
  towards building a security architecture following UNIFIL’s withdrawal. Concerning
  Ukraine, he reaffirmed France’s support for its sovereignty and territorial integrity,
  and his commitment to a just, lasting peace accompanied by security guarantees for
  Ukraine. The Minister also voiced France’s concern about the US sanctions against
  the International Criminal Court. He recalled France’s support for the Court and
  its readiness to continue dialogue with the United States, with due regard for the
  Court’s independence and integrity. The meeting was conducted in the spirit of the
  excellent bilateral relationship between France and the United States; celebrations
  of the 250 th anniversary of its independence have been a feature of this French
  G7 presidency year. Our ties are based on a shared history, a longstanding friendship
  and a strategic partnership which are set to continue and grow stronger.
