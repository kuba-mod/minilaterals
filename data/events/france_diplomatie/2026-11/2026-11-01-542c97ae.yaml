title: G20 Foreign Ministers’ Meeting – Minister for Europe And Foreign Affairs Jean…
text: M. Jean-Noël Barrot, Minister for Europe and Foreign Affairs, had a meeting
  with Ms Anita Anand, Canadian Minister of Foreign Affairs, on 31 October 2026, on
  the sidelines of the G20 Foreign Ministers’ Meeting. Building on the discussions
  between President Macron and Prime Minister Mark Carney in Saint-Pierre and Miquelon
  on 20 September, the [French] Minister called for the France-Canada relationship,
  and cooperation between France and Canada on the archipelago, to be further strengthened.
  In the context of the energy crisis, the Minister emphasized the importance of enhanced
  cooperation between French and Canadian stakeholders in the sector. The ministers
  discussed the situation in the Middle East. Finally, they spoke about recent security
  developments in Haiti. The [French] Minister reiterated our shared commitment to
  making the restoration of security in Haiti a priority.
