title: Death of a UN staffer detained by the Houthis
text: France was shocked and saddened to learn of the death of Mohammad el Shami,
  a staff member of the UN Human Rights Office in Yemen, who had been detained by
  the Houthis for more than two years. The Houthis bear full responsibility for his
  death and must be held accountable. France offers its condolences to Mohammad el
  Shami’s family and the UN. France demands the immediate, unconditional release of
  all staff members of the UN, international organizations and diplomatic missions
  who are being arbitrarily detained by the Houthis. These arbitrary detentions are
  a flagrant violation of international law. France reaffirms its full support for
  the UN’s work in Yemen.
