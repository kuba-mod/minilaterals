title: Declaration on key principles of European security
text: 'Committed to peace and upholding international law, and in the face of unprovoked
  full-scale Russian aggression against Ukraine and growing threats to Europe stability,
  the signatory states, gathered for the 9th Summit of the European Political Community
  in Dublin on the 12th of November 2026, consider strengthening European security
  and defending their security interests as their common objective. The signatory
  states reiterate their firm support for the independence, sovereignty, and territorial
  integrity of Ukraine within its internationally recognised borders They underline
  the necessity to provide robust and credible security guarantees to Ukraine and
  reiterate, for those concerned, their intention to do so, in order to prevent the
  recurrence of aggression in Europe in the future. They underline that Russia’s hybrid
  campaigns and attempts to undermine support to Ukraine will only strengthen their
  commitment to Ukraine and their resolve. The signatory states recall that the path
  to peace in Ukraine should be decided with Ukraine and that any matter affecting
  European security should be decided with the Europeans. They consider that the following
  key principles of European security can contribute to provide a path to a just and
  lasting peace for Ukraine, which will be of utmost importance for stability in Europe
  They emphasize that Ukraine’s security is an integral part of Euro-Atlantic security
  and that future developments in European strategic stability will be conditional
  upon the conclusion of the war in Ukraine. The signatory states reaffirm the following
  general principles related to European security : International law and the Charter
  of the United Nations are the cornerstone of this Declaration. In addition, the
  signatory states reaffirm the rules and principles upon which European security
  is and must remain founded, notably where applicable to the relevant signatory states,
  the North Atlantic Treaty (1949), the Statute of the Council of Europe (1949), the
  Treaty on the European Union and the Treaty on the functioning of the European Union
  (1950, 1957, 1986, 1992 and sq.), the Helsinki Final Act (1975), the Charter of
  Paris for a New Europe (1990), the Agreement on the European Economic Area (1992),
  and the Istanbul Charter for Security in Europe (1999). Common objectives contained
  in this Declaration are rooted in these fundamental documents and the signatories
  which are parties to them aim to ensure their effective implementation. In this
  regard, the signatory states underline the importance of the following principles,
  which form the foundations of peace and stability on the European continent : respect
  for the sovereign equality of states and the rights inherent in sovereignty, such
  as the territorial integrity, the inviolability of borders, non-interference in
  domestic affairs, and the right of states to freely determine their relations with
  other states, and to choose whether or not to participate in treaties, alliances,
  or international organizations ; the refraining from the threat of or the use of
  force, including irresponsible nuclear rhetoric and coercion, and the peaceful settlement
  of disputes, in accordance with international law and good neighbourly relations ;
  the right to individual or collective self-defence in the event of an armed attack ;
  and the respect for the international law, including the international law of the
  sea as reflected by UNCLOS. The signatory states recognise that European states
  bear a primary responsibility and are assuming greater responsibility for the security
  of Europe, which will also contribute positively to global and transatlantic security.
  The signatory states reaffirm their commitment to human rights, and fundamental
  freedoms for all, without distinction of any kind, including on the grounds of race,
  sex, language, or religion, including in the digital realm, as well as the right
  of all nations to freely determine their political status, in accordance with international
  law. Democracy, rule of law, human rights and respect of the humanitarian international
  law are essential elements of comprehensive security and contribute to resilient
  societies capable of resisting both internal and external pressures. Enhanced participatory
  democracy, transparency and enabling civic space, including media freedom and freedom
  of expression, are indispensable safeguards of democratic resilience and long-term
  security. International law also applies to the global commons we share. Free, safe,
  autonomous and unhindered access to these spaces must be ensured within the limits
  of international law, in the air, on the seas, in outer space and in cyberspace.
  This declaration and the associated common objectives are in line with international
  mechanisms and the missions of existing multilateral organizations and forums in
  Europe (NATO, EU, OSCE, Council of Europe). Signatories who are members of NATO
  reaffirm that NATO is the foundation of their collective security and that the Alliance
  remains the cornerstone of their collective defence. They recall their ironclad
  commitment to collective defence under Article 5 of the Washington Treaty. They
  reaffirm their unwavering commitment to the transatlantic bond and to the Euro-Atlantic
  security. They recall their determination to build a stronger Europe in a stronger
  NATO, working together with the United States and Canada which continue to play
  an essential role in NATO and assuming greater responsibilities for the Alliance’s
  collective defence. Signatories who are members of the European Union reaffirm their
  commitment to a stronger and more capable European Union that is better equipped
  to act and deal autonomously with immediate and future challenges and threats with
  a 360° approach, while recognizing the challenge and threats on the Eastern Flank.
  Enlargement of the European Union, anchored in a merit-based process and as a geostrategic
  investment in peace, security, stability and prosperity, also contributes – together
  with the European Neighbourhood Policy - to the security of the continent. In this
  global context, the security of the continent depends on strengthening both national
  and collective defence capabilities in the appropriate forums to address threats
  with a 360° approach, with the aim of deterring any aggressive actions and being
  able to defend against them. It also relies on strengthening the resilience and
  robustness of our democracies, as well as human rights and rule of law. International
  cooperation, to complement and deepen European and transatlantic frameworks, should
  always be pursued with a 360° approach. Diversifying partnerships with countries
  that are committed to upholding the principles of international law and the UN Charter,
  and that offer balanced and mutually beneficial relationships under the principle
  of good neighbourly relationships contributes to security and stability in Europe
  and to address shared challenges and advance common interests. With the aim of strengthening
  security in Europe, the signatory states support the following common objectives
  in accordance with their respective international commitments and constitutional
  laws : Security – the signatory states will uphold security, peace and stability
  in Europe in accordance with the Charter of the United Nations and their respective
  international commitments, including through bilateral agreements between them and
  for the states concerned by further strengthening the North Atlantic Treaty Organisation
  and the European Union, which are cornerstones for our security. National security
  and Defence efforts – in accordance with their respective international commitments,
  security and defence policies and constitutional obligations, the signatory states
  reaffirm their commitments to strengthening their capabilities in order to respond
  to their legitimate security needs, enhance their security and ensure the defence
  of Europe. To this end, and according to their respective commitments, they will
  make the most effective use of their resources and continue to develop cooperation
  among themselves and with relevant organizations, as each of them deems appropriate.
  Collective resilience – in the face of destabilizing actions conducted below the
  threshold of armed attack, including through cyber and hybrid activities and coercion,
  and the expansion of conflict into new areas, the signatory states will work in
  order to develop the tools necessary to prevent, deter and respond to these challenges,
  to strengthen the protection of their critical infrastructure, to enhance their
  resilience, and to cooperate on a voluntary basis to improve the detection and attribution
  of these attacks, with the aim of discouraging the threats and providing a coordinated
  response and holding to account those responsible. Risk management and reduction
  – the signatory states support discussions on further risk management and reduction
  mechanisms that contribute to stability in Europe, once the conditions are met and
  peace is restored in Europe. This could address particular risks, be it military
  or coming from actions conducted below the threshold of armed aggression, aiming
  at ensuring the stability of the entire continent. Operational Planning – the signatory
  states will continue to strengthen their collective working practices and their
  joint operational capabilities for the defence and security of Europe, notably through
  NATO for those being members of it, as well through other cooperation mechanisms
  and inclusive coalitions. Industrial cooperation – the concerned signatory states
  will continue to strengthen their defence industrial production capacity and cooperation
  across Europe to develop resilient, secure and more independent supply chains and
  infrastructure for their defence equipment, without prejudice to cooperation with
  trusted partners. They will promote, as appropriate, cooperation projects between
  all European actors and foster a competitive European defence equipment market across
  Europe. They will actively work to create the necessary conditions to mobilize private
  capital, and support the growth of European defence companies. Strategic Dialogues
  – the signatory states will continue deepening their exchanges and dialogues on
  strategic issues related to European security, complementing and benefiting from
  existing collective security frameworks for those participating in them and bilateral
  arrangements. Democratic integrity – Human rights, rule of law and democratic systems,
  upon which European societies are fundamentally based, and must be protected and
  strengthened, to ensure their integrity and resilience in the face of growing deliberate
  campaigns aimed at undermining those values, including Foreign Information Manipulation
  and Interferences (FIMI). The signatory states will continue to promote solidarity,
  cooperation, and the use of the necessary mechanisms and institutions to achieve
  this goal. Fight against terrorism – the signatory states reaffirm their commitments
  in the fight against terrorism. In this framework, they condemn terrorism in all
  its forms and manifestations, including state-sponsored terrorism in the strongest
  possible terms and will continue their cooperation to respond collectively to this
  threat, in accordance with international law. Response to illicit drug and human-trafficking
  and migrant-smuggling as well as organised crime networks in Europe – the signatory
  states reaffirm that illicit drug and human-trafficking as well as organized crimes
  networks are a major threat to the security, safety and health of the citizens in
  Europe. They remain committed to fighting illicit drug and human-trafficking and
  organised crime networks in accordance with international law with the strongest
  determination and to safeguard the integrity of European societies. Security of
  supply – the signatory states will continue to work towards the reduction of their
  dependencies as well as regarding supply chains for critical components or materials.
  By diversifying and setting up new trade partnerships, they will enable Europe to
  better respond to the challenges it faces. Protection of global commons – the signatory
  states will contribute to the protection and security of global commons, ensuring,
  within the limits of international law, safe, autonomous and unhindered access to
  these areas, and taking greater responsibility when European interests are involved.
  In accordance with international law, the protection of freedom of navigation on
  international waterways, in particular, requires upholding the high seas as a space
  of freedom, cooperation, and law. These same principles apply, as appropriate, to
  other shared global commons. Contribution of Europe to Global food security – building
  on the principles of protecting global commons, the signatory states reaffirm the
  necessity of the freedom of navigation and of the safety of commercial shipping,
  notably in the Black Sea, and that the uninterrupted functioning of all maritime
  routes is essential for global food security. The above is without prejudice to
  the specific character of the security and defence policy and interests of the signatory
  states, and their respective constitutional laws and international commitments.
  Republic of Albania, Principality of Andorra, Republic of Austria, Kingdom of Belgium,
  Bosnia and Herzegovina, Republic of Bulgaria, Republic of Croatia, Republic of Cyprus,
  Czech Republic, Kingdom of Denmark, Republic of Estonia, Republic of Finland, French
  Republic, Georgia, Federal Republic of Germany, Hellenic Republic, Hungary, Republic
  of Iceland, Ireland, Italian Republic, Republic of Latvia, Principality of Liechtenstein,
  Republic of Lithuania, Grand Duchy of Luxembourg, Republic of Malta, Republic of
  Moldova, Principality of Monaco, Montenegro, Kingdom of the Netherlands, Republic
  of North Macedonia, Kingdom of Norway, Republic of Poland, Portuguese Republic,
  Romania, Republic of San Marino, Slovak Republic, Republic of Slovenia, Kingdom
  of Spain, Kingdom of Sweden, Ukraine, United Kingdom of Great Britain and Northern
  Ireland.'
