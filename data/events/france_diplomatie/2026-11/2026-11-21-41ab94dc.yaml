title: Myanmar - Judgement delivered by the International Court of Justice
text: France has noted the judgment delivered by the International Court of Justice
  on 19 November 2026 in the case of The Gambia v. Myanmar concerning Application
  of the Convention on the Prevention and Punishment of the Crime of Genocide. France
  recalls that decisions made by the ICJ are definitive and binding for the parties
  and must be implemented in order to comply fully with international law. At the
  request of Jean-Noël Barrot, Minister for Europe and Foreign Affairs, France will
  ask for a United Nations Security Council meeting to be held on the situation in
  Myanmar. In this regard, France recalls that, in accordance with Article 94 of the
  Charter of the United Nations, the Security Council may be called upon to adopt
  measures to give effect to an ICJ judgment if one party to a case fails to perform
  the obligations incumbent upon it under the judgment. France reiterates its commitment
  to international law and its unwavering support for the International Court of Justice,
  the United Nations’ main judicial body. France has been mobilized since the violence
  committed against the Rohingya began in 2017 and has worked with its partners to
  keep the situation on the Security Council’s agenda.
