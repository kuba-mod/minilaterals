title: Ukraine - Russia's deadly strikes against civilian population
text: France utterly condemns the Russian strikes that rained down on Zaporizhzhia
  Oblast on Monday 2 November, repeatedly targeting a school serving as a humanitarian
  aid centre, while people went there to receive assistance, leading to the deaths
  of over 30 civilians. Likewise, it strongly condemns Russia’s massive attacks last
  night with an unprecedented number of 110 missiles fired at Ukraine, mainly targeting
  energy infrastructure. In Kharkiv a hospital was hit, with more than 70 people injured
  and 200 patients evacuated. These new attacks against civilians and critical infrastructure
  as winter approaches illustrate once again – as if it were needed – the Kremlin’s
  cynicism and total contempt for international humanitarian law, at the very time
  when it has simultaneously been capable of accepting a targeted humanitarian ceasefire
  in Oleshky. It is crucial to maintain safe, unimpeded humanitarian access to the
  Ukrainian population. France is deeply alarmed by the violence of these attacks
  and expresses its unshakeable solidarity with Ukraine. At this time of mourning,
  it extends its condolences to the victims’ families, wishes those injured a speedy
  recovery and pays tribute to the courage of the rescuers mobilized after each strike.
  In the face of these ever more deadly attacks, it reaffirms its total determination
  to work alongside its partners to resolve the conflict, support Ukraine in the long
  term and increase pressure on Russia to end its war of aggression.
