title: ILO - Reelection of Gilbert Houngbo as Director-General of the International…
text: 'France congratulates Gilbert Houngbo on his November 16th reelection as Director-General
  of the International Labour Organization (ILO) for a five-year term beginning on
  October 1, 2027, and wishes him every success. France will continue to support the
  ILO’s modernization and reform agenda, which will strengthen its effectiveness and
  its ability to respond to changes in the labor market. At a time of deep economic,
  technological and social transformation, the ILO has a key role to play in promoting
  social justice and decent work for all. Those changes must be consistent with the
  Organization’s distinctive features: its normative mandate and tripartite structure
  that brings together governments, employers and workers. France reaffirms its full
  support for the ILO and will continue its constructive conversations with the Director-General.'
