title: Jean-Noel Barrot, minister for Europe and Foreign Affairs, mobilizes french…
text: 'M. Jean-Noël Barrot, Minister for Europe and Foreign Affairs, convened a meeting
  today, via video conference, of French ambassadors posted to countries that are
  strategic to France’s energy supplies, to review how their efforts are progressing
  to secure fuel supplies. The meeting made it possible to share the diplomatic network’s
  analyses about supply conditions and opportunities for diversifying in the event
  of a prolonged crisis. The meeting made it possible to talk about the steps being
  taken by the French diplomatic network to address the issue of all products affected
  by the current-prices crisis: crude oil, LNG and refined products. As President
  Macron stated in his televised speech on 24 September, France has the necessary
  volumes of fuel to last until the end of the year and French gas stocks are soon
  due to reach 80% full, a target set at European level. The Minister asked the ambassadors
  to continue their discussions with local authorities and stakeholders in the sector,
  in order to have up-to-date information and facilitate contacts with trading partners
  when necessary. The French diplomatic network is fully mobilized to support efforts
  to diversity and secure energy supplies in an international context marked by an
  increasing number of geopolitical shocks. This mobilization is part of an initiative
  to anticipate and coordinate, for the benefit of France’s and its European partners’
  energy security. The ultimate purpose is simple: to mobilize the French diplomatic
  network to find practical solutions to lower the fuel prices to which French people
  are currently being subjected.'
