title: United States – Commemoration of the attacks of 11 september 2001 and tribute…
text: 'Twenty-five years ago, the world changed dramatically. France has not forgotten
  the victims of the 11 September 2001 attacks, their families or the courage of those
  who risked their lives to help others. On this day of remembrance and reflection,
  it stands by the American people, to which it is united by deep and unwavering solidarity.
  Since the attacks, France and the United States have faced up to the terrorist threat
  together. Wherever it strikes, it seeks to spread fear, divide our societies and
  undermine the principles on which they are built. Because terrorism does not just
  attack lives. It attacks our freedoms, democracy, the rule of law and the right
  of peoples to freely choose their own destiny. We shall remain united against hatred
  and obscurantism. We shall continue to defend the universal values that are the
  foundation of our democracies: freedom, human rights, the rule of law and respect
  for human dignity. On this 25th anniversary, France pays solemn tribute to the victims
  of 11 September and all those who, since then, have lost their lives to acts of
  terrorism, throughout the world. In their memory, France reaffirms its determination
  to continue the fight against terrorism tirelessly with its allies and partners.
  A fight to protect our fellow citizens, safeguard our freedoms and foster the ideal
  of peace to which we remain committed.'
