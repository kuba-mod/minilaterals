title: Vietnam – Meeting between Minister for Europe and Foreign Affairs Jean-Noël…
text: On September 10, the Minister for Europe and Foreign Affairs welcomed his Vietnamese
  counterpart, Lê Hoài Trung, for a meeting in conjunction with the second official
  visit to France by Tô Lâm, the Secretary General of the Vietnamese Communist Party
  and President of the Socialist Republic of Vietnam, on the occasion of the International
  Space Summit. In line with the Comprehensive Strategic Partnership that France and
  Vietnam adopted in 2024, and its aim of strategic confidence building between our
  two countries, the two Ministers reaffirmed their commitment to multilateralism,
  respect for international law and the peaceful resolution of conflicts. The Ministers
  also discussed the international and regional crises that have engaged our two countries.
  In particular, Minister Barrot reiterated the priority need for a ceasefire in Ukraine
  and hailed Vietnam’s willingness to contribute to the dialogue between the parties
  to the conflict and to Ukraine’s reconstruction. With regard to Myanmar, the Minister
  reiterated France’s concerns over the regime’s repeated human rights violations
  against civilians.
