title: Ethiopia - Deterioration of the situation in the Tigray region
text: France is deeply concerned about the deterioration of the situation in northern
  Ethiopia and the Tigray region. In particular, it condemns the seizure of Mekelle,
  Axum and Shire airports and the attacks carried out on the Afar and Amhara regions
  by the Tigray People's Liberation Front (TPLF). It calls on all the parties concerned
  to show the utmost restraint in order to spare civilians. It is essential to avoid
  a regional escalation. France reiterates its commitment to strict respect for international
  humanitarian law and reminds the parties of their obligations in terms of civilian
  protection and humanitarian access. In this regard, obstructing, diverting and attacking
  humanitarian aid is unacceptable. France is determined to support a credible path
  to the easing of tensions, and supports the mediation process led by the African
  Union and its high representative, Olusegun Obasanjo, with a view to the effective
  implementation of the Pretoria Agreement.
