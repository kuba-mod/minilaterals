title: Russia – Summoning of the Chargé d’Affaires
text: The Chargé d’Affaires of the Embassy of the Russian Federation in France was
  summoned to the Ministry for Europe and Foreign Affairs today, Wednesday 2 September,
  at the Minister’s request. The summoning followed the establishment by Germany,
  the day before, of Russia’s responsibility in the serious incidents that occurred
  at Leipzig airport on 4 August. France utterly condemned those attacks. The Head
  of the Continental Europe Directorate reaffirmed on this occasion France’s wholehearted
  solidarity with Germany. It was underlined that the increasing number of Russian
  hybrid attacks across the whole European continent constitutes an irresponsible
  escalation on Russia’s part and once again demonstrates that the Russian war of
  aggression against Ukraine poses a threat to the security of Europe as a whole.
  It was also reiterated that, faced with the escalation Russia is choosing, France,
  alongside its partners, remains more determined than ever to support Ukraine, which
  is defending its freedom, sovereignty and territorial integrity, and is decisively
  contributing to Euro-Atlantic security. It was emphasized that France will support
  the adoption of further sanctions against Russia to cut its war effort and put a
  stop to its hostile actions. France will continue, with its allies and partners,
  to increase the protection and resilience of our partners, our democracies and our
  citizens against these hybrid actions and destabilization attempts. Finally, Ukraine’s
  right to defend itself against Russian aggression was reaffirmed. France will continue
  to stand at its side and support it to safeguard its sovereignty and territorial
  integrity. France continues to call on Russia to end its war of aggression against
  Ukraine by committing to a ceasefire and genuine negotiations for a just and lasting
  peace, as Ukraine and its partners have long been prepared to do.
