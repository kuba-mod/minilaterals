title: Statement of the Foreign ministers of Canada, Denmark, Finland, France, Iceland…
text: '1. The Government of Israel’s actions in the West Bank are undermining the
  possibility of a two-State solution. The situation is rapidly deteriorating amid
  unprecedented levels of settler violence and settlement expansion, including the
  unacceptable decision to publish tenders for the E1 settlement project. UK Prime
  Minister Andy Burnham, the President of France Emmanuel Macron and Prime Minister
  of Canada Mark Carney have agreed on the need to take action to prevent further
  damage. 2. Today, Canada, Denmark, Finland, France, Iceland, Ireland, Norway, Poland,
  Portugal, Spain, Sweden and the UK confirm their intention to introduce national
  and/or support European restrictions on trade in goods with settlements which are
  illegal under international law, or that they are actively considering these and
  other measures, in accordance with their national procedures. In this regard, the
  UK, France and Canada welcome the important action already taken by Ireland, Spain,
  the Netherlands, Norway and Belgium and will bring forward national measures to
  ban trade in settlement goods. 3. Together, we are resolute: the two-state solution
  must be protected, and we will take action in pursuit of a just and lasting peace,
  based on the principles enshrined in the New York Declaration adopted one year ago.
  We firmly oppose actions tantamount to the annexation of Palestinian land and forcible
  displacement of the Palestinian population. 4. The Government of Israel must immediately
  halt the expansion of settlements and civilian administrative powers, ensure accountability
  for settler violence, and investigate allegations against Israeli forces. 5. We
  recognize Israel’s legitimate security interests and reiterate our condemnation
  of the Hamas 7 October terrorist attack, the worst antisemitic massacre since the
  Holocaust. We are clear in our determination to tackle antisemitism wherever it
  occurs. We are unequivocally committed to the two-state solution, in accordance
  with relevant UN Security Council resolutions, that enables Israel and a sovereign,
  democratic and viable Palestinian state to live side by side in peace, security
  and mutual recognition within secure and internationally recognised borders.'
