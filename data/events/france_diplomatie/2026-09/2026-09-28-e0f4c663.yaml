title: Joint Statement on International Safe Abortion Day
text: 'On the occasion of International Safe Abortion Day, Ambassadors, Envoys and
  Governments of Denmark, Estonia, Finland, France, Iceland, Lithuania, Luxembourg,
  the Netherlands, Norway, Spain and Sweden and the United Kingdom have released the
  following statement: “On International Safe Abortion Day 2026, we, Ambassadors,
  Envoys and Governments, reaffirm the rights of women and girls, in all their diversity,
  to make decisions about their own bodies and lives. Access to safe, timely and affordable
  abortion care is key for the realisation of bodily autonomy, gender equality, human
  rights, democracy and universal health coverage for all. The World Health Organization
  (WHO) recognises that restrictive abortion laws create barriers to accessing safe,
  quality abortion care and lead to increased maternal mortality and morbidity, as
  well as other human rights violations. Its evidence shows that restricting abortion
  access, makes abortion unsafe. Women and girls in already vulnerable situations
  are affected the most. This year on International Safe Abortion Day, in line with
  WHO guidelines and international human rights standards, we urge the adoption of
  laws and policies that support access to safe abortion care. We highlight the important
  work of movements and human rights defenders to advance the decriminalisation of
  abortion and the right to access abortion care and urge for their work to be protected
  and supported. We stress that it is time to guarantee the sexual and reproductive
  health and rights of everyone, including the right to make decisions about their
  own bodies and lives and to ensure access to quality abortion care and comprehensive
  sexual and reproductive health services, including access to modern contraception,
  information and education.”'
