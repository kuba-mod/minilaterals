title: Meeting between Jean-Noël barrot, Minister for Europe and Foreign affairs,
  and…
text: Jean-Noël Barrot, Minister for Europe and Foreign Affairs, had a meeting with
  his Jordanian counterpart Ayman Safadi  yesterday, Friday 4 September 2026, as part
  of their regular discussions. The Minister talked to his counterpart about the situation
  in the Middle East. He reiterated France’s condemnation of the Iranian strikes that
  targeted Jordanian territory, as well as France’s wholehearted support for the security
  and stability of Jordan. The two ministers reaffirmed their commitment to a diplomatic
  solution, which is the only one capable of responding to the threats posed by Iran
  and restoring lasting peace in the region. As regards Palestine, the Minister voiced
  his deep concern about the expansion of settlement activity in the West Bank, particularly
  following the publication of a tender for the E1 project, and about the increasing
  acts of violence committed by settlers. He reaffirmed France’s steadfast commitment
  to the two-state solution. He stressed the urgency of addressing the catastrophic
  humanitarian situation in Gaza and the need, in this respect, of guaranteeing massive,
  unfettered humanitarian access. Finally, he emphasized the need for the Palestinian
  legislative and presidential elections to go ahead as planned, in accordance with
  the commitments made by President Abbas. The Minister reiterated France’s unfailing
  commitment to Lebanon’s sovereignty and stability. With this in mind, he underlined
  the importance of stepping up international support for Lebanon’s internal security
  forces and armed forces. He highlighted the need for the framework agreement signed
  on 26 June to be implemented by all the parties to pave the way for the complete
  recovery of Lebanese sovereignty within the country’s borders, in accordance with
  the provisions of United Nations Security Council Resolution 1701. The Minister
  reaffirmed France’s commitment to the sovereignty and stability of Syria and Iraq,
  which are also facing the repercussions of the regional crisis. Finally, the two
  ministers agreed to continue their close coordination on the regional crises and
  strengthen the partnership between France and Jordan.
