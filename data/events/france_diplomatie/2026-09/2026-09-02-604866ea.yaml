title: Germany - Incidents at Leipzig airport
text: France reaffirms its wholehearted solidarity with Germany, which has just established
  Russia’s responsibility in the serious incidents that occurred at Leipzig airport
  at the beginning of August. While Russia chooses to continue its war of aggression
  against Ukraine and hybrid actions in Europe are on the increase, France will continue
  playing its full part in identifying and implementing the firm responses that must
  be provided. Faced with the escalation Russia is choosing, we must remain united
  and determined. With its partners and allies, France will continue to step up its
  support for Ukraine, its independence and sovereignty. It will support the adoption
  of further sanctions against Russia to cut its war effort and put a stop to its
  hostile actions. It will continue, with its allies and partners, to increase the
  protection of our countries, our democracies and our citizens against these hybrid
  actions and destabilization attempts. At the request of M. Jean-Noël Barrot, Minister
  for Europe and Foreign Affairs, the Russian Embassy’s chargé d’affaires has been
  summoned to the Quai d’Orsay.
