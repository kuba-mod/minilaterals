title: 'France - Panama: A long-term security partnership'
text: On September 14, Minister Delegate for Foreign Trade and Economic Attractiveness
  Nicolas Forissier, who serves under France’s Minister for Europe and Foreign Affairs,
  met with Luis Felipe Icaza, Panama’s Vice Minister for Public Security, and Juan
  Carlos Rodríguez, the Secretary General of Panama’s Public Security Ministry, during
  his visit to that country. Like other aspects of our bilateral relationship, French-Panamanian
  security cooperation enjoys strong momentum. To help meet the challenges of monitoring
  maritime traffic and combating drug trafficking, the two countries signed four letters
  of intent a year ago to step up coordination on defense, customs and policing. Our
  trust-based relationship is reflected by a series of high-level meetings, notably
  including the visit to Panama by the director of France’s Office of Anti-Narcotics
  and Drug Trafficking (OFAST) this past April, and Mr. Icaza’s participation in the
  Regional Security Conference in Martinique this past July, accompanied by representatives
  of the Panamanian police and judiciary. Nicolas Forissier’s visit to the Ministry
  of Public Security is yet another illustration of this rapprochement. Mr. Forissier
  expressed France’s thanks for Panama’s efforts to combat organized crime and drug
  trafficking, and to ensure maritime security, under the leadership of Minister of
  Public Security Frank Alexis Ábrego Mendoza. Minister Forissier and Secretary General
  Rodriguez presided over the launch of a working group focused on security and equipment;
  a delegation of several French security companies was also on hand for the occasion.
  This is a major new step forward in the security and defense relationship between
  our two countries. It follows on from the April 22nd signing of a letter of intent
  on expanding cooperation on security, and procuring and financing equipment. During
  their discussions, companies reiterated their willingness to supply equipment to
  Panama’s security forces. The Security and Equipment Working Group will meet regularly 
  with representatives of both countries to keep talks going and highlight opportunities.
  Secretary General Juan Carlos Rodríguez and Minister Forissier hailed this concrete
  progress which will benefit the people of both countries and enhance international
  security.
