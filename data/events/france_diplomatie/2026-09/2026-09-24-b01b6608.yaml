title: European Union – Restrictive measures against Xenia Fedorova
text: Jean-Noël Barrot, Minister for Europe and Foreign Affairs, welcomed the Council
  of the European Union’s adoption today, Thursday 24 September 2026, of restrictive
  measures against Ms Xenia Fedorova, a Russian agent of influence active in France.
  This step, promoted together with Germany, aims to counter destabilization activities
  conducted by Russia on European territory. France had already taken national measures
  against her in July. The European measures substantially increase their scope. They
  involve a freeze on her assets, a ban on EU citizens and companies making funds,
  financial assets or economic resources available to her, and a travel ban that prevents
  her from entering EU territory or passing through it.
