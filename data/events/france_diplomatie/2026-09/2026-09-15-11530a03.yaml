title: International Day of Democracy
text: 'On this International Day of Democracy, France reaffirms its deep commitment
  to democratic principles, the rule of law and the protection of human rights – the
  cornerstones of our Republic and its diplomatic efforts to promote peace. France
  expresses its deep concern over the setbacks experienced by democracy worldwide
  at levels unseen in half a century. This decline, which is leading to the debasement
  of international relations and challenges to multilateralism, is undermining the
  very things that ensure the balance of our societies: an independent judiciary,
  political pluralism, fundamental rights and information integrity. But this democratic
  backsliding is not inevitable. France and its partners speak with one voice, particularly
  within the European Union, through the establishment of the European Democracy Shield,
  and within the Council of Europe, which is creating a New Democratic Pact. Internationally,
  France is working actively within the UN General Assembly and the Human Rights Council.
  It has strengthened its commitment to a trustworthy information space and supports
  civil society organizations that work each day to uphold the requirements of democracy.
  Through the Marianne Initiative, it offers support to human rights activists who
  are threatened because of their work. On this International Day of Democracy, France
  reaffirms the importance of preserving the resilience of our democracies based on
  trust, vigilance and respect for election integrity, so that citizens can express
  their will freely and fully.'
