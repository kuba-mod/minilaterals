title: Yemen - Houthi attacks in Yemen and against Saudi Arabia
text: France utterly condemns the Houthi attacks on civilian infrastructure in Yemen
  and Saudi Arabia. It expresses its wholehearted solidarity with the Yemeni authorities
  and the Kingdom of Saudi Arabia. France calls on the Houthis to immediately cease
  all military action. It reiterates its support for the political process conducted
  under the aegis of the United Nations.
