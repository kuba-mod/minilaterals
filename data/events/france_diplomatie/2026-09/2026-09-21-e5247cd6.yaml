title: United States – Adoption of the Lindsey Graham Act (September 18, 2026)
text: France welcomes the adoption of the Lindsey Graham Act on September 16, which
  shows the U.S. Congress’s strong support for Ukraine in the face of Russian aggression.
  This added pressure on Russia and on the financing of its war effort sends a strong
  signal that is in line with the commitments made at the G7 summit in Evian, and
  the priorities implemented by France and its EU partners in response to Russia’s
  aggression in Ukraine. The 21st European sanctions package adopted in July, along
  with upcoming packages currently under development, are part of this collective
  effort. In this regard, we are working closely with the United States on efforts
  to support Ukraine and put pressure on Russia as we implement sanctions and combat
  attempts to circumvent them.
