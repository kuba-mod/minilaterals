title: Informal G7 Foreign ministers'meeting on the sidelines of the United Nations…
text: Jean-Noël Barrot, Minister for Europe and Foreign Affairs, invited the G7 Foreign
  Ministers of Canada, Italy, Japan, Germany, the United Kingdom, the United States
  of America, and the High Representative of the European Union, to meet on the sidelines
  of the High-level Week of the 81 st session of the United Nations General Assembly.
  As Ukraine is a priority for the French G7 Presidency, the invitation extended to
  the Ukrainian Foreign Minister provided an opportunity for G7 representatives to
  reaffirm their unwavering support to Ukraine, its sovereignty and territorial integrity.
  Discussions focused on strengthening financial and military support to Ukraine,
  particularly in terms of air defense; energy resilience, to help it get through
  the coming winter; stepping up the pressure on Russia’s war economy; and the disastrous
  effects on global food security caused by Russia's campaign targeting Ukrainian
  grain exports transiting across the Black Sea. The G7 representatives also spoke
  about the situation in the Middle East, particularly the importance of restoring
  freedom of navigation. A G7 Statement on Bab al-Mandab and Navigational Rights and
  Freedoms was endorsed by the Ministers on the occasion. Other major international
  issues were also addressed, including the situations in North Korea, and the importance
  of a free and open Indo-Pacific region, founded on the rule of law. The Minister
  for Europe and Foreign Affairs, Mr Jean-Noël Barrot, invited his counterparts to
  the second formal G7 Foreign Ministers’ meeting under the French Presidency, which
  will be held in Marseille on 9 and 10 November 2026.
