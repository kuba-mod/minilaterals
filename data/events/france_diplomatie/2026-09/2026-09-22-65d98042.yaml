title: UNGA - Meeting between Jean-Noel Barrot, minister for Europe and Foreign…
text: Mr Jean-Noël Barrot, Minister for Europe and Foreign Affairs, had a meeting
  with his Iranian counterpart, Mr Abbas Araghchi, in New York today, 22 September
  2026, on the sidelines of the United Nations General Assembly. The two ministers
  discussed the regional situation. The Minister called on his counterpart to re-commit
  to the path of diplomacy and reiterated France’s readiness to help find a diplomatic
  solution, the only one capable of resolving the ongoing conflict and addressing
  the concerns raised in particular by the Iranian nuclear programme. The Minister
  recalled the priority of reopening the Strait of Hormuz, the blocking of which poses
  a serious threat to regional stability, as well as to global energy and food security.
  He also recalled France’s unwavering commitment to respect for international law,
  freedom of navigation and maritime security. On the bilateral front, the Minister
  for Europe and Foreign Affairs talked to his counterpart about the unacceptable
  attacks on our staff and our diplomatic presence in Tehran. He reiterated France’s
  condemnation of the Iranian security forces’ intrusion into the French Language
  Centre and the Iranian authorities’ decision to close it down. He reaffirmed the
  absolute need to guarantee the safety of diplomatic staff and French facilities
  in Iran.
