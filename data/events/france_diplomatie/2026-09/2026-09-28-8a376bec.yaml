title: France condemns the Russian attack on the National Academy of Sciences of…
text: Jean-Noël Barrot, Minister for Europe and Foreign Affairs, and Philippe Baptiste,
  Minister for Higher Education, Research and Space, utterly condemn the Russian drone
  attack on the National Academy of Sciences of Ukraine in Kyiv, which killed one
  person and injured several others. They extend their condolences to the victim’s
  loved ones and express their sol idarity with those injured and with the whole Ukrainian
  scientific community. This strike is part of Russia’s ongoing attacks on Ukrainian
  civilian infrastructure, which violate international law. The targeting of universities,
  laboratories and places of knowledge represents an unacceptable attack on Ukraine’s
  very future. For more than four years Ukrainian researchers, teachers and students
  have continued to teach, research and bring science alive despite the war. France
  pays tribute to their courage and determination. It will continue to stand by Ukraine
  and its scientists. It will pursue its efforts to support the Ukrainian scientific
  community, particularly by developing bilateral and European cooperation projects
  in the higher-education and research fields. These crimes will not go unpunished.
  France will continue supporting efforts to document attacks on civilians and civilian
  infrastructure in Ukraine and to bring those responsible to justice. It reaffirms
  its unwavering support for Ukraine, its sovereignty and its territorial integrity,
  as well as for free and independent science.
