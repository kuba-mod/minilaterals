title: Kosovo - Ruling by the Kosovo Specialist Chambers
text: France notes the judgment issued by the Kosovo Specialist Chambers in the Hashim
  Thaçi et al case. The judgment, which is subject to appeal, marks the conclusion
  of the first-instance trials at the Chambers, with the exception of cases relating
  to offences against the administration of justice. France reiterates its support
  for the Kosovo Specialist Chambers and recalls its commitment to the fight against
  impunity. It also reaffirms its steadfast support for Kosovo’s independence and
  institutions.
