title: United Nations General Assembly – Meeting between Jean-Noel Barrot, Minister…
text: On the occasion of the United Nations General Assembly, which is being held
  in New York (United States), M. Jean-Noël Barrot, Minister for Europe and Foreign
  Affairs, spoke to Mr Subrahmanyam Jaishankar, External Affairs Minister of India,
  on 21 September. The two ministers reiterated France and India’s commitment to international
  law and their joint commitment to a reformed, effective multilateralism. In particular,
  they recalled France and India’s determination to reform the Security Council. They
  reaffirmed their support for a ceasefire in Ukraine and for a comprehensive, just
  and lasting peace, in accordance with international law. The two ministers also
  highlighted the imperative of freedom of navigation in the Strait of Hormuz and
  the Bab el-Mandeb Strait. The Minister proposed to India to work jointly on this
  crucial issue for Europe and Asia’s stability and prosperity, and recalled the Franco-British
  initiative launched to ensure freedom of navigation in the Strait of Hormuz. They
  welcomed the progress of the India-France Special Global Strategic Partnership,
  particularly in the fields of defence, new technology and higher education.
