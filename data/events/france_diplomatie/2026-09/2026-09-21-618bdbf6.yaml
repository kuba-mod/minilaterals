title: UNGA - Minister for Europe and Foreign Affairs Jean-Noel Barrot's participation…
text: The Minister for Europe and Foreign Affairs held a working meeting in New York
  with his Gulf Cooperation Council (GCC) counterparts on 21 September 2026. The meeting
  provided an opportunity to discuss the regional situation. The Minister reaffirmed
  to his counterparts France’s solidarity and its support in the face of the unacceptable
  Iranian attacks they have suffered. The Minister emphasized the importance of closely
  coordinating with the GCC and stepping up joint efforts to resolve the crises in
  the region, which are affecting the security and stability of the Middle East but
  also of global supplies. As regards Iran in particular, he recalled France’s full
  mobilization with a view to reaching a lasting diplomatic solution, dealing with
  all elements of the Iranian threat. The ministers reaffirmed the need to guarantee
  freedom of navigation. The meeting also allowed them to reiterate France’s and the
  GCC’s wish to strengthen bilateral cooperation even further, including in sectors
  such as investment, health, energy, education and culture, and on global issues.
