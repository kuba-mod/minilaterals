title: UNGA - Meeting between Jean-Noel Barrot, Minister for Europe and Foreign…
text: Mr Jean-Noël Barrot, Minister for Europe and Foreign Affairs, had a meeting
  in New York with his Mexican counterpart, Mr Roberto Velasco Álvarez, on 21 September
  2026. The ministers welcomed the successful revitalization of the French-Mexican
  initiative on the regulation of the veto in cases of mass atrocities. It now brings
  together 128 States, 21 of which joined in the past four months. It is a significant
  step forward in promoting an effective multilateralism capable of responding to
  the expectations of populations in distress. he two ministers reaffirmed the importance
  of the partnership between France and Mexico. Among other things, they discussed
  the prospects for strengthening bilateral cooperation in the political, economic
  and cultural fields. In this regard, they welcomed the reciprocal display of [Aztec]
  codices. They spoke about the prospects for visits by French authorities to Mexico
  and Mexican authorities to France in 2026, the 200 th anniversary year of the establishment
  of our diplomatic relations. Finally, the meeting provided an opportunity to discuss
  the revitalization of the Franco-Mexican Strategic Council (CSFM), in accordance
  with the commitment made by the Mexican President and President Macron during his
  visit to Mexico in November 2025.
