title: Nepal – France sends five tons of humanitarian aid to Nepal to help the…
text: Following the terrible flooding and landslides that hit Nepal and China on August
  26, the Ministry for Europe and Foreign Affairs and our embassies have mobilized
  their efforts, working closely with local officials. Sadly, the casualty count was
  very high. Four of our fellow citizens are still missing. We are continuing our
  efforts to find them, and we remain in contact with their families. France also
  mobilized assistance for the Nepalese Red Cross, UNICEF and French NGOs working
  with local communities on the ground. This effort is aimed at providing emergency
  shelters, water and healthcare, and at restoring essential services to the victims
  of this disaster, especially mothers and children. Furthermore, in response to the
  needs expressed by the Nepalese authorities, France shipped five tons of basic emergency
  equipment and medicines to Nepal. This emergency shipment arrived in Katmandu on
  September 15 and is expected to help more than a thousand disaster victims. It will
  be turned over to the Nepalese agency in charge of coordinating disaster management
  (NDRRMA). This aid operation was managed by the Ministry for Europe and Foreign
  Affairs’ Crisis and Support Center, with support from Electriciens sans Frontières
  and Tulipe, the town of Chambéry, and the European Union Civil Protection Mechanism
  (UCPM). France reaffirms its heartfelt solidarity with the Nepalese people. Our
  thoughts go out to the victims, their loved ones, and all those affected by this
  disaster.
