title: China - Conversation between Jean-Noel Barrot, minister for Europe and Foreign…
text: M. Jean-Noël Barrot, Minister for Europe and Foreign Affairs, spoke on the telephone
  today, Monday 14 September, to Mr Wang Yi, Director of the Office of the Central
  Commission for Foreign Affairs of the Chinese Communist Party and Minister of Foreign
  Affairs of the People’s Republic of China. The two ministers emphasized the joint
  responsibility of France and China, as permanent members of the United Nations Security
  Council, to work to find constructive solutions to the threats that hang over the
  security and stability of the world. They talked, among other things, about the
  Russian war of aggression against Ukraine. The [French] Minister highlighted Russia’s
  irresponsibility, the difficulties encountered by Russia and the support France
  is lending Ukraine. The two ministers discussed the situation in the Strait of Hormuz
  and the Bab al-Mandab Strait, a major issue for stability and prosperity in Europe
  and Asia. The Minister recalled the Franco-British initiative to guarantee freedom
  of navigation in the Strait of Hormuz and called for continued discussions with
  China about it. In the spirit of President Macron’s state visit to China in December
  2025, the ministers talked about prospects for the bilateral relationship. The Minister
  lent his support for dialogue on the ongoing trade issues between the European Union
  and China, which is intended to lead to a substantial rebalancing of trade, at a
  time when Europe’s trade deficit is unsustainable. The two ministers agreed to maintain
  discussions on all these issues.
