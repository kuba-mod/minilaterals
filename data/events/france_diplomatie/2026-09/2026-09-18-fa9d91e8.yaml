title: Russia - Placing of several french and european companies' russian subsidiaries…
text: France condemns the unjustified placing of several French and European companies’
  Russian subsidiaries under temporary administration. France is in close contact
  with the companies concerned and calls on the Russian authorities to reverse the
  decision.
