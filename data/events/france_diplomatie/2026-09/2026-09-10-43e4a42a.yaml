title: Fight against drug trafficking – Joint statement issued by the French Republic…
text: on the occasion of the meeting between Minister for Europe and Foreign Affairs
  Jean-Noël Barrot and Minister of Foreign Affairs Rubén Ramírez Lezcano ​ 1/ France
  and Paraguay reaffirm their joint commitment to preventing and combating drug trafficking,
  dismantling criminal networks, and confronting the health and social consequences
  of drug use. In light of the growth and complexity of drug trafficking, which affects
  both of our countries and regions, France and Paraguay strongly believe that international
  cooperation is necessary to combat this criminal phenomenon. To that end, our actions
  and our cooperation are extensive and well balanced, and fully compliant with international
  law and human rights. 2/ Latin America and the Caribbean are priority regions for
  France. The fight against transnational crime and drug trafficking is a shared concern
  that brings our countries closer together. During Minister Jean-Noël Barrot’s visit
  to Colombia in November 2025, France presented a series of measures aimed at strengthening
  its commitment to preventing and combating drug trafficking. In July 2026, during
  France’s G7 Presidency, France hosted a regional conference on security in the Caribbean,
  a multilateral initiative aimed at strengthening cooperation in order to more effectively
  fight organized crime, and especially the traffic of drugs and firearms. 3/ Combating
  drug trafficking is also a priority for Paraguay, which has adopted a zero-tolerance
  approach via a comprehensive strategy that combines strengthened security forces
  and prevention programs. Land and air operations in critical border areas have been
  stepped up, making it possible to dismantle criminal networks and close major production
  and storage sites. These efforts are enhanced by Paraguay’s active participation
  in regional and international initiatives in partnership with other countries, the
  United Nations, the European Union and other actors. 4/ The bilateral consultations
  between France and Paraguay held in Paris last April facilitated in-depth discussions
  on the fight against drug trafficking and the strengthening of bilateral cooperation
  on security. On that occasion, France and Paraguay adopted a declaration of intent
  to strengthen cooperation on prevention, investigations and prosecutions aimed at
  combating human trafficking. 5/ Given the critical importance of these issues for
  France and Paraguay, and in view of the positive momentum characterizing their bilateral
  relations, France and Paraguay reaffirm their determination to strengthen their
  cooperation and their commitment to pursuing a close dialogue on these matters.
