title: UNGA - Roundtable with Israeli and Palestinian civil society representatives…
text: 'Opening remarks by Jean-Noel Barrot, minister for Europe and Foreign Affairs
  Representatives of civil society organizations, I am very happy to host this meeting.
  We have roughly 25 countries represented and the whole spectrum of organization
  representing Israelis and Palestinians. I want to thank the Ministers of Foreign
  Affairs and all those from the civil society organizations for their presence in
  Paris in June 2025, for their presence again in Paris June 2026, and for their presence
  today, but also, and perhaps more importantly, for their unwavering commitment to
  peace and justice, dignity and the two-state solution. And I want to tell you that
  without you the two-state solution would probably be no longer alive. Because it
  is not only about governance. Without you the adoption of the New York Declaration
  last year would probably not have been possible. And without you there would probably
  not have been a peace plan endorsed by resolution 2803 of the Security Council.
  One year later, what are we looking at? The full-blown war has ended in Gaza, the
  last Hamas hostages have been returned, and some – but insufficient – humanitarian
  help has entered in Gaza. But the situation there remains catastrophic. Hamas must
  still surrender its weapons and settlements and violence are exploding in the West
  Bank, making de facto annexation a reality. Are we going to give up? No, we are
  not. Are we tired? No, we are not, and this is the reasons why we are here today.
  We are here to talk about the next steps, about the road ahead. And before giving
  the floor to Kaja Kallas for introductory remarks and then to civil society representatives,
  let me share with you what I see as an important next step: Palestinian elections.
  Why? Because it has been 20 years now that there have not been national elections
  in Palestine. Because President Abbas committed to President Macron and the Crown
  Prince in June of 2025 to hold legislative and presidential elections. Because a
  date has been set for legislative elections in Palestine, the November 28, 2026,
  and presidential elections have been scheduled for the first term of 2027. Because
  municipal elections have been held in April in Gaza, which proves that this is possible.
  And finally, because only a rejuvenated PA can represent the Palestinian people
  and negotiate peace with Israel. There is no better way for the Palestinian people
  to prevent annexation, to get rid of Hamas, and to achieve self-determination than
  this: a ballot. A ballot is stronger than a bullet. And the Palestinian people has
  the right to express itself and to vote. So let us all dedicate ourselves to this
  goal: Palestinian elections now.'
