title: Togo - Release of Gael Mocaer and Sebastian Perez Pezzani
text: Messrs Gaël Mocaër and Sebastian Perez Pezzani, filmmakers arrested in Togo
  on 27 July 2026, were notified of a decision granting them provisional release on
  1 September, with permission to leave the territory. This is a huge relief to their
  loved ones and the Ministry for Europe and Foreign Affairs, which was actively engaged
  in securing this outcome.
