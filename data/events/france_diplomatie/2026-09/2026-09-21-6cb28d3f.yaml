title: UNGA - Meeting between Jean-Noel Barrot, Minister for Europe and Foreign…
text: Jean-Noël Barrot, Minister for Europe and Foreign Affairs, had a meeting on
  21 September 2026, on the sidelines of the 81 st session of the United Nations General
  Assembly, with his counterpart Ishaq Dar, Pakistan’s Deputy Prime Minister and Minister
  for Foreign Affairs. The Minister for Europe and Foreign Affairs welcomed Pakistan’s
  efforts mediating between Iran and the United States and emphasized the need to
  guarantee the most inclusive negotiations possible to help secure supplies, especially
  energy supplies, and also permanently resolve the threats from Iran on the nuclear,
  ballistic and regional fronts. The two ministers discussed regional developments.
  They agreed to continue developing the bilateral relationship, especially in terms
  of academic cooperation, cultural cooperation and sustainable development.
