title: Meeting of G7 Development Ministers in New York
text: The Minister Delegate for Francophonie, International Partnerships, and French
  Nationals Abroad, Ms. Eléonore Caroit, chaired a meeting of G7 Development Ministers
  on September 23, 2026, in New York, on the margins of the United Nations General
  Assembly. France, as G7 Presidency, chose to involve major emerging economies and
  regional partners in the work towards a more cohesive G7. The representatives from
  India, Brazil, the Republic of Korea and Egypt, as well as representatives from
  Nepal, the African Development Bank, the World Bank Group, and the United Nations
  Development Program, participated in the discussions. The meeting’s agenda focused
  on promoting the new approach based on mutually beneficial partnerships into the
  international development system, building on the work carried out at the Evian
  Summit (June 15-17, 2026), and also addressed the situation in Nepal. This meeting
  aimed to deepen the implementation of a renewed approach designed to move beyond
  the traditional development policies to achieve greater effectiveness and efficiency.
  The Ministers advocated for a more strategic use of official development assistance
  where it is most needed to support the most vulnerable countries, for promoting
  an ambitious reform agenda to streamline the international development architecture,
  as well as for supporting the sovereignty and resilience of partner countries. The
  discussions also addressed the mobilization of domestic public resources and of
  private capital in favour of development. They also addressed supporting concrete
  initiatives to mobilize private capital in partner countries, particularly in Africa.
  Following the Africa Forward Summit (May 11-12, 2026), several G7 members, including
  France, reaffirmed their support for the ATIDI (African Trade & Investment Development
  Insurance) initiative, which provides (political or credit) risks insurances through
  a guarantee mechanism. Regarding Nepal, following the devastating floods and landslides
  that occurred at the end of August, G7 Development Ministers reiterated their solidarity
  with the Nepalese people. They presented the response of G7 members to the urgent
  needs of the affected populations. Together, G7 members contribute a total of 69,4
  M USD. The Ministers also supported the efforts of the World Bank, the Asian development
  Bank and the UNDP to prepare for the reconstruction of the affected areas. The Ministers
  reaffirmed their commitment to promoting cooperation in reconstruction efforts and
  to strengthening the resilience of countries vulnerable to disasters. They emphasized
  the importance of disaster risk reduction to strengthen the resilience of the most
  vulnerable countries, including through early warning systems for natural disasters
  and Earth observation capabilities, and highlighted the role of the CREWS (Climate
  Risk and Early Warning Systems) initiative. The G7 Development Ministers and partner
  countries will meet on October 16th in Bangkok, on the margins of the World Bank
  and International Monetary Fund's annual meetings, to discuss the progress of these
  initiatives.
