title: Iran - Closure of the french langage Centre
text: France condemns in the strongest terms the Iranian security forces’ intrusion
  into the premises of the French Language Centre in Tehran, and the Iranian authorities’
  announcement of the centre’s closure. This new attack on the French cultural presence
  in Iran, which follows the attack on two employees of the French Embassy in July,
  is unjustifiable and unacceptable. It will penalize thousands of Iranians who benefit
  every year from the French courses offered by the French Language Centre. France
  will take the appropriate measures to respond to it. Furthermore, at the request
  of M. Jean-Noël Barrot, Minister for Europe and Foreign Affairs, the Ambassador
  of the Islamic Republic of Iran will be summoned to the Quai d’Orsay.
