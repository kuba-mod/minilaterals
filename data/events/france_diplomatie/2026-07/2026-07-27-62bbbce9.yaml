title: Israel/Palestine - Situation in the West Bank
text: France expresses its deep concern over the violence that has taken place in
  the West Bank over the past several days, resulting in both Israeli and Palestinian
  casualties. It offers its condolences to the victims’ families and wishes those
  injured a speedy recovery. With the Israeli authorities’ announcement that they
  were launching a major military operation in the West Bank, France calls on all
  the parties to show calm and restraint. We remind the Israeli Army of its responsibility
  to protect civilian populations. At a time when ongoing settlement activity is exacerbating
  tensions, and with settler violence on the rise, France reaffirms its support for
  the two-state solution, the only option for ending the cycle of violence.
