title: Meeting of the Bilateral Committee on Civil Nuclear Matters
text: As part of the Franco-Kazakh Agreement on the development of the peaceful uses
  of nuclear energy, the Ministry for Europe and Foreign Affairs of France hosted,
  on 28–29 July, a meeting of the Bilateral Committee on Civil Nuclear Matters. The
  purpose of this Committee is to review the progress of scientific and industrial
  cooperation and to set out future prospects. The Kazakh delegation, led by Mr Almassadam
  Satkaliyev, Chairman of the Agency of the Republic of Kazakhstan for Atomic Energy,
  met on this occasion with Mr Jean-Noël Barrot, Minister for Europe and Foreign Affairs
  of France, Mr Nicolas Forissier, Minister Delegate for Foreign Trade and Economic
  Attractiveness, and Ms Anne-Isabelle Etienvre, Director-General of the CEA. France
  and Kazakhstan reaffirm, on this occasion, the strength and long-term nature of
  their energy cooperation, following the strengthening of their strategic partnership
  formalised in 2024.
