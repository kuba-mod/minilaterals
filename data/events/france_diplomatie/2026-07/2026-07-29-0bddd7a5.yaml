title: United Kingdom - Jean-Noël Barrot's meeting with Ed Miliband
text: M. Jean-Noël Barrot, Minister for Europe and Foreign Affairs, had a meeting
  with Mr Ed Miliband, Secretary of State for Foreign, Commonwealth and Development
  Affairs of the United Kingdom, in Paris on 29 July. This first visit to France by
  Mr Miliband, a week after his appointment at the head of the Foreign, Commonwealth
  and Development Office (FCDO), shows the richness of our bilateral relationship
  and the importance of our coordination on the major international issues. Building
  on the Coalition of the Willing summit of 13 July, the two ministers reaffirmed
  their resolute support for Ukraine and their determination to step up pressure on
  the Russian war effort, particularly by fighting the shadow fleet. On the Middle
  East, they highlighted the role of Franco-British cooperation in the implementation
  of the multinational mission to support freedom of navigation in the Strait of Hormuz,
  while calling for the conflict to be resolved diplomatically. The ministers adopted
  a joint statement calling, among other things, for their operational cooperation
  to be intensified in view of the climate risks and for international efforts aimed
  at strengthening climate resilience in every sphere to be accelerated.
