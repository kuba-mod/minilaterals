title: Conversation between Jean-Noël Barrot and Mexican Secretary of Foreign Affairs…
text: Minister for Europe and Foreign Affairs Jean-Noël Barrot spoke with his Mexican
  counterpart, Roberto Velasco Álvarez, on July 27. The Minister began by thanking
  his counterpart for Mexico’s offer to help fight the violent forest fires in France.
  The Ministers praised the May 14th adoption of the Modernized Action Plan for the
  France-Mexico Strategic Partnership following the joint declaration issued by President
  Macron and Mexican President Claudia Sheinbaum during the French President’s visit
  to Mexico last November. In particular, they discussed the joint French-Mexican
  initiative to suspend UN Security Council veto powers in cases of mass atrocities.
  They lauded the global momentum in support of this initiative, marked by the recent
  adhesion of 13 new countries, bringing the total number to 120. They agreed to continue
  their joint efforts to promote this initiative. Lastly, the Minister for Europe
  and Foreign Affairs discussed prospects for visits by French authorities to Mexico
  in 2026 as part of celebrations marking the bicentennial of our diplomatic relations
  and invited his Mexican counterpart to visit France.
