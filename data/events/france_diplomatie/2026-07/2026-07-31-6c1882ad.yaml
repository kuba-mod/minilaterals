title: Egypt – Drone attack
text: France voices its full solidarity with Egypt following the drone attack on two
  ships in the port of Damietta on 29 July, which it utterly condemns. It reiterates
  its unwavering commitment to the security, sovereignty and territorial integrity
  of Egypt and all its partners in the Middle East. It remains active and ready to
  contribute to their defence. The diplomatic efforts to restore peace and stability
  to the region must go on. France will continue playing its full part in them.
