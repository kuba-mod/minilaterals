title: 'UNESCO World Heritage Committee: two inscriptions of French sites on the World…'
text: 'On 26 July, the UNESCO World Heritage Committee, which is currently meeting
  in Busan, Republic of Korea, officially inscribed two sites nominated by France
  on the World Heritage List: “The Beaches of the D-Day Landings, Normandy, 1944”
  and the “Royal Capetian Fortresses of Languedoc”. France welcomes the inscription
  of these sites. The inscription of the Beaches of the D-Day Landings in Normandy
  highlights the importance of a place for remembering the history of the Second World
  War, where our human sacrifice and that of our Allies freed France and Europe from
  the yoke of totalitarianism. The inscription of the Royal Capetian Fortresses of
  Languedoc highlights the exceptional defensive architecture of this fortification
  system used in the 13 th and 14 th centuries. The fortresses are an example of environmentally-conscious
  architectural engineering, with construction models adapted to the topography of
  the terrain. These two sites of remembrance have been added to the 54 French properties
  that have already been inscribed on the UNESCO World Heritage List, which continues
  to reflect the diversity of our history and our regions.'
