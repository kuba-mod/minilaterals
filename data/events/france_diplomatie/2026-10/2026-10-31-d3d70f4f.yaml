title: G20 Foreign Ministers’ Meeting – Meeting between M. Jean-Noël Barrot, Minister…
text: M. Jean-Noël Barrot, Minister for Europe and Foreign Affairs, had a meeting
  with his Polish counterpart, Mr Radosław Sikorski, on the sidelines of the G20 Foreign
  Ministers’ Meeting in Atlanta. In line with the Treaty on Enhanced Cooperation and
  Friendship signed in Nancy on 9 May 2025, the ministers talked about areas for joint
  cooperation on defence and energy. They also talked about the launch at the beginning
  of 2027 of the France-Poland cross-cultural season. The ministers discussed European
  issues of common interest, particularly EU security and competitiveness. They also
  reaffirmed Europe’s unfailing support for Ukraine, as a fifth winter in wartime
  approaches, and agreed to continue discussions to step up pressure on Russia.
