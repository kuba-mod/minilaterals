title: Russia – Day of Remembrance for the Victims of Political Repression in the…
text: On this Day of Remembrance for the Victims of Political Repression in the Soviet
  Union, and in the face of ongoing attempts to rewrite and instrumentalize history,
  France is concerned by Russia’s escalating repression of anyone critical of the
  government. Russia now has 1,800 political prisoners, many of whom, including Alexei
  Gorinov and Maria Ponomarenko, are in deteriorating health. At least seven have
  died in detention since the beginning of the year. It is particularly alarming to
  note that a growing portion of these prisoners are minors and young men and women
  who have been imprisoned for expressing their opposition to the war of aggression
  against Ukraine. France calls on Russia to immediately and unconditionally release
  all those who are imprisoned for political reasons and to abide by its international
  obligations regarding the guarantee of fundamental rights and liberties.
