title: Houthi attack on Riyadh airport
text: France condemns in the strongest terms the despicable attack carried out by
  the Houthis on Riyadh airport yesterday. It extends its condolences to the victims’
  familes and close friends and wishes a speedy recovery to those injured, who include
  a [female] French national. France reaffirms its total solidarity with the Kingdom
  of Saudi Arabia. It will continue to stand by it in the defence of its territory
  and infrastructure. It calls on the Houthis to end their attacks immediately.
