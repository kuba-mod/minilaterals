title: G20 Foreign Ministers’ Meeting – Minister for Europe and Foreign Affairs Jean…
text: M. Jean-Noël Barrot, Minister for Europe and Foreign Affairs, had a meeting
  with his Indonesian counterpart, Mr Arrmanatha Nasir, on 30 October 2026 on the
  sidelines of the G20 Foreign Ministers’ Meeting in Atlanta, in the United States.
  The meeting – the first since the Indonesian minister took office – provided an
  opportunity to discuss the implementation of the Comprehensive Strategic Partnership
  between France and Indonesia announced during President Prabowo’s state visit to
  Paris in May 2026. The two ministers spoke about recent developments in Franco-Indonesian
  defence cooperation. On international crises, the ministers discussed the consequences
  of UNIFIL’s forthcoming withdrawal from Lebanon and the need to support the Lebanese
  Armed Forces to ensure the country’s stability and sovereignty. They also spoke
  about the situation in Gaza and the Middle East. The two ministers signalled their
  agreement on the need to preserve the Indo-Pacific as an inclusive, safe and open
  space.
