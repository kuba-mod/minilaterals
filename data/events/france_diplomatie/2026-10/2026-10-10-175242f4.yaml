title: Earthquake in Panama
text: France expresses its wholehearted solidarity with the Panamanian Government
  and people in the wake of the violent earthquake that struck the country on 9 October.
  There has been a significant amount of damage. France’s deepest thoughts go to the
  people affected by this disaster, and it assures Panama of its full support. We
  ask the French community in the country to follow the advice of the local authorities.
