title: G20 Foreign Ministers’ Meeting – Minister for Europe and Foreign Affairs Jean…
text: M. Jean-Noël Barrot, Minister for Europe and Foreign Affairs, had a meeting
  with his Mexican counterpart, Mr Roberto Velasco Alvarez, in Atlanta on 31 October
  2026. The ministers welcomed the successful relaunch of the Franco-Mexican initiative
  on regulating the use of the veto at the United Nations Security Council in the
  case of mass atrocities. It now brings together 128 States, 21 of which have joined
  in the past few months, including the United Kingdom as the second permanent member
  of the Security Council to sign up to the initiative. The ministers agreed to continue
  their joint efforts to boost the initiative’s momentum in the coming months. The
  Minister for Europe and Foreign Affairs emphasized the shared commitments made by
  France and Mexico regarding the protection of the oceans, in particular the importance
  France attaches to the increased protection of their biodiversity. The two ministers
  reaffirmed the importance of the partnership between France and Mexico, particularly
  the prospects for greater bilateral economic cooperation. They welcomed the celebration
  this year of the bicentenary of the establishment of diplomatic relations between
  France and Mexico. In this regard, they discussed the relaunch of the Franco-Mexican
  Strategic Council (CSFM), in line with the commitment made by the Mexican President and
  President Macron during his visit to Mexico in November 2025.
