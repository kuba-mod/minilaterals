title: Mark Dybul elected Executive Director of the Global Fund to fight AIDS,…
text: France applauds the appointment of Mark Dybul as Executive Director of the Global
  Fund to fight AIDS, Tuberculosis and Malaria. We are counting on his experience
  and his ability to forge effective, balanced compromises. Stiving for effectiveness
  and stronger health sovereignty will be key to ensuring the continuity and stability
  of the institution’s activities at a time of deep change for the Global Fund and
  healthcare architecture. France, a longtime supporter of the Global Fund, will be
  a reliable partner for the new Executive Director. He can count on France’s full
  support for preserving the Fund’s fundamental principles and improving collaboration
  with all the other institutions that promote global health.
