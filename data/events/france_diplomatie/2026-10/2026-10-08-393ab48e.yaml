title: Israel - Commemoration of the October 7, 2023, terrorist attacks
text: On October 7, 2023, Hamas and other affiliated terrorist groups perpetrated
  the worst anti-Semitic massacre since the Holocaust. That date will forever remain
  engraved in our collective memory. France reiterates its strongest possible condemnation
  of these terrorist attacks, which took the lives of over 1,200 people, including
  51 French citizens. Three years later, the pain is still immense. France will never
  forget the victims of these barbaric acts. France will always be committed to Israel’s
  security and to the fight against terrorism and anti-Semitism. France will continue
  its tireless efforts to achieve a just, lasting peace between Israelis and Palestinians.
  This is the message conveyed by Minister for Europe and Foreign Affairs Jean-Noël
  Barrot, who is in Israel today to meet with the families of the victims and to take
  part in the commemorations.
