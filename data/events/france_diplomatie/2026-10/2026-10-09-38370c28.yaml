title: Russia’s deadly strikes on the Ukrainian population
text: France utterly condemns Russia’s strikes against Ukrainian civilians and infrastructure
  in the past few days. In particular, it deplores the barbaric attacks targeting
  a residential block in Pryluky and two buses in Kramatorsk, which claimed the lives
  of more than 50 people. France is deeply alarmed by these attacks, which testify
  to Russia’s deliberate escalation. This systematic targeting of the civilian population,
  whose purpose is to spread terror and bring Ukraine to its knees, is contrary to
  international humanitarian law and the obligation to protect civilians, and unworthy
  of a permanent member of the United Nations Security Council. France extends its
  condolences to the victims’ families and wishes those injured a speedy recovery.
  It emphatically reaffirms its solidarity with Ukraine and the Ukrainians, and pays
  tribute to their courage and resilience. Along with its partners, it will stand
  by Ukraine to support it in its resistance to Russian aggression and to provide
  it with the necessary security guarantees once peace returns. Russia’s crimes will
  not go unpunished. Along with its partners, France continues to support efforts
  to document the attacks on civilians and infrastructure and bring those responsible
  to justice.
