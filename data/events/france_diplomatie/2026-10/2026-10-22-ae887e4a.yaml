title: Meeting between the French Foreign Minister and his Estonian counterpart
text: Minister for Europe and Foreign Affairs Jean-Noël Barrot hosted his Estonian
  counterpart, Margus Tsahkna, at the Quai d’Orsay on October 22. During their meeting,
  the Ministers discussed the implementation of the road map for the Franco-Estonian
  Strategic Partnership signed in February for 2026-2030. They also spoke about the
  war in Ukraine and sanctions against Russia, European security and the negotiation
  of the EU’s next Multiannual Financial Framework (MFF). The Minister reaffirmed
  France’s solidarity with Estonia, where the Lynx mission is being deployed as part
  of NATO’s Enhanced Forward Presence.
