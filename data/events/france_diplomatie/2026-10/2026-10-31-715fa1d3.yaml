title: Spain – Train accident
text: France was extremely saddened to learn of the death of a compatriot in the train
  accident that occurred in Spain on 28 October 2026. We are in ongoing contact with
  her family, to whom we extend our deepest condolences. France expresses its very
  great shock, and all its thoughts are with the victims, those injured and their
  loved ones following this terrible accident. France stands by Spain and expresses
  its wholehearted solidarity with the authorities and people. Our staff in Paris
  and in Spain are still fully mobilized in conjunction with the local authorities.
