title: Qatar – Signature of a memorandum of understanding between the Crisis and…
text: Following President Macron’s state visit to Qatar and the fourth Qatar-France
  Strategic Dialogue in Doha on 20-21 October, Eléonore Caroit, Minister Delegate
  for Francophonie, International Partnerships and French Nationals Abroad, hosted
  a meeting on 23 October 2026 with the Chairperson of the Qatar Fund For Development
  (QFFD), His Excellency Sheikh Thani bin Hamad Al Thani, and the QFFD’s Director
  General, Fahad Al-Sulaiti, with a view to continuing the humanitarian and development
  cooperation between France and Qatar. The discussions focused on the prospects for
  cooperation to step up their joint action preventing and responding to crises. Two
  memoranda of understanding were signed with the QFFD on this occasion, firstly with
  the Crisis and Support Centre (CDCS) of the Ministry for Europe and Foreign Affairs
  of the French Republic, and secondly with the operator Expertise France. These signings
  were made in the presence of Christophe Lecourtier, CEO of the French Development
  Agency; Jérémie Pellet, CEO of Expertise France; and Gaël Veyssière, Director of
  the Crisis and Support Centre. Following on from the declarations of intent of February
  2024 between France and Qatar 1/ on humanitarian cooperation and emergency intervention
  and 2/ on development-aid cooperation, these memoranda of understanding with the
  QFFD mark a new stage in the strengthening of a foundational partnership.
