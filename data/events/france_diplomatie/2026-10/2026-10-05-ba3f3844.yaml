title: '"Humanitarian actions, acts of humanity" : France honours all humanitarian
  aid…'
text: 'At the 7th National Humanitarian Conference, the Ministry for Europe and Foreign
  Affairs will pay tribute to those who support humanitarian work on the ground. Come
  and visit the “Humanitarian actions, acts of humanity” photographic exhibition,
  dedicated to international aid bodies, which is on until 31 December 2026. The Crisis
  and Support Centre is holding the 7 th National Humanitarian Conference, the main
  forum for meetings, reflection and dialogue bringing together all humanitarian aid
  organizations, on 6 October 2026 at the Ministerial Conference Centre. Marking the
  occasion will be a “Humanitarian actions, acts of humanity” photographic exhibition,
  displayed on the railings outside the Ministry to honour those who work closely
  with communities on the ground: NGOs, UN agencies, the International Committee of
  the Red Cross, corporate foundations and local humanitarian organizations. The exhibition
  will shine a spotlight on women and men working day-in day-out to support communities
  affected by crises, by bringing together the testimonies of people living or working
  in these countries – Afghanistan, Ukraine, Democratic Republic of the Congo, Lebanon,
  Iraq, Uganda, Palestine, Sudan and Syria – to remind us that humanitarian action
  also relies on the commitment of those working on the front line of these crises.
  The exhibition can be accessed in French, English, Spanish and Arabic through QR
  codes.'
