title: Joint statement of the foreign minister of Canada, Denmark, Germany, France,…
text: We, the undersigned States Parties to the Rome Statute of the International
  Criminal Court (ICC), reaffirm our continued and unwavering support for the independence,
  impartiality, and integrity of the ICC. As committed supporters of the ICC we regret
  and strongly disagree with the announcement of sanctions to be imposed upon the
  Court by the United States. We note with appreciation the work undertaken by the
  Court to prepare for such measures so that the Court can continue to fulfil its
  mandate under the Rome Statute and we underline our unwavering support in enabling
  the Court in doing so. Nevertheless, if put into effect, these sanctions will have
  a significant impact on the Court’s work, its dedicated staff and their families. 
  They work every day to bring those accused of the most serious international crimes
  to justice and to support their victims. We remain both united in our support for
  the ICC and committed to engaging in constructive and inclusive dialogue with non-States
  Parties as we prepare for the Assembly of States Parties in December 2026. We will
  continue to work together to support the Court’s vital work, uphold the rules-based
  international system, and advance accountability.
