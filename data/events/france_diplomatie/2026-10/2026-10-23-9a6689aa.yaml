title: Jordan – Terrorist attack on an Orthodox church
text: France utterly condemns the terrorist attack perpetrated today, Friday 23 October,
  on a funeral procession leaving an Orthodox church in Karak Governorate, southern
  Jordan. France extends its sincere condolences to the bereaved. It expresses its
  wholehearted solidarity to the Jordanian authorities and people, and the country’s
  Christian communities, and assures them of its full support.
