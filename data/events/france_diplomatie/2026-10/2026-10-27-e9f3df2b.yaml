title: Joint Declaration of the Deputy Ministers for European Affairs of the Weimar…
text: 'For 35 years already, the Weimar Triangle has been a valuable platform for
  cooperation between France, Germany and Poland in matters pertaining to Europe:
  its integration, its identity, its strength and security. Our cooperation has developed
  – as aptly described by Foreign Ministers Genscher, Dumas and Skubiszewski – in
  the spirit of awareness that Poland, Germany and France bear a shared responsibility
  for a successful European future. We are meeting in Giżycko, in the Warmian-Masurian
  Voivodeship, one of Poland’s eastern border regions, which borders Russia’s Kaliningrad
  Oblast. These regions face significant security and economic challenges stemming
  from Russia’s aggressive and hostile policy. For the foreseeable future, Russia
  poses the greatest threat to Euro-Atlantic security. Therefore, we remain committed
  to strengthening the EU’s and NATO’s eastern flank, as well as ensuring the security
  of all NATO and EU land, air and maritime borders, while enhancing Europe’s defence
  capabilities and industrial base. Europe must become more responsible for its own
  defence and better equipped to act and deal autonomously and in a coordinated way
  with immediate and future challenges and threats. We also support the development
  of a more robust and competitive European defence technological and industrial base,
  including through existing EU programmes like SAFE and EDIP and in the next MFF.
  Building on the Declaration of the Foreign Ministers of our three countries in Weimar
  on September 3, we discussed the following issues regarding our EU policy: support
  to Ukraine, foreign information manipulation and interference (FIMI), enlargement,
  Multiannual Financial Framework, competitiveness and industry. We are determined
  to continue working together on these priorities, in a spirit of mutual trust and
  shared commitment to a strong and secure Europe.'
