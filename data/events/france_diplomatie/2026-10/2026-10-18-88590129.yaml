title: Settler attacks in Taybeh, West Bank
text: France strongly condemns the attack by violent settlers against the Mayor of
  Aulnoye-Aymeries, which happened in the Palestinian village of Taybeh. Representatives
  of several diplomatic missions, including the French Consul General in Jerusalem
  and his Belgian and Polish counterparts, were also targeted and set upon during
  the attack. France expresses its support and solidarity to them and reaffirms its
  unfailing commitment to their mission. France calls on the Israeli authorities to
  arrest the perpetrators of this extremely serious attack and prosecute them. In
  addition, the Israeli authorities must take all necessary steps to stop these acts
  of terror and guarantee the safety of civilians and diplomatic missions, as they
  are obliged to do under international law. France reiterates its condemnation of
  the settlement policy. Settlement activity goes against international law. It seriously
  undermines the rights of Palestinians, threatens the stability of the West Bank
  and compromises the two-state solution.
