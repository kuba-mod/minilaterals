title: Incident at Royal Air Force Fairford air base
text: The Foreign Ministers of Australia, Austria, Belgium, Bulgaria, Canada, Croatia,
  Czech Republic, Denmark, Estonia, Finland, France, Germany, Greece, Hungary, Ireland,
  Latvia, Lithuania, Luxembourg, Netherlands, New Zealand, Norway, Portugal, Romania,
  Slovakia, Slovenia, Spain, Sweden, the United Kingdom and the United States condemn
  in the strongest terms Iran’s use of violent attacks, including the acts of lethal
  plotting, arson, sabotage, cyber-attacks, and other hybrid activities against us
  and our partners. We recognise the United Kingdom’s attribution of Iran’s involvement
  in the incident at RAF Fairford on 27 September.  The UK has also concluded this
  event demonstrates the IRGC’s continued willingness to project hostile activity
  beyond its borders through covert networks and proxy actors. This comes soon after
  the recent campaign of attacks across Europe targeting Jewish communities, Iranian
  journalists, and U.S. interests, claimed by Harakat Ashab al-Yamin al-Islamiya (HAYI).
  Any attempt by Iran to threaten, silence, intimidate, harass, harm, or coerce people
  on our territories through proxies or any other means is unacceptable. Anyone who
  conducts hostile activities on behalf of Iran, or any other state, should know that
  we will take action to identify, investigate, disrupt, and prosecute these acts.
  Iran should be in no doubt that we are united and remain committed to safeguarding
  our sovereignty and strengthening our international coordination, bolstering our
  national resilience, protecting our communities, and ensuring that those responsible
  are held to account.
