title: Turkey – Accident at a tourist site in Cappadocia
text: France was greatly saddened to hear of the death of a compatriot when a rock
  spire collapsed at a tourist site in Cappadocia on 29 October.  We are in constant
  touch with her family, to whom we extend our deepest condolences. France’s thoughts
  are with those killed and injured in the accident and their loved ones.
