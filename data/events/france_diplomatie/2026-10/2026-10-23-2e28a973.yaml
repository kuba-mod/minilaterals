title: Minister's conversation with his romanian counterpart
text: M. Jean-Noël Barrot, Minister for Europe and Foreign Affairs, spoke on the telephone
  to his new Romanian counterpart, Mr Dan Neculăescu , on 23 October 2026. The Minister
  congratulated him on taking office and reaffirmed France’s solidarity with Romania
  following the unacceptable attacks targeting civilian ships off the Romanian coast,
  which are the consequence of Russia’s war of aggression.
