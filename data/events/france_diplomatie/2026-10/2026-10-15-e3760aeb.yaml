title: Black Sea – Drone attacks on commercial ships
text: France condemns in the strongest possible terms the unacceptable drone attacks
  on commercial ships that have taken place over the last several days in the Black
  Sea, off the coast of Bulgaria and Romania. This latest irresponsible escalation
  is a flagrant violation of international law. The intensifying attacks on civilian
  shipping and commercial vessels in the Black Sea, which continue to leave casualties,
  are unacceptable. They show yet again that Russia’s war of aggression against Ukraine
  is a threat to the security of the EU and NATO as a whole. France is determined
  to continue providing Ukraine with unwavering support and once again calls for a
  moratorium on strikes in the Black Sea. France expresses its full solidarity with
  Romania and Bulgaria. Their security is our priority and must be guaranteed.
