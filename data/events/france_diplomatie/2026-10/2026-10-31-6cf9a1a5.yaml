title: G20 Foreign Ministers’ Meeting – Meeting between M. Jean-Noël Barrot, Minister…
text: M. Jean-Noël Barrot, Minister for Europe and Foreign Affairs, had a meeting
  with his UK counterpart, Mr Ed Miliband, Secretary of State for Foreign, Commonwealth
  and Development Affairs, on 30 October 2026, on the sidelines of the G20 Foreign
  Ministers’ Meeting in Atlanta, in the United States. The ministers talked about
  the main international issues on which coordination between France and the UK is
  key, especially support for Ukraine and the development of the situation in the
  Middle East.
