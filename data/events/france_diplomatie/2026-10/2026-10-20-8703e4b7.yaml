title: Digital platforms – TikTok in breach of transparency requirements
text: On May 15, the European Commission reached a preliminary verdict stating that
  TikTok had failed to abide by the EU’s Digital Services Act (DSA). By refusing to
  publish its advertising records, TikTok is in breach of DSA rules concerning the
  transparency of its algorithm. The DSA provides for fines if platforms do not comply
  with their obligations. France will continue to promote the regulation of digital
  platforms via the DSA in accordance with the principle that “what’s illegal offline
  should also be illegal online.” France supports the European Commission’s effort
  to ensure the full implementation of DSA provisions. Digital sovereignty is a major
  component of Europe’s strategic autonomy.
