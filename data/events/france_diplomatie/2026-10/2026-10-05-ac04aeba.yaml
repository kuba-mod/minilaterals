title: Syria – Syria joins the International Partnership against Impunity for Chemical…
text: 'France welcomes the fact that the Syrian Arab Republic has joined the International
  Partnership against Impunity for Chemical Weapons (PICIAC). Launched in Paris in
  January 2018, the partnership, chaired by France, brings together 41 States and
  the European Union around a shared goal: for those responsible for chemical attacks
  to be held accountable for their actions. Syria’s membership of the Partnership
  marks a break with the previous regime’s practices and a further step towards justice
  for the Syrian people. France will continue to support the work being done by Syria,
  together with the Organization for the Prohibition of Chemical Weapons (OPCW) and
  within the Breath of Freedom Task Force, to help identify, verify and destroy the
  remaining elements of the Bashar al-Assad regime’s chemical weapons programme. The
  use of chemical weapons by anyone, anywhere and under any circumstances is unacceptable.
  The fight against impunity is essential to the credibility of the global regulation
  banning those weapons.'
