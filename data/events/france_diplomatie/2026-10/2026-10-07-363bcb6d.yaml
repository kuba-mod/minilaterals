title: Iran – Summoning of the Amassador of the Islamic Republic of Iran
text: At the request of M. Jean-Noël Barrot, Minister for Europe and Foreign Affairs,
  the Ambassador of the Islamic Republic of Iran to France was summoned to the Quai
  d’Orsay today, in response to the disinformation campaign conducted by the Iranian
  authorities about the lycée movement in France. He was informed that the false content
  disseminated online by official accounts of the Iranian Foreign Ministry was absolutely
  unacceptable and that the summoning of our Ambassador in Tehran on 6 October was
  unfounded. These disgraceful provocations must stop.
