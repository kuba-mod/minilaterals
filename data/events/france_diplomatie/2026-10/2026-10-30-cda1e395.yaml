title: Bosnia-Herzegovina – EUFOR Althea helicopter crash
text: France was deeply saddened to learn that a helicopter assigned to EUFOR Operation
  Althea, the European force in Bosnia-Herzegovina, had crashed. France offers its
  heartfelt condolences to the victims’ loved ones and wishes those injured a speedy
  recovery. France reiterates its full support for Operation Althea, which plays a
  key role in maintaining the security and stability of Bosnia-Herzegovina and the
  region.
