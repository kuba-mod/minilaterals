title: Meeting of the Heads of delegations of the G7 Roma Lyon group
text: 'As part of the French presidency of the G7, France chaired the meeting of the
  Heads of delegations of the G7 Roma Lyon from October 27th to 29th, 2026. This working
  group, which focuses on combating terrorism and organized crime, is a cornerstone
  of G7 cooperation in international security. It allows us to anticipate emerging
  threats and to coordinate our operational and political responses to these challenges.
  These three days of discussions allowed us to exchange views on a number of issues
  of common interest, including: Finally, several deliverables developed during this
  year of the French Presidency of the G7 have been endorsed and aim to prevent online
  youth radicalization, combat the use of cryptocurrencies for terrorism and violent
  extremism, and better address the links between different forms of organized crime.
  The various works undertaken within the Roma-Lyon Group will inform the discussions
  at the upcoming G7 ministerial meetings: the Foreign Ministers Meeting in Marseille
  on November 9th and 10th, and the Interior Ministers Meeting in Lyon on November
  20th and 21st.'
