title: Early parliamentary elections in Serbia
text: Early parliamentary elections were held in Serbia on Sunday 25 October. France
  pays tribute to Serbian citizens’ historic turnout, which shows their commitment
  to democracy. It calls on the Serbian authorities to shed full light on the irregularities
  flagged by the OSCE and several independent organizations. France congratulates
  Student List on its victory. The French authorities are ready to work towards deepening
  our bilateral cooperation and, with their partners, to support the future Serbian
  authorities in the reforms necessary to set the country on the path towards the
  European Union.
