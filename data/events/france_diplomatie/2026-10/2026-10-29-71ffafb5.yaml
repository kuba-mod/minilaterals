title: Joint Statement on Democratic People’s Republic of Korea (DPRK) Sanctions
text: The text of the following statement was released by Australia, Canada, France,
  Germany, Italy, Japan, the Netherlands, New Zealand, the Republic of Korea, the
  United Kingdom, the United States, and the European Union. Throughout October and
  today, the European Union (EU) and the governments of Australia and the United States
  have implemented sanctions to target the Democratic People’s Republic of Korea’s
  (DPRK) use of overseas workers, malicious cyber activities, and actors involved
  in unlawful DPRK-Russia cooperation.  Their actions represent their efforts to disrupt
  the DPRK’s ability to support its unlawful development of weapons of mass destruction
  (WMD) and ballistic missiles, and to counter unlawful DPRK-Russia military cooperation.
  These designations build on detailed reporting published by the Multilateral Sanctions
  Monitoring Team (MSMT), which monitors and reports on DPRK’s non-compliance with
  UN Security Council resolutions in the absence of the UNSCR 1718 Committee Panel
  of Experts, whose mandate renewal was vetoed by Russia in 2024.  The MSMT’s first
  and second reports outlined the DPRK’s unlawful military cooperation with Russia,
  along with cyber-enabled IT worker fraud, both of which serve to fund Pyongyang’s
  unlawful weapons programs.  In September 2026, the MSMT released its third report
  detailing the DPRK’s deployment of overseas workers to generate revenue for its
  WMD and ballistic missile programs.  The MSMT will continue to monitor, expose,
  and report on attempts to violate and evade UN sanctions by the DPRK. The MSMT and
  EU reaffirm our commitment to the complete, verifiable, and irreversible denuclearization
  of the DPRK, calling on it to abandon its unlawful WMD and ballistic missile programs,
  and taking action to counter DPRK attempts to violate and evade UN sanctions.  We
  continue to strongly support the implementation of all DPRK-related UN Security
  Council resolutions.  We call on all UN Member States, and especially permanent
  members of the Security Council, to fully implement these resolutions.
