title: France condemns the new sanctions targeting the International Criminal Court
text: France condemns the US institutional sanctions targeting the International Criminal
  Court. After several sanctions adopted on the basis of the presidential decree of
  6 February 2025, which up to now has targeted judges and staff, including French
  judge Nicolas Guillou, it is now the institution itself that is targeted. France
  calls on the United States to withdraw these sanctions and reaffirms its unfailing
  support for the ICC and its staff. The ICC’s role is essential in fighting impunity.
  In conjunction with its European partners and the other States Parties to the Rome
  Statute, France is actively working to ensure that the Court is able to continue
  fulfilling its mission independently and impartially, in order to dispense justice
  to the victims of the most serious crimes.
