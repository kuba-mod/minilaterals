title: Saudi Arabia – Houthi attacks on Saudi Arabia
text: France condemns the Houthis’ repeated attacks on Saudi Arabia. France expresses
  its full solidarity with the Kingdom of Saudi Arabia and stands with the country
  as it defends its land and its infrastructure from these attacks. The Houthis must
  immediately end their attacks and provocations, which destabilize the region further
  and further and exacerbate the suffering of the people of Yemen.
