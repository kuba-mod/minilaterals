title: Sudan - Attack on a World Food Programme (WFP) humanitarian convoy
text: France condemns the air attack that occurred in South Kordofan, Sudan, that
  killed a driver of one of the World Food Programme’s two humanitarian vehicles as
  they delivered food aid. France extends its condolences to the victim’s family and
  close friends, and expresses its wholehearted solidarity with the WFP at this painful
  time. It also deplores the incident that occurred the previous day, 2 October, when
  a WFP lorry hit an explosive device near Dilling. France asks for full light to
  be shed on the circumstances of these attacks and for those responsible to be identified.
  It reaffirms its support for all the humanitarian actors operating daily in Sudan
  under extremely difficult conditions. It strongly condemns all violence against
  humanitarian workers and civilians, and urges the parties to the conflict to abide
  by international humanitarian law, in particular the obligation to protect humanitarian
  personnel, assets and convoys. France reiterates its call to the parties to end
  hostilities, establish a humanitarian truce without delay and guarantee safe, rapid,
  unimpeded access to people in need. It calls for a return to the path of dialogue
  with a view to a long-term political solution to the conflict.
