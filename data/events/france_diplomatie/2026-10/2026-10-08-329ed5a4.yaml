title: Commemoration of the 20th anniversary of the assassination of journalist Anna…
text: Today, France pays tribute to the Russian investigative journalist, Anna Politkovskaya,
  who was assassinated twenty years ago in Moscow on Saturday, October 7, 2006. This
  exceptional journalist would not rest until she had shone a light on violations
  of fundamental liberties in Russia, especially in her work for the newspaper Novaya
  Gazeta, where she documented and denounced the Russian military’s human rights violations
  in Chechnya. She dedicated her life to the truth and to freedom of the press. Twenty
  years after this murder, we continue to call on the Russian authorities to shed
  full light on the affair so that everyone responsible for Anna Politkovskaya’s assassination
  can be brought to justice through open, transparent legal proceedings. Twenty years
  after this murder, we are concerned by the increase in attacks targeting journalists
  and media professionals in Russia, where the authorities have systematically impeded
  freedom of the press and independent journalism over the last few decades. In particular,
  France laments the increased repression that has taken place since Russia’s war
  of aggression against Ukraine began in 2022. This manifests as journalists and media
  outlets increasingly being qualified as “foreign agents” and organizations that
  help sustain civic spaces in Russia being qualified as “undesirable.” It also manifests
  as rising threats, acts of intimidation, detentions, judicial proceedings and trials,
  including trials in absentia, as well as long prison sentences. France stands by
  and will continue to stand by the defenders of a free and independent press. Much
  like the press they defend, they are committed to ensuring the dissemination of
  information on all news fronts, sometimes at the risk of their lives.
