title: Austria – Jean-Noel Barrot’s meeting with Ms Beate Meinl-Reisinger, Federal…
text: M. Jean-Noël Barrot, Minister for Europe and Foreign Affairs, and his Austrian
  counterpart, Ms Beate Meinl-Reisinger, had a meeting in Paris on 13 October 2026.
  The two ministers talked about the main issues of current international concern,
  looking ahead in particular to Austria’s participation in the United Nations Security
  Council as a non-permanent member in 2027 and 2028, and the prospects of stepping
  up Franco-Austrian cooperation in this framework. The ministers recalled their staunch
  support for Ukraine and talked about European security and the Western Balkans.
  The EU’s next Multiannual Financial Framework and the challenges posed by major
  global macroeconomic imbalances were also discussed. On all the issues, the ministers
  were able to note their many similar views and excellent bilateral relationship.
