title: Announcement of the postponement of Palestinian parliamentary and presidential…
text: France regrets the announcement by the President of the State of Palestine of
  the postponement to September 2027 of the parliamentary elections scheduled for
  28 November 2026 and the presidential election planned for early 2027. Coming twenty
  years after the last national elections in Palestine and five years after the postponement
  of the legislative elections scheduled for 2021, this decision once again deprives
  the Palestinian people of the right to democratic expression at the ballot box.
  There is an urgent need for voice to be restored to the Palestinian people and for
  them to be able to choose their representatives in free and transparent elections,
  as President Abbas had committed to do. The democratic principles that are the very
  foundation of the State of Palestine, which France recognized, depend on it. Also
  at stake is the ability of the Palestinian leaders to further with renewed legitimacy
  the Palestinian people’s aspirations to dignity, freedom and self-determination.
  In this respect, Palestinian democratic elections are inseparable from the preservation
  of the two-state solution, to which France remains steadfastly committed. For all
  these reasons, France calls on the Palestinian authorities to reconsider their decision
  and hold parliamentary and presidential elections throughout Palestine without delay.
  France stands ready, alongside its European partners, to assist with the smooth
  running of this process, including as part of the European Union Election Observation
  Mission launched at its request. It remains prepared to support the State of Palestine’s
  institution building efforts, as long as the commitments made with respect to recognition
  are met. France will remain fully committed to supporting the Palestinian people
  and ensuring that their rights are respected.
