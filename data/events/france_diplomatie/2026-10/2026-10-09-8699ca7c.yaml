title: World day against the death penalty
text: 'On the 24th World Day Against the Death Penalty, 10 October, France reaffirms
  its absolute opposition to the death penalty everywhere and in all circumstances,
  and calls for its universal abolition. 2026 is the 45th anniversary of the abolition
  of the death penalty in France. On 9 October 1981, under the impetus of Robert Badinter,
  France chose a form of justice that respected human dignity. This commitment, significantly
  bolstered by its enshrinement in our constitution in 2007, remains at the heart
  of our action in defence of human rights. In Paris from 30 June to 2 July, France
  hosted the 9th World Congress Against the Death Penalty, organized by the NGO Together
  Against the Death Penalty (ECPM) and bringing together nearly 1,300 people from
  some 100 countries. The Congress provided an opportunity to step up international
  efforts to bring about universal abolution. On 11 August 2026, in accordance with
  the commitments made during the Congress, Lebanon became the first Middle Eastern
  State to abolish the death penalty. Abolition continues to make headway around the
  world: more than two-thirds of States have now abolished the death penalty in law
  or in practice; only 17 States went ahead with executions in 2025. This momentum
  cannot, however, conceal the sharp increase in the number of executions recorded
  last year, in a limited number of countries. France calls on those States which
  maintain the death penalty to establish a moratorium on executions with a view to
  its definitive abolition. It encourages all those States which have not yet done
  so to adhere to the second Optional Protocol to the International Covenant on Civil
  and Political Rights, aiming at the abolition of the death penalty. Along with its
  partners and civil society, France will continue taking action in all the multilateral
  fora to further universal abolition.'
