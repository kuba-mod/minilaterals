title: Expulsion of two employees of the Iranian Embassy in France
text: M. Jean-Noël Barrot, Minister for Europe and Foreign Affairs, has decided to
  declare two employees of the Iranian Embassy in France persona non grata, in accordance
  with Article 9 of the 1961 Vienna Convention on Diplomatic Relations. The decision
  follows the extremely serious attack committed by the Iranian security services
  against two employees of the French Embassy in Iran on 19 July, in flagrant violation
  of international law and the Vienna Convention, to which Iran is a party, which
  guarantee the safety of diplomatic staff and form the basis of relations between
  States. Instead of shedding light on this premeditated and deliberate attack, punishing
  its perpetrators and making the necessary commitments to guarantee the safety of
  our facilities and staff in line with their international obligations, the Iranian
  authorities chose to level totally false accusations against our employees and fabricate
  a case of interference to justify their actions. The Ambassador of the Islamic Republic
  of Iran has been informed of the decision and summoned to the Quai d’Orsay today.
