title: Dissolution of the Syrian Democratic Forces
text: France applauds the historic announcement of the dissolution of the Syrian Democratic
  Forces (SDF), following the completion of their integration into Syria’s state institutions.
  This achievement is part of the implementation of the January 29 th agreement that
  was signed by both parties, with active contributions from France. It represents
  an important step in the transition to a united, sovereign, pluralistic Syria that
  respects the rights of all of its components. France will continue to pay close
  attention to the peaceful implementation of this agreement and will support Syrian’s
  ongoing transition, following on from the President of France’s official visit to
  Damascus.
