title: Israel/Palestine – Situation in the West Bank
text: France condemns the occupation of Palestinian homes in the West Bank village
  of Qusra by Israeli settlers, as well as the violence against Palestinian civilians,
  in the strongest possible terms. It calls on the Israeli authorities to arrest and
  prosecute the perpetrators of these acts. With settler violence on the rise in the
  West Bank and East Jerusalem, France calls on the Israeli authorities to take all
  necessary measures to protect the Palestinian civilian population, as they are required
  to do under international law. We reiterate our condemnation of the Israeli settlement
  policy, which threatens the two-state solution and heightens tensions on the ground.
