title: Mali – Release of Yann Vézilier
text: France gladly welcomed the release of Yann Vézilier, a member of the Embassy
  of France in Mali, who had been jailed in that country for 12 months. Our compatriot’s
  return to France and his loved ones is a relief for the Ministry for Europe and
  Foreign Affairs, and for all his colleagues.
