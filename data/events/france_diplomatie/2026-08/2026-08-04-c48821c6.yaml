title: Lebanon – Sixth anniversary of the explosion in the port of Beirut
text: Six years after the tragic explosion in the port of Beirut, France pays its
  respects to the memory of the victims and has not forgotten all the families griefstricken
  by the tragedy. The judicial investigation must continue unimpeded. Independent,
  impartial trials must establish liability. Nobody responsible must escape the obligation
  to be held accountable. France reaffirms its unwavering support for the Lebanese
  people.
