title: Joint Statement on Recent Progress in Libya’s Political Process
text: France, Italy, Germany, Greece, Malta, Netherlands, Spain, Switzerland, United
  Kingdom, United States of America We welcome the agreement of Libyan parties within
  the Smaller Convening on the reconstitution of the Board of the High National Elections
  Commission and the electoral framework on 20 August in Tunis. We commend the Libyan
  participants for their constructive engagement and their readiness to bridge differences
  in the interest of Libya and the Libyan people. We look forward to the final signing
  of the agreement and urge all Libyan stakeholders to support this agreement and
  work towards its implementation to fulfil the aspirations of the Libyan people.
  It represents an important and credible step towards inclusive and transparent national
  elections and unified institutions. Building upon the first meeting in Rome and
  the following ones in Tunis, the progress ultimately achieved should serve as a
  foundation for further compromise, confidence-building and decisive movement towards
  a stable, unified and prosperous Libya. We reaffirm our continued support for the
  efforts of the United Nations Support Mission in Libya (UNSMIL) and Special Representative
  of the Secretary-General Hanna Tetteh in facilitating a Libyan-led and Libyan-owned
  political process. We reiterate our strong commitment to Libya’s sovereignty, independence,
  unity and territorial integrity.
