title: Joint statement on Iran’s Execution of Protestors
text: France, Canada, Albania, Germany, Australia, Austria, Belgium, Croatia, Cyprus,
  Denmark, Spain, Estonia, Finland, Ireland, Iceland, Italy, Latvia, Lithuania, Luxembourg,
  North Macedonia, Montenegro, Norway, New Zealand, the Netherlands, Portugal, the
  Czech Republic, Romania, the United Kingdom, Slovakia, Slovenia, Sweden and the
  High Representative of the European Union condemn in the strongest terms the ongoing
  executions of protesters and use of the death penalty by the Islamic Republic of
  Iran. The use of capital punishment to silence dissent, intimidate communities,
  and punish individuals exercising their human rights can never be justified. The
  people of Iran must be free to exercise their rights to freedom of expression and
  peaceful assembly without fear. We call on the Iranian regime to immediately end
  the use of the death penalty and release all those arbitrarily detained. We further
  call on the Iranian regime to listen to the voice of its people as they demand change,
  and to take meaningful steps towards ensuring respect for human rights.
