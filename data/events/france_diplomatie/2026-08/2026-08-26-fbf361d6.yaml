title: South Sudan - Deaths of two Blue Helmets
text: France was deeply shocked to learn of the deaths in Jonglei on 24 August 2026
  of two Ethiopian Blue Helmets, who were carrying out their duties as part of the
  United Nations Mission in South Sudan (UNMISS). France extends its sincerest condolences
  to the soldiers’ families, close friends and all UNMISS personnel, as well as Ethiopia.
  Those responsible for the attack must be identified and held accountable. It pays
  tribute to the commitment of UNMISS and reaffirms its full support for the central
  role played by the Mission, particularly through its mandate to protect civilians,
  promoting stabilization and lasting peace in South Sudan. Concerned about recurring
  violence in South Sudan, France urges all South Sudanese parties to engage in dialogue
  and comply with the Revitalized Peace Agreement.
