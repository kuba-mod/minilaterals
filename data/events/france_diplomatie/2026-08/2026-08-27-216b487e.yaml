title: Nepal/China - Floods and landslides
text: France expresses its wholehearted solidarity with Nepal and China in the wake
  of the terrible floods and landslides that struck them on 26 August. It offers its
  condolences to the bereaved and its support to all those who have been affected
  by this tragedy. The Ministry for Europe and Foreign Affairs teams and those of
  our embassies in Nepal and China are fully mobilized and carefully monitoring the
  situation, working closely with the local authorities. We are contacting French
  people who have self-reported via the Fil d’Ariane travel safety alert service.
  At this stage, we have had no news of several French people and are in contact with
  their families. Efforts are ongoing to determine their whereabouts. French people
  in the affected areas are asked to follow the advice issued by the local authorities.
  The Ministry for Europe and Foreign Affairs reminds French people travelling abroad
  that it is important to register on the Fil d’Ariane platform and consult the Conseil
  aux voyageurs travel advice page beforehand.
