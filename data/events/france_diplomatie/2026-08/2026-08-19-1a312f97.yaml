title: World Humanitarian Day
text: On this World Humanitarian Day, France pays tribute to the humanitarian workers
  who were killed or injured while doing their jobs and applauds the dedication of
  those who are helping vulnerable populations worldwide. According to the United
  Nations, 250 million people worldwide will need emergency humanitarian aid in 2026.
  Meanwhile, humanitarian workers are facing growing violence, and more than a thousand
  have been killed over the past three years while working to assist local populations.
  France remains fully committed to international humanitarian law, particularly through
  the International Committee of the Red Cross’s Global Initiative to Galvanize Political
  Commitment to International Humanitarian Law (IHL). More than 115 nations have joined
  this effort to date. Civilians, including humanitarian and medical personnel, must
  be respected and protected in armed conflicts. The parties to an armed conflict
  must authorize and facilitate the delivery of humanitarian aid to people in need.
  We are staunchly committed to meeting humanitarian needs worldwide through our support
  for UN agencies, the International Red Cross and Red Crescent Movement, and NGOs,
  in coordination with our international and European partners. All of these issues
  will be discussed at the National Humanitarian Conference to be held in Paris this
  October, which will bring together institutional stakeholders and civil society
  representatives working in the humanitarian sector.
