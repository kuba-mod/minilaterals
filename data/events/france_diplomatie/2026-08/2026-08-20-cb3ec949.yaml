title: New US sanctions against the International Criminal Court
text: France has learned of new US sanctions against the President of the International
  Criminal Court (ICC) and a member of the Court’s Office of the Prosecutor, adding
  to those already adopted against 11 judges from the institution. France condemns
  all forms of threats and coercive measures against the Court, its staff and the
  civil society organizations that support it. Such measures constitute an attack
  on the Court and all the 125 States Parties to the Rome Statute, and are contrary
  to the principle of judicial independence. France expresses its solidarity with
  the judges targeted. The Minister for Europe and Foreign Affairs reaffirmed France’s
  unwavering support for the ICC and its staff during his meetings with the Court’s
  President in September 2025 and the Deputy Prosecutor in July 2026. The International
  Criminal Court’s role is essential in the fight against impunity. In conjunction
  with its European partners and the States Parties to the Rome Statute, France is
  working actively to ensure the Court is in a position to continue fulfilling its
  mission independently and impartially, in order to provide justice for the victims
  of the most serious crimes.
