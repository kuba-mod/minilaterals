title: Joint Statement by the spokespeople for the Foreign Ministries of France and…
text: Germany and France deeply regret the guilty verdict against human rights lawyer
  and democracy activist Chow Hang-tung. Alongside other activists from the Hong Kong
  Alliance in Support of Patriotic Democratic Movements of China, Chow Hang-tung worked
  tirelessly to promote human rights and democracy in China, in particular in the
  Special Administrative Region of Hong Kong. Peaceful advocacy for human rights does
  not constitute a crime. We call for her immediate release and urge the authorities
  in Beijing and Hong Kong to respect all civil rights and freedoms. Chow Hang-tung,
  a highly respected barrister, was awarded the Franco-German Prize for Human Rights
  and the Rule of Law in 2023 in recognition of her exceptional dedication to promoting
  human rights, including the peaceful commemoration of the June 4th, 1989 crackdown.
