title: Ukraine - Minister for Europe and Foreign Affairs Jean-Noël Barrot's telephone…
text: M. Jean-Noël Barrot, Minister for Europe and Foreign Affairs, spoke on the telephone
  today to his Ukrainian counterpart, Mr Andrii Sybiha. The ministers discussed the
  situation on the ground as Russia, which has faced heroic resistance from the Ukrainian
  people for four and a half years now, continues its systematic, increasingly intense
  strikes on Ukraine’s cities, essential infrastructure and civilians. In this respect,
  the ministers talked about ways of maintaining and stepping up pressure on Russia.
  During the conversation, the Minister reiterated France’s full support for Ukraine,
  bilaterally as much as through the various European mechanisms and in the framework
  of its G7 presidency. Together they also discussed forthcoming international meetings,
  the United Nations General Assembly in particular, which will be held in September
  and provide an opportunity to rally the whole international community to reaffirm
  support for Ukraine in its fight to safeguard its sovereignty, freedom and independence,
  whose 35 th anniversary we have just celebrated. Finally, the Minister recalled
  that France is resolved to stand alongside Ukraine over the long term and continue
  its efforts with all its partners until a just, lasting peace is concluded.
