  mit Konferenzteilnehmerinnen und -teilnehmern. In so genannten Deep-Dive-Sessions
  leiteten Regierungsmitglieder vertiefende Sitzungen zu verschiedenen Themen. Merz
  zeigt sich zum Abschluss dieser erstmals ausgerichteten Konferenz zufrieden mit
  dem Ergebnis. Insgesamt wurden bisher von diesen Investoren rund 230 Milliarden
  Euro an Investitionen in Deutschland zugesagt worden, wie er betont. „Wir wollen
  und wir werden diesem Vertrauen gerecht werden", sagte der Kanzler zum Abschluss
  des Investitionsgipfels. „Die Bundesregierung wird die Bedingungen für Investitionen
  in Deutschland weiter verbessern, zum Beispiel durch weniger Bürokratie, durch schnellere
  Genehmigungen, durch eine bessere Infrastruktur.“ Deutschland bietet hervorragende
  Investitionsbedingungen: Die drittgrößte Volkswirtschaft der Welt ist ein stabiler
  Rechtsstaat, hat als einziger G7 -Staat die Bestnote der drei Top- Rating -Agenturen
  und verfügt über eine leistungsfähige Forschungslandschaft. Die weitere Verbesserung
  dieser Bedingungen ist ein zentrales Ziel der Bundesregierung. Lesen Sie hier die
  Rede von Bundeskanzler Friedrich Merz (auf Englisch) anlässlich des Vorabendempfangs
  zum „ Invest in Germany Summit“ am 19. Oktober 2026 in Berlin. Bundesregierung stärkt
  Entwicklung und Anwendung Industrieller KI über Zusammenarbeit mit internationalen
  Partnern. Lesen Sie hier die aktuelle Pressemitteilung . Der Summit hatte am Montagabend
  mit einem Empfang im Kraftwerk Berlin mit bis zu 500 geladenen Gästen begonnen.
  Unter anderem hielt Bundeskanzler Friedrich Merz eine Rede und führte ein Bühnengespräch
  mit dem CEO und Gründer des Chipherstellers Nvidia, Jensen Huang. Am darauffolgenden
  Gipfeltag fand nach der Eröffnungsrede des Bundeskanzlers eine Gesprächsrunde mit
  Unternehmensvertreterinnen und -vertretern zum Thema „ Why Germany – Standortvorteile
  von Deutschland, Investitionen und Zukunftspotenziale" statt. Anschließend hatten
  Bundesfinanzminister und Vizekanzler Lars Klingbeil, Wirtschaftsministerin Katherina
  Reiche, Forschungsministerin Dorothee Bär, Digitalminister Karsten Wildberger, Verkehrsminister
  Steffen Bilger, Bauministerin Verena Hubertz und der Investitionsbeauftragte des
  Bundeskanzlers, Martin Blessing, vertiefende Workshops zu verschiedenen Themen geleitet –
  jeweils gemeinsam mit Co-Hosts aus der Wirtschaft. Im Zentrum standen Themen wie
  industrielle KI , digitale Transformation und die Finanzierung von Investitionen.
  Parallel dazu führten die Regierungsmitglieder zahlreiche bilaterale Gespräche mit
  Konferenzteilnehmerinnen und -teilnehmern. Federführend realisiert wurde das im
  Koalitionsvertrag enthaltene Vorhaben vom Bundeswirtschaftsministerium ( BMWE )
  in enger Zusammenarbeit mit dem Bundeskanzleramt, dem Bundesfinanzministerium (
  BMF ) und dem persönlichen Beauftragten des Bundeskanzlers für Investitionen in
  Deutschland, Martin Blessing.'
