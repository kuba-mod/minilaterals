title: „Invest in Germany-Summit“ der Bundesregierung Klares Zeichen für mehr Investitionen
  in Deutschland
text: 'Bundeskanzler Merz beim Bühnengespräch mit dem CEO und Gründer des Chip-Herstellers
  Nvidia, Jensen Huang, zur Eröffnung des Investitionsgipfels. Mit dem „ Invest in
  Germany-Summit “ hat die Bundesregierung rund 200 internationale und nationale Führungskräfte
  und Investoren mit deutschen Spitzenpolitikern zusammengebracht. Bundeskanzler Friedrich
  Merz sagte nach dem Gipfel, es sei „sehr gut gelungen“, ein starkes Willkommenssignal
  an die Investoren zu geben. Investitionszusagen in Milliardenhöhe – bisher rund
  230 Milliarden Euro – zeigten, dass „Deutschland ein guter Standort für Investitionen
  und für die Unternehmen aus der ganzen Welt“ sei. Private Investitionen sind zentral
  bei der Schaffung neuer Arbeitsplätze und Wohlstand und Wertschöpfung in Deutschland. Beim
  Gipfel ging es vor allem darum, Raum für den Austausch über Investitionen zu schaffen.
  So sollen aus den hervorragenden Voraussetzungen in Deutschland konkrete Projekte
  realisiert werden. In seiner Eröffnungsrede in der European School of Management
  and Technology hatte der Bundeskanzler betont, dass die Bundesregierung auch weiter
  ihren Reformkurs fortsetzen werde. Es seien die ehrgeizigsten Reform- und Modernisierungsprogramme
  der letzten Jahrzehnte. Zudem hob Kanzler Merz die Zusagen der Unternehmensinitiative
  „ Made for Germany “ hervor. 800 Milliarden Euro sollen bis 2028 in Deutschland
  investiert werden. Deutschland verzeichne 2026 trotz zunehmender geopolitischer
  Spannungen ein beschleunigtes Wirtschaftswachstum, so der Bundeskanzler weiter.
  Berlin, 19. Oktober 2026: Die Bundesregierung will mit dem erstmals stattfindenden
  Investitionsgipfel „ Invest in Germany“ ein starkes Willkommens-Signal setzen: Wir
  investieren umfassend in unser Land, und wir heißen Unternehmen und Investoren willkommen,
  dies ebenfalls zu tun. Den Auftakt machte ein Empfang im Kraftwerk Berlin mit rund
  500 Gästen. Es geht vor allem darum, Raum für den Austausch über privatwirtschaftliche
  Investitionen zu schaffen. Bundeskanzler Friedrich Merz bei einem Gespräch mit Jensen
  Huang, dem Geschäftsführer von Nvidia. Die Bundesregierung und der US - Chip hersteller
  haben eine engere Zusammenarbeit vereinbart, um die industrielle Nutzung von Künstlicher
  Intelligenz in Deutschland voranzutreiben. Berlin, 20. Oktober 2026: „ Invest in
  Germany “ bringt rund 200 internationale und nationale Führungskräfte und Investoren
  mit deutschen Spitzenpolitikern zusammen. Die Eröffnungsrede hielt Bundeskanzler
  Friedrich Merz. Die Konferenz wurde vom Bundeswirtschaftsministerium in enger Zusammenarbeit
  mit dem Bundeskanzleramt, dem Bundesfinanzministerium und dem persönlichen Beauftragten
  des Bundeskanzlers für Investitionen in Deutschland, Martin Blessing, organisiert.
  Der Gipfel ist Startpunkt einer breiteren „Invest in Germany“ -Initiative. Sie soll
  Investoren systematisch ansprechen und begleiten und ist auf Service und Dialog
  ausgerichtet. Bundeskanzler Merz führte auf dem Gipfel zahlreiche bilaterale Gespräche
  mit Konferenzteilnehmerinnen und -teilnehmern. In so genannten Deep-Dive-Sessions
  leiteten Regierungsmitglieder vertiefende Sitzungen zu verschiedenen Themen. Merz
  zeigt sich zum Abschluss dieser erstmals ausgerichteten Konferenz zufrieden mit
  dem Ergebnis. Insgesamt wurden bisher von diesen Investoren rund 230 Milliarden
  Euro an Investitionen in Deutschland zugesagt worden, wie er betont. „Wir wollen
  und wir werden diesem Vertrauen gerecht werden", sagte der Kanzler zum Abschluss
  des Investitionsgipfels. „Die Bundesregierung wird die Bedingungen für Investitionen
  in Deutschland weiter verbessern, zum Beispiel durch weniger Bürokratie, durch schnellere
  Genehmigungen, durch eine bessere Infrastruktur.“ Berlin, 19. Oktober 2026: Die
  Bundesregierung will mit dem erstmals stattfindenden Investitionsgipfel „ Invest
  in Germany“ ein starkes Willkommens-Signal setzen: Wir investieren umfassend in
  unser Land, und wir heißen Unternehmen und Investoren willkommen, dies ebenfalls
  zu tun. Den Auftakt machte ein Empfang im Kraftwerk Berlin mit rund 500 Gästen.
  Es geht vor allem darum, Raum für den Austausch über privatwirtschaftliche Investitionen
  zu schaffen. Bundeskanzler Friedrich Merz bei einem Gespräch mit Jensen Huang, dem
  Geschäftsführer von Nvidia. Die Bundesregierung und der US - Chip hersteller haben
  eine engere Zusammenarbeit vereinbart, um die industrielle Nutzung von Künstlicher
