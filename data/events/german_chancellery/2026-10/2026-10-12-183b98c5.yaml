title: Staatsminister Weimer eröffnet Anselm-Kiefer-Pavillon in Künzelsau – Kiefer,
  Chipperfield und das Engagement der Familie Würth für die Kunstwelt gewürdigt
text: 'Staatsminister Weimer hat den Anselm-Kiefer-Pavillon am Museum Würth in Künzelsau
  eröffnet. Damit wird erstmals das großformatige Werk „Schwarze Flocken“ von Anselm
  Kiefer öffentlich zugänglich und bekommt einen dauerhaften Ausstellungsort. Es gehört
  zu den bedeutendsten Werken der Sammlung Würth. Der eigens für das Werk entworfene
  Pavillon stammt vom international renommierten Architekten David Chipperfield. Am
  13. Oktober 2026 öffnet der Pavillon seine Tore für Besucherinnen und Besucher.
  Kulturstaatsminister Weimer erklärt dazu: „Anselm Kiefers monumentale Kunst zeigt,
  wie sehr die Geschichte in unsere Gegenwart hineinwirkt. Sie lässt uns nicht vergessen
  und fordert uns auf, genau hinzusehen. Mit ‚Schwarze Flocken‘ wird ein herausragendes
  Werk seines Schaffens erstmals für die Öffentlichkeit erlebbar. David Chipperfield
  verleiht diesem Werk mit seiner Architektur eine eindrucksvolle Wirkung. Die Eröffnung
  des Kiefer-Pavillons ist ein echter Gewinn für die kulturelle Landschaft in Deutschland.
  Mein besonderer Dank gilt der Familie Würth, die mit ihrem außergewöhnlichen Engagement
  Kunst von internationalem Rang bewahrt, fördert und für ein breites Publikum zugänglich
  macht.“ Anselm Kiefer und David Chipperfield sind Mitglieder des Ordens Pour le
  mérite. Die Aufnahme gilt als eine der höchsten Ehrungen, die einem Wissenschaftler
  oder Künstler in Deutschland zuteilwerden kann. Der Staatsminister für Kultur und
  Medien finanziert den Orden und betreut ihn organisatorisch.'
