title: Im Wortlaut Pressestatement von Bundeskanzler Merz zum Berlin-Prozess-Gipfel
  am 22. Oktober 2026
text: Bundeskanzler Merz Meine Damen und Herren, herzlichen Dank für das freundliche
  Willkommen zum Westbalkantreffen. Ich freue mich sehr, dass wir die Gelegenheit
  haben, heute in einem Format weiteren Fortschritt bei der europäischen Integration
  zu besprechen, das vor vielen Jahren mit dem Namen Berlin-Prozess auf Initiative
  der deutschen Bundesregierung etabliert worden ist. Wir treffen uns hier in Montenegro,
  um den weiteren Prozess miteinander zu besprechen und weitere Fortschritte in der
  Zusammenarbeit zwischen den Westbalkanstaaten und der Europäischen Union zu erzielen.
  Ich möchte mich bei unseren Gastgebern sehr herzlich bedanken, dass sie die Einladung
  ausgesprochen haben, zum Ende ihrer Präsidentschaft heute hierherzukommen. Ich übergebe
  den Vorsitz heute von der Bundesrepublik Deutschland an Österreich. Ich freue mich
  sehr, dass der österreichische Bundeskanzler im nächsten Jahr den Vorsitz von Deutschland
  übernehmen wird. Ich bedanke mich noch einmal sehr herzlich für die großartige Gastfreundschaft
  in diesem sehr schönen Land. Ich freue mich auf die Begegnungen und auf die weitere
  gute Zusammenarbeit. Herzlichen Dank!
