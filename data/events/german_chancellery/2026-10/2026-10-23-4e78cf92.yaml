  einen erheblichen Anteil. Ich möchte das Finanzministerium fragen. Es geht um das
  Thema von KI-Agenten und den Zugriff auf Bankkonten . In den USA haben sich mehrere
  US-Großbanken verabredet, keine externen KI-Agenten mehr zuzulassen, weil sich einige
  von ihnen offenbar selbstständig gemacht und versucht haben, in Bankkonten einzudringen.
  Was macht eigentlich die Bundesregierung diesbezüglich? Gibt es die Sorge, dass
  solche KI-Agenten, die ja weltweit unterwegs sind, jetzt auch auf die Bankkonten
  hier in Deutschland zugreifen? Da habe ich für heute nichts dabei, das müsste ich
  Ihnen dann nachliefern. Das wäre nett. In den USA ist es ein großes Thema, dass
  jetzt die Sorge aufkommt, dass vielleicht das Finanzsystem durch eine sich selbstständig
  machende KI destabilisiert werden könnte. Die Frage geht zum einen an Herrn Kaminski
  und zum anderen an Frau Sänger. Ich würde ganz gerne wissen, wie es denn momentan
  mit Betroffenheiten infolge von PHP2Shell ausschaut, wie das so schön heißt, dieser
  Sicherheitslücke, die dort bei PHP aufgetreten ist. Gab es Betroffenheiten innerhalb
  der Bundesverwaltung, von denen Sie uns hier berichten können, jenseits des präventiven
  Abschaltens? Dann fange ich gerne einmal an. Sie wissen: Das BSI ist die Cybersicherheitsbehörde
  des Bundes, und die beobachtet die Lage natürlich sehr engmaschig und analysiert.
  Zum jetzigen Zeitpunkt ‑ damit meine ich, vor ungefähr einer Stunde bzw. ein bisschen
  weniger ‑ liegen keine Meldungen bezüglich erfolgreich kompromittierter IT-Systeme
  vor, weder beim Bund noch in der Verwaltung noch bei der regulierten Wirtschaft.
  Das lässt also den Schluss zu, dass viele Betreiber gemäß den Empfehlungen bereits
  erfolgreich gepatcht ‑ auf Deutsch würde man „geflickt“ sagen ‑ haben, also das
  Problem erkannt und entsprechend gehandelt haben. Diese Lücke wurde unter anderem
  mit der Hilfe von KI gefunden. Das heißt, dass Modelle auf die Suche nach Sicherheitslücken
  gegangen sind. Ich würde gerne wissen: Wie steht es denn jetzt um unser AI Safety
  Institute, hinsichtlich dessen, glaube ich, auch Ihre beiden Häuser verantworten,
  dass das eingerichtet wird? Inwieweit ist das denn schon funktionsfähig, um solche
  Lücken frühzeitig zu erkennen zu helfen? Grundsätzlich ist es so, dass Sie absolut
  recht haben, dass künstliche Intelligenz die Identifizierung von IT-Schwachstellen
  beschleunigt. Das war auch in dem Fall so. Das ist eine Schwachstelle, die anscheinend
  schon länger bestanden hat und jetzt durch KI gefunden werden konnte. Wir stehen
  als Bundesregierung in einem fortlaufenden Austausch mit führenden KI-Entwicklern,
  und das gibt uns die Möglichkeit, frühzeitig über Bedrohungen informiert zu werden
  und im Ergebnis die Sicherheit unserer Systeme zu erhöhen. Genau, ich kann mich
  dem anschließen und kann etwas ergänzen. Das KI-Sicherheitsinstitut befindet sich
  derzeit im Aufbau. Es gibt den Nukleus aus BSI und Bundesnetzagentur, der bereits
  arbeitet. Herr Kaminski, Sie haben jetzt gesagt, dass es keine Meldungen über erfolgreiche
  Angriffe gibt. Sind denn irgendwelche Webseiten von Bundesbehörden oder Ministerien
  noch abgeschaltet? In anderen Ländern ist man ja offenbar den Weg gegangen, viele
  Angebote einfach erst einmal herunterzunehmen, um Angriffe zu verhindern. Richtig,
  es ist auch so, dass Webseiten der Bundesverwaltung kurzzeitig vom Netz genommen
  wurden. Ich kann Ihnen nicht sicher sagen, ob alle, die vom Netz genommen wurden,
  jetzt auch wieder online sind, aber größtenteils ist das der Fall. Es ist ja im
  Gespräch, dass die EU, die europäischen Länder, die Mitgliedstaaten zwei Drittel
  der zusätzlich notwendigen70 Milliarden Euro für die Ukraineübernehmen sollen .
  Herr Meyer, bis wann müsste das eigentlich geklärt werden? Ist das in die Haushaltsgespräche
  einzuordnen, die jetzt zu führen sind, oder kann man da hinterher noch nachsteuern?
  Das wäre der erste Punkt. Der zweite Punkt: Mit welchem Anspruch geht der Kanzler
  an diese Frage heran, auch bei der Aufstockung? Aktuell sind es ja 11,5 Milliarden
  Euro, die zur Verfügung stehen, wenn ich es richtig sehe. Es gibt natürlich immer
  einen Zusammenhang zwischen der Ukraineunterstützung und Fragen, die jetzt mit dem
  Mittelfristigen Finanzrahmen einhergehen. Das zu negieren wäre, glaube ich, falsch.
  Natürlich gibt es da einen Zusammenhang. Ich will den weiteren Gesprächen dabei
  in der Tat an der Stelle jetzt nicht vorgreifen. Aber ist denn für den Bundeskanzler
  ausgeschlossen, dass diese 11,5 Milliarden Euro noch einmal nennenswert erhöht werden?
  Ist das sein politischer Anspruch? Ich will mich nicht auf konkrete Summen beziehen
  oder jetzt Annahmen treffen oder spekulieren. Was doch aber völlig klar ist, und
  dabei hat der Bundeskanzler doch nun wirklich auch innerhalb der Europäischen Union,
  glaube ich, nachvollziehbar eine Führungsrolle eingenommen, ist, dass wir schon
  in der Vergangenheit wirklich weitreichende Entscheidungen getroffen haben, die
  Ukraine zu unterstützen und sie auch finanziell in die Lage zu versetzen, diesem
  fortlaufenden Angriffskrieg aus Russland wirklich auch standzuhalten. Wir bringen
  uns natürlich in alle Gespräche mit dem Ziel ein, dass das auch in Zukunft gilt.
  Herr Meyer, wem drückt die Bundesregierung vor den Parlamentswahlen in Serbien die
  Daumen? Wie immer ‑ ich glaube, das ist gute Sitte und auch sehr, sehr sinnvoll ‑
  mischen wir uns hier in anstehende Wahlen in keiner Form ein oder geben Empfehlungen
  ab. Ich weiß gar nicht genau, an wen sich die Frage richtet, vielleicht tatsächlich
  auch an das Digitalministerium. Facebook ist in den USA zu einer Strafe von 25 Milliarden
  Dollar verurteilt worden , weil es illegal Daten seiner Nutzer weitergegeben hat.
  Das Urteil erging wegen Irreführung der Nutzer im Umgang mit Daten. Ich hätte ganz
  gerne gewusst, warum es ein ähnliches Vorgehen gegen Facebook in Deutschland nicht
  gibt, weil der Verdacht ja nahe liegt, dass Facebook hier in Deutschland ähnlich
  mit Daten umgegangen ist wie in den USA. Ich müsste bezüglich des Themas jetzt tatsächlich
  einmal bei den Kollegen nachfragen, um zu schauen, ob ich etwas nachliefern kann.
  Zuständigkeitshalber liegt der Datenschutz ja beim Bundesinnenministerium, und der
  verbrauchervertragsrechtliche Teil liegt ja beim BMJV. Insofern richtet sich die
  Frage ja eigentlich eher dahin, wenn ich das einmal so feststellen darf. Ich würde
  gerne wissen, inwieweit Sie denn eine Notwendigkeit sehen, angesichts dessen, was
  sich in den USA in den letzten Monaten immer wieder gezeigt hat, nämlich hoher Strafen
  gegen Internetkonzerne, beim Datenschutz noch einmal nachzuschärfen, angesichts
  dessen, was jetzt gerade mit dem Daten-Omnibus im Rat passiert ist, bezüglich dessen
  die Bundesregierung überstimmt wurde. Der Vorgang, den Sie gerade genannt haben,
  ist uns natürlich bekannt. Zum jetzigen Zeitpunkt kann ich Ihnen dazu nichts Konkretes
  sagen. Ich kann dazu nur sagen: Wir kommentieren keine Urteile aus den USA. Wir
  haben in Europa aber mit dem DSA einen klaren Rechtsrahmen, und die Aufsicht über
  die großen Plattformen liegt allein bei der EU-Kommission. Diese Nachlieferung war
  jetzt an den Kollegen gerichtet.'
