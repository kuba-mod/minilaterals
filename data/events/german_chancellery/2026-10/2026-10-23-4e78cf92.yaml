date: '2026-10-23'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 23. Oktober 2026
text: 'stellvertretender Regierungssprecher Meyer (Vorsitzende Buschow eröffnet die
  Pressekonferenz und begrüßt SRS Meyer sowie die Sprecherinnen und Sprecher der Ministerien.)
  Ich darf Ihnen eine Reise des Bundeskanzlers für die kommende Woche ankündigen.
  Bundeskanzler Friedrich Merz wird vom 26. bis 30. Oktober 2026 Singapur, Japan und
  Südkorea besuchen . Das finale Reiseprogramm steht noch nicht in allen Details fest.
  Daher möchte ich Sie kurz über folgende Programmpunkte informieren: Am Dienstag,
  den 27. Oktober, wird der Bundeskanzler zunächst Gespräche in Singapur mit Premierminister
  Lawrence Wong führen. Auch ein Treffen mit dem Präsidenten ist geplant. Darüber
  hinaus wird der Bundeskanzler im Rahmen der Singapore Lecture eine Rede halten.
  Für den 28. Oktober ist die Weitereise nach Japan vorgesehen. Dort wird der Bundeskanzler
  in Tokio von Ministerpräsidentin Sanae Takaichi empfangen. Während des Aufenthalts
  in Japan sind zudem die Teilnahme am German-Japanese Business Summit sowie der Besuch
  eines japanischen Unternehmens mit deutscher Kooperation geplant. Den Abschluss
  der Asienreise wird ab Donnerstag, den 29. Oktober, der Besuch in Südkorea bilden.
  In Seoul wird der Bundeskanzler den Präsidenten der Republik Korea, Lee Jae-myung,
  treffen. Weiterhin wird er am Freitag, den 30. Oktober, die 19. Asien-Pazifik-Konferenz
  der Deutschen Wirtschaft in Seoul eröffnen. Er wird außerdem die demilitarisierte
  Zone an der Grenze zu Nordkorea besuchen. Der Besuch bei diesen engen Partnern in
  Asien dient insbesondere der Vertiefung der sicherheitspolitischen und wirtschaftlichen
  Zusammenarbeit. Mit allen drei Ländern eint uns das Bekenntnis zu offenem, regelgebundenem
  Handel und der Wunsch nach Stärkung der wirtschaftlichen Resilienz und Sicherheit,
  besonders mit Blick auf globale Lieferketten. Alle drei Länder eint auch eine große
  Innovationskraft. Deshalb wollen wir unsere Zusammenarbeit bei Zukunftsthemen wie
  KI vertiefen. Der Bundeskanzler wird auf seiner Reise von einer Wirtschaftsdelegation
  begleitet werden. Da ich ahne, dass dazu Nachfragen kommen, auch noch der folgende
  Hinweis: Die Kabinettssitzung am Mittwoch, den 28. Oktober, wird dann unter der
  Leitung des Vizekanzlers stattfinden. (zur Reise nach Singapur, Japan und Südkorea
  ) Herr Meyer, vielleicht können Sie uns noch mehr Informationen über die Wirtschaftsdelegation
  mitteilen. Das kann ich leider zum jetzigen Zeitpunkt noch nicht. Es ist eine hochrangige
  Wirtschaftsdelegation, die dabei sein wird. Aber zum jetzigen Zeitpunkt kann ich
  noch nicht weiter ins Detail gehen. Es wird sicherlich auf der Reise weitere Infos
  dazu geben. Der Bundespräsident reist ja zeitgleich nach China. Ist das eigentlich
  so abgesprochen, also geplant? Abgesprochen ist es wahrscheinlich schon, aber geplant?
  Ergänzen sich diese beiden Reisen? Es sind grundsätzlich Reisen, die natürlich unabhängig
  voneinander stattfinden, die aber natürlich in der gleichen Welt und in der gleichen
  Weltlage stattfinden. Insofern können Sie davon ausgehen, dass es hierbei natürlich
  auch zu den inhaltlichen Fragen eine enge Abstimmung gibt. Zu dem Teil in Japan:
  Welches Ziel hat der Besuch konkret in Japan? Was hoffen Sie, dort zu erreichen?
  Was erhofft sich der Bundeskanzler davon? Gibt es vielleicht irgendwelche konkreten
  Projekte oder Vorhaben, die man gemeinsam mit Japan angehen möchte? Ich will jetzt
  den Einzelheiten der Reise hier nicht vorgreifen. Ich kann aber schon sagen, dass
  Japan natürlich zu unseren engsten und strategisch wichtigsten Partnern in Asien
  gehört. Uns verbinden gemeinsame Werte und Interessen. Darauf habe ich gerade schon
  hingewiesen. Dazu zählen insbesondere Demokratie, Rechtsstaatlichkeit, die regelbasierte
  Ordnung, die Achtung der Menschenrechte, ein offener, freier und fairer Handel.
  Deutschland und Japan teilen ähnliche Herausforderungen und Antworten, auch auf
  die aktuellen Fragen, die sich auf der Welt stellen: ein wirtschaftlicher Fokus
  auf Wettbewerbsfähigkeit, die Anpassung der Sicherheits- und Verteidigungspolitik
  angesichts einer veränderten Bedrohungslage. Sie sehen also, dass es wirklich die
  ganze Bandbreite unserer gemeinsamen Interessen ist, die auch auf dieser Reise eine
  wichtige Rolle spielen wird. Wird es auch gerade vielleicht im Bereich der Sicherheit
  und Verteidigung besondere Vorhaben geben? Ist diesbezüglich etwas geplant? Auch
  in der Hinsicht möchte ich den Gesprächen nicht vorgreifen. Aber natürlich spielt
  auch die Region für uns auch in Bezug auf sicherheitspolitische Aspekte eine sehr
  wichtige Rolle. Es wird sicherlich auch dazu sehr intensiven Austausch geben. Kollege
  Rinke hat es ja schon probiert. Aber können Sie uns dann sagen, aus welchen Branchen
  die Delegationen kommen? Das haben Sie uns im Vorfeld ja meistens gesagt, wenn vielleicht
  nicht die Namen. Es werden wichtige und wesentliche Branchen vertreten sein. Die
  Details der Delegation, wie gesagt, machen wir dann auf der Reise. Wir können dann
  gern im Nachgang entsprechend auch noch einmal tiefer einsteigen. Momentan kann
  ich es noch nicht. Wird es denn auf der Reise im Nachgang des Investitionsgipfels
  noch einmal um Konkretisierungen gehen ‑ist es auch ein Thema der Reise?‑ , um Vertragsabschlüsse,
  vielleicht auch beim Thema Singapurs? Sie waren ja auch auf dem Investitionsgipfel
  vertreten, wenn ich es richtig sehe. Sonst war es eine relativ schwache asiatische
  Vertretung auf dem Investitionsgipfel. Können Sie dazu einmal sagen, welche Rolle
  das Thema von Direktinvestitionen in Deutschland spielt? Ich bin erst einmal dankbar,
  dass Sie erkennen, dass wir hier natürlich in einer gewissen Strecke arbeiten, auch
  in den vergangenen Tagen und Wochen. Dass die Frage des Standortes Deutschlands
  und der wirtschaftlichen Wettbewerbsfähigkeit für den Bundeskanzler eine enorm hohe
  Priorität hat, ist, glaube ich, in den vergangenen Tagen noch einmal sehr stark
  deutlich geworden. Wir haben auf der Invest-in-Germany-Konferenz noch einmal sehr
  stark aus ganz unterschiedlichen Regionen der Welt gespiegelt bekommen, wie auf
  diesen Standort Deutschland geblickt wird, wie viele Stärken wir hier in unserem
  Land haben, wie attraktiv unser Land auch für Investitionen in die Zukunft ist,
  wie stark wir auch als Partner in verschiedensten Fragen geschätzt werden. Natürlich
  setzt sich dieses Gespräch und auch dieses Vorhaben, Investitionen nach Deutschland
  und Europa zu bekommen und auch an unserer eigenen Wettbewerbsfähigkeit zu arbeiten,
  jetzt auch auf dieser Reise fort, mit einem besonderen Schwerpunkt natürlich auch
  auf die künstliche Intelligenz. Auch in dieser Hinsicht haben wir bereits auf der
  Kabinettsklausur in Neuhardenberg einen starken Schwerpunkt gesetzt. Das bettet
  sich alles also ein Stück weit ineinander ein. Konkrete Ankündigungen folgen, wie
  gesagt, wenn, dann auf der Reise. Herr Meyer, zuletzt waren ja auch Reisen wegen
  der innenpolitischen Lage abgesagt worden, beispielsweise des Finanzministers. Hält
  der Bundeskanzler die Lage mittlerweile für so stabil und alle Probleme für so abgeräumt,
  dass er so lange wegfahren kann? Ich glaube, dass es sehr wichtig ist, und der Bundeskanzler
  hat immer wieder darauf hingewiesen. Es wird ja manchmal dieser komische Widerspruch
  aufgemacht ‑ auch gestern habe ich es häufiger gelesen ‑, dass es den Außenkanzler
  und den Innenkanzler gibt. Am Ende hat alles das, was der Bundeskanzler im Ausland
  macht, direkte Einwirkungen und direkte Auswirkungen auf unsere innenpolitische
  Entwicklung, weil es eben um Fragen der Sicherheit geht und weil es um Fragen der
  wirtschaftlichen Zusammenarbeit geht. Deshalb ist die Zeit gerade in der nächsten
  Woche sehr gut aufgehoben. Es geht am Ende immer darum, wie wir als Europa stark
  werden, wie wir eine stabile Sicherheitsarchitektur bauen, wie wir Investitionen
  in unseren Standort, in Arbeitsplätze sichern, wie auch Menschen von Handelsbeziehungen
  profitieren, die wir überall auf der Welt haben. Insofern gehört beides zusammen.
  Deshalb ist die Reise auch genau richtig und auch der Zeitpunkt genau richtig. Für
  Sonntag oder den 31. Oktober sind ja große Demos angekündigt. Sollte der Bundeskanzler
  dabei nicht lieber zu Hause bleiben? Ich weiß jetzt nicht genau, worauf Sie anspielen.
  Ich habe gerade noch einmal gesagt, für wie richtig und wichtig ich diese Reise
  halte. Zu den angekündigten Demos haben wir uns hier in der vergangenen Woche oder
  auch am Beginn und in der Mitte der Woche bereits geäußert. Das beobachten wir natürlich.
  Die Sicherheitsbehörden haben darauf einen klaren Blick. Wirtschaftsministerin Reiche
  wird nächste Woche am Montag nach Warschau reisen . Sie wird dort am IV. Deutsch-Polnischen
  Wirtschaftsforum teilnehmen und an der neunten Konferenz der Friends of Industry
  teilnehmen. Deutschland und Polen verbindet eine starke Wirtschaftspartnerschaft,
  die stetig wächst. Deutschland ist Polens wichtigster Handelspartner. Polen war
  im vergangenen Jahr Deutschlands fünftwichtigste Handlungspartner. Das jährliche
  Deutsch-Polnische Wirtschaftsforum und der dabei stattfindende Dialog mit deutschen
  und polnischen Unternehmensvertretern leistet einen wichtigen Beitrag zum Ausbau
  der bilateralen Wirtschaftsbeziehungen und damit zur Steigerung der Wettbewerbsfähigkeit.
  Die Friends of Industry sind ein Format zum Austausch für europäischen Industrieministerinnen
  und ‑minister und damit für den europäischen Industriestandort zentral. Die Konferenz
  steht unter dem Leitmotiv „European industry amid geopolitical challenges: safeguarding
  and strengthening competitiveness and European resilience“ und hat zum Ziel, die
  Diskussion notwendiger Maßnahmen für die Stärkung der Wettbewerbsfähigkeit der europäischen
  Industrie und der wirtschaftlichen Sicherheit voranzubringen. Die Ministerin wird
  in der nächsten Woche zudem auch nach Seoul reisen, zur Asien-Pazifik-Konferenz
  sowie zu bilateralen Gesprächen mit den südkoreanischen Gastgebern und zu Unternehmensbesuchen.
  Die APK ist die zentrale Plattform für den Austausch zwischen Politik und Wirtschaft
  aus der Region. Ministerin Reiche wird die Reise nutzen, um für Deutschland als
  verlässlichen und zukunftsorientierten Partner für die Region zu werben. Dabei würde
  ich es erst einmal belassen, auch vor dem Hintergrund der Ausführungen von Herrn
  Meyer. Der Bundesumweltminister reist am Montag ins armenische Eriwan . Das ist
  ja hier schon thematisiert worden. Dort wird er bis Freitag die deutsche Delegation
  bei der Weltnaturkonferenz leiten. Das ist analog zur Weltklimakonferenz das wichtigste
  Treffen der Weltgemeinschaft zum weltweiten Schutz und zur Wiederherstellung der
  biologischen Vielfalt. Dabei ist eines der Ziele das sogenannte 30-mal-30-Ziel.
  Das heißt, dass bis 2030 mindestens 30 Prozent der globalen Fläche an Land und 30 Prozent
  auf See als Schutzgebiete ausgewiesen werden sollen. Der Bundesumweltminister hatte
  sich ja schon im Vorfeld der Konferenz geäußert, auf Fortschritte hingewiesen, aber
  auch gesagt, dass wir diese Prozesse deutlich beschleunigen müssen, um die Ziele
  bis 2030 zu erreichen. Ich möchte noch einmal unsere nationale Strategie zur biologischen
  Vielfalt erwähnen, die sozusagen für uns hier handlungsleitend ist, und auf das
  Aktionsprogramm Natürlicher Klimaschutz hinweisen, bei dem bis 2029 4,5 Milliarden
  Euro bereitstehen für Ökosysteme hier, um sie besser zu schützen, widerstandsfähiger
  zu machen und auch als natürliche CO 2 -Speicher zu stärken. Herr Meyer, gestern
  haben sich die Ministerpräsidenten ja hier in Berlin getroffen und einstimmig gefordert,
  dass die Stromsteuersenkung so schnell wie möglich kommen sollte. Deswegen würde
  ich ganz gern fragen, was die Position der Bundesregierung ist. Der Kanzler selbst
  hat es ja auch schon gefordert, aber eher in seiner Funktion als CDU-Vorsitzender.
  Können die Bürger und die kleinen Unternehmen jetzt damit rechnen, dass die Stromsteuersenkung
  schnell kommen wird? Wie Sie wissen, ist die Senkung der Stromsteuer im Koalitionsvertrag
  ja auch vorgesehen. Das heißt, es gibt diesbezüglich auch das klare Ziel, es am
  Ende vollständig umzusetzen. Allerdings steht das Vorhaben, so wie alle Vorhaben,
  natürlich unter einem Finanzierungsvorbehalt. Nach der letzten Steuerschätzung ‑ gestern
  wurde dazu ja auch sehr ausführlich kommuniziert ‑ sind die Finanzierungsoptionen
  noch nicht final ausgelotet. Darauf hat auch der Finanzminister hingewiesen. Der
  Bundeskanzler befindet sich im Gespräch mit dem Finanzminister und auch den Fachministern,
  um die vielfältigen Herausforderungen des nächsten Haushalts zu lösen. Insofern,
  halten wir selbstverständlich an dem Ziel fest. Darf ich kurz nachfragen, um das
  vielleicht noch ein bisschen zeitlich einzugrenzen? Er steht jetzt also in Gesprächen
  mit dem Finanzminister. Ist in der Hinsicht eine Entscheidung noch in diesem Jahr
  zu erwarten? Wir sprechen jetzt gerade sehr intensiv. Das Parlament macht das, aber
  natürlich auch begleitet durch die Bundesregierung, über den Haushalt für das kommende
  Jahr. In diesem Kontext sind natürlich auch viele weitere Finanzierungsfragen zu
  klären. Insofern läuft dieses Gespräch. Eine Deadline setzen lassen wir uns da nicht.
  Sie haben erwähnt, dass es um viele Finanzierungsfragen geht, die abzuklären sind.
  Hat dabei die Senkung der Stromsteuer eine Priorität auf dieser Liste? Noch einmal,
  mit dem Verweis auf das, was ich gerade gesagt habe: Wir haben das klare Ziel, die
  Stromsteuer für alle zu senken. Die finanziellen Voraussetzungen sind klar. Wir
  haben uns zum Beispiel, wenn es auch um Entlastungsmaßnahmen geht, ja auch sehr
  bewusst auf eine Einkommenssteuerreform im Umfang von 10 Milliarden Euro verständigt.
  Das heißt, das Kabinett hat es beschlossen. Der Bundestag berät es nun in erster
  Lesung. Unser klares Ziel ist, zum Beispiel auch über diesen Weg, schon ab 1. Januar
  wirklich zu einer massiven Entlastung für Arbeitnehmerinnen und Arbeitnehmer zu
  kommen. Entlastungen haben Priorität. Die Stromsteuer wäre ja auch eine Form von
  Entlastung die jeder Bürger, der Stromzahler ist, spüren würde. Darf man jetzt aus
  Ihren Worten schließen, dass auch das, die Senkung der Stromsteuer, wie bei der
  Einkommensteuer eine Umsetzungspriorität hat, auch zeitlich? Wie gerade gesagt,
  halten wir an dem Ziel fest. Am Ende stehen solche Dinge unter einem Finanzierungsvorbehalt.
  Deshalb laufen Gespräche darüber. Ich habe eine Frage ans Finanzministerium, weil
  so verschiedene Zahlen herumschwirren: Was würde es denn eigentlich an Steuerausfall
  bedeuten, wenn die Stromsteuer auf das europäische Mindestmaß reduziert würde? Was
  fiele dabei im Jahr an? Der Wert, der mir bekannt ist, ist ungefähr 5 Milliarden
  Euro im Jahr. (zum Nahostkonflikt ) Israel bereitet die Abr i egelung des Westjordanlands
  vor. Die Bundesregierung hat ja schon öfter ihre Position dazu erklärt. Aber haben
  Sie dazu noch eine Stellungnahme für uns? Das geht an das Auswärtige Amt. Ich würde
  vielleicht beginnen. Wir haben in der Tat die Nachrichten, auf die Sie jetzt Bezug
  nehmen, ebenfalls gesehen. Über die öffentlichen Aussagen hinaus, die Sie auch zitiert
  haben, liegen uns dazu bisher keine Erkenntnisse vor. Deshalb kann ich Ihnen zum
  jetzigen Zeitpunkt noch keine detaillierte Einschätzung dazu abgeben. Werden Sie
  das Gespräch mit der israelischen Seite suchen? Wir befinden uns ja generell ständig
  im Gespräch, insbesondere auch mit der israelischen Regierung. So weit dazu. Herr
  Wadephul befindet sich heute mit seinen Amtskollegen aus Saudi-Arabien, Pakistan,
  Ägypten und auch mit dem türkischen Amtskollegen in Istanbul, um das Thema des Nahen
  Ostens zu erörtern. Saudi-Arabien, Pakistan und die Türkei haben ein militärisches
  Bündnis gegründet . Wie bewertet die Bundesregierung ein solches Bündnis? Das ist
  richtig. Außenminister Wadephul befindet sich zur Stunde auf dem Weg nach Istanbul,
  um vor allem über die Lage der freien Schifffahrt zu sprechen, über die Lage in
  der Straße von Hormus, aber auch über die Lage am Roten Meer. Es ist richtig, dass
  es diesen militärischen Pakt gibt. Es steht auch jedem Land, jedem souveränen Staat
  frei, solche Pakte zu schmieden. Wir werden es jetzt nicht kommentieren bzw. bewerten.
  Wir haben bezüglich des Mekka-Paktes auch keinerlei Ankündigungen zu machen. Der
  pakistanische Präsident ist heute in Berlin . Was macht er hier? Aus welchem Grund
  ist er in Berlin? Diesbezüglich liegen mir keine näheren Kenntnisse davor. Auf der
  Augenhöhe des Staatspräsidenten ist ja der Bundespräsident. Insofern würde ich Sie
  bitten, an der Stelle vielleicht einmal nachzufragen. (zum Nahostkonflikt ) Ich
  habe eine Frage an das Auswärtige Amt: Ist denn die Ankündigung der völligen Abriegelung
  der besetzten Westbank, die durch Netanjahu angekündigt wurde, nach Einschätzung
  des Auswärtigen Amtes verhältnismäßig? Wie gerade schon der stellvertretende Regierungssprecher
  sagte, haben wir die Meldung ja erst vor Kurzem zur Kenntnis genommen. Wir haben
  natürlich von diesem Schusswaffenvorfall in der Nähe von Hebron gehört und ihn auch
  mit großer Sorge zur Kenntnis genommen. Da die Nachrichtenlage, wie gesagt, noch
  recht frisch ist, haben wir noch keine eigenen Erkenntnisse. Aber wir, meine Kolleginnen
  und Kollegen, haben hier ja schon sehr regelmäßig in Bezug auf die Situation im
  Westjordanland gesprochen, auch darauf, dass sich die Lage mit der Gewalt immer
  weiter zuspitzt. Ich glaube, dabei würde ich Sie auf die vorangegangenen Äußerungen
  verweisen. So oder so ist klar, dass die israelische Armee im Westjordanland als
  Besatzungsmacht dazu verpflichtet ist, die Rechte der Palästinenserinnen und Palästinenser
  zu wahren und zu schützen. Diesen Verpflichtungen gilt es natürlich nachzukommen.
  Es ist völlig klar, dass die Nachrichtenlage, über die Sie verfügen, begrenzt ist.
  Allerdings ist die Ankündigung einer kompletten Abriegelung eines besetzten Gebietes
  ja doch eine Maßnahme, die man einschätzen kann. Vielleicht können Sie dann nachliefern,
  ob das aus Ihrer Sicht verhältnismäßig ist oder nicht. Zweite Frage: Haben Sie Kenntnis
  oder werden Sie Kenntnis zu erlangen versuchen, um welchen, wie Netanjahu sagte,
  verhinderten terroristischen Großangriff es sich handeln solle? Wir stehen, wie
  gesagt, mit der israelischen Seite über sämtliche Kanäle ständig im Austausch und
  werden natürlich Sachverhaltsaufklärung betreiben. Zum jetzigen Zeitpunkt ist das
  natürlich noch nicht abschließend geschehen. Aber natürlich stehen wir diesbezüglich
  in Kontakt. Was für Ergebnisse erhofft sich der Außenminister heute in Istanbul
  ? Ich möchte dem Gespräch natürlich nicht vorweggreifen. Aber da ja wirklich in
  dieser Region aktuell eine Vielfalt an Konflikten besteht, ist es eben vor allem
  auch der Versuch, wieder zu einer diplomatischen Lösung zu kommen und Partner zusammenzubringen.
  Es sind also eben nicht nur Frankreich, Großbritannien und Deutschland als E3, sondern
  auch Italien dabei, plus diese vier Regionalmächte Pakistan, Saudi-Arabien, die
  Türkei und Ägypten. Es ist das erste Mal, dass sie in diesem Format zusammenkommen.
  Viele dieser genannten Länder spielen in der Region eine sehr wichtige Rolle als
  Vermittlungsakteur. Es ist ein Versuch, einer diplomatischen Lösung in diesem Konflikt,
  vor allem in der Straße von Hormus, jetzt wieder neue Impulse zu geben. Dann möchte
  ich aber nicht dem vorweggreifen, was heute in den Gesprächen natürlich beschlossen
  wird. Es geht ja erst heute Nachmittag los. Der Minister hat sich heute Morgen auch
  geäußert. Das könnten Sie auch noch einmal nachlesen. Heute Nachmittag wird es dann
  auch noch einmal ein abschließendes Pressestatement geben. Das ist heute Nachmittag,
  meine ich, um 15 Uhr deutscher Zeit. (zum Nahostkonflikt ) Ich probiere es einmal
  bei Herrn Meyer, weil der Kanzler vergangene Woche ja bei einer Sitzung des Europäischen
  Rates war. Dort gab es eine interessante Schlussfolgerung, der sich Deutschland
  auch angeschlossen hat, in Bezug auf Israel. Unter anderem wurde mit Nachdruck die
  Rücknahme der Ausschreibung für die Bauarbeiten im E1-Gebiet gefordert. Es heißt
  laut Beschluss, der Rat hebe hervor, „dass sich Unternehmen nicht für Bauaufträge
  im E1-Gebiet oder andere Siedlungsentwicklungen bewerben sollten, und verweist auf
  die rechtlichen und wirtschaftlichen Folgen sowie die Reputationsrisiken für am
  Siedlungsbau beteiligte Unternehmen und Finanzinstitute, einschließlich der Gefahr
  schwerwiegender Verstöße gegen das Völkerrecht.“ Wen warnen die Bundesregierung
  und die Europäische Union damit genau? Um welche europäischen Finanzakteure geht
  es? Das kann ich nicht weiter spezifizieren. Ich habe jetzt auch den genauen Wortlaut
  des Beschlusses ‑ ‑ ‑ Ich gehe jetzt einmal davon aus, dass Sie ihn korrekt vorgetragen
  haben. Ich glaube aber, es bettet sich ja ein und deckt sich ja auch mit klaren
  Aussagen nicht nur der Bundesregierung, sondern auch des Bundeskanzlers zum Westjordanland
  und insbesondere dem Hinweis auf das Völkerrecht und die notwendige Einhaltung dessen.
  Hat die Bundesregierung Kenntnis über europäische Institute bzw. Finanzakteure,
  die bisher am illegalen Siedlungsbau der Israelis beteiligt sind? Wenn ja, können
  Sie uns dies bitte nachreichen? Ich habe dazu keine Kenntnis. Ich kann es nicht
  weiter spezifizieren. Ich habe eine kurze Frage an Frau Wolf zu diesem neuen Treffen
  zwischen der E3 und den Golfstaaten und Pakistan. Sie sehen es wie ein neues Format
  für Iran, vielleicht auch für die Ukraine. Es gibt das Treffen in der Türkei. Aber
  gibt es nur ein Treffen? Inwieweit es sich verstetigt, das steht noch nicht fest.
  E3 ist ein in den Iranverhandlungen schon seit Langem etabliertes Format. Heute
  ist es, wie gesagt, um Italien erweitert. Italien spielt in der südlichen Region
  ja auch eine wichtige Rolle und hat dort viele Kontakte. Es ist heute das erste
  Mal, dass es in diesem Format stattfindet. Inwieweit sich das verstetigt, muss man,
  wie gesagt, sehen. Es kommt auch auf das Ergebnis der heutigen Gespräche an. Natürlich
  geht es heute nicht prioritär um die Ukraine, aber natürlich ist zum Beispiel die
  Lage im Schwarzen Meer, das für die Türkei eine wesentliche Rolle spielt, heute
  Teil der Gespräche. Ich weiß, dass ein Treffen zwischen dem Golf-Kooperationsrat
  und der Europäischen Union ausgesetzt wurde. War dies der Grund dafür, dass sich
  die E3 mit diesen Ländern treffen wollten? ‑ Verstehen Sie meine Frage? Darf ich
  sie auf Englisch stellen? Es ist nicht als Ersatzformat geplant. Das heutige Treffen
  kam auf Initiative von Außenminister Wadephul und seinem türkischen Amtskollegen
  zustande. Das Treffen mit dem Golf-Kooperationsrat wurde verschoben. Es wird aber
  nachgeholt werden. (zum Nahostkonflikt ) Ich möchte mich noch einmal an das Finanzministerium
  mit Frage der Finanzierung oder Kreditvergabe für siedleraktivitätsgebundene Investitionen
  in der besetzten Westbank wenden. Der Europäische Rat hat deutsche Akteure explizit
  genannt, die als Kreditgeber aufgetreten sind, zum Beispiel die Commerzbank oder
  die Deutsche Bank. Ist der Bundesregierung bekannt oder monitort sie, ob solche
  Kredite von deutschen Kreditinstituten gewährt werden? Mir ist darüber nichts bekannt.
  Aber das kann auch einfach daran liegen, dass ich davon noch nicht gehört habe.
