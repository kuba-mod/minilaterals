title: Pressestatement von Kanzler Merz zum Empfang britischen Premier Burnham Vereinigtes
  Königreich und Deutschland gehören zusammen
text: 'Der Vertrag eröffne neue Möglichkeiten für Großbritannien und für Deutschland
  in der Zusammenarbeit, sagte Bundeskanzler Merz. Bundeskanzler Friedrich Merz sprach
  beim Empfang des britischen Premierministers Andrew Burnham in Berlin von einem
  historischen Moment der bilateralen Beziehungen beider Länder. Die Regierungschefs
  tauschten im Bundeskanzleramt die Ratifikationsurkunden des deutsch-britischen Freundschaftsvertrags
  – des sogenannten Kensington-Vertrags – aus und besiegelten damit dessen Inkrafttreten.
  „Dieser Vertrag eröffnet Großbritannien und Deutschland neue Möglichkeiten in der
  Zusammenarbeit“, sagte Bundeskanzler Merz im Rahmen der Übergabe. Insbesondere junge
  Menschen profitieren von der Vereinbarung. So werden längere Schüler- und Studierendenaustausche
  künftig ohne Visum erleichtert. Zugleich hob Bundeskanzler Friedrich Merz die europäische
  Dimension des Vertrages hervor: „Wir machen das, damit die junge Generation auch
  in den bilateralen Beziehungen zwischen Deutschland als Teil der Europäischen Union
  und Großbritannien einfach merkt, wie gut wir Europäer zusammenarbeiten und wie
  sehr wir auch zusammengehören.“ Der sogenannte Kensington-Vertrag ist der deutsch-britische
  Freundschaftsvertrag, der am 17. Juli 2025 in London unterzeichnet wurde. Mit ihm
  stellen Deutschland und das Vereinigte Königreich ihre Beziehungen auf eine neue
  strategische Grundlage. Im Mittelpunkt stehen eine engere Zusammenarbeit in der
  Außen-, Sicherheits- und Verteidigungspolitik, die Förderung von Wirtschaft, Forschung
  und Innovation sowie die Stärkung der Kontakte zwischen den Bürgern beider Länder.
  Bundeskanzler Merz bezeichnet die deutsch-britischen Beziehungen als eine der wichtigsten
  bilateralen Partnerschaften Europas. Der Austausch der Vertragsurkunden fand am
  8. Oktober 2026 statt. Herzlich willkommen, Andy Burnham , im Kanzleramt der Bundesrepublik
  Deutschland! Ich freue mich sehr darüber, dass wir uns heute sehen. Ich heiße auch
  die Schülerinnen und Schüler sehr herzlich willkommen. Schön, dass Sie und dass
  ihr heute bei uns seid! Das ist in der Tat ein weiterer historischer Tag; ich habe
  es gerade schon ohne die Mikrofone gesagt. Im Sommer des vergangenen Jahres habe
  ich den Vertrag mit dem Vorgänger von Andy Burnham in London abgeschlossen. Heute
  tauschen wir nach den entsprechenden Verfahren, nach der sogenannten Ratifikation,
  die Urkunden aus. Damit ist der letzte formelle Akt zum Inkrafttreten eines Vertrages
  zwischen der Bundesrepublik Deutschland und dem Vereinigten Königreich über Freundschaft
  und bilaterale Zusammenarbeit erfüllt. Dieser Vertrag eröffnet Großbritannien und
  Deutschland neue Möglichkeiten in der Zusammenarbeit. Nachdem Großbritannien die
  Europäische Union leider verlassen hat, machen wir jetzt wenigstens bilateral einen
  Vertrag. Dieser Vertrag, der viele Elemente über die Zusammenarbeit zwischen Großbritannien
  und Deutschland enthält, beinhaltet vor allem für die Schülerinnen und Schüler einen
  besseren Zugang zu unseren beiden Ländern, access to the UK and access to Germany,
  ohne Visum, auch für längere Schüleraufenthalte, Studentenaufenthalte und für den
  Schüleraustausch zwischen Großbritannien und Deutschland. Ich möchte es hier noch
  einmal sagen: Dafür machen wir das. Wir machen das, damit die junge Generation auch
  in den bilateralen Beziehungen zwischen Deutschland als Teil der Europäischen Union
  und Großbritannien einfach merkt, wie gut wir Europäer zusammenarbeiten und wie
  sehr wir auch zusammengehören. In diesem Sinne noch einmal ein herzliches Willkommen,
  Andy, in Berlin! Ich freue mich wirklich sehr darüber, dass wir heute die Gelegenheit
  haben, uns zum ersten Mal zu treffen. Wir sprechen nicht zum ersten Mal miteinander,
  aber wir begegnen einander zum ersten Mal persönlich, auch mit unseren Teams. Ganz
  herzlichen Dank! A warm welcome to Andy Burnham to Berlin!'
