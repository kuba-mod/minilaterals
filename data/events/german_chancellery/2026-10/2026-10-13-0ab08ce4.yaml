date: '2026-10-13'
type: press_release
source_name: german_chancellery
title: Rede von Bundeskanzler Merz anlässlich des Deutschen Arbeitgebertages 2026
  Reformen für eine gute Zukunft in Deutschland
text: 'Im Gespräch mit dem BDA-Präsidenten appellierte der Bundeskanzler an die Arbeitgeber,
  gemeinsam mit ihren 30 Millionen Beschäftigten, den Weg der Reformen mitzugehen.
  Bundeskanzler Friedrich Merz will große Reformen bei Rente, Gesundheit und Pflege
  voranbringen: für einen Sozialstaat, der auch in Zukunft bezahlbar bleibt, und eine
  Wirtschaft, die langfristig wachsen kann. Dafür sollen Politik, Arbeitgeber und
  Beschäftigte zusammenarbeiten. Gute Signale sind da: Die Wirtschaft sei widerstandsfähiger
  als erwartet und wachse trotz der Kriege und Handelskonflikte, sagte der Bundeskanzler
  beim Deutschen Arbeitgebertag in Berlin. Für ein langfristiges Wachstum brauche
  es die Voraussetzungen. Nun komme es vor allem auf die großen Sozialreformen an,
  betonte Merz. Noch nie seien alle Sozialreformen gleichzeitig angegangen worden.
  „Was wir heute tun, das sind wir den Jungen schuldig. Sie sollen wie wir Ältere
  in einem Land leben, in dem man sich durch Leistung etwas aufbauen kann. In dem
  man eine gute Zukunft für sich und die Familie sieht“, betonte Merz. Der Deutsche Arbeitgebertag
  wird von der Bundesvereinigung der Deutschen Arbeitgeberverbände (BDA) jährlich
  organisiert. Diese vertritt die gemeinsamen wirtschafts- und sozialpolitischen Positionen
  der deutschen Arbeitgeber. Der BDA sind über ihre Mitgliedsverbände rund eine Million
  Unternehmen mit etwa 30,5 Millionen Beschäftigten angeschlossen. Beim Arbeitgebertag
  diskutieren Spitzen aus Wirtschaft, Politik und Gesellschaft über ein breites Themenspektrum
  – von Beschäftigungs- und Fachkräftesicherung, Wertschöpfung in Zeiten von KI ,
  den Voraussetzungen für Wirtschaftsaufschwung, Bildung als strategischer Aufgabe,
  Bürokratierückbau bis zur Stärkung der Verteidigungsfähigkeit. Sehr geehrter Herr
  Präsident, lieber Rainer Dulger, sehr geehrter Herr Hauptgeschäftsführer, lieber
  Steffen Kampeter, meine sehr geehrten Damen und Herren, herzlichen Dank für die
  freundliche Begrüßung und die Einladung, auch am diesjährigen Arbeitgebertag zu
  Ihnen zu sprechen. Ich freue mich, dass wir uns heute sehen. Ich bedanke mich, Herr
  Präsident, lieber Rainer, bei Dir für die kritische, aber auch sehr konstruktive
  Rede. Ich bedanke mich für die Begleitung der letzten zwölf Monate, und ich bedanke
  mich für die konstruktiven Ideen und die Mithilfe aus Ihren Unternehmen, aus dem
  Verband, aus den Mitgliedsverbänden. Herzlichen Dank für die Zusammenarbeit im letzten
  Jahr! Meine Damen und Herren, dieser Arbeitgebertag fällt in eine Zeit, in der die
  deutsche Wirtschaft so viel Gegenwind ausgesetzt ist wie selten zuvor in der jüngeren
  Geschichte der Bundesrepublik Deutschland. Der Krieg Russlands gegen die Ukraine
  hat auch Auswirkungen auf unsere Sicherheit, auf unsere Energieversorgung; soziale
  Sicherungssysteme an den Grenzen ihrer Finanzierbarkeit; der Konflikt im Mittleren
  Osten, der das Öl weltweit verteuert; unfaire Handelspraktiken, die uns treffen
  wie wenige; die Zollpolitik der USA , die unvorhersehbar und unkalkulierbar bleiben
  wird. Es ist eine Zeit der multiplen Krisen. Ein Teil der Wahrheit ist: Wir in der
  Politik und Sie, die Sie in der Wirtschaft Verantwortung tragen, haben auf diese
  sehr herausfordernden Umstände nur bedingt Einfluss. Aber wir stehen in der Verantwortung,
  mit diesen Herausforderungen möglichst gut umzugehen. Genau das tun wir. Schaut
  man sich die Zahlen an, dann könnten wir sogar einigermaßen zuversichtlich sein:
  Die deutsche Wirtschaft ist widerstandsfähig. Sie ist zuletzt ungeachtet der gewaltigen
  Herausforderungen, von denen ich nur einige genannt habe, sogar gewachsen. Das Bruttoinlandprodukt
  lag zum Ende des ersten Halbjahres 2026 schon um ein Prozent höher als im Vorjahr.
  Die führenden Wirtschaftsforschungsinstitute haben in den letzten Tagen, bis in
  diese Tage hinein die Wachstumsprognose für das nächste Jahr noch einmal deutlich
  nach oben korrigiert, auf jetzt ungefähr 1,3 Prozent. Für 2027 wird erwartet, dass
  sich dieser Trend fortsetzt. Klar ist gleichwohl: Unser Blick muss über diese Zeit
  der multiplen Krisen hinausgehen. Wir müssen die strukturellen Verwerfungen erkennen,
  und wir müssen zu strukturellen Antworten finden. Das langfristige Wachstumspotenzial
  unserer Volkswirtschaft muss steigen. Es ist nicht damit getan ‑ lassen Sie mich
  das in diesem Bild sagen  – , die Stürme, die wir derzeit durchsegeln, möglichst
  unbeschadet zu überstehen, vielleicht sogar in der Hoffnung, danach wieder in altes,
  wohlvertrautes Gewässer hineinzusegeln. Auch wenn die gegenwärtigen Krisen überwunden
  sind, wird die Welt eine andere geworden sein  –  durch künstliche Intelligenz,
  durch sich weiter verschiebende globale Machtverhältnisse, durch den demografischen
  Wandel, den Klimawandel und die Zerrüttung der uns bekannten alten politischen Ordnung.
  Genau auf diese Welt, meine Damen und Herren, müssen wir uns heute vorbereiten.
  Auch hier ist die gute Nachricht: Das geschieht auch. Viele von Ihnen nutzen die
  Chancen der neuen Technologien. Forschung und Entwicklung in unserem Land tragen
  dazu erheblich bei. Auch wir in der Politik nutzen die Chancen. Ich habe es im letzten
  Jahr von dieser Stelle aus schon gesagt; ich will es heute wiederholen: Wir erschließen
  uns als Europäer neue Handelspartnerschaften überall auf der Welt. Wir besinnen
  uns auf unsere Stärken, und wir wehren uns auch so gegen die Verletzung der Spielregeln.
  Wir versuchen in dieser Lage, zum Teil über Jahrzehnte unterbliebene Reformen durchzusetzen.
  Meine Damen und Herren, das tun wir nicht für uns und unsere Generationen. Was wir
  heute tun, das sind wir den Jungen schuldig. Sie sollen wie wir Älteren in einem
  Land leben, in dem man sich durch Leistung etwas aufbauen kann. Sie sollen in einem
  Land leben, in dem man sich persönlich entfalten kann, in dem man eine Familie gründen
  kann und in dem man eine gute Zukunft für sich und die Familie sieht. Deswegen beginnt
  die Modernisierung, die Fahrt in die neuen Gewässer, bei uns zu Hause, in unseren
  eigenen Revieren. Das ist der Grund, warum wir so viel Kraft in die Reform der sozialen
  Sicherungssysteme stecken. Wir wissen dabei: Nicht nur, aber ganz besonders junge
  Menschen sorgen sich um die Zukunft dieser Systeme. Sie glauben heute nicht daran,
  dass das Sicherheitsversprechen auch noch für sie gilt, wenn sie im Alter, bei Krankheit
  oder Pflegebedürftigkeit Hilfe brauchen. Sie sehen, dass sie immer höhere Beiträge
  zahlen müssen. Wir, die Bundesregierung, wollen hier für neues Vertrauen sorgen.
  Denn nur ein Sozialstaat, der verlässlich schützt und der zugleich nachhaltig finanziert
  ist, wird auch von der jungen Generation dauerhaft mitgetragen und akzeptiert. Meine
  Damen und Herren, deshalb die Reformen in Gesundheit, Pflege und Rente! Lassen Sie
  mich auch hinzufügen: Niemals zuvor wurden alle unsere sozialen Sicherungssysteme
  zur selben Zeit reformiert. Ich weiß, was wir dabei den Menschen abverlangen, und
  ich bin dankbar, dass eine große Mehrheit immerhin über die Notwendigkeit dieser
  Modernisierung informiert ist und sie auch akzeptiert. Wir wollen für alle Menschen
  in Deutschland das gleich fair und gleich ordentlich hinbekommen. Meine Damen und
  Herren, diese Reformen unserer sozialen Sicherungssysteme haben längst begonnen.
  Erste Teile der Gesundheitsreform sind in Kraft. Die Ausgaben der gesetzlichen Krankenversicherung
  werden, anders als zum Jahresbeginn prognostiziert, wieder an die Einnahmen gekoppelt,
  so wie wir das früher schon einmal hatten. Wir stellen damit die Finanzen der Krankenversicherung,
  der Krankenkassen, wieder auf ein solides Fundament und stabilisieren die Krankenversicherungsbeiträge.
  Wir sind dabei den Empfehlungen der Expertenkommission gefolgt. Übrigens, zum Verruf,
  in den die Expertenkommission geraten ist: Ich habe immer schon zu denen gehört
  und gehöre auch heute in dieser Funktion zu denen, die gern auf den Rat von Fachleuten
  und Experten hören. Wir haben in unserem Land für die Sozialpolitik und die Wirtschaftspolitik
  für viele Themen, auch für sehr spezielle Themen bis hinunter in sämtliche Zweige
  der sozialen Sicherungssysteme, exzellente Fachleute, auch bei den Sozialpartnern.
  Ich möchte, dass sie gehört werden und dass ihre Vorschläge in der Politik auch
  Berücksichtigung finden. Deshalb haben wir Expertenkommissionen gebeten, uns Vorschläge
  zu machen. Ich komme gleich noch in einem anderen Zusammenhang darauf zurück. Wir
  sind diesen Vorschlägen gefolgt. In einem weiteren Schritt wird diese Kommission,
  die noch tagt, weitere Empfehlungen für weitere strukturelle Reformen machen. Ziel
  ist es, die Beitragssätze auch langfristig stabil zu halten und zugleich eine gute
  Versorgung zu gewährleisten. Meine Damen und Herren, auch in der sozialen Pflegeversicherung
  werden wir nach Jahren ständiger Beitragssatzerhöhungen die finanzielle Basis stabilisieren
  und zugleich erste Verbesserungen für Pflegebedürftige und pflegende Angehörige
  erreichen. Im Kabinett wurde in der letzten Woche der Gesetzentwurf beschlossen.
  Heute sind mehr als sechs Millionen Menschen pflegebedürftig. Diese Zahl steigt,
  und jeder von uns kann eines Tages dazugehören. Ohne eine Reform wären die Pflegeleistungen
  auf Dauer nicht mehr finanzierbar. Genau das verhindern wir. Auch der erste Teil
  dieser Reform ist, was auch immer anderes behauptet wird, kein reines Spargesetz.
  Prävention und Rehabilitation werden gestärkt. Das soll Pflegebedürftigkeit möglichst
  lange vermeiden und dazu beitragen, dass sich ein Pflegezustand nicht weiter verschlechtert.
  Im nächsten Schritt setzen wir auch in der Pflege eine Expertenkommission ein, die
  bis zum kommenden Jahr sehr konkrete Vorschläge für strukturelle Verbesserungen
  und eine nachhaltige Finanzierung erarbeitet. Meine Damen und Herren, sagen Sie
  nicht, das seien Details der Sozialpolitik. Das sind Grundsatzfragen der Gerechtigkeit
  in unserem Land. Menschen, die sich Pflege nicht leisten können, müssen wissen,
  dass sie sich auf diesen Sozialstaat verlassen können. Umgekehrt: Menschen, die
  sich ihre Pflege finanziell leisten können, müssen und sollen auch in Zukunft selbst
  mehr dazu beitragen. Meine Damen und Herren, die größte Ungerechtigkeit tut sich
  aus der Sicht der jungen Generation heute in der gesetzlichen Rentenversicherung
  auf. Unser heutiges umlagefinanziertes System hat in einer alternden Gesellschaft
  keine Zukunft. Machen wir so weiter wie bisher, sänke das Rentenniveau und stiegen
  die Beiträge immer weiter an. Kein junger Mensch kann sich damit abfinden. Kleinere
  Korrekturen wie in der Vergangenheit reichen jetzt nicht mehr. Es hilft nichts.
  Wir müssen uns alle zusammen ehrlich machen, solange jedenfalls der Jungbrunnen
  nicht gefunden ist, in den wir alle einmal einsteigen können. Wir brauchen und ich
  will eine große Reform. Meine Damen und Herren, ich will eine Lösung, die unser
  Rentensystem langfristig sicher macht. Wir haben hierzu bereits einige Entscheidungen
  getroffen: Frühstartrente, Aktivrente, die hoffentlich in Ihren Unternehmen schon
  umfangreich genutzt wird, Verbesserungen in der privaten und betrieblichen Säule
  der Altersversorgung sind bereits in Kraft. Zusammen mit dem, was wir noch verabredet
  haben, bedeutet das: Das Rentenniveau, das Niveau der Alterssicherung, wird steigen,
  und die Beiträge werden sinken. Möglich wird das durch die neue gesetzliche Kapitalrente.
  Endlich nutzen wir damit in Deutschland die positiven Effekte des Kapitalmarkts,
  so wie das viele andere Länder auf der Welt längst tun. Wir sind damit mindestens
  30 Jahre zu spät. Aber, meine Damen und Herren, damit machen wir die Rente jetzt
  stabil und gerecht. Warum sollten eigentlich nur diejenigen vom Kapitalmarkt profitieren,
  die für sich selbst zusätzlich vorsorgen können? Wir beteiligen jetzt alle Arbeitnehmerinnen
  und Arbeitnehmer an der Entwicklung unserer Volkswirtschaft. Allerdings, und auch
  das gehört zur Wahrheit: Bis ein ausreichend großer Kapitalstock angesammelt ist,
  der einen relevanten Beitrag für die Altersversorgung abwirft, wird es einige Jahre
  dauern. Die Kapitalrente wird also insbesondere den jüngeren Generationen zugutekommen.
  Es wird für diesen Umbau notwendigerweise vorübergehend zu höheren Beiträgen kommen,
  die von Arbeitgebern und Arbeitnehmern zu tragen sind. Aber Sie sehen genau an diesem
  Beispiel, meine Damen und Herren: Wir machen Politik nicht für eine Wahlperiode,
  sondern wir machen Politik für die nächste Generation. Deshalb gilt: Je früher wir
  mit dem Einstieg in die Kapitalrente beginnen, desto schneller wird sie auch wirken,
  und je schneller die Kapitalrente greift, umso schneller können die Beiträge auch
  wieder sinken. Lassen Sie mich zu diesem umstrittenen Teil der Reform auch eine
  Anmerkung machen: Auch das Ende der abschlagsfreien Frühverrentung macht die Rente
  gerechter. Denn, meine Damen und Herren, gesund und fit abschlagsfrei früher in
  Rente zu gehen, das ist weder gerecht, noch können die Rentenversicherung und unsere
  Volkswirtschaft es sich leisten, wenn immer weniger Arbeitende immer mehr Rentnerinnen
  und Rentner finanzieren müssen. So viel zu den Reformen der sozialen Sicherungssysteme.
  Für Sie ebenso und mindestens genauso wichtig ist, was wir vor der Sommerpause,
  genau am 1. Juli, zur Flexibilisierung des Arbeitsmarktes verabredet haben. Ihre
  Unternehmen und Ihre Arbeitnehmerinnen und Arbeitnehmer gehören zu den besten und
  innovativsten der Welt; Rainer Dulger hat es hier gerade gesagt. Aber der deutsche
  Arbeitsmarkt muss sich noch ein bisschen von dieser Innovationsstärke abschauen.
  Dieser Arbeitsmarkt ist nach wie vor zu starr und zu unflexibel. Weder ermöglicht
  es der Arbeitsmarkt den Unternehmen, schnell und unkompliziert zu wachsen, noch
  ermöglicht er den Arbeitssuchenden, schnell und unkompliziert neue Arbeit zu finden.
  Besonders die vielen Start-ups  –  –  nicht nur sie, aber auch sie  –  brauchen
  Möglichkeiten für einen flexiblen Personaleinsatz. Hier hat Deutschland großes Potenzial.
  Sie kennen vermutlich die Zahlen. Im ersten Halbjahr 2026 wurden schon wieder mehr
  als 3000 neue Start-ups gegründet, ein Anstieg von fast 90 Prozent gegenüber dem
  Vorjahr, und schon das Vorjahr war mit 3500 Gründungen ein Rekordjahr. Wir wollen
  deshalb, meine Damen und Herren, diese Dynamik des Arbeitsmarktes nutzen, um auch
  mehr Flexibilität für die Beschäftigten zu ermöglichen. Wir werden deshalb Befristungsmöglichkeiten
  für die Unternehmen erweitern, und wir werden auch den Kündigungsschutz für diejenigen
  lockern, die besonders hohe Einkommen erzielen. Sie brauchen den Kündigungsschutz
  so, wie wir ihn heute haben, nicht mehr. Auch beim Rückbau unserer überbordenden
  Bürokratie kommen wir voran. Die, so nennen wir es, Sitzungen des Entlastungskabinetts,
  die wir regelmäßig machen, haben Wirkung. Die Modernisierungsagenden im Bund und
  föderal, sie sind ehrgeizig, und sie sind konkret in der Umsetzung. Beim Bau-Turbo
  zum Beispiel ermöglichen wir schon jetzt mehr und schnelleren Wohnungsbau. Das Infrastruktur-Zukunftsgesetz,
  über das ich im letzten Jahr von dieser Stelle aus gesprochen habe, ist in Kraft
  und wird die Genehmigung neuer Autobahnen, neuer Infrastruktur, neuer Schienenwege,
  den Ersatz maroder Brücken und wichtige Sanierungen von Wasserstraßen beschleunigen.
  Gerade haben wir verabredet, meine Damen und Herren, nahezu alle Berichtspflichten
  für Unternehmen abzuschaffen. Erhalten bleiben sollen nur solche, deren Notwendigkeit
  von den zuständigen Ministerien jeweils neu begründet wird. Ein Gesetz dafür ist
  in Arbeit. Mit einer dauerhaften Berichtspflichtenbremse verhindern wir, dass in
  künftigen Gesetzen wieder neue bürokratische Meldepflichten für die Unternehmen
  kommen. Das, was ich auf nationaler Ebene tue, meine Damen und Herren, tue ich auch
  auf der europäischen Ebene. Wir werden in dieser Woche, am Donnerstag und Freitag,
  erneut zu einem Europäischen Rat in Brüssel zusammentreffen. Ich habe den Kolleginnen
  und Kollegen vorgeschlagen, im Februar des nächsten Jahres dasselbe zu tun, was
  wir im Februar dieses Jahres gemacht haben, nämlich bei einer Klausurtagung der
  Staats- und Regierungschefs der Europäischen Union in der Abgeschiedenheit eines
  alten Schlosses in Alden Biesen in Belgien ‑ dort, wo der Deutsche Orden gegründet
  worden ist  –  einmal einen ganzen Tag mit der Frage umzugehen: Was müssen wir eigentlich
  tun, um das, was uns Enrico Letta und Mario Draghi in ihren wegweisenden Berichten
  zur Wettbewerbsfähigkeit und zur Vollendung des Europäischen Binnenmarktes aufgeschrieben
  haben, zu verwirklichen? Zusammen mit Emmanuel Macron sind wir beiden diejenigen,
  die die Europäische Union jetzt zu einem wirklichen Rückbau der europäischen Bürokratie
  treiben, zur weiteren Öffnung des Europäischen Binnenmarktes und zur Herstellung
  der Wettbewerbsfähigkeit der europäischen Industrie im globalen Maßstab. Meine Damen
  und Herren, wir machen auch in der Europäischen Union auf diesem Weg große Fortschritte,
  immer noch nicht so weit, wie wir sie brauchen, aber wir machen diese Fortschritte,
  und ich werde auch in meinem Ehrgeiz nicht nachlassen, das, was uns die Fachleute
  Enrico Letta und Mario Draghi aufgeschrieben haben, zu verwirklichen. Hier bei uns
  in Deutschland hat uns gerade Julia Jäkel erneut bescheinigt, was bei uns geschieht.
  Denn sie sieht sehr genau hin, was aus ihren gemeinsam mit Thomas de Maizière, Peer
  Steinbrück und Andreas Voßkuhle unterbreiteten Vorschlägen – erneut aus einer Expertenkommission
  zur Staatsmodernisierung – wird. Ich zitiere sie wörtlich: „Wir erleben gerade den
  größten Modernisierungsschub unserer staatlichen Strukturen seit Dekaden.“ - Ja,
  meine Damen und Herren, sie hat recht. Spüren werden Sie ‑ das ist mein letzter
  Punkt – Schritt für Schritt auch die verbesserten steuerlichen Rahmenbedingungen.
  Die ausgebauten Abschreibungsmöglichkeiten sind seit dem 1. Juli des letzten Jahres
  in Kraft. Die Senkung der Körperschaftsteuer folgt Schritt für Schritt. Sie sehen
  also: Wir tun alles, meine Damen und Herren, um endlich wieder Wachstum zu ermöglichen,
  um es Ihnen zu erleichtern, Neues zu schaffen, zu investieren und das zu tun, was
  Sie als Arbeitgeberinnen und Arbeitgeber tun wollen und worauf Sie stolz sind, nämlich
  in Deutschland Arbeit zu schaffen. Ja, wir haben noch viel zu tun. Aber ich will
  all dies erreichen für unser Land, und ich werde nicht aufhören, dafür zu kämpfen,
  dass wir das auch gemeinsam hinbekommen. Die Bundesregierung und ich ganz persönlich,
  meine Damen und Herren, wir brauchen dabei Sie. Wir brauchen Sie als Sozialpartner,
  so wie auch die Arbeitnehmervertretungen. Wir brauchen Ihr Vertrauen, dass wir den
  Erfolg unseres Landes gemeinsam wollen. Wir brauchen Ihre Zuversicht, und wir sind
  dann auch gemeinsam entschlossen, auch wenn wir nicht immer alles von vornherein
  in der Koalition mit einer Meinung hinbekommen. Aber wir wissen: Wir tragen die
  Verantwortung für unser Land. Wir wollen Erfolg, gemeinsam, für unser Land, und
  ich will in dieser Koalition Erfolg haben. Erfolg heißt, noch einmal, dass die jungen
  Menschen im Land wieder das Vertrauen haben, dass ihre Zukunft in Deutschland ihnen
  gehört, dass sich Arbeit lohnt, dass die sozialen Sicherungssysteme stabil sind,
  dass Deutschland ein Land ist, in dem jeder ein gutes Leben für sich und seine Familie
  aufbauen kann. Meine Damen und Herren, deshalb müssen die Aufgaben, die vor uns
  liegen, die Umsetzung der Koalitionsbeschlüsse zum Thema der Rente und des Arbeitsmarktes,
  jetzt erledigt werden. Das wissen Sie hier im Saal ganz besonders, und Sie wissen
  es vermutlich mehr als viele andere. Deshalb  –  ich will es noch einmal betonen 
  –  ist die Bundesregierung auch auf unsere gemeinsame Kraftanstrengung angewiesen.
  Sie repräsentieren in der BDA rund eine Million Unternehmen mit rund 30 Millionen
  Beschäftigten  –  das sind deutlich mehr als 60 Prozent der Erwerbstätigen in unserem
  Land ‑, 30 Millionen Menschen, die als Teil Ihrer Unternehmen unser Land am Laufen
  halten, die anpacken, die Steuern zahlen, die sich mit ihrer Arbeit identifizieren
  und für dieses Land auch Mitverantwortung übernehmen, nicht nur in den Betrieben,
  sondern bis hinunter in die Städte, in die Dörfer, in die Vereine, im Sport, in
  der Musik, in den Hilfsorganisationen. Meine Damen und Herren, mit dem, was Sie
  als Arbeitgeberinnen und Arbeitgeber tun, investieren Sie in diese Menschen. Sie
  setzen auf Sie, und diese Menschen setzen auf unser Land. Deshalb ist Ihre konstruktive
  Mitarbeit auch als Sozialpartner bei der Erneuerung unseres Landes so wichtig und
  so wertvoll. Sie sind in Ihren Unternehmen im Austausch mit Millionen Bürgerinnen
  und Bürgern, auf die es ankommt. Reden Sie miteinander! Entwickeln Sie, wo immer
  es geht, ein gemeinsames Verständnis für die Herausforderungen, vor denen wir stehen,
  für die Veränderungen, die notwendig sind, und für die Chancen, die sich uns eröffnen.
  Sie tun das für Ihre Unternehmen, ja, aber Sie tun es zugleich auch für unser Land.
  Noch einmal: Es gibt inzwischen viele Signale und ermutigende Anzeichen, dass unserem
  Land dieser Aufbruch gelingen kann. Die Transformation unserer Volkswirtschaft findet
  statt, während viele immer noch überlegen, ob sie überhaupt gelingen kann. Wir sehen
  inzwischen beeindruckende Erfolgsgeschichten. Ich will nur eine nennen. Nächste
  Woche haben wir den Invest in Germany Summit hier in Berlin. Es geht hierbei nicht
  nur um viele hundert Milliarden Euro, die in Projekte in Deutschland fließen, es
  geht auch um die Botschaft von Investoren an die Menschen in unserem Land und in
  der Welt. Wir glauben an Deutschland und an das Potenzial in Deutschland. Meine
  Damen und Herren, die Studien, die wir sehen, zeigen, dass Europa mittlerweile auf
  der Welt als einer der attraktivsten Investitionsstandorte angesehen wird. Die Studien,
  die wir sehen, zeigen, dass Deutschland in Europa als der attraktivste Investitionsstandort
  angesehen wird. Diese Signale, diese Zahlen, diese steigenden Investitionssummen
  aus dem In- und Ausland, das sind die Signale, auf die wir achten sollten und die
  wir auch ansprechen sollten. Diese Signale machen Zuversicht, und sie sind greifbar.
  Sie zeigen eben, dass Deutschland eine Chance hat, aus dieser schwierigen Lage herauszukommen.
  Machen wir uns also an die Arbeit, nutzen wir dieses Momentum, denn es geht um nicht
  mehr und um nicht weniger als um die Erneuerung der marktwirtschaftlichen Ordnung
  unseres Landes. Um noch einmal im Bild zu bleiben: Wir bereiten unser Land auf die
  nächste große Reise vor, auf herausfordernde Gewässer, in die wir gemeinsam segeln
  wollen. Ich will jedenfalls von meiner Seite aus alles dafür tun, dass es mehr und
  mehr Grund für genau diese Zuversicht gibt. Ich werde weiter dafür kämpfen, dass
  sich in der Bundesregierung trotz mancher Meinungsverschiedenheiten immer wieder
  das Richtige und das Notwendige durchsetzt. Meine Damen und Herren, wenn wir mit
  diesem Geist in die nächsten zwölf Monate gehen, dann bin ich sicher, dass auf dem
  nächsten Arbeitgebertag 2027 hier in Berlin noch einmal mehr Grund zur Zuversicht
  bestehen wird. Gehen wir diesen gemeinsamen Weg, gehen wir diesen Weg für unser
  Land, für Deutschland!'
