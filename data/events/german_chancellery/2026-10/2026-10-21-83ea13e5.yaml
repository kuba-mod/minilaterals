title: Bundeskanzler Merz gratuliert der Regierungschefin des Königreichs Marokko,
  Fatima Ezzahra el Mansouri
text: Sehr geehrte Frau Regierungschefin, zu Ihrer Ernennung zur Regierungschefin
  des Königreichs Marokko gratuliere ich Ihnen herzlich. Im Jahr des 70-jährigen Bestehens
  unserer diplomatischen Beziehungen freue ich mich darauf, gemeinsam mit Ihnen die
  freundschaftliche und vertrauensvolle Partnerschaft zwischen Deutschland und Marokko
  weiter zu vertiefen. Ich wünsche Ihnen für Ihr neues Amt alles Gute, viel Erfolg
  und eine glückliche Hand. Mit freundlichen Grüßen Friedrich Merz Bundeskanzler der
  Bundesrepublik Deutschland
