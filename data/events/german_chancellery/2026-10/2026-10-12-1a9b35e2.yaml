title: Bundeskanzler Merz telefoniert mit dem ukrainischen Staatspräsidenten Selenskyj
text: Bundeskanzler Friedrich Merz hat heute mit dem Präsidenten der Ukraine, Wolodymyr
  Selenskyj, telefoniert. Präsident Selenskyj informierte den Bundeskanzler über die
  massiven russischen Luftangriffe auf zivile Ziele und die ukrainische Energieinfrastruktur
  am vergangenen Wochenende. Der Bundeskanzler bekräftigte die Solidarität Deutschlands
  mit den Ukrainerinnen und Ukrainern. Der Präsident dankte dem Bundeskanzler für
  die deutsche militärische Unterstützung und Winterhilfe im Energiesektor. Der Bundeskanzler
  und der Präsident waren sich einig, dass es nun an Russland liege, einem Waffenstillstand
  für die gesamte Energieinfrastruktur zuzustimmen. Der Bundeskanzler und der Präsident
  tauschten sich über die Bemühungen um einen dauerhaften Frieden aus und vereinbarten,
  die enge Abstimmung mit europäischen und transatlantischen Partnern fortzusetzen.
