title: Herbstprojektion 2026 der Bundesregierung Deutsche Wirtschaft wächst wieder
text: 'Das Wachstum wird vor allem durch robuste Exporte und die staatlichen Investitionen
  in Verteidigung und Infrastruktur getragen. Foto: Bundesregierung / Marvin Ibo Güngör
  Bundeswirtschaftsministerin Katherina Reiche hat in Berlin die Herbstprojektion
  2026 der Bundesregierung vorgestellt. „Wir haben die Talsohle hinter uns gelassen,
  die deutsche Wirtschaft wächst wieder. Das ist ein wichtiges Signal, aber es ist
  nur der Anfang“, sagte sie. Die Bundesregierung hebt ihre Wachstumsprognose gegenüber
  der Frühjahrsprojektion deutlich an: Sie rechnet für dieses Jahr mit einem Anstieg
  des Bruttoinlandsprodukts (BIP) um 1,3 Prozent, das sind 0,8 Prozentpunkte mehr.
  Für 2027 erwartet sie ein Wachstum von 1,1, Prozent. Für 2028 erwartet sie ein Wachstum
  von 0,6 Prozent. Die deutsche Wirtschaft befindet sich auf Wachstumskurs und hat
  sich als widerstandsfähiger erwiesen als erwartet. Ungeachtet des Konflikts im Nahen
  Osten und der gestiegenen Energiepreise expandierte sie im ersten Halbjahr 2026
  kräftig. Das Wachstum wird vor allem durch robuste Exporte und die staatlichen Investitionen
  in Verteidigung und Infrastruktur getragen. Um die Wachstumspotenziale zu heben,
  seien vor allem private Investitionen notwendig, so Reiche. Der Bundeskanzler werde
  Investoren aus der ganzen Welt zum ersten Investitionsgipfel am 19. und 20. Oktober
  einladen, kündigte die Ministerin an. Deutschland habe große Potenziale: Kapital,
  Talente und Technologien. Die angestoßenen Reformen seien notwendig, um diese Potenziale
  und zu heben für ein sich selbst tragendes Wirtschaftswachstum. Daher müssten die
  angepackten Reformen in den nächsten Monaten umgesetzt werden, betonte Reiche. Die
  Bundesregierung hat einiges getan, um Verbraucherinnen und Verbraucher sowie Wirtschaft
  etwa bei den Energiepreisen zu entlasten. Doch aufgrund der gestiegenen Energie-
  und Verbraucherpreise in Folge des Konflikts im Nahen Osten dürften sich der private
  Konsum und die privaten Investitionen noch verhalten entwickeln. Eine nachhaltige
  Lösung der geopolitischen Krisen würde die wirtschaftliche Erholung insgesamt beschleunigen.
  Daher wird für dieses Jahr mit einer Verbraucherpreisrate von insgesamt 2,7 Prozent
  gerechnet und für 2027 mit drei Prozent, erst 2028 wieder mit 2,2 Prozent. Auf Grundlage
  der Frühjahrs- und Herbstprojektionen wird das Steueraufkommen geschätzt. Bund,
  Länder, Gemeinden und Sozialversicherungen orientieren sich bei der Aufstellung
  ihrer Haushalte an den prognostizierten gesamtwirtschaftlichen Eckwerten. Gleiches
  gilt für die Meldungen an die Europäische Union innerhalb des Stabilitäts- und Wachstumspaktes.
  Zusätzlich zu den beiden Projektionen veröffentlicht die Bundesregierung zu Beginn
  jeden Jahres die Jahresprojektion, den sogenannten Jahreswirtschaftsbericht.'
