title: Rede des Kanzlers beim Abendempfang mit Vertreterinnen und Vertretern der deutschen
  und koreanischen Wirtschaft Welt von morgen gemeinsam gestalten
text: '„Unser Verhältnis ist heute von einer beeindruckenden Vielfalt und Tiefe geprägt“,
  betonte der Kanzler in seiner Rede mit Blick auf die Beziehungen zwischen Deutschland
  und Südkorea. „Wir sind Partner, die gelernt haben, wie man durch Bildung, durch
  Mut, durch Fleiß und durch Innovation eine moderne, offene und auch eine wohlhabende
  Gesellschaft aufbauen kann“, so Bundeskanzler Friedrich Merz bei dem Abendempfang
  mit Vertreterinnen und Vertretern der deutschen und koreanischen Wirtschaft. Südkorea
  sei mit seiner leistungsstarken Wirtschaft und hohen technologischen Fähigkeiten
  ein wichtiger Wirtschaftspartner und Deutschlands drittwichtigster Handelspartner
  in Asien. Zudem sprach Bundeskanzler Merz über die Asien-Pazifik-Konferenz der Deutschen
  Wirtschaft am 30. Oktober, die „die ausgezeichneten Wirtschaftsbeziehungen weiter
  stärken, und das gilt ganz besonders für die Schlüsseltechnologien der Zukunft“.
  Denn es gehe nicht nur um den Handel: „Wir wollen gemeinsam Innovationen schaffen
  und vermarkten – von der Halbleiterindustrie über Quantencomputing bis hin zur industriellen
  KI “, erklärte der Bundeskanzler. Etwa 540 deutsche Unternehmen beschäftigen etwa
  100.000 Personen in Südkorea. Sehr geehrter Herr Präsident, lieber Lee Jae Myung,
  ich danke Ihnen herzlich für den außerordentlich freundlichen Empfang heute in Korea,
  in Ihrer Hauptstadt. Ich danke Ihnen persönlich, Herr Präsident, aber ich danke
  auch im Namen der mitgereisten Vertreterinnen und Vertreter der deutschen Wirtschaft.
  Unsere Begegnung und der Austausch mit Ihnen kommt zur rechten Zeit; denn wir stehen
  in Deutschland, in Europa und in der ganzen Welt – auch hier in Asien – vor großen
  Herausforderungen. In einer Welt, die immer stärker von Großmachtpolitik geprägt
  ist, braucht es ein dichtes Netz an Partnerschaften und an Ländern, die eng zusammenarbeiten.
  Denn nur so können wir unsere Freiheit, unsere Souveränität, unsere Sicherheit und
  unseren Wohlstand langfristig verteidigen. Korea ist einer unserer engsten Partner
  hier in der Region, denn uns verbindet viel. Wir sind wehrhafte Demokratien, die
  aktiv für eine internationale Ordnung eintreten, die sich nach Regeln unter Gleichen
  richtet. Und wir sind Nationen – Sie haben es angesprochen, Herr Präsident –, die
  die bittere Erfahrung der Teilung eint. Ich wünsche, dass wir eines Tages auch die
  Geschichte der Wiedervereinigung Koreas miteinander teilen können. Wir sind Partner,
  die gelernt haben, wie man durch Bildung, durch Mut, durch Fleiß und durch Innovation
  eine moderne, offene und auch eine wohlhabende Gesellschaft aufbauen kann. Unser
  Verhältnis ist heute von einer beeindruckenden Vielfalt und Tiefe geprägt. Deshalb
  ist es nur folgerichtig, dass wir unsere Zusammenarbeit nun auch offiziell als vertiefte
  strategische Partnerschaft bezeichnen. Damit geben wir einer bereits bestehenden
  sehr starken Verbindung den Namen, den sie verdient. Wie Sie gesehen haben, Herr
  Präsident, werde ich von einer großen deutschen Wirtschaftsdelegation begleitet.
  Die morgige Asien-Pazifik-Konferenz der Deutschen Wirtschaft, die hier traditionell
  stattfindet, wird die ausgezeichneten Wirtschaftsbeziehungen weiter stärken, und
  das gilt ganz besonders für die Schlüsseltechnologien der Zukunft. Denn wir wollen
  nicht nur Handel treiben. Wir wollen gemeinsam Innovationen schaffen und vermarkten –
  von der Halbleiterindustrie über Quantencomputing bis hin zur industriellen KI ,
  über die wir heute schon ausführlich gesprochen haben. Erst das ermöglicht es uns,
  die Welt von morgen gemeinsam zu gestalten. Unsere Partnerschaft lebt aber nicht
  nur von Technologie und Handel. Unsere Partnerschaft wird lebendig durch die Verbindung
  zwischen Gesellschaften und Menschen. Deshalb erinnern wir, so wie Sie es auch getan
  haben, in diesem Jahr an das 60. Jubiläum des Anwerbeabkommens, infolgedessen rund
  10.000 Krankenschwestern nach Deutschland gekommen sind. Sie folgten den fast 8000
  koreanischen Bergarbeitern und trugen damit zum wirtschaftlichen Erfolg unseres
  Landes bei. Sie legten auch den Grundstein für die reichen zwischenmenschlichen
  Beziehungen zwischen unseren Ländern. Und sie verkörpern bis heute, was unsere Partnerschaft
  stark macht, nämlich Kreativität, Neugier, Schaffenskraft, Fleiß und Ideen, wie
  wir gemeinsam die Zukunft gestalten können. Erlauben Sie mir, Herr Präsident, dass
  ich auf diese Partnerschaft das Glas erhebe – auf die Freundschaft zwischen Deutschland
  und Korea, auf unsere gute Zusammenarbeit und auch auf unsere gute persönliche Zusammenarbeit,
  die wir in diesen Tagen weiterentwickeln.'
