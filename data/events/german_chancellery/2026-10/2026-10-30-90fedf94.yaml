title: Besuch des Staatspräsidenten Litauens, Gitanas Nausėda, in Berlin
text: Bundeskanzler Friedrich Merz empfängt am Dienstag, dem 3. November 2026, um
  ca. 10.15 Uhr den litauischen Staatspräsidenten, Herrn Gitanas Nausėda, mit militärischen
  Ehren im Bundeskanzleramt. Im Mittelpunkt der Gespräche steht die EU-Ratspräsidentschaft,
  welche Litauen im ersten Halbjahr 2027 übernimmt. Zentrale europapolitische Themen
  sind der nächste Mehrjährige Finanzrahmen (MFR), die Umsetzung der Wettbewerbsfähigkeitsagenda
  und die EU-Erweiterung. Zudem tauscht sich der Bundeskanzler mit Staatspräsident
  Nausėda auch zu Fragen der Sicherheit und Verteidigung aus – ein Schwerpunkt des
  litauischen Ratsvorsitzes, den auch die Bundesregierung unterstützt.
