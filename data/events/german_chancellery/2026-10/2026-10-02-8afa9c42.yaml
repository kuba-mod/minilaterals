title: Im Bundestag beschlossen Mehr Sicherheit und Stabilität im Irak
text: 'Bundeswehrsoldaten unterstützen die NATO - Mission Iraq (NMI). Mehrere Bundeswehrsoldaten
  hören einem Vortrag zu. Bundeswehr/PAO NMI Die Bundesregierung hat beschlossen,
  den Einsatz der Bundeswehr im Irak bis zum 31. Januar 2027 fortzusetzen. Der Einsatz
  zielt darauf ab, die regulären irakischen Streit- und Sicherheitskräfte nachhaltig
  zu befähigen, die Sicherheit und Stabilität in Irak zu gewährleisten und ein Wiedererstarken
  des IS zu verhindern. Dazu wird die Bundeswehr die Streit- und Sicherheitskräfte
  ausbilden und beraten. Die irakische Regierung hatte um die Fortführung der Unterstützung
  durch Deutschland gebeten, da die Bedrohung durch den IS weiter andauert. Das aktuelle
  Bundestagsmandat Counter-Daesh/Capacity Building Iraq (CD/CB-I) läuft am 31. Januar
  2026 aus. Inhaltlich bleibt das Mandat unverändert. Weiterhin können bis zu 500
  Soldatinnen und Soldaten der Bundeswehr im Irak eingesetzt werden. Der Deutsche
  Bundestag hat dem Beschluss zugestimmt. Das Mandat CD/CB-I besteht aktuell aus zwei
  Säulen: Die Bundeswehr beteiligte sich seit 2015 am internationalen Anti- IS - und
  Stabilisierungseinsatz Operation Inherent Resolve ( OIR ). Durch OIR konnte sie
  in den vergangenen Jahren gemeinsam mit ihren internationalen Partnern wichtige
  Fortschritte im Kampf gegen die Terrororganisation des IS erreichen. Am 30. September
  2026 wurde der Einsatz der deutschen bewaffneten Streitkräfte im Irak beendet, weil
  die irakische Regierung ihre Zustimmung für den Einsatz entzogen hatte. Die Präsenz
  der Bundeswehr in Jordanien im Rahmen von OIR wird unvermindert fortgeführt. Weiterhin
  ist die Bundeswehr an der NATO Mission Iraq ( NMI ) beteiligt, die den Fähigkeitsaufbau
  der regulären irakischen Streit- und Sicherheitskräfte voranbringt. Die Mandatsverlängerung
  deckt beide Missionen ab.'
