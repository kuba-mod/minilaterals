title: 'Deutscher Kurzfilmpreis 2026: Die Nominierungen stehen fest'
text: 'Der Staatsminister für Kultur und Medien Wolfram Weimer hat heute die zwölf
  Nominierten für den Deutschen Kurzfilmpreis 2026 bekannt gegeben. Vorgeschlagen
  wurden die Nominierungen von unabhängigen Fachjurys aus 239 Einreichungen. Die diesjährige
  Verleihung des Deutschen Kurzfilmpreises findet am 16. November 2026 in Hamburg
  statt. Dazu Staatsminister Weimer: „Kurzfilme erzählen große Geschichten auf kleinstem
  Raum. Sie sind Ausdruck von Experimentierfreude und Kreativität, berühren das Publikum
  und sorgen für Momente, die in Erinnerung bleiben. Die diesjährigen Nominierten
  zeigen eindrucksvoll, wie viel künstlerische Kraft und Vielfalt in dieser Kunstform
  steckt. Ich gratuliere allen Nominierten und freue mich, ihre Arbeiten beim Deutschen
  Kurzfilmpreis zu würdigen.“ Mit dem Deutschen Kurzfilmpreis werden durch die Bundesregierung
  jedes Jahr herausragende Leistungen bei der Produktion von Kurzfilmen ausgezeichnet.
  Der Preis ist die höchstdotierte Auszeichnung im Bereich des Kurzfilms in Deutschland.
  Mit dem Gewinn des Kurzfilmpreises ist eine Prämie von 30.000 Euro und mit der Nominierung
  von 15.000 Euro verbunden. Die Prämie für den besten mittellangen Film beträgt 20.000
  Euro. Die Nominierungsprämie wird im Falle der Auszeichnung auf die Prämie für den
  Deutschen Kurzfilmpreis angerechnet. Die Prämien sind jeweils für die Herstellung
  oder Entwicklung eines neuen Films mit künstlerischem Rang zu verwenden. Der Deutsche
  Kurzfilmpreis wird in mehreren Kategorien vergeben. In der Jury für den Bereich
  Spielfilm sind in diesem Jahr Leon Döhner, Borjana Gaković, Anne Gaschütz, Nadine
  Mayer, Aliaksei Paluyan und Alexandre Powelz vertreten. Mitglieder der Jury für
  die Kategorien Animations-, Experimental- und Dokumentarfilm sowie für den besten
  mittellangen Film sind Vera Brückner, Anna Grabo, Victor Orozco Ramirez, Jonatan
  Schwenk, Sophie Watzlawick und Peter Zorn. Nominiert für den Deutschen Kurzfilmpreis
  2026 sind: In der Kategorie Spielfilm bis 15 Minuten Laufzeit „INFLATABLE BEAR,
  HOURLY“ Herstellung: Kirill Krasovski, Elisabeth Werchosin, Roman Blatman Federführung
  Produktion: Kirill Krasovski Regie: Elisabeth Werchosin Drehbuch: Elisabeth Werchosin
  Laufzeit: 12 Minuten „YOU JIAN CHUI YAN - A SOIL A CULTURE A RIVER A PEOPLE“ Herstellung:
  Viv Li, Julian Schwandner, Marc Goyens, Carlotta Cornehl Federführung Produktion:
  Viv Li, Julian Schwandner Regie: Viv Li Drehbuch: Viv Li Laufzeit: 14 Minuten In
  der Kategorie Spielfilm von mehr als 15 Minuten bis 30 Minuten Laufzeit „BAD LUCK“
  Herstellung: tanzbar_bremen e.V. (vertreten durch Corinna Mindt), Jan Eilhardt Federführung
  Produktion: Jan Eilhardt Regie: Jan Eilhardt Drehbuch: Jan Eilhardt Laufzeit: 18
  Minuten „BLEIFREI 95“ Herstellung: Hans Broich, Felix Leitner, Emma Hütt, Tina Muffler
  Federführung Produktion: Hans Broich Regie: Emma Hütt, Tina Muffler Drehbuch: Emma
  Hütt, Tina Muffler Laufzeit: 24 Minuten „HARIKA“ Herstellung: Hochschule Mainz Federführung
  Produktion: Sophie Beckmann, Beran Ergün Regie: Beran Ergün Drehbuch: Beran Ergün
  Laufzeit: 29 Minuten „SATURNIA“ Herstellung: Tatjana Moutchnik Federführung Produktion:
  Tatjana Moutchnik Regie: Tatjana Moutchnik Drehbuch: Geoffroy Grison, Tatjana Moutchnik
  Laufzeit: 20 Minuten In der Kategorie Animationsfilm bis 30 Minuten Laufzeit „LIQUOR“
  Herstellung: Filmuniversität Babelsberg KONRAD WOLF Federführung Produktion: Yi-Chen
  Huang Regie: Yi-Chen Huang Drehbuch: Yi-Chen Huang Laufzeit: 4 Minuten „UNIDENTIFIZIERTE
  UNFLUGOBJEKTE (UUO)“ Herstellung: Karsten Matern Federführung Produktion:  Karsten
  Matern Regie: Sasha Svirsky Drehbuch: Sasha Svirsky Laufzeit: 12 Minuten In der
  Kategorie Experimentalfilm bis 30 Minuten Laufzeit „CIEL CASSÉ“ Herstellung: Deutsche
  Film- und Fernsehakademie Berlin Federführung Produktion: Andreas Schmidt Regie:
  Jozefien Van der Aelst Drehbuch: Jozefien Van der Aelst Laufzeit: 22 Minuten „THIS
  SUFFOCATING NOW“ Herstellung: Vika Kirchenbauer Federführung Produktion: Vika Kirchenbauer
  Regie: Vika Kirchenbauer Drehbuch: Vika Kirchenbauer Laufzeit: 16 Minuten In der
  Kategorie Dokumentarfilm bis 30 Minuten Laufzeit „CATACOMBS“ Herstellung: Shehab
  Fatoum Federführung Produktion: Shehab Fatoum Regie: Shehab Fatoum Drehbuch: Shehab
  Fatoum Laufzeit: 29 Minuten „HOW DO YOU SPELL THIS WORD?“ Herstellung: Yulia Lokshina
  Federführung Produktion: Yulia Lokshina Regie: Yulia Lokshina Drehbuch: Yulia Lokshina
  Laufzeit: 26 Minuten Die Auszeichnung für den besten mittellangen Film von mehr
  als 30 Minuten bis 78 Minuten Laufzeit erhält der Film „NO MOTHER TONGUE FOR EVERYONE“
  der Kunsthochschule für Medien Köln (Herstellung) von Jinhyun Kim (Regie, Federführung
  Produktion, Drehbuch). Weitere Nominierungen sind für diese Kategorie nicht vorgesehen.'
