title: Pressekonferenz von Bundeskanzler Merz und dem ukrainischen Präsidenten Selenskyj
  „Werden alles tun, um der Ukraine zu helfen“
text: 'In der gemeinsamen Pressekonferenz sicherte Bundeskanzler Merz der Ukraine
  zu, weiterhin an ihrer Seite zu stehen. „Wir werden alles tun, um der Ukraine zu
  helfen, bis dieser schreckliche Krieg endlich zu Ende ist“, betonte Bundeskanzler
  Friedrich Merz in seinem gemeinsamen Pressestatement mit Präsident Wolodymyr Selenskyj
  in Kyjiw . Mit seinem Besuch wolle er ein Zeichen setzen, so Merz, „in einer Zeit,
  die nicht nur für die Zukunft der Ukraine entscheidend ist, sondern für die Zukunft
  Europas“. „Wir stehen an eurer Seite für eine freie Ukraine und für ein sicheres
  und friedliches Europa, in dem wir unsere Zukunft gemeinsam sehen“, so Merz. Zudem
  wolle man die Zusammenarbeit, unter anderem in der Verteidigungsindustrie, zwischen
  Deutschland und der Ukraine vertiefen. Deshalb begleite den Kanzler eine Wirtschaftsdelegation.
  Die enge Zusammenarbeit nutze beiden Seiten. „Deutschland hilft der Ukraine. Die
  Ukraine hilft aber auch Deutschland“, sagte der Kanzler. (Die Protokollierung erfolgte
  anhand einer vom Fernsehsender Phoenix ausgestrahlten Aufzeichnung der Pressekonferenz.
  Eine offizielle Dolmetschung der fremdsprachlichen Teile lag nicht vor.) Sehr geehrter
  Herr Präsident, lieber Wolodymyr, herzlichen Dank für das sehr freundliche Willkommen
  heute Morgen in Kyjiw ! Wir erleben eine weitere Eskalation des russischen Angriffskrieges
  gegen die Ukraine. Ich bin heute trotz der Drohungen, die uns in den letzten Tagen
  aus Moskau erreicht haben, gekommen, und zwar mit einer Kollegin aus dem Kabinett,
  der Bundeswirtschaftsministerin Katherina Reiche, mit einer großen Delegation meiner
  Regierung, aber auch mit einer großen Wirtschaftsdelegation. Das zeigt: Wir lassen
  uns nicht einschüchtern. Wir lassen uns auch durch einen Drohnenangriff zum Zeitpunkt
  unseres Besuches nicht einschüchtern. Das zeigt aber auch, wie rücksichtslos Russland
  weiterhin gegen die Ukraine vorgehen zu müssen meint. Wir stehen vor einem möglicherweise
  sehr schweren Winter. Moskau beschießt nicht nur die Stadt und andere Großstädte,
  sondern gezielt Infrastruktur für die Energieversorgung: Heizkraftwerke, Umspannwerke,
  Tankstellen und die Bahninfrastruktur. Das Ziel ist es ganz offensichtlich, die
  Moral der Ukrainerinnen und Ukrainer zu brechen. Aber wenn ich heute an einem eigentlich
  friedlichen Sonntagmorgen in Kyjiw bin, dann erlebe ich etwas ganz anderes. Trotz
  des Angriffs, der heute Morgen stattgefunden hat, treffe ich hier auf ein entschlossenes
  Volk und auf eine entschlossene Regierung. Ich möchte den Ukrainerinnen und Ukrainern
  genauso wie der Regierung sagen: Die deutsche Bevölkerung steht hinter der Ukraine,
  und die deutsche Regierung steht hinter der ukrainischen Regierung. Wir werden alles
  tun, um der Ukraine zu helfen, bis dieser schreckliche Krieg endlich zu Ende ist.
  Die russische Wirtschaft wird diesen Krieg nicht mehr unbegrenzt lange durchhalten.
  Denn dieses Land ist mittlerweile unterhalb der Schmerzgrenze dessen angekommen,
  was es wirtschaftlich verkraften kann: kein Wachstum mehr, sieben Prozent Inflation,
  14 Prozent Zinsen, sinkende Einnahmen aus den Öl- und Gasverkäufen und ein immer
  größer werdendes Staatsdefizit. Meine Damen und Herren, ich will deswegen mit meinem
  Besuch heute noch einmal ein Zeichen setzen, in einer Zeit, die nicht nur für die
  Zukunft der Ukraine entscheidend ist, sondern für die Zukunft Europas. Die Ukraine
  will Frieden; Deutschland will Frieden; ganz Europa will Frieden. Dieser Friede
  muss verhandelt werden. Er darf nicht diktiert werden. Er darf nicht der Ukraine
  diktiert werden und er darf auch nicht Europa diktiert werden. Wir, Deutschland,
  sind heute der stärkste Unterstützer der Ukraine. Wir tun das nicht nur, um die
  territoriale Integrität der Ukraine zu schützen. Wir tun das zutiefst im eigenen
  Interesse. Denn es geht um Europas Sicherheit, und es geht um den Fortbestand einer
  politischen Ordnung, die wir uns in Europa zunächst nach dem Zweiten Weltkrieg,
  aber nach der Überwindung der europäischen Teilung dann auch gemeinsam gegeben haben,
  gemeinsam übrigens auch mit der damaligen Sowjetunion, die sich verpflichtet hat,
  jeden Konflikt nur friedlich zu lösen und auf der Basis einer regelbasierten Ordnung
  in Europa zusammenzuleben. Ich will deswegen Russland noch einmal auffordern, jetzt
  in Gespräche und auch in Friedensverhandlungen einzutreten. Wir als Deutsche tragen
  in diesem Prozess eine besondere Verantwortung. Vielen Dank, lieber Wolodymyr, dass
  du auf meine Rede in Münster noch einmal Bezug genommen hast. Ich habe diese Rede
  aus Anlass der Verleihung des Preises des Westfälischen Friedens an die NATO gehalten.
  Ich habe in dieser Rede gesagt: Wanken wir in Deutschland, wankt Europa. Wankt Europa,
  wankt die Ukraine. Deshalb bleiben wir fest. Denn wenn wir festbleiben, dann bleibt
  Europa fest, und bleibt Europa fest, bleibt auch die Ukraine fest. – Lieber Wolodymyr,
  noch einmal: Ihr könnt euch auf uns verlassen. Die Bundesregierung wird Kurs halten,
  und auch ich persönlich werde Kurs halten. Mit euch, mit den europäischen Partnern
  und mit den Vereinigten Staaten arbeiten wir hartnäckig für Friedensverhandlungen
  mit Russland. Wir bauen unsere Hilfen für die Ukraine aber auch weiter aus. Wir
  lassen uns durch Moskaus hybride Angriffe auch in Deutschland, die wir tagtäglich
  erleben, nicht beeindrucken. Wir stärken die Abschreckungsfähigkeit der NATO . Das
  alles tun wir gemeinsam, und wir tun es mit Selbstbewusstsein und Zuversicht. Denn
  unser Kompass stimmt. Wenn wir diesem Kompass gemeinsam folgen, dann werden wir
  Frieden für die Ukraine und Sicherheit für ganz Europa erreichen. Du hast es angesprochen;
  ich bringe heute sehr konkrete weitere Hilfen mit. Wir bringen ein weiteres Paket
  militärischer Unterstützung über rund eine Milliarde Euro auf den Weg. Wir stellen
  Mittel für die gemeinsame Herstellung von Antijetdrohnen zur Verfügung. Dabei sind
  in den letzten Wochen bereits erhebliche technische Durchbrüche möglich gewesen.
  Sie bringen nun auch Tempo in die Produktion. Das stärkt die ukrainische Luftverteidigung
  schnell und spürbar. Diese Stärkung ist dringend notwendig. Wir liefern Abstandswaffen,
  Kampfdrohnen und Satellitentechnik, damit die Ukraine russische Abschussrampen ebenfalls
  bekämpfen kann. Wir stellen vor dem Winter Energiehilfen in Höhe von rund 350 Millionen
  Euro für Generatoren, für Umstand, für Umspannanlagen und für notwendige Reparaturarbeit
  bereit. Das alles wird helfen, die russischen Angriffe auf die ukrainische Energieinfrastruktur
  abzumildern und den Menschen in der Ukraine vor allem durch den bevorstehenden Winter
  zu helfen. Wir wollen schließlich im Winter mit Frankreich und Großbritannien ein
  Treffen der Koalition der Willigen in Berlin ausrichten, auch um weitere Hilfen
  zu koordinieren. Ich habe es bereits zu Beginn gesagt: Erstmals seit Beginn des
  Krieges begleitet mich heute eine hochrangige Wirtschaftsdelegation aus Deutschland.
  Unternehmer aus der Verteidigungsindustrie und aus der Energiewirtschaft sind mitgekommen.
  Sie wollen ihren Beitrag zur Verteidigung, aber auch ihren Beitrag zum Wiederaufbau
  des Landes leisten. Wir haben heute auch über die europäische Perspektive der Ukraine
  gesprochen. Wir werden gleich noch einmal vertieft über meinen Vorschlag einer assoziierten
  Mitgliedschaft der Ukraine sprechen. Wir wollen den Beitritt der Ukraine zur Europäischen
  Union beschleunigen. Wir wollen Tempo. Dafür arbeiten wir in Brüssel. Nun wissen
  wir, dass die Ukraine selbst auch an Reformen im Land arbeitet, Reformen für Rechtsstaatlichkeit
  und Korruptionsbekämpfung. Ich begrüße sehr, dass der Präsident uns dies auch noch
  einmal zugesagt hat; denn diese Reformen sind wichtig für die Auszahlung weiterer
  Finanzhilfen. Regierung und Parlament tragen hier eine gemeinsame, besondere Verantwortung.
  Meine Damen und Herren, all das zeigt, wie eng unsere Zusammenarbeit ist. Sie ist
  zum Nutzen beider Seiten. Deutschland hilft der Ukraine. Die Ukraine hilft aber
  auch Deutschland. Die Unternehmer aus der Verteidigungsindustrie, die mich heute
  begleiten, lernen aus der ukrainischen Kriegserfahrung, und umgekehrt stellen deutsche
  und ukrainische Firmen hochinnovative Joint Ventures auf die Beine. Wir werden auch
  bei der Drohnenabwehr noch stärker von der ukrainischen Expertise profitieren. Dazu
  haben wir eine Vereinbarung unterzeichnet. Wie notwendig Drohnenabwehr auch für
  unser Land ist, wissen wir spätestens seit dem 4. August, seit dem Anschlag mit
  einer russischen Drohne, die mit Sprengstoff beladen war, auf den Flughafen in Leipzig.
  Meine Damen und Herren, dies ist mein zweiter Besuch in Kyjiw als Bundeskanzler,
  mein vierter insgesamt. Lieber Wolodymyr, ich will es dir noch einmal sagen: Herzlichen
  Dank für die sehr gute, für die sehr partnerschaftliche Zusammenarbeit. Wir stehen
  an eurer Seite für eine freie Ukraine und für ein sicheres und friedliches Europa,
  in dem wir unsere Zukunft gemeinsam sehen. Frage : Herr Bundeskanzler, glauben Sie,
  dass die Warnung aus Moskau von gestern und der heutige Drohnenangriff direkt mit
  Ihrem Besuch zusammenhängt, und fühlen Sie sich dadurch auch persönlich bedroht?
  Können Sie bei den deutschen Hilfen auch noch einmal etwas konkreter werden? Welche
  Waffen, also zum Beispiel Anti- Jet -Drohnen, und wie viele Waffen genau werden
  mit deutschem Geld finanziert, und wann werden sie ausgeliefert? Herr Präsident
  Selenskyj, der deutsche Außenminister hat sich vor einer Woche mit dem russischen
  Außenminister getroffen. Halten Sie ein solches Treffen zum jetzigen Zeitpunkt für
  sinnvoll? Bundeskanzler Merz : Herr Fischer, vielen Dank für die beiden Fragen.
  Ich weiß nicht, ob diese Drohung auf meinen Besuch bezogen war, und wenn sie es
  ist, dann lasse ich mich davon auch nicht beeindrucken. Sie sehen, dass ich hier
  bin, und ich unternehme die Reisen, die ich für richtig halte, unabhängig davon,
  ob andere sie verhindern wollen. Insofern ist mir das, offen gestanden, auch relativ
  gleichgültig. Was die Einzelheiten der militärischen Unterstützung betrifft, so
  bitte ich um Verständnis dafür, dass wir das nicht im Detail öffentlich machen wollen.
  Ich habe Ihnen eben in etwa die Summe genannt, die wir zur Verfügung stellen. Aber
  es ist kein Geheimnis, dass es hierbei insbesondere um zwei wesentliche Fähigkeiten
  der ukrainischen Armee geht, um sich zu verteidigen. Das eine ist die Luftverteidigung,
  bei der die ukrainische Armee auf weitere Lieferungen angewiesen ist, und das Zweite
  ist die gesamte Kommunikation, insbesondere die Kommunikation aus dem Weltraum.
  Auch hier versuchen wir, zu helfen und der ukrainischen Armee auch zu ermöglichen,
  sämtliche Daten zu erfassen und zu erhalten, die sie braucht, um eine erfolgreiche
  Verteidigung auch zu ermöglichen. Das sind die beiden wesentlichen Aspekte, von
  denen wir uns leiten lassen. Es gibt eine ganze Reihe von weiteren Details, aber
  die sind mit der Regierung besprochen, und die besprechen auch die Fachleute. ...
  ( ohne Mikrofon, akustisch unverständlich ) Die Frage war, ob ein solches Treffen
  zum jetzigen Zeitpunkt sinnvoll ist. Bundeskanzler Merz : Vielen Dank für Ihre Frage.
  Wir sehen ja die täglichen Luftraumverletzungen, die täglichen, wie wir es sagen,
  hybriden Angriffe auf unsere Infrastruktur. Der schwerste, den wir bisher gesehen
  haben, war der versuchte Anschlag auf den Leipziger Flughafen am 4. August, den
  ich eben zitiert habe, der nur durch mehrere glückliche Zufälle nicht zu einem verheerenden
  Anschlag auf zwei Flugzeuge, möglicherweise auch mit menschlichen Opfern, geworden
  ist. Wir haben das klar zugeordnet. Wir haben Konsequenzen gezogen. Wir haben das
  russische Konsulat in Bonn geschlossen. Wir haben das Russische Haus in Berlin geschlossen.
  Es hat mittlerweile eine höhere zweistellige Zahl von russischen Staatsbürgern die
  Bundesrepublik Deutschland verlassen müssen. Wir kontrollieren die Einreise von
  russischen Staatsbürgern in die Bundesrepublik Deutschland sehr viel strenger. Wir
  haben eine ganze Reihe von weiteren Maßnahmen gegen Russland ergriffen. Wir stimmen
  uns in allem, was wir tun, mit den europäischen Partnern ab. Das haben auch alle
  europäischen Partner vorher von uns erfahren. Die NATO ist informiert worden, die
  Europäische Kommission ist informiert worden. Das alles ist auf große Zustimmung
  in der NATO , in der Europäischen Union und bei unseren Nachbarn gestoßen. Das Gleiche
  gilt bei entsprechenden hybriden Angriffen auf andere Länder in der Europäischen
  Union. Wir handeln hier sehr konsequent zusammen und ergreifen immer die gleichen
  Maßnahmen. Insofern kann ich Ihre Frage nicht bestätigen. Wir warten nicht, sondern
  wir handeln. Russland muss wissen, dass wir auch gegen jede weitere Eskalation Schritte
  ergreifen werden, um uns zu verteidigen. Das gilt für die Schattenflotte in der
  Ostsee, in der Nordsee. Das gilt für Flüge, die in die Lufträume eindringen. Das
  gilt für Drohnenangriffe. Wir verteidigen uns. Wir werden keinen Zweifel daran lassen,
  dass wir das auch in Zukunft tun. Wir ordnen das auch zu, sodass die Öffentlichkeit
  in unseren Ländern weiß, woher die Bedrohungen unserer Freiheit und unserer Sicherheit
  kommen. Vielen Dank. Herr Bundeskanzler, wie gelingt es Ihnen, die ukrainischen
  Gesprächspartner davon zu überzeugen, dass die Hilfe der Bundesregierung noch lange
  anhalten wird, sie also von der Stabilität der Bundesregierung zu überzeugen? Bundeskanzler
  Merz : Frau Zimmermann, ich kann das auch aus diesem Gespräch erneut bestätigen.
  Es gibt sowohl in der Europäischen Union als auch bei vielen Partnerländern außerhalb
  der Europäischen Union schon einige Fragen im Hinblick auf die Stabilität der deutschen
  Regierung. Vielleicht ist manch einem auch im Inland nicht hinreichend klar, was
  es bedeuten würde, wenn die deutsche Bundesregierung den Aufgaben, denen sie gestellt
  ist, nicht gewachsen wäre. Das hätte unermessliche Folgen für ganz Europa. Insofern
  werde ich alles tun, um die Regierung in Deutschland weiter stabil zu führen. Das
  gilt für die Außenpolitik, das gilt für die Europapolitik, das gilt für die Innenpolitik,
  das gilt für die Wirtschaftspolitik. Wie eng das alles miteinander zusammenhängt,
  das sehen Sie genau an einem solchen Tag wie heute. Wir sprechen über europäische
  Stabilität in diesem Teil Europas, wir sprechen über Sicherheitspolitik für ganz
  Europa, und wir sprechen über wirtschaftliche Zusammenarbeit zwischen der Ukraine
  und Deutschland. Hier zeigt sich einmal mehr, dass Sie Außenpolitik, Außenwirtschaftspolitik
  und Wirtschaftspolitik nicht voneinander trennen können. Auch wenn das der eine
  oder andere gerne hätte; aber das lässt sich nicht voneinander trennen. Deswegen
  gehört das für mich untrennbar so zusammen, dass ich auch an einem Tag wie heute
  den Besuch in Kyjiw mache, den ich seit langer Zeit geplant habe und der natürlich
  auch stattfindet, trotz der Drohungen von außen und der Turbulenzen im Inneren.
  Bundeskanzler Merz : Vielen Dank. Ja, ich habe bis jetzt seit meinem Eintreffen
  heute Morgen hier dreimal einen Luftalarm gehört. Wir sind hier aber von der deutschen
  Botschaft und von der ukrainischen Regierung eng und verlässlich begleitet worden,
  auch im Hinblick auf die tatsächliche Gefährdungslage. Wir mussten bis jetzt keinmal
  einen Bunker aufsuchen. Ich verlasse mich darauf, dass das sehr gute System, das
  hier in der Ukraine etabliert worden ist und das auch die Botschaft der Bundesrepublik
  Deutschland nutzt, so zuverlässig ist, dass es keine Gefährdung für die Mitglieder
  meiner Delegation und auch für mich persönlich gibt. Die Frage, wann wir liefern
  können, muss die Industrie bearbeiten und beantworten. Aber wir drängen darauf,
  dass im Hinblick auf die technischen Möglichkeiten alles möglich gemacht wird, um
  so schnell wie möglich die Anschlusslieferungen vorzunehmen. Wir wissen, dass das
  sehr dringlich ist, denn die Luftabwehr ist zurzeit nicht so gut, wie sie sein sollte.
  Das ist allgemeines öffentliches Wissen. Aber wir sind dabei, diese Lücke zu schließen.
  Herr Bundeskanzler, Sie haben schon darüber gesprochen, dass die Bevölkerung in
  Deutschland hinter der Ukraine steht. Aber wenn wir uns den öffentlichen Diskurs
  angucken, wenn wir uns die Umfragen ansehen, dann sehen wir, dass die Kritik an
  der finanziellen Unterstützung der Ukraine zunimmt. Wie erklären Sie sich das, und
  wie kann sich das aufhalten lassen? Bundeskanzler Merz : Ich sehe diese Umfragen,
  ich höre diese Meinungen. Ich nehme sie ernst, auch wenn ich sie nicht teile. Ich
  werde mich darum bemühen, auch in einer Regierungserklärung in der übernächsten
  Woche vor dem Europäischen Rat, der am 15. und 16. Oktober in Brüssel stattfindet,
  noch einmal ausführlich zu begründen, warum die Hilfe für die Ukraine gerade in
  diesem Jahr und vor diesem Winter auch in unserem zutiefst eigenen nationalen Interesse
  liegt. Ich habe eben schon die Angriffe genannt, die Russland mittlerweile auch
  gegen Deutschland vornimmt. Das ist ja nicht nur dieser Angriff, den wir am 4. August
  gesehen haben, sondern das sind tägliche Angriffe auf unsere Rechenzentren, auf
  unsere Datennetze. Das alles hört nicht auf, wenn wir der Ukraine nicht mehr helfen
  – im Gegenteil, es wird danach nur noch mehr. Deswegen müssen wir das gut begründen,
  vielleicht müssen wir es sogar besser begründen, ausführlicher begründen, auch innenpolitisch
  begründen. Aber das Wichtigste für mich ist der Erhalt einer politischen Ordnung
  in Europa, die wir nach 1990 miteinander verabredet haben und die jetzt über 30 Jahre
  erfolgreich Bestand gehabt hat. Wir hatten gestern die Gelegenheit, in Bremen zum
  36. Mal den Tag der Deutschen Einheit zu feiern. Ich erlaube mir, auf die Rede des
  Bundespräsidenten Bezug zu nehmen, der in einer für mich eindrucksvollen Weise beschrieben
  hat, wie wichtig es ist, dass wir uns eben nicht allein auf die innenpolitischen
  Themen konzentrieren, sondern wir gemeinsam darum bemüht sind, eben diese politische
  Freiheitsordnung und Friedensordnung in ganz Europa zu erhalten. Diese Ordnung wird
  bedroht, und zwar nicht nur in der Ukraine, sondern sie wird in ganz Europa bedroht,
  nicht zuletzt mit systematischer Falschinformation der Bevölkerung, mit russischen
  Netzwerken, mit russischen Bots, mit Helfern in Deutschland, die sich das zu eigen
  machen. Das ist der politische Meinungskampf, den wir in Deutschland austragen müssen.
  Sie sehen mich heute entschlossener denn je, diesen Streit auch auszutragen. Denn
  es geht hier um nicht mehr und nicht weniger als um die friedliche und freiheitliche
  Zukunft unseres Landes in den nächsten Jahren, vielleicht Jahrzehnten.'
