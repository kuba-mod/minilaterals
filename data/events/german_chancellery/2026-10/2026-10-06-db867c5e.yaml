title: 'Staatsminister Weimer eröffnet 78. Frankfurter Buchmesse und kündigt neue
  Auszeichnung „Literarisches Wort des Jahres“ an – Staatsminister Weimer: „Wir feiern
  die einzigartige Kraft der Sprache“'
text: 'Kulturstaatsminister Wolfram Weimer eröffnet heute im Namen der Bundesregierung
  die 78. Frankfurter Buchmesse. Vor der Eröffnung hat er die neue Auszeichnung „Literarisches
  Wort des Jahres“ angekündigt. Ehrengast auf der Frankfurter Buchmesse ist in diesem
  Jahr Tschechien. Unter dem Motto „Ein Land an der Küste“ präsentiert sich das Land
  als Sehnsuchtsort für literarische Entdeckungen. Im Ehrengast-Pavillon findet ein
  umfangreiches Programm mit Lesungen und Gesprächen statt, zudem sind 75 tschechische
  Autorinnen und Autoren vor Ort. Staatsminister Weimer sagte im Vorfeld: „Deutschland
  und Tschechien verbindet eine wechselvolle literarische Freundschaft. Umso mehr
  freue ich mich, dass wir dieses Jahr im Ehrengast-Pavillon die Chance haben, in
  die facettenreiche Welt der tschechischen Literaturszene einzutauchen – geprägt
  von poetischer Sprache, Ironie und Gesellschaftskritik. Literatur schafft Räume
  für Begegnung und Verständigung. Hier, auf der Frankfurter Buchmesse, kommt die
  Welt zusammen, um die einzigartige Kraft und Schönheit des Wortes zu feiern und
  Menschen und Geschichten aus aller Welt zu verbinden.“ Zur Eröffnung der Buchmesse
  kündigte er eine neue Auszeichnung in Zusammenarbeit mit der Grimmelshausen Gesellschaft
  an, die das „Literarische Wort des Jahres“ prämieren soll. Staatsminister Weimer
  vorab: „Ist es nicht an der Zeit, die einzigartigen Möglichkeiten der Sprache und
  Literatur zu feiern und dem Unwort des Jahres sein positives Pendant gegenüberzustellen?
  Gemeinsam mit einer Jury, die neben älterer Literatur auch Neuerscheinungen auf
  Sprachschöpfungen durchsucht, möchte ich das „Literarische Wort des Jahres“ küren
  – ein Wort, das die Kraft der Veränderung in sich trägt. Ich bin zuversichtlich,
  dass es gemeinsam mit der Grimmelshausen-Gesellschaft und weiteren Partnern gelingen
  wird im kommenden Jahr das erste „Literarische Wort des Jahres“ zu küren.“ Die Frankfurter
  Buchmesse findet vom 7. bis zum 11. Oktober 2026 statt. Sie ist das wichtigste Jahrestreffen
  der internationalen Buchbranche und zugleich Handelsplatz, Lesefestival und Debattenforum.
  Mit zahlreichen Veranstaltungen bietet sie eine Plattform für intensive Diskussionen
  zu dringlichen Fragen rund um die Folgen technologischer Entwicklungen, Demokratie,
  Meinungsfreiheit und weltweiten Konflikten. Auch in diesem Jahr sind zahlreiche
  Autorinnen und Autoren sowie Partnerinnen und Partner aus der ukrainischen Buch-
  und Verlagsbranche auf der Buchmesse vertreten. Der ukrainische Länderstand wird
  erneut mit Mitteln aus dem Etat des Beauftragten der Bundesregierung für Kultur
  und Medien unterstützt.'
