title: Statement des Kanzlers beim Leibniz-Institut für innovative Mikroelektronik
  Innovative und exzellente Forschungslandschaft
text: 'Bei dem Besuch des Leibniz-Institut für innovative Mikroelektronik (IHP) informierte
  sich der Kanzler über die neusten Entwicklungen in der Chip-Forschung. Beim Besuch
  des Leibniz-Instituts für innovative Mikroelektronik (IHP) in Frankfurt/Oder hat
  Bundeskanzler Friedrich Merz den Mitarbeiterinnen und Mitarbeitern für ihre herausragende
  Arbeit gedankt: „Hier wird europäische Zukunft gemacht und hier wird Zukunft für
  unser Land gestaltet.“ Zuvor hatte er sich mit dem Präsidenten der Leibniz-Gemeinschaft,
  Prof. Schmidt, und dem Geschäftsführer des IHP , Prof. Kahmen, über die Arbeit der
  Forschungsgemeinschaft ausgetauscht. Bei einem Rundgang durch die Labore informierte
  sich der Kanzler zudem über die aktuelle Chip-Forschung und praktische Anwendungsbeispiele.
  Er betonte dabei: „Dies ist nicht abgehobene Forschung, die sich sozusagen um sich
  selbst dreht, sondern es ist sehr konkrete, anwendungsorientierte Forschung.“ Merz
  zeigte sich dankbar, dass es „gerade hier in Ostdeutschland endlich auch einen solchen
  Hightech leuchtturm mit einer jahrzehntelangen Geschichte“ gebe. Das Leibniz-Institut
  für innovative Mikroelektronik (IHP) ist das weltweit führende Kompetenzzentrum
  für Silizium-Germanium-Technologie. Als Übergang zwischen der Grundlagenforschung
  und anwendungsnahen Applikationen liefert das Institut wichtige Beiträge für die
  Innovationskraft und Innovationsfähigkeit des Standortes Deutschland und Europas.
  Herr Professor Kahmen, Herr Professor Schmidt, meine Damen und Herren, ich will
  zunächst herzlich Danke sagen, dass ich die Gelegenheit habe, heute Morgen hier
  am IHP in Frankfurt an der Oder zu sein. Das geht auf eine Einladung zurück, die
  Herr Schmidt im Februar ausgesprochen hat und die ich auch sofort angenommen habe;
  denn im Rahmen meiner Antrittsbesuche in den 16 Bundesländern, die ich im letzten
  Jahr gemacht habe, habe ich bereits einen wirklich beeindruckenden Einblick in die
  innovative und die exzellente Forschungslandschaft in Deutschland bekommen dürfen.
  Ich bin froh, dass ich heute hier in Frankfurt eine der 96 Einrichtungen aus der
  Leibniz-Gemeinschaft kennenlernen darf. Ich hatte einen guten Austausch mit dem
  Präsidenten der Leibniz-Gemeinschaft, mit Professor Schmidt. Wir haben darüber gesprochen,
  wo und wie wir Forschung in Deutschland so unterstützen können, dass sie die maximalen
  Potenziale für unser Land und auch für die gesamte Europäische Union entfalten kann.
  Denn aus innovativer Forschung entstehen genau die Lebensverbesserungen, die wir
  brauchen, die innovativen Geschäftsideen, die unser Land als Ganzes voranbringen.
  Ich will ausdrücklich noch einmal unterstreichen: Dies ist nicht abgehobene Forschung,
  die sich sozusagen um sich selbst dreht, sondern es ist sehr konkrete, anwendungsorientierte
  Forschung. Die Leibniz-Gemeinschaft ist ja von allen Forschungsgemeinschaften, die
  wir in Deutschland haben, diejenige, die am breitesten aufgestellt ist, nämlich
  von der Forschung bis hin zur Anwendung in der Industrie. Ich konnte mich heute
  Morgen von dieser anwendungsorientierten Forschung der Leibniz-Gemeinschaft über
  alle wissenschaftlichen Disziplinen hinweg in wirklich sehr eindrucksvoller Weise
  überzeugen. Ich habe dabei auch erfahren, wie das IHP hier wirklich sehr konkrete
  Produkte entwickelt, die uns alle im Alltag umgeben. Hier wird deutlich, wie Wissenschaft
  und Wirtschaft ineinandergreifen und voneinander profitieren. Wir sehen hier Weltspitzenarbeit,
  gerade im Hightechbereich. Danke, dass Sie beide auch noch einmal die Hightech -Agenda
  der Bundesrepublik angesprochen haben. Mikroelektronik ist ein ganz wesentlicher
  Bestandteil dieser Hightech -Agenda, und wir sehen hier die Chip entwicklung und
  ‑produktion. Unsere Forschung ist international spitze, wir können mithalten. Ich
  bin sehr dankbar, dass wir gerade hier in Ostdeutschland auch einen solchen Hightechleuchtturm
  mit einer jahrzehntelangen Geschichte haben, die auch noch in die Zeit der DDR zurückreicht.
  Wir fördern dieses Potenzial sehr gezielt, indem wir im Schulterschluss mit den
  Ländern Grundlagenforschung und anwendungsorientierte Forschung eine langfristige
  und planbare Perspektive geben. Ich sage es noch einmal mit großem Nachdruck: In
  der Vernetzung der Forschungseinrichtungen mit den Hochschulen, der Wirtschaft und
  der Gesellschaft liegt eine unschätzbare Kraft für unsere Gesellschaft. Daraus entstehen
  innovative Produkte, daraus entstehen neue Branchen, und diese Zusammenarbeit bringt
  hochqualifizierte Arbeitskräfte aus der ganzen Welt zusammen. Sie stärken unsere
  Sicherheit, und ich bin sehr dankbar, dass der Begriff der Souveränität auch in
  Ihrer Arbeit Einzug gefunden hat. Sie wissen vermutlich, dass ich etwas gezögert
  habe, diesen Begriff zu verwenden, aber mittlerweile tue ich es aus tiefer innerer
  Überzeugung. Wir sind in Europa in der Lage, wissenschaftlich souverän zu werden.
  Auf diesem Weg sind wir, und das zeigt die Mikroelektronik hier am IHP . Ich will
  mich bei all denjenigen, die hier arbeiten, bedanken. Das ist eine beeindruckende
  Mannschaft, die hier 24 Stunden, sieben Tage die Woche am Institut arbeitet. Ich
  bedanke mich noch einmal bei Ihnen beiden, Herr Schmidt und Herr Kahmen, für die
  wirklich große Gastfreundschaft hier und auch dafür, wie Sie mich neugierig gemacht
  haben. Vielleicht haben Sie auch ein bisschen den Eindruck von mir gewonnen – und
  wenn Sie ihn gewonnen haben, ist er zutreffend –, dass ich eine hohe innere Affinität
  zur Technologie habe und dass ich eine große Freude daran habe zu sehen, wie solche
  konkreten Forschungskooperationen auch für unseren Alltag nutzbar werden. Noch einmal:
  Hier wird europäische Zukunft gemacht und hier wird Zukunft für unser Land gestaltet.
  Ich will mich wirklich sehr herzlich bedanken. Es ist großartig, was Sie hier machen.
  Ich darf vielleicht auch aus der Sicht des Bundes sagen: Es ist eine gute Sache,
  dass wir mit zusammen mit allen 16 Bundesländern diese Zusammenarbeit in der Leibniz-Gemeinschaft
  haben. Das Land Brandenburg ist hier heute mit dabei gewesen, der Bund ist mit dabei
  gewesen. Vielen Dank auch an die beiden zuständigen Staatssekretäre aus den jeweiligen
  Häusern für Ihre Begleitung. Sie sehen auch hier ein Beispiel einer sehr guten föderalen
  Zusammenarbeit zwischen Bund und Ländern, und auch dafür bin ich dankbar. Es funktioniert
  und Deutschland funktioniert; das konnten wir uns hier heute anschauen. Noch einmal
  sehr, sehr herzlichen Dank an Sie alle und – wenn ich mir das erlauben darf, weil
  heute Freitag ist – ein schönes Wochenende für Sie!'
