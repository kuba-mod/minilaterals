  der NATO-Maßnahme Arctic Sentry, die speziell darauf abzielt, in dieser Region Präsenz
  zu zeigen und ein dauerhaftes Lagebild zu pflegen. In diesem Rahmen sind wir regelmäßig
  mit Einheiten ‑ Seefernaufklärern oder Fregatten ‑ vor Ort, und es werden auch regelmäßig
  Übungen durchgeführt, die diese Region ganz bewusst tangieren. ‑ Das vielleicht
  von uns zu diesem Themenfeld. Frau Deschauer, heute beginnt vor dem obersten Gericht
  in Georgien ein Verfahren, mit dem die Regierungspartei Georgischer Traum fünf Oppositionsparteien
  verbieten lassen will. Wie geht es denn weiter mit dem EU-Beitrittsstatus von Georgien?
  Ist die momentane Entwicklung nicht doch ein starkes Argument, da sehr skeptisch
  zu sein? Zu dem Anlass, den Sie gerade adressiert haben, kann ich vielleicht grundsätzlich
  sagen: Wir verfolgen die Entwicklung in Georgien mit großer Sorge, und zwar seit
  geraumer Zeit. Das Verfahren vor dem Verfassungsgericht ist ein weiterer Schritt
  in dieser Entwicklung, der das Land weiter von der EU entfernt und die Demokratie
  nach innen schwächt. Man muss auch sagen ‑ das haben auch die Kommission und der
  Generalsekretär des Europarats öffentlich unterstrichen ‑, dass eine massive Instrumentalisierung
  der Justiz für politische Zwecke sehr problematisch ist. Insofern werden wir als
  Bundesregierung bzw. als Auswärtiges Amt unsere Sorgen und Bedenken über diesen
  neuerlichen Schritt der weiteren Entfernung von der EU und einer Perspektive auf
  die EU gegenüber der georgischen Seite sicherlich adressieren. Herr Kornelius, welchen
  Stellenwert haben denn die Ereignisse in Georgien für den Bundeskanzler? Der Bundeskanzler
  beobachtet das Weltgeschehen, so wie die Bundesregierung insgesamt das tut, und
  schließt sich dem Urteil des Auswärtigen Amtes an. Ich kann vielleicht ergänzen,
  dass Georgien auch eines der Themen auf der Tagesordnung des letzten Außenrates
  war. Die politische Lage dort ist konstant schwierig. Deshalb haben wir sie in diesem
  Rahmen besprochen, und das werden wir sicherlich auch wieder tun. Herr Kornelius,
  der tschechische Staatspräsident ist heute bei Bundeskanzler Merz zu Besuch. Es
  wird keine Pressekonferenz und auch kein Statement geben. Können Sie einmal ausführen,
  warum nicht? Es ist ein kurzer Arbeitsbesuch, der genauso terminiert wurde, dass
  man sich über Dinge austauscht. Der Kanzler hat viele Gespräche dieser Art, und
  nicht jeder Besuch muss anschließend öffentlich verarbeitet werden, wenn die Sachlage
  es nicht erzwingt. Ich kann Ihnen anschließend aber gerne berichten, wenn Sie Interesse
  haben, und stehe natürlich jederzeit für Nachfragen bereit. An Frau Deschauer und
  eventuell an den Regierungssprecher: Das libysche Repräsentantenhaus billigte gestern
  das Memorandum zur Abgrenzung maritimer Zuständigkeitsgebiete zwischen Libyen und
  der Türkei. Ist die deutsche Regierung darüber informiert, und wie ist ihre Haltung
  dazu? Wir haben die Berichte zur Ratifizierung zur Kenntnis genommen, und Sie haben
  sicherlich auch gesehen, dass die Kommissionspräsidentin und der Ratspräsident der
  Europäischen Union sich schon sehr deutlich dazu geäußert haben. Wir schließen uns
  dem insofern an, als ich noch einmal darauf verweisen möchte, dass wir bereits 2019
  deutlich gesagt haben und 2025 noch einmal bestätigt haben, dass die Türkei und
  Libyen die Souveränität und die souveränen Rechte aller EU‑Mitgliedstaaten respektieren
  müssen und Seegebietsabgrenzungen im Einklang mit geltendem Völkerrecht stehen müssen.
  Die Position der EU und der Bundesregierung als Mitgliedstaat der EU ist völlig
  klar: Abgrenzungen von Seegebieten müssen ‑ das gilt natürlich auch für das Mittelmeer ‑
  nach geltendem Seevölkerrecht und insbesondere auch unter Beteiligung aller betroffenen
  Küstenstaaten erfolgen. Die EU-Partner haben da also unsere Solidarität. Dieses
  türkisch-libysche Abkommen ist höchst umstritten und von niemandem sonst anerkannt.
  Es berührt die griechischen Außengrenzen und somit auch EU-Außengrenzen. Wird die
  deutsche Regierung eventuelle Maßnahmen bzw. Sanktionen gegen Libyen unterstützen?
  Die EU unterhält mit Libyen ja eine Reihe von Hilfeleistungsprogrammen? Ich glaube,
  Sie sind in Ihrer Ableitung jetzt zu weit gesprungen. Unsere Position ist sehr klar,
  und wir werden sicherlich auch die Gelegenheit nutzen, das gegenüber denjenigen,
  die diese Position tragen, zum Gespräch zu bringen. Wir lehnen dieses Abkommen ab
  und haben eine klare Haltung, die auch schon Gegenstand eines Ratsbeschlusses ist.
  Ich will das jetzt nicht vorlesen; das ist ein auf Englisch verfasster Ratsbeschluss ‑
  „Council conclusions“ ‑ aus dem Dezember 2019. Darin wird die sehr klare Haltung
  der Europäischen Union, die auch unsere Haltung ist, zum Ausdruck gebracht. Alles
  Weitere würden wir natürlich im EU-Rahmen beraten. An das Finanzministerium: Die
  Plastiksteuer ist hier am Montag schon thematisiert worden, aber der bayerische
  Ministerpräsident hat nun seine Ablehnung der Plastiksteuer angedeutet, indem er
  gesagt hat, dafür würden 800 neue Stellen eingerichtet, und das sei absolut unmöglich.
  Deswegen hätte ich ganz gerne Aufklärung von Ihnen: Ist es wirklich geplant, dass
  800 neue Stellen dazukommen, damit die Plastiksteuer umgesetzt wird, oder wie ist
  das gemeint? Ich würde erst dem BMUKN die Möglichkeit geben, sich zu äußern, wenn
  es möchte. Die Gespräche zu dieser Steuer und entsprechend auch die Beratungen zu
  allen möglichen Details laufen in der Regierung weiter. Ein Detail haben Sie jetzt
  angesprochen, und dieses fällt in die Zuständigkeit des BMF. Ich kann zu diesen
  Stellen ‑ das haben wir ja häufiger ‑ allgemein sagen: Soweit ich das verfolge,
  gibt es für die Erstellung der Gesetze Vorgaben, mit denen Personalbedarfe ermittelt
  werden. Ich habe es jetzt für diese Steuer speziell nicht auf dem Schirm, aber ich
  kann das generell einordnen, weil diese Frage häufiger auch bei anderen Steuern
  auftaucht: Das ist immer der Personalbedarf für die Administration neuer Gesetze,
  der nach bestimmten Vorgaben ermittelt wird. Das bedeutet nicht immer, dass diese
  Personen dann auch zusätzlich eingestellt werden müssen. Vielmehr wird das in der
  Verwaltung oft so administriert, dass auch bereits vorhandenes Personal dafür eingesetzt
  werden kann. Das kann ich aber nur allgemein dazu sagen; denn ich habe gerade keine
  Erkenntnisse spezifisch zur Plastiksteuer. Könnten Sie dazu vielleicht etwas nachliefern?
  Diese Frage ist ja deswegen relevant ‑ übrigens auch bei den anderen Steuersorten,
  die Sie jetzt gemeint haben ‑, weil die Bundesregierung gleichzeitig das Ziel des
  Personalabbaus hat. Wenn jetzt an verschiedenen Stellen ‑ Tabaksteuer, Plastiksteuer
  etc. ‑ mehr Personal aufgebaut würde ‑ das muss nicht so sein, aber ich habe sie
  so verstanden, dass es sein könnte ‑, dann wäre es interessant, das zu wissen. Ich
  frage gerne nach, aber soweit ich das Verfahren hier einschätzen kann, laufen die
  Abstimmungen dazu gerade noch. Insofern kann ich Ihnen wahrscheinlich noch keine
  Details liefern. Es ist, glaube ich, wichtig zu wissen, dass jedes Gesetzgebungsvorhaben
  quasi mit einem mit einem Preisschild versehen wird, was das Gesetz kostet und was
  es einsparen wird. Insofern bezieht sich das auf potenziellen theoretischen Personalbedarf.
  Wie der Kollege schon ausgeführt hat, ist damit nicht zwingend gemeint, dass dieser
  Personalbedarf zusätzlich aufgebaut werden muss. Da sich das Thema der Plastiksteuer,
  wie wir schon am Montag festgestellt haben, in einem ordentlichen Gesetzgebungsverfahren
  befindet ‑ das heißt, es wird aufgebaut und geht durch die unterschiedlichen Häuser ‑,
  ist es, denke ich, momentan zu früh, daraus eine Ableitung zu ziehen. Sorry, ich
  hatte zwar meine Nachfrage schon, aber das provoziert doch noch eine weitere Nachfrage.
  Herr Kornelius, können Sie zumindest sagen, dass es das Ziel der Bundesregierung
  ist, dass für die neu erhobenen oder die erhöhten Steuern keine zusätzlichen Stellen
  geschaffen werden? Das Ziel der Bundesregierung ist es, Personal abzubauen, wie
  Sie zu Recht bemerkt haben. An diesem Ziel hält die Bundesregierung fest. Wie gesagt,
  ist es momentan zu früh dafür, über einzelne Gesetzesmaßnahmen zu urteilen. Wenn
  das übergeordnete Ziel erfüllt wird, dann ist das Ziel der Bundesregierung erfüllt.
  Ich habe eine Nachfrage zum Investitionsgipfel an das Wirtschaftsministerium. Der
  Kanzler hat die Zahl von 230 Milliarden Euro zugesicherter Investitionen als Erfolg
  genannt. Unklar ist allerdings geblieben, ob in den 230 Milliarden Euro auch Investitionszusagen
  enthalten sind, die bereits zu einem früheren Zeitpunkt zumindest in Aussicht gestellt
  wurden. Können Sie uns darüber Aufklärung geben? Ja, das kann ich gern tun. Schön,
  dass Sie den Investitionsgipfel ansprechen! Wir sind noch ganz glücklich über die
  gestrige Veranstaltung. Das war aus unserer Sicht ein wirklich guter Auftakt für
  die neue, fokussiertere Investorenwerbung unter der Dachmarke Invest in Germany,
  die wir mit diesem erstmaligen Gipfel gestartet haben. Wir haben auch sehr positives
  Feedback von den Unternehmen bekommen, die vertreten waren und die wir über die
  Stärken des Standorts informiert haben. Sie rufen die Zahl von 230 Milliarden Euro
  auf. Genau genommen sind es 228,6 Milliarden Euro. Das beruht auf einer Statistik,
  die wir im Vorhinein und anlässlich dieser Veranstaltung erstellt haben. Dabei geht
  es um große Investitionsprojekte in Deutschland, also um alles ab einer Investitionssumme
  von hundert Millionen Euro, was im Laufe des Jahres 2026 von Unternehmen angekündigt
  wurden. Das heißt, es sind nicht ausschließlich Projekte, die auf diesem Gipfel
  angekündigt wurden, aber auch solche. Können Sie sagen, wie hoch der Anteil der
  tatsächlichen Neuakquise ‑ so will ich es einmal nennen ‑, also sozusagen des Gipfelerfolgs,
  an den 230 Milliarden Euro ist? Nein, dafür habe ich keine Zahl. Es gab einige Unternehmen,
  die im Rahmen des Gipfels neue Investitionen angekündigt haben. Das haben die Unternehmen
  jeweils mit Pressemitteilungen bekannt gemacht. Ich kann noch sagen: Für uns war
  nicht entscheidend, an diesem Gipfel ein Preisschild bezüglich der Neuakquise zu
  haben, sondern es ging darum, einen Startschuss für den Austausch mit den Investoren
  zu setzen. Entscheidend wird sein, was an Beschleunigung und Verstärkung der Investitionstätigkeit
  in den nächsten zwölf Monaten hoffentlich passiert. Wenn ich das noch ergänzen darf:
  Solche Gipfel sind der Kulminationspunkt von Prozessen und gleichzeitig der Startpunkt
  für neue Prozesse. Die Bundesregierung hat gestern sehr geschlossen kommuniziert
  und im Auftritt dort gezeigt, dass sie diesem Investitionsthema eine hohe Bedeutung
  beimisst. Deswegen wäre es nicht redlich, an einem bestimmten Termin einen bestimmten
  Preiszettel festzumachen. Es ist ein Prozess, der über das ganze Jahr läuft und
  sich auch fortsetzen wird, ähnlich wie ja auch ein G20-Prozess mit sehr vielen Unterprozessen
  unterlegt ist, in viele Verhandlungen mündet und eigentlich kontinuierlich wirken
  soll. Die Botschaft ist natürlich, dass Deutschland offen für Investitionen ist
  und dass Investoren willkommen sind. Es war eine enorm positive Stimmung. Auch das
  Signal, das mehr als sechs Bundesministerinnen und Bundesminister vor Ort gegeben
  haben, wurde verstanden und positiv aufgenommen. Das ist ein gutes Zeichen für Deutschland.
  Deswegen ist die Bundesregierung mit dem Ergebnis hochzufrieden. Ich hoffe, Sie
  empfinden meine Nachfrage nicht als unredlich. In der Vergangenheit hat es ja Investitionszusagen
  gegeben, die dann doch entfallen sind, zum Teil nachdem auch von deutscher Seite
  erhebliche eigene Leistungen erbracht worden sind. Wie wollen und wie können Sie
  sicherstellen, dass so etwas bei den jetzt für Sie so erfreulichen Neuzusagen nicht
  passieren kann? Gibt es einen Schutz davor, dass zugesagte Investitionen doch nicht
  stattfinden? Dazu kann ich ganz grundsätzlich ausführen. Natürlich ist eine Investitionszusage
  schön und ein Zeichen des Vertrauens in den Standort. Aber entscheidend ist das
  Verbauen von Investitionen. Die Ministerin hat das zu Beginn der Legislaturperiode
  klargemacht. Die Politik, Einzelinvestitionen mit großen staatlichen Maßnahmen zu
  unterstützen, ist nicht unbedingt das, was wir verfolgen, sondern wir versuchen,
  über strukturelle Verbesserungen am Standort private Investitionen anzureizen. Wir
  berichten hier von dieser Stelle aus ja laufend darüber, wie diese strukturellen
  Verbesserungen in ganz verschiedenen Gebieten ablaufen. Herr Kornelius, wird es
  nächste Woche eine Kabinettssitzung geben? Ich bin nächste Woche auf Reisen, und
  muss daher in den Kalender schauen, aber ich gehe davon aus, dass es nächste Woche
  eine Kabinettssitzung gibt. ‑ Jawohl! Warum wurde in dieser Woche Pause gemacht?
  Ist jemand im Urlaub? Der Herr Bundeskanzler ist ja anwesend. Ich habe zu dieser
  Frage schon am Montag Stellung genommen. Wir haben geklärt, dass es wegen der Urlaubszeit
  in dieser Woche keine Kabinettssitzung gibt. Das gab es auch schon in früheren Jahren;
  im vergangenen Jahr gab es das nicht. Wir versprechen Ihnen für die Zukunft wieder
  eine hohe Kabinettsdichte mit vielen positiven Entscheidungen. Meine Frage geht
  an das Finanz- und an das Justizministerium. Es geht um den Versicherungsschutz
  bei Naturkatastrophen. Könnten Sie kurz die Eckpunkte skizzieren, die jetzt vorgelegt
  wurden? Wie soll, wenn es beim Prinzip der Freiwilligkeit von Versicherten bleibt,
  sichergestellt werden, dass eine Absicherung für den Fall von Elementarschäden tatsächlich
  Standard wird? Wie Sie richtig sagen, haben wir heute vor knapp einer Stunde gemeinsam
  mit dem BMF ein Diskussionspunktepapier veröffentlicht. Ziel ist es, einen besseren
  Schutz vor Elementarschäden gewährleisten zu können. Durch das, was in den Diskussionspunkten
  vorgeschlagen wird, soll erreicht werden, eine breite Mehrheit der Wohngebäude gegen
  Elementarschäden zu versichern. Das soll zum einen dadurch stattfinden, dass neue
  Wohngebäudeversicherungen nur mit Elementarschadensversicherung angeboten werden,
  und zum anderen dadurch, dass Bestandswohngebäudeversicherungen zu einer Stichtagslösung
  umgesetzt werden. Das sehen jedenfalls die Diskussionsvorschläge vor, die jetzt
  mit Ländern und Verbänden diskutiert werden. Der Vorteil dieser Lösung ist: 98 Prozent
  der Wohngebäude in Deutschland haben schon eine Wohngebäudeversicherung. Das heißt,
  wenn diese durch eine Elementarschadenversicherung erweitert würden, dann würde
  die breite Mehrheit der Wohngebäude gegen Elementarschäden versichert sein. So viel
  jedenfalls in aller Kürze angesichts der vorangeschrittenen Uhrzeit. Aber das heißt,
  dass die Entscheidung darüber, ob sie das dann tun oder nicht tun, bei den Versicherten
  bleibt. Kommt man, wenn es bei dieser Freiwilligkeit bleibt, tatsächlich dazu, dass
  man mehr Menschen hat, die versichert sind? Der Fokus wird darauf liegen, die bestehenden
  Wohngebäudeversicherungen zu erweitern. 98 Prozent der Eigentümerinnen und Eigentümer
  haben, wie gesagt, eine Wohngebäudeversicherung. Wenn man eine Wohngebäudeversicherung
  hat ‑ so jedenfalls unsere Diskussionsvorschläge ‑, dann wird man zukünftig in allen
  Konstellationen, ob Neuvertrag oder Bestandsvertrag, auch eine Elementarschadenabsicherung
  haben, was, wenn 98 Prozent, schon eine Wohngebäudeversicherung haben, im Endeffekt
  dazu führt, dass wir dann eine ähnlich hohe Abdeckung auch vor Elementarschäden
  bekommen. So ist es vorgesehen. In den Diskussionspunkten wird auch vorgeschlagen,
  dass im Rahmen der Länderverbändeanhörung noch diskutiert werden soll, ob es vielleicht
  Möglichkeiten gibt, verschiedene Selbstbehalte für solch eine Elementarschadenversicherung
  zu wählen. Aber es soll so sein, dass eigentlich alle, die eine Wohngebäudeversicherung
  haben, abgedeckt werden.'
