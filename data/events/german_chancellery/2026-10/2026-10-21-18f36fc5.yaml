date: '2026-10-21'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 21. Oktober 2026
text: '(Vorsitzender Feldhoff eröffnet die Pressekonferenz und begrüßt StS Kornelius
  sowie die Sprecherinnen und Sprecher der Ministerien.) (zum Gesetz zur Änderung
  des Tabaksteuergesetzes) Meine Frage geht an das BMF: Gibt es genauere Erkenntnisse
  darüber, wie es zu der Panne gekommen ist? Stand schon etwas im Gesetzestext, was
  vielleicht zu der Panne geführt hat, oder ist sie erst danach entstanden? Wie muss
  man es sich also vorstellen? Ich hole gern noch ein bisschen aus und räume erst
  einmal die Sorgen aus. Die höheren Steuersätze, die in dem Gesetzgebungsverfahren
  beschlossen wurden, werden erst ab dem 1. Januar 2027 gelten. Dabei bleibt es auch.
  Es stimmt aber, dass im Gesetzgebungsverfahren ein technischer Fehler passiert ist.
  Der Fehler sieht so aus, dass das Inkrafttreten für den Tag nach der Verkündung
  festgeschrieben wurde. Das ist auch richtig so. Es war auch so intendiert, weil
  es noch gewisse Vorbereitungen braucht, um ab dem 1. Januar 2027 auch die höheren
  Steuersätze zu administrieren. Was aber fehlt, ist eine dezidierte Regelung zur
  Anwendung dieser höheren Steuersätze erst ab dem 1. Januar 2027. Es war schon im
  Regierungsentwurf so. Es wurde auch über das ganze Gesetzgebungsverfahren im Deutschen
  Bundestag nicht korrigiert. Entsprechend wurde es jetzt so beschlossen, wie es anfänglich
  auch schon im Entwurf enthalten war. Es ist im Gesetzgebungsverfahren nicht aufgefallen.
  Ich kann aber auch dazu noch sagen: Sobald es aufgefallen war, hatte das BMF erst
  einmal informiert. Wir haben den Zoll informiert, die Generalzolldirektion und auch
  die Verbände. Wir informieren auch auf unseren Webseiten und haben jetzt direkt
  eine Berichtigung angestoßen, sodass das Ganze auch noch korrigiert wird. Meine
  Frage zur Tabaksteuer geht auch an das BMF. Sie sagen, Sie haben eine Berichtigung
  angestoßen. Können Sie es einmal konkret sagen? Wie genau soll diese Berichtigung
  jetzt ablaufen? Das genaue Vorgehen wird noch abgestimmt. Was aus unserer Sicht
  völlig klar ist, ist, dass es der intendierte Wille des Gesetzgebers und auch schon
  des BMF von Anfang an war, dass die Steuersätze erst ab dem 1. Januar 2027 erhöht
  werden. Das findet sich so auch an sehr vielen Stellen in der Gesetzesbegründung.
  Es geht auch eindeutig aus dem Gesetzeswortlaut hervor. Das genaue Verfahren wird
  gerade noch abgestimmt. Aber es wird auf jeden Fall berichtigt werden. Können Sie
  denn sagen, ob es sich dabei um das Verfahren nach § 61 in der gemeinsamen Geschäftsordnung
  der Bundesministerien handeln wird? Dieses Berichtigungsverfahren streben wir an.
  Das kann ich bestätigen. Wie genau es ablaufen wird, kann ich nur zum heutigen Tag
  noch nicht sagen. Aber, ja, das ist das Verfahren, das erst einmal angestrebt wird.
  Herr Kornelius, ein Gesetzentwurf wird ja auch vom Kanzleramt, auch von weiteren
  Ministerien geprüft, später dann auch noch einmal vom Bundestag, von den Ausschüssen.
  Als Sprecher der Bundesregierung: Wer ist denn jetzt für diesen Fehler aus Sicht
  des Kanzlers verantwortlich? Ich glaube, das BMF hat es eben deutlich gemacht. Die
  Ausarbeitung von Gesetzestexten, das Verfahren, obliegt der Zuständigkeit des jeweiligen
  Fachressorts. Weil sie das Bundeskanzleramt angesprochen haben: Das Bundeskanzleramt
  koordiniert und steuert den Gesetzgebungsprozess. Der Bundespräsident prüft lediglich
  am Ende, ob die Gesetze verfassungsgemäß sind. Insofern ist dabei die Aufgabenteilung
  klar geregelt. Ich hätte noch eine Nachfrage, vielleicht auch noch einmal mit Blick
  auf das BMF. Dass es so nicht intendiert war, geht, glaube ich, auch aus der Begründung
  des Gesetzes hervor. Aus allen begleitenden Umständen ist das für alle offensichtlich.
  Trotzdem ist das Gesetz ja nun einmal beschlossen worden und in Kraft getreten.
  Ich habe mich gefragt: Kann das Finanzministerium, also die Exekutive, jetzt einfach
  per Anordnung den Zoll darauf hinweisen, dass man es jetzt so nicht anwendet? Wie
  ist also bezüglich der Gewaltenteilung das Verfahren? Überschreiten Sie Ihre Zuständigkeiten
  möglicherweise, oder auf welcher Grundlage passiert das? Daran arbeiten wir noch.
  Das Ziel ist eindeutig beschrieben, nämlich dass es dazu kommen soll, dass die Verwaltung
  auch erst einmal angewiesen wird, dass die höheren Steuersätze nicht erhoben werden.
  Ich würde zum jetzigen Zeitpunkt sagen ‑ das ist jetzt zumindest die vorläufige
  Einschätzung ‑, dass es auch eindeutig aus dem Gesetzestext hervorgeht. Wir haben
  ja zum einen die Begründung, in der an sehr vielen Stellen steht „zum 1. Januar
  2027“. Ich habe eben einmal geschaut. Ich habe es an 13 Stellen in diesem kurzen
  Begründungstext gefunden. Dann steht es auch im Gesetz selbst, in § 2 des dann geänderten
  Tabaksteuergesetzes, jeweils für die einzelnen Produktkategorien. Unter dem Buchstaben
  b beginnt es mit „für den Zeitraum vom 1. Januar 2027“. Deshalb ist es auch im Wege
  der Auslegung dieses vorliegenden Gesetzestextes schon möglich, den Willen des Gesetzgebers
  dahingehend zu ermitteln, sodass klar ist, dass es erst ab dem 1. Januar 2027 erhöht
  werden soll. Bei Medien gilt ja das Vieraugenprinzip. Das heißt, Texte gehen nicht
  raus, wenn sie nicht gegengelesen wurden. Kann es sein, dass Gesetzestexte einfach
  veröffentlicht werden, ohne dass sie noch einmal jemand am Schluss gegenliest? Ich
  kann Ihnen auch aus der Erfahrung in unserem Ministerium sagen, dass vier nicht
  die Zahl ist, sondern dass es durch sehr viele Hände geht. Sie können es ja auch
  selbst nachvollziehen. Die Entwürfe werden in den Ministerien erarbeitet, in Fachreferaten.
  Sie werden dann in den Ministerien durch die ganze Hierarchie angeschaut. Auch hierbei
  ging es danach dann in die Ressorts, an die Verbände, in das Parlament. Ich glaube,
  an zwei Händen lässt sich die Zahl der Augen nicht abzählen, die dieses Gesetz schon
  gesehen haben. Dann war es quasi ein Multiorganversagen, oder? Ist das echt eine
  Frage? Ich fasse das eher als Statement auf. Ich habe noch eine Frage zum Verfahren.
  Sie streben also an, dass es nicht noch einmal durch den Bundestag durchgehen muss.
  Wie Ihr Kollege eben schon angesprochen hat, wäre das erste Ziel jetzt ein sogenanntes
  Berichtigungsverfahren. Dann müsste es nicht noch einmal im Bundestag beschlossen
  werden. Weil diese Unrichtigkeit hierbei so offenbar ist, weil es sich sowohl aus
  der Begründung als auch aus dem Gesetz selbst ergibt, wäre das Ziel, es so, auf
  möglichst schnellem Wege zu korrigieren. Meine Frage geht an das Auswärtige Amt.
  Es gibt Meldungen von russischen Agenturen, dass der FSB wohl einen deutschen Söldner
  festgenommen hat, der in der Ukraine gekämpft hat und desertiert ist und dann in
  Russland festgenommen wurde. Haben Sie dazu irgendwelche konkreten Informationen?
  Ich kann vielleicht sagen, dass auch ich die Berichte gesehen habe. Sie sind dem
  Auswärtigen Amt bekannt. Ich bitte aber um Verständnis dafür, dass ich mich zu möglichen
  Einzelfällen grundsätzlich nicht im Detail äußere. Das tun wir grundsätzlich nicht.
  Ich glaube, vorrangig ist erst einmal die Sachverhaltsaufklärung, die wir natürlich
  betreiben, auch mit unserer Botschaft in Moskau. Inwiefern wird demjenigen jetzt
  Betreuung durch das Auswärtige Amt angeboten? Diesbezüglich müsste ich erst auf
  meine erste Antwort verweisen, die so steht. Sehr grundsätzlich ist es so ‑ das
  gilt sehr allgemein ‑, wenn es ein deutscher Staatsangehöriger bzw. eine deutsche
  Staatsangehörige weltweit möchte, dass diesem bzw. dieser dann natürlich selbstverständlich
  das Auswärtige Amt über seine Auslandsvertretung zur konsularischen Betreuung zur
  Verfügung steht. Frau Deschauer, wie oft ist so etwas denn vorgekommen? Es soll
  sich ja den Angaben zufolge um einen früheren Bundeswehrsoldaten handeln, der quasi
  als Söldner erst in der Ukraine tätig war, um dann nach Russland zu gelangen. Kann
  man ungefähr einschätzen, wie oft solche Fälle vorkommen? Es ist ja nicht gesagt,
  dass es ein Einzelfall war. Ich verweise gern noch einmal auf meine erste Einlassung,
  in der ich, glaube ich, erkenntlich keine Aussage darüber getroffen habe. Darüber
  hinaus, auf Ihre Frage, ob man das einschätzen kann: Nein. Ich habe vielleicht einmal
  zunächst an Herrn Kornelius die folgende Frage vor dem Hintergrund der Äußerungen
  Donald Trumps und auch der zumindest zurückgehaltenen Hilfe an die Ukraine, die
  im Raum steht: Was tut die Bundesregierung, was tut der Kanzler im Moment, um vielleicht
  auch seinen Einfluss geltend zu machen, um Herrn Trump zu einem Umdenken, vielleicht
  wieder ein bisschen hin zur Ukraine, zugunsten der Ukraine, zu bewegen? Sie haben
  ja mitbekommen, dass es gestern in Oslo diplomatische Gespräche gab, auch mit dem
  US-Gesandten Witkoff, in Vorbereitung einer heutigen Reise von Herrn Witkoff nach
  Sankt Petersburg. Die Bundesregierung ist in diesem Prozess sehr engagiert. Sie
  ist auch in diesem Prozess präsent gewesen. Die Bundesregierung befindet sich im
  konstanten Austausch mit den europäischen Partnern, im gesamten EU-Rahmen, um diesen
  Prozess auch als klar europäisches Interesse zu konstruieren. Der Inhalt ist sehr
  klar: Wir wollen einen Frieden in der Ukraine. Wir wollen eine souveräne Ukraine
  in einem sicheren Europa. Deswegen wurden in Oslo entlang der Verhandlungslinie,
  die in den vergangenen Wochen und Monaten ja bereits skizziert wurde, konkrete Fragen
  mit Blick auf Sicherheitsgarantien, wirtschaftliche Perspektiven, Territorialfragen
  und Sanktionen sowie natürlich das Thema europäischer Sicherheit besprochen. Dieser
  Prozess ist ein sehr langwieriger und intensiver. Das heißt, Sie werden jetzt nicht
  kurzfristig mit Ergebnissen rechnen können. Aber das deutsche Interesse ist, dass
  es einen politischen Prozess gibt. Ich glaube auch, dass das Ergebnis von Oslo zeigt,
  dass Herr Witkoff auch mit einem klaren Verständnis der Europäer nach Sankt Petersburg
  reist, um die Position deutlich zu machen. Für uns ist völlig eindeutig, dass es
  Frieden in der Ukraine nicht über die Köpfe der Ukraine hinweg geben kann und dass
  Frieden in der Ukraine auch ein europäisches Thema sein muss. Deswegen ist der Einfluss
  da. Wir haben außerdem natürlich engen Kontakt auf allen Ebenen mit der amerikanischen
  Regierung, auch mit Außenminister Rubio. Auch Präsident Selenskyj hatte mit Außenminister
  Rubio gesprochen. Insofern kann ich jetzt zu unterschiedlichen Deutungen amerikanischer
  Unterstützung wenig Eigenes beitragen. Das entnehmen Sie den Kommentaren der jeweiligen
  Akteure. Ich habe noch eine erweiterte Frage an Frau Deschauer: Wie bewerten Sie
  mit Blick auf die Deals, die sich jetzt zwischen Russland und den USA abzeichnen,
  die Chance, dass man mit Russland trotzdem noch einmal zu einer Art Getreidedeal
  kommen kann, gerade vor dem Hintergrund der angespannten Lage auch im Schwarzen
  Meer? Ich will gar nicht sagen, dass sich dabei im Moment konkrete Deals abzeichnen.
  Das ist hinsichtlich Ihrer Einleitung. Ich glaube, es ist erst einmal ein sehr grundsätzliches
  Anliegen der Bundesregierung, wie der Regierungssprecher es jetzt beschrieben hat,
  auch von uns Europäern und Deutschen, dass endlich eine Verhandlungsbereitschaft
  von russischer Seite besteht und bestehen muss, um zu einer Lösung zu kommen, eine
  Friedenslösung, die für die Ukraine annehmbar, tragbar und verantwortbar ist. Der
  andere Themenkomplex, den Sie ansprechen, der drängt natürlich ebenfalls. Wir erleben
  in letzter Zeit immer wieder verstärkte Angriffe im Schwarzen Meer. Es sind drängende
  Fragen der Ernährungs- und Versorgungssicherheit, insbesondere auch für Länder des
  globalen Südens. Ich kann und will nicht quantifizieren und eine Prognose abgeben,
  inwiefern es möglich sein wird. Aber ich glaube, ich verbinde es noch einmal mit
  der Aufforderung, die auch der Außenminister zuletzt im direkten Gespräch in New
  York gegenüber dem russischen Außenminister, aber auch an verschiedener Stelle,
  öffentlich gemacht hat: Die Ernährungssicherheit der Welt hängt auch davon ab. Die
  russische Seite ist dringend aufgefordert, sich diesbezüglich in eine Verhandlung
  zu begeben, um dies zu ermöglichen, und von den Angriffen abzusehen. Herr Kornelius,
  ich würde gern noch einmal nach den Gesprächen der Amerikaner mit der Ukraine und
  Russland fragen. Der Kanzler hat gerade eben noch einmal sehr deutlich gesagt: Kapitulation
  ist keine Option. ‑ Ist denn der Eindruck nach dem, was Sie von den Gesprächen in
  Oslo wissen, dass die Amerikaner genau auf das drängen, nämlich auf eine Kapitulation
  der Ukraine? Der deutsche Kontakt und der europäische Kontakt mit den USA lässt
  den Schluss zu, dass die Amerikaner an einem Verhandlungsprozess interessiert sind.
  Dazu gibt es Vorbereitungen, die bei verschiedenen Treffen der nationalen Sicherheitsberater
  in den vergangenen Wochen getroffen wurden. Sie wissen, dass es zwei Verhandlungsprozesse
  gibt. Es gibt einen VAE-Prozess, der so genannt wird, weil die Emirate möglicherweise
  ein Ort sein könnten, in den einer dieser Prozesse mündet. Es gibt natürlich auch
  am Horizont das G20-Treffen in Miami, auf das die amerikanische Regierung immer
  wieder mit ihrem Verhandlungsinteresse hinweist. Das europäische Interesse ist eindeutig,
  nämlich dass wir Verhandlungen mit der Ukraine, an der Seite der Ukraine über das
  Schicksal der Ukraine führen. Die Kapitulation ist deswegen keine Option, weil die
  Ukraine ein seit fünf Jahren angegriffener Staat ist, der in seiner territorialen
  Integrität angegriffen wurde und der diese territoriale Integrität verteidigt. Die
  ukrainische Sicherheit ist auch die europäische Sicherheit. Sie ist die deutsche
  Sicherheit. Deswegen ist unser Interesse an einem Verhandlungsprozess und an einem
  Verhandlungsende dieses Krieges ungebrochen. An Herrn Kornelius, vielleicht auch
  an Herrn Müller: Ist denn eigentlich von der Bundesregierung sichergestellt, dass
  die zugesagten Patriot-Raketen an die Ukraine geliefert werden dürfen, oder kann
  es sein, dass die US-Regierung es möglicherweise untersagt? Mir sind keine Restriktionen
  bekannt. Sie wissen, dass es momentan Engpässe bei der Versorgung der Ukraine mit
  Luftverteidigungsmitteln gibt. Aber jenseits dieser sehr allgemeinen Feststellung
  habe ich keine detaillierten Erkenntnisse. Ich schließe mich dem an. Diese Erkenntnisse
  haben wir auch, genau wie es gerade eben gesagt wurde. Zur allgemeinen Einordnung:
  Es gibt ja verschiedenste Verfahren, wie wir diese Patriot-Raketen mit der Ukraine
  bereitstellen. Das eine ist die Direktabgabe. Darüber haben wir informiert. Dann
  gibt es einmal das Themenfeld von Direct Commercial Sales, dass also Verträge mit
  unserer finanziellen Unterstützung direkt zwischen der Ukraine und der Seite der
  US-Industrie abgeschlossen werden. Der dritte Punkt sind dann die PURL-Pakete über
  das PURL-Verfahren. Aber wie gerade gesagt wurde, haben wir bisher keine Anzeichen,
  dass es auch in den vergangenen Jahren, in denen wir diese Mittel genutzt haben,
  nicht funktioniert hat. Herr Kornelius, Sie sagten die Bundesregierung, also Deutschland,
  sei engagiert und an diesem Prozess beteiligt. Wie sah diese Beteiligung konkret
  in Bezug auf Oslo aus? Waren deutsche Regierungsvertreter in Oslo physisch anwesend?
  Gab es dort direkte Gespräche, zum Beispiel mit Witkoff oder seiner Delegation,
  oder war es mehr eine Information über die Distanz? Die Bundesregierung war in Oslo
  mit dem Außen- und Sicherheitspolitischen Berater der Bundesregierung vertreten.
  Über die Details der Gespräche kann ich und möchte ich keine Ausführungen machen.
  Beinhaltete diese physische Begegnung in Oslo dann auch die Vorbereitung der jetzt
  in Sankt Petersburg begonnenen Gespräche zwischen Witkoff und der russischen Regierung?
  Ich hatte ja eben sehr ausführlich über das deutsche Interesse gesprochen. Sie können
  sich sicher sein, dass Herr Sautter dieses Interesse dort vertreten hat. Herr Kornelius,
  ich würde gern noch mit Blick auf US-Präsident Trump nachfragen. Es ist ja doch
  in den vergangenen Tagen, fast Wochen, offensichtlich geworden, dass sich die Positionen
  gegenüber der Ukraine, gerade auch bezüglich dessen, was kommuniziert wurde, noch
  einmal deutlich verschärft haben. Es gibt die Berichte über Starlink etc. Ich frage
  mich jetzt, da es sich ja doch noch einmal deutlich zuspitzt: Ist das ein Punkt,
  an dem man neben den Dingen, die Sie ja jetzt schon ausgeführt haben, im Kanzleramt
  vielleicht auch darüber nachdenkt, doch noch einmal in die USA zu reisen und sich
  vielleicht auch mit anderen europäischen Staats- und Regierungschefs zusammenzutun,
  um dem US-Präsidenten vielleicht auch die europäische Position noch einmal darzulegen?
  Herr Kollege, Sie haben ja auch in den vielen vergangenen Monaten und auch Jahren
  feststellen können, dass der Kommunikationsprozess mit Blick auf die Ukraine unterschiedlichen
  ‑ wie soll ich sagen? ‑ Temperaturmessungen unterliegt. Das heißt, es gibt Phasen
  enormer Intensität und dann Phasen hoher Bereitschaft, den Prozess zu unterstützen.
  Die Bundesregierung unterstützt alles, was dem politischen Prozess und auch dem
  Prozess der Versachlichung dient. Sie nutzt dazu auch alle Kontakte, die sie aufbieten
  kann. Ich habe jetzt keine Absicht, Äußerungen des amerikanischen Präsidenten im
  Einzelnen zu kommentieren. Sie können sich aber sicher sein, dass wir uns an der
  Stelle in einem sehr engen Austausch befinden. Wir verweisen auch immer wieder darauf,
  dass die Ukraine als angegriffenes Land seit fünf Jahren einem völkerrechtswidrigen
  Krieg ausgesetzt ist, bei dem die Zuordnung von Angreifer und Angegriffenem sehr
  einfach ist. Die Bundesregierung bezieht hierbei auch aus eigenem sicherheitspolitischen
  Interesse, auch aus Interesse an der deutschen Sicherheit, zugunsten der Ukraine
  Partei. Sie haben ja jetzt selbst beschrieben, wie das in solchen Wellen funktioniert,
  und haben das Wort Temperatur benutzt. Sieht man es im Kanzleramt aber auch so,
  dass die Temperatur, um vielleicht einmal in dem Bild zu bleiben, gerade besonders
  hoch ist? Das Kanzleramt bemüht sich darum, die Temperaturmessungen dem Wetterdienst
  zu überlassen und nicht der Diplomatie. Ich hatte Sie nur zitiert; Sie hatten es
  ja gerade angesprochen. Ich weiß. Sie hatten ja nach dem Kanzleramt gefragt, und
  das war meine Antwort darauf. Ich hätte ganz gerne noch einmal nachgefragt, vielleicht
  bei Herrn Müller. Ist angesichts der Spannungen, die es ja jetzt im Schwarzen Meer
  gibt, wo auch NATO-Partner wie Bulgarien und Rumänien unter Druck stehen, eigentlich
  geplant, dass die Bundesmarine oder die Marine der Bundeswehr einen Beitrag leistet,
  um diese NATO-Länder zu schützen? Prinzipiell wird die Sicherheitslage und alles,
  was NATO-Maßnahmen betrifft, im Bündnis besprochen. Wenn es hier zu einer Bedrohungslage
  kommt und die Anrainerstaaten, die NATO-Mitgliedstaaten feststellen, dass Unterstützung
  aus dem Bündnis erforderlich ist, dann wird das im Bündnisrahmen besprochen. Sie
  wissen ja, dass es im nächsten Monat zum Beispiel ein NATO-Verteidigungsministertreffen
  geben wird. [Anmerkung: Angabe wird im weiteren Verlauf korrigiert.] Vorwegnehmen
  kann ich hier nichts, weil prinzipiell erst einmal die Abstimmung unter den Mitgliedstaaten
  im Bündnis stattfindet. Aber gibt es auch keine Angebote von der deutschen Seite?
  Erst einmal finden die Abstimmungen im Bündnisrahmen statt, und die genaue Lageeinschätzung
  ‑ Sie kennen das von der Ostflanke der Südostflanke ‑ ist hier für mich nicht öffentlich
  zu teilen. Die Kollegen von WDR und der „Süddeutschen Zeitung“ berichten ja darüber,
  dass es eine neue Sicherheitsanalyse bei der Bundeswehr gebe, in der die Gefahrenstufe
  jetzt eben noch einmal auf „erheblich“ hochgestuft wurde, und es hieß, dass die
  Bundeswehr auch selbst Ziel werden könnte. Warum hat man diese Einstufung vorgenommen,
  und welche konkreten Gefahrenszenarien sehen Sie für die Bundeswehr? Können Sie
  diese Berichte so überhaupt erst einmal bestätigen? Bevor ich antworte, noch eine
  Sache: Ich habe gerade das falsch wiedergegeben. Es wird kein NATO-VM-Treffen im
  nächsten Monat geben. Mir wurde gerade ein Hinweis gegeben. Das ist noch ein ganz
  alter Stand von mir, tut mir leid. Zur Bedrohungslage: Die Bedrohungslage wird von
  uns kontinuierlich beobachtet. Das ist ja Aufgabe der Bundeswehr. Dafür haben wir
  zentrale Stellen im Ministerium bis herunter auf die Verbandsebene und natürlich
  im Operativen Führungskommando. Natürlich ist das Thema der Sabotage ein wichtiger
  Baustein neben anderen wie zum Beispiel dem Thema der Spionage oder auch der direkten
  Bedrohungslage. Öffentlich bekannt ist ‑ das ist hier nicht neu ‑, dass wir in der
  jüngsten Vergangenheit Fälle hatten, die diese Bewertung natürlich beeinflussen.
  Ich nenne den Vorfall des Fundes einer Drohne in der Nähe von Wunstorf. Es gab hybride
  Angriffe, die nicht direkten Bundeswehrbezug hatten. Es gab aber auch Sabotagefälle
  im Bereich der Marine, an Schiffen und sehgehenden Einheiten. Wie auch die Präsidenten
  des BfV und des BND sowie die MAD-Präsidentin hier an dieser Stelle auch dargestellt
  haben, ist die Sabotagebedrohung in Deutschland natürlich ein maßgeblich zu beobachtender
  Punkt, und er bereitet natürlich auch Sorge. Im Zusammenhang mit diesen Vorkommnissen
  und dieser Gesamtbewertung stellen wir fest, dass es eine erhebliche Sabotagebedrohung
  für die Bundeswehr insgesamt gibt. Das ist richtig. Was heißt das jetzt für uns?
  Das heißt, dass wir uns genau anschauen, in welchen Bereichen wir ‑ ‑ ‑ Das ist
  ein kontinuierlicher Prozess. Das ist nicht das, was jetzt gerade neu beginnt, sondern
  wir schauen uns ganz genau an, welche Maßnahmen präventiv vor Ort, ortsabhängig
  und situationsabhängig ergriffen werden können, um der Sabotagegefahr zu begegnen,
  wenn die zum Beispiel an einem Schutzobjekt etwas ganz Spezielles machen oder eine
  größere Übung fahren oder besondere Fähigkeiten stationiert haben oder verlegen.
  Dafür gibt es, wie gesagt, über alle Ebenen hinweg Spezialisten bis herunter zu
  den Verbänden, in denen es Spezialisten gibt, die sich das vor Ort genau anschauen,
  die dann vor Ort Präventivmaßnahmen festlegen und die sagen, dass die Maßnahmen,
  die ergriffen worden sind, entweder ausreichend sind oder dass, wenn wir halt eine
  andere Lage, eine andere Situation haben, themenbezogen, situationsbezogen, zeitbezogen,
  noch einmal andere Maßnahmen speziell entwickelt oder angepasst werden. Es heißt,
  es sei die zweithöchste Stufe. Welche Abstufungen gibt es da, und wann wäre dann
  sozusagen die nächste Stufe erreicht? Über die Details der genauen Stufen möchte
  ich hier nicht Auskunft geben. Ja, es gibt noch höhere Stufen, das ist richtig.
  Es wäre rein spekulativ, zu sagen, dass das jetzt bei diesem und jenen Fall stattfinden
  würde, sondern die Gesamtbewertung wird immer in diesen mehreren Clustern vorgenommen,
  und dabei wird genau geschaut, welche Maßnahmen man ergreift. Ich kann mich noch
  erinnern: Als nach 9/11 die Bedrohungslage für alle NATO-Nationen anders eingeschätzt
  wurde, wurden zum Beispiel im Bereich der Terrorgefahr auch Maßnahmen ergriffen,
