title: Im Kabinett beschlossen Zuckergetränkesteuer soll Gesundheitssystem entlasten
text: Die Bundesregierung will insbesondere Kinder und Jugendliche, aber auch Erwachsene
  vor den Folgen hohen Zuckerkonsums schützen. Mit der Einführung einer Steuer auf
  zuckergesüßte Getränke folgt die Bundesregierung einer Empfehlung der „FinanzKommission
  Gesundheit“ , einem unabhängigen Expertengremium aus den Bereichen Wirtschaft, Medizin,
  Sozialrecht, Ethik und Gesundheitsvorsorge. Die Zuckergetränkesteuer dient insbesondere
  dem Schutz der Gesundheit von Kindern und Jugendlichen, aber auch Erwachsenen. Die
  Steuer soll ab Juli 2027 wirken. Die wichtigsten Fragen und Antworten im Überblick.
  Hoher Zuckerkonsum erhöht das Risiko für Übergewicht, Herz-Kreislauf-Erkrankungen,
  Karies und Diabetes. Die Bundesregierung will insbesondere Kinder und Jugendliche,
  aber auch Erwachsene, davor schützen. Die Steuer soll ein Anreiz für Hersteller
  sein, den Gesamtzuckergehalt in Getränken zu verringern. Insgesamt geht es darum,
  dass weniger Zucker konsumiert wird. So sollen längerfristig die Kosten im Gesundheitssystem
  gesenkt werden, die durch den erhöhten Zuckerverbrauch und die dafür typischen Krankheitsbilder
  entstehen. Die Versorgungskosten im Gesundheitssystem, die durch den erhöhten Konsum
  von gezuckerten Getränken verursacht werden, belasten die Allgemeinheit mit über
  zwei Milliarden Euro pro Jahr. Die Steuer soll einen gesünderen Umgang mit zuckerhaltigen
  Getränken fördern. Werden weniger Menschen krank, senkt das die Kosten für die Versorgung
  und stabilisiert die gesetzliche Krankenversicherung. Das kommt allen zugute, die
  Beiträge zahlen. Die Steuereinnahmen ermöglichen es, eine zuvor vorgesehene Absenkung
  des Bundeszuschusses an den Gesundheitsfonds zu verringern. Aus dem Fonds erhalten
  die Krankenkassen die Mittel, die sie benötigen, um die Leistungen für ihre Versicherten
  zu finanzieren. Die Steuereinnahmen sollen dazu verwendet werden, die Beiträge für
  die gesetzliche Krankenversicherung stabil zu halten. Hersteller, Großhändler und
  Verkaufsstellen sind grundsätzlich frei in ihrer Preisgestaltung. Die Zuckergetränkesteuer
  ist allerdings als Verbrauchsteuer so angelegt, dass die steuerliche Belastung auf
  die Endkunden übertragen wird. Insofern ist mit Preissteigerungen für Getränke mit
  einem gewissen Zuckergehalt im zweistelligen Cent-Bereich zu rechnen. Die Zuckergetränkesteuer
  betrifft Getränke ab einem bestimmten Gesamtzuckergehalt, zum Beispiel Limonaden,
  Eistees, Energydrinks oder Fruchtnektar. Sie soll auch zuckerhaltigen Sirup und
  entsprechende Konzentrate, mit denen Getränken zubereitet werden können, erfassen.
  Die Steuer gilt nicht für alkoholhaltige Getränke, weil diese in der Regel bereits
  anderweitig besteuert werden. Auch entsprechende alkoholfreie Alternativen sollen
  ausgenommen werden, ebenso Mischgetränke auf dieser Basis. Milch, Hafer- und Reisdrinks
  sowie entsprechende Mischgetränke, reine Frucht- und Gemüsesäfte, reines Frucht-
  und Gemüsesaftkonzentrat sowie entsprechende ungesüßte Schorlen sollen ebenfalls
  von der Steuer ausgenommen werden. Das soll auch für Getränke gelten, die mit Süßungsmitteln
  gesüßt sind.
