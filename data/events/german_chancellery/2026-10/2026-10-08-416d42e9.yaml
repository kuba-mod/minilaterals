title: 'Kanzler zu Gast beim Jubiläum von Handelsblatt und WirtschaftsWoche Wirtschaftsstandort
  Deutschland: Das Gute sehen'
text: 'Beim Jubiläum der Wirtschaftsmedien Handelsblatt und WirtschaftsWoche blickte
  der Kanzler positiv auf die Wirtschaftsentwicklung in Deutschland. 2026 feiert das
  Handelsblatt 100-jähriges Bestehen, die WirtschaftsWoche das 80. Jubiläum seit ihrer
  Gründung. Diese Jubiläen hat Bundeskanzler Friedrich Merz im Rahmen einer Veranstaltung
  in Berlin gewürdigt und dazu aufgerufen, gemeinsam das Gute zu sehen, „das in unserem
  Land da ist“. Angesichts der aktuellen Wirtschaftszahlen zeigte sich der Bundeskanzler
  optimistisch: „Die führenden Wirtschaftsinstitute haben ihre Wachstumsprognose für
  2026 auf 1,3 Prozent verdoppelt. Sie rechnen damit, dass sich dieser positive Trend
  auch 2027 fortsetzt.“ Auch die ausländischen Direktinvestitionen in Deutschland
  hätten seit 2025 wieder deutlich angezogen. Neben erfolgreichen Startups sei es
  „vor allem der Export, der unsere Volkswirtschaft trägt. Wir können nach wie vor
  vieles sehr gut, was auf der Welt gebraucht wird, etwa die Maschinen, die Elektronik,
  die Spezialtechnik für Rechenzentren.“ Dabei würden sich die Investitionen in Infrastruktur
  und Verteidigung auch in Aufträgen in Hochleistungstechnologie und Datenverarbeitungstechnik
  niederschlagen. „Das ist kein Strohfeuer, sondern das sind Innovations- und Investitionsimpulse,
  die unserer Volkswirtschaft insgesamt zugutekommen“, betonte der Kanzler auch hinsichtlich
  der Initiative „ Made for Germany “ mit mehr als 800 Milliarden Euro Investitionen
  in den Wirtschaftsstandort Deutschland. Zu einer poistiven Wirtschaftsentwicklung
  gehört auch bezahlbare Energie. „Wir machen die Energiewende pragmatisch, technologieoffen,
  kosteneffizient. Teilweise stellen wir sie vom Kopf wieder auf die Füße. Hier ist
  ein neuer Realismus eingekehrt, bis hin zum Bau neuer Gaskraftwerke“, unterstrich
  der Kanzler. Mit Blick auf Europas Wettbewerbsfähigkeit hob der Kanzler wirksame
  Instrumente hervor, „ mit denen wir uns gegen unfairen Wettbewerb wehren können“
  . Es gehe dabei nicht darum, sich vor Wettbewerb zu schützen, sondern „um die Verteidigung
  fairer Spielregeln.“ Der Bundeskanzler betonte zudem Deutschlands fortwährende Unterstützung
  der Ukraine gegen die russische Aggression, „weil es in unserem Interesse liegt,
  eine selbstbestimmte demokratische Ukraine zum europäischen Nachbarn und europäischen
  Partner zu haben, übrigens auch zu unserem industriellen und militärischen Partner.“
  Denn in einer Welt, „in der nicht mehr andere diese Sicherheit für uns garantieren,
  müssen wir, muss Europa selbst dazu in der Lage sein“, unterstrich Kanzler Merz.
  „Freiheit und Frieden gibt es in dieser Welt eben nur dann, wenn man sie auch wirklich
  schützt“, hob er hervor. Deshalb werde die Bundeswehr wieder in den Stand gesetzt,
  um Deutschland verteidigen zu können.'
