  werden vor allem unverheiratete Männer für die Arbeit in Deutschland angeworben.
  Der Tabakzüchter Mehmet Ali verlässt 1966 als letzter Mann sein Dorf Bademeli in
  der Nähe von Izmir , um in Deutschland zu arbeiten. Seine 26-jährige Ehefrau bleibt
  in einem männerlosen Ort zurück. Die Gastarbeiter sind überwiegend in der Industrie
  tätig und sind in harten körperliche Jobs tätig. Dazu gehört die Autoproduktion,
  zum Beispiel das Ford-Werk in Köln. Die türkischen Auswanderer sind im Durchschnitt
  besser qualifiziert als die Menschen in der Türkei: 80 Prozent haben eine abgeschlossene
  Schulausbildung, in der Türkei sind es nur 44 Prozent. Rund ein Drittel der Gastarbeiter
  sind Frauen. Sie arbeiten zum Beispiel in der Textil- und der Nahrungsmittelindustrie,
  aber auch in der Elektrotechnik oder der Eisenindustrie. Sie verdienen etwa 30 bis
