date: '2026-10-26'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 26. Oktober 2026
text: 'stellvertretender Regierungssprecher Hille (Vorsitzende Buschow eröffnet die
  Pressekonferenz und begrüßt SRS Hille sowie die Sprecherinnen und Sprecher der Ministerien.)
  (zur Präsidentschaftswahl in Brasilien ) Guten Morgen! Meine Frage richtet sich
  an Herrn Hille und, wenn Sie möchten, auch an Herrn Giese. Hat Kanzler Friedrich
  Merz Lula zum Wahlsieg gratuliert? Welche Impulse erwartet die Bundesregierung jetzt
  für die deutsch-brasilianischen Beziehungen? Ich mache kurz den Anfang, bevor der
  Kollege Giese ergänzen kann. Zunächst sozusagen als protokollarischer Disclaimer:
  Was offizielle Gratulationen und so etwas angeht, gibt es einen relativ klaren protokollarischen
  Ablauf. Üblicherweise wird bei solchen Wahlen formal zur Amtsübernahme gratuliert.
  Aber ich kann von dieser Stelle aus sagen, dass wir zur Kenntnis genommen haben,
  wie die Wahl in Brasilien ausgegangen ist und der Bundeskanzler Präsident Lula natürlich
  dazu gratuliert, dass er diese Wahl gewonnen hat. Der Bundeskanzler freut sich,
  die strategische Partnerschaft zwischen Deutschland und Brasilien weiter zu vertiefen.
  Herr Giese, möchten Sie dem etwas hinzufügen? Sonst würde ich meine zweite Frage
  stellen. Ich kann vielleicht noch einen Punkt hinzufügen. Er gilt ganz allgemein.
  Ich hätte ihn heute vorgetragen, egal wie das Ergebnis gewesen wäre. Brasilien ist
  für uns ein herausragend wichtiger globaler Partner ‑ das ist ganz klar ‑, unabhängig
  von der Regierung in Brasilien. In den Bereichen der globalen Ordnung, des Handels,
  der Wirtschaft, der Vereinten Nationen arbeiten wir sehr eng zusammen. Wir haben
  eine strategische Partnerschaft, in deren Rahmen wir sehr eng zusammenarbeiten.
  Insofern freuen wir uns auf die weitere Zusammenarbeit mit Brasilien. Das hätte
  ich bei jedem der beiden möglichen Ergebnisse heute hier vorgetragen. Brasilien
  ist und bleibt ein herausragend wichtiger globaler Partner für uns. Sieht die Bundesregierung
  in Flávio Bolsonaros Weigerung, seine Niederlage anzuerkennen ‑ er hat schon angekündigt,
  dass er das Ergebnis annullieren lassen möchte ‑ eine Gefahr für die demokratische
  Stabilität Brasiliens? Anders gefragt: Steht die Bundesregierung eindeutig hinter
  dem Wahlergebnis in Brasilien? Mit dieser Frage sind wir jetzt innerhalb Brasiliens.
  Brasilien ist ein Rechtsstaat. Es gibt die Möglichkeit, nach den gesetzlichen Regeln,
  über die ich mich von meinen Kollegen habe informieren lassen, gegen dieses Wahlergebnis
  vorzugehen. Herr Bolsonaro beruft sich auf Unregelmäßigkeiten, die er erst einmal
  behauptet. Es ist an den Gerichten darüber zu entscheiden, ob an dem etwas ist.
  Er hat angekündigt, das tun zu wollen. Vielleicht ist es auch schon geschehen. Ich
  denke, dafür laufen jetzt Fristen. Darüber werden Gerichte in Brasilien zu entscheiden
  haben und nicht wir hier in der Bundespressekonferenz. Ich habe eine Frage an das
  Umweltministerium. Wie schätzen Sie die Folgen des Wahlsiegs von Lula für den Klimaschutz
  und auch für den Regenwaldschutz ein? Grundsätzlich ist es nicht unsere Aufgabe,
  als Bundesumweltministerium von dieser Stelle aus Wahlausgänge zu kommentieren und
  zu bewerten. Aber Sie wissen natürlich, dass es in den vergangenen Jahren eine ganze
  Reihe von wichtigen Beschlüssen und Zusammenarbeiten im Bereich von Waldschutz und
  Klimaschutz zwischen der Bundesregierung und Brasilien gegeben hat. Insofern ist
  diesbezüglich jetzt eine Kontinuität zu erwarten. Eine Frage an das Auswärtige Amt,
  gegebenenfalls an den Regierungssprecher: Bei der vorherigen Wahl am 30. Oktober
  2022, als Präsident Lula gewann, hat der damals amtierende Bundeskanzler Scholz
  am nächsten Morgen explizit zum Wahlsieg gratuliert. Sie sagen jetzt, das werde
  üblicherweise aber erst bei Ernennung gemacht. In jenem Fall war es aber anders,
  und die Begründung war, dass in Brasilien der Präsident direkt gewählt wird. Das
  gilt doch diesmal auch. Warum dann also nicht auch jetzt eine explizite, frühe,
  direkte Gratulation an den Wahlsieger? Dann würde ich auf das verweisen, was ich
  gerade gesagt habe. Ich habe doch nach dem sozusagen protokollarisch-offiziellen
  Disclaimer dennoch dem Wahlsieger eine Gratulation ausgesprochen. Ich sitze hier
  für die Bundesregierung und den Bundeskanzler. Also nehmen Sie das so: Wir haben
  das Wahlergebnis zur Kenntnis genommen, und der Regierungssprecher hat stellvertretend
  für die Bundesregierung und den Bundeskanzler die Gratulation des Bundeskanzlers
  hier mündlich übermittelt, unbeschadet dessen, dass die protokollarischen Abläufe
  so sind, wie ich sie geschildert habe. Der Unterschied ist natürlich, dass es 2022
  der Bundeskanzler selbst war und nicht sein Sprecher. Aber das sei dahingestellt.
  Der Wahlsieg Lulas hat viele überrascht, weil Bolsonaro in den Ergebnissen des ersten
  Wahlgangs vorn gelegen hatte. Das war auf einen sehr intensiven Einsatz von Social
  Media im Wahlkampf zurückgeführt worden. Offenbar hat das Lula-Lager diesbezüglich
  in den letzten Wochen massiv aufgeholt und möglicherweise eine Trendwende bewirkt.
  Was lernt die Bundesregierung aus solchen Abläufen? An wen richtet sich diese Frage?
  An den Kollegen Giese oder an mich? Ich denke, in dem Fall an den stellvertretenden
  Regierungssprecher. Vielen Dank für diese interessante Frage. Wie Sie sich vorstellen
  können, beobachten wir ‑ das habe ich von dieser Stelle aus schon x-fach gesagt ‑
  natürlich alles, was auf der Welt passiert. Aber es ist jetzt nicht an mir und an
  uns, aus einzelnen Wahlen Rückschlüsse zu ziehen und sie am Tag eins nach der Wahl
  von dieser Stelle aus zum Besten zu geben. Ich verstehe Ihre Perspektive und das
  Interesse, aber das ist nicht die Zeit und der Ort, und ich bin nicht die Person,
  die sich an dieser Stelle darüber auslassen sollte. Noch einmal zum Thema des Tropenwaldschutzes:
  Herr Hille, inwiefern wird mit dieser Wahl die erste Auszahlung Deutschlands an
  den TFFF, an den Tropenwaldfonds, passieren? Das hatte ja ein bisschen infrage gestanden,
  bevor dieses Wahlergebnis stand. Welche Auswirkungen hat das? Dazu kann ich Ihnen
  zu diesem Zeitpunkt nichts sagen, weil ich es nicht weiß. Ich weiß nicht, ob das
  AA, das BMF oder das BMZ etwas dazu sagen kann. Ansonsten müssten wir uns das einmal
  anschauen und dann gegebenenfalls nachliefern. Ich bin mir jetzt nicht sicher, ob
  das beim Auswärtigen Amt läuft. Es läuft eigentlich beim BMZ. Der Kollege kommt
  schon. Ansonsten würden wir uns kundig machen. Eine Antwort von Ihrer Seite würde
  mich auf jeden Fall interessieren, aber natürlich auch vom BMZ. Ich will zunächst
  einmal sagen, dass Brasilien, wie es eben schon anklang, natürlich ein langjähriger
  Partner gerade beim Tropenwaldschutz ist. Die konkrete Auszahlung und der Stand
  hängen nicht unbedingt an der Wahl, sondern das sind Prozesse, die fortlaufen. Aber
  es ist natürlich erst einmal eine gute Nachricht für den Tropenwaldschutz, dass
  mit Lula absehbar ein Partner und eine Regierung im Amt sein wird, mit der wir daran
  tatkräftig weiter gemeinsam arbeiten können. Noch einmal zum Protokoll: Herr Giese,
  auch die Außenministerin hat vor vier Jahren direkt am Morgen zu Lulas drittem Wahlsieg
  gratuliert. Der Außenminister hat das jetzt auch noch nicht getan. Hat das einen
  besonderen Grund? Herr Hille, können wir von Herrn Merz vielleicht heute noch eine
  Gratulation erwarten, gerade mit Hinblick darauf, dass in Südamerika ja sehr genau
  geschaut wird, was aus Europa kommt und dass in Berlin gerade noch Schweigen herrscht?
  Mir fällt es ein bisschen schwer, mich diesbezüglich zu historischen Vorgängen zu
  äußern. Ich weiß nicht genau, in welchem Kontext das in der Vergangenheit geschehen
  ist. Ganz grundsätzlich ist es so, dass jetzt das Staatsoberhaupt gewählt wurde.
  Ich spreche für den Außenminister. Es ist unüblich, sich dazu zu äußern. Das tun
  wir üblicherweise nicht. Der Außenminister wird seinem Amtskollegen mit Sicherheit,
  wenn er noch einmal neu ernannt werden sollte, als Außenminister gratulieren, das
  ist ganz klar. Aber üblicherweise äußert sich das Außenministerium nicht, wenn Staatsoberhäupter
  gewählt werden. Ich weiß nicht, in welchem Zusammenhang das in der vergangenen Legislaturperiode
  geschehen ist. Ja, und zwar eine Frage, die sich an mich richtet. Ich war nicht
  abgelenkt, sondern ich habe parallel live ins Internet geschaut, nämlich in X. Das
  würde ich auch Ihnen empfehlen, weil dort die Glückwünsche des Bundeskanzlers gleich
  auch noch einmal zu lesen sein werden. Es freut mich im Übrigen, dass so großes
  Interesse an einer Stellungnahme des Bundeskanzlers zu den Wahlergebnissen besteht.
  Herr Giese, der Kontext war, dass die Außenministerin das direkt am Morgen, als
  sie auf Reisen war, getan hat und wir hier gefragt haben. Sie waren zwar nicht da,
  aber Frau Sasse. Sie hat darauf hingewiesen, dass das ja zum Beispiel auch bei der
  französischen Präsidentschaftswahl so war. Herr Hille, Sie meinten jetzt gerade,
  Sie hätten auf X geguckt. Aber da ist es noch nicht, weil es erst kommt, richtig?
  Just in diesem Moment um genau zu sein: vor jetzt 45 Sekunden. Von daher sehr schön,
  dass Sie fragen. Herr Hille oder Herr Giese, haben Sie einen Kommentar zur Wahl
  in Serbien ? Auch bei diesem Thema beginne ich kurz. Es wird Sie nicht wundern,
  dass wir auch dieses Wahlergebnis zur Kenntnis genommen haben. In Serbien haben
  die Wählerinnen und Wähler mit sehr hoher Wahlbeteiligung für einen demokratischen
  Wechsel gestimmt. Das Ergebnis ist klar. Wir gratulieren der serbischen Studentenliste
  zu ihrem Sieg in den gestrigen Parlamentswahlen. Der Wahlkampf und das Ergebnis
  zeigen die Bedeutung der Themen von Rechtsstaatlichkeit, Korruptionsbekämpfung und
  Gewährleistung der Grundfreiheiten für die Bevölkerung in Serbien. Die Erwartungen
  an die Studentische Liste im In- und Ausland sind nun groß. Wir werden die Regierungsbildung
  aufmerksam verfolgen und für eine konstruktive Basis der künftigen Zusammenarbeit
  auf der Basis gemeinsamer europäischer Werte werben. Deutschland und die EU haben
  Reformen und den europäischen Weg Serbiens immer engagiert unterstützt. Dies werden
  wir auch in Zukunft tun. Vorbeugend der Hinweis: Auch darin waren Gratulationen
  enthalten. Ich kann Ihnen vielleicht noch einen Servicehinweis für Ihre Berichterstattung
  in diesem Zusammenhang geben. Das Office for Democratic Institutions and Human Rights
  der OSZE, ODIHR, war vor Ort vertreten. 30 Langzeitbeobachter waren dabei, zwei
  davon aus Deutschland. Seit Donnerstag, dem 22. Oktober waren zusätzlich 240 Kurzzeitbeobachter
  dort. Davon waren 30 aus Deutschland. Außerdem waren auch Beobachter des Europäischen
  Parlaments und der Parlamentarischen Versammlung des Europarats und der OSZE anwesend.
  Es wird einen Bericht geben. Die ODIHR-Mission hat angekündigt, den vorläufigen
  Bericht heute vorzustellen. Die Pressekonferenz wird um 15 Uhr stattfinden. Schalten
  Sie da also hinein. Anschließend an den Kollegen Giese ein weiterer Servicehinweis:
  Ich empfehle auch in diesem Fall, falls noch Bedarf zum Nachlesen besteht, einen
  Blick auf die bekannte Internetplattform. Auch da erschien vor einer Minute ein
  Beitrag. Herr Hille, wie bewerten Sie die Zusammenarbeit mit Herrn Vučić, wenn man
  auf die Vergangenheit blickt? Wir sitzen ja jetzt hier und haben gerade eben über
  die Wahl gesprochen, die stattgefunden hat, und die neuen Mehrheiten, die sich in
  Serbien gefunden haben. Zu dieser Wahl habe ich gerade das gesagt, was ich heute
  dazu zu sagen habe. Der Kanzler hat vor Kurzem auf dem Westbalkangipfel betont,
  man müsse den Erweiterungsprozess fortsetzen. Es geht dabei um die Beitrittsverhandlungen
  der Westbalkanstaaten mit der EU. Herr Hille, hat diese Wahl möglicherweise auch
  Auswirkungen auf die Beitrittsverhandlungen? Wie es immer so ist: Dinge, die in
  der Zukunft liegen, lassen sich schwer vorhersehen. Aber klar ist, wie sich der
  Bundeskanzler auf dem Gipfel in der vergangenen Woche eingelassen hat, nämlich mit
  einer klaren Botschaft; Sie haben es zitiert. Die EU hat den Erweiterungsprozess
  in den vergangenen Monaten zurück auf Kurs gebracht und ihm neuen Schwung verliehen.
  Jetzt ist es an den Kandidatenländern, ihrerseits die nötigen Reformen zu liefern.
  Die Erweiterung hat europäische Priorität. Der Kanzler hat gesagt: Europa muss wachsen. ‑
  Für die Bundesregierung ist das ein geopolitischer Imperativ. Wichtig ist, dass
  wir konkret darüber beraten, wie wir die Beitrittsprozesse insgesamt beschleunigen
  können. Auch dazu hat der Bundeskanzler selbst schon Vorschläge unterbreitet. Das
  betrifft einerseits den Vorschlag für eine assoziierte Mitgliedschaft der Ukraine.
  Sie erinnern sich auch noch an das deutsch-französische Non-Paper zur Dynamisierung
  des Beitrittsprozesses der Westbalkanstaaten. Der Prozess ‑ auch das ist nicht neu
  für Sie ‑ läuft immer streng nach dem leistungsbasierten Ansatz, wonach individuelle
  Fortschritte jedes Kandidaten beim Beitrittsprozess ausschlaggebend sind. Das sind
  die sogenannten Kopenhagener Kriterien. Herr Hille, da Sie, wie Sie sagten, stets
  das große Ganze im Blick haben: Sowohl in Brasilien als auch in Serbien haben sich
  Parteien oder Kandidaten durchgesetzt, die sozusagen ein politisches Gegengewicht
  zu den ansonsten recht erfolgreichen rechtspopulistischen Bewegungen bilden. Erfüllt
  das die Bundesregierung mit Freude, oder nehmen Sie es nur neutral zur Kenntnis?
  Die Deutung der Wahlergebnisse überlasse ich Ihnen. Ich habe hier gerade sowohl
  zur Wahl in Lateinamerika als auch zur Wahl in Europa, in Serbien, alles gesagt,
  was ich dazu zu sagen habe. Die politische Programmatik der erfolgreichen Kandidaten
  bzw. Parteien spricht ja auch für sich. Sie deutet sich selbst, wenn man so will.
  In Serbien ist der Erfolg der Studentenpartei aus akademischen Unruhen aus Zufriedenheit
  mit dem Agieren von Regierungen hervorgegangen. Das ist, wenn man so will, ein ähnlicher
  Beweggrund, wie wir ihn auch bei Studentenprotesten in Frankreich und anderswo erlebt
  haben. Ist die Bundesregierung erfreut darüber, dass sich Unzufriedenheit mit dem
  Agieren von autoritären Staatsregierungen in demokratischer Weise eine Bahn bricht?
  Ich bin heute einmal mehr begeistert über die Kreativität Ihres Fragenangangs. Aber
  das sind nicht die Kategorien, in denen ich mich hier für die Bundesregierung bewege.
  Das alles sind Überlegungen und Schlussfolgerungen, die Sie anstellen und ziehen
  können. Aber das, was ich heute Vormittag für die Bundesregierung, für den Bundeskanzler
  zu den Wahlen zu sagen habe, habe ich gesagt. Noch einmal: Sie können es gern auch
  auf X nachlesen. Herr Hille, US-Präsident Trump hat auf einer Wahlkampfveranstaltung
  im Beisein des Audi-Chefs angekündigt, dass Audi ein neues Werk baue. Es wird scharf
  kritisiert, dass sich der Audi-Chef quasi als Wahlkampfhelfer für Trump habe einspannen
  lassen. Wie bewertet die Bundesregierung die Tatsache, dass Audi in den USA ein
  neues Werk bauen will? Neckarsulm steht ja auf der Kippe. Ich verstehe Ihr Interesse,
  bitte aber ebenso um Verständnis. Das ist, was die Investition angeht, eine unternehmerische
  Entscheidung. Was den Auftritt angeht, ist es eine Entscheidung des Audi-Chefs.
  Beide kommentiere ich deshalb von hier aus nicht. Das sind unternehmerische Entscheidungen.
  Halten Sie es für einen guten Stil des Audi-Chefs, dass er mit Herrn Trump auf einer
  Bühne steht? Nach meinem Verständnis würde das, was ich dazu sagen würde, unter
  Kommentierung fallen. Deshalb komme ich auf den ersten Hinweis zurück: Das sind
  unternehmerische Entscheidungen respektive Entscheidungen des Audi-Chefs, die ich
  von dieser Stelle aus jetzt nicht kommentiere. Herr Hille, dann muss ich aber nachfragen.
  Denn die Bundesregierung fährt ja gern Audi. Haben Sie dann nicht gewisse Ansprüche
  an das Management, was seriöses Auftreten oder vielleicht auch Loyalität angeht?
  Auch das ist ein durchaus kreativer Frageangang. Er kombiniert aber Dinge miteinander,
  die aus meiner Sicht so nicht zu kombinieren sind. Auch dafür gilt: Alles was ich
  dazu jetzt sagen würde, würden Sie in den anderen Zusammenhang rücken, und damit
  wäre es eine Kommentierung, was ich eingangs ausgeschlossen habe. Wir kommentieren
  derartige unternehmerische Entscheidungen grundsätzlich nicht. Wenn wir jede Investitionsentscheidung
  von Unternehmen hier kommentieren müssten, dann hätten wir alle, denke ich, wenig
  anderes zu tun. Sehen Sie es mir deshalb nach, dass ich es zum jetzigen Zeitpunkt
  dabei belasse. Lars Klingbeil hat wiederholt mehr Patriotismus unter deutschen CEOs,
  also DAX-Chefs, gefordert. Wie bettet sich dieser Appell in den Auftritt des Audi-Chefs
  auf der MAGA-Veranstaltung mit Trump ein? Vielleicht hat Herr Klingbeil eine Sicht
  auf diese Sache. Diesen Einzelfall würde auch ich von dieser Stelle aus jetzt nicht
  kommentieren. Wie Sie richtig gesagt haben, setzt sich Bundesfinanzminister Lars
  Klingbeil sehr stark für den Standortpatriotismus ein und setzt auch konsequent
  auf eine Politik, die die Rahmenbedingungen für den Wirtschaftsstandort Deutschland
  stärkt. Aber diesen Einzelfall würde ich, wie gesagt, jetzt von dieser Stelle aus
  ebenfalls nicht kommentieren. Wird dieser Auftritt vielleicht Konsequenzen für die
  Zusammenstellung der Dienstwagenflotte des Finanzministeriums haben? Auch dazu habe
  ich jetzt nichts anzukündigen. Herr Hille, ist es eine allgemeine Haltung des Bundeskanzlers
  oder der Bundesregierung, dass es einfach unternehmerische Entscheidungen sind,
  wenn deutsche Konzerne lieber nicht in Deutschland bauen und investieren? Auch das
  sind einige Aussagen die meines Wissens so nicht zutreffend sind. Es geht jetzt
  nicht darum, dass Produktionen, die bisher in Deutschland stattfinden, woanders
  stattfänden. Wenn ich es richtig verstehe ‑ aber das ist auch nur aus Zeitungslektüre
  erwachsen ‑, dann geht es darum, dass Dinge, die derzeit in Bratislava produziert
  werden, künftig in den USA produziert werden sollen. Aber auch das ‑ ich gehe jetzt
  nicht weiter darauf ein ‑ sind unternehmerische Entscheidungen, mit denen Unternehmen
  ihren unternehmerischen Aktivitäten nachgehen. Ich kann nur noch einmal betonen,
  dass es der Bundesregierung wichtig ist, dass Deutschland als Wirtschaftsstandort
  wettbewerbsfähig bleibt. Daran arbeiten wir, seitdem wir diese Bundesregierung im
  vergangenen Jahr übernommen haben. Es ist eines der zentralen Themen dieser Bundesregierung,
  Deutschland als wettbewerbsfähigen Industriestandort zu erhalten und die deutsche
  Automobilindustrie bestmöglich zu stärken, weil sie ein wichtiger Teil der deutschen
  Wirtschaft ist. Deshalb tun wir das. Dennoch treffen Unternehmen unternehmerische
  Entscheidungen; das ist das Wesen von Unternehmen. Aber wir werben und arbeiten
  dafür, die Bedingungen in Deutschland bestmöglich zu gestalten. Aber wenn die Stärkung
  der Wettbewerbsfähigkeit Ihr Ziel ist und sich deutsche Konzerne jetzt für offenbar
  bessere Wettbewerbsfähigkeit in anderen Ländern entscheiden, ist das dann nicht
  eine Niederlage für Ihre Politik? Auch hinsichtlich dessen, was Sie da miteinander
  verbinden: Die Antwort auf die Frage wäre ein klares Nein. Aber ich werde jetzt
  nicht weiter in eine Exegese von Gründen einsteigen, weil auch dies ja eine Kommentierung
  dessen wäre, was da stattfindet. Wir kommentieren aber keine unternehmerischen Entscheidungen
  dieser Art. Ich muss Sie an der Stelle leider unzufrieden zurücklassen. Herr Hille,
  Sie sagten, der Auftritt des Audi-Chefs sei eine unternehmerische Entscheidung gewesen.
  Das ist faktisch richtig. Gleichwohl ist der VW-Konzern ja kein Privatunternehmen
  wie alle anderen. Die öffentliche Hand hält über das Land Niedersachsen 20 Prozent
  der Anteile, eine Sperrminorität. Früher hielt auch der Bund 20 Prozent. Die sind
  dann in die VW-Stiftung eingegangen. Es gibt also auch vor dem Hintergrund der Geschichte
  von Volkswagen ja doch eine besondere Beziehung, sage ich einmal, zwischen staatlichen
  Ebenen und dem Konzern. Ist das nicht doch ein Anlass, sich über diesen dann doch
  sehr prägnanten Auftritt des Audi-Chefs in den USA Gedanken zu machen und sich auch
  dazu zu äußern? Auch das ist ein kreativer Versuch, mich dazu zu bringen, doch tiefer
  in eine Kommentierung einzusteigen. Dem werde ich ‑ sehen Sie es mir nach ‑ nicht
  nachgeben. Aber ich habe den Hinweis für Sie, da Sie ja schon die Eigentümerstruktur
  angesprochen haben, vielleicht noch einmal bei den entsprechenden Stellen ‑ in diesem
  Fall bei der Landesregierung in Niedersachsen ‑ nachzufragen, weil die in diesem
  Fall, glaube ich, die adäquateren, zielgerichteten Ansprechpartner wären. Sie haben
  nun dreimal kreative Versuche sozusagen lobend erwähnt. Das war eigentlich in jedem
  Fall der Hinweis auf Fakten, die für sich sprechen. Dann wäre es doch schön, wenn
  nicht nur die Kreativität des Versuchs in der Antwort auftaucht, sondern auch Bezug
  auf die genannten Fakten genommen wird. Es scheint mein Schicksal zu sein, dass
  ich es Ihnen nicht recht machen kann. Kritisiere ich Sie, gefällt es Ihnen nicht,
  lobe ich Sie, gefällt es Ihnen nicht. Aber es ändert nichts an dem, was ich gesagt
  habe. Dann versuche ich es, Herr Hille, unkreativ, und zwar möchte ich Sie fragen,
  ob ein Chef eines deutschen Konzerns an einem Wahlkampf teilnehmen darf, insbesondere
  an einem Wahlkampf von einem MAGA-Vertreter. Das ist eine Sache, die Sie, glaube
  ich ‑ möglicherweise kann man auch schon aus Ihrer Frage eine Antwort auf diese
  Frage erahnen ‑, selbst beurteilen können. Ich habe Ihnen für die Bundesregierung
  das gesagt, was ich zu sagen habe. Es handelt sich bei der Frage, wo das Unternehmen
  investiert und wo in diesem Fall der CEO eines Unternehmens auftritt, um eine unternehmerische
  Entscheidung. Die kommentiere ich nicht weiter. Ja, aber es geht nicht um eine Investitionsentscheidung,
  sondern darum, dass er an einem Wahlkampf teilgenommen hat. Ist das ethisch oder
  auch rechtlich erlaubt? Noch einmal: Ich lade Sie herzlich ein, das für sich zu
  beurteilen. Es ist Ihre Rolle als Journalistinnen und Journalisten, sich darüber
  ein Bild zu machen oder ein Urteil zu fällen. Das ist nicht nur legitim, sondern
  tun Sie es! Aber ich sage für die Bundesregierung das, was ich hier gesagt habe:
  Das ist eine unternehmerische Entscheidung, in diesem Fall durch den CEO von Audi,
  und deshalb kommentiere ich das nicht weiter. Ich habe zwei Fragen. Mit welchen
  Hoffnungen oder vielleicht Befürchtungen blickt die Bundesregierung auf die Wahl
  in Israel ? Wie wird sich womöglich das Verhältnis ändern? Aus Hebron imWestjordanland
  wurde in den vergangenen Tagen gemeldet, dass 2000 Palästinenser aus ihren Häusern
  vertrieben worden sind . Kritiker nennen das eine Kollektivstrafe. Wie beurteilen
  Sie das? Gibt es eine Reaktion, eine Verurteilung? Zum ersten Teil Ihrer Frage:
  Es gilt ganz klar das, was wir auch normalerweise sagen, nämlich dass diese Wahlen
  morgen stattfinden werden. Dabei stehen Politikerinnen und Politiker aus Israel
  zur Wahl. Darüber haben die Israelis zu entscheiden und nicht wir. Insofern werde
  ich das jetzt auch nicht kommentieren. Sie wissen, dass Israel ein sehr, sehr enger
