  diesen Einsatz zu liefern. Der Regierungssprecher hat damals betont ‑ er war direkt
  neben mir und ich war da auch zugegen; insofern erinnere ich mich noch sehr gut
  daran ‑, dass es dazu keine ausreichende Begründung gab. Zu den Huthi-Angriffen
  an Herrn Giese: Welche diplomatischen Schritte unternimmt Deutschland, um eine Ausweitung
  des Konflikts zu verhindern? Vielleicht erst einmal eine ganz grundsätzliche Einschätzung:
  Die Huthi agieren dort ohne jede Rücksicht auf die Zivilbevölkerung. Ganz aktuell
  zeigt sich das in der Stadt Taiz, wo durch die Belagerung der Huthi über 800 000
  Menschen eingeschlossen sind und wo Nahrungsmittel und Medikamente knapp werden.
  Wir rufen die Huthi dazu auf, unverzüglich den humanitären Zugang zur Stadt zu gewährleisten.
  Wir betrachten das nicht nur sehr genau, sondern wir sind da auch diplomatisch aktiv.
  Außenminister Wadephul hat am vergangenen Freitag in Istanbul mit seinen Amtskollegen
  aus Frankreich, Großbritannien, Italien, Ägypten, Pakistan, Saudi-Arabien und der
  Türkei auch über die Lage im Jemen gesprochen. Mitte Oktober hatte Staatsministerin
  Güler den Sondergesandten des UN-Generalsekretärs für Jemen, Hans Grundberg, zu
  einem Gespräch über die Situation empfangen und sich über weitere Unterstützungsmöglichkeiten
  für den Jemen beraten. Wir arbeiten auch weiter daran, diese Möglichkeiten für diejenigen
  umzusetzen, die da Hilfe leisten würden. Zur Frage, wer das durchführen würde: Das
  würden wahrscheinlich internationale Organisationen wie die Vereinten Nationen erledigen.
  Diese unterstützen wir in einem sehr, sehr breiten Umfang. Es wird auch daran gearbeitet,
  diesen Umfang noch zu vergrößern. Es ist aber natürlich an den Huthi, diesen humanitären
  Zugang zu ermöglichen; den können sich die Vereinten Nationen nicht erkämpfen. Unterstützt
  die Bundesregierung die heutigen Gespräche in Teheran? Wir haben davon Kenntnis
  und wir werden schauen, was dabei herauskommt. Frau Lorenzat, zum Thema Gasspeicherfüllstände
  : Bald ist ja der 1. November. Die Füllstandsvorgaben sehen für den 1. November
  70 Prozent vor. Die Gassprecher sind aktuell zu 62 Prozent gefüllt. Das heißt, dieses
  Ziel wird aller Voraussicht nach verfehlt werden. Was sind jetzt die Konsequenzen?
  Wie Sie wissen und wie wir hier verschiedentlich schon ausgeführt haben, beobachten
  wir die Lage eng und sind mit allen Akteuren im Austausch. Sowohl wir als auch die
  Netzagentur als auch die Verteilnetzbetreiber und die EU-Kommission erwarten für
  diesen Winter keine Gasmangellage. Die Speicher sind Stand heute zu 62 Prozent gefüllt,
  die Speicherbuchungen liegen bei 84 Prozent. Ich möchte auch noch einmal darauf
  hinweisen, dass zur Beurteilung der Versorgungssicherheit eben nicht nur die Speicherfüllstände
  relevant sind, sondern eben auch laufende Importe, die verfügbaren Infrastrukturen
  und die Lage im Markt. Der Markt ist zwar volatil, aber er ist eben auch liquide.
  Dabei würde ich es belassen. Die Ministerin hatte Anfang Oktober das bundeseigene
  Unternehmen SEFE angewiesen, vermehrt Erdgas einzuspeichern. Das ist offensichtlich
  nicht in ausreichender Menge passiert. Oder wie bewerten Sie den jetzigen Füllstand
  von nur 62 Prozent? Ich habe mich ja gerade dazu geäußert, wie ich den bewerte.
  Planen Sie weitere Maßnahmen für den Fall, dass es doch noch knapp werden sollte?
  Es gibt ja zum Beispiel die Möglichkeit, kurzfristige Ausschreibungen zu starten.
  So wie wir das in der Vergangenheit auch getan haben, beobachten wir den Markt.
  Handlungsoptionen haben wir in der Hinterhand, sofern sie gezogen werden müssen.
  Zum jetzigen Stand habe ich mich gerade aber geäußert. An Frau Dr. Noack oder Herr
  Giese: Nach den jüngsten Verstimmungen zwischen Deutschland und dem Iran und der
  jeweiligen Einbestellung der Botschafter jeweils in der vergangenen Woche, gab es
  am Wochenende Meldungen, dass der Iran jetzt auch militärischen Einrichtungen oder
  Niederlassungen Deutschlands in der Region drohen möchte. Wenn einem da überhaupt
  etwas einfällt, dann in allererster Linie Jordanien. Wie ernst nehmen Sie diese
  Drohungen, dass die Bundeswehrsoldaten in der Region zum Ziel möglicher iranischer
  Angriffe werden könnten? Grundsätzlich kommentieren wir das nicht. Allgemein kann
  ich Ihnen sagen, dass wir die Lage ganz genau beobachten, vor allen Dingen in den
  Bereichen, in denen wir eigene Truppen haben. Für den Fall, dass die eigene Truppe
  möglicherweise einer höheren Gefährdungslage ausgesetzt ist ‑ das hat es im Rahmen
  der Krise im Nahen und Mittleren Osten tatsächlich schon gegeben ‑, gibt es Protokolle
  und Vorgaben, wie die Soldatinnen und Soldaten zu schützen sind. Ansonsten haben
  wir dazu erst einmal nichts Weiteres beizutragen. Sie können sich aber sicher sein,
  dass wir die Lage sehr genau beobachten. Gibt es dazu auch etwas von Ihrer Seite,
  Herr Giese? Sie haben zu der Sicherheit der Angehörigen der Bundeswehr gefragt,
  die da vor Ort sind, und die Sprecherin des BMVg hat sich dazu gerade geäußert.'
