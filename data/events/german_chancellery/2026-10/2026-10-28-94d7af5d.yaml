title: Im Kabinett beschlossen Schutz der kritischen Infrastruktur wird verstärkt
text: 'Auch Personen, die sich mit der Warninfrastruktur für Krisen und Katastrophen
  befassen, sollen in Zukunft sicherheitsüberprüft werden. Foto: picture alliance/dpa/Rolf
  Vennenbernd Seit dem völkerrechtswidrigen Angriffskrieg Russlands gegen die Ukraine
  hat sich auch in Deutschland die Sicherheitslage verschärft. Die Bedrohung Deutschlands
  durch hybride Angriffe ist gestiegen und damit auch die Bedrohung der Sabotagehandlungen
  sogenannter Innentäter. Die Bundesregierung misst dem Schutz der kritischen Infrastruktur
  sehr hohe Bedeutung zu. Sie hat deshalb die Verordnung zur Neufassung der Sicherheitsüberprüfungsfeststellungsverordnung
  als Sabotageschutzverordnung des Bundes beschlossen. Konkret werden Regelungen zu
  weiteren Wirtschaftszweigen und Anwendungsfällen lebenswichtiger Einrichtungen in
  die Verordnung aufgenommen. Mit dieser Maßnahme gegen hybride Bedrohungen stärkt
  die Bundesregierung den Schutz vor Sabotage durch potentielle Täter von innen und
  erhöht die Resilienz kritischer Infrastruktur. Mit dem gleichen Ziel hat die Bundesregierung
  ebenfalls die Erste Verordnung zur Änderung der Sicherheitsüberprüfungsfeststellungsverordnung
  auf den Weg gebracht hat. Vorgesehen ist, dass künftig auch das mit der Warninfrastruktur
  für Krisen und Katastrophen befasste technische Personal in Landesrundfunkanstalten
  sicherheitsüberprüft wird. Weitere Informationen zur R eform des Sicherheitsüberprüfungssystems
  finden Sie beim Bundesministerium des Innern.'
