title: Tag der Deutschen Einheit 2026 Die Bundesregierung zu Gast in Bremen
text: 'Im Dialog mit Bundesverteidigungsminister Boris Pistorius ging es unter anderem
  um den Wehrdienst und die Sicherheit Deutschlands. Mit der Bundesregierung sprechen,
  statt über sie: Rund um den Tag der Deutschen Einheit war das in Bremen möglich.
  Dort präsentierten sich vom 2. bis 4. Oktober die Bundesministerien in vier großen
  Zelten in der Nähe des Weserstadions. Außerdem standen viele Bundesministerinnen
  und -minister – wie Bundesverteidigungsminister Pistorius, Bundesfinanzminister
  Klingbeil, Bundesjustizministerin Hubig, Bundesumweltminister Schneider und Kanzleramtschefin
  Warken – sowie weitere spannende Gäste im Dialogforum der Bundesregierung Rede und
  Antwort. Am Sonntagvormittag, dem dritten Tag des Bürgerfests, erklärte die Ostbeauftragte
  der Bundesregierung, Elisabeth Kaiser, beim Dialogforum, dass man die „Ost-West-Debatte“
  aus ihrer Sicht so lange weiterführen werde, „bis wir anerkennen, dass die Ostdeutschen
  eine enorme Wucht an Transformation durchgemacht haben“. Es gebe außerdem in ostdeutschen
  Regionen immer noch Nachholbedarf. So seien viele Regionen wirtschaftlich schwächer
  als westdeutsche. Zudem seien Ostdeutsche in Führungspositionen meist noch unterrepräsentiert.
  Man müsse vor allem wegkommen von verallgemeinernden Zuschreibungen „des blauen
  Ostens“, sagte die Journalistin Marieke Reimann. So fasse man in den Medien häufig
  die Landtagswahlen in „die Ostwahlen“ zusammen. In ihrem Buch spricht sie deshalb
  von einer „zweiten Wende“, die in der Wahrnehmung West- und Ostdeutscher stattfinden
  müsse. Die Bundesbeauftragte für die Opfer der SED -Diktatur, Evelyn Zupke, erklärte,
  dass viele Opfer der SED -Diktatur auch unter Altersarmut leiden. Viele wünschten
  sich lieber den Begriff „Ehrenrente“ anstatt „Opferrente“, um ihren Mut anzuerkennen.
  Teil der Opfer-Rehabilitierung sei es, die eigenen Stasi -Akten einzusehen, die
  im Bundesarchiv lagern, so Zupke. Die insgesamt 111 km SED -Akten machten ein Sechstel
  des Bestands des gesamten Bundesarchivs aus, erklärte der Präsident des Bundesarchivs,
  Michael Hollmann. Gitta Connemann, Parlamentarische Staatssekretärin des Bundesministeriums
  für Digitales und Staatsmodernisierung, betonte im Dialog am Sonntag, wie wichtig
  es sei, Gründerinnen und Gründern Mut zu machen. Jedes Abenteuer könne Scheitern,
  aber man müsse weiter nach vorne schauen. Das Bundesministerium plane außerdem,
  Gründungen mit einem Gründungsbeschleunigungsgesetz einfacher zu machen. Ziel sei
  es, Gründungen in 24 Stunden möglich zu machen – für den Tischler wie für den Forscher.
  Zudem sprachen Generalleutnant Christian Freuding und der Leiter des Bereichs Cyber
  Innovation der Bundeswehr, Sven Weizenegger, über Innovationen beim Thema Sicherheit
  und Verteidigung sowie über die Rolle der Ökonomie des Krieges. Für weitere thematische
  Abwechslung sorgten außerdem ein Gespräch mit dem ehemaligen Werder Bremen-Profi
  Tim Borowski und der Auftritt des Zolls, der präsentierte, wie seine Hunde bestimmte
  Gegenstände „erschnüffeln“. Dieser wird mit einer Zollaktion am Abend das Bühnenprogramm
  schließen. Hier finden Sie das gesamte Bühnenprogramm der Bundesregierung für den
  Tag der Deutschen Einheit 2026 in Bremen. Bundeskanzler Friedrich Merz besuchte
  am Vormittag des 3. Oktobers die Feierlichkeiten zum Tag der Deutschen Einheit.
  Empfangen wurde er – genau wie die Repräsentantinnen und Repräsentanten der anderen
  Verfassungsorgane – vom Bremer Bürgermeister Andreas Bovenschulte. Auf dem Weg zum
  Gottesdienst im St. Petri Dom kam der Bundeskanzler mit Bürgerinnen und Bürgern
  ins Gespräch. Das Dialogforum startete am Tag der Deutschen Einheit mit Bundesverteidigungsminister
  Boris Pistorius. Das große Besucherinteresse spiegelte sich in der Vielzahl der
  Fragen wider. So fragte ein 16-jähriger Besucher, warum die Politik mit dem Wehrdienst
  über die Jugend entscheiden würde. Der Verteidigungsminister betonte, dass der Wehrdienst
  freiwillig sei. Dennoch seien es Menschen, die allein die Verantwortung für das
  Land übernehmen könnten, denn „ohne Sicherheit ist alles andere nichts“. Auf die
  Frage, ob es mit den derzeitigen Konflikten nicht Zeit für eine europäische Armee
  sei, antwortete Pistorius: „ Es braucht nicht die eine große europäische Armee,
  weil wir die NATO haben.“ Diese sei das erfolgreichste Verteidigungsbündnis weltweit
  und es gelte deshalb, sie weiter zu stärken. Bundesfinanzminister Lars Klingbeil
  erläuterte am Samstag unter anderem, warum das Sondervermögen Infrastruktur Deutschland
  „gut tut“: „Wir schaffen damit neue Orte, die dann allen gehören. Und das wird unser
  Land positiv verändern, da bin ich ganz sicher.“ Der Vizekanzler formulierte außerdem
  seine Zukunftsvision für Deutschland: „Dass Deutschland weiterhin so ein starkes
  Land bleibt wie es ist“. Er bitte alle, dabei mitzuhelfen. Es gehe in den nächsten
  Jahren um viel. Bundesjustizministerin Stefanie Hubig betonte im Dialogforum, dass
  der Schutz von Frauen vor Gewalt „keine Frauenangelegenheit, sondern eine gesamtgesellschaftliche
  Angelegenheit“ sei. Zum Thema Wohnen und Mieten erwiderte die Justizministerin,
  dass sich die Bundesregierung beispielsweise gegen Mietwucher einsetze. Sie wünsche
  sich außerdem für alle Kinder in Deutschland, dass sie das gleiche Privileg wie
  ihre Generation haben und in einem friedlich-freiheitlichen Rechtsstaat groß werden
  könnten. Den Auftakt im Dialogforum der Bundesregierung machte am 2. Oktober die
  Chefin des Bundeskanzleramtes, Nina Warken. Diese erklärte zunächst, was es eigentlich
  mit den „besonderen Aufgaben“ einer Kanzleramtschefin auf sich hat. Dabei handele
  es sich vor allem um Themen, die ressortübergreifend zusammenfließen: beispielsweise
  KI , Sicherheit, Innovation. Als besonderes Anliegen der Bundesregierung nannte
  Warken außerdem, Chancengerechtigkeit, Wohlstandsversprechen und Sicherheitsgarantien für
  die junge Generation einzuhalten. Auf Nina Warken folgte am Freitagabend Bundesumweltminister
  Carsten Schneider. Auf die Frage, was man gegen Extremwetter tun könne, entgegnete
  Schneider: „Die Natur passt sich nicht uns an, wir müssen uns ihr anpassen.“ Deshalb
  stehe bei ihm der Klimaschutz ganz oben. Den Vorteil in erneuerbaren Energien sehe
  der Umweltminister darin, dass man mit ihnen „sauber und unabhängig“ sei. Deshalb
  setze er auch ein klares Signal für Elektromobilität. Wer weniger diskutieren wollte,
  sondern mehr nach Unterhaltung suchte, war bei dem Auftritt der Bundesregierung
  auf dem Bürgerfest in Bremen ebenfalls willkommen.'
