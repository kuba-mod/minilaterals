title: Bundeskanzler Merz in Kyjiw „Auf unsere Hilfe könnt ihr weiter zählen“
text: 'Bundeskanzler Merz und der ukrainische Präsident Selenskyj am Nationalen Gedenkort
  für gefallene Soldaten. Bundeskanzler Friedrich Merz ist nach Kyjiw gereist und
  hat dort den ukrainischen Präsidenten Selenskyj getroffen. In einer gemeinsamen
  Pressekonferenz betonte der Bundeskanzler, dass Deutschland ein verlässlicher Partner
  bleibe – auch in schwierigen Zeiten. „ Die deutsche Bevölkerung steht hinter der
  Ukraine, und die deutsche Regierung steht hinter der ukrainischen Regierung. Wir
  werden alles tun, um der Ukraine zu helfen, bis dieser schreckliche Krieg endlich
  zu Ende ist“, sagte Merz. Begleitet wurde der Kanzler von Bundeswirtschaftsministerin
  Katherina Reiche und einer Wirtschaftsdelegation. Der Kanzler betonte, dass er mit
  seinem Besuch ein Zeichen setzen wollte, in einer Zeit, die nicht nur für die Zukunft
  der Ukraine entscheidend sei, sondern für die Zukunft Europas. „Die Ukraine will
  Frieden; Deutschland will Frieden; ganz Europa will Frieden“, sagte der Kanzler.
  Dieser Friede müsse verhandelt werden, er dürfe nicht diktiert werden, er dürfe
  nicht der Ukraine diktiert werden und er dürfe auch nicht Europa diktiert werden.
  Nach seiner Ankunft hatte der Kanzler betont: „ Ich bin heute nach Kyjiw gereist,
  weil die Ukraine für die kommenden Wochen all unsere Unterstützung braucht. Wenn
  Russland nicht gestoppt wird, richtet sich seine Kriegsmaschinerie früher oder später
  gegen uns.“ Bald beginne für die Menschen in der Ukraine der fünfte Kriegswinter.
  „Russland bombardiert Städte, Wohnhäuser und Heizkraftwerke. Die Ukrainer lassen
  sich durch den Terror nicht unterkriegen“, so der Kanzler. Er wolle Präsident Selenskyj
  heute sagen: „Auf unsere Hilfe könnt ihr weiter zählen.“ Die Partnerschaft mit der
  Ukraine sei dabei keine Einbahnstraße: „Deutsche und ukrainische Unternehmen entwickeln
  gemeinsam Technologien, von denen beide Länder profitieren. Das macht uns sicherer
  und stärker.“ Humanitäre, finanzielle und militärische Hilfe: Die Ukraine als starker,
  demokratischer und souveräner Staat ist von zentraler Bedeutung – auch für die Sicherheit
  Deutschlands. Deshalb steht die Bundesregierung solidarisch an der Seite des Landes.
  Hier finden Sie Informationen, wie Deutschland die Ukraine unterstützt.'
