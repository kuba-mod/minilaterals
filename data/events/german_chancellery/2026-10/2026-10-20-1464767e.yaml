date: '2026-10-20'
type: press_release
source_name: german_chancellery
title: Pressestatements nach dem Investitionsgipfel der Bundesregierung Schlüssel
  für die Zukunft Deutschlands
text: 'Die Bundesregierung werde die Bedingungen für Investitionen in Deutschland
  weiter verbessern, kündigte der Kanzler nach dem „Invest in Germany“-Summit an.
  Bundeskanzler Friedrich Merz hat in einem Pressestatement nach dem „ Invest in Germany-Summit
  “ der Bundesregierung in Berlin ein positives Fazit gezogen. Es sei „sehr gut gelungen“,
  ein starkes Signal des Willkommens an alle diejenigen zu geben, die in Deutschland
  investieren wollen. Gleichzeitig betonte er, dass der Gipfel nur der Startpunkt
  war: „Wir werden das wiederholen und weiter um Investoren in Deutschland werben.“
  Wachstum und Modernisierung seien eine Daueraufgabe für alle. Bundesfinanzminister
  Lars Klingbeil unterstrich nach vielen Gesprächen mit Investoren aus dem Ausland:
  „Deutschland ist zurück“. Man könne positiv auf das bisher Erreichte sehen – etwa
  die Reform der privaten Altersvorsorge . Gleichzeitig gelte es, die verabredeten
  Strukturreformen erfolgreich umzusetzen. Auch Bundeswirtschaftsministerin Katherina
  Reiche betonte, dass Deutschland ein attraktiver Standort sei: „Wir können auf unsere
  Stärken bauen.“ Es sei wichtig gewesen, dass beim Gipfel ein Bild der Geschlossenheit
  zu sehen war – auch gemeinsam mit den Ländern. Meine Damen und Herren! Herzlich
  willkommen zu unseren Pressestatements. Ich will zunächst einmal sehr herzlich den
  Kolleginnen und Kollegen in der Bundesregierung – Katherina Reiche, Lars Klingbeil
  – sowie meinem Team im Kanzleramt für die Vorbereitung dieser ersten Investorenkonferenz
  danken, die wir in dieser Form in Deutschland noch nie gemacht haben. Ich will mich
  aber auch bei allen denjenigen bedanken, die auf den Panels gesessen haben, die
  moderiert haben und last, but not least, auch bei den Vertretern der Länder, den
  Ministerpräsidentinnen und Ministerpräsidenten, den Mitgliedern der Landesregierungen,
  die teilgenommen haben. Wir schauen auf eine, wie ich finde, sehr erfolgreiche Investorenkonferenz
  zurück. Wir wollten ein starkes Signal des Willkommens an alle diejenigen geben,
  die in Deutschland investieren wollen. Ich finde, das ist uns sehr gut gelungen.
  Das ist das Ergebnis einer sehr guten Vorbereitung. Noch einmal: Dank an Katherina
  Reiche, aber auch an Martin Blessing, der ja seit dem letzten Jahr auch in meinem
  Auftrag mit den Investoren in der ganzen Welt spricht. Sechs Bundesministerinnen
  und Bundesminister sind vor Ort, dazu die Länder mit ihren Ministerpräsidenten.
  Das alles zeigt: Die politische Spitze unseres Landes kümmert sich um das Land.
  Wir verfolgen alle dasselbe Ziel. Wir sind entschlossen, Deutschland einen großen
  Schub zu geben. Insgesamt sind bis heute von diesen Investoren, die wir gesehen
  und mit denen wir gesprochen haben, rund 230 Milliarden Euro an Investitionen zugesagt
  worden. Ich will Beispiele nennen: Allein Amazon hat ein Investitionsvolumen von
  16 Milliarden Euro verkündet. Schon gestern haben wir von den massiven Investitionsplänen
  von Nvidia gehört. RWE, die Schwarz Gruppe, Blackstone, Microsoft, Sanofi – die
  Liste ist lang und umfangreich. Deutschland ist ein guter Standort für Investitionen
  und für die Unternehmen aus der ganzen Welt. Ich bin den Investoren für ihr Vertrauen
  in unser Land dankbar. Dieses Vertrauen werden wir honorieren. Deutschland bleibt
  ein zuverlässiger Investitionsstandort. Wir wollen und wir werden diesem Vertrauen
  gerecht werden. Die Bundesregierung wird die Bedingungen für Investitionen in Deutschland
  weiter verbessern, zum Beispiel durch weniger Bürokratie, durch schnellere Genehmigungen,
  durch eine bessere Infrastruktur. Das sage ich besonders vor dem Hintergrund der
  Diskussion um eine neue Landesregierung hier in der Hauptstadt. Der Schutz des Eigentums
  und das Vertrauen in den funktionierenden Markt sind tief in unserer wirtschaftspolitischen
  Überzeugung verankert. Das ist das Fundament unserer marktwirtschaftlichen Ordnung,
  und damit experimentiert man nicht. Warum sprechen wir über Investitionen in Deutschland?
  Warum ist das alles so wichtig? Nun: Investitionen sind ein wichtiger Schlüssel
  für die Zukunft unseres Landes, für Wachstum und Wettbewerbsfähigkeit unseres Landes.
  Denn damit einher gehen mehr Arbeitsplätze, mehr Produktion, mehr Dienstleistungen,
  mehr Zukunft für unsere Kinder und Enkelkinder. Diese Investitionen schaffen Wachstum.
  Nur so kann eine Volkswirtschaft blühen, und nur so können wir die Bundesrepublik
  Deutschland insgesamt am Laufen halten. Investitionen ermöglichen es, unsere Infrastruktur
  von der Straße bis zur Schule auszubauen, sodass wir alle hier in Deutschland gut
  leben können. Genau das ist der Grund, warum die Konferenz heute nur der Anfang
  war. Wir werden das wiederholen und weiter um Investoren in Deutschland werben.
  Wachstum und Modernisierung sind eine Daueraufgabe für uns alle. Meine Damen und
  Herren, last, but not least : Wir haben sehr viel Zustimmung bekommen – Lars, ich
  glaube, ich darf das auch in deinem Namen sagen, auch in deinem Namen, Katherina
  – für unsere Pläne für eine große Reform der Alterssicherungssysteme. Ich habe das
  in meinem Schlusswort gerade so gesagt: Wir machen aus einem Land der Sparer ein
  Land der Investoren. Dabei geht es nicht nur um einige große Namen, das sind alle.
  Das sind vor allem Kinder, das sind Jugendliche, das sind Heranwachsende, das sind
  junge Erwachsene, das sind Erwachsene, die jetzt alle eine Chance bekommen, an dem
  Aufschwung teilzunehmen, den wir in Deutschland nehmen wollen und den wir nehmen
  werden. Dem dient gerade unsere Reform des Alterssicherungssystems, damit wir Deutschland
  auf die Basis eines neuen Systems stellen, in dem alle Menschen in Deutschland,
  vor allen Dingen diejenigen, die für ihr Alter sparen wollen, Investoren werden
  und am Wachstum unserer Volkswirtschaft teilnehmen können. Ich sage das mal aus
  meiner Sicht, auch als Parteivorsitzender der CDU: Das letzte Versprechen der christlichen
  Sozialordnung wird eingelöst, nämlich die Vermögensbildung für alle. Das machen
  wir über diese Reform möglich, die wir jetzt beherzt angehen. Wir hoffen, dass wir
  sie noch in diesem Jahr im Kabinett verabschieden und auf den parlamentarischen
  Beratungsweg bringen können. Ich fühle mich jedenfalls durch die vielen Gespräche
  und Ermutigungen, die ich erfahren habe, auf diesem Weg mehr als nur bestätigt,
  dass wir genau das machen müssen. Denn es geht hier nicht nur um das Alterssicherungssystem,
  sondern auch um den Investitionsstandort und den Kapitalmarkt Deutschland, und den
  wollen wir gemeinsam voranbringen. – Vielen Dank. Auch von mir herzlich willkommen!
  Ich muss sagen: Ich fand das auch sehr gut heute. Das war ein guter Summit. Ich
  bin sehr dankbar – dir, Katherina, Herrn Blessing, dem Team im Kanzleramt und allen
  anderen in der Bundesregierung, die das vorbereitet haben. Ich will Ihnen auch sagen,
  sehr geehrte Damen und Herren: Das kommt dann mit dem Eindruck zusammen, den ich
  in der letzten Woche in Bangkok auf der Tagung von IWF und Weltbank gewinnen konnte.
  Der Blick auf Deutschland ändert sich. Es ist gut, sich bewusst zu machen, dass
  der Blick auf Deutschland ein Stück weit ein ganz anderer ist als der Blick, den
  wir in Deutschland auf unser Land haben. Sich das zu vergegenwärtigen, ist ganz
  gut. Das war das Feedback – zumindest kann ich das für mich sagen – , das ich heute
  in den Sessions, aber auch in vielen bilateralen Gesprächen am Rande bekommen habe:
  Es passiert etwas in Deutschland. – Ich würde sogar sehr klar sagen: Deutschland
  ist zurück. Wir sehen das Wachstum; wir sehen, dass die Investitionen in unserem
  Land greifen. Ich werde morgen wieder im Land unterwegs sein, um auch zu schauen,
  wo das Sondervermögen in unserem Land ankommt, wo die Investitionen unser Land verändern
  und wo sich etwas bewegt. Das bekommt man heute auf der Konferenz, gestern Abend,
  aber auch vergangene Woche in Bangkok gespiegelt. Ich finde, es ist eine sehr positive
  Nachricht für unser Land, dass wir zurück auf einem Wachstumspfad sind. Das heißt
  übrigens nicht, dass wir uns ausruhen dürfen. Das will ich hier sehr klar sagen.
  Zurücklehnen ist nicht! Wir müssen uns weiterhin anstrengen. Wir müssen Strukturreformen,
  wir müssen Bürokratieabbau, wir müssen andere Maßnahmen, die wir verabredet haben,
  jetzt in unserem Land erfolgreich durchbringen, und wir müssen uns dafür anstrengen.
  Aber wir können auch ein bisschen positiv sehen, was wir erreicht haben und – ich
  wiederhole es – wie sich der Blick auf unser Land gerade verändert. Wir sehen, dass
  die Zahl der Gründungen zunimmt. Wir hatten allein im Jahr 2026 zehn neue Einhörner
  in Deutschland. Das zeigt auch, dass wir es hinbekommen, in der Wachstumsfinanzierung
  besser zu werden. Es muss das große Ziel sein, dass erfolgreiche Start-ups unser
  Land nicht verlassen, sondern dass sie hier in Deutschland wachsen können. Ich will
  noch zwei Themen nennen, die heute in meinen Gesprächen immer wieder eine Rolle
  gespielt haben. Das eine Thema ist in der Tat die Reform der privaten Altersvorsorge.
  Wir haben in der dritten Säule reformiert. Das haben wir übrigens ziemlich geräuschlos
  getan. Zwei Regierungen vor uns haben das nicht hinbekommen. Wir haben in der vergangenen
  Woche die Frühstartrente im Deutschen Bundestag verabschiedet. Das mag mancher belächeln,
  zehn Euro im Monat. Aber ich sage Ihnen: Das verändert eine politische Kultur in
  diesem Land. Das verändert die Kultur der Sparbücher, die wir bisher haben, hin
  zu einer Kultur der Kapitalmärkte. In den Familien wird künftig über diese Fragen
  geredet werden. Das einhellige Feedback in allen Gesprächen, die ich geführt habe,
  war: Das wird unser Land mittelfristig massiv verändern, und zwar hin zum Positiven.
  Ein weiterer Punkt, der heute eine Rolle gespielt hat, ist der, dass die Erwartung
  an uns in Deutschland ist, der Treiber in Europa zu sein. Ich für meinen Teil kann
  sagen, dass ich das mit dem E6-Format angefangen habe. Wir haben es in neun Monaten
  hinbekommen, das Marktintegrations- und Aufsichtspaket unter den europäischen Finanzministern
  zu verabschieden. Neun Monate, das mag manchem sehr lang erscheinen, aber wenn man
  sich die europäischen Prozesse anschaut, dann sieht man, dass das schon ein hohes
  Tempo ist. Wenn es nach mir ginge, dann dürfte es immer noch schneller gehen. Wir
  wollen jedenfalls der Treiber bei der Kapitalmarktunion sein. Wenn wir das zusammenfassen,
  dann sind wir in Europa der zweitgrößte Wirtschaftsraum der Welt. Wenn wir diesen
  Druck in Europa aufrechterhalten – ich weiß, dass das auch dem Bundeskanzler ein
  großes Anliegen ist -- und wenn wir dabei vorangehen, dann wird das hier alles etwas.
  Dass Deutschland zurück ist, ist für mich ein wichtiges Zeichen. Es ist die klare
  Botschaft: Wir strengen uns weiterhin an, aber wir können heute auch positiv auf
  das schauen, was wir bereits erreicht haben. Sehr geehrter Herr Bundeskanzler, sehr
  geehrter Herr Bundesfinanzminister, lieber Lars, meine Damen und Herren, mit dem
  ersten Investitionsgipfel, den eine Bundesregierung jemals veranstaltet hat, setzen
  wir ein klares Willkommenssignal. Investitionen sind willkommen, egal ob sie von
  institutionellen Anlegern oder von Unternehmen kommen, die hier in Fabriken und
  in Ausrüstung investieren. Die Mischung aus Unternehmen aus Deutschland und aus
  dem internationalen Ausland hat deutlich gemacht, dass wir ein attraktiver Standort
  sind. Bei allen Herausforderungen, denen aber, denke ich, fast alle Demokratien
  gegenüberstehen, können wir auf unsere Stärken bauen. Sie liegen darin, dass unsere
  Finanzen Gott sei Dank noch solide sind. Denn das Verhältnis zwischen Staatsverschuldung
  und Wachstum ist besser als in anderen Staaten. Es gilt darauf zu achten, dass das
  so bleibt. Zweitens: ein stabiler Rechtsrahmen. Wir sehen, was Unsicherheit auslösen
  kann. Insofern bin ich dem Bundeskanzler dankbar dafür, dass er eben noch einmal
  deutlich gemacht hat, dass private Investitionen zu schützen sind. Enteignungen
  kommen für uns nicht infrage. Wer investiert, muss sicher sein, dass sein Investment
  bei ihm bleibt. Wir haben eine starke industrielle Basis. Neben dem von Lars Klingbeil
  und vom Bundeskanzler erwähnten positiven Feedback, möchte ich ein Drittes hinzufügen.
  Das ist unser starker Mittelstand. Das ist etwas, was andere Länder in dieser Form
  nicht haben, nämlich ein über Jahrzehnte aufgebautes Domänenwissen in industriellen
  Prozessen. Wir wissen, wie eine Turbine funktioniert. Wir wissen, wann Material
  verschleißt. Wir wissen, wie ein Auto im Detail gebaut wird und wie ein ganz spezielles
  Gut, für das es einen schmalen, aber internationalen Markt gibt, gefertigt wird.
  Dieses Wissen, über Jahrzehnte in Familienunternehmen, aber auch in großen Konzernen
  aufgebaut, ist es, was wir in die neue Welt, die durch künstliche Intelligenz dominiert
  wird, transformieren können und auch müssen. Unsere Industriequote von noch 20 Prozent
  ist dafür eine gute Basis. Wir arbeiten daran, sie weiter erhöhen zu können. Time
  is money , Zeit ist Geld. Beschleunigung von Genehmigungen, Abbau von Bürokratie,
  das ist ein Dauerthema, dem wir uns aber auch stellen. Energiekosten und die Reformen
  sind ein Thema. Mir war wichtig, dass wir heute nicht nur ein Bild der Geschlossenheit
  abgegeben haben, sondern dass wir heute Team Deutschland waren, zusammen mit den
  Bundesländern. Denn am Ende kommt das, was wir jetzt an imposanten Investitionszusagen
  haben, irgendwo an, und das ist meist ein Bundesland, eine Kommune, ein Landkreis.
  Ich bin dankbar dafür, dass über die anderthalb Tage nicht nur eine hohe Präsenz,
  sondern auch ein Commitment da war, an einem Strang zu ziehen. Wir werden unseren
  Standort weiterhin in der Welt bewerben müssen. Denn die Konkurrenz schläft nicht.
  Auch andere Staaten haben sehr erfolgreiche und auch erste Investitionsgipfel veranstaltet.
  Das heißt, wir befinden uns in einem Wettbewerb um Kapital. Insofern sind die nächsten
  großen Konferenzen wie die Asien-Pazifik-Konferenz oder unser Deutsches Haus, das
  wir in Davos erstmals anbieten werden, ein weiteres gutes Zeichen dafür, dass es
  nicht bei dieser einen Konferenz bleibt, sondern dass wir in einen kontinuierlichen
  Austausch mit Investoren gehen, auf dass wir das Wachstum in unser Land zurückbekommen.'
