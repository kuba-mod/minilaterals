title: 'Bundeskanzler Merz anlässlich des 3. Jahrestags des 7. Oktobers 2023:'
text: „Am heutigen Jahrestag der furchtbaren Hamas-Terroranschläge vom 7. Oktober
  2023 sind unsere Gedanken bei den Opfern und ihren Hinterbliebenen, den Überlebenden
  und den ehemaligen Geiseln. Wir gedenken der Toten. Wir trauern mit den Hinterbliebenen.
  Und wir hoffen, dass der tiefe Schmerz und die Wunden, die dieser Tag, die diese
  monströsen, barbarischen Taten geschlagen haben, heilen können. Deutschland steht
  fest an der Seite Israels. Unsere israelischen Freunde können auf unseren Einsatz
  zählen, damit sich ein solches Verbrechen niemals wiederholt. Wir stehen für die
  Sicherheit und Existenz Israels ein – das ist Lehre aus der Shoah und Teil deutscher
  Identität. Es muss nun darum gehen, das Fundament einer neuen Ordnung zu legen,
  in der Israelis, Palästinenser und ihre Nachbarn in Frieden und Sicherheit leben
  können. Dafür setzt sich die Bundesregierung ein. Unserer Überzeugung nach ist dieses
  Ziel am besten durch die Gründung eines palästinensischen Staates an der Seite Israels
  zu erreichen. In Deutschland erleben wir heute einen zunehmenden Antisemitismus,
  der viel zu oft unwidersprochen bleibt. Die Bundesregierung wird alles in ihrer
  Macht Stehende tun, um Antisemitismus in all seinen neuen und alten Formen konsequent
  zu bekämpfen. Jüdinnen und Juden müssen in ganz Deutschland ohne Angst leben können.
  Jüdisches Leben muss sich in unserer Gesellschaft weiter entfalten können. Deshalb
  gehen wir gegen antisemitische Vorfälle und Angriffe mit aller Entschlossenheit
  vor. Und wir treten denjenigen entgegen, die das Existenzrecht Israels relativieren
  oder gar in Frage stellen. Nicht nur am 7. Oktober, sondern jeden Tag.“
