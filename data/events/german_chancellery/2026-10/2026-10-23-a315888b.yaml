title: Bundesregierung aktuell
text: 'Berlin steckt voller subtiler Symbolik, die nur eine Stadt bieten kann, die
  durch die Wechselbäder der Geschichte gezogen wurde. Zum Beispiel das Kraftwerk
  Mitte mit seiner einhundert Meter langen Turbinenhalle, der brutalistischen Betonästhetik
  der 60er Jahre, in der sich heute Techno-Clubs und die Design-Szene zuhause fühlen.
  Einst wurde hier die Stadt unter Strom gesetzt, heute ist das Kraftwerk schon dank
  seines Namens der ideale Austragungsort für eine Premiere der Bundesregierung: die
  Eröffnung der ersten Investorenkonferenz, die mehr als 200 Unternehmer und Führungskräfte
  aus der Finanzbranche weltweit angelockt hat. Kraft und Werk – darum geht es. Deutschland
  hat die Kraft und die Dynamik, dank seiner gesunden industriellen Basis den Sprung
  in das nächste Industriezeitalter zu machen. Und mit Werkstücken der feinen und
  besonderen Art kennt sich das Land des Mittelstands, der Handwerker und der Hidden
  Champions besonders gut aus. Für den nächsten industriellen Quantensprung, für die
  eigene, industrielle KI und die datenzentrierte Wertschöpfungskette benötigt das
  Land Investoren. Zu bieten hat es: Verlässlichkeit, Ausdauer, hart arbeitende und
  gut ausgebildete Menschen und vor allem die Stabilität und Sicherheit eines Rechtsstaats
  mit funktionierender Marktwirtschaft in einer zunehmend instabilen Welt. Wo wäre
  das besser zu bewundern als am zweiten Austragungsort der Investoren-Konferenz,
  der Wirtschafts-Hochschule ESMT – einem Gebäude, das in seinem alten Leben den Ministerrat
  der DDR beherbergt hat. Die realsozialistische Glasmalerei oder der Kachelfries
  mit tanzenden Bäuerinnen und marschierenden Arbeitern zeugen davon, was am Ende
  Bestand hat im Wettbewerb von Demokratie und Marktwirtschaft. Willkommen also im
  Berlin der subtilen Symbolik. Investitionen sind kein Selbstzweck, sie schaffen
  und sichern Arbeitsplätze, Wertschöpfung und Wohlstand. Konkret geht es um Investitionen
  in wichtigen Branchen wie Energie, Industrielle KI, Verkehrs-Infrastruktur, Raumfahrt
  und Verteidigung. Deutschland befindet sich in einem harten Wettbewerb um Produktionsstandorte
  und um Kapital für innovative Unternehmen. Zudem haben Deutschland und Europa große
  Pläne bei der industriellen KI. Kaum ein anderes Land hat hier so günstige Voraussetzungen
  zu bieten mit seinem Datenschatz aus unzähligen Fertigungsprozessen. In einer Absichtserklärung
  haben die Bundesregierung und der Chipkonzern Nvidia deshalb eine Initiative zur
  Entwicklung modernster KI-Modelle vereinbart. Im Mittelpunkt steht Physical AI –
  eine KI, die Maschinen, Roboter und Fabriken steuert. Ziel dieser Initiative sind
  zwei Dinge. Erstens soll die industrielle KI in die breite Anwendung gebracht werden,
  damit hochmodernes industrielles KI-Ökosystem entsteht. Und zweitens soll die traditionelle
  deutsche Ingenieurskunst und Fertigungsexpertise mit Spitzenforschung und modernster
  KI-Technologie verschmolzen werden. Wie weit das Land bereits ist, konnte der Bundeskanzler
  am Freitag bei einem Besuch des Leibniz-Instituts IHP in Frankfurt/Oder beobachten.
  Nirgendwo auf der Welt wird auf höherem Niveau an den Mikroprozessoren der Zukunft
  geforscht, nirgendwo entstehen schnellere Steuerungschips. Hier verschmelzen Forschung
  und Anwendung. Das IHP kann auf einen großen Kundenstamm für seine Chips zurückgreifen
  – sei es für die Anwendung in einem künftigen 6-G-Netz oder in der Medizintechnik.
  Entzündungswerte im Blut können mit Hilfe der Technik aus Frankfurt/Oder künftig
  in Minuten gemessen werden – Laboruntersuchungen werden dann nicht mehr nötig sein.
  Diese Erfolgsgeschichten entstehen nicht von alleine. Immer wieder wurden und werden
  sie von zupackenden Menschen geschrieben. Teil des Aufbauwunders waren die türkischen
  Arbeitskräfte, die in den 60er-Jahren nach der Unterzeichnung des deutsch-türkischen
  Anwerbeabkommens ins Land kamen. Aus den Gastarbeitern wurden Landsleute. Sie haben
  ihre Kultur, Sprache und selbst die Kulinarik mitgebracht. Auch heute brauchen wir
  wieder in vielen Regionen und Branchen Fachkräfte aus dem Ausland. Anders wird der
  Wohlstand nicht zu sichern sein. All dies hat auch mit Europa, seinem Binnenmarkt
  und der Freizügigkeit zu tun. Ein Zusammenhang, den der Bundeskanzler auf dem Gipfel
  des sogenannten Berlin Prozesses in Montenegro gar nicht groß betonen musste. Er
  ist dort längst bekannt. Deutschland bleibt für die Staaten des Balkans ein wichtiger
  Fürsprecher auf dem Weg in die EU. Montenegro ist dabei am Weitesten gekommen und
  darf einen zügigen Beitritt erwarten. Auch Europa muss wachsen, um sich in dieser
  Welt behaupten zu können. Ihr Wir freuen uns über Ihr Feedback: Nutzen Sie bitte
  dafür das Kontaktformular (nicht die Antwortfunktion auf diese E-Mail).'
