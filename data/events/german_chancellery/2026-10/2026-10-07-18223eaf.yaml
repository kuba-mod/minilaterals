title: Im Kabinett beschlossen Modernisierung der Autobahnen voranbringen
text: 'Der Einsatz von privatem Kapital bedeutet perspektivisch auch mehr Sicherheit:
  Was fertig geplant ist, wird gebaut. Das deutsche Autobahnnetz hat einen erheblichen
  Investitionsbedarf – das gilt insbesondere für Brücken, Tunnel und Fahrbahnen. Die
  Bundesregierung will die Finanzierung dieser notwendigen Investitionen langfristig
  sichern. Eine zentrale Rolle bei der Modernisierung der Bundesfernstraßen spielt
  die Autobahn GmbH des Bundes. Sie soll künftig eine neue Finanzierungsgrundlage
  erhalten. Statt der Finanzierung nur aus dem Bundeshaushalt, tragen zukünftig drei
  Säulen den Investitionsbedarf der Bundesfernstraßen: Haushaltsmittel, Nutzungsgebühren
  und privates Kapital. Mit dem neuen Modell sollen Einnahmen aus der Lkw -Maut ab
  dem Jahr 2028 teilweise der Autobahn GmbH zufließen. Diese Einnahmen ermöglichen
  der Autobahn GmbH , ab dem Jahr 2027 eigenständig Kredite am Markt für Investitionen
  aufzunehmen. Dieses Modell hat viele Vorteile: Es erlaubt zusätzliche Investitionen,
  die ansonsten nicht oder zu einem späteren Zeitpunkt möglich wären. Es ist wirtschaftlich
  vorteilhaft, weil dadurch schneller und zu heutigen Preisen gebaut werden kann.
  Und es nützt der Baubranche, die durch das langfristige Investitionsbudget besser
  planen und Kapazitäten vorhalten kann. Zudem eröffnet die Kreditfähigkeit auch die
  Möglichkeit, Projekte in öffentlich-privater Partnerschaft in größerem Maßstab als
  bisher umzusetzen. Der Einsatz von privatem Kapital bedeutet perspektivisch auch
  mehr Sicherheit: Was fertig geplant ist, wird gebaut. Das neue Modell stellt sicher,
  dass Geld für weitere Investitionen in der Zukunft zur Verfügung steht. Die Eigentumsverhältnisse
  bleiben dabei gleich – der Bund bleibt alleiniger Eigentümer der Bundesautobahnen
  und Bundesstraßen sowie der Autobahn GmbH .'
