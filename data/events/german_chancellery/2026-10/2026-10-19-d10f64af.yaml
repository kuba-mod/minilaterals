title: Sondervermögen für Infrastruktur und Klimaneutralität Investitionsoffensive
  für das ganze Land
text: 'Durch das Sondervermögens stiegen die Investitionen um mehr als 12 Milliarden
  Euro – unter anderem für die Modernisierung von Bahnstrecken. Jahrzehntelang wurde
  zu wenig in die Modernisierung Deutschlands investiert. Mit 500 Milliarden Euro
  aus dem Sondervermögen für Infrastruktur und Klimaneutralität wird das nun aufgeholt.
  Durch die Investitionen soll das Leben der Bürgerinnen und Bürger im Alltag spürbar
  besser und an vielen Stellen auch einfacher werden. Eine interaktive Deutschlandkarte
  zeigt anhand ausgewählter Beispielprojekte, wo das Geld aus dem Sondervermögen ankommt
  – deutschlandweit und vor Ort. Kaputte Straßen, marode Brücken, zu langsames Internet:
  In vielen Bereichen der öffentlichen Infrastruktur sind deutliche Mängel offensichtlich.
  Da die Investitionen im letzten Jahrzehnt gering ausgefallen sind, muss Deutschland
  nun aufholen. Ziel ist es, das Land zu modernisieren, den Wohlstand zu sichern und
  mit mehr Wachstum die Wettbewerbsfähigkeit des Standorts Deutschland zu stärken.
  Mit den dringend notwendigen Investitionen werden künftige Generationen entlastet,
  denn sie können auf eine intakte und modernisierte Infrastruktur setzen. Im März
  2025 hat der 20. Deutsche Bundestag mit einer Grundgesetzänderung die Voraussetzung
  dafür geschaffen, ein Sondervermögen über 500 Milliarden Euro einzurichten. Das
  Sondervermögen ermöglicht Rekordinvestitionen. Insgesamt geht es um eines der größten
  Investitionspakete in der Geschichte Deutschlands. Das Sondervermögen umfasst drei
  Säulen: 100 Milliarden Euro fließen an die Länder und Kommunen. Weitere 100 Milliarden
  Euro stehen für Investitionen des Klima- und Transformationsfonds ( KTF ) bereit.
  Der Bund kann für zusätzliche Investitionen auf 300 Milliarden Euro zurückgreifen.
  Die Mittel aus dem Sondervermögen können innerhalb einer Laufzeit von zwölf Jahren
  bewilligt werden. Das Sondervermögen ermöglicht einen Modernisierungsschub für das
  ganze Land. Das bedeutet zum Beispiel mehr Investitionen in einen zuverlässigen
  Bahnverkehr, mehr Geld für Verbesserungen der Kindertagesbetreuung und Fortschritte
  bei der Digitalisierung der Verwaltung. Wichtige weitere Schwerpunkte sind Forschung,
  Klimaschutz sowie der Zivil- und Bevölkerungsschutz. Die Errichtung des Sondervermögens
  trat rückwirkend zum 1. Januar 2025 in Kraft. Seit Oktober 2025 gelten die notwendigen
  Voraussetzungen für den Einsatz der Mittel. Für die kommenden Jahre haben zudem
  Planungsbeschleunigung und Bürokratierückbau weiter hohe Priorität, damit die Investitionsmittel
  schnell fließen und jeder Euro richtig eingesetzt wird – zur Verbesserung der Infrastruktur
  sowie zur Förderung des Wirtschaftswachstums. Mit breiter Mehrheit hat sich der
  Deutsche Bundestag darüber verständigt, welche Investitionen aus dem Sondervermögen
  finanziert werden können. Die Ausgaben für Investitionen, die im Bundeshaushalt
  festgehalten sind, müssen zehn Prozent der insgesamt veranschlagten Ausgaben im
  Bundeshaushalt übersteigen. Dann ist das Kriterium der Zusätzlichkeit erfüllt und
  erst dann können entsprechende Investitionen aus dem Sondervermögen erfolgen. Um
  den Einsatz der Sonderkredite transparent zu machen, hat das Bundesfinanzministerium
  auf seiner Webseite eine „ Investitionsuhr “ gestartet. Diese macht den Abfluss
  der Mittel mit monatlich aktuellen Zahlen sichtbar. Die Bundesregierung erarbeitet
  zudem ein Wirkungsmonitoring zur Erfolgskontrolle. Sie wird so dafür sorgen, dass
  die zusätzlichen Investitionen effektiv bei Bürgerinnen, Bürgern und Unternehmen
  ankommen. Das Bundesfinanzministerium hat außerdem den Investitions- und Innovationsbeirat
  berufen. Das Gremium entwickelt konkrete Vorschläge, um Investitionen in Deutschland
  zu beschleunigen. Darüber hinaus erfolgt eine abschließende Erfolgskontrolle nach
  Ende der Laufzeit des Sondervermögens. Die Bundesregierung geht mit den neuen Verschuldungsspielräumen
  im Bundeshaushalt sorgsam um. Um den Haushalt zu konsolidieren, setzt sie auf Wachstumsförderung
  und plant zusätzliche Sparmaßnahmen. Dazu gehört die Reform der Grundsicherung für
  Arbeitssuchende, Einsparungen beim Personal (Ausnahme: Sicherheitsbehörden), Halbierung
  der Bundesbeauftragten, Einsparungen bei Förderprogrammen, Einsparung bei der Entwicklungshilfe,
  Bekämpfung von Schwarzarbeit und Umsatzsteuerbetrug.'
