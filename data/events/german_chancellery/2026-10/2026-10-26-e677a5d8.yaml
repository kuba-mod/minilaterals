title: Asienreise von Bundeskanzler Merz Neue Impulse für die Handelspolitik
text: 'Singapur ist die erste Station der Asienreise des Bundeskanzlers, die ihn auch
  nach Japan und in die Republik Korea führt. Mit seiner Reise nach Singapur , Japan
  und in die Republik Korea (Südkorea) vom 26. bis 30. Oktober möchte Bundeskanzler
  Friedrich Merz die gute Zusammenarbeit mit diesen wichtigen Partnern im Indo-Pazifik
  weiter ausbauen. Mit allen drei Ländern verbindet Deutschland das Bekenntnis zu
  offenem, regelgebundenen Handel und auch der Wunsch, wirtschaftliche Resilienz und
  Sicherheit zu stärken. Das gilt insbesondere mit Blick auf globale Lieferketten.
  Singapur, Japan und Südkorea zeichnen sich zudem durch hohe Innovationskraft aus,
  vor allem bei Zukunfts- und Hochtechnologien. Die Reise des Bundeskanzlers nach
  Südost- und Ostasien soll deshalb auch die Kooperation auf diesen Gebieten weiter
  voranbringen. Darüber hinaus sind Singapur, Japan und Südkorea zentrale Akteure
  bei der Lösung globaler Herausforderungen und stehen vor ähnlichen Aufgaben wie
  die Bundesrepublik. Im Fokus der Reise des Kanzlers nach Singapur, Japan und Südkorea
  (Republik Korea) stehen sicherheits- und wirtschaftspolitische Gespräche. Die Sicherheit
  und der Wohlstand Deutschlands und Europas sind eng mit der Region verknüpft. Ein
  erheblicher Teil des deutschen Außenhandels mit Staaten außerhalb der EU entfällt
  auf die Indo-Pazifik-Region. Hieran will der Bundeskanzler mit seiner Reise anknüpfen
  und neue Impulse für die Handelspolitik setzen. Deutschland und seine Unternehmen
  sollen stärker von ihren weltweiten Handelsbeziehungen profitieren. So sollen Investitionen
  in Deutschland gestärkt und Arbeitsplätze gesichert werden. Die Bedeutung der wirtschaftlichen
  Zusammenarbeit zeigt sich auch darin, dass den Bundeskanzler eine Wirtschaftsdelegation
  auf seiner Reise begleitet. Das Programm der Reise ist facettenreich: Am Dienstag
  wird Bundeskanzler Merz zunächst in Singapur ein Gespräch mit Premierminister Lawrence
  Wong führen. Auch ein Treffen mit Präsident Tharman Shanmugaratnam ist geplant.
  Darüber hinaus wird der Bundeskanzler im Rahmen der Singapore Lecture eine Rede
  halten. Für Mittwoch ist die Weiterreise nach Japan vorgesehen. Dort wird der Bundeskanzler
  in Tokio von Ministerpräsidentin Sanae Takaichi empfangen. Während des Aufenthalts
  in Japan sind zudem die Teilnahme am German-Japanese Business Summit sowie der Besuch
  eines japanischen Unternehmens mit deutscher Kooperation geplant. Den Abschluss
  der Asienreise bildet ab Donnerstag der Besuch in Südkorea. In Seoul wird Bundeskanzler
  Merz den südkoreanischen Präsidenten Lee Jae-myung treffen. Weiterhin wird er am
  Freitag die 19. Asien-Pazifik-Konferenz der Deutschen Wirtschaft in Seoul eröffnen.
  Er wird außerdem die Demilitarisierte Zone an der Grenze zu Nordkorea besuchen.
  Die Demilitarisierte Zone (DMZ) ist ein 248 Kilometer langer und etwa 4 Kilometer
  breiter Grenzstreifen, der die koreanische Halbinsel entlang des 38. Breitengrads
  in die Demokratische Volksrepublik Korea (Nordkorea) und die Republik Korea (Südkorea)
  teilt. Die DMZ wurde 1953 nach dem Ende des dreijährigen Koreakriegs als Pufferzone
  eingerichtet. Da bis heute kein echter Friedensvertrag unterzeichnet wurde, sondern
  lediglich ein dauerhafter Waffenstillstand besteht, befinden sich beide Länder völkerrechtlich
  weiterhin im Kriegszustand.'
