title: Bundesregierung stärkt Entwicklung und Anwendung Industrieller KI über Zusammenarbeit
  mit internationalen Partnern
text: Im Rahmen des „Invest in Germany Summit“ mit Bundeskanzler Friedrich Merz haben
  das Bundesministerium für Wirtschaft und Energie (BMWE) und das Bundesministerium
  für Forschung, Technologie und Raumfahrt (BMFTR) eine Absichtserklärung (Joint Declaration
  of Intent) mit NVIDIA unterzeichnet. Mit der Erklärung vereinbaren die Partner,
  eine Initiative zur Entwicklung modernster KI-Modelle für Physical AI voranzutreiben.
  Die Initiative baut auf Deutschlands herausragenden Industriedaten, seiner Fertigungskompetenz
  und seiner Expertise im Ingenieurswesen auf und ist in die KI-Roadmap der Bundesregierung
  sowie die Plattform Industrie 4.0 eingebettet. Künstliche Intelligenz (KI) und vor
  allem ihre industrielle Nutzung sind eines der Kernthemen. Ziel ist es, industrielle
  KI systematisch in die breite Anwendung zu bringen und ein hochmodernes industrielles
  KI-Ökosystem in Europa zu etablieren – mit starken deutschen Unternehmen und Forschungseinrichtungen.
  Die „Plattform Industrie 4.0“ ist das Kernelement der Partnerschaft. Es handelt
  sich dabei um ein Netzwerk aus Politik, Industrie, Forschung und Verbänden. Die
  Plattform wird aktuell vollständig auf das Thema Industrielle KI ausgerichtet. Das
  Netzwerk soll somit zum zentralen Strategienetzwerk für Industrielle KI von der
  Infrastruktur bis zur Anwendung werden. Die „Plattform Industrie 4.0“ ist offen
  für alle Unternehmen und pflegt Kooperationen mit vielen internationalen Partnern.
  Die Förderung von Spitzenforschung und Innovation ist Bestandteil der Technologie-
  Roadmap KI der Hightech Agenda Deutschland (HTAD) der Bundesregierung. Ein besonderes
  Augenmerk liegt auf der Zusammenarbeit bei der Entwicklung spezialisierter, offener
  Modelle für industrielle KI, auf Basis offener Modelle wie NVIDIA Nemotron und NVIDIA
  Cosmos. NVIDIA wird hierfür sein bisheriges Engagement mit deutschen Partnern erweitern.
  Durch die Einbeziehung von Forschungseinrichtungen, der Industrie sowie kleinen
  und mittleren Unternehmen wird sichergestellt, dass Innovationen breit gestreut
  werden und der deutsche Mittelstand von den Fortschritten der KI profitieren kann.
  Mit diesem Schritt unterstreicht die Bundesregierung ihr Ziel, die traditionelle
  deutsche Ingenieurskunst und Fertigungsexpertise mit Spitzenforschung und modernster
  KI-Technologie zu verschmelzen, um die Produktivität, Wettbewerbsfähigkeit und technologische
  Souveränität Deutschlands zu sichern.
