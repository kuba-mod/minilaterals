title: Bundeskanzler Merz empfängt den litauischen Ministerpräsidenten, Mindaugas
  Sinkevičius
text: Bundeskanzler Friedrich Merz empfängt am Montag, den 5. Oktober 2026, um 16
  Uhr den litauischen Ministerpräsidenten, Herrn Mindaugas Sinkevičius, im Bundeskanzleramt.
  Im Rahmen des Arbeitsbesuches von Herrn Sinkevičius in Berlin wird sich der Kanzler
  mit ihm zu Fragen der Sicherheit, der Stärkung der NATO-Ostflanke, sowie zum Aufbau
  der deutschen Brigade in Litauen austauschen. Zudem werden Themen der bevorstehenden
  EU-Ratspräsidentschaft besprochen, welche Litauen von Januar bis Juni 2027 übernimmt.
  Im Anschluss an das Treffen ist für ca. 17 Uhr eine gemeinsame Pressekonferenz vorgesehen.
