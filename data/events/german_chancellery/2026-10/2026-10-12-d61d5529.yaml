title: 'Neuer Deutsch-Österreichischer Lyrikpreis geht an Esther Kinsky und Ann Cotten
  – Staatsminister Weimer: „Gemeinsam mit unseren Nachbarn schaffen wir Sichtbarkeit
  für herausragende zeitgenössische Lyrik“'
text: 'Der Beauftrage der Bundesregierung für Kultur und Medien und das Bundesministerium
  für europäische und internationale Angelegenheiten der Republik Österreich haben
  anlässlich des 100. Geburtstages der Autorin Ingeborg Bachmann den Deutsch-Österreichischen
  Lyrikpreis ins Leben gerufen. Ausgezeichnet werden die Schriftstellerinnen Esther
  Kinsky für ihren Gedichtband „Heim.Statt“ und Ann Cotten für ihren Gedichtband „Poller.
  Idyllen“. Die Entscheidung wurde durch eine unabhängige Jury getroffen. Der Preis
  wird am 25. November 2026 im Rahmen des Eröffnungsempfangs der Buch Wien feierlich
  vergeben und ist mit je 15.000 Euro dotiert. Dazu Staatsminister Weimer: „Meinen
  herzlichen Glückwunsch an Esther Kinsky und Ann Cotten zu dieser einmaligen Auszeichnung.
  Die Jury würdigt Werke, die unterschiedlicher nicht sein könnten und doch die Gemeinsamkeit
  haben, dass sie poetisch, wortgewaltig die Grenzen der literarischen Gattungen überschreiten.
  Die Gedichtbände zeichnet Experimentierfreude, Ideenreichtum und die große Offenheit,
  die auch Ingeborg Bachmanns Werke prägte, aus. Ich freue mich sehr, dass BKM und
  das österreichische Bundesministerium für europäische und internationale Angelegenheiten
  diesen einzigartigen Preis gemeinsam initiieren konnten. Damit würdigen wir nicht
  nur herausragende zeitgenössische Lyrik, sondern stärken auch den literarischen
  und europäischen Austausch.“ Der gemeinsam initiierte Preis wird an je eine Lyrikerin
  oder einen Lyriker, deren Lebensmittelpunkt in Deutschland und Österreich liegen,
  vergeben. Zum Preis gehört auch die Teilnahme an Übersetzungswerkstätten in Berlin
  und Wien, um gemeinsam mit Literaturübersetzerinnen und -übersetzern anhand ihrer
  prämierten Werke an Sprachen zu arbeiten, die für Ingeborg Bachmanns Leben und Arbeiten
  besonders bedeutend waren. Dazu gehören unter anderem Italienisch, Slowenisch, Französisch
  oder Englisch. Der Preis würdigt nicht nur herausragende zeitgenössische Lyrik,
  sondern stärkt auch den literarischen und europäischen Austausch. Esther Kinsky
  wurde 1959 in Engelskirchen geboren und lebt in Wien und Norditalien. Sie arbeitet
  als Autorin und Übersetzerin und wurde bereits mit zahlreichen namenhaften Preisen
  ausgezeichnet. Die Jury prämiert ihren Gedichtband „Heim.Statt“. Ann Cotton wurde
  1982 in Ames, Iowa geboren und ist in Österreich aufgewachsen. Inzwischen lebt sie
  in Wien und Berlin. Sie ist Schriftstellerin, Lyrikerin, Übersetzerin und Illustratorin
  und wurde ebenfalls bereits mit zahlreichen namenhaften Preisen ausgezeichnet. Die
  Jury prämiert ihren selbst illustrierten Band „Poller. Idyllen“. Ingeborg Bachmann
  ist eine der bedeutendsten deutschsprachigen Autorinnen des 20. Jahrhunderts. Für
  ihr Leben und ihre Werke war die Auseinandersetzung mit unterschiedlichen Sprachen,
  Kulturen und europäischen Traditionen wesentlich. Daran knüpft der Deutsch-Österreichische
  Lyrikpreis an, der Lyrikbände aus den vergangenen drei Jahren von Autoren prämiert,
  deren Arbeit – wie die Ingeborg Bachmanns – von der Verbindung verschiedener poetischer
  Traditionen, Sprachwelten und Kulturräume geprägt ist. Die Preisverleihung findet
  am 25. November im Rahmen der Buch Wien statt, am darauffolgenden Tag gibt es eine
  Podiumsveranstaltung mit den Preisträgerinnen und Mitgliedern der Jury. Über die
  Vergabe des Preises entschied am 28. September eine unabhängige deutsch-österreichische
  Jury, bestehend aus Jan Bürger (Marbach), Bernhard Fetz (Wien), Daniela Strigl (Wien),
  Beate Tröger (Frankfurt am Main), sowie TOLEDO/LCB, Berlin (Aurélie Maurin) und
  ÖGfL, Wien (Ursula Ebel/Manfred Müller). Projektträger sind die Österreichische
  Gesellschaft für Literatur (ÖGfL) und das Literarische Colloquium Berlin e.V. (LCB),
  in Kooperation mit dem TOLEDO-Programm des Deutschen Übersetzerfonds.'
