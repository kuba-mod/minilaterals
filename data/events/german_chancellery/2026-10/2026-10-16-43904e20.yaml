title: Bundesregierung aktuell
text: 'Gerechtigkeit ist ein so großer wie gefährlicher Begriff. Jeder hat eine eigene
  Vorstellung davon, was gerecht ist und was nicht. Wenn der Bundeskanzler das Thema
  Gerechtigkeit in seiner Regierungserklärung aufnimmt, dann geht er also ein gewisses
  Risiko ein (weil ihm die Unschärfe übelgenommen werden könnte), aber gleichzeitig
  macht er einen größeren Anspruch geltend: Die Politik der Mitte soll nicht ausgrenzend,
  sondern fair und umfassend wirken. Die großen Reformen dieser Koalition sind nicht
  parteipolitisch motiviert und am Tagesgewinn ausgerichtet, sondern sie sollen gerecht
  und über Generationen hinweg ihre Wirkung entfalten. Es war in diesem Zusammenhang
  deshalb auch richtig, an einen zeitlosen Gedanken von Papst Benedikt VI. aus dem
  Jahre 2011 zu erinnern: „Politik muss Mühen um Gerechtigkeit sein“. Denn diese Koalitionsarbeit
  hin zu den Reformen ist sichtbares Mühen – eine Mühsal, auch wenn der Begriff ein
  bisschen antiquiert klingt. Der Kampf um den Kompromiss ist stets anstrengend und
  wird in einer debattenfreudigen Demokratie angesichts der Größe der Themen von einem
  gewaltigen öffentlichen Getöse begleitet. Das Ziel bleibt: Eine offene Gesellschaft
  wird irgendwann diese Bemühung um Gerechtigkeit honorieren, genauso wie sie sich
  auch der Logik nicht verschließen wird, dass eine Gesellschaft nicht auf Kosten
  der Zukunft und damit der jüngeren Generationen leben kann. Ausgewogen und gerecht
  zu reformieren – von der Rente und Pflege über Sicherheit bis hin zum wirtschaftlichen
  Wachstum – bedarf einer „schöpferischen Anstrengung“, wie der Bundeskanzler sagte.
  Das bedeutet: Es muss einen Ausgleich der Lasten geben, denn nur so akzeptieren
  die Menschen im Land, dass ihre Investition in die Gemeinschaft honoriert wird,
  dass sich Leistung lohnt und dass es fair zugeht in ihrem Gemeinwesen. Fairness
  aber auch wirtschaftliche Stärke sind von großer Bedeutung für den Zusammenhalt
  einer Gesellschaft. Daran hat der Bundeskanzler auch beim Deutschen Arbeitgebertag
  erinnert. Die Bundesregierung jedenfalls leistet ihren Beitrag, dass die Wirtschaft
  wieder wächst und der Sozialstaat auch morgen finanzierbar bleibt. Dass in Deutschland
  zuletzt Rekordzahlen bei Neugründungen erreicht wurden, zeigt das Potenzial der
  Wirtschaft. Die neuen Wachstumszahlen spiegeln diesen Optimismus. Der Dreiklang
  aus Wachstum, Innovation und Gerechtigkeit war auch in Brüssel zu hören, wo die
  politische Woche zu Ende ging. Beim Europäischen Rat standen Wettbewerbsfähigkeit,
  der künftige Haushalt der EU und die Autoindustrie im Mittelpunkt der Diskussionen.
  Auch hier drängt das Thema Fairness nach oben: Für die kommenden Jahre hat die EU
  nur begrenzt Mittel zur Verfügung. Vor allem die Nettozahler, zu denen Deutschland
  gehört, fordern eine kluge Selbstbescheidung und klare Prioritäten: Investiert wird
  dort, wo sich die Zukunft Europas entscheidet. Dazu gehören aus Sicht der Bundesregierung
  Innovationen, Künstliche Intelligenz, Dekarbonisierung und Verteidigung. Die Beratungen
  darüber werden Europa noch länger beschäftigen. Zu einem vorläufig guten Ende gebracht
  wurden hingegen die Beratungen über die Automobilindustrie und die Klimapolitik.
  Gemeinsam mit dem französischen Präsidenten schlägt der Bundeskanzler jetzt eine
  Lösung vor, die den Streit um den Verbrenner und seine Laufzeit beenden könnte,
  ohne dass die Klimaziele der EU gefährdet werden. Ein deutsch-französischer Konsens
  ist eine gute Voraussetzung dafür, dass die Idee von den anderen Partnern in der
  EU angenommen wird, zumal sie die Autobranche in Europa stärken kann. Entscheidend
  ist, dass mit jeder politischen Initiative eine neue Dynamik entsteht, die am Ende
  auf das große Thema Gerechtigkeit einzahlt. Das gelingt, wenn Unternehmen investieren,
  Menschen Chancen ergreifen und der Staat den Weg frei räumt. Bärbel Bas und ich
  haben in der Bundesregierung vertrauensvoll zusammengearbeitet. Für das Engagement
  danke ich ihr. Ihre Entscheidung verdient Respekt. Als Vater und Großvater kann
  ich nur erahnen, wie schwer dieser Verlust wiegt. Ihr und ihrer Familie wünsche
  ich viel Kraft. Die Vereinten Nationen hatten den Tag erstmals im Jahr 2009 ausgerufen,
  um darauf aufmerksam zu machen, wie wichtig Vorsorge im Katastrophenfall sein kann.
  Dazu gehört zum Beispiel, Lebensmittel und Getränke vorzuhalten, eine Hausapotheke
  anzulegen und ein Notgepäck zu packen. Der Tag findet jährlich statt. Wir freuen
  uns über Ihr Feedback: Nutzen Sie bitte dafür das Kontaktformular (nicht die Antwortfunktion
  auf diese E-Mail).'
