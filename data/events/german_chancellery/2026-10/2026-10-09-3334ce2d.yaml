date: '2026-10-09'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 9. Oktober 2026
text: 'stellvertretender Regierungssprecher Meyer (Vorsitzende Küfner eröffnet die
  Pressekonferenz und begrüßt SRS Meyer sowie die Sprecherinnen und Sprecher der Ministerien.)
  Es folgt der Blick auf die öffentlichen Termine des Bundeskanzlers in der kommenden
  Woche. Am Dienstag, den 13. Oktober, wird der Bundeskanzler am Arbeitgebertag im
  Berliner Congress Center teilnehmen. Er wird dort gegen 10 Uhr eine Rede halten.
  Anschließend wird er ein kurzes moderiertes Gespräch mit BDA-Präsident Dulger führen.
  Neben dem Bundeskanzler werden vonseiten der Bundesregierung außerdem die Bundesarbeitsministerin,
  der Bundesverteidigungsminister, die Bundeswirtschaftsministerin, die Bundesbildungsministerin
  und der Bundesminister für Digitales und Staatsmodernisierung an der Veranstaltung
  teilnehmen. Am Mittwoch, den 14. Oktober, wird um 10 Uhr wie gewohnt eine Kabinettssitzung
  unter der Leitung des Bundeskanzlers stattfinden, an diesem Tag mit der Besonderheit,
  dass es sich um das sogenannte Apfelkabinett handeln wird. Bei dieser schönen, langjährigen
  Tradition werden sechs Apfel- und Blütenköniginnen Apfelkörbe an den Bundeskanzler
  und die weiteren Kabinettsmitglieder überreichen. Die Bundesregierung wird damit
  die Arbeit im Obstbau würdigen. Es wird sich am Mittwoch um einen Bildtermin handeln.
  Um 14 Uhr wird der Bundeskanzler dann im Deutschen Bundestag zu Sitzungsbeginn eine
  Regierungserklärung zur bevorstehenden Tagung des Europäischen Rates abgeben. Apropos
  Europäischer Rat : An diesem wird der Bundeskanzler dann, am Donnerstag und Freitag,
  den 15. und 16. Oktober, in Brüssel teilnehmen. Kernthemen werden die Stärkung der
  Wettbewerbsfähigkeit, der nächste Mehrjährige Finanzrahmen sowie die EU-Erweiterung
  sein. Daneben wird es um fortwährende Unterstützung der Ukraine und die europäische
  Sicherheit und Verteidigung gehen. Dann vielleicht noch der Regiehinweis: Das übliche
  Briefing im Vorfeld der Tagung des Europäischen Rates wird am Dienstagvormittag
  hier in der Bundespressekonferenz stattfinden. Herr Meyer, können Sie zu der Tagung
  des Europäischen Rates vielleicht noch ein bisschen genauer und spezifischer werden,
  auch wenn es am Dienstag ein Briefing hingibt? Was genau steht denn etwa bei der
  Erweiterung auf der Agenda? Ich bitte um Verständnis dafür, dass ich nicht weiter
  ins Detail gehen will. Den thematischen Rahmen habe ich gerade ein wenig beschrieben.
  Bei der Stärkung der Wettbewerbsfähigkeit wissen Sie, dass sie dem Bundeskanzler
  ein besonders hohes Anliegen ist. Er war ja auch derjenige, der auch sehr stark
  mit angeschoben hat, Anfang des Jahres das Thema auch sehr stark auf die Agenda
  zu setzen. Dabei geht es dann sicherlich um die Umsetzung und die weiteren Schritte.
  Es gibt den Mehrjährigen Finanzrahmen als, sage ich einmal, das große Framework
  auch für die kommenden Jahre als wichtiges Thema. Die EU-Erweiterung haben Sie angesprochen.
  Natürlich wird auch die Ukraine entsprechend eine wichtige Rolle spielen, wie meistens
  bei den Tagungen des Europäischen Rates. Weiter ins Detail möchte ich im Moment,
  kann ich auch im Moment noch nicht gehen. Eine kurze Nachfrage zu einem Thema, das
  auch auf der Agenda steht, nämlich dieser Instrumentenkasten für eine härtere, resilientere
  Handelspolitik: Gibt es denn mittlerweile eine feste Meinung in der Bundesregierung,
  ob man sich der Forderung aus Industrie und auch Ländern anschließt, dass man in
  der EU Importzölle auf chinesische Hybridautos verhängen sollte? Ich will noch einmal
  darauf verweisen: Es geht hierbei ja um eine Debatte um die Handelspolitik insgesamt.
  Sie wissen, dass Deutschland sich natürlich weltweit für den regelbasierten Handel
  einsetzt und gleichzeitig aber zur Kenntnis nimmt, dass sich der weltweite Handel
  natürlich verändert hat und wir deshalb auch in Europa unsere Konsequenzen daraus
  ziehen müssen. Ich will Sie auch noch einmal auf den gemeinsamen Brief von Bundeskanzler
  Merz und Staatspräsident Macron verweisen. In diesem gibt es ja auch konkrete Vorschläge,
  wie der handelspolitische Instrumentenkasten der EU im Lichte der Ungleichgewichte
  und der Veränderungen, die wir auf dem Weltmarkt sehen, verbessert und erweitert
  werden kann. Auf diese Positionierung würde ich verweisen. Anknüpfend an die Frage
  von dem Kollegen habe ich eine Frage an Herrn Meyer und an das Wirtschaftsministerium.
  Anfang der Woche hat der Chinasonderberatungsausschuss des Bundestags ‑ das ist
  in meinen eigenen Worten ‑ ein mehr als 40-seitiges Papier zu deren Ansicht zum
  Umgang mit China vorgelegt. Darin ist unter anderem die Rede davon, dass man inzwischen
  nicht mehr davon sprechen könne, dass China ein Partner, ein Wettbewerber und ein
  systemischer Rivale sei, weil „Rivale“ inzwischen eben überbetont werden müsse.
  Meine Frage an das Wirtschaftsministerium und an Herrn Meyer: Schätzten Sie das
  genauso ein? Ich würde das jetzt nicht mit Bezug auf parlamentarische Beratungen
  hier im Einzelnen weiter kommentieren oder darauf eingehen. Wir haben uns in der
  Vergangenheit ja auch immer wieder dazu positioniert, auch rund um die Reisen des
  Bundeskanzlers in die entsprechenden Regionen. Aus unserer Sicht beginnt kluge und
  durchsetzungsstarke Chinapolitik zu Hause. Wir wollen eine ausgewogene Partnerschaft
  mit China auf Basis eines einigen, starken und wettbewerbsfähigen Deutschlands und
  Europas pflegen. Das steht für uns immer am Beginn. Das führt uns dann auch ein
  Stück weit zurück zum Europäischen Rat. Ich glaube, das sollten wir immer auch sehr
  deutlich betonen, wenn wir uns mit unterschiedlichen Regionen beschäftigen: Die
  Arbeit beginnt hier, zu Hause. Wir müssen hier selbst stark werden, müssen wettbewerbsfähig
  sein. ‑ Das steht auch für den Bundeskanzler im Fokus. Die Bundesregierung erwartet
  ja im Herbst konkrete Vorschläge der Kommission. Nach deren Vorlage ‑ das hat gerade
  der Regierungssprecher auch gesagt ‑ werden wir uns auch abstimmen. Wir werden uns
  für einen regelbasierten Ansatz einsetzen, der auch die Interessen unserer Freihandelspartner
  dabei mit berücksichtigt. Parallel müssen natürlich Diversifizierung und „derisking“
  priorisiert werden, auch mit konkreten Maßnahmen. Dazu, hierbei den richtigen Ausgleich
  und die richtigen Ansätze zu finden, befinden wir uns jetzt gerade in der Umsetzung.
  Wie wichtig ist der Zwischenbericht, der Dienstag im Wirtschaftsausschuss besprochen
  wurde, für die Ministerin und auch für Sie? Prinzipiell sind Berichte immer von
  großer Wichtigkeit. Aber wie gesagt, besprechen wir es innerhalb der Bundesregierung.
  Im Zusammenhang mit dem EU-Rat zurück zur Ukraine: Herr Meyer oder auch Frau Laiadhi,
  von welcher Finanzlücke für 2027, welchem Finanzierungsbedarf für die Ukraine gehen
  Sie insgesamt aus? Diesbezüglich stand Anfang der Woche ja eine Zahl im Raum. Ist
  sie in Kyjiw am Wochenende auch in dieser Form genannt worden? Vielleicht anschließend
  daran noch diese Frage: Wäre Deutschland bereit, die bilaterale Finanzierung im
  Haushalt 2027 noch zu erhöhen? Der der Bundeshaushalt für 2027 ist ja noch offen.
  Auch in dieser Hinsicht möchte ich den Beratungen jetzt an der Stelle wirklich nicht
  vorgreifen. Heute ist Freitag, der 9. Oktober. Wir reden von der Tagung des Europäischen
  Rates, die nächste Woche Donnerstag und Freitag stattfindet. Ich glaube, wir haben
  die Unterstützung der Ukraine hier in Deutschland, aber auch in Europa in den vergangenen
  Monaten auf sehr starke und breite Füße gestellt. Deutschland hat hierbei wirklich
  eine Führungsrolle inne. Ich glaube, das bestreitet inzwischen auch niemand mehr.
  Wir haben in der Vergangenheit regelmäßig auch Hilfen aufgestockt. Der Bundeskanzler
  hat jetzt, bei seinem Besuch vor Ort, auch noch einmal konkrete Verwendungen von
  Mitteln bekannt gemacht. Wie gesagt, arbeiten wir daran weiter. Mit Blick auf nächste
  Woche würde ich jetzt ungern spekulieren, was weitere Überlegungen oder Zahlen angeht.
  Aber die Zahl ist ja kein Beratungsgegenstand. Deshalb noch einmal konkret die Frage:
  Hat Selenskyj am Wochenende gegenüber dem Bundeskanzler keine Zahl genannt? Sind
  die 70 Milliarden Euro aus der Luft gegriffen? Ich würde jetzt hier ganz grundsätzlich
  natürlich nicht über interne Gespräche oder dazu, wer was wo angesprochen hat, berichten.
  Das mache ich grundsätzlich nicht. Noch einmal: Zum finanziellen Rahmen habe ich
  gerade ein bisschen gesagt, wie wir drauf blicken. Bundesfinanzminister Lars Klingbeil
  wird vom 12. bis 17. Oktober gemeinsam mit der Bundesministerin für wirtschaftliche
  Zusammenarbeit und Entwicklung, Reem Alabali Radovan, nach Indien und Thailand reisen.
  Er wird auf dieser Reise auch von einer Wirtschaftsdelegation begleitet werden.
  Erste Station der Reise wird Neu-Delhi sein. Sie wissen, dass Indien ein wichtiger
  Partner ist, mit dem wir das Interesse an offenen Märkten und einer regelbasierten,
  internationalen Ordnung teilen. In Neu-Delhi wird sich der Minister mit Vertreterinnen
  und Vertretern der Regierung, Vertreterinnen und Vertretern der Finanzbranche und
  auch der Zivilgesellschaft austauschen. Finanzminister Klingbeil wird unter anderem
  gemeinsam mit der Entwicklungsministerin bilaterale Gespräche mit der Finanzministerin
  Sitharaman und dem Außenminister Jaishankar führen. Zudem wird er gemeinsam mit
  der indischen Finanzministerin an einem Financial Round Table teilnehmen. Am Mittwoch
  wird Minister Klingbeil weiter nach Bangkok reisen, und zwar zur Jahrestagung des
  IWF und der Weltbank sowie zu dem G20-Treffen der Finanzministerinnen und Finanzminister
  und Notenbankgouverneurinnen und Notenbankgouverneure. Im Rahmen der Jahrestagung
  wird sich der Minister mit den internationalen Partnern bezüglich zentraler Themen
  austauschen. Dabei geht es unter anderem um die andauernden Krisen und Konflikte
  und die zunehmenden globalen Unsicherheiten, die daraus resultieren. Er wird am
  Rande der Jahrestagung zudem bilaterale Gespräche mit wichtigen Partnern führen
  und sich mit diesen Partnern im Rahmen der G20 austauschen. Zudem ist die Teilnahme
  am Empfang der entwicklungspolitischen Nord-Süd-Kommission geplant, die bereits
  hier, in der BPK, Anfang der Woche Thema war. Daran kann ich seitens des BMZ nahtlos
  anknüpfen. Die Reise wird ja zusammen mit Entwicklungsministerin Reem Alabali Radovan
  stattfinden. Auch aus entwicklungspolitischer Sicht ist Indien natürlich ein wichtiger
  strategischer Partner, dem eine Schlüsselrolle bei der gemeinsamen Bewältigung globaler
  Herausforderungen zukommt. Dementsprechend arbeitet das BMZ gemeinsam mit Indien
  vor allem im Ausbau von erneuerbaren Energien, und dies ganz weitestgehend über
  rückzahlbare Darlehen bzw. Kredite. Bei der Jahrestagung in Bangkok, an dem die
  Entwicklungsministerin als deutsche Weltbankgouverneurin teilnehmen wird, werden
  die Themen vor allen Dingen Entwicklungsfinanzierung, der Umgang mit globalen Krisen
  und Schocks sowie Wasser sein. Außerdem wird Ministerin Alabali Radovan auf Einladung
  der französischen Präsidentschaft an einem Treffen der G7-Entwicklungsministerinnen
  teilnehmen. Schließlich trifft sie gemeinsam mit dem Finanzminister die frisch berufenen
  Mitglieder der entwicklungspolitischen Nord-Süd-Kommission, ENSK, die gerade schon
  erwähnt wurde. Ich hätte eine Frage an Frau Laiadhi, und zwar zum Thema Indien:
  Wird denn der Vizekanzler auch das Thema der Russlandsanktionen ansprechen? Indien
  ist ja einer der Hauptkäufer von russischem Öl, vor allem. Wird das Thema der Reise
  sein? Ich habe ja gerade schon gesagt, dass Indien ein strategischer Partner ist.
  Der Minister hat sich jetzt auch schon zweimal bilateral mit der indischen Finanzministerin
  am Rande von internationalen Treffen getroffen. Das Thema der Energie ist sicherlich
  auch bei den jetzt kommenden Gesprächen ein Thema. Aber Sie wissen, wie es ist,
  dass wir den Gesprächen natürlich nicht vorgreifen können. Gerade ist die neue Friedensnobelpreisträgerin
  bekannt gegeben worden. Ich habe hier just in time für Sie eine erste Reaktion der
  Bundesregierung dazu. Hinsichtlich der Entscheidung des norwegischen Nobelkomitees,
  den diesjährigen Friedensnobelpreis an Navanethem „Navi“ Pillay zu verleihen, kann
  ich für die Bundesregierung Folgendes mitteilen: Wir gratulieren ihr sehr herzlich
  zu dieser hohen Auszeichnung. Navi Pillay hat über Jahrzehnte hinweg mit großem
  persönlichen Engagement und beeindruckender Beharrlichkeit für Menschenrechte, Gerechtigkeit
  und die Durchsetzung des Völkerrechts gekämpft. Ihr Lebenswerk, vom Einsatz gegen
  die Apartheid bis zu ihrer herausragenden Arbeit für die internationale Strafgerichtsbarkeit
  und die Vereinten Nationen, verdient unsere höchste Anerkennung. Deutschland steht
  fest zum Völkerrecht und zur internationalen Gerichtsbarkeit. Wir gehören zu den
  wichtigsten Unterstützern des Internationalen Strafgerichtshofs und setzen uns für
  starke, unabhängige und handlungsfähige internationale Gerichte ein. Hält die Bundesregierung
  es nicht für problematisch? Ich erinnere daran, dass Frau Pillay im Jahr 2022 noch
  nicht öffentlich die Otto-Hahn-Medaille im Roten Rathaus vergeben worden ist. Hintergrund
  waren damals Vorwürfe, sie würde sich antisemitisch und antiisraelisch äußern. Was
  wir zu der Auszeichnung zu sagen haben, habe ich gerade gesagt. Frau Pillays Arbeit
  in der unabhängigen UN-Kommission zu Gaza hatten Sie jetzt nicht angesprochen. Sie
  hat vergangenes Jahr festgestellt, dass es einen Völkermord in Gaza gibt. War Ihnen
  das jetzt keine Erwähnung wert? Ich glaube, unsere Haltung zu dem Bericht ist bekannt.
  Wir respektieren das Mandat der Kommission und nehmen diese Arbeit auch sehr ernst.
  Wie gesagt, ist die Haltung der Bundesregierung dazu bekannt. Ich habe mich jetzt
  hier zur Auszeichnung für den Friedensnobelpreis geäußert. Wäre Bundeskanzler a.
  D. Schröder aus Sicht der Bundesregierung ein denkbarer Vermittler im Russland-Ukraine-Krieg?
  Hat die Bundesregierung gewusst, dass er Herrn Putin zu seinem Geburtstag trifft?
  Ich würde einmal, weil ich schon sehe, dass es auch weitere Fragen gibt, vielleicht
  mit einem generellen Satz dazu anfangen, weil es, glaube ich, viele interessiert.
  Das bezieht sich jetzt insbesondere auf die Meldungen, die wir gestern und heute
  zum Besuch von Herrn Schröder in Russland und auch offenbar auf der Geburtstagsparty
  gesehen haben. Der Bundeskanzler ist über das Treffen von Herrn Schröder mit dem
  russischen Präsidenten Putin zutiefst empört. Putin allein ist für den Krieg in
  der Ukraine verantwortlich. Seine Befehle sorgen jeden Tag für unermessliches Leid
  für zivile Opfer und für Familien, die auseinandergerissen werden, sowie für Tote
  und Verwundete. Der Bundeskanzler empfindet es vor diesem Hintergrund als geradezu
  unmoralisch, dass Herr Schröder an einem solchen Tag mit Herrn Putin feiert. Die
  andere Frage war: Wäre er mit dem guten Kontakt ein denkbarer Vermittler oder nicht?
  Ich könnte jetzt ein wenig auf die Aussagen von gerade verweisen. Aber noch einmal:
  Wir haben uns in der Vergangenheit hier auch schon häufiger auf die Frage bezogen
  und geantwortet. Wir arbeiten mit unseren Partnern und tun alles, um diplomatische
  Wege zu eröffnen, für einen Frieden in der Ukraine. Darüber sprechen wir mit unseren
  Partnern, mit unseren europäischen Partnern, mit den Staats- und Regierungschefs,
  die „in charge“ sind. Darauf fokussieren wir uns. Wird es denn irgendwelche Konsequenzen
  haben? Wird also zum Beispiel der Bundeskanzler den ehemaligen Bundeskanzler anrufen
  und versuchen, mit ihm darüber zu sprechen? Ich glaube, ich habe gerade in aller
  Klarheit gesagt, wie wir darauf blicken und wie der Bundeskanzler darauf blickt.
  Ich denke, das wird auch bei allen ankommen. Ich würde gern wissen, ob Ihnen die
  Reise im Vorfeld bekannt war? Dem Auswärtigen Amt war es vorher nicht bekannt. Auch
  unsere Botschaft hat dabei keinerlei Unterstützung geleistet. Grundsätzlich ist
  es ja denkbar, auch sicherheitstechnisch, dass man über Reisen in brisanten Kontexten
  informiert werden müsste. Vielleicht ist das auch eine Frage an das BMI, von dem
  ich auch gern noch wissen würde, ob es im Vorfeld über diese Reise informiert war.
  Das BMI war im Vorfeld nicht über dieser Reise informiert, nein. Herr Meyer, nun
  hat sich Herr Stegner, Außenpolitiker der SPD, positiv geäußert und gesagt, man
  müsse quasi mit den Mädels tanzen, die im Raum sind, und mit dem reden, der dort,
  in Moskau, an der Macht ist, und Schröder könne Türen zu Putin öffnen. Gibt es Anlass
  für die Bundesregierung, für den Kanzler vielleicht mit dem Koalitionspartner noch
  einmal grundsätzlich über solche Dinge zu reden? Ich würde das in Hinsicht auf Herrn
  Stegner jetzt hier von dieser Stelle aus nicht kommentieren. Bestünde denn aus Sicht
  der Bundesregierung die Möglichkeit, wenn diese Tür zu Herrn Putin jetzt offensichtlich
  geöffnet ist, das als Möglichkeit zu nutzen, in Verhandlungen einzutreten? Ich habe
  gerade schon darauf hingewiesen. Auch der Bundeskanzler hat darüber in den vergangenen
  Tagen ja auch vermehrt gesprochen. Der Außenminister hatte ein Treffen als zuständiger
  Amtskollege mit dem russischen Außenminister. Wir tun alles, was diplomatisch möglich
  ist, um Russland dazu zu bewegen, ernsthaft mit uns, mit den Europäern, mit der
  Ukraine, natürlich auch mit den Amerikanern, über Wege zum Frieden zu sprechen.
  Wir wollen diesen Weg gehen. Wir haben das an jeder Stelle unterstrichen. Die Bereitschaft
  auf der russischen Seite ist für uns nach wie vor nicht erkennbar. Trotzdem werden
  wir natürlich nicht müde, die Dinge zu versuchen. Ob Herr Schröder bei diesem Treffen
  Dinge angesprochen hat, liegt außerhalb unserer Kenntnis. Das müsste Herr Schröder
  beantworten. Aber würden Sie denn aktiv bei Herrn Schröder zu diesem Thema nachfragen?
  Wir sollten uns, glaube ich, dringend darauf konzentrieren, dass diejenigen, die
  Verantwortung tragen, die auch damit beauftragt sind, Gespräche führen, diese Gespräche
  auch in aller Ernsthaftigkeit führen. Noch einmal: Wir sollten nicht in gewisse
  Propagandafallen tappen. Russland hat trotz aller Versuche, auch aus den USA, zum
  Beispiel von US-Präsident Trump, erkennbar, offensichtlich kein Interesse, diesen
  bestialischen, diesen brutalen Krieg zu beenden und mit uns über Frieden zu verhandeln.
  Wenn sich an dieser Bereitschaft etwas ändert, sind wir die Ersten, die natürlich
  bereit sind, unseren Beitrag dort auch zu leisten. Herr Meyer, ist die Empörung
  über diese Putin-Schröder-Connection eine Empörung des Kanzlers oder eine Empörung
  der gesamten Bundesregierung, also auch des Vizekanzlers und anderer Minister, die
  derselben Partei angehören, der ja auch Herr Schröder nach wie vor angehört? Ich
  verstehe die Frage. Ich habe ja explizit die Haltung des Bundeskanzlers dargelegt.
  Ich würde den Versuch allerdings nicht gut finden, hier an dieser Stelle in irgendeiner
  Form einen Dissens zu erkennen. Ich denke, auch weitere Mitglieder der Bundesregierung
  werden sich zu diesem Thema äußern. Ist die Empörung Herrn Schröder direkt mitgeteilt
  worden, oder gehen Sie davon aus, dass er es jetzt über öffentliche Berichterstattung
  mitbekommt? Ich habe noch eine Frage, wahrscheinlich an das Innenministerium; ich
  bin mir nicht ganz sicher. Der Altkanzler hat ja noch immer Personenschützer, soweit
  ich weiß. Muss es eigentlich angemeldet werden, wenn diese auf eine Reise ins Ausland,
  in dem Fall Russland, mitreisen würden? Braucht es dafür eine Genehmigung? Davon
  habe ich keine Kenntnis. Ich kann versuchen, es nachzureichen, eventuell sogar noch
  hier im Laufe der Veranstaltung. Das wäre nett, einfach nur, damit man weiß, ob
  es geht. Herr Meyer, vielleicht eine Frage: Ist seitens der Bundesregierung daran
  gedacht, dass man überprüft, ob mögliche staatliche Bezüge, die der Bundeskanzler
  noch immer bekommt, möglicherweise gekürzt werden oder gestrichen werden? Noch einmal:
  Ich habe die Reaktion des Bundeskanzlers gerade dargelegt. Ich glaube, sie war in
  Klarheit nicht zu überbieten. Weiteres habe ich hier nicht anzukündigen. Zur Klärung:
  Nach Ihrer persönlichen Auffassung sind Äußerungen in der Bundespressekonferenz
  direkte Mitteilungen an betroffene Personen, oder ist das jetzt die Haltung des
  Bundespresseamtes oder der Regierung? Das wäre doch neu. Diese Interpretation überlasse
  ich Ihnen. Entschuldigung, aber Sie haben eben gesagt: Ich habe es ihm hier persönlich
  mitgeteilt. - Was soll man da interpretieren? Ich glaube, Sie haben genau verstanden,
  was ich damit sagen wollte. Das war an Klarheit nicht zu überbieten, und ich gehe
  auch fest davon aus, dass es jeden erreicht, den es erreichen soll. Es gibt Medienberichte,
  wonach sich in Frankreich Generalstabschef Fabien Mandon zum deutsch-französischen
  Panzerprojekt geäußert habe. Das ist eine Frage an das BMVg und an den Regierungssprecher.
  Er habe gesagt, Deutschland habe sich entschieden, sich aus dem Projekt zurückzuziehen.
  Ist dem so? Ich würde vielleicht anfangen und Sie ergänzen, wenn Sie mögen. - Deutschland
  hält an einer vertrauensvollen Zusammenarbeit mit Frankreich im von Ihnen angesprochenen
  Programm MGCS fest, und bezüglich der Einzelheiten gebe ich das Wort vielleicht
  dem BMVg. Genau, ich kann hier gerne etwas ergänzen. Natürlich haben wir auch die
  Medienberichte und die Berichte in den sozialen Netzwerken zur Kenntnis genommen.
  Sie haben wahrscheinlich auch selbst zur Kenntnis genommen, dass General Mandon
  und andere offizielle französische Stellen mittlerweile auch eine Richtigstellung,
  eine Gegendarstellung herausgebracht haben. Ich habe mich hier persönlich ‑ ich
  glaube, im Juni ‑ ausführlich zum Projekt geäußert. Aus unserer Sicht hat sich daran
  nichts geändert. Ich kann das gerne noch einmal zusammenfassen, wenn Sie es wünschen.
  Es gab Anpassungen an dem Gesamtprojekt, die wir auf Wunsch von beiden Seiten vorgenommen
  haben. Wir fokussieren uns jetzt nicht auf eine feste Plattform, sondern plattformunabhängig.
  Das können bemannte oder auch unbemannte Systeme sein. Es geht hierbei um die Entwicklung
  von Zukunftstechnologien für den gepanzerten Kampf, und dabei sollen die Führung,
  die Vernetzung und das geführte Gefecht im Mittelpunkt stehen. Es geht um einen
  sogenannten System-of-Systems-Ansatz. Ergänzend kann ich auch noch anführen: Mit
  der Erklärung von Nörvenich vom 17. Juli 2026 hat der Deutsch-Französische Verteidigungs-
  und Sicherheitsrat diesen Ansatz auch noch einmal bestätigt. Herr Meyer, könnten
  Sie noch etwas dazu sagen? Ist dieses Projekt aus Sicht der Bundesregierung sicher
  noch im Gange, oder rechnen Sie damit, dass die Franzosen irgendwann die Geduld
  verlieren? Vielleicht habe ich nicht richtig aufgepasst, aber ich glaube, ich habe
  gerade den entscheidenden Satz dazu gesagt. Ich kann ihn gerne noch einmal wiederholen:
  Wir halten an dieser vertrauensvollen Zusammenarbeit mit Frankreich im Rahmen dieses
  Programms fest. Können Sie noch einmal erklären, wie es zu dieser Misskommunikation
  zwischen Frankreich und Deutschland kam und wie das Zitat dann überhaupt zustande
  kam? Ich weiß jetzt nicht, wen Sie ansprechen. Wenn Sie mich darauf ansprechen,
  wie die Kommunikation zustande kam, würde ich Sie an die französische Seite oder
  an General Mandon verweisen. Wir haben ja nicht kommuniziert. Ja, aber die deutsche
  Seite und die französische Seite kommunizieren etwas Unterschiedliches. Deswegen
