  Fall sehr ernst nehmen und bei der Aufklärung mit den Ermittlungsbehörden umfassend
  und uneingeschränkt zusammenarbeiten und sie unterstützen. Dies gilt natürlich insbesondere
  auch für das Parlamentarische Kontrollgremium. Das ist natürlich auch der Ort dafür.
  Wir können hier in der Öffentlichkeit über viele Dinge, gerade wenn es nachrichtendienstliche
  Dinge betrifft, nicht informieren. Das hat gute Gründe. Das hat auch etwas mit der
  Sicherheit in Deutschland zu tun. Aber im Rahmen der Untersuchung auch des Ständigen
  Bevollmächtigten des Parlamentarischen Kontrollgremiums arbeiten wir natürlich sehr
  eng zusammen und unterstützen diese Aufklärungsarbeit sehr intensiv. Genau deswegen
  frage ich ja. Natürlich ist klar, dass Sie hier keine schutzbedürftigen Informationen
  preisgeben können. Aber deswegen noch einmal die Frage: Wie haben wir uns die Unterstützung,
  die Zusammenarbeit konkret vorzustellen? Gibt es schriftliche Anfragen seitens des
  PKGr, die Sie beantworten? Gibt es eine Teilnahme von Vertretern der Bundesregierung
  an solchen Sitzungen? Wenn ja, auf welcher Ebene? Es geht nur um den institutionellen
  Rahmen, nicht um Inhalte. Auch das sind im Kern geheim tagende Gremien. Ich würde
  Sie bitten, sich damit vielleicht direkt an das PKGr zu wenden, das ja Herr dieser
  Verfahren ist. Es gibt Ausnahmen. In der vergangenen Woche gab es eine öffentliche
  Sitzung des PKGr. Aber in der Regel tagt es geheim. Das betrifft natürlich auch
  unsere Kommunikation in diese Richtung. Frau Singer, eine Nachfrage zur Frage des
  Kollegen: Sie haben auf die Änderungen hingewiesen, die schon vorgenommen wurden.
  Aber das PKGr hat die Mahnungen aus dem Jahr 2023 gestern extra wiederholt. Deswegen
  die Frage: Plant das Innenministerium, das Bundesbeamtengesetz weiter zu verschärfen?
  Dankbar wäre ja ‑ die Forderung gibt es ‑, Geheimdienstchefs eine Beratungstätigkeit
  nach der Dienstzeit generell zu untersagen. Gibt es entsprechende Überlegungen?
  Im Detail kann ich mich dazu jetzt nicht äußern. Ich möchte noch einmal darauf hinweisen,
  dass der Generalbundesanwalt die Ermittlungen führt. Es handelt sich um laufende
  Ermittlungen. Ich möchte auch noch einmal darauf hinweisen, dass es um eine Straftat
  geht, die jetzt lückenlos aufgeklärt werden muss. Das berührt daher andere Sachverhalte
  als die Regelungen, die im Beamtenrecht gegebenenfalls geändert werden müssten.
  Das stimmt. Von daher kann es um eine persönliche Verfehlung gehen. Aber es gab
  mutmaßlich ‑ das scheint ja so zu sein ‑ Genehmigungen innerhalb des BND, dass der
  Büroleiter entsprechenden Nebentätigkeiten nachgehen konnte. Das wäre ein Beispiel
  für eine Regelung, die man im Beamtengesetz verschärfen könnte. Es tut mir leid,
  aber zu diesen Einzelheiten kann ich nichts sagen. Ich will gern auf die Verbindung
  zu Herrn Maaßen zurückkommen. Er wird vom Bundesamt für Verfassungsschutz als rechtsextrem
  beobachtet. Frau Singer, können Sie uns sagen, ob Herr Hanning Beobachtungsfall
  des Verfassungsschutzes war? Denn die beiden haben ja seit Jahrzehnten eng zusammengearbeitet,
  sind eng befreundet, und Herr Maaßen nimmt ihn jetzt in Schutz. Herr Meyer, hat
  die Bundesregierung diese politische Ebene, also den Rechtsextremismus der beiden,
  auf dem Schirm und, was das angesichts ausländischer Kräfte bedeutet, die hier die
  Rechtsextremen unterstützen? Ich kann kurz sagen, dass wir uns zu den Personalangelegenheiten
  ‑ Ihre Frage ist sehr konkret ‑ nicht weiter äußern. Dafür bitte ich um Verständnis.
  Ich werde das auch nicht weiter kommentieren. Haben Sie die Verbindung von Herrn
  Maaßen, der als rechtsextrem gilt, und Herrn Hanning auf dem Schirm? Sie haben zusammen
  im Kanzleramt gearbeitet, im Innenministerium. Ich würde, weil es ein sehr ernster
  Vorgang ist ‑ deshalb verstehe ich die Frage nicht ganz ‑, wirklich noch einmal
  auf die laufenden Ermittlungen verweisen. Sie sind sehr wichtig. Wir nehmen den
  gesamten Vorgang extrem ernst. Deswegen unterstützen wir die laufenden Ermittlungen
  natürlich umfassend. Ich habe eine innenpolitische, eine finanzpolitische Frage.
  Das Bundesverfassungsgericht wird sich sehr bald um die Erbschaftsteuer kümmern.
  Plant die Bundesregierung Änderungen im Bereich der Erbschaftsteuer? Wie Sie richtig
  sagen, sind am 12. und 13. Oktober vor dem Bundesverfassungsgericht zwei mündliche
  Verhandlungen zu Fragen der Erbschaft- und Schenkungsteuer. Zur Einordnung: Im ersten
  Verfahren geht es um die Frage, ob die Erbschaft- und Schenkungssteuer bundesweit
  einheitlich geregelt werden soll. Das zweite Verfahren betrifft die Frage, ob die
  bestehenden Regeln zur Verschonung von sogenanntem betrieblich genutztem Vermögen
  mit dem Grundgesetz vereinbar sind. Sie wissen, dass wir uns an dieser Stelle schon
  mehrfach zur Erbschaftsteuer geäußert haben. Der Bundesfinanzminister hat deutlich
  gemacht, wie wichtig ihm das Thema mit Blick auf die Vermögensverteilung und ‑gerechtigkeit
  ist und dass man sich spätestens zu dem Zeitpunkt, wenn es das Urteil gibt, mit
  weiteren Fragen beschäftigen wird. Mit welchen Argumenten werden Sie versuchen,
  die bisherigen Regelungen in Karlsruhe zu verteidigen? Sie wissen, dass ich den
  mündlichen Verhandlungen hier nicht vorgreifen kann. Ich kann Ihnen sagen, dass
  das BMF vom Parlamentarischen Staatssekretär Michael Schrodi vertreten werden wird.
  Er wird dort vortragen, wie die Rechtslage ist und wie sich das erklären lässt.
  Wie wir uns dort darüber hinaus verhalten werden, kann ich Ihnen noch nicht sagen.
  An Herrn Meyer und im Weiteren auch an das BMI: Herr Meyer, ohne jetzt in die brasilianische
  Glaskugel gucken zu müssen ‑ darum geht es gerade nicht ‑, wie ordnet der Bundeskanzler
  die aktuellen Ereignisse in Brasilien ein? Den Kanzler und den brasilianischen Präsidenten
  verbindet die Passion für den Multilateralismus. Beide Länder sind auch bei der
  G4 zur Reform der Vereinten Nationen zusammen. Wie ordnet der Bundeskanzler die
  augenblickliche Entwicklung in Brasilien ein? Eigentlich haben Sie in Ihrer Frage
  schon alles Wichtige zum deutsch-brasilianischen Verhältnis gesagt, was ich auch
  gesagt hätte. Die innenpolitischen Entwicklungen kommentieren wir hier grundsätzlich
  nicht. Meine Frage geht an das Bundesbildungsministerium. Dem Statistischen Bundesamt
  zufolge ist die Zahl junger Menschen, die die Schule ohne Abschluss verlassen ,
  auf, so meine ich, 65 000 und damit einen Höchststand gestiegen. Wie kommentieren
  Sie das? Vielen Dank für die Frage. Sie geben mir Gelegenheit, darauf einzugehen.
  Ja, diese Zahlen müssen uns beschweren. Gestatten Sie mir zu Beginn noch einen kurzen
  Hinweis: Natürlich ist Bildung Ländersache, und natürlich müssen Sie Ihre Fragen
  in diesem Zusammenhang auch an die Länder richten. Aber natürlich ist es Ziel der
  Bundesbildungs- und ‑familienministerin, dass diese Zahlen drastisch nach unten
  gehen. Wir als Bund versuchen im Schulterschluss mit den Ländern zahlreiche Dinge,
  um genau das zu erreichen. Die Ministerin hat heute im Bundestag noch zu Beginn
  dieser Regierungspressekonferenz den Entwurf eines Startchancen- und Qualitätsentwicklungsgesetzes
  eingebracht. Darin geht es um frühkindliche Bildung. Das ist aus Sicht des Ministeriums
  und vor allem auch der Ministerin ein wichtiger Schlüssel, um die Trendwende in
  der Bildung zu schaffen. Uns geht es darum, klarzumachen ‑ das haben wir auch bei
  PISA mehrfach deutlich gesagt ‑: Durch eine frühkindliche Bildung, die auf Sprachförderung
  abstellt, die darauf abstellt, dass Kinder und Jugendliche mit guten basalen Kompetenzen
  in die Schule kommen, haben sie die größten Chancen, in der Schule gute Abschlüsse
  zu erzielen. Wir haben auch das Startchancen-Programm für Schulen, das Sie sicherlich
  kennen. Ich möchte betonen, dass es hinsichtlich des Geldes und der Laufzeit eines
  der größten Programme ist, die wir als Bund im Bereich der Schule aufgelegt haben.
  Es geht darum, ähnlich wie jetzt bei Kitas, Schulen und Kitas in herausfordernden
  Lagen intensiv zu fördern, weil wir da einen Ansatzpunkt sehen und uns auch im Klaren
  darüber sind, dass wir da ansetzen müssen. Beim Startchancen-Programm geht es auch
  darum, die Erfolge, die schon greifbar sind ‑ das Programm läuft ja schon seit zwei
  Jahren ‑, nicht nur in den Startchancenschulen zu verfolgen, sondern in das gesamte
  Bildungssystem zu übertragen. Genau diese Dinge sollen langfristig dabei helfen,
  dass weniger junge Menschen die Schule ohne Schulabschluss verlassen. Ich habe eine
  Frage an das Justizministerium. Der Gesetzentwurf zum Gebäudetyp E sollte im Sommer
  vorliegen. Das immer noch nicht passiert. Warum ist er noch nicht fertig? Woran
  hakt es? Der Gesetzentwurf ist fertig. Der Gesetzentwurf zur Anpassung des Bauvertragsrechts
  ist im Sommer fertig geworden und befindet sich seither in der regierungsinternen
  Abstimmung. Wenn es nach uns ginge, dann würden wir den Gesetzentwurf gern mit Ländern
  und Verbänden diskutieren, aber im Augenblick laufen noch Abstimmungen. Können Sie
  sagen, woran es in der regierungsinternen Abstimmung hakt? Ich berichte hier nicht
  so gern aus regierungsinternen Abstimmungen. Gibt es einen ungefähren Zeitplan dafür,
  wann er ins Kabinett kommt? Anfang Juni gab es eine gemeinsame Veranstaltung der
  beiden Bundesministerinnen, auf der sehr deutlich gesagt wurde, es sei kurz davor,
  dass es komme. In diesen Zeiten, in denen ständig über bezahlbaren Wohnraum gesprochen
  wird, ist es doch ein fatales Zeichen, dass es dann nicht zwei Wochen dauert, sondern
  mehrere Monate und Sie sagen: Es hängt noch. Ich kann mich nur wiederholen. Wenn
  es nach uns ginge, dann würde der Entwurf jetzt schon öffentlich diskutiert werden.
  Das Bauen zu erleichtern, ist ein komplexes Thema. Wir befinden uns in einem sehr
  komplizierten Regelungsumfeld. Einerseits gibt es öffentlich-rechtliche Baunormen,
  die überwiegend von den Ländern erlassen werden. Dann gibt es die DIN; das ist ein
  privater Verein. Dann gibt es das Bauvertragsrecht, für das wir als Bundesministerium
  der Justiz zuständig sind. Wir haben einen Vorschlag unterbreitet. Schon in der
  vergangenen Legislaturperiode gab es einen Vorschlag. Er hat damals ein eher kritisches
  Echo erfahren. Jetzt gibt es einen neuen Entwurf. Der Umstand, dass er noch nicht
  öffentlich ist, zeigt, dass es weiterhin sehr verschiedene Auffassungen davon gibt,
  wie man beim Bauen vorankommen kann. Wir werben weiterhin intensiv dafür, dass wir
  diesen Entwurf der Öffentlichkeit bald vorstellen können. Herr Meyer, könnten Sie
  uns verraten, woran es hängt? Das mache auch ich in der Tat nur sehr ungern, weil
  ich dann über regierungsinterne Gespräche berichten müsste. Dass der Gebäudetyp
  E aber für uns insgesamt ein wichtiges Thema ist und wir dabei vorankommen wollen,
  kann auch ich noch einmal sehr stark unterstreichen. Herr Meyer, bezahlbares Wohnen
  ist ein großes Thema, gerade hier in Berlin. Sie haben gesagt, der Bundeskanzler
  mache Druck bei der Rente. Macht er denn auch bei diesem Thema Druck? Herr Giese,
  gestern und vorgestern hat in Vilnius die internationale Konferenz #DISINFO2026
  stattgefunden, auf der es um Möglichkeiten zur Bekämpfung von Desinformation geht.
  Ursprünglich wurde sie auch von der EU unterstützt. Die EU hat ihre Unterstützung
  vor dem Hintergrund, dass die Trump-Regierung Druck auf verschiedene nationale Regierungen
  ausgeübt hat, kurzfristig zurückgezogen. Ist ein solcher Druck zum Entzug der Unterstützung
  auch auf die Bundesregierung ausgeübt worden? Sie beziehen sich auf eine Entscheidung
  der EU, die mir nicht unmittelbar bekannt ist. Ich wüsste jetzt nichts von Druck
  zu berichten. Wenn ich dazu etwas hätte, dann müsste ich es Ihnen nachliefern. Andere
  nationale Regierungen inklusive der französischen haben davon berichtet oder durchscheinen
  lassen, dass es solchen Druck durchaus gegeben habe. Deswegen wäre es interessant,
  zu erfahren, ob es zum einen auch direkten Druck auf die Bundesregierung gab und
  ob zum anderen die Entscheidung der EU, die ursprünglich zugesagte Unterstützung
  zurückzuziehen, mit der Bundesregierung intern abgesprochen war. Wie bewertet die
  Bundesregierung Desinformation von staatlicher Stelle aus Amerika oder Desinformationskampagnen
  als solche? Das Wort „Desinformationskampagne“ ist negativ konnotiert. Insofern
  verbirgt sich die Antwort schon in Ihrer Frage. Desinformation finden wir nicht
  gut. Wir sprechen hier oft über Desinformation aus Russland. Auch aus Amerika ist
  diesbezüglich einiges bekannt. Das wissen wir. Welche Haltung hat die Bundesregierung
  dazu? Ich habe es gerade referiert. Wir haben hier schon sehr häufig über die russische
  Desinformation und darüber gesprochen, dass damit versucht wird, einen Spaltpilz
  in unsere Gesellschaft und in die internationale Unterstützung der Ukraine in ihrem
  Verteidigungskampf gegen Russland zu treiben, dass wir das allenthalben sehen und
  dass das in ganz vielen verschiedenen Darreichungsformen auch in unsere Gesellschaft
  geträufelt wird. Das ist Ihnen bekannt. Darüber hinaus habe ich Ihnen zu der Frage
  in dieser Allgemeinheit nicht zu sagen. Wie gesagt, Desinformation, die dazu angetan
  ist, Menschen zu manipulieren, sodass man politische Entscheidungen nicht mehr aus
  freier Entscheidung trifft, weil man beispielsweise irgendwelchen Lügen aufgesessen
  ist, lehnen wir selbstverständlich ab. Dass man dagegen arbeitet, gehört zur Verteidigung
  der Demokratie dazu. Das ist aber nicht unbedingt ein Thema für das Auswärtige Amt
  per se. Unsere Haltung dazu ist aber, glaube ich, nicht unbekannt. An das Justizministerium:
  Die Debatte über ein AfD-Verbotsverfahren hat letzte Woche durch die Anhörung im
  Thüringer Landtag noch einmal Fahrt aufgenommen. Wie ist die gegenwärtige Einschätzung
  Ihres Hauses zum Thema AfD-Verbotsverfahren? Die Ministerin hat sich dazu schon
  bei vielen Gelegenheiten geäußert, und auf diese Äußerungen würde ich hier verweisen.
  Herr Meyer, der beliebteste Politiker, Herr Pistorius, hat nicht nur das Verbotsverfahren
  befürwortet, sondern hat vor zwei Tagen auf dem Bebelplatz auch die Dringlichkeit
  untermauert. Spricht er mit dem Kanzler darüber? Wenn nicht: Wie ist die gegenwärtige
  Einschätzung des Kanzlers zum Thema AfD-Verbotsverfahren? Auch dazu haben wir uns
  in der Vergangenheit bereits häufiger geäußert und haben auf die hohen Hürden hingewiesen,
  die ein solches Verfahren mit sich brächte. An dieser Haltung hat sich nichts geändert.
  An das Gesundheitsministerium: Der Bundestag hat gefordert, Bluttests auf Downsyndrom
  künftig genauer zu beobachten. Planen Sie da möglicherweise die Einsetzung eines
  Monitoring-Gremiums oder eines anderen Expertengremiums, um diese Forderung des
  Bundestags umzusetzen? Da muss ich Sie erst einmal enttäuschen: Dazu muss ich erst
  Rücksprache halten, um dann etwas nachzureichen. Ad hoc habe ich dazu nichts. An
  das Finanzministerium: Der Eurogruppenchef hat heute die Mitgliedstaaten aufgefordert,
  bis zum 28. Oktober Kandidaten für die Nachfolge von Frau Schnabel im EZB-Direktorium
  zu nennen. Hat das Finanzministerium schon einen entsprechenden Kandidaten oder
  eine Kandidatin? Sie können sich vorstellen, wie wir es mit Personalspekulationen
  halten. Insofern habe ich hier keine Info für Sie. Entschuldigung, aber das war
  jetzt noch keine Spekulation. Es war die Frage, ob Sie schon einen Namen haben.
  Dazu würde ich mich hier nicht verhalten. Zum Thema Sachsen-Anhalt : Herr Meyer,
  letzten Freitag haben Sie uns den „Handelsblatt“-Termin von Herrn Merz auch als
  Kanzlertermin genannt. Der Kanzler ist jetzt weltweit aufgrund seiner Aussagen zum
  Thema False Flag im Magdeburger Landtag stark in der Kritik und wird dafür kritisiert,
  dass das eine Verschwörungstheorie sei. Der Punkt ist, dass er in Zweifel zieht,
  dass seine CDU-Abgeordneten nicht so abgestimmt haben, wie die ganze Welt es natürlich
  sieht. Die CDU-Abgeordneten waren die Einzigen, die nicht so abgestimmt haben, wie
  sie im Vorfeld angekündigt haben, nämlich sich zu enthalten. Bleibt der Kanzler
  jetzt, zwei Tage später, bei dieser Verschwörungstheorie? Da war jetzt aber viel
  drin, inklusive „weltweit“ und „Verschwörungstheorie“. Zu Abstimmungen, die im Parlament
  in Sachsen-Anhalt stattgefunden haben, werde ich mich jetzt hier nicht weiter einlassen.
  Sie haben selber auf den Termin hingewiesen, auf dem sich der Bundeskanzler dazu
  geäußert hat. Die Worte stehen für sich. Der Kanzler hat aber etwas gesagt, was
  einfach gemeinhin keinen Sinn macht. Seine Fraktion ist die einzige Fraktion, die
  nicht so abgestimmt hat ‑ und das ist nachweislich so ‑, wie sie angekündigt hat,
  nämlich sich zu enthalten. Warum traut sich der Kanzler, so etwas, eine False-Flag-Aktion,
  in der Öffentlichkeit ins Spiel zu bringen? Abstimmungen im Parlament in Sachsen-Anhalt
  sind kein Thema für die Bundesregierung; deshalb werde ich das nicht kommentieren.
  Dass Sie dazu eine Haltung haben und auch sagen können, dass Sie das das ganz blöd
  finden, ist ja das Schöne an unserem demokratischen System. Das ist völlig in Ordnung.
  Noch einmal: Was Herr Merz gesagt hat, steht für sich. Herr Meyer, bedarf es nach
  Auffassung der Bundesregierung für mindestens die Kommunikation einer False-Flag-Option
  eines Mindestmaßes an inhaltlicher Plausibilität für diese Option? Mir fällt es
  teilweise schwer, der Frage zu folgen. Noch einmal: Es gab eine lange Rede und es
  gab ein langes Q&A, und ich glaube, es ist wichtig, Dinge auch immer im Kontext
  zu sehen. Deshalb verweise ich noch einmal auf den Termin in dieser Woche. Den Vorwurf
  einer False-Flag-Aktion kann man eigentlich nur dann seriös erheben, wenn es eine
  Plausibilität für den Inhalt dieses Vorwurfs oder dieser Option gibt. Die Frage
  in der einfachen Form lautet: Sieht der Kanzler hinreichend Plausibilität dafür,
  dass es sich bei dem Abstimmungsverhalten ‑ geheim, geheim ‑ um eine False-Flag-Aktion
  gehandelt haben könnte? Die Bundesregierung und ich als Regierungssprecher dieser
  Bundesregierung äußern uns nicht zu Abstimmungen, die im Landtag in Sachsen-Anhalt
  stattgefunden haben. Sie haben uns hier am letzten Freitag den „Handelsblatt“-Termin
  als Termin des Bundeskanzlers bekanntgegeben. Darum fragen wir, weil er sich als
  Bundeskanzler dort aufgehalten hat und sich zu Magdeburg und diesem historischen
  Tag einer Wahl eines Rechtsextremisten geäußert hat. Er hat diese Verschwörungstheorie
  ins Spiel gebracht, die keinen Sinn macht, außer er glaubt wirklich, dass sich alle
  seine CDU-Abgeordneten enthalten haben. Darum sollten Sie sich hier dazu äußern.
  Sie haben doch gerade selbst gesagt, dass dieser Termin stattgefunden hat und dass
  Herr Merz sich dort zu verschiedensten Themen und an mehreren Stellen auch zu Sachsen-Anhalt
  geäußert hat. Noch einmal: Seine Worte stehen für sich; das habe ich jetzt ja mehrfach
  gesagt. Ich akzeptiere, dass Sie damit sozusagen nicht einverstanden sind. Aber
  dann kommentieren Sie das doch; das ist ja völlig in Ordnung. Meine Antwort ist
  die Antwort, die ich gerade gegeben habe. Es hätte ja sein können, dass er sich
  das in den letzten zwei Tagen anders überlegt hat und noch einmal darüber nachgedacht
  hat, wie unsinnig das ist. Angesichts der historischen Maßstäbe ist es, finde ich,
  gerechtfertigt, das hier noch einmal einzubringen und Sie danach zu fragen. Es hätte
  ja sein können, dass Sie sagen: In den letzten 48 Stunden ist jetzt was passiert.
  Das ist alles gerechtfertigt ‑ und unterstellen Sie mir bitte nicht, dass ich an
  irgendeiner Stelle gesagt hätte, das sei nicht gerechtfertigt ‑; ich habe aber auf
  meine Antwort verwiesen. Ich nehme zur Kenntnis, dass Ihnen die Antwort nicht passt.
  Wie gesagt, damit muss ich leben. Sie können hier alles fragen, und ich antworte,
  wie ich das für richtig halte. Noch einmal der grundsätzliche Hinweis: Auch für
  Nachfragen gilt, dass am Ende des Satzes ein Fragezeichen stehen muss. Herr Merz
  hat zuletzt selber Probleme mit demTiergartentunnel thematisiert. Wird die Bundesregierung
  das jetzt zur Chefsache machen? Er hat in der Tat über den Tiergartentunnel gesprochen ‑
  ich weiß gar nicht mehr, zu welchem Anlass. Mit der Kategorie „Chefsache“ habe ich
  generell Probleme. Wie Sie wissen, investieren wir sehr stark in unsere Infrastruktur
  und fokussieren uns darauf, dass alle Bürgerinnen und Bürger, alle Menschen gut
  von A nach B kommen. Schön wäre ja, wenn das auch hier in Zukunft gelingt. Ich habe
  noch eine Nachreichung (zur Teilnahme Gerhard Schröders an der Geburtstagsfeier
  des russischen Präsidenten ): Sie hatten nach der Begleitung von Herrn Schröder
  durch Personenschützer gefragt. Dazu kann ich Ihnen sagen: Die Begleitung von Reisen
  ist Teil des Schutzauftrags. Diese erfolgt durch die Personenschützer des BKA. Das
  BMI genehmigt Reisebegleitungen im Rahmen des Schutzauftrags nicht und wird auch
  nicht darüber informiert.'
