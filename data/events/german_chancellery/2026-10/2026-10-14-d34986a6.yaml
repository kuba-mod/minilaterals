title: Im Kabinett beschlossen Nationaler Aktionsplan klimafreundliche Schifffahrt
text: 'Die Binnenschifffahrt ist von zentraler Bedeutung für den Wirtschaftsstandort
  Deutschland. Mit dem Beschluss des Nationalen Aktionsplan klimafreundliche Schifffahrt
  setzt die Bundesregierung ein klares Zeichen: Er soll die Schifffahrt auf dem Weg
  zur Treibhausgasneutralität unterstützen und ihre Wettbewerbsfähigkeit stärken.
  Die Transformation der Schifffahrt wird gemeinsam mit der Wirtschaft und den Ländern
  innovationsgetrieben und technologieoffen gestaltet. See- und Binnenschifffahrt
  sind von zentraler Bedeutung für den Wirtschaftsstandort Deutschland. Sie sichern
  Versorgung, Wertschöpfung und Beschäftigung und sind ein unverzichtbarer Bestandteil
  leistungsfähiger Lieferketten. die Versorgung mit klimafreundlichen Kraftstoffen,
  alternative Antriebs- und Energiesysteme, Der Aktionsplan formuliert 47 klare Maßnahmen.
  Dazu gehören zum Beispiel die Überprüfung, ob für das Befahren des Nord-Ostsee-Kanals
  ein haushaltsneutraler Umwelt- bzw. Klimarabatt gewährt werden kann, dass sich die
  Bundesregierung bei der International Maritime Organisation (IMO) für weltweit einheitliche
  Wettbewerbsbedingungen einsetzen wird und die Prüfung, der Einführung von Leasingmodellen
  mit günstigen finanziellen Anreizen für umweltfreundliche Schiffe. Der Rückbau bürokratischer
  Hürden war ein Leitprinzip bei der Erarbeitung des Plans und wird auch die Umsetzung
  prägen. Der Umsetzungsprozess wird in diesem Herbst gestartet. Der Aktionsplan benennt
  klare Maßnahmen und Zuständigkeiten und bezieht Wirtschaft und die Bundesländer
  ein. Durch Flottenmodernisierungen, alternative Antriebs- und Energiesysteme sowie
  treibhausgasarme und erneuerbare klimafreundliche Energieträger wird ein wichtiger
  Beitrag zur Erreichung der Klimaziele geleistet.'
