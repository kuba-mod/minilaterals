title: Kabinett Alexander Schweitzer ist neuer Arbeits- und Sozialminister
text: Alexander Schweitzer ist Bundesminister für Arbeit und Soziales. Am 13. Oktober
  2026 hat Bundespräsident Frank-Walter Steinmeier Alexander Schweitzer zum neuen
  Bundesminister für Arbeit und Soziales ernannt. Am 14. Oktober legte Schweitzer
  seinen Amtseid vor dem Deutschen Bundestag ab. Der 53-Jährige bringt umfangreiche
  Erfahrungen in der Arbeits- und Sozialpolitik mit. In Rheinland-Pfalz war er von
  2013 bis 2014 sowie von 2021 bis 2024 Arbeits- und Sozialminister. Von 2024 bis
  2026 stand er als Ministerpräsident an der Spitze der Landesregierung. Weiterführende
  Informationen Hier finden Sie den ausführlichen Lebenslauf des Ministers , Hintergründe
  zum Bundeskabinett und die aktuelle Zusammensetzung . Als Bundesminister für Arbeit
  und Soziales wird Schweitzer wichtige Weichen für die Zukunft des Sozialstaats stellen.
  Zu den zentralen Aufgaben gehören die Stärkung des Arbeitsmarkts, die Sicherung
  von Arbeitsplätzen und die Modernisierung der sozialen Sicherungssysteme.
