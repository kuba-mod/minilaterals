title: 'Deutschlands Comeback in Los Angeles: Kulturzentrum Villa Aurora nach Bränden
  wiedereröffnet / Staatsminister Weimer übergibt Bundesverdienstkreuz an Kunstretter
  Justin Jampol'
text: 'Kulturstaatsminister Wolfram Weimer hat am Dienstag die Villa Aurora in Los
  Angeles besucht. Anderthalb Jahre nach den verheerenden Bränden in Pacific Palisades
  hat das traditionsreiche Residenzhaus kürzlich seinen Betrieb wieder aufgenommen.
  Als einer der ersten Gäste hat sich Staatsminister Weimer vor Ort ein Bild von der
  Instandsetzung des Hauses gemacht. Staatsminister Weimer dankte den Mitarbeitenden
  für ihren Einsatz für den Erhalt und die Zukunft des Hauses. Die Villa Aurora, den
  einstigen Wohnort von Lion und Marta Feuchtwanger, würdigte Kulturstaatsminister
  Weimer als einen Ort, „an dem die starke Verbundenheit der europäischen und amerikanischen
  Kultur sichtbar wird“. Er ergänzte: „Diese Villa war ein Zuhause für Menschen, denen
  Deutschland die Heimat genommen hatte, die hier ein anderes Deutschland weiterlebten.
  Ein Land des freien Denkens, der großen Literatur, der eindringlichen Musik und
  der politischen Visionen. Dieses Haus wurde zu einem Ort intellektueller Diaspora,
  von dem aus man über das verlorene Land auf der anderen Seite des Atlantiks nachdenken
  konnte. Und über die Frage, was es bedeutet, deutsch zu sein.“ Im Rahmen seines
  Besuchs überreichte Weimer stellvertretend für den Bundespräsidenten dem US-Amerikaner
  Justin Jampol das Verdienstkreuz am Bande. Mit der Auszeichnung werden Jampols herausragende
  Verdienste um die transatlantischen Kulturbeziehungen und sein Einsatz für den Erhalt
  des kulturellen Erbes gewürdigt. Während der Großbrände in Los Angeles im Januar
  2025 hatte sich Jampol selbstlos für den Schutz und die Rettung wertvoller Kulturgüter
  aus der Villa Aurora eingesetzt. Dank seiner logistischen und kuratorischen Unterstützung
  konnten Gemälde, Bücher, persönliche Gegenstände und Einrichtungsstücke aus dem
  Besitz der Familie Feuchtwanger vor den Bränden in Pacific Palisades in Sicherheit
  gebracht werden. Kulturstaatsminister Weimer sagte in seiner Rede über Jampol: „Als
  das Feuer die Villa Aurora und ihre Kunstschätze bedrohte, hat Justin Jampol nicht
  gezögert, sondern gehandelt. Sein Einsatz zeigt, was ihn antreibt: seine Verbundenheit
  mit Deutschland und seine Überzeugung, dass Geschichte unseren Einsatz braucht.
  Er selbst hat es einmal so formuliert: ‚History is now.‘ Geschichte wirkt in unseren
  Biografien fort. Sie prägt unsere Gegenwart. Und sie stellt uns heute vor Entscheidungen
  für die Zukunft. Schon allein dafür hat Justin Jampol eine Auszeichnung verdient.“
  Jampol gründete 2002 das Wende Museum of the Cold War in Culver City, Kalifornien.
  Das Museum widmet sich der Kunst, Alltagskultur und politischen Symbolik des ehemaligen
  Ostblocks. Mit seiner Sammlung aus Gegenständen, Dokumenten und persönlichen Zeugnissen
  trägt es dazu bei, das visuelle und materielle Kulturerbe der ehemaligen DDR und
  der übrigen Ostblockstaaten zu bewahren und die Alltagskultur dieser Zeit wissenschaftlich
  zu erschließen. Die Villa Aurora und das Thomas Mann House werden vom Bund gefördert.
  Als Residenz- und Begegnungsorte bieten sie Künstlerinnen und Künstlern, Schriftstellerinnen
  und Schriftstellern, Musikerinnen und Musikern sowie Intellektuellen die Möglichkeit,
  im Rahmen von Stipendien und Fellowships zeitweise in Los Angeles zu arbeiten und
  sich auszutauschen. Der Besuch in der Villa Aurora ist Teil der Reise von Kulturstaatsminister
  Weimer nach Kalifornien. Vom 20. bis 23. Oktober 2026 besucht er Los Angeles und
  San Francisco. Neben Terminen in der Villa Aurora und im Thomas Mann House stehen
  weitere Besuche bei Kultureinrichtungen sowie Gespräche mit Vertreterinnen und Vertretern
  der Filmindustrie und der Technologiebranche auf dem Programm.'
