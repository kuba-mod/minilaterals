title: Bundeskanzler Merz beim Berlin Global Dialogue Neue Partnerschaften für neue
  Stärke
text: 'Der Kanzler im Gespräch mit Jugendlichen beim Berlin Global Dialogue. Bundeskanzler
  Friedrich Merz hat an der Berlin Global Dialogue -Konferenz der European School
  of Management and Technology in Berlin teilgenommen. Dort diskutieren internationale
  Führungspersönlichkeiten aus Wirtschaft, Politik und Wissenschaft über das Thema
  „ Advancing Alliances for the New Era“. Die multiplen Krisen sowie die tiefgehenden
  weltpolitischen und technologischen Umwälzungen erforderten geschlossenes europäisches
  Handeln, neue Strategien und neue Partnerschaften, betonte der Kanzler. Die Bundesregierung
  arbeite mit aller Kraft daran, die Wettbewerbsfähigkeit und Souveränität Deutschlands
  und Europas zu stärken. Europas Strategie müsse lauten: „Promote, Protect, Partner“.
  Lesen Sie hier die Rede des Kanzlers beim Berlin Global Dialogue (englisch).'
