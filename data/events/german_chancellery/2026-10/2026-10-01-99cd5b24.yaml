title: 'Sperrfrist: 1. Oktober, 17:00 Uhr Goethes Reisemantel macht sich auf den Weg
  von Weimar nach Rom – „Giro di Goethe“ verbindet Deutschland und Italien'
text: 'Staatsminister für Kultur und Medien Wolfram Weimer und Thüringens Ministerpräsident
  Mario Voigt haben heute gemeinsam Goethes Wohnhaus in Weimar besucht und eine Replik
  des historischen Reisemantels des Dichters auf den Weg nach Rom geschickt – 240
  Jahre nach Goethes Aufbruch nach Italien. Die Berichte seiner „Italienischen Reise“
  von 1786 bis 1788 gehören zu den berühmtesten Reiseschilderungen der Literaturgeschichte.
  Sie lösten in Deutschland eine anhaltende Italiensehnsucht aus und prägten das Italienbild
  vieler Generationen. Johann Wolfgang von Goethe selbst war zeitlebens viel unterwegs
  und legte zu Fuß, zu Pferd oder mit der Kutsche insgesamt rund 40.000 Kilometer
  zurück. Der blau-graue Wollmantel mit Schulterumhang und ursprünglich rotem Samtkragen
  gehörte zu seiner Reisegarderobe. Sein Schnitt entspricht dem damals verbreiteten
  englischen „Carrick“, der auch als „Blüchermantel“ bekannt war. Ab Dezember wird
  dieses besondere Stück deutscher Kulturgeschichte nun zusammen mit weiteren hochkarätigen
  Leihgaben der Klassik Stiftung Weimar in der Ausstellung „Auf den Spuren von Goethes
  Italienischer Reise“ der Casa di Goethe in Rom zu sehen sein. Die Ausstellung ist
  zugleich eine zentrale Station des neuen deutsch-italienischen Kulturprojekts „Giro
  di Goethe“. Staatsminister für Kultur und Medien Wolfram Weimer: „240 Jahre nach
  Goethes Aufbruch nach Italien machen wir uns auf seinen Spuren auf den Weg: Mit
  dem ‚Giro di Goethe‘ wollen wir seine Italienische Reise zu einer lebendigen Kulturroute
  machen – von Verona über Venedig und Florenz bis nach Neapel und Sizilien. Der historische
  Reiseweg wird so zu einer Einladung, Italien und Goethe neu zu entdecken, Kultur
  zu erleben und Menschen miteinander zu verbinden.“ Die Kulturroute „Giro di Goethe“
  geht auf eine gemeinsame Absichtserklärung zurück, die Staatsminister Weimer und
  der italienische Kulturminister Alessandro Giuli im Januar 2026 im Rahmen der deutsch-italienischen
  Regierungskonsultationen unterzeichnet haben. Ziel ist es, die „Italienische Reise“
  neu zu beleben und Goethes historische Reiseroute als grenzüberschreitendes Kultur-
  und Tourismusprojekt erfahrbar zu machen. Die Route soll den zentralen Stationen
  von Goethes Reise folgen. In Zusammenarbeit mit Kommunen, Regionen und dem italienischen
  Kulturministerium soll entlang des Goethewegs ein Netz aus kulturellen und touristischen
  Angeboten, Veranstaltungen und Anlaufpunkten entstehen. Ob mit dem Auto, dem Zug
  oder zu Fuß: Die historische Route soll ausgehend von Goethes literarischen Schilderungen
  zu einer lebendigen Erzählung über Land, Leute und Kultur werden. Sie richtet sich
  an kulturinteressierte Reisende ebenso wie an ein internationales und insbesondere
  junges Publikum. Einer der Projektpartner ist das Museum Casa di Goethe in Rom.
  Es befindet sich an der Via del Corso am historischen Ort, an dem Goethe während
  seines Aufenthalts in Rom unter anderem mit dem Maler Johann Heinrich Wilhelm Tischbein
  zusammenlebte. Die Ausstellung „Auf den Spuren von Goethes Italienischer Reise“
  in der Casa di Goethe wird im Dezember 2026 eröffnet. Im Frühjahr 2027 ist zudem
  eine Ausstellung in Neapel zu Goethes Blick auf Italien mit begleitender internationaler
  Tagung geplant. Das Projekt soll in den kommenden Jahren weiter wachsen.'
