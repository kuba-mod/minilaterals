title: SIMEP 2026 in Potsdam Junge Menschen debattieren Europas Zukunft
text: 'Der stellvertretende Regierungssprecher Sebastian Hille beantwortete die Fragen
  der Schülerinnen und Schüler. Seit 1999 ermöglicht die „Simulation Europäisches
  Parlament“ (SIMEP) jungen Menschen, europäische Politik kennenzulernen und selbst
  zu erleben. Dabei schlüpfen rund 90 Schülerinnen und Schüler der Klassen 10 bis
  13 aus ganz Deutschland in die Rolle von Abgeordneten des Europäischen Parlaments.
  In diesem Jahr findet die Veranstaltung vom 29. bis 30. Oktober 2026 im Landtag
  Brandenburg statt. Bei der Eröffnungsveranstaltung der SIMEP begrüßte der stellvertretende
  Regierungssprecher Sebastian Hille die Teilnehmerinnen und Teilnehmer in Potsdam.
  „Wir brauchen junge engagierte Menschen wie Sie“, betonte Hille. Er ermutigte die
  Teilnehmenden, die beiden SIMEP -Tage zu nutzen, um europäische Politik aktiv zu
  erleben und als engagierte Europäerinnen und Europäer mitzugestalten. Er erklärte,
  dass die Jugendlichen in ein Europa hineingeboren seien, in dem die heutigen Freiheiten
  für sie selbstverständlich seien. „Das ist den europäischen Ländern zu verdanken,
  die entschieden haben, dass wir gemeinsam besser dran sind als allein“. Nur als
  geeintes Europa sei es möglich, Antworten auf die großen Herausforderungen unserer
  Zeit zu geben. Bei der anschließenden Diskussionsrunde stellten die Schülerinnen
  und Schüler dem stellvertretenden Regierungssprecher unter anderem Fragen zu den
  Schwerpunkten deutscher Politik in Europa. Besonders wirtschafts-, handels- und
  finanzpolitische Themen interessierten die Teilnehmenden. Hille erklärte: „Nur wenn
  Europa wirtschaftlich erfolgreich ist, haben wir die Mittel, zu tun, was wir tun
  wollen, um die derzeitigen Herausforderungen anzugehen. Wir wollen die Wettbewerbsfähigkeit
  der EU stärken – um unseren Wohlstand in Deutschland und Europa zu erhalten.“ Die
  Teilnehmenden der SIMEP arbeiten in diesem Jahr zum Thema „Die Zukunft des europäischen
  Emissionshandels“ in Ländergruppen, Fraktionen und Ausschüssen, erarbeiten Positionen
  und Textvorschläge und vertreten diese anschließend in einer Plenarsitzung. Dabei
  lernen sie interaktiv, wie die Organe der Europäischen Union zusammenwirken und
  welche Rolle das Europäische Parlament zwischen nationalen Interessen und gemeinsamen
  europäischen Belangen spielt.'
