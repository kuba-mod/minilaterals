title: Rede von Bundeskanzler Merz beim German-Japanese Business Summit Wachstum durch
  Schlüsseltechnologien
text: '„Wir sollten zeigen, dass wir gemeinsam – Japan und Deutschland, Deutschland
  in der Europäischen Union – Seite an Seite diesen Herausforderungen unserer Zeit
  entschlossen begegnen“, forderte der Kanzler in seiner Rede. Japan und Deutschland
  verfügten in zahlreichen Industrien über komplementäre Stärken – und könnten gemeinsam
  mehr erreichen, unterstrich Bundeskanzler Friedrich Merz in seiner Rede beim German-Japanese
  Business Summit in Tokio . „Deutsche Ingenieurskunst und Erfahrung im Maschinenbau
  treffen auf japanische Präzision und starke Präsenz in den asiatischen Märkten.
  Wenn wir diese Stärken verbinden, dann entstehen neue Chancen, die kein Unternehmen
  allein in gleicher Weise erschließen kann“, betonte der Kanzler. Beide Länder hätten
  eine starke industrielle Basis, exzellente Forschungseinrichtungen und Unternehmen,
  die komplexe technische Systeme entwickeln und weltweit vermarkten können. „Deutschland
  und Japan wollen Handel ermöglichen, wollen Investitionen erleichtern, wollen Innovation
  fördern und verlässliche Partnerschaften schaffen, nicht als Reaktion auf eine einzelne
  Krise, sondern als langfristige Strategie für Wachstum, Wohlstand und Sicherheit“,
  machte Merz deutlich. Japan ist Deutschlands zweitgrößter Handelspartner in Asien,
  weltweit auf Platz 16. 2025 betrugen die deutschen Importe 22,1 Milliarden Euro
  und die deutschen Exporte 21 Milliarden Euro. Wichtigste Handelsgüter sind pharmazeutische
  und chemische Erzeugnisse, Maschinen, Fahrzeuge und Fahrzeugteile sowie Elektronik
  und Elektrotechnik. Sehr geehrter Herr Vorsitzender, lieber Herr Tsutsui , liebe
  Kolleginnen und Kollegen der mich begleitenden Wirtschaftsdelegation, vor allem
  aber liebe Freundinnen und Freunde der Industrie- und Handelskammer in Japan, wir
  gehören gemeinsam zu den größten Volkswirtschaften und stehen für freien Handel.
  Unsere wirtschaftliche Stärke lebt von den vielfältigen Verbindungen unserer Unternehmen.
  Was uns stark macht, zeichnet uns gemeinsam aus: Innovationskraft, technologischer
  Fortschritt, Präzision und Verlässlichkeit. In diesem Sinne bedanke ich mich sehr
  herzlich für das freundliche Willkommen heute hier in Tokio . Ich freue mich sehr,
  dass Sie in so großer Zahl der Einladung der Kammer zu diesem Treffen gefolgt sind.
  Meine Damen und Herren, so wie ich es gesagt habe, haben sich Deutschland und Japan
  auf den Weg gemacht, ihre Zukunft zu gestalten. Japan – Sie haben es gerade gesagt,
  Herr Vorsitzender – hat sich vorgenommen, seine wirtschaftliche Stärke durch gezielte
  Investitionen, durch technologische Innovationen und vor allem durch eine robuste
  industrielle Basis weiter auszubauen. Die japanische Wachstumsstrategie setzt auf
  strategische Schlüsseltechnologien – Sie haben Sie gerade genannt –, die Stärkung
  der wirtschaftlichen Sicherheit und eine engere Zusammenarbeit von Staat und Wirtschaft.
  Sie haben sich ein ambitioniertes Ziel gesetzt, nämlich das Ziel, bis zum Jahr 2040
  rund 2,3 Billionen US -Dollar zu investieren. Es ist richtig, Wachstum entsteht
  eben nicht von selbst. Wir brauchen Investitionen. Wir brauchen unternehmerische
  Freiheit. Wir brauchen qualifizierte Fachkräfte. Wir brauchen verlässliche Rahmenbedingungen.
  Meine Damen und Herren, wir brauchen insgesamt eine Politik, die Chancen eröffnet
  und die wirtschaftliche Entscheidungen nicht im Übermaß reguliert. In diesem Sinne
  hat auch für Deutschland die Verbesserung der Wettbewerbsfähigkeit eine hohe Priorität.
  Wir wollen und müssen unsere Produktivität steigern, und wir wollen Investitionen
  erleichtern. Wir wollen, dass sich Innovation in Deutschland und in Europa wieder
  besser auszahlt. In dieser Hinsicht können wir in unseren Ländern, Japan und Deutschland,
  gemeinsam mehr erreichen. Wir verfügen in zahlreichen Industrien unserer Unternehmen
  über komplementäre Stärken. Deutsche Ingenieurskunst und Erfahrung im Maschinenbau
  treffen auf japanische Präzision und starke Präsenz in den asiatischen Märkten.
  Wenn wir diese Stärken verbinden, dann entstehen neue Chancen, die kein Unternehmen
  allein in gleicher Weise erschließen kann. Die große Zahl der heute anwesenden Vertreter
  und Vertreterinnen der deutschen Unternehmen und der japanischen Unternehmen zeigt
  das Ausmaß unserer Verbindung und auch das Potenzial neuer Kooperationen. In diesem
  Sinne wollen wir gemeinsam neue Märkte erschließen. Das gilt gerade für die schon
  genannten Zukunftstechnologien. Ich nenne sie aus unserer Sicht: Halbleiter, Robotik,
  künstliche Intelligenz, Quantentechnologien, Biotechnologie, moderne Fertigungsverfahren,
  Fusionstechnologie. Ich werbe deshalb sehr ausdrücklich für mehr japanisch-deutsche
  Kooperation, auch auf Drittmärkten. Wir sollten systematisch gemeinsame Projekte
  in der Infrastruktur, der Energieversorgung, der industriellen Digitalisierung und
  der nachhaltigen Produktion identifizieren. Unsere Auslandshandelskammern, Wirtschaftsverbände,
  unsere Unternehmen insgesamt können dafür einen entscheidenden Beitrag leisten.
  Tun Sie also hier mit, meine Damen und Herren, als Unternehmerinnen und Unternehmer!
  Hier warten große Chancen für uns alle. Sie wissen es: Künstliche Intelligenz revolutioniert
  die industrielle Produktion in einem Ausmaß, wie wir alle es heute wahrscheinlich
  noch nicht wirklich verstehen. Sie verändert die Forschung, und sie verändert große
  Bereiche wirtschaftlicher Tätigkeit. – Ich will es so ausdrücken: Über unseren künftigen
  Wohlstand wird damit entschieden. Künstliche Intelligenz eröffnet enorme Chancen
  für effiziente Produktionsprozesse, für intelligente Logistik, für eine höhere Produktivität.
  Deutschland und Japan verfügen in diesem Sinne über sehr gute, über hervorragende
  Voraussetzungen, um diese Möglichkeiten auch zu nutzen. Beide Länder haben eine
  starke industrielle Basis, exzellente Forschungseinrichtungen und Unternehmen, die
  komplexe technische Systeme entwickeln und weltweit vermarkten können. Japan ist
  längst ein enger Partner im Rahmen von Industrie 4.0; so nennen wir es. Vergangenes
  Jahr haben wir das zehnjährige Jubiläum dieser Partnerschaft gemeinsam gefeiert.
  Wir haben jetzt die Chance, die nächsten zehn Jahre ganz vorn mitzugestalten, genau
  dort, wo KI mit Robotik, Automatisierung, Maschinenbau und industriellen Taten zusammenkommt.
  Unser europäischer Anspruch ist es, Europa zu einem KI -Kontinent werden zu lassen.
  Wir haben die gesammelten Expertisen und Investitionen aus den europäischen Mitgliedstaaten
  zusammengezogen und arbeiten gerade an der nächsten Generation eines – so nennen
  wir es – Ökosystems für industrielle KI . In Deutschland haben wir gemeinsam mit
  der Wirtschaft die Plattform Industrie 4.0 zur neuen Plattform „Industrie für AI
  “ weiterentwickelt, und wir wollen mit der „ European future of AI Initiative “,
  die auch ausdrücklich für nichteuropäische Partner geöffnet werden soll, die nächste
  Generation der künstlichen Intelligenz entwickeln. Meine Damen und Herren, in diesem
  Sinne ist Japan eingeladen, an dieser Initiative mitzuwirken. Ich nenne ein weiteres
  Ziel, das uns gemeinsam verbindet. Wir lernen in diesen turbulenten Zeiten, dass
  der technologische Fortschritt, den wir wollen, von Voraussetzungen abhängt, die
  wir selbst besser garantieren müssen. Ohne kritische Rohstoffe gibt es keine Batterien,
  keine modernen Halbleiter, keine leistungsfähigen Elektromotoren und keine der anderen
  der zahlreichen Technologien, auf die unsere Volkswirtschaften zukünftig angewiesen
  sein werden, mehr als je zuvor. Wir gehen erhebliche Risiken ein, weil sich Rohstoffgewinnung
  und Rohstoffverarbeitung auf wenige Länder dieser Welt konzentriert. Wir müssen
  unsere Bezugsquellen diversifizieren! Wir müssen Recycling und Kreislaufwirtschaft
  stärken und neue Technologien zur effizienteren Nutzung von Materialien entwickeln!
  Japan, Sie, haben hier schon sehr viel Erfahrung, und deshalb sollten Deutschland
  und Japan auch auf diesem Feld enger zusammenarbeiten. Beide Länder sind auf verlässliche
  Lieferketten angewiesen, beide verfügen über technologische Kompetenzen, die sich
  gegenseitig ergänzen, und beide haben ein Interesse daran, wirtschaftliche Abhängigkeiten
  zu reduzieren, ohne den internationalen Handel dadurch einzuschränken. Ja, meine
  Damen und Herren, wir lernen in diesen Jahren wieder einmal, dass es Freiheit und
  Frieden nur gibt, wenn wir sie mit Macht und auch mit Stärke schützen. Deutschland
  und Japan sind bereit, mehr Verantwortung für die internationale Ordnung und für
  die Sicherheit ihrer Bürgerinnen und Bürger zu übernehmen. Verteidigungsfähigkeit,
  und ich kenne die Diskussion auch in Ihrem Land, erfordert politische Entschlossenheit.
  Sie erfordert aber ebenso eine leistungsfähige industrielle Basis, sie erfordert
  technologische Kompetenz, und sie erfordert, erneut gesagt, belastbare Lieferketten.
  Deshalb sollten wir auch in Zukunft die Zusammenarbeit unserer Verteidigungsindustrie
  vertiefen. Gemeinsam mit unseren Industriepartnern wollen wir neue Märkte erschließen
  und bestehende Exportpotenziale weiterentwickeln. Deshalb – Sie werden es bemerkt
  haben – begleiten mich auch Vertreter deutscher Unternehmen der Sicherheitsindustrie
  und der Verteidigungsindustrie. Auch dieses Thema zeigt: Unsere Partnerschaft wird
  immer wichtiger in einer Zeit, in der sich die Welt eben grundlegend ändert. Wir
  erleben Kriege in Europa und im Nahen und Mittleren Osten. Wir erleben zunehmenden
  Protektionismus und einen intensiven Wettbewerb um Technologien, um, erneut gesagt,
  Rohstoffe und um industrielle Wertschöpfung. Wenn aber globale Lieferketten politisch
  instrumentalisiert werden, wenn der freie Zugang zu Schlüsseltechnologien erschwert
  wird, wenn Rohstoffsicherung für Machtpolitik eingesetzt wird, statt in fairer Partnerschaft
  zu geschehen, wenn einseitige Abhängigkeiten die eigene wirtschaftliche und politische
  Handlungsfähigkeit infrage stellen, dann gefährdet das Wachstum, Wohlstand und letztendlich
  die Sicherheit ganzer Regionen. Es ist keine Antwort, sich von der Weltwirtschaft
  oder von bestimmten großen Märkten abzukoppeln. Das wäre die falsche und es wäre
  eine gefährliche Antwort. Volkswirtschaften wie die unseren, deren Wohlstand ganz
  wesentlich auf internationalem Handel und industrieller Stärke beruht, können ihre
  Zukunft nicht durch Abschottung gewinnen. Stattdessen betreiben wir in Europa ein
  aktives „ de-risking “, um gemeinsam mit unseren Partnern Risiken abzubauen, kritische
  Lieferketten abzusichern und faire Rohstoff- und Technologieallianzen aufzubauen.
  Diversifizierung ist unsere geteilte Agenda, um wirtschaftliche Stärke, Handlungsfreiheit
  und Stabilität zu sichern. Deutschland und Japan wollen Handel ermöglichen, wollen
  Investitionen erleichtern, wollen Innovation fördern und verlässliche Partnerschaften
  schaffen, nicht als Reaktion auf eine einzelne Krise, sondern als langfristige Strategie
  für Wachstum, Wohlstand und Sicherheit. Meine Damen und Herren, das Freihandelsabkommen
  zwischen der Europäischen Union und Japan ist hierfür eine wichtige Grundlage. Auch
  neue Abkommen mit Indien, Indonesien, Australien und bald auch den Philippinen,
  Malaysia und Thailand zeigen: Deutschland und die Europäische Union sind und bleiben
  Motoren für den Freihandel. Wir wollen die Verhandlungen mit weiteren Partnern der
  Region zum Abschluss bringen, und wir wollen eine Perspektive über die bilateralen
  Abkommen hinaus eröffnen. Viele Staaten hier in der Region, aber auch weltweit,
  verdanken ihren Wohlstand und ihren wirtschaftlichen Aufschwung dem internationalen
  Handel. Herr Vorsitzender, Sie haben es genauso zum Ausdruck gebracht. Sie sind
  aus gutem Grund nicht bereit, diesen Wohlstand aufzugeben. Aber genau diese Staaten
  rufe ich dazu auf, den offenen und regelbasierten Handel zu unterstützen. Lassen
  Sie uns enger zusammenrücken und gemeinsam vorangehen, um die regelbasierte globale
  Wirtschaftsordnung zu verteidigen und sie auch weiterzuentwickeln. Meine Damen und
  Herren, ich will, dass wir uns große Ziele setzen. Lassen Sie uns unsere bilateralen
  Handelsabkommen miteinander verzahnen, miteinander verbinden, damit unsere Unternehmen
  deren Vorteile kombiniert nutzen können. Und lassen Sie uns gemeinsam auf ein großes
  interregionales Abkommen hinarbeiten, das die Realitäten vernetzter Liefer- und
  Produktionsbeziehungen widerspiegelt. Ich nenne Ihnen hierzu ein Beispiel: Der Dialog
  zwischen der Europäischen Union und CPTPP ist hier ein richtiger Schritt in die
  richtige Richtung. Vielleicht steht am Ende sogar ein Abkommen zwischen der Europäischen
  Union und den ASEAN -Staaten insgesamt. Wir wollen jedenfalls an diesem Ziel festhalten
  und mit Ihnen darüber in einen Dialog eintreten; denn Handelsabkommen, meine Damen
  und Herren, sind eine unverzichtbare Basis. Doch wir dürfen nicht vergessen, dass
  unsere globale, regelgebundene Handelsordnung auch unsere politische Unterstützung
  braucht. Deshalb schlage ich vor, gemeinsam eine globale politische Allianz für
  regelgebundenen Handel zu begründen. Diese politische Allianz sollte den regelbasierten
  Handel einschließlich der Welthandelsorganisation WTO verteidigen, stärken und weiterentwickeln.
  Sie sollte politische Impulse setzen und auch gemeinsam reagieren, wenn die regelbasierte
  Ordnung in Gefahr gerät. In einer solchen Allianz gleichgesinnter Partner könnten
  wir unsere Unterstützung für ein regelbasiertes Handelssystem bündeln und auch dringend
  notwendige Reformen, etwa der WTO , voranbringen. Wir könnten bekräftigen, dass
  wir auf unerlaubte Zölle oder Zwang verzichten. Wir könnten unser gemeinsames Verständnis
  wichtiger Handelsregeln schärfen, etwa zur Industriepolitik oder zur nationalen
  Sicherheit. In der Streitbeilegung könnten wir uns darauf verständigen, trotz der
  gegenwärtigen Blockade der WTO -Berufungsinstanz Entscheidungen als verbindlich
  anzuerkennen. Und wenn die Regeln des Welthandelssystems von anderen infrage gestellt
  oder gar gebrochen werden, oder wenn wirtschaftlicher Zwang ausgeübt wird, dann
  könnten wir uns in der Allianz koordinieren und gemeinsam auftreten. Meine Damen
  und Herren, ich gebe zu: Das ist eine Perspektive für die Zukunft, an der wir arbeiten
  müssen. Das ist aber der Weg, auf dem wir geleitet von gemeinsamen Werten, pragmatisch
  und ambitioniert in eine gemeinsame Zukunft gehen können. Der kanadische Premierminister
  Mark Carney sprach Anfang des Jahres auf der Konferenz in Davos von prinzipiengeleitetem
  Pragmatismus. Ich will es einmal so ausdrücken: Ganz gleich, ob wir nun Groß-, Klein-
  oder Mittelmächte sind: Wenn wir gemeinsam vorangehen, wird die Frage nicht mehr
  sein, ob wir, „auf der Speisekarte stehen“ oder „am Tisch sitzen“. Vielmehr gehört
  uns dann gemeinsam – um im Bild zu bleiben – das Restaurant. Meine sehr verehrten
  Damen und Herren, die ersten japanisch-deutschen Regierungskonsultationen 2023 mit
  Fokus auf Wirtschaftssicherheit waren ein Bekenntnis zu einer vertieften Zusammenarbeit.
  Wirtschaftliche Sicherheit entsteht heute durch den verlässlichen Zugang zu Rohstoffen,
  durch technologische Fähigkeiten, effiziente Ressourcennutzung und ein multilaterales
  Netz verlässlicher Partnerschaften. Ich freue mich in diesem Sinne darauf, die Regierungskonsultation
  im nächsten Jahr in Berlin fortzusetzen, und ich lade die japanische Regierung von
  dieser Stelle aus noch einmal von ganzem Herzen dazu ein. Schließlich, meine Damen
  und Herren: Eine Konferenz wie diese – und ich bedauere, dass ich nicht die ganze
  Zeit bei Ihnen sein kann, sondern die Konferenz gleich verlassen muss, weil ich
  die Premierministerin treffe – ist das Ergebnis monatelanger intensiver Vorbereitung.
  Mein ausdrücklicher Dank gilt deshalb den Organisatoren der Außenhandelskammer Japan,
  die so viel für die Fachkräftebasis unserer beiden Volkswirtschaften tut, dem japanischen
  Industrieverband und langjährigen Partner für deutsche Unternehmen Kaidanren, und
  Minister Akazawa. Ich freue mich, dass Sie alle hier heute so zahlreich dabei sind
  und die Gelegenheit nutzen, über eine Vertiefung unserer Wirtschaftsbeziehungen
  zu sprechen. Von deutscher Seite wünschen wir uns eine solche Vertiefung, wissend,
  dass wir auf eine viele Jahrzehnte währende gute partnerschaftliche Zusammenarbeit
  zurückblicken können, die jetzt in eine neue Phase eintreten sollte. Wir sollten
  zeigen, dass wir gemeinsam – Japan und Deutschland, Deutschland in der Europäischen
  Union – Seite an Seite diesen Herausforderungen unserer Zeit entschlossen begegnen.
  Ich wünsche Ihnen in diesem Sinne spannende Impulse und bereichernde Gespräche.
  Ich danke Ihnen allen noch einmal sehr herzlich für Ihr großartiges Engagement in
  Ihren Unternehmen, aber vor allem auch in der sehr guten Zusammenarbeit zwischen
  Japan und Deutschland.'
