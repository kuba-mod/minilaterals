title: Bundesregierung aktuell
text: 'der Irrsinn des russischen Krieges steigt dem Kanzler in Kyjiw geradezu in
  die Nase. Am Sonntag war Friedrich Merz im Morgengrauen am Hauptbahnhof angekommen
  – wie stets nach einer langen Bahnfahrt durch die Nacht von der polnisch-ukrainischen
  Grenze aus. Wenige Stunden später steht er vor dem Gebäude der ukrainischen Akademie
  der Wissenschaft an der Wolodymyrska-Straße, oder genauer: was davon übriggeblieben
  ist. Denn die Akademie wurde von einer russischen Drohne getroffen, die Bilder vom
  brennenden Gebäude gingen um die Welt, nicht zuletzt, weil sie den dramatischen
  Moment zeigen, in dem sich das Akademiemitglied Igor Malchevsky durch ein geborstenes
  Fenster im oberen Stock vor Rauch und Flammen flüchtet. Jetzt steht Malchevsky neben
  Merz und dem ukrainischen Präsidenten Wolodymyr Selenskyj vor der Hausruine, der
  Brandgeruch liegt noch in der Luft, und der deutsche Bundeskanzler kann am eigenen
  Leib spüren, wie der Terrorkrieg funktioniert. Denn es ist nicht die Zerstörungskraft
  der russischen Drohnen, die der Ukraine zusetzt – Kiew ist im wahrsten Wortsinn
  eine Großstadt, von einem Drohneneinschlag wenige Stunden später und viele Kilometer
  entfernt auf einer Brücke erfährt die deutsche Delegation auch nur durch die Medien.
  Aber diese Nadelstich-Taktik entfaltet gleichwohl ihre Wirkung: Die Luftalarm-Sirenen
  heulen auf den Handys, Blicke gehen in den Himmel, die Sicherheit wird nervös. Dies
  also ist die Wirkkraft eines sinnentleerten Krieges: Terror, Ungewissheit, immerwährende
  Angst und Todesgefahr – russisches Roulette im vierten Kriegsjahr. Was Deutschland
  und sein Bundeskanzler da ausrichten können? Standhaft bleiben gegen das Unrecht,
  die Verteidigung unterstützen, weil diese Verteidigung auch der deutschen Sicherheit
  dient. Russland wird diesen Krieg nur beenden, wenn es seine Unterlegenheit akzeptiert
  und ernsthafte Nachteile erfährt. Zum ersten Mal seit Kriegsbeginn begleitete eine
  Wirtschaftsdelegation den Kanzler nach Kyjiw - darunter Vertreter der Verteidigungs-
  und Energiewirtschaft. Die Ukraine erhält viel internationale Unterstützung, aber
  sie kauft sich auch Hilfe aus dem Ausland ein. 14 Vereinbarungen mit einem Volumen
  von über 6,6 Milliarden Euro wurden unterzeichnet. Deutsche und ukrainische Unternehmen
  entwickeln Technologien, von denen beide Länder profitieren. Profitieren wird die
  Ukraine auch von der deutschen Soforthilfe für Energiesicherheit im Winter: 350
  Millionen Euro für Generatoren, Umspannanlagen und Reparaturen. Und eine Milliarde
  Euro zusätzliche Militärhilfe unter anderem für Abstandswaffen mit mehr als 1.000
  km Reichweite, Kampfdrohnen und Antijet-Drohnen. Entscheidend für die anhaltende
  Unterstützung ist die Geschlossenheit der Partner, vor allem der sogenannten E3
  – Deutschland, Großbritannien und Frankreich. Deswegen war es gut, dass der neu
  ins Amt gewählte britische Premierminister Andy Burnham am Donnerstag nach Berlin
  zum Antrittsbesuch reiste. Die deutsch-britischen Beziehungen sind ungetrübt trotz
  des Brexit-Schocks, der die Wirtschaft aber auch viele Bürgerinnen und Bürger durchfahren
  hat. Die Substanz der Beziehungen haben Briten und Deutsche jetzt im Kensington-Vertrag
  geregelt, der am Donnerstag ausgetauscht wurde – unter den erwartungsvollen Augen
  einer Schulklasse, die demnächst zum Austausch ins Vereinigte Königreich fahren
  möchte. Diese so wichtigen und beziehungsfördernden Fahrten ins andere Land sollen
  wieder leichter werden. Und Burnham hat auch in Berlin angekündigt, dass er die
  Annäherung an die EU sucht. Kanzler Merz wird das uneingeschränkt unterstützen.
  Am Mittwoch schließlich traf sich die Koalitionsspitze zum ersten Mal seit der Sommerpause.
  Das Arbeitspensum bleibt hoch, große Reformen vor allem bei der Rente und für den
  Arbeitsmarkt stehen noch an. Die Liste der geplanten Beschlüsse ist lang und die
  Gesetzgebungsverfahren in Deutschland sind langwierig, der Abstimmungsbedarf bleibt
  hoch und mit der Ungeduld vieler Bürgerinnen und Bürger verhält es sich ähnlich.
  Hier kann ich immer nur um Verständnis für Prozesse und Verfahren werben. Demokratie
  ist ein mühsames Geschäft, jede Entscheidung wird in vielen Gremien gewogen, justiert
  und abgestimmt, ehe es in die nächste Runde geht. Deswegen wiederholen sich die
  Diskussionszyklen, und die Beobachter werden ungeduldig. Demokratie „Made in Germany“
  wurde nicht fürs Social-Media-Zeitalter erfunden. Und dennoch funktioniert sie –
  gerade, weil sie so gründlich ist. Bundeskanzler Merz anlässlich des 3. Jahrestags
  des 7. Oktobers 2023 „Am heutigen Jahrestag der furchtbaren Hamas-Terroranschläge
  vom 7. Oktober 2023 sind unsere Gedanken bei den Opfern und ihren Hinterbliebenen,
  den Überlebenden und den ehemaligen Geiseln. Wir gedenken der Toten. Wir trauern
  mit den Hinterbliebenen. Und wir hoffen, dass der tiefe Schmerz und die Wunden,
  die dieser Tag, die diese monströsen, barbarischen Taten geschlagen haben, heilen
  können. Deutschland steht fest an der Seite Israels. Unsere israelischen Freunde
  können auf unseren Einsatz zählen, damit sich ein solches Verbrechen niemals wiederholt.
  Wir stehen für die Sicherheit und Existenz Israels ein – das ist Lehre aus der Shoah
  und Teil deutscher Identität.“ Wir freuen uns über Ihr Feedback: Nutzen Sie bitte
  dafür das Kontaktformular (nicht die Antwortfunktion auf diese E-Mail).'
