title: Bundeskanzler Merz empfängt den tschechischen Staatspräsidenten Pavel zu einem
  Arbeitsbesuch
text: Bundeskanzler Friedrich Merz wird am 21. Oktober um 16:30 Uhr den tschechischen
  Staatspräsidenten Petr Pavel im Bundeskanzleramt zu einem Arbeitstreffen empfangen.
  In einem gemeinsamen Gespräch werden insbesondere bilaterale Themen sowie außen-
  und sicherheitspolitische Fragen erörtert.
