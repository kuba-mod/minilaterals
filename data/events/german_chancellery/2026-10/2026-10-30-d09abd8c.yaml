title: Asienreise von Bundeskanzler Merz „Diese Region ist für uns von größter strategischer
  Bedeutung“
text: 'In Seoul begrüßte der Präsident Südkoreas, Lee Jae-myung, den Bundeskanzler
  an seinem Amtssitz. Zum Abschluss seiner Asienreise hat Bundeskanzler Friedrich
  Merz ein positives Fazit nach den Besuchen in Singapur, Japan und Südkorea gezogen.
  „Diese Region ist für uns von größter strategischer Bedeutung“, sagte Merz in Seoul
  . Und man habe gemeinsame Sicherheitsinteressen, so der Kanzler weiter. Deutschland
  werde zudem in der Region als wichtiger Partner angesehen. Das eröffne Chancen,
  die es zu nutzen gelte, resümierte der Bundeskanzler. Nach seinen Stationen in Singapur
  und Japan war Kanzler Merz am Donnerstag in der Republik Korea (Südkorea) eingetroffen.
  In Seoul wurde er von dem südkoreanischen Präsidenten Lee Jae-myung empfangen. Nach
  den Gesprächen sagte der Kanzler , es sei in einer Zeit der globalen Umbrüche „nur
  folgerichtig, dass wir jetzt unsere Partnerschaft vertiefen, denn wir brauchen mehr
  denn je ein starkes Netz von Partnern, die wichtige Interessen und gemeinsame Werte
  miteinander teilen“. Das gelte sicherheitspolitisch, wirtschaftlich und geopolitisch.
  Am Freitag eröffnete Kanzler Merz die 19. Asien-Pazifik-Konferenz der Deutschen
  Wirtschaft in Seoul. In seiner Rede unterstrich er die Bedeutung eines regelgebundenen,
  freien Handels und warb für Handelsabkommen sowie aktives De-Risking durch faire
  Rohstoff- und Technologiepartnerschaften. Zudem schlug Merz die Gründung einer globalen
  politischen Allianz für regelgebundenen Handel vor, in der gleichgesinnte Staaten
  zu einer fairen internationalen Handelspolitik beitragen sollten. Mit Blick auf
  die Beziehungen zwischen Südkorea und Deutschland betonte der Kanzler, dass die
  strukturellen Ähnlichkeiten ihrer Industrien gute Voraussetzungen für eine vertiefte
  bilaterale Zusammenarbeit böten. Anschließend besuchte Merz das Camp Bonifas und
  die Demilitarisierte Zone an der Grenze zu Nordkorea. „Mir gehen in diesem Augenblick
  Gedanken durch den Kopf, wie dankbar wir sein dürfen, dass wir eine solche Teilung
  in Deutschland seit 36 Jahren nicht mehr erleben müssen“, sagte der Kanzler beim
  Besuch des Grenzstreifens. „Wollen wir hoffen, dass auch Korea eines Tages die Chance
  bekommt, seine staatliche Einheit zurückzugewinnen.“ Die Demilitarisierte Zone (DMZ)
  ist ein 248 Kilometer langer und etwa vier Kilometer breiter Grenzstreifen, der
  die koreanische Halbinsel entlang des 38. Breitengrads in die Demokratische Volksrepublik
  Korea (Nordkorea) und die Republik Korea (Südkorea) teilt. Die DMZ wurde 1953 nach
  dem Ende des dreijährigen Koreakriegs als Pufferzone eingerichtet. Da bis heute
  kein echter Friedensvertrag unterzeichnet wurde, sondern lediglich ein dauerhafter
  Waffenstillstand besteht, befinden sich beide Länder völkerrechtlich weiterhin im
  Kriegszustand. Joint Statement between the Republic of Korea and the Federal Republic
  of Germany (in Englisch) Gemeinsame Erklärung der Bundesrepublik Deutschland und
  der Republik Korea (deutsche Höflichkeitsübersetzung) Japan-Germany Joint Leaders’
  Statement (in Englisch) Gemeinsame Erklärung der japanischen Ministerpräsidentin
  und des deutschen Bundeskanzlers (deutsche Höflichkeitsübersetzung) Japan-Germany
  Joint Leaders’ Declaration on Advanced Technology Cooperation (in Englisch) Gemeinsame
  Erklärung der Regierungschefs von Japan und Deutschland zur Zusammenarbeit im Bereich
  Spitzentechnologien (deutsche Höflichkeitsübersetzung) Japan-Germany Joint Leaders’
  Declaration on Economic Security Cooperation (in Englisch) Gemeinsame Erklärung
  der Regierungschefs von Japan und Deutschland zur Zusammenarbeit im Bereich der
  wirtschaftlichen Sicherheit (deutsche Höflichkeitsübersetzung) Joint Declaration
  on the strategic partnership between the federal republic of Germany and the republic
  of Singapore 2026 (in Englisch) Gemeinsame Erklärung über die strategische Partnerschaft
  zwischen der Bundesrepublik Deutschland und der Republik Singapur 2026 (deutsche
  Höflichkeitsübersetzung) Anlage: Gemeinsamer Arbeitsplan für 2027/2028 (deutsche
  Höflichkeitsübersetzung) Am Mittwoch war der Bundeskanzler zur zweiten Station seiner
  Asienreise, nach Japan, gereist. Dort wurde er in Tokio von Ministerpräsidentin
  Sanae Takaichi empfangen. Bei der gemeinsamen Pressekonferenz betonte der Kanzler,
  Japan nehme für Deutschland „als enger Freund, als wahrer Premiumpartner eine Schlüsselrolle
  ein“. Bei dem Treffen wurde „ein Paket von Vorhaben beschlossen“, um die Partnerschaft
  auszubauen und die sicherheitspolitische Zusammenarbeit zu vertiefen. So solle zum
  Beispiel die Rüstungskooperation ausgebaut werden. Außerdem haben beide Länder eine
  Erklärung zur Wirtschaftssicherheit unterzeichnet und wollten „kritische Abhängigkeiten“
  reduzieren. Darüber hinaus wollten Deutschland und Japan bei strategischen Projekten
  zusammenarbeiten. „Hiermit bauen wir gemeinsam an einer gemeinsamen Zukunft“, sagte
  Kanzler Merz. Dafür habe man beispielsweise auch einen KI -Dialog und eine Erklärung
  zur Hochtechnologiekooperation beschlossen. Während des Aufenthalts in Japan hielt
  Kanzler Merz zudem eine Rede beim German-Japanese Business Summit. Darin sprach
  sich der Kanzler für mehr Investitionen, technologische Zusammenarbeit und einen
  freien, regelgebundenen Handel aus. Wenn Deutschland und Japan ihre „Stärken verbinden,
  dann entstehen neue Chancen, die kein Unternehmen allein in gleicher Weise erschließen
  kann“, betonte Merz. Anschließend besuchte er ein japanisches Unternehmen mit deutscher
  Kooperation. Zum Abschluss betonte der Kanzler am Mittwoch in einem Statement, es
  sei „sehr intensiv“ die Diskussion geführt worden, ob man „die Gespräche über ein
  gemeinsames Handelsabkommen zwischen den ASEAN -Staaten und der Europäischen Union
  wieder aufnehmen“ sollte. Deutschland werde als „ein ganz wichtiger Partner“ angesehen,
  auch im Hinblick auf „seine starke Stellung in der Europäischen Union“. „Auch wenn
  wir geografisch viele tausend Kilometer auseinanderliegen, sind wir doch in vielerlei
  Hinsicht wirklich Nachbarn“, sagte der Kanzler. Singapur, 27. Oktober 2026: Start
  der mehrtägigen Asienreise war der Stadtstaat an der Südspitze der Malaiischen Halbinsel.
  Premierminister Lawrence Wong empfing Bundeskanzler Merz. „Wir Europäer stehen vor
  denselben Herausforderungen wie die Länder in der Region des Indo-Pazifiks. Wir
  müssen uns in einer zunehmend von Unsicherheiten geprägten Welt behaupten“, betonte
  Kanzler Merz bei seinem Besuch. „Diese neue Welt eröffnet uns aber auch Chancen,
  unsere Partnerschaften gemeinsam zu vertiefen“, ergänzte Merz. Die beiden Regierungschefs
  vereinbarten einen Arbeitsplan zur Vertiefung der strategischen Partnerschaft in
  den Bereichen Wirtschaft, Sicherheit, Digitalisierung und Energie. Im Rahmen der
  Vortragsreihe Singapore Lecture sprach sich der Bundeskanzler für ein Freihandelsabkommen
  der EU mit der Transpazifischen Partnerschaft (CPTPP) aus. Zusammen hätten Europa
  und der Indo-Pazifik beachtlichen Einfluss. Man könne gemeinsam den freien und fairen
  Welthandel schützen und fördern, unterstrich Merz. Am Nachmittag besuchte der Kanzler
  das Hafengelände des Betreibers PSA Horizons . Ein erheblicher Teil des deutschen
  Außenhandels mit Staaten außerhalb der EU entfällt auf die Indo-Pazifik-Region.
  Durch neue Impulse für die Handelspolitik soll Deutschland stärker von den weltweiten
  Handelsbeziehungen profitieren. Tokio, 28. Oktober 2026: In Japan nahm Kanzler Merz
  am Deutsch-Japanischen Wirtschaftsgipfel teil. Dort setzte er sich für die Gründung
  einer „globalen politischen Allianz für regelgebundenen Handel“ ein. Die solle einen
  auf internationalen Vereinbarungen basierenden Warenaustausch verteidigen, stärken
  und weiterentwickeln. Anschließend wurde Bundeskanzler Merz am Amtssitz von Ministerpräsidentin
  Sanae Takaichi mit militärischen Ehren empfangen. Medienpräsenz beim Gespräch des
  Kanzlers mit der japanischen Ministerpräsidentin. Im diplomatischen Protokoll auch
  bekannt als Auftaktbilder oder Bildtermin. Merz und Takaichi beschlossen ein Maßnahmenpaket
  zur Vertiefung der bilateralen Partnerschaft in den Bereichen Wirtschaftssicherheit,
  Verteidigung, Hochtechnologie und Raumfahrt. Die japanische Regierungschefin nahm
  zudem die Einladung an, Partnerland der Hannover Messe 2028 zu sein. Tokio, 29.
  Oktober 2026: Am zweiten Tag in Japan informierte sich der Bundeskanzler über die
  Übung „ Keen Sword “. Dabei trainierten Soldatinnen und Soldaten des Sanitätsdienstes
  der Bundeswehr gemeinsam mit internationalen Partnern die Versorgung und Evakuierung
  einer großen Zahl von Verwundeten. Der letzte Stopp vor der Weiterreise nach Südkorea
  war das Unternehmen Kyoto Fusioneering , das zusammen mit mehreren deutschen Firmen
  an der Entwicklung und dem Bau des ersten Fusionsenergiereaktors arbeitet. Wenig
  später: Bundeskanzler Merz ist auf dem Flughafen Seongnam in Seoul, Südkorea, gelandet.
  Südkoreas Präsident Lee Jae-myung empfing den Kanzler in seinem Amtssitz. Lee amtiert
  seit Juni 2025 als Präsident der Republik Korea. „Mehr denn je“ seien Partner wichtig,
  die gemeinsame Interessen und Werte teilten, sagte Merz bei dem Besuch. „Das gilt
  sicherheitspolitisch, das gilt wirtschaftlich, und das gilt geopolitisch.“ Merz
  kündigte ein neues Rahmenabkommen als „Grundlage für die Zusammenarbeit in modernsten
  Technologien“ an. So sei etwa eine Partnerschaft im Bereich der Halbleiterindustrie
  geplant. Beide Länder veröffentlichten eine gemeinsame Erklärung zur vertieften
  Zusammenarbeit. Darin bekräftigten sie ihre Entschlossenheit, auch die Beziehungen
  in den Bereichen Sicherheit und Verteidigung weiter zu vertiefen. Seoul, 30. Oktober
  2026: In seiner Rede bei der 19. Asien-Pazifik-Konferenz der Deutschen Wirtschaft
  unterstrich der Kanzler die Bedeutung eines regelgebundenen, freien Handels und
  warb für Handelsabkommen sowie aktives De-Risking durch faire Rohstoff- und Technologiepartnerschaften.
  Danach besuchte er den bedeutenden, über 1200 Jahre alten buddhistischen Bongeunsa-Tempel.
  Besuch in der demilitarisierten Zone in Panmunjeom: Ein Kommando der Vereinten Nationen
  überwacht das 248 Kilometer lange und vier Kilometer breite Gebiet zwischen Nord-
  und Südkorea auf die Einhaltung des 1953 unterzeichneten Waffenstillstandsabkommens.
  In einem Forschungszentrum informierte sich der Kanzler über den Bereich der Quanten-Nanowissenschaft.
  Bundeskanzler Merz zog eine positive Bilanz seiner Asien-Reise. „Diese Region ist
  für uns von größter strategischer Bedeutung“, sagte er. Und man habe gemeinsame
  Sicherheitsinteressen, so der Kanzler weiter. Deutschland werde zudem in der Region
  als wichtiger Partner angesehen. Das eröffne Chancen, die es zu nutzen gelte, resümierte
  er. Singapur, 27. Oktober 2026: Start der mehrtägigen Asienreise war der Stadtstaat
  an der Südspitze der Malaiischen Halbinsel. Premierminister Lawrence Wong empfing
  Bundeskanzler Merz. „Wir Europäer stehen vor denselben Herausforderungen wie die
  Länder in der Region des Indo-Pazifiks. Wir müssen uns in einer zunehmend von Unsicherheiten
  geprägten Welt behaupten“, betonte Kanzler Merz bei seinem Besuch. „Diese neue Welt
  eröffnet uns aber auch Chancen, unsere Partnerschaften gemeinsam zu vertiefen“,
  ergänzte Merz. Die beiden Regierungschefs vereinbarten einen Arbeitsplan zur Vertiefung
  der strategischen Partnerschaft in den Bereichen Wirtschaft, Sicherheit, Digitalisierung
  und Energie. Im Rahmen der Vortragsreihe Singapore Lecture sprach sich der Bundeskanzler
  für ein Freihandelsabkommen der EU mit der Transpazifischen Partnerschaft (CPTPP)
  aus. Zusammen hätten Europa und der Indo-Pazifik beachtlichen Einfluss. Man könne
  gemeinsam den freien und fairen Welthandel schützen und fördern, unterstrich Merz.
  Am Nachmittag besuchte der Kanzler das Hafengelände des Betreibers PSA Horizons
  . Ein erheblicher Teil des deutschen Außenhandels mit Staaten außerhalb der EU entfällt
  auf die Indo-Pazifik-Region. Durch neue Impulse für die Handelspolitik soll Deutschland
  stärker von den weltweiten Handelsbeziehungen profitieren. Tokio, 28. Oktober 2026:
  In Japan nahm Kanzler Merz am Deutsch-Japanischen Wirtschaftsgipfel teil. Dort setzte
  er sich für die Gründung einer „globalen politischen Allianz für regelgebundenen
  Handel“ ein. Die solle einen auf internationalen Vereinbarungen basierenden Warenaustausch
  verteidigen, stärken und weiterentwickeln. Anschließend wurde Bundeskanzler Merz
  am Amtssitz von Ministerpräsidentin Sanae Takaichi mit militärischen Ehren empfangen.
  Medienpräsenz beim Gespräch des Kanzlers mit der japanischen Ministerpräsidentin.
  Im diplomatischen Protokoll auch bekannt als Auftaktbilder oder Bildtermin. Merz
  und Takaichi beschlossen ein Maßnahmenpaket zur Vertiefung der bilateralen Partnerschaft
  in den Bereichen Wirtschaftssicherheit, Verteidigung, Hochtechnologie und Raumfahrt.
  Die japanische Regierungschefin nahm zudem die Einladung an, Partnerland der Hannover
  Messe 2028 zu sein. Tokio, 29. Oktober 2026: Am zweiten Tag in Japan informierte
  sich der Bundeskanzler über die Übung „ Keen Sword “. Dabei trainierten Soldatinnen
  und Soldaten des Sanitätsdienstes der Bundeswehr gemeinsam mit internationalen Partnern
  die Versorgung und Evakuierung einer großen Zahl von Verwundeten. Der letzte Stopp
  vor der Weiterreise nach Südkorea war das Unternehmen Kyoto Fusioneering , das zusammen
  mit mehreren deutschen Firmen an der Entwicklung und dem Bau des ersten Fusionsenergiereaktors
  arbeitet. Wenig später: Bundeskanzler Merz ist auf dem Flughafen Seongnam in Seoul,
  Südkorea, gelandet. Südkoreas Präsident Lee Jae-myung empfing den Kanzler in seinem
  Amtssitz. Lee amtiert seit Juni 2025 als Präsident der Republik Korea. „Mehr denn
  je“ seien Partner wichtig, die gemeinsame Interessen und Werte teilten, sagte Merz
  bei dem Besuch. „Das gilt sicherheitspolitisch, das gilt wirtschaftlich, und das
  gilt geopolitisch.“ Merz kündigte ein neues Rahmenabkommen als „Grundlage für die
  Zusammenarbeit in modernsten Technologien“ an. So sei etwa eine Partnerschaft im
  Bereich der Halbleiterindustrie geplant. Beide Länder veröffentlichten eine gemeinsame
  Erklärung zur vertieften Zusammenarbeit. Darin bekräftigten sie ihre Entschlossenheit,
  auch die Beziehungen in den Bereichen Sicherheit und Verteidigung weiter zu vertiefen.
  Seoul, 30. Oktober 2026: In seiner Rede bei der 19. Asien-Pazifik-Konferenz der
  Deutschen Wirtschaft unterstrich der Kanzler die Bedeutung eines regelgebundenen,
  freien Handels und warb für Handelsabkommen sowie aktives De-Risking durch faire
  Rohstoff- und Technologiepartnerschaften. Danach besuchte er den bedeutenden, über
  1200 Jahre alten buddhistischen Bongeunsa-Tempel. Besuch in der demilitarisierten
  Zone in Panmunjeom: Ein Kommando der Vereinten Nationen überwacht das 248 Kilometer
  lange und vier Kilometer breite Gebiet zwischen Nord- und Südkorea auf die Einhaltung
  des 1953 unterzeichneten Waffenstillstandsabkommens. In einem Forschungszentrum
  informierte sich der Kanzler über den Bereich der Quanten-Nanowissenschaft. Bundeskanzler
  Merz zog eine positive Bilanz seiner Asien-Reise. „Diese Region ist für uns von
  größter strategischer Bedeutung“, sagte er. Und man habe gemeinsame Sicherheitsinteressen,
  so der Kanzler weiter. Deutschland werde zudem in der Region als wichtiger Partner
  angesehen. Das eröffne Chancen, die es zu nutzen gelte, resümierte er. Den Auftakt
  der Reise markierte ein Besuch des Bundeskanzlers in Singapur. Dort traf er am Dienstag
  Premierminister Lawrence Wong zum Gespräch. Deutschland und Singapur verbinde „eine
  über Jahrzehnte gewachsene politische und ökonomische Partnerschaft“, sagte Merz
  bei der anschließenden Pressekonferenz . Deutschland sei auch ein Partner in der
  Wachstums- und Zukunftsregion Südostasien. Neben den Handelsbeziehungen wollten
  beide Länder ihre Zusammenarbeit im Bereich der Digitalisierung und KI , aber auch
  in der Verteidigungs- und Sicherheitspolitik intensivieren. Konkret wollen Deutschland
  und Singapur beispielsweise neue Vereinbarungen zur Cyber sicherheit schließen.
  Der Bundeskanzler bedankte sich für Singapurs anhaltende Unterstützung der Ukraine.
  Das Land sei ein aktives Mitglied in der Koalition der Willigen. „In einer Zeit
  des Umbruchs, die Singapur, Deutschland, Europa, die ganze Welt fordert wie lange
  nicht, rücken wir zusammen“, betonte Merz. „Vor allem sind wir fest entschlossen,
  unsere strategische Partnerschaft auszubauen.“ Im Anschluss traf der Bundeskanzler
  mit Präsident Tharman Shanmugaratnam zusammen und hielt außerdem im Rahmen der renommierten,
  seit 1980 bestehenden Vortragsreihe „ Singapore Lecture “ eine Grundsatzrede. Darin
  formulierte er für das neue geopolitische Zeitalter vier außenpolitische Kernprinzipien
  der Bundesregierung. So wolle Deutschland erstens in globale Allianzen investieren,
  zweitens die eigene Resilienz stärken, drittens in die internationale Ordnung investieren
  und viertens weiterhin auf Dialog und Diplomatie setzen. Im Fokus der Reise des
  Kanzlers nach Singapur, Japan und Südkorea (Republik Korea) stehen sicherheits-
  und wirtschaftspolitische Gespräche. Singapur, Japan und Südkorea zeichnen sich
  durch hohe Innovationskraft aus, vor allem bei Zukunfts- und Hochtechnologien. Die
  Reise des Bundeskanzlers nach Südost- und Ostasien sollte deshalb auch die Kooperation
  auf diesen Gebieten weiter voranbringen. Darüber hinaus sind Singapur, Japan und
  Südkorea zentrale Akteure bei der Lösung globaler Herausforderungen und stehen vor
  ähnlichen Aufgaben wie die Bundesrepublik. Die Sicherheit und der Wohlstand Deutschlands
  und Europas sind eng mit der Region verknüpft. Ein erheblicher Teil des deutschen
  Außenhandels mit Staaten außerhalb der EU entfällt auf die Indo-Pazifik-Region.
  Hieran wollte der Bundeskanzler mit seiner Reise anknüpfen und neue Impulse für
  die Handelspolitik setzen. Deutschland und seine Unternehmen sollen stärker von
  ihren weltweiten Handelsbeziehungen profitieren. So sollen Investitionen in Deutschland
  gestärkt und Arbeitsplätze gesichert werden. Die Bedeutung der wirtschaftlichen
  Zusammenarbeit zeigt sich auch darin, dass den Bundeskanzler eine Wirtschaftsdelegation
  auf seiner Reise begleitete.'
