title: Bundeskanzler Merz gratuliert dem Ministerpräsidenten von Rumänien, Luca Alexandru
  Niculescu
text: Sehr geehrter Herr Ministerpräsident, zu Ihrem Amtsantritt gratuliere ich Ihnen
  herzlich. Der Zusammenarbeit auf der Grundlage des starken Fundaments unserer Partnerschaft
  sehe ich mit Freude entgegen. Sowohl bilateral als auch im Rahmen der EU und der
  NATO steht Ihnen Deutschland als verlässlicher Verbündeter und Partner zur Seite.
  Gemeinsam übernehmen wir Verantwortung für die Sicherheit Europas. Ich wünsche Ihnen
  Glück und Erfolg bei den vor Ihnen liegenden Aufgaben. Mit freundlichen Grüßen Friedrich
  Merz Bundeskanzler der Bundesrepublik Deutschland
