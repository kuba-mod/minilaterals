title: '25. Kulturpolitisches Spitzengespräch: Gemeinsame Erklärung zur Freiheit der
  Kunst und Konzept zur Stärkung der Provenienzforschung verabschiedet'
text: 'Auf Einladung von Kulturstaatsminister Wolfram Weimer haben sich heute die
  Kulturministerinnen und Kulturminister, die Kultursenatorinnen und Kultursenatoren
  der Länder und die Kommunalen Spitzenverbände zum 25. Kulturpolitischen Spitzengespräch
  in Berlin getroffen. Im Mittelpunkt standen die Bedeutung der Freiheit für Kunst
  und Kultur, die gemeinsame Verantwortung für eine offene demokratische Gesellschaft
  sowie die weitere Stärkung der Provenienzforschung. Der besondere Ort des Treffens,
  der Apollosaal der Staatsoper Unter den Linden Berlin, setzte zugleich den Rahmen:
  Die Kammerkonzerte im Apollosaal widmen sich in dieser Saison dem großen Thema „Freiheit“.
  Das Thema steht auch im Zusammenhang mit dem 2027 anstehenden Beethoven-Jahr, mit
  dem Deutschland an den 200. Todestag Ludwig van Beethovens erinnert. Gemeinsames
  Bekenntnis zur Freiheit der Kunst Zum Auftakt des Kulturpolitischen Spitzengesprächs
  bekräftigten Bund, Länder und Kommunen das rechtliche und politische Fundament ihrer
  gemeinsamen Kulturpolitik: die Freiheit der Kunst, die kulturelle Vielfalt, die
  Eigenständigkeit kultureller Einrichtungen und die Verantwortung für eine offene,
  demokratische Gesellschaft. Dies hielten sie in der gemeinsamen Erklärung „Freiheit
  bewahren. Demokratie stärken. Gemeinsam Verantwortung für Kultur in Deutschland
  tragen“ fest. Alle Seiten unterstrichen, dass künstlerische Freiheit auch das Unbequeme
  und den Widerspruch schützt und kulturelle Einrichtungen verlässliche Rahmenbedingungen
  für ihre Programme, ihre wissenschaftliche Arbeit und ihre gesellschaftliche Rolle
  benötigen. Zugleich bekräftigten sie die bleibende Verantwortung Deutschlands für
  die Auseinandersetzung mit den Verbrechen der nationalsozialistischen Gewaltherrschaft
  und die Aufarbeitung des Unrechts des SED-Regimes. Auch mit dem Kolonialismus wollen
  sie sich weiter auseinandersetzen. Antisemitismus, Rassismus und der Verharmlosung
  historischen Unrechts treten sie entschieden entgegen. Mit Blick auf die Zukunft
  unterstreichen Bund, Länder und Kommunen zudem die Chancen von Künstlicher Intelligenz
  für Kultur und Kreativität und wollen deren Entwicklung auf der Grundlage demokratischer
  Werte gestalten. Der kooperative Kulturföderalismus soll auch künftig Eigenständigkeit
  mit gemeinsamer Verantwortung verbinden und verlässliches gemeinsames Handeln von
  Bund, Ländern und Kommunen ermöglichen. Gemeinsames Konzept zur Stärkung der Provenienzforschung
  verabschiedet Ein weiterer Schwerpunkt des Spitzengesprächs war die Aufarbeitung
  des NS-Unrechts und der Umgang mit Kulturgütern, die während der nationalsozialistischen
  Gewaltherrschaft zahlreichen Bürgerinnen und Bürgern, vor allem Jüdinnen und Juden,
  geraubt wurden. Die Provenienzforschung leistet hierzu einen wichtigen Beitrag.
  Sie schafft die Grundlage für gerechte und faire Lösungen im Sinne der Washingtoner
  Prinzipien und unterstützt Kulturgut bewahrende Einrichtungen dabei, ihrer historischen
  und ethischen Verantwortung nachzukommen. Zudem bildet sie eine unverzichtbare Fakten-
  und Forschungsbasis für die Erinnerungskultur. Um die Provenienzforschung nachhaltig
  weiterzuentwickeln, haben Bund, Länder und die Kommunalen Spitzenverbände im Rahmen
  des Spitzengesprächs ein gemeinsames Konzept verabschiedet. Staatsminister für Kultur
  und Medien, Wolfram Weimer, betont: „Es ist und bleibt eine zentrale kulturpolitische
  Aufgabe, NS-Unrecht aufzuarbeiten und zu gerechten und fairen Lösungen zu kommen.
  Provenienzforschung hilft uns, Geschichte und einzelne Schicksale sichtbar zu machen
  sowie Verantwortung zu übernehmen. Dafür steht der Bund unter anderem mit der Unterstützung
  des Deutschen Zentrums Kulturgutverluste ein. Mit dem heute verabschiedeten Konzept
  wollen wir dafür sorgen, dass diese wichtige Arbeit auch künftig verlässlich, unabhängig
  und nachhaltig fortgeführt werden kann.“ Der Präsident der Kulturministerkonferenz,
  Sven Teuber, Minister für Kommunen, Bauen, Wohnen und Kultur des Landes Rheinland-Pfalz,
  erklärt: „Für die Nachfahren der Beraubten geht es um ihre eigene Familiengeschichte.
  Viele von ihnen warten seit Jahren auf Klarheit. Das muss schneller gehen. Dafür
  brauchen wir eine Provenienzforschung, die wissenschaftlich stark und dauerhaft
  gut aufgestellt ist. Mit dem Konzept verständigen sich alle 16 Länder gemeinsam
  mit Bund und Kommunen auf klare Abläufe und eine bessere Zusammenarbeit. Es beschreibt
  übergeordnete Ziele ebenso wie konkrete Schritte und gibt Trägern und Forschenden
  Orientierung für ihre tägliche Arbeit. Wer nach der Herkunft eines Objekts fragt,
  soll überall in Deutschland eine zügige und ehrliche Antwort bekommen, egal ob in
  Kiel, Mainz oder München.“ Die kommunalen Spitzenverbände erklärten gemeinsam: „Den
  Kommunen kommt als Träger der meisten öffentlichen Sammlungen eine besondere Bedeutung
  zu. Sie beschäftigen Provenienzforschende insbesondere in den Einrichtungen selbst
  oder sammlungs- und institutionsübergreifend in den Kulturverwaltungen. Mit ihrer
  Arbeit tragen diese koordinierenden Stellen – wie auch solche auf Länderebene –
  dazu bei, Provenienzforschung in die Öffentlichkeit sowie in die Fläche zu tragen.“
  Im Mittelpunkt des Konzeptpapiers stehen die weitere Standardisierung und transparente
  Kommunikation von Verfahren, eine bessere Dokumentation und Erschließung von Beständen,
  der fortwährende Ausbau von Infrastrukturen und des Zugangs zu relevanten Quellen.
  Auch digitale Technologien sowie Weiterbildung und Grundlagenforschung sollen ausgebaut
  werden, um die Provenienzforschung dauerhaft weiterzuentwickeln und ihre Ergebnisse
  nachhaltig zu sichern. Die Erklärung „Freiheit bewahren. Demokratie stärken. Gemeinsam
  Verantwortung für Kultur in Deutschland tragen.“ sowie das Konzept zur „Stärkung
  der Provenienzforschung NS-Raubgut“ können hier abgerufen werden. Kontakt: Der Beauftragte
