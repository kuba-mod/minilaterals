date: '2026-10-30'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 30. Oktober 2026
text: 'stellvertretender Regierungssprecher Hille (Vorsitzende Buschow eröffnet die
  Pressekonferenz und begrüßt SRS Hille sowie die Sprecherinnen und Sprecher der Ministerien.)
  Einen schönen guten Tag auch von mir. Schön, Sie zum Ausklang dieser Woche zu sehen!
  Wie am Freitag üblich, habe ich die Termine des Bundeskanzlers für die kommende
  Woche dabei, und los geht es. Am Montag und Dienstag, den 2. und 3. November, wird
  der diesjährige Digitalgipfel in Berlin stattfinden. Der Gipfel steht unter dem
  Motto „Shaping AI: safe, sovereign, competitive“ und knüpft damit thematisch an
  den letzten Gipfel für mehr digitale Souveränität an. Die Veranstaltung soll dieses
  Mal den Fokus auf politisch-strategische Fragen zur künstlichen Intelligenz, die
  Anwendung und Sicherheit von KI und neue Entwicklungsformen in diesem Bereich setzen.
  Ziel des Gipfels ist es, gemeinsam mit Wirtschaft, Wissenschaft und Gesellschaft,
  KI sicherer zu gestalten, ohne Innovationen auszubremsen. Eröffnet werden wird der
  Digitalgipfel von Bundesdigitalminister Dr. Karsten Wildberger. Der Bundeskanzler
  wird die Veranstaltung am Montagnachmittag besuchen. Er wird dort eine Rede halten,
  sich mit einem Roboter von NEURA Robotics treffen, an einem Round Table mit Wirtschaftsvertretern
  teilnehmen und anschließend gemeinsam mit Digitalminister Karsten Wildberger eine
  Pressekonferenz geben. Die Rede und die Pressekonferenz sind presseöffentlich. Weiter
  geht es dann am Dienstag, den 3. November. Dann wird der Bundeskanzler am Wirtschaftspolitischen
  Frühstück der IHK Berlin teilnehmen. Auch dort wird der Bundeskanzler um kurz nach
  8.30 Uhr eine Rede halten und sich im Anschluss der Diskussion mit dem IHK-Präsidenten,
  der IHK-Hauptgeschäftsführerin sowie den IHK-Mitgliedern über aktuelle Wirtschaftsfragen
  stellen. Ein Servicehinweis: Für die Presseakkreditierung wenden Sie sich bitte
  an die IHK Berlin. Die Veranstaltung wird per Livestream übertragen und auch im
  Nachgang online zur Verfügung gestellt werden. Ebenfalls am Dienstag, den 3. November,
  wird der Bundeskanzler dann den litauischen Staatspräsidenten Gitanas Nausėda um
  10.15 Uhr mit militärischen Ehren im Bundeskanzleramt empfangen . Im Mittelpunkt
  des Gesprächs steht die EU-Ratspräsidentschaft, die Litauen im kommenden Jahr vom
  Januar bis Juni innehaben wird. Kernthemen des Treffens sind europapolitische Prioritäten
  wie der nächste Mehrjährige Finanzrahmen, die Umsetzung der Roadmap „One Europe,
  One Market“ und die EU-Erweiterung. Daneben wird sich der Bundeskanzler mit Staatspräsident
  Nausėda auch über Fragen der Sicherheit und Verteidigung austauschen. Zentrale Themen
  sind etwa die Unterstützung der Ukraine sowie die deutsche Brigade in Litauen. Am
  Mittwoch, den 4. November, wird, wie üblich, morgens um 10 Uhr die Sitzung des Bundeskabinetts
  unter der Leitung des Bundeskanzlers stattfinden. Am Nachmittag des Mittwochs, den
  4. November, wird der Bundeskanzler am Nachmittag am Wirtschaftsforum der SPD teilnehmen
  und dort gegen 17.15 Uhr eine Rede halten. Im Anschluss wird er an einem moderierten
  Bühnengespräch mit der Präsidentin des Wirtschaftsforums, Frau Prof. Dr. Ines Zenke,
  teilnehmen. Die Veranstaltung findet im Humboldt Carré in Berlin statt. Die Wirtschaftskonferenz
  möchte führende Vertreterinnen und Vertreter aus Politik, Wirtschaft, Wissenschaft
  und Gesellschaft zusammenbringen. In diesem Jahr steht sie unter dem Motto “Germanomics
  – Was unser Wirtschaftsstandort jetzt braucht”. Die Rede des Bundeskanzlers ist
  presseöffentlich. Dann sind wir beim fünften Termin. Am Donnerstag, den 5. November,
  wird der Bundeskanzler auf der Friedrich-August-von-Hayek-Konferenz gegen 13 Uhr
  eine Rede halten. Diese Veranstaltung findet im Hotel Adlon statt. Ausrichter ist
  die Friedrich-August-von-Hayek-Stiftung. Das Motto der Konferenz lautet „Ordnung
  aus Freiheit - Deutschlands Wettbewerbsfähigkeit und die Kraft offener Märkte und
  freien Wissens“. Die Rede des Bundeskanzlers ist presseöffentlich. So weit der Blick
  auf die kommende Woche. Herr Hille, wir haben aus anderer Quelle gehört, dass es
  am Dienstag in Berlin sehr, sehr starke Sicherheitsvorkehrungen geben wird. Das
  ist ja jetzt schon ein bisschen ungewöhnlich für einen, wie es klingt, normalen
  Staatsbesuch des Präsidenten von Litauen . Warum ist das so, oder ist vielleicht
  noch mit einem weiteren Staatsgast zu rechnen? Dazu kann ich Ihnen nichts sagen.
  Diese Informationen kenne ich nicht, und alles Weitere ist spekulativ. Von daher
  wissen Sie, wie wir uns dazu verhalten. Ich habe dazu sonst keine anderen Ankündigungen
  zu machen. Wir haben die Info nicht vom Bundespressamt oder aus anderen „Unter drei“-Quellen,
  sondern wirklich aus unabhängiger Quelle. Deswegen noch einmal die Nachfrage: Sind
  Sie sicher, dass kein anderer Staatsgast kommt? Sie können das auch noch zwei bis
  sieben Male wiederholen. Ich kann nichts anderes sagen als das, was ich gerade gesagt
  habe. Ich habe die Termine des Bundeskanzlers für die kommende Woche gerade eben
  hier vorgetragen. Herr Hille, in welcher Form wird der Bundeskanzler denn die ja
  auch für ihn nicht ganz unwichtigen Midterms in den USA verfolgen? Macht er das
  zwischendurch, oder kann man auch ungefähr sagen, wie er die Wahlen und das Ergebnis
  verfolgen wird? Ich würde sagen, es ist nicht zu gewagt, zu sagen: Gehen Sie davon
  aus, dass er die verfolgen wird. Das hatte ich mir gedacht. Aber gibt es jetzt ein
  irgendwie besonderes Treffen oder einen besonderen Kreis von Vertrauten, mit denen
  er sich das gemeinsam anschaut? Auch da, habe ich jetzt nichts weiter in diese Richtung
  anzukündigen. Aber natürlich ist das ein Thema, mit dem wir uns alle beschäftigen.
  Natürlich wird auch der Bundeskanzler zur Kenntnis nehmen, was da am kommenden Dienstag
  in den USA passieren wird. Herr Hille, Sie sagten, der Kanzler werde (beim Digitalgipfel
  ) einen Roboter treffen. Können Sie uns schon sagen, welche Themen die beiden miteinander
  besprechen werden? Wie das immer so ist mit Dingen, die in der Zukunft liegen, vermag
  ich dem nicht vorzugreifen. Aber ich bin mir nicht sicher, ob die beiden auch miteinander
  reden werden oder ob sie sich in erster Linie begegnen werden. Ist das also eher
  ein nonverbales Treffen, oder wie haben wir uns das vorzustellen? Um was für eine
  Art von Roboter handelt es sich eigentlich? Da muss ich einmal in meinen Unterlagen
  schauen, ob ich noch irgendwas zu den Spezifikationen dieses Roboters sagen kann.
  Ansonsten würde ich Ihnen anbieten, dass wir dann kommende Woche ‑ der Termin wird
  am Montagnachmittag stattfinden ‑ am Mittwoch in der RegPK genauer darüber berichten
  können, um was für einen Roboter von NEURA Robotics es sich gehandelt hat. Möglicherweise
  wird es bis dahin auch Bilder von dieser Begegnung geben. Sie können den Roboter
  am Mittwoch ja auch mitbringen! Entschuldigung, ich habe das akustisch nicht verstanden.
  Sie können den Roboter am Mittwoch auch gerne mitbringen. Vielleicht reden wir aber
  noch mit der Bundespressekonferenz darüber, welche Form von Roboter ‑ ‑ ‑ Wir sind
  hier ja nur Gast, wie Sie wissen. Wir sind dafür offen. - Herr Hille, das Thema
  der KI hatten Sie ja gerade angesprochen. Ich würde noch einmal die Schattenseite
  dieser Technologie ansprechen, von der jetzt keine Rede war. Wie ist denn die Haltung
  der Bundesregierung zu den existenziellen Gefahren für die Menschheit, die ja auch
  von den KI-Frontier-Labs immer ins Spiel gebracht wird, von Anthropic und OpenAI,
  die sich ja sogar wünschen, jetzt reguliert zu werden, damit Sicherheit hergestellt
  werden kann und die Innovation tatsächlich gebremst wird, weil die, die das jetzt
  gerade entwickeln, immer mehr Gefahren für die Menschheit sehen? Ich würde, wenn
  man so will, einmal das Dach bilden und dann zu den Kollegen vom BMDS herüberschauen,
  die sich schon einmal vorbereiten können und die dann noch stärker in die Tiefe
  gehen können. Es steht, glaube ich, außer Zweifel, dass KI eine revolutionäre Technik
  ist, die ganz viele ‑ um nicht vielleicht sogar „alle“ zu sagen ‑ Bereiche unseres
  Lebens irgendwie betreffen wird. Dementsprechend ist es natürlich Aufgabe von Politik,
  damit einen Umgang zu finden. Unsere Linie ist, dass wir einerseits natürlich die
  großen Potenziale, die mit KI verbunden sind, nutzen wollen. Aber auf der anderen
  Seite ‑ Sie haben einiges angesprochen ‑ haben wir natürlich auch ein Bewusstsein
  dafür, dass KI in keiner Weise unbegrenzt oder so zur Wirkung kommen darf, sondern
  man einen richtigen Ausgleich zwischen dem potenziellen Nutzen und den Gefahren
  finden muss, die möglicherweise von einer solchen Technologie ausgehen, um sie einzuhegen
  und einzudämmen. Wenn es noch weiter ins Detail geht, würde ich dann einmal an den
  Kollegen vom BMDS abgeben. Ich knüpfe gerne daran an. Ich möchte mich zunächst einmal
  vollempfänglich Ihren Ausführungen anschließen. Das ist so, in dieser Form, natürlich
  auch unser Fokus. Wir haben an dieser Stelle wiederholt und verschiedentlich erklärt,
  dass es in der Tat neben den Chancen, die zu betonen für uns wichtig ist, natürlich
  auch Risiken gibt. Die haben wir fest im Blick, das ist völlig klar. Aber es ist
  so wie bei jeder anderen revolutionären Technologie: Entscheidend ist am Ende immer,
  was man mit der Technologie macht. Eine Technologie an sich ist nicht gut oder böse,
  sondern es geht darum, dass wir diese Technologie natürlich auch entsprechend unserer
  Wertvorstellungen einsetzen. Auf dieser Linie und mit dieser Grundeinstellung haben
  wir eine Vielzahl von Maßnahmen angestoßen, die auch weiter fortlaufen. Ich erinnere
  nur kurz an die Gründung des AISI Deutschland. Natürlich setzen wir uns auch im
  Rahmen unserer Möglichkeiten in internationalen Formaten dafür ein, dass wir eine
  global sichere und verantwortungsvolle KI und einen verantwortungsvollen Umgang
  mit KI haben. Das haben wir an der Stelle verschiedentlich deutlich gemacht und
  auch wiederholt deutlich gemacht, und darauf möchte ich dann auch verweisen. Ich
  wollte das eigentlich von Herrn Hille wissen, weil ich es bei Herrn Pauly ja schon
  einmal probiert hatte und er sich geweigert hatte, uns die Risiken zu nennen, die
  Sie sehen. Die andere Gefahr für die Weltwirtschaft war jetzt auch nicht Thema bei
  Ihnen, Herr Hille. Die KI-Technik bzw. die ganze KI-Blase gilt als die größte Gefahr
  für die Weltwirtschaft. Spielt das eine Rolle für die Bundesregierung? Teilen Sie
  diese Einschätzung, dass die Blase platzt? Erstens habe ich, glaube ich, die grundsätzliche
  Einordnung gerade vorgenommen, und zweitens würde ich dafür werben, dass wir vielleicht
  nicht immer nur auf Gefahren schauen, sondern uns bewusst sind, was eine Technologie
  an Gefahren birgt, aber auch an Chancen mit sich bringt. Genau darum geht es für
  uns, nämlich dabei wie in so vielen Bereichen die Balance zwischen der Nutzung der
  positiven Potenziale und gleichzeitig natürlich dem vollen Bewusstsein darüber,
  dass man Risiken abmildern und ausschließen muss, die mit Technologien einhergehen,
  zu finden. Sie können da auch versuchen, weiter in mich vorzudringen. Ich habe dazu
  außer diesen Ausführungen zu diesem Zeitpunkt nichts weiter zu sagen. Daran anschließend
  habe ich eine Frage zum Thema der KI-Steuer . Bildungsministerin Prien hat ja jetzt
  noch einmal in einem Interview auf eine KI-Besteuerung gedrängt. Herr Pauly, wie
  weit ist denn die Idee einer KI-Steuer bisher in der Umsetzung, und was genau könnte
  denn da besteuert werden? Wir hatten dieses Thema auch schon vor einigen Wochen.
  Ich möchte mich da eigentlich kurzfassen. Ich hatte das hier an dieser Stelle umfassend
  eingeordnet und möchte auf das verweisen, was ich gesagt habe. Dann habe ich eine
  Nachfrage, vielleicht an das Finanzministerium. In Medienberichten ist davon die
  Rede, dass es im Ministerium Abteilungen gibt, die diesbezüglich Überlegungen anstellen.
  Wie weit sind denn diese Überlegungen gediehen, und worüber wird denn da genau nachgedacht?
  Bundesfinanzminister Lars Klingbeil hat sich ja dazu schon in der Vergangenheit
  geäußert und auch eine ganz grundsätzliche Offenheit dafür signalisiert. Er hat
  aber gleichzeitig klargemacht, dass es jetzt erst einmal darum geht, gemeinsam mit
  dem BMDS und dem BMAS darauf zu schauen, welche Auswirkungen die künstliche Intelligenz
  auf Arbeitsplätze, auf die Sozialversicherung und eben aber auch auf das Steuersystem
  hat und an welchen Stellen da eventuell nachjustiert wird. werden muss. Das heißt,
  wir befinden uns hier noch einen Schritt vorher, und es geht jetzt erst einmal um
  eine Analyse. Es geht um (die für den 31. Oktober angekündigten landesweiten Demonstrationen
  am) morgigen Tag. Wo wird der Kanzler am Samstag sein? Auch darauf antworte ich
  das, was ich immer auf derartige Fragen nach Terminen antworte. Die Termine des
  Bundeskanzlers für die kommende Woche habe ich Ihnen hier gerade vorgestellt. Auf
  den morgigen Tag geschaut, spielen die angekündigten Proteste für den Kanzler denn
  irgendeine Rolle, was seinen Aufenthaltsort angeht? Was meinen Sie denn mit dem
  der Frage, ob die Proteste eine Rolle spielen? Natürlich spielen Proteste in Deutschland
  eine Rolle in der Wahrnehmung aufseiten der Politik dieser Bundesregierung und natürlich
  auch dieses Bundeskanzlers. Wenn Sie also darauf abzielen, ob wir das wahrnehmen,
  was da möglicherweise ‑ bisher sind es ja alles Berichte, Spekulationen und Ankündigungen ‑
  stattfinden wird und was an Kritik vorgebracht wird: Natürlich nehmen wir das wahr,
  und ich habe dazu am Mittwoch hier ja auch schon grundsätzliche Ausführungen gemacht.
  Frau Lewinsky, Ihr Kollege hatte am Mittwoch schon eine Einschätzung zum Gewaltpotenzial,
  sage ich jetzt einmal, abgegeben. Vielleicht können Sie uns heute, einen Tag davor,
  noch einmal einen aktuellen Stand dazu geben, ob sich womöglich Hinweise auf eine
  Mobilisierung in extremistischen Kreisen erhärtet haben oder wie Sie die Lage für
  Deutschland einschätzen. Vielen Dank für Ihre Frage zu den morgigen Protesten am
  31. Oktober. Zunächst wollen wir noch einmal ganz klar unterscheiden zwischen einerseits
  friedlichen Schülerprotesten, die angekündigt sind, und eben einer gewaltbereiten
  extremistischen Szene, die möglicherweise die Proteste nutzen möchte, um Gewalt
  zu verbreiten. Die Sicherheitsbehörden in Bund und Ländern stehen in engem Austausch
  und beobachten diese Entwicklung natürlich aufmerksam. Die Gefährdungsbewertungen
  werden natürlich laufend vorgenommen, wie mein Kollege das auch am Mittwoch schon
  bestätigt hat, und natürlich befinden wir uns auch in enger Absprache mit unseren
  Partnern sowohl in Italien als auch in Frankreich. Den Sicherheitsbehörden des Bundes,
  um Ihre Frage konkret zu beantworten, liegen derzeit keine weitergehenden Erkenntnisse
  über konkrete Aufrufe zu Gewalt oder zu geplanten gewalttätigen Ausschreitungen
  im Zusammenhang mit diesen Versammlungen am 31. Oktober vor. Die öffentlich bekannt
  gewordenen Mobilisierungsaufrufe betonen vielmehr den friedlichen Charakter dieser
  Proteste, und sie distanzieren sich tatsächlich ausdrücklich von den gewaltsamen
  Auseinandersetzungen im Ausland. Allerdings ist festzustellen, dass neben überwiegend
  nicht extremistischen Akteuren auch Teile der linksextremistischen Szene sowie vereinzelt
  Gruppierungen aus dem auslandbezogenen Extremismus diese Aufrufe aufgreifen, um
  sich an der Mobilisierung zu beteiligen. Vielleicht stelle ich eine Nachfrage dazu,
  da Sie gerade auch die Kontakte nach Italien und Frankreich ansprachen. Stellen
  Sie sich darauf ein, dass auch an den Grenzen geschaut wird, ob womöglich Menschen
  mit dem Ziel einreisen, an diesen Demonstrationen teilzunehmen? Wird es am Samstag
  vielleicht auch unterstützende Einsätze der Bundespolizei im Inland geben? Die Sicherheitsbehörden
  befinden sich natürlich auch im engen Austausch, eben nicht nur zwischen Bund und
  Ländern, hier bei uns im Land, sondern auch mit Italien und mit Frankreich. Bei
  Bedarf unterstützt die Bundespolizei ‑ wie üblich im Rahmen der Amtshilfe ‑ die
  Länder, unter anderem auch mit den Bereitschaftspolizeien, und wenn notwendig, werden
  Personen bereits auch an der Grenze von der Bundespolizei zurückgewiesen. Ich habe
  eine Frage zum Thema der Gasspeicher , jetzt aber an das Wirtschaftsministerium.
  Der Stichtag ist ja der 1. November. Welcher Füllstand ist denn erreicht? Wie reagiert
  die Bundesregierung auf die absehbar deutliche Verfehlung der gesetzlichen Füllvorgaben?
  Der derzeitige Gasspeicherstand liegt bei rund 62 Prozent. Der Schnitt von 70 Prozent
  ist damit also nicht erreicht. Das wissen wir auch. Sicherlich wäre eine bessere
  Befüllung gut gewesen, aber es gab ja auch Gründe, weshalb diese Speicherung nicht
  erfolgt ist, die natürlich auch in den Auseinandersetzungen in der Straße von Hormus
  und in den darauf folgenden Preissteigerungen zu sehen sind. Aber man darf nicht
  allein auf den Gasspeicherstand schauen. Anders als 2022, als es sehr wichtig war,
  wie die Gasspeicher gefüllt sind, haben wir jetzt ganz andere Möglichkeiten, an
  zusätzliches Gas heranzukommen. Wir haben vier staatliche LNG-Terminals, zwei in
  Wilhelmshaven, eines in Brunsbüttel und jetzt auch eines in Stade. Wir haben auf
  jeden Fall ein privates. Wie ich gehört habe, wird die Deutsche ReGas noch ein zweites
  privates hinzunehmen, sodass wir auch während der ganzen Heizperiode LNG liefern
  lassen können, zusätzlich zu den Lieferungen aus Norwegen und über die europäischen
  Pipelines. Das ist also eine ganz andere Situation als 2022. Trotzdem habe ich noch
  einmal eine Nachfrage. Es gibt ja diese gesetzlichen Vorgaben. Welche Konsequenzen
  drohen denn den Speicherbetreibern, wenn sie diese Vorgaben jetzt nicht erfüllen?
  Die Vorgaben sind gemacht worden, aber ohne Sanktionen. Es gibt heftige Kritik seitens
  Italiens, dass die späte Befüllung bzw. das Nachkaufen zur Befüllung der deutschen
  Gasspeicher die Preise auf dem Weltmarkt so hochtreiben würde, dass Italien, das
  auch Gas kaufen muss, dafür jetzt erhöhte Preise bezahlen müsse. Das ist also ein
  direkter Angriff gegen die deutsche Füllpolitik. Wie reagieren Sie darauf? Den Vorwurf,
  die Anweisung zur Beschaffung und Einspeicherung von Erdgas zum Beispiel durch SEFE
  würde den europäischen Gaspreis nach oben treiben ‑ das ist ja einer der italienischen
  Vorwürfe ‑, weisen wir entschieden zurück. SEFE wurde angewiesen, acht TWh innerhalb
  von zwei Monaten zu beschaffen. Die Einspeicherung läuft also auch noch über den
  1. November hinaus. Insofern, wenn ich auf die vorherige Frage noch einmal eingehen
  kann, ist auch hierdurch noch einmal mit weiteren Einspeicherungen zu rechnen. SEFE
  wurde zudem angewiesen, diese Mengen möglichst von außerhalb der EU zu beschaffen.
  Es handelt sich also im Wesentlichen um zusätzliches Gas, das andernfalls gar nicht
  in die EU importiert worden wäre. Also gerade dadurch wird der Effekt auf den europäischen
  Markt und den Gaspreis minimiert. Gleichzeitig heißt es ‑ ich gehe die Vorwürfe
  einmal durch ‑, Deutschland habe im Zug der Privatisierung der Unternehmen SEFE
  und Uniper auf die Befüllung verzichtet. Dieser Vorwurf ist haltlos. Wie ich eben
  gesagt habe, kommen SEFE und Uniper ihren Verpflichtungen zur Befüllung der von
  ihnen gebuchten Speicherkapazitäten nach. Die europäischen Fernleitungsnetzbetreiber,
  die Europäische Kommission und die Bundesnetzagentur sind zu der Einschätzung gelangt,
  dass die aktuellen europäischen und auch die deutschen Füllstände ausreichen, um
  die Versorgung durch den Winter auch bei kalten Temperaturen sicherzustellen. Auch
  hier gibt es also eine Bestätigung seitens der Fernleitungsnetzbetreiber, die auf
  diesem Gebiet ja Erfahrung haben. Ich habe schon ausgeführt, dass Gasspeicher natürlich
  eine Bedeutung haben, Deutschland durch LNG, Pipeline-Importe und ein eng vermaschtes
  europäisches System aber auch andere Möglichkeiten hat. Das sind vielleicht Möglichkeiten,
  die Italien nicht hat. Noch einmal: Italien hat die Befüllung von April bis heute
  in Höhe von 92 Terawattstunden bezuschusst, verglichen mit 8 Terawattstunden, die
  SEFE nun am Weltmarkt beschafft. Schon angesichts dieses Vergleichs kann die Schlussfolgerung,
  diese Beschaffung hätte eine größere Auswirkung auf den Gaspreis, nicht funktionieren.
  Zu dem letzten Vorwurf, dass Italien jetzt dafür zuständig sei, Deutschland bei
  der Einspeicherung zu unterstützen: Es ist für Mitgliedstaaten grundsätzlich nicht
  möglich, den Binnenmarkt lediglich für die Befüllung der eigenen Speicher zu nutzen
  und sich gleichzeitig von ihm abzukoppeln. Das ist nicht ganz so wie beim Stromnetz
  zu verstehen, aber es gibt da europäische Vorgaben. Auch Gas in deutschen, niederländischen,
  österreichischen Speichern wird ja im Winter ausgespeichert und exportiert. Auch
  wir haben in den letzten Wintern Gas exportiert und dadurch andere Länder mitversorgt.
  Das heißt nicht, dass wir Gas aus Italien benötigen; eine Abschottung ist hier aber
  nicht vorgesehen, und das haben wir noch einmal deutlich gemacht. Sie haben beschrieben,
  dass Deutschland zusätzliches Gas auf dem Weltmarkt kauft, um die Speicher zu befüllen.
  Aber genau dieser Mechanismus führt doch dazu, dass die internationalen Preise ansteigen.
  Das ist vielleicht ein bisschen wie beim Billard: Wenn man auf die linke Bande spielt,
  dann geht der Ball im Zweifelsfall rechts unten ins Loch hinein. Hat die italienische
  Kritik angesichts dessen, was Sie selbst sagen, von den Auswirkungen her dann nicht
  doch eine Berechtigung? Ich hatte Ihnen jetzt ja Gründe genannt. Zum einen habe
  ich die 8 Terawattstunden mit den 97 Terawattstunden verglichen, die von Italien
  beschafft worden sind. Insofern stellt sich schon die Frage, wer jetzt am meisten
  durch Mittel des Staates eingespeichert hat; denn auch Italien hat hierfür ja staatliche
  Mittel genutzt. Darüber hinaus ist das Gas, das ursprünglich gar nicht für den europäischen
  Markt vorgesehen war. Man zwackt hier also keinem anderen europäischen Land etwas
  ab. Von daher: 8 Terawattstunden, die auf zwei oder drei Monate verteilt eingekauft
  werden, können den Gasmarkt hier nicht beeinflussen. Herr Giese, in Russland hat
  jetzt die eigentlich letzte unabhängige Zeitung „Nowaja Gaseta“ angekündigt, dass
  sie nicht mehr erscheinen wird. Menschen, die sich in Russland auf Russisch unabhängig
  informieren wollen, können das also eigentlich nur noch mit Auslandsmedien tun.
  Hat die Bundesregierung irgendwelche Ideen, wie sie die russischsprachigen Medien
  im Ausland, die dann gegebenenfalls auch in Russland erreichbar sein sollten, besser
  unterstützen kann? Ich habe diese Berichterstattung auch zur Kenntnis genommen.
  Das fügt sich in das Bild ein, wie freie Berichterstattung in Russland mit großer
  Nachdrücklichkeit, mit großer Brutalität und auch systematisch durch die russische
  Regierung verhindert wird. Am Ende geht es darum zu verschleiern, was die Auswirkungen
  dieses Krieges in der Ukraine auch auf Russland sind; das ist ganz klar. Insofern
  ist auch das ein Aspekt der staatlichen Propaganda. Desinformation im Ausland und
