  mit den Russen gemeinsame Sache macht. Dementsprechend ist die Problematisierung
  von uns Medien ja bestimmt nachvollziehbar für Ihr Ministerium, dass am Ende immer
  die USA Zugriff auch auf diese Dienste und Anbieter hat, wenn sich deutsche Behörden
  für amerikanische Cloudanbieter entscheiden. Ich möchte mich jetzt nicht im Detail
  dazu einlassen, aber zumindest an einer Stelle Ihren Eindruck korrigieren. Ich hatte
  es eingangs gesagt: Allein die Herkunft eines Produktes entscheidet nicht darüber,
  ob es sich um eine digital souveräne Lösung handelt oder nicht. Eine Frage an das
  BMAS: Wie gefällt der Bundesregierung das alternative Rentenkonzept , das der DGB
  vorgestellt hat? Auch dazu würde ich es wie immer gern so halten, dass wir alternative
  Konzepte oder Vorschläge von Verbänden grundsätzlich nicht öffentlich kommentieren.
  Frau Fahimi hat uns gesagt, die Lebenserwartung steige nicht mehr so schnell, und
  das Problem heruntergespielt. Wie sieht die Bundesregierung das? Auch das ist eine
  Äußerung aus dem öffentlichen Raum, die ich nicht kommentiere. Aber wie sehen Sie
  dieses Problem? Steigt die Lebenserwartung tatsächlich nicht mehr so schnell? Was
  das angeht, müsste ich selbst noch einmal in die Daten schauen. Das liegt mir jetzt
  nicht vor. Frau Jenning, Thema: Bundeswehr und Ersatzteile. ‑Ich habe eine Frage
  zum ZEBEL. Es gibt Berichterstattung, dass seit Wochen die Zentrale Bundeswehrersatzteillogistik
  massive Probleme hat, die Truppe zu versorgen. Können Sie uns sagen, warum? Wir
  haben die Berichterstattung natürlich zur Kenntnis genommen, die heute vor allem
  in der „WirtschaftsWoche“ aufgekommen ist. Ich kommentiere sie von dieser Stelle
  aus nicht. Sie können sich aber sicher sein ‑ das meine ich völlig losgelöst von
  der Berichterstattung ‑, dass wir natürlich vor allen Dingen auch mit unserem Partner,
  der HIL, immer in einem engen Austausch stehen, den ich hier aber auch nicht weiter
  kommentieren kann, und dass die Einsatzbereitschaft der Bundeswehr sichergestellt
  ist. Möchten Sie dementieren, dass es Probleme gibt? Ich möchte die Berichterstattung
  nicht kommentieren. Das bedeutet, dass ich sie weder bestätige noch dementiere.'
