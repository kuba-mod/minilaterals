title: '- Sperrfrist: 2. Oktober 2026, 17:00 Uhr - Staatsminister Weimer warnt zum
  Tag der Deutschen Einheit vor zunehmendem Geschichtsrevisionismus – „Unmenschlichkeit
  der DDR-Diktatur darf nicht verharmlost werden“'
text: 'Zum Tag der Deutschen Einheit warnt Kulturstaatsminister Wolfram Weimer vor
  einem politisch gesteuerten Geschichtsrevisionismus, der die SED-Diktatur nachträglich
  verkläre und verharmlose. Bei einem Festakt in der Gedenkstätte Point Alpha an der
  Grenze zwischen Hessen und Thüringen erinnerte er an die friedliche Revolution der
  DDR-Bürgerinnen und -Bürger, die den Weg zur deutschen Einheit ebnete. In seiner
  Rede sagte Staatsminister Weimer: „Rechts- wie linksextreme Kreise versuchen immer
  lauter, das Unrecht und die Unfreiheit der DDR zu verharmlosen oder ideologisch
  umzudeuten. Die Verklärung der SED-Diktatur ist inzwischen zu einem offenen Geschichtsrevisionismus
  geworden, um der Demokratie zu schaden.“ Wichtig seien Erinnerungsorte und Gedenkstätten
  wie Point Alpha. „Wir brauchen solche Orte, weil sie architektonische Erinnerungen
  an das Leid eines zerrissenen Landes sind,“ so Weimer. „Weil sie auch dann noch
  informieren und aufklären, wenn es keine Zeitzeuginnen und Zeitzeugen mehr geben
  wird. Gedenkstätten sind das Gegengift von Ostalgie. Point Alpha schärft unser Bewusstsein
  für das wahre Gesicht jeder Diktatur: despotisch, gewalttätig, menschenverachtend.
  Gerade in einer Zeit, in der die Verlockung des Autoritären zunimmt, müssen wir
  uns daran erinnern, was Diktaturen den Menschen antun. Und was das SED-Regime für
  all jene Bürger bedeutete, die Widerstand leisteten und offen um ihre Freiheit kämpften.“
  Staatsminister Weimer betonte, dass an Orten wie Point Alpha die Wertschätzung von
  Freiheit, Demokratie und Rechtsstaatlichkeit neu belebt werde. Wenn diese Werte
  aus ideologischen Gründen in Frage gestellt werden oder wenn Misstrauen gegen die
  staatliche Handlungsfähigkeit gesät werde, müssten wir uns mit guten Argumenten
  wappnen. „Nur ein kritisches Geschichtsbewusstsein schützt uns vor antidemokratischem
  Populismus und totalitären Ideologien“, so Weimer. „Deshalb setzt sich mein Haus
  für eine aufklärende Erinnerungskultur ein, die Fakten präsentiert und historische
  Zusammenhänge verdeutlicht. Erinnern ist kein sentimentaler Blick zurück. Erinnern
  bedeutet, aus der Geschichte zu lernen, um eine bessere Zukunft zu gestalten.“ Den
  3. Oktober hat Weimer als den glücklichsten Tag in der deutschen Nachkriegsgeschichte
  gewürdigt und daran erinnert, dass die deutsche Einheit ihren Ursprung in der friedlichen
  Revolution mutiger DDR-Bürgerinnen und -Bürger hatte, die Freiheit, Demokratie und
  freie Wahlen einforderten. Zugleich gelte es, die Erinnerung daran wachzuhalten,
  dass die Wiedervereinigung auch das Ergebnis des entschlossenen Widerstands gegen
  Unrecht und Unterdrückung durch das SED-Regime war. Vor dem Festakt legte Staatsminister
  Weimer einen Kranz für die Opfer der Deutschen Teilung am Denkmal der Deutschen
  Teilung und Wiedervereinigung ab. Am morgigen Samstag wird Staatsminister Weimer
  um 11 Uhr in der Erlöserkirche Bad Homburg eine Festrede halten und die Themen in
  einer anschließenden Gesprächsrunde vertiefen.'
