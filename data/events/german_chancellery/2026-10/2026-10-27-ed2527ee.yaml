title: 'Pressekonferenz von Bundeskanzler Merz und Südkoreas Präsident Lee Deutschland
  und Südkorea: Strategische Partner, die viel verbindet'
text: 'Kanzler Merz sprach an Südkorea die Einladung aus, im kommenden Jahr Partnerland
  des deutschen Digitalgipfels zu sein. In einer Zeit globaler Umbrüche und geopolitischer
  Spannungen brauchen wehrhafte Demokratien mehr denn je ein starkes Netz verlässlicher
  Partner. „ Wir heben deshalb heute unsere Beziehungen auf die Ebene einer vertieften
  strategischen Partnerschaft“, sagte Bundeskanzler Friedrich Merz in der Pressekonferenz
  nach seinem Treffen mit dem südkoreanischen Präsidenten Lee Jae-myung in Seoul.
  Beide Länder verbinde nicht nur enorme Innovationskraft und Weltoffenheit, sondern
  auch die historische Erfahrung der schmerzhaften Landesteilung, so Merz. So geht
  der Besuch in Südkorea weiter: Am Freitag wird der Bundeskanzler die 19. Asien-Pazifik-Konferenz
  der Deutschen Wirtschaft feierlich eröffnen. Zuvor wird er in Seoul mit der südkoreanischen
  Ministerpräsidentin Han Seong-sook zusammentreffen. Vor seiner Abreise wird Merz
  außerdem die Demilitarisierte Zone zwischen Nord- und Südkorea besichtigen. (Die
  Protokollierung des fremdsprachlichen Teils erfolgte anhand der Simultandolmetschung.)
  Sehr geehrter Herr Bundeskanzler Merz, sehr geehrte Mitglieder der Delegation, gemeinsam
  mit den Menschen in Korea heiße ich Sie herzlich willkommen. Deutschland ist Koreas
  größter Handelspartner in Europa und ein zentraler Partner, mit dem wir Freiheit,
  Demokratie und Rechtsstaatlichkeit teilen. Auf dieser Grundlage von Vertrauen haben
  Bundeskanzler Merz und ich eine vertiefte strategische Partnerschaft vereinbart.
  Die heutige gemeinsame Erklärung zeigt unseren festen Willen, die Zusammenarbeit
  in Politik, Sicherheit, Wirtschaft, Kultur und Austausch zu vertiefen und strategisch
  abzustimmen. Ich komme nun zu den konkreten Ergebnissen des heutigen Gipfels. Erstens:
  Wir stärken die strategische Zusammenarbeit in Wirtschaft und Industrie und erweitern
  Sie auf Spitzenindustrien und Zukunftsfelder. Der vereinbarte Rahmen für die Wirtschafts-
  und Higtech partnerschaft weitet unsere Zusammenarbeit von Handel und Investitionen
  auf Industrie und Spitzentechnologie aus. Wir treiben gemeinsame Forschung, Industrieprojekte
  und Standards voran und stärken die Zusammenarbeit hinsichtlich kritischer Rohstoffe
  und Energiesicherheit gegen Lieferkettenrisiken. Wir bauen die Zusammenarbeit bezüglich
  Autos, Batterien und Halbleiter aus und stärken Forschung und Innovation in KI ,
  Quanten-, Biotechnologie und Raumfahrt. Mit Blick auf den Industrial Accelerator
  Act der EU habe ich um Unterstützung gebeten, damit Korea wie die EU -Mitgliedstaaten
  behandelt wird. Mit der erneuerten Absichtserklärung zur Energiepartnerschaft weiten
  wir den Austausch hinsichtlich erneuerbarer Energien und Stromnetze aus und arbeiten
  bei den Themen der Energiewende und der sauberen Energieversorgung konkret zusammen.
  Das unterzeichnete Änderungsprotokoll zum Doppelbesteuerungsabkommen wird ein transparentes
  und faires Umfeld für unsere Unternehmen schaffen. Heute beginnt in Seoul die Asien-Pazifik-Konferenz
  der deutschen Wirtschaft. Ich hoffe, dass der Besuch deutscher Unternehmen Austausch
  und Investitionen belebt und neue Chancen schafft. Zweitens: Wir vertiefen die Zusammenarbeit
  auf den Feldern von Verteidigung und Sicherheit und bauen eine für beide Seiten
  vorteilhafte Rüstungskooperation auf. Wir stärken den Austausch der Verteidigungsbehörden
  und Arbeiten auf ein Geheimschutzabkommen für militärische Verschlusssachen hin.
  Koreanische Rüstungsunternehmen haben großes Interesse an langfristigen Partnerschaften
  mit Deutschland, etwa an Joint Ventures und gemeinsamen Entwicklungen. Deutschland
  ist die größte Volkswirtschaft Europas und die drittgrößte der Welt. Auf Basis unserer
  Technologien und Kapazitäten loten wir Chancen für gegenseitig vorteilhafte Zusammenarbeit
  aktiv aus. Drittens: Wir weiten den Austausch zwischen unseren Menschen aus. Dieses
  Jahr jährt sich die Entsendung koreanischer Krankenschwestern nach Deutschland zum
  60. Mal. Der Einsatz unserer Bergleute und Krankenschwestern wurde zum Fundament
  der wirtschaftlichen Entwicklungen und der Freundschaft zwischen unseren Ländern.
  Wir wollen die Zusammenarbeit in Bildung und Kultur ausbauen und die Freundschaft
  der jungen Generationen stärken. Ich habe den Bundeskanzler darum gebeten, die Bearbeitung
  von Visa und Aufenthaltstitel zu beschleunigen. Viertens: Angesichts wachsender
  Unsicherheit stärken wir die strategische Abstimmung zu wichtigen Fragen. Wir teilen
  die Sicht, dass die Sicherheit Nordostasiens und die Sicherheit Europas eng miteinander
  verbunden sind, und arbeiten für Frieden und Stabilität in beiden Regionen. Herr
  Bundeskanzler Merz hat aus eigener Teilungserfahrung tiefes Verständnis für Koreas
  Bemühungen um Dialog und eine Friedensordnung auf der Halbinsel bekundet. Wir arbeiten
  dafür weiterhin eng zusammen. Wir haben uns auch über die Ukraine, den Nahen Osten,
  die freie Handelsordnung und die Klimakrise ausgetauscht und wollen gemeinsam für
  Frieden, Stabilität und Lösungen sorgen. Dieses Gipfeltreffen ist ein wichtiger
  Meilenstein für eine neue Zukunft unserer Beziehungen. Ich werde mit Bundeskanzler
  Merz eng zusammenarbeiten, damit die Vereinbarungen umgesetzt werden und die Menschen
  Ergebnisse spüren. Noch einmal, sehr geehrter Herr Bundeskanzler Merz und liebe
  Delegation, herzliche willkommen in Korea! Sehr geehrter Herr Präsident, lieber
  Lee Jae Myung, zunächst noch einmal herzlichen Dank für die Einladung nach Korea!
  Ich bedanke mich auch für die sehr herzliche Gastfreundschaft und das gute Gespräch,
  das wir soeben führen konnten, denn Deutschland und Korea verbindet sehr viel miteinander.
  Wir sind wehrhafte Demokratien. Wir sind Demokratien, die sich ihren Wohlstand in
  den letzten Jahrzehnten hart erarbeitet haben. Wir haben das durch technologischen
  Erfindergeist getan, wir haben das durch Weltoffenheit, durch fairen und freien
  Wettbewerb getan. Insofern sind wir Partner und bleiben wir Partner, die überzeugt
  sind, dass nur eine regelbasierte internationale Ordnung dies auch weiter ermöglicht.
  Sie haben es angesprochen: Uns verbindet die bittere Erfahrung der Teilung unseres
  Landes. Ich werde darauf noch einmal zurückkommen. In einer Zeit der globalen Umbrüche
  ist es aber nur folgerichtig, dass wir jetzt unsere Partnerschaft vertiefen, denn
  wir brauchen mehr denn je ein starkes Netz von Partnern, die wichtige Interessen
  und gemeinsame Werte miteinander teilen. Das gilt sicherheitspolitisch, das gilt
  wirtschaftlich, und das gilt geopolitisch. Wir heben deshalb heute unsere Beziehungen
  auf die Ebene einer vertieften strategischen Partnerschaft; denn uns verbindet die
  unmittelbare Erfahrung, was es heißt, geopolitische Spannungen und eben Teilung
  zu erleben. Wir wissen, wie schmerzhaft es ist, in einem geteilten Land zu leben.
  Ich werde auch genau deshalb morgen die demilitarisierte Zone besuchen und mit Ihnen
  weiter über die Lage auf der koreanischen Halbinsel sprechen. Denn es ist so: Koreas
  Sicherheit berührt Europas Sicherheit, und Europas Sicherheit berührt auch die Sicherheit
  von Korea. Das ist mit Händen zu fassen, wenn etwa nordkoreanische Soldaten im Donbass
  gegen die Ukraine kämpfen und damit die Freiheit in ganz Europa bedrohen. Es wirkt
  sich aus, wenn im Gegenzug Moskau an Pjöngjang Waffen liefert. Die Welt ist eben
  klein geworden, auch im Krieg. Wir arbeiten aber für ein dauerhaftes, für ein gerechtes
  Europa und eine globale Ordnung mit einem dauerhaften Ende dieses Krieges. Ich danke
  Ihnen, dass wir hierbei weiter auf Ihre Unterstützung zählen können, denn wir wissen:
  Der Ausgang des Krieges wird prägend sein für die gesamte Sicherheitsarchitektur
  in Europa wie auch hier in Asien. Unsere wirtschaftliche Zusammenarbeit war der
  zweite Schwerpunkt unseres Gesprächs. Ich werde morgen die von Ihnen schon erwähnte
  Asien-Pazifik-Konferenz der Deutschen Wirtschaft eröffnen, und deswegen begleitet
  mich auf meiner Reise auch eine große Wirtschaftsdelegation. Diese Delegation illustriert
  die Tiefe und die Bandbreite unserer Beziehungen. Südkorea, und das vergessen manche
  vielleicht, ist das erste Land, mit dem die Europäische Union vor 15 Jahren ein
  umfassendes Freihandelsabkommen abgeschlossen hat. Dieses Abkommen hat sich wie
  kein zweites über diese lange Zeit als ein echtes Erfolgsmodell erwiesen. Es galt
  von Anfang an als eines der ambitioniertesten Abkommen, das die EU je verhandelt
  hat. Ich nenne Ihnen dazu auch eine Zahl, die eindrucksvoll ist: Rund 99 Prozent
  der Zölle sind mittlerweile abgebaut. Der bilaterale Warenaustausch hat sich seit
  2011 mehr als verdoppelt, zuletzt auf rund 130 Milliarden Euro. Das sei auch allen
  Kritikern gesagt, die heute Freihandelsabkommen infrage stellen. Gott sei Dank ist
  es anders: Dieses Modell hat Schule gemacht. Wir können heute den Abschluss von
  weiteren Freihandelsabkommen weltweit voranbringen, insbesondere auch mit Partnern
  im indopazifischen Raum. Gelingt es uns zusätzlich, diese Partnerschaften miteinander
  zu verbinden, so schaffen wir noch mehr Potenzial. Entscheidend ist aber nicht nur
  das Volumen unseres Austausches, sondern ist die Innovationskraft der Sektoren,
  in denen wir eng zusammenarbeiten. Wir werden hierfür einen neuen Rahmen schaffen.
  Wir nennen ihn „ Korean-German Hightech Framework Agreement “. Das ist eine neue
  Grundlage für die Zusammenarbeit hinsichtlich modernster Technologien. Das ist nämlich
  das Dritte, das unsere Länder miteinander verbindet: seit jeher eine große Innovationskraft.
  Das ist in den letzten Monaten nirgendwo so deutlich geworden wie im Bereich der
  künstlichen Intelligenz. Korea investiert sehr gezielt in eigene KI -Modelle und
  Rechenzentren und ist in die Riege der weltweit führenden KI -Nationen aufgestiegen.
  Ich freue mich daher besonders, dass wir gerade in diesem Rahmen eine ganze Reihe
  von Vereinbarungen treffen konnten. Herr Präsident, ich danke Ihnen sehr herzlich,
  dass ich Sie nicht nur einladen durfte, im nächsten Jahr Partnerland unseres deutschen
  Digitalgipfels zu sein, Sie haben die Einladung auch angenommen. Darüber freue ich
  mich sehr, denn wir werden auch die Zusammenarbeit unserer KI -Sicherheitsinstitute
  auf den Weg bringen und dies gemeinsam auch erledigen. Wir bauen eine Start-up -Brücke
  zwischen deutschen und koreanischen Unternehmen und Instituten, und gemeinsam gehen
  wir den Weg von der Grundlagenforschung zur Geschäftsidee bis hin zum marktfähigen
  Produkt. All dies macht unsere Partnerschaft aus. Sie schaut in die Zukunft, sie
  ist pragmatisch, und sie ist vor allem innovativ. Ich freue mich darauf, diesen
  Weg gemeinsam mit Ihnen fortzusetzen. Ich freue mich, wenn Sie kommendes Jahr in
  Berlin sein werden und ich Sie dort zur Fortsetzung dieses intensiven Dialogs begrüßen
  darf.'
