title: Ergebnisse des Arbeitskreises Steuerschätzung Aufschwung erhöht Steuereinnahmen
text: 'Bundesfinanzminister Lars Klingbeil bei der Pressekonferenz zur Steuerschätzung.
  Foto: picture alliance / BMF/photothek.de Laut aktueller Steuerschätzung kann der
  Bund dank besserer Wachstumsaussichten im Jahr 2027 mit rund vier Milliarden Euro
  mehr Steuereinnahmen rechnen als noch im Rahmen der Steuerschätzung im Mai veranschlagt.
  Hier sind die steuerlichen Erleichterungen durch die geplante Reform der Einkommensteuer
  noch nicht berücksichtigt. Ab 2027 bis 2030 liegen die geschätzten gesamtstaatlichen
  Einnahmen im Vergleich zur Schätzung im Mai durchschnittlich um rund elf Milliarden
  pro Jahr höher. Für das aktuelle Jahr dürften die Steuereinnahmen ungefähr so hoch
  ausfallen wie in der vorherigen Steuerschätzung prognostiziert. Mindereinnahmen
  ergeben sich jedoch durch Änderungen im Steuerrecht wie die Energiesteuersenkung
  für Diesel und Benzin. Bundesfinanzminister Lars Klingbeil ordnete die Ergebnisse
  der Steuerschätzung ein: „Wir können für 2026 mit einer stabilen Entwicklung der
  Steuereinnahmen rechnen trotz internationaler Krisen und Unsicherheiten. Wir haben
  auf diese Krisen reagiert. Und wir stehen robust da. Für 2027 gewinnen wir insgesamt
  keine neuen Spielräume hinzu, wir müssen aber auch keine neuen Lücken schließen.
  Darüber hinaus gilt aber ganz klar: Wir werden im Bundeshaushalt weiter konsolidieren
  müssen, um uns Handlungsspielräume für die Zukunft zu erarbeiten.“ Trotz der erwarteten
  Mehreinnahmen im kommenden Jahr bleiben der Handlungs- und Reformbedarf unverändert
  hoch. Die Bundesregierung hat das Ziel, Sicherheit, Beschäftigung und Wohlstand
  in Deutschland langfristig zu sichern. Sie setzt dabei weiterhin auf den Dreiklang
  von Investitionen, Konsolidierung und Strukturreformen. Die Bundesregierung geht
  umfassende Reformen für Deutschlands Wettbewerbsfähigkeit an, um die nächsten positiven
  Impulse für mehr Wachstum zu setzen. Arbeitsmarkt, Kranken- und Rentenversicherung
  sind wesentliche Felder, auf denen die Modernisierung Deutschlands entschlossen
  vorangebracht werden soll. Die positiven Aussichten auf die Steuereinnahmen hängen
  damit zusammen, dass die Wirtschaft stärker wächst als erwartet. Die Bundesregierung
  hat ihre Wachstumsprojektion deutlich angehoben und rechnet für dieses Jahr mit
  einem Anstieg des Bruttoinlandsprodukts um 1,3 Prozent. Das sind 0,8 Prozentpunkte
  mehr als in der Frühjahrsprojektion. Im kommenden Jahr wird ein Wachstum von 1,1
  Prozent erwartet. Die Bundesregierung arbeitet mit konkreten Maßnahmen daran, diesen
  Aufschwung zu verstetigen und Deutschlands Wirtschaft weiter auf Wachstumskurs zu
  halten. Neben den weitreichenden Investitionen durch das Sondervermögen für Infrastruktur
  und Klimaneutralität treibt die Bundesregierung ihre Pläne voran, um Verwaltungskosten
  zu senken, Bürokratie zurückzubauen und das Investitionsklima in Deutschland weiter
  zu verbessern. Der Arbeitskreis „Steuerschätzung” ist ein Beirat beim Bundesfinanzministerium.
  Es finden zwei Sitzungen im Jahr statt. Er stützt seine Schätzungen auf gesamtwirtschaftliche
  Eckdaten der Bundesregierung. Die Steuerprognose ist eine wichtige Grundlage für
  die Beratung des Bundeshaushalts.'
