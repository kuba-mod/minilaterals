title: 'Fotoausstellung in Berlin Kanzler im Fokus: Bilder erzählen Geschichte hinter
  den Kulissen'
text: 'Bundeskanzler Helmut Kohl im Gespräch mit Journalisten beim Rückflug aus den
  USA. | USA, 1990 Foto: Bundesarchiv, Bild-00102238/Lothar Schaack Der Kniefall von
  Willy Brandt in Warschau, Helmut Schmidt mit Valéry Giscard d’Estaing an der eigenen
  Bar, Helmut Kohl und François Mitterrand in Verdun , Angela Merkel vor Donald Trump
  beim G7 -Gipfel: Es sind Bilder der deutschen Bundeskanzler, die sich ins kollektive
  Gedächtnis eingeprägt haben und für viele Menschen mit einer bestimmten Epoche verbunden
  sind. Was diese Aufnahmen verbindet: Sie entstanden jenseits des offiziellen Protokolls
  – aufgenommen von den offiziellen Fotografinnen und Fotografen des Presse- und Informationsamtes
  der Bundesregierung. Über Jahrzehnte haben sie die Bundeskanzler und die Bundeskanzlerin
  begleitet und dabei politische Geschichte aus unmittelbarer Nähe dokumentiert. Entstanden
  sind Aufnahmen von Staatsbesuchen und Gipfeltreffen, aber auch von den Momenten
  dazwischen – persönlich, spontan und oft unerwartet. Über sieben Jahrzehnte ist
  ein einzigartiger fotografischer Bestand entstanden, der im Bundesarchiv in Koblenz
  bewahrt wird. Dieser Bildschatz wurde nun gehoben. Das Presse- und Informationsamt
  der Bundesregierung zeigt eine neue Ausstellungsreihe mit ausgewählten Fotografien
  aus diesem Bestand und eröffnet damit einen Blick hinter die Kulissen der Amtszeiten
  der deutschen Bundeskanzler und der Bundeskanzlerin. Den Auftakt der Veranstaltungsreihe
  bildet das Thema „Die Bundeskanzler und die Medien“. Seit Gründung der Bundesrepublik
  verbindet beide Akteure eine besondere Zusammenarbeit. Die erste Ausstellung zeigt
  deshalb Fotografien, die rund um dieses Verhältnis entstanden sind – und erzählt
  damit zugleich ein Stück Geschichte der Bundesrepublik. Der Besuch der öffentlichen
  Ausstellung „Kanzler im Fokus – von Adenauer bis Merz“ ist kostenfrei. Sie ist vom
  2. Oktober bis 30. Oktober 2026 im Besucherzentrum des Presse- und Informationsamtes
  der Bundesregierung am Reichstagufer 14 in 10117 Berlin zu sehen. Bundeskanzler
  Konrad Adenauer tritt vor dem Palais Schaumburg nach der Bundestagswahl vor die
  Presse. | Bonn, 1957 Fotografen bei einem Staatsbesuch im Park des Palais Schaumburg.
  | Bonn, 1952 Fotografen warten zwischen Terminen auf einer Treppe vor Palais Schaumburg.
  | Bonn, 1958 Bundeskanzler Konrad Adenauer (am Mikrofon) gibt neben US-Außenminister
  John Foster Dulles (vorn, 2.v.r.) auf dem Flughafen ein Pressestatement. | Köln-Wahn,
  1958 Bundeskanzler Konrad Adenauer bereitet sich im Palais Schaumburg auf eine Rundfunk-
  und Fernsehansprache anlässlich seiner Kandidatur zum Bundespräsidenten vor. | Bonn,
  1959 Bundeskanzler Konrad Adenauer (Mitte, l.) im Gespräch mit Vertretern des Vereins
  der Auslandspresse im Palais Schaumburg (daneben rechts: Karl-Günther von Hase,
  Sprecher der Bundesregierung). | Bonn, 1963 Journalisten vor dem Haus von Bundeskanzler
  Adenauer anlässlich eines Besuchs des französischen Außenministers Antoine Pinay.
  | Rhöndorf, 1955 Bundeskanzler Ludwig Erhard (l.) im Gespräch mit Mitgliedern des
  Presseclubs im Palais Schaumburg. | Bonn, 1963 Fotografen warten vor dem Haus Konrad
  Adenauers auf neue Nachrichten des todkranken Altkanzlers. Der 91-Jährige verstirbt
  wenige Tage später am 19. April. | Rhöndorf, 1967 Bundeskanzler Kurt Georg Kiesinger
  (l.) gibt während einer Fahrt mit dem Super-Express „Kodama“ von Atami nach Tokio
  Interviews. | Japan, 1969 Kameramänner und Beleuchter bei einem Pressetermin. |
  Bonn, 1959 Bundeskanzler Willy Brandt wird in einem Fernsehstudio für eine Live-Übertragung
  über Satellit für ARD und ZDF von Klaus Bölling (l.) und Gerd Ruge (r.) interviewt.
  | Washington, 1970 Bundeskanzler Willy Brandt wird während eines Pressestatements
  vor dem Elysée-Palast von Journalisten umringt. | Paris, 1971 Bundeskanzler Helmut
  Schmidt vor einem Fernsehinterview mit dem Journalisten Ulrich Wickert (r.) am Rande
  von deutsch-französischen Konsultationen. | Paris, 1978 Bundeskanzler Helmut Schmidt
  wird während seines Urlaubs am Brahmsee von Fotografen (von ihm mitunter als „Wegelagerer“
  tituliert) verfolgt. | Warder, 1979 Journalisten arbeiten anlässlich eines Staatsbesuchs
  im Pressezentrum im Bundespresseamt Bonn. | Bonn, 1973 Journalisten auf der Pressetribüne
  im Deutschen Bundestag anlässlich des konstruktiven Misstrauensantrags gegen Bundeskanzler
  Helmut Schmidt im Jahr 1982. | Bonn, 1982 Helmut Kohl winkt im Bundestag in Bonn
  nach seiner Wahl zum neuen Bundeskanzler infolge des konstruktiven Misstrauensantrags
  gegen Helmut Schmidt. | Bonn, 1982 Bundeskanzler Helmut Kohl empfängt Margaret Thatcher,
  Premierministerin von Großbritannien, im Bundeskanzleramt in Bonn. | Bonn, 1982
  Bundeskanzler Helmut Kohl kommt im Jahr 1983 nach der Sommerpause zur ersten Pressekonferenz
  in den Saal der Bundespressekonferenz. | Bonn, 1983 Bundeskanzler Helmut Kohl im
  Gespräch mit Journalisten beim Rückflug aus den USA. | USA, 1990 Bundeskanzler Helmut
  Kohl ist anlässlich der bevorstehenden Bundestagwahl Gast der ZDF-Sendung „Was nun,
  Herr Kohl?“ mit Chefredakteur Klaus Bresser (r.) und Thomas Bellut, Leiter der Hauptredaktion
  für das Ressort Innenpolitik. | Bonn, 1998 Bundeskanzler Gerhard Schröder während
  eines Fernsehinterviews vor dem Kapitol. | Washington, 2005 Bundeskanzler Gerhard
  Schröder im Gespräch mit Journalisten im Airbus auf dem Flug in die USA (dahinter:
  Béla Anda, Sprecher der Bundesregierung). | Washington, 2005 Bundeskanzlerin Angela
  Merkel im Gespräch mit Journalisten im Bus auf der Fahrt von Bozen nach Berlin.
  Die Aschewolke des isländischen Vulkans Eyjafjallajökull führte zur Sperrung des
  Luftraums über Europa – so musste die Kanzlerin und ihre Delegation auf der Rückreise
  aus den USA kurzerhand auch auf Busse ausweichen. Nach rund 60 Stunden erreichten
  sie schließlich Berlin. | Italien, 2010 Im Rahmen ihrer Afrika-Reise gibt Kanzlerin
  Angela Merkel ein Pressestatement. | Nairobi, 2011 Bundeskanzlerin Angela Merkel
  und Frankreichs Präsident Francois Hollande vor Journalisten auf der Pressetribüne
  bei einem Empfang im Bundeskanzleramt. | Berlin, 2012 Bundeskanzlerin Angela Merkel
  nach der Sommerpressekonferenz in der Bundespressekonferenz. | Berlin, 2015 Bundeskanzlerin
  Angela Merkel bei einer Pressekonferenz im Bundeskanzleramt anlässlich einer Videokonferenz
  mit Mitgliedern des Europäischen Rates (l. Steffen Seibert, Sprecher der Bundesregierung,
  mit Unterlagen). | Berlin, 2020 Bundeskanzler Olaf Scholz bei einem Interview auf
  dem Flug von Köln nach Dresden (l. Katrin Bauerfeind, Journalistin). | Deutschland,
  2024 Bundeskanzler Olaf Scholz im Vier-Augen-Gespräch mit Frankreichs Präsident
  Emmanuel Macron am Rande des Deutsch-Französischen Ministerrates im Park von Schloss
  Meseberg. | Meseberg, 2024 Bundeskanzler Friedrich Merz (l.) mit Redakteur Nick
  Robinson bei der Aufzeichnung eines Hörfunk-Interviews für die BBC-Sendung „Political
  Thinking“ im Roten Salon der Residenz des deutschen Botschafters. | London, 2025
  Bundeskanzler Friedrich Merz im Studio Berlin im Gespräch mit den Journalistinnen
  Caren Miosga (hinten) und Juliane von Schwerin am Rande der ARD-Sendung „Caren Miosga“.
  | Berlin, 2025 Im Park des Bundeskanzleramtes berichten Kanzler Friedrich Merz (CDU),
  Lars Klingbeil und Bärbel Bas (beide SPD) sowie Markus Söder (CSU) über die Ergebnisse
  des Koalitionsausschusses. | Berlin, 2026 Bundeskanzler Friedrich Merz im Gespräch
  mit seinem Sprecher Stefan Kornelius vor dem Haus der Bundespressekonferenz. | Berlin,
  2026 Bundeskanzler Konrad Adenauer tritt vor dem Palais Schaumburg nach der Bundestagswahl
  vor die Presse. | Bonn, 1957 Fotografen bei einem Staatsbesuch im Park des Palais
