title: Im Bundestag beschlossen Produkthaftung im Zeichen von Digitalisierung und
  Künstlicher Intelligenz
text: Künftig sollen Software und Künstliche Intelligenz in die Produkthaftung miteinbezogen
  werden. Das erhöht das Schutzniveau für Verbraucherinnen und Verbraucher. Produkte
  werden digitaler, vernetzter und häufiger wiederaufbereitet. Um Schäden wirksam
  zu ersetzen und Rechtsklarheit zu schaffen, passt die Bundesregierung das Produkthaftungsrecht
  an die Realität globaler Wertschöpfungsketten an. Der Gesetzentwurf setzt die jüngst
  reformierte EU -Produkthaftungsrichtlinie vollständig in nationales Recht um. Der
  Bundestag hat dem Gesetzentwurf zugestimmt. Das Produkthaftungsrecht sorgt dafür,
  dass Hersteller für Schäden haften, die durch fehlerhafte Produkte verursacht werden.
  Mit der vorgesehenen Modernisierung soll der Produktbegriff nun erweitert werden.
  Software hilft heute nicht nur bei der Steuerung anderer Produkte, sondern gilt
  auch als eigenständiges Produkt. Daher werden Software und Künstliche Intelligenz
  (KI) künftig in die Produkthaftung mit einbezogen. Zugleich passt sich die Haftung
  den Realitäten der Kreislaufwirtschaft an. Wer ein Produkt nach dem Inverkehrbringen
  wesentlich verändert, beispielsweise bei einer Wiederaufbereitung, soll künftig
  wie ein Hersteller haften. Damit wird Verantwortung dort verankert, wo sie tatsächlich
  liegt. In Zeiten globaler Wertschöpfungsketten sind auf dem europäischen Markt zunehmend
  Produkte erhältlich, deren Hersteller außerhalb der Europäischen Union ansässig
  sind. Für Geschädigte ist es dadurch oft schwierig, ihre Ansprüche effektiv durchzusetzen.
  Deshalb wird der Kreis der Haftenden erweitert. Neben Herstellern können unter bestimmten
  Voraussetzungen weitere Wirtschaftsakteure in Anspruch genommen werden, wie etwa
  Importeure oder Lieferanten. Ergänzend sieht der Gesetzentwurf beweisrechtliche
  Erleichterungen vor. Sie sollen Geschädigten helfen, berechtigte Schadensersatzansprüche
  effektiver geltend zu machen, ohne dabei den Schutz von Geschäftsgeheimnissen aus
  dem Blick zu verlieren. Mit dem Gesetzesentwurf zur Modernisierung des Produkthaftungsrecht
  schafft die Bundesregierung mehr Rechtssicherheit für Unternehmen und ein höheres
  Schutzniveau für Verbraucherinnen und Verbraucher – insbesondere bei digital vernetzten
  Produkten und in der Kreislaufwirtschaft. Die Änderungen des Bundestages sehen insbesondere
  Anpassungen mit Blick auf die Offenlegung von Beweismitteln im Zusammenhang mit
  der Produkthaftung vor. Darüber hinaus sind unter anderem Änderungen im Hinblick
  auf den Anwendungsbereich des Gesetzes zur Umsetzung der EU - Richtlinie zur Förderung
  der Reparatur von Waren vorgesehen.
