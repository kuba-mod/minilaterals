date: '2026-10-22'
type: press_release
source_name: german_chancellery
title: Pressekonferenz mit Bundeskanzler Merz beim Berlin Prozess-Gipfel in Montenegro
  „Wir wollen diese Dynamik der EU-Erweiterung“
text: 'Bundeskanzler Merz macht sich für Aufnahme der Westbalkanstaaten in die EU
  stark: „ Die EU muss wachsen", sagte er bei der Pressekonferenz. „Es ist in unserem
  gemeinsamen Interesse, dass der Weg der Staaten in der Region unumkehrbar in die
  Europäische Union führt,“ betonte Bundeskanzler Friedrich Merz in Bezug auf den
  Westbalkan. Dabei gäbe es „ermutigende Erfolge“, wenngleich noch einiges zu tun
  sei. Als „handfeste Ergebnisse“ des Gipfels verwies er unter anderem auf die Zusammenarbeit
  im wirtschaftlichen Bereich, beispielsweise bei Investitionsbedingungen und Start-ups
  . Bis zum EU -Beitritt sei für einige Staaten noch ein schwieriger Weg zu gehen.
  Der Kanzler fügte hinzu: „Sie gehen diesen Weg nicht allein. Sie gehen ihn mit ihren
  Nachbarn, und sie gehen ihn mit Deutschland und den anderen Mitgliedern der Europäischen
  Union.“ Die Botschaft des Gipfels laute daher: „Lasst uns auf diesem Weg entschieden
  vorangehen!“ (Die Protokollierung des fremdsprachlichen Teils erfolgte anhand der
  Simultandolmetschung.) (Der Beginn der Pressekonferenz fehlt aufgrund technischer
  Probleme.) … zum Gipfeltreffen des Berlin-Prozesses zusammengekommen sind. Ich möchte
  zunächst der Regierung von Montenegro für die Gastfreundschaft und für die engagierte
  Arbeit im Vorsitz des Berlin-Prozesses sehr herzlich danken. Montenegro ist einfach
  ein exzellenter Gastgeber. Für mich ist das in diesem Jahr der zweite Besuch in
  Montenegro. Ich habe zuletzt im Juni am EU -Westbalkan-Gipfel teilgenommen. Ich
  komme aus zwei Gründen heute gern wieder. Erstens verbinde ich mit meinem Besuch
  die Botschaft an die Bürgerinnen und Bürger Montenegros: Die Bundesregierung sieht
  die großen Fortschritte, die Ihr Land auf dem Weg in die Europäische Union geschafft
  hat. Wir wollen, dass Montenegro und Europa die Früchte dieser Arbeit bald ernten.
  Zweitens: Mir liegt der Berlin-Prozess selbst am Herzen. Der Prozess will die Staaten
  des westlichen Balkans insgesamt enger miteinander und mit Europa verbinden. Wir
  haben seit 2014 viel erreicht, die Arbeit aber ist gerade heute besonders wichtig.
  Die Botschaft dieses Gipfels lautet: Lasst uns auf diesem Weg entschieden vorangehen.
  – Heute ist das ein geopolitischer Imperativ. Der westliche Balkan darf nicht zu
  einem Ort werden, auf dem große Mächte um Einfluss ringen. Es ist in unserem gemeinsamen
  Interesse, dass der Weg der Staaten in der Region unumkehrbar in die Europäische
  Union führt. Nur diese gemeinsame Perspektive in den europäischen Binnenmarkt und
  in die Institutionen der Europäischen Union wird die notwendige Stabilität für die
  Region insgesamt schaffen. Wie dringlich das bleibt, zeigt der Blick auf Russlands
  brutalen Angriffskrieg gegen die Ukraine, über den wir heute ebenfalls beraten haben.
  Die Länder des westlichen Balkans gehören zu Europa, geografisch und politisch.
  Das war lange Zeit ein Wort für schöne Reden. Aber in den letzten Monaten haben
  wir es geschafft, endlich konkret voranzukommen. Montenegro ist auf dem besten Weg,
  der EU bald beizutreten. Andere müssen und werden folgen. Ich habe vor dem Westbalkan-
  EU -Gipfel im Juni in Tivat gemeinsam mit dem französischen Staatspräsidenten Vorschläge
  gemacht, wie wir schneller und substanziell vorankommen können, und wir sind in
  den letzten Monaten substanziell und gut vorangekommen. Gerade bei der Tagung des
  Europäischen Rats in Brüssel in der vergangenen Woche war die Botschaft eindeutig:
  Wo immer möglich, wollen wir Schritte der graduellen Integration – so haben wir
  es genannt – ermöglichen, um die Länder Schritt für Schritt an die Europäische Union
  heranzuführen. Auch von unserem heutigen Treffen geht genau dieses Signal aus. Wir
  wollen diese Dynamik der EU -Erweiterung. Die EU muss wachsen, wenn sie auf dieser
  Welt ihre Souveränität behaupten und als klarer Machtfaktor in der Welt wahrgenommen
  werden will. Dabei muss aber auch klar sein, dass der politische Wille aus der Region
  selbst kommen muss. Mutige Reformen, gerade hinsichtlich der Rechtsstaatlichkeit,
  sind zwingende Voraussetzung für jeden Fortschritt. Wir wissen, dass das auch die
  klare Erwartung der Bevölkerung in der Region ist. Deutsche und europäische Unternehmen,
  die hier in der Region investieren und Arbeitsplätze schaffen, brauchen transparente,
  rechtsstaatliche Rahmenbedingungen. Auch dabei gibt es ermutigende Erfolge. Es bleibt
  aber noch einiges zu tun. Der Berlin-Prozess insgesamt produziert handfeste Ergebnisse,
  insbesondere bei Perspektiven für die junge Generation, bei der Vernetzung von Industrieparks,
  bei der Integration des Telekommunikationssektors, bei Investitionsbedingungen und
  bei der Förderung von Start-ups . Zur ehrlichen Betrachtung und Bestandsaufnahme
  gehört aber auch, dass es an zahlreichen Stellen immer noch Blockaden gibt. Wir
  brauchen daher mehr politischen Mut. Der Normalisierungsdialog etwa zwischen Pristina
  und Belgrad muss dringend aus der Sackgasse herauskommen. Auch in Bosnien und Herzegowina
  braucht es den Mut, einer wachsenden Polarisierung entgegenzutreten und Brücken
  zu bauen. Es liegt noch ein schwieriger Weg vor den Staaten der Region, aber wichtig
  ist: Sie gehen diesen Weg nicht allein. Sie gehen ihn mit ihren Nachbarn, und sie
  gehen ihn mit Deutschland und den anderen Mitgliedern der Europäischen Union. So
  freue ich mich, dass Österreich im nächsten Jahr den Vorsitz von Deutschland übernimmt,
  Christian Stocker von mir. Lieber Christian, Österreich kann sich auf unsere Unterstützung
  verlassen. Viel Erfolg bei dieser Arbeit! Wir werden sie weiter aus tiefster innerer
  Überzeugung unterstützen. Sehr geehrter Herr Premierminister, lieber Milojko , sehr
  geehrter Herr Bundeskanzler, lieber Friedrich, meine sehr geehrten Damen und Herren,
  es ist mir eine große Ehre, dass Österreich 2027 erneut den Vorsitz des Berlin-Prozesses
  übernimmt. Das zeigt, dass wir ein verlässlicher Partner des Westbalkans sind, ebenso
  wie auch unsere deutschen Freunde. Der Berlin-Prozess hat sich bewährt. Er hat den
  Westbalkan näher an die Europäischen Union herangeführt, die regionale Zusammenarbeit
  gestärkt und gezeigt: Europäische Integration bringt den Menschen schon vor dem
  Beitritt spürbare Vorteile. – Unsere Schwerpunkte im Vorsitz sind Jugend, Versöhnung
  und regionale Zusammenarbeit. Die nächste Generation braucht eine klare, europäische
  Perspektive. Dazu wollen wir junge Menschen über Grenzen hinweg zusammenbringen
  und historische Gräben überwinden. Die Region muss zusammenwachsen, untereinander
  und mit der Europäischen Union. Das eine geht nicht ohne das andere. Es gibt keine
  gemeinsame Zukunft ohne den Blick auf die Vergangenheit, aber auch auf das Vertrauen
  zwischen den Gesellschaften. Das erfordert politischen Mut, langen Atem und vor
  allem konkretes Handeln. Österreich setzt sich ambitionierte Ziele. Doch den entscheidenden
  Schritt müssen Sie in der Region selbst gehen. Wir sind bereit, eng mit allen Partnern
  zu arbeiten, damit 2027 ein erfolgreiches Jahr für den Westbalkan wird. Wir zählen
  auf Ihre Unterstützung. Meine sehr geehrten Damen und Herren, noch ein Wort zu unserem
  Gastgeber: Zum ersten Mal seit 2013 steht ein neues Mitglied der Europäischen Union
  in Reichweite. Lieber Milojko , Österreich unterstützt Montenegro mit voller Kraft
  auf den letzten Metern. Euer baldiger Beitritt wäre mehr als verdient. Er wäre zugleich
  ein Ansporn für die gesamte Region und ein wichtiger Beleg für die Glaubwürdigkeit
  der Union. Das Versprechen von Thessaloniki vor 23 Jahren muss auch eingelöst werden.
  Bis zum Beitritt wollen wir mit der graduellen Integration alle Staaten des Westbalkans
  schrittweise in den Binnenmarkt integrieren, damit die Menschen die Vorteile der
  Europäischen Union schon jetzt spüren. Dazu gehört auch, dass es längst an der Zeit
  ist, dass der Westbalkan Teil der Roamingzone wird, denn es ist nicht erklärbar,
  warum sechs Staaten des Westbalkans schlechter gestellt sein sollen als die Ukraine
  oder Moldau. Über 500.000 Menschen in Österreich haben Wurzeln und Familien am Westbalkan.
  Ihre Kommunikation muss leichter und auch günstiger werden. In diesem Sinne wäre
  es auch wichtig, dass so schnell wie möglich alle sechs Länder dem Zahlungsraum
  SEPA angehören. Was ich letzte Woche beim Europäischen Rat in Brüssel gesagt habe,
  wiederhole ich auch gern hier: Bilaterale Fragen dürfen den Beitrittsprozess nicht
  beeinträchtigen. Sie dürfen diesen geopolitisch so wichtigen Prozess nicht verzögern.
  Lieber Milojko, herzlichen Dank noch einmal für die Einladung und die Ausrichtung
  dieses Gipfels. … (akustisch unverständlich; technische Probleme) ist ein sehr wichtiger
  Prozess. Wir begrüßen unter uns heute das Vereinigte Königreich. Wir freuen uns,
  demnächst den Vorsitz an Österreich zu übergeben. Der Bundeskanzler Österreichs
  hat uns sehr stark unterstützt und die Verbindung in der Region befördert, ebenso
  wie den Beitritt der einzelnen Staaten zur Europäischen Union. Wir blicken zurück
  auf 20 Jahre seit der Unabhängigkeit. Man kann sich kaum vorstellen, welche Ehre
  und welche Chance es darstellt, den Vorsitz zu übernehmen. Hierbei geht es ja darum,
  eine Verbindung zwischen den Staaten und den Menschen in der Region auf dem Weg
  zu einer gemeinsamen europäischen Zukunft zu schaffen. Der Berlin-Prozess hat in
  den vergangenen Jahren demonstriert, dass es eine ganze Reihe von Themen gibt, die
  noch gelöst werden müssen. Aber dennoch können die Staaten des westlichen Balkans
  durch den Dialog Vertrauen schaffen und daran arbeiten, eine gemeinsame europäische
  Perspektive zu schaffen. Dadurch, dass wir heute zusammenkommen, haben wir, glaube
  ich, einen wichtigen Beitrag geleistet. Während unserer Präsidentschaft haben wir
  26 Events ausgerichtet, auch Treffen auf Ministerebene, das intensivste Arbeitsprogramm,
  das je eine Präsidentschaft des Berlin-Prozesses gezeigt hat. Wir haben auch den
  politischen Willen an den Tag gelegt, der es uns ermöglicht, auch auf die komplexesten
  Herausforderungen der Zeit zu reagieren. Wir haben versucht, die Initiative zu ergreifen
  und Prozesse in der Region anzuregen. Wir haben uns sehr ehrgeizige Ziele gesetzt.
  Aber wir glauben, dass sie erreichbar sind. Wir wollten gern bis 2026 die Verhandlungen
  beendet haben, damit Montenegro schon dann zum 28. Mitglied der EU hätte werden
  können. Während unserer Präsidentschaft haben wir die klare Botschaft ausgesandt,
  dass unser Beitrag nicht nur ein strategisches Ziel ist, sondern im Interesse Europas
  insgesamt liegt. Europa möchte ein vertrauenswürdiger Partner in diesem Prozess
  sein, aber auch ein Beispiel geben und belegen, dass wir durch Reformen und konkrete
  Ergebnisse tatsächlich Fortschritte erzielen können. Deshalb möchte ich heute unterstreichen,
  wie wichtig die Zusammenarbeit mit der Bundesrepublik Deutschland gewesen ist, mit
  den wichtigsten Partnern meines Landes, aber auch den anderen europäischen Partnern,
  mit denen wir bilateral zusammenarbeiten. Hierbei geht es uns nicht nur darum, die
  Unterstützung seitens dieser Partner für unsere Integration in Europa zu erfahren,
  sondern auch für die Verstärkung der Handelsbeziehungen, für die Stärkung des Tourismus
  und die Entwicklung der Beziehungen zwischen unseren Bürgern. Dabei sehen wir durchaus
  noch Raum für weitere entscheidende Schritte mit dem Ziel, konkrete Ergebnisse zu
  erreichen. Es soll auch eine Botschaft an die Bürger der EU sein und auch an die
  Menschen auf dem westlichen Balkan: Wir heißen Sie alle sehr gern willkommen in
  unserem schönen Land. Abschließend möchte ich noch einmal Österreich und Bundeskanzler
  Stocker dafür danken, dass Sie den Vorsitz des Berlin-Prozesses übernehmen. Wir
  werden Sie bei Ihren Anstrengungen unterstützen. Dem deutschen Bundeskanzler, Herrn
  Merz, möchte ich für die fortwährende Unterstützung und sein Engagement danken,
  das er der Zukunft dieser Region gewidmet hat. Der Berlin-Prozess ist eine der wichtigsten
  Möglichkeiten, diesem Willen Ausdruck zu geben. Wir glauben, dass unsere zukünftigen
  Treffen in diesem Format uns weiterhin Chancen bieten und eröffnen werden. Es ist
  ein weiterer wichtiger Schritt, den wir heute hier tun, auf dem Weg zur Unterzeichnung
  des Beitrittsvertrags für Montenegro. Aber ich spreche hier nicht nur für Montenegro.
  Es geht hier auch um die starke Unterstützung und das Engagement, das Europa im
  Prozess der Erweiterung der Europäischen Union gezeigt hat. Der Berlin-Prozess hat
  uns gezeigt, dass durch eine Zusammenarbeit mit der EU , durch unsere Zusammenarbeit
  mit Partnern, Dinge in Bewegung gesetzt werden können. Ich hoffe, dass alle Aktivitäten,
  die begonnen wurden, erfolgreich umgesetzt werden. Wir danken auch den Journalisten
  und Journalistinnen, die während unseres Vorsitzes beim Berlin-Prozess berichtet
  haben. Wir danken ihnen für das Interesse. Wir glauben, dass die Integration des
  westlichen Balkans sehr wichtig ist für die Zukunft dieser Region. Ich danke dem
  Ministerpräsidenten, ich danke unseren Gästen, dem Bundeskanzler Deutschlands und
  dem Bundeskanzler Österreichs. Frage : Ich habe eine Frage an den Ministerpräsidenten
  Montenegros und den deutschen Bundeskanzler. Herr Spajić , wir haben festgestellt,
  dass eine Reihe von offensichtlichen Themen zwischen Montenegro und anderen bestehen
  und dass nur zwei dieser Themen gelöst wurden. Sie werden heute noch einmal ein
  Treffen dazu durchführen. Werden die noch offenen Fragen des Verhandlungsprozesses
  gelöst werden? Werden wir uns damit auf den Weg zum Abschluss der Verhandlungen
  und dem Schließen der letzten Kapitel bewegen? Wie ist hier die Position Montenegros?
  Welche Ansicht haben Sie zu diesen noch offenen Fragen zwischen Montenegro und Kroatien?
  Kann sich das auf den Prozess des Abschlusses der noch offenen Verhandlungskapitel
  auswirken? Ministerpräsident Spajić : Ich glaube, dass die Beziehungen zwischen
  Montenegro und Kroatien sehr wichtig sind. … (akustisch unverständlich; technische
  Probleme) Was Integration in die Europäische Union anbetrifft, macht es deutlich,
  dass eine Versöhnung möglich ist. Meiner Ansicht nach können die Lücken geschlossen
  werden. Das halte ich wirklich für möglich. 27 Mitgliedstaaten der EU müssen uns
  dabei unterstützen. Sie müssen erkennen, wie wichtig es ist, dass Montenegro die
  noch offenen Kapitel schließen kann, damit dann dieser technische Prozess abgeschlossen
  werden kann und wir Vollmitglied der Europäischen Union werden können. Frage : Ich
  habe eine Frage an Sie beide: Muss man nicht mit Ländern wie Serbien und Albanien,
  wo es im Moment innenpolitische Probleme gibt, seitens der EU etwas härter umgehen?
  Herr Bundeskanzler, Sie haben gesagt, Sie seien für eine schrittweise Integration
  der Staaten. Können Sie das ein bisschen präzisieren? Welche Länder kommen Ihrer
  Meinung nach dafür in Frage, dass man sie jetzt schon schrittweise in EU-Institutionen
  integriert? Bundeskanzler Merz : Herr Rinke, wir haben heute in der Konferenz zum
  Teil sehr offen angesprochen, welche Probleme es in einzelnen Ländern gibt. Ich
  habe es sowohl in meiner einführenden kurzen Rede als auch in meinen kurzen Schlussbemerkungen
  gesagt: Es gibt offensichtlich in einigen Staaten des Westbalkans zunehmende Spannungen.
  Wir haben in den letzten Wochen auch einige Ereignisse gesehen, die das zusätzlich
  befeuert haben. Diese Spannungen müssen beigelegt werden. Bundeskanzler Stocker
  und ich haben angeboten, dass wir dabei helfen; aber diese Probleme müssen dort
  gelöst werden, wo sie vorhanden sind. Zum Zweiten habe ich zusammen mit Präsident
  Macron im Sommer den Vorschlag gemacht, dass wir Schritt für Schritt auch die Teilnahme
  zum Beispiel am europäischen Binnenmarkt ermöglichen. Das ist in unserem gegenseitigen
  Interesse. Wir wollen sozusagen zwischen „noch ganz draußen“ und „demnächst, bald
  in der Europäischen Union“ Schritt für Schritt die Integration in den europäischen
  Binnenmarkt vollziehen, sodass an einzelnen Teilen des europäischen Binnenmarktes
  schon teilgenommen werden kann, obwohl die Mitgliedschaft noch nicht formal abgeschlossen
  ist. Dieser Vorschlag ist in der letzten Woche in unserer Diskussion im Europäischen
  Rat sehr konstruktiv aufgenommen worden, und er findet auch bei den sechs Balkanstaaten
  Zustimmung. Insofern haben wir mit unserem Vorschlag eine neue Dynamik in diesen
  Prozess hineingebracht. Es wird jetzt auch Zeit, dass wir zum Beispiel einem Land
  wie Montenegro eine sehr konkrete Beitragsperspektive geben. Montenegro wirbt selbst
  dafür, 2028 das 28. EU -Land zu werden, und das sollte nicht völlig unrealistisch
  sein. Frage : Herr Bundeskanzler, Mitte November finden unter amerikanischer Vermittlung
  wieder direkte Gespräche zwischen der Ukraine und Russland statt. Wie blicken Sie
  auf diese Gespräche? Wie sehen Sie die Erfolgschancen? Wird Europa mit am Tisch
  sitzen? Können Sie vielleicht können auch noch sagen, wie Sie auf das mögliche Treffen
  von Präsident Trump mit dem russischen Präsidenten und dem chinesischen Präsidenten
  blicken? Ist das für Sie eher eine Chance oder eine Gefahr für den Friedensprozess?
  Aus aktuellem Anlass: Heute ist ein Spionagefall aufgedeckt worden; der Generalbundesanwalt
  hat das gerade bekanntgegeben. Ein mutmaßlicher russischer Spion soll auch militärische
  Informationen weitergegeben haben. Wie sehr beunruhigt Sie das? Bundeskanzler Merz
  : Zu dem letzten kann ich nur sagen: Das überrascht mich nicht. Wir werden solche
  Fälle in den nächsten Monaten und Jahren vermutlich häufiger sehen. Die Bundesrepublik
  Deutschland ist Adressat von intensiver Spionagetätigkeit. Insofern ist es ein Erfolg,
  dass heute dieser Fall aufgedeckt werden konnte. Aber täuschen wir uns nicht: Die
  Aktivitäten des russischen Geheimdienstes in Deutschland sind unverändert hoch.
  Was die Treffen in den nächsten Tagen und Wochen betrifft: Wir haben in dieser Woche
  das Treffen in Oslo gesehen. Daran hat auch ein Vertreter der deutschen Regierung
  teilgenommen. Wir sind darum bemüht, diesen Prozess voranzubringen. Alle Beteiligten
  wissen, dass Europa mit am Tisch sitzen muss; es wird ohne Europa keinen dauerhaften
  Frieden in der Ukraine geben. Wir tun alles, um diesen Krieg so schnell wie möglich
  zu beenden. Jedes Gesprächsformat, das diesem Ziel dient, ist willkommen. Eine dauerhafte
  Lösung wird es aber nicht über die Köpfe der Ukraine hinweg geben, nicht über die
  Köpfe der Europäer hinweg geben. Das muss eine gemeinsame Kraftanstrengung werden.
  Das, was in den nächsten Tagen stattfindet, ist ein nächstes Treffen auf der Ebene
  der außenpolitischen Berater. Wir nehmen jede Gelegenheit wahr, Gespräche zu führen
  und diesen Krieg so schnell wie möglich zu beenden. Frage : Herr Bundeskanzler Stocker,
  Sie haben Jugend und Versöhnung als Themen genannt. Was wollen Sie konkret während
  des nächsten Jahres, während des österreichischen Berlin-Prozess-Vorsitzes erreichen?
  Was ist Ihre Botschaft an Serbien vor den Parlamentswahlen am Sonntag? Bundeskanzler
  Stocker : Zur Frage, was wir erreichen wollen: Ich habe in meinem Statement umrissen,
  worum es der österreichischen Präsidentschaft geht. Wenn wir von Versöhnung sprechen,
  dann sehen wir natürlich die Konflikte, die hier auch heute angesprochen worden
  sind und die wir nicht wegreden können. Wir müssen diese Konflikte aber lösen. Gerade
  Österreich hat eine gemeinsame Geschichte mit den Ländern am Westbalkan, und damit
  auch ein besonderes Verständnis für diese Fragen. Dieses Verständnis will ich im
  nächsten Jahr einbringen, um hier Fortschritte zu erzielen. Das beginnt natürlich
  bei der Jugend; denn bei allem Verständnis, dass wir die Vergangenheit nicht vergessen
  dürfen und uns unserer Geschichte bewusst sein müssen, geht es darum, die Zukunft
  zu gestalten, und die Zukunft am Westbalkan soll in der Europäischen Union liegen.
  Hierzu wollen einen Beitrag leisten. Was Serbien anbelangt: Wir natürlich wahrgenommen,
  dass ein österreichischer Wahlbeobachter ausgeschlossen worden ist. Das halten wir
  für kein gutes Zeichen und kein gutes Signal in Richtung Europäische Union. Ich
  glaube, dass es, wie ich es vorhin auch gesagt habe, auch und vor allem an den Ländern
  des Westbalkans liegt, diese Probleme zu lösen und nicht weitere zu schaffen. Das
  heißt, wir sehen diese Maßnahme, die hier getroffen wurde, sehr kritisch. Wir hoffen,
  dass wir unabhängige und freie Wahlen erleben werden und dass Serbien sich dann
  auch der Verantwortung, die es selbst für diese Mitgliedschaft und für die Westbalkanländer
  trägt, bewusst ist. Frage : Ich glaube, dass Bundeskanzler Merz auf eine der Fragen
  noch nicht geantwortet hat, nämlich auf die Frage, was seine Haltung zu den Auseinandersetzungen
  zwischen Kroatien und Montenegro ist. Da sind ja noch offene Fragen zu lösen. Wie
  wirkt sich das eventuell auf die potenzielle Mitgliedschaft Montenegros in der EU
  aus? Noch eine Frage an den montenegrinischen Ministerpräsidenten: Was ist Ihre
  Position zu einer Regierungskonferenz und der möglichen Schließung der Kapitel 24
  und 33? Bundeskanzler Merz : Wir haben über die beiden verbleibenden Kapitel am
  Donnerstagabend in Brüssel gesprochen. Ich habe auch mit dem kroatischen Ministerpräsidenten
  über diese Themen gesprochen, und ich weiß, dass es eine sehr intensive und konstruktive
  Diskussion zwischen Montenegro und Kroatien zu diesen beiden verbleibenden Themen
  gibt. Es hat diesbezüglich auch schon ganz konkrete Entscheidungen in Montenegro
  gegeben, um den Weg jetzt zu eröffnen. Ich bin sehr zuversichtlich, dass die die
  letzten Vorbehalte aus Kroatien ausgeräumt werden können. Ich halte sie nicht für
  so substanziell, dass sie der Mitgliedschaft von Montenegro in der Europäischen
  Union im Wege stehen. Das ist jedenfalls mein Kenntnisstand, und der wird von beiden
  Ministerpräsidenten bestätigt. Ministerpräsident Spajić : Zu den Kapiteln 24 und
  33: Sie alle wissen ja, dass wir unsere Verhandlungsposition der Kommission und
  dem Europäischen Rat übermittelt haben, so wie auch allen anderen Stellen, die unsere
  Fortschritte zu beurteilen haben. Sie werden erkennen, wie viel wir seit dem August
  2020 bereits geleistet haben. Die Fortschritte, die wir erreicht haben, sind monumental,
  und ich glaube, wir sollten alle stolz darauf sein. Ich hoffe sehr, dass diese beiden
  Kapitel im Dezember abschließend behandelt werden können. Frage : (akustisch unverständlich;
  technische Probleme) Ministerpräsident Spajić :Unter dem Vorsitz Montenegros war
  das nicht einfach. Dies war kein einfaches Jahr für uns. Viele globale und europäische
  Entwicklungen haben es für uns sogar schwieriger gemacht. Ich glaube aber, dass
  wir den Vorsitzzeitraum so gut wie möglich genutzt haben. Nun überlassen wir es
  und vertrauen wir es unseren Freunden in Österreich an. Ich glaube, wir haben große
  Erfolge erzielt, was den Pfad des westlichen Balkans nach Europa anbetrifft.'
