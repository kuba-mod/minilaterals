title: 'DiscoverEU: Verlosung von Travel-Pässen Jetzt bewerben: Gratis durch Europa
  reisen'
text: 'Neue Erfahrungen durch europäische Landschaften und Metropolen dank DiscoverEU
  . Mit einem gratis Travel -Pass 30 Tage lang verschiedene Länder in der EU bereisen:
  Diese Möglichkeit haben Europäerinnen und Europäer im Alter von 18 Jahren. Zweimal
  im Jahr verlost die EU mit der Aktion Discover EU Travel -Pässe an 18-Jährige in
  ganz Europa. Dabei sollen sie die kulturelle und landschaftliche Vielfalt in Europa
  kennenlernen und sich mit anderen Europäerinnen und Europäern vernetzen. Hauptverkehrsmittel
  bei der Reise ist der Zug, i n Ausnahmefällen sind auch andere Verkehrsmittel zugelassen.
  Außerdem erhalten die ausgewählten Teilnehmerinnen und Teilnehmer eine Discover
  EU -Jugendkarte. Mit der Karte gibt es zusätzlich Rabatte für Kulturbesuche, Lernaktivitäten,
  Sport, Transportmittel, Unterkunft und Verpflegung. DiscoverEU geht nun in die nächste
  Runde: Interessierte können sich noch bis zum 15. Oktober 2026 bewerben. Wer ausgewählt
  wird, kann zwischen dem 1. März 2027 und dem 31. Mai 2028 bis zu 30 Tage lang unterwegs
  sein. Bewerben konnten sich Einzelpersonen oder Gruppen. Eine Gruppe kann aus maximal
  fünf Mitgliedern bestehen. Für einen kostenlosen Travel -Pass müssen diese Voraussetzungen
  erfüllt werden: Discover EU wurde 2018 ins Leben gerufen. Seitdem haben über 430.000
  junge Menschen aus ganz Europa kostenlose Travel -Pässe bekommen und Europa erkundet.
  Bewerbungen können auf der Webseite der EU -Initiative DiscoverEU eingereicht werden.'
