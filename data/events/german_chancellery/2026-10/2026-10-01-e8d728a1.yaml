date: '2026-10-01'
type: press_release
source_name: german_chancellery
title: Pressestatements von Bundeskanzler Merz beim Besuch des 1. Deutsch-Niederländischen
  Korps Ein enorm wichtiger Beitrag für unsere Sicherheit
text: 'Bundeskanzler Friedrich Merz begleiteten NATO-Generalsekretärs Rutte und der
  niederländische Premierminister Jetten. Das Deutsch-Niederländische Korps in Münster
  sei das beste Beispiel, dass die militärischen Anstrengungen Deutschlands von Grund
  auf europäisch und transatlantisch seien, betonte Bundeskanzler Friedrich Merz beim
  Besuch des Deutsch-Niederländische Korps in Münster. Seit Juli sichere das Korps
  die Ostflanke der NATO in Estland und Lettland und leiste damit einen Schlüsselbeitrag
  für unsere Sicherheit. „Das Korps verkörpert, worum es heute geht: ein starkes Deutschland,
  eine starke Niederlande, die fest in einer starken NATO und in einer starken Europäischen
  Union verwurzelt sind“, sagte Merz. Deutschland stehe im Dienst der Freiheit und
  der Sicherheit seiner europäischen Nachbarn. Das Deutsch-Niederländische Korps wurde
  1995 aufgestellt und führt unter anderem multinationale Einsätze. Alle zugehörigen
  Verbände haben insgesamt eine Stärke von rund 1.100 Soldaten. Im Einsatz können
  die zugeordneten Kräfte des Korps je nach Auftrag bis zu 80.000 Soldaten umfassen.
  Ich sage einmal als Gastgeberland: Herzlich willkommen Herr Ministerpräsident, lieber
  Rob Jetten, Generalsekretär der NATO , lieber Mark Rutte! Herzlich willkommen in
  Münster, wo sich heute alles um die NATO und um unsere Zusammenarbeit dreht! Wir
  werden heute Nachmittag die NATO ehren und mit dem Preis des Westfälischen Friedens
  auszeichnen. Ein Friedenspreis für eine Militärallianz, das erscheint auf den ersten
  Blick widersprüchlich, aber tatsächlich ist es folgerichtig. Die NATO ist seit drei
  Generationen die tragende Säule der euroatlantischen Friedensordnung. Sie schützt
  unsere Freiheit, sie schützt unsere Sicherheit, sie schützt unseren Wohlstand, sie
  dient dem Frieden in Europa. Heute ist unsere kontinentale Friedensordnung durch
  den gewalttätigen Revisionismus aus Russland herausgefordert. In der Ukraine, gleich
  jenseits der Grenze der NATO , tobt seit fast fünf Jahren ein mörderischer Krieg.
  Entfesselt hat ihn Moskau in Missachtung und Verachtung von Recht und Ordnung. Dieser
  Krieg geht uns an; er geht uns sehr direkt an. In der Ukraine steht auch die Sicherheit
  unseres Teils Europas, in dem wir leben, auf dem Spiel. Deshalb ringen wir um eine
  diplomatische Lösung, obwohl Moskau bisher nicht bereit ist, an den Verhandlungstisch
  zu kommen. Deshalb unterstützen wir die Ukraine gemeinsam und mit aller Kraft. Deshalb
  lassen wir uns nicht durch Moskaus hybride Angriffe beirren, und deshalb stellen
  wir unter Hochdruck sicher, dass wir Russland glaubhaft abschrecken. Die Bundesregierung
  investiert entschieden in Deutschlands militärische Stärke und wirtschaftliche Resilienz.
  Wir machen dabei große Fortschritte. Diese Anstrengungen sind von Anfang an europäisch
  und transatlantisch. Ein besonders gutes Beispiel dafür ist das 1. Deutsch-Niederländische
  Korps hier in Münster. Unsere Soldatinnen und Soldaten arbeiten hier voll integriert
  zusammen im Dienst der NATO . Seit Juli dieses Jahres sichert das Korps die Ostflanke
  der NATO in Estland und in Lettland. Dieses Korps leistet damit einen enorm wichtigen
  Beitrag zur Sicherheit in Europa. Das Korps verkörpert, worum es heute geht: ein
  starkes Deutschland, eine starke Niederlande, die fest in einer starken NATO und
  in einer starken Europäischen Union verwurzelt sind. Unser Land Deutschland steht
  im Dienst der Freiheit und der Sicherheit auch seiner europäischen Nachbarn. Wir
  wissen: Eine gute Zukunft für unser Land gibt es nur in einem freien, sicheren und
  einigen Europa. Wir übernehmen gemeinsam mit den Niederlanden und unseren weiteren
  Partnern auch hier aus Münster heraus Verantwortung in einem erneuerten Bündnis.
  Ich will es nicht versäumen, das zu sagen: Zusammen machen wir die NATO europäischer,
  damit sie transatlantisch bleiben kann. Ich möchte mich herzlich bei meinen beiden
  Kollegen heute hier in Münster bedanken. Lieber Rob, lieber Mark, diese Verabredung,
  die wir zuletzt in Ankara auf dem NATO -Gipfel miteinander getroffen haben, halten
  wir ein, und das ist unsere gemeinsame zwingende Schlussfolgerung aus Russlands
  Angriff auf die Ukraine. Es ist unsere Antwort auf eine Zeit großer Mächte und technologischer
  Revolutionen. Deshalb bin ich sehr froh und dankbar, dass wir als Nachbarn, als
  Verbündete und als Freunde heute hier gemeinsam in Münster sind. Erlauben Sie mir,
  dass ich die Gelegenheit nutze, auch den Soldatinnen und Soldaten in diesem Korps,
  geführt von den Niederlanden und Deutschland und mit der Beteiligung von 14 weiteren
  Nationen, meinen ganz besonders herzlichen Dank für den Einsatz zu sagen, den sie
  leisten. Ich bedanke mich bei den beiden Kommandeuren, aber ich bedanke mich genauso
  bei allen Soldatinnen und Soldaten, die hier am Standort und auch in den Einsatzgebieten
  ihren Dienst für unser Land, für unsere Freiheit tun. Es gibt kein besseres Beispiel
  als die Kooperation hier in diesem gemeinsamen Deutschen-Niederländischen Korps,
  vereint mit diesen zahlreichen weiteren Nationen, um zu zeigen, wie ernst wir es
  nehmen, aber auch, wie geschlossen wir sind, wenn es darum geht, eben genau das
  zu verteidigen, was uns wichtig ist: unsere Freiheit, den Frieden in Europa und
  letztendlich auch das friedliche Zusammenleben unserer Völker. Deswegen dir, lieber
  Rob, und auch dir, lieber Mark, noch einmal ein sehr herzliches Willkommen in Münster
  und herzliches Willkommen auch in unserer Zusammenarbeit. Herzlichen Dank! Herr
  Bundeskanzler, lieber Friedrich, vielen Dank für das warme Willkommen hier und vielen
  Dank, dass das Deutsche-Niederländische Korps hier schon 31 Jahre lang seinen Platz
  hat! Vor 378 Jahren hat der Westfälische Friede die Niederlande als souveränen Staat
  anerkannt, und deswegen wird der Westfälische Friedenspreis in dieser Stadt verliehen,
  dieses Jahr an die NATO für ihre unermüdliche Arbeit für die Förderung des Friedens
  in Europa. Es gäbe keinen würdigeren Preisträger, Herr Generalsekretär, lieber Mark!
  Es ist wunderbar, dass Sie heute diesen Preis im Namen der NATO bekommen. Dieser
  Preis sagt auch ganz klar aus, dass die europäische militärische Abschreckung im
  Rahmen der NATO essenziell für den Frieden in Europa ist. Es ist wichtiger denn
  je, dass wir in der militärischen Abschreckung zusammenarbeiten. Russland stellt
  eine immer stärkere Bedrohung für das NATO -Bündnis dar. Über die baltischen Staaten
  hat Moskau schon jahrelang seinen Schatten geworfen. In der Nordsee sehen wir die
  Schattenflotte, die immer mehr unter Straflosigkeit agiert. Hier in Deutschland,
  in Leipzig, gab es vor zwei Monaten einen Drohnenangriff, der fast sein Ziel getroffen
  hätte. Das zeigt also die neue europäische Sicherheitsrealität. Unter diesem steigenden
  Druck muss Europa zeigen, zu was es in der Lage ist. Wir müssen zeigen, dass wir
  bereit sind, alles zu tun, um unsere Sicherheit zu verteidigen, und wir haben in
  den letzten Jahren viele Fortschritte erzielt. Seit dem NATO -Gipfel in Den Haag
  haben wir unsere Ausgaben für die Verteidigung stark gesteigert. An Land, zur See
  und in der Luft unterstützen wir die NATO an der Ostflanke mit unseren F-35-Flugzeugen
  und anderen Fähigkeiten. Unsere Unternehmen fahren die Rüstungsproduktion hoch,
  auch die Luftverteidigung, die wir hier zusammen mit Deutschland produzieren. Ich
  bin dankbar für das unverbrüchliche Band, das unsere Länder verbindet und das in
  diesen Zeiten auch nicht mehr als selbstverständlich angesehen werden kann. Deutschland
  und die Niederlande sind natürliche Verbündete. Obwohl wir sehr unterschiedlich
  groß sind, sind wir Mittelmächte. Wir sind Wächter der internationalen Rechtsordnung.
  Wir sind vertraute Partner innerhalb der EU und der NATO . Unsere bilaterale Zusammenarbeit
  bestätigt das ebenfalls. Eine starke EU mit einer starken wirtschaftlichen Grundlage
  und einem bezahlbaren Budget ist wichtig für die Zukunft. Dafür arbeiten wir gemeinsam.
  Wir arbeiten auch viel stärker als in der Vergangenheit im Bereich der Geheimdienstinformationen
  zusammen, damit wir hybriden Bedrohungen entgegentreten können. Wir tun mehr für
  die Verteidigung der Ukraine, um sie vor der russischen Aggression zu schützen und
  unsere Sicherheit hier zu stärken. Wir arbeiten zusammen, um die internationale
  Ordnung hochzuhalten und ihre Institutionen zu stärken. Das militärische Personal
  weiß besser als jeder andere, dass wir unsere gemeinsame Sicherheit nur durch Zusammenarbeit
  stärken können. Deswegen freue ich mich, dass wir hier schon 31 Jahre zusammenarbeiten.
  Das Deutsch-Niederländische Korps ist ein hervorragendes Beispiel für diese wunderbare
  Kooperation. Herzlichen Dank an die Soldatinnen und Soldaten und auch ihre Familien,
  die das ermöglichen! Das ist eine große Verantwortung. Seit dem 1. Juli ist hier
  das taktische Hauptquartier für die Verteidigung in Estland und Lettland. Sie stärken
  die beiden Länder bei der Verteidigung ihrer 700 Kilometer langen Grenze mit Russland.
  Indem wir das tun, stärken wir die Sicherheit in den baltischen Staaten und zeigen,
  dass sie Teil der europäischen Sicherheit ist, der deutschen Sicherheit und der
  niederländischen Sicherheit. Ich will dem Korps ganz herzlich dafür danken, dass
  es diese Verantwortung trägt. Es steht für die erfolgreiche Zusammenarbeit zwischen
  Deutschland und den Niederlanden, aber es ist auch ein hervorragendes Beispiel für
  die Europäer, die gemeinsam innerhalb der NATO Verantwortung für ihre eigene Sicherheit
  übernehmen. Ihr müssen wir gerecht werden, weil es funktioniert, aber auch weil
  wir es gemeinsam leisten müssen. Herr Bundeskanzler, lieber Friedrich, lieber Herr
  Premierminister, lieber Rob, ich freue mich sehr, in Deutschland zu sein. Das ist
  immer so, aber heute ist ein ganz besonderer Tag. Wie Sie wissen, haben wir gerade
  die Soldatinnen und Soldaten des 1. Deutsch-Niederländischen Korps getroffen. Ich
  bin zutiefst beeindruckt von der Qualität und ihrer Hingabe, auch in der Führung
  dieser Truppe. Das ist wirklich ein hervorragendes Beispiel und sehr beeindruckend.
  Heute Nachmittag habe ich die Ehre, den Preis des Westfälischen Friedens im Namen
  der NATO entgegenzunehmen. Diese Ehre gilt allen Kräften, die unter NATO -Flagge
  dienen, und all jenen Militärs und Zivilisten, die die Freiheit und die Demokratie
  jeden Tag verteidigen. Ohne diese Menschen gäbe es keine NATO . Mit diesen Menschen
  sind wir unschlagbar. Wir sehen, wie Russland uns in ganz Europa immer wieder testet:
  Luftraumverletzungen, Brandstiftung, Sabotage und natürlich der hybride russische
  Angriff auf den Leipziger Flughafen im August. Wir sehen keine akute militärische
  Attacke gegen die NATO , wir müssen aber auf die feindseligen Aktivitäten Russlands
  gegen die Alliierten vorbereitet sein, die ja weitergehen. Wir müssen wachsam bleiben.
  Das betrifft die Regierung, und das betrifft unsere Gesellschaft und die Industrie.
  Es ist wichtig, dass die Verbündeten als Regierungen und als Volkswirtschaften zusammenarbeiten,
  damit auch unsere Wirtschaft für Gefahren gewappnet ist. Der Kreml versucht, einen
  Keil zwischen uns zu treiben und uns davon abzuhalten, der Ukraine zu helfen. Unsere
  Botschaft ist daher völlig klar: Ruhig bleiben! Weitermachen! Weiterhin die Ukraine
  unterstützen! Ruhig bleiben, weil wir alles haben, was wir brauchen. Das sehen wir
  auch heute. Wir haben, was wir brauchen, um jeden Zentimeter des Bündnisgebietes
  zu verteidigen, stark zu bleiben, bereit zu sein und jeder Bedrohung entgegenzutreten.
  Schauen Sie sich heute das Beispiel hier an, das Deutsch-Niederländische Korps!
  Weitermachen, das bedeutet, dass wir weiterhin in unsere Verteidigung investieren,
  damit wir in unseren Fähigkeiten der Abschreckung und Verteidigung gegenüber jeder
  Bedrohung stärker werden, egal, woher sie kommt. Deutschland und die Niederlande
  tun genau das. Unterstützung der Ukraine: Unsere Antwort auf die unverfrorenen russischen
  Aktivitäten lautet mehr Unterstützung für die Ukraine, damit sie sich selbst verteidigen
  kann. Ich hoffe, Putin versteht diese Botschaft. Es sind nicht nur die Ukrainerinnen
  und Ukrainer, die leiden. Ganz Russland zahlt ebenfalls einen riesigen Preis für
  diesen selbstgewählten Krieg. Putin schickt Zehntausende junger Russen in den Tod,
  jeden Monat, und zwar für nichts. Er scheitert im Kampfgebiet, und er scheitert
  auch daran, uns einzuschüchtern. Lieber Friedrich, lieber Rob, wir begrüßen Ihre
  Führungsrolle in diesem Bereich. Wir begrüßen, dass Sie mehr für unsere gemeinsame
  Sicherheit tun. Das betrifft die Truppen an der Ostflanke, die Flugzeuge, um den
  Himmel sicher zu halten, und die Marine, die kritische Infrastruktur in der Ostsee
  und darüber hinaus schützt. Das 1. Deutsch-Niederländische Korps trägt Verantwortung
  für das Kommando der NATO -Truppen in der Verteidigung Estlands und Lettlands. Als
  Hauptquartier für Kampfeinsätze ist es in der Lage, internationale Kräfte im Umfang
  von bis zu 50 000 Soldaten zu befehligen. Das ist, wie der Bundeskanzler gesagt
  hat, ein weiteres Beispiel dafür, dass europäische Verbündete mehr für die Verteidigung
  dieses Teiles der NATO tun. Ein stärkeres Europa ist eine stärkere NATO . Communitate
  valemus, gemeinsam stark. So lautet auch Ihr Motto hier in Münster.'
