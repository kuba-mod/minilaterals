title: Im Kabinett beschlossen Kinder- und Jugendschutz in der digitalen Welt verbessern
text: Kinder und Jugendliche sollen sich sicher und selbstbestimmt in der digitalen
  Welt bewegen können. Kinder und Jugendliche brauchen besonderen Schutz – das gilt
  auch für die digitale Welt. Eine unabhängige Expertenkommission hat deshalb Handlungsempfehlungen
  für einen effektiveren Kinder- und Jugendmedienschutz erarbeitet und ihren Abschlussbericht
  mit 56 Handlungsempfehlungen im September 2026 vorgelegt. Auf dieser Grundlage hat
  die Bundesregierung nun Eckpunkte einer zukunftsorientierten Gesamtstrategie für
  den digitalen Kinder- und Jugendschutz beschlossen. Im Mittelpunkt steht die Frage,
  was Kinder und Jugendliche sowie Eltern und Erziehungsberechtigte brauchen, damit
  junge Menschen sich sicher und selbstbestimmt in der digitalen Welt bewegen können.
  Dabei geht es nicht darum, die Digitalisierung aus dem Leben junger Menschen zu
  verbannen oder Verbote um ihrer selbst willen zu verhängen. Ziel ist es vielmehr,
  Kinder und Jugendliche zu schützen, ihre Kompetenzen zu stärken und ihnen eine aktive
  Teilhabe an der digitalen Welt zu ermöglichen. Die Umsetzung dieser Ziele ist eine
  gesamtgesellschaftliche Aufgabe. Dafür müssen Bund, Länder und die Europäische Union
  eng zusammenarbeiten. Die nun beschlossenen Eckpunkte sehen verschiedene Maßnahmen
  vor. So wird die Bundesregierung den Vorschlag für einen sogenannten „ EU KIDS Act
  “ unterstützen. Die Europäische Kommission will damit unter anderem eine Altersgrenze
  von 13 Jahren für soziale Netzwerke einführen und suchtfördernde Designs digitaler
  Anwendungen verbieten. Solange auf europäischer Ebene kein Mindestalter für die
  Nutzung sozialer Netzwerke festgelegt ist, will die Bundesregierung eine nationale
  Übergangsregelung schaffen. Danach soll Kindern unter 13 Jahren die Nutzung sozialer
  Netzwerke grundsätzlich untersagt werden. Ausnahmen sind für nachweislich kindgerechte
  Angebote vorgesehen. Für Jugendliche zwischen 13 und 18 Jahren sollen abgestufte
  Nutzungsbeschränkungen gelten. Ab 2027 will die Bundesregierung dafür mit der deutschen
  Umsetzung der European Digital Identity Wallet (EUDI-Wallet) „d-you“ eine zuverlässige
  Möglichkeit der Altersverifikation bei digitalen Diensten bereitstellen. Auch die
  Medienkompetenz und die Kompetenz im Umgang mit KI -Anwendungen von Kindern und
  Jugendlichen sollen gestärkt werden. Die Bundesregierung wird sich deshalb zum Beispiel
  dafür einsetzen, dass ein sogenanntes „ KI -Seepferdchen“ als altersgerechtes Angebot
  für das Grundschulalter entwickelt und deutschlandweit einheitlich verbreitet werden
  kann. Hauptverantwortlich für eine sichere Umgebung sind die Plattformbetreiber.
  Abhängig von Alter und Reifegrad des Kindes bleibt es aber auch Aufgabe der Eltern,
  die Mediennutzung ihrer Kinder ergänzend zu beaufsichtigen. Die Bundesregierung
  setzt sich daher mit verschiedenen Maßnahmen dafür ein, dass sowohl die Medienkompetenz
  von Kindern und Jugendlichen als auch von Eltern und Fachkräften gestärkt werden.
  Eine bundesweite Kampagne für Eltern von Kindern im Vorschulalter zielt darauf ab,
  diese für die Gefahren in den digitalen Medien zu sensibilisieren und aufzuzeigen,
  welche Unterstützungsangebote es gibt. Die Kampagne wird noch in diesem Jahr starten.
  Übermäßige Mediennutzung kann auch zu Übergewicht, Schlafstörungen oder Entwicklungsstörungen
  führen. Deshalb wurde bereits die Einführung einer neuen Früherkennungsuntersuchung
  für Kinder im Alter zwischen neun und zehn Jahren und die Dokumentation der Jugendgesundheitsuntersuchung
  J1 beschlossen. Ein Schwerpunkt bei beiden Untersuchungen wird unter anderem auf
  der Erkennung von Risiken des digitalen Medienkonsums und der entsprechenden Beratung
  liegen. Zudem will sich die Bundesregierung gegenüber den Ländern für die Einführung
  einer kindgerechte Anzeige- und Meldestelle („Kinder- Online -Wache“) einsetzen.
  Außerdem sollen geeignete Maßnahmen des Bundeskriminalamts – in Abstimmung mit den
  Polizeien der Länder – unter anderem zum Thema Cybergrooming umgesetzt werden. Die
  Bundesregierung wird den Austausch mit den Ländern, auf europäischer Ebene und mit
  weiteren Akteuren fortsetzen und die Umsetzung weiterer Handlungsempfehlungen zum
  Schutz von Kindern und Jugendlichen in der digitalen Welt vorantreiben.
