title: 'Historisches Kulturerbe vor KI-Fälschungen schützen: BKM und Google.org fördern
  die „Global Authentic Memory Initiative“'
text: 'Der Beauftragte der Bundesregierung für Kultur und Medien und Google.org, die
  gemeinnützige Stiftung von Google, unterstützen gemeinsam die „Global Authentic
  Memory Initiative (GAMI)“. Ziel von GAMI ist, historische Digitalbestände vor Fälschungen
  zu schützen, die durch den Einsatz generativer künstlicher Intelligenz erzeugt wurden.
  GAMI bietet eine offene, herstellerunabhängige technische Lösung, mit der sich die
  Echtheit historischer Dokumente digital überprüfen lässt. Damit will GAMI einen
  entscheidenden Beitrag zur Bekämpfung historischer Desinformationen im digitalen
  Raum leisten. BKM unterstützt das Projekt mit Fördermitteln in Höhe von 100.000
  Euro. Weitere 300.000 Euro trägt die Stiftung Google.org. Kulturstaatsminister Wolfram
  Weimer reiste diese Woche in die USA, um sich auch mit Vertreterinnen und Vertretern
  großer Technologieunternehmen, darunter Google, auszutauschen. Im Rahmen seiner
  Reise sagte er: „Der Erhalt unseres kollektiven Gedächtnisses und der Schutz historischer
  Wahrheiten sind fundamentale Säulen einer wehrhaften Demokratie. Wir nehmen die
  Sorgen der Gedenkstätten sehr ernst, die uns im Januar erreicht haben. Mit GAMI
  stellen wir sicher, dass wertvolle Archivbestände im digitalen Zeitalter dauerhaft
  geschützt werden und für künftige Generationen unabhängig überprüfbar bleiben. Gleichzeitig
  gehen wir einen wichtigen Schritt im Kampf gegen Desinformation. Gedächtniseinrichtungen
  erhalten mit GAMI ein innovatives Tool, das ihre digitalen Bestände nachhaltig vor
  Fälschungen schützt und gleichzeitig sicherstellt, dass unsere Geschichte nicht
  zum Spielball politischer Interessen wird.“ Rowan Barnett, Director Google.org EMEA
  & APAC: „Die Bewahrung historischer Wahrheit, von Zeitzeugenberichten und des Vertrauens
  in authentische Informationen war noch nie so wichtig wie heute.Google.org unterstützt
  GAMI dabei, diese wichtige technische Infrastruktur zu skalieren und ein nachhaltiges
  Modell für Tausende von Archiven weltweit zu etablieren.“ Pablo Toussaint, Gründer
  und Direktor von Authentic Memory: „Die größte Gefahr ist nicht, dass Menschen Fälschungen
  glauben, sondern dass sie echten Dokumenten nicht mehr trauen. Wenn wir das Vertrauen
  in historische Aufnahmen erhalten wollen, müssen wir Archivbestände jetzt absichern,
  bevor sich das Zeitfenster schließt, in dem sich authentisches Material noch von
  synthetischem unterscheiden lässt.“ Die Herausforderung, Echtheit eindeutig zu erkennen
  Indem Museen, Archive, Gedenkstätten und Forschungseinrichtungen ihre Digitalisate
  mit dem von GAMI entwickelten digitalen Nachweis versehen, bestehend aus einem kryptografischen
  Fingerabdruck, einem Zeitstempel und einer institutionellen Signatur, sorgen sie
  dafür, dass die Echtheit und Integrität ihrer digitalen Bestände über Jahrzehnte
  hinweg unabhängig überprüfbar sind. Authentische historische Dokumente werden somit
  digital eindeutig identifizierbar und können leicht von KI-generierten Fälschungen
  unterschieden werden. In einem offenen Brief vom 13. Januar 2026 hatten insbesondere
  NS-Gedenkstätten darauf hingewiesen, dass durch den zunehmenden Einsatz generativer
  KI die Unterscheidung zwischen echten historischen Dokumenten und synthetischen
  Fälschungen oft nicht eindeutig ist. Dies führt zur Gefahr der sogenannten „Lügner-Dividende“:
  Echte historische Aufnahmen können zu Unrecht als KI-Fälschungen abgetan werden,
  während KI-generierte Fake-Inhalte als historische Tatsachen verbreitet werden.
  Millionen historische Bestandsobjekte tragen im Gegensatz zu modernen Medien keine
  eingebetteten Herkunftsnachweise, wodurch nicht gekennzeichnete historische Dokumente
  Gefahr laufen, als KI-generiert und somit als nicht echt eingestuft zu werden. GAMI
  ist eine gemeinnützige Initiative der Authentic Memory gUG, die als Ausgründung
  der Technischen Universität München und der Ludwig-Maximilians-Universität München
  ins Leben gerufen wurde. Unter der Leitung des Gründers Pablo Toussaint entwickelt
  ein junges Team das technologische Verfahren und baut die erforderliche IT-Infrastruktur
  auf. Erste erfolgreiche Pilotprojekte wurden bereits mit der KZ-Gedenkstätte Dachau
  und der KZ-Gedenkstätte Flossenbürg durchgeführt. Weimer erörtert auf USA-Reise
  mit Vertretern von Big Tech die Herausforderungen durch KI Wie die Verbreitung von
  Deepfakes und Desinformation bekämpft werden kann, war auch Thema eines Gesprächs,
  das Staatsminister Weimer mit Vertreterinnen und Vertretern von YouTube und Google
  im Rahmen seiner USA-Reise in dieser Woche geführt hat. Es ging insbesondere um
  den Beitrag, den Technologieunternehmen leisten können, um die Kreativwirtschaft
  und kulturelle Einrichtungen vor dem schädlichen Einfluss etwa von KI-Fälschungen
  zu schützen.'
