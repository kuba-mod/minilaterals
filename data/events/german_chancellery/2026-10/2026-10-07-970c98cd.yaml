  Das kann man ja durchaus machen. Ich habe meiner gerade gegebenen Antwort nichts
  hinzuzufügen. Aber wir können doch festhalten: Sie schauen noch einmal, was Sie
  an faktischen ‑ ‑ ‑ Es geht ja nicht um Inhalte, sondern ‑ ‑ ‑ Nein, es ging bei
