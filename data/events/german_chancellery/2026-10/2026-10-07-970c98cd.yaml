  Status quo ist. Was dann passiert, werden wir sehen. Genau, aber der zweite Aspekt
  war ja, warum man 2023, als es schon Vorschläge gab ‑ sie richten sich an das Innenministerium ‑,
  wie man bei Beamtenrecht und Verschärfung und übrigens auch bei der Spionageabwehr,
  die ja auch bei Ihnen liegt, mit dem Verfassungsschutz, noch keine Konsequenzen
  gezogen hatte. Das ist ja unabhängig von den Ermittlungen. Ich kann nur auf das
  verweisen, was der Regierungssprecher schon gesagt hat. Herr Hille, ist denn der
  Bundesregierung bekannt, für welches konkrete Land, für welche konkreten Dienste
  Herr Hanning mutmaßlich Spionage betrieben hat? Nein, dazu dient ja genau das, was
  ich gerade ausführlich geschildert habe, nämlich das Verfahren bei der Funktion,
  die dafür zuständig ist, dem Generalbundesanwalt. Dafür aber, ob das zutreffend
  ist, was derzeit als Vorwurf im Raum steht, was offensichtlich die Qualität hatte,
  dass es einen Haftbefehl rechtfertigt, braucht es ein entsprechendes Verfahren.
  Ich kann für uns noch einmal sagen, dass wir diesen Fall natürlich sehr ernst nehmen.
  Wie ich eingangs mehrfach gesagt habe, unterstützen wir die Ermittlungsbehörden
  dort, wo es geht, vollumfänglich bei der Aufarbeitung dieses Falles, um zu klären,
  wie groß der Schaden ist, der dadurch entstanden ist. Zumindest im journalistischen
  Raum kursieren die Namen Aserbaidschans und Israels. Können Sie denn vollumfassend
  ausschließen, dass es sich um diese beiden Länder handelt? Ich kann und werde gar
  nichts ausschließen, weil es nicht meine Aufgabe ist, derartige Dinge in der von
  Ihnen erfragten Weise zu beurteilen. Dafür ist das Verfahren beim Generalbundesanwalt.
  Genau das tut er. Herr Hille, so ganz kann ich Sie aus der ganzen Geschichte doch
  nicht herauslassen, denn es soll ja noch eine Kanzleramtsministerin geben, die für
  den Bundesnachrichtendienst zuständig ist, sowie die ganze Abteilung 7 ‑ die ist
  es, glaube ich, in der aktuellen Zählung ‑ unter Herrn Wolff. Ich würde dann doch
  gern verstehen: Was macht das jetzt mit der Kanzleramtsministerin bzw. was macht
  die Kanzleramtsministerin an der Stelle? Was macht Abteilung 7 jetzt, die ja die
