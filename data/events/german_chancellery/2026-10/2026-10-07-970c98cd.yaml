  Dann war das eine Absage an irgendeine Zulieferung, die es noch geben wird. Habe
  ich das richtig verstanden? Ich will nur der guten Form halber Herrn Hille auch
  noch darauf hinweisen, dass es ja auch hier die Möglichkeit gibt, gegebenenfalls
  „unter zwei“ oder „unter drei“ zu gehen, was natürlich nicht geheimschutzfähig ist,
  aber möglicherweise doch mehr Transparenz ermöglicht. Vielen Dank für diesen freundlichen
  Servicehinweis. Dessen bin ich mir bewusst. Hätte ich es für sinnvoll gehalten,
  hätte ich es getan. Aber trotzdem war der Hinweis doch sinnvoll. Absolut, es war
  auch bitte nicht anders zu verstehen. Herr Hille, der Bundeskanzler hat ja einen
  Brief von Daniel Günther bekommen. Das berichten mehrere Medien. In diesem Brief
  soll Herr Günther deutliche Kritik an der Energiepolitik der Bundesregierung geäußert
  haben. Wie geht der Kanzler mit diesem Brief um? Wie bewertet er diese Kritik? Nun,
  Herr Kollege, das Thema ist ja die EEG-Novelle und der Ausbau der erneuerbaren Energien.
  Genau das befindet sich ja gerade in der Beratung und in der Beschlussfindung. Für
  uns ist klar, dass die Bundesregierung zu den ehrgeizigen Ausbauzielen für erneuerbare
  Energien steht. Die beiden Gesetzentwürfe, um die es geht, die EEG-Novelle und das
  Netzanschlusspaket, befinden sich ja gerade in den parlamentarischen Beratungen.
  Sie werden mir nachsehen, dass ich diesbezüglich im Detail jetzt nicht weiter Stellung
  nehme, weil es Sache des Parlamentes ist. Wir wollen bis 2030 80 Prozent des Stroms
  aus erneuerbaren Energien gewinnen. Das ist auch für unsere Unabhängigkeit von fossilen
  Energien zentral, wie wir ja gerade auch anhand der hohen Energiepreise in der Folge
  der unsicheren Lage im Nahen Osten sehen können. Ziel der Bundesregierung ist es,
  die Energiekosten dauerhaft zu senken, die Versorgungssicherheit zu gewährleisten
  und die Energiewende transparent, planbar und pragmatisch zum Erfolg zu bringen.
  Hat es denn nach diesem Brief noch einmal Gespräche gegeben? Hat der Kanzler sich
  einmal direkt mit Herrn Günther oder vielleicht mit der zuständigen Ministerin unterhalten?
  Welche Konsequenzen zieht der Kanzler denn jetzt aus diesem Brief? Entschuldigung,
  Herr Kollege, ich hatte gerade vergessen, Ihnen zu sagen, dass dieser Brief im Bundeskanzleramt
  angekommen ist. Diese grundsätzlichen Ausführungen sollten darauf hinführen, dass
  der Sachverhalt bekannt ist und Gegenstand der parlamentarischen Beratung ist, die
  gerade laufen. Aber die Ziele der Bundesregierung habe ich Ihnen ja gerade genannt.
  Dabei bleibt es. Ich habe eine Frage an das Wirtschaftsministerium und die Bundesregierung.
  Es geht um den Verkauf von Anteilen des Hamburger Logistikunternehmens Zippel an
  die chinesische Staatsreederei COSCO bzw., dass es eben nicht stattfindet, nämlich
  untersagt worden ist. Es wurde über Sicherheitsbedenken gesprochen. Was genau sind
  denn diese Sicherheitsbedenken? Damit sind wir dann bei den Kabinettsthemen, die
  eben noch nicht aufgerufen wurden. In der Tat hat heute das Bundeskabinett zugestimmt,
  dass der Vollzug dieses Geschäftes im Rahmen einer Investitionsprüfung untersagt
  wird. Sie haben schon richtig dargestellt, dass es um die chinesische Rederei COSCO
  und den Hamburger Spediteur Konrad Zippel GmbH geht. Der Erwerb hätte Abhängigkeiten,
  die schon bestehen, vertieft und die Resilienz von Lieferketten in Deutschland und
  der EU gefährdet. Deswegen hat die Bundesregierung im Kabinett heute entschieden,
  den Erwerb der Stimmrechte dort nicht zu ermöglichen. Deutschland als Volkswirtschaft
  hat natürlich grundsätzlich ein Interesse daran, dass Investitionen in unserem Land
  geleistet werden. Wir heißen Investitionen willkommen. Gleichzeitig kann es eben
  Investitionen geben, die unseren Sicherheitsinteressen widersprechen. Dafür geben
  das Außenwirtschaftsgesetz und die Außenwirtschaftsverordnung dann die notwendigen
  Instrumente, um damit umzugehen. Ich bitte aber um Verständnis, dass ich, weil hierbei
  natürlich Unternehmensinteressen betroffen sind und weil es Sicherheitsinteressen
  sind, nicht weiter ins Detail gehen kann, welche Erwägungen genau hinter diesen
  Entscheidungen dann stehen. Eine kurze Nachfrage dazu: Wenn man jetzt in die Zukunft
  schaut, wie wird denn in Zukunft damit umgegangen? Führt es jetzt dazu, dass man
  weitere Überprüfungen und Untersagungen chinesischer Unternehmen in Deutschland
  vornimmt oder mehr in den Blick nimmt? Das ist jetzt ein bisschen eine hypothetische
  Frage. Ich kann vielleicht einmal mit der Statistik der Vergangenheit antworten.
  Wir prüfen jährlich ungefähr 300 solcher Erwerbe im Rahmen von Investitionsprüfungen.
  Bisher ist es in der Geschichte dieses Instrumentes dabei insgesamt zu acht Untersagungen
  gekommen. Nichtsdestoweniger ist jeder Prüffall ein Einzelfall, den wir uns genau
  anschauen, den wir uns im Hinblick auf aktuelle geopolitische Situationen genau
  anschauen. Sie haben vielleicht die Berichterstattung dazu in den vergangenen Tagen
  auch gesehen. Ich glaube, vergangene Woche war es ein bisschen virulent. Wir arbeiten
  an einem Investitionsprüfgesetz, in dem dieses Instrument noch einmal rechtlich
  zusammengefasst und etwas verschlankt und spezifiziert wird. Es ist also ein Thema,
  das wir uns auch in der Zukunft eng anschauen und bei dem wir jeweils für jeden
  Fall die richtigen Entscheidungen treffen werden. Aber ‑ ich bitte um Verständnis ‑
  ich kann jetzt keine grundsätzliche Linie prophezeien, sondern es wird weiterhin
  eine Einzelfallentscheidung bleiben. Ich wollte ganz kurz bezüglich des Investitionsprüfgesetzes
  fragen, wie denn der aktuelle Zeitplan ausschaut. Dabei kann ich keinen Zeitplan
  als solchen mitteilen. Wir befinden uns im Rahmen der Ressortabstimmung. Das sind
  jetzt die Abstimmungen in der Bundesregierung. Dann schauen wir, dass wir dabei
  zügig vorankommen. Haben Sie eine Antwort oder eine Reaktion von COSCO bekommen?
  Das wäre mir nicht bekannt. Es ist auch jetzt nicht erforderlich. Als Wirtschaftsministerium
  haben wir dem Unternehmen nach diesem Kabinettbeschluss einen Bescheid zugestellt.
  Was das Unternehmen dann damit macht, ist Sache des Unternehmens. Herr Hille, Deutschland
  und Frankreich wollen offenbar das Verbot von Verbrennerautos stärker aufweichen
  als bisher geplant. Das Handelsblatt berichtet nämlich, Kanzler Merz und Macron
  hätten sich darauf verständigt, dass nach 2035 noch deutlich mehr Verbrennerautos
  zugelassen werden dürfen als bislang vorgesehen. Können Sie das bestätigen? Sie
  wissen, wie unser Umgang mit Presseberichterstattung ist. Wir kommentieren diese
  üblicherweise nicht. Das ist auch in diesem Fall der Fall. Dazu kann und werde ich
  nicht mehr sagen. Herr Hille, dementieren Sie denn, dass das stimmt, was das „Handelsblatt“
  berichtet hat? Ich würde sagen: Auch das ist eine Frage, die sich auf Presseberichterstattung
  bezieht, und auch da lautet die Antwort, Herr Kollege, dass wir Presseberichterstattung
  nicht kommentieren. Ist denn der Bundeskanzler, rein inhaltlich betrachtet, der
  Meinung, dass auch über die bisherigen Regelungen hinaus eine stärkere Nutzung von
  neu zugelassenen Automobilen mit Verbrennermotoren kommen sollte? Ja, denn darauf
  ‑ das darf ich Ihnen in Erinnerung rufen ‑ hat sich die Koalition ja im Koalitionsausschuss
  schon verständigt. Hilft Ihnen das? Ich darf hier keine weitere Nachfrage stellen,
  das hatte ich ja schon getan. Ich könnte jetzt noch Technologieoffenheit usw. anführen,
  aber in Anbetracht der Uhrzeit lasse ich das. Sie kennen den Text ja. Wie bewertet
  man denn im Verkehrsministerium den heutigen Beschluss aus dem Verkehrsausschuss,
  die Bahnstrecke Hannover-Hamburg neu zu gestalten? Die neue Strecke soll mit Milliarden
  finanziert werden, gleichzeitig aber soll die bestehende Strecke noch einmal für
  250 Millionen Euro verbessert werden. Hält der Bund diese Kombination aus Neu- und
  Ausbau für den richtigen Weg? Wenn ja, warum? Der Beschluss des Verkehrsausschusses
  beruht ja auf der Empfehlung des Bundesministeriums für Verkehr. Von daher kann
  ich das, glaube ich, grundsätzlich unterstützen. Weil viele Jahre an Untersuchungen
  und Abstimmungen mit der Deutschen Bahn diese Variante als vorzugswürdig angegeben
  haben. Die Frage geht an das Wirtschaftsministerium. Die Wirtschaftsministerin hat
  in einem aktuellen Zeitungsinterview gesagt, Deutschland fördere Wärmepumpen mit
  zwölf Milliarden Euro pro Jahr. Wie kommt sie zu dieser Zahl, die von Fakten nicht
  gestützt wird? Nach meinem Kenntnisstand ist das die Förderung, die im Rahmen der
  Bundesförderung für effiziente Gebäude zur Verfügung steht. Aber ich müsste im Zweifel
  auch noch einmal schauen, was da die genauen Zahlen sind. Nach meinem Kenntnisstand
  ist das der Gesamtetat für die Gebäudeförderung. Darunter fallen auch Dämmungsmaßnahmen.
  Der explizite Förderbetrag für Wärmepumpen beträgt nach meinen Informationen die
  Hälfte davon, also ungefähr sechs Milliarden Euro. Vielleicht könnten Sie das prüfen
  und nachliefern. Ich habe eine Frage an das Außenministerium. Die „BILD“-Zeitung
  berichtet, dass in Ihrem Ministerium ein Genderstreik herrsche und wichtige Dokumente
  blockiert würden, weil der Minister den Zwang zum Gendern aufgehoben habe. Funktioniert
  das Außenministerium noch? Wir haben diese Berichterstattung zur Kenntnis genommen.
  Ich kann Ihnen sagen, dass diese Berichterstattung falsch ist. Die aufgestellten
  Behauptungen ‑ ich zitiere die Berichterstattung jetzt einmal ‑, da seien wichtige
  Vorgänge etwa links liegen gelassen worden, Dokumente seien auch nicht im Ministerbüro
  angekommen und es gehe gar um eine Sabotage der Verwaltungsvorgänge, entbehren jeder
  Grundlage. Richtig ist, dass die Gleichstellung von Männern und Frauen gesetzlicher
  Auftrag für alle Bundesbehörden ist. Das soll auch im amtlichen Schriftverkehr geregelt
  werden. Im Auswärtigen Amt unter der Leitung von Außenminister Wadephul besteht
  dazu eine Handreichung, wie dies unter Beachtung der geltenden Regeln der deutschen
  Rechtschreibung umgesetzt werden soll. Dabei ist klar, dass das sogenannte Gendern
  mit Sonderzeichen im amtlichen Schriftverkehr zu unterlassen ist, also die Nutzung
  von Sternchen, Doppelpunkten und der sogenannten Binnenmajuskel. Bei Personenbezeichnungen
  im amtlichen Schriftverkehr werden dabei dementsprechend grundsätzlich etwa Paarformen
  wie „Kolleginnen und Kollegen“ benutzt. Das ist auch eine Form des Genderns. Es
  ist Aufgabe auch der Führungskräfte des Auswärtigen Amts, an der Umsetzung dieser
  Maßgaben mitzuwirken. Genau das haben Abteilungsleiterinnen und Abteilungsleiter
  im Auswärtigen Amt getan. Die Behauptung, dass es mit einzelnen Abteilungsleitungen
  einen Dissens über diese Handreichung und ihre Anwendung geben würde, ist vollkommen
  falsch. Haben Sie denn geprüft, ob da Unterlagen liegen geblieben sind? Die Zeitung
  schreibt das ja nämlich. Nur ganz kurz: Herr Giese, auf wessen Beschluss geht das
  denn zurück? Ist das Herrn Wadephuls Entscheidung gewesen? Der Beschluss, wie man
  amtlich formuliert, entspricht, glaube ich, einer grundsätzlichen Haltung, die in
  allen Bundesbehörden gilt. Meines Wissens geht das vom BMI aus, und für die einzelnen
  Bundesbehörden, die obersten Bundesbehörden bzw. die Bundesministerien gibt es dann
  jeweils in den Häusern eine Handreichung. In der Handreichung für das Auswärtige
  Amt steht mehr oder weniger drin, dass die Regeln der deutschen Rechtschreibung
  gelten. Frau Schuler, nächste Woche wird ja der Arbeitgebertag stattfinden. Dabei
  wird auch Frau Bas eine Rede halten; zumindest steht das so auf der Webseite. Letztes
  Jahr wurde Frau Bas beim Arbeitgebertag ja nicht allzu freundlich aufgenommen. Mit
  welcher Botschaft will Frau Bas denn dieses Jahr dort auftreten? Ich bitte um Verständnis
  dafür, dass ich dem Termin nicht vorgreifen kann und dass wir Botschaften ja üblicherweise
  auch nicht vorher verkünden. Im Übrigen ist sie dort als Panelteilnehmerin angekündigt.
  Ich möchte mich heute kurz verabschieden. Das war heute meine letzte Regierungspressekonferenz.
  Am 3. September 2014 habe ich das Landwirtschaftsministerium hier zum ersten Mal
  vertreten. Das ist jetzt tatsächlich schon zwölf Jahre her. In den zwölf Jahren
  hat sich viel verändert. Alles ist schneller, unmittelbarer und vielleicht auch
  fragmentierter geworden. Die Medienwelt von damals ist gar nicht mehr mit der von
  heute zu vergleichen. Ich glaube, wir Sprecherinnen und Sprecher haben gelernt,
  dass man sich der Geschwindigkeit dieser Veränderung kaum entziehen kann. Vielleicht
  ist das auch eine Frage, die die Bundespressekonferenz in den nächsten Jahren begleiten
  wird. Ich möchte Danke sagen für die vielen Fragen, Gespräche und Begegnungen. Ich
  kann natürlich nicht gehen, ohne auch noch einen Dank an die beste Pressestelle
  innerhalb der Bundesregierung herauszuschicken. Um dann nach zwölf Jahren Landwirtschaft
  beim Abschied hier auch noch einmal fachlich sauber und im Wording zu bleiben: Ich
  mache mich jetzt vom Acker! Dann herzlichen Dank für die Zusammenarbeit und alles
  Gute für Sie auf Ihrem weiteren Berufsweg!'
