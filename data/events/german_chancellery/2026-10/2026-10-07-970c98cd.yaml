date: '2026-10-07'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 7. Oktober 2026
text: 'Sprecherinnen und Sprecher •    stellvertretender Regierungssprecher Hille
  •    Giese (AA) •    Dr. Hosemann (BMJV) •    Singer (BMI) •    Wentzel (BMWE) •    Reck
  (BMV) •    Schuler (BMAS) •    Hauck (BMLEH) (Vorsitzender Szent-Iványi eröffnet
  die Pressekonferenz und begrüßt SRS Hille sowie die Sprecherinnen und Sprecher der
  Ministerien.) Einen schönen guten Tag auch von mir! Schön, Sie zu sehen. Ich möchte
  mit einem Thema starten, das ernster kaum sein könnte. Heute ist der 7. Oktober.
  Wie Sie wissen, jähren sich heute die furchtbaren Terroranschläge der Hamas in Israel
  zum dritten Mal. Unsere Gedanken sind bei den Opfern und ihren Hinterbliebenen,
  den Überlebenden und den ehemaligen Geiseln. Wir gedenken der Toten. Wir trauern
  mit den Hinterbliebenen. Wir hoffen, dass der tiefe Schmerz und die Wunden, die
  diese barbarischen Taten geschlagen haben, heilen können. Der Bundeskanzler hat
  noch einmal deutlich gemacht: „Deutschland steht fest an der Seite Israels. Unsere
  israelischen Freunde können auf unseren Einsatz zählen, damit sich ein solches Verbrechen
  niemals wiederholt. Wir stehen für die Sicherheit und Existenz Israels ein ‑ das
  ist eine Lehre aus der Schoah und Teil deutscher Identität. Es muss nun darum gehen,
  das Fundament einer neuen Ordnung zu legen, in der Israelis, Palästinenser und ihre
  Nachbarn in Frieden und Sicherheit leben können. Dafür setzt sich die Bundesregierung
  ein. Unserer Überzeugung nach ist dieses Ziel am besten durch die Gründung eines
  palästinensischen Staates an der Seite Israels zu erreichen.“ Herr Hille, diese
  sehr deutliche Position ‑ palästinensischer Staat an der Seite Israels ‑ entspricht
  inhaltlich der Linie, die das Auswärtige Amt hier schon häufiger vorgetragen hat.
  Allerdings sind die Widerstände, und zwar die prinzipiellen Widerstände, vor allem
  in Israel gegen einen solchen Staat unvermindert stark. Was tut die Bundesregierung
  über diesen Wunsch oder, wenn man so sagen will, über diese Aufforderung hinaus,
  um diesen Prozess zu befördern? Herr Kollege, es beginnt damit, dass wir unsere
  Position sehr klar formulieren, so wie ich es hier gerade an dieser Stelle getan
  habe, jetzt und in allen Gesprächen, die die Bundesregierung auf allen Ebenen führt,
  vom Bundeskanzler über den Bundesaußenminister bis hin zu allen Ministerinnen und
  Ministern in ihren jeweiligen Kontakten mit Israel. Das ist die Position Deutschlands,
  mit der wir Israel in jeder Situation gegenübertreten und die wir deutlich machen.
  Wohlwissend, dass auch der erste Teil meiner Worte für uns größte Bedeutung hat,
  brauche ich, denke ich, nicht noch einmal herzuleiten, warum das der Fall ist und
  dass das der Fall ist. Die Verurteilung der Terroranschläge vom 7. Oktober hat auch
  in diesem Raum seit Jahren immer wieder stattgefunden. Viele Staaten erkennen eine
  palästinensische Staatlichkeit schon jetzt an, ohne dass es Staatlichkeit im Sinne
  von Territorium, gewählter Regierung usw. gäbe. Das ist ein symbolischer Akt, der
  gleichwohl politischen Druck entfaltet und dem Ziel einer gesicherten palästinensischen
  Staatlichkeit dienlich ist. Wann erwägt die Bundesregierung ernsthaft, sich dieser
  Gruppe von Staaten anzuschließen? Lieber Herr Kollege, zu diesem Thema haben wir
  uns hier schon sehr häufig unterhalten. Sie werden sich daran bestimmt erinnern.
  Deswegen jetzt nur in ganz allgemeiner Form die Position der Bundesregierung: Wir
  haben immer gesagt ‑ das hat Herr Hille gerade noch einmal unterstrichen ‑, dass
  wir für eine verhandelte Zweistaatenlösung sind. Die Anerkennung der Staatlichkeit
  Palästinas stünde am Ende eines solchen Prozesses, nicht am Anfang eines solchen
  Prozesses. Das ist die Position der Bundesregierung, und das haben wir hier sehr
  häufig betont. Das hat sich nicht geändert. Diese Politik verfolgen wir auch weiterhin.
  Wird der Bundeskanzler aus Anlass des heutigen Tages mit dem israelischen Premier
  telefonieren? Trägt er ihm die Position dann auch so deutlich vor, wie Sie sie hier
  vorgetragen haben? Ich habe jetzt für die Bundesregierung deutlich gemacht, was
  unsere Position ist. Ich habe hier die Worte des Bundeskanzlers zitiert, mit denen
  er sich anlässlich dieses Tages geäußert hat. Das ist schon heute Nacht von uns
  versendet worden. Gehen Sie davon aus, dass diese Position, so wie ich es schon
  auf die vorherige Frage gesagt habe, in allen Kontakten mit Israel eine Rolle spielt.
  Sowohl Herr Hille als auch Herr Giese haben jetzt noch einmal auf der Zweistaatenlösung
  insistiert, auf sie hingewiesen und gesagt, dass das ein wichtiges Ansinnen der
  deutschen Außenpolitik sei. Mehrere Vertreter der israelischen Regierung weisen
  dieses Ansinnen auch schon seit Jahren zurück. Wie geht die Bundesregierung damit
  um, und welche Rückschlüsse zieht man daraus, dass eines dieser zentralen Anliegen
  von dem israelischen Partner mehr oder weniger komplett abgelehnt wird? Wir haben
  hier die Position der Bundesregierung dargestellt. Wir haben über unsere Kontakte
  mit der israelischen Regierung gesprochen. Insofern ist Ihre Frage, denke ich, beantwortet.
  Dann kommen wir zum Kabinett. Wie am Mittwoch üblich hat auch heute das Bundeskabinett
  getagt. Es hat eine ganze Reihe von Beschlüssen getroffen. Um Sie nicht überzustrapazieren,
  habe ich nicht alle mitgebracht, sondern nur die vier wichtigsten. Es gibt gleich
  zwei wichtige Beschlüsse zum Thema des Gewaltschutzes. Das erste Thema war auch
  in den vergangenen Monaten öffentlich sehr präsent. Die Bundesregierung hat nämlich
  heute einen Entwurf eines Gesetzes zur Stärkung des zivilrechtlichen und strafrechtlichen
  Schutzes vor digitaler Gewalt beschlossen. Im Zivilrecht sollen mit dem Gesetz gegen
  digitale Gewalt wirksamere Möglichkeiten geschaffen werden, gegen Verletzungen von
  Persönlichkeitsrechten im Internet vorzugehen. Personen, deren Persönlichkeitsrechte
  im digitalen Raum durch bestimmte strafwürdige Verhaltensweisen verletzt sind, sollen
  vom Diensteanbieter einfacher und weitergehend Auskunft über die Identität der rechtswidrig
  handelnden Nutzer erhalten können. Dadurch können Ansprüche gegen die hinter einem
  Account stehenden Personen besser durchgesetzt werden. Um schwerwiegende Rechtsverletzungen
  zu verhindern oder abzustellen, sieht das Gesetz gegen digitale Gewalt die Möglichkeit
  für richterlich angeordnete Accountsperren vor, also das Versetzen des Kontos in
  einen „read-only“-Modus. Zur effektiveren Beseitigung digitaler Rechtsverletzungen
  sollen Betroffene vor Gericht auch die Entfernung rechtswidriger Inhalte beantragen
  können. Das zweite große Ziel des Gesetzentwurfs ist es, Strafbarkeitslücken bei
  pornografischen Deepfakes und anderen Formen bildbasierter sexualisierter Gewalt
  wie etwa digitalem Voyeurismus zu schließen. Ein neuer Straftatbestand soll das
  unbefugte Herstellen und Verbreiten intimen Bildmaterials umfassend regeln, und
  zwar unabhängig vom konkreten Ort, also unabhängig davon, ob öffentlich oder privat,
  und auch unabhängig davon, ob die Herstellungsform reale oder computergenerierte
  Aufnahmen betrifft. Zudem wird das wiederholte und ständige unbefugte Überwachen
  zum Beispiel des Aufenthaltsortes einer Person mittels GPS-Trackern, das sogenannte
  Cyberstalking, strafrechtlich klarer gefasst. Auch die identitätsmissbrauchende
  Verbreitung von Deepfakes und vergleichbaren Inhalten, die dem Ansehen der anderen
  Person erheblich schaden können, soll künftig ausdrücklich strafbewehrt sein. Die
  Bundesregierung verdeutlicht mit dem Gesetzentwurf, dass sie digitale Gewalt genauso
  ernst nimmt wie körperliche Gewalt. An das Stichwort der körperlichen Gewalt kann
  ich mit dem zweiten Beschluss anschließen. Die Bundesregierung hat nämlich auch
  den Entwurf eines Gesetzes zur Verbesserung des Schutzes von Opfern häuslicher Gewalt
  im familiengerichtlichen Verfahren beschlossen. Ziel ist es, den Schutz von Opfern
  häuslicher Gewalt zu verbessern. Dies soll insbesondere dadurch geschehen, dass
  ein Wahlgerichtsstand eingeführt wird. Das ermöglicht einem gewaltbetroffenen Elternteil
  ‑ in den allermeisten Fällen ist dies die Frau ‑ eine bessere Geheimhaltung des
  aktuellen Aufenthaltsortes. Das Gericht soll nicht aktiv versuchen, die betroffenen
  Personen zu einer einvernehmlichen Lösung zu bewegen, wenn zwischen ihnen ein Gewaltverhältnis
  besteht. Zudem soll ausdrücklich geregelt werden, dass Richterinnen und Richter,
  die ein familienrechtliches Dezernat übernehmen, über Kenntnisse im Gewaltschutzrecht
  und von Dynamiken und Auswirkungen häuslicher Gewalt verfügen. Schließlich wird
  klargestellt, dass in Fällen häuslicher Gewalt eine Scheidung in der Regel bereits
  vor Ablauf des Trennungsjahres möglich ist. Dann kommen wir zu einem ganz anderen
  Thema. Das Bundeskabinett hat sich heute sozusagen mit einem ersten Zwischenstand
  bezüglich des Themas der Staatsmodernisierung befasst. Sie wissen, dass die Staatsmodernisierung
  dieser Bundesregierung ein großes Anliegen ist und hohe Priorität genießt. Der Minister
  für Digitalisierung und Staatsmodernisierung hat den Bericht zum Stand der Staatsmodernisierung
  2026 vorgelegt. Ein Jahr nach dem Beschluss der Modernisierungsagenda Bund gibt
  der heute im Kabinett vorgelegte Bericht einen Überblick über Erfolge, Wirkung und
  Stand der Vorhaben. Insgesamt umfasst die Modernisierungsagenda mehr als 80 einzelne
  Maßnahmen. Im Fokus stehen dabei 23 besonders relevante Hebelprojekte. Bei vielen
  gibt es bereits erhebliche Fortschritte. Als Beispiele will ich nur einige wenige
  nennen, etwa den Bauturbo, der in Kraft getreten ist und für dringend benötigten
  neuen Wohnraum sorgt. Positive Entwicklungen und Entscheidungen sind auch, dass
  man ein Auto mittlerweile digital anmelden kann, dass der digitale Fahrzeugschein
  Realität geworden und auch der digitale Führerschein beschlossen ist. Außerdem können
  Unternehmen künftig wesentlich schneller und unbürokratischer gegründet werden.
  Zudem wird Bürgerinnen und Bürgern der Zugang zum Recht erleichtert, insbesondere
  durch vereinfachte digitale Onlineverfahren für Zivilklagen. Auch im Bereich des
  Bürokratieabbaus wurden zahlreiche Erfolge erzielt. So konnte der sogenannte jährliche
  Erfüllungsaufwand bereits um zehn Milliarden Euro reduziert werden. Erfüllungsaufwand
  sind die Kosten, die entstehen, wenn rechtliche Vorgaben umgesetzt werden müssen.
  Den Staat einfacher, digitaler und handlungsfähiger zu machen, stärkt das Vertrauen
  in die Leistungsfähigkeit des Staates und die Demokratie. Man kann bei diesem Großprojekt
  der Staatsmodernisierung, dessen Federführung beim Ministerium für Staatsmodernisierung
  liegt, das aber die ganze Bundesregierung und alle Ressorts betrifft, von einer
  Art von Leuchtturmprojekt dieser Bundesregierung sprechen. Schließlich haben wir
  einen Beschluss zum Thema von Infrastruktur und Finanzierung gefasst. Wie bekannt
  ist, hat das deutsche Autobahnnetz einen erheblichen Investitionsbedarf. Das gilt
  insbesondere mit Blick auf Brücken, Tunnel und Fahrbahnen. Die Bundesregierung hat
  sich vorgenommen ‑ so hat es die Koalition schon im Koalitionsvertrag festgeschrieben ‑,
  die Finanzierung dieser notwendigen Investitionen langfristig zu sichern. Dafür
  erhält die Autobahn GmbH des Bundes jetzt eine neue Finanzierungsgrundlage. Statt
  der alleinigen Finanzierung aus dem Bundeshaushalt, wie es bisher der Fall ist,
  tragen zukünftig drei Säulen den Investitionsbedarf der Bundesfernstraßen, nämlich
  Mittel aus dem Haushalt, eine Nutzerfinanzierung über die Lkw-Maut und privates
  Kapital. Mit dem neuen Modell sollen Teile der Einnahmen aus der Lkw-Maut ab dem
  Jahr 2028 der Autobahn GmbH zufließen. Diese Einnahmen ermöglichen es der Autobahn
  GmbH ab dem kommenden Jahr, eigenständig Kredite am Markt aufzunehmen. Das Thema
  ist also, sozusagen für die Fachleute, die Kreditfähigkeit der Autobahn GmbH. Diese
  Kreditfähigkeit ermöglicht es, verlässlicher zu bauen, überjährig zu planen und
  umfassender zu sanieren. Dadurch werden auch Aus- und Neubaumaßnahmen realisierbar.
  Möglich werden nun Vorhaben, die ansonsten nicht oder erst zu einem deutlich späteren
  Zeitpunkt möglich wären. Zudem eröffnet die Kreditfähigkeit auch die Möglichkeit,
  Projekte in öffentlich-privater Partnerschaft in größerem Maßstab als bisher umzusetzen.
  Die neue Finanzierungsarchitektur soll sicherstellen, dass die Autobahninfrastruktur
  dauerhaft leistungsfähig bleibt. Ich habe eine Frage an das BMJV bezüglich des Schutzes
  vor digitaler Gewalt. Herr Hosemann, an einigen Stellen, steht die jetzt beschlossene
  Variante doch deutlich in der Nähe von DSA-Regulierungen, also von europäischer
  Rechtsetzung. Inwieweit ist mit der EU-Kommission bereits abgeklärt, dass dabei
  keine unzulässigen Überschneidungen stattfinden? Wann haben Sie die EU-Kommission
  davon in Kenntnis gesetzt, dass Sie beispielsweise hinsichtlich der Löschanordnungsmöglichkeiten
  noch einmal nachgezogen haben? Ich denke, das ist eine Detailfrage, die für das
  breitere Publikum wahrscheinlich eher mittelgut verständlich ist. Deswegen versuche
  ich, es erst noch einmal in den größeren Rahmen einzuordnen. Wie der Regierungssprecher
  bereits ausgeführt hat, hat das Gesetz gegen digitale Gewalt zwei große Teile. Der
  eine Teil, der die Öffentlichkeit in den letzten Monaten eigentlich am meisten interessiert
  hat, ist der strafrechtliche Teil. Darauf bezog sich Ihre Frage ausdrücklich nicht.
  Denn im Bereich des Strafrechts kann der deutsche Gesetzgeber innerhalb der Grenzen
  des Grundgesetzes tun, was er will. Da müssen wir nichts mit der Europäischen Kommission
  abstimmen. Der andere Teil ist das, was immer zivilrechtliche Rechtsdurchsetzung
  genannt wird. Man könnte auch sagen, dass es dabei um Pflichten gegenüber Plattformen
  geht. Natürlich ist Plattformregulierung heutzutage vor allem ein europäisches Thema.
  Sie haben den DSA, das Digitale-Dienste-Gesetz der Europäischen Union, angesprochen,
  das für Plattformen bereits weitreichende abstrakt-generelle Pflichten im Umgang
  mit rechtswidrigen Inhalten regelt. Der Ansatz, daneben noch ein nationales Gesetz
  zu machen, wird dadurch gerechtfertigt, dass wir hier nur von einzelfallbezogenen
  Regelungen sprechen. Das Gesetz gegen digitale Gewalt enthält für Plattformen mit
  Sitz innerhalb der EU, für die es eben auch die europäischen Rechtsakte gibt, keine
  generellen Pflichten zum Umgang mit illegalen Inhalten, sondern immer nur auf einen
  konkreten Fall bezogene. Zum Beispiel wird die viel diskutierte Accountsperre in
  einem konkreten Verfahren wegen eines bestimmten Accounts verhängt, der zum Beispiel
  wiederholt schwerwiegende Persönlichkeitsrechtsverletzungen verbreitet hat und bei
  dem eine Wiederholungsgefahr besteht. Die Bundesregierung ist davon überzeugt, dass
  das anders als das alte NetzDG, das durch die europäischen Regelungen obsolet geworden
  ist, ein Gesetz ist, das wir weiterhin als nationaler Gesetzgeber so erlassen können.
  Wir haben das sorgfältig geprüft. Zu einzelnen Abstimmungen mit der Europäischen
  Kommission, würde ich mich hier, wären sie mir bekannt ‑ das ist aber nicht der
  Fall ‑, nicht äußern. Viele der Dinge, die Sie jetzt regeln, werden europäisch insgesamt
  als problematisch erachtet. Gibt es aus Ihrer Sicht an der Stelle nicht einen Reformbedarf
  eben im europäischen Recht, dass das eben nicht nur national geregelt wird? Die
  Ministerin hat in den vergangenen Monaten ja immer wieder deutlich gemacht, dass
  sie der Überzeugung ist, dass wir hinsichtlich der Plattformregulierung auch auf
  europäischer Ebene weiterkommen müssen und dass wir noch nicht da sind, wo wir sein
  wollen. Das gilt zum einen für die Durchsetzung der bestehenden Regeln. Es wäre
  sehr wünschenswert, dass die bestehenden Regeln eingehalten würden. Daran hat man
  ja hier und da Zweifel. Zum anderen ist eben die Frage, ob sie ausreichend sind.
  In den letzten Monaten ist allerdings auf europäischer Ebene schon viel passiert.
  Im Frühjahr ist dort die massenhafte Verbreitung von sexualisierten Bildern thematisiert
  worden, und da hat man den europäischen Rechtsrahmen dann auch modifiziert. Das
  hat die Ministerin auch begrüßt. Unser Wunsch ist, dass man diesen Schritt der Plattformregulierung
  konsequent weiter beschreitet, und nicht etwa aus falscher Vorsicht im Hinblick
  auf die Interessen der Techkonzerne oder von Regierungen, die sich deren Interessen
  besonders zu eigen machen, davon absieht. Herr Hille, ich habe eine Frage zu einem
  von Ihnen nicht genannten Themen ‑ Sie haben gesagt, Sie nennen nur die vier wichtigsten;
  vielleicht fällt dieses Thema nicht darunter ‑: Gesundheitsminister Linnemann hatte
  angekündigt, heute im Kabinett eine Kommission für die große Pflegereform einzusetzen.
  Sie haben das nicht genannt. Ist diese Kommission eingesetzt worden? Wenn nicht,
  warum nicht? Herr Kollege, das ist Ihnen zutreffend aufgefallen: Das habe ich nicht
  vorgetragen. Es gab dazu heute tatsächlich keinen Beschluss im Kabinett, weil es
  da noch letzten Beratungsbedarf gibt und das nicht mehr vor dieser Kabinettssitzung
  so rund bekommen werden konnte, dass wir das heute im Kabinett beschließen konnten.
  Es geht aber nur noch um letzten Beratungsbedarf, sodass ich davon ausgehe, dass
  wir das dann in der kommenden Woche im Kabinett abschließen werden. Könnten Sie
  bitte erläutern, ob diese letzten Knackpunkte, um die es da geht, möglicherweise
  auch heute Abend beim Koalitionsausschuss eine Rolle spielen werden? Es wird Sie
  nicht wundern, dass ich das natürlich nicht wirklich kann, weil es bis zum Koalitionsausschuss
  ja noch ein bisschen hin ist. Ich kann nur eine Ableitung machen, so Sie mir die
  erlauben: Ich würde denken, dass das in Anbetracht dessen, dass es sehr weit gediehen
  ist und es eher um praktische Dinge geht, keinen großen Raum mehr einnehmen muss.
  Woran hakt es denn jetzt? Liegt es an der personellen Besetzung, wie man aus dem
  parlamentarischen Raum hört? Soll es nächsten Mittwoch einen Kabinettsbeschluss
  geben? Andere sprechen von einem Umlaufbeschluss im Laufe der Woche. Wie ist da
  die Handhabung? Das kann ich Ihnen in der Tat nicht sagen. Beides ist denkbar ‑
  Kabinettsbeschluss nächste Woche oder Umlaufbeschluss, das weiß ich nicht. Fest
  steht, dass wir einen Beschluss dazu treffen werden. Er war nur eben aus praktischen
  Gründen heute nicht möglich. Ob er dann in den nächsten Tagen per Umlaufbeschluss
  oder in der kommenden Woche im Kabinett verabschiedet wird, kann ich jetzt noch
  nicht sagen. Ich glaube aber, wenn wir in einer Woche hier sitzen, dann haben wir
  einen Beschluss, entweder auf dem einen oder auf dem anderen Weg. Sie sagten, es
  gäbe noch Redebedarf. Woran hakt es denn nun konkret? Das sind letzte interne Absprachen,
  die man noch treffen muss. Ich gehe jetzt nicht ins Detail und mache aus den internen
  Absprachen öffentliche; das ist nie hilfreich. Ich bin aber optimistisch, dass wir
  da zeitnah zu einer Lösung kommen. Im Zulauf auf das Kabinett ‑ das ist dann ja
  immer eine harte Deadline ‑ war das heute nicht möglich, aber es wird zu einer guten
  Lösung kommen. Herr Hille, ich versuche es auch noch einmal: Es ist natürlich ein
  Unterschied, ob man nur ein Problem mit der personellen Besetzung hat und noch die
  eine oder andere Persönlichkeit finden muss, oder ob man der SPD-Forderung nachkommt,
  dass es eben keine Denkverbote gibt und dass diese Kommission auch den Deckel und
  einen Risikoausgleich zwischen privater und gesetzlicher Pflegeversicherung prüfen
  muss. Hängt es also an dem ersten Punkt, den Personen, oder hängt es an dem zweiten
  Punkt, also daran, dass man wirklich noch über den Auftrag dieser Kommission reden
  muss? Herr Kollege, Sie stecken wie immer ‑ so kenne ich Sie ‑ tief drin in den
  Themen. Es gibt noch letzten internen Beratungsbedarf. Das ist die Antwort, die
  ich auch auf diese differenziertere Frage gebe, um das, was intern zu klären ist,
  auch intern zu lassen und nicht öffentlich werden zu lassen. Es ist aber überschaubar,
  und ich bin optimistisch, dass wir zeitnah zu einer guten gemeinsamen Lösung finden.
  War die gestrige Festnahme des ehemaligen BND-Chefs August Hanning wegen des Auskundschaftens
  von Staatsgeheimnissen, versuchten Landesverrats und Spionage Thema in der Kabinettssitzung
  oder nicht? Herr Kollege, es stehen erhebliche Vorwürfe im Raum, das ist keine Frage.
  Dieses Verfahren läuft aber, wie das in unserem Staat so üblich ist, beim Bundesgerichtshof
  und bei der Bundesanwaltschaft. Insofern wären Fragen, die das Verfahren betreffen,
  dorthin zu richten. Ich werde mich hier jetzt im Detail nicht weiter zu diesem Sachverhalt
  einlassen. Aber so detailliert war meine Frage gar nicht. Ich habe lediglich gefragt,
  ob dieses für die Sicherheit Deutschlands durchaus existenzielle Thema auch ein
  Thema der heutigen Kabinettssitzung war. Nicht mehr und nicht weniger habe ich Sie
  gefragt. Und ich habe dazu das gesagt, was ich gesagt habe. Ich versuche es einmal
  mit einer detaillierteren Frage an Herrn Hille, und zwar nicht unbedingt bezogen
  nur auf Herrn Hanning, sondern auf den Gesamtsachverhalt. Es ist inzwischen ja mehrfach
  vorgekommen, dass ehemalige Behördenchefs Dinge getan haben, bei denen sich die
  Frage stellte, ob sie ihre ehemalige Position, ich sage einmal, monetarisiert haben.
  Da würde ich gerne wissen: Gibt es seitens der Bundesregierung Überlegungen, diesbezüglich
  in irgendeiner Form weitere Einschränkungen zu treffen, zum Beispiel indem man Kontakte
  von Leitern von Sicherheitsbehörden zu ihren ehemaligen Mitarbeitern und Kollegen
  formal beschränkt? Ich würde hier ‑ möglicherweise kennen Sie das von mir schon ‑
  darauf verweisen, dass wir einen Schritt nach dem anderen gehen. Wir alle haben
  die Ereignisse von gestern verfolgt. Da stehen erhebliche Vorwürfe im Raum. Wie
  gerade gesagt, ist der Generalbundesanwalt dafür zuständig und führt die Ermittlungen.
  Den Verlauf und die Ergebnisse bleibt es abzuwarten, aber natürlich kann ich versichern,
  dass die Bundesregierung diesen Fall ebenso wie der Bundesnachrichtendienst äußerst
  ernst nimmt und die Ermittlungsbehörden selbstverständlich umfassend und uneingeschränkt
  bei der Aufklärung unterstützt. Ihre Fragen beziehen sich auf Dinge, die nach einem
  Abhandeln dieses Verfahrens zu thematisieren sind, wenn man feststellt, dass es
  solche Lücken gibt. Das kann man jetzt sinnvollerweise noch nicht tun. Es gibt ja
  verschiedene Möglichkeiten, den Sachverhalt aufzuklären. Das eine ist das, was der
  Generalbundesanwalt jetzt zuständigkeitshalber macht. Auf der anderen Seite war
  vor knapp drei Monaten war Herr Alijew hier. Deshalb würde ich natürlich schon gerne
  wissen, inwieweit man sich jetzt zum Beispiel auch mit der aserbaidschanischen Seite
  ins Benehmen setzt, um Licht ins Dunkel zu bringen. ‑ Ich weiß nicht, ob Sie das
  sagen können, Herr Hille, oder vielleicht auch Herr Giese. Bevor Herr Giese das
  wahrscheinlich noch besser sagt, kann ich nur noch einmal sagen, wie ernst wir das
  nehmen und dass wir ‑ darauf zielt ja Ihre Frage ab ‑ genauso wie der Bundesnachrichtendienst
  die Ermittlungsbehörden bei der Aufklärung dieses Sachverhaltes selbstverständlich
  umfassend unterstützen und uneingeschränkt bei der Aufklärung mitwirken, wo wir
  das können. Dem würde ich mich jetzt auch nur anschließen. Mich würde von der Bundesregierung
  noch interessieren: Was für eine Bedeutung hätte es, wenn sich die Vorwürfe jetzt
  so bewahrheiten würden? Das ist ein ganz schönes Beispiel für den Unterschied zwischen
  Ihnen, Journalistinnen und Journalisten, und uns, der Bundesregierung: Sie können
  darüber spekulieren, was für eine Bedeutung das möglicherweise hat; wir können und
  werden das nicht tun. Ich kann noch einmal das betonen, was ich gerade gesagt habe:
  Die Vorwürfe, die im Raum stehen, sind erheblich. Wir haben rechtsstaatliche Verfahren,
  um damit umzugehen. Das Verfahren führt der Generalbundesanwalt, und da ist es richtig
  aufgehoben. Dieses Verfahren und dessen Ergebnisse gilt es abzuwarten, um dann genau
  diese Frage, die Sie gestellt haben, bewerten zu können und ‑ um die Brücke zu Herrn
  Kollegen Frage zu schlagen ‑ dann auch mögliche Änderungsbedarfe eruieren zu können.
  Dann frage ich vielleicht noch einmal politisch: Es wurde jetzt schon viel über
  die Geheimdienstreform diskutiert, die jetzt ansteht. Nach dem Bekanntwerden dieses
  Skandals und auch den vorangegangenen Sachen ‑ wir erinnern uns an die Abwege von
  Hans-Georg Maaßen oder die Verschleierung des NSU-Komplexes durch den Verfassungsschutz ‑
  möchte ich fragen: Was für Ableitungen treffen Sie aus all diesen Skandalen, die
  bekannt geworden sind, für die Geheimdienstreform? Glauben Sie, dass es wirklich
  richtig ist, diese Geheimdienste mit noch mehr Machtmitteln auszustatten? Wenn ich
  die Frage richtig verstehe und sie lautet, was für Ableitungen wir aus dem, was
  da jetzt passiert ist, für die Reform der Nachrichtendienste treffen, dann ist die
  Antwort: keine. Ich möchte sehr dafür werben, diese Dinge auseinanderzuhalten: Das
  eine ist ein Sachverhalt mit erheblichen Vorwürfen, die im Raum stehen, den es aufzuarbeiten
  gilt. Das andere ist eine Reform unserer Nachrichtendienste, die dazu dient, sie
  schlagkräftiger und besser zu machen, um die Sicherheit der Menschen in Deutschland
  zu verbessern. Das sind zwei unabhängig voneinander zu betrachtende Sachverhalte,
  und ich bitte darum, diese Sachverhalte auch nicht zu vermischen. Herr Hille, Sie
  sagen, man rede erst über Konsequenzen, wenn der Fall abgeschlossen ist. Das kann
  ja mehrere Jahre lang dauern. Im parlamentarischen Bereich ‑ auch in Ihrer Partei
  bzw. in der CDU ‑ wird aktuell aber schon darüber diskutiert, Karenzregeln und Transparenzregeln
  für Geheimnisträger zu verschärfen. Sehen Sie eine Notwendigkeit, das unabhängig
  davon zu tun, was jetzt bei den Ermittlungen gegen Herrn Hanning herauskommt? Zweite
  Frage: Haben Sie schon Rückmeldungen von ausländischen Partnern? Sehen Sie einen
  Schaden für die internationale Zusammenarbeit auf Geheimdienstebene durch diese
  Vorwürfe? Zum ersten Teil der Frage, Herr Kollege: Wir sitzen hier für die Bundesregierung.
  Das ist ein anderes Verfassungsorgan als der Deutsche Bundestag und nicht der Gesetzgeber.
  Die Gesetze werden im Deutschen Bundestag gemacht. Es ist nicht an mir, zu beurteilen
  oder zu qualifizieren, ob das, was da überlegt wird, richtig ist oder nicht. Das
  muss der Deutsche Bundestag und das müssen die Abgeordneten in ihrer Freiheit entscheiden.
  Wenn sie zu dem Schluss kommen, dass es da Änderungen braucht, dann obliegt es dem
  Gesetzgeber, solche Änderungen vorzunehmen. Die zweite Frage ging aber noch weiter,
  und zwar ins Ausland. Ich habe aber noch eine Anschlussfrage, die ich gerne vorziehen
  würde: Die zuständigen Abgeordneten im Parlamentarischen Kontrollgremium haben tatsächlich
  schon 2023, also vor nicht allzu langer Zeit, entsprechende Forderungen zu einer
  Verschärfung der Transparenz- und Karenzregeln an die Bundesregierung gestellt.
  Passiert ist nichts. Warum nicht? Herr Kollege, das kann ich Ihnen tatsächlich nicht
  sagen, weil ich es nicht weiß. Damit müsste ich mich erst beschäftigen. Und zur
