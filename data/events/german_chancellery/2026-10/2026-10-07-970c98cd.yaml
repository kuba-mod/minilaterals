  Die Informationen waren nach dem, was man weiß, ja solche, die als Material für
  Lageeinschätzungen im Kanzleramt vorgesehen waren. Erwägt der Kanzler bzw. die Bundesregierung
  aufgrund der Tatsache, dass offenbar etwas, was nicht für die Öffentlichkeit oder
  gar andere Dienste bestimmt war, weitergereicht wurde, die Materialanforderung oder
