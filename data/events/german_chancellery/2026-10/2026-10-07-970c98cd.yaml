  keinen Kontakt hatte; denn die aktive Zeit von Herrn Hanning liegt ja schon sehr
  weit zurück, und in dieser Zeit war der Bundeskanzler noch nicht Bundeskanzler.
  Deshalb würde ich davon ausgehen, dass es da keinerlei Kontakt gegeben hat. Aber
