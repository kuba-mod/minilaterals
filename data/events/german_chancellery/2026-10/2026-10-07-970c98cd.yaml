  Informationen ‑ ‑ ‑ Ja, ich kann aber auch, noch einmal, Herr Kollege, bei allem
  Verständnis und auch bei allem Willen bei mir, das beantworten zu wollen, trotzdem
  nur darauf verweisen: All das sind ja Fragen, die gerade geklärt werden müssen.
  Ich habe auch die Presseberichterstattung gelesen. Aber es handelt sich um Vorwürfe,
