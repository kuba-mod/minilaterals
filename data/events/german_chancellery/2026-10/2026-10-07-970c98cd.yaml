  Was machen diverse ‑ ‑ ‑ Genau, die Zuständigen, die machen das, was ich gesagt
  habe: Sie nehmen diesen Sachverhalt sehr ernst. Sie unterstützen die Ermittlungsbehörden
  selbstverständlich umfassend und uneingeschränkt bei der Aufklärung des Sachverhalts.
  Alle anderen Dinge, die dann noch intern laufen, die laufen intern. Das ist das,
  was ich von dieser Stelle aus jetzt dazu sagen kann. Wenn ich es richtig verstehe,
  geht es ja durchaus um einen groben Verstoß gegen die Verschlusssachenanordnung.
  Es geht um grobe Probleme damit, dass man es überhaupt bemerkt hat, dass es eher
  zufällig ist, dass man eben überhaupt dessen gewahr wurde. Hat die Bundesregierung
  ein Problem beim BND mit der Verschlusssachensicherheit? Herr Kollege, auch das
  fällt in die Kategorie, würde ich sagen, kreativer Versuche. Ich kann es nicht beantworten,
  weil es nicht meine Aufgabe ist. Diese Dinge betreffen primär den BND. Das müssten
  Sie bitte den BND fragen. Auf die Frage „hat die Bundesregierung …?“ antworte ich
  „nein“. Die aserbaidschanische Regierung soll sich über den „SPIEGEL“-Artikel beschwert
  haben. Können Sie das bestätigen? Ist so etwas beim AA oder beim Bundeskanzleramt
  angekommen? Ich weiß dazu nichts. Von daher kann ich das nicht bestätigen. Ich würde
  gern noch einmal einen Schritt zurückgehen und eine Lernfrage stellen: Können Sie
  uns mitnehmen und vielleicht erklären, was die Tischvorlagen bzw. die Briefings,
  die der Kanzler oder die Regierung von den Nachrichtendiensten bekommt, für eine
