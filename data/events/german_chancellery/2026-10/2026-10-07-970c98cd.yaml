  etwas möglichst nicht wiederholt? Herr Kollege, ich suche nach einem passenden Vergleich,
  um Ihnen sozusagen ein greifbares Bild zu bringen. Mir fällt aber gerade keins ein.
  Daraus grundsätzliche Dinge abzuleiten und anders zu machen, weil es möglicherweise
  irgendwo zu kriminellen Handlungen gekommen ist, ist jetzt nicht das richtige Herangehen,
  sondern dieser Fehler muss aufgearbeitet und behoben werden. Dann sehen wir weiter.
  Ich würde ganz gern die Frage von Herrn Kollege noch an Frau Singer vom BMI stellen.
  Der stellvertretende PKGr-Vorsitzende erhebt auch schwere Vorwürfe gegen den Innenminister,
  weil sich diese Forderung des PKGr zur Verschärfung von Beamtenrecht und Konsequenzen
  ja an das Innenministerium gerichtet hat, zumal Herr Hanning ja nach seiner Zeit
  beim BND auch noch Staatssekretär im Innenministerium war. Deswegen hätte ich ganz
  gern gewusst: Untersuchen Sie jetzt auch seine Tätigkeit im Innenministerium? Was
  sagen Sie zu dem Vorwurf, dass das Innenministerium schon längst hätte handeln müssen?
  Wir wissen natürlich darüber Bescheid, dass Herr Hanning auch im Innenministerium
  Beamteter Staatssekretär war. Ich muss leider auch wieder auf die Ermittlungen hinweisen,
