  aber es ist selten hilfreich, wenn wir uns an dieser Stelle in Spekulationen stürzen;
  deshalb mache ich das nicht. Herr Hille, angesichts der Informationslage, soweit
  sie bislang bekannt ist: Ist für die Bundesregierung, speziell den Kanzler, die
  Einschätzung, hier tue sich ein Abgrund von Landesverrat auf, eigentlich angemessen
  und zutreffend? Helfen Sie mir noch einmal, wer das gesagt hat. Es war einer der
  Amtsvorgänger, nämlich Konrad Adenauer 1962 in der damaligen „Spiegel“-Affäre, die
  vom Aufarbeitungsstand ähnlich war wie der jetzige Fall. Es hat Durchsuchungen gegeben,
  aber keine gerichtliche Feststellung. Deswegen gibt es da gewisse Parallelen. Herr
