  Ich habe jetzt zu dem Sachverhalt eigentlich schon mehr gesagt, als ich mir vorgenommen
  hatte, und muss Sie deshalb enttäuschen. Ich verweise noch einmal darauf, dass wir
  in unserem Rechtssystem Verfahren für den Umgang mit solchen Dingen haben. Es stehen
  erhebliche Vorwürfe im Raum. Aber es sind Vorwürfe. Es gab auf Basis dieser Vorwürfe
