  Relevanz haben sie? Ja, bitte, oder an jemanden sonst, der es beantworten kann,
  wenn Sie es nicht beantworten können. Bei dem, was in den Medien steht, handelt
  es sich ja mutmaßlich um Lagebewertungen. Das ist ein originäres Geschäft von Nachrichtendiensten
  und der Polizei, die dort ausgewertet werden und analysiert werden. Wie regelmäßig
  gibt es diese Lagebewertungen? In welchem Umfang werden sie dann sozusagen an die
  Regierung gestellt? Darüber kann ich Ihnen keine Auskunft geben. Ich bin mir nicht
  sicher, ob das den sicherheitsrelevanten Fragen unterliegt. Das würde ich noch ergänzen:
  Bei all dem Erkenntnisinteresse, das Sie leitet ‑ das ehrt Sie ‑ bewegen wir uns
  dennoch im Bereich der Nachrichtendienste, in dem auch nicht alles für die Öffentlichkeit
  bestimmt ist, weil es sicherheitsrelevant ist. Das, bitte ich nur, bei all dem,
  was Sie jetzt an Antworten begehren, immer im Hinterkopf zu haben. Herr Hille, ich
  möchte den Kollegen noch unterstützen. Es geht bei der Frage, wenn ich es richtig
  verstanden habe, um die sogenannte ND-Lage im Kanzleramt, in der wöchentlich die
  Chefs der Nachrichtendienste und Geheimdienste über den aktuellen Lagestand berichten.
  Das, was dort auf welcher Ebene, auf welcher Flughöhe, dort berichtet wird, zu erklären,
  wäre wahrscheinlich wirklich nicht sehr falsch und sehr unmöglich und unterliegt
  auch keiner Geheimhaltung, glaube ich. Meine Frage an Frau Singer vom Innenministerium
  ist: Habe ich Sie richtig verstanden? Obwohl beide jetzt Verdächtigen im Innenministerium
  gearbeitet haben, wird nicht im Innenministerium geschaut, ob es dort auch irgendwelche
