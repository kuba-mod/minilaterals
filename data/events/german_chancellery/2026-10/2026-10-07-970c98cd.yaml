  das kann man jetzt nicht spekulativ von diesem Stuhl aus tun. Dann haben Sie die
  Frage falsch verstanden. Die Frage war nämlich, ob es schon Äußerungen von ausländischen
  Partnern gibt. Das, was Sie sagen, kann ich auch nachvollziehen, aber die Frage
  ist ja: Haben sich schon Leute von Partnerdiensten gemeldet, die sagen: Was ist
