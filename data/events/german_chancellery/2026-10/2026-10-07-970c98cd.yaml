  Zusammenarbeit in Strafsachen; das ist nicht die Aufgabe des Auswärtigen Amtes.
  Auch das, was die Übermittlung von geheimdienstlichen Informationen betrifft, würde
  ich als außerhalb der Zuständigkeit des Auswärtigen Amtes sehen. Welchen Kontakt
  hatte der Bundeskanzler mit Herrn Hanning in den letzten Monaten oder auch vielleicht
