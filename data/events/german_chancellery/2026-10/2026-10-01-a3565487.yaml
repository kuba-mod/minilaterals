title: Bundeskanzler Merz gratuliert dem Ministerpräsidenten der Republik Kosovo,
  Albin Kurti
text: Sehr geehrter Herr Ministerpräsident, zu Ihrer Wiederwahl zum Ministerpräsidenten
  der Republik Kosovo gratuliere ich Ihnen herzlich. Hinter Kosovo liegen Monate der
  politischen Unsicherheit, die dem Land viel abverlangt haben. Die Bestätigung Ihrer
  Wahl birgt die Chance, über Parteigrenzen hinweg Brücken zu bauen, offene institutionelle
  Fragen zu lösen und Reformen voranzubringen. Essenziell bleiben auch substanzielle
  Fortschritte im EU-geführten Normalisierungsdialog mit Serbien. Deutschland steht
  weiter fest an der Seite Kosovos. Wir sind den Menschen des Kosovo in besonderer
  Freundschaft verbunden. Für Ihre Amtsführung wünsche ich Ihnen weiterhin viel Erfolg.
  Mit freundlichen Grüßen Friedrich Merz Bundeskanzler der Bundesrepublik Deutschland
