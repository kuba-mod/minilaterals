title: Bundeskanzler Merz telefoniert mit dem Kronprinzen und Premierminister von
  Saudi-Arabien, Mohammed bin Salman Al Saud
text: Bundeskanzler Merz hat heute mit dem saudi-arabischen Kronprinzen Mohammed bin
  Salman telefoniert. Gegenstand der Gespräche waren die Angriffe der Huthis, unter
  anderem auf den Flughafen Riad, die Lage im Nahen und Mittleren Osten und die Auswirkungen
  auf die Energiepreise in Deutschland. Die terroristischen Angriffe der von Iran
  unterstützen Huthis verurteilte der Bundeskanzler auf das Schärfste. Der Bundeskanzler
  und der Kronprinz waren sich einig, dass diese Angriffe sofort aufhören müssen.
  Die Seeblockaden durch den Iran und die Huthis in der Straße von Hormus und am Bab
  al-Mandab müssen sofort enden. Iran muss endlich ernsthaft verhandeln und aufhören,
  die Region zu destabilisieren. Gleichzeitig muss er die Straße von Hormus dauerhaft
  und ohne Einschränkungen öffnen und sein militärisches Nuklearprogramm einstellen.
  Der Bundeskanzler und der Kronprinz berieten über Möglichkeiten, wie der Konflikt
  beendet und die Energiepreise stabilisiert werden können.
