date: '2026-10-27'
type: press_release
source_name: german_chancellery
title: Pressestatement von Bundeskanzler Merz anlässlich seiner Besuche in der Republik
  Singapur, Japan und der Republik Korea Europa und Asien sollen wirtschaftliche Zusammenarbeit
  vertiefen
text: 'Europa sollte eng mit Ländern wie Japan, Singapur und Südkorea zusammenarbeiten,
  um globale Ungleichgewichte auszugleichen, forderte Bundeskanzler Merz. Bei seinem
  Besuch in Tokio sprach Bundeskanzler Friedrich Merz über gemeinsame Interessen und
  die Bedeutung engerer Partnerschaften zwischen Europa und Asien. Deutschland und
  Japan wollen ihre Zusammenarbeit vertiefen, um ihre Wirtschaft zu stärken und sich
  gegen globale Risiken abzusichern. Bei seinem Besuch in Tokio standen auch globale
  Handelsungleichgewichte im Mittelpunkt sowie die Frage, wie sich Deutschland, Japan
  und weitere Partner gemeinsam gegen Zölle und Handelsbeschränkungen behaupten können.
  (Die Protokollierung des fremdsprachlichen Teils erfolgte anhand der Simultandolmetschung.)
  Ich grüße Sie alle noch einmal sehr herzlich. Schön, dass Sie alle dabei sind! –
  Die Ministerpräsidentin und ich haben ein sehr gutes Abendessen und ein sehr gutes
  Treffen gehabt. Wir haben intensiv über die Zusammenarbeit zwischen Deutschland
  und Japan gesprochen. Das sind ja zwei Länder, die schon über viele Jahrzehnte hinweg
  sehr erfolgreich zusammenarbeiten. Es gibt zwei Themen, die uns momentan besonders
  beschäftigen: Das erste Thema ist im umfassenden Sinne die Sicherheit unserer Länder,
  und zwar nicht die militärische Sicherheit, sondern auch die Versorgungssicherheit
  und die Rohstoffsicherheit. Diesbezüglich haben wir einige Verabredungen miteinander
  getroffen, wie wir in Zukunft zusammenarbeiten wollen und wie wir unsere Arbeit
  auch vertiefen wollen. Das zweite Thema sind die globalen Ungleichgewichte. Japan
  ist in einer vergleichbaren Situation wie wir Europäer, was die Exportmärkte und
  die Abhängigkeiten vom Export betrifft. Ich bin immer wieder auf den Industrial
  Accelerator Act angesprochen worden, den wir in der Europäischen Union gerade diskutieren.
  Es war auffallend, wie häufig ich darauf angesprochen worden bin – auch schon in
  Singapur, aber heute in Tokyo noch einmal sehr viel intensiver. Es geht ganz offensichtlich
  die Sorge um, dass wir mit dem, was wir mit „ Buy European “ meinen, in eine Phase
  des Protektionismus einsteigen. Ich habe die Bedenken hoffentlich zerstreuen und
  vermitteln können, dass dies nur im Zusammenhang mit der Autoindustrie gilt und
  dass wir das auch nur für die öffentliche Beschaffung so sehen. Das werden wir aber
  noch einmal besprechen müssen. Was das Thema globale Ungleichgewichte betrifft,
  sind wir uns insgesamt einig, dass Länder wie diejenigen, die ich auf dieser Reise
  besuche – gestern Singapur, heute Japan, morgen Südkorea –, und die Europäer enger
  zusammenarbeiten müssen, um solche globalen Ungleichgewichte auszugleichen. Mein
  Vorschlag, dass wir die handelspolitischen Partnerschaften so multilateralisieren,
  dass wir auch mit den Ländern, mit denen wir sehr unterschiedliche Abkommen haben,
  enger zusammenarbeiten, um uns zum Beispiel gegen Zölle oder andere Marktbeschränkungen
  zur Wehr zu setzen, findet großen Zuspruch. Ich weiß allerdings auch, dass wir bis
  dahin noch sehr viel Arbeit vor uns haben. Es stellt sich auch die Frage, ob wir
  die Gespräche über ein gemeinsames Handelsabkommen zwischen den ASEAN -Staaten und
  der Europäischen Union wieder aufnehmen sollten. Diese Diskussion ist sehr intensiv
  geführt worden, und dafür bin ich dankbar; denn wir treffen in diesen drei Ländern –
  gestern Singapur, heute Japan, morgen Südkorea – doch auf sehr viele Gemeinsamkeiten,
  was die Sicht hierauf betrifft. Insofern ist dies ein Besuch zum richtigen Zeitpunkt
  in die richtigen drei Länder. Es wird auch sehr intensiv wahrgenommen, dass ich
  jetzt genau diese drei Länder in dieser Reihenfolge – ohne Rangfolge – besuche.
  Insofern kann ich nur sagen: Es hat sich bis jetzt sehr gelohnt, miteinander über
  diese Themen zu sprechen. Gerade Deutschland wird als ein ganz wichtiger Partner
  angesehen, auch im Hinblick auf seine starke Stellung in der Europäischen Union.
  Mit Deutschland wird im Grunde der Zugang zu Europa verbunden, und ich habe immer
  wieder auch auf unsere europäischen Interessen und auf die Zusammenarbeit – die
  handelspolitische Zusammenarbeit – in Europa hingewiesen. Das wird hier sehr aufmerksam
  wahrgenommen und wird auch sehr positiv begleitet. Insofern kann ich nur noch einmal
  sagen: Es lohnt sich, diese Gespräche zu führen. Ich habe es so zum Ausdruck gebracht –
  auch gerade gegenüber der Ministerpräsidentin noch einmal –: Auch wenn wir geografisch
  viele tausend Kilometer auseinanderliegen, sind wir doch in vielerlei Hinsicht wirklich
  Nachbarn. Insofern ist das heute ein guter Besuch in Japan, und ich gehe davon aus,
  dass das auch morgen und übermorgen in Südkorea nicht anders sein wird. Frage: Herr
  Bundeskanzler, können Sie vielleicht auch sagen, was Sie über diese Treffen gelernt
  haben bzw. was Deutschland von Japan lernen kann und umgekehrt? Welche Rolle hat
  das Thema der Ukraine und der Patriots gespielt? Bundeskanzler Merz: Vielen Dank
  für die Fragen. – In der Tat haben wir auch über die Ukraine gesprochen. Japan hat
  sich von Anfang an sehr stark engagiert. Ich habe Ministerpräsidentin Takaichi auch
  gebeten, noch einmal darüber nachzudenken, ob wir die Ukraine nicht vielleicht noch
  ein bisschen intensiver bei der Luftabwehr unterstützen können. Das ist im Augenblick
  für alle Beteiligten schwierig, weil die Vorräte ausgehen. Wir haben aber auch über
  die finanzielle Unterstützung für das nächste Jahr gesprochen. Die Haushaltsberatungen
  für das nächste Jahr sind auch hier noch nicht abgeschlossen. Insofern sind wir
  auf viel Verständnis gestoßen, und es gibt ein ganz klares politisches Commitment
  des Landes, die Ukraine weiter in diesem Krieg zu unterstützen; denn Japan liegt
  sozusagen auf der östlichen Seite von Russland und hat ein sicheres Gespür dafür,
  was es bedeutet, wenn auf der von hier gesehen westlichen Seite Russlands ein solcher
  Krieg tobt. Was das Thema voneinander Lernen betrifft: Wir haben doch eine ganze
  Menge von gemeinsamen Interessen und Übereinstimmungen, was zum Beispiel die Industrie
  betrifft. Japan hat ein Ausbildungssystem, das dem deutschen System ähnlich ist –
  nicht identisch, aber ähnlich. Ich habe in meiner Tischrede gesagt: Deutsche Ingenieurskunst
  und japanische Präzision passen wirklich sehr gut zusammen. Das ist sehr dankbar
  aufgenommen worden. Japan hat wahrscheinlich aufgrund seiner geografischen Lage
  früher damit begonnen, zum Beispiel Rohstoffsicherheit zum Thema zu machen. Das
  ist in Japan früher als Problem gesehen worden als in Europa. Umso wichtiger ist
  jetzt, dass wir hier zusammenarbeiten und zum Beispiel beim Thema des Recyclings
  von Rohstoffen versuchen, unsere technologischen Kompetenzen zu bündeln. Insofern
  ist das wirklich ein Geben und Nehmen auf beiden Seiten. Frage: Zum Stichwort Rüstungszusammenarbeit:
  Beim GCAP -Projekt sind schon relativ viele Sachen schon fixiert, etwa wenn es darum
  geht, wer was machen kann. Sehen Sie den politischen Willen, dass man das noch einmal
  aufdröselt, um Deutschland da noch besser hineinzubringen? Es gibt in beiden Ländern
  eine starke Friedensbewegung, die gar nicht so begeistert von diesen Sachen ist.
  Ist das ein Thema gewesen? Bundeskanzler Merz: Das Letzte war kein Thema. Ich weiß,
  dass es das in Japan genauso gibt wie auch in Deutschland und in Europa. Aber so,
  wie ich es wahrnehme und auch in der Vorbereitung gelesen habe, gibt es in der japanischen
  Bevölkerung auch eine große Zustimmung zu dem Kurs der Regierung, die eigene Verteidigungsfähigkeit
  zu stärken. Inwieweit wir bei einem gemeinsamen Projekt eines Kampfflugzeuges zusammenkommen,
  ist offen. Ich habe heute Abend angesprochen, dass wir noch einmal prüfen, ob Deutschland
  bei dem GCAP -Projekt einen Platz einnehmen und ob Europa dabei stärker engagiert
  sein kann. Das muss geprüft werden. Die Industrieanteile sind zum Teil schon weit
  fortgeschritten diskutiert. Aber wir prüfen im Augenblick alle Optionen. Denn ich
  möchte nicht sehen, dass wir überall wieder von vorn anfangen. Wir müssen zusehen,
  dass wir die Zahl der Systeme reduzieren, dass wir die Komplexität in den Systemen
  reduzieren und dass wir vor allen Dingen die Stückzahlen nach oben bringen. Das
  geht nur dann, wenn wir gemeinsame Projekte auf den Weg bringen. Ob dieses eines
  sein könnte, weiß ich nicht. Aber wir haben verabredet, dass sich die Verteidigungsminister
  in sehr kurzer Zeit zusammensetzen und es einfach einmal besprechen. Japan möchte
  bis zum Beginn des neuen Jahres eine Entscheidung haben. Dass es so schnell gehen
  wird, kann ich aus deutscher Sicht nicht zusagen. Aber wir haben jedenfalls verabredet,
  dass wir sehr schnell an die Arbeit gehen und prüfen, ob es im Hinblick auf ein
  solches Flugzeug eine gemeinsame Strategie geben könnte. Bundeskanzler Merz: Die
  Reise des Bundespräsidenten nach China ist abgestimmt gewesen. Alle meine Gesprächspartner
  wissen, dass das im Vorfeld genau so abgestimmt war. Dass wir keine Gegensätze haben,
  sondern eine gemeinsame politische Haltung vertreten, auch das ist meinen Gesprächspartnern
  klar gewesen. Es gibt überhaupt keine Besorgnis, dass wir hier etwa mit unterschiedlicher
  Stimme sprechen würden. Das ist nicht der Fall. Frage: Herr Merz, Sie haben in der
  ersten Pressekonferenz die Regierungskonsultationen 2027 und die Partnerschaft Japans
  mit der Hannover Messe 2028 angesprochen. Wie sehen Sie die Zukunft der deutsch-japanischen
  Beziehungen? Was wollen Sie dann in Deutschland mit der japanischen Premierministerin
  ansprechen? Bundeskanzler Merz: Ich kann den deutsch-japanischen Regierungskonsultationen
  im nächsten Jahr natürlich nicht vorgreifen. Wir wollen sie jetzt wieder aufnehmen.
  Das letzte Mal, dass sie stattgefunden haben, war meiner Erinnerung nach im Jahr
  2023. Jetzt ist Deutschland der nächste Gastgeber. Das heißt, wir haben die Einladung
  ausgesprochen, die Regierungskonsultationen wieder stattfinden zu lassen. Im Jahr
  darauf, 2028, wird Japan in der Abfolge der vereinbarten Partnerschaften das Partnerland
  für die Hannover Messe sein. Ich habe der Ministerpräsidentin gesagt, dass das eine
  sehr große Chance ist, in sehr kurzer Abfolge nach meinem Besuch durch den Regierungsbesuch
  im nächsten Jahr und die gemeinsame Eröffnung der Messe in Hannover im Jahre darauf
  sozusagen noch einmal zu demonstrieren, wie stark Deutschland und Japan auch in
  Industriefragen zusammenarbeiten. Diesbezüglich begegnen sich unsere Interessen.
  Japan ist ein sehr erfolgreiches Industrieland. Deutschland ist ein erfolgreiches
  Industrieland. Wir haben viele Gemeinsamkeiten. Im Übrigen gibt es auch sehr viele
  Unternehmen, die auf beiden Seiten tätig sind. An der deutsch-japanischen Wirtschaftskonferenz
  heute haben über 300 Industrievertreter aus Deutschland teilgenommen. Es hat auch
  ein großes Interesse daran gegeben, mich auf der Reise zu begleiten. Ich habe ja
  eine ganze Reihe von Unternehmensvertretern dabei. Insofern ist das, denke ich,
  eine große Chance, dass wir die Zusammenarbeit noch einmal deutlich vertiefen und
  dafür sorgen, dass wir unsere gemeinsamen Interessen auch wahrnehmen. Frage: Sie
  haben heute eine politische Allianz für den regelbasierten Welthandel angesprochen.
  Kann man das auch als eine Art von Allianz gegen Donald Trump verstehen, oder was
  schwebt Ihnen vor? Inwiefern soll das nicht die WTO ergänzen? … (ohne Mikrofon,
  akustisch unverständlich) Bundeskanzler Merz: Ich habe zur WTO ja etwas gesagt.
  Ich habe es auch in meiner Rede angesprochen. Es gibt seit geraumer Zeit – das hat
  schon vor der Zeit der ersten Trump-Regierung begonnen – Probleme in der Nachbesetzung
  der sogenannten Streitschlichtungsmechanismen der WTO . Die Nachbesetzung der Richter
  ist dort seit vielen Jahren nicht mehr so erfolgt, wie sie eigentlichen erfolgen
  sollte. Deswegen fehlt in der WTO die Berufungsinstanz. Mein Vorschlag war: Wir
  als WTO -Mitglieder erkennen den ersten Spruch an und verzichten sozusagen auf eine
  Berufungsinstanz innerhalb der WTO , damit wir die Funktionsfähigkeit der WTO als
  solches nicht durch diejenigen infrage stellen lassen, die zum Beispiel seit vielen
  Jahren die Nachbesetzung des Streitschlichtungsmechanismus verweigern. – Das ist
  gegen niemanden individuell gerichtet. Es war nur ein Plädoyer dafür, die Regeln
  der Welthandelsorganisation zu erhalten und die Mechanismen der WTO , wenn sie auch
  eingeschränkt sind, weiterhin zu nutzen, um in der Handelspolitik Streitigkeiten
  beizulegen. Diesen Vorschlag habe ich schon verschiedentlich diskutiert, auch in
  Berlin, und ich habe ihn heute in Japan gemacht. Weit über 70 Prozent des globalen
  Handels erfolgen immer noch WTO -konform. Es ist nicht etwa so, als wäre der globale
  Handel vollkommen zusammengebrochen und funktionierte jetzt nicht mehr nach Regeln,
  sondern über 70 Prozent des globalen Handels erfolgen immer noch über die WTO .
  Übrigens sind 80 Prozent des globalen Handels Seehandel. Insofern war auch der Besuch
  in Singapur gestern wichtig. Singapur ist ja ein relativ kleines Land, aber eine
  der wichtigsten, wenn nicht gar die wichtigste Drehscheibe im gesamten Bereich des
  Südostens. Wenn wir das WTO -konform machen, dann haben wir eine Institution geschützt,
  die uns alle in den letzten Jahren und Jahrzehnten einen großen Dienst erwiesen
  hat. Deswegen möchte ich das mit den Ländern diskutieren, die so wie wir ein Interesse
  daran haben, am regelbasierten Handel festzuhalten. Am regelbasierten Handel festzuhalten,
  heißt, die WTO zu schützen und sie nicht infrage zu stellen. Vielen Dank und einen
  schönen Ausklang des Abends! Wir sehen uns wahrscheinlich morgen und übermorgen
  noch einmal. Vielen Dank!'
