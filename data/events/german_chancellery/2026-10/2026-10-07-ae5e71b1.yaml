title: Im Kabinett beschlossen Digitaler, Einfacher, Moderner – Bericht zum Stand
  der Staatsmodernisierung
text: 'Viele alltäglichen verwaltungstechnischen Abläufe sind bereits digital möglich
  – damit werden Bürgerinnen und Bürger, Verwaltung und Unternehmen entlastet. Bürgerinnen
  und Bürger den Alltag vereinfachen, Unternehmen entlasten und die Verwaltung zukunftsfest
  machen: Diese Ziele haben für die Bundesregierung eine hohe Priorität. Dabei ist
  die Modernisierung des Staates kein Selbstzweck. Sie dient vielmehr der Stärkung
  des Vertrauens in die Funktionsfähigkeit des Landes und seiner Institutionen – und
  schlussendlich auch in die Demokratie. Nur wenn der Staat seine Handlungsfähigkeit
  belegt, ist er für Bürgerinnen und Bürger verlässlich. Der Jahresbericht zum Stand
  der Staatsmodernisierung zeigt die aktuellen Fortschritte. Ein Jahr nach Beschluss
  der Modernisierungsagenda Bund Anfang Oktober 2025 hat sich das Kabinett mit dem
  Jahresbericht zur Staatsmodernisierung beschäftigt. Er gibt einen Überblick über
  Erfolge, Wirkung und den Stand der Vorhaben. Dr. Karsten Wildberger, Bundesminister
  für Digitales und Staatsmodernisierung: „Entscheidend ist am Ende nur eines: Dass
  unsere Versprechen im Alltag der Menschen und Betriebe auch spürbar ankommen. Wir
  haben vieles auf den Weg gebracht, umgesetzt, und die ersten Erfolge unserer Modernisierungsagenda
  sind heute sichtbar. Aber das ist erst der Anfang. Wir müssen weiter strikt Kurs
  halten und das Tempo hochhalten, damit Deutschland jeden Tag ein Stück einfacher
  wird.“ Die Modernisierungsagenda Bund enthält mehr als 80 Maßnahmen, davon auch
  die 23 sogenannten Hebelprojekte mit besonders großer Wirkung bei Bürgerinnen und
  Bürgern, Unternehmen und der Verwaltung. Die Bundesregierung setzt sich damit seit
  Amtsantritt mit zahlreichen Maßnahmen und Initiativen für einen effektiveren Staat
  und weniger Bürokratie ein. Der nun vorgelegte Bericht zum Stand der Staatsmodernisierung
  zieht eine erste positive Bilanz. Das eigene Auto kann schnell und bequem vom heimischen
  Sofa aus angemeldet werden. Der Bau-Turbo trägt zu mehr Tempo im Wohnungsbau bei
  und schafft mehr bezahlbaren Wohnraum. Unternehmen können künftig wesentlich schneller
  und unbürokratischer gegründet werden. In Zahlen: F ünf der 23 Hebelprojekte sind
  bereits abgeschlossen, alle übrigen in der Umsetzung. Von den insgesamt 80 Maßnahmen
  der Modernisierungsagenda sind 62 in Umsetzung, sieben bereits abgeschlossen und
  elf in Vorbereitung. Im Bereich Bürokratierückbau konnte die Bundesregierung den
  sogenannten jährlichen Erfüllungsaufwand um mehr als zehn Milliarden Euro reduzieren.
  Darunter versteht man die Kosten, die entstehen, wenn rechtliche Vorgaben umgesetzt
  werden. Bauen wird mit dem Bau-Turbo nicht nur schneller, sondern auch bezahlbarer.
  Für bestimmte Wohnbauvorhaben kann beispielsweise vom Planungsrecht abgewichen werden,
  sofern die Gemeinde zustimmt. Wohnbauvorhaben können von einer Reihe von Auflagen
  befreit werden: Beispielsweise kann die Bebauungsplanfestsetzung wegfallen und Gemeinden
  dürfen von Regelungen zum Lärmschutz abweichen. Für Bürgerinnen, Bürger und Unternehmen
  bedeutet das schnellere Verfahren, weniger Aufwand und bessere Voraussetzungen für
  kostengünstigeres Bauen. Fahrzeugdokumente und Führerschein sollen künftig digital
  zur Verfügung stehen und müssen nicht mehr mitgeführt werden. Beide Dokumente sollen
  künftig auch EU -weit über die digitale „ d-you“ -Brieftasche ( EUDI ‑ Wallet )
  genutzt werden können. Dies ist ein wichtiger Beitrag zu einer modernen, effizienten
  und europaweit vernetzten Verwaltung. Verfahrensabläufe vor den Zivilgerichten werden
  beschleunigt und effizienter gestaltet. In der Zivilgerichtsbarkeit wird ein neues,
  einfaches, barrierefreies und digital geführtes Online -Verfahren erprobt: In der
  Regel soll das gesamte Verfahren von zu Hause aus durchgeführt werden können – von
  der online erstellten Klageschrift, über den digitalen Schriftwechsel hinweg bis
  hin zur Zustellung der Entscheidung an die elektronischen Postfächer der Verfahrensbeteiligten.
  Für Bürgerinnen, Bürger und Unternehmen bedeutet das niedrigere Zugangshürden zum
  Recht, geringere Gebühren, schnellere Entscheidungen und eine nutzerfreundliche
  Online -Kommunikation. Wer ein Einzelunternehmen gründet, soll die Angaben für die
  Gewerbeanmeldung und die steuerliche Erfassung in einem gemeinsamen digitalen Prozess
  umsetzen können. „G24 – Gemeinsam Schneller Gründen“ ist als gemeinsames Bund-Länder-Projekt
  aufgesetzt. Bund und Länder bearbeiten Recht, Vollzug und Digitalisierung gemeinsam.
  Das zentrale Portal www.gruenden.gov.de führt durch beide Verfahren und vermeidet
  doppelte Eingaben. Ziel ist es, Familien gut auffindbare, niedrigschwellige Online
  ‑ Services mit einheitlicher Qualit ä t und verbesserter Nutzererfahrung anzubieten,
  die im Alltag schnell und konkret helfen. Daf ü r werden die unterschiedlichen Angebote
  besser aufeinander abgestimmt und entlang eines einheitlichen Servicestandards weiterentwickelt.
  Bei der Staatsmodernisierung ziehen Bund, Länder und Gemeinden an einem Strang.
  Im Dezember 2025 haben sich Bund und Länder auf die Föderale Modernisierungsagenda
  verständigt. Sie enthält mehr als 200 konkrete und mit Fristen hinterlegte Maßnahmen
  für weniger Bürokratie, schnellere Verfahren, leistungsfähige Strukturen, digitale
  Services und eine bessere Rechtsetzung sowohl auf Bundes- als auch auf der Landesebene.
  Auch hier gibt es bereits zahlreiche Erfolge. Dazu gehört beispielsweise das antragslose
  Kindergeld ab 2027, zudem kann der Wohnsitz künftig überall in Deutschland elektronisch
  angemeldet werden. Bund und Länder arbeiten auch eng beim Pakt für Planungs-, Genehmigungs-
  und Umsetzungsbeschleunigung zusammen. Er wurde im November 2022 beschlossen. Wichtige
  Fortschritte sind beispielsweise der schnellere Ausbau von Glasfaser-, Mobilfunk-
  und Stromübertragungsnetzen sowie generell schnellere Planungs- und Genehmigungsverfahren. Durch
  das Infrastruktur-Zukunftsgesetz werden künftig viele Bauprojekte im Verkehrsbereich
  prioritär behandelt. Staatsmodernisierung ist eine langfristige Aufgabe, die die
  Bundesregierung entschlossen angegangen ist – und die dauerhaft fortgesetzt und
  aus der gelernt wird . Konkret plant die Bundesregierung weitere wichtige Gesetzesvorhaben,
  die den Bürokratierückbau erheblich voranbringen. Dazu zählt das Berichtsentlastungsgesetz,
  das heißt die Abschaffung von Berichts- und Dokumentationspflichten. Vorgesehen
  ist eine sogenannte Beweislastumkehr: Es muss nicht mehr begründet werden, wenn
  man Bürokratie abschaffen, sondern wenn man sie beibehalten will. Eine weitere Erleichterung
  ist die sogenannte Genehmigungsfiktion. Das bedeutet: Entscheidet eine Behörde künftig
  in bestimmten Fällen nicht innerhalb einer festgelegten Frist, gilt ein Antrag als
  genehmigt. Nicht Unternehmen müssen auf die Verwaltung warten, sondern der Staat
  muss liefern. Auch das Bauen soll einfacher, günstiger und schneller werden. Dafür
  soll das Bauvertragsrecht durch den Gebäudetyp E angepasst werden.'
