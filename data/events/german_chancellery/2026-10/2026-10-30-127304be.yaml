title: 'Staatsminister Weimer fördert Kampnagel-Umbau mit bis zu 60 Millionen Euro:
  „Was in Kampnagel passiert, ist wirklich Weltklasse“'
text: 'Kulturstaatsminister Wolfram Weimer nahm heute am offiziellen Spatenstich für
  die Erweiterung und Sanierung des Internationalen Produktionshauses Kampnagel in
  Hamburg teil. BKM unterstützt die Baumaßnahmen mit bis zu 60 Millionen Euro Fördermitteln.
  Kulturstaatsminister Weimer: „Kampnagel ist das größte Zuwendungsbauvorhaben meines
  Hauses dieses Jahr. Und das ist auch besonders verdient, denn dieser Ort hat über
  viele Jahre hinweg Herausragendes geleistet, aus einer Haltung der Widerständigkeit
  heraus, auch gegen die Politik. Dadurch ist große Kunst entstanden. Kampnagel ist
  weitaus mehr als ein Leuchtturm der freien und kulturellen Szene. Was hier passiert,
  ist wirklich Weltklasse. Deshalb freue ich mich sehr, dass BKM dieses wichtige Vorhaben
  mit 60 Millionen Euro unterstützt und das Bauvorhaben nun startet.“ In Zusammenarbeit
  mit dem Pariser Architekturbüro Lacaton & Vassal sollen die Maschinenfabrikhallen
  umfangreich modernisiert, erweitert und an steigende Bedarfe angepasst werden. Die
  Baumaßnahmen sollen bei laufendem Spielbetrieb umgesetzt werden. Geplant ist der
  Umbau als künstlerisch begleitete „performative Baustelle“. Die Gesamtkosten der
  Sanierung und Erweiterung betragen rund 168 Millionen Euro, finanziert vom Bund
  gemeinsam mit der Freien und Hansestadt Hamburg. Die Kulturfabrik Kampnagel ist
  ein weltweit bekanntes internationales Produktionshaus. Neben zeitgenössischen darstellenden
  Künsten präsentiert es Konzerte, Konferenzen und eine Vielzahl unterschiedlicher
  Festivals. Das Programm bildet ein breites Spektrum an wegweisenden Tendenzen in
  Theater, Tanz und Performance sowie Musik, Bildender Kunst und Architektur ab. Die
  Stärkung der kulturellen Infrastruktur zählt zu den zentralen Anliegen der Bundesregierung.
  Mit nachhaltigen Investitionen unterstützt der Bund kulturelle Einrichtungen und
  Kulturdenkmäler von nationaler Bedeutung. Viele dieser Orte prägen seit Jahrhunderten
  das Erscheinungsbild ihrer Regionen und sind zugleich wichtige Anziehungspunkte
  für Bildung und Tourismus. Hier finden Sie weitere Informationen zu den Kulturbauten
  .'
