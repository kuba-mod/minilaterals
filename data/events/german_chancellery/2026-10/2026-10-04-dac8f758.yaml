date: '2026-10-04'
type: press_release
source_name: german_chancellery
title: Rede von Bundeskanzler Friedrich Merz anlässlich des 65. Jubiläums des deutsch-türkischen
  Anwerbeabkommens Eine deutsch-türkische Erfolgsgeschichte
text: 'Die türkischen Gastarbeiterinnen und Gastarbeiter haben das kulturelle Gesicht
  der Bundesrepublik tiefgreifend mitgestaltet, sagte der Bundeskanzler beim Festakt.
  Bundeskanzler Merz würdigte in seiner Rede beim Festakt zum 65. Jubiläum des Anwerbeabkommens
  mit der Türkei die Menschen, die als sogenannte Gastarbeiterinnen und Gastarbeiter
  in Deutschland ihre neue Heimat gefunden haben. „Aus den „Gastarbeitern“ wurden
  nach und nach Einwanderer. Und irgendwann: Deutsche“, sagte er. Sie hätten die industrielle
  Substanz Deutschlands mit aufgebaut und oft mit außerordentlichem Fleiß zum Wohlstand
  des Landes beigetragen. Genauso hätten sie auch das kulturelle Gesicht der Bundesrepublik
  tiefgreifend mitgestaltet – und prägten es bis heute, sagte der Bundeskanzler. Die
  Geschichte der sogenannten Gastarbeiterinnen und Gastarbeiter sei als Beispiel einer
  gelungenen Integration zu verstehen. Beide Seiten hätten dazu beigetragen. Integration
  schaffe man nur durch gemeinsame Anstrengung. Arbeitsplatz, Klassenzimmer, Sportverein
  seien heute immer noch die Orte der Integration, auch wenn heute Integration staatlicherseits
  mit organisiert und auch eingefordert würde. Nach dem Ende des Zweiten Weltkriegs
  gibt es in Deutschland einen großen Wirtschaftsaufschwung. Der Bedarf an Arbeitskräften
  ist hoch. Die Türkei erlebt im gleichen Zeitraum eine schwere Wirtschaftskrise.
  Am 30. Oktober 1961 unterzeichnen die beiden Länder deshalb das deutsch-türkische
  Anwerbeabkommen. Im November 1961 kommen 55 türkische Gastarbeiter am Flughafen
  in Düsseldorf an. Bis 1973 kommen knapp 870.000 Menschen aus der Türkei nach Deutschland
  – zum Beispiel per Orient-Express nach München. Etwa eine halbe Million kehrt im
  selben Zeitraum wieder zurück. Nachdem der Aufenthalt vorerst befristet ist, können
  die Arbeiter später auch dauerhaft in Deutschland bleiben. Zunächst werden vor allem
  unverheiratete Männer für die Arbeit in Deutschland angeworben. Der Tabakzüchter
  Mehmet Ali verlässt 1966 als letzter Mann sein Dorf Bademeli in der Nähe von Izmir
  , um in Deutschland zu arbeiten. Seine 26-jährige Ehefrau bleibt in einem männerlosen
  Ort zurück. Die Gastarbeiter sind überwiegend in der Industrie tätig und sind in
  harten körperliche Jobs tätig. Dazu gehört die Autoproduktion, zum Beispiel das
  Ford-Werk in Köln. Die türkischen Auswanderer sind im Durchschnitt besser qualifiziert
  als die Menschen in der Türkei: 80 Prozent haben eine abgeschlossene Schulausbildung,
  in der Türkei sind es nur 44 Prozent. Rund ein Drittel der Gastarbeiter sind Frauen.
  Sie arbeiten zum Beispiel in der Textil- und der Nahrungsmittelindustrie, aber auch
  in der Elektrotechnik oder der Eisenindustrie. Sie verdienen etwa 30 bis 40 Prozent
  weniger als Männer. Viele Gastarbeiter leben in engen Sammelunterkünften. Die Arbeit
  steht im Mittelpunkt des Lebens. Da mit der Rückkehr in die Türkei geplant wird,
  gibt es kaum Integrationsmaßnahmen. Sprachkurse und der Kontakt zur deutschen Bevölkerung
  bleiben überwiegend aus. In Folge der Ölkrise kommt es im November 1973 zum Anwerbestopp.
  Einige Gastarbeiter kehren wieder in die Türkei zurück, viele bleiben aber in Deutschland.
  Ihre Familien ziehen hinterher. 1980 leben rund 1,4 Millionen Türken in der Bundesrepublik.
  Durch die zunächst fehlende Integration werden die Einwanderer strukturell benachteiligt.
  Sie haben schlechtere Aufstiegschancen und erleben Ausgrenzung. 1978 schafft die
  Bundesregierung das Amt des Integrationsbeauftragten. Die Einwanderer sollen vor
  allem durch mehr Unterstützung im Bildungsbereich besser integriert werden. Die
  Kinder und Enkelkinder der Gastarbeiter wachsen in Deutschland auf, gehen zur Schule
  und sprechen in der Regel fließend Deutsch. Das stärkt ihre Chancen auf dem Arbeitsmarkt.
  Heute haben mehr als drei Millionen Menschen in Deutschland türkischen Migrationshintergrund.
  Sie sind ein wichtiger Teil der Gesellschaft, haben das Land mit Ideen, Kreativität
  und Wissen bereichert und mehrere hunderttausend Arbeitsplätze geschaffen. Nach
  dem Ende des Zweiten Weltkriegs gibt es in Deutschland einen großen Wirtschaftsaufschwung.
  Der Bedarf an Arbeitskräften ist hoch. Die Türkei erlebt im gleichen Zeitraum eine
  schwere Wirtschaftskrise. Am 30. Oktober 1961 unterzeichnen die beiden Länder deshalb
  das deutsch-türkische Anwerbeabkommen. Im November 1961 kommen 55 türkische Gastarbeiter
  am Flughafen in Düsseldorf an. Bis 1973 kommen knapp 870.000 Menschen aus der Türkei
  nach Deutschland – zum Beispiel per Orient-Express nach München. Etwa eine halbe
  Million kehrt im selben Zeitraum wieder zurück. Nachdem der Aufenthalt vorerst befristet
  ist, können die Arbeiter später auch dauerhaft in Deutschland bleiben. Zunächst
  werden vor allem unverheiratete Männer für die Arbeit in Deutschland angeworben.
  Der Tabakzüchter Mehmet Ali verlässt 1966 als letzter Mann sein Dorf Bademeli in
  der Nähe von Izmir , um in Deutschland zu arbeiten. Seine 26-jährige Ehefrau bleibt
  in einem männerlosen Ort zurück. Die Gastarbeiter sind überwiegend in der Industrie
  tätig und sind in harten körperliche Jobs tätig. Dazu gehört die Autoproduktion,
  zum Beispiel das Ford-Werk in Köln. Die türkischen Auswanderer sind im Durchschnitt
  besser qualifiziert als die Menschen in der Türkei: 80 Prozent haben eine abgeschlossene
  Schulausbildung, in der Türkei sind es nur 44 Prozent. Rund ein Drittel der Gastarbeiter
  sind Frauen. Sie arbeiten zum Beispiel in der Textil- und der Nahrungsmittelindustrie,
  aber auch in der Elektrotechnik oder der Eisenindustrie. Sie verdienen etwa 30 bis
  40 Prozent weniger als Männer. Viele Gastarbeiter leben in engen Sammelunterkünften.
  Die Arbeit steht im Mittelpunkt des Lebens. Da mit der Rückkehr in die Türkei geplant
  wird, gibt es kaum Integrationsmaßnahmen. Sprachkurse und der Kontakt zur deutschen
  Bevölkerung bleiben überwiegend aus. In Folge der Ölkrise kommt es im November 1973
  zum Anwerbestopp. Einige Gastarbeiter kehren wieder in die Türkei zurück, viele
  bleiben aber in Deutschland. Ihre Familien ziehen hinterher. 1980 leben rund 1,4
  Millionen Türken in der Bundesrepublik. Durch die zunächst fehlende Integration
  werden die Einwanderer strukturell benachteiligt. Sie haben schlechtere Aufstiegschancen
  und erleben Ausgrenzung. 1978 schafft die Bundesregierung das Amt des Integrationsbeauftragten.
  Die Einwanderer sollen vor allem durch mehr Unterstützung im Bildungsbereich besser
  integriert werden. Die Kinder und Enkelkinder der Gastarbeiter wachsen in Deutschland
  auf, gehen zur Schule und sprechen in der Regel fließend Deutsch. Das stärkt ihre
  Chancen auf dem Arbeitsmarkt. Heute haben mehr als drei Millionen Menschen in Deutschland
  türkischen Migrationshintergrund. Sie sind ein wichtiger Teil der Gesellschaft,
  haben das Land mit Ideen, Kreativität und Wissen bereichert und mehrere hunderttausend
  Arbeitsplätze geschaffen. Deutschland erwarte von den Menschen, die ins Land kämen,
  dass sie sich an die Regeln einer demokratischen Gesellschaft hielten – etwa an
  die Gleichberechtigung von Frauen und Männern. Umgekehrt könne wer nach Deutschland
  komme, von der deutschen Gesellschaft erwarten, dass Chancengleichheit und Zugehörigkeit
  gelten. „In diesem Land erfahren alle Wertschätzung – es sollten jedenfalls alle
  – , ungeachtet der Hautfarbe oder der Herkunft der Eltern.“ Der Bundeskanzler sprach
  auch die schwarzen Kapitel der 65-jährigen Geschichte der türkischen Zuwanderung
  an: Die Angst vor dem Fremden, die sich ideologisch aufgeladen und in furchtbaren
  Gewalttaten entladen habe. Die Namen Mölln und Solingen stünden für rassistische
  Gewalt in den 1990er-Jahren. Der NSU mordete über Jahre, der furchtbare Anschlag
  von Hanau liege erst sechs Jahre zurück. Der Kanzler verwies darauf, dass die Angst
  vor dem Fremden derzeit eher zu- als abnehme und ideologisch aufgeladen werde. Der
  Bundeskanzler betonte: „Die offene Gesellschaft, die freiheitliche Gesellschaft
  bewährt sich aus sich selbst heraus. Sie bewährt sich in unserem Umgang miteinander."
  Die Bundesregierung wolle und müsse nach den Worten des Kanzlers die Integrationsgeschichte
  fortschreiben. Denn nur eine funktionierende Aufstiegsgesellschaft halte den Wohlstandsmotor
  am Laufen. Dafür brauche es wieder Einwanderung. Deutschland und Europa seien auf
  Fachkräfte angewiesen. Am 30. Oktober 1961 unterzeichneten die Bundesrepublik Deutschland
  und die Türkei ein Abkommen zur Anwerbung türkischer Arbeitskräfte. Am Festakt in
  Berlin nahmen der Bundeskanzler und der türkische Botschafter Turan teil. Der Aufenthalt
  der türkischen Migranten war zunächst befristet. Die überwiegend jungen Männer sollten
  bis zu zwei Jahre in Deutschland arbeiten und dann in ihre Heimat zurückkehren.
  Viele Gastarbeiter blieben auch nach dem Aufnahmestopp 1973 in Deutschland. Ihre
  Familien zogen hinterher. Heute haben mehr als drei Millionen Menschen in der Bundesrepublik
  türkischen Migrationshintergrund. Sehr geehrter, lieber Herr Mutlu , sehr geehrte
  Frau Kollegin, liebe Frau Pawlik, Herr Botschafter, liebe Kolleginnen und Kollegen
  aus dem Deutschen Bundestag, meine sehr geehrten Damen und Herren, vor allem aber
  sehr geehrte, liebe Damen und Herren, die Sie heute im Mittelpunkt stehen, sehr
  geehrte Vertreterinnen und Vertreter der ersten Generation türkischer, wie wir es
  damals gesagt haben, Gastarbeiterinnen und Gastarbeiter, sehr geehrte Vertreterinnen
  und Vertreter der Generation der Kinder und Enkel! „Was will Niyazi in der Naunynstraße?“
  – so heißt ein längst berühmtes Buch, ein Langgedicht von Aras Ören aus dem Jahr
  1973. Manche von Ihnen hier werden es kennen. Niyazi war eben noch zum Fischfang
  schnellen Schrittes in die heimatliche Bucht am Mittelmeer gegangen, und nun „geht
  er spät, mit schnellen Schritten, den Kopf tief zwischen den Schultern, zur Nachtschicht.“
  Er geht durch die Naunynstraße. Diese Straße gibt es wirklich. Sie liegt in Kreuzberg,
  und sie ist – die Berlinerinnen und Berliner hier werden es wahrscheinlich wissen –
  eine der Straßenzüge, in der viele dieser sogenannten Gastarbeiterinnen und Gastarbeiter
  aus der Türkei in den 1960er-Jahren eine Wohnung fanden. Mit ihnen kommt, so schreibt
  es der Dichter Aras Ören , Thymiangeruch, Sehnsucht und Hoffnung in diesen Teil
  von Kreuzberg, aber auch „frischer Hass“. Den deutschen Anwohnern sind die Zugezogenen
  fremd. Die deutschen Fabrikarbeiter fürchten, dass die Löhne verdorben werden. Genauso
  war es übrigens nicht nur in Berlin, sondern auch in meinem Bundesland, in Nordrhein-Westfalen.
  Auch wenn dort die Wohnstruktur zunächst eine andere war: Diese Gastarbeiterinnen
  und Gastarbeiter wohnten zunächst nicht in den Innenstädten. Sie wohnten in Arbeiterkolonien,
  in Siedlungen und separierten Wohnheimen in der Nähe der Fabriken und Industrieanlagen
  der Kohle- und Stahlförderung – einfache Unterkünfte, bisweilen umfunktionierte
  Werkshallen, Mehrbettzimmer, Gemeinschaftsküchen, zum Teil Ausgangssperren. Arbeiten-Schlafen-Arbeiten-Schlafen:
  Das war der Alltagsrhythmus der ersten Generation derer, die vor 65 Jahren mit Abschluss
  des deutsch-türkischen Anwerbeabkommens vom 30. Oktober 1961 nach Deutschland kamen.
  Die allermeisten von ihnen, und Sie, Frau Pawlik, haben darauf hingewiesen, gingen
  davon aus: Nach zwei Jahren, allenfalls etwas mehr, kehren wir in die Heimat zurück,
  zur Familie, vielleicht mit einer ganzen Menge Geld. Die deutschen Unternehmen und
  die deutsche Gesellschaft gingen jedenfalls genau davon aus. Es schien ja auch wie
  ein relativ guter Deal : Die deutsche Wirtschaft lief in den Fünfziger- und Sechzigerjahren
  auf Hochtouren; wir sprechen vom sogenannten Wirtschaftswunder. Die Unternehmen
  brauchten Arbeitskräfte – mehr als sie in Deutschland finden konnten –, und in der
  Türkei wuchs vor allem in den ländlichen Regionen die Armut, und die Bevölkerungszahl
  stieg. Viele wollten nach Deutschland kommen. Die türkische Regierung sah ihrerseits
  das Potential, die Landsleute durch einen Auslandsaufenthalt weiter zu qualifizieren.
  Genau das war die Idee des Anwerbeabkommens von 1961: ein temporäres Abkommen für
  ein Gastspiel, sozusagen. Der Name „Gastarbeiter“ drückt es ja aus: Es ging um kurzfristigen
  Austausch von Menschen und Geld zum gegenseitigen Nutzen der beiden Länder. Aber
  diese Rechnung – so können wir heute feststellen – wurde ohne die Menschen gemacht.
  Menschen sind neugierig auf ihre Umgebung. Wir sind eben – zum Glück – lernende
  und auch neugierige Wesen. Wir sind nicht Geschöpfe einer unveränderlichen Kultur,
  sondern wir machen, wir schaffen Kultur, und wir wollen Wurzeln schlagen, dort,
  wo wir leben und arbeiten. Viele der Gastarbeiterinnen und Gastarbeiter lernten
  ein wenig Deutsch – in der Fabrik, am Fließband, unter Tage –, tranken auch hier
  und da ein Bier oder einen Kaffee mit dem deutschen Kollegen. Etwa die Hälfte aller
  zwischen 1961 und 1973 Angeworbenen kehrte wieder in die Türkei zurück. Die andere
  Hälfte aber blieb in Deutschland, und aus den „Gastarbeitern“ wurden nach und nach
  Einwanderer und irgendwann Deutsche. Sie holten ihre Familien nach Deutschland.
  Sie zogen in die Innenstädte. Sie gründeten Lebensmittelläden. Sie gründeten Teestuben.
  Sie erfanden bekanntlich den Döner. Türkische Gastarbeiterinnen und Gastarbeiter
  haben die industrielle Substanz unseres Landes mit aufgebaut. Das Ruhrgebiet, meine
  Damen und Herren, wäre in diesen Jahren nicht so wohlhabend und so großartig geworden
  ohne diese erste Generation. Sie hat Substanz mit aufgebaut in unserem Land und
  die Infrastruktur des Wohlstands geschaffen, in der wir leben, oft mit ganz außergewöhnlichem
  Fleiß. Sie hat aber auch das kulturelle Gesicht der Bundesrepublik tiefgreifend
  mitgestaltet, und sie gestaltet es bis heute mit, eben seit vielen Jahrzehnten.
  Was wäre die deutsche Literatur heute ohne Aras Ören oder Deniz Utlu , der deutsche
  Film ohne Fatih Akin und Sibel Kekili , der deutsche Fußball ohne İlkay Gündoğan
  , die deutsche Onkologie und Immunologie ohne Uğur Şahin und Özlem Türeci , die
  beiden Gründer eines der erfolgreichsten Unternehmen unserer Zeit, die beiden Gründer
  von BioNTech ? Das sind nur die weithin bekannten, die, wenn man so will, besonders
  spektakulären Erfolgsgeschichten, die aus dem kurzen, zweiseitigen Anwerbeabkommen
  von 1961 hervorgegangen sind. Es gibt Abertausende andere; in allen Bundesländern,
  in allen Bereichen unserer Gesellschaft, in allen Parteien, in den Gewerkschaften,
  in den Arbeitgeberverbänden. Einiges von dem ist nachzulesen in dem Sammelband,
  den Özcan Mutlu vor fünf Jahren anlässlich des 60. Jubiläums des Anwerbeabkommens
  herausgegeben hat, ein Buch, das auch heute nachlesenswert ist. Danke für Ihre Initiative!
  Meine Damen und Herren, wir sollten und wir können diese Geschichten lesen, um uns
  daran einfach zu erfreuen, um uns zu freuen, welche Möglichkeiten unser Land, ein
  freiheitliches Land, bereithält für die, die sich einbringen. Wir sollten diese
  Geschichten aber auch lesen, um zu verstehen, um zu lernen, was die Erfolgsbedingungen
  von gelingender Integration sind. Denn Integration ist eine Grundaufgabe jeder modernen,
  pluralistischen Gesellschaft. Es ist eine Grundaufgabe unserer modernen Gesellschaft,
  dass wir miteinander und voneinander lernen. Deutsche und Türken sind in den 1960ern
  und Siebzigern und Achtzigern in der Begegnung miteinander modern geworden, weltoffen
  und tolerant. Sie waren – die meisten jedenfalls – neugierig aufeinander und haben
  sich auch gemeinsam angestrengt. Für die erste Generation der „Gastarbeiterinnen“
  und „Gastarbeiter“ brauchte es Kolleginnen und Kollegen, Nachbarinnen und Nachbarn,
  die ihnen geduldig ein bisschen Deutsch beibrachten oder sie ganz einfach einmal
  in die Kneipe an der Ecke mitnahmen. „Klaus stand an der Kneipentür und zog ihn
  rein. Ab und zu hatten sie zusammen getrunken. Klaus sagte immer „Ali, du bist mein
  Freund“, und ein Bier ist ins nächste geflossen.“, schreibt Aras Ören . Es brauchte
  Lehrerinnen und Lehrer, die mit den Kindern dieser ersten Gastarbeitergeneration
  zum Teil ohne Entgelt am Nachmittag noch Deutsch übten, Mitschülerinnen und Mitschüler,
  die die Kinder auf Sport- und Spielplätze mitnahmen, in die Vereine, zum Kindergeburtstag.
  Arbeitsplatz, Klassenzimmer, Sportverein: Das sind doch noch immer die Orte der
  Integration, auch wenn wir heute Integration staatlicherseits richtigerweise mit
  organisieren und auch einfordern. Wir erwarten richtigerweise von allen Menschen,
  die in unser Land kommen, dass sie sich ganz einfach an die Regeln halten, die wir
  uns als demokratische Gemeinschaft gemeinsam gegeben haben, und dass sie Neugier,
  dass sie Respekt haben, auch vor unserer Art, zu leben: Frauen und Männer sind gleichberechtigt
  und auf Augenhöhe, im Bewusstsein der historischen Verantwortung, die aus der Schoah
  gerade gegenüber jüdischem Leben folgt, einig im Bemühen, Vorurteile abzubauen,
  die sich historisch aufgebaut haben, zum Beispiel gegen gleichgeschlechtliche Beziehungen.
  Umgekehrt kann, wer zu uns kommt und sich in diesem Sinne integriert, von der deutschen
  Gesellschaft erwarten, dass Chancengleichheit und Zugehörigkeit gelten. In diesem
  Land erfahren alle Wertschätzung – es sollten jedenfalls alle –, ungeachtet der
  Hautfarbe oder der Herkunft der Eltern. Es gehört nun zu der nun fünfundsechzigjährigen
  Geschichte türkischen Lebens in Deutschland, dass viele dieser ersten Generation,
  dass aber auch ihre Kinder und auch noch ihre Enkelkinder die Erfahrung machen mussten,
  dass sie trotz vieler Anstrengungen doch immer noch wie Fremde behandelt werden.
  „In der Schule nennen sie mich Asylanten-Arda, und Savaş nennen sie einfach nur
  Sucuk . Sie rufen, dass wir stinken, und behaupten, wir wohnen im Müll. Sie fragen,
  warum wir hässlich sind, obwohl Döner schön macht. Sie erzählen, wir hätten Läuse,
  und weigern sich, uns zu berühren.“ Das schreibt der deutsche Autor Necati Öziri
  , Sohn türkischer Eltern aus dem Ruhrgebiet, in seinem Roman „Vatermal“. Es sind
  die Erfahrungen schon der dritten Generation türkischer Zuwanderung, die er hier
  beschreibt. Meine Damen und Herren, solche Vorurteile halten sich hartnäckig, und
  die Angst vor dem Fremden ist Gift jeder freiheitlichen Gesellschaft. Zur fünfundsechzigjährigen
  Geschichte türkischer Zuwanderung nach Deutschland gehören eben leider auch schwarze
  Kapitel, in denen sich diese Angst vor dem Fremden ideologisch aufgeladen und in
  furchtbaren Gewalttaten entladen hat. Frau Pawlik hat die Namen schon genannt: Mölln
  und Solingen stehen für rassistische Gewalt, die sich in den 1990er-Jahren in unserer
  Mitte Bahn gebrochen hat, der NSU mordete über Jahre – acht türkischstämmige Menschen
  waren unter den Opfern dieser Terrorzelle –, und der furchtbare Anschlag von Hanau
  liegt gerade erst einmal sechs Jahre zurück. Meine Damen und Herren, nutzen wir
  diesen Tag heute auch, um unsere Wachsamkeit zu schärfen. Gesellschaftlicher Fortschritt
  kann auch wieder verloren gehen, wenn er nicht aktiv und tätig verteidigt wird.
  Auch wenn wir uns wünschen, dass Herkunft und Hautfarbe irrelevant sind: Sie spielen
  eine Rolle. Die Angst vor dem Fremden ist weiterhin ideologisch infektiös. Wir müssen
  leider feststellen: Diese Angst nimmt derzeit eher zu als ab, und sie wird ideologisch
  aufgeladen und ausgebeutet. Ich wollte eigentlich das Unwort hier nicht aussprechen,
  aber es ist zurzeit allgegenwärtig, und dieses Unwort lautet „Remigration“. Dahinter
  steckt ein Angriff auf das moderne Deutschland, das wir uns in den vergangenen 65 Jahren
  miteinander aufgebaut haben. Denn ich sagte es schon: Deutsche und Türken sind in
  der Begegnung miteinander moderner geworden, eben auch dank der Migration aus der
  Türkei. Deutschland ist kulturell, wirtschaftlich, wissenschaftlich und auch kulinarisch
  reicher geworden dank der Migration aus der Türkei. Es ist eine Erfolgsgeschichte,
  die am 30. Oktober 1961 ihren Anfang genommen hat und die wir heute feiern. Danke,
  dass Sie alle da sind! Meine Damen und Herren, wir wollen diese Erfolgsgeschichte
  sichern, wir wollen sie verteidigen, wir wollen sie aber auch weiterschreiben. Aus
  diesem Grund, meine Damen und Herren, haben wir als Bundesregierung die Ordnung
  der Integration zur Priorität erhoben. Wir begrenzen irreguläre Migration, die zu
  stark geworden ist, damit wir als Gesellschaft genügend Ressourcen für Integration
  in unseren Kitas, in unsere Schulen, in unseren Ausbildungsstätten haben. Wir müssen
  mit feinem Gespür darauf achten, wo eine offene und tolerante Gesellschaft überfordert
  wird und dann im Hinblick auf Ausgrenzung und Intoleranz zu kippen droht. Wir müssen
  die Integrationsgeschichte der Bundesrepublik fortschreiben, weil nur eine funktionierende
  Aufstiegsgesellschaft unseren Wohlstandsmotor am Laufen hält. Das ist das Versprechen,
  mit dem vor 65 Jahren so viele Türkinnen und Türken nach „Almanya“ aufgebrochen
  sind und das Deutschland vielen von ihnen gegenüber auch eingelöst hat. Wir wollen
  dieses Versprechen erneuern. Wir wollen, dass es eingelöst wird, vor allem für die
  jungen Menschen in diesem Land, ob sie Enkel und Großenkel türkischer, italienischer
  oder griechischer Gastarbeiter sind, ob es sich um die Kinder von Syrerinnen und
  Syrern handelt, die hier Heimat gefunden haben, oder ob die Eltern Thomas, Johanna,
  Klaus oder Michael heißen. Aufstieg für alle fordert von uns, von der Bundesregierung,
  aber auch von unserer ganzen Gesellschaft, dass wir den Sozialvertrag zwischen den
  Generationen erneuern, dass wir der deutschen Wirtschaft ermöglichen, die vierte
  industrielle Revolution, vor der wir stehen, mitzugestalten, und dass wir innerhalb
  Europas die Balance halten in Fragen der Sicherheit, der Offenheit und der Mobilität.
  Dafür brauchen wir – auch und wieder – Einwanderung. Deutschland und Europa sind
  auf Fachkräfte angewiesen, die von außerhalb unserer Grenzen zu uns kommen. Auch
  das ist eine Aufgabe, der sich die Bundesregierung angenommen hat. Wir arbeiten
  an einer Work-and-Stay -Agentur, einer digitalen Plattform, die Informationen, Verfahren
  und Dienstleistungen der Fachkräfteeinwanderung fördert. Sie wird so etwas wie die
  Visitenkarte dessen sein, was wir als Land sein wollen: ein Land der Offenheit,
  der Verlässlichkeit, der Schnelligkeit, der Effizienz und vor allem ein Land der
  Toleranz. Gleichzeitig gilt, und viele von Ihnen werden biografisch davon erzählen
  können: Die offene Gesellschaft, die freiheitliche Gesellschaft bewährt sich aus
  sich selbst heraus. Sie bewährt sich in unserem Umgang miteinander. Sie bewährt
  sich –  ich sagte es – am Arbeitsplatz, im Klassenzimmer, im Sportverein. Deutsche
  und Türken, wir haben 65 Jahre miteinander gelernt, eine offene, eine plurale Gesellschaft
  zu sein. Dieses praktische Wissen, das ist eine der größten Ressourcen, die wir
  für die Zukunft unseres Landes nutzen können. Nutzen wir sie gemeinsam, als Deutsche
  in unserem Land, in einer freien, in einer offenen, in einer toleranten Gesellschaft.'
