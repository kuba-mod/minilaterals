title: Im Kabinett beschlossen Mission SEA GUARDIAN verlängert
text: 'Die Seeraumüberwachung ist ein wichtiger Beitrag zur maritimen Sicherheit.
  Die Bundesregierung hat die Fortsetzung der Beteiligung bewaffneter deutscher Streitkräfte
  an der NATO -geführten maritimen Sicherheitsoperation SEA GUARDIAN beschlossen.
  Die Mission wird bis zum 30. November 2027 verlängert. Die personelle Höchstgrenze
  der einzusetzenden Soldatinnen und Soldaten wird von 550 auf 400 reduziert. Der
  Bundestag muss dem Beschluss noch zustimmen. Die Sicherheit in Deutschland ist eng
  verbunden mit der Sicherheit und Stabilität anderer Weltregionen. Deshalb ist die
  Bundesregierung entschlossen, sich für die Freiheit der internationalen Seeverbindungslinien
  aktiv einzusetzen. SEA GUARDIAN stärkt die Sicherheit im Mittelmeer. Das Engagement
  innerhalb von SEA GUARDIAN erfolgt ganz im Sinne des 360-Grad-Ansatzes des Strategischen
  Konzepts der NATO : Bedrohungen soll aus allen Richtungen und aus allen Dimensionen
  entgegengetreten werden. Dem Mittelmeer kommt aufgrund seiner Lage eine entscheidende
  Bedeutung zu: Zum einen bildet es die südliche Außengrenze der Europäischen Union,
  zum anderen eröffnet es den Zugang zur südlichen Nachbarschaft der NATO . Weiterhin
  bedroht zudem der völkerrechtswidrige Angriffskrieg durch Russland gegen die Ukraine
  die Sicherheit im Mittelmeer. Auch Flucht- und Migrationsbewegungen beeinflussen
  die politische Stabilität und Sicherheitslage der Anrainerstaaten und wirken sich
  bis nach Kontinentaleuropa aus. SEA GUARDIAN leistet einen wichtigen Beitrag zur
  maritimen Sicherheit im Mittelmeerraum durch die Seeraumüberwachung und den Lagebildaustausch.
  Die Mission kann Schiffe im gesamten Einsatzgebiet anhalten, kontrollieren und durchsuchen,
  wenn es einen Verdacht auf eine Verbindung zu terroristischen Organisationen gibt.
  Zudem wirkt die Operation durch die Präsenz der Einsatzkräfte präventiv und abschreckend.
  Dadurch kann die Gefahr des Terrorismus und des Waffenschmuggels verringert werden.
  Rechtliche Grundlage : Der deutsche Einsatz im Mittelmeer basiert auf den Beschlüssen
  des Nordatlantikrates . Zusätzlich beruht die Bekämpfung des Terrorismus und des
  Waffenschmuggels im Mittelmeer auf den Resolutionen des Sicherheitsrates der Vereinten
  Nationen, welche das Übereinkommen zur Bekämpfung widerrechtlicher Handlungen gegen
  die Sicherheit der Seeschifffahrt beinhalten. Der Einsatz deutscher Soldatinnen
  und Soldaten erfolgt nach den Regeln eines Systems gegenseitiger Sicherheit gemäß
  Artikel 24 Absatz 2 des Grundgesetzes. Außerdem sind die Einheiten völkerrechtlich
  verpflichtet, Hilfe bei Personen in Seenot zu leisten.'
