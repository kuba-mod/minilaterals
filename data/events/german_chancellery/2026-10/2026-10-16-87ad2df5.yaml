  von E-Bussen, E-Lkw und E-Pkw ‑ es geht ja nicht nur um E-Autos, sondern auch um
  all die Nutzfahrzeuge ‑ ist nicht nur von den Flottengrenzwerten abhängig. Der Blick
  geht immer sehr stark auf die Flottengrenzwerte, aber genauso entscheidend ist es,
  die Elektrifizierung über die Ladesäulenstrominfrastruktur gerade auch im Lkw-Bereich
  mit anzusteuern. Es gab gerade eine wichtige Initiative zwischen Deutschland, Frankreich
  und Polen auf dem deutsch-französischen Umweltrat und dem deutsch-französisch-polnischen
  Weimarer Dreieck vor zwei Wochen genau dazu, um endlich eine gemeinsame Elektro-
  und Wasserstoffinfrastruktur für Lkw hinzubekommen, einen Korridor zwischen drei
