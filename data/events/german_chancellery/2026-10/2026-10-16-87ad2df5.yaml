  durch diese Einigung Impulse für die Entwicklung eines europäischen und deutschen
  Leitmarkts für grünen Stahl erreichen. Deswegen gab es noch bis heute Vormittag
  Gespräche dazu innerhalb der Regierungen. Vorhin gab es ja auch Meldungen, wonach
  einige Ministerien noch Beratungsbedarf hätten und auch Beratungsbedarf mit Stahlländern
