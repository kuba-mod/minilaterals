date: '2026-10-16'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 16. Oktober 2026
text: 'Sprecherinnen und Sprecher •    stellvertretender Regierungssprecher Hille
  •    Limmer (BMJV) •    Haufe (BMUKN) •    Pauly (BMDS) •    Lorenzat (BMWE) •    Dr.
  Rüll (BMF) •    Haufe (BMWE) •    Teichmann (BMBFSFJ) •    Giese (AA) •    Singer
  (BMI) •    Köhler (BMLEH) (Vorsitzender Steiner eröffnet die Pressekonferenz und
  begrüßt SRS Hille sowie die Sprecherinnen und Sprecher der Ministerien.) Wie üblich
  am Freitag, habe ich die Termine des Bundeskanzlers für die kommende Woche mitgebracht.
  Am 20. Oktober findet der Invest in Germany Summit der Bundesregierung statt. Erstmals
  bringt die Bundesregierung damit rund 200 internationale und nationale Führungskräfte
  und Investoren mit deutschen Spitzenpolitikerinnen und Spitzenpolitikern zusammen.
  Die Veranstaltung wird federführend vom Bundeswirtschaftsministerium in enger Zusammenarbeit
  mit dem Bundeskanzleramt, dem Bundesfinanzministerium und dem Persönlichen Beauftragten
  des Bundeskanzlers für Investitionen in Deutschland, Martin Blessing, realisiert.
  Der Investitionsgipfel ist so auch bereits im Koalitionsvertrag vereinbart. Der
  Invest in Germany Summit sendet ein klares Willkommenssignal: Wir investieren in
  unser Land, und wir heißen Unternehmen und Investoren willkommen, ebenfalls Standortentscheidungen
  zugunsten Deutschlands zu treffen. Der Summit ist Startpunkt der Initiative „Invest
  in Germany“, die auf eine systematische Vernetzung und gezieltere Ansprache von
  Investorinnen und Investoren gerichtet ist. Einige Worte zum Ablauf: Los geht es
  bereits am Vorabend, am Montag, den 19. Oktober, mit einem Empfang im Kraftwerk
  Berlin mit bis zu 500 Teilnehmerinnen und Teilnehmern unter dem Motto „Red Carpet
  for Investments“. Teilnehmen werden auch Regierungschefinnen und Regierungschefs
  sowie Vertreterinnen und Vertreter der Länder. Der Bundeskanzler wird bei diesem
  Empfang eine Rede halten und diesen Empfang eröffnen. Er wird unter anderem mit
  dem CEO von Nvidia, Jen-Hsun Huang, zu einem Bühnengespräch zusammenkommen. Am Dienstag
  eröffnet der Bundeskanzler um 9.30 Uhr den Gipfel in der European School of Management
  and Technology mit einer Rede. Dem folgt ein moderiertes Panel mit Unternehmensvertreterinnen
  und Unternehmensvertretern. Dann gibt es sogenannte Deep-Dive-Sessions, in denen
  mehrere Regierungsmitglieder vertiefend auf Themen eingehen werden, jeweils mit
  Co-Hosts aus der Wirtschaft. Zudem werden die Regierungsmitglieder bilaterale Gespräche
  mit Konferenzteilnehmerinnen und -teilnehmern führen. Diese Teilnehmer hatten vorher
  die Gelegenheit, den Regierungsmitgliedern ihre Gesprächswünsche anzumelden. Um
  15.15 Uhr wird der Bundeskanzler zusammen mit Minister Lars Klingbeil und Ministerin
  Katherina Reiche ein gemeinsames Pressestatement abgeben. Am Dienstagnachmittag
  geht es für den Bundeskanzler weiter. Gegen 16 Uhr nimmt der Bundeskanzler am 65. Jubiläum
  des deutsch-türkischen Anwerbeabkommens teil. Aus diesem Anlass wird er bei einer
  Veranstaltung im Konferenzzentrum KOM27 in Berlin-Mitte eine Rede halten. In dieser
  Rede wird er die vielen Menschen würdigen, die aus der Türkei in unser Land gekommen
  sind und mit ihrer Arbeitskraft dazu beigetragen haben, dass Deutschland ein wirtschaftlich
  erfolgreiches und wohlhabendes Land wurde. Am Mittwoch, dem 21. Oktober, nimmt der
  Bundeskanzler ab 10 Uhr an der offiziellen Eröffnung des diesjährigen Berlin Global
  Dialogue teil. Wie auch der Investitionsgipfel am Vortag findet dieser Gipfel in
  der European School of Management and Technology in Berlin statt. Auch hier wird
  der Bundeskanzler zunächst eine Rede halten. Dem folgt auch hier ein moderiertes
  Gespräch. Im Anschluss daran wird der Bundeskanzler mit einer internationalen Gruppe
  von Studierenden zusammenkommen. Unter dem Motto „Advancing Alliances for the New
  Era“ bringt der Gipfel vom 20. bis zum 22. Oktober hier in Berlin etwa 350 internationale
  Führungspersönlichkeiten aus Wirtschaft, Politik und Wissenschaft zusammen. Im Fokus
  steht die Frage, wie Zusammenarbeit und neue Partnerschaften zwischen Regierungen
  und Unternehmen in Zeiten geoökonomischer Verwerfungen zu globalem Wachstum und
  Wohlstand beitragen können. Später am Mittwoch, um 13 Uhr, wird der Bundeskanzler
  den Staatspräsidenten der Mongolei, Herrn Khurelsukh Ukhnaa, im Bundeskanzleramt
  empfangen. Bei einem gemeinsamen Mittagessen wird es um die bilateralen Beziehungen
  der beiden Länder, aber auch um wirtschaftspolitische Fragen und natürlich um die
  internationale Sicherheitspolitik gehen. Der Mittwoch ist ein voller Tag. Um 16.30 Uhr
  wird der Bundeskanzler schließlich den tschechischen Staatspräsidenten Pavel im
  Bundeskanzleramt empfangen. Auch hierbei handelt es sich um ein Arbeitstreffen.
  In dem Gespräch stehen, wie auch bei dem vorherigen, die bilateralen Beziehungen
  beider Länder sowie außen- und sicherheitspolitische Fragen im Fokus. Am Donnerstag,
  dem 22. Oktober, wird der Bundeskanzler nach Montenegro reisen, um am jährlichen
  Gipfeltreffen des Berlin-Prozesses teilzunehmen. Der Bundeskanzler wird dort mit
  Vertreterinnen und Vertretern der Westbalkanstaaten und mit Vertretern unserer europäischen
  Partner zusammenkommen. Der diesjährige Gipfel trägt den Titel „Region in Motion.
  Owning the Change”. Inhaltliche Schwerpunkte des Treffens sind Wirtschaftswachstum,
  Wettbewerbsfähigkeit und Sicherheit. Neben der Förderung regionaler Kooperation
  zwischen den Westbalkanstaaten dient das Treffen vor allem auch deren Annäherungsprozess
  an die EU. Im Anschluss an die Plenarsitzung ist für ca. 13 Uhr eine Pressekonferenz
  vorgesehen. Am Freitag, dem 23. Oktober, wird der Bundeskanzler von 10 bis 12 Uhr
  das Leibniz-Institut für innovative Mikroelektronik, IHP, in Frankfurt/Oder besuchen.
  Das IHP ist das weltweit führende Kompetenzzentrum für Silizium-Germanium-Technologie
  oder, kurz gesagt, für die Entwicklung innovativer Chips. Die IHP-Forschung liegt
  direkt am Übergang zur industriellen Fertigung und hat damit große Bedeutung für
  sämtliche Schlüsselindustrien. Das IHP ist ein zentraler Leuchtturm in der ostdeutschen
  Forschungslandschaft. Mit ihrer Mikroelektronikstrategie will die Bundesregierung
  Deutschlands Rolle als führender Halbleiterstandort in Europa sichern. Der Bundeskanzler
  wird zu Beginn mit dem Präsidenten der Leibniz-Gemeinschaft, Professor Schmidt,
  und dem Geschäftsführer des IHP, Professor Kahmen, über die Arbeit der Leibniz-Forschungsgemeinschaft
  im Allgemeinen und des IHP im Besonderen sprechen. Anschließend, ab ca. 11 Uhr,
  wird sich der Bundeskanzler bei einem Rundgang durch die Labore über die neueste
  Chipforschung und über praktische Anwendungsbeispiele informieren. Dieser Rundgang
  ist presseöffentlich. Danach ist gegen 11.45 Uhr ein kurzes Pressestatement des
  Präsidenten der Leibniz-Forschungsgemeinschaft, des IHP-Geschäftsführers und des
  Bundeskanzlers geplant. Die Bundesministerin der Justiz und für Verbraucherschutz,
  Stefanie Hubig, reist in der kommenden Woche in die drei baltischen Staaten. Im
  Fokus der Reise stehen die Themen der Digitalisierung der Justiz sowie des Schutzes
  vor Partnerschaftsgewalt und vor hybriden Bedrohungen. Die Reise beginnt am Montag,
  dem 19. Oktober, in Riga. Am Folgetag reist die Ministerin weiter nach Tallinn.
  Die Reise endet am Mittwoch, dem 21. Oktober, in Vilnius. Ministerin Hubig wird
  im Rahmen der Reise mit ihrem lettischen Amtskollegen sowie mit ihrer estnischen
  und ihrer litauischen Amtskollegin zusammentreffen. Darüber hinaus ist ein Besuch
  bei der in Litauen stationierten Panzerbrigade 45 der Bundeswehr geplant. Ich möchte
  Sie auf die Weltnaturkonferenz hinweisen, die sogenannte 17. Vertragsstaatenkonferenz
  der Biodiversitätskonvention, auch bekannt als CBD COP, die ab dem kommenden Montag
  in Armenien in der dortigen Hauptstadt Eriwan stattfindet. Dorthin wird Bundesumweltminister
  Carsten Schneider in der übernächsten Woche reisen. Die Konferenz beginnt aber bereits
  am Montag. Die internationale Staatengemeinschaft hat sich ja dazu verpflichtet,
  bis 2030 30 Prozent der Meeresgebiete weltweit und 30 Prozent der Landgebiete weltweit
  unter Schutz zu stellen. Deutschland hat dafür schon einen entscheidenden Schritt
  unternommen: Im letzten Monat, im September, hat Bundesumweltminister Carsten Schneider
  das UN-Hochseeschutzabkommen für Deutschland mitunterzeichnet. Die Vertragsstaatenkonferenz
  wird sich vor allen Dingen über die weiteren Schritte verständigen, um dieses Ziel
  zu erreichen und damit auch dem momentanen weltweiten Verlust an Artenreichtum,
  an wichtigen Naturorten und an für die Biodiversität wichtigen Orten entgegenzuwirken.
  Die biologische Vielfalt weltweit wiederherzustellen und zu erhalten, ist das Ziel
  der Weltnaturkonferenz. Herr Hille, trifft es zu, dass der Bundeskanzler (bei dem
  Invest in Germany Summit) mit dem CEO von Nvidia am 19. Oktober einen Zuschuss in
  Höhe von mehreren 100 Millionen Euro für diese Firma vereinbaren wird? Ich habe
  das auch gelesen. Es wird Sie aber nicht überraschen, dass ich dazu das sage, was
  wir üblicherweise sagen, wenn Dinge in der Presse berichtet werden: Das kommentiere
  ich hier an dieser Stelle nicht. Ich habe eine Frage zum Invest in Germany Summit.
  Erhofft sich die Bundesregierung in der Tat mehr Investitionen in Deutschland in
  einer Parteienlandschaft, in der die AfD immer stärker und stärker wird? Absolut.
  Es ist das Ziel dieses Gipfels, Investitionen in unser Land zu mobilisieren. Sie
  wissen wahrscheinlich, solche Investorenkonferenzen sind in anderen Ländern ganz
  übliche Formate. Wir beschreiten jetzt auch diesen Weg ‑ das hat die Koalition auch
  schon im Koalitionsvertrag vereinbart ‑, um Deutschland als Investitionsstandort
  zu präsentieren. Europa gehört weltweit zu den beliebtesten Investitionsregionen,
  und Deutschland ist dabei mit seinen Investitionsbedingungen an der Spitze. Das
  gilt es, deutlich zu machen. Wir können unseren Staat nicht nur aus den staatlichen
  Investitionen, die wir ja in großem Umfang tätigen, erfolgreich halten und die Wirtschaft
  und unseren Wohlstand sichern, sondern dazu braucht es privates Kapital und private
  Investitionen. Dem dient dieser Investitionsgipfel kommende Woche Montag und Dienstag.
  Aber die AfD ist in dieser Hinsicht ein Bremser. Ehrlich gesagt, sehe ich diesen
  Konnex, den Sie aufmachen, nicht. Bei diesem Investitionsgipfel spielt die AfD keine
  Rolle. Es geht darum, zu zeigen, welch guter Investitions- und Wirtschaftsstandort
  Deutschland ist. Ich würde auch empfehlen, die Rolle einzelner Parteien dabei jetzt
  nicht überzubewerten. Wie ich gerade schon gesagt habe: Es gibt diverse Studien
  über die Qualität von Investitionsorten in der Welt. Dabei ist Europa weit vorne,
  und Deutschland ist wiederum in Europa weit vorne. Genau darum geht es bei dem Investitionsgipfel,
  das gemeinsam mit Unternehmen deutlich zu machen und Deutschland als Investitionsstandort
  zu bewerben. Da Sie eben sagten, die AfD würde dabei keine Rolle spielen: Ist es
  denn nicht so, dass auch die Bundesregierung die Sorge hat, dass die politische
  Machtübernahme der AfD in einzelnen Bundesländern das Ansehen Deutschlands weltweit
  negativ beeinträchtigt? Diese Bundesregierung ist, glaube ich, das Organ, das Deutschland
  ganz besonders nach außen repräsentiert. Bei dieser Konferenz geht es darum, zu
  zeigen, was Deutschland zu bieten hat, was für ein Investitionsklima Deutschland
  hat und wie positiv es für Unternehmen sein kann, in Deutschland zu investieren.
  Wenn Sie Deutschland und Europa bei den Investitionsbedingungen mit anderen Regionen
  auf der Welt vergleichen: Wir sind ein Rechtsstaat. Man kann sich darauf verlassen,
  dass in Deutschland Rechtswege beschritten werden können, wenn man mit Entscheidungen
  nicht einverstanden ist. Das unterscheidet uns signifikant von anderen Regionen
  auf der Welt. Ich denke, es ist im Rahmen einer solchen Veranstaltung geradezu naheliegend,
  darauf hinzuweisen und Investitionen in Deutschland zu mobilisieren. Es ist nachvollziehbar,
  dass Sie für den Investitionsstandort Deutschland werben wollen. Gleichwohl ist
  Ihnen auch nicht das weltweite Echo auf die jüngsten Landtagswahlen entgangen. Damit
  verbunden war international durchaus die Sorge, welche politischen Kräfte sich jetzt
  in Deutschland ‑ zumindest auf Landesebene ‑ durchsetzen. Es wurde auch, glaube
  ich, von Vertretern der Regierungsparteien die Sorge geäußert, dass sich das negativ
  auf das Ansehen und damit auch auf die Investitionsbereitschaft auswirken kann.
  Wie tritt die Bundesregierung solchen Sorgen konkret entgegen? Sie können ja die
  Wahlergebnisse und die Regierungsbildungen, die da anstehen, nicht ignorieren. Herr
  Kollege, indem wir genau das tun, was wir in der kommenden Woche tun, nämlich indem
  wir die Stärken dieses Landes zeigen, indem wir deutlich machen, wie gut Deutschland
  als Ganzes aufgestellt ist. Ich kann noch mal diese Studien erwähnen, in denen Deutschland,
  was Investitionen angeht, als attraktiver Investitionsstandort weit vorne ist. Es
  geht darum, das ins Schaufenster zu stellen. Noch einmal: Ich bin mir ziemlich sicher,
  dass Deutschland und Europa im weltweiten Vergleich mit die besten Bedingungen bieten,
  was die Rechtsstaatlichkeit und die Stabilität politischer Systeme angeht. Ich möchte
  hier jetzt keine namentlichen Vergleiche aufmachen. Sie müssen sich ja nur einmal
  in der Welt umschauen. Wo, glauben Sie, wären die Bedingungen, wenn Sie investieren
  wollen, viel besser, als in Europa oder in Deutschland zu investieren? Darum geht
  es. Das tun wir. Das ist das Ziel dieses Investitionsgipfels in der kommenden Woche.
  Ich habe eine Frage an das Wirtschaftsministerium und an das Digitalministerium.
  Wirtschaftsministerin Reiche hat gestern dem Vorschlag von Digitalminister Wildberger
  widersprochen, KI-Umsätze zu besteuern. Hat sich die Bundesregierung mittlerweile
  auf eine Position geeinigt? Ich mache gerne den Anfang. Ich denke, in der öffentlichen
  Debatte ist bei diesem Thema ein Eindruck entstanden, der so gar nicht zutrifft,
  nämlich dass es dazu innerhalb der Bundesregierung möglicherweise unterschiedliche
  Auffassungen gibt. Ich kann Ihnen nur empfehlen, das gesamte Interview zu lesen,
  das Bundesminister Wildberger in dieser Woche im „Tagesspiegel“ gegeben hat, in
  dem dieses Thema auch eine Rolle gespielt hat, weil der Aspekt der Besteuerung in
  einen ganz klaren Kontext eingebettet war, den ich jetzt an dieser Stelle gerne
  noch einmal wiedergebe, auch um hier für alle noch einmal einzuordnen, wie die Aussagen
  des Ministers zu verstehen sind. Zunächst noch einmal ganz allgemein zur Bedeutung
  von künstlicher Intelligenz: Unser Haus ist federführend auch für dieses Thema zuständig.
  Wir sehen in KI vor allem einen großen Hebel in Bezug auf Wertschöpfung und Innovation,
  insbesondere natürlich hier bei uns am Standort Deutschland. KI hat ein enormes
  Wertschöpfungspotenzial. Das wollen wir heben. Den Minister beschäftigt auch sehr
  intensiv die Frage, wie wir als Standort Deutschland stärker an dieser Wertschöpfung
  partizipieren können. Das gelingt uns, indem wir Entwicklungen im Bereich der KI
  vorantreiben und indem wir natürlich auch unsere Unternehmen von Überregulierung
  befreien. Denn unsere Unternehmen müssen auch groß werden, ähnlich wie es weltweit
  führende Unternehmen gibt. Wir müssen hier mitspielen. Das ist ganz klar das Zielbild,
  das wir verfolgen. Es geht auch darum, globale einseitige Abhängigkeiten zu reduzieren.
  - Das ist die eine Seite. Die andere Seite ist, dass künstliche Intelligenz natürlich
  auch sehr große Auswirkungen auf alle Bereiche hat: auf alle gesellschaftlichen
  Bereiche, auf die Wirtschaft und auf den Arbeitsmarkt. Der Digitalminister sieht
  seine Pflicht darin, nicht nur auf das Heute zu schauen, sondern natürlich auch
  in die Zukunft zu schauen und wichtige Debatten anzustoßen. Genau in diesem Kontext
  sind die Äußerungen des Ministers zu verstehen. Ich möchte hier noch einmal deutlich
  machen: Entscheidend für uns als Haus, für den Minister, ist die Reihenfolge. Es
  geht in der jetzigen Phase natürlich nicht primär darum, eine Steuer einzuführen,
  sondern es geht primär darum, dieses enorme Wachstum und dieses Wachstumspotenzial,
  das wir in KI sehen, in Deutschland für Deutschland zu heben. Das ist ein ganz wichtiger
  Punkt. Parallel müssen wir natürlich auch über diese Auswirkungen, die der verstärkte
  Einsatz und der Durchbruch von künstlicher Intelligenz mit sich bringen, diskutieren.
  Da brauchen wir eine gesamtgesellschaftliche Debatte. Im Koalitionsvertrag ist auch
  die Prüfung einer Abgabe für Onlineplattformen vorgesehen. Vielleicht an das Finanzministerium:
  Gibt es dafür mittlerweile einen Zeitplan oder einen Gesetzentwurf? Wenn ich das
  richtig auf dem Schirm habe, liegt die Federführung dafür bei Bundeskulturstaatsminister
  Weimer . Die Abstimmungen finden weiterhin statt. Herr Kollege, ich habe dazu keinen
  neuen Stand. Deutschland und Frankreich haben sich gerade eben auf ein gemeinsames
  Vorgehen ‑ Herr Hille, Sie wissen das ‑ zur Sicherung des Automobilstandorts Europa
  geeinigt. Was hält die Bundesregierung der Kritik entgegen, dass das dem Verbrenner-Aus
  ab 2035 entgegenläuft? Herr Kollege, ich glaube, unsere Grundlinie ist da überhaupt
  nicht neu. Sie wissen, die Bundesregierung ist schon seit Langem damit beschäftigt,
  einen technologieoffenen Weg zu finden. Ich weiß jetzt nicht, auf welche Einigung
  Sie sich gerade beziehen. Auf die von Deutschland und Frankreich. Es gab gerade
  auch vom Bundespresseamt die Mitteilung, dass es eine Einigung zwischen Deutschland
  und Frankreich gegeben hat, wie man weiter vorgehen möchte. Wenn dem so ist, Herr
  Kollege, dann wissen Sie mehr als ich. Ich sitze seit einer halben Stunde hier.
  Aber das ist von Ihnen bestimmt erwartet worden. Wie gesagt, wenn es sie gibt, dann
  wissen Sie ja Bescheid. Ich kann Ihnen noch einmal grundsätzlich sagen, wie wir
  die Aufstellung der Automobilindustrie sehen. Dass wir an einer technologieoffenen
  Lösung auch für die Zeit nach 2035 gearbeitet haben, ist ja überhaupt nicht neu.
  Dass Deutschland und Frankreich dabei gemeinsam vorgehen und noch Änderungen erreichen
  wollen, zeigt, würde ich sagen, die Bedeutung dieses Themas und ist eine gute Nachricht.
  Im Sinne der Wettbewerbsfähigkeit und des Wohlstandes Europas und Deutschlands ist
  das doch eine gute Nachricht. Die Gespräche zur Weiterentwicklung der europäischen
  CO2-Flottengrenzwerte zwischen Deutschland und Frankreich sind in der Tat abgeschlossen.
  Es gab gerade auch die entsprechende Meldung des Bundespresseamtes. Das hat sich
  gerade alles überschlagen. Das sage ich auch in Richtung von Herrn Hille. Das alles
  ist in den letzten zehn Minuten passiert. Der Bundesumweltminister wird sich gleich
  auch entsprechend äußern. Zu dem Punkt, den Sie vorgetragen haben, dem Verbrenner-Aus
  bis 2035: Der weltweite Elektromobilitätshochlauf ist ja sichtbar und hier, denke
  ich, auch weitläufig bekannt. Die Richtungsentscheidungen der Automobilindustrie
  stellt das ja in keiner Weise infrage. Die Flottengrenzwerte waren dafür entscheidend,
  überhaupt diese Investitionen in die Elektromobilität in Europa maßgeblich zu stimulieren.
  Wir sind heute in einer anderen Phase, in der wir sehen, dass der Elektromobilitätshochlauf
  weltweit deutlich nach oben geht, dass die Konkurrenz gerade auch aus China deutlich
  in den europäischen Markt drängt. Das stellt natürlich gerade die Automobilbauer
  in Deutschland und Europa vor eine schwierige Situation, die auch allseits bekannt
  ist. Es geht jetzt darum, dass sowohl die Klimaziele im Verkehrssektor als auch
  die Klimaziele im Industriebereich miteinander verbunden werden. Deswegen ist die
  jetzige Grundeinigung zwischen Deutschland und Frankreich sehr stark auch auf den
  Punkt grüner Stahl, klimafreundlicher Stahl, Hochlauf einer Stahlproduktion, auch
  dekarbonisierter Stahl mit fokussiert. Denn das bietet uns jetzt im Grunde die Möglichkeit,
  da wir ohnehin über die Veränderung der Flottengrenzwerte sprechen, auch gleich
  über die Bedingungen für den Stahleinbau im Automobilbau zu sprechen. Deswegen ist
  diese Einigung an dieser Stelle sehr entscheidend, weil hier zwei große Staaten
  vorangehen und sagen: Wir wollen einen Leitmarkt für grünen Stahl hier in Europa
  aufbauen. Wir haben gerade sowohl in Deutschland als auch in Frankreich sehr wichtige
  Investitionen von großen Stahlbauern genau in diese Sparte hinein. Dafür ist das
  ein ganz wichtiges Signal. Herr Haufe, ich habe dazu eine Nachfrage, weg vom grünen
  Stahl hin zu den Flottengrenzwerten: Wenn ich Ihren Minister richtig verstehe, dann
  ist er sich sehr sicher darin, dass die Reise der Automobilbranche in Richtung E-Mobilität
  geht. Wieso verteidigen Sie dann trotzdem dieses politische Signal, dass man Verbrenner
  länger zulassen will bzw. Regeln hier aufweichen will? Wäre nicht die politische
  Lenkungswirkung sinnvoller in Richtung konsequenter Umstieg auf E-Mobilität, und
  würde das nicht am Ende auch der Automobilindustrie nutzen, weil das der Zukunftsmarkt
  ist? Die Flottengrenzwerte sind ein entscheidendes Instrument dafür, die Leitplanken
  für die Automobilindustrie zu definieren. Der überwiegende Anteil der Fahrzeuge
  muss bis 2035 emissionsfrei sein. An diesem klaren Signal ist jetzt gar keine Änderung
  festzustellen. Ja, es ist etwas mehr Flexibilität hinsichtlich anderer Antriebstechnologien
  möglich. Das stimmt. Der Bundesumweltminister war immer skeptisch, inwieweit wir
  die Tür öffnen wollen. Er ist natürlich auch immer kompromissbereit gewesen, aber
  er hat seine Kritik an der Stelle immer wieder unterstrichen. Das sprechen Sie richtig
  an. Gleichwohl schafft uns der Einstieg in einen grünen Stahlmarkt noch einmal ganz
  andere Emissionsminderungsperspektiven, die wir bisher nicht hatten. Das ist also
  eine wichtige Neuerung. Gerade im Industriebereich erleben wir eine sehr schleppende
  Dekarbonisierung. Es kommt jetzt tatsächlich ein ganz entscheidendes, neues Signal.
  Wo stehen wir in dem Prozess? ‑ Wir haben jetzt eine sehr entscheidende Einigung
  zwischen Deutschland und Frankreich. Die tatsächlichen Beschlüsse müssen mit den
  anderen Mitgliedstaaten im Umweltrat erst noch gefasst werden. Das wird im Dezember
  der Fall sein. Wir haben heute noch keine Neuregelung und auch kein fertiges Tableau
  für die CO 2 -Flottenregulierung bis 2035. Das Spektrum der Positionen unter den
  Mitgliedsländern ist durchaus recht breit. Dann muss natürlich auch noch eine Einigung
  mit dem Europäischen Parlament gefunden werden. Aber die heutige Einigung ist ein
  sehr entscheidender Schritt. Ich will dazu noch zwei Sätze ergänzen. Frau Kollegin,
  es gab einmal einen Fußballer, der gesagt hat: Es überwiegt eigentlich beides. ‑
  Das ist auch in diesem Zusammenhang ganz passend. Es geht natürlich darum, den Pfad
  von Elektromobilität und Klimaschutz kraftvoll weiterzugehen. Aber es geht auch
  darum, weiterhin ein starker Industriestandort zu bleiben. Das muss in einen guten
  Ausgleich gebracht werden. Unter diesem Dach ist auch die heutige Einigung zu sehen.
  Der Bundeskanzler ‑ ich zitiere ihn an der Stelle gern noch einmal ‑ hat schon vor
  einiger Zeit gesagt, Elektroantriebe seien „die Hauptstraße, auf der gefahren wird.“
  Richtig ist aber auch, dass die Markteinführung der E-Mobilität ein bisschen weiter
  Zeit braucht. Er hat auch gesagt ‑ Zitat ‑, dass wir ein starker Industriestandort
  bleiben müssen und dass rigorose Verbote auf diesem Weg nicht helfen. Auf diesem
  Weg haben wir in der Koalition und jetzt gemeinsam mit Frankreich für die Position
  in der EU einen gemeinsamen, ausgewogenen Weg gefunden, der den beiden Zielen folgt
  und gerecht wird, getreu dem Motto: Es überwiegt eigentlich beides. Herr Hille hat
