  Jetzt gibt es die Einigung. Wurden weitere Punkte zu der Einigung hinzugefügt? Schauen
  Sie in die Erklärung. Ich habe sie in den letzten zehn Minuten noch nicht komplett
  im Detail gesehen. Aber diese Punkte sind darin auf jeden Fall verankert. Herr Hille,
  Sie sprachen die Zielsetzung der Sicherung Deutschlands als eines Industriestandortes
  an. Teilt die Bundesregierung die Auffassung, dass die Krise der deutschen Automobilindustrie
  auch darin begründet liegt, dass sie viel zu spät auf Elektroantriebe umgestellt
  hat, immer auch getragen von der Hoffnung und Erfahrung, dass Deutschland das sogenannte
  Verbrenneraus schon weiter hinauszögern werde? Ich denke, Herr Kollege, auf komplexe
  Fragen kann man, wie es häufig ist, keine ganz einfachen Antworten finden. Ich erspare
  es Ihnen, einmal die Welt und die Verschiebung der Dinge, die auf der Welt in den
  letzten Jahren passiert sind und weiterhin passieren, zu kartieren. Aber es wäre,
  denke ich, zu einfach, eine solche Kausalkette, wie Sie sie beschrieben haben, aufzumachen.
  Die deutsche Automobilindustrie steht natürlich vor besonderen Herausforderungen.
  Das hat ganz massiv mit dem internationalen Wettbewerb zu tun. Uns geht es darum,
  diese Industrie in Deutschland weiterhin kräftig als eine der besten, als die beste
  der Welt zu erhalten. In dieser Hinsicht ist die Einigung heute eine sehr gute Nachricht,
  um zu der Balance zwischen Klimaschutz ‑ Hauptstraße Elektromobilität, wie es der
  Bundeskanzler genannt hat ‑ und Erhalt Deutschlands als eines Industriestandortes
  zu kommen. Die Frage, die ich gestellt habe, war eigentlich gar nicht so komplex.
  Denn das Thema ‑ ‑ ‑ Ich hatte Sie aber gebeten, auf die Frage zu antworten. ‑ Die
  Auffassung, dass die Krise der deutschen Automobilindustrie wesentlich darauf zurückzuführen
  sei, dass zu spät auf Elektromobilität umgestellt worden sei, kam und kommt ja aus
  der Automobilindustrie selbst, zum Beispiel vom ehemaligen CEO von VW. Teilt die
  Bundesregierung diese Ansicht, dass der zu späte Umstieg auf Elektromobilität eine
  wesentliche Krisenursache sei? Herr Kollege, im Kern geht es dabei um unternehmerische
  Entscheidungen, die getroffen wurden. Es ist nicht an mir, derartige unternehmerische
  Entscheidungen zu beurteilen. Ich habe versucht, deutlich zu machen, wie sich die
  Herausforderungen weltweit darstellen und verändert haben und wie sich der Wettbewerb,
  in dem unsere Industrien, insbesondere auch die Automobilindustrie, weltweit stehen,
  verändert hat. Es geht darum, den Platz als weltweit führendes Automobilland mit
  einer weltweit führenden Automobilindustrie zu erhalten. Das hat ganz viele Facetten.
  Eine davon ist, dass wir auf Technologieoffenheit für die Antriebsarten setzen.
  Dem gilt der Beschluss, der heute gemeinschaftlich zwischen Deutschland und Frankreich
  getroffen worden ist. Mir geht es um die von der EU-Kommission vorgeschlagene Verschiebung
  der Methanregeln. Mich interessiert die Position des Bundeskanzlers dazu. Die EU-Kommission
  begründet es vor allem mit den gestiegenen Energiepreisen, mit der Energiepreiskrise.
  Wie steht das Kanzleramt, wie steht der Kanzler dazu? Auch Sie sprechen ein Thema
  aus dem großen Komplex des Klimaschutzes an. Grundsätzlich ‑ das habe ich hier schon
  mehrfach ausgeführt ‑ unterstützt die Bundesregierung die Methanverordnung der EU
  als wichtiges Klimaschutzinstrument im Energiesektor. Allerdings wurde seitens der
  Im- und Exporteure von Erdöl und Erdgas zuletzt Sorge vor einer Nichteinhaltung
  von Standards ausgesprochen, die sich aus Europarecht ergeben könnten. Die Bundesregierung
  nimmt diese Sorge ernst. Die Unternehmen brauchen Rechts- und Planungssicherheit.
  Dabei darf die Versorgungssicherheit nicht beeinträchtigt werden. Die aktuell vorliegenden
  Vorschläge der EU-Kommission für mehr Flexibilität in Bezug auf die Umsetzung der
  Methanverordnung werden wir gründlich prüfen und eine einheitliche Position innerhalb
  der Bundesregierung abstimmen. Meine Nachfrage richtet sich auch an Herrn Haufe
  und das Umweltministerium. Ihr Minister hat in dieser Woche noch einmal ganz klar
  die Bedeutung der Reduktion von Methanemissionen betont und sagte, wenn das Methan
  nicht reduziert werde, könne man die Klimaschutzziele nicht einhalten. Jetzt wird
  von Brüssel aus der Vorschlag gemacht, es an genau dieser Stellschraube aufzuweichen.
  Läuft das nicht genau dem Ziel zuwider, Klimaschutzziele einzuhalten? Teilt der
  Bundeskanzler das Ziel, Methan schnell zu reduzieren, damit Klimaziele eingehalten
  werden können? Ich denke, Herr Hille hat gerade deutlich gemacht, dass die Position
  der Bundesregierung sehr klar ist und dass die Klimaschutzwirkung einer Methanminderung
  sehr groß ist. Das hat der Bundesumweltminister diese Woche noch einmal unterstrichen.
  Das ist quasi eine „low-hanging fruit“. Man kann Methan sehr einfach weltweit mindern.
  Es sind wenige Quellen. Methan ist ein viel stärkerer Erwärmungsfaktor als CO 2
  . Die Methanverordnung ist seit zwei Jahren geltendes Recht in der Europäischen
  Union. Sie hat für viele Länder auch eine Art von Vorbildcharakter, weil man damit
  erstmals die Methanminderung so großflächig angeht. Natürlich gibt es aber ‑ Herr
  Hille hat es gerade schon gesagt ‑ Unternehmen in der Öl- und Gasbranche, die Probleme
  damit haben. Es gibt aber auch Unternehmen, die damit keine Probleme haben. Ich
  erinnere noch einmal daran, dass es, als der algerische Staatspräsident hier in
  Berlin war, ein Abkommen dazu gab ‑ Algerien ist ein wichtiger Lieferant von Gas
  nach Deutschland ‑ und dass deutsche Gasimporteure auch unter den neuen Regeln der
  Methanverordnung Verträge mit Algerien geschlossen und auf die Methanverordnung
  verwiesen haben. Sie ist ja bereits in der Umsetzung. Sie ist auch schon mehrere
  Jahre bekannt. Unternehmen wissen, in welches Feld sie sich begeben müssen. Gleichwohl
  gibt es hier und da auch Probleme. Das ist aber kein grundlegendes Problem für die
  Energieversorgungssicherheit; auch das ist immer wieder klargestellt worden. Wir
  sehen, dass es geopolitisch ganz andere Größenordnungen gibt, die uns in der Versorgung
  mit fossiler Energie Probleme bereiten. Eine letzte Bemerkung dazu: Wir haben immer
  unterstrichen, dass wir den pragmatischen Umsetzungsansatz der Europäischen Kommission
  teilen. Deswegen gehen wir bestimmte Regeln ein, die dazu führen, dass wir den einen
  oder anderen Schritt verzögern, um ein Jahr verschieben. Dazu waren wir immer bereit.
  Es liegt ein neuer Vorschlag vor, und ihn werden wir jetzt bewerten. Frau Kollegin,
  Sie haben auch mich noch angesprochen. Ich habe eingangs ja deutlich gemacht, dass
  die Bundesregierung die Methanverordnung grundsätzlich als wichtiges Klimaschutzinstrument
  im Energiesektor sieht, es aber, wie Herr Haufe es gerade geschildert hat, noch
  Fragen respektive Hinweise auf mögliche Problemlagen gibt, die wir ernst nehmen
  müssen. Auch dabei geht es wieder um eine Frage der Balance. Es betrifft insbesondere
  die Überprüfung der Einhaltung von Vorgaben aus der Methanverordnung bei Öl- und
  Gasimporten. Zudem müssen entsprechende Überprüfungsstandards ausgearbeitet werden.
  Genau darum geht es. Eine Nachfrage haben Sie mit Ihren Ausführungen provoziert.
  Sie sagten, bestimmte Importeure von Gas und Öl hätten Probleme damit. Im Sinne
  des Klimaschutzes sollte es keine Aufgabe von Regierungen sein, Importeuren fossiler
  Brennstoffe das Leben möglichst leicht zu machen. Deswegen die Frage: Läuft die
  Aufweichung, die die EU-Kommission jetzt vorschlägt, dem nicht eigentlich genau
  zuwider? Wieso geht man auf Probleme an der Stelle ein, anstatt die Probleme beim
  Klimaschutz entschiedener anzugehen? Frau Kollegin, auch diese Art von Gegenschnitt,
  wie Sie ihn gerade machen, sehe ich, ehrlich gesagt, nicht. Es geht nicht darum,
  irgendeiner Partei das Leben leicht oder besonders schwer zu machen. Es geht darum,
  politisch richtige und vernünftige Dinge zu tun. Auch bei diesem Thema geht es wie
  auch beim Thema des Verbrenners um die Balance und Zielgenauigkeit von Maßnahmen.
  Wir sehen uns dem Klimaschutz verpflichtet. Deshalb ist die Methanverordnung ‑ ich
  sage es noch einmal ‑ ein wichtiges Klimaschutzinstrument im Energiesektor. Aber
  Importe von Erdöl und Erdgas beispielsweise sind ja nicht ganz unwichtig für unser
  Land. Deshalb müssen wir Hinweise, die es diesbezüglich gibt, natürlich ernst nehmen
  und das Ganze in einen guten Ausgleich bringen. Darum geht es. Deshalb ist der harte
  Gegenschnitt, wie Sie ihn machen, aus meiner Sicht nicht zutreffend. Ich sehe auch
  den Punkt einer starken Aufweichung nicht. Ich habe ja gerade unterstrichen, dass
  die Methanverordnung gilt. Wenn es jetzt darum geht, dass bestimmte Regeln zeitlich
  etwas verschoben werden, dann heißt das ja nicht, dass sie nicht kommen würden.
  Die Richtung ist derzeit doch klar. Wir haben in der Situation, in der wir jetzt
  sind, immer auch die Versorgungssicherheit insgesamt mit im Blick zu haben. Diese
  Abwägung führt die EU-Kommission durch, und diese Abwägung teilen wir. Ich habe
  eine Frage an das BMWE. Der Gaspreis pro Megawattstunde ist fast dreimal so hoch
  wie im Januar, ungefähr auf dem Stand von Dezember 2022. Sorgt man sich vor diesem
  Hintergrund wegen der hohen Kosten für die Industrie, und zwar nicht nur für Gas,
  sondern durch die „Merit-Order“ auch für Strom? Dazu haben sich meine Kollegen hier
  in der Vergangenheit regelmäßig geäußert. Maßnahmen dazu sind in Vorbereitung. Ich
  habe Ihnen dazu keinen neuen Stand mitzuteilen. Über weitere Preisentwicklungen
  spekuliere ich nicht. Die Preise sind seit Monaten volatil. Das ist bekannt. Das
  beobachten wir natürlich eng. Meine Frage geht an das Finanzministerium und wahrscheinlich
  ergänzend auch an das Familienministerium. Es geht um eine Nachfrage zu einer Nachlieferung,
  die gestern aus dem Finanzministerium kam. Das Thema ist der sogenannte Missbrauchsfonds,
  der am Mittwoch in der Regierungspressekonferenz Thema war. Die Missbrauchsbeauftragte
  hatte beklagt ‑ ich paraphrasiere es ‑, dass in dem Thema nichts vorangehe, man
  den Ball immer hin und herschiebe und am Ende niemand wisse, wer eigentlich die
  Verantwortung trage. Jetzt hieß es aus dem Familienministerium, es werde über ein
  neues Konzept beraten. Herr Rüll, in Ihrer Nachlieferung von gestern aus dem Finanzministerium
  war nicht die Rede von einem neuen Konzept, sondern Sie verwiesen auf das Entschädigungsrecht
  und schrieben, das Familienministerium sei zuständig. Wir sind also wieder bei den
  Bällen angelangt. Daher die Frage: Was ist denn jetzt der Stand der Dinge? Wird
  tatsächlich über ein neues Konzept verhandelt, Herr Rüll, oder ist das Thema für
  Sie eigentlich abgeschlossen? Ich kann gern den Anfang machen, Frau Kollegin. Wir
  haben immer wieder betont ‑ das ist auch der aktuelle Stand ‑, dass wir uns für
  die Fortsetzung des Ergänzenden Hilfesystems einsetzen. Wir haben dazu ein Konzept
  vorgelegt und befinden uns im Gespräch darüber. Was kann das Finanzministerium zu
  diesem Konzept sagen? Zu dem Konzept kann ich nichts sagen. Ich kann sagen, dass
  regierungsinterne Abstimmungen stattfinden. Zu diesen kann ich mich von hier aus
  nicht äußern. Gibt es eine Zeitleiste? Sie sagen, dass Gespräche stattfänden. Gibt
  es einen Zielzeitpunkt? Ich habe dazu keinen Stand, den ich Ihnen hier mitteilen
  könnte. Meine Frage geht an das Umweltministerium. Der langjährige Staatssekretär
  Jochen Flasbarth scheidet im November aus dem Amt aus und wird ab Februar eine neue
  Position bei der European Climate Fondation übernehmen. Das ist ein extrem kurzer
  Übergangszeitraum. Außerdem hat diese Stiftung in der Vergangenheit viele Zuwendungen
  vom Umweltministerium erhalten. Sieht das Ministerium nicht die Gefahr eines Interessenkonfliktes,
  wenn ein Staatssekretär, der zu der Entscheiderebene hinsichtlich Zuwendungen an
  eine Organisation gehört hat, jetzt sehr rasch an die Spitze dieser Organisation
  wechselt? Sie haben gerade betont: viele Zuwendungen vom Bundesumweltministerium. ‑
  In dieser Legislaturperiode hat es eine solche Zuwendung nicht gegeben. Die Zuwendungen
  für die European Climate Foundation kommen auch aus anderen Ministerien. Der Staatssekretär
  war mit Zuwendungen, die es an die European Climate Foundation gab, nie befasst.
  Der Staatssekretär hat, sobald bekannt geworden ist, dass er einen Wechsel vornimmt,
  anhand der Complianceregeln innerhalb des Hauses dafür gesorgt, dass er, sollte
  es in den wenigen Wochen, in denen er noch im Amt verbleibt, irgendwelche Vorgänge
  mit dieser Stiftung geben, damit auf keinen Fall befasst wird. Ab wann wusste der
  Minister von der Wechselabsicht? Hat er seinem Staatssekretär damals nicht empfohlen,
  die Tätigkeit mit sofortiger Wirkung ruhen zu lassen? Sobald bekannt geworden war,
  dass er einen Stellenwechsel vornimmt und dieser dann auch tatsächlich stattfindet,
  hat der Staatssekretär sofort bekannt gegeben, dass er seinen Posten aufgeben wird
  und sich in den einstweiligen Ruhestand versetzen lassen wird. Es gibt jetzt noch
  wenige Wochen, um den Übergang entsprechend zu gestalten, auch hin zu seiner Nachfolgerin.
  Alle anderen Fragen, die sie betreffen, das sind persönliche Angelegenheiten. Ein
  beruflicher Wechsel ist eine persönliche Angelegenheit, die der Staatssekretär hierbei
  selbst vornimmt. Ich habe eine etwas allgemeine Frage zum Thema des hybriden Krieges.
  Es war ja immer wieder Thema in den vergangenen Wochen. Der Kanzler hatte ja einmal
  angekündigt, man wolle diesen Angreifern, den Urhebern dieser Angriffe, Zitat, einen
  Preis auferlegen. Können Sie dazu etwas sagen? Ist man dabei weitergekommen? Wie
  könnte so etwas aussehen? Herr Kollege, ehrlich gesagt tue ich mich gerade schwer,
  die Frage zu verstehen. Sie beziehen sich auf die Ereignisse in Leipzig und das,
  was nach Leipzig passiert ist. Wir haben das attribuiert. Die Ermittlungen strafrechtlicherseits
  laufen. Diesbezüglich habe ich ansonsten, darüber hinaus, keinen neuen Stand, den
  ich Ihnen mitteilen kann. Man ist wahrscheinlich in Definitionsfragen, was es bedeutet,
  einen Preis aufzuerlegen. Aber man könnte ja über anderweitige Sachen nachdenken,
  also das Thema der Schattenflotte oder was auch immer. Vielleicht nähere ich mich
  jetzt mehr dem Verständnis Ihrer Frage. Einen Preis auferlegt ‑ das würde ich einmal
  in Anführungszeichen sagen ‑, das haben wir ja mit der Attribuierung getan. Damit
  sind ja sehr klare Maßnahmen getroffen worden, die dann wiederum auf anderer Seite
  zu Gegenmaßnahmen geführt haben. Ich weiß aber nicht, in welche Richtung Ihre Frage
  sonst zielt. Was die strafrechtliche Verfolgung angeht, laufen die Ermittlungen.
  Damit sind die zuständigen Behörden beschäftigt. Der andere Strang, Sanktionspakete
  ‑ wir haben wieder ein neues Sanktionspaket in der Europäischen Union verabschiedet ‑,
  das läuft ja parallel auch, um den Druck auf Russland maximal hochzuhalten und auszuweiten.
  Sie haben es gerade schon gesagt. Mir wäre es dann auch um den Außenministerrat
  am Montag gegangen. Vielleicht ein Hinweis: Dabei sind mehr als 1600 Personen und
  Entitäten gelistet worden, unter anderem beispielsweise auch Personen und Entitäten,
  die hinter diesen Anschlagsversuchen in Leipzig standen. Es geht ein bisschen weiter
  darüber hinaus. Es geht um die Hackerangriffe auf die Supermärkte in Frankreich.
  Hat die Bundesregierung dazu eigene Erkenntnisse, oder steht man im Austausch mit
  anderen Ländern, die davon betroffen sind? Gibt es einen Verdacht? Wir befinden
  uns natürlich im ständigen Austausch mit unseren Partnern in ganz Europa. Aber zu
  den aktuellen Angriffen kann ich keine weiteren Informationen geben. Ich habe eine
  Frage an das Bildungsministerium. Es wurde gerade im Bundesrat relativ dramatisch
  gesagt, Ihre Ministerin, Frau Prien, sei so ernsthaft erkrankt, dass sie heute Morgen
  das Haus nicht verlassen konnte. Müssen wir uns Sorgen machen? Ich kann Ihnen bestätigen,
  dass sie krank ist. Aber ich glaube nicht, dass Sie sich Sorgen um die Ministerin
  machen müssen. Aber, Herr Kollege, vielen Dank, dass Sie es mit Ihrer Frage dennoch,
  glaube ich, tun. Wir könnten vielleicht auch „unter drei“ gehen. Nein, ich möchte
  dazu nichts weiter sagen. Ich habe eine Frage an Herrn Giese. Die Studentenproteste
  in Albanien eskalieren gerade. Befürchten Sie mit Blick auf die Westbalkankonferenz
  nächste Woche, dass das irgendwie Einfluss hat? Fällt Albanien beim Prozess der
  Annäherung an die EU angesichts der innenpolitischen Krise zurück? Die Konferenz,
  die Sie ansprechen, ist eine Konferenz, glaube ich, die auf der Ebene der Staats-
  und Regierungschefs stattfindet. Was die Frage angeht, wo sich die verschiedenen
  Beitrittskandidaten aus dem westlichen Balkan in ihrer Annäherung an EU-Standards
  befinden, gab es diesbezüglich einen Bericht der Europäischen Kommission. Er ist,
  glaube ich, zu Beginn dieser Woche veröffentlicht worden. Dabei war ganz klar, dass
  Montenegro der „front-runner“ ist, dass sich Albanien sozusagen auch in der Nähe
  auffällt, aber auch noch einiges zu tun ist. Dabei geht es auch um Fragen wie Rechtsstaatlichkeit.
  Das sind ganz klar Aufgaben, die die albanische Regierung erfüllen muss. Ähnliches
  fordert auch die Bevölkerung in Albanien ein, ohne jetzt genau auf die Inhalte dieser
  Demonstrationen eingehen zu wollen. Aber ich glaube, dass ganz klar ist, dass Rechtsstaatlichkeit
  und auch die Verhinderung von Korruption wichtige Benchmarks sind, wenn man der
  Europäischen Union beitreten will. Ich hätte gern das Landwirtschaftsministerium.
  Meine Frage bezieht sich auf die mittelfristige EU-Finanzplanung. Kanzler Merz hat
  ja gefordert, dass etwa 20 Prozent der mittelfristigen Finanzplanung gegenüber dem
  jetzigen Ansatz gekürzt werden müssen. Das wären „round about“ 400 Milliarden Euro
  im Planungszeitraum. Das entspricht ziemlich genau dem Agrarbudget der EU. Ist Ihr
  Haus bereit, aus deutscher Sicht eine signifikante Rückführung bei den vor allem
  Direktzahlungen an Landwirte zu unterstützen? Mir fällt es schwer, im Augenblick
  etwas Konkretes dazu zu sagen, weil die Verhandlungen ja noch laufen. Der Minister
  hat sich in der Vergangenheit ja schon sehr klar dazu geäußert, welchen Stellenwert
  die Landwirtschaft für die Sicherheit mit der Versorgung von Lebensmitteln hat.
  Insofern ist die Position dabei sehr klar. Inhaltlich, dazu, wie es dann am Ende
  finanziell ausgehen wird, laufen ja die Verhandlungen. Dem kann ich hier, von dieser
  Stelle aus, schlecht vorwegreifen. Ja, die Verhandlungen laufen. Gleichwohl ist
  es so, dass zwei Drittel der landwirtschaftlichen Subventionen als Direktzahlungen
  geleistet werden, und „Direktzahlung“ bedeutet eben, dass die Landwirte Geld für
  Fläche erhalten, nicht etwa für das, was darauf produziert wird, sondern einfach
  nur für die Fläche. Das ist eine Systematik, die sozusagen eigentlich keiner gezielten
  Förderung einer bestimmten Nahrungsmittelversorgung dient, sondern schlicht und
  einfach Besitz von Grund und Boden honoriert. Ist der Minister der Meinung, dass
  dieser Ansatz im Zuge möglicher notwendiger Kürzungen reformiert werden soll? Auch
  diesbezüglich hat sich der Minister in der Vergangenheit ja schon relativ häufig
  eingelassen. Es geht also darum, dass man in diesem Modell zwei Säulen hat. Das
  eine sind die Direktzahlungen. Das andere sind sogenannte Ökoleistungen bzw. Leistungen
  für Regionalbudgets und für den ländlichen Raum. Er hat sich klar dafür ausgesprochen,
  dass es beide Säulen braucht. Alles andere, wie gesagt, ist im Augenblick Gegenstand
  der Verhandlungen. Ich habe eine Frage, vielleicht übergreifend, an Herrn Hille,
  hilfsweise an das Umweltministerium und an das Finanzministerium: Was machen die
  Verhandlungen zur Plastiksteuer? Liegt es unmittelbar vor Abschluss der Verhandlungen,
  oder wie weit sind wir dabei? Diesbezüglich würde ich tatsächlich zuständigkeitshalber
  zum BMUKN, auf der linken Seite, von Ihnen aus gesehen rechts, zu Herrn Haufe, schauen.
  Ich kann Ihnen dazu heute noch nichts Neues mitteilen. Die Gespräche innerhalb der
  Regierung werden weiterhin fortgesetzt. Rechnen Sie damit, dass sie noch innerhalb
  dieses Jahres abgeschlossen werden können? Es gibt ja bestimmte Rahmenbedingungen,
  für die die Plastiksteuer wichtig ist. Insofern rechne ich damit, dass diese Gespräche
  weiterhin fortgesetzt werden. Ich kann Ihnen aber jetzt hier keinen genauen Zeitpunkt
  nennen, zu dem die Regierung klar ihr Ergebnis vorlegen wird. (zu Gesprächen über
  die Weiterentwicklung der europäischen CO2-Flottengrenzwerte zwischen Deutschland
  und Frankreich) Vielleicht abschließend noch ein anderer Terminhinweis ‑ ich habe
  es gerade gesehen ‑: Der Bundesumweltminister wird sich jetzt um 13 Uhr im Bundestag
  zur Einigung zwischen Deutschland und Frankreich bezogen auf die CO2-Flottengrenzwerte
  äußern.'
