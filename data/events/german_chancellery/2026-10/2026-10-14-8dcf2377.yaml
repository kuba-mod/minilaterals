title: Regierungserklärung des Kanzlers zum Europäischen Rat „Mühen um gerechte Verhältnisse“
text: 'Deutschland brauche jetzt „schöpferische Anstrengung“, betonte Kanzler Merz
  in seiner Regierungserklärung. Bundeskanzler Friedrich Merz hat seine Regierungserklärung
  zum bevorstehenden Europäischen Rat mit einem Bekenntnis für mehr Gerechtigkeit
  begonnen. Das „Mühen um gerechte Verhältnisse“ stehe im Zentrum seines Regierungshandelns.
  Angesichts von Kriegen und tiefgreifenden Umbrüchen gelte es, sowohl die „Sicherheitslücke“
  als auch die „Gerechtigkeitslücke“ in Deutschland zu schließen. Gerechtigkeit bedeute
  dabei Chancengerechtigkeit, Leistungsgerechtigkeit und Generationengerechtigkeit
  und müsse sich in Reformen bei Rente, Pflege, Arbeitsmarkt und Staatsmodernisierung
  widerspiegeln. Vor Beginn seiner Erklärung hieß der Bundeskanzler den neuen Bundesminister
  für Arbeit und Soziales, Alexander Schweitzer, willkommen und sicherte ihm eine
  vertrauensvolle Zusammenarbeit zu. Zugleich würdigte er die Arbeit seiner Vorgängerin
  Bärbel Bas, die das Amt „mit großer Empathie, vor allem für die Schwachen in unserer
  Gesellschaft“ ausgeübt habe. Merz dankte ihr für ihr Engagement für das Land und
  sprach ihr nach ihrem Rücktritt aus persönlichen Gründen das Mitgefühl der Bundesregierung
  aus. Unmittelbar vor Beginn des Europäischen Rates warb Bundeskanzler Merz für entschlossene
  Reformen und eine enge Abstimmung mit den europäischen Partnern bei den Verhandlungen
  über den nächsten Mehrjährigen Finanzrahmen. Die Gespräche über den künftigen EU
  -Haushalt seien nun in der „entscheidenden Phase“. Angesichts begrenzter finanzieller
  Mittel sprach sich Merz für eine klare Prioritätensetzung aus. Für die Bundesregierung
  stehe dabei fest: „Wir müssen dort investieren, wo sich die Zukunft Europas entscheidet,
  in unsere Sicherheit und in unsere Wettbewerbsfähigkeit“, so der Bundeskanzler.
  Der Bundeskanzler forderte einen entschlossenen Bürokratieabbau und die Vollendung
  des europäischen Binnenmarkts, um Europas Wettbewerbsfähigkeit zu stärken. Investitionen
  müssten insbesondere in Zukunftstechnologien fließen. Zudem sprach er sich dafür
  aus, alle Regeln, die Investitionen verhindern würden, vorübergehend auszusetzen
  und die „ EU -Bürokratiebremse“ zu ziehen. Neue Handelspartnerschaften seien für
  die Bundesregierung ein zentraler Baustein, um Europas Wettbewerbsfähigkeit zu stärken,
  Abhängigkeiten zu verringern und neue Märkte zu erschließen, so Merz. Dabei verwies
  der Bundeskanzler auf die strategische Bedeutung der aktuellen Entwicklungen: „Die
  geoökonomische Infrastruktur und die geopolitische Ordnung des 21. Jahrhunderts
  entsteht voraussichtlich in diesen Monaten, in diesen Jahren.“ Zugleich sprach er
  sich für eine entschlossene europäische Antwort auf unfaire Handelspraktiken aus
  und betonte die Chancen einer engeren internationalen Zusammenarbeit. Es gebe positive
  wirtschaftliche Entwicklungen und steigende Investitionen. Dennoch rief Bundeskanzler
  Merz zu gemeinsamen Anstrengungen auf, um Deutschlands und Europas Zukunft zu sichern.
  Mit Verweis auf Robert Schuman betonte er: „Der Friede der Welt kann nicht gewahrt
  werden ohne schöpferische Anstrengungen, die der Größe der Bedrohung entsprechen.“
  Diese „schöpferische Anstrengung ist es, was wir alle zusammen in unserem Land jetzt
  brauchen“, sagte Merz mit Blick auf Reformen, den Kampf gegen Extremismus und die
  Herausforderungen für Europa. Die Stärkung von Sicherheit und Freiheit in Europa
  sei ein zentrales Anliegen der Bundesregierung, betonte Merz. Ziel sei es, „eine
  neue europäische und transatlantische Friedens- und Freiheitsordnung zu schaffen“
  und damit ein freies und sicheres Europa zu gewährleisten. Bundeskanzler Merz verteidigte
  die Unterstützung der Ukraine und betonte die Bedeutung von Investitionen in die
  Verteidigungsfähigkeit. Zugleich warnte er: „Wir sehen, dass die Eskalationsbereitschaft
  Russlands steigt.“ Politik verstehe die Bundesregierung als Verantwortung „für alle
  Menschen in unserem Land“, um Sicherheit, Wohlstand und staatliche Handlungsfähigkeit
  dauerhaft zu sichern.'
