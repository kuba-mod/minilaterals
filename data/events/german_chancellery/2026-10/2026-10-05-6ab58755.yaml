date: '2026-10-05'
type: press_release
source_name: german_chancellery
title: Pressekonferenz von Bundeskanzler Merz und dem Ministerpräsidenten Litauens,
  Sinkevičius „Die Sicherheit des Baltikums ist die Sicherheit Deutschlands“
text: '2027 übernimmt Litauen die EU-Ratspräsidentschaft. „Damit ist besondere Verantwortung
  für ganz Europa verbunden“, betonte Bundeskanzler Merz. Bundeskanzler Merz hat den
  litauischen Ministerpräsidenten Sinkevičius mit militärischen Ehren im Bundeskanzleramt
  empfangen. Über ihren Austausch im Rahmen eines Arbeitsbesuchs informierten die
  beiden Regierungschefs in einer gemeinsamen Pressekonferenz. Gleich zu Beginn unterstrich
  der Bundeskanzler, wie wichtig die Sicherheit des Baltikums für die Sicherheit Deutschlands
  sei. Über die Lage in der Ukraine und deren weitere Unterstützung sprachen die beiden
  Regierungschefs anlässlich der gerade zurückliegenden Reise des Bundeskanzlers nach
  Kyjiw . Angesichts der bevorstehenden EU-Ratspräsidentschaft Litauens begrüßte Merz
  die angekündigte Prioritätensetzung auf Sicherheit, Verteidigung und EU -Wettbewerbsfähigkeit.
  Meine Damen und Herren, ich heiße Sie herzlich willkommen. Ein ganz besonders herzliches
  Willkommen dem noch – man kann es so sagen – neu im Amt befindlichen litauischen
  Ministerpräsidenten Mindaugas Sinkevičius . Herzlich willkommen in Berlin, zum ersten
  Mal im Kanzleramt, zum ersten Mal auch in der Funktion als Premierminister! Unsere
  beiden Länder verbindet eine enge Freundschaft und Partnerschaft. Ich habe bei meinem
  Besuch in Vilnius, der ganz früh, zu Beginn meiner Kanzlerschaft stattgefunden hat,
  bei der Gelegenheit, zu der wir begonnen haben, eine ganze Brigade in Vilnius aufzustellen,
  gesagt: Die Sicherheit des Baltikums ist die Sicherheit Deutschlands, und die Sicherheit
  von Berlin wird auch in Vilnius verteidigt. Wir handeln entsprechend. Bis Ende 2027
  werden wir die deutsche Litauenbrigade in Vilnius vollständig aufgestellt haben.
  Es ist das erste Mal, dass Deutschland einen militärischen Großverband außerhalb
  des eigenen Territoriums dauerhaft aufstellt. Das zeigt, dass wir unsere Solidarität
  in der NATO ernst nehmen. Vielen Dank, lieber Mindaugas , dass Litauen ebenfalls
  vorbildlich seinen Beitrag leistet und dass die Brigade dort auf eine sehr große
  Gastfreundschaft gestoßen ist. Ich hatte die Gelegenheit, verschiedentlich mit Soldatinnen
  und Soldaten zu sprechen, die dort stationiert sind, nicht zuletzt bei dem Aufstellungsappell
  im vergangenen Jahr. Ich habe dort eine sehr große Zustimmung zu der Aufnahmebereitschaft
  des Landes vorgefunden und eine große Begeisterung, in Vilnius stationiert zu sein.
  Ich habe in der letzten Woche mit dem NATO -Generalsekretär Mark Rutte und unserem
  niederländischen Amtskollegen Rob Jetten das Deutsch-Niederländisches Corps in Münster
  besucht. Auch in diesem Rahmen sichern wir die Ostflanke der NATO und besonders
  das Baltikum, denn das ist seit dem Sommer dieses Jahres auch Teil des Auftrags,
  den das Deutsch-Niederländisches Corps in Münster wahrnimmt. Wir tun das alles,
  um Russland glaubwürdig abzuschrecken. Moskau testet uns mit immer schärferen hybriden
  Angriffen, hier in Deutschland genauso wie in Litauen. Russlands Ziel ist eindeutig,
  uns in unserer Hilfe für die Ukraine zu beeinträchtigen. Sein Ziel ist auch, die
  NATO zu verunsichern und zu spalten. Genau das werden wir nicht zulassen. Wir stehen
  fest, und wir stehen zusammen. Wir stimmen uns eng ab, um diese hybriden Angriffe
  gemeinsam abzuwehren und wenn nötig klar und stark zu antworten. Wir stärken deshalb
  gemeinsam auch unsere Cyberabwehr, unsere Streitkräfte und unsere Verteidigungsindustrie.
  Innerhalb der Resilienzinitiative bekämpfen wir Propaganda und Desinformation aus
  Russland. Wir beide haben auch über meine gestrige Reise nach Kyjiw gesprochen.
  Russland muss nach bald fünf Jahren diesen Krieg nun wirklich endlich beenden und
  in Friedensverhandlungen eintreten. Wir arbeiten hart dafür, dass solche Verhandlungen
  auch möglichst bald zustande kommen. Die Ukraine und die Europäer müssen dabei am
  Tisch sitzen. Unser Ziel ist eine souveräne Ukraine in einem sicheren Europa. Solange
  Russland aber nur die Sprache der Stärke versteht, setzen wir unsere Unterstützung
  der Ukraine fort, gemeinsam mit Litauen, das übrigens pro Kopf der stärkste Unterstützer
  der Ukraine ist. In absoluten Zahlen sind wir es. Aber pro Kopf ist Litauen der
  größte Unterstützer der Ukraine. Wir tun das mit Litauen und anderen Partnern zusammen.
  Ich will es noch einmal wiederholen – ich tue es immer wieder und so auch heute
  –: Diese Hilfe dient nicht dazu, den Krieg zu verlängern. Diese Hilfe dient dazu,
  Moskau an den Verhandlungstisch zu bringen. Das Ganze wird durch die Ratspräsidentschaft
  Litauens ab dem Januar des nächsten Jahres für ein halbes Jahr begleitet. Damit
  ist dann eine besondere Verantwortung für ganz Europa verbunden. Wir haben darüber
  gerade gesprochen. Ich habe auch der litauischen Regierung unsere volle Unterstützung
  bei der Aufgabe zugesagt. Ich will ausdrücklich den Fokus dieser Ratspräsidentschaft
  auf Sicherheit und Verteidigung und auf die Wettbewerbsfähigkeit der Europäischen
  Union begrüßen. Damit setzt Litauen etwas fort, was die gegenwärtige irische Ratspräsidentschaft,
  wie ich finde, sehr erfolgreich in Europa tut. Wir wollen schnelle Fortschritte
  bei der Umsetzung des Programms „Ein Europa, ein Markt“ – Sie erinnern sich, wir
  haben einen Fahrplan dafür aufgestellt – und beim Abbau europäischer Bürokratie.
  Wir haben das im Februar in Alden Biesen verabredet. Wir haben das mit einem konkreten
  Fahrplan für die beiden Jahre 2026 und 2027 unterlegt. Wir brauchen gerade jetzt
  eine Europäische Union, die einig und handlungsfähig ist. Deutschland wird seinen
  Beitrag dafür leisten. Wir tun das im eigenen Interesse. Denn der Binnenmarkt ist
  für uns einer der wesentlichen Pfeiler unserer Wirtschaftspolitik und auch unseres
  Wohlstandes. Wir werden über den Mehrjährigen Finanzrahmen sprechen müssen, weil
  wir ab 2028 einen neuen Finanzrahmen brauchen. Keinen neuen Finanzrahmen zu haben,
  ist für Deutschland die finanziell mit Abstand günstigste Lösung. Aber wir wollen
  sie nicht. Denn das würde die Handlungsfähigkeit Europas nach außen und nach innen
  stark einschränken. Wir wollen nicht, dass ein solches Szenario eintritt. Deswegen
  ist es der feste Wille der Bundesregierung und auch mein fester Wille, die Verhandlungen,
  wenn eben möglich, bis zum Ende des laufenden Jahres abzuschließen. Unter litauischer
  Ratspräsidentschaft wird es dann darum gehen, eine Einigung in den einzelnen Programmen
  der Europäischen Union umzusetzen. Ich freue mich also auf diese gemeinsame Arbeit,
  auf die Arbeit für Freiheit, für Sicherheit und für Wohlstand in Europa. Vielen
  Dank noch einmal dir, lieber Mindaugas, für deinen Besuch heute in Berlin! Ich will
  die Gelegenheit nutzen, einem Nachbarn, nämlich dem lettischen Amtskollegen, Ministerpräsidenten
  Andris Kulbergs , der vor einigen Tagen hier in Berlin war, zu seinem beeindruckenden
  Wahlsieg gestern zu gratulieren. Ich freue mich darauf, dass ich auch mit diesem
  Land und dem wiedergewählten Ministerpräsidenten die exzellente außen- und europapolitische
  Arbeit fortsetzen kann. Sie sehen, wir haben eine enge und gute Kooperation mit
  den baltischen Staaten. Deswegen noch einmal herzlich willkommen dem an Amtsmonaten
  noch jungen Ministerpräsidenten unseres Nachbarn Litauen! Herzlich willkommen! Sehr
  geehrter Herr Bundeskanzler, lieber Friedrich, als Erstes möchte ich mich natürlich
  für den herzlichen Empfang und für das offene und freundschaftliche Gespräch bedanken.
  Ich möchte Ihnen und allen Menschen in Deutschland zum Tag der Deutschen Einheit
  gratulieren. Unser heutiges Treffen zeigt noch einmal, wie eng und fest die deutsch-litauische
  Partnerschaft geworden ist. Wir sind nicht nur Verbündete. Unseren Ländern wird
  immer stärker bewusst, dass unsere Sicherheit und unsere Zukunft gemeinsam sind.
  Herr Bundeskanzler hat die Worte erwähnt, die er in Litauen gesagt hat. Er hat gesagt:
  Die Sicherheit Litauens ist auch unsere Sicherheit. Der Schutz von Vilnius ist der
  Schutz von Berlin. – Ich möchte sagen, dass die Litauer, auch die litauische Regierung
  und ich persönlich, offen sagen können, dass wir Deutschland vertrauen. Sie können
  aber auch mit dem Vertrauen der litauischen Seite rechnen. Litauen schätzt natürlich
  sehr, was Deutschland geleistet hat. Auch wir kümmern uns um unsere Verteidigung.
  Wir haben der Verteidigung in diesem Jahr ein Rekordbudget zugeteilt, 5,38 Prozent
  des BIP . Das sind ca. 4,8 Milliarden Euro. Wir bauen eine Nationaldivision auf
  und verstärken die Luft- und Raketenabwehr. Wir investieren in die Kompetenzen in
  der Drohnenabwehr und in andere kritische Fähigkeiten. Wir haben auch über die Ukraine
  gesprochen. Russland bleibt immer noch die wichtigste Bedrohung für die euroatlantische
  Sicherheit. Wir beobachten zunehmend aggressivere Vorgehensweisen. Deshalb müssen
  wir unsere Unterstützung noch erhöhen. Ich bedanke mich für Ihre Führungsrolle,
  Herr Bundeskanzler. Herzlichen Dank! Zudem muss Europa immer mehr Verantwortung
  für seine Verteidigung übernehmen. Wir tun alles Mögliche, um die langfristige Unterstützung
  der kämpfenden Ukraine zu gewährleisten. Wir haben auch über weitere Themen gesprochen.
  Wir werden die Ratspräsidentschaft übernehmen, und zwar in einer sehr komplizierten
  Zeit für Europa. Unsere Prioritäten sind klar: ein sicheres, resilienteres und wettbewerbsfähigeres
  Europa, welches fähig ist, sich selbst zu verteidigen und zu handeln. Dafür brauchen
  wir ein starkes Deutschland und eine enge deutsch-litauische Zusammenarbeit. Ich
  denke, dass unsere Zusammenarbeit, unsere Partnerschaft längst die Grenzen einer
  reinen Sicherheitspolitik überschritten hat. Denn Deutschland ist einer der wichtigsten
  Wirtschaftspartner Litauens und der größte ausländische Investor. Wir freuen uns
  ganz besonders über den Zuwachs unserer militärisch-industriellen Zusammenarbeit.
  Als Beispiel kann ich das Rheinmetallwerk in Baisogala erwähnen. Ungeachtet dessen
  möchten wir weiter fortschreiten. Dazu möchte ich die deutsch-litauischen Verbindungen
  auf einer anderen Ebene erwähnen. Das ist nicht nur die Brigade, das sind nicht
  nur Verteidigungsmaßnahmen, das sind auch unsere Menschen. Daher möchten wir mehr
  deutsche Sprache in Litauen, mehr akademischen kulturellen Jugendaustausch. Sehr
  geehrter Herr Bundeskanzler, lieber Friedrich, ich freue mich sehr, dass ich ein
  sehr gutes Gefühl mitnehme. Litauen und Deutschland schauen in die gleiche Richtung.
  Wir möchten ein starkes Europa, wir möchten eine starke NATO , und wir möchten,
  dass die Ukraine Frieden gewinnt, und zwar auf der Grundlage ihrer Souveränität
  und territorialen Integrität. Wir wollen auch, dass sich unsere Menschen in ihrem
  Zuhause sicher fühlen können. Litauen kann sich, wie ich bereits erwähnt habe, auf
  Deutschland verlassen, und ‑ das möchte ich ganz deutlich sagen – Deutschland kann
  sich auf Litauen verlassen. Vielen Dank für Ihre Freundschaft, für Ihre Führungsrolle
  und das sehr gute heutige Gespräch. Frage : Herr Bundeskanzler, Sie werden auch
  über den EU -Gipfel nächste Woche sprechen; das hatten Sie angedeutet. Dort wird
  ein Thema die Handelspolitik sein. Gerade haben Sie mit Herrn Macron zusammen einen
  Brief an die EU -Kommission geschrieben, in dem Sie ein neues Instrument zur Abwehr
  unfairen Handels vorgeschlagen haben. Sie haben ein Land nicht erwähnt, nämlich
  China. Warum vermeiden Sie das? Viele von den Handelskonflikten sind ja mit diesem
  Land verbunden. Sind Sie jetzt eigentlich auch für EU -Sanktionen oder Importzölle
  auf chinesische Hybridautos, wie das viele fordern? Eine kurze Nachfrage an den
  litauischen Ministerpräsidenten zum finanziellen Finanzrahmen: Streben Sie auch
  an und sind Sie optimistisch, dass bis Jahresende eine Einigung gelingt? Oder richten
  Sie sich schon darauf ein, dass Sie notfalls doch Anfang nächsten Jahres übernehmen
  müssen? Bundeskanzler Friedrich Merz : Vielen Dank. Emmanuel Macron und ich haben
  in der Tat diesen Brief geschrieben, weil wir uns seit vielen Monaten um die gemeinsamen
  Themen und die gemeinsamen Herausforderungen kümmern, die wir in der Handelspolitik
  auf der Welt erleben. Der Brief ist ganz bewusst agnostisch gehalten. Wir adressieren
  kein individuelles Land, sondern wir beschreiben die Möglichkeiten, die wir haben,
  um uns in der Handelspolitik gegen unfaire Handelspraktiken zur Wehr zu setzen.
  Das betrifft ja den Umgang mit mehreren Ländern auf der Welt. Wir wollen zunächst
  einmal sehr abstrakt mit der EU -Kommission das Instrumentarium schärfen, das wir
  in der Europäischen Union haben, und wir wollen vor allen Dingen die EU -Kommission
  in die Lage versetzen, wenn es notwendig ist, schnell zu handeln. Der Nachteil der
  europäischen Handelspolitik in den letzten Jahren war immer, dass die Entscheidungsprozesse
  zu lange gedauert haben. Uns geht es darum, der Kommission ein Instrument in die
  Hand zu geben, mit dem sie schnell reagieren kann, natürlich jederzeit durch den
  Europäischen Rat kontrolliert, damit eine Entscheidung möglichst schnell getroffen
  werden kann, wenn die handelspolitischen Herausforderungen es erfordern. Um die
  Diskussion geht es in der nächsten Woche. Zusatzfrage : Und die EU -Sanktionen auf
  Hybridautos? Bundeskanzler Merz : Noch einmal: Es geht nicht um ein konkretes Land,
  sondern es geht hier um unsere Interessen im globalen Handel. Da kann sich angesprochen
  fühlen, wer will. Wir sehen aber, dass wir von unfairen Handelspraktiken massiv
  betroffen sind, und wir wollen uns dagegen auch in Europa gemeinsam zur Wehr setzen.
  Ministerpräsident Mindaugas Sinkevičius : Ich wünschte mir als Regierungschef, dass
  wir diese Fragen des Mehrjährigen Finanzrahmens nicht übernehmen müssen, sondern
  dass die Verhandlungen während der irischen Ratspräsidentschaft abgeschlossen werden.
  Ich war letzte Woche in Brüssel und habe mit Frau von der Leyen sowie mit der Vorsitzenden
  des Europäischen Parlaments gesprochen, und ich habe nach diesen Gesprächen diesbezüglich
  weniger Optimismus nach Litauen mitgenommen. Insofern denke ich, dass diese Verhandlungen
  nicht sehr einfach sein werden. Es gibt sehr viele auseinandergehende Positionen:
  Es gibt Mitgliedstaaten, die möchten, dass ein höheres Budget vorgesehen wird, es
  gibt Länder, die weniger zahlen möchten, und jedes Land hat seine Argumente dafür.
  Deshalb denke ich, dass diese Verhandlungen nicht einfach sein werden. Ich würde
  mich natürlich sehr freuen, wenn sie abgeschlossen werden. Das wäre eine gute Weihnachtsbotschaft
  oder Vorweihnachtsbotschaft. Wenn diese Verhandlungen nicht abgeschlossen würden,
  würden wir dadurch auch politische Gefahren sehen. Es stehen sehr viele Wahlen bevor,
  und die können noch mehr Herausforderungen mit sich bringen. Insofern: Es ist kein
  einfacher Prozess. Ich wünsche mir und allen, dass diese Verhandlungen abgeschlossen
  werden. Litauen ist aber bereit, diese Fragen in seiner Ratspräsidentschaft zu übernehmen,
  falls die Verhandlungen nicht abgeschlossen werden. Frage : Der Präsident des BND
  hat heute gesagt, Deutschland sei in Gefahr, in einen gewaltsamen Konflikt mit Russland
  zu geraten. An Sie beide: Teilen Sie diese Einschätzung? Wie groß ist diese Gefahr?
  Dann noch eine Frage zum Thema Energiesicherheit: Die jemenitische Regierung sagt,
  sie habe nun Kontrolle über die Bab-al-Mandab-Straße zurückerlangt. Wie viel Erleichterung
  erhoffen Sie sich da beim Thema Energiesicherheit, aber auch bei den Energiepreisen?
  Bundeskanzler Merz: Sie wissen, dass wir auf allen denkbaren Ebenen darum bemüht
  sind, unseren Beitrag zu leisten, um den Konflikt im Mittleren Osten um die sicheren
  Handelswege zu beenden. Wenn es heute solche Nachrichten gibt, dann ist das vielleicht
  ein Grund zu vorsichtigem Optimismus, aber mehr ist es auch nicht. Vor allen Dingen
  die Straße von Hormus muss wieder dauerhaft geöffnet werden, auch ohne dass dort
  Zölle erhoben werden. Wir sind von einer Lösung des Problems also offensichtlich
  noch entfernt. Es gibt immer wieder auch Anlass zur Hoffnung. Sie wissen, dass ich
  am Freitag der letzten Woche im Rahmen der G7 eine Videokonferenz mit Präsident
  Trump hatte. Bei dieser Videokonferenz haben wir auch über dieses Thema noch einmal
  gesprochen. Wir tun auf der europäischen Seite und auch seitens der deutschen Bundesregierung
  – der Außenminister, der Verteidigungsminister ‑ alles, um diesen Konflikt so schnell
  wie möglich zu beenden; denn wir spüren die Auswirkungen massiv auch in den Energiepreisen.
  Ich habe in der letzten Woche auch in meiner Rede in Münster anlässlich der Verleihung
  des Preises des Westfälischen Friedens an die NATO darauf hingewiesen, dass sich
  die Angriffe aus Russland längst nicht mehr nur auf die Ukraine beschränken, sondern
  dass wir täglich auch selbst Ziel und Opfer dieser Angriffe sind. Russland hat eine
  Politik des Expansionismus und des Revisionismus nicht nur begonnen, sondern in
  den letzten Monaten massiv verschärft. Das richtet sich gegen die baltischen Staaten,
  die auch ein ganz anderes Bedrohungsgefühl haben als unsere Bevölkerung. Deswegen
  habe ich in der letzten Woche so eindringlich darauf hingewiesen, wie wir die Bedrohungslage
  einschätzen. Der BND -Präsident hat das heute Morgen im Rahmen der einmal jährlich
  stattfindenden öffentlichen Sitzung des Parlamentarischen Kontrollgremiums ebenfalls
  getan. Das sind Dinge, die unsere Bevölkerung wissen muss. Ich will aber hinzufügen:
  Moskau testet uns, nicht nur durch solche hybriden Angriffe, sondern auch durch
  die Propaganda, die Moskau in Deutschland und anderen Ländern Europas verbreitet,
  unterstützt auch durch extreme Parteien, die sich hier zum Sprachrohr Moskaus machen.
  Aber unsere Botschaft ist sehr klar, sehr eindeutig: Wir lassen uns weder einschüchtern
  noch spalten. Wir werden uns zur Wehr setzen. Wir sind bereit, uns zu verteidigen.
  Deswegen unternehmen wir all diese Anstrengungen. Auch das, was ich gestern in Kyjiw
  gesagt habe, bleibt in Berlin richtig: Wir helfen der Ukraine, um eine dauerhafte
  politische Freiheits- und Friedensordnung auch für uns in Deutschland, in ganz Europa
  zu ermöglichen. Deshalb bleibt es richtig, dass wir die Ukraine unterstützen und
  dass wir auch klar und eindeutig auf Angriffe aus Russland antworten, wie wir sie
  zum Beispiel am 4. August erlebt haben, als der Leipziger Flughafen mit einer Drohne
  angegriffen wurde, die mit Sprengstoff beladen war, und als wir ganz offensichtlich
  sehr viel Glück gehabt haben, dass es hier nicht zu einem größeren Schaden und vor
  allem, Gott sei Dank, nicht zu Opfern unter der Bevölkerung, unter den Mitarbeiterinnen
  und Mitarbeitern des Flughafens gekommen ist. Aber wir nehmen diese Gefahr schon
  sehr ernst. Wir reagieren darauf, und wir verteidigen uns dagegen. Ministerpräsident
  Sinkevičius : Das Regime in Russland, ungeachtet der gesamten Sanktionen, bleibt
  erhalten. Es hat seine Wirtschaft umstrukturiert. Es ist klar, dass das Regime in
  Russland alles auf eine Karte setzt, auf den Wohlstand und den Frieden seiner Bürger,
  um seine imperialistischen Ziele zu verfolgen. Dieses Regime bleibt aufrechterhalten,
  aber wir sehen auch, wie es anfängt zu bröckeln. Als ein EU -Land sind wir ein friedliches
  Land, und wir müssen zeigen, dass wir zur Abwehr bereit sind. Wir müssen uns natürlich
  auch vorbereiten, und das machen wir. Auch als Nationalstaat, als Partner sowie
  als NATO -Mitgliedstaat handeln wir ruhig. Möglicherweise sprechen wir nicht so
  viel, aber wir machen unsere Hausaufgaben. Wir finanzieren mit unserem Steuergeld
  alle Abschreckungsmaßnahmen. Diese hybriden Gefahren werden wohl nicht verschwinden,
  solange wir keinen Frieden in der Ukraine haben, und es ist offensichtlich, dass
  Russland noch keine Gesten zeigt, an den Verhandlungstisch zu kommen. Wir müssen
  unsere Einigkeit stärken, die Ukraine unterstützen, und wir müssen uns auf alle
  Szenarien vorbereiten, auch wenn wir uns diese Szenarien nicht wünschen. Aber es
  ist sehr wichtig, dass wir die Sicherheit unserer Länder schützen.'
