date: '2026-10-02'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 2. Oktober 2026
text: '(Vorsitzende Küfner eröffnet die Pressekonferenz und begrüßt SS Hille sowie
  die Sprecherinnen und Sprecher der Ministerien.) Einen schönen guten Tag auch von
  mir ‑ schön, Sie zu sehen. Es ist Freitag, und das bringt mit sich, dass ich Ihnen
  einen Blick auf die Termine des Bundeskanzlers für die kommende Woche geben kann.
  Gleich morgen geht es los ‑ das nur als Reminder; das haben wir schon in der vergangenen
  Woche angekündigt ‑; denn da feiern wir alle den Tag der Deutschen Einheit , dieses
  Jahr in Bremen . Dort wird der Bundeskanzler beim ökumenischen Gottesdienst wie
  auch beim folgenden Festakt mit dabei sein. Falls der eine oder andere von Ihnen
  noch keine Pläne fürs Wochenende hat, kommen Sie gerne nach Bremen und feiern mit
  uns das große deutsche Demokratiefest am Tag der Einheit. Es lohnt sich. Am Montag,
  dem 5. Oktober, wird der Bundeskanzler ab 9.30 Uhr das Friedrich-Spee-Gymnasium
  in Rüthen besuchen. Der Besuch geht auf eine Einladung der Schule im Rahmen ihres
  100-jährigen Jubiläums zurück. Der Bundeskanzler hat an der Schule sein Abitur gemacht
  und ist dort als Ehemaliger eingeladen. Kern des Besuchs ist ein Podiumsgespräch
  in der Reihe „Ehemalige erzählen“ mit Schülerinnen und Schülern. Es wird bei diesem
  Podiumsgespräch die Möglichkeit für Auftaktbilder geben. Am Montagnachmittag empfängt
  der Bundeskanzler um 16 Uhr den litauischen Ministerpräsidenten Mindaugas Sinkevičius
  mit militärischen Ehren im Bundeskanzleramt. Das Treffen findet im Rahmen eines
  zweitägigen Arbeitsbesuchs von Herrn Sinkevičius in Berlin statt. Im Zentrum der
  Gespräche stehen Fragen der Sicherheit, insbesondere mit Blick auf hybride Bedrohungen,
  die Stärkung der NATO-Ostflanke sowie der Aufbau der deutschen Brigade in Litauen.
  Zudem werden Themen der bevorstehenden EU-Ratspräsidentschaft besprochen. Litauen
  übernimmt nämlich von Januar 2027 bis Juni 2027 die Ratspräsidentschaft. Wir unterstützen
  die litauischen Prioritäten von Sicherheit und Verteidigung sowie Wettbewerbsfähigkeit.
  Im Anschluss an das Treffen ist für ca. 17 Uhr eine gemeinsame Pressekonferenz vorgesehen.
  Am Dienstag, dem 6. Oktober, trifft der Bundeskanzler mit den Präsidenten und Hauptgeschäftsführern
  der Spitzenverbände der Wirtschaft im Bundeskanzleramt zusammen. An dem Gespräch
  werden die Präsidenten und Hauptgeschäftsführer der Deutschen Industrie- und Handelskammer,
  des Zentralverbandes des Deutschen Handwerks, des Bundesverbandes der Deutschen
  Industrie und der Bundesvereinigung der Deutschen Arbeitgeberverbände teilnehmen.
  Das Gespräch beginnt um 12.30 Uhr. Dieser Termin ist nicht presseöffentlich. Am
  Mittwoch, dem 7. Oktober, findet vormittags wie üblich um 10 Uhr die Sitzung des
  Bundeskabinetts unter Leitung des Bundeskanzlers statt. Am frühen Nachmittag nimmt
  der Bundeskanzler dann in Berlin an der Jubiläumsveranstaltung zu 80 Jahren „Handelsblatt“
  und 100 Jahren „WirtschaftsWoche“ teil. Der sogenannte Deutschlandgipfel bringt
  führende Entscheiderinnen und Entscheider aus Wirtschaft und Politik zusammen. Der
  Kanzler wird dort gegen 14.20 Uhr eine Keynote zur Lage unseres Landes halten. Anschließend
  nimmt der Bundeskanzler an einer Diskussionsrunde mit den Chefredakteuren von „Handelsblatt“
  und „WirtschaftsWoche“ teil. Am Donnerstag, dem 8. Oktober, empfängt der Bundeskanzler
  den Premierminister des Vereinigten Königsreichs Großbritannien und Nordirland ,
  Andrew Burnham, um 12.30 Uhr mit militärischen Ehren zu dessen Antrittsbesuch im
  Bundeskanzleramt. Bei den Gesprächen werden voraussichtlich bilaterale und außenpolitische
  Themen sowie europa- und wirtschaftspolitische Themen im Mittelpunkt stehen. Bundeskanzler
  Merz und Premierminister Burnham treffen sich auch mit Schülerinnen und Schülern
  eines Englisch-Leistungskurses des Paul-Na rt op-Gymnasiums in Berlin zu einem Gespräch.
  Anschließend erfolgt der feierliche Austausch der Urkunden des deutsch-britischen
  Kensington-Vertrages. Damit tritt der deutsch-britische Freundschaftsvertrag in
  Kraft, der die bilateralen Beziehungen unserer beiden Länder noch weiter vertieft.
  Die beiden Regierungschefs nehmen zudem an einem regionalen Wirtschaftsforum mit
  deutschen und britischen Unternehmen teil, um sich zu regionaler Wirtschaftsförderung
  und Innovation auszutauschen. Soweit der Blick auf die Termine in der kommenden
  Woche. (zum Besuch des Friedrich-Spee-Gymnasiums in Rüthen ) Herr Hille, der Bundeskanzler
  hat bisher seinen Abischnitt noch nicht verraten. Wird er das dann bei Gelegenheit
  tun? Wie das so ist mit Terminen, die in der Zukunft liegen, kann ich nicht in die
  Glaskugel schauen. Es kann sein, dass er das mit den Schülerinnen und Schülern bespricht,
  es kann aber auch sein, dass das nicht geschieht. Ich habe das hier heute nicht
  zu verkünden. (zum Besuch des Ministerpräsidenten der Republik Litauen ) Frau Jenning,
  ich möchte nur noch einmal nach dem aktuellen Stand bei der Auffüllung der deutschen
  Brigade in Litauen fragen. Können Sie uns anlässlich des Besuchs vielleicht die
  aktuellsten Zahlen nennen? Wie viele Soldaten und Soldatinnen wurden mittlerweile
  gefunden und wie groß ist der Bedarf noch? Wie Sie wissen und wie wir auch schon
  breit kommuniziert haben, liegen wir derzeit bei einem Besetzungsstand von rund
  60 Prozent der vollständigen Besetzung, die die Brigade Ende des Jahres erreicht
  haben soll. Was die aktuelle Lage anbelangt, so sind wir bei rund 92 Prozent, die
  im Moment vor Ort tatsächlich schon besetzt sind. Entschuldigung, das mit den 60
  und 92 Prozent habe ich jetzt nicht verstanden. Was ist jetzt und was ist Ende des
  Jahres? Sind wir jetzt bei 92 oder bei 60 Prozent? Weil ich auch eine falsche Zahl
  genannt habe, machen wir es jetzt noch einmal ganz geordnet: Mit Blick auf Ende
  des Jahres 2027 ‑ die Absicht ist ja, dass die Brigade bis dahin vollständig aufgestellt
  ist ‑ sind wir im Moment bei einem Besetzungsstand von 80 Prozent. Wenn wir jetzt
  schon ins kommende Jahr schauen, wissen wir also, dass diese Plätze, diese Dienstposten
  schon besetzt sind. Was die Besetzung betrifft, die wir aktuell vor Ort haben, sind
  wir bei einem Besetzungsstand von rund 92 Prozent. Weil ich noch immer fragende
  Gesichter sehe: Wenn wir uns anschauen, was jetzt vor Ort in Litauen sein soll,
  haben wir einen Besetzungsstand von rund 92 Prozent. Wenn wir auf den Planungshorizont
  schauen, also wie es im Moment aussieht, wenn wir den Blick auf Ende 2027 richten,
  dann haben wir jetzt einen Stand von 80 Prozent. Ich glaube, so habe ich es jetzt
  richtig aufgedröselt. Frau Jenning, nur damit ich das richtig verstehe: Der Besetzungsstand
  Ende 2027 ist die Zielgröße, auf die Sie sich bezogen haben, als Sie gesagt haben,
  dass Sie jetzt bei 80 Prozent sind, korrekt? Genau. Bezogen auf den Stand, wo wir
  jetzt schon fest wissen, dass diese Personen dann dort sein werden, liegen wir bei
  80 Prozent. Sind da dann auch schon diejenigen mit inkludiert ‑ über die zuletzt
  relativ viel gesprochen wurde ‑, die sich nicht freiwillig gemeldet haben? Nein.
  Das ist tatsächlich genau die Reaktion, die wir aufgrund dieser Besetzungslage jetzt
  angeregt haben. Die sind noch nicht Teil von diesen 80 Prozent. Herr Hille, vielleicht
  können Sie im Zusammenhang mit dem Besuch des britischen Premierministers noch einmal
  sagen, wie die Haltung des Bundeskanzlers zu den Vorstellungen ist, die Herr Burnham
  jetzt im Hinblick auf die EU bekanntgegeben hat. Er hat ja nicht ausgeschlossen,
  dass Großbritannien der EU wieder beitreten könnte. Ist das eine Perspektive, die
  der Bundeskanzler als begrüßenswert ansieht? Ich glaube, es ist allen klar ‑ ansonsten
  sage ich es auch gerne noch einmal ‑, wie wichtig und gut die Beziehungen zwischen
  Deutschland und Großbritannien sind und wie sehr wir es rückblickend bedauert haben,
  dass sich Großbritannien dazu entschieden hat, einen Weg außerhalb der EU zu nehmen.
  Dennoch ist Großbritannien für die EU und insbesondere für Deutschland natürlich
  einer unserer engsten Partner und Verbündeten. Wir stehen vor ganz ähnlichen gemeinsamen
  Herausforderungen und teilen die gleichen Ziele und Werte. Von daher ist es nur
  folgerichtig, dass wir eine stärkere Annäherung des Vereinigten Königsreichs an
  die EU unterstützen und begrüßen. Ich hatte speziell nach dem erneuten Beitritt
  zur EU gefragt ‑ das wäre ja einen Schritt weiter als nur die Annäherung. Ist das
  eine Perspektive, die der Kanzler möchte? Ich sehe ehrlicherweise keine große Differenz
  zwischen dem, was Sie gefragt haben, und meiner Antwort, die ich darauf gegeben
  habe. Ich habe darauf verwiesen, wie bedeutsam die Beziehungen von Europa und Deutschland
  mit Großbritannien sind, und habe dann auch explizit gesagt ‑ und sage es gerne
  noch einmal ‑, dass wir natürlich eine stärkere Annäherung des Vereinigten Königreichs
  an die EU begrüßen und unterstützen. Aber es ist doch ein Unterschied zwischen Mitgliedschaft
  und Annäherung. Das ist ja keine Frage, die im ersten Schritt bei uns liegt. Großbritannien
  hat sich entschieden, einen Weg außerhalb der EU zu finden. Wenn sie sich jetzt
  dazu entscheiden, zurückkehren zu wollen ‑ bisher ist das eine Idee von Herrn Burnham ‑,
  dann müsste sich das in Großbritannien erst einmal niederschlagen. Dann wird es ‑
  zu dieser Prognose würde ich mich hinreißen lassen ‑, denke ich, nicht an der Europäischen
  Union scheitern. Herr Hille, in Ihrer Aufzählung der Termine am Mittwoch war die
  Sitzung des Koalitionsausschusses nicht dabei. Nimmt der Kanzler daran nicht teil,
  oder ist das kein Kanzlertermin? Könnten Sie mit uns vielleicht auch einen Blick
  auf die Themen werfen? Ich bin jetzt noch nicht Jahrzehnte an dieser Stelle, aber
  ich bin jetzt über eineinhalb Jahre hier. Ich kann mich nicht daran erinnern, dass
  wir in dieser Zeit bei der Ankündigung der Termine des Kanzlers jemals eine Koalitionsausschusssitzung
  hier angekündigt hätten. Sie wissen das, aber ich sage es trotzdem noch einmal:
  Der Koalitionsausschuss ist eine Veranstaltung der Parteien. An dessen Sitzungen
  nimmt der Parteivorsitzende, der auch Bundeskanzler ist, natürlich teil; das ist
  aber kein Termin, den wir von hier jemals angekündigt hätten. Gleichwohl möchte
  ich nach den Themen fragen. Mit welchem Ambitionsniveau der Bundeskanzler in die
  nächste Woche geht, was das Thema Reformen betrifft, und welche Themen ihm da ganz
  besonders wichtig sind ‑ gerade auch nach den Telefonaten, die der Bundespräsident
  zuletzt geführt hat ‑, würde mich schon interessieren. Auf Ihre Frage nach dem Ambitionsniveau:
  Der Bundeskanzler wird mit einem sehr guten Ambitionsniveau in die nächste Woche
  gehen, so wie er auch diese Woche bestritten hat. Um da noch einmal anzuschließen,
  frage ich nicht nach dem Ambitionsniveau, sondern nach seinem Besorgtheitsniveau:
  Mit welchem Besorgtheitsniveau geht der Kanzler in diese Koalitionsausschussverhandlungen?
  Es haben sich inzwischen ja wieder neue Themen aufgehäuft, bei denen es anscheinend
  Streit zwischen Union und SPD gibt. Ich würde sagen, das ist das übliche Geschäft
  in der Politik in einer Koalition. Wir haben durchaus anspruchsvolle Themen, und
  davon auch nicht wenige. Die großen Themen, die uns seit Wochen begleiten, sind
  die Themen Rente, Krankenversicherung, Pflege, Haushalt. Da laufen die Beratungen
  nicht erst seit gestern. Da sind viele Fragen geklärt und einige Fragen offen ‑
  ohne dass ich jetzt mit der Aufzählung der Themen, die gerade im Raum stehen, jetzt
  eine Tagesordnung für den Koalitionsausschuss aufgemacht hätte; da bitte ich Sie,
  das nicht misszuinterpretieren. Es ist nicht meine Rolle, die Themen des Koalitionsausschusses
  aufzuzählen; das war vielmehr die Beschreibung dessen, mit welchen Themen wir es
  derzeit zu tun haben. Dass es da einige offene Fragen gibt, die zu klären sind,
  ist, glaube ich, offensichtlich, aber auch ganz normal im politischen Prozess. Genau
  darum geht es, darum ging es in den vergangenen Wochen. Ich glaube, gerade der Mittwoch
  dieser Woche zeigt doch auch, dass diese Koalition handlungsfähig ist. Sie ist handlungswillig,
  sie ist entscheidungsfähig. Wir haben diese Woche das Thema Pflege mit dem ersten
  Schritt im Kabinett beschlossen. Der nächste Schritt folgt in der kommenden Woche.
  Insofern unterscheidet sich, wenn ich das so sagen darf, der Binnenblick in der
  Koalition durchaus von dem medialen Eindruck, den man in der Außenperspektive bekommen
  kann. Wir arbeiten intensiv zusammen, wir arbeiten aber auch gut, konstruktiv und
  verlässlich miteinander, zum Wohle dieses Landes und ‑ da kann man immer wieder
  den Koalitionsvertrag zitieren ‑ aus „Verantwortung für Deutschland“. Dass drei
  Parteien miteinander in einer Koalition sind, die aus unterschiedlichen Perspektiven
  auf eine Reihe von Themen blicken, ist ja nichts Neues, ist nichts Besonderes. Deshalb
  ist es auch nicht verwunderlich, dass Themen besprochen werden müssen. Nach meinem
  Dafürhalten wäre es sehr begrüßenswert, wenn nicht alles, was an Diskussionen läuft ‑
  was, wie gesagt, ganz normal ist ‑, immer gleich sozusagen ganz oben auf der Streiteskalationsskala
  angesetzt wird. Das ist nicht zutreffend und verzerrt das Bild. Wenn Sie jetzt so
  ein optimistisches Bild zeichnen, möchte ich noch ganz konkret nachfragen: Können
  wir dann damit rechnen, dass entweder heute, an diesem Wochenende oder bis Mittwoch
  dann auch eine Einigung bei der Zuckersteuer erreicht wird? Wir sind auch bei diesem
  Thema in guten Gesprächen. Auch hier sei der Hinweis erlaubt, dass die mediale Wahrnehmung
  nicht der sachlichen Grundlage entspricht. Es wird immer gleich alles auf sehr großer
  Flamme öffentlich gekocht. Um in diesem Bild zu bleiben: Es tut den Speisen selten
  gut, wenn man sie immer gleich auf größter Flamme kocht. Wir sind da in den üblichen
  Abstimmungen in einer Koalition, und ich bin zuversichtlich ‑ das hat auch der Bundesfinanzminister
  gestern oder heute Morgen schon gesagt ‑, dass wir auch bei diesem Thema zu einer
  guten Einigung kommen. Herr Hille, es ist ja nicht ganz normal, dass ein Bundespräsident
  anruft, wenn sich in der Koalition über Vorhaben abgestimmt wird. Ich würde es gerne
  verstehen: Hat dem Bundespräsidenten am Dienstag, wie berichtet worden ist, ebenfalls
  der Binnenblick gefehlt, wie Sie gerade gesagt haben? Hat der Bundespräsident also
  die mediale Wahrnehmung aufgenommen und sich deshalb eingemischt? Ich kann und will
  nicht über vermeintliche, mögliche Telefonate spekulieren. Ich sitze hier für den
  Bundeskanzler. Für ihn kann ich sagen, dass es natürlich einen regelmäßigen Austausch
  zwischen dem Bundeskanzler und dem Bundespräsidenten gibt. Zuletzt haben sie sich
  am Rande der Feierlichkeiten anlässlich des 75-jährigen Jubiläums des Bundesverfassungsgerichts
  in Karlsruhe gesehen und auch kurz miteinander gesprochen. Das war aber für den
  Bundeskanzler auch alles. Genau, darüber, dass die miteinander geredet haben, gab
  es ja die Berichterstattung. Dementsprechend hatte der Bundespräsident nach diesem
  Gespräch Sorge, dass da es zu größeren Streitigkeiten kommen würde, was der Grund
  dafür war, dass er sich am Dienstag eingemischt hat. Herr Kaminski, möchten Sie
  dementieren, dass der Innenminister diese Woche mit dem Bundespräsidenten telefoniert
  hat? Herr Harmsen, möchten Sie dementieren, dass der Vizekanzler und Finanzminister
  mit dem Bundespräsidenten telefoniert hat? Sie können ganz grundsätzlich davon ausgehen,
  dass die Bundesregierung und damit gegebenenfalls auch der Bundesinnenminister natürlich
  auch mit dem Bundespräsidenten regelmäßig in Kontakt stehen. Das kann ich Ihnen
  dazu sagen. Ich weiß nichts von einem Gespräch oder Telefonat von Herrn Klingbeil
  mit dem Bundespräsidenten. Herr Hille, noch einmal völlig abgesehen von diesem Telefonat
  oder der Frage, was jetzt stattgefunden hat oder nicht, wissen wir ja, dass diese
  Einigung oder Teileinigung über die Pflegereform ja wirklich last minute passiert
  ist. Das wurde hier kürzlich noch von dieser Bank bestritten. Aber Tatsache ist
  doch, dass der Gesundheitsminister wirklich, also sprichwörtlich, last minute in
  die Kabinettssitzung gekommen ist, mit der Einigung, die ja eigentlich auch keine
  komplette Einigung war. Würden Sie jedenfalls im Nachhinein einräumen, dass es am
  Ende relativ eng war und dass das nicht unbedingt für die Handlungsfähigkeit dieser
  Regierung spricht? Lassen Sie uns doch einmal den verwegenen Versuch unternehmen,
  das aus der anderen Perspektive zu betrachten: Vielleicht ist es gerade ein Zeichen
  der Handlungsfähigkeit dieser Regierung, dass es zu diesem Kompromiss gekommen ist.
  Man kann natürlich herausstreichen, dass das relativ kurzfristig zu einer Einigung
  geführt hat. Man kann aber auch sagen: Schaut doch einmal darauf, dass es, was die
  Koalition angeht, von der es immer heißt, sie kriege nichts zusammen hin ‑ in Klammern:
  ich habe Sie schon zu Genüge damit traktiert, in Anführungszeichen, wie viel wir
  hinbekommen haben, deshalb tue ich das jetzt an dieser Stelle nicht noch intensiver ‑,
  mit Blick auf die Pflege geklappt hat. Wir haben, und das steht unter dem Summenstrich,
  am Mittwoch im Kabinett das Pflegeneuordnungsgesetz, so der ganze Name, beschlossen
  und werden in der kommenden Woche die Einsetzung einer Kommission, die dann weitere
  Strukturfragen klärt, beschließen. Ich würde dafür werben, nicht immer nur das vermeintlich
  Negative zu sehen, sondern zu sehen: Da geht etwas voran. Am nächsten Tag wird dann
  die Zuckersteuer vom Kanzleramt gekippt. Können Sie also schon verstehen, dass nach
  außen dann doch der Eindruck entsteht, dass es gerade ein bisschen wackelig ist?
  Es sind ganz viele Themen, die zu bearbeiten sind, aber Themen, mit denen wir meistens
  sehr sachlich umgehen. Deshalb habe ich vorhin darauf hingewiesen, dass auch bei
  diesem Thema, bei der Zuckersteuer, der Eindruck von außen ein deutlich anderer
  ist als das, was intern bei uns abläuft. Das meinte ich mit: alles immer gleich
  auf ganz großer Flamme kochen. - Es ist völlig normal, dass Dinge in der Koalition
  abgestimmt werden, und das ist auch in diesem Fall der Fall. Ich bin, und das hat
  der Bundesfinanzminister ja auch gesagt, zuversichtlich, dass wir auch in dieser
  Frage, auch wenn ich mich jetzt nicht auf den Zeitrahmen festlege, eine gute gemeinsame
  Lösung finden werden, wie schon in ganz vielen Fragen. Wir sprechen hier immer über
  den Strauß an Fragen nach Dingen, die nicht geklappt haben. Das ist völlig okay,
  bitte nicht falsch verstehen. Aber wir haben in ganz, ganz vielen Fragen genau diese
  Kompromisse herbeigeführt, zuletzt ‑ ja, der Kollege hat recht ‑ relativ kurz vor
  der Kabinettssitzung. Aber wir haben es geschafft, einen Kompromiss bei der Pflege
  herbeizuführen, und das ist doch das, was zählt. Denn dadurch kommt es zu Veränderungen,
  die zu Verbesserungen führen können. Es ist alles andere als, dass diese Koalition
  nicht handlungsfähig wäre. Das ist sie. Sie ist handlungsfähig, sie ist entscheidungsfähig,
  und sie ist auch entscheidungswillig. Herr Hille, ich will der Koalition gar nicht
  den Handlungswillen absprechen, aber ich glaube, es braucht gar nicht unbedingt
  journalistische Beobachter, die sagen, dass da irgendetwas ziemlich in Schieflage
  ist, und die Partner in der Koalition selbst bemühen sich auch nicht gerade darum,
  Dinge nicht nach außen zu tragen. Also noch einmal gefragt: Wie handlungsfähig ist
  die Koalition, wie einig? Das wirkt nicht sehr einig. Wir haben einen Kanzler, der
  Ankündigungen gemacht hat – darüber müssen wir jetzt gar nicht reden ‑, aber der
  auch ganz deutlich gemacht hat: Ich kann das besser. – Diesen Eindruck hat, glaube
  ich, nicht nur die Hauptstadtpresse nicht, sondern auch viele Menschen im Land nicht.
  Dafür hat auch die CDU in den Ländern bei den Wahlen eine Quittung bekommen. Die
  Frage ist, ob es wirklich von Handlungsfähigkeit zeugt, allein, wenn man auf diese
  Woche schaut, und es einen Bundespräsidenten gibt, der sich offenkundig auch große
  Sorgen macht, weil wir eine AfD haben, die immer stärker wird. Also noch einmal
  gefragt: Wie groß ist auch der Druck, jetzt einmal wirklich ins Handeln zu kommen
  und es auch besser zu machen ‑ das wollte der Kanzler ‑ als die Ampel davor? Das
  ist kein böses Herbeischreiben oder -reden, sondern da macht sich offensichtlich
  auch der erste Mann im Staat Sorgen. Ich dachte, das hätte ich gerade schon hinreichend
  eingeordnet, aber ich mache es gerne noch einmal. Wenn wir auf diese Woche schauen,
  wie ich gerade auf die Frage von dem Kollegen gesagt habe, was steht dann unter
  dem Summenstrich? Diese Koalition hat das Pflegeneuordnungsgesetz beschlossen. That''s
  it. Wir haben es beschlossen. Das setzt voraus, dass wir kompromissfähig sind, und
  ich würde das als Handlungsfähigkeit deuten. Es obliegt aber sozusagen Ihnen, das
  weitergehend zu interpretieren. Aber wir haben nicht nur davon gesprochen, dass
  wir etwas in der Pflege verändern wollen, sondern wir haben das am Mittwoch im Kabinett
  beschlossen, ja, nach intensiven Beratungen. Aber das ist doch völlig normal bei
  großen, wichtigen Themen, die viele Menschen betreffen, bei drei Parteien, die von
  unterschiedlichen Seiten auf Themen schauen, was auch völlig in Ordnung ist, weil
  sich unterschiedliche Gruppen darin wiederfinden. All das zusammenzuführen, genau
  das ist doch Demokratie, demokratischer Austausch, demokratischer Widerstreit über
  die beste Idee, um am Ende gemeinsam ein Ergebnis zu erzeugen. Das ist uns bei diesem
  Thema gelungen, das ist uns beim Thema der Rente gelungen, das ist uns beim Thema
  der Krankenkassen gelungen, um nur einmal die drei großen Themen der letzten Monate
  zu nennen. Deshalb verstehe ich, ehrlich gesagt, gar nicht die Frage danach, ob
  wir handlungsfähig sind. Ja, Ausrufungszeichen, doppeltes, dreifaches Ausrufungszeichen,
  und das zweimal unterstrichen! Das eine sind Spekulationen, gefühlte Wahrnehmungen
  und natürlich auch gewisse „Rumpeleien“, aber das andere sind Fakten, die diese
  Bundesregierung liefert. Ich werde nicht müde, auch wenn ich Gefahr laufe, dass
  Sie das langweilt, dafür zu werben, die zu sehen und nicht immer nur zu sehen, was
  möglicherweise noch besser sein könnte. Da, und das ist dann der letzte Aspekt,
  gibt sich das auch die Hand mit dem, was der Bundeskanzler sagt: Ja, er und wir
  haben Erwartungen geschaffen. Es ist völlig normal, dass man sich Ziele gibt, die
  man in der Politik erreichen möchte. Wir sind auf diesem Weg, diese Ziele zu erreichen,
  ein gutes Stück vorangekommen, haben aber selbst den Anspruch an uns, dass wir eigentlich
  gerne noch ein Stück weiter wären. Genau daran arbeiten wir, und auch da bin ich
  guter Dinge, dass uns das gelingen wird, nämlich weiter mit Tempo und Gemeinsamkeit
  Entscheidungen zu treffen, die dieses Land voranbringen. Das geht wahrscheinlich
  auch schnell, weil wir die Frage, in welcher Pflegestufe sich diese Koalition jetzt
  befindet, wohl heute nicht mehr ergründen können werden. - Ich würde aber gerne,
  Herr Hille, einfach eine ganz praktische Frage stellen. Wenn sich der Bundespräsident
  einmischt, dann ist das natürlich etwas, das auch dokumentiert sein muss. Habe ich
  es jetzt richtig verstanden, dass Sie uns hier nicht bestätigen können, dass der
  Bundespräsident mit dem Kanzler telefoniert hat? Gleiches gilt für Herrn Harmsen
  und Herrn Kaminski. Können Sie bestätigen, dass entsprechende Telefonate stattgefunden
  haben? Wenn Sie es persönlich nicht wissen ‑ Ihr Haus wird es ja wissen ‑, dann
  bitte ich entsprechend schon einmal präventiv um eine Nachlieferung. Ich kann für
  den Bundeskanzler sagen, wenn Ihre Frage ist, ob der Bundespräsident den Bundeskanzler
  angerufen hat oder der Bundeskanzler den Bundespräsidenten angerufen hat: Nein.
  - Ich habe gesagt, wo sich die beiden zuletzt physisch getroffen haben, nämlich
  am Rande der Feierlichkeit anlässlich des 75-jährigen Jubiläums des Bundesverfassungsgerichts
  in Karlsruhe. Da haben sie sich getroffen und kurz miteinander gesprochen. Ich würde
  das für das BMF bzw. für Herrn Klingbeil nicht kommentieren. Das sind Medienberichte,
  und hinsichtlich der Telefonate des Bundespräsidenten würde ich auch das Bundespräsidialamt
  in der Verantwortung sehen. Ich würde das von hier aus nicht kommentieren. Dem würde
  ich mich anschließen. Mir persönlich ist davon zwar nichts bekannt, aber ich glaube,
  der Kollege Harmsen hat gerade das dazu gesagt, was auch für uns gilt. Entschuldigung,
  aber das ist jetzt absurd, wenn wir sagen, dass das Bundespräsidialamt für die Telefonate
  des Bundespräsidenten zuständig ist! Wenn zwei Ämter, also zwei offizielle Behörden,
  beteiligt sind, dann muss doch natürlich auch das jeweilige Ministerium das bestätigen
  oder verneinen können. Also, Entschuldigung, das geht nicht! Ich kann das von dieser
  Stelle aus nicht kommentieren. Beim Thema der Pflege war es ja auch eine Zeitfrage.
  Der Kanzler hat dann irgendwann gesagt, er wolle diese Einigung jetzt. Beim Thema
  der Arbeitsmarktreform gibt es in der Berichterstattung auch die Zuschreibung der
  Unzufriedenheit mit den Lieferungen aus dem Arbeitsministerium, konkret hinsichtlich
  des Themas des Kündigungsschutzes und des Themas der Befristungen. Deshalb an Sie
  die Frage: Inwiefern ist der Bundeskanzler unzufrieden mit dem, was hinsichtlich
  dieser Themen aus dem Arbeitsministerium kommt? Das kann man, denke ich, unter den
  Bogen einordnen, den ich gerade schon gespannt habe. Der Bundeskanzler hat selbst
  gesagt: Wir haben uns Ziele gegeben, Ziele formuliert, die wir erreichen wollen,
  und wir wären gerne schon ein Stück weiter. Das betrifft ganz viele Themen, und
  das betrifft auch das Thema der Arbeitsmarktreformen. An das Arbeitsministerium:
  Wann kommen denn diese Gesetzentwürfe, oder wird dafür die Sitzung des Koalitionsausschusses
  abzuwarten sein? Die waren ja schon viel, viel eher erwartet worden. Wo liegt da
  das Problem? Aus Sicht des Arbeitsministeriums gibt es da kein Problem. Wenn ich
  mir die Koalitionsausschusssitzung von Anfang Juli noch einmal anschaue, dann gibt
  es da ja auch Themen, die schon abgearbeitet wurden. Wir haben vor Kurzem den Aktionsplan
  zum Kampf gegen Sozialmissbrauch gemeinsam mit Innenminister Dobrindt vorgestellt,
  und auch an den anderen Themen wird bei uns mit Hochdruck weitergearbeitet. Aber
  wie üblich werde ich jetzt hier keine Ankündigung dazu machen, wann was wie und
  wo kommen wird und was noch notwendig ist, sondern das sind regierungsinterne Gespräche.
  Herr Harmsen, Sie haben vorhin gesagt, Ihnen persönlich sei von einem Telefonat
  zwischen dem Bundespräsidenten und Herrn Klingbeil nichts bekannt. Ihr persönlicher
  Kenntnisstand war aber gar nicht der Inhalt der Frage gewesen. Üblicherweise informieren
  sich Sprecherinnen und Sprecher der Ministerien in Ihrem Haus bezüglich Fragen,
  die absehbar sind, und diese war eine solche. Sagen Sie uns deswegen bitte doch,
  ob Sie eine solche Recherche unternommen haben, ob ein solches Gespräch stattgefunden
  hat, oder nicht. Haben Sie dabei keine Antwort erhalten, die Sie in die Lage versetzt,
  uns das zu sagen, oder haben Sie eine solche Recherche erst gar nicht unternommen?
  Darin schwingt ja so ein bisschen mit, dass ich mich oder dass wir uns hier bisweilen
  nicht ordentlich vorbereiten würden. Es sind sehr viele Themen, auf die wir uns
  hierfür vorbereiten. Ich glaube, jedes Haus, das hier vertreten ist, investiert
  sehr viel Zeit und sehr viel Mühen, um Ihnen hier Auskunft bezüglich Ihrer Fragen
  zu geben. Manche können wir antizipieren, manche können wir nicht antizipieren.
  Das ist so auch völlig in Ordnung. Aber wenn Sie mir jetzt unterstellen, ich würde
  mich nicht ordentlich vorbereiten, dann weise ich das klar zurück. Ich habe auf
  die Frage eines tatsächlichen oder vermeintlichen Anrufs meine Antwort gegeben,
  und der habe ich nichts hinzuzufügen. Danke. Darin schwingt, wenn ich das sagen
  darf, keine Unterstellung mit, sondern die langjährige Erfahrung, dass, wenn Sprecherinnen
  und Sprecher auf, wie ich es jetzt einmal nenne, heikle Fragen die Antwort geben,
  davon sei ihnen persönlich nichts bekannt, das im Kern eine ausweichende Antwort
  ist. Deswegen wüsste ich nur gerne: Haben Sie innerhalb des Hauses recherchiert,
  ob ein solches Telefonat stattgefunden hat, oder nicht, und welches Ergebnis hat
  diese Recherche gebracht? War es so, dass Ihnen „Nein, dazu sagen wir nichts“ oder
  „Nein, das hat nicht stattgefunden“ gesagt wurde, oder haben Sie gar keine Antwort
  erhalten? Ich glaube, wie wir uns hier vorbereiten oder wie ich mich hier vorbereite
  und wie die Abstimmungen innerhalb des BMF oder anderer Häuser auf diese Regierungspressekonferenz
  oder sonstige Termine ablaufen, das ist aus guter Tradition eine interne Angelegenheit,
  und die kommentiere ich hier nicht. Herr Harmsen, hat das Bundesfinanzministerium
  bzw. hat der Vizekanzler den üblichen Weg eingehalten, wie sich in Sachen der Zuckersteuer
  intern abgestimmt wird? Ich beantworte das gerne. Sind wir jetzt beim Thema der
  Zuckersteuer? Ja, bei der Koalitionskrise. Das war ja quasi die Folge des Mittwochs.
  Wir machen einen fließenden Übergang. Ich weiß nämlich, dass das nächste Thema,
  das der Kollege auch noch aufmachen wollte, tatsächlich dieses Thema ist. Wenn es
  jetzt noch konkret zu dem Telefonat eine Frage gibt, würde ich das vorziehen. Das
  basiert darauf, dass es in der Berichterstattung heißt, dass nur das Kanzleramt
  die Abstimmung zwischen den Ministerien, wenn es um Gesetze wie die Zuckersteuer
  geht, anstoßen könne und das Kanzleramt sich deshalb daran gestört habe, weil der
  Vizekanzler dies nicht getan hat. Möchten Sie diese Berichterstattung dementieren?
  Ist daran etwas falsch? Ich würde vielleicht eines einmal vorwegstellen, was der
  Bundesfinanzminister auch gestern in dem O-Ton gesagt hat: Es gibt eine Einigung
  in dieser Koalition, dass eine Zuckergetränkesteuer eingeführt wird. An dieser Zuckergetränkesteuer
  arbeiten wir zusammen mit dem BMG. Das BMF hat jetzt einen Vorschlag auf den Tisch
  gelegt. Dieser Vorschlag wird jetzt, wie das üblich ist, zwischen den Ministerien
  verhandelt bzw. abgestimmt, und in diesem Prozess befinden wir uns. Insofern würde
  ich jetzt zu Einzelheiten eines Entwurfs, wie das auch üblich ist, hier nichts sagen.
  Ich kann aber sagen: Es gab im Vorfeld Absprachen darüber, wie diese Abstimmung
  erfolgen soll, und an diese Absprachen haben wir uns gehalten. Ich weiß nicht, was
  der übliche Weg ist. Es gibt ja verschiedene Formen, wie man das machen kann. Dann
  stimmt man sich darüber ab, welchen Weg man einschlagen möchte. Diesen Weg haben
  wir abgesprochen, und daran haben wir uns gehalten. An den Regierungssprecher: Können
  Sie sagen, was genau jetzt der Grund dafür war, dass das Vorhaben gestoppt wurde?
  Na ja, ich würde schon anschließend an das, was der Kollege Harmsen gesagt hat,
  ein Fragezeichen an das Wort „stoppen“ setzen. Ohne dass ich wieder in die Versuchung
  komme, hier sozusagen philosophisch ähnliche Formulierungen nutzen zu müssen, laufen
  derzeit die Abstimmungen innerhalb der Koalition. Ich sehe darin nichts, was man
  gestoppt hat, sondern es laufen die Abstimmungen, und das ist ein ganz normaler
  Vorgang. Bei allen Themen stimmen wir uns koalitionsintern ab. Wenn man dann eine
  andere Auffassung immer gleich ‑ da sind wir wieder beim Thema vom Anfang ‑ auf
  großer Flamme als Stopp oder dergleichen ansieht, dann weiß ich auch nicht mehr,
  wo der richtige Weg ist. Zum Thema der Zuckersteuer gibt es also einen Vorschlag,
  und es laufen innerhalb der Koalition die Abstimmungen. Es geht nicht darum, dass
  die Zuckersteuer selbst in Frage steht, sondern es gibt Diskussionsbedarf hinsichtlich
  der Ausgestaltung, und die Diskussion läuft derzeit innerhalb der Koalition. Können
  Sie sagen, welche konkreten Punkte jetzt der Knackpunkt waren? Nein, das mache ich
  jetzt von dieser Stelle aus nicht, denn dann würden ja die internen Abstimmungen
  nicht mehr intern sein. Herr Schulz, akzeptiert der Landwirtschaftsminister jetzt,
  dass die Zuckersteuer erhoben wird? Wo sieht er, wenn er das tut, noch Korrekturbedarf?
  Der Regierungssprecher hat ja gesagt, dass es eine Einigung innerhalb der Koalition
  darauf gibt, dass es eine Zuckersteuer geben werde. Daran kann ich nichts ergänzen.
  Das stimmt so. Das war der erste Teil der Frage. Der zweite Teil war: Wo sieht er
  jetzt in den Abstimmungen noch Korrekturbedarf? Bei der Höhe des Betrages? Auch
  bei dieser Frage kann ich an den Regierungssprecher natürlich nur anschließen. Wir
  sind in regierungsinternen Abstimmungen. Wenn ich es jetzt erzählen würde, dann
  wäre es nicht mehr intern. Von daher: Wir sind in internen Abstimmungen. Sie laufen,
  und das wird auch so weitergehen. Herr Harmsen, nur zur Klarstellung: Sie haben
  doch eben, im Grunde genommen, indirekt schon gesagt: Ja, es gab eine Absprache.
  Das Finanzministerium hat sich an diese Absprache zur Zuckersteuer gehalten. Das
  Kanzleramt hat das Ding trotzdem gestoppt. ‑ Der stellvertretende Regierungssprecher
  hat gesagt: Nein, gestoppt haben wir es eigentlich nicht. Habe ich das so richtig
  wiedergegeben? Sie widersprechen sich irgendwie gerade ein bisschen, oder? Ich versuche
  es noch einmal. Ich finde, wir hängen uns viel zu sehr an dem Begriff „stoppen“
  auf, aber nach meinem Verständnis kann man nur etwas stoppen, was ‑ Sie sehen mich
  um die Formulierung ringen ‑ kurz vor einem Beschluss steht. Es gibt den Vorschlag
  für die Zuckersteuer, und jetzt gibt es die üblichen Beratungen über die Art und
  Weise der Ausgestaltung. Ich möchte nur noch klarstellen, dass sich die Frage von
  dem Kollegen auf das Verfahren und den Weg bezog. Das, worüber wir eben gesprochen
  haben, sind die Inhalte des Vorschlags, der jetzt auf dem Tisch liegt. Insofern
  sehe ich da keinen Widerspruch. Vielleicht darf ich, auch wenn Herr Harmsen der
  Sprecher des Bundesfinanzministers ist, noch einmal auf das Zitat des Bundesfinanzministers
  hinweisen, das sich mit dem deckt, was wir hier gesagt haben. Zitat Bundesfinanzminister:
  Ich bin zuversichtlich, dass wir schnell zu einer Einigung kommen. Bis wann soll
  bzw. bis wann muss diese Einigung stehen, um die entsprechende Haushaltsplanung
  noch zu unterfüttern? Ich will jetzt kein fixes Datum nennen. Fakt ist, dass wir
  das sehr schnell machen wollen. Deswegen haben wir uns darauf verständigt, dass
  im Rahmen einer Formulierungshilfe für die Fraktionen im Deutschen Bundestag zu
  tun. Ich will Ihnen jetzt kein fixes Datum nennen, aber wir sind, wie Herr Hille
  den Finanzminister gerade natürlich sehr richtig zitiert hat, zuversichtlich, dass
  uns schnell eine Einigung gelingt. Herr Hille, wenn das alles die normale regierungsinterne
  Abstimmung und eigentlich alles wie immer ist, wie bewerten Sie dann, dass die Vorgänge
  rund um die Zuckersteuer in der Form an die Öffentlichkeit gelangt sind? Welche
  Wirkung hat das Ihrer Einschätzung nach nach außen? Ich sehe es jetzt nicht als
  meine Aufgabe, zu mutmaßen, was welche Wirkungen hat, jedenfalls nicht zu diesem
  Moment und von dieser Stelle aus. Ich kann nur sagen: Interne Beratungen sind aus
  gutem Grund intern, sonst wären es ja keine internen, sondern öffentliche Beratungen.
  Der übliche, gute und richtige Weg ist, dass die Dinge in internen Beratungen geklärt
  werden und man dann zu gemeinsamen Entscheidungen kommt, so, wie wir es an ganz
  vielen Stellen getan haben. Manchmal laufen die Dinge etwas anders. Das hilft dann
  nicht unbedingt bei der schnellen Ergebnisfindung, aber wir sind auch bei diesem
  Thema auf einem Weg, den wir gut zu Ende bringen werden. Die Aussage des Bundesfinanzministers
  haben wir ja nun ausreichend zitiert, und ihr widerspreche ich nicht. Herr Hille,
  ich versuche, es zu verstehen. Sie sagen uns auf der einen Seite, es handele sich
  dabei um ein normales Abstimmungsprozedere. Es gibt nun einmal auch in der Bundesregierung
  hin und wieder Meinungsverschiedenheiten. Auf der anderen Seite sagt Herr Harmsen:
  Wir wollen es schnellstmöglich über die Bühne bringen. ‑ Teilt der Kanzler dieses
  „schnellstmöglich“ als Ziel? Erstens habe ich nicht gehört, dass Herr Harmsen „schnellstmöglich“
  gesagt hätte, sondern der Finanzminister hat davon gesprochen, dass wir schnell
  zu einer Einigung kommen. Schnell zu Einigungen zu kommen, ist nie verkehrt, auch
  schon aus Eigeninteresse, sonst sitze ich hier und muss Ihnen regelmäßig immer wieder
  das Gleiche erklären. Ich habe eine Frage an das BMVg. Es geht um das Drohnenregiment
  , das gestern von Minister Pistorius angekündigt wurde. Dabei wurde eine Anzahl
  von Soldaten genannt. Mich interessiert, in welchem Umfang Technik angeschafft wird,
  also unbemannte Systeme. Ganz allgemein darf ich darauf verweisen, dass ich den
  gestrigen Ankündigungen des Ministers von dieser Stelle aus jetzt nicht wirklich
  etwas hinzuzufügen habe. Aber trotzdem, um noch einmal für alle den gleichen Abholpunkt
  zu haben: Das Heer wird ab dem kommenden Jahr ein Drohnenregiment aufstellen. Damit
  wird es ab dem kommenden Jahr im deutschen Heer einen selbstständigen Verband für
  die Fähigkeiten unbemannter Systeme geben. Die Fähigkeiten für die Aufklärung, die
  Wirkung und insbesondere auch den Abfang gegnerischer Drohnen werden an dieser Stelle
  gebündelt. Dabei ist es unser Ziel, diese Systeme breitflächig einzubringen und
  alle Reichweiten abzudecken. Mit diesem Regiment schaffen wir eine weitere Säule
  neben der Integration unbemannter Systeme in die bestehenden Verbände, die jetzt
  auch schon läuft. Das ist also Teil der Struktur, die die Bundeswehr annehmen wird.
  Insofern kann ich Ihnen jetzt keine Stückzahlen oder weitere Details zu den konkreten
  Systemen nennen. Auch hier gelten natürlich die Ihnen bekannten Beschaffungswege.
  Das heißt, es geht über 25-Millionen-Euro-Vorlagen und Ähnliches. Entscheidend ist
  nur, dass wir diese unbemannten Systeme bitte nicht nur als Luftsysteme verstehen,
  sondern wir haben natürlich auch unbemannte Systeme, die ihre Wirkung an und auf
  Land erzielen. Dieses Bündel soll abgedeckt werden. Aber konkrete Systeme oder konkrete
  Anzahlen kann ich Ihnen an dieser Stelle noch nicht mitgeben. Sind sie nur für die
  reine Abwehr vorgesehen, oder sollen sie auch in einem Konfliktfall eingesetzt werden?
  Die Systeme wirken ja auch sozusagen im Verbund. Natürlich geht es in erster Linie
  ‑ das habe ich eben skizziert ‑ um Aufklärung und Wirkung. Aber das kann natürlich
  ganz unterschiedlich sein. Abwehr ist die eine Geschichte, aber gerade, wenn es
  um Aufklärung geht, dann wird natürlich auch dieses Feld abgedeckt. Können Sie sagen,
  welches Budget für das Drohnenregiment vorgesehen ist? Es würde, denke ich, ein
  bisschen zu kurz greifen, wenn wir jetzt sagen würden: Budget X wäre dafür da. ‑
  Der Einzelplan 14, unser Verteidigungshaushalt, sieht nicht vor, dass wir einzelne
  finanzielle Mittel für einen Verband haben, sondern das ist natürlich immer gekoppelt.
  Da gibt es natürlich Personalkosten; die werden ganz normal über diesen Bereich
  abgedeckt. Es gibt Kapitel, die für die Beschaffung da sind. Auch da wird dann das
  System beschafft, aber nicht für den Verband. Insofern kann ich nicht beziffern,
  was an finanziellen Mitteln in dieses Regiment an sich fließt. Sie reden von 2027.
  Ist das Regiment dann schon voll einsatzbereit? Es ist natürlich immer mit einem
  Aufwachsen verbunden. Wir können auch nicht zaubern. Es ist nicht so, dass auf ein
  Fingerschnippen hin alles dasteht, sondern das wird natürlich aufwachsen, aber es
  wird so aufwachsen, dass wir diese Fähigkeiten im kommenden Jahr dort bündeln können.
  Das wird sicherlich nicht auf Knopfdruck auf hundert Prozent sein, weder personell
  noch materiell, aber es ist das Ziel, schnellstmöglich einsatzbereit zu sein. Es
  wird an mir liegen, dass ich es bislang nicht verstanden habe. Frau Jenning, das
  Drohnenregiment ist bislang ausschließlich bei der Teilstreitkraft Heer vorgesehen.
  Soll es ähnliche Drohnenregimenter auch in anderen Teilstreitkräften geben? Sie
  wissen ja, wenn ich den großen Bogen schlagen darf, dass wir insbesondere das Thema
  der Drohnen über alle Teilstreitkräfte hinweg betrachten. Es ist eine sogenannte
  Jedermannsbefähigung. Das heißt, uns ist die Bedeutung sehr bewusst, sodass jede
  Soldatin und jeder Soldat eine entsprechende Ausbildung genießt. Inwiefern das in
  Regimentern oder Ähnlichem eingebettet wird, das wird sich zeigen. Sie wissen auch,
  dass wir bezüglich der Feinstruktur der Bundeswehr noch in den internen Entscheidungsprozessen
  sind. Wenn die Ergebnisse da sind, dann wird sich so etwas herauskristallisieren.
  Dem kann ich jetzt nicht vorgreifen. Meine Frage geht an die Bundesregierung und
  gegebenenfalls auch an die betroffenen Ressorts. Wann und auf welcher Ebene wird
  in der EU über die Dieselfreigabe abgestimmt? Schließt sich die Bundesregierung
  der amerikanischen Forderung an, diesen Diesel freizugeben? Ich würde den Anfang
  machen; dann können Kolleginnen und Kollegen noch ergänzen. Ganz grundsätzlich:
  Wir beobachten die Situation ‑  das wird Ihnen klar sein ‑ natürlich insgesamt sehr
  genau. Wie wir hier schon vielfach besprochen haben, hat Versorgungssicherheit für
  uns höchste Priorität. Dazu sind wir weiterhin im Austausch mit unseren europäischen
  und internationalen Partnern. Aus unserer Sicht ist es wichtig, dass wir hierbei
  mit einer Stimme unterwegs sind. Wir rufen alle Beteiligten auf, besonnen zu handeln.
  Der Grund für die hohen Kraftstoffpreise liegt zuvorderst in der Lage im Nahen Osten
  und der damit zusammenhängenden Verknappung des Angebots begründet. Es gilt jetzt,
  die Märkte nicht weiter zu verunsichern. Das wäre aus unserer Sicht im Interesse
  aller Beteiligter, und daran arbeiten wir zusammen mit unseren Partnern. Wir sehen
  die Vereinigten Staaten weiterhin als einen verlässlichen Partner, auch in Bezug
  auf Kraftstofflieferungen. Gleichzeitig unterstützt die Bundesregierung die Wirtschaft
  bei der konsequenten Diversifizierung ihrer Roh- und Kraftstoffversorgung. Dazu
  gehört, dass die Raffinerien in Deutschland sowie vorhandene Reserven eine wichtige
  Säule der heimischen Versorgungssicherheit sind. In dem Zusammenhang ist die Bedeutung
  unserer Raffinerien in Europa für die Versorgungssicherheit nicht zu unterschätzen.
  Ich hatte gefragt, wann und auf welcher Ebene heute verhandelt wird. Herr Hille,
  die französische Seite hat gesagt, heute werde noch eine G7-Abstimmung auf Ebene
  der Regierungschefs stattfinden. Können Sie das bestätigen? Vielleicht nahmen Sie
  darauf Bezug. Ich kann bestätigen, dass es Abstimmungen gibt und dass der Bundeskanzler,
  wenn eine solche G7-Schalte stattfindet, daran üblicherweise teilnimmt. Ich kann
  Ihnen aber jetzt noch keine genaueren Daten nennen und deshalb auch nicht sagen,
  zu Zeitpunkt X findet Y statt. Zu Ihrer Antwort auf die Frage von der Kollegin:
  Ich habe nicht ganz verstanden, ob das eher eine vorsichtige Reaktion oder eine
  offene Reaktion ist. Ich habe herausgehört, dass Sie vor Marktverwerfung warnen
  und einer erneuten Marktfreigabe deswegen eher skeptisch gegenüberstehen. Ist das
  richtig? Wenn Sie es so verstanden haben, dann ist es vielleicht nicht ganz falsch
  formuliert gewesen. Grundsätzlich ist die Freigabe von Kraftstoffreserven im Rahmen
  der Internationalen Energieagentur zu klären. Sie erfolgt auf freiwilliger und auf
  koordinierter Basis. Derzeit sind uns keine neuen Anforderungen seitens der Internationalen
  Energieagentur bekannt. Entscheidend ist, dass wir, wie ich gerade gesagt habe,
  zu koordinierten und gegenseitigen Lösungen kommen. Denn wir wollen die Märkte stabilisieren
  und sie nicht weiter verunsichern. Hat das Energieministerium an der Stelle etwas
  zu der Thematik zu ergänzen? Nein, ich denke, Herr Hille hat das gut zusammengefasst.
  Um vielleicht noch den größeren Rahmen zu spannen, weise ich noch einmal darauf
  hin, dass wir im Frühjahr im Rahmen der IEA schon die Freigabe aus unseren Reserven
  vereinbart haben. In der Tat muss man, wie Herr Hille es dargestellt hat, über den
  neuen Wunsch, der jetzt geäußert wurde, in den entsprechenden Gremien, die dafür
  zuständig sind, beraten. Diese Beratungen finden jetzt statt. Nur damit ich es richtig
  verstehe: Gilt die Freigabeentscheidung vom Frühjahr einfach weiter, und wird weiterhin
  daraus freigegeben, oder sind die Reserven erschöpft, und kann gar nichts mehr freigegeben
  werden? Nein, diese Freigabe ist erfolgt. Das Angebot an den Markt erfolgte durch
  den dafür zuständigen Erdölbevorratungsverband. Das Angebot aus der damaligen Freigabe
  wurde zu großen Teilen abgerufen, aber nicht komplett. Nach meinem Kenntnisstand
  sind noch Mengen aus dieser Freigabe übrig, wobei mir die Gesamtzahl dessen, wie
  viel aus der Freigabe vom Frühjahr nicht abgerufen wurde, gerade nicht vorliegt.
  Herr Hille, Sie sagten eben, die Märkte sollten nicht weiter verunsichert werden.
  Wem lasten Sie eigentlich die Schuld für diese Verunsicherung an? Das wäre dann
  ja der US-Präsident. Es geht nicht um Schuldfragen. Ich würde das einfach nur als
  grundsätzlichen Hinweis und Appell verstanden wissen, dass wir alle gemeinschaftlich
  vorgehen wollen, wir dazu in Abstimmung sind und das dem Ziel folgt, da wir aufgrund
  der Situation im Nahen und Mittleren Osten eh schon eine Verknappung erleben, die
  Situation zu stabilisieren und nicht weiter zu verunsichern. Aber der Krieg im Nahen
  Osten und auch jetzt diese Idee, Dieselexporte zu stoppen, sind ja eindeutig Trumps
  Ideen und Trumps Handlungen. Insofern sitzt da eigentlich auch derjenige, der dafür
  verantwortlich ist, oder? Die Schlussfolgerungen, die es dann gibt, obliegen Ihnen.
  Es ist nicht meine Aufgabe zu interpretieren, sondern zu formulieren. Ich habe formuliert,
  was unsere Linie ist, nämlich gemeinsam, geschlossen vorzugehen, um Märkte zu stabilisieren
  und sie nicht weiter zu verunsichern. Nur noch einmal eine Lernfrage an Herrn Wentzel:
  Im März hatten Sie uns hier gesagt, dass Sie die Reserve auf 19,5 Millionen Tonnen
  beziffern. Ein paar Tage später wurden 2,6 Millionen Tonnen von Deutschland freigegeben.
  Jetzt ist mein Stand, dass es eine gesetzliche 90-Tage-Vorsorgepflicht gibt, die
  laut Bundesregierung etwa 20 Millionen Tonnen entspricht. Ist das weiterhin die
  Lage, dass es eine 90-Tage-Vorsorgepflicht gibt und dementsprechend immer noch 20 Millionen
  Tonnen vorhanden sind und die freigegebenen 2,6 Millionen Tonnen wieder eingelagert
  wurden? Ich glaube, da sind gerade einige der Zahlen durcheinander gegangen. Was
  wir im März hatten, war eine Freigabe im IEA-Verbund. Auf Deutschland entfiel dabei
  ein Anteil von 2,6 Millionen Tonnen. Das sind 19,51 Millionen Barrel. Die 19,51
  hatten Sie, glaube ich, gerade als Gesamtzahl genannt. Das ist die gleiche Zahl;
  aber es sind verschiedene Maßeinheiten. Von diesen 2,6 Millionen Tonnen wurden durch
  den Erdölbevorratungsverband 600 000 Tonnen den Unternehmen angeboten. Es ist weiterhin
  so: Der Erdölbevorratungsverbund muss über mehr als einen Monat die Vollversorgung
  des deutschen Verbrauchs sicherstellen. Das ist in den Lagern auch abgebildet. Ich
  hatte es so verstanden: Sie haben die Reserve im März auf 19,5 Millionen Tonnen
  beziffert. Dann beträgt die 90-Tage-Vorsorgepflicht laut Ihrem Ministerium 20 Millionen
  Tonnen. Wenn jetzt aber diese Menge von 2,6 Millionen Tonnen freigegeben wurde,
  dann muss doch angesichts der gesetzlichen Pflicht die Reserve aufgefüllt worden
  sein, damit man der 90-Tage-Pflicht nachkommt. Korrekt, und ist das passiert? Noch
  einmal: Die Zahl 19,51 als Gesamtzahl der Reserve kann ich nicht bestätigen, aber
  ‑ ‑ ‑ Das habe ich gerade nicht vorliegen. Die Zahl habe ich in einem anderen Kontext
  vorliegen. Das war in der Regierungspressekonferenz am 11. März. Einverstanden.
  Dann schaue ich, ob wir das korrigieren müssen. Das würde ich dann nachreichen.
  So oder so, die Mengen, die aus dieser Freigabe angeboten wurden, wurden mittlerweile
  weitgehend wieder eingelagert. Die Bevorratungspflicht wird also eingehalten. Noch
  einmal an Herrn Wentzel, weil jetzt zwei Sachen durcheinander gehen: Im März ging
  es ja vor allem um Rohöl, jetzt geht es um Diesel. Vielleicht können Sie sagen,
  ob bei der Freigabe im März ‑ das war ja eine Mischung vor allem aus Rohöl, aber
  auch aus Diesel ‑ der Diesel von den Märkten komplett abgerufen wurde und zweitens,
  wie groß die Dieselvorräte Deutschlands sind? Was ich noch einmal sagen kann: Im
  März waren 2,6 Millionen Tonnen Teil dieser international vereinbarten Freigabe,
  was letztlich vom Markt ‑ ‑ ‑ Da sind Sie jetzt aber wieder bei Rohöl. Sie machen
  da keine Unterscheidung. Genau, die Unterscheidung mache ich gleich ‑ eine Sekunde.
  Was letztlich vom Markt nachgefragt und dementsprechend vom Erdölbevorratungsverband
  angeboten wurde, waren nur 600 000 Tonnen insgesamt. Die gliedern sich auf in 400 000 Tonnen
  Rohöl, 150 000 Tonnen Diesel und 50 000 Tonnen Jet, also Kerosin. Die Dieselvorräte
  insgesamt in Deutschland habe ich nicht vorliegen. Die reiche ich gerne nach, soweit
  ich das in Erfahrung bringe. Aber auch da gilt dann die Einmonatsbevorratungspflicht.
  Kurze Nachfrage: Es hat ja auch eine Diskussion darüber gegeben, ob man die Raffinerien
  nicht bittet oder sogar anweist, dass sie ihre Dieselproduktion erhöhen. Ist das
  geschehen? Wir sind im engen Austausch mit den Raffinerien. Soweit ich weiß, laufen
  die auf Vollkapazität. Ich kann keine Auskunft dazu geben, wie sich die Produkte
  der Raffinerien gerade auf verschiedene Erdölprodukte aufteilen. Eine kurze Nachfrage,
  weil der Kollege das ja aufgezeigt hat: 150 000 Tonnen Dieselkraftstoff wurden laut
  Ihrem Ministerium zu Beginn der Krise freigegeben. Laut Ihrem Ministerium wurden
  diese Tonnen bis Mitte Juni nahezu vollständig vom Markt aufgenommen. Dementsprechend
  müssten diese 150 000 Tonnen auch wieder aufgefüllt worden sein, damit die Reserve
  den Vorgaben anspricht. Ist das passiert? Ja. Nach der Information, die mir hier
  vorliegt, wurde das weitgehend wieder aufgefüllt. Ich habe eigentlich zwei Themen
  an das Innenministerium. Fangen wir mal mit dem ersten an, das vielleicht nicht
  so lange dauert. Die Frage ist, wie das BMI den Verein „Rote Hilfe“ bewertet. Die
  „Rote Hilfe“ wird vom Bundesverfassungsschutz als linksextremistische Bestrebung
  beobachtet. Zu Details würde ich Sie auf den Bundesverfassungsschutzbericht verweisen.
  Im Jahr 2025 steht die „Rote Hilfe“ unter anderem darin. Das ist der letzte entsprechende
  Bericht. Jetzt ist Sören Pellmann öffentlichkeitswirksam eingetreten. Hat das irgendwelche
  Konsequenzen für ihn als MdB? Zu einzelnen Personen, die selbst nicht im Verfassungsschutzbericht
  aufgeführt werden, äußern wir uns grundsätzlich nicht. Ist es aus Sicht des BMI
  verfassungsfeindlich, von einer Klassenjustiz in Deutschland zu sprechen? Das tut
  der Verein ja, und darum kämpft er dagegen. Zu den Details dieser Führung der „Roten
  Hilfe“ als linksextremistische Bestrebung verweise ich auf den Bundesverfassungsschutzbericht.
  Genau, darin steht das ja. Ist das denn aus der Sicht des BMI verfassungsfeindlich?
  Wie gesagt, ich verweise auf den Bundesverfassungsschutzbericht ‑ der Bundesverfassungsschutz
  ist eine Behörde im Geschäftsbereich des BMI ‑, dort stehen Details dazu. Meine
  Frage geht an Herrn Giese. Die Konrad-Adenauer-Stiftung schließt ihr Auslandsbüro
  in Tiflis , in der georgischen Hauptstadt. Auch die Friedrich-Naumann-Stiftung muss
  das tun. Die KAS betont, dass das nicht freiwillig ist. Ich zitiere kurz: „Die Schließung
  unseres Auslandsbüros in Tiflis ist eine unmittelbare Folge der von der georgischen
  Regierung geschaffenen politischen und rechtlichen Rahmenbedingungen, unter denen
  die KAS ihren Kernauftrag als politische Stiftung vor Ort nicht mehr erfüllen kann.“
  Wie verfolgen Sie das? Was sagen Sie dazu? Ich hatte schon Sorge, dass der Kollege
  heute gar nicht mehr drankommt. Das wäre ja ungewöhnlich. Ich habe heute noch recht
  wenig geredet, Herr Hille. Dann vielen Dank für die Frage, auch im Namen von Herrn
  Hille. Ich kann Ihnen dazu sagen: Wir verfolgen das natürlich genau. Wir sind auch
  im Kontakt mit den politischen Stiftungen; das wissen Sie. Das Auswärtige Amt führt
  einen sehr regen Dialog mit allen politischen Stiftungen. Ich kann Ihnen generell
  zur Arbeit der politischen Stiftungen in Georgien sagen, dass diese über Jahre einen
  sehr, sehr wichtigen Beitrag zur demokratischen und zivilgesellschaftlichen Entwicklung
  leisten und geleistet haben. Das Auswärtige Amt bedauert deswegen die Schließungen,
  die vor allem auch einen großen Verlust für Georgien und die georgische Gesellschaft
  bedeuten. Wir haben gegenüber den georgischen Stellen unser völliges Unverständnis
  über die zugrunde liegenden Entscheidungen klar zum Ausdruck gebracht. Sie wissen,
  Georgien ist seit einer geraumen Zeit in einer schweren innenpolitischen Krise.
  Mit Blick auf die Krise und die Politik, die zu dieser Krise geführt hat: Es sind
  auch bereits seit einiger Zeit die EU-Beitrittsverhandlungen eingefroren. An dieser
  Stelle vielleicht noch einmal die Betonung, dass es auf der Hand liegt, dass die
  Fortführung eines solchen Kurses der Regierung mit der Beibehaltung des Kandidatenstatus
  über kurz oder lang nicht mehr vereinbar ist. Ich hätte eine Zusatzfrage an das
  BMZ, ob es dazu eine Ergänzung gibt. Denn dort gab es ja mal ‑ bis 2024 ‑ staatliche
  Kooperationsprojekte, und es gibt auch noch Maßnahmen der Zivilbevölkerung. Dazu
  würde ich gerne eine Reaktion haben, bitte. Vielen Dank. ‑ Ich kann Ihnen dazu sagen,
  dass das Entwicklungsministerium den europäischen Weg Georgiens früher unterstützt
  hat. Mit der derzeitigen Regierung ist diese Zusammenarbeit so nicht mehr sinnvoll
  umsetzbar. Deswegen hat das Bundesentwicklungsministerium im Dezember 2024 geplante
  Projekte mit der georgischen Regierung, damals im Umfang von 237 Millionen Euro,
  gestoppt. Das BMZ hat damit die Konsequenzen aus der Abkehr der georgischen Regierung
  von einer EU-Annäherung gezogen. Das ist der aktuelle Stand. Meine Frage geht an
  das Wirtschaftsministerium zur Warenhauskette Galeria . Es gibt ein neues Insolvenzverfahren
  , und es ist unklar, ob die 12 000 Beschäftigten Insolvenzgeld erhalten. Sehen Sie
  eine Möglichkeit, dass die Bundesregierung im Zweifelsfall für dieses Insolvenzgeld
  einspringt? Ich habe die Berichterstattung dazu zur Kenntnis genommen. Ich habe
  zum jetzigen Zeitpunkt aber keine Maßnahmen anzukündigen. Herr Giese, ich habe Sie
  am vergangenen Mittwoch hier gefragt, ob Ihr Haus im Zusammenhang mit den brasilianischen
  Präsidentschaftswahlen , die jetzt am Sonntag stattfinden, Wahlbeobachter schickt.
  Sie wollten eine Nachreichung machen. Das ist nicht erfolgt. Deswegen frage ich
  erneut. Ist es der Fall? Mir war, dass wir das nachgeliefert hätten. Wenn das nicht
  geschehen sein sollte, dann bitte ich um Entschuldigung. Dann wäre das ein Versehen.
  Ich glaube, wir hatten darauf schriftlich geantwortet. Die Antwort wäre gewesen,
  dass es keine Beobachtung durch Staaten aus Europa gibt. Üblicherweise wird das
  für den Europäischen Staatenverbund über den Europarat koordiniert. Sie wissen,
  dass Brasilien nicht zu Europa gehört und auch nicht zum erweiterten Kreis dieser
  Staaten. Aber es gibt eine Organisation amerikanischer Staaten ‑ das ist eine Information,
  die ich Ihnen als Recherchehinweis geben kann ‑; die hat sich dazu geäußert, dass
  es von dort aus eine Wahlbeobachtung geben wird. Das ist der Stand, den ich Ihnen
  sagen kann. Auch wenn Brasilien nicht zu Europa gehört, waren zwischen dem 9. und
  11. September eine französische und eine deutsche Delegation in Brasilia. Sie haben
  sich von dem Nachrichtendienst briefen lassen in Bezug auf die Beeinflussung der
  Wahlen bei der Durchführung, aber auch bei den Resultaten der Präsidentschaftswahlen
  durch die US-Administration. Wer war dabei, und welche Expertise wurde nach Brasilia
  geschickt? Sie konfrontieren mich jetzt mit einer Information, die mir leider nicht
  vorliegt. Es tut mir leid, das habe ich noch nicht gehört. Das müsste ich Ihnen
  nachliefern. Es tut mir leid. Das ist mir nicht bekannt. Weil ich bisher nur Kritik
  von dem Transatlantikkoordinator der Bundesregierung zum Thema OSZE-Ausschlussvon
  der Wahlbeobachtung der Midterms in den USA gehört habe, würde ich gerne vom Auswärtigen
  Amt hören, ob das Auswärtige Amt als solches beziehungsweise der Außenminister Kritik
  an dem Ausschluss der OSZE von den Midterms hat. Mich interessiert auch, was der
  Bundeskanzler dazu sagt, Herr Hille. Er ist ja auch ein überzeugter Transatlantiker.
  Die Integrität von Wahlen, nehme ich an, ist ihm wichtig. Die OSZE kann sich dies
  jetzt bei den Midterms nicht angucken. Ist das für den Kanzler ein Thema? Vielleicht
  fange ich an, weil Sie die Frage zuerst mir gestellt haben. Natürlich ist es bedauerlich,
  wenn es diese Wahlbeobachtung nicht geben kann. Gleichzeitig ist es sozusagen eine
  gegenseitige Selbstverpflichtung der teilnehmenden Staaten in der OSZE. Insofern
  ist es eine souveräne Entscheidung der Vereinigten Staaten, ob sie das möglich machen
  wollen oder nicht. Wir sind dazu in einem Dialog. Vielleicht gibt es ja noch eine
  Möglichkeit, dass das geschehen kann. Aber ganz klar: Das ist eine souveräne Entscheidung.
  Wir haben keinen Anlass daran zu zweifeln, dass diese Wahlen nach den innerstaatlichen
  Regeln der USA ablaufen werden. Ich hatte auch das Kanzleramt gefragt und den überzeugten
  Transatlantiker. Das hat das Kanzleramt, vertreten durch mich, auch gehört. Aber
  ich habe dem, was der Kollege Giese gerade gesagt hat, nichts hinzuzufügen. Ich
  habe eine Frage an das Bildungsministerium. Es geht um die Ankündigung oder die
  Warnung der Ministerin in Richtung von AfD, Sachsen-Anhalt, seitens des Bundes rechtliche
  Schritte vorzunehmen, wenn sich dort, in Sachsen-Anhalt , die Bildungspolitik drastisch
  ändert . Vielleicht könnten Sie noch einmal kurz skizzieren, im Ton sozusagen, was
  das für Schritte wären, welche rechtlichen Grundlagen dafür bestehen und wann für
  die Ministerin tatsächlich auch eine Grenze überschritten wäre, um dabei zu handeln?
  Ich möchte an der Stelle ungern die Worte der Ministerin interpretieren. Klar ist,
  dass wir uns das natürlich sehr genau anschauen. Die Ministerin hat auch immer wieder
  betont, dass wir uns diese Dinge genau anschauen werden. Sorry, ich wiederhole mich.
  Es ist natürlich klar, dass wir den Bildungsföderalismus haben. Aber nichtsdestoweniger
  gibt es natürlich bestimmte Bereiche, in denen eben dann auch der Bund eingreifen
  kann. Sie hatte beispielsweise auch auf Fördergelder geschaut bzw. Sie betont eben
  auch immer wieder, dass beispielsweise beim Startchancen-Programm, das jetzt ja
  etabliert wird, sehr genau hingeschaut wird, dass diese Gelder auch korrekt eingesetzt
  werden und der Bund dabei im Zweifel auch eingreifen kann. Können Sie vielleicht
  noch einmal sagen, ab wann Frau Prien dabei sozusagen tätig werden will? Es wird
  ja sicherlich auch damit gerechnet worden sein, dass es dazu noch Nachfragen gibt.
  Ich möchte es an der Stelle dabei belassen, dass wir es uns sehr genau anschauen
  werden. Meine Frage geht an das Finanzministerium. Es gibt einen Brief von Frau
  Meloni an die Kommission mit der Forderung nach einer Lockerung der europäischen
  Fiskalregeln im Zusammenhang mit der Energiepreissituation. Das soll bei der Sitzung
  des ECOFIN in der kommenden Woche Thema sein. Mich würde interessieren: Wie sieht
  die Position der Bundesregierung dazu aus? Wird der Finanzminister selbst am ECOFIN
  teilnehmen? Ich fange vielleicht mit dem letzten Teil an: Zum jetzigen Stand wird
  Herr Klingbeil teilnehmen und vor Ort sein. Ich will jetzt den einzelnen Verhandlungen
  nicht vorgreifen. Ich kann Ihnen heute auch noch keine abgestimmte Position nennen,
  mit der Herr Klingbeil dort hereingehen wird. Insofern muss ich noch um ein bisschen
  Geduld bitten. An das Innenministerium: Es gibt Berichte über eine Sonderkonferenz
  der Innenminister kommenden Montag. Meine Frage ist, ob das stimmt. Wird es eine
  geben? Ich würde dazu ganz kurz grundsätzlich einordnen: Wir als BMI oder auch der
  Bundesinnenminister sind lediglich zu Gast bei der IMK. Das sind wir natürlich sehr
  gern. Aber zu Fragen der Programmatik, inhaltlichen Fragen etc. würde ich Sie bitten,
  sich an die IMK zu wenden. Ich wollte erst einmal wissen, ob es überhaupt stimmt,
  dass es sie am Montag geben wird. Genau, und dazu würde ich Sie bitten, sich an
  die IMK zu wenden. Ich habe eine Frage, die sich wahrscheinlich an Frau Jenning,
  vielleicht an Herrn Giese richtet. Das Pentagon hat einige europäische Verbündete
  zu einer Diskussion über die Zukunft der NATO eingeladen . Deutschland ist dabei,
  aber andere wichtige europäische Verbündete nicht. Deswegen wüsste ich ganz gern,
  wieso Deutschland daran teilnimmt und ob man nicht die Gefahr einer Spaltung der
  NATO durch diese Einladungspolitik der Amerikaner sieht. Mir liegen tatsächlich
  im Moment keine Erkenntnisse zu dieser Einladung vor, sodass ich um Verständnis
  dafür bitte, dass ich das jetzt auch nicht bewerten kann. Ich schaue, ob es bei
  uns etwas gibt. Sollte es dazu etwas nachzuliefern geben, dann mache ich das natürlich
  gern. Bitte auch genau mit dieser Stoßrichtung: Warum nimmt man also teil, wenn
  andere Europäer nicht teilnehmen dürfen? Herr Giese, Ihr Haus hat immer betont,
  dass Deutschland sich für das Völkerrecht weltweit einsetzt. Die Entwicklung in
  Bolivien spitzt sich zu. Gestern ist der Generalstaatsanwalt ohne richterlichen
  Beschluss verhaftet worden. Er war gerade bei der fortschreitenden Untersuchung
  von Fernando Cerimedo. Das ist ein rechter Stratege, der auch den Bolsonaro-Clan,
  Javier Milei usw. berät. Präsident Trump hat diese Entwicklung dann begrüßt. Das
  ist auch ein Anzeichen dafür, dass es noch einmal eine Einflussnahme der US-Administration
  in Südamerika gibt. Wie ordnet Ihr Haus diese Entwicklung ein, spezifisch was den
  gestrigen Anlass anbetrifft, aber auch in Südamerika grundsätzlich? Ich habe von
  diesem Vorgang aus der Presse erfahren. Es ist ein interner Vorgang in Bolivien.
  Das würde ich von außen erst einmal nicht kommentieren wollen. Ganz grundsätzlich
  wissen Sie, dass es eine enge Beziehung zwischen Deutschland und Bolivien gibt.
  Der Außenminister war auch im vergangenen Jahr in Bolivien zu Gast. Er war einen
  Tag nach der Amtseinführung des Präsidenten dort und hat auch den Außenminister
  getroffen. Wir sind sehr daran interessiert, dass es dort eine stabile Regierung
  gibt und dass es für die Menschen in Bolivien einen wirtschaftlichen Aufschwung
  gibt. Es gibt dort ein großes wirtschaftliches Potenzial der Zusammenarbeit mit
  Bolivien. Insofern begrüßen wir natürlich alles, was dem Ausbau unserer Beziehungen
  dient und was auch der Stabilität in Bolivien dient. Darüber hinaus: Gestatten Sie
  es mir, dass wir uns zu diesen Einzelfällen, in denen es wirklich darum geht, wie
  die Justiz dort, im Inneren des Landes, arbeitet, grundsätzlich nicht äußern. Wenn
  es irgendeine Verbindung zu Deutschland geben sollte, würde ich Ihnen das, eine
  Kommentierung, nachliefern. Aber die sehe ich derzeit nicht. Aber trifft es zu,
  dass die Einflussnahme der US-Administration in Südamerika nicht gerade zur Stabilisierung
  der jeweiligen Partner von Deutschland wie zum Beispiel Bolivien und Brasilien beiträgt?
  Das ist vielleicht noch einmal eine grundsätzliche Sache. Sie fragen mich sehr häufig
  nach den Beziehungen zwischen den USA und verschiedenen Staaten in Lateinamerika.
  Das ist wirklich etwas, das Sie diese beiden Staaten dann fragen sollten, und nicht
  unbedingt ein Thema für die Regierungspressekonferenz. Es geht ja darum, dass Deutschland
  sich für das Völkerrecht engagieren wollte. Das ist der Hintergrund. Wie gesagt,
  geht es um die bilateralen Beziehungen zwischen den USA und verschiedenen Staaten
  in Lateinamerika. Dazu kann ich Ihnen keine weiteren Informationen geben.'
