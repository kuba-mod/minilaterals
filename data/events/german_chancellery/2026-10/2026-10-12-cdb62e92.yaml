title: Bevölkerungsschutz- und Katastrophenhilfe Internationaler Tag der Katastrophenvorbeugung
text: 'Bürgerinnen und Bürger können auch selbst vorsorgen: Zum Beispiel einen Vorrat
  an haltbaren Lebensmitteln anlegen. Foto: Getty Images/iStockphoto/OlenaMykhaylova
  Mit dem internationalen Tag der Katastrophenvorbeugung wird jedes Jahr am 13. Oktober
  darauf aufmerksam gemacht, wie Menschen und Gemeinschaften auf der ganzen Welt ihre
  Widerstandsfähigkeit gegenüber Katastrophen stärken. Auf diesem Weg soll das Bewusstsein
  dafür geschärft werden, wie wichtig es ist, auf allen Ebenen auf die Reduzierung
  von Katastrophenrisiken hinzuwirken. Der Schlüssel ist Vorsorge – staatliche und
  private. Im Fokus steht dabei immer der Schutz von Menschenleben, aber es lohnt
  sich auch, finanziell in Prävention und Widerstandsfähigkeit zu investieren. Die
  Zuständigkeiten für den Zivil- und Katastrophenschutz sind im Grundgesetz geregelt.
  Die Länder sind für den Schutz vor großen Unglücken und Katastrophen in Friedenszeiten
  („Katastrophenschutz”) zuständig. Der Bund hat die Aufgabe, die Bevölkerung vor
  kriegsbedingten Gefahren („Zivilschutz“) zu schützen. Bund, Länder und private Hilfsorganisationen
  arbeiten eng vernetzt zusammen. So kann schnell Hilfe geleistet und die Bürgerinnen
  und Bürger können besser geschützt. Bürgerinnen und Bürger können auch selbst vorsorgen.
  Im Ratgeber des Bundesamtes für Bevölkerungsschutz und Katastrophenhilfe (BBK) „Vorsorgen
  für Krisen und Katastrophen“ gibt es Tipps, um sich auf verschiedene Notsituationen
  vorzubereiten. Dazu gehört zum Beispiel, Lebensmittel und Getränke vorzuhalten,
  eine Hausapotheke anzulegen und ein Notgepäck zu packen. Vorbereitung zahlt sich
  aus: Man weiß, was zu tun ist und kann dadurch ruhiger bleiben. Man kann sich und
  andere versorgen, bis Hilfe eintrifft. Schließlich entlastet man die Rettungskräfte.
  Die können dann Menschen unterstützen, die sich nicht selbst helfen können. Die
  Erfahrungen aus den letzten Jahren – insbesondere die COVID19-Pandemie, die Flutkatastrophe
  im Juli 2021 und der völkerrechtswidrige Angriffskrieg Russlands gegen die Ukraine
  – haben aufgezeigt, wie wichtig es ist, dass wir uns gegenüber den Auswirkungen
  von Katastrophen widerstandfähiger machen. Mit der Resilienzstrategie setzt die
  Bundesregierung hierfür einen strategischen Rahmen. Mit dem Pakt für den Bevölkerungsschutz
  reagiert die Bundesregierung auf die veränderte Sicherheitslage in Europa und den
  wachsenden Anspruch an den Schutz der Bevölkerung. Ziel ist ein umfassender Modernisierungsschub
  im Bevölkerungsschutz und der zivilen Verteidigung. Krisen treten oft unerwartet
  auf: Naturkatastrophen, Pandemien, kriegerische Auseinandersetzungen oder Stromausfälle
  können jederzeit das Leben vieler Menschen beeinflussen. Umso wichtiger ist es,
  gut vorbereitet zu sein. Genau hier setzt der gemeinsame Bevölkerungsschutztag von
  Bund und Ländern an, der jährlich stattfindet. Ziel ist, den Bürgerinnen und Bürgern
  den Bevölkerungsschutz in Deutschland näherzubringen. Der Bundesweite Warntag findet
  jedes Jahr am zweiten Donnerstag im September statt. Dabei sollen die verschiedenen
  Warnsysteme in Deutschland getestet und die Bevölkerung für Warnung und Eigenvorsorge
  sensibilisiert werden. Kernaufgabe des Staates und der Wirtschaft ist es, kritische
  Infrastruktur zu schützen. Für den Schutz ihrer Anlagen sind in erster Linie deren
  Betreiber verantwortlich. Diese müssen sich umfassend gegen Gefahren wie Naturkatastrophen,
  Terrorismus, Sabotage aber auch menschliches Versagen wappnen. Um auf die unterschiedlichen
  Gefahren flexibel reagieren zu können, tritt die Widerstandsfähigkeit Kritischer
  Infrastrukturen zunehmend in den Vordergrund. Die Bundesregierung hat das sogenannte
  KRITIS-Dachgesetz auf den Weg gebracht. Es legt fest, welche Infrastruktur-Einrichtungen
  unentbehrlich dafür sind, die Versorgung der Bevölkerung zu sichern und die Wirtschaft
  aufrechtzuerhalten. Betreiber kritischer Infrastruktur sind unter anderem zu Risikoanalysen
  und passenden Resilienzmaßnahmen sowie zur Meldung von Vorfällen, Störungen oder
  mutmaßlichen Sabotageakte verpflichtet. Um die Cyber sicherheit weiter zu erhöhen,
  hat die Bundesregierung das NIS-2-Umsetzungs- und Cyber sicherheitsstärkungsgesetz
  auf den Weg gebracht. Damit wird das deutsche IT -Sicherheitsrecht umfassend modernisiert
  und neu strukturiert. Darüber hinaus hat die Bundesregierung das Gesetz zur Stärkung
  der Cybersicherheit beschlossen. Das sieht mehr Befugnisse für das Bundesamt für
  Sicherheit in der Informationstechnik, das Bundeskriminalamt sowie die Bundespolizei
  vor. Mit der Nationalen Wirtschaftsschutzstrategie der Bundesregierung soll die
  Widerstandsfähigkeit deutscher Unternehmen durch ressortübergreifende Zusammenarbeit
  gestärkt werden, um Wertschöpfungsketten, Lieferketten und Innovationen vor physischen,
  digitalen und hybriden Bedrohungen zu schützen. Angestrebt wird ein integrierter
  Wirtschaftsschutz, bei dem alle Bereiche der Politik, der Behörden und der Wirtschaft
  eng zusammenarbeiten Für die Bewältigung außergewöhnlicher Gefahren- und Schadenlagen
  – wie beispielsweise Naturkatastrophen, Industrieunfälle oder Folgen terroristischer
  Angriffe – entwickelt und koordiniert der Bund Maßnahmen. Diesen systemischen Umgang
  mit Krisensituationen nennt man Krisenmanagement. Dadurch sind wir für gefährliche
  Situationen gewappnet und haben ein leistungsfähiges System, um in Krisensituationen
  Hilfe zu leisten. Katastrophen kennen keine Landesgrenzen. Diese internationalen
  Aufgaben im Bereich des Bevölkerungsschutzes, die sich aus den Mitgliedschaften
  in den Vereinten Nationen (UN), der Europäische Union (EU), der NATO oder in der
  OECD ergeben, nimmt für die Bundesregierung das Bundesinnenministerium (BMI) wahr.
  All diese internationalen Organisationen haben Konzepte zur Verbesserung der multilateralen
  Zusammenarbeit bei Katastrophen entwickelt. Daneben engagiert sich Deutschland auch
  bilateral. So unterstützen beispielsweise das Technische Hilfswerk (THW) und das
  Bundesamt für Bevölkerungsschutz und Katastrophenhilfe (BBK) Partnerländer beim
  Aufbau und bei der Umsetzung eines eigenen Katastrophen- und Zivilschutzes.'
