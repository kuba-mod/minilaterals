title: Gemeinsame deutsch-französische Presseerklärung zur Zukunft der europäischen
  Automobilindustrie
text: 'Frankreich und Deutschland haben sich auf ein gemeinsames Vorgehen zur Sicherung
  der Zukunft der europäischen Automobilindustrie verständigt. Unser gemeinsames Ziel
  ist klar: Wir wollen den Wandel unserer Automobilindustrie erfolgreich gestalten,
  dabei an unseren Klimazielen festhalten und sicherstellen, dass die Autos der Zukunft
  in Europa produziert werden. Unser Kurs bleibt unverändert: Wir streben eine deutliche
  Senkung der CO₂-Emissionen an und stärken zugleich Europas Kapazitäten für die Entwicklung
  und Fertigung der nächsten Generation von Elektrofahrzeugen. „Europäische Präferenz“
  bedeutet in der Praxis: Der Übergang zu sauberer Mobilität muss mit Investitionen,
  Innovationen und Produktion in Frankreich, Deutschland und ganz Europa einhergehen.
  Zu diesem Zweck schlagen Frankreich und Deutschland ein umfassendes Paket vor. Es
  verbindet einen ehrgeizigen europäischen Dekarbonisierungspfad mit der nötigen regulatorischen
  Flexibilität, um unterschiedlichen Marktgegebenheiten und Technologieoffenheit Rechnung
  zu tragen. Zudem bietet es konkrete Anreize für Investitionen, Forschung und Entwicklung,
  eine europäische Produktion sowie widerstandsfähige Lieferketten. Dieser ausgewogene
  Ansatz ermöglicht es der Europäischen Union, ihre Klimaziele zu verfolgen und gleichzeitig
  die technologische Souveränität, die industrielle Basis sowie die internationale
  Wettbewerbsfähigkeit ihrer Automobilindustrie zu stärken. Europa muss ein Kontinent
  sein, der Innovationen hervorbringt, investiert und produziert – und dabei das Klima
  schützt sowie Arbeitsplätze sichert. Dies ist das Ziel unseres Engagements und der
  Leitgedanke unseres gemeinsamen Vorgehens. Frankreich und Deutschland sind entschlossen,
  diesen Schwung zu nutzen und gemeinsam mit ihren europäischen Partnern zügig auf
  eine Einigung hinzuarbeiten. Wir sind es unseren Beschäftigten, unserer Industrie
  und unseren Bürgerinnen und Bürgern schuldig, sicherzustellen, dass Europa beim
  globalen Wandel der Automobilbranche eine führende Rolle einnimmt. Unser Ziel ist
  klar: eine wettbewerbsfähige, innovative und dekarbonisierte europäische Automobilindustrie,
  die in Europa produziert und die Arbeitsplätze von morgen schafft. - Englische Übersetzung
  - Joint Franco-German Press Statement on the Future of the European Automotive Industry
  France and Germany have reached agreement on a joint approach to securing the future
  of the European automotive industry. Our shared ambition is clear: to successfully
  transform our automotive industry while maintaining our climate ambition and ensuring
  that the cars of the future are produced in Europe. Our course remains unchanged:
  to achieve substantial reductions in CO₂ emissions while strengthening Europe’s
  capacity to develop and manufacture the next generation of electric vehicles. This
  is what European preference means in practice: ensuring that the transition to clean
  mobility goes hand in hand with investment, innovation and production in France,
  Germany and across Europe. To that end, France and Germany propose a comprehensive
  package that combines an ambitious European decarbonisation pathway with the regulatory
  flexibility needed to reflect different market realities and technological conditions.
  It also provides concrete incentives for investment, research and development, European
  production, and resilient supply chains. This balanced approach will enable the
  European Union to pursue its climate objectives while strengthening the technological
  sovereignty, industrial base and international competitiveness of its automotive
  industry. Europe must be a continent that innovates, invests and produces, while
  protecting the climate and safeguarding jobs. This is the purpose of our commitment
  and the guiding principle of our joint approach. France and Germany are determined
  to build on this momentum and work swiftly with their European partners towards
  an agreement. We owe it to our workers, our industries and our citizens to ensure
  that Europe remains a leading force in the global automotive transition. Our objective
  is clear: a competitive, innovative and decarbonised European automotive industry,
  producing in Europe and creating the jobs of tomorrow.'
