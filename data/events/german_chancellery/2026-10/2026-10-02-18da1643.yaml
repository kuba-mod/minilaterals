title: Bundeskanzler Merz empfängt den britischen Premierminister Burnham
text: Bundeskanzler Friedrich Merz wird am 8. Oktober 2026 den Premierminister des
  Vereinigten Königreichs Großbritannien und Nordirland, Andrew Burnham, zum Antrittsbesuch
  im Bundeskanzleramt in Berlin empfangen. Zum Auftakt des Besuchs wird der britische
  Premierminister um 12:30 Uhr mit militärischen Ehren begrüßt. Anschließend ist ein
  gemeinsamer Austausch mit Schülerinnen und Schülern des Englisch-Leistungskurses
  eines Berliner Gymnasiums vorgesehen. Ein Höhepunkt des Besuchs ist der Austausch
  der Ratifikationsurkunden zum deutsch-britischen Freundschaftsvertrag („Kensington-Vertrag“).
  Damit setzen beide Staaten ein sichtbares Zeichen für die Vertiefung ihrer partnerschaftlichen
  Beziehungen und die enge Zusammenarbeit in Europa. Im Mittelpunkt der Gespräche
  zwischen Bundeskanzler Merz und dem britischen Premierminister werden voraussichtlich
  bilaterale und außenpolitische Themen sowie europa- und wirtschaftspolitische Fragen
  stehen.
