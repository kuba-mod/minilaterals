title: Im Kabinett beschlossen Besserer Schutz bei häuslicher Gewalt
text: 'Um gewaltbetroffene Personen schnell zu schützen, sollen Fachkräfte, die im
  Verfahren bei Gewaltschutz- und Kindschaftssachen beteiligt sind, schneller zusammenarbeiten
  können. Foto: Getty Images/iStockphoto/Aghavni Shahinyan Das Bundeskabinett hat
  einen Gesetzentwurf zur Verbesserung des Schutzes von Opfern häuslicher Gewalt beschlossen. „Gewalt
  in der Familie ist kein privates Problem“, betont Bundesjustizministerin Stefanie
  Hubig. „Wer von häuslicher Gewalt betroffen ist, muss sich darauf verlassen können,
  dass der Staat Schutz bietet und konsequent zur Seite steht.“ Der Gesetzentwurf
  enthält ein Bündel von Änderungen im familiengerichtlichen Verfahren. Insbesondere
  soll ein Wahlgerichtsstand eingeführt werden. Das erleichtert es einem betroffenen
  Elternteil, seinen aktuellen Aufenthaltsort geheim zu halten. Das Gericht soll zudem
  nicht versuchen, die betroffenen Personen zu einer einvernehmlichen Lösung zu bewegen,
  wenn zwischen den beteiligten Personen ein Gewaltverhältnis besteht. Richterinnen
  und Richter in Familiensachen sollen über belegbare Kenntnisse auf den Gebieten
  des Familienrechts verfügen. Grundkenntnisse der Psychologie, insbesondere der Entwicklungspsychologie
  des Kindes, Dynamiken und Auswirkungen häuslicher Gewalt und der Kommunikation mit
  Kindern sind wichtig, um in der Sache gut entscheiden zu können. Gewaltbetroffene
  Personen und ihre Kinder brauchen zudem umgehend und zielgerichtet Schutz. Die Änderungen
  sollen dafür sorgen, dass die beteiligten Fachkräfte bei Gewaltschutz- und Kindschaftssachen
  in allen Phasen des Verfahrens schneller und besser zusammenarbeiten können.'
