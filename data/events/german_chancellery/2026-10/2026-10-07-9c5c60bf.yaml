title: Im Kabinett beschlossen Besserer Schutz vor digitaler Gewalt
text: 'Frauen und Mädchen sind besonders häufig von digitaler Gewalt betroffen. Foto:
  mauritius images / Antonio Guillem Fernández / Alamy Durch die rasante Entwicklung
  des digitalen Raums gewinnt der Bereich der digitalen Gewalt immer stärker an Bedeutung.
  Besonders häufig sind Mädchen und Frauen betroffen. 2024 waren 60 Prozent der in
  der Polizeilichen Kriminalstatistik registrierten Opfer digitaler Gewalt weiblich.
  Das Recht hinkt der digitalen Realität jedoch hinterher. Die Bundesregierung will
  deshalb bestehende Strafbarkeitslücken schließen und die Rechte der Betroffenen
  bei der Rechtsdurchsetzung stärken. Sie setzt dieses Vorhaben durch mehrere Änderungen
  im Strafgesetzbuch sowie durch die Schaffung eines digitalen Gewaltschutzgesetzes
  um. Die Bundesregierung stärkt mit den Änderungen im Strafgesetzbuch den Schutz
  vor digitaler Gewalt, indem sie Strafbarkeitslücken im Bereich bildbasierter sexualisierter
  Gewalt schließt und den Phänomenbereich digitaler Gewalt insgesamt strafrechtlich
  klarer fasst. Das unbefugte Herstellen und Verbreiten von intimem Bildmaterial,
  wie etwa sexualisierten Deepfakes oder Rachepornos, soll durch einen neuen Straftatbestand
  umfassend geregelt werden. Unerheblich ist dabei, ob die Herstellung oder das Verbreiten
  öffentlich oder privat erfolgt. Zudem gilt die Strafbarkeit unabhängig davon, ob
  die Herstellungsform reale oder computergenerierte Aufnahmen betrifft. „ Deepfakes
  “ sind aufwändig erstellte beziehungsweise verfälschte Bilder, Tonaufzeichnungen
  oder Videos. Sie entstehen auch unter Einsatz Künstlicher Intelligenz (KI). Auch
  die Herstellung von digitalen voyeuristischen Nacktaufnahmen in öffentlich zugänglichen
  Bereichen (wie FKK -Strand, Sauna) soll nach der neuen Vorschrift strafbewehrt sein.
  Ferner strebt die Bundesregierung an, den Besitz von Vergewaltigungsvideos unter
  Strafe zu stellen. Außerdem wird das wiederholte und ständige unbefugte Überwachen
  wie zum Beispiel des Aufenthaltsortes einer Person mittels GPS - Trackern (sogenanntes
  Cyberstalking ) strafrechtlich klarer erfasst. Auch die identitätsmissbrauchende
  Verbreitung von Deepfakes und vergleichbaren Inhalten, die dem Ansehen der anderen
  Person erheblich schaden können, soll künftig strafbar sein. Die Bundesregierung
  will es Betroffenen außerdem leichter machen, zivilrechtlich gegen Verletzungen
  ihrer Persönlichkeitsrechte im Netz vorzugehen. Hierfür werden Online -Plattformen
  und Internetzugangsanbieter stärker in die Pflicht genommen. Nach dem Gesetzentwurf
  haben Betroffene einen Auskunftsanspruch gegenüber Online -Plattformen und Internetzugangsanbietern,
  wenn deren Dienste wie für Beleidigungen genutzt werden. Die Betroffenen können
  aufgrund einer richterlichen Anordnung zum Beispiel Name, Geburtsdatum, Anschrift
  und E-Mail -Adresse erfahren, wenn diese Daten zur Geltendmachung von Schadensersatzansprüchen
  erforderlich sind. Zudem können Accounts per richterlicher Anordnung für einen angemessenen
  Zeitraum gesperrt werden, wenn der Nutzer schwerwiegend die Rechte der Betroffenen,
  vor allem durch strafbare Äußerungen verletzt und solche weiteren Handlungen erwartet
  werden. Die Hürden für eine Account sperre sind im Einzelfall hoch, um die Meinungsfreiheit
  nicht zu verletzen.'
