date: '2026-10-16'
type: press_release
source_name: german_chancellery
title: Pressekonferenz mit Bundeskanzler Merz nach Europäischem Rat im Oktober 2026
  „Europa ist handlungsfähig“
text: 'Bundeskanzler Merz bei der Abschlusspressekonferenz in Brüssel. Zum Abschluss
  des Europäischen Rates in Brüssel zog Bundeskanzler Friedrich Merz eine positive
  Bilanz. Die Europäische Union komme in wichtigen Fragen voran, insbesondere bei
  der Wettbewerbsfähigkeit. Nur ein „wirtschaftlich starkes und souveränes Europa“
  könne sich in der Welt behaupten, betonte Merz. Unterstützung erhielt ein deutsch-französischer
  Vorstoß zur europäischen Handelspolitik, womit die EU künftig schneller auf globale
  Wettbewerbsverzerrungen reagieren könne. Mit Blick auf die Verhandlungen über den
  EU -Haushalt ab 2028 forderte Merz mehr finanzielle Zurückhaltung. Angesichts notwendiger
  Konsolidierungen in den Mitgliedstaaten sei ein Anstieg des europäischen Haushalts
  um rund 50 Prozent nicht angemessen. Als weiteren Erfolg wertete der Bundeskanzler
  die Verständigung mit Frankreich über die Zukunft der europäischen Automobilindustrie
  . Die Einigung verbinde das Festhalten an den Klimazielen mit mehr Technologieneutralität
  und einer stärkeren Berücksichtigung alternativer Kraftstoffe. Die Vorgaben für
  2035 sollen dabei eingehalten werden, zugleich aber unterschiedliche Wege zur Kohlenstoffdioxid-Freiheit
  offen bleiben. Weitere Informationen zum deutsch-französischen Übereinkommen zur
  Zukunft der europäischen Automobilindustrie finden Sie in der gemeinsamen Pressemitteilung
  . Meine Damen und Herren, herzlichen Dank für Ihr Kommen! Wir haben die zweitägigen
  Beratungen des Europäischen Rates im Oktober noch nicht ganz, aber fast abgeschlossen.
  Die letzten beiden Tage haben gezeigt, dass wir in der Europäischen Union in einigen
  ganz wesentlichen Fragen gut vorankommen. Wir haben uns sehr ausführlich über das
  Thema Wettbewerbsfähigkeit in der Europäischen Union verständigt. Wir haben dieses
  Thema in den Schlussfolgerungen auf meine Bitte hin an den Anfang gestellt, was
  das zweite Thema – das der Ukraine – in keiner Weise mindert. Aber mir war wichtig,
  dass wir das Thema der Wettbewerbsfähigkeit der Europäischen Union sichtbar auf
  die Nummer eins heben. Das ist in den Schlussfolgerungen auch hinreichend zum Ausdruck
  gekommen. Wir sind uns einig: Nur ein wirtschaftlich starkes und souveränes Europa
  kann in dieser Welt bestehen und die Unternehmen in ganz Europa entlasten. Gleichwohl
  ist es richtig, dass wir den Zeitplan, den wir uns am 12. Februar in Alden Biesen
  gesetzt haben, noch nicht wirklich erfüllt haben, auch für die Jahre 2026 und 2027
  noch nicht. Deswegen bin ich sehr dankbar dafür, dass António Costa den Vorschlag
  gemacht hat, uns am 4. Februar nächsten Jahres – das ist in Deutschland zufällig
  wieder Weiberfastnacht – erneut mit den 27 Staats- und Regierungschefs in Alden
  Biesen zu treffen, um noch einmal zu besprechen, wo wir bei dem Thema der Wettbewerbsfähigkeit
  und des Binnenmarkts stehen. Ich habe parallel dazu mit Emmanuel Macron eine ganze
  Reihe von Themen besprochen. Wir haben auch gemeinsame Vorschläge gemacht. Ich habe
  mit Belgien und Italien Vorschläge gemacht, die alle sehr positiv aufgenommen worden
  sind. Ich bin besonders dankbar dafür, dass das zweite große Thema gestern Abend
  beim Abendessen mit einer für mich überraschend großen Übereinstimmung besprochen
  wurde. Es gab eine wirklich einhellige, ausnahmslose Unterstützung für den Vorschlag
  von Emmanuel Macron und mir, die globalen Ungleichgewichte in der europäischen Handelspolitik
  in Zukunft anders zu beantworten, als wir dies bisher getan haben. Die Kommission
  hat den Auftrag bekommen und auch mitgenommen, jetzt sehr schnell einige legislative
  Vorschläge zu machen. Denn wenn wir so vorgehen wollen, wie wir es vorgeschlagen
  haben, dass die Kommission ein Instrument in die Hand bekommt, mit dem sie schnell
  reagieren kann, und der Europäische Rat nicht zustimmen muss, sondern es nur zurückholen
  kann, dann muss das auf eine neue gesetzliche Grundlage gestellt werden, die die
  Kommission dafür braucht. Das wird noch einige Zeit dauern. Aber wir hoffen, dass
  das jetzt sehr schnell von der Kommission vorgeschlagen und dann auch vom Rat und
  vom Europäischen Parlament akzeptiert wird. Das dritte Thema – es findet in der
  Öffentlichkeit zurzeit vielleicht am meisten Aufmerksamkeit – ist das Thema des
  europäischen Haushalts. Sie wissen, dass wir ab dem Jahr 2028 für die nächsten sieben
  Jahre einen neuen europäischen Haushalt brauchen. Wir haben sehr unterschiedliche
  Positionen zwischen den einzelnen Mitgliedstaaten. Es gibt eine kleinere Gruppe,
  zu der Deutschland gehört, die der Meinung ist, dass wir das europäische Budget
  gegenüber den Vorschlägen der Europäischen Kommission deutlich reduzieren müssen.
  Es gibt eine größere Gruppe, die der Meinung ist, dass man das Budget sogar noch
  ausweiten muss. Ich will aus meiner Sicht noch einmal sagen: Die Zahlen müssen gegenüber
  den Vorschlägen der Kommission weiter sinken. Wir alle haben zu Hause erhebliche
  Maßnahmen zur Haushaltskonsolidierung vorzunehmen. Es kann nicht sein, dass der
  europäische Haushalt in derselben Zeit um 50 Prozent steigt. Das geht finanziell
  nicht. Das kann sich niemand erlauben, auch von den nationalen Beiträgen nicht.
  Aber wir werden darüber noch sehr umfassend sprechen müssen. Es wird im November
  voraussichtlich einen zusätzlichen und im Dezember einen mehrtägigen Europäischen
  Rat geben. Ich hoffe unverändert, dass es uns bis zum Ende des Jahres gelingt, den
  europäischen Haushalt für die Jahre ab 2028 mit einem einstimmigen Ratsbeschluss
  auf den Weg zu bringen. Ob es gelingt, kann ich heute überhaupt nicht sagen. Dafür
  gibt es noch zu viele unterschiedliche Auffassungen. Abschließend: Wir haben am
  Rande des Ratstreffens hier in Brüssel eine Verständigung zwischen Deutschland und
  Frankreich über die zukünftige Politik gegenüber der Automobilindustrie erzielt.
  Das betrifft insbesondere die Antriebstechnologien und die Klimaziele. Ich will
  es einmal ganz einfach sagen: Das Verbrenneraus ist damit Geschichte. Dafür bekommen
  wir viel Zustimmung. Auch das braucht noch die legislative Umsetzung. Alles, was
  wir auch aus anderen Delegationen hören, ist, dass es dafür Zustimmung gibt, zumal
  wir auch noch einige Vorschläge zur zukünftigen Nutzung alternativer Kraftstoffe
  oder „ biofuels “ – wie immer man sie gerne nennen möchte – gemacht haben. Ich bin
  sehr dankbar dafür, dass uns das gelungen ist. Das sind sehr intensive Gespräche
  in den letzten Wochen gewesen. Ich bedanke mich auch beim Koalitionspartner in Berlin,
  dass er dem Weg, den wir jetzt gemeinsam vorschlagen, aus Deutschland und Frankreich,
  folgt, dass wir die Klimaziele bis zum Jahr 2035 einhalten, 90 Prozent CO 2 -frei ab
  2035, und dass die zehn Prozent, die übrig bleiben, nicht kompensiert werden müssen,
  dass wir aber eben auch Biokraftstoffe, CO 2 -Neutralität sozusagen mit ermöglichen.
  Das ist eine gute Entscheidung. Wir haben ja immer, wie Sie es wissen, auch die
  Technologieneutralität verlangt, nicht die einseitige Festlegung auf eine bestimmte
  Technologie, sondern, das Ziel „ CO 2 -frei“ auch mit anderen Technologien zu erreichen.
  Das haben wir heute noch einmal einen weiteren Schritt vorangebracht. Noch einmal:
  Es ist eine Einigung, die wir jetzt zwischen Deutschland und Frankreich als zwei
  von mehreren großen Automobilnationen in Europa erzielt haben. So wie ich es aus
  der italienischen Delegation höre, sind auch unsere italienischen Freunde damit
  weitgehend einverstanden. Wie gesagt, muss es jetzt alles noch in den Prozess eingebracht
  werden. Aber ich glaube, wir werden es jetzt relativ schnell auch genauso auf der
  europäischen Ebene entscheiden können. Wenn das Europäische Parlament diesen Weg
  mitgeht, dann haben wir dieses große Problem gemeinsam gelöst. Dazu haben Deutschland
  und Frankreich einen großen Beitrag geleistet. Ich will Emmanuel Macron sehr herzlich
  danken, auch für die persönlichen Gespräche, die wir in den vergangenen Tagen, auch
  heute Morgen noch einmal, geführt haben, damit wir diesen Weg gemeinsam gehen konnten.
  Ich fahre zurück nach Deutschland mit dem guten Gefühl, dass Europa handlungsfähig
  ist, außenpolitisch und wirtschaftspolitisch. Wir gehen den richtigen Weg. Wir haben
  noch viel zu tun. Aber wir befinden uns in einem Arbeitsmodus, der mich zuversichtlich
  sein lässt, dass wir die Hausaufgaben, die uns gestellt sind, auch gemeinsam bewältigen.
  Frage: Herr Bundeskanzler, Sie haben jetzt ein Thema gar nicht erwähnt, nämlich
  die Ukraine. Selenskyj hat jetzt gerade gepostet, dass er die europäischen Partner
  bittet, 70 Milliarden Euro im nächsten Jahr zur Verfügung zu stellen. Das brauche
  die Ukraine. Gehen auch Sie von dieser Zahl aus? Wie soll man das bewältigen? Eine
  kurze Nachfrage zu den Handelsinstrumenten: Sind auch Sie dafür, dass die EU -Kommission
  parallel dazu „ safeguards “ für Bereiche wie den Maschinenbau, die Pharmaindustrie
  und die Chemieindustrie unternimmt, um dann chinesische Importe abzuwehren? Bundeskanzler
  Friedrich Merz: Zunächst einmal zur Ukraine: Wir haben uns in der Tat sehr ausführlich,
  wie fast in jeder Sitzung des Europäischen Rates auch heute Morgen, mit Wolodymyr
  Selenskyj ausgetauscht. Es standen keine Entscheidungen auf der Tagesordnung, sondern
  ein Austausch über die Lage. Wir haben es auch über das Mittagessen noch einmal
  sehr ausführlich erörtert. Wir sind alle sehr besorgt über die Lage in der Ukraine.
  Aber es gibt eine große Übereinstimmung, dass wir der Ukraine auch im Winter, auch
  über den Jahreswechsel, im nächsten Jahr weiterhelfen wollen und müssen. Die finanziellen
  Notwendigkeiten, die werden jetzt von der Kommission geprüft. Wir haben ja 90 Milliarden
  Euro im vergangenen Jahr für die zwei Jahre 2026 und 2027 zur Verfügung gestellt.
  Wir wissen, dass wir mit diesem Geld nicht auskommen, dass die Ukraine mit diesem
  Geld nicht auskommt. Aber wie wir dann den Finanzbedarf ermitteln und welchen Finanzbedarf
  wir noch zusätzlich haben, das wird sich in den nächsten Wochen zeigen. Ich gehe
  einmal davon aus, dass wir das noch im November und Dezember erneut behandeln müssen.
  Was die „ safeguards “ betrifft, wollen wir nicht gegen bestimmte Länder tätig werden,
  sondern wir sagen einfach, dass wir im globalen Handel einen fairen Wettbewerb austragen
  wollen. Ich möchte auch Wert darauf legen, dass wir nichts tun, was den Wettbewerb
  einschränkt. Wir stellen uns dem Wettbewerb. Er nützt auch uns. Wir wollen ja auch
  innovativer werden. Wir wollen besser und schneller werden, mit unserer Industrie.
  Aber der Wettbewerb muss fair sein. Wir wollen Instrumente gegen Überkapazitäten,
  gegen hohe Subventionen und gegen unterbewertete Währungen schaffen. Dafür wird
  es einen Instrumentenkasten geben. Der Instrumentenkasten wird größer. Er wird auch
  gezeigt und gegebenenfalls angewendet. Für die Anwendung und den Prozess wird die
  Kommission jetzt Vorschläge machen, wie wir das umsetzen. Frage: Herr Bundeskanzler,
  ich habe ebenfalls zwei Fragen hinsichtlich der Ukraine. Wir haben in den vergangenen
  Tagen eine ziemliche rhetorische Zuspitzung zwischen Kyjiw und Washington gesehen,
  vielleicht sogar ein neues Zerwürfnis. Deshalb ist meine erste Frage: Halten Sie
  es in dieser Situation eigentlich für klug, wenn die Ukraine ihre Angriffe auf Energieinfrastruktur
  in Russland fortsetzt? Zweitens: Sehen Sie einen Weg, diesen Konflikt zu entschärfen?
  Gedenken Sie womöglich, selbst ein Gespräch mit dem amerikanischen Präsidenten darüber
  zu führen? Bundeskanzler Merz: Ich werde ja spätestens im Dezember die nächste Gelegenheit
  haben, mit dem amerikanischen Präsidenten persönlich darüber zu sprechen. Wir telefonieren
  ja auch regelmäßig miteinander. Ich sehe allerdings im Augenblick keine Bereitschaft
  auf der russischen Seite, diesen Krieg zu beenden, im Gegenteil: Es wird weiter
  eskaliert. – Vor allen Dingen wird in der Ukraine die gesamte Energieinfrastruktur
  massiv beschädigt. Es werden Übertragungsnetze angegriffen. Es wird alles getan,
  um diesem Land den Winter zu erschweren. Vor diesem Hintergrund ist es aus meiner
  Sicht richtig, nachvollziehbar und verständlich, wenn auch die Ukraine ihrerseits
  Ziele in Russland angreift, die die Kriegsführung der russischen Regierung und der
  russischen Armee beeinträchtigen. Das betrifft sowohl die Kommunikation als auch
  die Energieversorgung. Das sind offensichtlich die einzigen Möglichkeiten, die die
  Ukraine hat, um auch Russland verstehen zu geben, dass es bereit ist, sich wirklich
  ernsthaft zur Wehr zu setzen. Ich bedauere diese Entwicklung sehr. Aber an unserer
  Haltung zur Ukraine ändert sich dadurch nichts. Wir stehen an der Seite dieses Landes.
  Wir tun es aber nicht, um den Krieg zu verlängern, sondern wir tun es, um Russland
  an den Verhandlungstisch zu bringen. Auch darüber ist heute Mittag noch einmal hinter
  verschlossenen Türen sehr ausführlich gesprochen worden. Frage: Ich habe eine Frage,
  die sich direkt daran anschließt. Wenn man der Pressekonferenz von Präsident Selenskyj
  zugehört hat, dann hat man doch gesehen, wie tief die diplomatischen und politischen
  Verwerfungen zwischen Kyjiw und Washington gehen. Was würden Sie denn vorschlagen,
  um diese Zwangslage, denn das ist es ja augenscheinlich, zu entschärfen? Kann die
  Europäische Union etwas dafür tun, oder geben Sie einen Rat an den ukrainischen
  Präsidenten, was er in Richtung Washington machen könnte? Bundeskanzler Merz: Wenn
  ich ihm Rat gebe, dann gebe ich ihm keinen öffentlichen Rat. Wir sprechen ja relativ
  häufig miteinander. Ich war am vorletzten Sonntag das letzte Mal selbst in Kyjiw
  . Wir haben auch diese Woche noch einmal ein längeres Telefonat miteinander geführt.
  Wir haben heute miteinander gesprochen. Wir wollen an unserer Haltung gegenüber
  der Ukraine keinen Zweifel lassen, und wir wissen zugleich, dass die Amerikaner
  auch andere Interessen haben. Das nehme ich zur Kenntnis. Aber wir helfen der Ukraine,
  und zwar aus eigenem, europäischem Interesse. Wir wissen, was mit der Ukraine auf
  dem Spiel steht. Es ist nicht die territoriale Integrität der Ukraine allein, sondern
  dies ist der Angriff auf eine politische Ordnung in ganz Europa, gegen den wir uns
  zur Wehr setzen. Wir wissen, dass wir uns nur selbst und allein schützen können,
  und genau das tun wir, und deswegen verstärken wir auch alle unsere Anstrengungen,
  um das zu ermöglichen. Frage: Herr Bundeskanzler, heute ist bekannt geworden, dass
  Russland weitere europäische Unternehmen unter Zwangsverwaltung stellt, darunter
  auch einen Hersteller aus dem Sauerland. Nehmen Sie das persönlich, und was ist
  Ihre Antwort in Richtung Moskau? Bundeskanzler Merz: Wir schauen uns das genau an.
  Wir haben solche Eingriffe ja schon in den letzten Monaten immer wieder gesehen.
  Wir werden jeden einzelnen Fall auch für uns zu beurteilen versuchen, und umgekehrt
  muss Russland wissen, dass wir so etwas nicht unbeantwortet lassen. Wir haben auch
  am Mittag noch einmal darüber gesprochen, dass nach wie vor an sehr viele russische
  Staatsbürgerinnen und Staatsbürger, die in die Europäische Union einreisen, Visa
  erteilt werden. Da gibt es sicherlich noch Potenzial für uns, auch diesen Besuchsverkehr
  und auch den Geschäftsreiseverkehr in die Europäische Union einzuschränken. Wenn
  Russland Antworten will, dann werden wir sie geben. Frage: Die Kommission hat vor
  zwei Wochen Vorschläge gemacht, wie sich auch die EU mit Blick auf die Erweiterung
  verändern sollte. Wie bewerten Sie die Vorschläge, und wie war die gestrige Debatte
  darüber? Bundeskanzler Merz: Ja, wir haben dazu eine in zweierlei Hinsicht intensive
  Diskussion geführt. Zum einen ging um die Frage, wie schnell wir Montenegro in die
  Europäische Union aufnehmen können. Montenegro hat so gut wie alle Voraussetzungen
  erfüllt. Die Kommission ist gebeten worden, jetzt auch die finalen Verträge zu erstellen.
  Es gibt noch ein paar kleinere örtliche Themen, die auch vom Kollegen Plenković
  vorgetragen worden sind, die aber alle lösbar sind. Es war gestern Abend eine sehr
  konstruktive Diskussion gegenüber Montenegro. Wir wollen auch zeigen, dass die Europäische
  Union weiter aufnahmebereit ist. Die Europäische Union ist kein „ closed shop “,
  sondern sie ist eine offene Europäische Union für alle Staaten in Europa, die die
  Voraussetzungen erfüllen, Mitglied zu werden, sodass sie auch Mitglied werden können.
  Wir haben im Hinblick auf Moldawien und die Ukraine eine Diskussion geführt. Der
  nächste Schritt soll sein, dass sämtliche Chapter jetzt weiter geöffnet werden sollen,
  auch hinsichtlich der Beitrittsverhandlungen. Aber auch hier gibt es eine klare
  Beitrittsperspektive für Moldawien. Wir wissen, dass insbesondere seit den letzten
  Präsidentschaftswahlen dort die Erwartungen hoch sind, und wir wollen diese Erwartungen
  nicht enttäuschen. Frage: Herr Bundeskanzler, ich habe eine kurze Frage zum Thema
  der Migration: Wie stehen Sie zu der Forderung von Amtskolleginnen und Amtskollegen,
  dass EU -Staaten in bestimmten Sondersituationen die Möglichkeit bekommen sollten,
  keine Asylanträge mehr entgegenzunehmen? Bundeskanzler Merz: Das ist eine Diskussion,
  die jetzt gerade noch läuft. Ich musste aus Zeitgründen etwas früher gehen, aber
  die Schlussfolgerungen sehen ja im Entwurf so vor, dass Mitgliedstaaten das Recht
  bekommen, wenn die Zahl der irregulären Migranten zu hoch wird, entsprechende Schutzmaßnahmen
  zu ergreifen und dass auch die Kommission selbst ein entsprechendes Instrument in
  die Hand bekommen soll. Ich glaube, ich kann, ohne die Vertraulichkeit der Beratungen
  zu brechen, sagen: Insbesondere der griechische Ministerpräsident hat in der Debatte
  gerade festgestellt, dass wir doch enorme Fortschritte gegenüber den letzten Jahren
  gemacht haben, in denen wir in dieser Diskussion doch sehr vorsichtig und zurückhaltend
  gewesen sind. Mittlerweile sieht es fast jeder Staats- und Regierungschef in der
  Europäischen Union so, dass wir ein massives Problem haben, das unsere Gesellschaften
  erheblich belastet, und dem schließe ich mich ausdrücklich an. Europa muss zeigen,
  dass es hier wirklich in der Lage ist, Probleme zu lösen, und die irreguläre Migration
  ist eines der größten Probleme, die wir in Europa haben. Die Entschlossenheit der
  Mehrzahl der Staats- und Regierungschefs, dieses Problem zu lösen, kam in der Diskussion
  heute auch zum Ausdruck. Frage: Herr Bundeskanzler, Sie haben sich in dem Autopakt
  mit Frankreich auf relativ enge „ Buy-European “-Vorgaben eingelassen, wie sich
  Frankreich das schon länger gewünscht hatte. Was hat Sie dazu bewogen, sich darauf
  in dieser Form einzulassen? Könnte das eine Blaupause für eine stärker europäisch
  gesteuerte Industriepolitik sein? Bundeskanzler Merz: Das ist in der Tat eine Verabredung,
  die wir miteinander für den Automobilsektor getroffen haben. Sie bezieht aber Großbritannien
  und die [EWR]-Staaten ein. Das ist keine Blaupause für weitere Verabredungen, die
  wir im Hinblick auf Industriepolitik in der Europäischen Union treffen. Ich will,
  dass wir so viel Wettbewerb wie möglich auch mit anderen Staaten außerhalb der Europäischen
  Union ermöglichen. Es wird jetzt keinen Weg in den Protektionismus geben. Darüber
  bin ich mir mit Emmanuel Macron einig. Frage: Herr Bundeskanzler, Sie haben bereits
  gesagt, die Ukraine werde zusätzliches Geld benötigen, über die genaue Summe sei
  man sich noch nicht einig. Denken Sie, dass es wieder auf Eurobonds hinauslaufen
  wird? Eine Frage zum MFF : Sie sagen immer wieder, im Vergleich zum Vorschlag der
  Kommission müsse der Haushalt sinken. Aber mit Blick auf den Vorschlag der Iren
  habe ich diese Forderung noch nicht gehört. Sind Sie einverstanden mit der Summe,
  die die Iren vorgeschlagen haben? Wenn man das in Vergleich zum Bruttonationalprodukt
  setzt, dann sieht man, dass das gar nicht höher ist als der jetzige MFF . Bundeskanzler
  Merz: Zunächst einmal: Wir haben im vergangenen Jahr keine Verabredung über Eurobonds
  getroffen, sondern wir haben über ein Darlehen gesprochen, das der Ukraine gegeben
  worden ist, damals von 24 Mitgliedstaaten und nicht von 27. Ob es wieder darauf
  hinausläuft, ist offen. In welcher Form wir der Ukraine nächstes Jahr gegebenenfalls
  weitere Hilfen aus der Europäischen Union zur Verfügung stellen, müssen wir diskutieren.
  Darüber wurde keine Entscheidung getroffen. Was das Thema des MFF betrifft, habe
  ich meine Meinung ja schon mehrfach gesagt. Ich habe auch zu den Vorschlägen der
  irischen Ratspräsidentschaft etwas gesagt. Sie zeigen in die richtige Richtung.
  Dieser Vorschlag lag ja um 165 Milliarden Euro unter dem Vorschlag der Kommission.
  Der Vorschlag geht in die richtige Richtung, aber das ist aus unserer Sicht noch
  nicht die Zahl, die wir gern in der abschließenden Vereinbarung sehen würden. Ich
  habe gesagt: „mehrere Hundert Milliarden Euro“. Jetzt sind wir sozusagen bei 150 Milliarden
  Euro. Das sind also noch nicht „mehrere“. Noch einmal: Es geht in die richtige Richtung.
  Aber es kommt gar nicht so sehr nur auf die abstrakte Zahl an, sondern es kommt
  auch auf die Verteilung an, auf die unterschiedlichen Körbe, darauf, wofür wir das
  Geld in der Europäischen Union dann ausgeben. Darüber werden wir im November und
  ganz sicher auch noch im Dezember diskutieren. Wenn wir Glück haben, dann kommen
  wir zu einem Ergebnis. Wenn nicht, dann dauert es noch etwas länger. Aber das sind
  weitreichende Entscheidungen. Sie reichen bis in die Mitte der 2030er-Jahre. Daher
  geht Sorgfalt vor Geschwindigkeit. Für mich gehört auch dazu, dass wir unseren Fahrplan
  im Hinblick auf den Rückbau der europäischen Bürokratie noch einmal konkretisieren.
  Ich habe das auch im Kreis der Kollegen gesagt. Ich kann nicht mit der Botschaft
  nach Berlin zurückkehren: Bei der Bürokratie bleibt alles beim Alten, und das kostet
  dann auch noch mehr Geld. – Das wird nicht möglich sein. Wir müssen die Öffnung,
  die Wettbewerbsfähigkeit – weniger Bürokratie, weniger Regulierung – in der Europäischen
  Union sozusagen mit der Mittelfristigen Finanzplanung in Übereinstimmung bringen.
  Dann wird das europäische Projekt auch seinen guten Weg weiternehmen. Frage: Herr
  Bundeskanzler, welche Rolle spielen die in mehreren europäischen Ländern anstehenden
  Wahlen bei den Haushaltsverhandlungen, insbesondere die Wahlen in Frankreich, wo
  eine Kandidatin, Marine Le Pen , gerade erst gesagt hat, dass sie netto elf Milliarden
  Euro weniger zahlen will? Bundeskanzler Merz: Sie haben es richtigerweise gesagt:
  Wir haben im nächsten Jahr in vielen Ländern in Europa Wahlen. – Bis jetzt ist es
  gute Übung gewesen, dass immer ungefähr ein Jahr vor Inkrafttreten des neuen Finanzrahmens
  die abschließenden Entscheidungen getroffen worden sind. Wichtiger als die Wahlen
  im nächsten Jahr ist die Vorbereitungszeit, die Europa braucht. Es muss ja eine
  ganze Reihe von Verordnungen angepasst werden. Sie müssen durch die Institutionen
  gehen. Der ganze Prozess muss zum Teil auch durch die nationalen Parlamente und
  hier in Brüssel und in Straßburg durch das Europäische Parlament. Für den reinen
  Prozess des Inkraftsetzens eines Mittelfristigen Finanzrahmens, der ab dem 1. Januar
  2028 gelten soll, braucht Europa ungefähr ein Jahr, nicht viel weniger. Deswegen
  ist das, was uns leitet, eher der Prozess als die Wahlen in einzelnen Mitgliedstaaten.'
