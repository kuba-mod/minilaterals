title: Pressestatement von Bundeskanzler Merz vor der Tagung des Europäischen Rates
  am 15. und 16. Oktober 2026 in Brüssel Die EU ist die Antwort auf die wichtigsten
  Fragen unserer Zeit
text: 'Bundeskanzler Friedrich Merz zum Auftakt des EU-Rats. Zum Auftakt des Europäischen
  Rates, der vom 15. bis 16 Oktober 2026 in Brüssel stattfindet, sagte Bundeskanzler
  Merz, dass er sich dafür einsetzt, Europa zusammenzuhalten und die EU handlungsfähiger
  und souveräner zu machen. Die Europäische Union sei unverzichtbar, um die drängenden
  Herausforderungen der Gegenwart zu bewältigen. Zugleich müsse Europa seine Handlungsfähigkeit
  weiter stärken. Mit Blick auf die laufenden Verhandlungen über den künftigen EU
  -Haushalt fordert der Bundeskanzler das Budget gegenüber dem Vorschlag der Europäischen
  Kommission deutlich zu reduzieren. Dieser liege 50 Prozent über dem laufenden Finanzrahmen
  und sei für die Mitgliedstaaten nicht tragbar. Bundeskanzler Merz erwartet bis Ende
  des Jahres einen tragfähigen Kompromiss zu erreichen, damit Europa langfristig handlungsfähig
  und souverän bleibt. Die Oktober-Sitzung des Europäischen Rates hat eine umfassende
  Agenda. Die Staats- und Regierungschefs beraten über die Stärkung der europäischen
  Wettbewerbsfähigkeit, Maßnahmen gegen hohe Energiepreise sowie die weiteren Verhandlungen
  zum Mehrjährigen Finanzrahmen ab 2028. Zudem stehen die Umsetzung der Agenda „Ein
  Europa, ein Markt“ und wirtschaftspolitische Antworten auf globale Herausforderungen
  auf der Tagesordnung. Weitere Schwerpunkte sind die Unterstützung der Ukraine, die
  europäische Verteidigungsbereitschaft sowie strategische Aussprachen zu Migration,
  EU -Erweiterung und Reformen. Daneben befassen sich die Staats- und Regierungschefs
  mit der Lage im Nahen Osten und deren Auswirkungen auf die maritime Sicherheit und
  globale Lieferketten. Guten Morgen, meine Damen und Herren! Ich denke in diesen
  Tagen darüber nach, dass ich vor gut 30 Jahren meine politische Arbeit hier in Brüssel
  begonnen habe, in der bis heute andauernden Überzeugung, dass die Europäische Union
  die Antwort auf die wichtigsten Fragen unserer Zeit ist. Sie ist heute noch wichtiger
  geworden, als sie es vielleicht vor gut 30 Jahren war. Insofern bin ich, seitdem
  ich im Amt bin, als Bundeskanzler darum bemüht, die Europäische Union zusammenzuhalten
  und alles zu tun, damit Europa handlungsfähig bleibt und souverän wird. Folgendes
  will ich vorweg schicken, weil ich es im Augenblick sehr kritisch sehe: Wir befinden
  uns in sehr schwierigen Verhandlungen über die zukünftigen Finanzen der Europäischen
  Union. Ich bedanke mich bei der irischen Ratspräsidentschaft für den Vorschlag,
  der in die richtige Richtung geht, der aber noch längst nicht dort ist, wo wir sein
  müssen. Wir müssen das gemeinsame Budget gegenüber den Vorschlägen der Kommission
  deutlich reduzieren. Es kann sich kein Mitgliedsland in der Europäischen Union leisten,
  in diesem Umfang Beiträge an die Europäische Union zu zahlen. Nur zur Erinnerung:
  Der gegenwärtige Vorschlag liegt 50 Prozent über dem, was wir im laufenden Mehrjährigen
  Finanzrahmen finanzieren. Insofern stehen wir vor sehr schwierigen Verhandlungen.
  Ich rechne auch nicht damit, dass wir an diesem Wochenende, in diesen Tagen zu einem
  Ergebnis kommen. Gleichwohl ist es wichtig, dass wir noch einmal über die Prioritäten
  sprechen, die wir setzen wollen. Die Prioritäten sind aus meiner Sicht Wettbewerbsfähigkeit
  und Verteidigung. Dabei machen wir Fortschritte, allerdings auch diese nicht so,
  wie ich sie zu Beginn des Jahres eigentlich erwartet habe. Wir haben zu Beginn des
  Jahres eine gute Tagung der Staats- und Regierungschefs in Alden Biesen gehabt,
  einen ganzen Tag, an dem wir uns mit Wettbewerbsfähigkeit und Binnenmarkt beschäftigt
  haben. Wir hatten Mario Draghi und Enrico Letta zu Gast, die uns beide sehr nachdrücklich
  gesagt haben: Ihr müsst mehr tun. ‑ Das haben wir uns auch vorgenommen. Aber wir
  sind weit hinter dem Zeitplan, den wir uns im Frühjahr des Jahres selbst gegeben
  haben. Insofern stehen für mich das Thema „weniger Bürokratie in Europa“ und die
  Finanzen der Europäischen Union in einem sehr engen Zusammenhang miteinander. Wenn
  wir es nicht schaffen, die überbordende Bürokratie in Europa deutlich zurückzunehmen,
  dann macht es auch relativ wenig Sinn, über Geld zu reden. Insofern stehen diese
  beiden Themen in einem engen Zusammenhang miteinander. Ich hoffe, dass wir heute
  und morgen darüber intensiv diskutieren, sehr konstruktiv. Ich möchte, dass wir
  ein Ergebnis haben. Ich würde mir wünschen, dass wir auch noch bis zum Ende des
  Jahres mit dem Mehrjährigen Finanzrahmen zu einem Ergebnis kommen, obwohl die Vorstellungen
  innerhalb der Europäischen Union heute sehr weit auseinander liegen. Wir stehen
  also vor schwierigen Verhandlungen. Aber ich gehe in diese Verhandlungen mit dem
  festen Willen, sie zu einem guten Ergebnis zu bringen. Denn noch einmal: Europa
  muss handlungsfähig bleiben und souverän werden. Das ist die Aufgabe, die wir im
  Augenblick nach meinem Empfinden nicht ausreichend erfüllen. Frage: Herr Bundeskanzler,
  wie heftig werden die Diskussionen heute zum MFR Mehr? Wie stark gehen Sie dort
  auch herein? Bundeskanzler Friedrich Merz: Wir haben eine Reihe von Kolleginnen
  und Kollegen, die mit mir zusammen ja einen Vorschlag gemacht haben, wie weit wir
  auch die Zahlen reduzieren wollen. Wir brauchen Einstimmigkeit im Rat. Von dieser
  Einstimmigkeit sind wir weit entfernt. Es gibt eine Reihe von Kolleginnen und Kollegen,
  die mehr Mittel haben wollen. Das sehe ich dezidiert nicht, insbesondere nicht für
  das ganze Thema von Kohäsion und Agrarpolitik. Aber wir müssen diese Diskussion
  jetzt führen. Es nützt alles nichts. Wir brauchen einen gemeinsamen Mehrjährigen
  Finanzrahmen ab 2028. Den sollten wir möglichst bald auch miteinander verabschieden.
  Frage: Herr Bundeskanzler, was halten Sie von der Idee, in der EU eingefroren russische
  Vermögenswerte unter US -Kontrolle zu bringen, um dadurch Schwung in die Friedenskampagne
  zu bringen? Bundeskanzler Merz: Das sind Assets, die in Europa eingefroren sind.
  Sie sollten auch in Europa eingefroren bleiben. Das ist unsere Angelegenheit, und
  darüber entscheiden wir. Frage: Wie groß ist denn Ihre Sorge, sich am Ende nicht
  bis zum Ende des Jahres oder vor den nächsten wichtigen Wahlen im nächsten Jahr
  einigen zu können? Was würde es politisch bedeuten, wenn man daran scheitert? Bundeskanzler
  Merz: Wir liegen zweieinhalb Monate vor dem Ende des Jahres sehr weit auseinander.
  Das heißt nicht, dass wir nicht im November und im Dezember zu Lösungen kommen können.
  Aber wir sollten für die Ratssitzung im Dezember ein paar Oberhemden mehr einpacken
  als üblicherweise. Bundeskanzler Merz: Wolodymyr Selenskyj wird morgen bei uns sein.
  Ich war ja am vorvergangenen Sonntag in Kyjiw . Ich habe die Situation dort gesehen.
  Wir sehen eine immer rücksichtsloser werdende Angriffswelle aus Russland gegen die
  Ukraine. Ich habe heute Morgen in verschiedenen kleineren Treffen dafür plädiert,
  dass wir alles tun, um der Ukraine auch über den Winter zu helfen und auch im nächsten
  Jahr zu helfen. Wir werden hierbei auch noch einmal die Mittel aufstocken müssen,
  um der Ukraine wirklich dauerhaft zu helfen. Es bleibt bei meiner festen Überzeugung,
  dass wir nicht nur die territoriale Integrität der Ukraine verteidigen, sondern
  wir verteidigen die politische Ordnung Europas, die von Russland hier wirklich in
  jeder Hinsicht unter Druck gesetzt wird. Deswegen wollen wir der Ukraine weiterhelfen.
  Ich freue mich, dass Präsident Selenskyj morgen auch bei uns sein wird.'
