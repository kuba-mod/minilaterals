title: Bundesregierung aktuell
text: 'Singapur, Japan und Südkorea - drei Länder, mit denen Deutschland viele Interessen
  und eine bedeutende Eigenschaft teilt: Hier handelt es sich um Mittelmächte, und
  Mittelmächte ziehen sich in Zeiten der Großmachtpolitik geradezu magnetisch an.
  Diese magnetische Wirkung konnte Bundeskanzler Friedrich Merz in dieser Woche ausführlich
  studieren. Seine Drei-Länder-Reise nach Ostasien – die bislang längste Tour dieser
  Kanzlerschaft – geriet zum Besuch bei Nachbarn. Nachbarn deshalb, weil die drei
  Staaten in ihren Interessen und Nöten, in ihrer sicherheitspolitischen und wirtschaftlichen
  Lage mehr gemein haben mit Deutschland, als das bei einer Distanz von 9.000 Kilometern
  zu erwarten gewesen wäre. Wer die neue Weltordnung verstehen will, der findet sowohl
  in Europa wie in Ostasien dieselben Antworten. In dieser neuen Welt ist die wirtschaftliche
  Verflechtung eine Frage der Märkte, der Handelsregeln, der Lieferketten, der Innovationskraft
  und nicht zuletzt der Sicherheit. Wer in dieser Welt bestehen will und nicht nur
  den Regeln der Großmächte ausgeliefert sein möchte, der muss Partnerschaften mit
  Gleichgesinnten pflegen. Natürlich war das Handelsvolumen zwischen Deutschland und
  seinen Partnern in Asien schon immer beeindruckend groß. Nun aber haben sich die
  Gewichte zu Lasten der Mittelmächte verschoben, die sich gegen einseitige Marktmacht
  und unfaire Handelspraktiken nur schwer zur Wehr setzen können. Zusammen aber ist
  man stärker, vor allem wenn man Regeln wechselseitig einhält. Merz stieß deshalb
  auf Beifall, als er eine neue politische Unterfütterung der guten alten Welthandelsorganisation
  vorschlug. Die WTO braucht einen politischen Umsetzungswillen – und politische Stärke
  entsteht durch Geschlossenheit. Merz unterbreitete seinen Vorschlag vor der deutsch-japanischen
  Handelskammer in einem Vortrag im Imperial Hotel im Herzen von Tokio, gleich gegenüber
  dem Kaiserpalast. Und auch die Teilnehmerinnen und Teilnehmer der traditionsreichen
  Asien-Pazifik-Konferenz der deutschen Wirtschaft in Seoul applaudierten großzügig,
  als der Kanzler diese Botschaft deponierte. Untermauert wurde das handelspolitische
  Interesse von einer beeindruckenden Wirtschaftsdelegation, die Merz begleitete.
  Dutzende Absichtserklärungen und Memoranda of Understanding wurden während der fünftägigen
  Reise unterzeichnet. Der Kanzler nutzte die Zeit, um sich über die asiatische Aufbruchsszene
  schlau zu machen: Ob bei Start-ups oder den Grundlagenforscherinnen des Quantum
  Nanozentrums in Seoul, den Fusions-Forschern von Kyoto Fusioneering in Tokio oder
  auf dem stark automatisierten Hafengelände von PSA Horizons in Singapur – die Mittelmächte
  sind alles andere als Mittelklasse. Vor allem gibt es Kooperationsbedarf in der
  KI-Szene, die – ähnlich wie in Europa – das Bedürfnis nach Souveränität antreibt.
  Aber: Geteilte Souveränität, so die Erkenntnis, kann auch stark machen. Vier Leitsätze
  für Deutschland sind es, die der Bundeskanzler in der Singapur Lecture – dem traditionsschweren
  Redeformat zu den Grundlagen der Geopolitik – postulierte: in globale Allianzen
  investieren, die eigene Resilienz stärken, die internationale Ordnung festigen und
  weiterhin auf Dialog und Diplomatie setzen. Diplomatie führt zum Thema Sicherheit
  – ein Neuzugang im Katalog der geteilten Interessen zwischen Deutschland und seinen
  asiatischen Partnern. Das Sicherheitsbedürfnis begründet sich mit denselben Konflikten,
  die in Asien wie in Europa für Instabilität und echte Bedrohung sorgen. Ganz oben
  der Krieg in der Ukraine, der seit der Entsendung nordkoreanischer Soldaten an die
  europäische Front auch zu einem asiatischen Konflikt geworden ist. Auch die Öl-
  und Gasabhängigkeit von der kriegsgeschüttelten Golfregion, hybride Bedrohungen
  oder überwölbende Fragen der nuklearen Bedrohung und Abschreckung bringen die Mittelmächte
  in ihrer Verletzbarkeit zusammen. Die neuen Bruchlinien sind am Ende die alten Bruchlinien,
  wie Bundeskanzler Merz während seines Besuchs in der demilitarisierten Zone zwischen
  Süd- und Nordkorea feststellen konnte. Hier, wo der kalte Krieg noch in denselben,
  alten Barracken haust, wird nun die neue Bedrohung greifbar: Nuklearrüstung, Raketentests,
  die Söldner-Entsendung und Krypto-Angriffe. Die Gefährdung trägt vielleicht ein
  neues Gewand, aber sie gehorcht immer noch den alten Prinzipien. Auch hierfür gilt
  die Erkenntnis: Mittelmächte ziehen sich magnetisch an, weil sie sich gegenseitig
  schützen und stärken können. Das ist die Erkenntnis, die weit über eine Fünf-Tage-Reise
  hinausreichen wird. „Wir wollen eine politische Allianz für regelbasierten Handel,
  global, offen und fair. So können wir die WTO voranbringen und bekräftigen, dass
  wir auf unerlaubte Zölle und Zwang verzichten.“ Bundeskanzler Friedrich Merz auf
  X am 28.10.2026: „Die Nachricht vom schweren Zugunglück bei Toledo macht mich tief
  betroffen. Wir trauern mit unseren spanischen Freunden und allen, die einen geliebten
  Menschen verloren haben. Den Verletzten wünsche ich, dass sie rasch wieder gesund
  werden.“ Wir freuen uns über Ihr Feedback: Nutzen Sie bitte dafür das Kontaktformular
  (nicht die Antwortfunktion auf diese E-Mail).'
