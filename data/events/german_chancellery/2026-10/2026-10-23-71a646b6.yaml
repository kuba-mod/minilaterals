title: Bundeskanzler Merz reist nach Singapur, Japan und in die Republik Korea
text: Bundeskanzler Friedrich Merz wird vom 26. bis 30. Oktober 2026 Singapur, Japan
  und die Republik Korea besuchen. Am Dienstag, den 27. Oktober, wird der Bundeskanzler
  zunächst Gespräche in Singapur mit Premierminister Lawrence Wong führen. Auch ein
  Treffen mit Präsident Tharman Shanmugaratnam ist geplant. Darüber hinaus wird der
  Bundeskanzler im Rahmen der Singapore Lecture eine Rede halten. Für den 28. Oktober
  ist die Weiterreise nach Japan vorgesehen. Dort wird der Bundeskanzler in Tokio
  von Ministerpräsidentin Sanae Takaichi empfangen. Während des Aufenthalts in Japan
  sind unter anderem auch die Teilnahme am German-Japanese Business Summit sowie der
  Besuch eines japanischen Unternehmens mit deutscher Kooperation vorgesehen. Den
  Abschluss der Asienreise bildet ab Donnerstag, dem 29. Oktober, der Besuch in Südkorea.
  In Seoul wird der Bundeskanzler den Präsidenten der Republik Korea, Lee Jae Myung,
  treffen. Weiterhin wird er am Freitag, den 30. Oktober, die 19. Asien-Pazifik-Konferenz
  der Deutschen Wirtschaft in Seoul eröffnen. Der Bundeskanzler wird außerdem die
  Demilitarisierte Zone an der Grenze zu Nordkorea besuchen. Der Besuch bei diesen
  engen Partnern in Asien dient insbesondere der Vertiefung der sicherheitspolitischen
  und wirtschaftlichen Zusammenarbeit. Der Bundeskanzler wird auf seiner Reise von
  einer Wirtschaftsdelegation begleitet.
