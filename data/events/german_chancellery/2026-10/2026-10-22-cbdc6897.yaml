title: Berlin Prozess-Gipfel in Montenegro Für eine vertiefte Zusammenarbeit der EU
  mit dem Westbalkan
text: 'Bundeskanzler Friedrich Merz mit dem Gastgeber, Premierminister Milojko Spajić
  , beim Gipfeltreffen in Montenegro. „Die Länder des westlichen Balkans gehören zu
  Europa, geografisch und politisch“, betonte Bundeskanzler Friedrich Merz bei der
  gemeinsamen Pressekonferenz in Montenegro . Montenegro sei auf dem besten Weg, der
  EU bald beizutreten. Andere müssten und würden folgen. „Wir wollen diese Dynamik
  der EU -Erweiterung. Die EU muss wachsen, wenn sie auf dieser Welt ihre Souveränität
  behaupten und als klarer Machtfaktor in der Welt wahrgenommen werden will“, so Merz.
  Dabei sei klar, dass der politische Wille „aus der Region selbst“ kommen müsse. Zwar
  liege noch ein „schwieriger Weg vor den Staaten der Region“, aber wichtig sei laut
  Merz: „Sie gehen diesen Weg nicht allein. Sie gehen ihn mit ihren Nachbarn, und
  sie gehen ihn mit Deutschland und den anderen Mitgliedern der Europäischen Union.“
  Zu Beginn des Gipfeltreffens des Berlin Prozesses hatte Bundeskanzler Friedrich
  Merz an dessen Zielsetzung erinnert: die europäische Integration der Westbalkanstaaten.
  Dabei hatte der Kanzler auch die Notwendigkeit weiterer Fortschritte der Länder
  im europäischen Integrationsprozess betont. Das Format würde die Gelegenheit bieten,
  zusammen an der Aufnahme des Westbalkans in die europäische Gemeinschaft zu arbeiten,
  so der Kanzler vorab. Zudem hatte Bundeskanzler Merz dem Premierminister Montenegros,
  Milojko Spajić , gedankt für dessen „großartige Gastfreundschaft in diesem sehr
  schönen Land“. Für das Jahr 2027 übergab er den Vorsitz an Österreich, das die Leitung
  des Forums im kommenden Jahr übernehmen wird. Beim dreizehnten Gipfeltreffen des
  Berlin Prozesses kamen die Partnerländer erstmals in Montenegro zusammen. Als Schirmherr
  des Gipfels 2026 hatte das Gastgeberland zum multilateralen Austausch nach Sveti
  Stefan eingeladen. Neben den Ländern des Westbalkans waren auch weitere Mitgliedsstaaten
  und Institutionen der EU vertreten. Unter dem Motto „ Region in Motion – Owning
  the Change “ legte der Vorsitz den Schwerpunkt auf Kooperationen im wirtschafts-
  und sicherheitspolitischen Bereich. Mit seiner Teilnahme am diesjährigen Gipfel
  des Berlin Prozesses hat Bundeskanzler Friedrich Merz ein klares Zeichen deutscher
  Unterstützung für die Westbalkanstaaten gesetzt. Im EU -Beitrittsprozess dieser
  Länder kommt Deutschland eine tragende Rolle zu. Die Botschaft der Bundesregierung
  ist klar: Als wichtiger europäischer Partner gehen wir mit euch Seite an Seite auf
  dem Weg in die EU . Die Region des Westbalkans in Südosteuropa umfasst die sechs
  Länder Albanien, Bosnien und Herzegowina, Kosovo, Montenegro, Nordmazedonien und
  Serbien. Alle sechs Staaten haben den sogenannten „Kandidatenstatus“ im Beitrittsprozess
  der EU inne. „Den Beitritt der Westbalkanstaaten müssen wir vorantreiben“, sagte
  Bundeskanzler Friedrich Merz im Juli zum Beginn der irischen EU -Ratspräsidentschaft
  in Dublin. Die EU müsse ihr Erweiterungsversprechen einlösen und erfolgreichen Kandidatenländern
  zeigen, dass sie es mit deren Aufnahme ernst meint. Dies sei nicht nur im Sinne
  der Westbalkanstaaten – vielmehr läge deren Integration im strategischen Interesse
  Europas. Eine schrittweise Einbindung in europäische Strukturen stärke die Stabilität,
  Sicherheit und Wettbewerbsfähigkeit auf dem gesamten Kontinent. Für die Bundesregierung
  hat die EU -Erweiterung daher oberste Priorität. Ein zentrales Anliegen des Kanzlers
  ist die Beschleunigung langwieriger Verfahren. Im Beitrittsprozess tritt er für
  ein reformiertes Vorgehen ein, das weniger bürokratisch, aber transparent und leistungsorientiert
  ist. Gemeinsam mit dem französischen Präsidenten EmmanuelMacron ergriff Merz im
  Juni 2026 die Initiative zur Dynamisierung des Beitrittsprozesses. Auch die europäische
  Kommission hat jüngst in ihrer Pre Accession Policy Review Vorschläge zur beschleunigten
  Aufnahme neuer Mitglieder gemacht. Aus Sicht der Bundesregierung muss dieses positive
  Momentum nun genutzt werden, um ein deutliches Signal für eine gelingende EU -Erweiterung
  zu senden. Der sogenannte „Berlin Prozess“ geht auf eine deutsche Initiative aus
  dem Jahr 2014 zurück. Seither findet ein jährlicher Gipfel unter wechselndem Vorsitz
  statt, begleitet von diversen Ministertreffen und Nebenveranstaltungen rund um das
  Jahr. Das Format zielt darauf ab, die regionale Kooperation zwischen den Ländern
  des Westbalkans zu vertiefen. Daneben ist der Gipfel vor allem ein Forum der Unterstützung
  im politischen und wirtschaftlichen Annäherungsprozess dieser Staaten an die Europäische
  Union. Zu den Mitgliedern des Forums zählen – über Deutschland und die Westbalkanstaaten
  hinaus – auch Frankreich, Italien, Polen, Österreich, Griechenland, Kroatien, Slowenien,
  Bulgarien und das Vereinigte Königreich Großbritannien. Die Vertreterinnen und Vertreter
  der EU -Institutionen gehören ebenfalls zum festen Teilnehmerkreis.'
