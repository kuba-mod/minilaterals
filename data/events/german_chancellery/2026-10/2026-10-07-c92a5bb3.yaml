date: '2026-10-07'
type: press_release
source_name: german_chancellery
title: Rede von Bundeskanzler Merz anlässlich des Deutschlandgipfels der „WirtschaftsWoche“
  und des „Handelsblatts“ am 7. Oktober 2026 in Berlin
text: 'Sehr geehrte Frau Wasmuth, sehr geehrter, lieber Herr Matthes, sehr geehrter
  Herr von Buttlar, meine sehr geehrten Damen und Herren, zunächst herzlichen Dank
  für die Einladung und die freundliche Begrüßung! Ich bitte um Nachsicht, dass ich
  ein wenig zu spät bin. Das liegt an den Berliner Verkehrsverhältnissen und an einem
  gesperrten Tiergartentunnel, der gesperrt ist, weil angeblich das Personal für die
  Überwachung fehlt ‑ na ja. Meine Damen und Herren, Sie feiern heute gleich zwei
  Gründungsjahre, zwei Jubiläen: 1926 das Gründungsjahr der „WirtschaftsWoche“, damals
  noch „Der Deutsche Volkswirt“, und 1946 das Gründungsjahr des „Handelsblatts“. Ich
  weiß nicht, ob das heute bei Ihnen schon zitiert worden ist. Auf der ersten Seite
  der ersten Ausgabe hieß es in fetten Buchstaben: „Eisen und Stahl in der Kostenkrise“.
  Meine Damen und Herren, wir kennen diese Daten, die Jahreszahlen 1926 und 1946,
  aus den Geschichtsbüchern, weil es herausfordernde Zeiten waren ‑ hier die Hemmnisse
  und Unsicherheiten der Zwischenkriegszeit, die labile Demokratie, dort die Apathie
  der völligen Katastrophe und das Land in Trümmern. Wie weit sind wir seitdem doch
  gekommen? Wie viel haben wir hoffentlich gelernt! Und wie gut, dass wir wissen:
  Geschichte wiederholt sich nicht, sie reimt sich allenfalls auf bestimmte Muster.
  Wenn sich der Klang der Geschichte reimt, dann erleichtert uns das vielleicht das
  Zuhören. Wie gut, dass es Zeitungen mit der historischen Erfahrung dieser Zeitspanne
  gibt, die uns beim Zuhören, beim Lesen und beim Nachdenken über unsere Erfahrungen
  helfen. „WirtschaftsWoche“ und „Handelsblatt“ ‑ ich will es ganz einfach so sagen,
  wie ich das als Ihr Leser empfinde ‑, gut, dass es Sie gibt! Herzlichen Glückwunsch
  zu diesen beiden schönen Jubiläen! Meine Damen und Herren, es ist richtig, wenn
  wir darüber sprechen: Heute fehlt es wieder an Vertrauen in die finanzpolitischen,
  in die wirtschaftspolitischen Akteure und in die Institutionen in unserem Land.
  Gerade deshalb ist es so wichtig, dass Sie uns mit Ihrem Sachverstand, mit Ihrem
  Fachverstand kritisch begleiten und dass Sie vor allem Verständnis für die ökonomischen
  Zusammenhänge in der Breite der Bevölkerung fördern. Im Grunde kämpfen wir ja an
  der Stelle Seite an Seite ‑ Sie in diesen beiden Publikationen, wir in der Politik.
  Insofern können wir, Sie und wir, da auch noch ein bisschen erfolgreicher werden.
  Mit meinem Glückwunsch verbinde ich auch meine Bitte, weiter für ein Verständnis
  der Zusammenhänge zu streiten, das wir für Veränderungen in der Bevölkerung gerade
  heute brauchen. Dieses Verständnis müssen wir jeder mit seiner Aufgabe und an seinem
  Platz weiter fördern. Ich will Ihnen bei dieser Gelegenheit heute noch gern persönlich
  für etwas ganz anderes danken. Wenn man in diesen Tagen auf Ihren Jubiläumsseiten
  online unterwegs ist, dann weht einem da sehr viel Optimismus entgegen. Sie glauben
  an eine gute Zukunft unserer Volkswirtschaft. Man spürt geradezu die Lust, den Aufbruch
  zu begleiten und auch den Erfolg zu sehen und zu beschreiben. Schon heute feiern
  unsere Unternehmen in dieser Zeit der Transformation in der Tat große Erfolge. Sie
  erkennen das in Ihren Publikationen mit einem ‑ wie ich meine, wahrnehmen zu dürfen ‑
  feinen Gespür. Auch dafür möchte ich Ihnen danken. Das ist der Geist, den wir neben
  aller Politik eben auch brauchen. Pessimismus ist Zeitverschwendung, so heißt ein
  schönes Wort. Wenn Sie nachschauen, wer das schon einmal gesagt hat, dann finden
  Sie Schimon Peres genauso wie den Kabarettisten Jürgen Becker. Ich schließe mich
  dem ausdrücklich an. Das könnte ein Motto für einen neuen Aufbruch bei uns sein.
  Gerade im Journalismus bin ich ‑ das wird Sie nicht überraschen ‑ für jedes kleine
  Quäntchen Optimismus in diesen Tagen besonders dankbar. Nun haben Sie selbst in
  Ihrer Einladung geschrieben, Sie wollen sich heute nicht selbst feiern. Es soll
  heute um die Zukunft unseres Landes gehen. Nun denn, ich will aus meiner Sicht das
  ganze Bild aufmachen, um die Dringlichkeit und auch die Ernsthaftigkeit zu beschreiben,
  mit der wir arbeiten und mit der auch ich arbeite. Ich werbe so für den Weg, den
  ich für unverzichtbar notwendig für unser Land halte. Wo stehen wir denn in diesen
  Jahren? Ja, natürlich, wir stehen in unserem Land gewaltig unter Druck. Industrien
  ‑ ich sehe viele Vertreter hier im Raum, die sie vertreten ‑, denen wir seit dem
  19. Jahrhundert unseren Wohlstand verdanken, kämpfen um ihre Zukunft in einer Welt,
  in der die KI-Revolution gewaltige Veränderungen von Geschäftsmodellen erzwingt
  und in der wirtschaftliche Erfolge auch mit sehr unfairen Mitteln gesucht und gefunden
  werden. Globale Lieferketten und Abhängigkeiten werden erpresserisch ausgenutzt.
  Feindselige Zolldrohungen und Zölle setzen den Unternehmen zu. Ganze Volkswirtschaften
  werden unter Druck gesetzt. Energie ist zu teuer, weil in der Vergangenheit eben
  falsche Ausstiegsentscheidungen getroffen wurden und man auch die Möglichkeiten
  ‑ jedenfalls die kurzfristigen Möglichkeiten ‑ der erneuerbaren Energien für eine
  Volkswirtschaft wie die unsere ziemlich überschätzt hat. Lieferprobleme und Knappheiten
  durch Krisen und Kriege kommen hinzu. Zu allem Überfluss: Russland führt einen brutalen
  Angriffskrieg, nicht nur gegen die Ukraine, sondern gegen die Freiheit Europas.
  Russland greift immer unverhohlener auch uns an, mitten in Deutschland. Um unsere
  Verteidigungsfähigkeit ist es nach Jahren einer großen Sorglosigkeit nicht gut genug
  bestellt. Im Innern ist die Infrastruktur unseres Landes in einem schlechten Zustand,
  und unkontrollierte Migration über viele Jahre hinweg hat unserem Land massiv geschadet.
  Schließlich: Bürokratie bremst und entmutigt Bürger und Unternehmen. Unsere Gesellschaft
  altert und überfordert zunehmend die Beitragszahler und die Steuerzahler. Sie überfordert
  sie, wenn es darum geht, soziale Sicherheit in gewohnter Verlässlichkeit zu gewährleisten.
  Das war es in aller Kürze. Das sind die Aufgaben. Jetzt frage ich Sie, meine Damen
  und Herren: Glaubt denn irgendjemand hier im Raum daran, diese Aufgaben, zum Teil
  jahrzehntelang angehäuft, ließen sich alle einmal so eben in einem Jahr lösen? Ein
  realistischer Anspruch kann doch nur sein, diese Aufgaben zunächst einmal wirklich
  zu begreifen und sie dann beherzt anzugehen, zumal in einer Koalition, in der die
  Partner nicht von vornherein in Diagnose und Therapie miteinander übereinstimmen.
  Wir sehen das in der Koalition immer wieder. Es ist weder neu noch besonders originell,
  aber es ist in jedem Fall anstrengend, einen gemeinsamen Weg zu finden, den auch
  ich jedenfalls noch so gerade eben vertreten kann. Aber es ist so. Das Wahlergebnis
  im vergangenen Jahr hat genau dies erzwungen, und in Wahrheit kennt ja unser System
  auch nichts anderes. Unser Land ist darauf angelegt, Macht zu teilen und Kompromisse
  zu ermöglichen. Wir sehen zugleich, dass es Kräfte gibt in diesem Land, die genau
  diese DNA unserer Demokratie, unseres Systems außer Kraft setzen wollen. Dieser
  Extremismus dringt mit Wucht in unsere Parlamente ein. […] Wie und ob die Aufklärung
  dieser geheimen Wahl jemals gelingen wird, das wird dort zu klären sein. Aber gleichzeitig
  gilt, jedenfalls für mich: Wer einen Abgeordneten einer rechtsextremen Partei zum
  Landtagspräsidenten wählt, muss das mit seinem Gewissen vereinbaren. […] Nun zurück
  zu uns. Wir nehmen als Bundesregierung, meine Damen und Herren, die Aufgabe, den
  Kompromiss zu suchen und zu finden, immer wieder an, weil wir damit jedenfalls nach
  unserer Überzeugung dem Land und all den unterschiedlichen Interessen dienen, die
  sich dann hoffentlich in einem Kompromiss wiederfinden. So, wie das Land einen gemeinsamen
  Weg finden muss, müssen wir in der Regierung gemeinsame Wege finden. Auch das Land
  ist sich ja untereinander nicht einig. „Es muss etwas geschehen“, sagen viele. Ja,
  darin ist man sich wohl einig. Aber was und bei wem, das ist dann genau die Frage.
  Dennoch bin ich davon überzeugt, dass wir seit dem Frühling des vergangenen Jahres
  das Mögliche und auch vieles Richtige für eine wieder bessere Zukunft unseres Landes
  getan haben. Wir haben uns in Europa auf unsere Stärke besonnen, als größter Binnenmarkt
  der Welt. Auch andere sind von uns abhängig. Wir schaffen wirksame Instrumente,
  mit denen wir uns gegen unfairen Wettbewerb wehren können. Das geschieht gerade
  in diesen Tagen. Damit hier kein Missverständnis entsteht: Es geht dabei nicht darum,
  uns vor Wettbewerb zu schützen. Ohne Wettbewerb gibt es keine Innovation. Wettbewerb
  brauchen wir nun wirklich nicht zu fürchten. Aber es geht um die Verteidigung fairer
  Spielregeln, um nicht mehr, aber auch nicht weniger. Zugleich spüren und nutzen
  wir die Attraktivität Europas gerade in diesen Zeiten von Egoismus und Rücksichtslosigkeit.
  Wir nutzen sie in den vergangenen Monaten durch neue Handelsabkommen weltweit, mit
  neuen Märkten und neuen Möglichkeiten. Ich kann hier gar nicht alle Abkommen aufzählen,
  aber die erfolgreichen laufenden Verhandlungen gelten großen Wirtschaftsräumen wie
  zum Beispiel dem Land Indien und anderen Räumen in Südostasien. Hier eröffnen sich
  gerade für uns, für Deutschland, für die deutsche Wirtschaft, gewaltige Chancen.
  Das wird unserer Volkswirtschaft einen zusätzlichen Schub geben. Wir haben die steuerlichen
  Rahmenbedingungen für Unternehmen bereits im vergangenen Jahr verbessert. Wir haben
  begonnen, aus der Alterung unserer Gesellschaft die notwendigen Schlüsse für die
  sozialen Sicherungssysteme zu ziehen. Teilweise sind die Gesetze bereits beschlossen
  und in Kraft. Wir bremsen den Anstieg der Sozialversicherungsbeiträge, der sonst
  unaufhaltsam wäre und fatale Folgen für die Nettoeinkommen und für die Arbeitsplätze
  in unserem Land hätte. Wir machen die Rente sicher. Es geht um Frühstartrente, Aktivrente
  mit den schon sehr erfolgreichen Anreizen für längeres Arbeiten, echte Verbesserungen
  bei der privaten und betrieblichen Altersversorgung, Nutzung der Chancen des Kapitalmarkts
  innerhalb der gesetzlichen Rentenversicherung, und, meine Damen und Herren, in Wahrheit
  ist das Ende der abschlagsfreien Frühverrentung ein Beitrag zur sozialen Gerechtigkeit.
  Das alles sind bedeutende und längst überfällige Schritte auch innerhalb der gesetzlichen
  Rentenversicherung. Bei den Energiepreisen haben wir mehrfach kurzfristig für Entlastung
  gesorgt. Mittelfristig und langfristig können wir die Preise in den Griff bekommen,
  indem wir das tun, was wir seit einem Jahr tun: Wir machen die Energiewende pragmatisch,
  technologieoffen, kosteneffizient. Teilweise stellen wir sie vom Kopf wieder auf
  die Füße. Hier ist ein neuer Realismus eingekehrt, bis hin zum Bau neuer Gaskraftwerke.
  Wir machen eine kluge Förderpolitik für Innovationen und Schlüsseltechnologien,
  von künstlicher Intelligenz bis zu Fusionstechnologien und Technologien für klimaneutrale
  Mobilität, damit wir besser darin werden, die traditionellen Stärken unseres Landes
  in der Forschung, in der Entwicklung und in der Fertigung in neue Geschäftsmodelle
  und Wertschöpfungsketten zu übersetzen. Genau deshalb machen wir das. Wir haben
  ‑ ich räume ein, dass mir das schwer gefallen ist, und ich habe es oft schon eingeräumt ‑
  Sonderschulden gemacht, um die Infrastruktur unseres Landes endlich zu modernisieren.
  Damit das alles schneller geht, ist ein Gesetz in Kraft getreten, mit dem die Verfahren
  erheblich beschleunigt werden. Schließlich sind wir beim Rückbau von Bürokratie
  und der Digitalisierung der Verwaltung in kurzer Zeit viel weiter gekommen, als
  es oftmals wahrgenommen wird. Dank übrigens bei dieser Gelegenheit an „Handelsblatt“
  und „WirtschaftsWoche“, die darüber immer wieder berichten und auch Autoren wie
  zum Beispiel Julia Jäkel zu Wort kommen lassen! Sie hat es uns allen erst vor einigen
  Tagen erneut bescheinigt. Sie sieht auch sehr genau hin, was mit ihren Vorschlägen
  zur Staatsmodernisierung passiert, die sie mit Thomas de Maizière, Peer Steinbrück
  und Andreas Voßkuhle unterbreitet hat. Ich zitiere sie wörtlich: „Wir erleben gerade
  den größten Modernisierungsschub unserer staatlichen Strukturen seit Dekaden“. Ja,
  meine Damen und Herren, sie hat recht. Aber zu allem gehört auch: Wir unterstützen
  die Ukraine gegen die brutale russische Aggression, weil es in unserem Interesse
  liegt, eine selbstbestimmte demokratische Ukraine zum europäischen Nachbarn und
  europäischen Partner zu haben, übrigens auch zu unserem industriellen und militärischen
  Partner. Ich bin am vergangenen Sonntag, wie Sie alle wissen, in Kyjiw gewesen,
  zum vierten Mal. Meine Damen und Herren, wir haben diesem Land nicht nur weitere
  militärische Unterstützung und finanzielle Unterstützung für den Haushalt zugesagt.
  Ich bin das erste Mal mit einer größeren Wirtschaftsdelegation in der Ukraine gewesen,
  die ihrerseits mit Vertretern der ukrainischen Wirtschaft allein an diesem einen
  Tag Abschlüsse in einer Größenordnung von über sechs Milliarden Euro vorgenommen
  hat. Gleichwohl müssen wir die Bundeswehr wieder in den Stand setzen, unser Land
  verteidigen zu können. Wir tun das, damit wir uns nicht verteidigen müssen. Noch
  einmal dieser Satz: Wir wollen uns verteidigen können, damit wir uns nicht verteidigen
  müssen. ‑ Meine Damen und Herren, gegen die massiven Cyber- und Drohnenangriffe,
  gegen die Angriffe auf unsere Datennetze, von denen hier im Raum vermutlich mehr
  betroffen werden, als es bei einer Umfrage zugeben würden, gegen diese Angriffe
  stärken wir unsere Abwehrmöglichkeiten. Aus den zunehmenden Anschlägen auf unsere
  kritische Infrastruktur haben wir ‑ Politik, Sicherheitskräfte, Unternehmen ‑ gemeinsam
  gelernt. Ein Gesetz ist seit März in Kraft, das uns auch an dieser Stelle resilienter
  macht. Die immer wiederholten Absichtserklärungen der letzten Jahrzehnte zur Stärkung
  des europäischen Pfeilers der NATO setzen wir in die Tat um. Es ist nicht populär,
  aber ich bleibe dabei: Ohne äußere Sicherheit ist alles nichts. In einer Welt, in
  der nicht mehr andere diese Sicherheit für uns garantieren, müssen wir, muss Europa
  selbst dazu in der Lage sein, auch wenn wir dazu beträchtliche Mittel in die Hand
  nehmen müssen. Freiheit und Frieden gibt es in dieser Welt eben nur dann, wenn man
  sie auch wirklich schützt. Ich will es der Vollständigkeit halber sagen: Wir haben
  die illegale Migration eingedämmt. Wir arbeiten an Rückführungszentren außerhalb
  Europas, um dafür zu sorgen, dass diejenigen, die da sind und unser Land wieder
  verlassen müssen, es auch wirklich tun. Meine Damen und Herren, Sie sehen also:
  Wir arbeiten. ‑ Wir wissen trotzdem: Das alles ist noch nicht genug. ‑ Deshalb arbeiten
  wir weiter. Wir werden in diesem Herbst über die Rente, über die Pflege und erneut
  über unser Gesundheitssystem debattieren und Entscheidungen treffen. Es hilft nichts.
  Wir müssen uns ehrlich machen, solange der Jungbrunnen nicht gefunden ist, in den
  wir alle einmal steigen können. Wir haben vor der Sommerpause auch schon verabredet,
  den Arbeitsmarkt zu flexibilisieren, und zwar dort, wo beide Seiten davon profitieren.
  Unternehmerischer Mut muss sich genauso mehr entfalten können wie flexible Arbeitszeiten,
  die die Vereinbarkeit von Familie und Beruf verbessern. Noch einmal: Beim Bürokratierückbau
  gehen wir einen weiteren großen Schritt. Wir schaffen bald so gut wie alle Berichtspflichten
  für Unternehmen ab. Erhalten bleiben nur die, deren Notwendigkeit von den zuständigen
  Ministerien neu begründet wird. Wir haben verabredet, dass wir die EU-Lieferkettenrichtlinie
  nur eins zu eins umsetzen. Auch hier wird der Aufwand, den die Unternehmen in Zukunft
  zu betreiben haben, überschaubar bleiben. Gerade auf europäischer Ebene, wo es wirklich
  wichtig ist, arbeiten wir gemeinsam, nicht zuletzt auch auf meine Initiative hin,
  mit Erfolg an einem Wechsel unserer Mentalität. Meine Damen und Herren, wir vertreten
  gut organisiert mit gleichgesinnten Staaten in der EU unsere Ziele bei der Aufstellung
  des neuen europäischen Haushalts. Wir bestehen auf Maß und auf Modernisierung, auf
  die Konzentration und Fokussierung auf das wirklich Wichtige, auf das, was Europa
  resilient und souverän macht. Lassen Sie mich zum Abschluss noch einmal auf eine
  ganz andere Weise grundsätzlich werden: Wenn all das gelingen soll, meine Damen
  und Herren, dann kommt es auch auf uns alle an ‑ nicht nur auf die Regierung, nicht
  nur auf die Medien, sondern auch auf die Bürgerinnen und Bürger, die bereit sind,
  für eine bessere Zukunft unseres Landes ihren Teil mitzutragen. Das muss nicht notwendigerweise
  bedeuten, dass es zu Einschränkungen kommt. Nehmen Sie im Gegenteil die Reform der
  Alterssicherungssysteme mit allen ihren Teilen: Diese Reform wird am Ende ja bedeuten,
  dass wir uns nicht einschränken, sondern dass wir etwas gewinnen werden, nämlich
  ein mittelfristig höheres Rentenniveau bei sinkenden Beiträgen. Das ist kein leeres
  Versprechen von mir, sondern das ist die vorsichtige Rechnung der unabhängigen Experten,
  die wir gebeten haben, Vorschläge zur Zukunft unserer Alterssicherungssysteme zu
  machen. Gerade diese Reform zeigt: Wir können heute Dinge ändern, damit Gewohntes
  und Geschätztes so gut bleiben kann, wie wir es kennen. Die Einschränkungen, die
  für eine solche Reform der Alterssicherung nötig sind, halte ich für zumutbar und
  auch für einleuchtend. Ich komme noch einmal darauf zurück: Gesund und fit abschlagsfrei
  früher in Rente zu gehen, das ist weder sozial, noch können die Rentenversicherung
  und unsere Volkswirtschaft es sich leisten, wenn immer weniger Arbeitende immer
  mehr Rentnerinnen und Rentner finanzieren müssen. Meine Damen und Herren, ich sprach
  vom Verständnis für solche Zusammenhänge, für das Ihre beiden Zeitungen genau wie
  ich unermüdlich arbeiten. Ich werde trotzdem immer wieder gefragt: Warum machen
  wir das alles? Gerade hier bei der Rente wird genau das sehr deutlich: Wir machen
  es vor allem für die nächste und die übernächste Generation, für unsere Kinder und
  für unsere Enkelkinder. Wir dürfen und wir werden sie nicht überlasten. Wir wollen
  und wir werden ihnen die notwendigen Freiräume erhalten und die Chancen eröffnen,
  die für die Älteren in unserem Land über so viele Jahrzehnte so verlässlich waren.
  Denn es ist unser Land. Machen wir es uns doch nicht so schwer, es in eine gute
  Zukunft zu führen. Machen wir uns doch durch Kleinmut nicht die Chancen kaputt,
  es jetzt wieder besser aufzustellen. Ganz einfach: Geben wir unserem Land eine Chance.
  Meine Damen und Herren, wir sehen, dass gerade ein Momentum entsteht. Sie kennen
  die Zahlen: Die führenden Wirtschaftsinstitute haben ihre Wachstumsprognose für
  2026 auf 1,3 Prozent verdoppelt. Sie rechnen damit, dass sich dieser positive Trend
  auch 2027 fortsetzt. Die ausländischen Direktinvestitionen in Deutschland haben
  seit dem vergangenen Jahr wieder deutlich angezogen, und wir sehen Rekordzahlen
  bei der Gründung von Start-ups und bei den sogenannten Unicorns. Zehn sind in diesem
  Jahr dazugekommen, 39 sind es insgesamt. Ja, es ist vor allem der Export, der unsere
  Volkswirtschaft trägt. Wir können nach wie vor vieles sehr gut, was auf der Welt
  gebraucht wird, etwa die Maschinen, die Elektronik, die Spezialtechnik für Rechenzentren.
  Und unsere Investitionen in Infrastruktur und Verteidigung schlagen sich natürlich
  auch in Aufträgen für die Unternehmen nieder. Das ist kein Strohfeuer, sondern das
  sind Innovations- und Investitionsimpulse, die unserer Volkswirtschaft insgesamt
  zugutekommen. Viele Unternehmen bauen neue Geschäftsideen, neue Geschäftsmodelle
  auf diesen neuen Technologien auf. Die Transformation unserer Wirtschaft findet
  statt, während viele sich noch fragen, ob sie überhaupt gelingen kann. Automobilzulieferer
  denken um und fertigen und liefern heute Teile für Robotik. Ein deutscher Raumfahrtkonzern
  baut im Auftrag der EU Satelliten für eine unabhängige und sichere europäische Kommunikation.
  Die erste in Deutschland entwickelte und gebaute Rakete hat den Weltraum erreicht.
  Überall in unserem Land entsteht also neue Spitzentechnologie. Meine Damen und Herren,
  lassen mich kurz noch einen Blick in die letzte Woche werfen: Genau vor einer Woche
  beim Jahrestreffen der Initiative „Made for Germany“ ‑ ich sehe hier im Saal den
  einen oder anderen, der daran teilgenommen hat ‑ mit ihren über 800 Milliarden Euro
  Investitionen in den Wirtschaftsstandort Deutschland waren genau solche Erfolgsgeschichten
  in großer Menge präsent: souveräne KI-Rechenkapazitäten, Resilienz von Lieferketten
  in den Schlüsselindustrien, weltweit führende Linear- und Automatisierungstechnologie,
  Forschungs- und Entwicklungshubs für Laserfusion, neue und erneuerbare Energiequellen,
  durch die wir unabhängiger werden, modernste Medizintechnik, wo Deutschland übrigens
  immer schon ein führendes Land auf der Welt war, modernste Verteidigungstechnik,
  Komponenten für Robotik, neue Ideen für die Gewinnung kritischer Rohstoffe, um auch
  hier resilienter zu werden. Jedes einzelne dieser Projekte, meine Damen und Herren,
  eröffnet uns einen Blick in die Zukunft ‑ eine Zukunft, die längst im Gang ist.
  Ich schlage also vor, dass wir gemeinsam das Gute sehen, das in unserem Land da
  ist, und dass wir auch sehen, wie gut wir in Wirtschaft, Gesellschaft und Politik
  doch eigentlich mit dem Druck und den Herausforderungen, die ich eingangs geschildert
  habe, umgehen. Ich will von meiner Seite jedenfalls alles dafür tun, dass es mehr
  und mehr Grund für diesen positiven Blick und für Zuversicht gibt. Ich werde weiter
  dafür kämpfen, dass sich in der Bundesregierung immer wieder das Richtige und Notwendige
  durchsetzt. Ich verbinde meinen abschließend erneut vorgetragenen herzlichen Glückwunsch
  an die beiden Publikationen „WirtschaftsWoche“ und „Handelsblatt“ nicht nur mit
  einem Dank für Ihre Berichterstattung, sondern auch mit der Bitte, uns auf diesem
  Weg weiter kritisch, aber eben auch konstruktiv so zu begleiten, dass wir bei Ihrem
  nächsten großen Geburtstag sagen können: Es waren verdammt harte Zeiten, aber es
  hat sich gelohnt, den Weg zu gehen, durchzuhalten und vor allem gemeinsam für unser
  Land einzustehen.'
