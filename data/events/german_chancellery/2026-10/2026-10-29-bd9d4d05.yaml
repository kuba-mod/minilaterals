title: 'Bundeskanzler Friedrich Merz erklärt zum Rückzug von EZB-Präsidentin Christine
  Lagarde:'
text: „Christine Lagarde hat die Europäische Zentralbank in herausfordernden Zeiten
  souverän geführt. Die Stabilität des Euro und die Unabhängigkeit der Zentralbank
  waren bei ihr in guten Händen. Namens der Bundesregierung danke ich Christine Lagarde
  dafür. Jetzt beginnt der im EU-Vertrag vorgesehene Besetzungsprozess, den wir im
  Kreis der Staats- und Regierungschefs der Eurozone bis zum Jahresende abschließen
  werden.“
