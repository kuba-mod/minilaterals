date: '2026-10-14'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 14. Oktober 2026
text: 'stellvertretender Regierungssprecher Meyer (Vorsitzende Hamberger eröffnet
  die Pressekonferenz und begrüßt SRS Meyer sowie die Sprecherinnen und Sprecher der
  Ministerien.) Das Kabinett hat heute in konzentrierter, aber auch harmonischer Art
  und Weise getagt, zum ersten Mal auch in Anwesenheit des neuen Bundesministers für
  Arbeit und Soziales, Alexander Schweitzer. Ich will Sie über einige Entscheidungen
  des Bundeskabinetts kurz informieren. Das Bundeskabinett hat heute die Einführung
  einer Zuckergetränkesteuer auf den Weg gebracht. Die Bundesregierung hat dafür eine
  Formulierungshilfe für die Regierungsfraktionen zur Änderung des Haushaltsbegleitgesetzes
  beschlossen. Wie bekannt, greift die Bundesregierung eine Empfehlung der FinanzKommission
  Gesundheit auf. Vorgesehen ist ein gestaffelter Tarif mit zwei Stufen auf gezuckerte
  Getränke ab 5 Gramm Zuckergehalt und ab 8 Gramm Zuckergehalt pro 100 Milliliter.
  Hoher Zuckerkonsum, vor allem bei Kindern und Jugendlichen, ist ein großer Risikofaktor
  für Adipositas, Herz-Kreislauf-Erkrankungen, Karies und vor allem Diabetes. Die
  Versorgungskosten durch den erhöhten Konsum von gezuckerten Getränken belasten die
  Allgemeinheit mit über 2 Milliarden Euro pro Jahr. Mit Einführung der Zuckergetränkesteuer
  wollen wir erreichen, dass weniger Zucker konsumiert wird. So sollen langfristig
  die Kosten im Gesundheitssystem gesenkt werden, die durch die genannten typischen
  Krankheitsbilder entstehen. Das kommt am Ende allen zugute, die auch Beiträge für
  unser solidarisches Gesundheitssystem tragen. Die Steuer wirkt ab Juli 2027. Durch
  Erhebung der Verbrauchssteuer entsteht finanzieller Spielraum. Er wird genutzt,
  um eine zuvor vorgesehene Absenkung des Bundeszuschusses an den Gesundheitsfonds
  entsprechend dann auch zu verringern. Es bleibt also am Ende auch im System und
  kommt dem System zugute. Das Kabinett hat darüber hinaus den Nationalen Aktionsplan
  klimafreundliche Schifffahrt beschlossen. Die Bundesregierung setzt mit dem Aktionsplan
  ein klares Zeichen. Die Transformation der Schifffahrt wird gemeinsam mit der Wirtschaft
  und den Ländern innovationsgetrieben und technologieoffen gestaltet. See- und Binnenschifffahrt
  sind von zentraler Bedeutung für den Wirtschaftsstandort Deutschland. Sie sichern
  Versorgung, Wertschöpfung und Beschäftigung und sind ein unverzichtbarer Bestandteil
  leistungsfähiger Lieferketten. Der Aktionsplan schafft die Voraussetzung, dass die
  Schifffahrt ihre Klimaschutzziele erreicht und zugleich wettbewerbsfähig bleibt.
  Zentrale Handlungsfelder des Plans sind die Versorgung mit klimafreundlichen Kraftstoffen,
  alternative Antriebs- und Energiesysteme, die Modernisierung der Flotte und der
  Aufbau grüner Schifffahrtskorridore. Der Aktionsplan formuliert 47 klare Maßnahmen,
  die nun Stück für Stück umgesetzt werden sollen. Ein weiterer Punkt: Die deutsche
  Expertenkommission „Kinder- und Jugendschutz in der digitalen Welt“ hat am 11. September
  ihren Abschlussbericht mit 56 Handlungsempfehlungen vorgelegt. Als ersten Schritt
  zur Umsetzung dieser Handlungsempfehlungen hat das Kabinett heute deshalb Eckpunkte
  zur Stärkung des Kinder- und Jugendmedienschutzes beschlossen. Die Eckpunkte dienen
  dazu, den Kinder- und Jugendschutz in der digitalen Welt als eine gesamtgesellschaftliche
  Querschnittsaufgabe anzuerkennen und den Willen zum gemeinsamen Handeln der Bundesregierung
  hervorzuheben. Als erste Maßnahmen dafür sind unter anderem folgende geplant: Die
  Bundesregierung wird eine nationale Übergangsregelung schaffen, solange auf europäischer
  Ebene noch kein Mindestalter für die Nutzung sozialer Netzwerke festgelegt wurde,
  wie vor kurzem durch den EU KIDS Act von der Europäischen Kommission vorgeschlagen.
  Die deutsche Übergangsregelung soll Kindern dann erst ab 13 Jahren die Nutzung sozialer
  Netzwerke ermöglichen. Für Minderjährige zwischen 13 und 18 Jahren sollen abgestufte
  Beschränkungen der Nutzung sozialer Netzwerke vorgesehen werden. Ab 2027 wird die
  Bundesregierung mit der deutschen Umsetzung der European Digital Identity Wallet,
  kurz auch EUDI-Wallet, eine zuverlässige Möglichkeit der Altersverifikation gegenüber
  digitalen Diensten bereitstellen. Die Bundesregierung wird sich darüber hinaus für
  eine Reihe weiterer Maßnahmen einsetzen, zum Beispiel dafür, dass das KI-Seepferdchen
  als altersgerechtes Angebot für das Grundschulalter entwickelt und deutschlandweit
  einheitlich verbreitet wird. Es sind also Eckpunkte, die dann auch Stück für Stück
  möglichst zügig in die Umsetzung gehen. Das Bundeskabinett hat heute zudem die Einsetzung
  einer Pflegestrukturkommission beschlossen. Sie erinnern sich: Es ist sozusagen
  der zweite Teil der Pflegereform, die im kommenden Jahr erfolgen soll. ‑ Die Kommission
  soll bis Ende Januar 2027 Vorschläge zur Sicherstellung einer bedarfsgerechten und
  nachhaltigen Finanzierung der Pflegeversicherung und einer guten pflegerischen Versorgung
  vorlegen. Die gesetzliche Umsetzung der Vorschläge ist bis zum 1. Juli 2027 vorgesehen.
  Der Kommission gehören 13 Expertinnen und Experten an. Die Kommission wird die Ausgabenentwicklung
  in der Pflegeversicherung analysieren und auf dieser Grundlage Vorschläge für eine
  effiziente und bessere Versorgung sowie für eine nachhaltige Finanzierung und für
  mehr Prävention und Rehabilitation zur Verhinderung oder Verzögerung von Pflegebedürftigkeit
  entwickeln. Jeder Vorschlag soll darauf geprüft werden, ob er eine würdevolle Pflege
  sichert und pflegende Angehörige entlastet. Zudem soll die finanzielle Wirkung der
  Vorschläge dargelegt werden. So weit war es das für den Moment zum heutigen Kabinett.
  (zu Eckpunkten zum Kinder- und Jugendmedienschutz ) Sie reden von sozialen Netzwerken.
  Sind darin auch die Spiele enthalten, in denen es Chatmöglichkeiten für Kinder und
  Jugendliche gibt, zu denen die Expertinnen und Experten ja auch immer deutlich sagen:
  Gerade über diese Spielechats wird auch viel Grooming usw. betrieben? Die Expertinnen
  und Experten sitzen im BMBFSFJ. Deshalb würde ich diesbezüglich gern abgeben. Sie
  machen mit Ihrer Frage gerade einen ganz wichtigen Punkt. Vielen Dank dafür. Natürlich
  fassen wir es weiter als nur soziale Netzwerke. Genau das, was Sie gerade gesagt
  haben, muss in Zukunft schon bei der Erstellung solcher Tools mitgedacht werden.
  Safety by Design ist ein ganz wichtiger Ankerpunkt. Wir sehen dabei eben auch Hersteller
  und Betreiber und Plattformbetreiber in der Verantwortung, dies sicherzustellen.
  (zur Zuckergetränkesteuer ) An das Finanzministerium: Ist in der Prognose bezüglich
  der erwarteten Einnahmen schon eingepreist, dass Hersteller ihre Rezepturen vielleicht
  ändern? Wenn ja, mit welchen Zahlen wird gerechnet? Selbstverständlich sind die
  Berechnungen so, dass solche Effekte, auch die Lenkungswirkung durch die Zuckergetränkesteuer,
  dabei mit einkalkuliert sind. Wir haben die Berechnungen entsprechend vorgenommen,
  damit die Zuckergetränkesteuer eben auch den geplanten Beitrag zur Stabilisierung
  der Beiträge in der gesetzlichen Krankenversicherung erbringen kann. Genau dafür
  ist die Zuckergetränkesteuer ja gedacht. Genau dafür hat der Deutsche Bundestag
  mit dem GKV-Beitragssatzstabilisierungsgesetz auch schon beschlossen, dass es eine
  solche Zuckergetränkesteuer geben soll und ungefähr auch die Größenordnungen beschlossen.
  Da dieses Geld im System der gesetzlichen Krankenversicherung zur Stabilisierung
  des Systems gebraucht wird, ist das natürlich entsprechend auch sorgfältig berechnet
  und entsprechend einkalkuliert Vielleicht, um die Relation einmal aufzumachen: Die
  Gesundheitsexpertinnen und ‑experten gehen etwa davon aus, dass Krankheiten, die
  durch überhöhten Zuckerkonsum verursacht werden, etwa 2,1 Milliarden Euro jedes
  Jahr an Gesundheitskosten, also an Belastungen für die gesetzliche Krankenversicherung,
  letztlich für alle Versicherten, verursachen. Insofern ist es auch mit der Zuckergetränkesteuer
  ein Beitrag zur Gerechtigkeit im System, weil diejenigen, die diese hohen Kosten
  auch der Versorgung verursachen, etwas stärker dafür herangezogen werden. Auch ich
  habe eine Frage an Herrn Kall. Einige Länder haben ja angekündigt, dabei nicht mitgehen
  zu wollen. Von welchem Zeitplan gehen Sie aus? Was macht Sie mit dem Blick auf den
  Zeitplan so sicher? Die Bundesregierung hat ja eine sogenannte Formulierungshilfe
  beschlossen, also einen Regelungsvorschlag, der von den Regierungsfraktionen in
  den Deutschen Bundestag eingebracht wird und dann dort weiter beraten wird. Insofern
  obliegt der weitere Zeitplan auch den Fraktionen. Es ist nicht ein Gesetzentwurf,
  den wir heute als Bundesregierung sozusagen im normalen Verfahren auf den Weg gebracht
  haben, sondern die Regierungsfraktionen werden den Gesetzentwurf einbringen. Ab
  dem 1. Juli 2027 soll die Zuckergetränkesteuer auch die entsprechenden Einnahmen
  bringen, wie gesagt, zur Finanzierung der gesetzlichen Krankenversicherung. Letztlich
  wird es auch im Bundesrat ja dann in den Beratungen, die es geben wird, genau um
  das Ziel gehen, die gesetzliche Krankenversicherung zu stabilisieren, dafür zu sorgen,
  dass die Beiträge nicht weiter steigen, und etwas für den Gesundheitsschutz vor
  allen Dingen von Kindern und Jugendlichen zu tun. Darin, dass etwas gegen diesen
  überhöhten Zuckerkonsum getan werden muss, sind sich Ärztinnen und Ärzte, Verbraucherschützer
  und viele andere Expertinnen und Experten wirklich seit vielen Jahren einig. Wir
  sind uns ziemlich sicher, dass es sowohl im Bund als auch in den Ländern entsprechende
  Unterstützung dafür gibt, um diesen Interessen, Gesundheitsschutz und eine stabile
  Finanzierung der gesetzlichen Krankenversicherung, keine Beitragserhöhungen, Rechnung
  zu tragen. Das GKV- Beitragssatzstabilisierungsgesetz ist auch sowohl vom Deutschen
  Bundestag beschlossen worden als auch dann durch den Bundesrat durchgegangen. Es
  hat keinen Einspruch der Länder gegeben. Auch darin war die Zuckergetränkesteuer
  schon als Maßnahme angelegt. Ich habe eine Frage an Herrn Meyer zum gleichen Thema:
  Können Sie noch einmal darlegen, welche substanziellen Änderungen es an dem ursprünglichen
  Entwurf des Ministeriums zur Zuckersteuer gab, sodass der nun zustimmungsfähig wurde?
  Der Kanzler hatte ja vorher Bedenken. Wir haben in den letzten Tagen ‑ das ist ja
  öffentlich auch ein bisschen nachvollzogen worden ‑ nicht über das Ob diskutiert,
  sondern wir haben über das Wie diskutiert. Ich glaube, wir haben hier eine tragfähige
  Lösung gefunden. Das war auch heute kein großes Diskussionsthema mehr im Kabinett,
  sondern wurde so einstimmig, einmütig beschlossen. Ich weiß nicht, ob sich die Frage
  an Herrn Kall oder ein anderes Fachressort oder Herrn Meyer richtet. Zur Tragfähigkeit
  gehört ja, dass kleinere Produzenten zuckerhaltiger Getränke von der Steuer ausgenommen
  sind. Das schwächt doch aber das Argument, dass man Gesundheit fördern will, weil
  für die Schädlichkeit des konsumierten Zuckers ja nicht entscheidend ist, ob er
  von einem großen oder einem kleinen Hersteller kommt. Wie Sie wissen, gibt es in
  der Gesetzgebung immer Verhältnismäßigkeitserwägungen, und dabei muss man immer
  sein Ziel und die Wirkung auch in ein Verhältnis stellen. Deswegen war es hier eine
  bewusste Entscheidung, welche Hersteller man auch wie belasten kann. Die Steuer
  setzt ja unmittelbar bei den Herstellern und Großhändlern an. Die werden diese Steuer
  dann zahlen müssen. Deswegen sind jetzt Hersteller von 70 000 Litern pro Jahr ‑ das
  sind wirklich kleine Hersteller ‑ ausgenommen, und das ist in einer solchen Verhältnismäßigkeitserwägung
  aus unserer Sicht auch eine vertretbare Lösung. Das Landwirtschaftsministerium hat
  sich dafür sehr eingesetzt. Vielleicht möchten die Kolleginnen und Kollegen dazu
  etwas ergänzen, aber nur, wenn sie möchten. Vielen Dank für die Gelegenheit, hier
  auch noch einmal etwas dazu sagen zu dürfen. Wie der Kollege Kall schon gesagt hat,
  war es uns sehr wichtig, dass es diese Ausnahmen für die kleinen Betriebe gibt.
  Uns ging es darum, eine bürokratiearme, eine nachvollziehbare, eine leicht umsetzbare
  Lösung umzusetzen. Das hat unser Minister und hat unser Haus in den letzten Wochen
  in die Debatten eingebracht, und deswegen war uns diese Ausnahme wichtig, zum einen
  hinsichtlich der Betriebe mit 70 000 Litern und dann eben auch hinsichtlich der
  Betriebe mit bis zu einer Million Litern. Da braucht es noch eine zusätzliche Überprüfung
  durch die EU. Aber wenn diese Notifizierung durch ist, dann wird es diese Ausnahmen
  auch geben, damit kleine Betriebe, die wirtschaftlich sicherlich eher unter Druck
  stehen als die großen, in der Lage sind, ihre Produktion fortzusetzen und ihr Angebot
  zu erhalten. Ich will auch noch einmal etwas ergänzen. Ich glaube, das ist ein pragmatischer
  und guter Weg. Am Ende, wenn wir vom Ziel her denken, das wir erreichen wollen,
  müssen wir uns natürlich die großen Hebel und auch die großen Hersteller anschauen.
  Da liegt auch das größte Veränderungspotenzial. Deshalb, glaube ich, ist das eine
  pragmatische und gute Lösung. Zur Umsetzbarkeit gehört auch, dass eine ursprünglich
  vorgesehene dritte Steuerstufe für besonders zuckerhaltige Getränke fallen gelassen
  wurde. Das ist unter dem Gesundheitsaspekt nun erst recht kontraproduktiv. Warum
  wurde das gemacht? Wenn man in der Lage ist, zwei Steuerstufen oder -schritte zu
  erheben, dann ist es wohl kein besonderer bürokratischer Mehraufwand, zu sagen,
  dass man dann auch drei machen kann. Warum wurde darauf verzichtet? Nein, es gibt
  jetzt zwei Stufen ‑ auch das ist eine pragmatische und auch bürokratiearme Lösung ‑,
  und die zweite Stufe, die es jetzt gibt, liegt nicht weit unter dem, was als dritte
  Stufe vorgesehen war. Ich würde mir gerne noch einmal diese Ausnahmeregelung ein
  bisschen erläutern lassen, damit ich das verstehe. Ist vorgesehen, dass die Firmen
  unabhängig sein müssen, oder können quasi auch Tochterunternehmen eines großen Konzerns
  unter diese Regel fallen? Was machen Sie zum Beispiel, damit große Konzerne ihre
  Unternehmen nicht unternehmerisch stückeln, um dann eben die Ausnahmeregelung in
  Anspruch nehmen zu können? Die Frage richtet sich an denjenigen, der es besser erklären
  kann, wer auch immer. Meiner Kenntnis nach geht es um unabhängige Betriebe, bei
  denen der Ausstoß der Menge gemessen wird. Das heißt, es wird geschaut, wie viel
  die an zuckerhaltigen Getränken produzieren, und daran wird das gemessen. Genau,
  und alle großen Getränkehersteller ‑ das haben mir die Expertinnen und Experten
  heute Morgen auch noch einmal versichert ‑ liegen deutlich über diesen Schwellenwerten.
  Die großen Getränkehersteller sind also alle erfasst, und der Zoll, der solche Verbrauchsteuern
  administriert und damit auch viel Erfahrung hat, wird natürlich darauf achten, dass
  man sich dem dann nicht durch irgendwelche Firmenkonstruktionen entziehen kann.
  Ich würde eigentlich erwarten, dass sich bei einem Thema, das Gesundheitssicherung
  zum Ziel hat, auch das Fachressort dazu äußert. Ist denn das Gesundheitsministerium
  mit der Art der „Zuckersteuer light“, wie sie ja auch genannt wird, also der reduzierten
  Einschränkungswirkung, zufrieden, oder wären aus fachlicher Sicht die ursprünglichen
  Ansätze richtiger gewesen? Danke für die Frage. Seitens des BMG sind wir damit zufrieden,
  denn ‑ wir haben auch Herrn Kall gehört ‑ es gibt Kosten, die durch Übergewicht,
  Adipositas, Herz-Kreislauf-Erkrankungen entstehen. Wenn wir die senken können und
  wenn wir die Gesundheit der Menschen dadurch verbessern können, dass wir den Zuckergehalt
  in Erfrischungsgetränken senken, dann hat das insofern eine positive Wirkung. Ja,
  aber mit den ursprünglichen Steuersätzen wären der Gesundheitseffekt und der Schutzeffekt
  ja höher gewesen. Wie können Sie dann mit dem niedrigeren Ergebnis fachlich zufrieden
  sein? Ich bin mir jetzt nicht sicher, ob die Frage nicht doch eher hypothetischer
  Natur ist. Dass Sie Ihre Auffassung haben, kann ich nachvollziehen, aber der würde
  ich mich an dieser Stelle jetzt nicht anschließen. Kleine Unternehmen sollen den
  Zucker nicht reduzieren. Korrekt? Kleinere Unternehmen, wie wir gerade gehört haben,
  sollen ihren Zuckeranteil nicht reduzieren. Die israelische Regierung hat der „taz“-Korrespondentin
  Serena Bilanceri die Aufenthaltsgenehmigung entzogen . Infolgedessen wurde ihr kein
  Arbeitsvisum erteilt. Das heißt, sie kann jetzt nicht mehr in Israel arbeiten. Die
  „taz“ sieht in der Einreiseverweigerung für ihre Korrespondentin eine herbe Einschränkung
  der Pressefreiheit. Teilt das Auswärtige Amt diese Einschätzung? Lassen Sie mich
  bezüglich Ihrer Frage vielleicht vorwegstellen, dass uns der Fall von Frau Bilanceri
  natürlich bekannt ist und dass wir uns immer und überall für die Wahrung der Pressefreiheit
  einsetzen. Das gilt auch in diesem spezifischen Fall mit Blick auf Frau Bilanceri.
  Wir nehmen den Fall sehr ernst. Wir setzen uns auch für sie ein. Wir haben das Ganze
  in der Kürze der Zeit bereits hoch- und höchstrangig, übrigens auch mehrfach, gegenüber
  den israelischen Behörden und der israelischen Regierung thematisiert und werden
  das auch weiterhin tun. Eine Einordnung dessen, was israelisches Recht angeht, kann
  ich hier an dieser Stelle nicht vornehmen. Ich kann aber noch einmal unsere Position
  unterstreichen, dass wir uns für Presse- und Meinungsfreiheit weltweit einsetzen,
  auch in diesem Fall. Was würde die Bundesregierung denn unternehmen, wenn es auch
  noch andere Korrespondentinnen und Korrespondenten weiterer deutscher Medien oder
  deutschsprachiger Medien so erginge wie unserer Kollegin? Es tut mir leid, das fällt
  jetzt wirklich in den Bereich: Was würde die Bundesregierung unternehmen, wenn ‑ ‑ ‑
  Das ist absolute Spekulation. Ich hatte ja gerade dargelegt, dass wir uns in diesem
  spezifischen Fall einsetzen. Vielleicht auch noch einmal als Einordnung: Die „taz“
  berichtet seit Jahrzehnten über Israel und ist in Deutschland ein etabliertes und
  anerkanntes Medium. Insofern setzen wir uns für die Arbeitsfähigkeit der „taz“ in
  Israel und im Nahen Osten ‑ es geht ja wahrscheinlich auch um die besetzten palästinensischen
  Gebiete ‑ ein. Können Sie einmal erläutern, wie diese Einreiseverweigerung mit demokratischen
  Grundsätzen und der Verpflichtung zur Pressefreiheit vereinbar ist? Das ist keine
  Frage, die sich an uns richtet. Wir setzen uns dafür ein, dass die Arbeitsfähigkeit
  ermöglicht wird. Wir können hier für Sie keine Bewertung des israelischen Rechts
  vornehmen. Nein, aber Sie haben uns ja gerade Grundsätze und Ihren Einsatz für Pressefreiheit
  genannt. Jetzt ist ja dieser Fall das Gegenteil von dem, was man unter demokratischen
  Grundsätzen und Pressefreiheit versteht, sondern eher Praxis von autoritären Staaten.
  Die Interpretation, diese Aussagen nebeneinander zu legen, überlasse ich Ihnen.
  Ich habe gerade dargelegt, wofür wir uns einsetzen und dass wir uns in diesem Fall
  mehrfach hochrangig ‑ höchstrangig sogar ‑ bemüht haben, eine Lösung herbeizuführen.
  Da Sie jetzt zweimal den Superlativ „höchstrangig“ verwendet haben, frage ich: Ist
  denn zumindest auf der Ebene des Auswärtigen Amtes ein höherer Rang als der Ministerrang
  denkbar? Ich habe Ihnen dargelegt, was wir unternommen haben, und Sie haben richtig
  interpretiert, dass der Minister mit der Sache befasst war. Hat er ‑ das wäre ja
  üblich ‑ mit seinem israelischen Amtskollegen darüber kommuniziert und die Forderung,
  so sehe ich das, nach Akkreditierung vertreten? Wie war die Reaktion darauf? Auch
  da gilt: Sie wissen, dass wir aus vertraulichen Gesprächen nichts berichten. Ich
  hatte Ihnen aber gerade dargelegt, dass der Minister das getan hat. Sie wissen auch,
  dass der natürliche Ansprechpartner des Außenministers der israelische Außenminister
  ist. Meine Frage betrifft die, wie es hieß, umfangreichen internen Ermittlungen
  zu einer Kaserne ‑ einem Sanitätsbataillon , wenn ich mich nicht irre. Können Sie
  uns diesbezüglich noch einmal das Meldeverfahren erläutern? Können Sie uns sagen,
  wie viele Soldatinnen und Soldaten von diesen Ermittlungen betroffen sind? Wie groß
  ist der Anteil der Frauen in dieser Kaserne und auch in Führungsverantwortung in
  dieser Kaserne? Ihre Frage bezieht sich auf uns bekannte mögliche Verstöße im Sanitätsregiment 1
  in Weißenfels ‑ „Kaserne“ ist ein bisschen abstrakt gefasst. Lassen Sie mich vorwegstellen:
  Wir nehmen diese Vorwürfe äußerst ernst und verfolgen hier eine klare Null-Toleranz-Linie.
  Unverzüglich nach Bekanntwerden der Verdachtsfälle wurden Ermittlungen eingeleitet.
  Die Vorgänge werden lückenlos aufgeklärt und bei Bestätigung konsequent geahndet.
  Um ein bisschen weiter auszuholen: Der vorliegende Fall zeigt deutlich, dass insbesondere
  den direkten Vorgesetzten eine zentrale Rolle bei der Aufklärung zukommt. Vor wenigen
  Wochen hat auch der Generalinspekteur hierzu einen Tagesbefehl erlassen. Der zuständige
  Kompaniechef hat jetzt die Aufklärung nach Bekanntwerden von möglichen Fehlverhalten
  eng daran ausgerichtet, ergänzend natürlich zu den weiteren existierenden Vorschriften.
  Sie werden verstehen, dass ich aus datenschutzrechtlichen Gründen und aufgrund des
  laufenden Verfahrens zu weiteren Details hier derzeit keine Aussagen treffen kann.
  Wir wollen die Ermittlungen erst einmal abwarten. Ich kann aber noch eine generelle
  Einordnung vornehmen: Uns sind in den letzten Jahren immer wieder bzw. vermehrt
  Fälle von möglichem sexuellen oder generellen Fehlverhalten von Soldaten aufgekommen.
  Da kann man zum Beispiel auch bis zu den bekannten Vorfällen in Zweibrücken zurückblicken.
  Wir haben dann immer wieder auch konkrete Maßnahmen eingeleitet und umgesetzt. Diese
  Maßnahmen werden anschließend evaluiert, und dann werden sie angepasst oder es werden
  ergänzende Maßnahmen getroffen. Trotz umfangreicher Prävention und konsequenter
  Sanktionierung gibt es immer wieder solche Vorfälle. Aktuell leiten wir in diesem
  Kontext vier Maßnahmen ein. Dazu gehört erstens die Einrichtung eines Interventionszentrums.
  Das ist noch in diesem Jahr geplant, und es soll 24/7 mit ausgebildetem, psychologisch
  geschultem Fachpersonal verfügbar sein. Wir prüfen zweitens die Anpassung des militärischen
  Beurteilungswesens. Das heißt, Maßnahmen der Prävention und des Umgangs mit Verdachtsfällen
  von sexualisiertem Fehlverhalten werden bei der Beurteilung von Vorgesetzten stärker
  berücksichtigt. Wir prüfen drittens die Spezialisierung von Wehrdisziplinaranwälten
  und Wehrdisziplinaranwältinnen in den sogenannten Schwerpunktteams. Sie unterstützen
  dann die jeweils zuständigen Disziplinaranwaltschaften vor Ort bei den Ermittlungen.
  Viertens stärken wir die Rechte von Betroffenen, indem wir die Auskunftsrechte von
  Opfern von Übergriffen erweitern. Dafür werden wir auch eine Änderung der Wehrdisziplinarordnung
  auf den Weg bringen. Diese Maßnahmen sind jedoch nur ein Auszug aus dem gesamten
  Maßnahmenpaket, das wir derzeit prüfen und auf den Weg bringen möchten. Weil es
  um ein Sanitätsregiment geht: Wissen Sie etwas über die Drogen, um die es geht?
  Es kann ja Alkohol sein, es kann etwas aus dem Sanitätsbereich sein, es kann alles
  Mögliche sein. Können Sie irgendetwas dazu sagen, welche Drogen im Spiel waren?
  Was ich sagen kann, ist, dass verschiedene Vorwürfe im Raum stehen, die derzeit
  geprüft und ermittelt werden. Die Bandbreite ist ein bisschen größer. Das kann unter
  Umständen auch Betäubungsmittel betreffen, es kann aber auch sexualisiertes Fehlverhalten
  betreffen. Das wird gerade aber Gegenstand der Ermittlungen, und deswegen kann ich
  hier auch nicht weiter darauf eingehen. Könnten Sie mit Blick auf Weißenfels noch
  erläutern, was den Anstoß für die Ermittlungen gegeben hat? Wie war da sozusagen
  die Genese? Den Anstoß für die Ermittlungen gab das Bekanntwerden der Vorfälle gegenüber
  dem Vorgesetzten, der unmittelbar nach Kenntnisnahme die Ermittlungen eingeleitet
  hat. Dabei geht es aber nicht um einen einzelnen Fall, sondern um getrennt voneinander
  zu betrachtende Fälle. Aber wie hat der Vorgesetzte von den Vorfällen Kenntnis erlangt?
  Es wurde ihm sicherlich entweder im Rahmen seiner Dienstaufsicht, die jeder Vorgesetzte
  ausüben muss, und seiner Fürsorgepflicht gegenüber den Soldaten gemeldet, oder er
  hat über Gespräche mit Soldaten davon Kenntnis bekommen. Dann muss er natürlich ‑
  dazu ist er verpflichtet ‑ umgehend Ermittlungen einleiten. Sie haben gesagt, dass
  in den letzten Jahren vermehrt Fälle bekannt wurden. Wie erklären Sie sich diesen
  Anstieg? Auch vor Jahren gab es schon aufsehenerregende Fälle; insofern ist das
  ja kein neues Problem. Hat die Bundeswehr da bisher nicht genug getan? Ich möchte
  jetzt keine Erklärung dafür abgeben. Wir sehen natürlich, dass die Zahl der Meldungen
  zunimmt. Dies hängt auch damit zusammen, dass Betroffene inzwischen über mehr rechtliche
  Wege verfügen und die Maßnahmen, die wir ergriffen haben, nutzen, um Vorfälle zu
  melden. Diese Meldungen werden geprüft und gegebenenfalls zum Anlass für weitere
  Ermittlungen genommen, um festzustellen, ob Fehlverhalten oder Verstöße vorliegen.
  Das würde ich jetzt nicht als einzige mögliche Interpretation ansehen. Es ist aber
  sicherlich ein Aspekt, dass man mehr Möglichkeiten und Meldewege geschaffen hat,
  um als Opfer selbst erlebtes oder beobachtetes Fehlverhalten zu melden. Es werden
  jetzt Forderungen nach Einrichtung einer externen Meldestelle laut. Unterstützt
  der Minister das? Wie ich ausgeführt habe, werden wir beim Zentrum Innere Führung
  ein 24/7 erreichbares Interventionszentrum mit speziell geschultem psychologischem
  Personal einrichten. Das ist eine ganz konkrete Maßnahme, die wir jetzt zeitnah
  umsetzen. Das ist intern. Was ist mit einer externen Meldestelle, um zu verhindern,
  dass Fehlverhalten wegen Korpsgeist oder gegenseitiger Deckung unentdeckt bleibt?
  Korpsgeist betrifft ja quasi den Verband oder die eigenen Truppen. Wenn Sie das
  so definieren und jetzt Weißenfels als Beispiel nehmen, dann wäre das ja extern.
  Ich weiß nicht, was Sie unter einer externen Meldestelle verstehen. Da haben wir
  derzeit keine explizite Maßnahme. Wir prüfen aber natürlich kontinuierlich alle
  möglichen Anpassungen. Ich habe ja gesagt, dass wir die von uns ergriffenen Maßnahmen
  ständig daraufhin evaluieren, ob sie die gewünschte Wirkung entfalten, und dann
  Anpassungen vornehmen oder neue Maßnahmen auf den Weg bringen. An das Verkehrsministerium:
  Bei der Verkehrsministerkonferenz in der kommenden Woche soll ja vor allem über
  zwei Themenkomplexe geredet werden, nämlich über die Regionalisierungsmittel und
  über die Trassenpreise. Ich würde Sie bitten, die Position des Bundes zu diesen
  zwei Punkten zu formulieren und Ihren Ausblick auf die VMK zu geben. Was einen Ausblick
  auf die Verkehrsministerkonferenz angeht, so ist, wie so oft, der Blick in die Zukunft
  ein bisschen schwierig. ‑ Der Minister wird teilnehmen. Er ist von seinen Länderkollegen
  eingeladen worden und wird sich natürlich auch den Diskussionen zu Trassenpreisen
  und Regionalisierungsmitteln stellen. Könnten Sie die Position des Bundes noch einmal
  formulieren? Bei den Regionalisierungsmitteln geht es ja zum Beispiel auch um Geldforderungen
  vonseiten der Länder, und bei den Trassenpreisen geht es auch um die Frage, wie
  sich das dann weiterentwickeln wird. Wie stellt der Bund sich das vor? Das ist richtig;
  die Diskussionen sind uns bekannt, und auch die Forderungen der Länder in dem Zusammenhang
  sind nicht neu. An der Überarbeitung des Trassenpreissystems arbeiten wir auch in
  Abstimmung mit den Ländern und den Verbänden. Dazu werden wir hoffentlich zeitnah
  Ergebnisse präsentieren können. Die Überarbeitung geschieht aber, wie gesagt, in
  enger Abstimmung mit den Ländern, und die VMK ist das probate Forum dafür. Da werden
  wir dann natürlich auch das Thema Regionalisierungsmittel noch einmal besprechen.
  An das BMI: Es gibt jetzt einen gerichtlichen Streit über eine Förderentscheidung
  der Bundeszentrale für politische Bildung gegenüber der Gruppe „Radikale Töchter“
  . Dabei geht es um eine recht hohe Fördersumme von 290 000 Euro. Es steht der Vorwurf
  im Raum, dass die Entscheidung, diese Förderung zu entziehen, obwohl sie schon einmal
  erteilt worden ist, politisch und nicht aus fachlichen Gründen gefällt worden sei.
  Die positive Förderentscheidung sei zurückgenommen worden, nachdem es Kritik am
  Bundeskanzler gab. Sie werden jetzt wahrscheinlich nichts zu dieser konkreten Förderentscheidung
  sagen können; aber der Vorwurf, dass es da eine politische statt einer fachlichen
  Entscheidung gegeben habe, ist ja massiv. Wie stehen Sie dazu? Ich kann bestätigen,
  dass ein Förderantrag der „Radikalen Töchter“ derzeit Gegenstand eines verwaltungsrechtlichen
  Verfahrens ist. Wie Sie auch schon vermutet haben, können wir uns zu laufenden gerichtlichen
  Verfahren nicht äußern. Dann nutze ich die Nachfrage zu einer Personalie. Nina Hauer
  soll ja die Nachfolge von Sönke Rix antreten, der (von seinem Amt als Präsident
  der Bundeszentrale für politische Bildung ) zurückgetreten ist. Das steht schon
  seit Wochen im Raum, und noch immer ist diese Personalie nicht berufen. Warum dauert
  es so lange? Zu Personalien äußern wir uns zu gegebener Zeit, wenn die Personalien
  feststehen. Vielleicht zum Hintergrund: Es gibt ja auch den Vizepräsidenten Volker
  Ullrich, der seit dem 1. August im Dienst ist. Alles Weitere werden wir zu gegebener
  Zeit bekanntgeben. Eine Frage an Herrn Meyer bzw. an das Wirtschaftsministerium:
  Der Bundeskanzler hatte nach der CDU-Beratung am Montag angekündigt, dass die Stromsteuer
  auf das europäische Mindestmaß gesenkt werden soll . Wird daran in der Bundesregierung
  jetzt schon gearbeitet? Falls ja, welches Ministerium ist damit konkret befasst,
  BMWE oder BMF? Die Senkung der Stromsteuer ist ja bereits Teil des Koalitionsvertrages.
  Wir haben das in einem ersten Schritt für 600 000 Unternehmen umgesetzt. Uns war
  sehr wichtig, in einer Phase, in der wir über einen längeren Zeitraum Nullwachstum
  in Deutschland hatten, hier einen Schwerpunkt zu setzen. Wir halten es nach wie
  vor für sehr wünschenswert, die Stromsteuersenkung, wie im Koalitionsvertrag beschlossen,
  komplett umzusetzen. Die Bedingung dafür ist natürlich, dass dafür die entsprechenden
  finanziellen Mittel bereitstehen. Die Haushaltsberatungen laufen aktuell im Parlament.
  Noch einmal: Wenn es diese Spielräume gibt, dann ist das sicherlich eine Maßnahme,
  die für uns absolute Priorität hat. Ich kann eigentlich nur unterstreichen, was
  Herr Meyer gesagt hat. Der Koalitionsausschuss hatte im letzten Jahr intensiv darüber
  beraten, in welchen Stufen die Stromsteuer gesenkt und wer wann wie entlastet werden
  kann. Dazu gab es eine sehr klare Prioritätenentscheidung ‑ die erste Priorität,
  Arbeitsplätze zu sichern, die zweite Priorität, Verbraucherinnen und Verbraucher
  zu entlasten. Aufgrund dieser ersten Priorität, Arbeitsplätze zu sichern, war die
  Entscheidung: Wir entlasten jetzt zuerst die Industrie und das sogenannte produzierende
  Gewerbe. ‑ Das sind die 600 000 Unternehmen und Betriebe, von denen Herr Meyer gesprochen
  hat. Alles Weitere muss finanzierbar sein. Das hat der Bundesfinanzminister auch
  noch einmal am Montag gesagt. Sobald es Finanzierungsmöglichkeiten dafür im Bundeshaushalt
  gibt, können weitere Schritte bei der Senkung der Stromsteuer folgen. Ich will vielleicht
  einmal sagen: Das, was die Bundesregierung heute schon tut, um Bürgerinnen und Bürger,
  Verbraucher, aber vor allen Dingen auch Wirtschaft und Industrie bei den Energiepreisen
  zu entlasten, umfasst etwa 10 Milliarden Euro im Jahr aus dem Bundeshaushalt und
  vor allen Dingen aus dem Klima- und Transformationsfonds. Das sind vor allen Dingen
  Netzentgelte und andere Entlastungen. Dazu gehört auch das, was bei der Stromsteuer
  jetzt schon für die Wirtschaft getan wurde. Es sind 10 Milliarden Euro im Jahr,
  die wir jetzt schon in die Hand nehmen, um die Energiekosten zu drücken. Das ist
  angesichts der aktuellen Haushaltslage wirklich viel. Alles, was darüber hinausgeht,
  muss finanzierbar sein. Können Sie etwas zum anvisierten Zeitplan sagen? Es wird
  sicherlich in der Koalition weiter darüber gesprochen werden. Die Koalition ist
  sich ja einig, dass noch mehr passieren soll, um die Energiekosten zu senken. ‑ Nochmals:
  Die Gegenfinanzierung muss möglich sein. Zum Haushalt 2027 laufen, wie Sie wissen,
  jetzt die Beratungen im Deutschen Bundestag; die werden bis Ende November abgeschlossen.
  Wenn man da etwas machen wollte, dann wäre das ein Thema in den Haushaltsberatungen.
  Aber erst einmal wird sicherlich die Koalition weiter darüber sprechen. In dieser
  Woche ist der erste Bericht der Missbrauchsbeauftragten des Bundes vorgestellt worden.
  Die Frage geht ans Finanzministerium. Dort soll ein Papier vorliegen, das zwischen
  dem Familienministerium, glaube ich, und dem Finanzministerium besprochen wurde.
  Es geht um diesen Fonds, der ja ausläuft, und es geht um eine Billigkeitsrichtlinie,
  nach der der Bundesrechnungshof dazu etwas angemahnt hat. In der Pressekonferenz
  in dieser Woche kam jedenfalls heraus, dass das Papier wohl dort liegt, aber niemand
  weiß, wo es liegt, woran es liegt. Dazu würde ich gerne von Ihnen den Stand der
  Dinge wissen, Herr Kall. Ich persönlich höre das zum ersten Mal. Dazu muss ich mich
  schlau machen, und wir müssen eine Antwort nachreichen. Dann nehmen wir das auf
  die Liste der Themen, die nachgereicht werden. Ich probiere es mal beim Außenministerium,
  vielleicht geht meine Frage aber auch an ein anderes Ressort: Die neue Antisemitismusbeauftragte
  der Bundesregierung , Frau Katharina von Schnurbein, hat vor zwei Jahren, 2024,
  erklärt, dass bestimmte Hilfslieferungen an die Palästinenser , unter anderem solche
  des Roten Kreuzes, potenzieller Antisemitismus seien. Teilt die Bundesregierung
  diese Position? Wir haben hier sehr oft unsere Position, unsere Haltung und auch
  unsere Forderung zu humanitärer Hilfe im Gazastreifen dargelegt. Die ist unverändert.
  Nach wie vor gelangt zu wenig humanitäre Hilfe in den Gazastreifen. Wir möchten,
  dass sich das ändert. Das hat auch der Außenminister vor einigen Wochen noch einmal
  gesagt. Wir hatten das auch hier thematisiert. Es ging um einen deutschen Beitrag,
  um einen Scanner, den Deutschland an Israel geliefert hat, damit gerade Dual-Use-Güter
  unterschieden und entsprechend überprüft werden können. Das ist ein konkreter deutscher
  Beitrag dazu. Wir wollen nach wie vor, dass dieser Scanner jetzt eingesetzt wird
  und dadurch mehr humanitäre Hilfe in den Gazastreifen gelangen kann. Das ist die
  Position und Haltung der Bundesregierung. Sehen Sie es mir nach, dass ich hier ansonsten
  keine Urteile von vor einigen Jahren von dritter Stelle kommentiere oder bewerte.
  Das war nicht vor einigen Jahren, sondern vor zwei Jahren. Das war schon im Verlauf
  des anhaltenden Gazakrieges. Substantiell widersprechen sich diese Positionen völlig.
  Wie soll eine Antisemitismusbeauftragte der Bundesregierung, die inhaltlich eine
  solche Position vertritt, die völlig konträr ist zu dem von Ihnen wiederholten Ansatz
  ‑ zumindest des Außenamtes ‑, ihre Funktion wahrnehmen können? Ich hatte gerade
  gesagt: Ich kenne weder das Zitat in Gänze, das Sie vortragen, noch den Kontext.
  Ich habe aber sehr klar gemacht, wie unsere Position und Haltung zu humanitärer
  Hilfe ist und wie unsere Position und Haltung insbesondere zu dem Zeitpunkt war,
  in den dann auch der Antritt der Regierung fällt. Sie wissen, dass wir das damals
  sehr kritisch begleitet hatten, als humanitäre Hilfe den Gazastreifen eben nicht
  mehr erreichen konnte. Darauf möchte ich Sie gerne verweisen. Frau Singer, das BMI
  ist ja für dieses Amt der Beauftragten zuständig. Könnten Sie uns sagen, was Frau
  von Schnurbein an sich für dieses Amt qualifiziert? Wir erleben gerade, auch in
  den letzten Wochen, den massiven Missbrauch von Antisemitismusvorwürfen. Oft sind
  es Antisemitismusvorwürfe, bei denen es eigentlich um Israelkritik geht. Sie wird
  unter anderem auch von israelischen Medien als inoffizielle Botschafterin Israels
  benannt. Die Netanjahu-Regierung ist Fan von ihr. Sie ist in der Vergangenheit dadurch
  aufgefallen, wenn es um Israelkritik von deutschen Politikern ging, dass sie mit
  Antisemitismusvorwürfen gearbeitet hat. Was qualifiziert sie? Ich würde Sie dazu
  gerne auf die Pressemitteilung verweisen, die wir heute, einige Stunden nach dem
  Kabinett rausgeschickt haben. Darin stehen einige Dinge. Ansonsten ist das eine
  unabhängige Beauftragte der Bundesregierung, und die ist ab heute im Amt. Ich würde
  Sie gerne darauf verweisen, Ihre Fragen dann dort zu stellen. Nun sind wir ja hier
  nicht beim Vorlesen von Pressemitteilungen, sondern ich wollte von Ihnen als BMI-Sprecherin
  wissen, was Frau Schnurbein kritisiert und wie Sie verhindern wollen, dass sie nicht
  eine Anti-Israel-Kritik-Beauftragte, sondern eine Antisemitismusbeauftragte wird.
  Was qualifiziert Frau Schnurbein? Ich möchte auf das verweisen, was die neue Beauftragte
  dazu schon gesagt hat. Ich verweise auf das, was wir als BMI dazu schon öffentlich
  herausgegeben haben. Sie haben gerade gesagt, Sie möchten nicht die Pressemitteilung
  vorgelesen haben. Deshalb möchte ich gern dabei bleiben. Sie müssen das doch frei
  referieren können, wenn Sie diese Entscheidung treffen.'
