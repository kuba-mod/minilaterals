title: 'Staatsminister Weimer verleiht den Deutschen Verlagspreis 2026 – Staatsminister
  Weimer: „Unabhängige Verlage sorgen für eine vielstimmige und lebendige demokratische
  Öffentlichkeit“'
text: 'Kulturstaatsminister Wolfram Weimer hat heute im Rahmen der 78. Frankfurter
  Buchmesse die 85 Preisträger des Deutschen Verlagspreises 2026 ausgezeichnet. Die
  Verlage „kunstanstifter - Verlag für Illustration“, „Merve“ und „Voland & Quist“
  wurden als Spitzenpreisträger ausgewählt und erhielten ein Preisgeld in Höhe von
  jeweils 50.000 Euro. Zum ersten Mal verlieh Staatsminister Weimer zusätzlich den
  mit 24.000 Euro dotierten Innovationspreis. Dieser würdigt besonders zukunftsweisende
  Verlagsarbeit und ging an den „mairisch Verlag“. Der diesjährige Nachhaltigkeitspreis,
  ebenfalls mit 24.000 Euro Preisgeld dotiert, erhielt der Verlag „Shift Books“. Weitere
  79 Verlage wurden mit einem Gütesiegel ausgezeichnet, das jeweils mit 18.000 Euro
  Preisgeld verbunden ist. Daneben können jährlich bis zu drei Verlage mit einem Jahresgesamtumsatz
  von mehr als drei Millionen Euro ein undotiertes Gütesiegel erhalten. In diesem
  Jahr ging dieses Siegel an den Verlag „Matthes & Seitz Berlin“. Insgesamt wurden
  Preisgelder in Höhe von 1,62 Millionen Euro vergeben. Staatsminister Weimer: „Unabhängige
  Verlage lassen sich auf das Wagnis des Verlegens ein: Weil sie an ihre Themen glauben,
  weil sie von ihren Autorinnen und Autoren überzeugt sind, und weil sie ungewöhnlichen
  Sichtweisen und einzigartigen literarischen Handschriften eine Leserschaft geben
  wollen. Sie sorgen dafür, dass unsere Öffentlichkeit vielstimmig, offen und wach
  bleibt. Ohne ihre Freude an Neuentdeckungen wäre unsere Diskurskultur ärmer. Und
  genau das ist es, was Demokratie braucht: den Wettstreit der Ideen, den Austausch
  der Argumente und die Auseinandersetzung mit neuen Konzepten.“ Die diesjährige Jury
  wählte die Preisträger aus insgesamt 279 Bewerbungen aus. Jörg Thadeusz, Vorsitzender
  der Jury: „Die Zusammenarbeit in der Jury war inspirierend und von großem gegenseitigem
  Respekt geprägt – getragen von einer echten Entdeckerfreude. Die kreative Bandbreite
  der eingereichten Programme bringt einen immer wieder zum Staunen und zeigt, wie
  lebendig und eigensinnig die Verlagslandschaft ist.“ Weitere Jury-Mitglieder sind
  Alexander Cammann, Isabel Fargo Cole, Ines Dettmann, Katharina Holzmann, Prof. Dr.
  Friedhelm Marx und Deniz Utlu. Partner des Deutschen Verlagspreises sind die Kurt
  Wolff Stiftung und der Börsenverein des Deutschen Buchhandels e.V. Die vollständige
  Liste der Preisträger und weitere Informationen ist hier verfügbar.'
