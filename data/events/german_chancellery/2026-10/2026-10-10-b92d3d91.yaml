title: 'Bundeskanzler Friedrich Merz erklärt zu dem von der irischen Ratspräsidentschaft
  vorgelegten Vorschlag für die anstehenden EU-Haushaltsverhandlungen:'
text: Für ein starkes und souveränes Europa brauchen wir einen grundlegend modernisierten
  und bezahlbaren Mehrjährigen Finanzrahmen. Ich danke der irischen Präsidentschaft
  für ihren unermüdlichen Einsatz in diesen schwierigen Verhandlungen. Von einer Einigung
  sind wir gleichwohl noch weit entfernt. Die Höhe des neuen Vorschlags ist keine
  Grundlage für eine Einigung. Der EU-Haushalt muss für diejenigen bezahlbar sein,
  die die Hauptlast der Finanzierung tragen. Zu den notwendigen Anpassungen müssen
  alle beitragen, denn Priorisierung und Modernisierung der Ausgaben des EU-Haushaltes
  sind eine Aufgabe für uns alle.
