title: Bundesregierung aktuell
text: 'diese Woche wurde im Rathaus von Münster der Internationale Preis des Westfälischen
  Friedens an die NATO verliehen. Ein Friedenspreis für das Militärbündnis ist Anerkennung
  für Jahrzehnte erfolgreicher Abschreckungspolitik. Die NATO ist eine Kriegsverhinderungsallianz.
  Und sie steht momentan vor ihrer größten Bewährungsprobe nach dem Kalten Krieg,
  weil der russische Aggressionsdruck überall im Bündnisgebiet spürbar ist und nur
  mit einer glaubwürdigen Abschreckungsstrategie abgewehrt werden kann. Die Botschaft
  hinter der Auszeichnung heißt also: Sicherheit ist eine wesentliche Voraussetzung
  für den Frieden. Ein freiheitliches System muss sich verteidigen können, sonst wird
  es unfrei. Mit brutaler Gewalt versucht Russland nun schon seit fast fünf Jahren,
  die Grenzen in Europa zu verändern. In der Ukraine steht deshalb auch die Sicherheit
  des restlichen Europas auf dem Spiel. Bundeskanzler Friedrich Merz hat deswegen
  in einer sehr prinzipiellen Rede zu Russland und der europäischen Friedensordnung
  klar gemacht, dass der Abwehrkampf der Ukraine auch weiterhin den europäischen und
  den deutschen Verteidigungsinteressen dient. Frieden ist also mehr als die Abwesenheit
  von Krieg, Frieden beginnt lange zuvor. Die Klarheit in diesen Aussagen ist notwendig,
  weil auch hierzulande immer wieder Zweifel an Sinn und Zweck der Ukraine-Unterstützung
  geäußert werden. Dabei wird in der Regel unterschätzt, wie verletzlich Deutschland
  ist – auch wenn es von Freunden umgeben ist. Die täglichen Hybrid-Attacken und Provokationen
  an der NATO-Ostgrenze zeugen von der Labilität. Gleichzeitig gilt: Kriege enden
  irgendwann, und in der Regel enden sie durch Politik. Die Bundesregierung bereitet
  seit Monaten gemeinsam mit den Partnern in Europa und den USA den Boden für Verhandlungen.
  Allein: Aus Moskau gibt es keine Bereitschaft, den sinnfreien Kampf einzustellen
  und den politischen Weg zu beschreiten. Der Kanzler hat auch in Münster klar gemacht:
  Wir sind bereit dazu. Unmittelbare Auswirkungen hat der Krieg auf die Energieversorgung
  und damit auch auf die Wirtschaft. Hier gibt es zwei Nachrichten der Woche: Die
  Versorgungslage mit Öl und Gas aus der Golfregion verbessert sich, auch wenn die
  Spannungen nicht unbedingt geringer werden. Am 1. Oktober trat außerdem die Senkung
  der Energiesteuer in Kraft, was sich unmittelbar an der Zapfsäule ablesen ließ.
  Dort, wo die Mineralölwirtschaft die Preise nicht anpasst, werden die Aufsichtsbehörden
  nacharbeiten. Nachricht Nummer zwei: Trotz der angespannten internationalen Lage
  haben die führenden Wirtschaftsforschungsinstitute ihre Wachstumsprognose für dieses
  Jahr von 0,6 auf 1,3 Prozent mehr als verdoppelt. Höhere Exporte und zusätzliche
  Investitionen tragen zur Erholung bei. Ein Selbstläufer ist dieser Aufschwung nicht.
  Umso wichtiger ist die Bereitschaft der Unternehmen, in Deutschland zu investieren.
  Beim Jahrestreffen der Initiative „Made for Germany“, an dem der Bundeskanzler diese
  Woche teilgenommen hat, wurde deutlich, wie groß das Vertrauen in den Standort ist.
  Inzwischen gehören der Initiative mehr als 140 Unternehmen an, die bis 2028 mehr
  als 800 Milliarden Euro investieren wollen. Mit dabei sind nicht nur große Konzerne,
  sondern auch Familienunternehmen, Mittelständler sowie Start-ups und Scale-ups.
  Eine florierende Wirtschaft braucht mehr als Kapital. Sie braucht junge Menschen
  mit guten Ideen, einer guten Ausbildung und den richtigen Chancen. Wie Schulen junge
  Menschen bestmöglich auf ihren Weg vorbereiten können, hat in dieser Woche die Verleihung
  des Deutschen Schulpreises durch die Robert-Bosch-Stiftung gezeigt. 15 Schulen waren
  für das Finale nominiert, mit ganz unterschiedlichen Konzepten, aber einem gemeinsamen
  Anspruch: Schule besser zu machen. Der Bundeskanzler würdigte besonders das Engagement
  der Lehrerinnen und Lehrer und unterstrich die Bedeutung guter Bildung für die Zukunft
  unseres Landes. Am Wochenende richtet sich der Blick auf uns selbst, auf Deutschland
  und seine Gesellschaft – und auf die Frage, was uns zusammenhält. Der 3. Oktober
  ist als Nationalfeiertag der Einheitstag und ein Tag der Zufriedenheit. Auch wenn
  die Deutschen nicht zum Selbstlob neigen: Die deutsche Einheit gehört zu den Erfolgsgeschichten
  des Landes. Möglich wurde sie durch den Mut und die Freiheitsliebe der Menschen,
  die mit der friedlichen Revolution in der ehemaligen DDR den Weg zum Ende der deutschen
  Teilung geebnet haben. Der Jahrestag erinnert uns zugleich daran, dass Demokratie,
  Freiheit und Zusammenhalt keine Selbstverständlichkeiten sind. Sie brauchen das
  Engagement von allen. „Mehr als 800 Milliarden Euro für Deutschland. Ein starkes
  Signal der Initiative Made for Germany. Hier wird in unsere Zukunft investiert.
  Wir werden die Unternehmen und ihre Mitarbeiter auf ihrem Weg unterstützen – mit
  aller Kraft für unsere Wirtschaft.“ „Olympia gehört nach Deutschland. München ist
  unser Kandidat für die Bewerbung, ganz Deutschland steht dahinter. Wir wollen die
  Olympischen und Paralympischen Spiele zu uns holen – für Gänsehaut, große Erfolge,
  unvergessliche Momente und ein ganzes Land, das mitfiebert.“ Wir freuen uns über
  Ihr Feedback: Nutzen Sie bitte dafür das Kontaktformular (nicht die Antwortfunktion
  auf diese E-Mail).'
