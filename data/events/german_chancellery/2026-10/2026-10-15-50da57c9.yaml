title: Newsletter Verbraucherschutz aktuell / Ausgabe 12
text: 'Ob digitale Kfz-Zulassung, leicht zugängliche Online-Angebote für Familien
  oder vereinfachte Baugenehmigungen: Unser aller Alltag wird einfacher und digitaler.
  Der Jahresbericht zur Staatsmodernisierung belegt zahlreiche Fortschritte bei der
  Entwicklung praxisnaher digitaler Lösungen für alle Bürgerinnen und Bürger. Über
  das EinfachMachen-Portal können Sie mitteilen, wo es im Alltag oder bei der Arbeit
  mit Formularen, Abläufen oder digitalen Angeboten hakt oder zu umständlich ist.
  Seit dem Start des Portals im Dezember 2025 wurden bereits mehr als 30.000 Meldungen
  zu konkreten Bürokratiehürden eingereicht. Bundesgesundheitsminister Carsten Linnemann:
  „Wir haben unser wichtigstes Ziel erreicht: Der durchschnittliche Zusatzbeitragssatz
  bleibt im kommenden Jahr stabil. Nach wiederholten Beitragserhöhungen ist das ein
  gutes Zeichen. Wir reden die Probleme aber nicht schön. Denn klar ist auch: Die
  Finanzlage der Krankenkassen bleibt trotz Reform angespannt. Wir müssen die strukturellen
  Probleme der gesetzlichen Krankenversicherung lösen und ihre Finanzierung dauerhaft
  auf eine solide Grundlage stellen.“ Eine funktionierende Wirtschaft und ein intakter
  Alltag der Bürgerinnen und Bürger – beides hat für die Bundesregierung höchste Priorität.
  Gleichzeitig stellen sich mit Blick auf die Kraftstoffpreise und die täglichen Nachrichten
  im Alltag viele Fragen. Die Elektromobilität boomt: Im September 2026 gab es fast
  doppelt so viele Neuzulassungen wie im Vorjahr. Doch wie gelingt die Anschaffung
  beziehungsweise der Umstieg, wenn Sie im eigenen Haus oder einem Mehrparteienhaus
  wohnen? Die Bundesregierung hat entsprechende Gesetze und Förderungen beschlossen,
  um den Weg frei zu machen. Hier finden Sie die wichtigsten Infos zu aktuellen Förderungen,
  Ihren Rechten bei einer Wallbox-Installation und zum Ausbau des Ladenetzes. Die
  Bundesregierung stellt zusätzliche Mittel für die Effizienzhaus 55-Plus-Förderung
  zur Aktivierung des Bauüberhangs bereit. Wegen der hohen Nachfrage in den vergangenen
  Monaten wäre das ursprünglich eingeplante Budget von 800 Millionen Euro voraussichtlich
  noch vor Jahresende ausgeschöpft gewesen. Seit dem Programmstart im Dezember 2025
  wurden rund 52.100 Wohneinheiten mit einem Kredit- und Zuschussvolumen von rund
  4,9 Milliarden Euro gefördert. Tanken ist durch Steuersenkung günstiger geworden,
  das Führungszeugnis kann digital ausgestellt werden und es gelten strengere Regelungen
  für die Verwendung der Industriechemikalien PFAS. Lesen Sie hier die Neuregelungen
  für Oktober 2026. Ein wesentlicher Garant für die Gesundheit junger Menschen ist
  deren aktiver Schutz in der Arbeitswelt. Das Jugendarbeitsschutzgesetz und die Kinderarbeitsschutzverordnung
  schützen Kinder und Jugendliche vor Arbeit, die zu früh beginnt, die zu lange dauert,
  die zu schwer ist, die sie gefährdet oder die für sie ungeeignet ist. Gestern fand
  das sogenannte „Apfelkabinett“ statt. Apfel- und Blütenköniginnen übergaben dem
  Bundeskanzler und den Kabinettsmitgliedern Apfelkörbe. Dies ist zu Recht eine schöne
  Tradition: Denn Deutschland liebt Äpfel. Pro Kopf werden rund 21 Kilogramm des gesunden
  Obstes pro Jahr verzehrt. Besonders der aromatische Elstar steht hoch im Kurs. Auch
  Jonagold, Gala und Braeburn sind beliebt. Und hätten Sie’s gewusst: Der Apfel ist
  eng mit der Rose verwandt. Wir feiern Deutschlands größtes Vorlesefest: Bundesweit
  lesen Menschen Kindern vor – zu Hause, in Schulen, Kitas oder digital. Machen Sie
  mit und setzen Sie ein Zeichen für die Bedeutung des Vorlesens. Bundeslandwirtschaftsminister
  Alois Rainer ist Schirmherr der diesjährigen Veranstaltung. . In diesem Jahr dreht
  sich alles um das Motto: „Ressourcen wertschätzen. Bewusst entscheiden!“ Im Mittelpunkt
  steht ein zentraler Gedanke: Der beste Abfall ist der, der gar nicht erst entsteht.
  Durch die Vermeidung von Abfällen an der Quelle lassen sich Ressourcen schützen
  und Emissionen verhindern – und so die planetaren Grenzen respektieren. Machen Sie
  mit! Vorträge, Gesprächsrunden, interaktive Ausstellungen, Kunstshows oder etwas
  völlig anderes – die Veranstaltungen im Wissenschaftsjahr 2026 bieten zahlreiche
  Möglichkeiten, mehr über die Medizin der Zukunft zu erfahren, sie mitzugestalten
  oder hautnah selbst zu erleben. Seien Sie dabei! Alle anstehenden Termine finden
  Sie hier.'
