title: Im Kabinett beschlossen Einsatz zur Stabilisierung Libyens wird fortgesetzt
text: Durch den deutschen Beitrag können Informationen zu Schleusernetzwerken gesammelt
  und weitergeleitet werden, so dass das Geschäftsmodell von Schleusernetzwerken bekämpft
  werden kann. Die Bundesregierung hat sich zum Ziel gesetzt, Libyen zu stabilisieren
  und den Wiederaufbau zu unterstützen. Seit dem 7. Mai 2020 beteiligt sich die Bundeswehr
  an der Mission EUNAVORMED ( European Naval Force Mediterranean) IRINI. Das Kabinett
  hat nun beschlossen, sich weiterhin mit bis zu 300 deutschen Soldatinnen und Soldaten
  an der EU -geführten Mission IRINI zu beteiligen – bis zum 30. November 2027. Diesem
  Beschluss muss der Bundestag noch zustimmen. Änderungen ergeben sich durch den Ratsbeschluss
  (GSVP) 2026/2243 der EU , der in erster Linie Neuerungen bei den Operationsaufgaben
  vorsieht. Die Durchsetzung des Waffenembargos der Vereinten Nationen gegen Libyen
  mittels der Inspektion von Schiffen ist nicht mehr erlaubt, da die Resolution des
  Sicherheitsrats der Vereinten Nationen 2292 (2016) zum 31. Mai 2026 ausgelaufen
  ist. Damit entfiel die völkerrechtliche Grundlage. Das Sammeln von Informationen
  über mögliche Verstöße gegen das Waffenembargo der Vereinten Nationen und deren
  Weiterleitung an die Vereinten Nationen ist weiterhin statthaft. Die weiteren bisherigen
  Aufgaben wie Beiträge zur Verhinderung der illegalen Ausfuhr von Erdöl aus Libyen
  bleiben erhalten. Außerdem dürfen Maßnahmen zur Zerschlagung des Geschäftsmodells
  von Schleuser- und Menschenhändlernetzwerken geleistet werden. Zudem dürfen libysche
  Einrichtungen unterstützt werden, die für die Strafverfolgung sowie die Suche und
  Rettung auf See zuständig sind. Erstmalig wird ein Austauschformat geschaffen, um
  die Zusammenarbeit im Bereich der maritimen Sicherheit im Mittelmeer zu ergänzen.
  Schließlich sieht der Ratsbeschluss der EU auch explizit vor, das EUNAVOR MED (
  European Naval Force Mediterranean) IRINI im Einklang mit dem Seerechtsübereinkommen
  der Vereinten Nationen sowie internationalen Regelungen gegen die sogenannte Schattenflotte
  vorgeht. Das Einsatzgebiet umfasst Meeresgebiete außerhalb der Küstenmeere Libyens
  und Tunesiens, südlich Siziliens sowie innerhalb der Region des mittleren und südlichen
  Mittelmeers, deren Luftraum und angrenzende Seegebiete. Seit der Revolution vom
  17. Januar 2011 unterstützt die Bundesregierung das Land beim Übergang zur Demokratie.
  Libyen stand nach dem Sturz des Gaddafi-Regimes vor einem Neuanfang. Die politische
  Lage in Libyen bleibt bestimmt von einem stockenden politischen Übergangsprozess,
  vom Konflikt konkurrierender Lager und zunehmend geteilter Institutionen in Ost
  und West. Der Westen wird durch das Government of National Unity (GNU) unter Premierminister
  Abdel Hamid Dbeiba und der Osten durch die Libysche Nationalarmee (LNA) unter General
  Khalifa Haftar dominiert. Seit dem Ende des Bürgerkriegs 2020 ist es nicht gelungen,
  im Land Präsidentschafts- und Parlamentswahlen durchzuführen. Seitdem 2020 ein Waffenstillstand
  vereinbart wurde, konnten politische Fortschritte erzielt werden. Dennoch ist die
  Lage instabil. Der Einsatz bleibt erforderlich, um Stabilität und Frieden zu ermöglichen.
  Das breite Engagement der Bundesregierung in Libyen umfasst humanitäre, stabilisierende
  und entwicklungspolitische Maßnahmen, die auf einem langfristigen und umfassenden
  Ansatz basieren. Die Bundesregierung vermittelt zwischen den internationalen Akteuren
  und unterstützt den innerlybischen Prozess, der durch die Vereinten Nationen geleitet
  wird. Ziel der Bundesregierung ist es, auf lokaler Ebene tiefergehende Konflikte
  zu lösen, staatliche Strukturen zu stärken und die Versorgung der Bevölkerung auf
  kommunaler Ebene zu verbessern. Dazu soll die gesellschaftliche Teilhabe von Frauen
  und Jugendlichen gestärkt und die Gesundheitsversorgung verbessert werden. Zudem
  sollen die Wahlbehörden und die libysche Zivilgesellschaft auf lokaler und nationaler
  Ebene unterstützt werden, um die Grundlagen für die Bildung eines demokratisch legitimierten
  Staats zu schaffen. Zudem setzt sich die Bundesregierung für eine Zusammenarbeit
  zwischen EU und NATO von der Operation EUNAVFOR MED IRINI mit der maritimen Sicherheitsoperation
  SEA GUARDIAN der NATO ein.
