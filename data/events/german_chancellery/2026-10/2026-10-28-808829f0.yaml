title: 'Pressekonferenz von Kanzler Merz und Japans Ministerpräsidentin Takaichi Deutschland
  und Japan: Freiheit, Sicherheit und Wohlstand gemeinsam stärken'
text: 'Deutschland und Japan wollen bei künstlicher Intelligenz, Halbleitern, 6G und
  Fusionsenergie enger zusammenarbeiten. An der „Schwelle zu einer neuen Zeit“ würden
  internationale Regeln zunehmend unter Druck geraten, während Großmächte eine neue
  Politik betreiben würden, sagte Bundeskanzler Friedrich Merz in einer Pressekonferenz
  nach dem Treffen mit Japans Ministerpräsidentin Sanae Takaichi am Mittwoch in Tokio.
  Deshalb müssten wehrhafte Demokratien, wie Japan und Deutschland, in einer von Unsicherheit
  geprägten Welt gemeinsam „ihre Freiheit, ihre Sicherheit und ihren Wohlstand kraftvoll
  behaupten“. Trotz der geografischen Distanz seien Deutschland und Japan enge Partner.
  Die Zusammenarbeit biete beiden Ländern die große Chance, kritische Abhängigkeiten
  durch De-risking und Diversifizierung zu verringern, so Merz. Vor dem Gespräch mit
  Takaichi hatte Bundeskanzler Merz bereits am German-Japanese Business Summit in
  Tokio teilgenommen. Vor hochrangigen Wirtschaftsvertretern warb Merz für ein aktives
  De-Risking durch faire Rohstoff- und Technologieallianzen. Neben der Einladung Japans
  zur European Future of AI Initiative setzte der Kanzler einen handelspolitischen
  Akzent: Er schlug die Gründung einer globalen politischen Allianz für regelgebundenen
  Handel vor. Zudem forderte er, bilaterale Abkommen enger miteinander zu verzahnen,
  um durch ein großes interregionales Handelsabkommen die Realitäten global vernetzter
  Lieferketten abzusichern. Bundeskanzler Merz in Asien : Mit seiner Reise nach Singapur
  , Japan und in die Republik Korea (Südkorea) vom 26. bis 30. Oktober möchte Bundeskanzler
  Merz die gute Zusammenarbeit mit diesen wichtigen Partnern im Indo-Pazifik weiter
  ausbauen. In Singapur traf der Bundeskanzler Premier Wong und Präsident Shanmugaratnam,
  hielt darüber hinaus eine Rede im Rahmen der Singapore Lecture . Am Tag darauf nahm
  er in Tokio am German-Japanese Business Summit teil und traf Ministerpräsidentin
  Takaichi. Zum Abschluss der Reise besucht der Kanzler die südkoreanische Hauptstadt
  Seoul. Die Protokollierung des fremdsprachlichen Teils erfolgte anhand der Simultandolmetschung.
  Im Namen der japanischen Regierung und der japanischen Bevölkerung heiße ich Herrn
  Bundeskanzler zu seinem Besuch in Japan herzlich willkommen. Angesichts der zunehmend
  angespannten internationalen Lage ist die Zusammenarbeit zwischen Japan und Deutschland,
  zwei gleichgesinnten Ländern, die den festen Willen teilen, gemeinsam zum Frieden
  und zur Stabilität in der internationalen Gemeinschaft beizutragen, wichtiger denn
  je. Ich freue mich sehr, dass unsere beiden Länder, die als gleichgesinnte Partner
  gemeinsame Werte und Prinzipien teilen, heute als Premiumpartner der Welt ihre unerschütterliche
  Verbundenheit demonstrieren. In dem Gespräch mit Bundeskanzler Merz, das soeben
  stattgefunden hat, haben wir uns darauf verständigt, die strategische Zusammenarbeit
  in einer Vielzahl von Bereichen weiter zu verstärken. Die drei Dokumente, die im
  Anschluss veröffentlicht werden, die gemeinsame Erklärung der Regierungschefs Deutschlands
  und Japans sowie die deutsch-japanische gemeinsame Erklärung zu den Bereichen der
  Spitzentechnologie und der Wirtschaftssicherheit sind Ausdruck dieser Entschlossenheit.
  Im Bereich der Sicherheit haben wir diesmal erneut unsere gemeinsame Auffassung
  bekräftigt, dass die Sicherheit im euroatlantischen Raum und die Sicherheit im Indopazifik
  untrennbar miteinander verbunden sind. Auch Japan begrüßt das anhaltende aktive
  Engagement Deutschlands im indopazifischen Raum. Wir werden Möglichkeiten und Rahmenbedingungen
  prüfen, die zur Vertiefung der Zusammenarbeit zwischen den Streitkräften beider
  Länder beitragen. Zudem werden wir die Zusammenarbeit im Bereich der Verteidigungsindustrie
  fördern, in dem sich die jeweiligen Stärken ergänzen lassen. Im Bereich der Industrietechnologie
  ist eine Zusammenarbeit zwischen Japan und Deutschland von großer Bedeutung. Als
  Nationen der Industrietechnologie nehmen beide Länder auf der Grundlage des ihnen
  gemeinsamen Geistes der Fertigung eine führende Rolle in Asien und Europa ein. Wir
  haben uns darauf geeinigt, die Zusammenarbeit zwischen dem öffentlichen und dem
  privaten Sektor in den Bereichen der Spitzentechnologie einschließlich der Fusions-
  und Wasserstofftechnologie zu fördern und konkrete Kooperationsmaßnahmen voranzutreiben.
  Hinsichtlich der Zusammenarbeit im Bereich der KI einigten wir uns insbesondere
  auf die Einrichtung eines japanisch-deutschen hochrangigen Dialogs zur KI sowie
  auf eine Zusammenarbeit bei der Ausrichtung eines KI -Gipfels in Japan. In Anwesenheit
  zahlreicher Vertreter führender Unternehmen beider Länder wurden heute darüber hinaus
  rund 30 Kooperationsvereinbarungen sowohl auf staatlicher als auch auf privater
  Ebene unterzeichnet. Wir hoffen, dass diese Zusammenarbeit mit der von Japan vorangetriebenen
  Wachstumsstrategie in Einklang steht und das Wirtschaftswachstum in beiden Ländern
  weiter ankurbelt. Um diese hochentwickelte technologische Kompetenz und Wissenschaftskraft
  zu bewahren, zu fördern und weiter auszubauen, ist eine Zusammenarbeit im Bereich
  der wirtschaftlichen Sicherheit unerlässlich. Japan und Deutschland ergänzen einander
  auf [unverständlich] Weise. Beide Länder verbindet eine enge Partnerschaft, die
  auf gemeinsamen Werten und Interessen beruht. Diese sind für die Wahrung einer regelbasierten,
  freien, offen und fairen internationalen Wirtschaftsordnung wichtig. Wir haben gemeinsam
  mit dem Bundeskanzler bekräftigt, wie wichtig es ist, dass bei Maßnahmen zur Industrieförderung
  in strategischen Bereichen die Interessen beider Seiten auf der Grundlage der Gegenseitigkeit
  berücksichtigt werden. Zur Schaffung einer robusten und zuverlässigen Lieferkette
  werden beide Länder die Diversifizierung der Bezugsquellen für kritische Mineralien
  sowie die Erschließung alternativer Bezugsquellen vorantreiben und sich zudem für
  einen Schutz wichtiger Technologien einsetzen. Auch hinsichtlich regionaler und
  internationaler Herausforderungen wie der Lage im indopazifischen Raum und der Lage
  in der Ukraine haben wir unsere enge Zusammenarbeit bekräftigt. Japan und Deutschland
  werden als unersetzliche Premiumpartner gemeinsam wachsen und zur Lösung der Herausforderungen
  beitragen, mit denen die internationale Gemeinschaft konfrontiert ist. Frau Ministerpräsidentin,
  liebe Frau Takaichi, herzlichen Dank für die großartige Gastfreundschaft und die
  Einladung, heute nach Tokyo zu kommen. Ich freue mich sehr, dass ich heute das erste
  Mal in meiner Eigenschaft als Bundeskanzler in dieser Stadt und in diesem Land bin.
  Japan ist für Deutschland, wie wir alle wissen ein Freund, ein enger Partner von
  besonderer Bedeutung. Ich will es trotz der großen geografischen Distanz sagen:
  Japan und Deutschland sind Nachbarn. Wir stehen an der Schwelle zu einer neuen Zeit.
  Diese Zeit erfordert von uns Maßnahmen. Wir stehen vor Herausforderungen, die sich
  sehr ähnlich sind. Wir erleben, wie die Großmächte eine neue Politik betreiben,
  wie internationale Regeln erodieren. Wir erleben atemberaubende, neue Technologien,
  die unser Leben verändern. All das ist zusammen eine neue Zeit. Wir entwickeln Antworten
  darauf. Darin liegt auch eine große Chance für unsere gemeinsamen Beziehungen. Denn
  wir knüpfen zusammen ein Netz globaler Partnerschaften. Für Deutschland nimmt Japan
  als enger Freund, als wahrer Premiumpartner eine Schlüsselrolle ein. Wir teilen
  grundlegende Interessen, und wir teilen auch Werte miteinander, denn wir haben begriffen:
  Gemeinsam können wir eine Welt gestalten, die nicht nur den Größten und den Stärksten
  Raum gibt. Ja, es liegen rund 9000 Kilometer zwischen unseren Ländern, und doch
  sind wir einander sehr nahe. Japan und Deutschland sind wehrhafte Demokratien, die
  ihre Freiheit, ihre Sicherheit und ihren Wohlstand kraftvoll behaupten. Wir sind
  Befürworter und Verfechter einer internationalen Ordnung, die auf Rechte und auf
  Regeln setzt. Wir wollen und wir brauchen freien und fairen Handel. Unsere Volkswirtschaften
  gehören zu den größten der Welt. Unsere Wissenschaftler forschen zum Teil gemeinsam
  an den Technologien von morgen. Wir sind einander und unseren Nachbarn in Asien
  wie in Europa verlässliche, starke Partner. Wir stehen dabei vor ähnlichen Herausforderungen
  – lassen Sie mich einige von denen kurz nennen. Wir erleben, erstens, mit dem russischen
  Angriffskrieg gegen die Ukraine, dass die internationale Friedensordnung herausgefordert
  ist wie lange nicht, und das geht auch Asien an. Sie haben es in unserem ersten
  Gespräch, Frau Ministerpräsidentin, gesagt: Russland ist ja auch Ihr Nachbar. –
  Deswegen gilt: Wenn Großmächte imperiale, revisionistische Kriege führen dürfen,
  dann nehmen alle anderen Nationen Schaden. In Tokyo hat man das verstanden, so weit
  weg die Ukraine geografisch auch liegen mag. Für Japans andauernde und substanzielle
  Unterstützung der Ukraine danke ich Ihnen. Dafür dankt Ihnen ganz Europa. Zum Zweiten:
  Im Indopazifik blicken wir mit Sorge auf zunehmende Spannungen. In besonderer Weise
  gilt das für die Straße von Taiwan. Auch hier gilt das Gewaltverbot der Charta der
  Vereinten Nationen. Es ist von größter Wichtigkeit, dass alle Seiten hier mit größter
  Umsicht handeln. Deutschland wird an seiner Ein-China-Politik festhalten, aber wie
  wir sie gestalten, das entscheiden wir. Zum Dritten: Das Thema der Wirtschaftssicherheit
  hat in den letzten Jahren stark an Bedeutung gewonnen. Japan, die Europäische Union
  und auch Deutschland, wir haben gelernt: Wir müssen einseitige Abhängigkeiten vermindern,
  ob in unseren Lieferketten oder mit dem Blick auf Rohstoffe. Hierbei wird uns ein
  neues Netz von Partnern helfen. „ Derisking “, Diversifizierung und die Stärkung
  unserer Resilienz, das sind die Gebote der Stunde. Für Japans und Deutschlands Partnerschaft
  liegt hierhin eine große Chance. Getreu dem japanischen Sprichwort „Gemeinsam kommen
  wir auf bessere Ideen“ haben wir heute ein Paket von Vorhaben beschlossen – Sie
  haben darauf hingewiesen –, um unsere Partnerschaft auszubauen. Wir werden unsere
  sicherheitspolitische Zusammenarbeit vertiefen. Ein Beispiel nur: Es sind mehr als
  100 deutsche Soldaten in diesem Monat an der Übung „ Keen Sword“ im Pazifik beteiligt.
  Das trägt zu Vertrauen und zur Interoperabilität bei. Unser Einsatz ist in keiner
  Weise aggressiv. Er sendet das Signal, dass Japan und Deutschland gemeinsam für
  Sicherheit und Wohlstand einstehen, in Europa wie im Indopazifik. Wir werden auch
  unsere Rüstungskooperation verstärken, zum Beispiel durch gemeinsame Entwicklungen
  für eine innovative Verteidigung der Zukunft. In diesem Zusammenhang wollen wir
  auch ausloten, ob eine Zusammenarbeit im Kampfflugzeugbau möglich ist. Ein entsprechender
  Prüfauftrag ist vorbereitet. Wir haben schließlich eine Erklärung zur Wirtschaftssicherheit
  unterzeichnet, und wir werden gemeinsam kritische Abhängigkeiten reduzieren. Auch
  unsere heutige Erklärung bezüglich kritischer Rohstoffe ist ein wichtiger Ausgangspunkt
  zur Stärkung unserer Rohstoffwertschöpfungsketten. Aber unsere Partnerschaft dient
  nicht nur der Abwehr von Krisen. Deutschland und Japan arbeiten bei strategischen
  Projekten zusammen. Hiermit bauen wir gemeinsam an einer gemeinsamen Zukunft. Wir
  haben einen KI -Dialog beschlossen; Sie haben darauf hingewiesen. Japan und Deutschland
  stehen gemeinsam für menschenzentrierte und wertebasierte KI -Entwicklung, auch
  in Fragen der Nutzung und Regulierung. Schließlich bekräftigen wir in unserer gemeinsamen
  Erklärung zur Hochtechnologiekooperation den verstärkten Austausch über Halbleiter,
  6G-Mobilfunknetze und die Fusionsenergie. Zum Teil findet sich dies bereits in den
  geplanten Unternehmenskooperationen wieder. Mit mehr als 20 Vereinbarungen in den
  Feldern der Zukunftstechnologie, der Energie, der Infrastruktur und der Rüstung
  setzen unsere Unternehmen auf Innovation – Innovation, die wir gemeinsam vorantreiben.
  Meine Damen und Herren, es gibt viel, worauf wir aufbauen können. Umso mehr freue
  ich mich, dass Sie, liebe Frau Ministerpräsidentin, Frau Takaichi, 2027 zu Regierungskonsultationen
  in Berlin sein werden. Das zeigt: Unsere Partnerschaft ist mit hohem Tempo auf gutem
  Kurs. Ich will es nicht unerwähnt lassen: Japan wird Partnerland der Hannover Messe
  2028 sein. Wir werden also jetzt in einem sehr engen zeitlichen Rhythmus auch unsere
  Zusammenarbeit vertiefen. Ich bin sehr dankbar, dass wir dies gemeinsam so sehen
  und dass wir dies gemeinsam auf den Weg bringen.'
