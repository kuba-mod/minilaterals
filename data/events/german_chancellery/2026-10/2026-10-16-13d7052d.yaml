title: Teilnahme von Bundeskanzler Merz am Berlin Prozess-Gipfel am 22. Oktober 2026
  in Montenegro
text: Bundeskanzler Friedrich Merz wird am Donnerstag, den 22. Oktober 2026, am Berlin
  Prozess-Gipfeltreffen in Montenegro teilnehmen. Der diesjährige Gipfel trägt den
  Titel „Region in Motion – Owning the change“. Inhaltliche Schwerpunkte des Treffens
  werden u.a. Wirtschaftswachstum, Wettbewerbsfähigkeit und Sicherheit sein. Neben
  der Förderung regionaler Kooperation zwischen den Westbalkanstaaten dient das Treffen
  vor allem auch deren Annäherungsprozess an die EU.
