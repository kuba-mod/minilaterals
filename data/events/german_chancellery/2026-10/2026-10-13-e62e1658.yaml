title: Austausch von Bundeskanzler Friedrich Merz mit Vertretern des American Jewish
  Committee (AJC) am 13. Oktober 2026
text: Bundeskanzler Friedrich Merz hat heute eine hochrangige Delegation des American
  Jewish Committee (AJC) aus den USA im Bundeskanzleramt empfangen. Die Delegation
  leitete AJC-Präsident Robert E Lapin. Der Bundeskanzler und die Vertreterinnen und
  Vertreter des American Jewish Committee sprachen unter anderem über Maßnahmen zur
  Bekämpfung des Antisemitismus und zur Stärkung jüdischen Lebens sowie über den Stand
  der transatlantischen Beziehungen. Kurz nach dem dritten Jahrestag der Terror-Angriffe
  der Hamas auf Israel am 7. Oktober 2023 tauschten sich der Bundeskanzler und die
  Delegation des American Jewish Committee außerdem über die Auswirkungen dieser Angriffe
  auf die jüdische Gemeinschaft in Deutschland und weltweit aus. Der Bundeskanzler
  betonte, dass die Bundesregierung sich weiter mit aller Macht dafür einsetzen werde,
  dass Jüdinnen und Juden sicher und geschützt in Deutschland leben können.
