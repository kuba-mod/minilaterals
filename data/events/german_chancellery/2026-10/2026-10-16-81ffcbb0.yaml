title: Bundeskanzler Merz empfängt den Staatspräsidenten der Mongolei, Khurelsukh
text: Bundeskanzler Friedrich Merz wird am 21. Oktober 2026 um 13:00 Uhr den Staatspräsidenten
  der Mongolei, Khurelsukh Ukhnaa, im Bundeskanzleramt empfangen. Bei einem gemeinsamen
  Gespräch im Rahmen eines Mittagessens werden die bilateralen Beziehungen, wirtschaftspolitische
  Fragen und die internationale Sicherheitspolitik im Mittelpunkt stehen.
