date: '2026-10-30'
type: press_release
source_name: german_chancellery
title: Pressestatement von Bundeskanzler Merz im Forschungszentrum für Quanten-Nanowissenschaft
  an der Ewha Womans University in Seoul Gemeinsame Sicherheitsinteressen und Schutz
  des freien Handels
text: 'Ewha Womans University in Seoul: Hier hat Kanzler Merz sich über Quanten-Nanowissenschaften
  informiert und ein Resümee seiner Asienreise gezogen. Bundeskanzler Friedrich Merz
  hat sich in einem Statement zum Abschluss seiner Reise nach Singapur, Japan und
  Südkorea am Freitag zufrieden gezeigt. Die bereiste Region sei für 40 Prozent des
  Welthandels verantwortlich, zudem seien 60 Prozent der weltweit führenden Innovationsunternehmen
  dort ansässig. Deshalb sei die Region für Deutschland von „größter strategischer
  Bedeutung“, betonte der Kanzler nach einem Besuch im Forschungszentrum für Quantennanowissenschaft
  an der Ewha Womans University in Seoul. Deutschland werde in der Region als ein
  „ganz wichtiger Partner“ angesehen. „Ich hoffe, dass wir den Erwartungen entsprechen
  können, diese Zusammenarbeit zu vertiefen. An mir wird es jedenfalls nicht scheitern.
  Wir werden es tun“, unterstrich Merz. Meine Damen und Herren, wir stehen am Ende
  einer fünftägigen Reise nach Singapur, Japan und Korea. Ich kann sagen, es hat sich
  in mehrfacher Hinsicht gelohnt. Ich hatte eine große Wirtschaftsdelegation dabei,
  deren Mitglieder nach meinem Eindruck mit den neuen Möglichkeiten, die sie in der
  Region für ihre Unternehmen finden, sehr zufrieden sind. Ich kann aber auch sagen,
  dass es sich im Sinne der Partnerschaften, die wir mit diesen Ländern haben, gelohnt
  hat. Wir sind mittelgroße Länder, aber wir haben ein übereinstimmendes Interesse
  daran, eine regelbasierte globale Handelsordnung aufrechtzuerhalten. Wir vertiefen
  den Handel mit diesen Ländern. Wir verabreden, dass wir die Regeln einhalten, bis
  hin zur gemeinsamen Verpflichtung, die Welthandelsorganisation zu schützen. Wir
  haben gemeinsame Sicherheitsinteressen. Das kommt in vielerlei Hinsicht zum Ausdruck.
  Der Krieg Russlands gegen die Ukraine ist auch hier in der Region allgegenwärtig.
  Insofern sind es drei Länder, für die Deutschland ein hohes Interesse haben muss.
  Ich begrüße ausdrücklich, dass die Wirtschaftsdelegation so intensiv mit dabei war
  und vielfältige neue Wirtschaftskontakte gesucht hat, bis hin zu der Universität
  hier. Auch die Zusammenarbeit in der Wissenschaft zwischen Korea und Deutschland,
  Japan und Deutschland sowie Singapur und Deutschland ist intensiv. Diese Region
  ist für uns von größter strategischer Bedeutung. 40 Prozent des Welthandels finden
  in dieser Region statt. 60 Prozent der großen innovativen Unternehmen sind in dieser
  Region. Das heißt, Deutschland ist gut beraten, in Südostasien Interesse zu zeigen.
  Ich habe das getan. Die Rückmeldungen, die ich bekomme, auch von meinen Gesprächspartnern,
  sind so positiv, dass ich mich sehr ermutigt fühle, mit dem Kabinett darüber zu
  sprechen, mit der Wirtschaftsministerin, mit dem Forschungsministerium, mit vielen
  anderen Institutionen, was wir tun können, um die Zusammenarbeit mit Südostasien
  noch weiter zu vertiefen. Deutschland wird hier in der Region als ein ganz wichtiger
  Partner angesehen. Ich hoffe, dass wir den Erwartungen entsprechen können, diese
  Zusammenarbeit zu vertiefen. An mir wird es jedenfalls nicht scheitern. Wir werden
  es tun. Frage: Herr Bundeskanzler, gestern hat es einen Raketentest Nordkoreas gegeben.
  Für wie bedrohlich halten Sie die Lage hier in der Region? Da die Ukraine in allen
  drei Ländern, die Sie besucht haben, ein Thema war: Welche Unterstützungszusagen
  nehmen Sie jetzt mit? Konkret gefragt: Gehen Sie davon aus, dass Japan Patriot -Raketen
  an die Ukraine liefert, gegebenenfalls über ein Drittland? Bundeskanzler Friedrich
  Merz: Ich hatte heute Gelegenheit, direkt an der Grenze zwischen Nordkorea und Südkorea
  zu sein. Es war sogar so, dass wir mit den Füßen praktisch schon auf dem nordkoreanischen
  Territorium standen, weil es dort ein Gebäude gibt, das genau auf der Grenze steht.
  Wenn man sieht, wie diese Grenze geschützt werden muss, wenn man auch über die Aufrüstung
  informiert wird, die in Nordkorea stattfindet, die tägliche Bedrohung dieses Landes
  durch Nordkorea, wenn man sieht, dass Nordkorea ein Land ist, das diese Aufrüstung
  ohne die Unterstützung durch die Volksrepublik China gar nicht leisten könnte, wenn
  man sieht, dass China wiederum Russland im Krieg gegen die Ukraine unterstützt,
  dann versteht man, wie ein Land wie Südkorea an der Grenze zu Nordkorea von allen
  diesen Konflikten, von diesem Krieg, mittelbar und unmittelbar betroffen ist. Das
  heißt, es gibt keine singuläre Sicherheit mehr auf der Welt, sondern es gibt nur
  noch kollektive Sicherheit. Deswegen ist es wichtig, dass wir mit den Ländern, die
  ich besucht habe, mit Singapur, mit Japan und mit Korea, auch in sicherheitspolitischen
  Fragen eng zusammenarbeiten. Wir werden auch in der Verteidigungsindustrie eng zusammenarbeiten.
  Ich habe auch in allen drei Ländern Gespräche über die weitere Unterstützung der
  Ukraine geführt. Das ist in den Ländern unterschiedlich ausgeprägt; es ist auch
  vom Tatsächlichen her unterschiedlich ausgeprägt. Aber der gute Wille, zu helfen
  und vor allem alles zu tun, um diesen Krieg zu einem Ende zu bringen, ist überall
  sehr intensiv vorgetragen worden. Ich nehme das als eine Unterstützung auch in der
  Koalition der Willigen mit, zu der ich für die übernächste Woche nach Berlin eingeladen
  habe. Wir werden in unserem Engagement für die Ukraine nicht nachlassen. Die Frage,
  ob weitere Luftabwehr geliefert werden kann, diskutieren wir zurzeit mit sehr vielen
  Ländern auf der Welt. Wir müssen der Ukraine mehr Möglichkeiten geben. Wir diskutieren
  auch über viele Details. Ich bitte um Nachsicht, dass wir dies nicht öffentlich
  tun, sondern in der gebotenen Diskretion mit den Ländern, die noch liefern können.
  Aber wir haben auf der ganzen Welt echte Lieferschwierigkeiten. Deswegen sind wir
  so sehr darum bemüht, die Potenziale, die wir zurzeit haben, wirklich auszuschöpfen.
  Frage: Herr Bundeskanzler, in der Vergangenheit haben häufig auch deutsche Unternehmen
  gesagt: Politik soll sich möglichst weitgehend heraushalten. Wir machen das global.
  Jetzt sehen wir in China und den USA , dass eine sehr starke Verflechtung zwischen
  Politik und Wirtschaft da ist. Kann man global nur noch dann erfolgreich sein, wenn
  auch in Deutschland wieder eine stärkere Zusammenarbeit zwischen Politik und Wirtschaft
  da ist? Bundeskanzler Merz: Ich denke, dass wir heute in einer Zeit leben, in der
  es wichtig ist, dass die Politik und die Wirtschaft die Chancen, die sich ergeben,
  auch gemeinsam identifizieren und dann wahrnehmen, mit der dann aber auch getrennten
  Verantwortung, sie auszufüllen, sie zu nutzen. Geschäftsmodelle zu entwickeln, ist
  die Aufgabe der Wirtschaft, nicht die Aufgabe der Politik. Aber wir müssen gute
  Rahmenbedingungen liefern, und Sie wissen von mir, dass ich schon seit vielen Jahren
  ein Befürworter der Handelspolitik der Europäischen Union bin. Wir haben Handelsabkommen
  mit vielen Ländern, und mit Korea haben wir übrigens seit 15 Jahren ein Handelsabkommen,
  das in den 15 Jahren den Handel mit Korea und Europa verfünffacht hat. Man sieht
  also an diesen Beispielen, dass solche Handelsabkommen wirklich Wirkung erzielen
  können. Wir sprechen über künstliche Intelligenz. Dafür müssen wir die Rahmenbedingungen
  setzen. Dafür müssen wir Forschungsinstitute haben. Dafür müssen wir Grundlagenforschung
  leisten. Das tut eine solche Universität hier. Das kann man also nicht voneinander
  trennen, schon gar nicht künstlich voneinander trennen. Wir haben unsere getrennten
  Verantwortungen in der Wirtschaft und in der Politik, aber wir müssen auch dafür
  sorgen, dass die Wirtschaft Rahmenbedingungen vorfindet, die sie erfolgreich macht.
  Nur eine erfolgreiche Wirtschaft ermöglicht ein wohlhabendes Land. Deswegen reden
  wir hier natürlich auch über Arbeitsplätze der Zukunft. Gerade künstliche Intelligenz
  wird die Arbeitswelt der Zukunft massiv verändern, und ich habe ein hohes Interesse
  daran, dass Deutschland auch technologisch an der Spitze dieser Entwicklung steht.
  Bundeskanzler Merz: Ich will nicht über den Ausgang der Kongresswahlen in den USA
  in der nächsten Woche spekulieren. Ganz unabhängig vom Ausgang dieser Wahlen wird
  es so bleiben, dass die Vereinigten Staaten von Amerika ihre Außenpolitik ändern,
  ihre Außenwirtschaftspolitik ändern, ihre Interessen neu definieren, und wenn sie
  das tun, dann müssen wir das auch tun. Genau das ist der Grund, warum ich diese
  intensiven Gespräche führe, und der Grund, warum wir ein Handelsabkommen mit Indien
  abgeschlossen haben, nämlich weil ich versuche, die Handelsbeziehungen zu diesen
  Ländern, die ich jetzt in dieser Woche besucht habe, zu intensivieren. Wir wissen
  auch, dass wir in der Verteidigungspolitik alle zusammen mehr für internationale
  Sicherheit tun müssen, jedes Land für sich, aber auch gemeinsam. Dabei kommt auch
  Deutschland eine wichtige Aufgabe zu, denn wir sind das bevölkerungsreichste Land
  in Europa, das wirtschaftlich stärkste Land. Wir haben in der Europäischen Union
  eine Gesamtverantwortung. Diese Länder schauen auf Europa und sehen Europa als einen
  wichtigen strategischen Partner in vielerlei Hinsicht an, militärisch, politisch,
  wirtschaftlich. Das ist in vielerlei Hinsicht eine vergleichbare Situation, übrigens
  auch in Bezug auf alternde Bevölkerungen, die wir in Asien auch sehen. Wir sollten
  hier also wirklich alle Angebote der Zusammenarbeit annehmen. Es ist zu unserem
  gegenseitigen Nutzen. Frage: Ich möchte noch einmal auf das Thema Iran zu sprechen
  kommen. Wenn es so sein sollte, dass da die nächste Runde startet, was US -Angriffe
  auf den Iran angeht, wie vorbereitet ist Europa auf dieses Szenario? Bundeskanzler
  Merz: Wir sind ja auf vielen Kanälen dabei, unsere diplomatischen Anstrengungen
  zu koordinieren, zu verstärken, damit dieser Konflikt möglichst bald ein Ende findet.
  Er hat massive Auswirkungen auf Europa. Wir haben durch diesen Konflikt mittlerweile
  Kosten, allein durch die Verteuerung der Energie, die alleine für Europa bei mehr
  als 100 Milliarden Euro in den letzten acht Monaten liegen. Mehr als 100 Milliarden
  Euro haben die Unternehmen, haben die Verbraucher in Europa mehr bezahlt, weil die
  Energie durch diesen Konflikt teurer geworden ist. Deswegen haben wir auch ein wirtschaftliches
  Interesse daran, dass dieser Konflikt so schnell wie möglich beendet wird. Ich kann
  nur an alle Konfliktparteien appellieren: Dieser Konflikt lässt sich nicht militärisch
  lösen. Er muss diplomatisch gelöst werden, er muss durch Gespräche gelöst werden.
  Das gilt auch für Israel und eine wiedergewählte oder möglicherweise neue Regierung.
  Dieser Konflikt lässt sich militärisch nicht lösen. Wenn wir Hilfestellung leisten
  können, dann tun wir das. Sie wissen, dass wir in die Region sehr viele gute Beziehungen
  haben, dass wir zu den Golfstaaten gute Beziehungen unterhalten, dass wir zu Israel
  selbstverständlich gute Beziehungen unterhalten. Wir sprechen mit diesen Ländern
  und hoffen und appellieren auch daran, diesen Konflikt friedlich zu lösen. Frage:
  Die drei Länder hier haben alle große Sorgen, dass sich die EU mit den Initiativen
  „ Made in Europe “ bzw. „ Made with Europe “ erneut abschottet. Haben Sie diese
  Sorgen hier ausräumen können, und was haben Sie gerade Japan und Korea als großen
  Exportländern zugesagt? Bundeskanzler Merz: Ja, Herr Kollege, das war in der Tat
  ein Thema, das auch mich in der Intensität, in der es vorgetragen worden ist, etwas
  überrascht hat. Dieser sogenannte Industrial Accelerator Act der Europäischen Union,
  der darauf ausgerichtet ist, zunächst einmal die Beschaffung auf dem Automobilmarkt
  durch die öffentliche Hand auf Europa zu konzentrieren, hat erhebliche Sorgen in
  der Region ausgelöst – in Singapur, in Japan, in Korea –, dass wir möglicherweise
  vor einer neuen Welle des Protektionismus in Europa stehen, dass wir uns gegenüber
  anderen Ländern abschotten. Ich habe überall widersprochen und habe versucht, auch
  diese Bedenken zu zerstreuen. Ich will das nicht. Wir müssen offenbleiben. Wir müssen
  Wettbewerb haben. Wir müssen den europäischen Markt auch für Wettbewerber aus anderen
  Ländern offenhalten. Nur dann können wir auch mit unseren Produkten auf diesen Märkten
  Erfolg haben. Insofern nehme ich die Sorgen sehr ernst. Ich nehme sie nicht nur
  nach Berlin mit, sondern auch nach Brüssel, und ich werde natürlich beim nächsten
  Europäischen Rat ansprechen, dass ich diese Sorgen hier sehr intensiv vorgetragen
  bekommen habe. Ich nehme das ernst, und ich nehme es mit.'
