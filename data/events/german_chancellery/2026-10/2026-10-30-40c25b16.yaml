title: Im Wortlaut Pressestatement von Bundeskanzler Merz in der Demilitarisierten
  Zone in Camp Bonifas beim Besuch des Bundeskanzlers in der Republik Korea am 30.
  Oktober 2026
text: Meine Damen und Herren, herzlich willkommen! Wir sind hier wenige hundert Meter
  von der Grenze zu Nordkorea entfernt ‑ eine demilitarisierte Zone, die von einer
  UN-Mission unter der Führung des amerikanischen Generals Brunson und auch unter
  Beteiligung von zwei deutschen Soldaten überwacht wird, um sicherzustellen, dass
  dieser kritische Punkt friedlich bleibt und dass es hier an der Grenze zu Nordkorea
  nicht zu Zwischenfällen kommt. Während meines Besuches in Seoul bin ich sehr häufig
  auf die Erfahrungen angesprochen worden, die wir mit einem geteilten Land und einer
  Wiedervereinigung gemacht haben. Man merkt auch hier an diesem Ort, wie sehr ein
  solches Land unter einer Teilung leidet und wie sehr auch der Wunsch besteht ‑ jedenfalls
  in diesem Teil der koreanischen Halbinsel ‑, wiedervereint zu werden. Bis es soweit
  ist, wird eine militärische Sicherung der Grenze notwendig bleiben. Dass zwei deutsche
  Soldaten daran beteiligt sind, zeigt, dass Sicherheit auf der Welt nicht mehr teilbar
  ist, sondern wir sie überall gewährleisten müssen. Deswegen auch danke an die Bundeswehr,
  danke an die beiden deutschen Soldaten, die hier in einem großen internationalen
  Kontingent ihren Dienst tun. Wir konnten auch die Grenzanlagen besichtigen, und
  es ist eindrucksvoll zu sehen, wie dieser Ort gesichert wird. Es ist aber eben auch
  ein geteiltes Land. Mir gehen in diesem Augenblick Gedanken durch den Kopf, wie
  dankbar wir sein dürfen, dass wir eine solche Teilung in Deutschland seit 36 Jahren
  nicht mehr erleben müssen. In diesem Land ist das aber noch so. Wollen wir hoffen,
  dass auch Korea eines Tages die Chance bekommt, seine staatliche Einheit zurückzugewinnen.
  Noch einmal danke an diejenigen, die hier ihren Dienst leisten, und danke an Sie,
  dass Sie Interesse daran haben, an diesem Ort dabei zu sein.
