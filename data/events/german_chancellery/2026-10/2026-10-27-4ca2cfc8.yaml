date: '2026-10-27'
type: press_release
source_name: german_chancellery
title: Pressekonferenz von Bundeskanzler Merz und Singapurs Premier Wong Enge Partnerschaft
  in Zeit des Umbruchs
text: 'Bundeskanzler Friedrich Merz traf den Premierminister Singapurs, Lawrence Wong,
  zum Gespräch. An kaum einem Ort seien die tiefgreifenden geopolitischen, wirtschaftlichen
  und technologischen Veränderungen unserer Zeit so spürbar wie in Singapur. Das betonte
  Kanzler Merz am Dienstag in einer gemeinsamen Pressekonferenz mit Singapurs Premierminister
  Lawrence Wong in Singapur. In einer von Unsicherheit und Großmachtkonkurrenz geprägten
  Welt müssten Europäer und die Länder des Indopazifiks gemeinsam ihren Wohlstand
  sichern sowie ihre Wettbewerbsfähigkeit wahren. Die neue Welt eröffne die Chance,
  die Partnerschaft mit dem Schlüsselpartner Singapur in der Wachstumsregion Südostasien
  mit langem Atem auszubauen. „ Vor allem sind wir fest entschlossen, unsere strategische
  Partnerschaft auszubauen“, betonte Bundeskanzler Merz. Bundeskanzler Merz in Asien
  : Mit seiner Reise nach Singapur , Japan und in die Republik Korea (Südkorea) vom
  26. bis 30. Oktober möchte Bundeskanzler Merz die gute Zusammenarbeit mit diesen
  wichtigen Partnern im Indo-Pazifik weiter ausbauen. Im südostasiatischen Stadtstaat
  Singapur stand am Dienstag neben der Unterredung mit Premier Wong auch ein Treffen
  mit Präsident Tharman Shanmugaratnam auf dem Programm. Darüber hinaus hielt der
  Bundeskanzler eine Rede im Rahmen der Singapore Lecture . Weiter geht es in Ostasien:
  Am Mittwoch reist Kanzler Merz zunächst weiter nach Japan, ehe ab Donnerstag Südkorea
  die letzte Station seiner Asientour sein wird. Herr Bundeskanzler, lieber Friedrich
  Merz, meine Damen und Herren Exzellenzen, meine Damen und Herren, zunächst möchte
  ich dem Bundeskanzler und seiner Delegation eine herzliche Begrüßung entgegenbringen.
  Wir haben uns im vergangenen November getroffen. Herr Bundeskanzler und ich habe
  damals schon gesagt, dass ich mich freuen würde, Sie hier zu begrüßen. Ich freue
  mich sehr, dass Sie die Einladung angenommen haben und dass Sie auch so viele Unternehmer
  mitgebracht haben. Singapur und Deutschland haben eine lange, substanzielle Partnerschaft,
  die auf gemeinsamem Vertrauen und gemeinsamen Interessen aufgebaut ist. Im vergangenen
  Jahr haben wir 60 Jahre unserer diplomatischen Beziehung gefeiert. Deutschland ist
  in der Entwicklung Singapur von frühester Zeit an ein wichtiger Partner gewesen.
  Institutionen wie das deutsch-singapurische Institut für Produktionstechnologie
  und das Rollei Government Training Centre haben dabei geholfen, Generationen von
  Singapurern und Singapurerinnen mit technischen Fähigkeiten und Expertise auszustatten
  und unsere Verwandlung in eine hochentwickelte Volkswirtschaft unterstützt. Dafür
  sind wir sehr dankbar. Über Jahrzehnte hinweg hat sich unsere Beziehung immer stärker
  entwickelt. Unsere Zusammenarbeit deckt viele Bereiche ab und stützt sich auf unsere
  strategische Partnerschaft. Unsere Wirtschaftsbeziehungen sind besonders stark.
  Deutschland ist einer der wichtigsten Handelspartner Singapurs in der EU und der
  bilaterale Handel in Waren und Dienstleistungen ist deutlich angewachsen, seit im
  Jahre 2019 das Freilandesabkommen mit der EU in Kraft getreten ist. Mehr als 2900
  deutsche Unternehmen sind in Singapur vertreten. Dazu gehören Weltmarktführer wie
  Siemens, SAP, Evonik und Infineon, aber auch innovative Mittelstandsunternehmen.
  Sie leisten einen Beitrag zu unserer Volkswirtschaft und nutzen Singapur als ein
  Tor zu Chancen überall in Asien und im weiteren asiatisch-pazifischen Raum. Wir
  haben auch starke Verteidigungsbeziehungen. Unsere Leopard-Panzer und unsere U-Boote
  der Invincible -Klasse sind aus deutscher Produktion. Anfang dieses Monats haben
  wir das erste Küstenwachschiff der Sentinel -Klasse in Betrieb genommen. Auch das
  ist aus deutscher Fertigung. Wir sind insbesondere dankbar für die vielen Jahre
  der Unterstützung in der Panzerausbildung in der Oberlausitz und für die Ausbildung
  unserer U-Boot-Besatzung in Kiel. Diese Vereinbarungen sind Ausdruck des hohen Maßes
  an Vertrauen zwischen unseren beiden Staaten. Der Bundeskanzler und ich sind uns
  einig, dass wir im Rahmen unserer strategischen Partnerschaft noch sehr viel mehr
  gemeinsam schaffen können, und wir haben einen gemeinsamen Arbeitsplan verabschiedet.
  Vier Bereiche möchte ich besonders hervorheben. Zunächst zum Bereich von digitaler
  Wirtschaft und KI : Wir beide erkennen das gewaltige Potenzial der digitalen Technologien
  und der KI an, wenn es darum geht, unsere Volkswirtschaften weiterzuentwickeln und
  neue Chancen für Unternehmen und Arbeitnehmer zu schaffen. Wir wollen aber gerne
  mehr tun. Wir wollen vor allem im Bereich der Entwicklung und Nutzung der industriellen
  KI , wo wir uns gegenseitig verstärken können, mehr engagieren. Wir wissen aber
  auch, dass KI neue Risiken und Herausforderungen mit sich bringt. Deshalb werden
  wir sicherstellen, dass dies auf eine Art und Weise erfolgt, die sicher und vertrauenswürdig
  ist und sich nach den Bedürfnissen des Menschen richtet. Zweitens: Forschung und
  Innovation. Wir haben bereits eine deutliche akademische und Forschungspräsenz auf
  deutscher Seite in Singapur. Die TU München hat 2002 einen Campus errichtet, den
  ersten Campus einer deutschen Universität im Ausland. Vor kurzem wurde das Max Planck
  Singapore Center for Data-driven Chemistry eröffnet, und im April das Max Planck–
  NTU Singapore Centre for Biocultural Worlding . Dies ist das erste seiner Art in
  Südostasien. Diese Partnerschaften haben Forscher und Institutionen zusammengebracht
  und neue Chancen geschaffen – im Bereich wie KI , bei der Fertigung von grünen Technologien
  sowie bei Halbleiter-, Quanten- und Weltraumtechnologien. Drittens. Wir wollen die
  Zusammenarbeit zwischen unseren Regionen verstärken. Singapur und Deutschland sind
  beide eng mit der Weltwirtschaft verflochten und wir hängen von offenen Märkten
  und starken internationalen Partnerschaften ab. Die Welt um uns herum wird aber
  fragmentierter. Der Zeitgeist wendet sich gegen Offenheit und offenen Handel. Darauf
  dürfen wir aber nicht regieren, indem wir nach innen schauen. Wir möchten mit gleichgesinnten
  Partnern daran arbeiten, neue Verbindungen zu schaffen. Deshalb begrüße ich die
  Tatsache, dass Deutschland im Juli dieses Jahres ein Sektordialogpartner Asiens
  geworden ist. Das ist ein wichtiger Schritt, der Deutschland und Südostasien einander
  näherbringt. Singapur wird im nächsten Jahr den Vorsitz von ASEAN übernehmen, und
  wir werden die Partnerschaften mit Deutschland und der EU vertiefen und auch hinsichtlich
  eines gemeinsamen Handelsabkommens weiter Fortschritte erzielen. Der Bundeskanzler
  und ich sind dem Völkerrecht und der multilateralen Zusammenarbeit verpflichtet.
  Wir sind natürliche Partner, wenn es um die regelbasierte Ordnung geht, und wir
  wollen eine Welt haben, in der Regeln geachtet werden, Verpflichtungen gut erfüllt
  werden und Streitigkeiten friedlich gelöst werden. Wir freuen uns deshalb, dass
  die Bundesrepublik sich Singapur und 16 anderen Staaten angeschlossen hat und das
  sogenannte GUIDE unterschrieben hat. Diese Initiative wird die Zusammenarbeit in
  der Region zum Schutz kritischer Unterwasserinfrastruktur stärken; denn diese ist
  entscheidend für unsere Sicherheit und Konnektivität. Singapur und Deutschland mögen
  geografisch weit voneinander entfernt liegen, aber wir haben viele gemeinsame Interessen
  und Überzeugungen, und das ist heute in den Gesprächen auch wieder deutlich geworden.
  Diese gemeinsamen Überzeugungen bilden seit sechs Jahrzehnten die Grundlage unserer
  Beziehungen. In einer Welt, die zunehmend unsicherer und fragmentierter wird, wird
  das noch sehr viel bedeutsamer sein. Es ist daher wichtig, dass unsere beiden Staaten
  und Regionen einander nähergebracht werden. Deshalb möchte ich Ihnen, Herr Bundeskanzler,
  danken und Sie noch einmal herzlich in Singapur begrüßen. Ich danke für Ihre Freundschaft
  und Partnerschaft und freue mich sehr darauf, eng mit Ihnen zusammenzuarbeiten,
  damit wir unsere bilateralen Beziehungen auf eine noch höhere Ebene heben können.
  Herr Premierminister, lieber Lawrence Wong , ganz herzlichen Dank für das sehr freundliche
  Willkommen hier in Singapur heute Morgen! Ich freue mich, dass meine Reise in den
  indopazifischen Raum heute in Singapur beginnt. Diese Region entfaltet eine einzigartige
  wirtschaftliche und technologische Dynamik. Hier verlaufen die Hauptschlagadern
  des globalen Handels. 60 Prozent des globalen Handels werden in dieser Region abgewickelt.
  Dies ist ein Ort, an dem zugleich die tiefgreifenden geopolitischen, wirtschaftlichen
  und technologischen Veränderungen unserer Zeit spürbar werden und sichtbar sind.
  Wir Europäer stehen vor denselben Herausforderungen wie die Länder in der Region
  des Indopazifiks. Wir müssen uns in einer zunehmend von Unsicherheiten geprägten
  Welt behaupten. Wir müssen das nach innen und nach außen tun. Wir wollen unseren
  Wohlstand sichern, wir wollen unsere Wettbewerbsfähigkeit bewahren und wir wollen
  die großen technologischen Entwicklungen mitgestalten. Wir müssen unsere Interessen
  in einem internationalen Umfeld der neuen Großmachtkonkurrenz behaupten. Diese neue
  Welt eröffnet uns aber auch Chancen, unsere Partnerschaften gemeinsam zu vertiefen,
  und deshalb bin ich heute hier. Ich werde zu diesen Fragen im Rahmen der Singapore
  Lecture noch etwas ausführlicher sprechen, aber vielleicht so viel an dieser Stelle.
  Deutschland und Singapur verbindet eine über Jahrzehnte gewachsene politische und
  ökonomische Partnerschaft. Vielen Dank auch für diese gute Zusammenarbeit in den
  letzten Jahren. Deutschland ist auch ein Partner in der Wachstums- und Zukunftsregion
  Südostasien. Dabei ist Singapur ein beeindruckendes Beispiel dafür, dass nicht nur
  die Größe eines Landes die Handlungsfähigkeiten definiert. Es sind Weitsicht und
  der Gestaltungswille der Regierung, die zählen und die Singapur zu dem gemacht haben,
  was es heute ist. Vor diesem Hintergrund haben wir über eine ganze Reihe von Themen
  der zukünftigen Zusammenarbeit gesprochen. Ich will vier konkrete Themen nennen:
  Erstens bauen wir unsere strategische Partnerschaft weiter aus. Premierminister
  Wong und ich, wir haben heute miteinander einen Arbeitsplan für die kommenden Jahre
  verabredet. Wir setzen Schwerpunkte in den Bereichen von Sicherheit und Verteidigung,
  Handel und Investitionen, Digitalem, KI und Forschung sowie grüner Energie. Das
  alles findet vor dem Hintergrund des 50-jährigen Jubiläums der EU - ASEAN -Beziehungen
  statt, das wir im nächsten Jahr feiern werden. Diesen Anlass werden wir nutzen,
  um neue Impulse für die Vertiefung unserer Zusammenarbeit zu setzen. Zweitens wollen
  wir unsere Handels- und Investitionsbeziehungen ausbauen. Ich habe deshalb vorgeschlagen,
  unsere bestehenden Freihandelsstrukturen mit den verschiedenen regionalen Partnern
  wie Singapur, aber auch Malaysia, Indien, Indonesien usw. künftig besser zu koordinieren.
  Das eröffnet uns und unseren Unternehmen bessere Chancen in der Region. Ich habe
  zudem unsere Bereitschaft unterstrichen, der ASEAN -Power-Grid-Initiative beizutreten.
  Dieses Projekt zielt auf die physische wie auch regulatorische Integration nationaler
  Stromnetze, so wie wir es auch in der Europäischen Union kennen. Wir wollen drittens
  unsere verteidigungs- und sicherheitspolitische Zusammenarbeit intensivieren. Wir
  schließen neue Vereinbarungen zur Cybersicherheit. Premierminister Wong hat darüber
  gesprochen. Wir kooperieren im Bereich der U-Boote schon seit längerer Zeit. Aber
  wir wollen auch zur Verstärkung unserer Widerstandskraft und zum Schutz unserer
  kritischen Infrastruktur mit Singapur in eine vertiefte Kooperation eintreten. Deutschland
  wird der GUIDE-Initiative zum Schutz kritischer Unterwasserinfrastruktur beitreten.
  Auch dies ist ein Angebot, das wir dankbar annehmen. Ich will umgekehrt sagen: Danke
  für die weitere Unterstützung der Ukraine. Wir stimmen uns in diesen Fragen eng
  ab. Singapur ist auch ein sehr aktives Mitglied der Koalition der Willigen hinsichtlich
  der Sanktionen, die Moskau zum Einlenken und zum Beenden dieses Krieges bewegen
  sollen. Wir sind dankbar dafür, dass Singapur ohne Zögern den Sanktionen gegen Russland
  zugestimmt und sie auch erlassen hat. Viertens bauen wir auf der erfolgreichen Zusammenarbeit
  im Digitalbereich auf. Wir intensivieren den Austausch hinsichtlich künstlicher
  Intelligenz und werden eine neue Kooperation bezüglich unserer gerade neu gegründeten
  KI -Sicherheitsinstituten eingehen. Wir lernen also voneinander auch beim Thema
  der Digitalisierung, nicht zuletzt für unsere Verwaltungen. Das alles zeigt: In
  einer Zeit des Umbruchs, die Singapur, Deutschland, Europa, die ganze Welt fordert
  wie lange nicht, rücken wir zusammen. Wir teilen viele Interessen und Werte. Vor
  allem sind wir fest entschlossen, unsere strategische Partnerschaft auszubauen.
  „Strategisch“ bedeutet in diesem Zusammenhang „mit langem Atem“. Denn nur das wird
  uns helfen, in der neuen Zeit zu bestehen. Ich möchte das gern mit einem persönlichen
  Wort des Dankes abschließen. Dass wir uns heute Morgen so ausführlich und so intensiv
  zu verschiedenen Themen haben austauschen können, schließt an die kürzeren Gespräche
  an, die wir gehabt haben, insbesondere im vergangenen Jahr auf dem G20 -Gipfel.
  Ich freue mich sehr auf die vertiefte Zusammenarbeit. Ich habe dem Premierminister
  auch erläutert, wohin mich die Reise in dieser Woche noch führen wird. Das sind
  Länder, mit denen Singapur sehr eng zusammenarbeitet. Insofern ist das eine sehr
  gute Chance dafür, dass Deutschland hier in der Region zum gegenseitigen Nutzen
  stärker engagiert ist. Herr Premierminister, auch Ihnen persönlich noch einmal sehr
  herzlichen Dank für den freundlichen Empfang heute Morgen! Frage: Singapur und Deutschland
  wollen die Zusammenarbeit in Bereichen wie KI und Digitalisierung verstärken. Welche
  konkreten Chancen sehen Sie dabei für die Unternehmen und Arbeitnehmer Singapurs?
  Premierminister Wong: Deutschland und Singapur haben einander ergänzende Stärken.
  Deutschland ist weltführend, wenn es um Industriefähigkeiten und den Ingenieurbereich
  geht. Wir in Singapur haben uns sehr stark im KI - und Digitalisierungsbereich betätigt.
  Wenn wir diese Fähigkeiten miteinander verbinden, dann können wir uns in einem Bereich
  wie zum Beispiel der industriellen KI , mit der man mehr Robotik und mehr automatisierte
  Lösungen in die Fertigung und Logistik hineinbringt, stärker engagieren. Wir haben
  also ein großes Interesse daran, diese Art von Partnerschaften weiterzuentwickeln.
  Ich bin davon überzeugt, dass dies den Unternehmen Singapurs schrittweise neue Chancen
  eröffnen wird. In vielen Fällen der Partnerschaft zwischen deutschen und singapurischen
  Unternehmen hat sich das bereits gezeigt. Viele Entwicklungen für kleine und mittelständische
  Unternehmen sowie Arbeitnehmer hier sind positiv gewesen. Ich denke, dass auch andere
  hier vertretene Unternehmen Partnerschaften im Bereich der mittelständischen Zusammenarbeit
  mit Deutschland eingehen. So werden wir neue Arbeitsplätze für Singapurer schaffen
  und die Fähigkeiten und die Ausbildung weiter verbessern im Hinblick auf den Zugang
  zu diesen Arbeitsplätzen. Frage : Ich habe eine Frage an Sie beide. China spielt
  eine führende Rolle im Bereich der KI und in allen anderen Hightech bereichen. Denken
  Sie, dass ein Bündnis von Mittelmächten in diesem Wettbewerb gegen Supermächte bestehen
  und sich halten kann? Eine weitere Frage an Sie beide: Sind Sie beide dafür, dass
  sich die EU dem CPTPP anschließt? Premierminister Wong: Was Singapur betrifft, so
  vollziehen sich hier viele Entwicklungen, die für die Zukunft bedeutsam sind. Wir
  sehen das auch im Bereich Chinas. Aber es geht weniger um grenzüberschreitende Entwicklungen
  beim Schaffen von KI -Modellen, sondern eher um den Anwendungsbereich der KI . Dabei
  hat Singapur Vorteile zu bieten. Wir sind kompakt. Wir sind als Gesellschaft sehr
  gut vernetzt. Hier gibt es Rechtsstaatlichkeit. Wir haben rechtliche Grundlagen,
  auch den Schutz von Eigentumsrechten. Wir sehen hier eine ganze Reihe von Chancen
  und Möglichkeiten im Gesundheitsbereich, im Bereich der Logistik und der Finanzen
  sowie der hoch entwickelten und modernen Fertigung. Ich denke, man kann einiges
  erreichen, wenn es darum geht, tatsächliche KI -Lösungen zur Anwendung zu bringen.
  In diese Bereiche investieren wir. Hier machen wir einige Fortschritte. Wir haben
  großes Interesse daran, mit Deutschland in diesem Bereich noch enger zusammenzuarbeiten.
  Was nun den Handel betrifft, so unterstützen wir voll und ganz die Teilhabe Deutschlands
  am CPTPP. Die Anstrengungen dazu sind hier im Gange. Wir diskutieren darüber bereits
  im Zusammenhang mit Deutschland, aber auch anderen Partner in der EU . Wir wollen
  ja eine engere Zusammenarbeit zwischen der EU und ASEAN , aber auch ganz gezielt
  zwischen der EU und dem CPTPP . Die Welt wird fragmentierter. Es gibt mehr Spaltung.
  Wir wollen mehr Verbindung zwischen verschiedenen Regionen schaffen. Deutschland
  und Singapur, die ihre jeweilige Perspektive haben, können einen Beitrag dazu leisten.
  Bundeskanzler Merz: (auf Englisch) Dem stimme ich voll und ganz zu. (auf Deutsch)
  Wir haben in der Tat komplementäre Interessen mit der Region hier. Singapur ist
  ein Land, das einen ähnlich hohen Anteil industrieller Fertigung an seiner Wertschöpfung
  hat wie Deutschland. Der Anteil der Industrie liegt auch hier bei etwa 20 Prozent
  des GDP . Das bringt uns zu einer gemeinsamen Perspektive im Hinblick auf die Anwendung
  von KI . Wir nennen es in Deutschland industrielle KI . Wir haben dafür in Europa
  auch den regulatorischen Rahmen deutlich gelockert, sodass die Entwicklung auch
  in der Anwendung künstlicher Intelligenz jetzt sehr schnell gehen kann, und sie
  geht sehr schnell. Hierbei gibt es gemeinsame Interessen zwischen Singapur und Europa.
  Ich würde aber gern auch die beiden Länder, die ich in dieser Woche noch besuche,
  mit einbeziehen, Japan und Südkorea. Wenn wir diese Anstrengungen zusammen unternehmen,
  dann wird auch unsere Unabhängigkeit von anderen Ländern deutlich größer, und das
  ist auch der Sinn meiner Reise und auch der Sinn der Gespräche, die ich in Singapur
  führe. Zum Thema CPTPP : Wir sind seit langer Zeit daran interessiert, die Zusammenarbeit
  mit dieser Freihandelsregion zu intensivieren. Sie wissen, dass die Europäische
  Union nicht zuletzt auch auf mein Betreiben hin in der Handelspolitik sehr viel
  aktiver geworden ist, um genau diese Partnerschaften auf der Welt zu suchen. Wir
  suchen Partnerschaften, die den Handel insbesondere im Hinblick auf den freien Welthandel,
  den offenen Wettbewerb, die regelbasierte Ordnung und auch die Verlässlichkeit innerhalb
  der WTO ausweiten wollen, und dafür finden wir in diesem Land, in Singapur, aber
  auch in anderen Ländern in der Region dankbare Partner. Ich will diesen Dank auch
  von unserer Seite zurückgeben. Wir haben ein strategisches Interesse daran, dass
  wir mit 450 Millionen Europäern offenen Zugang zu den Märkten haben, denen wir umgekehrt
  in Europa einen offenen Zugang geben wollen, und dies ist ein bewusster Kontrapunkt
  zu dem, was wir zurzeit an Einschränkung des globalen Handels sehen. Wir wollen
  es anders machen, und wir wollen zeigen, dass es besser geht. Frage : Ich habe eine
  Frage an beide Staats- und Regierungschefs, was die Vertiefung der Beziehung zwischen
  ASEAN und der EU anbetrifft. Wie planen Sie, daran gemeinsam unter dem ASEAN -Vorsitz
  von Singapur zu arbeiten? Wie weit sind die Verhandlungen über ein Freihandelsabkommen
  vorangeschritten? Gibt es da konkrete Schritte, die Ihrer Meinung nach ergriffen
  werden könnten? Premierminister Wong: Wir haben großes Interesse daran, die EU und
  ASEAN einander näherzubringen. Wir werden das tun, was in unserer Macht steht, und
  mit Deutschland, einem führenden Vertreter der EU , daran arbeiten, diesen Prozess
  zu erleichtern. Zum Beispiel wollen wir überlegen, wie wir den Jahrestag der Beziehung
  zwischen der EU und ASEAN im nächsten Jahr feierlich begehen können. Wir werden
  Schritte zur Umsetzung des Freihandelsabkommens ergreifen. Das wird nicht einfach
  sein. Das ist eine Herausforderung. Ja, dieses Freihandelsabkommen ist ein komplexes
  Thema. Wir haben aber Vertrauen darin, dass wir Fortschritte erzielen können, denn
  auch die EU hat ihrerseits bilaterale Freihandelsabkommen mit einzelnen ASEAN -Staaten
  unterzeichnet, nicht nur mit Singapur und Vietnam. Die EU verhandelt zurzeit auch
  mit Malaysia, Thailand und Indonesien. Das sind nur einige Beispiele. Zunehmend
  haben einzelne ASEAN -Mitgliedstaaten Freihandelsabkommen mit der EU verhandelt
  oder sprechen darüber, und das gibt uns größeres Vertrauen darauf, dass auch ASEAN
  als Block Fortschritte bei Handelsdiskussionen und dem Abschluss eines Freihandelsabkommens
  mit der EU erzielen kann. Wir schauen aber über den Handelsbereich hinaus. Hierbei
  geht es auch um die digitalen Fragen, die wir gemeinsam angehen können. Die EU hat
  ein digitales Handelsabkommen verabschiedet. ASEAN hat ja nun einen ähnlichen Rahmen
  geschaffen und ein Rahmenabkommen verabschiedet. Die Möglichkeit, die EU und A ASEAN
  hierbei miteinander in Kontakt zu bringen, nicht nur im Bereich von Handel und Investitionen,
  sondern auch, was die digitalen Systeme anbetrifft, wird den Unternehmen sicherlich
  noch bessere Möglichkeiten bieten. Dadurch kann man noch leichter in den Austausch
  treten, und davon wird letztendlich auch die Bevölkerung profitieren. Bundeskanzler
  Merz: Ich habe in meinem Statement darauf hingewiesen, dass wir im nächsten Jahr
  das 50. Jahr der europäisch-asiatischen Zusammenarbeit im ASEAN -Rahmen miteinander
  begehen werden. Dieses Thema ist viele Jahrzehnte ein Thema für wenige Experten
  gewesen. Es wird jetzt ein Thema von breitestem politischen Interesse für unsere
  Staaten, sowohl für die europäische Seite als auch für die ASEAN -Staaten, die jetzt
  angesichts dieser fundamentalen Veränderungen auf der Welt plötzlich den großen
  Wert dieser Beziehungen neu einschätzen. Ich schließe mich dem an. Ich glaube, dass
  wir gerade angesichts der veränderten globalen Lage eine große Chance haben, in
  diesen Wirtschaftsräumen jetzt eine noch engere und vertieftere Zusammenarbeit zu
  suchen. Ich will es noch einmal sagen: Lawrence Wong und ich haben doch eine sehr
  hohe Übereinstimmung in unseren grundsätzlichen Überzeugungen zum freien Handel,
  zu offenen Märkten, zum Wettbewerb festgestellt. Wir suchen solche Partner auf der
  Welt. In diesen Tagen wird mit Kanada noch einmal die Vertiefung der Beziehung zu
  den europäischen Staaten, zur Europäischen Union diskutiert. Wenn das gerade in
  Brüssel geschieht, dann ist das komplementär zu dem, was ich heute hier mache, nämlich
  dass wir genau diese Partnerschaften suchen. Wenn wir sie auf der Basis bestehender
  Verabredungen und Vereinbarungen intensivieren können, dann macht uns das das sogar
  noch leichter, denn wir haben diese Zusammenarbeit mit den ASEAN -Staaten und der
  Europäischen Union jetzt seit 50 Jahren. Aber jetzt bekommt sie noch einmal eine
  ganz neue Qualität, eine ganz neue Bedeutung und damit auch eine neue Dimension.
  Ich bin jedenfalls entschlossen, diese Chancen, die wir haben, intensiv zu nutzen.
  Frage : Herr Premierminister, der Bundeskanzler möchte, dass Sie mehr in Deutschland
  investieren, und Sie haben angedeutet, dass Sie darüber nachdenken. Sind Sie angesichts
  der politischen Unruhe in Frankreich und extremistischer Parteien, die in Deutschland
  Wahlen gewonnen haben, nicht gelegentlich beunruhigt? Machen Sie sich da nicht Sorgen,
  ob Ihre Investitionen in Deutschland sicher sind? Eine Frage an den Bundeskanzler:
  Wie lautet Ihr Argument, wenn Sie solche Bedenken bzw. Fragen danach, ob die Investitionen
  in Deutschland sicher sind, geäußert bekommen? Premierminister Wong: Ich habe vorhin
  zu dem Bundeskanzler gesagt, dass Deutschland ja vor Kurzem einen sehr erfolgreichen
  Investitionsgipfel abgehalten hat, und viele wichtige Investoren aus Singapur waren
  anwesend. Viele unserer Investoren, und dazu gehören auch unsere Staatsfonds, investieren
  schon lange in Deutschland. Damit haben Sie nicht gerade erst vor Kurzem begonnen.
  Sie sind nicht sozusagen erst vor Kurzem konvertiert. Sie investieren schon seit
  sehr, sehr vielen Jahren, und Sie werden weiter investieren, denn Sie sind zuversichtlich,
  dass Deutschland und Europa langfristig ein Potenzial zu bieten haben. Unsere Investoren
  sind langfristig denkende Menschen. Hierbei geht es nicht nur um einen Wahlzyklus.
  Sie investieren langfristig, und Singapur glaubt an das langfristige Potenzial Deutschlands
  und Europas. Wir verlieren unser Vertrauen, was das anbetrifft, auch nicht, und
  wir werden weiter investieren. Bundeskanzler Merz: Ich habe mich sehr darüber gefreut,
  dass der Premierminister heute auch in unserem Vier-Augen-Gespräch gleich auf den
  Investment Summit in der letzten Woche in Deutschland zu sprechen gekommen ist.
  Das, was wir letzte Woche in Deutschland gemacht haben, hat auch hier offensichtlich
  große Aufmerksamkeit ausgelöst. Ich habe ihm versichert, dass wir Eigentum schützen
  und dass wir versuchen wollen, in der gesamten Europäischen Union ein stabiler,
  verlässlicher Wirtschaftspartner zu bleiben. Natürlich wird auch in dieser Region
  beobachtet, was zurzeit in Europa geschieht. Aber ich kann nur sagen: Mir begegnet
  hier sehr viel Vertrauen in den deutschen und in den europäischen Standort als Investmentstandort,
  und ich werde heute im Laufe des Tages ja auch noch zwei Vertreter Ihrer großen
  Fonds sehen. Ich habe sie letzte Woche in Berlin getroffen, und ich kann nur sagen:
  Es gibt eine große Zuversicht und auch eine große Hoffnung in einen stabilen Investitionsstandort
  Deutschland. Manchmal wird dieser Standort vom Ausland sogar besser und realistischer
  eingeschätzt als im Inland. Aber deswegen kann ich alle Sorgen zerstreuen, dass
  es Unsicherheiten in Europa gibt. Sie gibt es nicht, und mit der von mir geführten
  Bundesregierung werden die Investitionsmöglichkeiten auch kontinuierlich verbessert.'
