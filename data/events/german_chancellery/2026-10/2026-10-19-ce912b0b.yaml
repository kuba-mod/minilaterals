date: '2026-10-19'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 19. Oktober 2026
text: 'Sprecherinnen und Sprecher •    Staatssekretär Kornelius •    Kolb (BMFTR)
  •    Dr. Rüll (BMF) •    Köppl (BMUKN) •    Deschauer (AA) •    Kaminski (BMI) •    Valdés
  Cifuentes (BMJV) •    Büddicker (BMV) •    Müller (BMVg) (Vorsitzender Feldhoff
  eröffnet die Pressekonferenz und begrüßt StS Kornelius sowie die Sprecherinnen und
  Sprecher der Ministerien.) Kolb (BMFTR) Die Bundesministerin für Forschung, Technologie
  und Raumfahrt, Dorothee Bär, wird am 21. und 22. Oktober nach Mailand in Italien
  reisen. Ministerin Bär wird nach Ankunft am 21. Oktober zunächst gemeinsam mit ihrer
  italienischen Amtskollegin Anna Maria Bernini das Joint Research Centre der Europäischen
  Kommission besuchen. Dort werden sie gemeinsam einen Letter of Intent zur Stärkung
  der Zusammenarbeit mit dem Joint Research Centre unterschreiben. Anschließend werden
  Ministerin Bär und Ministerin Bernini die Accademia di Belle Arti di Brera in Mailand
  besuchen und dort die Vigoni Lecture 2026 halten. Am 22. Oktober werden die Ministerinnen
  gemeinsam an einer Veranstaltung zum 40-jährigen Bestehen der Villa Vigoni, dem
  deutsch-italienischen Zentrum für den europäischen Dialog, teilnehmen. Anschließend
  werden Ministerin Bär und Ministerin Bernini in der Villa Vigoni die deutsch-italienische
  Roadmap zur Vertiefung der Kooperation in Forschung und Technologie unterschreiben.
  Die Reise und die Unterzeichnung der Roadmap knüpfen an die deutsch-italienischen
  Regierungskonsultationen von Januar dieses Jahres und den dort von Bundeskanzler
  Merz und Ministerpräsidentin Meloni unterzeichneten deutsch-italienischen Aktionsplan
  an. Nach einem Zeitungsbericht von heute verstoße die Finanzplanung der Bundesregierung
  gegen die formalen Kriterien, gegen die Vorgaben von Bund und Ländern. Was sagen
  Sie dazu? Ich nehme an, dass Sie auf die Berichterstattung zum Stabilitätsrat anspielen.
  Der Stabilitätsrat hatte vergangene Woche eine Sitzung und wird seine kommende Sitzung
  am 3. Dezember abhalten. Diese wird zwischen Bund und Ländern gerade vorbereitet.
  Mehr dazu kann ich heute noch nicht sagen. Soll ich noch zu den Kriterien ausführen?
  Gern. Wie ordnen Sie das Ganze ein? Soweit es in dem Bericht steht, handelt es sich
  eigentlich ja nur um einen formalen Verstoß. Wie schätzen Sie das ein? Ist das etwas,
  was Ihnen größere Sorge bereitet, oder wie muss ich mir das vorstellen? Zur Einordnung
  kann ich noch etwas sagen. Der Stabilitätsrat selbst ist ein Gremium aus Bund und
  Ländern, in dem Haushalte sowohl vom Bund als auch von den Ländern anhand verschiedener
  Kennziffern untersucht werden. Diese Kennziffern umfassen zum einen das Finanzierungssaldo,
  zum anderen die Kreditfinanzierungsquote, die Zinssteuerquote und den Schuldenstand.
  Man schaut sich sozusagen gegenseitig auf die Finger. Wenn es irgendetwas Kritisches
  gibt, dann wird das innerhalb dieses Gremiums beraten. Für den Bund ‑ das wissen
  Sie alle ‑ haben wir eine Sondersituation in diesem Land, zum einen aufgrund der
  dringend notwendigen Investitionen in Rüstung und zum anderen aufgrund des Sondervermögens,
  in dem der Bund jetzt ‑ das haben wir von dieser Stelle schon häufig gesagt ‑ Investitionen
  tätigt, die schon lange nötig sind, indem er die Verteidigung wieder auf Vordermann
  bringt, aber auch in Klimaneutralität und Infrastruktur investiert. Insofern kann
  ich für den Bund sagen, dass wir angesichts dieser Kriterien keine Sorgen haben,
  dass aber in dem Gremium über die Kriterien gesprochen wird. Muss die Bundesregierung
  deshalb also keine Haushaltsnotlage oder irgendetwas dergleichen ausweisen? Der
  bayerische Ministerpräsident hat gestern noch einmal ziemlich deutlich Stellung
  gegen eine Plastiksteuer bezogen und von Quatschplänen gesprochen. Herr Kornelius,
  welche Haltung hat der Kanzler aktuell dazu? Sie wissen, dass dieses Thema jetzt
  in einem geordneten Verfahren mit einem ordentlichen Gesetzgebungsverfahren aufgesetzt
  wird. Es durchläuft dann die Ressortabstimmungen und die Vorgespräche innerhalb
  der Ressorts. Anschließend ist es im parlamentarischen Verfahren zu behandeln. Insofern
  wäre es zum jetzigen Zeitpunkt zu früh, das zu vertiefen. Die Federführung dabei
  hat das Bundesumweltministerium, soweit ich weiß. Können Sie sagen, wann eine Vorlage
  fürs Kabinett kommt? Wie der Regierungssprecher gerade ausgeführt hat, wird das
  derzeit innerhalb der Bundesregierung beraten. Deshalb habe ich den Worten des Sprechers
  nichts hinzuzufügen. Es gibt noch keinen konkreten Termin. Meine Frage geht an das
  AA. Wie schätzt die Bundesregierung die Proteste in Frankreich ein? Sind das nur
  Ausschreitungen, oder geht das schon darüber hinaus? Ich kann aus Sicht des Auswärtigen
  Amts sehr grundsätzlich kurz auf die Anpassung unserer Reise- und Sicherheitshinweise
  hinweisen. Wir haben sie aktualisiert und weisen darin auf die Lage vor Ort hin.
  Das Auswärtige Amt rät Reisenden zur Umsicht und dazu, sich von Demonstrationen
  fernzuhalten. Das sind grundlegende Verhaltensmaßnahmen, die wir deutschen Staatsangehörigen,
  die sich im Land aufhalten, mit auf den Weg geben wollen. Darüber hinaus beobachtet
  die Bundesregierung als enger Partner Frankreichs natürlich die Lage vor Ort. Darüber
  hinaus möchte ich nur noch sagen, dass uns Bilder wie aus Paris oder auch aus Limoges,
  die wir alle gesehen haben, mit großer Sorge erfüllen. Es ist ein gutes Zeichen,
  dass es gestern etwas ruhiger geworden zu sein scheint. Insgesamt kann man vielleicht
  sagen, dass es notwendigen Austausch zu Fragestellungen und Debatten gibt, aber
  natürlich Gewalt auf der Straße in unseren Demokratien keinen Platz hat. Herr Kornelius,
  in einem halben Jahr wird in Frankreich gewählt. Halten Sie das Land angesichts
  dieser Gewalteskalation als Partner bis dahin überhaupt noch für handlungsfähig?
  Selbstverständlich ist Frankreich handlungsfähig. Steht die Bundesregierung im Austausch
  mit den französischen Behörden über mögliche ausländische Einflussversuche hinsichtlich
  dieser Ausschreitungen? Mir ist dazu nichts bekannt. Die Bundesregierung beobachtet
  die Situation. Überhaupt beobachten wir auch ausländische Einflussnahmen und hybride
  Bedrohungen in allen möglichen Segmenten unserer Gesellschaft. Aber zu den speziellen
  Vorfällen kann ich keine Erkenntnisse beisteuern. Frau Deschauer, Sie haben jetzt
  von Gewalt auf der Straße gesprochen. Über die zivile Gewalt brauchen wir nicht
  zu reden, aber wie schaut die Bundesregierung auf die massive Polizeigewalt gegen
  die jungen Menschen? Ich denke, wir haben dazu im Moment alles gesagt, was an Erkenntnisstand
  wir aus Sicht der Bundesregierung haben. Wir beobachten die Lage vor Ort genau.
  Insgesamt gilt, denke ich, der Obersatz, dass berechtigte Anliegen friedlich vorgetragen
  werden können, es dazu auch einen notwendigen gesellschaftlichen Austausch gibt
  und dass bei so einem Austausch Gewalt auf den Straßen natürlich keinen Platz hat.
  Darüber hinaus habe ich keine weiteren eigenen Erkenntnisse. Worauf bezieht sich
  „Gewalt auf den Straßen“? Auf Gewalt von den jungen Menschen? Ich habe ja nach der
  Polizeigewalt gegenüber Schülern gefragt. Herr Kollege, Sie haben die Bilder von
  brennenden Rathäusern und anderen Orten gesehen. Ich ‑ ‑ ‑ Ja, Sie haben aber auch
  die Polizeigewalt gesehen. Herr Kollege, Sie lassen mich entweder ausreden oder
  die Antwort wird nicht beendet. Wir haben entsprechende Bilder gesehen, die uns
  alle sehr sorgenvoll stimmen. Wir sind natürlich sehr regelmäßig im Austausch mit
  unseren französischen Partnern. Ich denke, die Worte des Regierungssprechers und
  die meinigen stehen für sich. Es gab auch Blockaden und Proteste an deutschen Schulen.
  Haben Sie die Sorge, dass es zu paneuropäischen Mobilisierungen kommen könnte? (zum
  geplanten Bundesgesetz zur Verhinderung der Verstaatlichung privater Mietwohnbestände
  durch Vergesellschaftungsgesetze auf Landesebene) Herr Kornelius, was ist der aktuelle
  Stand hinsichtlich des Gesetzes? Steht mittlerweile fest, wer in der Bundesregierung
  dafür zuständig ist? Die Bundesregierung beobachtet diese Debatte in Berlin. Sie
  hat momentan keinen aktiven Anlass einzugreifen und wird darüber zur gegebenen Zeit
  entscheiden. Sie wissen, dass die Eigentumsfragen, die Fragen von Investitionen
  in Deutschland gesetzlich klar geregelt sind. Eigentumsrechte bleiben gewahrt. Rechtssicherheit
  und verlässliche Rahmenbedingungen sind essenziell für die Attraktivität des Investitionsstandortes
  Deutschland. Diese Grundsätze bleiben erhalten. Kann man sagen, welche Ressorts
  sich damit beschäftigen würden? Das Innenministerium übernimmt die Beantwortung.
  Grundsätzlich liegt hier die gemeinsame Federführung beim Bundesministerium des
  Innern, beim Bundesministerium der Justiz und für Verbraucherschutz und beim Bundesministerium
  für Wohnen, Stadtentwicklung und Bauwesen. Dazu muss aber gesagt werden, dass das
  BMI dabei die technische Federführung innehat. Das ist keine inhaltliche, sondern
  eine technische Federführung. Herr Kornelius, schadet der Artikel 15 im Grundgesetz
  dem Investitionsstandort Deutschland? Das müssten Sie hier näher erläutern, inwieweit
  das der Fall sein soll. Artikel 15 regelt die Vergesellschaftung. Das steht seit
  1949 im Grundgesetz. Schadet der dem Investitionsstandort Deutschland? Um den geht
  es jetzt hier. Ich glaube, es geht auch um Eigentumsrechte. Ich würde jetzt hier
  keine grundgesetzliche Auseinandersetzung führen. Eigentumsrechte sind klar geregelt.
  Verlässliche Rahmenbedingungen, Rechtssicherheit, Planungssicherheit, das ist alles
  essentiell für die Attraktivität des Investitionsstandortes. Die Bundesregierung
  steht dafür, diese Grundsätze auch aufrechtzuerhalten. Sorry, aber im Artikel 15
  ist geregelt, was vergesellschaftet werden kann, nämlich Grund und Boden; dementsprechend
  auch das, was hier in Berlin geplant ist. Schadet diese Regelung der Bundesrepublik?
  Die Betrachtung der Regelung, wie Sie sie momentan anstellen, ist sehr grob. Deswegen
  würde ich jetzt davon absehen, das zu kommentieren. Ich mache hier keine Grundgesetzkommentierung.
  Herr Kornelius, das heißt also, dieser Gesetzentwurf oder diese Pläne ‑ was auch
  immer ‑ sind erst einmal auf Eis gelegt? Wäre es nicht sinnvoll, praktisch prophylaktisch ‑ ‑ ‑
  So hatte ich es einmal verstanden, dass man das prophylaktisch machen möchte, um
  so eine mögliche Maßnahme in Berlin von vornherein auszuschließen. Wie ist jetzt
  der Stand? Kommt das Gesetz überhaupt noch? Wie Sie eben zu Recht gesagt haben:
  Es ist eine mögliche Maßnahme. Wir haben heute, glaube ich, erst einmal Entscheidungen
  von Parteien zu erwarten. Dieser Entscheidungsprozess wird sich noch einige Wochen
  hinziehen, und die Bundesregierung beobachtet diese Situation. Die Nachfrage geht
  in die ähnliche Richtung. ‑ Aktuell sehen Sie keinen Anlass einzugreifen. Wann genau
  wäre denn der Zeitpunkt gekommen? Könnte man dann überhaupt noch mit der Gesetzgebung
  so schnell hinterherkommen? Die Bundesregierung stellt jetzt keine Spekulationen
  über potenzielle Zeitpunkte oder über Inhalte an. Lassen Sie mal die Prozesse und
  die Entscheidungen wirken. Es gibt momentan keinen Anlass, heute zu handeln. Jetzt
  wäre ein solches Gesetz zweifellos eine Art Lex Berlin. Der Bundeskanzler hat am
  Wochenende Koalitions- oder Regierungsverhandlungen und Beteiligungen der drei Parteien
  in Berlin, nämlich Linke, Grüne und SPD, für unzulässig erklärt. Auf welcher Rechtsnorm
  beruht der Begriff unzulässig? Herr Kollege, der Bundeskanzler hat sich am Wochenende
  in seiner Eigenschaft als CDU-Vorsitzender auf dem Parteitag der Jungen Union geäußert.
  Ähnliche Äußerungen finden Sie von sehr vielen anderen Parteipolitikern. In diesem
  Rahmen bewegt sich die Auseinandersetzung. In der vergangenen Woche haben wir aber
  auch gehört, dass ein anderes Regierungsmitglied, die Wirtschaftsministerin, Äußerungen,
  die sie in politischer Funktion getan hat, weil mit dem Inhalt des Ressorts befasst,
  sehr wohl auf Seiten des Ressorts veröffentlichen wollte. Das, dachte ich, gelte
  dann auch für den Bundeskanzler. Kennt das Justizministerium eine Rechtsnorm, die
  ein Regierungsbündnis demokratisch gewählter Parteien für unzulässig erklären würde?
  Dazu habe ich Ihnen an dieser Stelle nichts mitzuteilen. Entschuldigung, können
  Sie das gegebenenfalls nachliefern? Es müsste doch bekannt sein, ob so eine Unzulässigkeitsrechtsnorm
  besteht. Sie bitten mich gerade darum, eine Äußerung des Kanzlers zu kommentieren.
  Das werde ich nicht machen. Ist es für die Bundesregierung kontraproduktiv, dass
  Rot-Rot-Grün in Sondierungsgesprächen in Berlin Enteignungen plant, während Sie
  den Invest in Germany Summit haben, um Investoren anzuziehen? Haben Sie die Sorge,
  dass Investoren vielleicht abspringen können? Nein, diese Sorge besteht nicht. Der
  Investitionsgipfel ist seit langem geplant. Deutschland ist ein hochattraktiver
  Investitionsstandort. Die Fähigkeit, in dieser Sache zu differenzieren, auch das
  Potenzial Deutschlands als Investitionsbühne zu erkennen, können wir voraussetzen.
  Ich glaube, dass auch die Gäste, die heute in Berlin erwartet werden, zu dieser
  Unterscheidung in der Lage sind. Wie gesagt: Ich kann nur wiederholen, dass das
  Eigentum in Deutschland ein hohes Gut ist und dass die Bundesregierung es schützen
  wird. Denken Sie nicht, dass da ein Konflikt entsteht, wenn es Signale aus Berlin
  und wiederum andere aus der Bundesregierung gibt? Die Investoren interessieren sich
  für Stabilität, für Offenheit, für Partnerschaftlichkeit. All das kann die Bundesregierung
  bieten. Die Investitionswerkzeuge, die wir zur Verfügung stellen, die Optionen,
  sich hier in diesem Land zu engagieren, sind vielfältig. Deutschland ist ein Rechtsstaat,
  Deutschland ist ein verlässlicher, stabiler Staat in der Mitte Europas, eingebettet
  in einem der größten Binnenmärkte der Welt. Insofern glaube ich, dass wir ein sehr
  attraktiver Platz für Investoren sind, die über das Tagesgetümmel einer Stadt hinausschauen.
  Herr Kornelius, da noch einmal nachgefragt: Ich kann mich erinnern, der Bundeskanzler
  hat vor einigen Wochen auf einer CDU-Veranstaltung gesagt, er bekomme in letzter
  Zeit immer wieder oder verstärkt Anrufe von Investoren, die sich angesichts der
  ganzen Ereignisse in Deutschland besorgt zeigten, die ausdrücklich auf die Linkspartei
  in Berlin und auf der anderen Seite natürlich auch auf die AfD verwiesen. Haben
  Sie nicht die Befürchtung, dass solche Tendenzen in der Tat Investoren eher abschrecken
  könnten? Uns ist bewusst, dass natürlich auch ausländische Investoren die Situation
  in der Hauptstadt betrachten werden. Aber, noch einmal: Wir können versichern, dass
  Eigentum in Deutschland gesichert ist, dass Investitionen gesichert sind, dass hier
  das Recht gilt. Dieses Recht schützt das Eigentum und wird es auch weiterhin tun.
  Herr Kornelius, ich muss sicherheitshalber nachfragen. Es war im Juli ein eindeutiger
  Koalitionsbeschluss. Darin hieß es: „Um den privaten Wohnungsbau nicht zu gefährden,
  wird durch Bundesgesetz geregelt, dass die Verstaatlichung privater Mietwohnungsbestände
  durch Vergesellschaftungsgesetze auf Landesebene nicht mehr möglich ist.“ Herr Kornelius,
  warum hat der Kanzler in den letzten Jahren zum Beispiel Enteignungsverfahren in
  Sachen Bau von Autobahnen und Straßen nicht kritisiert? Da wird ja auch Eigentum
  enteignet. Es geht um Fragen der Infrastruktur. Die Infrastrukturmaßnahmen werden
  häufig von derartigen Verfahren begleitet. Das ist jetzt kein Widerspruch. Das ist
  kein Widerspruch? Dabei wird auch Eigentum enteignet. Die CDU hat bei der Präsidiumsklausur
  am Wochenende ja beschlossen, den innerdeutschen Flugverkehr zu stärken und eine
  Senkung der Luftsicherungsgebühren und der Luftverkehrssteuer zu fordern. Wie steht
  eigentlich das Verkehrsministerium dazu? Danke für die Frage. Es ist ja so, dass
  wir Pläne oder Beschlüsse aus dem parlamentarischen Raum von dieser Stelle aus grundsätzlich
  nicht kommentieren. Die vorgeschlagenen Maßnahmen werden nun sorgfältig geprüft.
  Vor allem wird dabei auch die aktuelle Haushaltslage beachtet. Nach wie vor ist
  es für die Bundesregierung wichtig, die Herausforderungen, die für den Luftverkehrsstandort
  existieren, weiter anzugehen und weiter zu verbessern. Das Ziel der Bundesregierung
  ist ein leistungsfähiger und wettbewerbsfähiger Luftverkehr in Deutschland. Gleichzeitig
  hat sich Deutschland verpflichtet, die Klimaziele zu erfüllen. Sehen Sie dazu einen
  Widerspruch? Nein, dazu sehen wir keinen Widerspruch, weil hier bereits viel getan
  wird und der Luftverkehr auch seinen Beitrag zum Klimaschutz leistet. Entscheidend
  dabei ist vor allen Dingen, dass die Dekarbonisierung des Luftverkehrs konsequent
  vorangetrieben wird. Das ist es, worauf es ankommt. Dazu gehört eine Reihe von Maßnahmen,
  zum Beispiel der Hochlauf nachhaltiger Flugkraftstoffe. Dann gibt es europarechtliche
  Vorgaben, um den Einsatz nachhaltiger Flugkraftstoffe zu fördern. Das Verkehrsministerium
  fördert beispielsweise mit 2 Milliarden Euro strombasiertes erneuerbares Kerosin.
  Eine andere Maßnahme ist eine Bodenstromförderung, die die klimafreundliche Infrastruktur
  an Flughäfen stärkt. Das heißt, wenn ein Flugzeug am Boden gewartet und beladen
  wird, wird es mit Direktstrom versorgt. Das spart bis zu 300 Liter Kerosin pro Stunde.
  ‑ All das sind Maßnahmen, die dafür sorgen, dass Luftverkehr und Klimaschutz Hand
  in Hand gehen. Herr Kornelius, es gab ja diese Phishingmails, die angeblich von
  der CDU Heilbronn abgesandt worden sind und auch den Kanzler erreicht haben. Ich
  bitte Sie kurz um eine Einschätzung: Wie schwerwiegend war das? Wie besorgt ist
  man darüber? Wie gut ist die Bundesregierung insgesamt vor solchen Phishingmails
  geschützt? Wir haben die Berichterstattung dazu natürlich zur Kenntnis genommen.
  Ich kann Sie allerdings nur auf die laufenden Ermittlungen des LKA in Baden-Württemberg
  verweisen. Aus Sicherheitsüberlegungen erteilen wir darüber keine Auskunft, und
  zwar grundsätzlich nicht. Die Kommunikationsmittel des Bundeskanzlers und die Form,
  welche Vorgaben, welche Techniken angewandt werden, werden wir nicht teilen. Wir
  haben speziell abgesicherte Kommunikationskanäle, und Sie können sich sicher sein,
  dass sowohl die Regierungsstellen wie auch die Akteure stets sensibilisiert sind
  und sich auch adäquat verhalten, um solchen Attacken quasi auch durch persönliches
  Verhalten vorzubeugen. Ich kann dazu ganz grundsätzlich noch sagen ‑ ich glaube
  aber, das haben wir hier schon öfter gesagt ‑: Das BSI leistet mit regelmäßigen
  Updates Unterstützung, was den Umgang mit Phishing-E‑Mails oder Ähnlichem angeht.
  Das passiert grundsätzlich und fortlaufend. Plant das BMI angesichts des jüngsten
  Zwischenfalls am Flughafen Leipzig/Halle, wo ein Fahrzeug den äußeren Sicherheitszaun
  durchbrochen haben soll, zusätzliche akute Sicherheitsmaßnahmen an den Flughäfen?
  Grundsätzlich ist es so, dass an Flughäfen ein Sicherheitsverbund agiert, um die
  Sicherheit von Flughäfen zu gewährleisten. Das sind in diesem Fall die Landespolizei,
  der Flughafenbetreiber und die Bundespolizei. Die Sicherheit wird dadurch gut gewährleistet,
  und auch in diesem Fall wurde entsprechend agiert. Wenn Sie konkrete Fragen zu diesem
  Fall haben, dann würde ich Sie tatsächlich an die Landespolizei verweisen, die dort
  zuständig ist und ermittelt bzw. auch schon ermittelt hat. Als oberste Luftsicherheitsbehörde
  sieht das BMI jetzt keinen relevanten Handlungsbedarf? Ganz grundsätzlich wird immer
  wieder überprüft und fortlaufend geschaut, ob die Sicherheit durch die aktuellen
  Maßnahmen gewährleistet ist. Diese Prüfung findet grundsätzlich fortlaufend und
  ständig statt. Aber nicht jetzt ad hoc wegen dieses Zwischenfalls? Dazu kann ich
  Ihnen jetzt konkret nichts sagen. An den Regierungssprecher zu dem vorhin hier an
  dieser Stelle vorgestellten Brief der migrantischen Dachverbände: Wie stehen Sie
  zu der Forderung, eine Bund-Länder-Kommission zum Schutz von Minderheiten einzurichten?
  Die Bundesregierung hat Beauftragte für diese Fragen. Die Integrationsbeauftragte
  befasst sich fortlaufend mit diesem Thema. Es gibt auch Fachressorts, die Teilaspekte
  stets behandeln. Insofern, glaube ich, ist das Thema in der Bundesregierung gewürdigt.
  Die Verbände fordern jetzt eine schriftliche Antwort innerhalb von 14 Tagen. Werden
  Sie dieser Forderung nachkommen? Ich glaube, die Regierung muss auf öffentliche
  Forderungen zunächst nicht reagieren. Einen öffentlich vorgestellten Brief wird
  sie in der Regel auch nicht öffentlich beantworten. Sie wird sich des Anliegens
  aber sicherlich annehmen. Die geplante Verordnung gegen Betrugsversuche bei Deutschtests
  im Einbürgerungsverfahren sollte eigentlich am 1. November in Kraft treten. Können
  Sie uns auf den Stand bringen, wie da die aktuelle Lage ist? Wird das am 1. November
  in Kraft gesetzt? Gab es da noch einmal Veränderungen im Referentenentwurf, oder
  kommt das so wie beabsichtigt? Ja, das ist weiterhin geplant. Die Änderung der Integrationskurs-Testverordnung
  wird am 20. Oktober, also morgen, verkündet und soll dann am 1. November in Kraft
  treten. Sie wollen damit Betrug verhindern. Gibt es im Ministerium Zahlen darüber,
  in welchem Umfang bei diesen Tests in der letzten Zeit betrogen worden ist? Das
  lässt sich nicht exakt beziffern. Die Zahl der Verdachtsfälle liegt wahrscheinlich
  eher im geringen Bereich. Aber wie gesagt, konkrete Zahlen haben wir dazu nicht.
  Grundsätzlich ist aber natürlich wichtig, dass solche Fälle auch dann, wenn die
  Fallzahlen im geringen Bereich liegen, verhindert werden. Es ist eine der Kernaufgaben
  des Staates, zu gewährleisten, dass die Bevölkerung dem Staat und seinem Handeln
  vertrauen kann, und das wollen wir mit dieser Änderung noch einmal verstärken. Wie
  gesagt, ich kann es nicht genau beziffern. Ich schaue gerne noch einmal nach, ob
  man es genau beziffern kann. Nach meinem Kenntnisstand ist die konkrete Zahl der
  Betrugsfälle nicht genau bezifferbar. Sollte diese Möglichkeit doch bestehen, dann
  liefere ich es nach. Nur zur Sicherheit, damit beim nächsten Mal nicht gesagt wird
  „Sie haben es nicht nachgeliefert“: Sollte es möglich sein, dann liefern wir es
  nach. Wenn Sie von einer geringen Zahl sprechen, dann werden Sie ja zumindest eine
  Größenordnung ‑ eine relative Zahl, eine absolute Zahl ‑ im Kopf haben. Beim Missbrauch
  in Sachen Arbeitslosengeld II haben wir auch immer wieder von geringen Zahlen gehört;
  das lag dann im Promillebereich. Insofern wäre es hilfreich, wenn Sie uns dazu etwas
  sagen könnten. Das kann ich nachvollziehen. Wie gesagt, wenn man es konkreter sagen
  kann, dann liefern wir es nach ‑ mit Betonung auf dem „wenn“. Sie bekommen die Zahlen,
  wenn sie nachzuliefern sind. Wenn Sie von „gering“ sprechen, werden Sie ja etwas
  haben. Frau Deschauer, haben Sie eigene Erkenntnisse zu dem Angriff auf einen EU-Diplomaten
  im Westjordanland? Ich kann vielleicht kurz sagen, dass da keine deutschen Diplomatinnen
  und Diplomaten beteiligt waren. Insofern beschränkt sich unser Erkenntnisstand auf
  das, was wir im Austausch mit Kolleginnen und Kollegen besprechen können. Ich möchte
  auch noch darauf verweisen, dass sich die Leiterin unseres Vertretungsbüros in Ramallah
  geäußert hat. Grundsätzlich muss man Angriffe auf Diplomatinnen und Diplomaten ‑
  es war auch die Rede von einer Journalistin ‑ natürlich kritisieren. Die Berichte
  vom Wochenende sind besorgniserregend, und ich glaube, die beteiligten Seiten haben
  sich dazu verschiedentlich schon öffentlich geäußert. Ich habe zumindest vernommen,
  dass dazu Statements aus Frankreich, Polen, Belgien, aber auch von israelischer
  Seite kamen ‑ auch mit einer entsprechenden Verurteilung durch den israelischen
  Außenminister, die ich wahrgenommen habe. Gleichwohl wurde das verbunden mit dem
  Petitum und der Aufforderung ‑ der wir uns anschließen ‑, dass es zu einer Aufklärung
  kommen muss. Sie äußern ja immer wieder Kritik an der Siedlergewalt. Warum werden
  Sie in Israel nicht gehört? Ich habe gerade eben noch eine Nachricht gesehen ‑ wobei
  wir natürlich immer das Petitum voranstellen, dass Aufklärung notwendig ist ‑, wonach
  über Agenturen mitgeteilt wurde, dass Fahrzeuge und Gegenstände beschlagnahmt worden
  seien und Verdächtige mit mutmaßlichen Straftaten in Verbindung gebracht worden
  seien. Insofern würde ich mir die Prämisse in Ihrer Frage nicht zu eigen machen.
  Sie haben darauf hingewiesen: Deutsche Diplomaten waren an der Mission nicht beteiligt.
  Es waren französische, belgische und polnische Diplomaten. War Deutschland gefragt
  worden oder nicht? Als einer der größeren Akteure im Hinblick auf die Region hätte
  man sich ja auch deutsche Teilnehmer vorstellen können. Das kann ich Ihnen aus dem
  Stegreif tatsächlich nicht sagen; diese Kenntnis habe ich nicht. Unsere grundsätzliche
  Haltung, dass wir uns sehr regelmäßig gegen auch gewalttätiges Vorgehen von Siedlern
  im Westjordanland aussprechen, ist davon aber unbenommen. Premierminister Netanjahu
  hat die Kritik an gewalttätigen Siedlern als eine Kampagne gegen diese Siedler bezeichnet.
  Wie bewertet die Bundesregierung eine solche Haltung, eine solche Einstellung? Das
  möchte ich nicht bewerten. Ich kann noch einmal auf die verschiedenen Äußerungen
  auch unserer europäischen Diplomatenkolleginnen und ‑kollegen hinweisen, die unsere
  Solidarität haben. Auch die Leiterin unseres Vertretungsbüros in Ramallah hat sich
  geäußert. Wir haben auch zur Kenntnis genommen ‑ und das würde ich positiv unterstreichen ‑,
  dass auch von israelischer Seite entsprechende Aufklärung angestrebt wird. Sie haben
  gerade auf die Verurteilung von europäischer Seite verwiesen, selber aber keine
  Verurteilung ausgesprochen. Warum nicht? Die Wortwahl, die wir hier oder auch an
  anderer Stelle nutzen, bleibt immer noch uns überlassen. Ich habe Ihnen aber klar
  gemacht, dass wir solidarisch mit unseren Kolleginnen und Kollegen sind und uns
  regelmäßig zu dem Themenkomplex äußern. Niemand hat bestritten, dass es Ihnen überlassen
  ist, was Sie sagen. Ich habe gefragt, warum Sie auf die Verurteilung durch die europäischen
  Partner verweisen, gleichzeitig aber nicht selbst verurteilen. Diese Diskrepanz
  steht jetzt hier im Raum, und ich frage danach. Herr Kollege, wollen Sie mich jetzt
  ausreden lassen oder wollen wir das Gespräch beenden? [….] Herr Kollege hat seine
  Frage gestellt, und jetzt ist Frau Deschauer dran. Sie haben eine Antwort erhalten.
  Wir haben volle Solidarität gegenüber unseren europäischen Kolleginnen und Kollegen
  geäußert und unterstützen selbstverständlich sowohl die Forderungen nach einer entsprechenden
  Aufklärung als auch die bereits unternommenen Schritte in diese Richtung. Ich würde
  mir von der Moderation wünschen, dass, wenn hier behauptet wird, dass keine Diskrepanz
  im Raum steht, wenn wir eine Verurteilung hören ‑ ‑ ‑ Das ist doch Quatsch. Herr
  Kollege, ich muss mir von Ihnen nicht erklären lassen, wie ich meine Moderation
  zu machen habe. Aber so ein Antwortverhalten ist nicht in Ordnung. Zum Thema Irans,
  Frau Deschauer: Der iranische Botschafter wurde heute vom Auswärtigen Amt einbestellt.
  Können Sie erläutern, was dem Botschafter gesagt wurde? Ich empfehle, am besten
  den X-Post, den wir dazu vom Account des Auswärtigen Amtes veröffentlicht haben
  ‑ es muss vor ungefähr einer Stunde gewesen sein ‑, noch einmal nachzuvollziehen.
  Wir nehmen Bezug auf das Urteil des OLG in der vergangenen Woche. Wir haben dort
  noch einmal verdeutlicht, dass wir eine Bedrohung jüdischen Lebens in Deutschland,
  aber auch von Unterstützerinnen und Unterstützern, in keiner Weise tolerieren. Das
  wurde dem iranischen Botschafter noch einmal in aller Deutlichkeit zum Ausdruck
  gebracht. Der Außenminister hatte sich am Freitag ja dazu auch geäußert. Er hat
  gesagt: Wir werden reagieren. ‑ War die Einbestellung jetzt die Reaktion, oder kommt
  noch mehr? Ich glaube, die Einbestellung und auch die Deutlichkeit, in der wir das
  öffentlich gemacht haben, spricht schon einmal für sich. Sie können auch dem X-Post
  entnehmen, dass wir natürlich in der Handlung bereits früher in diesem Jahr mit
  dafür gesorgt haben, dass diejenigen, die maßgebliche Drahtzieher vereitelter Terroranschläge
  in Europa und in Deutschland sind, nun auch in der EU terrorgelistet sind. Das sind
  die Revolutionsgarden. Das ist zum Beispiel eine sehr konkrete Maßnahme, die auch
  maßgeblich durch deutsches Betreiben nach langwierigeren Verhandlungen zu einem
  Ziel geführt hat. Ich habe eine Frage an Herrn Kornelius zum Thema der Ukraine.
  Mit Blick darauf ist ja momentan einiges in Bewegung geraten. Der US-Präsident scheint
  sich diesbezüglich jetzt doch mittlerweile mehr auf die Seite Putins geschlagen
  zu haben. Selenskyj hat auch offene Kritik geübt. Jetzt gibt es ja die Idee oder
  den Vorschlag Putins, dass es ein Treffen Putins, Trumps und Xis geben sollte, also
  noch nicht einmal mit Herrn Selenskyj. Was halten Sie von dem Vorschlag? Ich habe
  keine eigene Kenntnis bezüglich dieses Vorschlags. Ich entnehme es auch nur den
  Medien. Ich glaube, es mangelt nicht an Vorschlägen, diesen Krieg diplomatisch beizulegen,
  vonseiten der Ukraine. Es wäre sinnvoll, auf diese Vorschläge einzugehen, denn dieser
  Weg wird nur mit dem angegriffenen Land auch beendet werden können. Frau Deschauer,
  Präsident Selenskyj spricht von einer russisch-US-amerikanischen Allianz gegen die
  Ukraine, der sie nicht widerstehen könnte, militärisch und am Ende auch existenziell.
  Teilen die Bundesregierung und das Auswärtige Amt die Einschätzung, dass eine solche
  Allianz existiert? Ich möchte nicht jede einzelne Aussage im Detail kommentieren.
  Ich kann vielleicht sagen, dass wir als Deutschland gemeinsam mit vielen Partnern
  im EU-NATO-Rahmen, aber auch im engen Austausch mit den amerikanischen Partnern
  selbstverständlich den russischen Angriffskrieg gegen die Ukraine heftig ablehnen
  und auch Deutschland insbesondere ein großer Unterstützer der Ukraine ist. Ich kann
  jetzt einzelne Beschreibungen und Qualifizierungen gar nicht in der Form kommentieren.
  Das Entscheidende ist, dass wir, insbesondere auch als Europäer, weiterhin maßgeblich
  die Ukraine unterstützen, damit sie die Chance hat, in dem Abwehrkampf auch in einem
  vermutlich sehr harten Winter ‑ das deutet sich ja jetzt schon an ‑ mit sehr zielgerichteten
  Angriffen auf die Energieinfrastruktur bestehen kann. Nun ist die Lageeinschätzung
  Präsident Selenskyjs ja so, dass er ‑ ich kann es nur noch einmal wiederholen ‑
  sagt, dass es offenbar eine russisch-amerikanische Allianz gibt. Ihr wird die Ukraine
  nicht widerstehen können. Wäre denn Europa Ihrer Meinung nach in der Lage, das,
  was von US-Seite dann wegfallen würde, zu kompensieren, oder in welcher Weise wäre
  Europa von einer Niederlage der Ukraine betroffen? Ich möchte mich gar nicht zu
  hypothetischen Fragestellungen äußern, sondern ich möchte mich dazu äußern, was
  wir tun, wie ich es gerade schon getan habe. Wir sind bestrebt, die Ukraine in die
  Lage zu versetzen, sich weiterhin gegen diesen massiven Angriffskrieg zu wehren.
  Wenn Sie russisch-amerikanische, sagen wir einmal, Gespräche ‑ vielleicht muss man
  es so formulieren ‑ ansprechen: Wir haben auch immer gesagt, dass es natürlich zu
  entsprechenden Gesprächen unter Einbeziehung der Ukrainer selbst kommen muss. Das
  wäre der richtige Ansatz. Das ist der richtige Weg nach vorn. Am Ende wird die Ukraine
  entscheiden, was für sie ein verantwortbarer Frieden ist. Aber das funktioniert
  natürlich nur, wenn diejenigen, die betroffen sind, dabei eine maßgebliche Rolle
  haben. Herr Kornelius, wie bewerten die Bundesregierung und der Bundeskanzler die
  Drosselung von Starlink, die auf Betreiben von Herrn Musk durchgeführt wurde und
  damit den Russen geholfen hat? Wir haben diese Meldung auch zur Kenntnis genommen.
  Uns liegen dabei allerdings keine gesicherten Erkenntnisse vor. Die Einschränkungen
  sollen ja momentan wieder aufgehoben sein. Davon müssen wir gerade ausgehen. Ist
  denn Herr Musk immer noch ein gern gesehener Investor hier, in Deutschland, wenn
  er dem Feind hilft? Ich glaube, dass wir momentan nicht über potenzielle Investitionen
  von Herrn Musk sprechen, sondern wir sprechen darüber, welche Unterstützung für
  die Ukraine es gibt. Ich hatte eben gesagt, dass wir keine gesicherten Erkenntnisse
  haben, dass diese Einschränkungen nach wie vor wirksam sind. Herr Kornelius, können
  Sie uns einen Überblick geben, inwieweit die Bundesregierung auch auf Starlink zurückgreift?
  Ich weiß nicht, ob das BMVg das kann, aber ich glaube, wir geben über solche operativen
  Erkenntnisse keine Auskunft. Das ist korrekt. Ich kann ja bloß für den Geschäftsbereich
  des BMVg sprechen. Natürlich gibt es noch andere Behörden, die dann für sich sprechen
  müssten. Wir haben bei uns Satellitenlösungen, die sich größtenteils auf eigene
  Satellitennetzwerke stützen. Zum Beispiel für die Truppenkommunikation nutzen wir
  über externe „contractors“ auch andere Möglichkeiten. Aber die eigenen Kommunikationsmittel
  stützen sich auf eigene Kommunikationsmöglichkeiten, eigene Verschlüsselung und
  eigenständigen Betrieb. Darüber hinaus kann ich bezüglich der Frage, was wir im
  Detail für was nutzen, keine Auskunft geben. Aber Starlink ist dabei. Steht das
  jetzt angesichts der jüngsten Entwicklung irgendwie auf dem Prüfstand? Ich habe
  nicht gesagt, dass Starlink dabei ist. Herr Kornelius, warum wird es am Mittwoch
  keine Kabinettssitzung geben? Es gibt allerdings natürlich eine Kabinettsplanung,
  und die Kabinettsplanung ist bis zum Ende des Jahres auch vollgepackt. Es wurde
  jetzt wegen der Herbstferien eine Pause eingelegt. Allerdings können Sie sicher
  sein, dass die Vorbereitung von Kabinettsthemen permanent weitergeht, auch die Arbeit
  an unterschiedlichen Gesetzgebungsvorhaben. Wir werden Ihre Entzugserscheinungen
  hoffentlich bald beheben können. Ist es neu, dass während der Herbstferien Kabinettspause
  ist? Ich weiß nicht, an wen genau in der Bundesregierung die Frage geht. Migrantenverbände
  haben jetzt gefordert, dass es für Asylsuchende nach einer möglichen Regierungsübernahme
  der AfD in Sachsen-Anhalt eine Wegzugsregelung aus Sachsen-Anhalt geben solle, und
  zwar in einem offenen Brief, der sich sowohl an die Landesregierung als auch an
  die Bundesregierung richtet. Hat die Bundesregierung Kenntnis von dem Brief? Sieht
  sie die Möglichkeit für eine solche Wegzugregelung? Ich will Sie nicht zu sehr korrigieren,
  Herr Kollege, aber wir hatten das Thema vorhin schon. Herr Kollege hat exakt danach
  gefragt. Dann war ich da einen Moment unaufmerksam. Ich bitte um Entschuldigung.
  Aber vielleicht will der Regierungssprecher jetzt noch einmal die Frage nach dem
  Brief beantworten. Ich hatte vorhin gesagt, dass wir öffentliche Briefe prinzipiell
  nicht kommentieren. Außerdem bezieht sich Ihre Frage auf eine hypothetische Situation,
  die nicht eingetreten ist. Deswegen möchte ich auch keine hypothetische Antwort
  geben.'
