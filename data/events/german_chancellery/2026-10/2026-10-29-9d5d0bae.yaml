title: 'Bundeskanzler Merz zum EU-Kanada-Gipfel:'
text: '„Mit dem Gipfeltreffen begründen die Europäische Union und Kanada eine „Allianz
  für die Zukunft". Wir Europäer schlagen damit nicht nur ein völlig neues Kapitel
  in den Beziehungen zu einem unserer engsten Verbündeten auf, sondern gehen eine
  einzigartige Verbindung zu einem Partner außerhalb der EU ein. Dieser Schritt gründet
  auf geteilten Werten und einem tiefen Vertrauensfundament, das uns in einer unsicherer
  gewordenen Welt verbindet. Diese beispiellose Initiative wird alle Aspekte unserer
  Partnerschaft umfassen: Sicherheit und Verteidigung, Wachstum und Beschäftigung,
  nachhaltige Entwicklung und zwischenmenschliche Kontakte. Mit der Allianz für die
  Zukunft rücken Kanada und die Europäische Union auf einzigartige Weise zusammen.
  Gemeinsam wollen wir eine neue strategische Partnerschaft schaffen, in der wir Wohlstand
  und wirtschaftliche Sicherheit für unsere Bevölkerungen sichern und fördern.“ - Englische
  Übersetzung - “In this summit, the European Union and Canada are establishing an
  "Alliance for the Future." In doing so, we Europeans are not only opening an entirely
  new chapter in our relations with one of our closest allies, but also forging a
  unique partnership with a country outside the European Union. This step is rooted
  in shared values and a deep foundation of trust that unites us in an increasingly
  uncertain world. This unprecedented initiative will encompass every aspect of our
  partnership: security and defence, growth and employment, sustainable development,
  and people-to-people ties. Through the Alliance for the Future, Canada and the European
  Union are forging closer ties in a truly unique way. Together, we aim to build a
  new strategic partnership that safeguards and promotes prosperity and economic security
  for our citizens.”'
