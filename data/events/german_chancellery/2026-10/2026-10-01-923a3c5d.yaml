date: '2026-10-01'
type: press_release
source_name: german_chancellery
title: Laudatio des Kanzlers zur Verleihung des Westfälischen Friedenspreises NATO
  erhält Preis des Westfälischen Friedens
text: 'Deutschland werde weiter in militärische Stärke und wirtschaftliche Resilienz
  investieren, betonte Bundeskanzler Merz. Die NATO bürge für Sicherheit und Frieden
  im euro-atlantischen Raum, betonte Bundeskanzler Friedrich Merz in seiner Laudatio
  zur Verleihung des Preises des Westfälischen Friedens an die NATO . Stellvertretend
  für die NATO nahm NATO -Generalsekretär Mark Rutte den Preis der Wirtschaftlichen
  Gesellschaft Westfalen und Lippe im Münsteraner Rathaus entgegen. Auch die Jugendorganisation
  socioMovens aus Dortmund wurde gefeiert, die Jugendliche aus ganz Europa für ein
  friedliches Miteinander zusammenbringt. Der Westfälische Frieden von 1648 habe den
  Boden für eine europäische Ordnung bereitet. Ihr Kern sei die Gleichheit der Staaten,
  die Herrschaft des Rechts, das Verbot, Grenzen mit Gewalt zu verschieben und das
  Prinzip kollektiver Sicherheit, betonte der Kanzler. „In dieser Hinsicht stehen
  wir in der Westfälischen Tradition.“ Die NATO sei zu einer tragenden Säule dieser
  Ordnung geworden. Sie schütze die Sicherheit und den Wohlstand und diene dem Frieden.
  Weiterführende Informationen zur Unterstützung Deutschlands an die Ukraine finden
  Sie hier . Alle zwei Jahre verleiht die Wirtschaftliche Gesellschaft Westfalen und
  Lippe den Internationalen Preis des Westfälischen Friedens und zeichnet damit besonderes
  Engagement für nachhaltigen Frieden und internationale Verständigung aus. Sehr geehrter
  Herr Generalsekretär, lieber Mark Rutte, sehr geehrter Herr Ministerpräsident, lieber
  Henrik Wüst, liebe Kolleginnen und Kollegen des Deutschen Bundestages und des nordrhein-westfälischen
  Landtages, sehr geehrte, liebe Kuratoren der Wirtschaftlichen Gesellschaft für Westfalen
  und Lippe, sehr geehrte Vertreter der Jury des Westfälischen Friedenspreises, wir
  ehren heute die NATO mit dem Internationalen Preis des Westfälischen Friedens. Wir
  feiern auch die Jugendorganisation socioMovens aus Dortmund, die Jugendliche aus
  ganz Europa zusammenbringt, für ein friedliches und menschliches Miteinander auf
  unserem Kontinent. Lieber Mark, ich freue mich, dass du heute den Preis für die
  NATO entgegennimmst. Du hältst die NATO in fordernder Zeit zusammen, mit transatlantischem
  und europäischem Kompass, mit unbändiger Energie und unerschütterlicher Zuversicht.
  Dass der Preis des Westfälischen Friedens an ein Militärbündnis geht, hat manchen
  überrascht. Offenbar bedarf das der Erläuterung. Der Westfälische Friede beendete,
  wie wir alle wissen, 1648 einen Krieg der Kriege, wie ihn Europa bis dahin nicht
  gekannt hatte. Wer damals dreißig Jahre alt war, der hatte wie Grimmelshausens Simplicissimus
  ein Leben lang nichts anderes gesehen als die Verheerungen des Krieges. Der Friede,
  den der Diplomat Maximilian Graf Trauttmansdorff und die 150 Gesandten damals in
  Münster und Osnabrück nach fünf Jahren aushandelten, wirkte weit über den Tag hinaus.
  Es war ein wahrer Frieden, der nicht nur das Blutvergießen beendete. Er bereitete
  den Boden für eine neue europäische Ordnung. Ihr Kern lässt sich in den Begriffen
  unserer Gegenwart so umreißen: die souveräne Gleichheit der Staaten, die Herrschaft
  des Rechts, das Verbot, Grenzen mit Gewalt zu verschieben und das Prinzip kollektiver
  Sicherheit. Diese westfälische Ordnung setzte der Macht der Großen Grenzen. Sie
  bot erstmalig auch mittleren Mächten und Kleinstaaten Sicherheit, Stabilität und
  Schutz. Sie zähmte das Recht des Stärkeren durch die Stärke des Rechts. Im Laufe
  der Jahrhunderte sind diese Grundsätze auf deutschem und europäischem Boden immer
  wieder verletzt worden. Sie sind in blutigen Kriegen ins Wanken gekommen. In zwei
  Weltkriegen sind sie erst erschüttert und dann zerstört worden. Nach dem Zweiten
  Weltkrieg entstand eine neue europäische Sicherheitsarchitektur. Die Vorzeichen
  waren ganz andere als 1648. Aber die neue Ordnung übersetzte auch Grundprinzipien
  des westfälischen Systems in eine neue Zeit. Ihnen fügte sie im euroatlantischen
  Raum ein wichtiges Leitprinzip hinzu, nämlich die Würde und die Freiheit jedes einzelnen
  Menschen in demokratischen Staaten. Die NATO wurde relativ bald nach dem Zweiten
  Weltkrieg zu einer tragenden Säule dieser Ordnung. Seit drei Generationen bürgt
  sie nun für Sicherheit und Frieden im euroatlantischen Raum. Sie ist bis heute vor
  allem anderen eine Allianz der Freiheit. Sie steht auch in der Tradition von Münster
  und Osnabrück. Sie schützt unsere Sicherheit und unseren Wohlstand. Sie dient dem
  Frieden. Das würdigt heute der Preis des Westfälischen Friedens. Die heutige Feier
  macht uns aber auch bewusst, wie wertvoll wahrer Frieden ist. Frieden ist mehr als
  die Abwesenheit von Krieg. Frieden ist ein Zustand, in dem wir wagen können, einander
  zu vertrauen und zusammenzuarbeiten, sicher, nach fairen Regeln, unter Gleichen
  ‑ und vor allem: in Freiheit. Vor einigen Jahren noch haben einige gefragt: Wozu
  brauchen wir die NATO überhaupt noch? Heute ist mit Händen zu greifen: Die europäische
  Friedensordnung, deren Wurzeln auch nach Münster und Osnabrück reichen, ist grundlegend
  herausgefordert. Unsere Freiheit steht auf dem Spiel ‑ durch ein neues Zeitalter
  der Großmachtpolitik, in dem wir auch unsere transatlantische Partnerschaft neu
  begründen müssen, durch technologische Revolutionen, die unsere Welt schneller und
  tiefgreifender verändern als alles, was wir bisher gesehen und gekannt haben. Aber
  am unmittelbarsten sind Frieden und Freiheit heute durch den gewalttätigen, expansiven
  Revisionismus Russlands bedroht. Diese Bedrohung ist nicht abstrakt. In der Ukraine,
  gleich jenseits der Grenze der NATO , tobt seit fast fünf Jahren ein mörderischer
  Krieg. Entfesselt hat ihn Russland, in Missachtung und Verachtung der Grundsätze,
  die noch mit der früheren Sowjetunion ausverhandelt waren. Verankert sind diese
  Grundsätze insbesondere in der Charta von Paris, dem Schlussdokument des KSZE-Sondergipfels
  aus dem Jahre 1990, das von den Prinzipien des Westfälischen Friedens geprägt ist.
  Die Zerstörung, die der russische Angriffskrieg nun angerichtet hat, sie ist gewaltig.
  Die Schäden an bombardierten Häusern, Brücken, Kraftwerken, Schulen, Altenheimen,
  Krankenhäusern belaufen sich auf mehrere Hundert Milliarden Euro. Aber dies allein
  ist nicht das Entscheidende. Die Zahl der Toten und Verletzten, die dieser Krieg
  auf beiden Seiten gefordert hat, sie ist mittlerweile siebenstellig. Sie beträgt
  mehr als eine Million. Das menschliche Leid dieses Krieges lässt sich nicht beziffern.
  Dieses Leid und die Tapferkeit, mit der die Ukrainer ihm trotzen, berührt uns. Die
  Grausamkeit der Angreifer, sie stößt uns ab. Vor allem aber haben wir begriffen:
  Dieser Krieg geht uns etwas an, sehr direkt sogar, denn in der Ukraine steht auch
  die Sicherheit Europas, unsere Sicherheit, auf dem Spiel. Es geht eben auch um uns. ‑
  Russland bricht in der Ukraine mit äußerster Brutalität die grundlegendsten Regeln
  des Völkerrechts und der europäischen Ordnung, die uns bisher geschützt haben. Deshalb
  ist und bleibt es richtig, dass wir die Ukraine mit aller Kraft unterstützen. Deshalb
  dürfen und werden wir uns durch Moskaus hybride Angriffe wie zuletzt den von Leipzig,
  mitten in Deutschland, nicht beirren lassen, denn gelingt es nicht, Moskau Einhalt
  zu gebieten, dann wird sich die russische Kriegsmaschinerie früher oder später auch
  gegen uns, gegen die NATO selbst, richten. Vor dieser Gefahr dürfen wir nicht die
  Augen verschließen. Drei Generationen nach 1945 käme der Krieg zurück in unseren
  Teil Europas. Würde dann das Baltikum zu einem Schlachtfeld des Drohnenkampfes wie
  heute der Donbass? Welchen europäischen Großstädten würden die ballistischen Raketen
  gelten, die Russland heute auf die Bevölkerung von Kyjiw und Charkiw feuert? Würden
  am Ende auch wir Deutsche das Grauen des Krieges wieder am eigenen Leib zu spüren
  bekommen? Meine Damen und Herren, unsere dringlichste europäische und transatlantische
  Verantwortung ist heute, mit aller Kraft abzuwenden, dass es so weit kommt. Dazu
  brauchen wir zunächst ein realistisches Bild von Russland. Der deutsche Historiker
  Martin Schulze Wessel hat dazu jüngst ganz grundlegende wissenschaftliche Untersuchungen
  veröffentlicht. Wir alle sind gut beraten, differenziert über Russland zu urteilen.
  Wir wollen auch nach fünf mörderischen Kriegsjahren nicht den Sinn für Nuancen und
  Schattierungen verlieren. Aber wir müssen auch das Wesentliche sehen. Russland verfolgt
  heute eine revisionistische, imperiale Expansion. Es geht der Moskauer Führung um
  die Wiederherstellung einer wahren oder erträumten einstigen Größe. Eine direkte
  Linie weist von Russlands Eingreifen in Georgien über die Annexion der Krim und
  der ersten Landnahme im Donbass 2014 eben bis hin zur Vollinvasion in der Ukraine
  seit dem 24. Februar 2022. Indem Russland von Noworossija, von Neurussland, spricht,
  sucht Moskau, den irreführenden und geschichtsrevisionistischen Eindruck zu erwecken,
  die ukrainische Schwarzmeerküste sei von alters her Teil Russlands gewesen. Diesen
  Geschichtsrevisionismus können wir nicht ignorieren. Ziel ist nicht nur die Wiederherstellung
  eines vergangenen angeblichen Reichs. Präsident Putin sagt, Zitat: „Wo der Fuß eines
  russischen Soldaten steht, da ist Russland.“ Meine Damen und Herren, der Verweis
  auf Sicherheitsinteressen ist dabei eine Chiffre für den Anspruch auf eine Einflusssphäre.
  Dieser Anspruch geht zulasten der Souveränität vieler betroffener Nachbarn Russlands.
  Nur wenn wir dieses Denkmuster erkennen, kann Diplomatie eines Tages gegen Moskau
  tatsächlich gelingen. Russland respektiert vor allem Stärke. Lassen Sie mich betonen:
  Wir wollen zu geeigneter Zeit stabile, berechenbare Beziehungen zu Russland. Wir
  wollen vor allem, dass Russland seinen Angriffskrieg gegen die Ukraine beendet und
  zur europäischen Friedensordnung zurückkehrt. Dazu ist Russland nach Lage der Dinge
  heute nicht bereit. In den vergangenen Jahren sind viele diplomatische Gesprächsangebote
  in Moskau auf taube Ohren gestoßen, zuletzt am vergangenen Wochenende am Rande der
  UN-Vollversammlung in New York. Aber die Sprache der Stärke versteht man im Kreml
  offenbar. Russland musste auf Polen hören, das sich in den Zwanzigerjahren des vergangenen
  Jahrhunderts der russischen Expansion entgegenstellte. Es musste auf Finnland hören,
  dass der Sowjetunion seine Freiheit abtrotzte. Diese Lehren aus der Geschichte haben
  unsere nord- und osteuropäischen Nachbarn schmerzhaft gezogen und tief verinnerlicht.
  Wir sollten ihre kollektive Erfahrung ernst nehmen. Ich füge hinzu: Das sollten
  wir tun, ohne dabei den Sinn für die Möglichkeit und die Notwendigkeit einer Verhandlungslösung
  zu verlieren. Auch das wird uns helfen, Russland zu ernsthaften Friedensgesprächen
  zu bewegen. Aber Russland wird eher verhandeln, wenn wir ihm geschlossen entgegentreten.
  Wo der Westen Russland uneinig begegnet, waren immer wieder die Nachbarn im Osten
  Europas die Leidtragenden. Geschlossenheit gegenüber Moskau hat sich dagegen immer
  bewährt. Die NATO ist das beste Beispiel. Die Eintracht und die Stärke des Bündnisses
  haben seit 1949 dazu beigetragen, eine kriegerische Auseinandersetzung mit Russland
  zu verhindern. Sie haben überhaupt erst die Voraussetzungen für Dialog geschaffen.
  Das war 1967 die Grundidee des Harmel-Berichts. Es war genauso 1979 der Kerngedanke
  des sogenannten NATO -Doppelbeschlusses. Eintracht und Stärke sind auch heute Erfolgsbedingungen
  für Verhandlungen mit Moskau. Das kann uns nur ermutigen, auch die Vereinigten Staaten
  von Amerika in der Ukrainepolitik an unserer Seite zu halten. Es war ein wichtiger
  Erfolg, dass uns das beim Gipfel der G7 in Évian vor einigen Wochen gelungen ist.
  Dass der Kongress unlängst das Graham-Sanktionsgesetz verabschiedet hat und dass
  Präsident Trump das Gesetz unterzeichnet hat, zeigt: Unsere Hartnäckigkeit zahlt
  sich aus. Mich bestärkt das jedenfalls darin, weiter um Washington zu werben. Aber
  entscheidend ist und bleibt, dass Europa zusammenbleibt, und das tun wir. Wer hätte
  denn vor fünf Jahren gedacht, mit welcher Ausdauer und Entschiedenheit wir Europäer
  uns an die Seite Kyjiws stellen würden? Seit zwei Jahren leistet Europa den wesentlichen
  Teil der Hilfen für die Ukraine. Hier manifestiert sich wohl stärker als in jeder
  anderen Frage: Europa kommt sicherheitspolitisch zu sich selbst. Für die Ukraine
  ist dieses europäische Erwachen heute eine Rettung in hoher Not. In dieser neuen
  Zeit ist es aber auch und vor allem in unserem fundamentalen Interesse. Dieses Ringen
  um Geschlossenheit ist mühsam. Aber es ist entscheidend auf dem Weg zum Frieden
  in der Ukraine und zur Sicherheit für ganz Europa. Dieser Krieg darf Europa nicht
  spalten. Das ist allen anderen außenpolitischen Zielen übergeordnet. Auch in Deutschland
  werden wir uns nicht spalten lassen, nicht durch hybride Angriffe, nicht durch von
  Moskaus Bots gesteuerte Hetze in den sozialen Medien und ‑ erlauben Sie es mir zu
  sagen ‑ auch nicht durch die Parolen der AfD und ihrer russischen Hintermänner.
  Wir alle spüren, wie schwer das in einer Öffentlichkeit ist, die immer stärker von
  Polarisierung, Streit und Wut bestimmt ist. Aber wir setzen uns mit dem Vorwurf
  auseinander, deutsche Hilfen für die Ukraine gingen zulasten des Wohlstands in unserem
  eigenen Land. Meine Antwort lautet: Unsere Unterstützung für die Ukraine ist kein
  Selbstzweck. Wir leisten sie vor allem anderen darum, um die Freiheit und die Sicherheit
  der Menschen in unserem Land zu schützen. Freiheit und Sicherheit sind die Voraussetzungen
  unseres Wohlstandes. Wir müssen auch denen antworten, die sagen, Russland sei durch
  eine immer weiter nach Osten ausgreifende NATO gewissermaßen in einen Notwehrexzess
  getrieben worden. Ja, wir sind gut beraten, solche Wahrnehmungen Moskaus ernst zu
  nehmen, und das tun wir, aber wir müssen auch widersprechen, wenn sich Täter selbst
  zum Opfer machen. Meine Damen und Herren, von unserem inneren und äußeren Frieden,
  von unserem Zusammenhang in Deutschland hängt heute viel ab für eine gute Zukunft
  unseres Landes, für Frieden in der Ukraine und für ein freies Europa insgesamt.
  Ob wir das nun wollen oder nicht, wir Deutsche tragen als die Macht in der Mitte
  Europas besondere Verantwortung, die weit über die Grenzen unseres eigenen Landes
  hinausgeht. Meine Damen und Herren, das leitet sich ab aus unserer Geografie, aus
  unserer Geschichte und nicht zuletzt aus unserem Grundgesetz, und ich sage es auch
  den Mitbürgerinnen und Mitbürger in unserem Land: Dieser Verantwortung müssen wir
  gemeinsam gerecht werden. Wir können sie mit Gelassenheit und mit Zuversicht annehmen,
  und gegenüber Russland können wir heute auf drei große Stärken setzen, die unser
  Land und die Europa ausmachen, nämlich auf Einigkeit und Recht und Freiheit. Ich
  wähle diese Begriffe sehr mit Bedacht. Überlassen wir sie nicht denen, die sie hierzulande
  in ihr Gegenteil verkehren, in Hass, Willkür und Unterdrückung. Einigkeit und Recht
  und Freiheit wollen wir auch gegenüber einer russischen Politik bewahren und beschützen,
  die diese Werte fürchtet, verachtet und immer hemmungsloser attackiert. Einigkeit
  in der NATO ist die Grundlage unserer Sicherheit. 32 Alliierte, eine Milliarde Einwohner,
  mehr als 50 Prozent der Weltwirtschaft - zusammen sind wir die stärkste Militärmacht
  der Geschichte. Wir halten diese NATO zusammen. Lieber Mark, das haben wir im letzten
  Jahr in deiner Heimatstadt, in Den Haag, und in diesem Sommer beim Gipfel in Ankara
  gezeigt, als uns eine gründliche Erneuerung des Bündnisses gemeinsam gelungen ist.
  Das Recht ist der Boden, auf dem unsere europäische Sicherheitsordnung steht. Wir
  glauben an die Würde jedes einzelnen Menschen, wir sind davon überzeugt, dass die
  Beziehungen der Staaten untereinander Recht und Regeln folgen müssen ‑ in dieser
  Hinsicht stehen wir in der westfälischen Tradition ‑, und Freiheit ist die zentrale
  Voraussetzung für den Bestand unserer demokratischen Gesellschaft. Wir Deutsche
  wissen aus eigener Erfahrung und Geschichte: Diese Freiheit ist nicht gegeben. Wir
  müssen sie wieder und wieder entdecken, erarbeiten, behaupten. Das verlangt uns
  Festigkeit und Willenskraft ab. Es fordert von uns die Bereitschaft zu Aufbruch
  und Veränderung. Wir kennen unsere eigenen Stärken. Wir haben einen klaren Kurs.
  Wir arbeiten nach Grundsätzen, die ineinandergreifen. Mit allen Möglichkeiten, die
  wir haben, setzen wir uns dafür ein, Friedensverhandlungen in Gang zu setzen. Unsere
  Ausgangsposition gegenüber Russland haben Emmanuel Macron, der damalige Premierminister
  Keir Starmer und ich im Sommer mit Wolodymyr Selenskyj umrissen. Erstes Ziel muss
  sein, dass die Waffen in der Ukraine schweigen. Zweitens muss immer klar sein, dass
  die staatliche Souveränität der Ukraine gewahrt bleibt. Deshalb kann über territoriale
  Fragen auch nur die Ukraine selbst entscheiden. Sie muss, schließlich, auf Sicherheitsgarantien
  zählen können und ihren europäischen Weg gehen dürfen. Diese Fragen, meine Damen
  und Herren, müssen in einem angemessenen Format verhandelt werden. Einen Frieden
  über die Köpfe der Ukraine hinweg kann es jedenfalls nicht geben. Ebenso wenig kann
  es einen Frieden ohne Europa geben. In der Ukraine geht es eben auch um Freiheit
  und Sicherheit in ganz Europa. Wir Europäer sind in diesem Krieg nicht Kriegspartei,
  aber wir sind auch nicht neutral. Wir sind nicht Vermittler. Wir stehen auf der
  Seite der Freiheit. Deshalb stehen wir auf der Seite der Ukraine. Wir haben Kyjiw
  eine europäische Perspektive eröffnet. Echten Frieden in der Ukraine gibt es eben
  nur in und mit Europa. Die besten Aussichten auf Erfolg haben deshalb Verhandlungen,
  an denen die Ukraine, Russland, die Vereinigten Staaten von Amerika und wir Europäer
  teilnehmen. Darauf zielen wir. Im Zentrum steht dabei die diplomatische Arbeit mit
  Frankreich und Großbritannien in enger Abstimmung mit Polen, den baltischen Staaten
  und mit Italien im Zusammenspiel mit den Brüsseler Institutionen und unseren wichtigen
  Partnern in Europa und über Europa hinaus. Unsere Unterstützung für Kyjiw und unser
  Druck auf Moskau dienen nicht dazu, den Krieg zu verlängern. Wir wollen das russische
  Volk nicht demütigen und den russischen Staat nicht ins Wanken bringen. Aber Russland
  muss den Krieg beenden und von hybriden Angriffen auf Europa ablassen. Unsere Hilfe
  für die Ukraine schafft erst die notwendige Voraussetzung dafür, dass ernsthafte
  Friedensverhandlungen mit Moskau in Gang kommen können. Meine Damen und Herren,
  in wenigen Wochen beginnt der fünfte Kriegswinter. Vermutlich wird es der bislang
  schwerste sein. Die Menschen in den ukrainischen Großstädten stellen sich auf harte
  Angriffe mit ballistischen Raketen ein, auf zerstörte Heizkraftwerke und Schulen,
  auf beschädigte Wohnblocks und Kirchen. Diesen Winter muss die Ukraine überstehen,
  und ich bin davon überzeugt, dass sie ihn überstehen wird. Auf unsere Hilfe kann
  sie zählen. Deutsche Ingenieure entwickeln neue Abfangsysteme gegen Jetdrohnen,
  die bald in die Massenherstellung gehen. Wir reparieren bombardierte Kraftwerke.
  Wir helfen den Ukrainern, sich selbst zu helfen. Das nutzt uns ganz direkt. Was
  wir allein im vergangenen Jahr von der Ukraine gelernt haben, von wirksamer Drohnenabwehr
  bis hin zur Digitalisierung der Gefechtsführung und zur industriellen Revolution
  und Innovation, das macht auch unser Land sicher, stärker und kreativer. Das ist
  ein handfester Gewinn für uns alle. Der Krieg in der Ukraine wird irgendwann zu
  Ende gehen wie alle Kriege der Weltgeschichte. Aber ohne unsere Hilfe beendet den
  Krieg in der Ukraine nicht ein verhandelter, sondern ein diktierter Friede. Dann
  drohen Massenmigration in Richtung Westen und die vollständige Destabilisierung
  nicht nur dieses Staates. Der russische Angriff würde belohnt, und Europa würde
  ein unsicherer Kontinent. Wanken wir in Deutschland, wankt Europa. Wankt Europa,
  wankt auch die Ukraine. Bleiben wir fest, bleibt Europa fest. Bleibt Europa fest,
  bleibt auch die Ukraine fest. So bedeutend, ja unverzichtbar die Leistungen unserer
  Nachbarn sind, die zum Teil pro Kopf mehr für die Ukraine leisten als wir: Kein
  anderes Land kann uns Deutschen diese Verantwortung abnehmen. Wir lassen uns auch
  nicht davon beeindrucken, dass Russland uns und andere NATO -Partner zunehmend in
  das Fadenkreuz hybrider Angriffe nimmt. Leipzig hat im August gezeigt, dass die
  russische Regierung uns verunsichern will. Sie will, dass wir in unserer Unterstützung
  der Ukraine nachlassen. Sie will, dass wir aufhören, in unsere Abschreckung zu investieren.
  Sie sucht nach Gelegenheit, unsere Gesellschaft zu spalten und unser Land zu schwächen.
  Diese gefährliche Eskalation ist vor allem Ausdruck einer wachsenden russischen
  Ratlosigkeit angesichts der erfolglosen Kriegsführung in der Ukraine. Umso wichtiger
  ist, dass wir uns durch Cyberangriffe, Drohnen und Onlinepropaganda nicht beeindrucken
  lassen. Wir stellen uns auf weitere hybride Angriffe ein, auch auf schwere. Kämen
  sie, würden wir wie nach Leipzig schnell und sehr klar antworten. Schließlich stellen
  wir sicher, dass wir Russland glaubhaft abschrecken. Die Bundesregierung wird weiterhin
  entschieden in Deutschlands militärische Stärke und wirtschaftliche Resilienz investieren.
  Wir haben unsere Verteidigungsindustrie neu in Schwung gebracht. Wir stärken unsere
  Bundeswehr. Erlauben Sie mir, bei dieser Gelegenheit hier in Münster dem 1. Deutsch-Niederländischen
  Korps und den Soldatinnen und Soldaten, die in diesem Korps Dienst tun, Dank zu
  sagen. Wir waren heute bei ihnen. Es war ein eindrucksvoller Besuch. Herzlichen
  Dank für den Dienst, den Sie leisten! Meine Damen und Herren, Deutschland ist gemeinsamen
  transatlantischen und europäischen Werten verpflichtet. Es stellt sich in den Dienst
  der Freiheit und der Sicherheit seiner europäischen Nachbarn, weil es weiß, dass
  es eine gute Zukunft für Deutschland nur in einem freien, sicheren und einigen Europa
  gibt. Deutschland ist willens, fähig und bereit, in einem erneuerten Bündnis mehr
  Verantwortung zu tragen. Es leistet seinen Teil dazu, die NATO europäischer zu machen,
  damit sie transatlantisch bleiben kann. Das ist die zwingende Schlussfolgerung aus
  dem, was wir spätestens seit Februar 2022 in der Ukraine erleben. Es ist unsere
  Antwort auf eine neue Zeit großer Mächte und technologischer Revolutionen. Es ist
  unser Beitrag zu dem Bündnis, das wir heute mit dem Westfälischen Friedenspreis
  würdigen. Es dient unserer Freiheit, unserer Sicherheit und unserem Wohlstand. Meine
  Damen und Herren, die nächsten Monate werden folgenschwer für das Schicksal der
  Ukraine und für die Sicherheit Europas sein. Europa schaut in diesen Tagen ganz
  besonders auf uns, auf Deutschland. Schwanken oder straucheln wir, kann das schicksalhafte
  Folgen haben. Stehen wir aber fest, können wir gemeinsam Frieden für die Ukraine
  und Freiheit in Sicherheit für ganz Europa gewinnen. Diese Verantwortung lastet
  jetzt auf uns. Wir wollen diese Verantwortung in der Tradition des Westfälischen
  Friedens tragen, die grundlegend für unsere europäische Ordnung und das moderne
  Völkerrecht bleibt. Sie bleibt Grundlage für ein Leben in Freiheit und in Frieden
  in Europa. Ja, wir stehen also in einer Bewährungsprobe in der Tradition dieses
  großen Friedenswerkes. Wir haben alle Voraussetzungen dafür, diese Bewährungsprobe
  zu bestehen. Jetzt müssen wir nur die Kraft aufbringen, den eingeschlagenen Weg
  gemeinsam in Europa zu gehen. Liebes Team von socioMovens, lieber Mark Rutte, Ihnen,
  dir, euch, allen NATO -Partnern gratuliere ich sehr herzlich zum Preis des Westfälischen
  Friedens 2026. Members of the Bundestag and the Landtag, Excellencies [Bishop Wilmer,
  Bishop Bentz], Curators of the Wirtschaftliche Gesellschaft für Westfalen und Lippe,
  Members of the jury of the International Award of the Peace of Westphalia, Today,
  we are honouring NATO by presenting it with the International Award of the Peace
  of Westphalia. We are also paying tribute to the youth organisation socioMovens
  from Dortmund that brings young people from all over Europe together to promote
  peaceful and human interaction on our continent. My good friend Mark Rutte, I am
  pleased that you are accepting the prize on behalf of NATO. You are holding the
  Alliance together in challenging times, guided by a transatlantic and European compass,
  and with tireless energy and unshakeable optimism. Some are surprised to hear of
  the International Award of the Peace of Westphalia going to a military alliance.
  It seems an explanation is needed. In 1648, the Peace of Westphalia ended a war
  of wars unprecedented in Europe before that time. Those aged 30 back then had, just
  like Grimmelhausen’s Simplicissimus, never known anything but the devastation of
  war. The peace negotiated in the course of five years by the diplomat Maximilian
  Graf Trauttmansdorff and the 150 envoys in Münster and Osnabrück echoed far beyond
  its time. It was a true peace that did not just end the bloodshed. It paved the
  way for a new European order. In the terms we would use today, it included the sovereign
  equality of states, the rule of law, the prohibition against shifting borders through
  the use of force and the principle of collective security. This Westphalian order
  limited the power of the strong. It provided security, stability and protection
  for middle powers and small states, too. It used the strength of the law to tame
  the law of the strong. Throughout the centuries, these principles have been violated
  time and again on German and European soil. Bloody wars brought them to their knees.
  In two world wars, they were first shattered and then obliterated. After the Second
  World War, a new European security architecture emerged. The circumstances were
  completely different compared to 1648. However, the new order applied the fundamental
  principles of the Westphalian system to a new age. In the Euro-Atlantic area, this
  new order added an important guiding principle: the dignity and freedom of each
  and every individual in democratic states. Relatively soon after the Second World
  War, NATO became a central pillar of this order. For three generations now, it has
  guaranteed security and freedom in the Euro-Atlantic area. To this day, it is above
  all else an alliance of freedom. It also embodies the tradition of Münster and Osnabrück.
  It protects our security and our prosperity. It serves peace. That is what the Award
  of the Peace of Westphalia is paying tribute to today. Today’s ceremony also brings
  home the value of true peace. It is more than the absence of war. Peace is a situation
  in which we can dare to trust one another and work together safely, with fair play,
  as equals. And, above all else, in freedom. Just a few years ago, some were wondering
  what we still need NATO for anyway. Today, it is abundantly clear: The European
  peace order whose roots reach back to Münster and Osnabrück faces fundamental challenges.
  It is our freedom that is at stake. It is being challenged by a new era of great-power
  politics at a time when we also need to redefine our transatlantic partnership,
  as well as by technological revolutions that are changing our world faster and more
  drastically than anything that has gone before. However, the most direct threat
  to peace and freedom is posed by Russia’s violent expansive revisionism. A murderous
  war has been raging in Ukraine, just beyond NATO’s borders, for almost five years
  now. It was Russia that unleashed this war in disregard and contempt of the principles
  negotiated with the former Soviet Union. These principles are enshrined in the Charter
  of Paris for a New Europe, the final document that emerged from the CSCE Summit
  in 1990, a document shaped by the principles of the Peace of Westphalia. The destruction
  caused by Russia’s war of aggression is huge. The cost of bombarded houses, bridges,
  power plants, schools, nursing homes and hospitals runs to hundreds of billions.
  The tally of the dead and injured on both sides of this war is now over a million.
  No figure can be put on the human suffering. We are moved by this suffering and
  by the courage with which the Ukrainians are withstanding it. The cruelty of the
  aggressor is abhorrent to us. However, we have understood that this war affects
  us very directly. In Ukraine, it is also the security of Europe, our Europe, that
  is at stake. It is also about us. Russia is using extreme brutality in Ukraine as
  it breaks the most fundamental rules of international law and of the European order
  that protect us. That is why it is and remains right for us to do our utmost to
  support Ukraine. That is why we must not and will not be deterred by Moscow’s hybrid
  attacks, such as the recent attack in Leipzig in the heart of Germany. If we do
  not manage to halt Moscow, the Russian war machinery will sooner or later target
  us, target NATO itself. We must not close our eyes to this threat. Three generations
  after 1945, war would come back to our part of Europe. Would the Baltic States then
  become a battlefield of drones like the Donbas today? Which European cities would
  be the target of the ballistic missiles that Russia is today firing on the people
  of Kyiv and Kharkiv? Would we Germans ultimately also experience the horror of war
  once more at first hand? Our most urgent European and transatlantic responsibility
  is to do everything in our power to prevent this from happening. To do so, we first
  need a realistic picture of Russia. The German historian Martin Schulze Wessel has
  just published an academic work looking at the fundamentals. We are all well advised
  to make nuanced judgements about Russia. Even after five years of murderous war,
  we do not want to lose our feeling for nuances and degrees. But we have to see what
  is in front of our eyes. Russia is pursuing an agenda of revisionist, imperial expansion.
  The leadership in Moscow wants to re-establish a real or imagined bygone greatness.
  There is a direct line extending from Russia’s war in Georgia, to the annexation
  of Crimea and the first land grab in Donbas in 2014 right up to the full-scale invasion
  of Ukraine unleashed on 24 February 2022. By speaking of Noworossija , New Russia,
  Moscow is attempting to give the misleading impression that the Ukrainian Black
  Sea coast has been part of Russia since time immemorial. We cannot ignore this historical
  revisionism. The aim is not only to restore a past empire. President Putin states:
  “Wherever a Russian soldier sets foot, that is Russia.” In this context, the reference
  to “security interests” is a euphemism for a claim to a sphere of influence. This
  claim is at the expense of the sovereignty of Russia’s affected neighbours. Diplomacy
  towards Moscow can only succeed one day if we recognise this pattern of thought
  for what it is. More than anything else, Russia respects strength. Let me underscore
  that, at the appropriate time, we want to have stable, predictable relations with
  Russia. Above all, we want Russia to end its war of aggression against Ukraine and
  to return to the European peace order. As things stand at the moment, Russia is
  not willing to do this. Over the past few years, many offers of diplomatic talks
  have fallen on deaf ears in Moscow. However, the Kremlin evidently understands the
  language of the strong. Russia had to listen to Poland, which took a stand against
  Soviet expansion in the 1920s. It had to listen to Finland, which wrested its freedom
  from the Soviet Union. Our northern and eastern European neighbours learned these
  lessons the hard way, and they have never forgotten them. We should take their collective
  experience seriously. I would add that we ought to do so without losing sight of
  the notion that a negotiated solution is possible and necessary. That, too, will
  help us prompt Russia to engage in serious peace talks. Russia will be more likely
  to negotiate if we face it as one. Whenever the West has not been united in confronting
  Russia, its neighbours in the East have always paid the price. A united front against
  Moscow, however, has always proved to be effective. NATO is the best example of
  this. Since 1949, the unity and strength of the Alliance have been a crucial factor
  in preventing armed conflict with Russia. Indeed, this has created the conditions
  for dialogue. That was the fundamental idea expressed by the Harmel Report in 1967.
  It was the essential concept behind the NATO Double-Track Decision in 1979. Today,
  unity and strength are still the prerequisites for the success of negotiations with
  Moscow. That can only encourage us to keep the United States on board when it comes
  to our Ukraine policy, too. That we managed to do that at the G7 Summit in Evian
  a couple of weeks ago was a crucial achievement. The fact that Congress recently
  adopted the Graham Sanctions Act and that President Trump signed it into law shows
  that our persistence is paying off. That strengthens my resolve to continue to seek
  support from Washington. What is crucial is that Europe stays together. And that
  is what we are doing. Five years ago, who would have imagined the level of endurance
  and determination we Europeans would show in standing shoulder to shoulder with
  Kyiv? For two years now, Europe has been providing the lion’s share of assistance
  for Ukraine. Here, more clearly than in any other area, Europe is waking up to what
  is required in terms of security policy. For Ukraine, this European awakening today
  is its salvation in an hour of great need. And in this new era, it is in our own
  fundamental interest. This struggle for unity is hard work. But it is crucial on
  the path towards peace in Ukraine and security in Europe. This war must not be allowed
  to divide Europe; this takes precedence over all other foreign-policy objectives.
  In Germany, too, we will not let ourselves be divided – not by hybrid attacks, not
  by hate speech in social media driven by Moscow’s bots, and not by the sound bites
  of the AfD and their Russian puppeteers. We are all aware how difficult that is
  in a society that is increasingly shaped by polarisation, conflict and rage. We
  are addressing the accusation that Germany’s assistance for Ukraine has had a negative
  impact on prosperity in our own country. My response to this is that our support
  for Ukraine is not an end in itself. We are, first and foremost, providing this
  support in order to protect the freedom and security of the people in our country.
  Freedom and security are prerequisites for our prosperity. We also have to respond
  to those who claim that Russia has, figuratively speaking, been forced into excessive
  self-defence by a NATO that is encroaching further and further eastwards. Indeed,
  we are well advised to take such perceptions of Moscow seriously. And that is what
  we are doing. But we have to speak out when perpetrators portray themselves as victims.
  Ladies and gentlemen, a great deal now depends on our internal and external peace,
  on our cohesion in Germany, in the interests of a bright future for our country,
  peace in Ukraine and a free Europe. Whether we like it or not, we Germans, as a
  power at the heart of Europe, have a special responsibility that extends well beyond
  the borders of our own country. This derives from our geographical position, our
  history and our Basic Law. I''m also saying this to my fellow citizens: we must
  rise to this responsibility together. We can shoulder it with equanimity and hope.
  In our dealings with Russia, we can count on three great strengths that characterise
  our country and Europe: unity and justice and freedom. I have chosen these terms
  deliberately. Let us not abandon them to those in this country who turn them into
  their opposites – into hatred, despotism and oppression. Unity and justice and freedom
  are qualities that we also want to preserve and protect in the face of a Russian
  policy that fears and despises these values and is subjecting them to increasingly
  unbridled attacks. Unity in NATO is the foundation for our security. Thirty-two
  Allies. One billion inhabitants. More than 50 percent of the global economy. Together,
  we are the strongest military power in history. We are holding this NATO together.
  Mark, we demonstrated this last year in your home city of The Hague and this summer
  at the Summit in Ankara, when we managed to renew the Alliance from the ground up.
  Justice is the bedrock of our European security. We believe in the dignity of every
  individual. And we are convinced that relations among states must abide by the law
  and follow rules. We stand in the Westphalian tradition in this regard. And freedom
  is the key requirement for the endurance of our democratic society. We Germans know
  from our own history that this freedom is not something we can take for granted.
  Time and again, we must rediscover it, work for it, defend it. That requires us
  to show determination and willpower. It demands from us a willingness to pursue
  new paths and embrace change. We know our own strengths. We have a clear course.
  And we are working according to principles that intersect. We are using all the
  options at our disposal to work to set peace negotiations in motion. Emmanuel Macron,
  then-Prime Minister Keir Starmer and I outlined our point of departure vis-à-vis
  Russia with Volodymyr Zelensky in the summer. The first goal must be a ceasefire
  in Ukraine. Secondly, it must always be clear that Ukraine’s national sovereignty
  must remain intact. That is why only Ukraine can decide on territorial issues. Ultimately,
  it must be able to rely on security guarantees and be allowed to pursue its European
  path. These questions must be negotiated in an appropriate format. No peace can
  be decided over the heads of the Ukrainians, just as there can be no peace without
  Europe. What happens in Ukraine also affects peace and security in Europe as a whole.
  We Europeans are not a party to this war. But nor are we neutral. We are not playing
  a mediating role. We stand on the side of Ukraine’s freedom. We have offered Kyiv
  the prospect of EU membership. There will only be genuine peace in Ukraine in and
  with Europe. Negotiations involving Ukraine, Russia, the United States and Europe
  therefore stand the best chance of success. That is our objective. The focus here
  is on diplomatic work with France and the United Kingdom, in close consultation
  with Poland, the Baltic States and Italy, and in tandem with the institutions in
  Brussels and other important partners in Europe and beyond. Our assistance for Kyiv
  and our pressure on Moscow are not intended to prolong the war. We do not want to
  humiliate the Russian people or destabilise the Russian state. However, Russia must
  end the war and refrain from hybrid attacks on Europe. Our assistance for Ukraine
  is laying the groundwork to enable serious peace negotiations with Moscow to get
  under way in the first place. The fifth winter of the war will start in a few weeks
  from now. It is set to be the most difficult one so far. The residents of Ukraine’s
  major cities are bracing for heavy strikes with ballistic missiles, for the destruction
  of heat and power plants and schools, and for damage to apartment blocks and churches.
  It can count on our support. German engineers are developing new air-defence systems
  to counter jet drones, systems that will enter mass production in the near future.
  We are repairing power plants that have been destroyed. We are helping Ukraine to
  help itself. This stands to benefit us quite directly. What we have learned from
  Ukraine in the past year alone – from effective drone defence to the digitalisation
  of command and control and industrial innovation – makes our own country safer,
  more creative and stronger. This represents a tangible benefit. The war in Ukraine
  will come to an end one day, just like all wars in world history. But without our
  support, the war in Ukraine will not end in a negotiated peace, but rather a dictated
  one, with the threat of mass migration to the West and the destabilisation of the
  Ukrainian state. Russia’s attack would be rewarded and Europe would become an insecure
  continent. If Germany falters, Europe falters. If Europe falters, Ukraine falters.
  If we stand firm, then Europe stands firm. And if Europe stands firm, then Ukraine
  also stands firm. As significant, indeed indispensable, as our neighbours’ contributions
  may be – some provide more assistance per capita for Ukraine than we do – no other
  country can relieve us Germans of this responsibility. Nor are we daunted by the
  fact that Russia is increasingly targeting us and other NATO partners with hybrid
  attacks. The events in Leipzig in August demonstrated that the Russian Government
  wants to intimidate us. It wants us to slacken our efforts to support Ukraine. It
  wants us to stop investing in our deterrence. It is looking for opportunities to
  divide our society and to weaken our country. This dangerous escalation is, above
  all, a reflection of Russia’s growing sense of helplessness in the light of its
  unsuccessful warfare in Ukraine. And we will be just as undaunted by cyberattacks,
  drones and online propaganda. We are preparing for further hybrid attacks – including
  severe ones. If such attacks were to happen, then we would respond, as was the case
  after Leipzig, quickly and very clearly. At the end of the day, we are ensuring
  that we deter Russia in a credible manner. The German Government will continue to
  invest resolutely in Germany’s military strength and economic resilience. We have
  injected fresh momentum into our defence industry. We are strengthening our Bundeswehr.
  I would like to take this opportunity to express my gratitude here in Münster to
  the 1st German-Netherlands Corps and to the soldiers serving in the Corps. We visited
  you today. It was an impressive visit. Thank you very much for the service you provide.
  Ladies and gentlemen, this Germany is committed to shared transatlantic and European
  values. It is committed to promoting the freedom and security of its European neighbours
  because it knows that there can only be a bright future for our country in a free,
  secure and unified Europe. Germany is willing, able and ready to shoulder greater
  responsibility within a renewed Alliance. It is doing its part to make NATO more
  European so that it remains transatlantic. This is the inevitable conclusion from
  what we have witnessed in Ukraine at the latest since February 2022. It is our response
  to a new age of great powers and technological revolutions. And it is our contribution
  to the Alliance, to which we are paying tribute today with the International Award
  of the Peace of Westphalia. It promotes our freedom, our security and our prosperity.
  Ladies and gentlemen, the coming months will be critical for the fate of Ukraine
  and for security in Europe. The eyes of Europe are trained particularly on us, on
  Germany, right now. If we waver or falter, then this could have fateful consequences.
  But if we stand firm, then, together, we can achieve peace for Ukraine and freedom
  in security for all of Europe. We want to assume this responsibility in keeping
  with the tradition of the Peace of Westphalia, which is fundamental to our European
  order and modern international law. It continues to be the foundation for our lives
  in peace and freedom in Europe. We therefore face a test of our resolve, in the
  tradition of this peace agreement. We have all that it takes to pass this test.
  We must summon the strength to continue along this path together in Europe. Esteemed
  socioMovens team, Mark Rutte, allow me to offer you and all of our NATO partners
  my sincere congratulations on receiving the International Award of the Peace of
  Westphalia 2026.'
