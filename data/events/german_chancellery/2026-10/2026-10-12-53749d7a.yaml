date: '2026-10-12'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 12. Oktober 2026
text: '(Vorsitzende Hamberger eröffnet die Pressekonferenz und begrüßt StS Kornelius
  sowie die Sprecherinnen und Sprecher der Ministerien.) Ich darf Ihnen eine Reise
  des Außenministers ankündigen. Außenminister Wadephul wird morgen nach Warschau
  reisen, um am Warsaw Security Forum teilzunehmen. Dort wird er an einem Panel mit
  seinen Amtskollegen aus Norwegen, dem Vereinigten Königreich und Polen teilnehmen.
  Im Mittelpunkt des Gesprächs werden die Auswirkungen der russischen Eskalation gegen
  die Ukraine auf die Sicherheit in Europa, die Stärkung der gemeinsamen Verteidigungsfähigkeit
  und die weitere Unterstützung der Ukraine stehen. Mit Polen, Norwegen und dem Vereinigten
  Königreich kommt der Außenminister in Warschau mit sehr wichtigen Partnern zusammen,
  die gemeinsam Verantwortung für die Sicherheit Europas übernehmen. Im Austausch
  wird es darum gehen, wie der Druck auf Russland weiter erhöht werden kann, damit
  Russland ernsthaft zu Verhandlungen bereit ist. Mit dem jüngsten Listungspaket haben
  wir gemeinsam in der EU heute mehr als 1600 Personen und Unternehmen sanktioniert.
  Darunter befinden sich auch Akteure mit Bezug zu dem mutmaßlichen, russischen Drohnenanschlag
  in Leipzig [ Anmerkung zum Begriff „mutmaßlich“ – siehe Diskussion und Korrektur
  weiter unten ]. Darüber hinaus sind bilaterale Gespräche geplant. Habe ich Sie richtig
  verstanden, Herr Hinterseher, dass Sie vom mutmaßlichen, russischen Anschlag in
  Leipzig gesprochen haben? Das klang ja vorher, in den letzten Wochen, in Ihren Aussagen
  hier definitiver. Ja, wir haben diesen Anschlag attribuiert. Wie beurteilt der Bundesaußenminister
  die Ankündigung der Amerikaner , die Sanktionen gegen Russland teilweise aufzuheben
  oder auszusetzen ? Schließen Sie sich dem an? Begrüßen Sie das? Ist das ein sinnvolles
  Vorgehen? Können Sie die Frage bitte noch einmal präzisieren? Welche Art von Sanktionsaufhebung
  meinen Sie? Der amerikanische Präsident hat angekündigt, dass Teile der Erdölsanktionen
  gegen Russland aufgehoben werden, damit man Diesel aus Russland kaufen kann. Ist
  das in den Augen des Außenministers ein sinnvolles Vorgehen? Wird man sich dem vielleicht
  sogar anschließen, weil Sanktionen ja besser wirken, wenn man sie gemeinsam aufhebt
  oder beschließt? Der Außenminister hatte sich dazu ja auch gestern geäußert und
  hat sich auch heute geäußert. Es ist unsere Überzeugung, dass es der richtige Zeitpunkt
  ist, den Druck auf Russland zu erhöhen, nicht zu verringern, insbesondere vor dem
  Hintergrund, dass die Zivilbevölkerung in der Ukraine mit über 150 getöteten Zivilistinnen
  und Zivilisten, darunter auch Kinder, eine der tödlichsten Wochen seit Kriegsbeginn,
  zumindest aber in diesem Jahr, erleben musste. Wir haben die Ankündigungen aus den
  USA zur Kenntnis genommen. Wir halten es für ein Signal, das den Druck auf Putin
  mindert. Der Minister hat sich schon gestern dazu geäußert. Putin zeigt keinen ernsthaften
  Verhandlungswillen und eskaliert seine Angriffe auf die Ukraine. Es ist nicht der
  Zeitpunkt, um Sanktionen auf Russland zu lockern, im Gegenteil: Wir müssen den Druck
  auf Russland weiter erhöhen. In Deutschland haben wir uns seit Längerem von russischen
  Energieimporten unabhängig gemacht. Direkte und indirekte Ölimporte in die EU aus
  Russland unterliegen Sanktionen. Die EU beendet zudem mit REPowerEU ihre noch verbliebenen
  Gasimporte bis zum nächsten Jahr. Russland setzt demgegenüber seinen brutalen Angriffskrieg
  auf die Ukraine fort und finanziert mit den Erlösen aus dem Verkauf von Öl und Gas
  eben diesen Angriffskrieg. Russland ist ‑ das kann man feststellen ‑ kein verlässlicher
  Handelspartner. Die EU-Sanktionen sind und bleiben die richtige Antwort. Deshalb
  ist es auch eine gute Neuigkeit, dass diese EU-Sanktionen heute mit einem weiteren
  Sanktionsschlag noch einmal verstärkt wurden, indem 1600 Personen und Entitäten
  entsprechend gelistet wurden. In welcher Weise haben Sie die Position, der zufolge
  die teilweise Aufhebung des Embargos kontraproduktiv sei, weil sie den Druck auf
  Russland mindere, der US-amerikanischen Regierung mitgeteilt? Wie war deren Reaktion
  darauf? Ich habe Ihnen hier aus vertraulichen Gesprächen nichts zu berichten. Sie
  wissen aber, dass wir uns mit der US-Seite in einem kontinuierlichen, engen und
  vertrauensvollen Austausch befinden, insbesondere was die Sicherheit in Europa und
  die Bündnissolidarität in der NATO angeht. Dort werden alle Themen adressiert. Ich
  habe Ihnen aber hier keine detaillierten Gespräche zu verlautbaren. Haben diese
  Gespräche auf Ministerebene oder auf untergeordneter Beamtenebene stattgefunden?
  Ich habe von Gesprächen gerade eben nicht berichtet, sondern in allgemeiner Form
  ausgeführt, wie wir uns mit den USA und in welchen Gremien wir uns mit den USA in
  Kontakt befinden, um unsere Position deutlich zu machen. Aber gehen Sie davon aus,
  dass der US-Seite auch unser Blick auf den russischen Angriffskrieg in der Ukraine
  und unsere Politik dahingehend, dass wir versuchen, den Druck auf Russland zu erhöhen
  und zugleich die Ukraine zu unterstützen, so wie es die USA ja auch tun, bekannt
  ist. Ich würde in dem Zusammenhang gern auch noch einmal mit Herrn Kornelius sprechen.
  Es gab ja auch in dem Zusammenhang die Forderung von Herrn Trump oder erneuerte
  Kritik an Wolodymyr Selenskyj. Wie steht denn der Kanzler dazu? Vielleicht eine
  Frage, weil Sie von Gesprächen sprachen: Hat der Kanzler in den vergangenen Tagen
  einmal zum Telefonhörer in Richtung Washington gegriffen? Der Bundeskanzler befindet
  sich im ständigen Kontakt. Vor allem sein Team befindet sich im ständigen Kontakt.
  Sie haben von den Gesprächen in Miami am Ende der vergangenen Woche gehört. Der
  Austausch ist seitdem kontinuierlich. Was die Position des ukrainischen Präsidenten
  angeht: Wolodymyr Selenskyj kann sich auf die Unterstützung Deutschlands verlassen.
  Der Rückhalt ist gegeben. Der Bundeskanzler hat ihm das vor einer Woche in Kyjiw
  versichert. Er hält natürlich an dieser Versicherung fest. Die deutsche Regierung
  steht an der Seite der Ukraine. Deswegen, glaube ich, gibt es keine Zweifel, was
  nun den Energiewaffenstillstand angeht. Dabei hat die russische Seite bereits die
  Antwort auf den Vorschlag des amerikanischen Präsidenten gegeben. Insofern haben
  wir gesehen, wie weit das geführt hat. Vielleicht habe ich es gerade überhört, aber:
  Hat er telefoniert oder nicht? Ich gebe jetzt keine Auskunft über einzelne Termine
  oder Gespräche des Bundeskanzlers. Aber Sie können sich sicher sein, dass der Austausch
  kontinuierlich ist. US-Präsident Trump hat jetzt nicht nur Selenskyj kritisiert,
  sondern auch erklärt, er sei nicht der richtige Präsident, um Verhandlungen zu führen,
  und Neuwahlen gefordert. Diesbezüglich würde mich nur interessieren, wie die Bundesregierung
  denn darauf reagiert. Sieht sie das als eine unzulässige Einmischung in die demokratische
  Selbstbestimmung der Ukraine, oder stützt sie den Vorschlag von Präsident Trump?
  Sie wissen, dass sich die ukrainische Regierung und der Präsident seit fast fünf
  Jahren legitimerweise gegen einen Angriffskrieg wehren, dass auch die ukrainische
  Seite immer wieder Wahlen als völlig legitimes und demokratisches und auch verfassungsgemäßes
  Mittel in diesem Land in Erwägung gezogen hat, aber dass die Kriegssituation dagegenspricht.
  Insofern ist es eine Entscheidung, die auf der ukrainischen Seite getroffen werden
  muss und die nicht von außen gefällt werden kann. Wenn wir gerade im Kontext von
  Wahlen sind: Bisher hat die Bundesregierung ja die Position unterstützt, dass die
  Ukraine aufgrund des Grundrechts keine Wahlen durchführen kann. Jetzt hat Präsident
  Selenskyj ja angeboten, bei einer vollständigen 60-tägigen Waffenruhe entsprechende
  Wahlen durchzuführen. Selbst diese Waffenruhe hat ja nichts am Kriegszustand geändert.
  In dem Zusammenhang würde mich interessieren ‑ das geht vielleicht eher an das Auswärtige
  Amt ‑, was sich denn an der rechtlichen Lage jetzt geändert hat, sodass Herr Selenskyj
  doch Wahlen anbietet. Wir haben zur Kenntnis genommen, dass Herr Selenskyj darauf
  reagiert hat, indem er sagte, bei einem 60-tägigen Waffenstillstand sei es möglich,
  Wahlen zu organisieren. Das haben wir erst einmal zur Kenntnis genommen. Die Entscheidung
  über Wahlen in der Ukraine obliegt der Ukraine. Bezüglich der, sage ich einmal,
  Rahmenbedingungen, nämlich die eines Verteidigungskampfes gegen einen völkerrechtswidrigen
  Angriffskrieg, hat der Regierungssprecher gerade ausgeführt. Zum Thema Trumps Dieseldeals
  mit Putin hätte ich auch gern noch einmal folgendes Herrn Kornelius gefragt: Wie
  bewerten Sie denn die Ankündigung des US-Präsidenten? Die Bundesregierung hat diese
  Entscheidung ja auch bereits kommentiert. Sie hat sie zur Kenntnis genommen. Das
  Außenministerium hat sich geäußert. Der Bundeskanzler hat sich am Freitag geäußert.
  Die Haltung ist klar. Die Bundesregierung hält mit ihren europäischen Partnern an
  den Sanktionsbeschlüssen gegen Russland fest. Das betrifft auch die Öl- und Dieselsanktionen.
  Wir haben im Rahmen von REPowerEU die schrittweise Beendigung der russischen Gasimporte
  bis Ende 2027 beschlossen. Daran halten wir auch fest. Insofern ist, glaube ich,
  die faktische Lage so, wie ich es vorhin schon einmal gesagt habe. Russland hat
  auf den Vorschlag des Energiewaffenstillstands, den Trump mit der Ankündigung des
  neuen Dieselbezugs gemacht hat, mit neuen Angriffen mit vielen Toten reagiert. Das
  heißt, an der Kriegssituation hat sich nichts geändert. Laut Trump soll der Deal
  auch den weltweiten Markt beruhigen. Halten Sie das mit Blick auf die genannten
  Mengen für realistisch? Ich bin kein Experte für große Ölmengen, kann Ihnen aber
  sagen, dass die Marktlage volatil ist, dass wir diese Marktlage beobachten und dass
  wir jetzt keine Prognose abgeben, inwieweit das zu einer Stabilität beiträgt. Herr
  Kornelius, fehlt dem Kanzler die Kraft oder der Wille, den US-Präsidenten für diesen
  Move jetzt zu kritisieren und zu verurteilen? Sie betonen jetzt immer nur, dass
  man das zur Kenntnis nehme, dass man eine eigene Position habe und dass man den
  Ukrainern den Rückhalt versichere; aber wenn es jetzt um eine Entscheidung geht,
  die die Ukrainer und auch die Europäer schwächt ‑ das hat Herr Hinterseher ja gerade
  ausgeführt ‑, dann hört man jetzt vom Kanzler keine direkte Kritik. Oder ist das
  von der Washington-Seite verboten? Vielleicht will Herr Merz als Transatlantiker
  ja auch einfach nicht. Die Antwort auf Ihre ursprüngliche Frage, ob ihm die Kraft
  oder der Wille fehle, ist: weder noch. Dem Bundeskanzler fehlt weder die Kraft noch
  der Wille. Ich glaube, wir haben uns zu diesen Maßnahmen geäußert. Wenn Sie knalligere
  Äußerungen wollen, müssen Sie an andere Medien gehen. Aber Herr Trump guckt jetzt
  ja nicht Bundespressekonferenz, sondern hört vielleicht nur noch anderen Regierungschefs
  zu. Sie können sich sicher sein, dass wir die deutsche Position auf den geeigneten
  Wegen klar machen, unter anderem in den Worten, die Sie hier gehört haben. Herr
  Kornelius, am 9. Oktober erklärte Ihr Kollege Vizeregierungssprecher Meyer hier
  in der BPK, der Bundeskanzler sei über das Treffen von Altkanzler Schröder mit Putin
  zutiefst empört und empfinde es angesichts des unermesslichen Leids der zivilen
  Opfer als geradezu unmoralisch. Nun hat sich der Kanzler in der jüngeren Vergangenheit
  mehrmals mit dem israelischen Premierminister getroffen, gegen den ebenfalls ein
  Haftbefehl des Internationalen Strafgerichtshofs wegen mutmaßlicher Kriegsverbrechen
  und Verbrechen gegen die Menschlichkeit vorliegt. Da würde mich nur interessieren:
  Welcher konkrete Maßstab macht Schröders Treffen in den Augen des Kanzlers moralisch
  verwerflich, während seine eigenen Treffen als vertretbar gelten? Diese Form von
  Whataboutism möchte ich hier nicht teilen. Das ist aber keine Antwort auf meine
  Frage. Das ist auch kein Whataboutism. Doch, das ist ein Vergleich, den ich hier
  jetzt nicht aufnehme. Ich glaube, der Bundeskanzler hat über den Besuch in Moskau
  geurteilt, und das haben wir Ihnen hier mitgeteilt. Das haben wir nicht zu anderen
  Besuchen in Bezug gestellt. Wir haben hier zwei Staatsoberhäupter, gegen die jeweils
  ein Strafbefehl wegen Kriegsverbrechen vorliegt. Ein Treffen mit dem einen wird
  als unmoralisch bewertet. Da ist durchaus legitim zu fragen, wieso man Treffen mit
  dem anderen, der übrigens im Bereich ziviler Opfer auf weit höhere Zahlen verweisen
  muss, als moralisch vertretbar ansieht. Darauf hätte ich ganz gerne eine Antwort.
  Das ist mitnichten Whataboutism. Das ist eine Form von Vergleich, der ich mich nicht
  anschließe, und deswegen werde ich meinen Worten auch nichts weiter hinzufügen.
  Herr Kornelius, wie geht es nach dem Rücktritt der Bundesarbeitsministerin und SPD-Parteivorsitzenden
  Bärbel Bas jetzt weiter? Wie schnell soll die Amtsübergabe an Alexander Schweitzer
  vollzogen werden? Der Weg zur Amtsübergabe ist durch Artikel 64 des Grundgesetzes
  vorgegeben; das ist Ihnen bekannt. Die Bundesminister werden auf Vorschlag des Bundeskanzlers
  ernannt und entlassen. Dieser Prozess nimmt nun seinen Lauf. Das Ersuchen der Bundesarbeitsministerin
  um Entlassung ist erst wenige Stunden alt. Deswegen: Lassen Sie den Prozessen bitte
  ihren Gang. Der neue Bundesminister für Arbeit und Soziales wird dann Zug um Zug
  das Amt übernehmen und auch ernannt werden. ‑ Was war jetzt Ihre konkrete Frage
  zum Zeitablauf? Wie schnell geht die Amtsübergabe vonstatten? An das BMAS: Inwiefern
  beeinflusst der Rücktritt den Zeitplan für die geplante Rentenreform? Das Bundesarbeitsministerium
  arbeitet schon lange mit Hochdruck an der geplanten Rentenreform. Das tut es weiter,
  und es wird dann auch einen entsprechenden Entwurf vorlegen. Herr Kornelius, erwarten
  Sie, dass sich dieser Amtswechsel jetzt auf die Entscheidung zur Rente mit 63 niederschlägt?
  Es hieß in der Koalition, das könnte im Oktober stattfinden. Wird das nun später
  kommen? Frau Bas hat in ihrer öffentlichen Erklärung des Rücktritts erwähnt, dass
  die Angriffe vom Koalitionspartner auf sie auch während der für sie schwierigen
  Zeit weitergegangen seien. Was bedeutet das aus Ihrer Sicht für die Arbeit der Koalition?
  Ist das eine Belastung? Was den inhaltlichen Teil Ihrer Frage angeht, wird das BMAS,
  wie der Kollege eben auch schon gesagt hat, den Gesetzentwurf vorlegen. Er wird
  dann in der Regierung diskutiert und im Kabinett beschlossen, und dann wird sich
  das parlamentarische Verfahren anschließen. Insofern hat sich an dem gesamten Verfahrensweg
  wenig geändert. Der neue Minister wird sein Recht reklamieren und einen Moment für
  sich in Anspruch nehmen, um sich in diese Materie tiefer einzuarbeiten. Ich glaube
  aber, dass da bereits große Fachkenntnis vorhanden ist. Insofern wird dieses Gesetzgebungsverfahren
  hoffentlich zügig weiter umgesetzt werden. Es handelt sich um eine der wichtigsten
  innenpolitischen Reformen in dieser Wahlperiode. Deswegen sind sich alle Koalitionspartner
  auch bewusst, dass diese Reform angegangen werden muss. Die Berichte der Alterssicherungskommission
  liegen nun seit drei Monaten vor. Im Ministerium wurde die Zeit genutzt, um das
  Gesetzgebungsverfahren entsprechend vorzubereiten. Der Zeitplan hatte ja auch vorgesehen,
  das jetzt zu machen. Zu Ihrer anderen Frage möchte ich mich nicht äußern. Ich glaube,
  der Respekt auch vor der Situation von Frau Bas gebietet es, dass wir jetzt auf
  persönliche Urteile verzichten. Das gilt, glaube ich, für alle Beteiligten in diesem
  Verfahren. Das war ja durchaus eine inhaltliche Frage. Zum einen habe ich gefragt,
  ob Sie die Entscheidung zur Rente mit 63 noch in diesem Monat erwarten. Dazu haben
  Sie nichts gesagt. Die andere Frage war, ob es die Arbeit der Koalition belastet ‑
  was in der SPD zum Beispiel auch von Frau Schwesig gestützt wird ‑, dass von der
  Unionsseite der Koalition noch weiter Kritik an ihr geäußert worden ist. Das ist
  ja durchaus eine inhaltliche Frage. Im Moment wird von sehr vielen Leuten Kritik
  geäußert. Ich kann noch einmal appellieren, dass es der Respekt vor der Situation
  und auch vor Frau Bas gebietet, dass man sich diesen sehr persönlichen Angriffen
  jetzt enthebt, dass man das nicht weitertreibt und dass man die Arbeit in der Sache
  vorantreibt. Was Ihre Frage nach dem Zeitraum angeht: Er war nie konkret festgelegt
  worden. Die Erwartung war, dass es noch im Oktober im Kabinett diskutiert werden
  kann. Noch liegt der Entwurf nicht vor. Es gibt keine Frühkoordinierung. Insofern,
  glaube ich, werden wir uns nun die nötige Zeit nehmen müssen, bis das Gesetzgebungsverfahren
  durch den neuen Minister für Arbeit und Soziales eingereicht wird. An das BMF, aber
  in verwandter Sache: Auch der Finanzminister hat von unanständigen Angriffen gegen
  die Kabinettskollegin gesprochen. Welche Äußerung meinte er denn, und von wem konkret?
  Der Bundesfinanzminister wird sich in seiner Funktion als SPD-Vorsitzender in diesen
  Minuten im Willy-Brandt-Haus äußern. Auf dieses Statement würde ich gerne verweisen.
  Herr Kornelius, distanziert sich der Kanzler von den Angriffen aus der Koalition
  auf Frau Bas, die sie in ihrem Abschiedsbrief ja selber erwähnt hat? Ein Beispiel
  aus der Unionsfraktion ist Christian von Stetten, und es gibt auch noch andere Beispiele;
  das ist alles belegt. Ich habe bisher noch nicht gehört, dass sich der Kanzler,
  der ja auch CDU-Vorsitzender ist, von diesen persönlichen Angriffen ‑ laut Koalitionspartner
  unter der Gürtellinie ‑ distanziert hat. Sie wollten jetzt nichts Konkretes dazu
  sagen? Dann haben Sie die Äußerungen des Kanzlers nicht aufmerksam verfolgt. Auch
  in den letzten Tagen hat er sich sehr verständnisvoll für die Situation von Frau
  Bas gezeigt. Er hat sich auch heute geäußert und Respekt vor ihrer Leistung bekundet.
  Er appelliert jetzt, Frau Bas in dieser Situation auch den Raum zu geben, den sie
  braucht. Was die parteipolitischen Äußerungen anderer Teilnehmer angeht, verweise
  ich Sie an die Parteien. Die Arbeit der Bundesregierung ist dadurch nicht belastet.
  Herr Kornelius, ich versuche es auch noch einmal: Teilt der Kanzler die von Frau
  Bas formulierte Kritik, dass die Kritik an ihr auch während ihrer Trauerzeit vom
  CDU-Koalitionspartner forciert wurde? Wenn ja, hat er mit den entsprechenden Regierungsvertretern
  aus der CDU gesprochen? Der Bundeskanzler hat sich zu Frau Bas geäußert. Diese Worte
  zählen. Alles andere ist irrelevant. Meine Frage war, ob er diese Kritik teilt,
  und wenn ja, ob er mit den entsprechenden Vertretern seiner Partei und der Regierungskoalition
  gesprochen hat. Der Bundeskanzler appelliert an alle Beteiligten, unsachliche Kritik
  nun ruhen zu lassen und sich auf die Arbeit zu konzentrieren. Die Arbeit besteht
  darin, das Rentengesetz jetzt tatsächlich einzubringen und in der Reformarbeit weiterzukommen.
  Der Bundeskanzler hat außerdem großes Verständnis für die Situation von Frau Bas
  und hat dies auch zum Ausdruck gebracht. Meine Frage wäre in die gleiche Richtung
  gegangen; das hat größtenteils wohl keinen Sinn. Deswegen nur eine Detailnachfrage:
  Herr Kornelius, können Sie uns sagen, seit wann genau der Kanzler vom Trauerfall
  von Frau Bas wusste? Das bezieht sich auch auf die Zeit vor dem Tod; das war ja
  wohl ein längerer Prozess. Ich kann Ihnen über die persönlichen Gespräche des Kanzlers
  mit Frau Bas hier keine Auskunft geben. Aber selbstverständlich ist die Situation
  schon länger bekannt. Hat der Kanzler mit Frau Bas darüber gesprochen, ob die Formulierung
  „forcierte Angriffe während der Trauerzeit, auch aus den Reihen des Koalitionspartners“
  Kabinettsmitglieder einschließt? Wird er es noch tun? Über die persönlichen Gespräche
  des Bundeskanzlers kann ich Ihnen hier nichts sagen. Geht der Kanzler beim gegenwärtigen
  Stand der Erkenntnisse davon aus, dass auch Kabinettsmitglieder gemeint sind, wenn
  Frau Bas von forcierten Angriffen spricht? Ihre forensische Arbeit in allen Ehren,
  aber ich denke, die öffentlichen Äußerungen sind bekannt. Es reicht ein Blick ins
  Archiv. Die SPD ist eine Verfechterin eines ausgeglichenen Geschlechterverhältnisses
  im Kabinett. Stehen dementsprechend weitere Änderungen an? Diese Frage adressiert
  eher die parteipolitische Konnotierung dieser Besetzung. Ich würde wie der Kollege
  im Finanzministerium empfehlen, diese Frage dem Parteivorsitzenden zu stellen. An
  das BMF: Warum musste der Minister seine Reise nach Indien absagen? Entsteht dadurch
  nicht ein Schaden? Nein, dadurch entsteht kein unmittelbarer Schaden, weil man die
  Gespräche natürlich nachholen kann und wir mit Indien als einem wichtigen strategischen
  Partner in einem permanenten Austausch sind. Sicherlich haben alle Verständnis dafür,
  dass Herr Klingbeil in den verschiedenen Funktionen, die er hat, hier jetzt einiges
  klären und sich hier um einiges kümmern muss und dafür beispielsweise in die Bundestagsfraktion
  geht und am Mittwoch im Kabinett sein wird. Deshalb muss der Indienteil der Reise
  verschoben werden. Ich denke, wie gesagt, dass alle dafür Verständnis haben. Herr
  Kornelius, der Sitzungskalender weist aus, dass in diesem Monat jetzt noch eine
  Sitzungswoche ist. Können wir daher davon ausgehen, dass noch in dieser Sitzungswoche
  ein neuer Minister an der Spitze des Ministeriums für Arbeit sitzen wird? Ich kann
  Ihnen keinen konkreten Zeitplan nennen, aber ich gehe davon aus, dass die Sitzungswoche
  unabhängig von der Frage betrachtet werden kann, wann der Minister seine Arbeit
  aufnimmt. Ich kenne es aus vorhergegangenen Situationen, dass eine Vereidigung auch
  zu einem nächstmöglich gelegenen Zeitpunkt vorgenommen werden kann. Herr Kornelius,
  die „Süddeutsche Zeitung“ schreibt unter Berufung auf die SPD-Spitze, dass Herr
  Merz noch vor Kurzem, zu einem Zeitpunkt, zu dem er über die private Notsituation
  bereits informiert gewesen sei, in einem Hintergrundgespräch mit Journalisten kritisiert
  habe, dass Bas so wenig in Berlin präsent sei. Können Sie das bestätigen, und wie
  passt das zu dem, was Sie eben gesagt haben? Das alles sind doch Kolportagen aus
  irgendwelchen Hintergründen auf anonymer Basis. Warum soll ich das dann kommentieren?
  Vielleicht um es richtig zu stellen, wenn es nicht stimmen sollte. Wieso soll ich
  auf eine anonyme Kolportage „richtig“ oder „falsch“ sagen? Sie halten mir ein Stöckchen
  hin, aber dann muss ich doch nicht springen. Entschuldigung! Herr Kornelius, Sie
  waren Teil der „SZ“-Reaktion. Sie wissen, wie dort Journalismus gemacht wird, dass
  dort auf mindestens zwei Quellen gebaut wird, wenn so etwas berichtet wird. Möchten
  Sie anzweifeln oder dementieren, was hier berichtet wird? Noch einmal: Ich werde
  auf anonyme Berichte und auf Kolportagen keine offizielle Äußerung abgeben können.
  Dafür bitte ich um Verständnis. Das ist nicht Journalismus. Sie waren Teil dieser
  Reaktion, und Sie wissen, wie dort Journalismus passiert. Wenn Sie sagen, der Kanzler
  habe von dem Fall von Frau Bas gewusst, und man gleichzeitig hört, dass er Unmut
  darüber äußert, dass sie kaum in Berlin sei, dann müssen Sie zumindest damit leben,
  dass wir hier nachfragen, wie das zusammenpasst. Ich nehme Ihre Feststellung zur
  Kenntnis. Ich habe Ihnen eben schon einmal gesagt, dass ich auf die Berichterstattung
  nicht reagieren kann, weil ich auf anonyme Berichte nicht reagiere. Meine Frage
  richtet sich an das Bundeskanzleramt. Die neun Landwirtschaftsministerinnen und
  ‑minister von der Union haben einen Brief an den Kanzler mit der Bitte geschrieben,
  die Zuckersteuer nicht einzuführen und auf Freiwilligkeit zu setzen. So habe man
  das auch im Koalitionsvertrag vereinbart. Wie ist die Position des Kanzlers dazu?
  Wie reagiert er darauf? Wir nehmen die Hinweise aus den Bundesländern zur Kenntnis.
  Wir sind mit diesen Vertretern in einem sehr guten Austausch auf der Fachebene.
  Die Zuckersteuer selbst steht nicht infrage. Zur Ausgestaltung werden jetzt noch
  Gespräche geführt. Darüber gibt es noch Abstimmungsbedarf. Diese Abstimmungen laufen
  momentan. Wir werden uns dann dazu äußern, wenn die Details tatsächlich feststehen.
  An das Finanzministerium: Wie ist nach den Diskussionen der letzten Wochen der aktuelle
  Stand bei der Zuckersteuer? Für wann ist mit einem nächsten Vorschlag zu rechnen?
  Der Stand ist so, wie ihn der Regierungssprecher gerade beschrieben hat. Die Abstimmungen
  innerhalb der Bundesregierung laufen. Es sind die ganz üblichen Abstimmungen, die
  es in jedem Gesetzgebungsverfahren gibt. Die Abstimmungen laufen, und wenn sie abgeschlossen
  sind, dann wird es den Gesetzentwurf geben. Aber wie gesagt: Die Abstimmungen laufen.
  Die „BILD“-Zeitung hat sehr konkret über eine Einigung mit detaillierten Änderungen
  im Vergleich zum letzten Gesetzentwurf berichtet. Wenn ich Sie jetzt richtig verstanden
  habe, dann ist das demzufolge nicht korrekt. Oder war das ein tatsächlicher Zwischenstand,
  der wieder überholt ist? Wie Sie gehört haben, haben wir von den letzten Abstimmungen
  gesprochen. Insofern ist das offenbar nicht korrekt gewesen. Wird das am kommenden
  Mittwoch also nicht im Kabinett sein? Die Abstimmungen laufen. Heute ist Montag.
  Das ist Lichtjahre von Mittwoch entfernt. Meine Frage geht an Herrn Hinterseher
  oder Herrn Kornelius. Wie blickt die Bundesregierung auf die Eskalation in Nahost
  zwischen Huthis und Saudi-Arabien ? Sie haben vielleicht gesehen, dass sich auch
  der Außenminister am Wochenende zu diesem schrecklichen Vorfall geäußert hat, indem
  er sagte: „Ich verurteile den schweren #Huthi-Angriff auf den Flughafen #Riad scharf ‑
  ein Terrorakt gegen #SaudiArabien & die zivile Luftfahrt. Unsere Gedanken sind bei
  den Opfern, den Angehörigen gilt mein tiefes Beileid.“ Er hat das Ganze in einem
  persönlichen Gespräch mit dem saudischen Außenminister Faisal bin Farhan auch noch
  einmal aufgenommen und ausgedrückt. Folgt daraus irgendetwas für die Bundesregierung,
  zum Beispiel mit Blick auf das Verhältnis zu Saudi-Arabien? Ich bin nicht sicher,
  was die Frage insinuiert, aber unser Verhältnis zu Saudi-Arabien als Partner in
  der Golfregion ist natürlich dahingehend wichtig. Wir werden Saudi-Arabien unsere
  volle Solidarität im Hinblick darauf versichern; das haben wir getan. Noch einmal:
  Es geht bei diesen Angriffen auf einen zivilen Flughafen auch um einen direkten
  Anschlag auf die zivile Luftfahrt. Diesbezüglich kann sich Saudi-Arabien auf unsere
  volle Solidarität verlassen. Meine Frage geht an das BMWE . Es gab ja Probleme bei
  der Rückreise der Ministerin aus Saudi-Arabien . Können Sie dazu etwas Neues sagen?
  Die Ministerin befindet sich wieder auf der Rückreise. Nähere Details kann ich Ihnen
  aus Sicherheitsgründen nicht mitteilen. Die Bundesregierung hat ja oft Probleme,
  Kriegsverbrechen festzustellen. Herr Hinterseher, kann ich daraus schließen, dass
  der Angriff der Huthis auf den Flughafen für Sie ein Kriegsverbrechen ist? Ich habe
  die Worte gewählt, die ich gerade gewählt habe und die auch der Außenminister am
  Wochenende gewählt hat. Es ist an Ihnen, zu interpretieren, was ich hier sage. Aber
  ich bitte Sie, mir keine Worte in den Mund zu legen. Das habe ich ja nicht getan.
  Ich versuche zu verstehen, ob Sie darunter ein Kriegsverbrechen ‑ ‑ ‑ Sie haben
  ja von einem Terrorakt gesprochen. Ist das ein Kriegsverbrechen? Das sind ja Kriegsbeteiligte.
  Es ist ein Angriff auf einen zivilen Flughafen. Gemeinhin würde ich das als Kriegsverbrechen
  verstehen. So interpretiere ich das. Dann ist es ‑ ‑ ‑ Dann kann ich nachfragen,
  ob das die richtige Interpretation ist. Wir haben das hier für Sie bewertet. Sie
  können diese Bewertung für sich wiederum einordnen und nutzen, aber ich benutze
  hier die Worte, die ich benutze. Noch einmal, weil wir dieses Thema ja öfter haben,
  auch in anderen Kontexten: Es geht nicht darum, dass wir hier für Sie eine rechtliche
  Bewertung einzelner Vorfälle vornehmen. Wir haben das Ganze politisch bewertet,
  und an dieser Bewertung können Sie sich abarbeiten. Die Aussagen von Frau Reiche
  im Interview der „Süddeutschen Zeitung“ waren hier in der Bundespressekonferenz
  schon vergangene Woche Thema. Zum einen hat sie gesagt, für die Wärmepumpenförderung
  seien zwölf Milliarden Euro ausgegeben, obwohl es laut Haushalt nur rund sechs Milliarden
  sind. Zum anderen hat sie gesagt, dass mehr Gas in den Gasspeichern liege, als im
  kältesten Winter verbraucht worden sei. Beides war nicht so richtig zutreffend.
  Dazu war eine Nachlieferung angekündigt worden, die aber nicht gekommen ist. So
  richtig zitierfähige Aussagen dazu habe ich noch nicht gehört. Können Sie sagen,
  was davon jetzt stimmt und wie diese Falschaussagen zustande gekommen sind? Zum
  zweiten Teil, zum Thema der Gasspeicher: Das ist ein kleiner Fehler, der im Haus
  entstanden ist. Das haben wir korrigiert. Das war aber nicht Gegenstand der RegPK.
  Deswegen gab es dazu keine Nachlieferung. Zum ersten Teil: Die Ministerin hat in
  dem Zusammenhang gesprochen, dass die Förderung durch die Bundesförderung für effiziente
  Gebäude erfolgt. Dort erfolgt zu einem Großteil oder zumindest zur Mehrheit die
  Förderung für die Heizung. Diese Förderung geht zu 90 Prozent in Wärmegruppen. Sie
  hat das in diesem Kontext gesagt. Im Interview war es nicht so, da war nur von Wärmepumpen
  die Rede. Was sie gesagt hat, weiß ich natürlich nicht. Im Bundestag hat sie aber
  am selben Tag explizit gesagt, die Wärmepumpenförderung sei von 12 auf 13 Milliarden
  Euro erhöht worden. Wie passt das dazu, dass Sie sagen, es sei ihr um die Gebäudeförderung
  insgesamt gegangen, wenn sie da zumindest, explizit auch im Bundestag, nur von Wärmepumpen
  gesprochen hat? Das ist sicherlich im gleichen Zusammenhang zu sehen. In der „SZ“
  ist es richtiggestellt. Frau Ungrad, ich möchte noch präzisieren. Bei der Frage
  in der vergangenen Woche an Ihren Kollegen ging es sehr wohl um die Zahlen. Die
  Ministerin hat von einer Förderung für Wärmepumpen von 12 Milliarden Euro gesprochen.
  Dem wurde entgegengehalten, dass es ausweislich der vorliegenden Daten nur 5 Milliarden
  Euro wären. Von Ihrem Kollegen wurde signalisiert, dass es dazu eine Antwort geben
  würde. Ich denke schon, dass man das als Nachlieferungsankündigung verstehen darf.
  Das habe ich auch hiermit gesagt. Ich habe gesagt, zu dem anderen Thema gab es keine
  Nachlieferungsforderungen. Zu diesem Thema hatten wir auch telefoniert. Ich habe
  in der Tat die Nachlieferung jetzt nicht rausgeschickt. Weil der Finanzminister
  in seiner Funktion als SPD-Vorsitzender gerade mitgeteilt hat, dass er die Parteispitze
  zum Jahreswechsel neu wählen lassen will , würde mich interessieren, ob er zumindest
  im Ministerium schon kommuniziert hat, ob er, wenn noch nicht ganz klar ist, ob
  er an der Parteispitze weitermachen will, auf jeden Fall als Finanzminister erhalten
  bleiben wird. Ich würde dazu auf das Statement verweisen, das er gerade gegeben
  hat und das ich mir jetzt von hier aus nicht ansehen konnte. Ich glaube, jenseits
  dessen, was er dort gesagt hat, gibt es nichts anzukündigen. Eine Frage zur Videospielförderung
  an das Forschungsministerium: Seit 2019 hat der Bund über 700 Computerspielprojekte
  mit fast 240 Millionen Euro gefördert. Laut Ihrer aktuellen Antwort an den Bundestag
  ‑ Bundestagsdrucksache 21/8101 ‑ erfassen Sie aber nicht, wie viele dieser Spiele
  überhaupt erschienen sind, wie oft sie verkauft wurden oder wie viele Arbeitsplätze
  dadurch entstanden sind. Dazu würde mich interessieren: Wie stellt das Forschungsministerium
  denn sicher, dass dieses Steuergeld gut angelegt ist? Games sind ein ernstzunehmender
  Innovations- und Wirtschaftsbooster für den Standort Deutschland. Zu Ihrer Frage
  würde ich auf die Antwort verweisen, die wir an den Bundestag gegeben haben. Dem
  habe ich hier nichts hinzuzufügen. Der Bundesrechnungshof hatte vorgeschlagen, dass
  Entwicklungsstudios das Geld zurückzahlen, wenn ihr gefördertes Spiel Erfolg hat.
  Das haben Sie mit dem Argument abgelehnt, dass der Staat ja über die Steuern mitverdiene.
  Dann frage ich mich aber: Wie können Sie das sagen, wenn Sie nach eigener Aussage
  gar nicht wissen, was diese Spiele einbringen, weil Sie das einfach nicht erfassen?
  Ich vermute, Sie beziehen sich auf einen Bericht des Bundesrechnungshofs, der aktuell
  nicht öffentlich ist. Den kann ich hier nicht kommentieren. An das BMWE: Beim Netzpaket
  und der EEG-Novelle scheint sich die zweite und dritte Lesung im Bundestag auf den
  November zu verschieben. Dazu gibt es ja, besonders beim EEG, einige relevante EU-Fristen,
  die zum Jahresende eingehalten werden müssen. Sonst drohen gravierende Konsequenzen
  für den Ausbau der Erneuerbaren ‑ so heißt es aus der Energiebranche. Teilt das
  BMWE diese Sorgen? Zum Verfahren im Parlament müssten Sie Ihre Frage ans Parlament
  richten. Das können wir hier nicht beurteilen. Beihilfeverfahren können auch erst
  begonnen werden, wenn die Gesetzesänderungen in finaler Abstimmung sind. Ich kann
  hier nicht spekulieren, wie die zeitlichen Ausgestaltungen sind. Wir gehen nach
  wie vor davon aus, dass wir das rechtzeitig umsetzen können. Rechtzeitig heißt bis
  zum Jahresende? Sie gehen also davon aus, dass die Notifizierung bis dahin passiert?
  Wäre es nicht so schlimm, wenn das vielleicht erst über das Jahresende hinaus klappen
  würde? Wir gehen davon aus, dass wir das rechtzeitig umsetzen können. (zum Interview
  der „Süddeutschen Zeitung“ mit der Bundeswirtschaftsministerin ) Eine ganz kurze
  Nachfrage zum Thema von eben, Frau Ungrad, weil Sie sagten, das sei korrigiert worden.
  Ich kann das jetzt in der Onlineversion nicht finden. Auf welchem Weg ist das denn
  in der „Süddeutschen Zeitung“ korrigiert worden? Indem wir das der „Süddeutschen
  Zeitung“ mitgeteilt haben. Normalerweise gibt es einen Redigierungsprozess bei Printinterviews.
  Das heißt, ein geführtes Interview wird dem Ministerium bzw. der Ministerin vorgelegt,
  damit man darüber schauen kann. Ist Ihrem Presseteam, ist Ihnen diese Falschaussage
  nicht aufgefallen? Dazu kann ich mich jetzt nichts äußern. Ich kann Ihnen dazu nichts
  sagen. Ich hätte noch eine Frage zur Dankesrede des Gewinners des diesjährigen Friedenspreises
  des Deutschen Buchhandels Philippe Sands an das AA. Herr Sands hat Ihnen unanständiges
  Schweigen im Umgang mit Israel vorgeworfen. Was antworten Sie ihm? Wir haben die
  Äußerung zur Kenntnis genommen. Wir finden das sehr wichtig, dass in einem Diskurs
  unterschiedliche Meinungen dargestellt werden können. Nicht alle dieser Meinungen
  werden wir uns automatisch zu Herzen nehmen. Wir haben hier sehr oft unsere Politik
  in Bezug auf Israel und unsere Nahostpolitik dargelegt und sehen keine Veranlassung,
  diese Kritik zu kommentieren. Wir haben sie aber zur Kenntnis genommen. Herr Kornelius,
  mich würde schon interessieren, ob der Kanzler als Koalitionspartner darüber informiert
  wurde, dass Herr Klingbeil jetzt die komplette SPD-Spitze neu wählen lassen will
  . Gab es davor eine Ankündigung? Wussten Sie Bescheid? Der Bundeskanzler und der
  Finanzminister sind auch in ihren Rollen als Parteivorsitzende im engen Austausch.
  Das ist natürlich eine Entscheidung, die der Parteivorsitzende Klingbeil als Parteivorsitzender
  fällt; insofern gehört das nicht unbedingt in den Amtsbereich des Bundeskanzlers.
  Aber Sie können sich sicher sein: Die beiden sind in einem guten und sehr engen
  Austausch. Ist das nicht eine Bremse für die Arbeit der Koalition, wenn jetzt die
  komplette Spitze eines Koalitionspartners neu gewählt werden soll? Ich habe dazu
  kein Urteil zu fällen. Das ist eine Entscheidung des SPD-Vorsitzenden und der SPD-Führung.
  Die Koalition arbeitet weiter. Herr Kall, fliegt die Delegation jetzt eigentlich
  ohne den Minister nach Indien und Thailand ? Oder fliegen alle nicht? Nein, selbstverständlich
  nicht. Es wird noch geprüft, ob der zweite geplante Teil der Reise ab Mitte, Ende
  der Woche zur IWF-Herbsttagung stattfinden kann. Es ist heute niemand nach Indien
  gereist. Wenn der Minister nicht reist, dann reist auch keine Delegation. Hätte
  nicht auch ein Staatssekretär nach Indien reisen können? Die Reise nach Indien war
  als bilateraler Besuch des Bundesfinanzministers bei seinem Amtskollegen und für
  weitere Gespräche gedacht. Meines Wissens gibt es jetzt keine Vertretung, sondern
  wir versuchen, einen solchen Besuch nachzuholen. Wie gesagt: Mit Indien als engem
  strategischen Partner sind wir in gutem Kontakt. Leichte Ironie: Im Unterschied
  zu dem Friedenspreisträger gestern in Frankfurt hat gerade der kommissarische General
  der UNRWA , des Palästinenserhilfswerks, die Bundesregierung gelobt und gesagt,
  sie seien eigentlich die einzigen in Europa, die UNRWA nach wie vor unterstützten.
  Herr Hinterseher, jetzt stelle ich ernsthaft die Frage: Hat sich in den letzten
  Tagen und Wochen an der deutschen Behandlung dieses palästinensischen Hilfswerks
  irgendetwas geändert? Werden dort noch Mittel aufgestockt? Die ganze Litanei ist
  morgen nachzulesen oder heute schon nachzuhören, was der Herr Saunders ‑ das ist
  der Herr, der gerade die Pressekonferenz gegeben hat ‑ da zusammenaddiert hat. Ändert
  sich daran etwas? ‑ Das ist ganz einfach eine Lernfrage, um umfassend die Aktualität
  zu haben. Nein, ich habe Ihnen hier keine Ankündigung zu machen, dass sich in Bezug
  auf unsere Unterstützung für UNRWA gerade etwas geändert hätte. Allerdings ist auch
  ein Teil der Finanzierung für UNRWA im Auswärtigen Amt verortet. Deshalb würde ich
  mich einmal umdrehen und vielleicht auch das BMZ angucken. Gibt es Erwägungen, dass
  die Bundesregierung das vielleicht in arabischen Staaten und auch in anderen europäischen
  Staaten, in denen die Mittel gekürzt wurden, auszugleichen gedenkt, oder Anregungen
  zu machen, um das ausgleichen zu lassen? Gibt es da Initiativen, von denen wir alle
  nur noch nichts wissen? Ich würde gerne das wiederholen, was ich soeben gesagt habe.
  Wie gesagt, grundsätzlich kennen Sie die Gemengelage. Sie wissen, dass das Auswärtige
  Amt vor allem für humanitäre Hilfe zuständig ist, aber zum Beispiel auch für Stabilisierung.
  In diesem Zusammenhang gibt es seit einigen Jahren einen rückläufigen Trend, was
  die Mittel angeht. Insofern müssen wir diese Mittel gezielter und fokussierter einsetzen
  und auch regionale Schwerpunkte setzen. Das ist die Einordnung, die ich Ihnen dazu
  geben kann. Aber ich habe Ihnen in Bezug auf neue Mittelverwendungen hier an dieser
  Stelle nichts darzubieten. Herr Kornelius, ich habe noch einmal eine Verständnisfrage
  zu den anfänglichen Äußerungen von Herrn Hinterseher, der den Drohnenvorfall in
  Leipzig mutmaßlich Russland zugeschrieben hat. Jetzt hat der Kanzler erst letzte
  Woche erklärt: Der 4. August war ein bewaffneter Angriff auf den Flughafen Leipzig,
  ausschließlich von Russland kommend. - Da würde mich interessieren: Wieso hat sich
  denn der Kanzler nicht dieser Sprachregelung von Herrn Hinterseher angeschlossen
  und bei laufenden Ermittlungen noch von „mutmaßlich“ gesprochen? Um da vielleicht
  gar kein Missverständnis aufkommen zu lassen: Den Begriff „mutmaßlich“ können Sie
  geflissentlich streichen. Wir haben diesen Anschlag attribuiert. Insofern ist der
  konstruierte Widerspruch auch keiner. Ich möchte an dieser Stelle lieber diese Äußerung
  korrigiert wissen, als dass Sie sie nutzen, um daraus einen Widerspruch zu konstruieren.
  Noch einmal: Der Drohnenanschlag von Leipzig ist ganz klar Russland attribuiert
  worden. Russland steckt hinter diesem versuchten Anschlag. Für Leute gefragt, die
  in dieser Begrifflichkeit der Attribuierung nicht so drinstecken: Welche rechtsstaatliche
  Bedeutung hat denn die Attribuierung der Bundesregierung und von Geheimdiensten
  für die laufenden Ermittlungen? Hat das also irgendeine rechtliche Relevanz für
  die laufenden Ermittlungen? Ich kann hier keine rechtliche Einschätzung geben. Das
  zieht sich auch wieder auf andere Fragen zurück, die sich immer damit befassen.
  Ich kann hier keine rechtliche Einschätzung abgeben. Sie wissen: Es gibt parallel
  dazu ein Verfahren, wir leben in einem Rechtsstaat, und dort werden alle rechtsstaatlichen
  Schritte eingehalten. Wir haben diesen Anschlag attribuiert, weil das eben zu dem
  Zeitpunkt auch notwendig war, um das entsprechende Signal zu setzen, dass wir uns
  hybride Vorfälle dieser Art dauerhaft nicht gefallen lassen werden. Meine Frage
  war ja eigentlich an den Regierungssprecher gerichtet. Ich weiß nicht, wie da die
  Hierarchieverhältnisse sind, aber ich höre trotzdem gerne die Antwort von der Person,
  an die ich die Frage auch gerichtet hatte. Sie hatten „mutmaßlicher Anschlag“ gesagt.
  Das war doch jetzt nicht das, was der Kollege Ihnen vorgetragen hat, Herr Hinterseher.
  Das habe ich ja gerade korrigiert. Ich weiß nicht, ob Sie mir zugehört haben. Ist
  ein Anschlag nach Ihrer Wahrnehmung dasselbe wie ein Anschlagsversuch? Nein, ein
  Anschlagsversuch ist ein missglückter Anschlag oder ein Anschlag, der eben nicht
  zum gewünschten Erfolg geführt hat, wobei der Begriff „Erfolg“ in diesem Zusammenhang
  natürlich wirklich mit den entsprechenden Kautelen zu versehen ist. Das hätte zu
  einer Katastrophe führen können, und wir sind froh, dass es nicht dazu gekommen
  ist. Andererseits ist der Versuch als solcher zu werten, denn es geht ja darum,
  den Schutz der Bevölkerung zu gewährleisten und Schaden von der Bevölkerung abzuwenden,
  und das ist die Verantwortung der Bundesregierung. Deshalb wurde dieser Anschlag
  attribuiert, und deshalb wurde auch Russland entsprechend mitgeteilt, wie wir damit
  umzugehen gedenken. Unter anderem haben wir Maßnahmen ergriffen. Die Maßnahmen wurden
  hier, glaube ich, auch in aller Ausführlichkeit und Breite dargelegt. Darauf können
  Sie, glaube ich, noch einmal Bezug nehmen. Ich würde mir nur wünschen, dass es nicht
  mehr zwischen „Anschlag“ und „Anschlagsversuch“ hin und her geht. Das sind zwei
  verschiedene Paar Schuhe.'
