title: Ehemaliger Regierungssprecher Uwe-Karsten Heye verstorben
text: 'Staatssekretär a.D. Uwe-Karsten Heye ist am 30. Juli 2026 im Alter von 85 Jahren
  verstorben. Er war von 1998 bis 2002 als Chef des Bundespresseamtes zugleich Sprecher
  der Bundesregierung unter Bundeskanzler Gerhard Schröder. Davor war StS a.D. Heye
  über lange Jahre für verschiedene Medien als Journalist tätig. Bevor er 1998 zum
  Sprecher der Bundesregierung berufen wurde, nahm er ab 1990 bereits eine vergleichbare
  Funktion als Sprecher der niedersächsischen Landesregierung wahr. Nach seinem Ausscheiden
  aus dem Bundespresseamt übernahm Uwe-Karsten Heye 2003 die Leitung des Generalkonsulats
  New York im Geschäftsbereich des Auswärtigen Amtes. Von 2006 bis 2010 war er als
  Chefredakteur der SPD-Parteizeitung „Vorwärts“ tätig. Uwe-Karsten Heye war Vorstandsvorsitzender
  des Vereins „Gesicht Zeigen! Für ein weltoffenes Deutschland e.V.“, den er im Jahr
  2000 mitgegründet hat. Regierungssprecher Stefan Kornelius: „Uwe-Karsten Heye stand
  für kollegialen, wertschätzenden Umgang mit Kolleginnen, Kollegen, Journalistinnen
  und Journalisten. Er prägte das Amt mit seinem Gespür für Sprache und ihre Wirkung
  – und mit einer Standfestigkeit, die er auch nach seiner aktiven Zeit als engagierte
  Stimme gegen Rechtsextremismus bewahrte. Diese Klarheit und Menschlichkeit werden
  uns fehlen." Unser tiefes Mitgefühl gilt seiner Familie. Wir werden Uwe-Karsten
  Heye nicht vergessen und ihm ein ehrendes Andenken bewahren.'
