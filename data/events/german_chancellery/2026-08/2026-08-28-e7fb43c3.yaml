title: Kondolenztelegramm von Bundeskanzler Merz an den Staatspräsidenten der Volksrepublik
  China, Xi Jinping
text: Sehr geehrter Herr Präsident, mit großer Bestürzung habe ich die Berichte und
  Bilder von der verheerenden Sturzflut in China verfolgt. In diesen schweren Stunden
  sind meine Gedanken bei den Opfern, ihren Angehörigen und allen von der Katastrophe
  betroffenen Menschen. Ihnen gilt mein tief empfundenes Mitgefühl. Den Verletzten
  wünsche ich eine rasche und vollständige Genesung. Mit stillem Gruß Friedrich Merz
  Bundeskanzler der Bundesrepublik Deutschland
