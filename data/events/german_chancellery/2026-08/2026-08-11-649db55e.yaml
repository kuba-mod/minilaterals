title: Künstlerin Gabriele Stötzer erhält das Johanna und Eduard Arnhold-Stipendium
  der Deutschen Akademie Rom Villa Massimo
text: 'Die Künstlerin, Autorin und Performerin Gabriele Stötzer wird mit dem Johanna
  und Eduard Arnhold-Stipendium der Deutschen Akademie Rom Villa Massimo ausgezeichnet.
  Dazu erklärt Staatsminister Weimer: „Mit der Auszeichnung von Gabriele Stötzer würdigt
  die Jury eine Künstlerin, die eindrucksvoll zeigt, wie Freiheit auch unter Druck
  bestehen und gesellschaftlich wirksam werden kann. Ihr herausragendes Werk steht
  für Freiheit, demokratische Selbstbehauptung und zivilgesellschaftliche Verantwortung.“
  Gabriele Stötzer zählt zu den prägenden Persönlichkeiten des unabhängigen künstlerischen
  Schaffens in der DDR. Sie entwickelt Ausdrucksformen, in denen Körper, Sprache,
  Erinnerung und Widerstand eng miteinander verbunden sind. Ihre Kunst gilt als ein
  vielstimmiges, experimentelles und feministisches Gesamtwerk, das Fragen von Selbstbestimmung,
  Verletzlichkeit, Gemeinschaft und öffentlicher Stimme immer wieder neu verhandelt.
  Angesichts autoritärer Tendenzen, wachsender Geschichtsvergessenheit und erneuter
  Angriffe auf demokratische Institutionen besitzt ihr Werk eine hohe gesellschaftliche
  und politische Aktualität. Kulturstaatsminister Weimer hat das Johanna und Eduard
  Arnhold-Stipendium im vergangenen Jahr ins Leben gerufen. Benannt nach der bedeutenden
  jüdischen Gründer- und Stifterfamilie Johanna und Eduard Arnhold würdigt es internationale
  Künstlerpersönlichkeiten, deren Arbeit auf besonders eindrückliche Weise demokratische
  Werte und die Bedeutung von Freiheit thematisiert. Das Johanna und Eduard Arnhold-Stipendium
  der Deutschen Akademie Rom ist wie der Rompreis mit einem bis zu zehnmonatigem Aufenthalt
  in der Villa Massimo und der Einbindung in die künstlerische Veranstaltungs- und
  Programmarbeit in Rom verbunden. Die Deutsche Akademie Rom Villa Massimo nahm 1913
  ihre Tätigkeit auf. Sie befindet sich im Eigentum der Bundesrepublik Deutschland
  und wird vom Beauftragten der Bundesregierung für Kultur und Medien getragen. Sie
  ist die bedeutendste Einrichtung zur Spitzenförderung deutscher und in Deutschland
  lebender und wirkender Künstlerinnen und Künstler im Ausland. Der Rompreis gehört
  zu den höchsten Auszeichnungen, die die Bundesrepublik Deutschland an Künstlerinnen
  und Künstler aus den Bereichen der bildenden Kunst, Musikkomposition, Architektur
  und Literatur jährlich vergibt. Die Auswahl der Künstlerinnen und Künstler für das
  Johanna und Eduard Arnhold-Stipendium erfolgt durch eine unabhängige Jury. Mitglieder
  der Jury in diesem Jahr waren Hilke Wagner (Direktorin des Albertinums der Staatlichen
  Kunstsammlungen Dresden), Bjørn Melhus (Bildender Künstler und Rompreisträger 2023/24)
  und Dr. Julia Draganović (Direktorin der Deutschen Akademie Rom).'
