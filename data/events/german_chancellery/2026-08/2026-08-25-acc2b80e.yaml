title: Kabinettsklausur im Schloss Neuhardenberg Wettbewerbsfähigkeit und Innovationen
  stärken
text: 'Das Bundeskabinett ist in Schloss Neuhardenberg zur Kabinettsklausur zusammengekommen.
  Wie kann Deutschland ein starkes Industrieland bleiben, auch im KI -Zeitalter zur
  Weltspitze gehören und damit Wohlstand und Arbeitsplätze im Land sichern? Unter
  anderem mit dieser Frage beschäftigt sich das Bundeskabinett bei der Kabinettsklausur
  im Schloss Neuhardenberg. Auch das Thema Dürre soll in der anschließenden ordentlichen
  Kabinettssitzung am Mittwoch diskutiert werden. Bundeskanzler Friedrich Merz betonte
  zu Beginn der Klausur, dass die Bundesregierung eine neue Politik zum Wohle Deutschlands
  eingeleitet habe. Es gehe nun darum, die Stärken des Landes zu nutzen, um „das Wachstum
  und die Beschäftigung von morgen zu ermöglichen“. Ministerin Dorothee Bär, Minister
  Karsten Wildberger und Ministerin Verena Hubertz unterstrichen in ersten Statements
  die gute Arbeitsatmosphäre der Gespräche. Dem Kabinett ist eine Vielzahl an Perspektiven
  auf die anstehenden Themen wichtig: Die Gastredner repräsentieren internationale
  Unternehmen, das Handwerk, Startups und Kapitalgeber. Dabei decken sie eine Themenvielfalt
  von industrieller KI über Verteidigung, Sicherheit bis hin zum lokalen Klimaschutz
  ab. Zum Auftakt diskutierte die Bundesregierung die Rahmenbedingungen für industrielle
  Wettbewerbsfähigkeit, Souveränität und Schlüsseltechnologien. Dazu hielten Roland
  Busch ( CEO Siemens) sowie Aidan Gomez ( CEO Cohere ) Impulsvorträge. Forschungs-,
  Technologie- und Raumfahrtministerin Dorothee Bär betonte in einer Pressekonferenz
  nach dieser Arbeitssitzung, dass die Bundesregierung Modernisierung und Innovation
  vorantreibe: „Innovationspolitik ist Zukunftsvorsorge“, so Bär. Das sei vor allem
  auch für die Souveränität und Sicherheit Deutschlands zentral. Auch der Bundesminister
  für Staatsmodernisierung und Digitales, Karsten Wildberger, hob die Bedeutung der
  digitalen Souveränität hervor. Dazu gehöre eine unabhängige Infrastruktur und Wettbewerbsfähigkeit
  im Bereich der künstlichen Intelligenz. Wichtig sei auch hier, die Anstrengungen
  für den Bürokratierückbau zu verstärken und die Geschwindigkeit weiter zu erhöhen.
  Die Bundesministerin für Wohnen, Stadtentwicklung und Bauwesen, Verena Hubertz,
  unterstrich die Bedeutung von mehr Geschwindigkeit und weniger Bürokratie auch beim
  Bauen. Die Bauwirtschaft sei zentral für die Konjunktur und müsse wieder Fahrt aufnehmen.
  Daran arbeite die Bundesregierung entschlossen und gemeinsam – auch in Neuhardenberg.
  Neuhardenberg, 25. August 2026: Zum Auftakt der zweitägigen Klausurtagung des Bundeskabinetts
  betonte Bundeskanzler Friedrich Merz in einem Statement , dass im Mittelpunkt der
  Beratungen die Stärkung der Wettbewerbsfähigkeit und das Wirtschaftswachstum stünden.
  Der Staat müsse dafür die notwendigen und richtigen Voraussetzungen schaffen. Deutschland
  könne im globalen Wettbewerb bestehen und sogar Vorbild sein, zeigte sich der Kanzler
  zuversichtlich. An der Klausurtagung nehmen alle Kabinettsmitglieder der Bundesregierung
  teil – darunter auch Bundesfinanzminister Lars Klingbeil und Bundesinnenminister
  Alexander Dobrindt. Kanzleramtsministerin Warken tauschte sich vor Beginn der ersten
  Arbeitssitzung mit Bundesgesundheitsminister Linnemann, Bundesinnenminister Dobrindt,
  Bundeskanzler Merz und Staatsminister Krichbaum aus. Bei den Themen Rente, Gesundheit,
  Steuern sowie innerer und äußerer Sicherheit seien wichtige und richtige Weichen
  gestellt worden, hob der Kanzler im Statement hervor. Nun ginge es darum, Deutschlands
  Wirtschaftsmodell in die neue Zeit zu führen. Bundesaußenminister Wadephul im Gespräch
  mit Bildungsministerin Prien, Bundesverteidigungsminister Pistorius und Kanzlerberater
  Sautter. Mit Blick auf Deutschlands Sicherheit nannte der Kanzler drei Grundsätze:
  Deutschland bleibt ein sicheres Land. Deutschland schreckt ab. Und: Deutschland
  hält Kurs. Dem Kabinett ist eine Vielzahl an Perspektiven auf die anstehenden Themen
  wichtig. An der zweitägigen Klausurtagung nehmen daher Gastredner teil, die internationale
  Unternehmen, das Handwerk, Start-ups und Kapitalgeber repräsentieren. Zu den Gästen
  gehören Aidan Gomez vom Unternehmen Cohere sowie Siemens- CEO Roland Busch. Ihr
  Input gilt den Themen industrielle Wettbewerbsfähigkeit und Schlüsseltechnologien.
  Das Familienfoto ist traditioneller Bestandteil einer jeden Kabinettsklausur. Dafür
  kam das Bundeskabinett am Schloss Neuhardenberg zusammen. Neuhardenberg, 25. August
  2026: Zum Auftakt der zweitägigen Klausurtagung des Bundeskabinetts betonte Bundeskanzler
  Friedrich Merz in einem Statement , dass im Mittelpunkt der Beratungen die Stärkung
  der Wettbewerbsfähigkeit und das Wirtschaftswachstum stünden. Der Staat müsse dafür
