  Themen industrielle Wettbewerbsfähigkeit und Schlüsseltechnologien. Das Familienfoto
  ist traditioneller Bestandteil einer jeden Kabinettsklausur. Dafür kam das Bundeskabinett
  am Schloss Neuhardenberg zusammen. Beispiele dafür, wie Innovation und Technologie
  in Wirtschaft und Staat gut funktionieren, sind im Anschluss an die Diskussion zu
  sehen. Neue Technologien können Deutschland sicherer machen und gleichzeitig technologische
  Fähigkeiten und Wertschöpfung in Wirtschaft und Gesellschaft tragen. Verteidigung,
  Sicherheit und gesamtwirtschaftliche Innovation können hier Hand in Hand gehen.
  Das zeigt eine Flugdemonstration der Abfangdrohne von Tytan Technologies mit CEO
  und Gründer Balazs Nagy. Als erfolgreiches Start-up der Verteidigungsindustrie steht
  das Unternehmen für eine neue Generation technologiegetriebener Unternehmen in Deutschland.
  BKA und Zoll zeigen, wie der Staat selbst Anwender und Treiber neuer Technologien
  sein kann. Dazu werden Anwendungen von künstlicher Intelligenz (KI) und neuen Technologien
  im Bundeskriminalamt und der digitalen Personenüberprüfung durch den Zoll mit der
  ZEPOSApp und einer Zollhundevorführung demonstriert. Die Vorführungen werden begleitet
  von Impulsvorträgen der Bundesminister Boris Pistorius, Alexander Dobrindt und Carsten
  Linnemann. Am Mittwoch schließt sich eine Diskussion zur Wettbewerbsfähigkeit von
  Handwerk und Start-ups an. Impulsvorträge sind von Jörg Dittrich (Präsident Zentralverband
  des Deutschen Handwerks), Judith Dada ( General Partner Visionaries Club , Gewinnerin
  Investorin des Jahres beim German Startup Award ) und Ruth Bosse ( CEO & Gründerin
  Ark Climate , Gewinnerin Newcomerin des Jahres beim German Startup Award ) geplant.
  Im Anschluss findet eine ordentliche Kabinettssitzung statt. Schloss Neuhardenberg
  liegt am Rand des Oderbruchs und entstand als barocker Bau im frühen 18. Jahrhundert.
  Der Ort ist zudem eng mit dem deutschen Widerstand gegen den Nationalsozialismus
  verbunden: Carl-Hans Graf von Hardenberg, der das Gut 1921 übernahm, war einer der
  Verschwörer des Attentats auf Hitler vom 20. Juli 1944. Auf Schloss Neuhardenberg
  konnten Claus Schenk Graf von Stauffenberg, Henning von Tresckow und weitere Beteiligte
  die Vorbereitungen relativ unbehelligt vorantreiben. Seit 2001 liegt die Verantwortung
  für Schloss und Kulturprogramm bei der Stiftung Schloss Neuhardenberg. Bereits Anfang
  der 2000er wurde der Ort zudem für Kabinettsklausuren genutzt.'
