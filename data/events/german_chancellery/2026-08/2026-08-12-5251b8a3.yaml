title: Bundeskabinett beschließt Reform des Rechts der Nachrichtendienste
text: 'Der heute vom Bundeskabinett beschlossene Gesetzentwurf zur Reform des Nachrichtendienstrechts
  stellt die umfangreichste und grundlegendste Überarbeitung der gesetzlichen Grundlagen
  von Bundesnachrichtendienst und Bundesamt für Verfassungsschutz in der bundesdeutschen
  Geschichte dar. Bundesministerin für besondere Aufgaben und Beauftragte für die
  Nachrichtendienste Nina Warken: „Deutschland ist ständiges Ziel von hybriden Angriffen
  auf unsere freie Gesellschaft, unser Werteverständnis und unsere Sicherheit. Um
  dem Schutzauftrag des Staates gegenüber seinen Bürgerinnen und Bürgern gerecht werden
  zu können, brauchen unsere Nachrichtendienste mehr Befugnisse und zusätzliche operative
  Fähigkeiten. In Zukunft sollen unsere Dienste auf Höhe der Zeit und auf Augenhöhe
  mit unseren Partnern agieren können. Der Gesetzentwurf schafft genau hierfür die
  Grundlage und stärkt zudem die Kontrolle sowie damit das Vertrauen in den staatlichen
  Schutz unseres Gemeinwesens.“ Bundesinnenminister Alexander Dobrindt: „Sabotage,
  Spionage, Cyberangriffe und verdeckte Aktionen fremder Mächte erfordern neue Antworten.
  Mit der Reform der Nachrichtendienste hin zu echten Geheimdiensten stärken wir tragende
  Säulen unserer Sicherheitsarchitektur. Wir ermöglichen für die Dienste operative
  Fähigkeiten und aktive Befugnisse, um effektiv gegen den modernen Staatsterrorismus
  und extremistische Gewalt vorzugehen.“ 1.    Erweiterung der Aufklärungsbefugnisse
  Die Aufklärungsbefugnisse der Dienste werden umfassend gestärkt und in nahezu jedem
  Bereich systematisch neu geregelt und erweitert. Ein Fokus liegt auf den technischen
  Aufklärungsmöglichkeiten: Stärkung der Zugriffsmöglichkeiten auf informationstechnische
  Systeme, indem differenzierte Regelungen geschaffen werden, die die unterschiedlichen
  Eingriffstiefen bei Zugriffen auf informationstechnische Systeme durch eingriffsadäquate
  Schwellen und Verfahrensvorgaben berücksichtigen. Es sind daher Regelungen im Spektrum
  von wenig eingriffsintensiven Maßnahmen, wie beispielsweise solche gegen einen intelligenten
  Kühlschrank, bis hin zu erheblich eingriffsintensiven, z.B. gegen ein privat genutztes
  Mobiltelefon, vorgesehen. Anpassung der strategischen Aufklärung des BND an die
  Regelungssystematik europäischer Partnerdienste, indem der BND erhobene Daten ohne
  vorherige Sichtung für einen Zeitraum von 6 Monaten (Inhaltsdaten) bzw. bis 12 Monaten
  (Metadaten) speichern darf. Dadurch kann der BND auch rückwirkend relevante Daten
  erkennen und verarbeiten. Vorteile dieser neuen Regelungssystematik ist insbesondere,
  dass der BND dadurch kaltstartfähig wird: In Krisensituationen, etwa bei Anschlägen
  oder Regimeumstürzen, kann er auf den gespeicherten Datenbestand zugreifen und vorhandene
  Daten unverzüglich nutzen, etwa für die Weitergabe an europäische Partnerdienste
  oder für die Information der Bundesregierung. 2.    Stärkung der Befugnisse der
  Datenanalyse und -verarbeitung Der Gesetzentwurf sieht für die Nachrichtendienste
  eine Stärkung der Analysemöglichkeiten und eine Abschaffung administrativer Hürden
  vor. Es werden z.B. klare Rechtsgrundlagen für die Verwendung von Tools für den
  biometrischen Abgleich von Bilddaten, für den Einsatz künstlicher Intelligenz sowie
  für die Weiterverarbeitung von Daten für Forschungs- und Entwicklungszwecke geschaffen.
  Die Übermittlungsmöglichkeiten an andere Behörden und private Stellen werden erweitert
  und vereinfacht. Auch dies setzt eine Vorgabe aus dem Koalitionsvertrag um und stellt
  sicher, dass die von den Diensten erhobenen Informationen bei den Bedarfsträgern
  ankommen. Für den BND als auch deutscher militärischer Auslandsnachrichtendienst
  wird darüber hinaus insbesondere die Übermittlung von Daten an die Bundeswehr erweitert
  und vereinfacht. 3.    Befugnis zur Durchführung aktiver Maßnahmen zum Schutz vor
  Bedrohungen Der Gesetzentwurf sieht für beide Dienste die Möglichkeit sog. „aktiver
  Maßnahmen“ vor. In der konkreten Ausgestaltung unterscheiden sich die Gesetze indes:
  Der BND bleibt grundsätzlich ein aufklärender Nachrichtendienst. Er erhält aber
  eine Reihe von spezifischen „Annex-Befugnissen“ zur Abwehr von unmittelbaren Gefahren,
  die er im Rahmen seiner Aufklärungstätigkeit entdeckt (z.B. Löschen von Opferdaten
  bei Aufklärung der Systeme von Hackergruppen, Manipulation von Warenlieferungen
  durch Verbringung fehlerhafter Bauteile). Ergänzend erhält der BND bei Vorliegen
  einer spezifischen Gefährdungslage, deren Anordnung durch den Unabhängigen Kontrollrat
  kontrolliert werden muss, die zusätzliche Aufgabe, auch proaktiv auf Bedrohungen
  einzuwirken, um diese zu unterbinden. Hierfür darf er ein breites Spektrum von aktiven
  Maßnahmen durchführen, etwa das gezielte Eindringen in IT-Systeme von Chemiewaffenlaboren
  oder Drohnenfabriken, um die Fertigung zu sabotieren oder das Abschalten oder Unbrauchbarmachen
  von Servern staatlicher Hacker-Gruppen oder Desinformations-Akteuren. Das Bundesamt
  für Verfassungsschutz (BfV), unterliegt nach dem Entwurf einem einheitlichen System:
  Soweit durch eine besondere Bedrohung „erhebliche Unruhen in großen Teilen der Bevölkerung“
  oder „besonders schwere Schäden aufgrund geheimdienstlicher Tätigkeiten fremder
  Mächte“ drohen, darf das BfV künftig durch gesetzlich konkret bestimmte Maßnahmen
  einwirken. Die Einwirkungsmöglichkeiten erlauben dabei (nur) das Einwirken auf Gegenstände
  und sind nur zulässig, wenn durch Einwirkung einer anderen Stelle der Zweck der
  Maßnahme nicht erreicht werden kann. 4.    Starke Kontrolle aus einer Hand – Konsolidierung
  der Kontrolle beim Unabhängigen Kontrollrat Der Ausbau der Fähigkeiten von BfV und
  BND wird durch eine gestärkte Kontrolle flankiert. Dafür wird die Rechtskontrolle
  über die Dienste, die momentan auf verschiedene Kontrollorgane verteilt ist, gebündelt
  und auf eine zentrale Behörde übertragen – den Unabhängigen Kontrollrat (UKRat).
  Er soll dabei künftig nicht nur für die Vorabkontrolle aller eingriffsintensiven
  Erhebungsbefugnisse zuständig sein – also auch die Zuständigkeiten der bisherigen
  G10-Kommission übernehmen – sondern auch die nachgelagerte Kontrolle der Datenverarbeitung
  (bislang in der Zuständigkeit der BfDI) und von aktiven Maßnahmen ausüben. Der UKRat
  soll entsprechend seiner neuen Zuständigkeiten anwachsen und das gerichtsähnliche
  Kontrollorgan begrenzt auch für nicht-richterliche Sachexpertise geöffnet werden.
  Der UKRat ist gegenüber dem Parlamentarischen Kontrollgremium unmittelbar berichtspflichtig,
  so dass gleichzeitig auch die parlamentarische Kontrolle gestärkt wird.'
