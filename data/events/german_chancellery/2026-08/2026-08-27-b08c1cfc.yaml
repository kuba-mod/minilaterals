title: Bundeskanzler Merz telefoniert mit dem norwegischen Ministerpräsidenten Støre
text: Bundeskanzler Friedrich Merz hat heute mit dem norwegischen Ministerpräsidenten
  Jonas Gahr Støre telefoniert. Die beiden Regierungschefs tauschten sich zu außen-
  und sicherheitspolitischen Fragen sowie dem Besuch von Ministerpräsident Støre in
  Kyjiw am 23. August 2026 aus. Bundeskanzler Merz sprach zudem seine Anteilnahme
  bezüglich des ernsten Gesundheitszustandes von S.M. König Harald V. aus.
