title: 'Kulturbauten-Initiative: Über 3 Millionen Euro vom Bund für Schloss Mosigkau
  und das Gotische Haus– Staatsminister Weimer: „Einzigartige Orte, die Geschichte
  und Kultur erlebbar machen“'
text: 'Kulturstaatsminister Wolfram Weimer besuchte heute mit Rainer Robra, Staatsminister
  und Minister für Kultur des Landes Sachsen-Anhalt, Schloss Mosigkau im Gartenreich
  Dessau-Wörlitz. Gemeinsam überreichten sie einen symbolischen Förderbescheid über
  rund 5,1 Millionen Euro für die Sanierung des Westlichen Kavalierhauses des Schlossensembles.
  Staatsminister Weimer: „Schloss Mosigkau ist ein einzigartiger Ort und eines der
  letzten weitgehend erhaltenen Rokokoensembles Mitteldeutschlands. Hier erleben wir
  Geschichte zum Anfassen und können in die höfische Kultur des 18. Jahrhunderts eintauchen.
  Die nahezu vollständig erhaltene barocke Gemäldehängung im Galeriesaal mit Werken
  flämischer und holländischer Meister macht Schloss Mosigkau zu einem Ort von großer
  kunst- und kulturgeschichtlicher Bedeutung. Mit der gemeinsamen Förderung leisten
  Bund und Land einen wichtigen Beitrag zum Erhalt für künftige Generationen.“ Der
  Bund stellt für die Sanierung des Westlichen Kavalierhauses von Schloss Mosigkau
  Mittel in Höhe von 2,55 Millionen Euro zur Verfügung. Das Land Sachsen-Anhalt fördert
  die Maßnahme in gleicher Höhe. Die Förderung ist Teil des Masterplans Bau- und Gartendenkmalpflege,
  mit dem Bund und Land einen langfristigen Rahmen für den Erhalt und die Entwicklung
  des Gartenreichs Dessau-Wörlitz als UNESCO-Weltkulturerbe geschaffen haben. Über
  einen Zeitraum von zehn Jahren soll die einmalige Kulturlandschaft bewahrt, restauriert
  und weiterentwickelt werden. Bund und Land stellen hierfür jeweils 75 Millionen
  Euro zur Verfügung. Für die Restaurierung des ebenfalls zum Gartenreich Dessau-Wörlitz
  gehörenden Gotischen Hauses überreichte Staatsminister Weimer einen weiteren symbolischen
  Bescheid über 500.000 Euro. Mit den Mitteln sollen die Innenräume instandgesetzt
  werden, damit sie künftig wieder vollständig für Ausstellungen genutzt werden können.
  Staatsminister Weimer: „Bis heute zählt das Gotische Haus zu den bedeutendsten Bauwerken
  der deutschen Neogotik. Hier taucht man ein in die atmosphärische Welt der Malerei:
  In den 13 Schauräumen verbergen sich beeindruckende historische Gemälde und kunstvolle
  Wandoberflächen. Die Restaurierung schafft die Voraussetzungen dafür, dass das Gotische
  Haus auch künftig als besonderer Ort für Kunst und Kultur erlebbar bleibt.“ Die
  Stärkung der kulturellen Infrastruktur zählt zu den zentralen Anliegen der Bundesregierung.
  Mit nachhaltigen Investitionen unterstützt der Bund kulturelle Einrichtungen und
  Kulturdenkmäler von nationaler Bedeutung. Weitere Informationen rund um die BKM-Förderung
  von Kulturbauten finden Sie unter Kulturbauten | Kulturstaatsminister - Der Beauftragte
  der Bundesregierung für Kultur und Medien'
