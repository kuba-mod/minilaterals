title: Pressestatement von Bundeskanzler Merz Kanzler Merz besucht Hürtgenwald und
  dankt allen Einsatzkräften
text: 'Kanzler Merz machte sich ein Bild vor Ort und traf Einsatzkräfte, die in den
  vergangenen Tagen gegen die Flammen gekämpft haben. Nach dem schweren Waldbrand
  in Hürtgenwald in Nordrhein-Westfalen hat Bundeskanzler Merz den Einsatzort besucht
  und den Einsatzkräften für ihre Arbeit gedankt. Merz betonte, dass der Waldbrand
  nur dank der engen Zusammenarbeit von Feuerwehr, Bundeswehr, Technischem Hilfswerk
  und allen Blaulichtorganisationen sowie der Land- und Forstwirtschaft so glimpflich
  ausgegangen sei. Herr Landrat, herzlichen Dank für diese sehr freundlichen Worte
  der Begrüßung, und ich möchte es noch einmal sagen: Wir haben in der Tat am vorletzten
  Wochenende mehrfach miteinander telefoniert, und ich habe angeboten, hierherzukommen,
  aber Sie haben gesagt: Kommen Sie danach. Dann habe ich gesagt: So schnell wie möglich
  komme ich gern, um mir anzuschauen, was hier passiert ist, aber auch um anzuschauen,
  was wir hier gemeinsam daraus lernen können. Ich will zunächst einmal den Einsatzkräften
  wirklich sehr herzlich danken ‑ ich hatte gerade auf dem kurzen Weg durch den Wald
  die Gelegenheit, das schon zu tun, aber ich will es hier noch einmal tun ‑, der
  Feuerwehr, der Bundeswehr, dem THW , allen Blaulichtorganisationen, die mitgeholfen
  haben, aber auch der Landwirtschaft und der Forstwirtschaft. Ohne die Zusammenarbeit
  zwischen all diesen Beteiligten wäre das nicht so glimpflich ausgegangen. Dass es
  glimpflich ausgegangen ist, ist auch dem Umstand geschuldet, dass wir in Deutschland
  gute, ehrenamtlich geführte Organisationen haben. Stellen Sie sich einmal einen
  kurzen Augenblick vor, wir hätten keine Freiwillige Feuerwehr. Stellen Sie sich
  einmal einen kurzen Augenblick vor, wir hätten die vielen Tausend Menschen in Deutschland,
  die im THW organisiert sind und tätig sind, nicht. Wir wären nicht in der Lage,
  solche Großschadensereignisse angemessen zu bekämpfen. Deswegen noch einmal herzlichen
  Dank! Ehrlich gesagt, ich lasse mich von denen, die herumschreien, nicht beeindrucken,
  sondern ich spreche mit denen, die nicht schreien. Ich spreche mit denen, die arbeiten.
  Ich spreche mit denen, die helfen. Ich spreche mit denen, die im Sinne unseres Gemeinwesens
  tätig sind. Ich will dem Aufruf des Landrats gerne folgen und es auch von meiner
  Seite aus sagen: Ohne die zahlreichen Menschen, die Millionen Menschen in Deutschland,
  die in den ehrenamtlichen Tätigkeiten unterwegs sind, könnten wir unser Gemeinwesen
  nicht aufrechterhalten. Wir haben gerade auf dem Weg hierher darüber gesprochen,
  und deswegen will ich es noch einmal aufgreifen: Eine zentrale Organisation zur
  Brandbekämpfung auch von Großschadensereignissen macht es nicht besser, sondern
  das Zusammenwirken mit den örtlichen Kräften, mit der örtlichen Feuerwehr, mit dem
  THW , mit denen, die die Region kennen, die die Menschen kennen, die die Umstände
  kennen, die die Telefonnummern haben, und dann diejenigen zur Hilfe zu bitten, die
  es im Großschadensfall ergänzend tun können ‑ das Land, der Bund ‑, das ist die
  richtige Vorgehensweise. Wir nennen so etwas Subsidiarität. Die Verantwortung wird
  unten getragen, aber sie wird auch unterstützt von all denjenigen, die es in Großschadensereignissen
  tun können. Deswegen noch einmal herzlichen Dank. Ich freue mich, dass ich die Gelegenheit
  habe, jetzt auch noch einmal mit Feuerwehrleuten zu sprechen und ihnen auch meinen
  persönlichen Dank zu sagen. Das ist der Sinn meines Besuches heute. Aber ich blicke
  auch nach vorne. Wir werden auswerten, was hier gut gelaufen ist, aber wir werden
  auch auswerten, was noch fehlt. Auf dem Weg hierher zum Beispiel wurde die Frage
  diskutiert, wie es mit den Kommunikationsverbindungen ist. Die sind noch nicht so
  gut, wie sie sein müssten. Das müssen wir noch verbessern, und wir werden am nächsten
  Dienstag und am nächsten Mittwoch im Bundeskabinett genau über diese Themen miteinander
  reden. Wie können wir in Zukunft noch besser auf solche Großschadensereignisse vorbereitet
  sein? Der bedauerliche Befund ist: Wir müssen damit rechnen, dass die Zahl größer
  werden wird und dass wir häufiger solche Ereignisse haben werden. Das ist Klimawandel.
  Ich will allen Leugnern des Klimawandels sagen: Schauen Sie sich das genau an, was
  hier passiert ist. Das ist der Klimawandel. Wir werden alles tun, um den Klimawandel
  zurückzudrängen, aber wir müssen auch mit dem Klimawandel leben, und darauf vorbereitet
  zu sein, ist eine Aufgabe des Bundes, der Länder, der Gemeinden, aber es ist vor
  allem dankenswerterweise, noch einmal gesagt, möglich, diesem Phänomen gemeinsam
  zu begegnen, weil wir diese großartigen Organisationen in Deutschland haben. Deshalb
  noch einmal herzlichen Dank, auch herzlichen Dank, dass Sie alle heute dazugekommen
  sind!'
