  Sie hatten ja bisher nur die Arbeitgeberinteressen vorgetragen, für die er sich
  einsetzen möchte, Innovation, Wachstum, bla, bla, bla. Was ist mit den Menschen,
  die auf mehr Arbeitnehmerrechte, mehr Schutzmaßnahmen und Besserstellung hoffen?
  Ich verstehe die politische Stoßrichtung Ihrer Frage, aber die darunter liegende
  Unterstellung kann ich leider nicht teilen. Das ganze Thema von Neuhardenberg dient
  dem Wachstum und dem Wohlstand Deutschlands. Das ist nicht nur der Wachstum und
  der Wohlstand von Arbeitgebern, sondern vor allem der Arbeitnehmer. Es geht um Arbeitsplatzsicherheit.
  Das ist ein ganz zentrales Thema, das Deutschland insgesamt beschäftigt. Deswegen
  denke ich, dass Ihre etwas, wie soll ich sagen, meinungslastige Frage in die falsche
  Richtung geht. Das ist ein historischer Konflikt, den wahrscheinlich auch Sie kennen,
  Herr Kornelius. Noch einmal zur Übergewinnsteuer : Ist die Forderung von Herrn Klingbeil
  eine Position, über die die Bundesregierung einig ist? Ist das also eine Position
  der Bundesregierung? Das ist keine Position der Bundesregierung. Dann eine Nachfrage
  an das Finanzministerium: Bislang sind daran ja, glaube ich, Portugal, Spanien,
  Österreich und Polen beteiligt. Gibt es Gespräche mit weiteren Ländern? Grundsätzlich
  sind wir im Gespräch mit allen Mitgliedstaaten. Konkret geht es bei dem Brief um
  Deutschland, Österreich, Spanien, Portugal, Italien und Polen. Noch zu Ihrer vorigen
  Frage: Die Prüfung einer europäischen Übergewinnsteuer wurde im Rahmen des Koalitionsausschusses
  im April beschlossen. Ich habe eine Frage an das Justizministerium. Es geht um Äußerungen
  der EVG am Wochenende. Die Justizministerin hatte im Februar eine Strafverschärfung
  bei Angriffen auf Sanitäter, Feuerwehrleute, Ärzte und Pfleger angekündigt. Wie
  erklären Sie, dass der Abstimmungsprozess so lange dauert, und haben Sie Verständnis
  für die Ungeduld der betroffenen Berufsgruppen? Mit Hinblick auf die Zeit mache
  ich es vielleicht auch recht kurz. Die Ministerin hat im Februar auf einen Gesetzentwurf
  hingewiesen, der ja vom BMJV schon vorgelegt wurde. Dieser Gesetzentwurf ist recht
  umfangreich und betrifft sozusagen nicht nur diesen einen Aspekt von Strafverschärfungen.
  Die regierungsinternen Abstimmungen laufen noch. Zu den Einzelheiten kann ich mich
  nicht äußern. Aber, wie gesagt, das Ziel ist, dass der Bundestag noch in diesem
  Jahr darüber beraten kann. Werden dabei dann auch Mitarbeiter der Bahn oder von
  Verkehrsunternehmen berücksichtigt? Werden dabei auch Mitarbeiter der Bahn oder
  von Verkehrsunternehmen berücksichtigt, wenn es dabei um Angriffe auf Bahnmitarbeiter
  geht? Der Referentenentwurf ist ja öffentlich. Darüber hinaus, wenn es darum geht,
  was innerhalb der Bundesregierung jetzt noch diskutiert wird, kann ich mich nicht
  äußern. Wir haben vor ungefähr 14 Tagen gemeldet, dass die ersten Dublin-Fälle von
  Deutschland nach Italien übergestellt werden sollten . Seitdem herrscht eine große
  Auseinandersetzung zwischen Italien und Deutschland. Vor allen Dingen gibt es in
  Italien eine etwas seltsame Auslegung des neuen EU-Pakts. Gestern hat Vizeregierungschef
  Matteo Salvini angekündigt, Italien werde entgegen der neuen EU-Asylregeln keine
  Migranten aus Deutschland zurücknehmen. Inzwischen haben auch sechs andere Länder
  angemeldet, sie müssten Dublin-Fälle nach Italien zurücküberstellen, und Italien
  sagte, man werde keinen einzigen aufnehmen. Ich weiß, dass es momentan Verhandlungen
  zwischen Italien und Deutschland gibt. Aber in Italien gibt es eben lautstarke Stimmen,
  die sagen, man werde keinen einzigen Dublin-Fall übernehmen, und es gibt auch eine
  seltsame Interpretation des EU-Pakts, Insofern, als sowohl Minister Piantedosi ‑ ‑ ‑
  Kommen wir zur Frage? Wir sind nämlich ein bisschen ‑ ‑ ‑ Ja, Moment! Entschuldigung,
  ich habe eine Stunde gewartet! Sowohl Herr Dobrindt als auch Salvini sagen, die
  deutschen NGOs überstellen Flüchtlinge nach Italien, und das heißt, die müssen jetzt
  von Deutschland übernommen werden. Ich wollte vielleicht auch einen Kommentar von
  Herrn Kornelius zu dieser Auseinandersetzung zwischen Italien und Deutschland hören.
  Ich sehe keine Auseinandersetzung zwischen Italien und Deutschland. Die Fortentwicklung
  des EU-Migrations- und Asylpakts ist ein ganz wesentlicher Erfolg, der die Begrenzung
  der irregulären Migration möglich gemacht hat und der auch ein Schlüssel für eine
  bessere Steuerung und Ordnung auf der Basis des humanitären Standards für Geflüchtete
  sein wird. Die illegale Migration in der EU ist in den vergangenen zwei Jahren um
  55 Prozent zurückgegangen. Das ist eine Aussage von Kommissar Brunner. GEAS ist
  die Grundlage für diese europäische Zusammenarbeit. GEAS schafft Ordnung, GEAS schafft
  Sicherheit, und GEAS schafft auch Rechtssicherheit. Es ist deswegen eine gute Balance
  aus Verantwortung und Solidarität, wenn die EU EU-weit einheitliche Standards und
  Verfahren einhält. Die Bundesregierung unterstützt deswegen die Umsetzung des Asylrechts,
  die sie auch maßgeblich vorangetrieben hat, und die Bundesregierung hält es für
  wichtig, dass auf europäischer Ebene das effektive und faire gemeinsame Asylsystem
  gleichermaßen getragen und umgesetzt wird. Vielleicht würde ich es mit Blick auf
  die Zeit kurz machen. Herr Kornelius hat es angesprochen: Deutschland und Italien
  arbeiten in Fragen der Umsetzung der Migrationspolitik eng und vertrauensvoll zusammen,
  und insbesondere auch mit Blick auf Abstimmungen zur Umsetzung von GEAS befinden
  wir uns mit Italien in einem engen, vertrauensvollen, partnerschaftlichen Austausch.
  Berichterstattung aus Italien kommentieren wir grundsätzlich nicht, und auch Ihre
  Einschätzung, dass es sich hierbei um eine große Auseinandersetzung handelt, wie
  Sie es gerade angesprochen haben, würde ich zumindest nicht so formulieren. Entschuldigung,
  gestern haben auch zwei wichtige CDU-Politiker und auch ein SPD-Politiker dazu Stellung
  genommen, Throm, Krings und Fiedler. Der eine hat gesagt, so werde der EU-Pakt gesprengt.
  Ich zitiere das wörtlich. Der zweite hat gesagt: Dann können wir Italien auch aus
  dem Schengener Abkommen ausschließen. - Das sind nicht marginale oder Oppositionspolitiker,
  sondern das ist der innenpolitische Sprecher der CDU. Was sagen Sie dazu? Vielen
  Dank für Ihre Nachfrage. - Kommentare und Kommentierungen aus dem parlamentarischen
  und politischen Raum kommentieren wir hier grundsätzlich nicht. Ich kann mich nur
  noch einmal wiederholen und sagen, dass wir mit Italien in einem engen und partnerschaftlichen
  Austausch stehen. In Kroatien wurde letzte Woche mit Wolodymyr S. ein weiterer ukrainischer
  Tatverdächtiger der Nord-Stream-Sprengung auf Grundlage eines europäischen Haftbefehls
  festgenommen. Die Festnahme erfolgte am Set eines Hollywood-Films mit dem Titel
  „Snake Island“, der diese Sprengung nacherzählt, in dem der mutmaßliche Täter als
  Berater fungierte. Da würde mich interessieren, wie die Bundesregierung, namentlich
  Herr Kornelius und Frau Deschauer, auch, was die Außenwirkung angeht, diesen Umstand
  bewerten, dass ein sozusagen mutmaßlich Tatverdächtiger für die Sprengung von Nord
  Stream quer durch Europa reisen kann und bei einem Hollywood-Film als Berater tätig
  ist, in dem es genau um diesen Anschlag geht. Die Bundesregierung bewertet das gar
  nicht. Sie wissen, dass der Generalbundesanwalt in Karlsruhe die Ermittlungen führt
  und die Hoheit über das Verfahren hat. Es laufen Ermittlungen. Da warten wir die
  Ergebnisse ab. Es läuft ein Verfahren. Da warten wir das Verfahren ab. Alles andere
  ist nicht Sache der Bundesregierung. Der Tatverdächtige Wolodymyr S. konnte sich
  ja bereits zweimal den Zugriffen deutscher Ermittler und des europäischen Haftbefehls
  entziehen. Das erste Mal half ihm der ukrainische Militärattaché in Kyjiw und brachte
  ihn mit seinem Auto über die Grenze. In der Ukraine erfolgte grundsätzlich kein
  Zugriff auf die dortigen Tatverdächtigen. Da würde mich noch interessieren, vielleicht
  diesmal von Frau Deschauer: Was für Schlüsse und Konsequenzen zieht denn das Auswärtige
  Amt aus dieser offenen Hintertreibung der strafrechtlichen Aufklärung des Nord-Stream-Anschlags
  durch ukrainische staatliche Stellen? Ich schließe mich für das Auswärtige Amt den
  Ausführungen des Regierungssprechers an, nicht aber den Prämissen Ihrer Fragestellung,
  und bewerte das genauso wenig, weil wir es hierbei mit einem laufenden strafrechtlichen
  Verfahren zu tun haben, das die Bundesregierung nicht bewertet. Herr Kornelius,
  ich beziehe mich auf Herrn Merz, der letztes Jahr die Einmischung von Elon Musk
  in den deutschen Wahlkampf scharf verurteilt hat und angeprangert hat und auch gesagt
  hat, dass jemand von außerhalb Europas auf diese Weise in den nationalen Wahlkampf
  eingreift, sei neu. Er hat ja auch gesagt, dass das nicht unwidersprochen bleiben
  könne und dass das nicht wieder passieren solle. Jetzt ist am Wochenende genau das
  wieder passiert. Elon Musk hat online zur Wahl der AfD aufgerufen. Was sind die
  Konsequenzen? Ich habe das am Wochenende nicht wahrgenommen und habe es deswegen
  auch nicht zu kommentieren. Aber ich glaube, die Aussage des Bundeskanzlers von
  damals steht für sich. Er würde sie jederzeit wiederholen. Was ist denn seitdem
  passiert? Als er gerade gewählt wurde bzw. das Wahlergebnis da war, hat er ja Konsequenzen
  angekündigt. Was waren denn jetzt die Konsequenzen für die Einmischung von Elon
  Musk in den letztjährigen Wahlkampf, damit wir uns auf den diesjährigen beziehen
  können? Die Bundesregierung verwahrt sich gegen Eingriffe in den Wahlkampf von außen.
  Die Bundesregierung verweist darauf, dass wir es hier mit einem stabilen demokratischen
  System zu tun haben und dass wir uns in der Beurteilung von Parteien und von ihren
  Programmen in unserem innenpolitischen System befinden und keinen Einfluss von außen
  brauchen, vor allem keine Manipulation. Das bezieht sich vor allem ‑ ‑ auf hybride
  Einflüsse, die viel gewichtiger sind, die viel stärker ernst zu nehmen sind, und
  auch auf Kommentierungen von außen. Aber es gab keine Konsequenzen mit Musk, wie
  der Kanzler es angekündigt hat. Noch einmal: Der Bundeskanzler verwahrt sich gegen
  Eingriffe von außen, der Bundeskanzler hat sich gegen Manipulation verwahrt, und
  die Bundesregierung wird insgesamt massiv gegen hybride Beeinflussungen auch und
  gerade von Wahlen vorgehen. Herr Kirschner, in Polen ist gerade ein strafrechtliches
  Gesetz zur Verschärfung von Strafen gegen gewaltverherrlichende Videos und deren
  Ersteller und Verbreiter verabschiedet worden. In Deutschland wartet das digitale
  Gewaltschutzgesetz , auch wenn es ein bisschen anders gelegen ist, als Referentenentwurf
  schon ein Weilchen auf seine nächste Runde. Da würde ich natürlich gerne von Ihnen
  erfahren, wann wir denn damit rechnen können, dass das digitale Gewaltschutzgesetz
  wenigstens das Kabinett erreicht. Wir befinden uns da noch in der regierungsinternen
  Abstimmung, aber ich bin zuversichtlich, dass wir dafür sehr zeitnah einen Kabinetttermin
  finden werden. Woran liegt es denn, dass es so lange braucht? Wir sind ja seit April
  mit dem Gesetz unterwegs. Sie wissen, dass ich mich, wie üblich, nicht zu den Einzelheiten
  der regierungsinternen Abstimmung äußere.'
