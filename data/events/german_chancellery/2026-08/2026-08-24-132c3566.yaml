date: '2026-08-24'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 24. August 2026
text: 'Sprecherinnen und Sprecher •    Staatssekretär Kornelius •    Wentzel (BMWE)
  •    Müller (BMVg) •    Deschauer (AA) •    Haufe (BMUKN) •    Ernoult (BMF) (Vorsitzender
  Szent-Iványi eröffnet die Pressekonferenz und begrüßt StS Kornelius sowie die Sprecherinnen
  und Sprecher der Ministerien.) Herzlich willkommen auch von mir in diesem schönen
  Saal. ‑ Ich habe zwei Terminankündigungen . Am Donnerstag, dem 27. August, trifft
  sich Bundeskanzler Merz um 12 Uhr mit einigen gleichgesinnten Staats- und Regierungschefs
  der EU zu einem gemeinsam Mittagessen im Bundeskanzleramt. Das Treffen dient dem
  Austausch mit EU-Mitgliedsstaaten über den nächsten Mehrjährigen Finanzrahmen .
  Sie wissen, dass der MFR, der Mehrjährige Finanzrahmen, die Weichen für das politische
  Handeln der EU im Zeitraum 2028 bis 2034 stellt und deswegen von zentraler Bedeutung
  für Europas Zukunft ist. Im Anschluss an dieses Treffen wird es eine Pressebegegnung
  geben. Zum zweiten Termin: Am Donnerstag, dem 27. August, wird der Bundeskanzler
  am Abend den Ministerpräsidenten des Königreichs Norwegen , Jonas Gahr Støre, im
  Bundeskanzleramt empfangen . Die beiden werden sich bei einem gemeinsamen Abendessen
  austauschen. Sie wissen, dass Norwegen ein verlässlicher Verbündeter für Deutschland
  und ein unverzichtbarer Partner in Fragen der Werte, in Sicherheitsfragen und in
  der Wirtschaftspolitik ist. Eine gemeinsame Pressekonferenz ist nicht geplant. (zum
  Austausch mit EU-Mitgliedsstaaten über den nächsten Mehrjährigen Finanzrahmen )
  Herr Kornelius, können Sie bitte sagen, wer an dem Mittagessen teilnimmt? Ist das
  ein Treffen der Geberländer, der sogenannten Frugals? Das ist das sogenannte Frugals-Treffen.
  Das ist quasi ein Kreis von Gleichgesinnten, die sich für einen bezahlbaren und
  modernisierten MFR einsetzen. Die Teilnehmer des Treffens teilen diese Ziele und
  die Priorisierung. Ich würde die Länder nachreichen. Die Bundesregierung setzt sich
  mit diesen Ländern für eine schnelle Einigung im MFR bis Ende des Jahres ein und
  spricht mit allen Beteiligten zur gegebenen Zeit und an der geeigneten Stelle. Der
  Kreis hat sich jetzt zusammengefunden, um dieses Thema noch einmal zu adressieren.
  Der Bundeskanzler hatte schon vor einigen Wochen deutlich gemacht, dass er die Vorschläge
  der Kommission für nicht akzeptabel halte und die Ausgaben zu hoch seien. Mit welchen
  konkreten Vorstellungen und Vorschlägen geht der Kanzler in dieses Treffen am Donnerstag
  hinein? Der Bundeskanzler hat bei der Reise nach Irland im Juli klar gemacht, was
  seine Vorstellungen sind. Er hat gesagt, dass ein Budgetentwurf mit Kürzungen in
  allen Bereichen notwendig sei, und zwar um mehrere hundert Milliarden Euro. Er hat
  gesagt, dass diese Kürzungen unabhängig davon stattfinden müssten, wie weit man
  mit den neuen Eigenmitteln komme, und dass diese politischen Prioritäten im neuen
  Haushalt abgebildet werden müssten. Das ist der Rahmen, in dem auch verhandelt oder
  gesprochen wird. Darüber hinaus gibt es momentan keine Vertiefung. Wird es bei dem
  Treffen auch um das Thema Migration gehen? Es ist ein MFR-Treffen. Das schließt
  aber natürlich nicht aus, dass man auch andere Themen anspricht. Herr Kornelius,
  ich glaube, Sie haben eben gesagt, der Kanzler treffe sich mit gleichgesinnten EU-Regierungschefs.
  Wäre es nicht sinnvoller, sich eher mit denen zu treffen, die nicht gleichgesinnt
  sind? Denn die müsste man ja noch überzeugen. Ich glaube, dass beides sich nicht
  ausschließt. Jetzt wird ein Treffen der Gleichgesinnten stattfinden, um sich abzustimmen
  und eine gemeinsame Linie zu haben. Auch das ist ein Signal an die EU-Regierungen,
  weil es natürlich Geberländer und Nehmerländer gibt ‑ den Mechanismus kennen Sie.
  Sie können sich aber sicher sein, dass selbstverständlich auch Gespräche mit den
  anderen stattfinden. Es wird eines der beherrschenden europäischen Themen für dieses
  Halbjahr sein, mit dem Ziel, zum Jahreswechsel zu einem Abschluss zu kommen. Haben
  Sie eine Zahl genannt, wie viele Regierungschefs teilnehmen werden? Nein. Wir werden
  das zur gegebenen Zeit kommunizieren, aber der finalen Reiseplanung können wir jetzt
  nicht vorgreifen. Sie sagen, Sie wissen es noch nicht. Ist noch offen, wer daran
  teilnehmen wird, oder haben Sie es nur gerade nicht parat? Ich werde es zur gegebenen
  Zeit mitteilen. Ich weiß es schon, aber Sie wissen es noch nicht. Wenn Sie es schon
  wissen, möchte ich es zumindest an einer Stelle noch einmal versuchen: Nimmt Herr
  Macron teil? Ich frage deswegen, weil der Kanzler und Macron selber angekündigt
  hatten, dass sich gerade diese beiden Länder auf dem gangbaren Weg verständigen
  wollten. Sind Sie da weitergekommen, und wird Herr Macron am Donnerstag dabei sein?
  Herr Macron wird nicht dabei sein, aber es wird eine Teilnahme anderer Staats- und
  Regierungschefs geben, die gleichgesinnt sind. Deutschland und Frankreich haben
  sich aber auch schon intensiv über den Rahmen des MFR ausgetauscht. Es gibt auf
  beiden Seiten einen hohen Konsens über das Ziel und auch über den Zeitpunkt des
  Abschlusses. Auch das wurde bei dem letzten Treffen der beiden kommuniziert. In
  den Terminen des Bundeskanzlers ist von Niederlande, Österreich, Finnland und Dänemark
  die Rede. Können Sie das so bestätigen? Geht der Kreis vielleicht noch darüber hinaus?
  Da der Kreis noch nicht final feststeht, habe ich ihn nicht genannt. Sie können
  davon ausgehen, dass die genannten Staaten potenziell zu Gast in Berlin sein werden.
  Herr Kornelius, ich würde es ganz gerne verstehen: Das heißt, auch die Staaten,
  die bereits in den Terminen des Bundeskanzlers genannt waren, stehen noch nicht
  final als Teilnehmer fest? Noch einmal: Ich lege mich jetzt nicht auf den Teilnehmerkreis
  fest. Sie können es links oder rechts herum drehen. Wir werden den Teilnehmerkreis
  in dem Moment, wo er feststeht, final nachreichen. Ich möchte jetzt nicht Spekulationen
  aufheizen. Sie können diese Staaten dem Kalender entnehmen. Es ergibt logisch nicht
  ganz Sinn, dass es schon einmal kommuniziert wurde und Sie jetzt nicht dazu Stellung
  nehmen, ob dieser Kreis, der bereits kommuniziert wurde, teilnimmt. Weil ich den
  abschließenden Kreis jetzt noch nicht nennen kann. Es geht um den abschließenden
  Kreis. Aber es geht ja um die Frage, ob das der bereits feststehende Kreis ist,
  zu dem eventuell noch weitere dazukommen. Ich habe jetzt, glaube ich, alles dazu
  gesagt. Ich kann Ihnen den abschließenden Kreis nicht nennen, wenn ich ihn nicht
  habe. Aber ich frage doch gar nicht nach dem abschließenden Kreis. Ich frage, ob
  dieser Kreis bestätigt werden kann und möglicherweise noch weitere dazukommen, oder
  ob auch dieser Kreis noch nicht abschließend ist. Dieser Kreis ist der momentan ‑
  Stand 11.40 Uhr am Montag ‑ geplante Kreis Woher wissen Sie denn, ob das Gleichgesinnte
  sind, wenn Sie noch nicht einmal wissen, wer es insgesamt ist? Das ist eine Frage
  der politischen Deutung, die ich Ihnen überlasse. Sie sind ja auch ein wacher Beobachter
  der europäischen Szene. Ich glaube, diese Länder haben sich durch ihre Positionierung
  als Partner hervorgetan, die unsere Ziele im MFR teilen. Warum positioniert man
  sich überhaupt als frugaler, als sparsamer Staat? Angesichts des Rechtsrucks überall
  scheint es ja allgemein so zu sein, dass mehr ausgegeben werden muss, damit die
  Europäische Union zusammenhält und nicht noch weitere soziale Nöte usw. entstehen.
  Das ist eine sehr umfassende Frage. Ich glaube, die Diskussion über den Mehrjährigen
  Finanzrahmen ist komplex, sie ist tief. Es geht um die Frage, was die europäischen
  Ausgabenziele sind. Es geht um die Frage, welche Prioritäten gesetzt werden. Es
  gibt eine lange, lange Liste an Wünschen, es gibt eine lange Liste an Bedürfnissen.
  Wie immer bei einem so großen Finanzpaket geht es darum, die richtige Balance zu
  finden. (zum Besuch des Ministerpräsidenten des Königreichs Norwegen in Deutschland
  ) Sie haben darauf hingewiesen, dass Norwegen ein auch wirtschaftlich wichtiger
  Bündnispartner sei. Norwegen ist sozusagen das Rückgrat der Erdgasversorgung in
  Deutschland. Wird der Kanzler in dem Gespräch versuchen, vor dem Hintergrund der
  niedrigen Füllstände der deutschen Gasspeicher eine Ausweitung der norwegischen
  Gaslieferungen zu erreichen? Ich kann den Gesprächen jetzt nicht vorgreifen, aber
  die beiden werden sich natürlich über die ganze Bandbreite der bilateralen Beziehungen
  austauschen. Norwegen liefert über eine Pipeline verlässlich Gas nach Deutschland.
  Es geht dabei natürlich auch um den Schutz kritischer Infrastruktur. Das ist natürlich
  auch alles Thema eines solchen Besuchs. Dass die niedrigen Füllstände bis zum Winteranfang
  nicht bis zu den eigentlich vorgesehenen Höhen kompensiert werden können, ist dem
  Kanzler ja bekannt. Deswegen ist die Frage schon: Hat der Kanzler vor, die Lieferungen
  aus Norwegen, wenn es irgendwie möglich ist, zu erhöhen? Das Thema der Gasvorsorge
  für den Winter ist ein Thema, das getrennt betrachtet wird. Natürlich wird man in
  bilateralen Gesprächen auch über die prinzipielle Situation auf dem Gasmarkt sprechen
  können, aber das ist jetzt nicht Gegenstand des Gesprächs. Wenn wir jetzt beim Thema
  Gasspeicher sind, würde ich da einsteigen wollen. Meine Frage richtet sich aber
  vermutlich eher an Herrn Wentzel vom Wirtschaftsministerium: Der Präsident der Bundesnetzagentur,
  Herr Müller, hat jetzt gesagt, er halte die Füllstandsverordnung, die verpflichtende
  Füllstände vorschreibt, eigentlich für überholt. Sehen Sie das auch so? Wie steht
  die Ministerin dazu? Das ist eine Äußerung, die wir erst einmal zur Kenntnis nehmen.
  Sie kennen die geltende Rechtslage. Wir haben hier in den letzten Wochen, denke
  ich, deutlich gemacht, dass wir derzeit eine sichere Versorgungslage erwarten und
  die Lage weiter eng beobachten. Ich habe jetzt keine konkreten Pläne zu Änderungen
  an der Rechtslage mitzuteilen. Ich verstehe das so, dass die Ministerin diese Einschätzung
  von Herrn Müller nicht teilt. ‑ Ich würde gerne noch mal nachfragen: Es gibt diese
  verpflichtenden Füllstände nach wie vor. Zum 1. November müssen die Gasspeicher
  eigentlich einen durchschnittlichen Füllstand von 70 Prozent erreicht haben. Angesichts
  der jetzigen Füllstände ist das kaum noch einzuhalten. In welchem Fall würde der
  Staat über die Trading Hub Europe einspringen und die Gasspeicher im Zweifel aus
  staatlicher Hand befüllen? Wann wäre der Punkt erreicht, an dem Sie dazu eine Notwendigkeit
  sehen? Es wird Sie nicht überraschen ‑ das ist von dieser Bank aus eigentlich immer
  der Fall ‑, dass wir nicht spekulieren und uns nicht im Vorhinein auf irgendwelche
  Schwellenwerte festlegen. Wir beobachten die Lage eng. Wir sehen derzeit keine Gefährdung
  der Versorgungssicherheit. Das ist der Stand. Experten sagen, dass es physikalisch
  gar nicht mehr möglich sei, bis November den vorgegebenen durchschnittlichen Füllstand
  von 70 Prozent zu erreichen. Teilt das Wirtschaftsministerium diese Einschätzung?
  Dazu liegen mir gerade keine Erkenntnisse vor. Ich habe diese Äußerung auch nicht
  wahrgenommen. Ich kann einmal schauen, ob ich dazu etwas nachreichen kann. Das wäre
  gut; denn das wäre ja wichtig für die ganze Debatte. Wenn es physikalisch gar nicht
  mehr erreichbar ist, müsste man ja anders handeln, als wenn es erreichbar wäre.
  Das ist ein Schluss, den ich mir jetzt nicht unbedingt zu eigen machen würde. Entscheidend
  ist ja, dass die Versorgungssicherheit gewährleistet bleibt. Das ist, woran wir
  unser Handeln ausrichten. Da sich die Ministerin bisher weigert, die Unternehmen
  anzuweisen, mehr Gas einzulagern: Verstehe ich die politische Logik dahinter richtig,
  dass Ihr Haus und Ihre Ministerin die Vorsorge als teurer einschätzt als den Verzicht
  darauf? Nein, ich denke, das ist ein Fehlschluss. Wir weisen darauf hin, dass die
  Einhaltung der Lieferverpflichtungen zunächst Aufgabe der Unternehmen ist. Die Unternehmen
  haben sich gegenüber den Endverbrauchern verpflichtet, sie mit Energie zu beliefern,
  und müssen sich auf den Winter vorbereiten, um dieser Verpflichtung nachkommen zu
  können. Das ist ein Marktgeschehen, das in der Regel funktioniert, und wir sehen
  derzeit auch nicht, dass das für den Winter nicht funktionieren würde. Wenn der
  Staat eingreift, dann entzieht er dem Markt Mengen. Dann wird das teuer; das kostet
  auf irgendeinem Wege Geld. Deswegen setzen wir darauf, dass die Unternehmen diese
  Verpflichtungen erfüllen und sich am Weltmarkt, entweder jetzt oder zu einem späteren
  Zeitpunkt, auf jeden Fall rechtzeitig, mit Gas eindecken, um damit über den Winter
  versorgen zu können. Der Kollege Rinke hat gerade schon angesprochen, dass das offenbar
  physikalisch, wissenschaftlich nicht mehr möglich ist. Dementsprechend droht jetzt,
  quasi basierend auf dem bisherigen Verzicht, dass es im Winter sehr, sehr teuer
  wird, gerade, wenn es kalt wird. Darunter leiden ja am Ende die Menschen und nicht
  die Unternehmen. Kollege Rinke hat auf Äußerungen hingewiesen, die ich nicht kenne,
  die ich deswegen nicht bestätigen kann und die jetzt Grundlage Ihrer Frage waren.
  Deswegen wird es ein bisschen schwierig, auf diese Frage zu antworten. Wie gesagt:
  Da schaue ich, ob mir dazu Erkenntnisse vorliegen. Ich möchte noch einmal klarstellen:
  Die Gaspreise für einen Tag am Spotmarkt sind nicht unmittelbar das, was bei den
  Menschen ankommt, da sie sich ja in ihren Gaslieferverträgen in der Regel über längere
  Zeiten auf einen bestimmten Gaspreis festgelegt haben. Sie haben jetzt gesagt, Sie
  erwarten von der Branche, dass die Versorgung über den Winter aufrechterhalten werden
  kann, dass sie jetzt oder später einkaufen. Mich würde auch interessieren: Erwarten
  Sie, dass die 70 Prozent zum 1. November eingehalten sind? Denn das ist die geltende
  Rechtslage. Diese Verordnung ist ja wirksam, und diese Verordnung schreibt vor,
  zum 1. November müssen sie im Durchschnitt zu 70 Prozent befüllt sein. Würden Sie
  das im Zweifel durchsetzen, wenn die Unternehmen dieses Ziel nicht selbst erreichen?
  Dazu möchte ich, wie gesagt, nicht spekulieren. Wir stellen durch staatliches Handeln
  sicher, dass die Versorgungssicherheit gewährleistet bleibt. Herr Wentzel, ich versuche
  nur, das zu verstehen. Es heißt in Paragraph 35 c Absatz 2, dass der Marktgebietsverantwortliche
  nach Zustimmung des BMWE im Einvernehmen mit der Bundesnetzagentur zusätzliche Maßnahmen
  ergreift. Da ist jetzt THE noch nicht auf Sie zugegangen, dass entsprechende Maßnahmen
  ergriffen werden sollten? Habe ich das richtig verstanden? Mir ist keine solche
  Kommunikation von THE an uns bekannt. Ich frage noch einmal nach. Dann kann ich
  auch darüber gerne im Nachhinein informieren. Herr Wentzel, das geht auch in die
  Richtung. Was passiert eigentlich ‑ eine Wissensfrage ‑, wenn diese Füllstandsvorgaben
  nicht erreicht werden? Es gibt meines Erachtens keine Sanktionen gegen die Unternehmen.
  Was würde passieren, wenn jetzt im November die Speicher nur zu 60 Prozent oder
  so gefüllt wären? „Was würde passieren“, das ist wieder im spekulativen Rahmen.
  Zur Rechtslage bin ich nicht ganz auf dem Stand, ob Rechtsfolgen daran geknüpft
  sind. Auch dazu mache ich mich schlau. Pardon, aber das ist so spekulativ nicht.
  Es gibt Einschätzungen, die jetzt schon sagen, es sei physikalisch nicht mehr erreichbar,
  dass die 70 Prozent zu November erreicht sind. Das ist unter anderem die Chefin
  des Branchenverbands BDEW, die genau diese Aussage trifft. Das sind ja Branchenkenner
  und auch Fachleute. Wenn die sagen, es sei physikalisch nicht mehr erreichbar, dann
  ist es dieses Szenario ja so weit nicht weg. Also würde das Wirtschaftsministerium
  die 70 Prozent tatsächlich selbst erreichen, wenn die Branche das nicht selbst erreicht,
  oder würden Sie das mit Sanktionen durchsetzen? Das ist aus meiner Sicht keine neue
  Frage, sondern dazu habe ich mich eben verhalten. Wie gesagt: Zu der Aussage, dass
  das nicht mehr erreicht werden könne, kann ich mich gerade nicht äußern, weil sie
  mir nicht bekannt war. Herr Wentzel, keinem von uns ist hier, glaube ich, klar,
  was die Ministerin tun wird, wenn, wie absehbar, der vorgegebene Füllstand von 70 Prozent
  nicht erreicht wird. Wir bitten Sie, wenn Sie die Frage hier nicht ad hoc beantworten
  können, um eine Nachlieferung, was die Ministerin in diesem nicht spekulativen,
  sondern sehr realistischen Fall machen würde. Mit der Bewertung einer Aussage „es
  ist spekulativ“ will ich ja nicht die Eintrittswahrscheinlichkeit kommentieren.
  Es geht darum, dass es eine Entwicklung in der Zukunft ist, und deren Eintreten
  kann ich jetzt mit einer hohen oder niedrigen Wahrscheinlichkeit noch nicht vorwegnehmen.
  Noch einmal: Entscheidend ist, die Versorgungssicherheit muss gewährleistet sein.
  Wir sehen derzeit keine Anzeichen dafür, dass das nicht der Fall ist. Es geht nicht
  um die Einhaltung irgendwelcher gesetzlicher Schwellenwerte, sondern darum, dass
  Menschen und Unternehmen in Deutschland durch den ganzen Winter hindurch mit Energie
  versorgt werden können. Wir haben einen guten Füllstand in den Speichern. Wir haben
  die LNG-Terminals in den letzten Jahren aufgebaut. Wir haben die gerade angesprochenen
  Pipelinelieferungen aus Norwegen. Wir sehen derzeit keine Anzeichen für eine Versorgungsmangellage.
  Vielleicht wäre es an dieser Stelle tatsächlich angebracht, einfach zu erklären,
  was in diesem Fall passiert. Das wäre, glaube ich, sehr hilfreich, und die Kollegen
  nicken auch. Das ist ja keine Spekulation, sondern das muss ja in irgendeinem Gesetz
  oder in irgendeiner Verordnung geregelt sein. Wie gesagt, zur Rechtsfolge mache
  ich mich gerne schlau. Sie sagen, es geht um Versorgungssicherheit. Nun ist aber
  in der rechtlichen Konstruktion die Versorgungssicherheit genau faktisch an die
  Füllstände gekoppelt. Die Füllstände sind ein Indikator, eine materielle Vorgabe,
  um die Versorgungssicherheit zu gewährleisten. Deswegen besteht da ein innerer Zusammenhang.
  Da bitten wir Sie dann doch, wie der Vorsitzende es angeregt hat, um eine substanziell
  nachvollziehbare Positionierung der Ministerin. Wenn ich noch einen Satz dazu sagen
  darf: Es gibt eben kein Eins-zu-eins-Verhältnis zwischen Erfüllung eines bestimmten
  Schwellenwertes und „dann ist die Versorgungssicherheit gewährleistet oder eben
  nicht“, sondern wir haben die Speicher, wir haben die LNG-Terminals, wir haben die
  Pipelines. Klar, das ist ein Indikator, aber es ist nicht der einzige. Herr Kornelius,
  zu dem Abendessenmit dem norwegischen Ministerpräsidenten eine Nachfrage: Island
  entscheidet ja in diesen Tagen darüber, ob es die Verhandlungen über einen EU-Beitritt
  wieder aufnimmt. Ich hätte ganz gerne gewusst, ob der Kanzler denn dieses Thema,
  also einen möglichen EU-Beitritt Norwegens, der ja auch diskutiert wird, mit anspricht
  und ob er den befürworten würde. Ich glaube, ich würde jetzt den Gesprächen vorweggreifen.
  Die beiden haben einen so regelmäßigen Austausch, dass das jetzt kein Thema ist,
  das auf die Tagesordnung drängt. Es geht im Kern natürlich um Versorgungssicherheit,
  es geht um hybride Angriffe. Norwegen ist ein enger sicherheitspolitischer Partner;
  das ist gerade durch den U-Boot-Deal mit Kanada auch sichtbar geworden. Es geht
  um die Weltraumkooperation. Es gibt eine Menge von Themen. Dazu zählt auch der Schutz
  des hohen Nordens innerhalb des Bündnisgebietes der NATO. Es gibt also viele Themen,
  die sie beschäftigen und zu denen sie sich austauschen können. Dann hatten Sie noch
  ein aktuelles Thema. Ja, ich habe noch ein drittes Thema, die Coalition of the Willing.
  Sie wissen, dass heute Bundeskanzler Merz zusammen mit dem französischen Staatspräsidenten
  Macron und Premierminister Burnham als Co-Vorsitzender sowie gemeinsam mit Präsident
  Selenskyj von der Ukraine das Treffen der Koalition der Willigen leitet. Das Treffen
  findet in hybrider Form statt. Es beginnt um 13 Uhr. Einige Staats- und Regierungschefs
  sowie Vertreter von EU und NATO werden von Kyjiw aus teilnehmen. Andere werden zugeschaltet,
  so auch Bundeskanzler Merz. Anlass der Beratung ist der heutige 35. Unabhängigkeitstag
  der Ukraine. Es wird hier um die weitere Unterstützung der Ukraine gehen, um weiteren
  Druck auf Russland sowie um Sicherheitsgarantien für eine souveräne Ukraine. Wir
  stellen fest, dass die Ukrainer und die Ukrainerinnen jetzt ihr Land im nunmehr
  fünften Jahr mit beeindruckendem Mut gegen den völkerrechtswidrigen Angriffskrieg
  Russlands verteidigen. Sie zeigen der gesamten Welt, was es heißt, für Freiheit
  und für gerechten Frieden einzutreten. Gleichzeitig ist die Ukraine bereit zu ernsthaften
  Verhandlungen und zu einem sofortigen Waffenstillstand. Wir stellen allerdings fest,
  dass Russland die Angriffe intensiviert, sie immer brutaler gestaltet, auch gegen
  die Zivilbevölkerung und die Infrastruktur. Allein in den letzten Wochen und Monaten
  waren Hunderte tote Zivilisten zu beklagen. Russland gefährdet mit seinem Verhalten
  auch die globale Versorgung mit Nahrungsmitteln durch Angriffe auf Getreideschiffe
  und auf Häfen im Schwarzen Meer, und es droht der EU und der NATO unverhohlen mit
  hybriden Angriffen. Wir stellen fest, dass die Ukraine in diesem Abwehrkampf auch
  die Sicherheit und die Freiheit Deutschlands verteidigt. Insofern wird der Bundeskanzler
  auch die Bereitschaft erneuern, die Ukraine in ihrem Abwehrkampf weiter zu unterstützen,
  fest an der Seite des Landes zu stehen. Das wird Gegenstand der Besprechung sein
  ebenso wie weitere Maßnahmen in ganz akutem Kriegsgeschehen wie Luftverteidigung,
  aber auch die Fragen von Resilienz, etwa bei der Energieversorgung des Landes. Zum
  Thema Ukraine: Herr Müller, Außenminister Wadephul war am Wochenende in Kyjiw und
  hat sich dafür ausgesprochen, dass die Bundeswehr noch einmal prüfen möge, ob es
  in den Beständen noch Patriot-Systeme oder Raketen gibt, die abgegeben werden könnten.
  Sieht der Verteidigungsminister da eine Möglichkeit? Wäre da noch etwas machbar?
  Ich habe hier vor zwei Wochen am Montag schon mal länger zum Thema Luftverteidigungsmunition,
  unter anderem auch über Patriot-Systeme oder Patriot-Raketen, gesprochen. Das ist
  ja ein Dauerthema, ein Dauerprozess, den wir, was die Lieferung angeht, über Jahre
  ausgeplant haben und begleiten, natürlich bei jedem UDCG, bei jedem Verteidigungsministertreffen,
  bei jedem Gipfel. Das habe ich am Montag vor zwei Wochen erläutert, dass das ein
  ständiger Prozess ist, ein Dauerprozess. Wir wollen und wir tun aktuell alles, um
  der Ukraine die benötigten Mittel, Systeme und Lenkflugkörper zur Verfügung zu stellen.
  Die Schwierigkeiten, die damit einhergehen, habe ich am Montag vor zwei Wochen auch
  schon erläutert. Dann eine Nachfrage an Herrn Kornelius. Es geht um die Lieferung
  von Patriot-PAC-2-Raketen für die Jahre 2027 und 2028. Der ukrainische Präsident
  hat jetzt am Sonntag bei einem Pressegespräch davon gesprochen, es sei zwischen
  der Ukraine und Deutschland eine Stückzahl von 600 vereinbart worden. Inwiefern
  können Sie das bestätigen? Ich kann keine konkrete Zahl bestätigen, aber selbstverständlich
