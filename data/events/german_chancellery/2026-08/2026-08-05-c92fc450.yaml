date: '2026-08-05'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 5. August 2026
text: '(Vorsitzende Wefers eröffnet die Pressekonferenz und begrüßt SRS Hille sowie
  die Sprecherinnen und Sprecher der Ministerien.) An das BMI: Haben Sie schon eigene
  Erkenntnisse zu der Drohne am Leipziger Flughafen, die Sie teilen können? Ich kann
  bestätigen, dass am Flughafen Leipzig/Halle eine Drohne gefunden wurde. Darüber
  hinaus kann ich jetzt leider erst einmal nichts dazu sagen, da es sich hier um laufende
  Ermittlungen handelt. Da möchte ich also um ein bisschen Geduld bitten. Sollte es
  sich bei der festgestellten Drohne tatsächlich um einen Sprengsatz handeln, was
  wären dann die Folgen? Wie gesagt, dazu kann ich Ihnen jetzt nichts sagen. Es handelt
  sich um laufende Ermittlungen, und ich würde Sie bitten, diese abzuwarten. An den
  Regierungssprecher: Können Sie schon sagen, wie Sie diesen Vorfall bewerten? Würden
  Sie da von einem versuchten Anschlag sprechen? Ich verstehe das Interesse sehr gut,
  aber ich kann auch nur auf das verweisen, was der Kollege vom BMI gerade gesagt
  hat: Wir können bestätigen, dass dieser Vorfall stattgefunden hat, und alles andere
  ist dann Gegenstand von Ermittlungen. Sie wissen, dass ich von dieser Stelle aus
  jetzt nicht wirklich gut Spekulationen anstellen kann; deshalb werde ich das auch
  nicht tun, genauso wie der Kollege Kaminski. An das Verteidigungsministerium: Auch
  der NATO-Sprecher war in die Kommunikation heute Morgen involviert. Ist auch die
  Bundeswehr irgendwie an der Aufklärung dieses Falls beteiligt, und wenn ja, in welcher?
  Nein, tatsächlich gibt es da keine Beteiligung der Bundeswehr. Das ist vielmehr
  eine reine Angelegenheit der Bundespolizei, sodass ich aus meinem Geschäftsbereich
  auch keine Ergänzungen machen kann. Herr Reck, was sagt das Bundesverkehrsministerium
  zur allgemeinen Lage der Verkehrssicherheit in Bezug auf Drohnen? Ihr Ministerium
  ist ja mit für die Luftverkehrssicherheit zuständig, wenn es um die Abgrenzung von
  Drohnen zu den Flughäfen geht, also um die Flugverbotszonen. Was ist aus Ihrer Sicht
  mit Blick auf diesen Vorfall bislang klar? Es gibt rund um den Flughafen Leipzig/Halle
  eine entsprechende No-fly-Zone für Drohnen, oder? Wir sind uns der Gefährdung des
  Luftverkehrs durch unbemannte Luftfahrtsysteme durchaus bewusst. Unsere Aufgabe
  ist es, die Sicherheit des Flugbetriebs aufrechtzuerhalten. Manchmal ist das nur
  durch vorübergehendes Einstellen des Flugverkehrsflugbetriebs gewährleistet. Das
  wollen wir aber natürlich auf ein Minimum reduzieren. Ziel muss es sein, die Drohnen,
  die bedrohlich sein könnten, schnell zu identifizieren und unschädlich zu machen,
  sodass weiter ein sicherer Luftverkehr gewährleistet werden kann. Zu dem konkreten
  Fall kann ich wie die Kollegen auch noch nichts sagen. Herr Kaminski, war die Bundespolizei
  am Standort Leipzig mit Drohnenabwehrsystemen ausgestattet? Das ist ja unabhängig
  von den Ermittlungen. Das weiß ich im Moment nicht. Ich würde die Antwort nachliefern.
  Herr Kaminski, ich will es doch noch einmal versuchen: Die Drohne wurde ja geröntgt,
  das ist bekannt. Wurden dabei Sprengstoff und ein Zünder festgestellt oder nicht?
  Wie gesagt, die Ermittlungen laufen noch. Ich kann Ihnen nur noch einmal das Gleiche
  wie vorher sagen, weil ich Ihnen dazu in diesem Moment tatsächlich nichts anderes
  sagen kann. Es gab am Luftfrachtzentrum in Leipzig schon einmal einen Zwischenfall
  mit einem Paket, in dem ein Sprengsatz war, der nur durch Zufall nicht im Flugzeug
  explodiert ist oder in Brand geraten ist. Sehen Sie da einen direkten Zusammenhang?
  Zum jetzigen Zeitpunkt nicht, nein. Wie gesagt, der Vorfall, über den wir gerade
  sprechen oder versuchen zu sprechen, hat letzte Nacht stattgefunden. Deswegen kann
  ich zum jetzigen Zeitpunkt aufgrund der laufenden Ermittlungen nicht sagen, ob da
  ein Zusammenhang besteht oder nicht. An das Verkehrsministerium: Können Sie uns
  sagen, wie lange der Flughafen Leipzig/Halle gestern gesperrt war? Wann wurde die
  Sperrung also entschieden und wann wurde sie wieder aufgehoben? Es wurde gemeldet,
  dass ein Flugzeug in der Luft mit etwas kollidiert sei. Wissen Sie dazu etwas Genaueres?
  Hat in Hannover dann eine Notlandung stattgefunden? Zu beiden Sachverhalten kann
  ich Ihnen ad hoc nichts sagen. Können Sie das gegebenenfalls nachliefern? Zur zweiten
  Frage kann ich Ihnen tatsächlich gerne noch etwas sagen. Es ging um ein Flugzeug,
  das in Leipzig hätte landen sollen und dann durchstarten musste, weil es dort nicht
  landen konnte. Es ist dabei anscheinend mit etwas kollidiert und konnte dann in
  Hannover landen. Auch wenn es laufende Ermittlungen sind, haben diese Ermittlungen
  ja eine Chronologie. Können Sie uns ein bisschen mitnehmen: Was ist passiert, nachdem
  diese Drohne gesichtet wurde? Welche Ermittlungen, welche Einsätze haben dann stattgefunden?
  Wurde dann diese Drohne dann beispielsweise gesprengt? Da Sie den zweiten Vorgang
  gerade im Prinzip bestätigt haben: Handelte es sich da auch um eine Drohne oder
  um ein anderes Objekt? Zuerst die leichtere Antwort auf die zweite Frage: Das ist
  ein bislang nicht bekanntes Objekt. Zu Ihrer ersten Frage kann ich mich ‑ das sage
  ich jetzt wahrscheinlich zum vierten, fünften oder sechsten Mal ‑, kann ich mich
  leider nicht äußern. Das sind laufende Ermittlungen. Aber was ist denn der normale
  Ablauf bei solchen Ermittlungen, wenn eine Drohne am Flughafen in Leipzig detektiert
  wird? Das kann ich Ihnen jetzt aus dem Stegreif nicht sagen. Die Bundespolizei nimmt
  dann die Ermittlungen vor, die sie vornimmt. Eventuell könnte ich Ihnen das nachliefern,
  aber das weiß ich jetzt aus dem Stegreif tatsächlich nicht. Danke. Es gab im vergangenen
  Jahr ähnliche Vorfälle, unter anderem auch am Flughafen München. An das Verkehrsministerium:
  Damals gab es im Nachgang eine politische Diskussion darüber ‑ auch innerhalb der
  Regierung ‑, die Flughafenbetreiber stärker in die Pflicht zu nehmen. Ist das Ihrer
  Ansicht nach geschehen? Hat sich da etwas getan oder verbessert? Das ist an der
  Stelle ja ein Zusammenspiel von verschiedensten Playern: Das sind die Flughafenbetreiber,
  das ist die Deutsche Flugsicherung, das ist das BMI mit der Bundespolizei. Da finden
  natürlich immer wieder bzw. laufend Abstimmungen statt, um Vorsorge zu treffen.
  Aber nehmen Sie wahr, dass die Flughafenbetreiber seit den Vorfällen im vergangenen
  Jahr etwas getan haben, um den Schutz aus eigenem Antrieb zu verbessern? Ich nehme
  wahr, dass auf jeden Fall ein großes Interesse daran besteht, den Flugbetrieb der
  einzelnen Flughäfen aufrechtzuerhalten. Genau, ich möchte noch etwas zur Einstellung
  des Flugbetriebs in Leipzig nachliefern: Der Flugbetrieb wurde um 1.55 Uhr in der
  Nacht für circa zwei Stunden eingestellt. Die Nordbahn ist mittlerweile wieder geöffnet,
  aber die Südbahn ist weiterhin gesperrt. Herr Kaminski, können Sie bestätigen, dass
  eine ukrainische Maschine Teil dieses bestätigten Vorfalls war? Das kann ich zum
  jetzigen Zeitpunkt nicht bestätigen. Damit sage ich weder ja noch nein, aber das
  kann ich gerade nicht bestätigen. Wird in dem Fall der Generalbundesanwalt eingeschaltet?
  Das weiß ich nicht. ‑ Vielleicht kann der Kollege vom Justizministerium etwas dazu
  sagen? Ich kann auch nur sagen, dass die Ermittlungen noch laufen, und würde erst
  einmal auf die ermittlungsführenden Behörden vor Ort verweisen. Das müsste dann
  erst einmal weiter geprüft werden. Ist das Terrorabwehrzentrum unter Führung des
  BMI mit dem Fall befasst oder wird es damit befasst? Sofern es in diesem Zusammenhang
  einen Anlass dafür gibt, werden sich die entsprechenden Institutionen damit befassen.
  Zum jetzigen Stand kann ich Ihnen dazu nichts sagen. Erstens. Wer ist eigentlich
  alles in die Aufklärung des Vorfalles involviert? Soweit ich das verstehe, sind
  das auf jeden Fall die Bundespolizei, die Bundesstelle für Flugunfalluntersuchung,
  der Flughafen Leipzig/Halle und eine Staatsanwaltschaft. Ich hätte gerne einen Überblick
  darüber, wer sich hier koordinieren muss. Zweitens. Sind die Flughafenbetreiber
  momentan überhaupt zur Drohnenabwehr berechtigt? Ich hatte das so verstanden, dass
  das Luftsicherheitsgesetz nicht in dem Sinne geändert wurde, dass ihnen Drohnenabwehrsysteme
  erlaubt würden. Zumindest meinerseits ist die Antwort auf beide Fragen relativ kurz:
  Sowohl die Liste der beteiligten Institutionen als auch die Antwort auf die rechtliche
  Frage, die Sie gestellt haben, müsste ich Ihnen nachliefern. Direkt daran anschließend:
  Ist das ein Fall, der im GAZ Hybrid behandelt wird? Da lautet die Antwort ähnlich
  wie zu der vorherigen Frage zum Gemeinsamen Terrorabfallzentrum: Die Institutionen,
  die sich des Falls wegen damit beschäftigen müssen, werden sich damit beschäftigen.
  Ich kann Ihnen zum jetzigen Zeitpunkt aber nicht sagen, ob das der Fall ist. Ich
  würde gerne noch einmal daran erinnern: Natürlich reagieren alle sofort und so schnell
  wie möglich. Die Bundespolizei war sofort vor Ort; es hat alles direkt begonnen.
  Der Vorfall fand aber erst letzte Nacht um vier Uhr statt. Die Idee des GAZ Hybrid
  ist ja, dass es sofort oder quasi fast noch bevor irgendetwas passiert, alle zusammenbindet
  und alarmiert. Deswegen doch noch einmal die Nachfrage ‑ im Zweifel können Sie das
  die Antwort gerne auch nachliefern ‑: Wurde dieser Fall im GAZ Hybrid besprochen?
  Diejenigen Behörden ‑ Sicherheitsbehörden und auch andere Behörden ‑, die in diesem
  Fall eine Zuständigkeit haben, stehen selbstverständlich im Austausch dazu. An das
  Verkehrsministerium und das Landwirtschaftsministerium: Vom Bauernverband kommen
  Klagen, wie schwierig die Lage für viele Bauern sei. Daher die Frage: Plant oder
  erwägt die Bundesregierung Hilfen wegen des Niedrigwassers und der Dürre? Vielen
  Dank für die Frage. ‑ Wenn Sie sich erinnern: In den letzten Jahren war die Situation
  oftmals ähnlich, dass sich verschiedene Betroffene im Vorfeld geäußert haben. Für
  uns ist wichtig: Wir beobachten die Situation und stehen im Austausch mit allen
  relevanten Akteuren. Wir halten es aber noch zu früh für eine finale Einschätzung.
  Es gibt sehr viele regionale Unterschiede. Wir wissen, dass unsere Landwirtschaft
  von Wetterextremen besonders betroffen ist. Zum jetzigen Zeitpunkt können wir aber
  noch keine abschließende Einordnung dazu geben. An das Verkehrsministerium: Können
  Sie noch kurz sagen, was morgen bei dem Spitzengespräch mit Herrn Bilger Thema sein
  wird und ob da Beschlüsse zu erwarten sind? Wie Sie richtig sagen, hat Minister
  Bilger zum Spitzengespräch morgen um 13.30 Uhr ins BMV in Bonn eingeladen. Eingeladen
  sind Vertreter der betroffenen Industrien: die chemische Industrie, die Stahlindustrie,
  aber auch die Reedereiverbände und das verladene Gewerbe links und rechts des Rheins.
  Ziel ist es primär, erst einmal Problemstellungen und Herausforderungen zu identifizieren
  und dann gemeinsam in eine Umsetzung möglicher Lösungen zu kommen. Der Regierungssprecher
  hatte vor einigen Wochen gesagt, dass man das Thema nicht zur Chefsache machen werde,
  weil das das Wetter nicht verändern würde. Ich möchte jetzt noch einmal nachfragen:
  Ab welcher Hitze, ab welchen Temperaturen, ab wie vielen Hitzetoten, ab welchem
  Stand des Niedrigwassers würde man das Thema dann vielleicht doch zur Chefsache
  machen? Wäre es vielleicht nicht auch angebracht, irgendwann einmal ‑ auch in der
  Sommerpause ‑ eine Krisensitzung abzuhalten? Auch da verstehe ich Ihr Interesse
  und lobe die Kreativität der Herangehensweise ‑ Gradzahlen, Pegelstände. Es wird
  Sie aber nicht überraschen, dass ich mich jetzt nicht darauf einlassen und sagen
  werde: Ab einem Pegelstand von so und so viel tun wir dies und jenes. Das ganze
  Thema ist ein großes Thema, das natürlich die Bundesregierung, den Bundeskanzler,
  alle beteiligten Ministerien hier, aber auch in Ländern und Kommunen intensiv beschäftigt
  und auch intensiv bearbeitet wird. Wir haben am Montag schon kurz mit einem etwas
  anderen Schwerpunkt, aber im Grunde auch über diesen Themenkomplex gesprochen: Wir
  haben in Deutschland nicht umsonst eine Staatsstruktur ‑ Kommunen, Länder und Bund ‑
  mit unterschiedlichen Zuständigkeiten. Wichtig ist, dass alle Ebenen ihre Aufgaben
  erfüllen, und nach unserem Dafürhalten sind alle intensiv dabei, diese Themen zu
  bearbeiten. Dem Bund kommt bei vielen dieser Themen, weil sie am besten entweder
  in der Kommune oder durch die Länder bearbeitet werden, eine koordinierende Rolle
  zu. Wenn Bundeswasserstraßen oder dergleichen betroffen sind, sind die entsprechenden
  Häuser natürlich intensiv damit beschäftigt. Das zeigt sich auch an solchen Veranstaltungen
  wie dem Gipfel, den der Bundesverkehrsminister morgen abhalten wird. Das ist die
  Art und Weise des Umgangs mit diesem großen, wichtigen Themenkomplex Hitze und den
  daraus resultierenden Folgen wie Niedrigwasserständen und deren Bedeutung ‑ Sie
  haben gerade mit dem Kollegen des Landwirtschaftsministeriums gesprochen ‑ für die
  Landwirtschaft, die Transportbranche oder dergleichen. Um es auf einen Begriff zu
  bringen: Ich würde sagen, wir reagieren lageabhängig und leben sozusagen in der
  Lage. Diese besteht aus einer dauerhaften Bearbeitung und nicht aus einzelnen Ereignissen,
  die dann irgendwie zwingend erforderlich sind. Beim Thema Niedrigwasser steht auch
  die Forderung nach einer Taskforce im Raum; zum Beispiel wird diese Forderung in
  Nordrhein-Westfalen wird erhoben. Wird dieser Vorschlag aufgenommen, ist irgendetwas
  in dieser Richtung geplant? Ich nehme an, die Frage geht an mich. ‑ Warten wir einmal
  ab, was in dem Gespräch morgen tatsächlich aus der Branche als Bedarf angemeldet
  wird. Dem möchte ich jetzt nicht vorgreifen. Frau Lorenzat, inwiefern bedeutet das
  momentan eine Einschränkung der Energieversorgungssicherheit? Beispielsweise ist
  die Kölner Raffinerie auch ‑ nicht allein, aber auch ‑ von Lieferungen über den
  Rhein abhängig. Da würde ich ganz gerne wissen: Was bedeuten die niedrigen Wasserstände
  jetzt ganz konkret für die Energieversorgungssicherheit? Wenn ich das richtig gesehen
  habe, liegt der offizielle Pegelstand bei Emmerich jetzt bei minus sieben Zentimetern.
  Das ist eher schlecht für die Schifffahrt. Die Energieversorgungssicherheit ist
  natürlich von überragender Bedeutung, deshalb beobachten wir die ganz genau. Im
  Hinblick auf Öl- und Kraftstofflieferungen kann ich sagen, dass derzeit keine Versorgungsengpässe
  beobachtet werden. Wir sind aber natürlich mit der Branche im Austausch und bleiben
  das auch weiterhin. Ansonsten kann ich Ihnen im Hinblick auf die Energieversorgung
  noch mitteilen, dass wir derzeit keine Drosselungen von Kraftwerken in Deutschland
  aufgrund von Niedrigwasser oder Hitze sehen. Dann noch eine Nachfrage an das BMUKN:
  Es gibt verschiedenste Chemiewerke entlang des Rheins. Diese transportieren einen
  Teil ihrer Schadstoffe normalerweise mit dem Rheinwasser ab. Gibt es irgendwelche
  Beobachtungen bezüglich erhöhter Konzentrationen in dem nun verminderten Rheinwasser?
  Das ist eine sehr spezielle Frage. Für die Beobachtung gibt es natürlich Regularien;
  diese kann ich gerade aber im Einzelnen nicht referieren. Zur Not müsste ich das
  nachreichen. Ich bin mir aber sicher, dass die zuständigen Behörden das nach den
  entsprechenden Regularien mit im Blick haben. Da es ja eine bundesweite Geschichte
  ist, freue ich mich auch über eine Nachreichung. Das betrifft ja nicht nur den Rhein,
  sondern auch andere Flüsse. An das Landwirtschaftsministerium: Herr Schulz, Sie
  haben gesagt, die Problemlage sei schon seit Jahren bekannt. Man muss ja auch kein
  Wahrsager sein, um vorherzusagen, dass uns das auf Jahre und Jahrzehnte weiter beschäftigen
  wird. Gibt es im Bereich der Landwirtschaft ernsthafte Bemühungen, beispielsweise
  andere Getreidesorten anzubauen, die hitze- und dürreresistenter sind als diejenigen,
  die wir momentan anbauen? Ja, natürlich, und das tun wir auch schon eine geraume
  Zeit. Wir haben die Problematik also schon sehr früh erkannt. Wir unterstützen die
  Landwirtschaft dabei, widerstandsfähiger gegen Phänomene und Situationen wie Dürre
  und Trockenheit zu werden, indem wir innovative Sorten fördern, die Forschung fördern
  und wassersparende Bewässerungskonzepte unterstützen. Für uns ist die Situation
  also keine neue; vielmehr sind wir schon seit vielen Jahren bzw. seit Jahrzehnten
  dabei, die Landwirtschaft aktiv zu unterstützen. Denn es ist klar: Wir brauchen
  eine gute Versorgung der Bevölkerung mit Lebensmitteln. Das sicherzustellen ist
  unser Ziel. Gibt es so ein Umsteuern nur punktuell und in Versuchsprojekten oder
  auch großflächiger? Das sind keine Versuchsprojekte. Das ist vielmehr schon längst
  auf der Schiene, wie man im Verkehrsministerium vielleicht sagen würde. Das wird
  in vielen Bereichen umgesetzt, und die Landwirtschaft ist da auch mit Eifer dabei;
  denn es ist ihr natürlich ein Anliegen, Produktionssicherheit zu gewährleisten ‑
  im eigenen Interesse und zur Versorgung der Bevölkerung. Ich hätte zwei Fragen zu
  den Gasspeicherfüllständen an das BMWE. Erste Frage: Ist zum 1. November ein Speicherstand
  von 76 Prozent erreichbar? Können Sie schon absehen, ob dieser Speicherstand ausreicht?
  Zweite Frage: Wie soll die Gaseinspeicherung vor dem Hintergrund eines volatilen
  LNG-Markts forciert werden? Danke für die Frage. ‑ Die Gasspeicherstände sind derzeit
  in der Tat niedriger als in vorangegangenen Jahren; der Winter wurde mit vergleichsweise
  leeren Gasspeichern beendet. Die Wintervorsorge des Markts läuft aber, und sie muss
  auch weiterlaufen. Es ist Aufgabe der Unternehmen und der Händler, die Speicher
  für den Winter zu füllen. Es gibt derzeit eine geringere Speichernachfrage. Das
  hat einfach damit zu tun, dass in den letzten Jahren zum Beispiel durch LNG Flexibilitätsoptionen
  dazugekommen sind. Wir gehen davon aus, dass die privaten Akteure im aktuellen Marktumfeld
  die Befüllung der Speicher übernehmen können. Können Sie noch speziell zur zweiten
  Frage etwas sagen? Wie soll die Gaseinspeicherung vor dem Hintergrund eines volatilen
  LNG-Markts forciert werden? Noch einmal: Wir gehen davon aus, dass der Markt diese
  Wintervorsorge, zu der er auch verpflichtet ist, in der aktuellen Marktlage übernehmen
  kann. Ich bleibe direkt bei der Frage der Einspeicherung: Frau Lorenzat, es gibt
  ja festgelegte Termine für die Einspeicherung, und die Gasspeicher als solche sind
  derzeit sehr unterschiedlich gut gefüllt. Es fällt auf, dass gewisse Speicher, nämlich
  die Porenspeicher, besonders schlecht gefüllt sind. Woran liegt das? Wurden diese
  Speicher durch die entsprechenden Gasversorger einfach so wenig gebucht? Die niedrigen
  Füllstände dieser Speicher reißen die ganze Statistik ja deutlich nach unten. Das
  ist ja kein neues Phänomen; vielmehr hatten wir das in den letzten Jahren auch schon
  beobachtet. Das hat zum Teil damit zu tun, dass die verschiedenen Speicherarten
  unterschiedlich schnell ein- und ausspeichern, und das hat auch damit zu tun, dass
  durch die Importe im Norden ‑ beispielsweise durch die Norwegen-Pipeline und auch
  durch die LNG-Terminals im Norden ‑ die Nachfrage regional einfach unterschiedlich
  ist. Noch zum aktuellen Speicherstand: Wenn ich das richtig sehe, ist es so, dass
  der derzeitige Speicherstand in einem „richtigen“ Winter wie dem vergangenen Winter
  im Bestfall für etwa drei Wochen reichen könnte. Die Kapazität reicht ohnehin nicht
  für den gesamten Winter; das heißt, man müsste irgendwann nachspeichern. Gibt es
  seitens der Ministerin, wenn die Mindestspeicherstände möglicherweise doch nicht
  erreicht werden, irgendeine Art von Initiative, noch einmal auf die Speicherbetreiber
  und die Gasversorger zuzugehen und dafür zu sorgen, dass diesbezüglich noch etwas
  stattfindet? Oder ist es ausschließlich Sache der Bundesnetzagentur, dies durchzusetzen?
  Diese Frage ist ja spekulativer Natur, deshalb möchte ich mich dazu jetzt nicht
  äußern. So spekulativ ist der aktuelle Füllstand nicht. Aber Sie spekulieren ja
  über den Speicherstand zu einem bestimmten Zeitpunkt, der noch nicht eingetreten
  ist. Ich habe eine Energiefrage an Frau Sachter: Gibt es etwas Neues in Sachen Übergewinnsteuer?
  Wird darüber diskutiert? Gibt es da einen neuen Sachstand? Bundesfinanzminister
  Lars Klingbeil setzt sich weiterhin auf europäischer Ebene für eine Übergewinnsteuer
  ein. Seine Position dazu hat er ja schon vielfach deutlich gemacht. Auf EU-Ebene
  gibt es auch andere Mitgliedstaaten wie beispielsweise Spanien oder Italien, die
  dieses Anliegen unterstützen, und in diesem Rahmen stehen wir eben mit diesen Mitgliedstaaten
  auch im stetigen Austausch. Ganz grundsätzlich gilt, dass die Bundesregierung in
  der aktuellen Krise laufend prüft, welche Maßnahmen notwendig sind, aber eben auch,
  wie diese gegenfinanziert werden können. Konkretes habe ich Ihnen jetzt hier heute
  nicht anzukündigen und kann mich dazu auch noch nicht näher äußern. Danke. - Gibt
  es vonseiten des Bundeskanzlers etwas Neues, der ja bekanntlich nie im Urlaub ist?
  Da haben Sie gut aufgepasst! So ist es. Ich habe aber dem, was die Kollegin gesagt
  hat, nichts hinzuzufügen, außer noch einmal zu sagen, dass wir das natürlich im
  Blick haben und Prüfungen grundsätzlich immer laufen. Wir sind also reaktionsbereit,
  wenn es nötig ist. Aber darüber hinaus habe ich nichts anzukündigen. Ich rufe es
  einfach einmal so in den Raum herein, ich glaube, hauptsächlich für die Kollegin
  und den Kollegen, aber trotzdem ist es möglicherweise für alle interessant: Die
  Ermittlungen hat die Bundespolizei an die Landespolizei in Sachsen abgegeben. Das
  Gemeinsame Drohnenabwehrzentrum und das GAZ Hybrid sind in den Fall involviert.
  Auch in Niedersachsen ermittelt die Landespolizei. Zur Drohnenabwehrtechnik am Flughafen
  Leipzig, und damit beziehe ich mich jetzt nicht auf die rechtliche Frage, sondern
  ausschließlich auf das Vorhandensein: Die ist dort noch nicht vorhanden, befindet
  sich gerade in der Beschaffung. Ich hätte eine Frage an Herrn Hille. Die russische
  Desinformationskampagne scheint Berichten zufolge noch einmal deutlich ausgeweitet
  zu werden, auch jetzt vor den Landtagswahlen. Was tut die Bundesregierung dagegen?
  Auch wenn Sie es gerne von mir hören würden, wird Ihnen das qua Zuständigkeit und
  besserer Expertise der Kollege Kaminski beantworten. Genau, es wird ja aktuell viel
  über diese Kampagne namens „Matrjoschka" berichtet. Dabei handelt es sich um eine
  Kampagne, bei der verschiedene Social-Media-Nutzer Kurzvideos auf Englisch und auf
  anderen Sprachen veröffentlichen konnten, tatsächlich nicht auf Deutsch bzw. wenig
  auf Deutsch, wenn überhaupt. Die beziehen sich auf die demnächst stattfindenden
  Landtagswahlen, und darin sind Vorwürfe im Bereich der Korruption, Sucht, Populismus,
  Vetternwirtschaft oder Antisemitismus in Bezug auf Akteure bei den Landtagswahlen
  enthalten. Diese Kampagne haben wir als BMI bzw. als Bundesregierung selbstverständlich
