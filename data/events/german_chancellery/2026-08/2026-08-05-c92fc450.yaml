  mit gleichen Rechten gestalten. Was die aktuellen Berichte angeht, da wird es Sie
  nicht wundern, dass wir uns über solche möglichen Verhandlungen nicht äußern. Aber
  ich kann es Ihnen leichter machen: Der Aufsichtsratschef ‑ so heißt er, glaube ich ‑
  Tom Enders hat sich, während wir hier sitzen, geäußert, was die Anteile angeht.
  Diese Meldung würde ich zur Lektüre empfehlen. Es ist nicht meine Aufgabe, für ihn
  zu sprechen. Aber ich sage es als Servicehinweis. Wollen Sie nicht vielleicht sagen,
  was er gesagt hat? Dann könnte man darauf vielleicht noch eine Frage aufbauen. Das
  könnte ich tun. Aber ich bin ja nun nicht der Sprecher von KNDS, sondern der der
  Bundesregierung. Ich würde es deshalb mit dem Servicehinweis zur Lektüre der Meldung,
  die von vor ca. 20 Minuten ist, bewenden lassen. Nun höre ich gerade Ihnen zu und
  nicht Herrn Enders. Können Sie denn bestätigen, dass es Erwägungen gibt, dass der
  deutsche und der französische Staat gemeinsam KNDS komplett übernehmen könnten?
  Wie gesagt, meinte ich das mit dem Hinweis, dass wir derartige laufende Prozesse
  nicht kommentieren. Aber dafür empfehle ich noch einmal die Aussagen von Herrn Enders.
  Sie beantworten diese Frage nämlich aus Sicht des Unternehmens sehr eindeutig. Wir
  steckten nie hinter dieser Nachricht. Hört nach meiner Aufforderung heute ganz besonders
  kritisch zu. „Kritisch zuhören“ ist schon eine interessante Konnotation. Es ist
  an der einen oder anderen Stelle vielleicht auch angeraten. Der KNDS-Chef hat ja
  ‑ wenn Sie es nicht sagen, sage ich es ‑ gesagt, es gebe keinen Grund zur Verstaatlichung.
  Ist das aus Sicht der Bundesregierung genauso? Gibt es keinen Grund, oder wäre es
  einfach nur nicht klug? Mit dem ganz klaren Disclaimer, dass ich jetzt nicht für
  die Bundesregierung spreche, sondern lediglich eine Pressemeldung mit Äußerungen
  des KNDS-Verwaltungsratschefs zitiere, zitiere ich gern den KNDS-Verwaltungsratschef
  Tom Enders. Zitat: „Es gibt keine Diskussionen über eine komplette Verstaatlichung
  von KNDS, und es gibt auch absolut keinen Grund dafür.“ „Unsere unmittelbare Priorität
  bleibt der Börsengang.“ Zitat des Verwaltungsratschefs von KNDS, den ich hier als
  Servicehinweis zitiert habe, Ende. Aber die Frage war ja: Wie sieht es die Bundesregierung?
  Sieht die Bundesregierung auch keinen Grund, so wie Herr Enders? Ich habe doch eingangs
  schon gesagt, dass wir weiterhin daran interessiert sind, das Unternehmen KNDS gemeinsam
  mit unseren französischen Partnern in eine erfolgreiche Zukunft zu führen. Wir wollen
  zusammen mit Frankreich die Zukunft von KNDS als künftige gemeinsame Anteilseigner
  mit gleichen Rechten gestalten. Auch das habe ich gerade schon gesagt. Ich würde
  die Frage noch an das Wirtschaftsministerium weiterreichen, denn Herr Enders spricht
  ja nicht für die Bundesregierung. Deswegen muss ich die Frage noch einmal stellen:
  Ist der Börsengang die oberste Priorität für die Bundesregierung? Ich habe den Ausführungen
  von Herrn Hille nichts hinzuzufügen. Er hat alles dazu gesagt. Gibt es Gespräche
  über Alternativen zu einem Börsengang? Herr Hille, die Commerzbank stellt morgen
  die Q2-Zahlen vor. Es gibt vor diesem Hintergrund Berichte, die Commerzbank habe
  den Kampf gegen die Übernahme durch UniCredit aufgegeben. Wie sieht die Bundesregierung
  das? Ist die Messe gelesen, oder geht der Kampf weiter? Das war hier, glaube ich,
  auch schon mehrfach Thema. Der Bundeskanzler hat sich dazu meiner Erinnerung nach
  auch in der Sommer-PK geäußert. An unserer Position hat sich nichts geändert. Es
  ist jetzt aus unserer Sicht Sache der Banken, miteinander zu sprechen und darüber
  zu reden, wie es weitergeht. Es bleibt auch dabei, dass wir das aggressive Vorgehen
  der UniCredit ablehnen. Aber das ist vergossene Milch. Aber es bleibt uns, glaube
  ich, trotzdem, dass wir es nicht gut finden und ablehnen und auch weiterhin im Sinne
  des deutschen Mittelstandes daran interessiert sind, dass der Finanzstandort Frankfurt
  und auch die Beschäftigten eine sichere Perspektive haben. Es ist jetzt wiederum
  Aufgabe der Bankenvorstände, das miteinander zu klären. Das Finanzministerium, die
  BaFin, hat ja jetzt die Unterlagen noch einmal geprüft bzw. für vollständig erachtet.
  Ergibt sich daraus aus Ihrer Sicht ein neuer Stand, was die Verhandlungen angeht?
  Grundsätzlich habe ich den Ausführungen von Herrn Hille nichts hinzuzufügen. Vielleicht
  auch noch als Servicehinweis: Die BaFin arbeitet ja auch unabhängig vom Finanzministerium.
  Ich habe eine Frage an das Innenministerium und eine kurze Frage an das Außenministerium
  wegen der Bundeszentrale für politische Bildung. Dazu gibt es jetzt, nachdem der
  nur kurzzeitig amtierende Präsident zurückgetreten ist, die Meldung, dass es in
  der Behörde auch generell eine Umstrukturierung geben solle. Können Sie einmal sagen,
  was diese Umstrukturierung zum Ziel hat? Nein, dazu kann ich zum jetzigen Zeitpunkt
  tatsächlich nichts sagen. Sofern es möglich ist, liefere ich Ihnen das nach. Aus
  den Pressemeldungen, die dazu kursierten ‑ das ist eine Frage an das Auswärtige
  Amt ‑, hieß es, dass unter anderem der Museumsbau rund um die Maschine „Landshut“
  gestoppt werden sollte. Das ist das Projekt, das Sigmar Gabriel damals in seiner
  Funktion als Außenminister ‑ ‑ ‑ Zwei Millionen Euro waren es, glaube ich, die an
  Steuergeld geflossen sind, um dieses alte Flugzeugwrack nach Deutschland zu bringen.
  Was soll denn jetzt mit dem Flugzeug passieren, das in Friedrichshafen weiterhin
  vor sich hin modert? Ich würde mir vorbehalten, es später noch einmal zu korrigieren.
  Aber soweit ich weiß, befindet es sich nicht im Eigentum des Auswärtigen Amtes.
  Es ist kein Projekt des Auswärtigen Amtes, dort ein Museum zu errichten. Insofern
  haben wir damit, glaube ich, nichts mehr zu tun. Wenn es anders sein sollte, würde
  ich mich noch einmal melden. Aber das ist der jetzige Stand. Noch einmal zur Bundeszentrale:
  Laut einer Sprecherin soll die Bundeszentrale ihre Arbeit künftig stärker auf den
  sogenannten Kernauftrag konzentrieren. Was bedeutet das konkret für bisherige Projekte
  und Themenschwerpunkte? Die Frage ging an mich. Die Bundeszentrale für politische
  Bildung ist eine nachgeordnete Behörde des BMI. Ich würde aber in meiner Antwort
  an den Kollegen verweisen. Dazu kann ich Ihnen zum jetzigen Zeitpunkt nichts sagen.
  (zur Kabinettssitzung) Herr Hille, heute wären ja eigentlich die Termine für nächste
  Woche dran gewesen. Haben Sie uns dazu nichts mitzuteilen? Wenn ich das hätte, hätte
  ich es getan. Spielen Sie auf irgendetwas Bestimmtes an? Ja, gerade eben haben wir
  ja vom Forschungsministerium gehört, dass es nächste Woche doch eine Kabinettssitzung
  geben wird. Wer wird diese leiten? Tagt das Kabinett jetzt immer im Zwei-Wochen-Takt?
  Das stimmt. Das wollte ich Ihnen, damit ich am Montag hier auch etwas habe, am Montag
  mitbringen, weil ja noch ein bisschen hin ist. Aber ja, kommende Woche findet eine
  Kabinettssitzung statt, ja, sie wird aller Voraussicht nach vom Vizekanzler geleitet,
  und nein, das Kabinett tagt nicht künftig alle zwei Wochen. Das ist nur in einer
  kurzen Sommerphase die Schrittfolge. Ansonsten tagt das Kabinett mit ganz wenigen
  Ausnahmen dann wieder im regelmäßigen Rhythmus. Sie kennen sie: wenn der Bundeskanzler
  international unterwegs ist. Ansonsten tagt es wieder wöchentlich. Es tagt zeitlich
  wie immer. Dann würden wir nämlich die Zeit der Regierungspressekonferenz wieder
  anpassen. Wir haben ja nicht mit einem Kabinett gerechnet. Es tagt zeitlich meines
  Wissens wie immer am Mittwoch um 10 Uhr. Das hätte dann auch Auswirkungen auf unsere
  Zeitplanung. Dann sähen wir uns wahrscheinlich wie gewohnt um 13 Uhr. Ich freue
  mich auf den Saal oben. Manche von uns erinnern sich ja noch daran, dass es einen
  Vizekanzler Westerwelle gegeben hat, der die Sitzung, die er geleitet hat, dann
  genutzt hat, um in die Bundespressekonferenz zu kommen und dort einen großen Aufschlag
  zu machen. Hat der jetzige Vizekanzler dies nächste Woche eventuell auch vor? Ich
  erinnere mich an Herrn Westerwelle. An den Rest, den Sie geschildert haben, erinnere
  ich mich nicht. Aber ich habe dazu keine Ankündigung zu machen und gehe nicht davon
  aus, dass etwas Ähnliches stattfinden wird. Sie müssen mit mir und den Kolleginnen
  und Kollegen vorliebnehmen. Ich erinnere mich daran schon. Aber es wurden noch keine
  Begehren formuliert. Ich nutze noch einmal die Gelegenheit, da wir über das Kabinett
  sprechen, um noch einmal eine Frage zum BAföG zu stellen. Der vorangegangene Beschluss
  oder die Diskussion sah ja vor, dass der Regelsatz schon zum Wintersemester 2028/2029
  erhöht werden sollte. Jetzt sieht es so aus, dass die Bedarfssätze erst zum Sommersemester
  2029 steigen werden. Ist daran etwas Wahres? Wie ist das in der Koalition abgestimmt?
  Dazu würde ich darauf verweisen, dass ich der Kabinettsbefassung nächsten Mittwoch
  nicht vorweggreifen möchte. Meine Frage bezieht sich auf die NIS-2-Registrierungen,
  also die Registrierungen zur Richtlinie zur Sicherung von Netz- und Informationssystemen
  beim BSI. Dabei sind die Zahlen um etwa die Hälfte geringer, als man ursprünglich
  erwartet hatte. Welche Erklärung hat das Bundesinnenministerium dafür, dass sich
  jetzt statt 29 500 eher 20 000 kritische Einrichtungen entsprechend beim BSI registriert
  haben? (zu möglichen Umstrukturierung der Bundeszentrale für politische Bildung)
  Ich wollte noch ganz kurz etwas nachliefern, weil mich die Wortwahl des Kollegen
  in Bezug auf die „Landshut“ vorhin ein bisschen gewundert hatte. Ich glaube, Sie
  hatten davon geredet, dass die Maschine dort vor sich hin modert. Davon würde ich
  doch schon gern Abstand nehmen. Es ist richtig, dass es keine Dauerausstellung geben
  wird. Aber es wird eine temporäre Ausstellung zum Lernort Landshut geben. Das heißt,
  die Maschine wird dort temporär natürlich genutzt und modert nicht vor sich hin.'
