title: Im Kabinett beschlossen Kriminelle Strukturen effektiv bekämpfen
text: 'Zoll und Bundeskriminalamt sollen zur effektiveren Bekämpfung der Organisierten
  Kriminalität rechtlich, technisch und personell gestärkt werden. Ob Finanzkriminalität,
  Geldwäsche, Drogenhandel oder Banden- und Clanstrukturen: Organisierte Kriminalität
  ist eine Bedrohung für die innere Sicherheit und beschädigt nachhaltig das Vertrauen
  in den Staat. Um diese kriminellen Strukturen effektiv zu bekämpfen und die innere
  Sicherheit zu stärken, hat das Bundeskabinett einen gemeinsamen Aktionsplan beschlossen.
  Damit setzt die Bundesregierung ein Zeichen gegen Organisierte Kriminalität – zum
  Schutz der inneren Sicherheit und des Wirtschafts- und Finanzstandortes Deutschland.
  Der Aktionsplan wurde vom Bundesfinanzministerium, dem Bundesinnenministerium und
  dem Bundesjustizministerium gemeinsam erarbeitet. Er wurde am 25. Februar 2026 im
  Kabinett beschlossen. Mit dem Zollfinanzgerechtigkeitsgesetz setzt die Bundesregierung
  nun zentrale Teile ihres Aktionsplans um. Nach den aktuellen Bundeslagebildern zu
  Organisierter Kriminalität und Rauschgiftkriminalität lag die Schadenssumme durch
  Delikte im Jahr 2024 laut Bundeskriminalamt bei 2,65 Milliarden Euro. „Die Täter
  untergraben den Rechtsstaat, sie betrügen die Allgemeinheit und sie richten einen
  enormen Schaden auf Kosten von uns allen an“, sagte Bundesfinanzminister Lars Klingbeil
  auf der Pressekonferenz in Berlin. Es sei eine Frage der Gerechtigkeit, den Kampf
  gegen Organisierte Kriminalität zu verstärken. Ein Schwerpunkt des Aktionsplans
  ist deshalb, die Kriminalitätsbekämpfung in Strafverfolgungs- und Sicherheitsbehörden
  neu aufzustellen. Der Zoll und das Bundeskriminalamt sollen dafür rechtlich, technisch
  und personell gestärkt werden. Darauf habe man sich laut Bundesinnenminister Alexander
  Dobrindt gemeinsam verständigt. „Wir sind uns sehr einig darüber, dass das nur mit
  zusätzlichem Personal auch dann zum notwendigen Erfolg gebracht werden kann“, sagt
  er. Vor allem soll der Informationsaustausch zwischen den Behörden deutlich verbessert
  werden. Hier will man künftig auf neue Technologien, wie KI in der Verbrechensbekämpfung
  setzen– etwa für die automatisierte Datenanalyse und für den biometrischen Internetabgleich.
  Laut Bundesinnenminister Dobrindt sei die Verständigung ein Riesenschritt, die Daten
  in einem Datenhaus zusammenfassen. „In unserem Land darf sich Verbrechen nicht lohnen.
  Täter müssen schnell ermittelt, vor Gericht gestellt und konsequent bestraft werden“,
  betonte Bundesjustizministerin Stefanie Hubig. Zentral dafür ist die Verfolgung
  von illegalen Geldflüssen. Deshalb soll es zukünftig mehr Möglichkeiten geben, um
  kriminelle Vermögenswerte, wie Bargeld, Luxusautos oder Häuser im Einklang mit dem
  Verfassungsrecht sicherzustellen und einzuziehen. Zur effektiven Bekämpfung der
  Finanzkriminalität sind zudem zusätzliche Kompetenzzentren geplant – ein gemeinsames
  Kompetenzzentrum zwischen Zoll und Bundeskriminalamt sowie ein Ermittlungszentrum
  zur Geldwäsche beim Zoll. Um die internationale Rauschgiftkriminalität aufzudecken
  und zu bekämpfen, soll zudem die internationale Zusammenarbeit ausgebaut werden.
  In diesem Zusammenhang soll ein gemeinsames Analyse- und Auswertungszentrum "Rauschgift"
  von Zollkriminalamt und Bundeskriminalamt errichtet werden.'
