title: Statement of Denmark, Germany, the Netherlands, Austria, Finland, and Sweden
  on the Multiannual Financial Framework 2028-2034
text: 'The negotiations on the Multiannual Financial Framework (MFF) 2028-2034 have
  entered a decisive stage. Through the MFF, the EU determines how it will spend its
  common resources well into the next decade. In an increasingly uncertain world,
  the MFF provides the foundation for ensuring the EU''s capacity to act as a strong
  and sovereign community, and to ensure security for Europeans. To deliver on this
  ambition, the MFF must be modernised and reformed, both in its architecture and
  in the way it allocates resources. Both should be guided by our shared priorities,
  which are set out, not least, in our Strategic Agenda: security and defence, competitiveness,
  migration and sovereignty.  By endorsing the three core spending programmes, the
  Council has laid the foundation for an architecture that is fit for the challenges
  ahead. Based on an affordable and viable EU budget, we jointly support the ambition
  to conclude the negotiations in 2026. At a time when virtually all Member States
  are undertaking painful fiscal consolidation, the EU budget cannot be an exception.
  The European Union must make clear choices and reprioritise within the budget, just
  as we do at home. The MFF will grow to address our strategic priorities, but it
  can only do so at a moderate pace. To arrive at an acceptable landing zone, the
  Commission’s proposal of nearly 2 trillion Euros needs to be reduced by several
  hundred billion Euros in a balanced manner. All headings should contribute to such
  reductions. Given the exceptionally high level of outstanding payment commitments
  under the current MFF, together with additional transfer mechanisms outside the
  MFF, a holistic assessment of the payment flows is necessary in the context of the
  MFF negotiations. Furthermore, we expect the EU institutions to organise their workload
  within the existing staff levels. Excessive net imbalances must be corrected. To
  live up to our ambitions, the new MFF must be underpinned by an efficient, socially
  responsible and business-friendly legislative and regulatory framework that systematically
  prioritises the successful, swift and green transformation of our economies, in
  particular by accelerating planning and permitting procedures. Respect for our common
  values and the rule of law must be a fundamental condition for access to any European
  funding. New common borrowing is not the solution to our budgetary challenges and
  is no alternative to structural reforms. Höflichkeitsübersetzung Erklärung von Dänemark,
  Deutschland, den Niederlanden, Österreich, Finnland und Schweden zum Mehrjährigen
  Finanzrahmen 2028–2034 Die Verhandlungen über den Mehrjährigen Finanzrahmen (MFR)
  2028–2034 sind in eine entscheidende Phase eingetreten. Mit dem MFR legt die EU
  fest, wie sie ihre gemeinsamen Mittel bis weit in das nächste Jahrzehnt hinein einsetzen
  wird. In einer zunehmend unsicheren Welt bildet der MFR die Grundlage dafür, die
  Handlungsfähigkeit der EU als starke und souveräne Gemeinschaft sicherzustellen
  und die Sicherheit der Europäerinnen und Europäer zu gewährleisten. Um diesem Anspruch
  gerecht zu werden, muss der MFR modernisiert und reformiert werden, sowohl in seiner
  Architektur als auch in der Art und Weise, wie die Mittel verteilt werden. Handlungsleitend
  müssen hierbei unsere gemeinsamen Prioritäten sein, die insbesondere in unserer
  Strategischen Agenda festgelegt sind: Sicherheit und Verteidigung, Wettbewerbsfähigkeit,
  Migration und Souveränität. Mit der Billigung der drei zentralen Ausgabenprogramme
  hat der Rat die Grundlage für eine Architektur geschaffen, die den vor uns liegenden
  Herausforderungen gewachsen ist. Auf der Grundlage eines finanzierbaren und tragfähigen
  EU-Haushalts unterstützen wir gemeinsam das Ziel, die Verhandlungen im Jahr 2026
  abzuschließen. In einer Zeit, in der praktisch alle Mitgliedstaaten schmerzhafte
  Haushaltskonsolidierungen vornehmen, kann der EU-Haushalt keine Ausnahme bilden.
  Die Europäische Union muss klare Entscheidungen treffen und innerhalb des Haushalts
  Prioritäten neu setzen – so, wie wir dies auch auf nationaler Ebene tun. Der MFR
  wird wachsen, um unseren strategischen Prioritäten Rechnung zu tragen, doch dies
  kann nur in moderater Weise geschehen. Um zu einem akzeptablen Kompromiss zu gelangen,
  muss der Vorschlag der Kommission in Höhe von nahezu 2 Billionen Euro in ausgewogener
  Weise um mehrere hundert Milliarden Euro reduziert werden. Alle Haushaltsrubriken
  müssen zu diesen Kürzungen beitragen. Angesichts des außergewöhnlich hohen Umfangs
  noch ausstehender Zahlungsverpflichtungen im derzeitigen MFR sowie zusätzlicher
  Transfermechanismen außerhalb des MFR ist im Rahmen der MFR-Verhandlungen eine ganzheitliche
  Bewertung der Zahlungsströme erforderlich. Darüber hinaus erwarten wir von den EU-Institutionen,
  dass sie ihre Aufgaben mit dem bestehenden Personalbestand bewältigen. Übermäßige
  Ungleichgewichte bei den Nettosalden müssen korrigiert werden. Um unseren Ambitionen
  gerecht zu werden, muss der neue MFR durch einen effizienten, sozial verantwortungsvollen
  und unternehmensfreundlichen Rechts- und Regulierungsrahmen flankiert werden, der
  den erfolgreichen, zügigen und ökologischen Wandel unserer Volkswirtschaften systematisch
  priorisiert, insbesondere durch die Beschleunigung von Planungs- und Genehmigungsverfahren.
  Die Achtung unserer gemeinsamen Werte und der Rechtsstaatlichkeit muss eine grundlegende
  Voraussetzung für den Zugang zu jeglicher europäischer Finanzierung sein. Neue gemeinsame
  Schuldenaufnahme ist keine Lösung für unsere haushaltspolitischen Herausforderungen
  und stellt keine Alternative zu Strukturreformen dar.'
