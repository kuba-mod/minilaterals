date: '2026-08-27'
type: press_release
source_name: german_chancellery
title: Pressekonferenz nach Beratungen zum EU-Haushalt Mit Augenmaß, Realismus und
  Reformbereitschaft
text: 'Man strebe einen EU -Haushalt mit Augenmaß an, so Bundeskanzler Merz bei der
  gemeinsamen Pressekonferenz. Nach den Gesprächen bei einem gemeinsamen Mittagessen
  über den kommenden EU -Haushalt bekräftigten Bundeskanzler Merz, die dänische Ministerpräsidentin
  Frederiksen, der finnische Ministerpräsident Orpo und der österreichische Bundeskanzler
  Stocker in einer Pressekonferenz ihre gemeinsame Position. Die Regierungschefs aus
  den Niederlanden und aus Schweden waren bei den Beratungen per Videokonferenz zugeschaltet.
  Die Gruppe habe ein gemeinsames Interesse daran, „für Realismus und Reformen in
  diesen Verhandlungen einzutreten“. Der nächste Mehrjährige Finanzrahmen stehe laut
  Bundeskanzler Merz für die Frage, wofür man bis weit hinein in das nächste Jahrzehnt
  das gemeinsame Budget in der Europäischen Union ausgeben wolle. Die Verhandlungen
  in Brüssel wolle die Gruppe der großen Beitragszahler möglichst noch in diesem Jahr
  abschließen. Meine Damen und Herren, herzlich willkommen zu unserer kleinen Pressekonferenz.
  Ich freue mich sehr, dass die dänische Ministerpräsidentin Mette Frederiksen, der
  finnische Ministerpräsident Petteri Orpo und der österreichische Bundeskanzler Christian
  Stocker meiner Einladung heute nach Berlin gefolgt sind. Wir freuen uns sehr, dass
  ihr alle da seid. Herzlich willkommen in Berlin, lieber Christian, liebe Mette,
  lieber Petteri! Wir haben gemeinsam mit zwei weiteren Kollegen, die per Videokonferenz
  zugeschaltet waren, und zwar den Regierungschefs aus den Niederlanden und aus Schweden,
  über die Frage der Zukunft des europäischen Mehrjährigen Finanzrahmens gesprochen.
  Zu den nächsten Schritten dieser Verhandlungen haben wir uns heute in einem sehr
  vertraulichen Rahmen eng ausgetauscht, und wir werden das als Gruppe auch weiter
  so handhaben. Wir haben das heute verabredet, da wir ein gemeinsames Interesse daran
  haben, für Realismus und Reformen in diesen Verhandlungen einzutreten. Ich möchte
  gleich zu Beginn auch darauf hinweisen, dass wir zusammen mit unseren schwedischen
  und niederländischen Freunden rund 40 Prozent des europäischen Haushaltes finanzieren.
  Das heißt, wir sind sozusagen die Gruppe der großen Beitragszahler in den europäischen
  Haushalt. Der ab 2028 geltende Mehrjährige Finanzrahmen steht für nicht weniger
  als die Frage, wofür wir bis weit hinein in das nächste Jahrzehnt unser gemeinsames
  Budget in der Europäischen Union ausgeben wollen. Dieses Budget gibt Möglichkeiten,
  setzt aber auch Grenzen der europäischen Politik für viele Jahre. Ich habe es schon
  gesagt: Wir wollen Realismus und Reformen. Mit einem Haushalt des 20. Jahrhunderts
  werden wir den Herausforderungen des 21. Jahrhunderts nicht begegnen können. Wir
  brauchen einen modernen Mehrjährigen Finanzrahmen, der unsere politischen Prioritäten
  abbildet, und zwar mit der Wettbewerbsfähigkeit und der Industrie der Europäischen
  Union im Zentrum. Das Thema Wettbewerbsfähigkeit – Sie wissen, dass das auch Gegenstand
  der Kabinettsklausur der deutschen Bundesregierung gestern und vorgestern war –
  ist heute wichtiger denn je, auf nationaler wie auf europäischer Ebene. Europa wird
  sich in dieser Welt nur aus eigener wirtschaftlicher Stärke heraus behaupten können.
  Wir wollen die überaus schwierigen und komplexen Verhandlungen zum Mehrjährigen
  Finanzrahmen nach Möglichkeit bis zum Ende des Jahres 2026 abschließen. Das muss
  nicht sein, aber es wäre gut, wenn uns das gelingt; denn der nächste Mehrjährige
  Finanzrahmen tritt am 1. Januar 2028 in Kraft, und bis dahin sollte Klarheit herrschen.
  Realismus heißt aber auch: Der EU -Haushalt muss finanzierbar bleiben. Die aktuellen
  Vorschläge sehen einen Aufwuchs von bis zu 60 Prozent vor. In Zeiten der Haushaltskonsolidierung
  in allen Mitgliedstaaten ist das schlicht unbezahlbar. Wir sind uns daher in dieser
  Gruppe einig: Die Vorschläge müssen um mehrere hundert Milliarden Euro gekürzt werden,
  und diese Kürzungen werden alle Bereiche betreffen müssen. Mir ist in diesem Zusammenhang
  noch eines wichtig zu betonen: Die Mitgliedstaaten, die sich hier heute getroffen
  haben, finanzieren – ich habe es bereits gesagt – fast 40 Prozent eines Haushalts
  von 27 Mitgliedstaaten, bringen zusammen aber auch 70 Prozent der bilateralen Hilfen
  für die Ukraine auf, die aus der EU insgesamt zur Verfügung gestellt werden. Wir
  sind nicht geizig, aber solche Zuschreibungen, wie sie von der Kommission vorgeschlagen
  werden, passen einfach nicht in unsere Zeit. Wir wollen einen europäischen Haushalt,
  der zu unseren Ansprüchen an ein souveränes und starkes Europa passt. Dieser Haushalt
  wird wachsen. Das aber geht nur mit Augenmaß und – noch einmal – mit Realismus und
  Reformbereitschaft. Hierfür stehen wir gemeinsam. Ich will euch allen noch einmal
  herzlich danken, dass ihr nach Berlin gekommen seid. Wir haben verabredet, dass
  wir diesen Austausch fortsetzen und dann auch mit einer gemeinsamen Position in
  die Beratungen der Europäischen Union gehen werden. Diese Beratungen werden im Oktober
  beginnen, dann aber im November und Dezember in die entscheidende Phase treten.
  Noch einmal herzlichen Dank euch dreien, aber auch den beiden Kollegen aus den Niederlanden
  und aus Schweden, dass wir diese Zusammenarbeit miteinander auf den Weg gebracht
  haben und auch mit einer gemeinsamen Position in die Beratungen der Europäischen
  Union gehen. Herzlichen Dank, Herr Bundeskanzler, lieber Friedrich! Danke dafür,
  dass Sie dieses Treffen heute in Berlin ausrichten! Ich erinnere mich noch gut an
  die letzten Verhandlungen zum MFR . Es waren damals angesichts des Brexits und von
  COVID-19 die bisher schwierigsten Verhandlungen. Ich denke, die Verhandlungen jetzt
  sind die wichtigsten. Für mich ist die wichtigste Aufgabe für unsere Europäische
  Union, die europäische Sicherheit zu stärken und die Sorgen unserer Menschen aufzunehmen.
  Russland testet und bedroht uns. Wir sehen hybride Angriffe in ganz Europa. Fast
  jeden Tag passiert das. Wir müssen uns neu bewaffnen und die Ukraine weiterhin unterstützen,
  mehr Waffen, mehr Munition. Wir müssen auch unsere Grenzen schützen. Erst vor Kurzem
  haben wir noch einmal gesehen, wie die Aggression Europa tatsächlich bedroht. Wir
  müssen Kontrolle über unsere Grenzen haben. Wir müssen zusammenstehen, um sicherzustellen,
  dass die Sicherheit unserer Bürgerinnen und Bürger gewährleistet ist. Deswegen muss
  der EU -Haushalt eine Priorität auf Sicherheit und Verteidigung legen, weiterhin
  starke Unterstützung für die Ukraine liefern und unsere Außengrenzen schützen. Wie
  es der Bundeskanzler gesagt hat, müssen wir eine stärkere Wirtschaft aufbauen. Wir
  müssen die Arbeitsplätze der Zukunft und Wohlstand für unsere Bürgerinnen und Bürger
  schaffen. Dafür müssen wir die europäische Wettbewerbsfähigkeit stärken, Europa
  resilienter aufstellen und den grünen Übergang schaffen. Das ist natürlich schwierig.
  Deswegen müssen wir Prioritäten setzen. Der EU -Haushalt kann größer ausfallen,
  als er heute ist. Aber der vorgeschlagene Anstieg, der aktuell auf dem Tisch liegt,
  ist schlichtweg zu hoch gegriffen. Wir wollen mit Ihnen und anderen Kolleginnen
  und Kollegen für eine Einigung zusammenarbeiten, die den Ambitionen insbesondere
  im Bereich der Sicherheit und Verteidigung gerecht wird und gleichzeitig einen Haushalt
  schafft, der verantwortungsvoll ist und deswegen unseren Bürgerinnen und Bürgern
  auch verständlich gemacht werden kann. Guten Tag! Zunächst einmal herzlichen Dank,
  lieber Friedrich, für die hervorragende Initiative, uns heute hier in Berlin zusammenzubringen!
  Europa braucht einen Haushalt, der die Welt so widerspiegelt, wie sie sich uns heute
  darstellt. Wir müssen mehr in Sicherheit und Verteidigung investieren, in Wettbewerbsfähigkeit,
  Migration und die Unterstützung für die Ukraine. Wir müssen den EU -Haushalt modernisieren
  und sicherstellen, dass das europäische Geld so ausgegeben wird, dass es die größtmögliche
  Wirkung erzielt. Europa braucht aber auch einen bezahlbaren Haushalt. Die Kommission
  hat einen MFR mit einem Umfang von fast zwei Billionen Euro vorgeschlagen. Das wäre
  ein Anstieg um fast 600 Milliarden Euro im Vergleich zum aktuellen Haushalt. Für
  uns ist dieser Anstieg schlichtweg zu hoch. Unsere Haltung diesbezüglich ist ganz
  klar: Wir müssen diesen Anstieg um Hunderte von Milliarden Euro reduzieren. Selbst
  nach diesen Reduzierungen würde der EU -Haushalt noch deutlich anwachsen. Auch das
  ist ein wichtiger Punkt. Wir verlangen keine kleinere Europäische Union oder, dass
  Europa weniger tun sollte. Wir wollen, dass Europa Entscheidungen trifft und seine
  Ressourcen auf die Prioritäten fokussiert, die am wichtigsten sind. Das sollte nicht
  einfach nur durch horizontale Kürzungen erfolgen. Wir müssen unsere Schlüsselprioritäten
  schützen, insbesondere Sicherheit und Verteidigung, Wettbewerbsfähigkeit, Migration
  und die Ukraine. Europäische Gelder sollten die besten Ideen und Projekte unterstützen,
  die die Wettbewerbsfähigkeit Europas stärken. Viele Mitgliedstaaten müssen schwierige
  Entscheidungen treffen, um ihre nationalen Haushalte auszugleichen. Diese Realität
  muss auch auf europäischer Ebene anerkannt werden. Deswegen müssen wir jetzt konkrete
  Zahlen auf den Tisch legen und die Verhandlungen vorantreiben. Wir sollten die schwierigen
  Entscheidungen nicht ganz ans Ende schieben. Finnland bleibt auch auf Finanzierungsseite
  absolut konstruktiv. Wir sind bereit, hinsichtlich einiger neuer Eigenmittel voranzuschreiten.
  Aber neue Einkünfte allein werden das Grundproblem nicht lösen. Unser Ziel sollte
  sein, eine Einigung über den MFR zum Ende des Jahres zu erreichen, aber nicht um
  jeden Preis. Eine gute Einigung ist wichtiger als eine schnelle Einigung. Abschließend
  gibt es ein Thema, das besonders wichtig ist für Finnland. Finnland hat eine 1340 Kilometer
  lange direkte Landgrenze mit Russland, die längste Grenze dieser Art in der Europäischen
  Union. Das schafft sehr konkrete Probleme im Bereich der Sicherheit, der Infrastruktur
  und der Wirtschaft für unsere östlichen und nördlichen Regionen. Der neue EU -Haushalt
  muss diese neue Realität an der Ostgrenze anerkennen. Vielen Dank. Sehr geehrter
  Herr Bundeskanzler, lieber Friedrich, liebe Mette, lieber Petteri, dass wir uns
  heute hier gemeinsam treffen, ist ein sehr wichtiges Signal in einer entscheidenden
  Phase der Verhandlungen über den Mehrjährigen Finanzrahmen. Es zeigt unseren Willen,
  in den Verhandlungen mit einer Stimme zu sprechen, weil ich es auch ganz offen von
  meiner Seite her sage: Der aktuell vorliegende Vorschlag ist für Österreich in dieser
  Form nicht akzeptabel. Wir sprechen noch immer über ein viel zu großes Volumen von
  beinahe zwei Billionen Euro. Das wäre eine Steigerung von 60 Prozent zum Vergleichszeitraum.
  Wenn alle Mitgliedstaaten in ihren Budgets Einsparungen vornehmen müssen, dann gilt
  das auch für die Europäische Union. Hätten wir in den Nationalstaaten, beispielsweise
  in Österreich, eine Steigerung von 60 Prozent, würde sich, glaube ich, die Europäische
  Kommission sehr dafür interessieren. Daher kann ich den Menschen bei uns in Österreich
  auch nicht erklären, dass wir in Brüssel über den größten Haushalt aller Zeiten
  diskutieren, während wir zu Hause unsere Budgets kürzen. Daher muss das Gesamtvolumen
  auch substanziell sinken, und zwar – es ist angesprochen worden – um Hunderte Milliarden
  Euro. Wir alle wollen diese Verhandlungen bis Ende des Jahres abschließen. Aber
  wenn wir das schaffen wollen, muss der Vorschlag, der dann vorgelegt wird, die Rechnung
  mit dem Wirt machen und nicht nur mit den Gästen. Ich darf an dieser Stelle ganz
  klar festhalten: Es geht uns nicht um weniger Europa, sondern es geht uns darum,
  dass wir mit jedem Euro zielgerichtet umgehen. Ein starkes Budget ist nicht automatisch
  das größte Budget. Was wir brauchen, sind Prioritäten, mehr Effizienz und dort,
  wo die Effizienz fehlt, auch Reduktion. Nicht jede Zeile in diesem Budget verdient
  automatisch eine zweite Amtsperiode, und mehr Europa entsteht auch nicht durch mehr
  Geld oder mehr Beamte, sondern durch bessere Entscheidungen. Als Gruppe, so wie
  wir uns hier zusammengefunden haben – es ist angesprochen worden –, finanzieren
  wir 40 Prozent des gesamten Budgets. Es kann uns also niemand vorwerfen, dass wir
  nicht bereit sind, unseren Beitrag zu leisten. Aber dieser Beitrag hat eine entscheidende
  Frage, die wir beantworten müssen, nämlich nicht nur, wie viel gekürzt wird, sondern,
  wie dieses Budget strukturiert wird. Bevor wir also über neue Mittel reden, sollten
  wir alte Gewohnheiten ganz genau ansehen. Wo entsteht echter europäischer Mehrwert,
  wo gibt es Doppelgleisigkeiten, und wo lässt sich auch privates Kapital stärker
  mobilisieren, statt öffentliche Mittel anzuheben? Wettbewerbsfähigkeit, Forschung,
  Sicherheit, Migration und andere Aufgaben mit einem klaren europäischen Mehrwert
  müssen auch stark abgebildet sein. Ich sage aber an dieser Stelle auch: Aus österreichischer
  Sicht dürfen die Landwirtschaft und die Regionalmittel nicht vergessen werden. Meine
  sehr geehrten Damen und Herren, wir sind nicht hier, um Nein zu sagen, wir sind
  hier, um Ja zu sagen, aber zu einem besseren Budget und auch besser formulierten
  Zielen. Ich bin überzeugt: Wenn wir als Gleichgesinnte mit einer klaren Position
  in diese Verhandlungen gehen, werden wir in Brüssel auch den Unterschied machen,
  den ein nachhaltiger und effizienter Finanzrahmen braucht. Sparsamkeit ist kein
  Widerspruch zu europäischem Ehrgeiz. Sparsamkeit ist die Voraussetzung dafür. Vielen
  Dank.'
