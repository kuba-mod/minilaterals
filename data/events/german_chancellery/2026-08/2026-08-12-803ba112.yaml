title: Im Kabinett beschlossen Kinder- und Jugendhilfe strukturell reformieren
text: Anstelle von individuellen Begleitern für ein einzelnes Kind sollen zukünftig
  verstärkt feste Bildungsassistenzen in Kitas und Schulen etabliert werden. Die Kinder-
  und Jugendhilfe steht vor großen Herausforderungen. Einerseits steigen die – teils
  sehr komplexen – Unterstützungsbedarfe von Kindern, Jugendlichen und Eltern kontinuierlich
  an. Andererseits sind die Ressourcen begrenzt. Zusätzlichen Druck erzeugen bürokratische
  Anforderungen sowie schwierige Abgrenzungen zu anderen Systemen wie der Eingliederungshilfe
  oder der Schule. Daher hat das Bundeskabinett nun einen Gesetzentwurf zur Reform
  der Kinder- und Jugendhilfe beschlossen. Der Gesetzentwurf sieht unter anderem vor,
  dass künftig infrastrukturelle und reguläre Angebote gegenüber individuellen Einzelfallhilfen
  Vorrang haben. So sollen anstelle von persönlichen, individuellen Kita - oder Schulbegleitern
  für ein einzelnes Kind verstärkt feste Bildungsassistenzen in Kitas und Schulen
  etabliert werden, die für mehrere Kinder gleichzeitig zuständig sind. Kindern und
  Jugendlichen, die individuelle Betreuung benötigen, wird aber auch künftig eine
  Einzelassistenz zur Seite gestellt. Auch im Bereich der Hilfen zur Erziehung sollen
  statt individueller Hilfen künftig vorrangig allgemeine Unterstützungsangebote wie
  Familienförderung, Beratung, Jugendsozialarbeit oder Regelangebote der Kindertagesbetreuung
  genutzt werden, sofern sie den Bedarf gleichermaßen oder besser erfüllen. Hilfen
  aus einer Hand für junge Menschen mit Behinderungen und ihre Familien sollen verbessert
  werden. Dazu soll es nun eine Experimentierklausel geben, um eine Erprobung der
  Gesamtzuständigkeit der Kinder- und Jugendhilfe zu ermöglichen statt der bisherigen
  geteilten Zuständigkeit. Die Regelung zum Verfahrenslotsen, der Familien mit Kindern
  mit Behinderungen bei der Beratung und Beantragung zu Leistungen der Eingliederungshilfe
  unterstützt, wird entfristet und weitergeführt. Die Ausnahmeregelung im Jugendschutzgesetz,
  die den Verzehr oder Erwerb alkoholischer Getränke durch 14- und 15-jährige Jugendliche
  in Begleitung eines Sorgeberechtigten erlaubt, wird gestrichen. Mit dem Streichen
  dieser Regelung soll dem präventiven Schutz junger Menschen vor den erheblichen
  gesundheitlichen und sozialen Folgen des Alkoholkonsums besser Rechnung getragen
  werden. Daneben zielt die Reform auf Bürokratieabbau und die Vereinfachung von Verwaltungsverfahren
  ab. Ziel ist es, die Strukturen der Kinder- und Jugendhilfe langfristig und zukunftssicher
  so weiterzuentwickeln, dass sie gesellschaftliche Teilhabe und Chancengleichheit
  für alle jungen Menschen wirksam und effizient gewährleisten beziehungsweise fördern
  kann. Die Kinder- und Jugendhilfe fördert Kinder und Jugendliche in ihrer Entwicklung
  und hilft jungen Erwachsenen in besonders schwierigen Situationen. Sie berät und
  unterstützt Eltern und andere Erziehungsberechtigte bei der Erziehung ihrer Kinder.
