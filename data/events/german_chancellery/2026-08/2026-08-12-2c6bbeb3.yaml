title: Im Kabinett beschlossen Mehr Unterstützung für den Mittelstand und Startups
text: 'Mit dem ERP -Gründerkredit können sich junge Unternehmen auf die Entwicklung
  neuer Verfahren und Produkte konzentrieren. Zinsgünstige Finanzierungen und Beteiligungskapital
  mit einem Volumen von rund 12 Milliarden Euro – das will die Bundesregierung kleinen
  und mittleren Unternehmen im kommenden Jahr mit Mitteln aus dem Sondervermögen des
  European Recovery Programs (ERP) ermöglichen. Damit stärkt das ERP -Sondervermögen
  die Resilienz des Wirtschaftsstandorts Deutschland vor dem Hintergrund verschiedener,
  auch geopolitischer Krisen. Deutsche Unternehmen gewinnen Handlungsspielräume, um
  Investitionen zu tätigen und sich und ihre Produkte weiterzuentwickeln. Das setzt
  wichtige Impulse für Wachstum und neue Innovationen. Das Kabinett hat den Wirtschaftsplan
  für das ERP -Sondervermögen für das Jahr 2027 beschlossen. Das Angebot richtet sich
  vor allem an kleine und mittelständische Unternehmen (KMU) als Rückgrat der deutschen
  Wirtschaft und unterstützt auch Gründungen. Die Mittel des Sondervermögens aus dem
  European Recovery Program (ERP) werden als Finanzierungskredite oder Beteiligungskapital
  von der KfW vergeben. Sie finanzieren Investitionen und Betriebsmittel der Unternehmen
  und unterstützen Gründungen über alle Branchen hinweg. Die Darlehen sind unter anderem
  besonders zinsgünstig mit langen Laufzeiten und Verzicht auf Tilgung in den Anfangsjahren.
  Das entlastet die Betriebe von der Gründungsphase an. Digitalisierung und Innovation
  sind ein Wachstumstreiber für den deutschen Mittelstand. Deswegen fördert die Bundesregierung
  mit dem Sondervermögen außerdem die Digitalisierung von KMU und Startups, ihren
  Produkten, Produktionsprozessen und Verfahren. In einigen Schlüsselbereichen werden
  außerdem ganze Projekte innovativer Unternehmen deckend finanziert. Wie wichtig
  die Mittel für die Innovation in Deutschland sind, zeigen Beispiele aus der Praxis:
  Die Förderung eines ERP -Gründerkredits konnte beispielweise ein junges Unternehmen
  nutzen, um individuelle Oberflächenbeschichtungen für die Industrie zu entwickeln
  und zu testen. Die Förderangebote können auch für notwendige Investitionen in der
  Gründungsphase genutzt werden, etwa für die Anschaffung von Baumaschinen, Fahrzeugen
  oder anderen Betriebsmitteln. Dadurch können junge Unternehmen erste Aufträge schon
  kurz nach der Gründung bearbeiten und ihre Geschäftstätigkeit ausbauen. Der Gründerkredit
  kommt damit vielen Startups zugute, die zukunftsweisende Ideen und Produkte auf
  den Markt bringen. Das Sondervermögen des European Recovery Program (ERP) wird von
  dem Bundesministerium für Wirtschaft und Energie verwaltet. Seit über 75 Jahren
  fördert das Sondervermögen die deutsche Wirtschaft und den Mittelstand. Weitere
  Informationen über die Antragstellung für ERP -Kredite finden Sie auf der Webseite
  der KfW sowie in der Förderdatenbank und dem Existenzgründungsportal des Bundeswirtschaftsministeriums.'
