title: Im Kabinett beschlossen Umsetzung der EU-Entwaldungsverordnung
text: 'Mit der EU-Entwaldungsverordnung sollen künftig nur noch entwaldungsfreie Güter
  in der EU verkauft werden. Felder statt Bäume: Der Konsum landwirtschaftlicher Güter
  treibt weltweit die Abholzung voran. Laut Schätzungen der Welternährungsorganisation
  sind zwischen 1990 und 2020 so weltweit 420 Millionen Hektar Wald verlorengegangen
  – eine Fläche, die größer ist als die Europäische Union. Jedes Jahr werden weltweit
  weitere zehn Millionen Hektar Wald zerstört. Wälder sind jedoch unverzichtbar für
  Klima und Artenvielfalt. Die EU will dem mit der EU -Entwaldungsverordnung – kurz
  EUDR ( EU Deforestation Regulation) – entgegenwirken. Mit der Verordnung soll erreicht
  werden, dass nur noch „entwaldungsfrei“ hergestellte Waren in die EU gelangen und
  auch nur solche aus der EU exportiert werden dürfen. Anwendungsbeginn der EUDR für
  große und mittlere Unternehmen ist am 30. Dezember 2026, für Klein- und Kleinstunternehmen
  am 30. Juni 2027. Die EUDR verpflichtet die Mitgliedstaaten, ihre Einhaltung wirksam
  zu überwachen. Dazu dient ein jetzt beschlossener Gesetzentwurf des Kabinetts. Die
  EU -Entwaldungsverordnung schreibt unternehmerische Sorgfaltspflichten für sieben
  Rohstoffe vor: Holz, Kakao, Kaffee, Kautschuk, Ölpalme, Soja und Rinder. Außerdem
  sind zahlreiche daraus hergestellte Erzeugnisse Gegenstand der Verordnung, beispielsweise
  Schokolade oder Möbel. Die EUDR soll sicherstellen, dass die Produkte in der EU
  nur dann in Verkehr gebracht oder exportiert werden, wenn sie drei Kriterien erfüllen:
  Die Produkte müssen entwaldungsfrei produziert sein. Das bedeutet, dass die Rohstoffe
  nicht auf Flächen erzeugt worden sein dürfen, die nach dem 31. Dezember 2020 entwaldet
  wurden. Bei Holz (und Holzerzeugnissen) gilt, dass es aus einem Wald stammen muss,
  in dem es seit dem 31. Dezember 2020 keine Waldschädigung gab. Die Produkte müssen
  nach den einschlägigen Rechtsvorschriften des Erzeugerlandes erzeugt worden sein.
  Um dies nachzuweisen, muss zum Beispiel belegt sein, dass eine Fläche nach nationalem
  Recht bepflanzt werden durfte. Dies soll unter anderem verhindern, dass indigene
  Völker ihre Lebensgrundlage verlieren. Für die Produkte muss eine Sorgfaltserklärung
  vorliegen. Der Marktteilnehmer muss in einer Sorgfaltserklärung bestätigen, dass
  die Waren entwaldungsfrei und im Herkunftsland legal erzeugt worden sind. Diese
  Sorgfaltserklärung muss er an das EU -Informationssystem übermitteln. Für die Umsetzung
  und Durchführung in Deutschland ist die Bundesanstalt für Landwirtschaft und Ernährung
  ( BLE ) zuständig. Der Gesetzentwurf schafft keine neuen, über das EU -Recht hinausgehenden
  Verpflichtungen. Zudem setzt er Vorschriften der EU -Umweltstrafrechts-Richtlinie
  um. Um Bürokratie zu vermeiden, wurden im Dezember 2025 deutliche Vereinfachungen
  der Verordnung beschlossen und Unternehmen damit maßgeblich entlastet. Zudem wurde
  bereits Ende 2025 eine Überprüfung der EUDR vereinbart. Auch hier konnte die Bundesregierung
  weitere zentrale Entlastungen durchsetzen. Damit werden Vorgaben aus dem Koalitionsvertrag
  erfüllt und unnötige Bürokratie für die deutsche Wirtschaft verhindert – insbesondere
  für die Land- und Forstwirtschaft, aber auch in der gesamten EU -Lieferkette. Das
  Bundeslandwirtschaftsministerium hat kürzlich den Entwurf für eine Allgemeine Verwaltungsvorschrift
  vorgelegt, mit der weitere zugesagte Vereinfachungen für die Praxis geregelt werden.
  Unter anderem gilt dies für den Verzicht auf die Angabe von Geodaten, die Möglichkeit
  der Abgabe von Sammelerklärungen über Forstwirtschaftliche Zusammenschlüsse sowie
  Anpassungen für mittlere und große Unternehmen, bei denen nur ein Teil der Geschäftstätigkeit
  sich auf von der EUDR erfasste Rohstoffe bezieht. Mehr Infos zur Umsetzung der Verordnung
  und wie sie funktioniert, gibt es im Video „ EU -Verordnung für entwaldungsfreie
  Produkte (EUDR)“ .'
