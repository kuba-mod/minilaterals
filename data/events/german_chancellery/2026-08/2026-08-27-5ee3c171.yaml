title: 'Kulturbauten-Initiative: 17,5 Millionen Euro für die Sanierung der Kaiser-Wilhelm-Gedächtnis-Kirche
  – Staatsminister Weimer: „Herzstück unserer Erinnerungskultur“'
text: 'Kulturstaatsminister Wolfram Weimer nahm heute am Pressetermin anlässlich des
  Baustarts in der Kaiser-Wilhelm-Gedächtnis-Kirche in Berlin teil und hielt die Eröffnungsrede.
  Der Bund fördert die Sanierung mit 17,5 Millionen Euro. Kulturstaatsminister Weimer
  sagte: „Die Kaiser-Wilhelm-Gedächtnis-Kirche ist ein Herzstück unserer Erinnerungskultur.
  Sie vermittelt die wechselvolle Geschichte unseres Landes. Sakralbauten wie die
  Kaiser-Wilhelm-Gedächtnis-Kirche schaffen Räume, in denen Menschen zusammenkommen,
  um sich bewusst mit den Fragen des Lebens auseinanderzusetzen. Es sind Orte, die
  uns aus den Routinen des Alltags herausholen und eine andere Perspektive auf die
  Welt eröffnen. Sie haben einen Wert, der weit über ihre Gebäude hinausreicht.“ Staatsminister
  Weimer weiter: „Ich freue mich sehr, dass BKM dazu beitragen kann, diesen besonderen
  Ort zu erhalten. Für die Sanierung stellt mein Haus 17,5 Millionen Euro zur Verfügung.
  Mein Dank gilt dem Haushaltsausschuss des Deutschen Bundestags für die Bereitstellung
  von Fördermitteln für Kulturbauten von nationaler Bedeutung.“ Die Fördermittel kommen
  der Sanierung des Gebäudeensembles der Kaiser-Wilhelm-Gedächtnis-Kirche zugute.
  Hierzu gehört auch die denkmalgerechte Wiederherstellung der wabenartigen Betonfassade
  nach Egon Eiermann und der Beton-Dickgläser nach Gabriel Loire. Die Stärkung der
  kulturellen Infrastruktur zählt zu den zentralen Anliegen der Bundesregierung. Mit
  nachhaltigen Investitionen unterstützt der Bund kulturelle Einrichtungen und Kulturdenkmäler
  von nationaler Bedeutung. Weitere Informationen rund um die BKM-Förderung von Kulturbauten
  finden Sie unter Kulturbauten | Kulturstaatsminister - Der Beauftragte der Bundesregierung
  für Kultur und Medien'
