date: '2026-08-03'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 3. August 2026
text: 'stellvertretender Regierungssprecher Hille (Vorsitzende Wefers eröffnet die
  Pressekonferenz und begrüßt SRS Hille sowie die Sprecherinnen und Sprecher der Ministerien.)
  (zur Ankunft zahlreicher Migranten in Ceuta ) Ich will mit Blick auf den morgigen
  Tag und die Konferenz der EU-Innenminister fragen, was sich Deutschland davon erhofft,
  erwartet, was sich aus Sicht Deutschlands ändern muss, damit so etwas nicht wieder
  vorkommt, und ob man die Kritik von einigen Ländern wie Italien an Spanien teilt.
  Haben Sie das an jemanden gezielt adressiert? Ich nehme an, es geht auf jeden Fall
  an das Innenministerium, aber vielleicht auch an Sie selbst. Ich kann vorweg vielleicht
  ein paar Sätze zur Gesamtlage sagen: Wie Sie angesprochen haben, ist ja einiges
  am Wochenende in Ceuta passiert. Das zeigt wieder einmal, wie volatil die Lage beim
  Thema der Migration ist und dass der Schutz der EU-Außengrenzen von entscheidender
  Bedeutung ist und höchste Priorität hat. Sie haben gesehen, was passiert ist, mit
  was für einem Ansturm in Ceuta umzugehen war. Es war eine wirklich herausfordernde
  Lage. Wichtig war aus unserer Sicht, dass die Sicherheitsbehörden umgehend wieder
  die vollständige Kontrolle in Ceuta zurückgewonnen haben. Der Vorfall zeigt deutlich,
  dass gemeinsame europäische Anstrengungen erforderlich und unerlässlich sind, um
  illegale Migration wirksam einzudämmen. Wir begrüßen die Maßnahmen, die Spanien
  jetzt eingeleitet hat, und sehen hierbei ganz klar ein gemeinsames europäisches
  Vorgehen als notwendig an. Genau darauf wurde sich verständigt. Sie haben die Schrittfolge
  wahrscheinlich auch wahrgenommen. Heute kommen ja schon die ständigen Vertreter
  in Brüssel zusammen. Morgen dann wird die Videoschalte der Innenminister stattfinden,
  die sich mit der Lage beschäftigen, die eine Analyse dessen, was dort passiert ist,
  vornehmen werden. Für alles Weitere, was Ergebnisse betrifft, würde ich bei allem
  Verständnis für das Interesse, schon vorauszublicken, darauf verweisen, den Termin
  morgen erst einmal stattfinden zu lassen. Dann können wir im Nachhinein darüber
  sprechen, was dort für Schlussfolgerungen und möglicherweise auch Beschlüsse getroffen
  worden sind, so welche gefunden werden. Dem habe ich seitens des BMI tatsächlich
  nichts hinzuzufügen. Ich glaube, der stellvertretende Regierungssprecher hat hierzu
  alles gesagt. Wichtig ist, die morgigen Gespräche abzuwarten. Dem werden wir nichts
  vorwegnehmen. Sie haben mit Sicherheit mitbekommen, dass sich Bundesinnenminister
  Dobrindt schon am Freitag geäußert hat. Ich gehe davon aus. Wenn nicht, kann ich
  seine Aussagen auch gern noch einmal vorlesen. Aber, wie gesagt, es gibt darüber
  hinaus von unserer Seite bis morgen erst einmal nichts. Sie warten einfach ab, was
  morgen beschlossen wird. Das klingt danach, dass Sie ohne eigene Agenda in dieses
  Treffen gehen werden. Sie müssen doch gewisse Erwartungen haben oder etwas einbringen.
  Das ist eine nicht ganz richtige Interpretation dessen, was ich gesagt habe. Wir
  warten nicht einfach ab. Ich habe nur gesagt: Bevor wir darüber sprechen, warten
  wir doch den morgigen Termin und das ab, was sowohl heute im Kreis der ständigen
  Vertreter als auch morgen im Kreis derer, die dafür zuständig und berufen sind,
  nämlich die Innenminister der EU-Staaten, besprochen wird, weil ‑ das ist doch zentral ‑
  wir gemeinsam europäisch vorgehen. ‑ Bei allem Verständnis für das Interesse, ist
  es nicht hilfreich, wenn man sozusagen vorher schon allzu viel Erwartungsmanagement
  betreibt, sondern morgen wird die Sitzung stattfinden. Danach können wir gern über
  das sprechen, was dort beraten worden ist. Die meisten Menschen sind ja jetzt offenbar
  wieder nach Marokko zurückgekehrt. Sie hätten auch gar nicht so einfach und ohne
  Weiteres auf das europäische Festland kommen können. Was waren denn die konkreten
  Befürchtungen der Bundesregierung, dass sie sich auch so früh so deutlich geäußert
  hat? Ehrlich gesagt fällt es mir gerade etwas schwer, die Frage zu verstehen. Ich
  gehe davon aus, dass auch Sie die Bilder gesehen haben, die wir gesehen haben. Es
  war ja nun schon ein sehr massives Vorkommnis, ein sehr großer Ansturm, der dort
  in kurzer Zeit stattgefunden hat. Es ist natürlich eine besondere Herausforderung,
  insbesondere für solch eine kleine Stadt und die Sicherheitskräfte dort, wenn unerwartet
  ein solcher Andrang über die Stadt einbricht. Das ist Grund genug, um mit einer
  gewissen Besorgnis darauf zu schauen. Ging es dabei eher um die Symbolik, sozusagen
  um die Macht der Bilder, die Bilder von der EU-Außengrenze, oder um die konkrete
  Angst, dass die Menschen auch irgendwann noch auf das Festland kommen könnten? Ich
  würde die Differenzierung, die Sie vornehmen, ehrlich gesagt nicht vornehmen wollen,
  sondern es ging darum, dass es dort einen massiven Andrang auf die Außengrenzen
  der Europäischen Union gegeben hat. Die Bilder gehören genauso dazu wie der Sachverhalt
  an sich. Von daher war es in dieser Größenordnung schon ein besonderes Vorkommnis.
  Deshalb war es wichtig, schnell und klar und europäisch zu reagieren. Herr Hille,
  auch wenn Sie zu dem morgigen Treffen vielleicht verständlicherweise inhaltlich
  nichts sagen wollen: Erwartet die Bundesregierung, dass es dabei konkrete Beschlüsse
  gibt, oder ist es Symbolik? Es ist wichtig, dass die Europäische Union sehr zügig
  reagiert hat und dass sowohl ‑ darauf habe ich gerade schon hingewiesen ‑ heute
  in einem ersten Schritt die ständigen Vertreter zu dem Thema zusammenkommen als
  auch morgen dann die Videokonferenz der Innenminister der europäischen Mitgliedstaaten
  stattfindet, weil ‑ auch das ist Teil dieses Themas ‑ das Ganze europäisch gelöst
  werden kann und muss. Wir setzen auf eine europäische Lösung in Fragen der Migration
  und der Bekämpfung der irregulären Migration. Deshalb ist es wichtig, dies im Kreis
  der europäischen Partner zu besprechen. Genau dazu dient das morgige Treffen. Wie
  Sie gesagt haben, ist es selten hilfreich, vorher allzu viele Erwartungen zu äußern.
  Das wird dann in dem Treffen besprochen. Wie gesagt, können wir gern am Mittwoch
  hier an dieser Stelle darüber sprechen, was in dem morgigen virtuellen Treffen zustande
  gekommen ist. Aber der Bundesinnenminister geht schon mit konkreten Vorstellungen
  und Vorstellungen dessen, was er ansprechen möchte und was zu tun ist, in das Treffen,
  richtig? Davon würde ich an Ihrer Stelle ausgehen. Aber hier sitzt ja auch noch
  der Kollege des Ressorts, der es vermutlich ganz ähnlich so sagen wird. Ich verstehe
  aus Ihrer Perspektive, dass es nicht ganz befriedigend ist, diese Antwort zu hören.
  Aber natürlich ist es so, dass wir weiterhin den morgigen Gesprächen nicht vorgreifen
  möchten, was, glaube ich, auch nachvollziehbar ist. Der stellvertretende Regierungssprecher
  hat gerade eben noch einmal erläutert, warum das der Fall ist. Ganz grundsätzlich
  ist es selbstverständlich ein extrem prioritäres Anliegen des Bundesinnenministers,
  die Migrationspolitik europaweit zu ordnen. Es gibt schon viele Erfolge, die vorzuweisen
  sind. Es gilt, diese Erfolge auszubauen und aufrechtzuerhalten. Damit Sie nicht
  ganz unbefriedigt den Raum verlassen: Natürlich geht es darum, darüber zu sprechen,
  dass sich solche Dinge nicht wiederholen. Natürlich geht es darum, zu besprechen,
  wie effektiver Grenzschutz, effektive Kontrollen stattfinden können. Das versteht
  sich, denke ich, von selbst. Trotzdem sage ich es noch einmal. Herr Kaminski, Sie
  haben auf das Statement von Minister Dobrindt von Freitag hingewiesen. Ich wollte
  fragen: Ist jetzt tatsächlich schon die Entscheidung wegen der Grenzkontrollen gefallen?
  Können Sie uns sagen, ob die Grenzkontrollen über den 15. September hinaus verlängert
  werden, und wenn ja, wie lange? Welcher Termin wird es sein? Dazu verweise ich,
  wie Sie gerade schon gesagt haben, auf die Aussagen des Ministers vom Freitag. Ganz
  grundsätzlich ist es so, dass die Binnengrenzkontrollen so lange aufrechterhalten
  werden müssen, bis sie nicht mehr notwendig sind. Aber Sie müssen einen Termin vorlegen,
  bis wann. Es gibt sie aktuell bis 15. September. Was passiert nach dem 15. September?
  Was ist die nächste Deadline? Es gibt ja immer konkrete Zeiträume, für die das gemacht
  werden kann. Es wird dann entschieden, wenn darüber entschieden wird. Meine Frage
  betrifft auch den Themenkomplex Ceutas. Herr Kaminski oder Herr Giese, wie bewerten
  Sie denn die Rolle Marokkos bei dem Geschehen, das wir in der vergangenen Woche
  gesehen haben? Die zweite Frage dazu: Deutschland hat 2024 ja eine Migrationspartnerschaft
  mit Marokko geschlossen. Besteht sie noch? Wie gut funktioniert sie? Ganz grundsätzlich:
  Außenminister Wadephul hat schon am vergangenen Freitag sowohl mit seinem spanischen
  als auch mit seinem marokkanischen Amtskollegen gesprochen. Wir stehen also auch
  zu dieser Frage in Kontakt. Beide haben zugesichert, dass sie zusammenarbeiten wollen,
  damit sich die Lage beruhigt. Wir sehen, dass diese Zusammenarbeit bei der Beruhigung
  der Lage gut funktioniert hat. Die meisten Menschen ‑ wir haben es schon besprochen ‑,
  die sich illegal in Ceuta aufgehalten haben, sind wieder zurückgegangen. Das erfordert
  natürlich auch, dass Marokko es ermöglicht. Das ist geschehen. Insofern kann ich,
  was das angeht, auch sagen, dass diese Gespräche etwas gebracht haben. In Bezug
  auf die Migrationspartnerschaft sehe ich das Auswärtige Amt nicht ganz in der Zuständigkeit.
  Ich weiß nicht, ob das BMI etwas dazu sagen kann. Durch die Ereignisse hat sich
  nichts daran verändert. Herr Hille, der US-Präsident hat ja vergangene Woche eine
  Einigung im Gazakonflikt vereinbart. Jetzt war es aber trotzdem alles ein bisschen
  verwirrend. Was weiß die Bundesregierung über die geplante Entwaffnung? War sie
  irgendwie involviert? Wir nehmen das, was dort stattfindet, natürlich wahr. Grundsätzlich
  begrüßen wir die Einigung auf eine Roadmap zur Entwaffnung der Hamas. Unser Dank
  gilt besonders den Verhandlern, insbesondere Ägypten, Türkei und Katar. Wie Sie
  wissen, war die Entwaffnung der Hamas ja immer eine grundlegende Forderung bei der
  Implementierung des 20-Punkte-Plans. Jetzt kommt es darauf an, dass die Parteien
  der Roadmap ohne weitere Vorbedingungen auch zustimmen, damit die konkrete Umsetzung
  beginnen kann und die Hamas tatsächlich ihre Waffen abgibt. Die Bundesregierung
  setzt sich dafür ein, einen dauerhaften Frieden zu erreichen ‑ das wissen Sie ‑
  und einen politischen Prozess hin zu einer Zweistaatenlösung zu erreichen, der Israelis
  und Palästinensern ein Leben in Würde, Frieden und Sicherheit ermöglicht. Der US-Präsident
  hat ja auch wieder von Stabilisierungstruppen gesprochen. Ist Deutschland bereit,
  sich bei so etwas zu beteiligen? Wie gesagt, geht es jetzt erst einmal darum, dass
  diese grundsätzliche Einigung auf die Roadmap auch sozusagen von den beteiligten
  Parteien akzeptiert wird und dann konkrete weitere Schritte hin zur Entwaffnung
  der Hamas stattfinden können. Das ist das, was jetzt zentral im Fokus steht. Ich
  weiß nicht, ob der Kollege Giese dazu noch etwas ergänzen möchte. Er schüttelt mit
  dem Kopf. Von daher deute ich das als Nein. Im Gazastreifen herrschen für die dortige
  Bevölkerung Hunger und Krankheit. Ist die Bundesregierung noch dabei mitzuhelfen
  oder nicht mehr? Der Außenminister hat sich direkt, nachdem der US-Präsident die
  Roadmap zur Entwaffnung der Hamas angekündigt hat, geäußert. Einer seiner Kernpunkte
  war, dass es jetzt schnell in die Umsetzung gehen muss und dass die Parteien zusammenarbeiten
  sollen, gerade mit dem Ziel, dass humanitäre Hilfe in den Gazastreifen gelangen
  kann. Das war eigentlich der Hauptpunkt, den er gemacht hat, denn wenn wir das begrüßen,
  geht es uns am Ende darum, dass wir das Leid der dortigen Bevölkerung natürlich
  zur Kenntnis nehmen und wissen, wie schlimm es dort um die humanitäre Versorgung
  steht. Das ist das Ziel, das wir alle verfolgen. Das ist, glaube ich, auch das Ziel,
  das die US-Regierung damit verfolgt, natürlich neben der Sicherheit Israels. Aber
  es geht darum, den Menschen dort eine Perspektive auf ein menschenwürdiges Leben
  zu geben. Ich kann Ihnen sagen, dass wir auch den bereits bestehenden und weiterhin
  durchzuführenden 20-Punkte-Plan, der ja letztlich sozusagen ein Vorstadium dieses
  Entwaffnungsplans der Hamas ist, auch mit Mitteln der humanitären Hilfe unterstützen.
  Deutschland hat seit dem 7. Oktober 2023 über 375 Millionen Euro für humanitäre
  Hilfe bereitgestellt. Wir setzen dies auch weiterhin mit UN-Organisationen und mit
  humanitären Nichtregierungspartnern um. Deswegen, wie gesagt, gibt es dafür Geld,
  gibt es dafür Mittel. Es gibt die UN, die dazu in der Lage ist, diese Hilfe durchzuführen,
  wenn es zugelassen wird. Das ist das Ziel, um das es uns geht. Die Pegelstände am
  Rhein sind augenfällig sehr niedrig, so niedrig wie noch nie. Aus Nordrhein-Westfalen
  kam jetzt der Wunsch, dass man sich in einer nationalen Taskforce zusammensetzt.
  Wie steht die Bundesregierung dazu? Wie steht sie konkret zu der Frage, Geld zu
  geben, um den Rhein auszubaggern und befahrbarer zu machen? Vielen Dank. ‑ Das würde
  ich an die Kolleginnen und Kollegen der Ressorts weiterleiten. Sehr gerne. ‑ Eines
  vorweg: Es wird am Donnerstag eine Fachkonferenz in Bonn unter Leitung des neuen
  Ministers, also von Herrn Bilger, geben. Die Einladungsliste mit Verbänden, mit
  allen Beteiligten, wird gerade erstellt. Wir sind uns dieses Thema also sehr bewusst
  und haben das sehr im Fokus. Wir hatten das Thema auch vorher schon im Fokus; denn
  das Bundesverkehrsministerium hat zusammen mit den großen Industrieunternehmen am
  Rhein und seinen Nebenflüssen sowie mit Vertretern der Schifffahrt und der Häfen
  schon den Aktionsplan „Niedrigwasser Rhein“ aufgestellt. Es ist ja nichts Neues,
  dass wir da Niedrigwasser haben, und dieser Aktionsplan umfasst ein Bündel an kurz-,
  mittel- und langfristigen Maßnahmen. Die kurzfristigen Maßnahmen des Aktionsplans
  haben wir bereits umgesetzt. Dadurch ist eine bessere Vorbereitung auf extreme Niedrigwasserereignisse ‑
  zuletzt hatten wir 2018 extremes Niedrigwasser ‑ gegeben, und die Gütertransporte
  können jetzt besser geplant und effizienter durchgeführt werden. Wir haben bei der
  Informationsbereitstellung Fortschritte erzielt. Seit 2022 gibt es eine Sechs-Wochen-Vorhersage
  sowie eine 14-Tage-Wasserstandsvorhersage für den Rhein. Seit Juli 2026 gibt es
  das Niedrigwasser-Informationssystem, NIWIS, mit dem ein bundesweites einheitliches
  Lagebild zum Niedrigwasser zur Verfügung gestellt wird. Wir haben solche Niedrigwasserereignisse
  ja nicht nur am Rhein, sondern zum Beispiel auch an der Donau, wo heute übrigens
  auch der Minister ist. Zudem wurde der Dienst für klimabezogene Planungs- und Entscheidungsgrundlagen,
  der Basisdienst „Klima und Wasser“, etabliert, und es wurden Anpassungsmaßnahmen
  für die verladende Industrie und im Schifffahrtsgewerbe ergriffen. Niedrigwasseroptimierte
  Schiffe wurden konzipiert und in den Dienst gestellt. Es gibt das BMV-Förderprogramm
  zur nachhaltigen Modernisierung von Binnenschiffen. Dieses Programm fördert den
  Umbau von im Einsatz befindlichen Güterschiffen für alle Unternehmen, unabhängig
  von deren Größe, mit bis zu 80 Prozent der zuwendungsfähigen Investitionsausgaben,
  um Verlagerungseffekte auf die Straße bei Niedrigwasserereignissen zu vermeiden.
  Der aktuelle Stand ‑ wir haben das gerade noch einmal aufgerufen ‑: Bislang wurden
  drei Umbauten zur Niedrigwasseroptimierung mit einer Fördersumme von insgesamt 10,5 Millionen
  Euro unterstützt. Darüber hinaus wird am Mittelrhein zwischen Mainz und St. Goar ‑
  darum ging es auch im vergangenen Sommer auf der Sommerpressereise ‑ die Engpassbeseitigung
  vorangetrieben. Sie befindet sich in fortgeschrittenen Planungs- und Genehmigungsphasen.
  Ich könnte jetzt noch mehr vorlesen, aber ich belasse es jetzt dabei. Sie sehen
  also, wie umfangreich wir diesbezüglich unterwegs sind. Natürlich schauen wir uns
  auch an, was wir da aktuell machen können. Wie gesagt, am Donnerstag wird der neue
  Minister vor Ort und aktiv sein. Was erwarten Sie denn, was am Donnerstag über das
  hinaus, was Sie gerade vorgetragen haben, konkret herauskommt? Ich habe hier jetzt
  keine Erwartungen vorzutragen. Wie gesagt, wir haben sehr weit gefächerte Unterstützungsmaßnahmen
  vorgesehen. Ich könnte Ihnen jetzt noch vier Seiten aus dem Aktionsprogramm „Niedrigwasser
  Rhein“ vorlesen, aber das will ich Ihnen einmal ersparen. Extreme Niedrigwasserstände
  und Wetterereignisse sind ja Naturereignisse. Insoweit kann ich Ihnen jetzt nicht
  sagen, was man macht, wenn der Rheinpegel ‑ ich glaube, er lag jetzt bei 68 Zentimetern ‑
  noch niedriger ist. Wenn irgendwann kein Wasser mehr im Rhein ist, dann sind wir
  natürlich alle mit unserem Latein am Ende, und dann nützt auch die beste Unterstützungsmaßnahme
  nichts mehr. Aber wie gesagt, es gibt jetzt noch einmal ein Gespräch, und dabei
  wird sich zeigen, welche weiteren Ideen, Vorschläge und Forderungen eingebracht
  werden. Diese werden dann bewertet, und dann werden wir sicherlich auch noch einmal
  schauen, was man machen kann ‑ so wie wir das auch in den zurückliegenden Jahren,
  wie beschrieben, sehr umfangreich getan haben. Können Sie schon sagen, wie der Minister
  zu dem Vorschlag einer nationalen Taskforce steht? Das werden wir noch bewerten.
  Jetzt nimmt er erst einmal an dieser Konferenz teil, zu der er auch die Initiative
  ergriffen hat. Die Forderungen haben wir gelesen, und ich denke, die werden auch
  am Donnerstag eine Rolle spielen. Dann werden wir schauen, wie es weitergeht. An
  das BMVg: Ist das Niedrigwasser ein Problem für die Bundeswehr? Auch wir beobachten
  das natürlich und nehmen die zugespitzte Lage zur Kenntnis. Aktuell kann ich hier
  keine Einschränkungen in unserem Geschäftsbereich bekanntgeben. Ganz grundsätzlich
  gilt natürlich auch, dass wir für den Fall, dass eine Amtshilfe in Betracht kommen
  könnte, im Austausch stehen. Sie wissen aber, dass diese Amtshilfe immer subsidiär
  wäre, sodass wir da erst ein entsprechendes Amtshilfeersuchen bräuchten. Ein solches
  Ersuchen gibt es aktuell nicht. Wir beobachten die Lage aber und stehen hierzu im
  Austausch, auch was unsere Fähigkeiten betrifft. Ein bisschen erweitert an das BMWE:
  Das Niedrigwasser hat ja auch immer Folgen für die Energieversorgung. In Frankreich
  mussten erste Atomkraftwerke wegen der nicht mehr vorhandenen Kühlung schon abgeschaltet
  werden. Wie sehen Sie das? Bereiten Sie sich da vor? In den vergangenen Jahren gab
  es in Frankreich schon einen erheblichen Importbedarf für Strom, insbesondere aus
  Deutschland. Sind die Grenzkuppelstellen dafür ausgerichtet? Haben Sie schon Berechnungen
  angestellt, mit was für einem Bedarf in den nächsten Wochen zu rechnen ist, und
  sind Sie dazu mit Frankreich in Kontakt? Vielen Dank. ‑ Zu konkreten Kontakten oder
  Berechnungen kann ich hier jetzt nichts mitteilen. Grundsätzlich ist es aber so,
  wie das BMVg gerade schon ausgeführt hat, dass auch wir die Lage genau beobachten
  und dazu mit allen Beteiligten im Kontakt stehen. Das BMV hat gerade schon die Umrüstung
  auf Schiffe, die bei niedrigeren Wasserständen dennoch fahren können, angesprochen.
  Dies sowie eine bessere Vorratshaltung bei den Kohlekraftwerken am Rhein führen
  dazu, dass wir derzeit keine Versorgungsengpässe infolge des Niedrigwasserstandes
  erwarten. Was den Export von Strom nach Frankreich betrifft, kann ich gerne nachfragen,
  ob ich dazu noch etwas Konkretes nachreichen kann. Gibt es Erkenntnisse, wie sich
  das Niedrigwasser auch auf Gaskraftwerke und deren Betrieb auswirken könnte, bzw.
  gibt es solche Auswirkungen bereits? Könnten Sie das eventuell nachreichen? Das
  wäre super. Ich habe noch ein weiteres Thema: Der Umweltstaatssekretär Jochen Flasbarth
  hat gefordert, für das kommende Jahr einen bundesweiten Hitzeaktionsplan zu erstellen.
  Wie steht die Bundesregierung dazu, jenseits der Auffassung des Bundesumweltministeriums?
  Sie haben jetzt ganz direkt den stellvertretenden Regierungssprecher gefragt, aber
  ich kann an dieser Stelle noch einmal darauf hinweisen, dass mein Kollege hier schon
  Ende Juni ‑ das Thema Hitze begleitet uns ja schon eine ganze Weile ‑ einen möglichen
  nationalen Hitzeaktionsplan hier angesprochen hat. Wir prüfen genau die Möglichkeiten,
  inwiefern wir von Bundesseite die Hitzeaktionspläne, die teilweise bei den Kommunen,
  teilweise bei den Städten schon vorliegen, bundesweit unterstützen können. Hitzeschutz
  und Klimaanpassungen sind aufgrund der föderalen Struktur Aufgaben der Länder und
  Kommunen. Gleichwohl sehen wir als Bund die Dringlichkeit und schauen, wie wir unterstützen
  können. In diesem Zusammenhang ist auch die Äußerung von Umweltstaatssekretär Flasbarth
  von gestern zu verstehen: Wir sehen die Dringlichkeit, dass etwas getan werden muss,
  und prüfen im Bundesumweltministerium, wie wir da weiter unterstützen können. Im
  Moment unterstützen wir bei der Klimaanpassung bereits viele Kommunen mit sogenannten
  Modellprojekten. Das ist das, was wir angesichts der föderalen Struktur tun können.
  Mich würde trotzdem interessieren, wie die Bundesregierung dazu steht. Es gab jetzt
  einzelne Vorstöße des Bundesumweltministeriums, aber in den vielen Wochen der Hitze ‑
  und es werden ja noch einige kommen; wir sind ja mittendrin im Sommer ‑ habe ich
  dazu insgesamt wenig von der Bundesregierung gehört. Das verstehe ich nicht ganz;
  denn wir alle, die wir hier sitzen, sind ja die Bundesregierung. Ich habe noch die
  Aussage im Ohr, es würde die Temperatur nicht ändern, wenn man dies zur Chefsache
  machte. Das ist im Wesentlichen das, was ich bislang vom Bundeskanzler dazu gehört
  habe. Insofern würde mich interessieren, wie der Bundeskanzler dazu steht, dieses
  Thema ein bisschen stärker und konzertierter national in die Hand zu nehmen. Dann
  haben Sie dem Bundeskanzler bei der Sommerpressekonferenz vielleicht nicht ganz
  richtig zugehört; denn da hat er ja ein paar Sätze zu diesem Thema gesagt. Er hat
  vor allen Dingen darauf hingewiesen, was für ein großes Thema das ist, hat aber
  auch darauf verwiesen ‑ das hat die Kollegin gerade auch getan ‑, dass wir in Deutschland
  durchaus eine Staatsstruktur mit Kommunen, Ländern und dem Bund haben, die ganz
  zu Recht Aufgaben auf entsprechenden Ebenen sieht. Im Sinne des Subsidiaritätsprinzips
  liegen diese Themen in erster Linie bei den Kommunen und den Ländern; der Bund übernimmt
  eine ergänzende Rolle. In diesem Sinne verstehe ich den Vorschlag für einen nationalen
  Hitzeplan. Deswegen hat Staatssekretär Flasbarth gestern Abend ausgeführt, dass
  es darum geht, dort koordinierend zu unterstützen, wo es nötig ist. Es ist ja völlig
  klar, dass wir die Lage bei so einem großen, wichtigen Thema genau im Blick haben.
  Wir wollen die Dinge aber eben auch da bearbeitet lassen, wo sie hingehören. Die
  ersten Ansprechpartner sind da in unserem Staatsaufbau die Länder und Kommunen,
  und das ist nicht nur zufällig so, sondern das ist sinnvollerweise so ‑ Stichwort
  Subsidiarität. Die Probleme werden da gelöst, wo sie am besten gelöst werden können;
  und wenn Bedarf besteht, übernimmt der Bund eine koordinierende Rolle. Wir kommen
  vom Sommer zum Winter; denn ich habe eine Frage an das BMWE zum Thema Gas. Die Ministerin
  hatte sich mit Blick auf eine staatliche Gasreserve lange skeptisch gezeigt. Jetzt
  gibt es neue Ideen dazu. Ich möchte da nur zwei Sachen verstehen: Erstens. Ist es
  korrekt, dass die aktuellen Pläne für den kommenden Winter keinen Unterschied machen
  würden? Zweitens. Wir sehen derzeit auch, dass die Gas-Futures für den Winter teilweise
  unter den Preisen liegen, die wir aktuell haben, oder auf einem ähnlichen Niveau
  sind. Es gibt aktuell also kaum einen Anreiz einzuspeichern. Sind Sie angesichts
  dessen besorgt, was den kommenden Winter betrifft? Da kann ich gerne noch ein bisschen
  Licht ins Dunkel bringen. ‑ Wir müssen ganz streng unterscheiden zwischen der regulären
  Wintervorsorge, die weiterhin im Markt erfolge soll, und einer Krisenvorsorge, bei
  der ein Teil der Speicherkapazitäten staatlich für externe Schocks infolge unvorhergesehener
  Ereignisse, die ja aus verschiedenen Richtungen immer möglich sind, vorgehalten
  wird. An der Wintervorsorge soll also weiterhin nichts geändert werden; das ist
  Aufgabe der Speicherbetreiber und der Energieversorgungsunternehmen, und daran halten
  wir ganz klar fest. Gleichzeitig bereiten wir aber ein Instrument vor, das für externe
  Schocks einen Teil der Speicherkapazitäten staatlich bereitstellt. Dieses Instrument
  wird derzeit vorbereitet und in der Regierung abgestimmt, und würde dann mit einer
  ersten Befüllung im nächsten Jahr starten. Für diesen Winter wird es also noch keine
  Auswirkungen haben. Dieses Instrument ist aber auch gar nicht spezifisch auf den
  Winter zugeschnitten, sondern auf jeden externen Energieversorgungsschock. Vielleicht
  kann ich an dieser Stelle auch noch etwas zu den Gaskraftwerken und dem Niedrigwasser
  ergänzen: Nach unserem Kenntnisstand findet derzeit keine Drosselung von Kraftwerken
  aufgrund der Hitze oder des Niedrigwassers statt. Es ist aber auch so, dass jetzt
  im Sommer der Bedarf an Energie aus Gaskraftwerken dadurch, dass nicht geheizt und
  weniger beleuchtet werden muss und zurzeit viel Sonnenenergie zur Verfügung steht,
  niedrig ausfällt. Angesichts der derzeitigen Debatte um die „Rente mit 63“ würde
  mich der aktuelle Stand des Gesetzgebungsvorhabens zur Rentenreform interessieren.
  Läuft schon eine Ressortabstimmung, oder wann geht es los? Der Zeitplan war ja sehr
  ambitioniert; denn der Kanzler hat das Ziel ausgerufen, die Reform solle bis zum
  Jahresende stehen. Wahrscheinlich geht die Frage an das BMAS: Wo ist man da gerade?
  Gibt es schon einen angestrebten Kabinettstermin? Vielleicht können Sie einmal ein
  Update geben. Das BMAS arbeitet gerade an dem von Ihnen angesprochenen Gesetzentwurf
  zur Rente. Er ist noch nicht in der Ressortabstimmung. Ich kann Ihnen heute auch
  noch keinen Kabinettstermin nennen. Wissen Sie schon, wann die Ressortabstimmung
  losgeht? Das kann ich Ihnen nicht sagen. Wir arbeiten trotz der Sommerpause mit
  Hochdruck an dem Entwurf, und sobald wir dazu mehr mitteilen können, machen wir
  das gerne. An das Innenministerium: Ich gehe davon aus, dass der Minister an der
  morgigen Sondersitzung des Innenausschusses teilnimmt. Die Sitzung ist meines Wissens
  digital geplant. Können Sie sagen, wer noch dabei ist? Ist etwa eine Beteiligung
  von Verfassungsschutz und BKA vorgesehen? Wie sollen die Vorschläge des Ministers
  konkret umgesetzt werden? Gibt es dazu schon eine Runde mit den Ländern? Welche
  weiteren Schritte ergeben sich als Konsequenz aus dem Anschlag in Berlin? Es ist
  korrekt, der Minister wird an der morgigen Sondersitzung teilnehmen. Es gibt in
  der Bundesregierung selbstverständlich Gespräche und Abstimmungen zu den Vorschlägen
  des Ministers und der Bundesregierung an sich. Das ist der aktuelle Stand. Gibt
  es da eine Bund-Länder-Runde? Einige Dinge wie zum Beispiel Fußfesseln und die einheitliche
  Regelung für die sogenannte Präventivhaft müssen ja mit den Ländern abgestimmt werden.
  Wartet man dafür die nächste Innenministerkonferenz ab, die ja noch ein bisschen
  hin ist, oder wird das jetzt vorangetrieben? Ja, Sie können davon ausgehen, dass
  die notwendigen Gespräche, die für solche Abstimmungen notwendig sind, stattfinden.
  Herr Hille, wie lange wird denn der Bundeskanzler noch im Urlaub sein? Darüber haben
  wir hier, glaube ich, auch immer wieder gesprochen: Ein Bundeskanzler, auch wenn
  er einmal ein paar Tage auszuspannen versucht, ist natürlich immer im Dienst. Der
  Bundeskanzler handhabt das ganz genauso. Er ist jederzeit erreichbar und verfügbar.
  Von daher kann man auch sozusagen keinen Endpunkt nennen, ab dem diese Zeit vorbei
  ist. Im Moment versucht der Bundeskanzler, ein paar Tage auszuspannen, aber geht
  den notwendigen Amtsgeschäften natürlich auch in dieser Zeit nach. Können Sie denn
  sagen, wo der Kanzler auszuspannen versucht? Befindet er sich in Deutschland oder
  woanders? Ich verstehe Ihr Interesse, aber es wird Sie nicht überraschen, dass ich
  da aus ganz unterschiedlichen Gründen nicht weiter ins Detail gehe. Ich habe eine
  Frage, wahrscheinlich an das Innenministerium oder auch an das Finanzministerium.
  Es geht um den Fall Liechtenstein , wo ja offenbar mehrere 10 000 Datensätze entwendet
  wurden. Auch Berechtigte für Stiftungen etc. sollen sich in erster Linie dahinter
  verbergen. Gibt es da eigentlich eine Kooperation mit den Liechtensteiner Behörden?
  Weiß man, inwieweit deutsche Staatsbürger betroffen sind? Gibt es eigentlich ‑ das
  könnte ja auch in Deutschland auftauchen ‑ ein Erpresserschreiben? Ist den Justizbehörden
  davon etwas bekannt? Den Cyberangriff in Liechtenstein, den Sie gerade genannt haben,
  nehmen wir natürlich sehr ernst. Wir stehen auch in regelmäßigem Kontakt und Austausch
  mit den Kolleginnen und Kollegen in Liechtenstein. Zur Stunde, also aktuell, gibt
  es noch keine Hinweise auf eine Betroffenheit mit Bezug nach Deutschland. Aber ich
  betone hier, dass das der aktuelle Stand ist. Das könnte sich potenziell noch ändern.
  Heißt das, dass keine deutschen Staatsbürger betroffen sind, oder was meinen Sie
  mit dem Bezug zu Deutschland? Ich möchte mich heute gerne von Ihnen verabschieden
  . Wir hatten am vergangenen Mittwoch im Bundesverkehrsministerium einen sehr würdevollen
  Amtswechsel von Patrick Schnieder zu Steffen Bilger, und damit endet auch meine
  Zeit als Sprecher des nun ehemaligen Bundesverkehrsministers. Ich werde noch meinen
  Nachfolger einarbeiten, dessen Namen wir später kommunizieren werden, und dann aus
  dem BMV ausscheiden. Das war eine spannende Zeit. An dieser Stelle bzw. ein Stockwerk
  höher haben wir als ersten großen Aufschlag vor der Bundespressekonferenz am 22. September
  vergangenen Jahres die Bahnagenda für zufriedene Kunden auf der Schiene vorgelegt
  und die neue Bahnchefin Palla vorgestellt, die der Bundesverkehrsminister in einem
  Auswahlprozess ausgewählt hatte und die bis heute von allen Seiten viel Lob bekommt.
  Es sind Milliarden verbaut worden. Bei der Bahn befinden wir uns im Sanierungsjahrzehnt.
  Es gibt das Deutschlandticket bis 2030, die Sicherheit und der Führerschein werden
  reformiert und vieles mehr. Aber es ist das gute Recht von Ihnen und natürlich auch
  vom Bundeskanzler, das alles anders zu sehen, und immer, wenn ich mich über einen
  Kommentar geärgert habe und schon fast zum Hörer greifen wollte, dachte ich: Stopp!
  Das fandest du doch früher als Journalist immer ein bisschen daneben. - Gleich der
  zweite Gedanke war: Oh, ich bin ja schon richtig gut im neuen Sprecheramt angekommen!
  Ich war ja Jahrzehnte auf der anderen Seite als SWR- und früher SWF-Journalist und
  hier zum ersten Mal 1999 unterwegs, als das Parlament von Bonn nach Berlin umzog,
  im ARD-Hauptstadtstudio unter dem famosen Ulrich Deppendorf. Manche kennen ihn vielleicht
  noch. In Mainz war ich sieben Jahre Vorsitzender der Landespressekonferenz. Als
  ich dann beim SWR 2025 am Aschermittwoch ausgeschieden war, kam das Angebot von
  Patrick Schnieder, und ich kann jedem nur empfehlen, die Politik von der anderen
  Seite kennenzulernen. Allein die zurückliegenden Wochen waren der reinste Politkrimi
  mit sicherlich sehr wertvollen und seltenen Einschätzungen. Nicht immer so spannend
  waren die Regierungspressekonferenzen, außer dieser heute natürlich. Es gab oft
  endlos erscheinende Fragen von einigen wenigen, die eher Meinungsbeiträge waren,
  in denen das Erkenntnisinteresse mitunter schwer zu erkennen war. Mitunter ging
  es auch nur darum, hinterher die Sprecherinnen und Sprecher durch den Kakao ziehen
  zu können. Wie gesagt, das ist eine Minderheit, die aber die Bundespressekonferenz
  als Ganzes in meinen Augen etwas schwächt. Bei alledem und auch, wenn die Strahlkraft
  dieser Institution vielleicht ein bisschen nachgelassen hat, ist sie eine sinnvolle
  und tolle Einrichtung. Aber ich wünsche der BPK ‑ so viel zum Abschied ‑ mehr Experimentierfreude,
  etwa neue Formate. Einmal die Woche würde es zum Beispiel auch ausreichen, dass
  nur der Regierungssprecher oder ausgewählte Sprecherinnen und Sprecher hinsichtlich
  ausgewählter Themen kommen. Mein Respekt jedenfalls auch für meine Sprecherkolleginnen
  und Sprecherkollegen, die hier unter hoher Arbeitsbelastung Rede und Antwort stehen,
  und natürlich Respekt und Dank an Sie, liebe Medienvertreterinnen und Medienvertreter,
  manche natürlich auch Befreundete aus der aktiven journalistischen Zeit! Das waren
  immer sehr spannende Gespräche, und das gilt auch für die Fragen von Ihnen. Aber
  ab jetzt beantworte ich zumindest offiziell von hier oben keine mehr. Vielen Dank!
  Vielen Dank, Herr Link. Ich wünsche Ihnen alles Gute für das, was immer jetzt für
  Sie kommt. Vielleicht geht es ja wieder auf die andere Seite. Wer weiß, wie die
  Dinge sich sozusagen entwickeln, wenn Sie beide Seiten kennengelernt haben? Vielen
  Dank, dass Sie uns hier Rede und Antwort gestanden haben. Der Minderheitenschutz
  wird eben manchmal größer geschrieben, als man es vielleicht auch gerne hätte, auch
  in der Mitgliedschaft, in der sehr großen Mitgliedschaft der Bundespressekonferenz.
  Ich glaube, wir sind schon experimentierfreudig. Ich mache das ja jetzt hier auch
  schon ein paar Jahrzehnte, kann man sogar sagen. Aber heute wäre es schon einmal
  richtig schiefgegangen, wenn nur der Regierungssprecher da gewesen wäre. Dann hätten
  wir nämlich nichts vom Umweltministerium gehört, und das sind natürlich auch immer
  so Beweggründe, die dann eine Rolle spielen, warum es wunderbar ist, wenn möglichst
  viele Auskunftsgebende für uns zur Verfügung stehen, was wir natürlich auch sehr
  zu schätzen wissen. In der einen oder anderen Art werden sich unsere Wege sicherlich
  wieder kreuzen. Alles Gute und vielen Dank noch einmal Ihnen. Danke schön.'
