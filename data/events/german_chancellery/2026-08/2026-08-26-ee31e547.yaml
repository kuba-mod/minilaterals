title: Im Kabinett beschlossen Maßnahmen gegen Hitze und Dürre geplant
text: Die Bundesregierung geht die Auswirkungen von Extremwetter und Klimawandel gezielt
  und koordiniert an. Wie mit den Folgen von Extremwetterereignissen umgegangen werden
  soll, dazu hat die Bundesregierung im Zuge einer Aussprache während der Kabinettssitzung
  diskutiert. Hintergrund ist, dass auch der Sommer 2026 von starker Trockenheit geprägt
  ist. „Wir müssen den Klimawandel weiter eindämmen und zugleich unser Land besser
  an die Folgen des Klimawandels anpassen“, sagte Bundeskanzler Friedrich Merz in
  seinem Auftakt statement zur Kabinettsklausur. Es gehe darum, „vor allem die langfristigen
  Lehren aus Extremsituationen wie diesem Hitzesommer zu ziehen“. Vieles läuft in
  den Zuständigkeiten der Kommunen und der Länder zu Umweltmaßnahmen sehr gut. Davon
  überzeugte sich der Bundeskanzler zuletzt bei seinem Besuch nach dem Waldbrand im
  Hürtgenwald . Zugleich plant die Bundesregierung auch mit Blick auf die künftigen
  Herausforderungen, die Zusammenarbeit und die Abstimmung zum Thema mit den Ländern
  zu intensivieren. 14.000 hitzebedingte Sterbefälle, herbe Ernte- und Produktionsausfälle
  sind im Sommer 2026 zu verzeichnen. „Sie führen uns vor Augen, dass konkreter Handlungsbedarf
  besteht“, sagte der Kanzler in seinem Auftaktstatement zur Kabinettsklausur und
  betonte, „Gesundheit, Krankenhäuser, Altenheime, die Landwirtschaft – es gibt kaum
  einen Lebensbereich, der nicht betroffen ist“. Für ein strukturiertes Handeln hat
  sich die Bundesregierung über den Umgang mit Auswirkungen von Extremwetterereignissen
  und dem Klimawandel in ihrer Kabinettssitzung deswegen ausgetauscht und weitere
  Schritte besprochen.
