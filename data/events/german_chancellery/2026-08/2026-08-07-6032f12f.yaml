title: Beratung des Nationalen Sicherheitsrates am 7. August 2026
text: Der Nationale Sicherheitsrat ist heute unter dem Vorsitz des Bundeskanzlers
  telefonisch zusammengetreten und hat sich zu dem Ereignis am Flughafen Leipzig/Halle
  am 4. August 2026 ausgetauscht. Der Bundeskanzler steht dazu in fortwährendem Austausch
  mit Bundesminister Dobrindt und anderen Mitgliedern der Bundesregierung.
