title: Im Kabinett beschlossen Startkapital für private Altersvorsorge
text: 'Der lange Zeithorizont ist entscheidend: Mit der Frühstartrente können bereits
  mit geringen regelmäßigen Beiträgen Vermögenswerte angespart werden. Die Bundesregierung
  geht umfassende Reformen an für eine gute Versorgung im Alter. Innovative Wege und
  ein neuer Blick auf die Renditechancen des Kapitalmarkts helfen dabei. Mit dem Gesetzentwurf
  zur Einführung der Frühstartrente verfolgt die Bundesregierung das Ziel, junge Menschen
  schon früh mit einem Startkapital für ihre private Altersvorsorge auszustatten,
  positive Erfahrungen bei der Geldanlage zu ermöglichen und die Finanzkompetenz zu
  stärken. Kinder sollen zwischen ihrem 6. und 18. Lebensjahr eine staatliche Zahlung
  von monatlich zehn Euro für ein individuelles, kapitalgedecktes, privatwirtschaftlich
  organisiertes Altersvorsorgedepot erhalten – beginnend mit dem Geburtsjahrgang 2020.
  Eltern können das individuelle Depot bei einem Anbieter der reformierten privaten
  Altersvorsorge eröffnen und freiwillig mit einer privaten Zuzahlung aufstocken.
  Der staatliche Zuschuss erfolgt dann automatisch und ohne weiteren Antrag über den
  Anbieter. Die individuellen Depots werden an die neuen Angebote der privaten Altersvorsorge
  anknüpfen. So erleichtert die Bundesregierung jungen Erwachsenen den Einstieg in
  die eigenverantwortliche zusätzliche Altersvorsorge – wer auf Basis der Erfahrung
  mit der Frühstartrente weiter das Altersvorsorgedepot bespart, kann so Vermögen
  für das Rentenalter aufbauen. Mit der Frühstartrente können bereits mit geringen
  regelmäßigen Beiträgen Vermögenswerte angespart werden. Entscheidend ist der lange
  Zeithorizont. Die langfristige Anlage am Kapitalmarkt und die Wiederanlage der Dividenden
  sorgen für einen erheblichen Zinseszinseffekt. Allein aus der staatlichen Förderung
  von insgesamt 1.440 Euro kann – unter der Annahme einer durchschnittlichen Wertsteigerung
  von nominal sieben Prozent pro Jahr – bis zur Volljährigkeit so ein Depotwert von
  rund 2.200 Euro entstehen. Daraus kann ohne einen einzigen weiteren Euro Einzahlung
  bis zum Renteneintritt ein Betrag von rund 53.000 Euro werden. Legen Eltern monatlich
  zum Beispiel 50 Euro dazu, kann das Depot bis zum Renteneintritt sogar auf über
  300.000 Euro anwachsen. Bis zum Beginn der Auszahlungsphase, also bis zum Renteneintritt,
  bleiben die Erträge steuerfrei. Auch Kinder und Jugendliche, deren Eltern kein Altersvorsorgedepot
  eröffnen, sollen profitieren. Für sie gibt es eine kollektive Anlage. So kommen
  allen die Möglichkeiten der kapitalmarktorientierten Vorsorge zugute. Die Frühstartrente
  erreicht alle Kinder eines Jahrgangs, unabhängig von der Initiative und den finanziellen
  Möglichkeiten der Eltern. Wird kein individueller Vorsorgevertrag geschlossen, legt
  der Bund die Mittel kollektiv am Kapitalmarkt an, verwaltet durch die Deutsche Bundesbank.
  Der Anspruch daraus kann bis zur Vollendung des 35. Lebensjahres als Startkapital
  in einen eigenen Altersvorsorgevertrag übertragen werden. Eine gute Versorgung im
  Alter ist ein Schwerpunkt der Reformanstrengungen der Bundesregierung. Für ein stabiles
  Rentensystem stärkt sie die gesetzliche Rente und die betriebliche sowie die private
  Altersvorsorge. Ein wichtiger Baustein ist die reformierte private Altersvorsorge
  . Ab Januar 2027 sollen die neuen Altersvorsorgeprodukte, vor allem die Möglichkeit
  eines chancenorientierten Vorsorgedepots, für Bürgerinnen und Bürger zur Verfügung
  stehen. Die Alterssicherungskommission hat zudem ihre Vorschläge für eine grundlegende
  Rentenreform vorgelegt, unter anderem für die Einführung einer verpflichtende kapitalgedeckten
  Renten-Komponente („gesetzliche Kapitalrente“). Die Regierungskoalition hat sich
  darauf geeinigt, die Empfehlungen in einem Gesetzespaket umzusetzen. Frühstartrente,
  die steuerlich geförderte private Altersvorsorge und die geplante gesetzliche Kapitalrente
  greifen sinnvoll ineinander.'
