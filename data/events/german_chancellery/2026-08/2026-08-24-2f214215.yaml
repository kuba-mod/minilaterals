title: Co-chair’s statement of the Coalition of the Willing, 24/08/2026
text: The leaders of the Coalition of the Willing convened today in Kyiv and by video
  conference to commemorate the 35th anniversary of the restoration of the Independence
  of Ukraine. They were united in their continued support of Ukraine’s fight to defend
  its sovereignty, freedom and territorial integrity. Prime Minister Andy Burnham,
  President Emmanuel Macron and Chancellor Friedrich Merz chaired the meeting alongside
  President Zelenskyy. The leaders condemned Russia’s systematic and escalating strikes
  against Ukraine’s cities, critical infrastructure and civilians, causing the highest
  number of civilian casualties since the beginning of the full scale invasion in
  2022, and damaging a children’s hospital in Kyiv the previous week. They also condemned
  Russia’s attacks on Ukraine’s cultural heritage sites, which form an integral part
  of Ukraine’s national identity, including the Kyiv-Pechersk Lavra. Leaders reiterated
  Ukraine’s clear and inherent right to defend itself against the Russian war of aggression,
  in full compliance with international law and Article 51 of the UN Charter, and
  confirmed that they would not be deterred from their support for Ukraine by irresponsible
  Russian threats. They expressed their determination to increase military support
  to Ukraine, strengthen its air defence as a matter of urgent priority, enhance cooperation
  with its defence industry, and share relevant technologies, including through the
  Anti-Ballistic Missile Coalition. They also committed to ratchet up sanctions on
  Russia’s military industrial complex and those supporting it. Leaders also agreed
  on the urgency of providing immediate assistance for Ukraine’s energy sector ahead
  of the upcoming winter, including through the Ukraine Energy Support Fund and provision
  of specialist equipment. They emphasised the need to continue to support Ukraine’s
  economic resilience in the face of Russia’s intensified attempts to renew their
  maritime blockade on Ukraine’s ports. The leaders agreed to continue efforts to
  constrain Russia’s war chest through the use of sanctions, wider economic measures,
  and clamping down on sanctions circumvention and Russia’s Shadow Fleet. This joint
  action to date has deprived Russia’s war chest of at least $495 billion since February
  2022. The leaders welcomed the US Senate’s efforts to apply further economic pressure
  on Russia, and committed to working closely with the US over the coming months on
  coordinated action to drain Russia’s means to continue its illegal war. The leaders
  commended President Zelenskyy’s continued readiness to enter into meaningful peace
  talks, in order to bring about a comprehensive, just and lasting peace, and reiterated
  their call for Russia to agree to a full, immediate and unconditional ceasefire
  starting from the line of contact. The Coalition would continue to prepare the Multinational-Force
  Ukraine to deploy once a credible cessation of hostilities was in place, as part
  of a wider set of robust politically and legally binding security guarantees to
  ensure Ukraine’s future security and prosperity once a ceasefire enters into force.
  Concluding, the leaders once again reaffirmed their commitment to support Ukraine’s
  independence, as part of Europe’s wider peace and security. They offered President
  Zelenskyy and the people of Ukraine their steadfast solidarity today on the 35th
  anniversary of the restoration of Independence, and every day, for as long as it
  takes. Erklärung der Ko-Vorsitzenden der Koalition der Willigen Höflichkeitsübersetzung
  Die Staats- und Regierungschefinnen und -chefs der Koalition der Willigen sind heute
  in Kyjiw und per Videokonferenz zusammengekommen, um den 35. Jahrestag der Wiederherstellung
  der Unabhängigkeit der Ukraine zu feiern. Sie waren sich einig in ihrer fortgesetzten
  Unterstützung der Ukraine in ihrem Kampf zur Verteidigung ihrer Souveränität, Freiheit
  und territorialen Unversehrtheit. Den Vorsitz des Treffens hatten neben Präsident
  Selenskyj Premierminister Andy Burnham, Präsident Emmanuel Macron und Bundeskanzler
  Friedrich Merz inne. Die Staats- und Regierungschefinnen und -chefs verurteilten
  die systematischen und eskalierenden Angriffe Russlands auf die Städte, die kritische
  Infrastruktur und die Zivilbevölkerung der Ukraine, die zu der höchsten Zahl an
  zivilen Opfern seit Beginn der groß angelegten Invasion 2022 geführt haben und bei
  denen letzte Woche ein Kinderkrankenhaus in Kyjiw beschädigt wurde. Sie verurteilten
  ferner Russlands Angriffe auf Stätten des kulturellen Erbes der Ukraine, die wesentlicher
  Bestandteil der nationalen Identität der Ukraine sind, darunter das Kyjiwer Höhlenkloster.
  Die Staats- und Regierungschefinnen und -chefs bestätigten nachdrücklich das klare
  und ureigene Recht der Ukraine, sich gegen den russischen Angriffskrieg zu verteidigen,
  was uneingeschränkt im Einklang mit dem Völkerrecht und Artikel 51 der Charta der
  Vereinten Nationen steht, und sie bekräftigten, dass sie sich durch unverantwortliche
  Drohungen seitens Russlands nicht von ihrer Unterstützung für die Ukraine abbringen
  lassen würden. Sie brachten ihre Entschlossenheit zum Ausdruck, die militärische
  Unterstützung für die Ukraine zu erhöhen, als besonders dringliche Aufgabe die Flugabwehr
  der Ukraine zu stärken, die Zusammenarbeit mit ihrer Rüstungsindustrie zu verbessern
  und einschlägige Technologien zu teilen, unter anderem durch die Koalition gegen
  ballistische Raketen. Sie verpflichteten sich ferner dazu, die Sanktionen gegen
  Russlands militärisch-industriellen Komplex und diejenigen, die ihn unterstützen,
  zu verstärken. Darüber hinaus waren sich die Staats- und Regierungschefinnen und
  -chefs über die Dringlichkeit einig, dem ukrainischen Energiesektor vor dem kommenden
  Winter Soforthilfe zukommen zu lassen, unter anderem durch den „Ukraine Energy Support
  Fund“ und die Bereitstellung von Spezialausrüstung. Angesichts der verstärkten Versuche
  Russlands, die ukrainischen Seehäfen erneut zu blockieren, betonten sie die Notwendigkeit,
  die wirtschaftliche Resilienz der Ukraine weiterhin zu unterstützen. Die Staats-
  und Regierungschefinnen und -chefs kamen überein, ihre Anstrengungen zur Begrenzung
  von Russlands Kriegskasse fortzuführen, und zwar durch Sanktionen, breit angelegte
  wirtschaftliche Maßnahmen und ein rigoroses Vorgehen gegen Umgehungen der Sanktionen
  sowie die russische Schattenflotte. Durch diese gemeinsamen Maßnahmen wurden Russlands
  Kriegskasse seit Februar 2022 bisher mindestens 495 Milliarden US-Dollar entzogen.
  Die Staats- und Regierungschefinnen und -chefs begrüßten die Bemühungen des US-Senats,
  weiter wirtschaftlichen Druck auf Russland auszuüben, und bekannten sich dazu, in
  den kommenden Monaten eng mit den Vereinigten Staaten zu abgestimmten Maßnahmen
  zusammenzuarbeiten, um dafür zu sorgen, dass Russland die Mittel für eine Fortführung
  seines illegalen Krieges ausgehen. Die Staats- und Regierungschefinnen und -chefs
  würdigten die anhaltende Bereitschaft Präsident Selenskyjs zu substanziellen Friedensgesprächen
  zur Herbeiführung eines umfassenden, gerechten und dauerhaften Friedens, und sie
  bekräftigten ihre Forderung an Russland, einem vollständigen, sofortigen und bedingungslosen
  Waffenstillstand ausgehend von der Kontaktlinie zuzustimmen. Die Koalition bereitet
  weiter den Einsatz der multinationalen Truppe für die Ukraine ab dem Zeitpunkt der
  glaubhaften Einstellung der Feindseligkeiten vor, was Bestandteil eines umfassenderen
  Pakets robuster politisch und rechtlich verbindlicher Sicherheitsgarantieren ist,
  mit dem Frieden und Wohlstand in der Ukraine zukünftig gewährleistet werden sollen
  und das mit Inkrafttreten eines Waffenstillstands greift. Abschließend bekräftigten
  die Staats- und Regierungschefinnen und -chefs erneut ihre Entschlossenheit, die
  Unabhängigkeit der Ukraine als Teil von Europas Frieden und Sicherheit insgesamt
  zu unterstützen. Sie sagten Präsident Selenskyj und dem ukrainischen Volk ihre unerschütterliche
  Solidarität zu – für heute, den 35. Jahrestag der Unabhängigkeit, und für jeden
  anderen Tag, so lange wie nötig.
