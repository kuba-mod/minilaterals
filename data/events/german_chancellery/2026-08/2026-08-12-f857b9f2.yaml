title: Im Kabinett beschlossen Nachrichtendienstrecht wird reformiert
text: Mit der Reform der Nachrichtendienste erhalten diese zeitgemäße Befugnisse,
  um die Bevölkerung gemäß ihrem Auftrag schützen zu können. Staatliche Souveränität
  und unser Gemeinwesen sind vermehrt mit Bedrohungen aus dem In- und Ausland, etwa
  durch Spionage, Sabotage oder hybride Angriffe, konfrontiert. Das Bundesamt für
  Verfassungsschutz und der Bundesnachrichtendienst benötigen daher zeitgemäße Befugnisse,
  um wirksam agieren zu können. Die Bundesregierung geht die Gesetzesreform auf drei
  Ebenen an, um ihrem Schutzauftrag gegenüber den Bürgerinnen und Bürgern gerecht
  zu werden – und hat eine Reform der Nachrichtendienste beschlossen. Die Aufklärungsbefugnisse
  der Nachrichtendienste werden an die Bedrohungen im Cyber raum angepasst und zukunftsfest
  ausgestaltet. Für die Datenauswertung wird die Nutzung von KI -Anwendungen geregelt,
  um effizienter Erkenntnisse gewinnen zu können, die für die Aufklärung von Bedrohungen
  erforderlich sind. Im Rahmen der strategischen Aufklärung soll der Bundesnachrichtendienst
  Telekommunikationsinhalte bis zu sechs Monate und Verkehrsdaten bis zu zwölf Monate
  speichern dürfen. Dazu zählen zum Beispiel IP -Adressen sowie Zeit und Dauer der
  Verbindungen. Dadurch kommt Deutschland wieder auf Augenhöhe mit seinen Partnern.
  Der Gesetzentwurf betrifft Neuregelungen für den Bundesnachrichtendienst ( BND )
  und das Bundesamt für Verfassungsschutz ( BfV ) . Der BND ist der Auslandsnachrichtendienst
  der Bundesrepublik Deutschland. Das BfV als Inlandsnachrichtendienst auf Bundesebene
  sammelt Informationen zu extremistischen und terroristischen Bestrebungen und schützt
  damit die freiheitliche demokratische Grundordnung. Mit dem Gesetzentwurf erhalten
  die Nachrichtendienste zudem die Befugnis zu aktiven Schutzmaßnahmen. Wenn sie Gefahren
  erkennen, die andere Stellen – etwa die Polizei – nicht gleichermaßen wirksam abwehren
  können, sollen die Nachrichtendienste künftig in engen Grenzen selbst eingreifen
  können. Das kann etwa das Abschalten eines ausländischen Servers sein, von dem aus
  ein Cyber angriff unmittelbar bevorsteht. Die Rechtskontrolle über die Tätigkeit
  der Nachrichtendienste wird gestärkt und effizienter ausgestaltet. Der Unabhängige
  Kontrollrat übernimmt die Aufgaben der G10 -Kommission und erhält die Zuständigkeit
  für alle Nachrichtendienste des Bundes. Damit soll die aktuelle Zersplitterung der
  Rechtskontrolle aufgehoben und eine stringente gerichtsähnliche Spruchpraxis ermöglicht
  werden. Besonders eingriffsintensive Einzelmaßnahmen der Nachrichtendienste soll
  der Unabhängige Kontrollrat vorab genehmigen. Dies schafft Handlungssicherheit für
  die Nachrichtendienste bei der Erfüllung ihres gesetzlichen Auftrags. Ferner bleibt
  eine demokratische Kontrolle der Nachrichtendienste sichergestellt. Denn durch die
  Reform bleiben die Vorschriften des Gesetzes über das Parlamentarische Kontrollgremium
  unberührt. Das Bundesverfassungsgericht hat in den letzten Jahren wesentliche Vorgaben
  zum Nachrichtendienstrecht aufgestellt. Der Gesetzgeber muss die Eingriffsvoraussetzungen
  der verschiedenen Überwachungsbefugnisse hinreichend bestimmt normieren. Darüber
  hinaus soll stärker berücksichtigt werden, dass Überwachungsmaßnahmen je nach Adressat
  unterschiedlich intensiv in Grundrechte eingreifen. Deshalb enthält der Gesetzentwurf
  der Bundesregierung eine deutlich klarer strukturierte Aufzählung der behördlichen
  Maßnahmen und ihrer Angemessenheitsanforderungen. Berufsgeheimnisse und der Kernbereich
  privater Lebensgestaltung werden verbessert geschützt, um die grundrechtlichen Garantien
  verlässlich abzusichern.
