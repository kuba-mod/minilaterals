title: „Gedächtnisstützen unserer Gesellschaft“ –Kulturstaatsminister Weimer stärkt
  Gedenkstätten mit zehn Millionen Euro zusätzlich
text: 'Kulturstaatsminister Wolfram Weimer stellt den Gedenkstätten zur Aufarbeitung
  des Nationalsozialismus und der SED-Diktatur im kommenden Jahr zusätzlich zehn Millionen
  Euro zur Verfügung. Davon entfallen fünf Millionen Euro auf Projektförderungen und
  weitere fünf Millionen Euro auf die institutionelle Stärkung der vom Bund geförderten
  Gedenkstätten. Damit setzt der Bund die im November 2025 beschlossene Gedenkstättenkonzeption
  um und trägt den wachsenden Herausforderungen der Gedenkstätten Rechnung. Kulturstaatsminister
  Wolfram Weimer erklärt dazu: „Gedenkstätten sind die Gedächtnisstützen unserer Gesellschaft.
  Sie bewahren die Erinnerung an die Verbrechen des Nationalsozialismus und der SED-Diktatur
  und machen unsere Geschichte erfahrbar. Gerade in einer Zeit, in der Desinformation
  und Geschichtsverfälschung zunehmen und die Stimmen der Zeitzeuginnen und Zeitzeugen
  verstummen, braucht unsere Erinnerungskultur starke Erinnerungsorte. Mit den zusätzlichen
  Mitteln setzen wir deshalb ein klares Zeichen: Der Bund steht verlässlich an der
  Seite der Gedenkstätten.“ Für Projektförderungen sieht der Regierungsentwurf zum
  Bundeskulturhaushalt 2027 fünf Millionen Euro zusätzlich zur Umsetzung der neuen
  Gedenkstättenkonzeption des Bundes vor. Damit stehen insgesamt zehn Millionen Euro
  für Vorhaben zur Aufarbeitung der nationalsozialistischen Verbrechen und des SED-Unrechts
  bereit. Gedenkstätten können voraussichtlich ab September Förderanträge stellen.
  Gefördert werden Projekte zum Erhalt der historischen Orte, zur Digitalisierung
  und digitalen Lebenswelt sowie zur Vermittlung und anwendungsbezogenen Forschung.
  Weitere fünf Millionen Euro erhalten die vom Bund geförderten Gedenkstätten insbesondere
  zum Ausgleich gestiegener Personalausgaben sowie zunehmender Bewachungskosten aufgrund
  der verschärften Bedrohungslage. Davon profitieren unter anderem die Stiftung Gedenkstätten
  Buchenwald und Mittelbau-Dora durch zusätzliche Mittel in Höhe von 842.000 Euro,
  die Bayerischen KZ-Gedenkstätten Dachau und Flossenbürg mit 497.000 Euro zusätzlich,
  die Gedenkstätte Topographie des Terrors mit 447.000 Euro sowie die Stiftung Sächsische
  Gedenkstätten mit 222.000 Euro. Die Gedenkstätten in Deutschland stehen heute vor
  erheblichen Herausforderungen. Neben dem Generationenwechsel, dem digitalen Wandel
  und der zunehmenden Verbreitung von Desinformation haben auch die physischen und
  digitalen Angriffe auf Gedenkstätten in den vergangenen Jahren deutlich zugenommen.
  Kulturstaatsminister Wolfram Weimer: „Angriffe auf Gedenkstätten sind Angriffe auf
  unsere Erinnerungskultur und auf die Grundlagen unserer Demokratie. Wer historische
  Fakten leugnet oder Erinnerungsorte angreift, relativiert unsere Geschichte und
  diffamiert die Opfer von Gewalt und Unterdrückung. Deshalb stärken wir die Gedenkstätten
  nicht nur in ihrer Bildungs- und Vermittlungsarbeit, sondern unterstützen sie auch
  dabei, ihre Beschäftigten, ihre Besucherinnen und Besucher sowie die historischen
  Orte selbst wirksam zu schützen.“ Der Regierungsentwurf zum Bundeshaushalt 2027
  steht unter dem Vorbehalt der weiteren Haushaltsaufstellung, insbesondere des parlamentarischen
  Haushaltsaufstellungsverfahrens.'
