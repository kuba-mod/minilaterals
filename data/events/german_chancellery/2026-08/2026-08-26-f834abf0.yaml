title: Im Kabinett beschlossen Eckpunkte für ein Wärmenetzpaket
text: 'Mit dem Umbau zu einem klimaneutralen Wärmemarkt dürfte der Anteil der Haushalte
  mit Nah- oder Fernwärme steigen. Die Bundesregierung will den klimafreundlichen
  Aus-, Um- und Neubau von Wärmenetzen erleichtern. Über Wärmenetze kann klimaneutrale
  Wärme etwa aus Geothermie, von Großwärmepumpen sowie aus Abwärme wirtschaftlich
  erschlossen werden. Fern- und Nahwärmenetze können vor allem in Stadtquartieren
  eine Option sein. Dort wo sie sich wirtschaftlich betreiben lassen oder wenn Wärmepumpen
  nicht geeignet sind. Aktuell beziehen rund 15 Prozent der Haushalte Nah- oder Fernwärme.
  Mit dem zunehmenden Umbau zu einem klimaneutralen Wärmemarkt dürfte dieser Anteil
  steigen. Versorgungsunternehmen sollen ihre Investitionen in Wärmenetze künftig
  durch angemessene Preisanpassungen angemessen refinanzieren können. Zugleich sollen
  Verbraucherrechte und Preistransparenz gestärkt werden. "Ein moderner und kohärenter
  Rechtsrahmen bedeutet verlässliche Bedingungen für Investitionen, damit stellen
  wir einen fairen Interessenausgleich zwischen Verbrauchern und Versorgern her, so
  Bundeswirtschaftsministerin Katherina Reiche. Auf der Basis der im Kabinett beschlossenen
  Eckpunkte erarbeitet das Bundesministerium für Wirtschaft und Energie zügig ein
  neues Wärmenetzgesetz. Die aktuellen Regelungen der Allgemeinen Bedingungen für
  die Versorgung mit Fernwärme (AVBFernwärmeV) und der Verordnung über die Verbrauchserfassung
  und Abrechnung bei der Versorgung mit Fernwärme oder Fernkälte (FFVAV) sollen novelliert
  und in einem neuen Wärmenetzgesetz zusammengeführt werden. Das Kabinett hat zunächst
  Eckpunkte für dieses Wärmenetzpaket beschlossen. Was ist bei Fernwärme zu beachten?
  Ausführliche Informationen finden Sie bei der Verbraucherzentrale . Auf Grundlage
  des Wärmeplanungsgesetzes werden derzeit in ganz Deutschland Wärmepläne erstellt.
  Rund zwei Drittel der rund 10.700 Städte und Gemeinden hat mit der Wärmeplanung
  begonnen oder diese bereits abgeschlossen (Stand: August 2026). Die vom Kabinett
  am 7. Mai 2026 beschlossene Novelle soll die Wärmeplanung für kleine Kommunen deutlich
  vereinfachen und zu beschleunigen. Seit dem 29. Juli 2026 gilt ein neues Gebäudemodernisierungsgesetz
  . Damit können Eigentümerinnen und Eigentümer selbst entscheiden, welche Heizung
  sie einbauen. Die Bundesregierung fördert weiterhin klimafreundliche Heizungen.'
