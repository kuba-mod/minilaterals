date: '2026-08-12'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 12. August 2026
text: 'Sprecherinnen und Sprecher •    stellvertretender Regierungssprecher Hille
  •    Koufen (BMZ) •    Dr. Rüll (BMF) •    Dr. Kock (BMI) •    Giese (AA) •    Haufe
  (BMUKN) •    Büddicker (BMV) •    Dr. Valdés Cifuentes (BMJV) •    Ungrad (BMWE)
  •    Hauck (BMLEH) •    Müller (BMVg) •    Teichmann (BMBFSFJ) (Vorsitzender Feldhoff
  eröffnet die Pressekonferenz und begrüßt SRS Hille sowie die Sprecherinnen und Sprecher
  der Ministerien.) Entwicklungsministerin Reem Alabali Radovan reist in der kommenden
  Woche mit einer Wirtschaftsdelegation nach Indonesien . Ein Schwerpunkt der Reise
  ist der Ausbau der Zusammenarbeit bei erneuerbaren Energien und einer sozialgerechten
  Energiewende. Als viertbevölkerungsreichtes Land der Welt und größte Volkswirtschaft
  Südostasiens ist Indonesien eines der neuen Fokusländer für die engere Einbindung
  der Privatwirtschaft. Das ist ein Schwerpunkt der Neuausrichtung der deutschen Entwicklungspolitik.
  Mit dem Aktionsplan Wirtschaft setzen wir unter anderem darauf, Unternehmen und
  Verbände bereits bei der Planung und später in der Umsetzung von Vorhaben stärker
  einzubinden, zum Beispiel durch Wirtschaftsdelegationen wie jetzt auf dieser Reise.
  Nach Indonesien nimmt die Ministerin Vertreterinnen und Vertreter von deutschen
  Unternehmen mit, die sich in Indonesien engagieren wollen oder ihre Präsenz dort
  weiter ausbauen werden, gerade im Energiesektor und im Bereich der erneuerbaren
  Energien. Deutsche Unternehmen bieten Spitzentechnologie und leisten einen wichtigen
  Beitrag zur nachhaltigen Entwicklung. Mit unserer Entwicklungspolitik machen wir
  das weltweit sichtbar, binden Unternehmen gezielt ein und fördern entsprechende
  Beteiligung an Entwicklungsprojekten. Ministerin Alabali Radovan wird mit der indonesischen
  Regierung und den Wirtschaftsvertreterinnen und -vertretern daran arbeiten, neue
  Partnerschaften auf den Weg zu bringen und deutschen Firmen den Einstieg in einen
  der dynamischsten Märkte Asiens zu erleichtern. Heute hat das Kabinett getagt. Es
  hatte tatsächlich eine sehr volle Tagesordnung und hat eine ganze Reihe wichtiger
  Beschlüsse gefasst. Ich habe Ihnen die vier wichtigsten mitgebracht, weil ich Sie
  nicht überstrapazieren möchte. Der erste Beschluss betrifft das Thema Altersvorsorge.
  Wir treiben den Umbau der Altersvorsorge weiter voran. Man kann sagen: hin zur Altersvorsorge
  von Anfang an. Wir wollen Kinder und Jugendliche unterstützen, frühzeitig Geld anzusparen
  und dabei von den Renditemöglichkeiten des Kapitalmarkts zu profitieren, mit dem
  Ziel, dass sie im Alter gut versorgt sind. Dafür hat das Kabinett heute den Gesetzentwurf
  zur Einführung der Frühstartrente beschlossen. Die Bundesregierung will damit jungen
  Menschen durch staatliche Zuschüsse ein Startkapital für die private Altersvorsorge
  geben und Finanzbildung von Anfang an stärken. Das Ganze funktioniert so: Kinder
  erhalten zwischen ihrem sechsten und 18. Lebensjahr eine staatliche Zahlung von
  monatlich zehn Euro in ein individuelles, kapitalgedecktes, privatwirtschaftlich
  organisiertes Altersvorsorgedepot. Eltern können das individuelle Depot bei einem
  Anbieter der reformierten privaten Altersvorsorge eröffnen, und sie können freiwillig
  private Zuzahlungen leisten und damit den Fonds aufstocken. Der staatliche Zuschuss
  erfolgt dann ohne weiteren Antrag über den Anbieter. Auch Kinder und Jugendliche,
  deren Eltern kein Altersvorsorgedepot eröffnen, profitieren. Für sie gibt es eine
  kollektive Anlagemöglichkeit. So können alle die Möglichkeit der kapitalmarktorientierten
  Vorsorge nutzen und davon profitieren. Die individuellen Depots werden an die neuen
  Angebote der privaten Altersvorsorge anknüpfen. So erleichtern wir jungen Erwachsenen
  den Einstieg in eigenverantwortliche zusätzliche Altersvorsorge. Die Bundesregierung
  geht umfassende Reformen an ‑ Sie wissen das ‑, um die gesetzliche Rente, die betriebliche
  Altersvorsorge und auch die private Altersvorsorge zu stärken. Ziel ist eine gute,
  bestmögliche Versorgung im Alter. Innovative Wege und ein neuer Fokus auf die Renditechancen
  des Kapitalmarkts sollen dabei helfen. Die Frühstartrente, die steuerlich geförderte
  private Altersvorsorge ab dem 1. Januar 2027 und die geplante gesetzliche Kapitalrente
  greifen an dieser Stelle sinnvoll ineinander. Dann habe ich eine gute Nachricht
  für Studierende, Schüler und Azubis im Gepäck, denn die Bundesregierung hat heute
  die BAföG-Reform beschlossen. Ziel ist es, jungen Menschen in Ausbildung und Studium
  eine verlässliche, moderne und bestmögliche staatliche Unterstützung zu bieten.
  Ich nenne Ihnen hier einmal die Schwerpunkte der Reform, ohne zu sehr ins Detail
  zu gehen. Die Wohnkostenpauschale soll ab dem Sommersemester 2027 von 380 auf 440 Euro
  monatlich erhöht werden. Das soll Studierende angesichts hoher Mieten entlasten,
  wie Sie sich denken können. Die BAföG-Bedarfsätze ‑ das ist die zweite Säule ‑ sollen
  zudem schrittweise steigen, um die Lebenshaltungskosten besser abzudecken, ab dem
  Wintersemester 2027/2028 von 475 auf 503 Euro und in einem zweiten Schritt im Sommersemester 2029
  noch einmal auf bis zu 563 Euro. Das entspricht dem aktuellen Grundsicherungsniveau.
  Bei Schülerinnen und Schülern und auch Azubis erfolgt eine entsprechende Anpassung.
  Zudem ‑ das ist die dritte Säule ‑ sollen die Freibeträge ab dem Schuljahr bzw.
  Wintersemester 2028/2029 jährlich um 1,5 Prozent steigen. Damit wollen wir den Kreis
  der Berechtigten erhalten. Neben den höheren Leistungen soll es aber auch einfacher
  werden, BAföG zu beantragen. Künftig soll die Antragstellung bundesweit einheitlich
  und vollständig digital abgewickelt werden. Außerdem sollen Regelungen wie beispielsweise
  der Leistungsnachweis ab dem fünften Semester, den es bisher noch gibt, entfallen.
  Mit all diesen Entscheidungen reduzieren wir Verwaltungsaufwand, beschleunigen die
  BAföG-Verfahren und engagieren uns weiter für einen konsequenten Bürokratieabbau.
  Dann habe ich zwei Beschlüsse im weiteren Sinne aus dem Bereich der Sicherheit dabei.
  Der erste Beschluss ist sogar im engeren Sinn aus dem Bereich der Sicherheit. Die
  Bundesregierung ‑ das haben Sie vielleicht auch schon beim Statement der Chefin
  des Bundeskanzleramtes und des Bundesinnenministers verfolgt ‑ will die Nachrichtendienste
  weiterentwickeln und hat dazu heute den Gesetzentwurf zur Reform des Nachrichtendienstrechts
  beschlossen und damit ein wichtiges Vorhaben aus dem Koalitionsvertrag umgesetzt.
  Leitmotiv des Entwurfs ist es, für die Menschen in Deutschland und ihre Freiheit
  ein höheres Maß an Sicherheit zu gewinnen. Zum Schutz der nationalen Souveränität
  werden die operativen Fähigkeiten der Nachrichtendienste gestärkt, auch mit dem
  Ziel, die Kompetenzen und Fähigkeiten unserer Nachrichtendienste an das Leistungsniveau
  unserer europäischen Partnerdienste anzupassen. Die Bundesregierung verfolgt mit
  dem Gesetzentwurf drei Ziele: In Anbetracht der verschärften Bedrohungslage im In-
  und Ausland sollen zunächst die Aufklärungsbefugnisse des Bundesamtes für Verfassungsschutz
  und des Bundesnachrichtendienstes gestärkt werden. Dies ist zwingend erforderlich,
  um den Schutz herausragender Rechtsgüter des Gemeinwohls ‑ so heißt es juristisch ‑
  zu gewährleisten, denen nachrichtendienstliche Bedrohungsaufklärung dient. Zentral
  dafür ist die Möglichkeit, künftig unter engen Voraussetzungen auch aktive Maßnahmen
  ergreifen und damit Schutzlücken schließen zu können. Zudem stärken wir ‑ das ist
  die zweite Säule ‑ die Möglichkeit, die erhobenen Daten schnell und zuverlässig
  auswerten zu können. Hierbei werden endlich auch moderne Technologien wie KI berücksichtigt.
  So bleiben die deutschen Dienste auch international anschlussfähig. Des Weiteren
  ‑ das ist der dritte Bereich ‑ soll die Rechtskontrolle über die Tätigkeit der Nachrichtendienste
  gestärkt und effizienter ausgestaltet werden. Dazu werden die Kontrollzuständigkeiten
  beim Unabhängigen Kontrollrat gebündelt. Unbenommen bleibt natürlich die parlamentarische
  Kontrolle der Geheimdienste durch das Parlamentarische Kontrollgremium im Deutschen
  Bundestag. Damit kommen wir zum vierten Beschluss, auch im weiteren Sinne aus dem
  Bereich Sicherheit, in diesem Fall Kriminalitätsbekämpfung. Die Bundesregierung
  will Organisierte Kriminalität noch intensiver und besser bekämpfen, konkret Finanzkriminalität,
  Geldwäsche, Drogenhandel, Banden- und Clanstrukturen, denn diese kriminellen Strukturen
  bedrohen die innere Sicherheit und schädigen nachhaltig das Vertrauen in den Staat.
  Das Kabinett hat dafür heute den Gesetzentwurf zur Stärkung der Zollverwaltung und
  Bekämpfung der Finanzkriminalität ‑ kurz: Zollfinanzgerechtigkeitsgesetz; ein, wie
  ich finde, besonders schöner Gesetzesname ‑, beschlossen. Mit diesem Paket bekommt
  der Zoll neue Befugnisse, um gegen Finanzkriminalität und Geldwäsche besser vorgehen
  zu können. Auch hier nur die wichtigsten Regelungen: Der Zoll soll Vermögensgegenstände
  künftig leichter beschlagnahmen können, wenn an deren rechtmäßiger Herkunft begründete
  Zweifel bestehen. Dies ermöglicht die gezielte Bekämpfung der Vermögensverschleierung.
  Außerdem sollen grenzüberschreitende digitale Überweisungswege über die Landesgrenzen
  hinweg besser kontrolliert und auch Kryptowerte sichergestellt werden können. Für
  den Kampf gegen internationale Geldwäsche wird die bestehende Financial Intelligence
  Unit ‑ kurz: FIU ‑ gestärkt. Auch der Datenaustausch innerhalb Deutschlands zwischen
  Bund und Ländern soll ausgebaut werden. Zudem erhält der Zoll die Rechtsgrundlage
  zur Nutzung moderner Technologien. Auch hierbei geht es um den Einsatz von KI, zum
  Beispiel zum Abgleich biometrischer Daten oder auch zum Einsatz von Drohnen. Zur
  effektiven Sanktionsdurchsetzung werden die Befugnisse der Generalzolldirektion
  zur Identitätsfeststellung, Durchsuchung und Datenanalyse erweitert, und es können
  eingefrorene Vermögenswerte transparent im „Bundesanzeiger“ bekannt gegeben werden.
  Wenn wir unter „Zollverwaltung“ die erweiterten Befugnisse fassen, dann sind wir
  ja schon fast bei den ND-Reformen. Trotzdem würde ich erst einmal beim Zoll bleiben.
  Ich würde gern wissen, wie genau das ineinandergreift. Denn die Zuständigkeiten
  des Zolls sind ja schon heute in bestimmten Bereichen sehr nah an dem, was das BKA
  oder andere Akteure dürfen. Wie ist das jetzt im Zusammenspiel mit den ND-Reformen
  gedacht? Ich kann für den Zoll selbst sprechen und sagen, dass ein wesentlicher
  Teil des Zollfinanzgerechtigkeitsgesetzes die Strukturreform Zoll 2030 ist, die
  vor allem darauf zielt, den Zoll selbst zu reformieren und anders aufzustellen,
  im Wesentlichen durch zwei Fachstränge, Zölle und Steuern auf der einen Seite sowie
  Sicherheit und Vollzug auf der anderen Seite, statt den bisherigen sechs Fachdirektionen.
  Das ist ein wesentlicher Teil, wie der Zoll als solcher umgebaut wird. Ansonsten
  wird er mit weiteren Befugnissen ausgestattet, die aber aus meiner Sicht der stellvertretende
  Regierungssprecher schon umfangreich erläutert hat. Für das Zusammenspiel würde
  ich vielleicht an das Innenministerium abgeben. Wie Sie wissen und es auch aus dem
  Aktionsplan gegen Organisierte Kriminalität kennen, gibt es verschiedene Bereiche,
  Phänomenbereiche, Kriminalitätsbereiche, in denen der Zoll sehr eng mit der Polizei
  zusammenarbeitet. Wenn ich mich richtig erinnere, gibt es zumindest in einzelnen
  Landesverfassungsschutzgesetzen auch entsprechende Befugnisse, zumindest was den
  Bereich der organisierten Kriminalität angeht. Sie können davon ausgehen, dass wir
  in allen Bereichen, bei denen es notwendig ist, eng kooperieren und uns auch entsprechend
  austauschen. In der Vergangenheit gab es immer ganz viel Knatsch rund um die Frage
  der Financial Intelligence Unit und wie sie faktisch agieren kann, um zum Beispiel
  Steuerstraftaten aufzudecken oder gegen Organisierte Kriminalität im Finanzbereich
  vorzugehen. Herr Rüll, was soll sich dort an dieser Stelle tun? Was soll die FIU
  in Zukunft dürfen? Oder ist es auch Teil der Organisationsreform, dass man sie in
  ihren Zuständigkeiten beschneidet? Eine Beschneidung ihrer Zuständigkeiten ist mir
  nicht bekannt. Ich kann Ihnen heute mitgeben, dass sie schlagkräftiger aufgestellt
  werden soll. Die Details müsste ich Ihnen nachreichen. Gerade im Kampf gegen Steuerkriminalität
  kann ich auch noch auf die Umsetzung des Aktionsplans gegen Steuerkriminalität verweisen,
  der vorsieht, die FIU zu stärken, aber auch vorsieht, ein gemeinsames Zentrum aus
  mehreren Behörden zu schaffen, die gemeinsam effektiv gegen Steuerkriminalität vorgehen
  werden. Das ist noch nicht Bestandteil des Zollfinanzgerechtigkeitsgesetzes, weil
  es dafür voraussichtlich keiner gesetzlichen Regelung bedarf, sondern schon auf
  operationaler Ebene erledigt werden kann. Ich habe eine Frage zu dem Gesetzesnamen.
  Was versteht die Bundesregierung in diesem Zusammenhang unter „Gerechtigkeit“? Warum
  heißt das Gesetz so? Ist Gerechtigkeit sozusagen ein eigenständiger Grund für zusätzliche
  staatliche Eingriffsbefugnisse? Da es ein Gesetz aus dem Bereich des BMF ist, würde
  ich an den Kollegen weitergeben. Das ist jetzt ein eher persönlich geprägtes Verständnis.
  Ich würde es so interpretieren, dass das Ziel des Gesetzes ist, mehr Gerechtigkeit
  durch die Stärkung der Zollverwaltung zu erzielen, weil das Einhalten von Regeln
  wesentlich dafür ist, zur Gerechtigkeit in unserem Gemeinwesen beizutragen und damit
  gegen diejenigen, die gegen diese Regeln verstoßen, vorzugehen. Wieso heißt es nicht
  einfach „Gesetz zur Bekämpfung von Finanzkriminalität“? Das entzieht sich heute
  meiner Kenntnis. Das kann ich Ihnen aber gern nachreichen. So heißt es auch. „Gesetz
  für mehr Gerechtigkeit durch die Stärkung der Zollverwaltung und die Bekämpfung
  der Finanzkriminalität“ ist der längere Name, wie er auf meinem Zettel steht. Kurz:
  Zollfinanzgerechtigkeitsgesetz. (zum Gesetzentwurf zur Reform des Nachrichtendienstrechts
  ) Ich habe eine Frage an das BMI zur Geheimdienstreform. Es geht ja in der aktuellen
  Debatte vor allem um hybride Angriffe. Wie wirkt sich die Reform auf die Beobachtung
  der AfD durch den Verfassungsschutz aus? Zu konkreten Einzelfällen und zur Arbeit
  der Nachrichtendienste ‑ dafür haben Sie sicherlich Verständnis ‑ kann ich mich
  nicht äußern, weder für das BfV noch würde Herr Hille das vermutlich für den Bundesnachrichtendienst
  tun. Das sind generelle Regelungen, die künftig gegen alle extremistischen Bestrebungen
  angewandt werden, die das Bundesamt für Verfassungsschutz beobachtet. Sollen die
  angekündigten aktiven Maßnahmen also eventuell auch gegen AfD-Politiker eingesetzt
  werden? Ich kann mich nur wiederholen: Es sind Regelungen, die für das Bundesamt
  für Verfassungsschutz gelten. Es sind neue Befugnisse, die das Bundesamt bekommt,
  die vor allen Dingen dazu dienen, auch Gefahren abwehren zu können, die konkret
  bevorstehen. Der Minister hat gerade eine Pressekonferenz gegeben. Wenn ich es richtig
  beobachtet habe, hat er auch Beispiele genannt, in welchen Fällen es möglich ist
  und was es dann genau bringt. Nur weil ich die Beispiele gerade auch noch recht
  präsent habe: Das heißt, Frau Weidel muss jetzt nicht davon ausgehen, dass Herr
  Dobrindt demnächst in ihrem smarten Kühlschrank sitzt? Ich kann mir nicht vorstellen,
  dass Herr Dobrindt in einem Kühlschrank sitzt. Das Bundesamt für Verfassungsschutz
  hat heute offiziell vor einer neuartigen ausländischen Desinformationskampagne unter
  dem Namen „Matrjoschka“ gewarnt. Haben Sie dazu noch ein paar Details? Nach meinem
  Kenntnisstand hat sich der Minister auch dazu gerade auf Nachfrage in der Pressekonferenz
  geäußert. In der Tat beobachtet das Bundesamt diese Kampagne. Das Bundesamt für
  Verfassungsschutz sieht verschiedene Formen der Einflussnahme und auch Verbreitung
  von Desinformationen und Falschinformationen. Damit ist die Projektgruppe ZEAM bei
  uns im Haus beschäftigt, an der auch andere Ressorts beteiligt sind. Das Gemeinsame
  Abwehrzentrum Hybrid setzt sich ebenfalls mit der Thematik auseinander. Wir beobachten
  momentan, dass diese Falschinformationen eher eine geringere Reichweite haben. Aber
  das Ziel einer Einflussnahme in Deutschland ist unserer Ansicht nach offensichtlich.
  Wir sehen diese Desinformationskampagne auch im Zusammenhang mit den bevorstehenden
  Landtagswahlen. Der Name lässt ja Rückschlüsse darauf zu, dass Sie schon eine klare
  Zuordnung haben, woher sie kommt. Sie können davon ausgehen, dass wir das, wenn
  wir eine klare, eindeutige Zuordnung haben, dann auch früher oder später offiziell
  kundtun. Die Matrjoschka-Kampagne als solche ist ja nicht neu, sondern es geht nur
  um eine neue Iteration der Matrjoschka-Kampagne, wenn ich es richtig verstanden
  habe. Unter anderem das Bayerische Landesamt für Verfassungsschutz hat ja schon
  vor Jahren davor gewarnt. Ist das aus Ihrer Sicht eine neue sogenannte Matrjoschka-Kampagne,
  oder ist es die gleiche, weitergeführte Matrjoschka-Kampagne? Das müsste ich nachreichen,
  um darauf ganz exakt zu antworten. Das Phänomen an sich ist nicht neu. Da haben
  Sie recht. Dazu aber vielleicht der Hinweis, dass wir schon in der vergangenen Woche
  darüber gesprochen haben, dass wir diese Art und Weise, nicht authentische Informationen
  über gefakte Webseiten, beispielsweise gefakte Wikipedia-Einträge etc., zu verbreiten,
  natürlich kennen. Das wird zusammenfassend auch unter „ Matrjoschka“ beschrieben.
  Wie gesagt, das war auch schon in der letzten Woche hier Thema. Allen, die sich
  im Detail dafür interessieren, würde ich raten, noch einmal in das Protokoll zu
  schauen. Das war hier ziemlich umfangreich Thema. Umweltminister Schneider hat nach
  der Kabinettssitzung heute mitgeteilt, dass er dort auch mögliche Grundgesetzänderungen
  thematisiert hat, die er für notwendig hält, dass die Gemeinschaftsaufgabe Klimaanpassung
  ins Grundgesetz geschrieben wird und dass er sich für die Umsetzung dieser Forderung
  jetzt im zweiten Halbjahr einsetzen will. Mich würde interessieren, wie der Rest
  des Kabinetts auf diesen Vorschlag reagiert hat und wie die Haltung der CDU-geführten
  Häuser zu diesem Vorschlag ist. Herr Kollege, ich würde einmal den Anfang machen.
  Ich war beim Statement des Bundesumweltministers nicht dabei, weil ich zur gleichen
  Zeit beim Statement zur Novelle des Nachrichtendienstrechts mit der Chefin des Bundeskanzleramts
  und dem Bundesinnenminister im Kanzleramt war. Von daher weiß ich nicht, was er
  dort gesagt hat. Dementsprechend fällt natürlich auch irgendeine Art von Einschätzung
  schwer. Es ist zutreffend, dass der Bundesumweltminister ‑ ohne jetzt zu detailliert
  zu werden, was wir ja bei Kabinettssitzungen nie tun ‑ zum Thema Trockenheit, Folgen
  aus Trockenheit und Wasserknappheit das Wort ergriffen hat und sich im Kabinett
  geäußert hat. Etwas genauer: War konkret die Grundgesetzänderung Thema? Gibt es
  dazu konkret für die Bundesregierung schon eine Haltung, ob man sie für notwendig
  hält, um eine Gemeinschaftsaufgabe Klimaanpassung einzuführen, damit der Bund sowohl
  Vorgaben machen als auch Geld zur Verfügung stellen darf, was im Moment wohl kaum
  möglich ist? Ich verstehe, dass Sie gern tiefer in das Innenleben einer Kabinettssitzung
  eintauchen würden. Sehen Sie es mir nach: Wir gehen dabei nie zu sehr ins Detail.
  Die Worte des Bundesumweltministers ‑ das kennen Sie von uns ‑ stehen für sich.
  Richtig ist, dass das Thema Klima, Klimaanpassung, Trockenheit, Folgen von Trockenheit
  und Niedrigwasser ein großes Thema ist, das wir hier auch schon mehrfach besprochen
  haben. Es wurde auch heute im Kabinett ausführlich von verschiedenen Perspektiven
  darüber gesprochen. Das ist ein Thema, das die Bundesregierung natürlich schon in
  der Vergangenheit intensiv begleitet hat und auch weiterhin begleitet und mit politischen
  Entscheidungen, Koordinierungen und dergleichen bestmöglich begleiten will. Die
  Forderung nach der Gemeinschaftsaufgabe war ja auch schon vor der Kabinettssitzung
  Thema, unter anderem durch Herrn Flasbarth. Hat der Kanzler eine Haltung zu der
  Frage? Das ist ja auch ein Prüfauftrag aus dem Koalitionsvertrag und kam nicht erst
  heute auf. Wie blickt das Verkehrsministerium darauf? Die Grundhaltung habe ich
  ja gerade versucht zu skizzieren. Das Thema Folgen des Klimawandels, Dürre, Niedrigwasser
  und alles, was damit noch zusammenhängt‑ man kann es ja gar nicht auf einen Begriff
  bringen ‑, ist natürlich ein wichtiges, großes Thema, um das sich Politik kümmern
  muss und um das sich die Bundesregierung in ganz unterschiedlichen Facetten qua
  Ressortzuständigkeit kümmert. Das ist überhaupt keine Frage. Wenn Sie wollen, besteht
  dort eine politische Gesamtverantwortung für das Thema. Ich würde jetzt nicht weiter
  einsteigen und zum jetzigen Zeitpunkt von hier aus Einzelvorschläge kommentieren
  oder einordnen. Bei Ihnen geht es ja darum, was man für den richtigen Weg hält,
  wie man Themen angeht. Aber wichtig ist, dass dieses Thema oben auf der Agenda steht.
  Das zeigt sich auch darin, dass es heute im Kabinett breiteren Raum eingenommen
  hat. Die Position des Ministers ist hier schon angerissen worden. Der Minister hat
  nach der Sitzung des Kabinetts noch einmal darauf hingewiesen, dass diese Gemeinschaftsaufgabe
  bereits im Koalitionsvertrag angelegt worden ist. Das ist auch gerade von der Kollegin
  genannt worden. Dementsprechend wird der Minister dieses Ziel, das dort bereits
  formuliert ist, jetzt verfolgen und dafür eben versuchen, die entsprechenden Mehrheiten
  zu gewinnen. Das ist ein Thema, das wir schon seit mehreren Wochen und Monaten im
  Angesicht der herausfordernden gesamten Lage und der sich nun deutlich abzeichnenden,
  andauernden klimatischen Veränderungen diskutieren. Der Minister hat noch einmal
  deutlich darauf hingewiesen: Es geht nicht um das Wetter und um Wetterphänomene,
  sondern um eine dauerhafte klimatische Veränderung, die wir jetzt besonders in Augenschein
  nehmen. Umso dringlicher hält er es, diese Gemeinschaftsaufgabe hinzubekommen, da
  ein konzertiertes, effektives Vorgehen in der Klimaanpassung zwischen Bund, Ländern
  und Gemeinden notwendig ist. Wir fangen dort nicht bei null an. Es gibt heute schon
  eine Menge Erfahrungen im Bereich Klimaanpassung, es gibt bereits eine Menge Klimaanpassungsmaßnahmen,
  und es ist sinnvoll, diese im ganzen Land entsprechend auch zu verankern. Ich kann
  mich dazu meinen Vorrednern nur anschließen. Es geht darum, dass das Ganze natürlich
  ganzheitlich betrachtet wird. Für unseren Aspekt aus verkehrlicher Sicht ist natürlich
  gerade das Niedrigwasser sehr stark im Fokus. Wir wollen dort auch die ökonomischen
  Aspekte mit in Einklang bringen. Ich will es doch noch einmal bei Herrn Hille versuchen.
  Sie haben ja nach dem Wort gesucht. Ich würde das Wort „Klimaanpassung“ vorschlagen.
  Das fasst es ganz gut zusammen. Ist es korrekt, dass es in zwei Wochen auf der Kabinettsklausur
  auch darum gehen wird, Klimaanpassung zur Gemeinschaftsaufgabe des Bundes zu machen?
  Das ist ja quasi das Thema von einer anderen Seite angeritten. Vielen Dank für die
  Begriffsfindung „Klimaanpassung“. Das Thema hat ja ganz viele Folgen. Wir haben
  gerade kurz über den Verkehr gesprochen. In der Landwirtschaft gibt es Folgen. Es
  sind nicht nur Klimaanpassungsfragen, sondern auch wirtschaftliche Fragen, zum Beispiel
  wie Logistik künftig funktionieren kann, wie Landwirtschaft künftig funktionieren
  kann und dergleichen. Aber sei es drum. Ich habe heute noch keine Ankündigung über
  die Tagesordnung der Kabinettsklausur zu machen. Aber ich bin mir sicher, dass Sie
  ‑ das Ganze findet ja in zwei Wochen statt ‑ ausreichend vorher Bescheid wissen,
  worum es auf der Kabinettsklausur gehen wird. Haben Sie zur Position des Bundeskanzlers
  eventuell eine Ankündigung zu machen? Ich dachte, ich hätte gerade versucht, zu
  erläutern, welche Bedeutung das Thema hat, aber auch, dass ich hier von dieser Stelle
  jetzt nicht einzelne konkrete Vorschläge kommentiere, wie man sich diesem Thema
  in Gänze oder in Teilen nähern kann und was man für den richtigen Angang hält. Das
  heißt nicht, dass das Thema keine Relevanz hat. Das Thema hat eine riesengroße Relevanz.
  Herr Hille, wir haben gerade gehört, die Gemeinschaftsaufgabe ist im Koalitionsvertrag
  angelegt. Fühlt sich der Bundeskanzler in diesem Punkt an den Koalitionsvertrag
  gebunden? Eine weitergehende Frage dazu: Der Hitzeschutz oder die Klimaanpassung
  sind sozusagen nur die Bewältigung von Folgen. Davor ist ja noch eine Ursache, der
  Klimawandel. Gibt es angesichts dieser plastischen Auswirkungen, die wir alle gerade
  spüren, irgendeinen Impuls in der Bundesregierung, den Klimaschutz ein bisschen
  weiter oben auf die Tagesordnung zu setzen und ihn zu einem wahrnehmbaren Schwerpunktthema
  zu machen? Gibt es dafür Maßnahmen, die Sie verstärkt ergreifen, oder buchen Sie
  das Ganze unter Wetterkapriolen ab? Erst einmal Kompliment für die Kreativität,
  mich jetzt zu einer Aussage zu bewegen, die heißt: Gemeinschaftsaufgabe, ja oder
  nein. Diese Antwort werde ich ‑ das ist nur schon einmal vorausgeschickt, falls
  Sie es noch aus anderen Richtungen probieren, was Sie gern tun können ‑ jetzt von
  dieser Stelle nicht geben. Frau Vates, das heißt nicht, dass ich mich geäußert habe,
  auch nicht gegenteilig. Ich habe nur gesagt, dass ich jetzt von dieser Stelle nicht
  einzelne Vorschläge wie den genannten einordnen und kommentieren werde. Das Thema
  hat große Relevanz. Sowohl das Thema Klimaanpassung ‑ wir haben gerade vereinbart,
  das unter diesem Begriff zu benennen ‑ als auch der Klimaschutz grundsätzlich ‑ Sie
  haben es angesprochen; der Klimaschutz ist die Grundlage ‑ haben für die Bundesregierung
  hohe Priorität. Die Bundesregierung hat zum Ziel, Klimaschutz zu betreiben und zugleich
  das zu gewährleisten, was dafür auch nötig ist, nämlich den Wohlstand zu erhalten
  und auszubauen. Damit wir ausreichend Möglichkeiten haben, beispielsweise in Technologien
  zu investieren, die wiederum dem Klimaschutz dienen, braucht es die nötigen Mittel.
  Es geht also nicht um ein Ausspielen von Klimaschutz gegen Wirtschaft bzw. Wirtschaft
  gegen Klimaschutz, sondern darum ‑ auch darüber haben wir hier schon verschiedentlich
  gesprochen ‑, beides in eine Balance zu bringen, in dem Wissen, dass beides nur
  zusammen funktionieren kann. Klimaschutz in einem Land wie Deutschland kann nicht
  funktionieren, wenn es uns wirtschaftlich nicht gut geht. Wirtschaft wiederum kann
  nicht funktionieren, wenn Klimaschutz keine Rolle spielt. Wir sehen ja, was das
  im Moment für Folgen haben kann. Verstehen Sie, auf was ich hinaus möchte? Das ist
  für die Bundesregierung oben auf der Agenda. Der Klimaschutz steht oben auf der
  Agenda, genauso wie der Erhalt und die Stärkung des Wirtschaftsstandorts Deutschland,
  weil ‑ das ist die tiefe Überzeugung ‑ beides nur Hand in Hand geht. Sie können
  also nicht sagen, ob sich der Bundeskanzler bei dem Thema Gemeinschaftsaufgabe an
  den Koalitionsvertrag gebunden fühlt, ja oder nein? Meine zweite Nachfrage zum Thema
  Klimaschutz: Hält die Bundesregierung es für nötig, angesichts der krassen Vorgänge
  eine Neujustierung vorzunehmen, ja oder nein? Frau Vates, das ist richtig; den Aspekt
  hatte ich gerade vergessen. Natürlich ist der Koalitionsvertrag Grundlage für die
  Arbeit dieser Koalition. Natürlich hält sich auch der Bundeskanzler an den Koalitionsvertrag.
  Das ist überhaupt keine Frage. Wenn wir jetzt alle anfangen würden, den Koalitionsvertrag
  infrage zu stellen, führt das, glaube ich, auf keinen guten Weg. Das heißt nicht,
  dass nicht auch Dinge rechts und links möglich sind, so man sie in der Koalition
  miteinander vereinbart. Das ist ja das Zentrale. Zu allem Weiteren, was Ihre Frage
  angeht, würde ich den Kollegen Haufe bitten, ob er, weil er noch tiefer drinsteckt,
  als ich es tue, flankieren kann. Ich würde gern noch einmal auf das Klimaschutzprogramm
  verweisen. Die Bundesregierung hat ein umfassendes Klimaschutzprogramm beschlossen.
  Das ist ein Maßnahmenpaket mit Maßnahmen bis 2030, das das Klimaziel, das gesetzlich
  festgelegt und auch grundgesetzlich untermauert ist, entsprechend ausfüllen soll.
  In diesem Maßnahmenpaket sehen Sie einerseits die Maßnahmen, die sich in der Umsetzung
  befinden ‑ Stichwort: Ausbau der erneuerbaren Energien, Hochlauf der Elektromobilität,
  die neue Förderung für energieeffiziente, klimafreundliche Heizungen ‑, genauso
  aber auch die Maßnahmen, die in den nächsten Jahren angegangen werden müssen. Das
  Programm an sich enthält für jeden Sektor umfängliche Emissionsminderungen, so wie
  es das Gesetz vorsieht. Insofern ist die Regierung auf der Maßnahmenseite programmatisch
  und auch inhaltlich genau dafür aufgestellt. Zum Teil hat sich meine Frage erledigt,
  weil es bei Herrn Hille anscheinend nichts bringt und ich zur Kenntnis nehme, dass
  man im Kanzleramt anderthalb Jahre, nachdem dieser Prüfauftrag im Koalitionsvertrag
  festgeschrieben worden ist, noch keinerlei Haltung dazu hat, was man von dieser
  Prüfung hält. Deswegen versuche ich es parallel noch einmal beim Innenministerium
  und beim Justizministerium, die ja auch für Verfassungsfragen zuständig sind: Gibt
  es dort schon eine Haltung dazu, ob man eine solche Verfassungsänderung, für die
  dann Zweidrittelmehrheiten in beiden Häusern notwendig wären, für realistisch und
  sinnvoll hält? Nur für das Protokoll zu der, sage ich mal, nicht ganz sachgemäßen
  Zusammenfassung dessen, was ich gesagt habe ‑ ‑ ‑ Ich habe schon mehrfach gesagt,
  dass ich von dieser Stelle nicht einzelne Vorschläge, die von Ihnen genannt worden
  sind, kommentiere, den Daumen hebe und „Ja“ oder „Nein“ sage, was nicht heißt, dass
  es dazu keine Haltung gibt. Das haben Sie gesagt: Es gäbe keine Haltung. ‑ Ich habe
  gesagt, ich sage jetzt von dieser Stelle dazu nichts. Sie verraten sie uns nicht.
  Okay, alles klar. Dann nehme ich das auf. Vielleicht noch einmal eine Ergänzung
  zur Untermauerung der Maßnahmen: Wir stehen vor der größten Emissionshandelsreform
  in Europa, einem zentralen Punkt für die Emissionsminderung. Wie wird der Emissionshandel
  in den nächsten zehn bis 15 Jahren aufgestellt sein? Wir werden in zwei Jahren einen
  zweiten Emissionshandel für Wärme und Verkehr europaweit einführen. Heute im Kabinett
  ist auch der Preis für den nationalen Brennstoffemissionshandel für das Jahr 2027
  beschlossen worden, das Übergangsjahr zum europäischen Emissionshandel für Wärme
  und Verkehr. Ab dem Jahr 2028 werden 75 bis 80 Prozent der klimaschädlichen CO 2
  -Emissionen in Europa unter einem Deckel liegen. Das ist ein enormer Erfolg. Weltweit
  gibt es keine Region, die solch einen umfassenden Emissionshandel und solch ein
  umfassendes CO 2 -Bepreisungssystem und ‑Absenkungssystem wie die Europäische Union
  hat. Das ist das zentrale Element, um klimaschädliche Emissionen herabzusenken,
  die die einzige zentrale, wichtige Vorsorgemaßnahme sind, um Klimaschäden und Klimawandelfolgen
  einigermaßen eindämmen zu können. Das ist gerade ein zentrales Projekt innerhalb
  der Europäischen Union, bei dem wir als deutsche Bundesregierung, die sich dazu
  übrigens ziemlich progressiv gegenüber anderen Staaten positioniert hat, in dem
  nächsten halben Jahr entsprechend deutlich zeigen werden, wo Klimaschutz gemacht
  werden kann: im Wirtschafts-, im Energie- und im Verkehrsbereich, weil alle diese
  dem Emissionshandel unterliegen. Wie Sie sich sicher vorstellen können, habe ich
  den Ausführungen des stellvertretenden Regierungssprechers im Moment nichts hinzuzufügen.
  Es ist immer besonders schön ‑ das hören Sie ja auch gerne ‑, wenn ich den Kanzler
  zitieren kann. Das mache ich an dieser Stelle gern noch einmal. In der Sommer-PK
  am 15. Juli hat der Bundeskanzler ganz grundsätzlich zu dem Thema gesagt ‑ ich zitiere ‑:
  Wir müssen alles tun, um den Klimawandel in den Griff zu bekommen. Das gelingt am
  besten, wenn wir „Technologien entwickeln, die so gut sind, dass andere sie auch
  nutzen wollen. … Das wäre der beste Beitrag, den Deutschland leisten könnte, um
  das Problem des Klimawandels weltweit in den Griff zu bekommen.“ „Klimapolitik mit
  Wirtschaftspolitik gut verbinden können.“ Das war in schöneren Worten noch einmal
  das, was ich vorhin versucht habe, Ihnen zu erläutern. Herr Hille, ich würde zurück
  zur Anpassung kommen. Würde das Kanzleramt zugeben, dass die Anpassungsmaßnahmen
  vielleicht mangelhaft sind, wenn man sieht, was jetzt mit dem Rhein passiert und
  zu wie vielen Todesfällen aufgrund der Hitze es gekommen ist? Soll dort nicht ein
  bisschen mehr gesteuert und ein bisschen mehr Priorität gesetzt werden, wenn man
  die Folgen sieht? Dazu würde ich in weiten Teilen darauf verweisen wollen, was ich
  gerade gesagt habe, um das nicht wiederholen zu müssen. Das gesamte Thema Klimawandel,
  Folgen des Klimawandels und Klimaanpassungen, die daraus nötig sind, ist von großer
  Bedeutung und steht weit oben auf der politischen allgemeinen Tagesordnung und auch
  auf der Tagesordnung der Bundesregierung. Wir müssen aber auch ein bisschen aufpassen
  im Sinne des Erwartungsmanagements. Gerade wenn Sie jetzt als Beispiel das Niedrigwasser
  im Rhein ansprechen, bringt es nichts, die Erwartungen zu schüren, man könnte einen
  Knopf umlegen und übermorgen ist wieder genug Wasser im Rhein und alles funktioniert
  wieder. Das sind länger laufende Prozesse, in denen wir uns schon befinden und die
  auch weiterlaufen. Die sind viel zu vielschichtig und komplex, um damit einfache
  Lösungen zu finden: Wir machen heute das, damit morgen das entsteht, und dann ist
  es erledigt. Die Bundesregierung versteht dieses Thema ganzheitlich mit all seinen
  Facetten, die es hat, und arbeitet daran ‑ das tut die Bundesregierung im Übrigen
  auch schon seit vielen Jahren; das kann man, glaube ich, auch für die Vergangenheit
  sagen ‑, um den Klimawandel ‑ ich zitiere noch einmal den Bundeskanzler ‑ „in den
  Griff zu bekommen“, etwas salopp gesprochen. Nur ist das keine einfache Angelegenheit.
  Der Kollege Haufe hat gerade geschildert, was wir in Deutschland und in Europa tun.
  Wir können für uns, glaube ich, zu Recht in Anspruch nehmen, dass wir dabei weltweit
  sehr weit vorne sind, was dieses Thema angeht. Nur ‑ auch das gehört auch zum Gesamtbild ‑
  all diese Fragen lösen wir weder in Deutschland noch in der Europäischen Union,
  sondern es sind Themen ‑ deshalb stehen sie bei Zusammenkünften im G7- und G20-Format
  regelmäßig auf den Tagesordnungen ‑, die nur international im weltweiten Verbund
  geregelt werden können. Würden Sie aber sagen, dass es Raum für Verbesserungen gibt,
  was Anpassungen angeht? Die Frage geht auch an Herrn Haufe. Da würde ich fast schon
  philosophisch werden: Besser geht immer. Dass man den Eindruck hat, es ginge nicht
  mehr besser, diesen Zustand erreicht man, glaube ich, selten bis nie. Von daher
  geht es natürlich immer besser. Aber ich habe gerade auch versucht, zu erläutern,
  wie die Dinge ineinandergreifen müssen. Ich überspitze jetzt: Nur alles auf den
  Klimaschutz zu fokussieren und dabei zu vergessen, dass wir, damit das möglich ist,
  wirtschaftlich erfolgreich sein müssen, führt nicht zum Erfolg. Es muss eine Balance
  hergestellt sein. Nur wenn beides bedacht und bearbeitet wird, kann es erfolgreich
  bearbeitet werden. Das ist eine inhaltlich-thematische Symbiose zwischen wirtschaftlichem
  Erfolg und Klimaschutz. Ich habe vorhin schon gesagt, der Minister hat noch einmal
  herausgestellt, wir fangen nicht bei null an. Wenn Sie das Kompetenzzentrum KlimaAnpassung
  fragen, dann erfahren Sie, dass eigentlich alle großen Städte in Deutschland schon
  längst über lokale Hitzeaktionspläne verfügen. Fast die Hälfte aller Bundesländer
  haben das bereits. Nordrhein-Westfalen ist zum Beispiel bei der Hitzevorsorge schon
  sehr weit entwickelt. Gleichzeitig geht es darum ‑ das hat er auch gesagt ‑, dass
  wir wesentlich effektiver, strategischer und auch konzertierter vorgehen müssen.
  Es gibt ganz klar Nachbesserungs- und Verbesserungsbedarf. Klimaanpassung erfolgt
  vor allen Dingen lokal, regional und national. Herr Hille hat gerade noch einmal
  auf die internationale Dimension der Klimaschutzvorsorge hingewiesen. Klimaanpassung
  ist natürlich massiv auch eine regionale und nationale Frage. Die Nationale Wasserstrategie,
  die in der letzten Legislaturperiode angegangen worden ist, ist ja gerade der Hebel,
  um das alte Wassermanagement, nämlich Wasser immer abfließen zu lassen und Kanäle
  zu schaffen, umzudrehen und zu sagen, dass wir Wasser in der Landschaft halten müssen.
  Denn nur so kriegen wir im Grunde genommen das Wasser länger auch in den Flüssen
  bei Niedrigwassersituationen. Das ist eine komplett neue Kultur. Wassermanagement
  wurde seit vielen Jahrzehnten immer darauf ausgelegt, Wasser abfließen zu lassen.
  Jetzt muss es quasi gehalten werden, durch Moore und die Wiederbelebung alter Kanäle
  und Flüsse. Wie auch gerade von Herrn Hille angesprochen: Das ist eine Langzeitaufgabe;
  die nicht von heute auf morgen geht. Die Situation jetzt macht noch einmal deutlich,
  wie wichtig es ist, dieses Umdenken im Wassermanagement wirklich überall in Deutschland
  zu etablieren. Wir haben eine Reihe von Pilotprojekten an der Elbe und an der Havel,
  wo das bereits passiert ist und auch gerade im Gang ist ‑ an der Elbe ist es schon
  sehr weit fortgeschritten ‑, sodass man das Wasser mittlerweile viel mehr in den
  Regionen hält. Das hilft wiederum auch dem Hochwasserschutz. Wie gesagt, fangen
  wir nicht bei null an, aber es braucht insgesamt ein strategischeres und vorausschauenderes
  Vorgehen auf allen Ebenen, die in Deutschland zusammendenken. Sie haben gerade beschrieben,
  wie die Bundesregierung versucht, Veränderungen ins Land zu bringen. Wir reden gerade
  aber von einer Grundgesetzänderung, die im Koalitionsvertrag steht. Sie haben gerade
  auch die Sommer-PK zitiert, in der der Bundeskanzler meinte, er sei nicht zuversichtlich,
  dass es eine Grundgesetzänderung bezüglich der Schuldenbremse geben könnte. Meine
  Frage ist: Ist er zuversichtlich, dass es eine Grundgesetzänderung bezüglich des
  Umweltschutzes geben könnte? Sie geben mit Ihrer Frage vielleicht ein wenig Antwort
  darauf, warum ich auf vorherige Fragen nicht dezidierter in die eine oder andere
  Richtung geantwortet habe. Der Bundeskanzler hat in der Sommer-PK nicht nur die
  Rechtslage, sondern auch die parlamentarische Realität beschrieben, und die ist
  natürlich Grundlage für alles, was man gesetzlich verändern will. Es gibt unterschiedliche
  Anforderungen, und eine Grundgesetzänderung hat aus sehr gutem Grund sehr hohe Mehrheitsanforderungen
  im Deutschen Bundestag. Schauen Sie sich die Mehrheitsverteilung im Deutschen Bundestag
  an; dann können Sie sich die Antwort auf Ihre Frage auch selber zumindest weitgehend
  erschließen. Insofern: Was einen möglichen Erfolg bei Grundgesetzänderungen angeht ‑
  sei es bei diesem Thema oder auch bei anderen Themen ‑, teile ich die Einschätzung
  des Bundeskanzlers aufgrund der parlamentarischen Mehrheitsverteilung voll und ganz.
  Herr Hille, kurz noch dazu: Heißt das, dass Sie wegen der Probleme der CDU mit der
  Linkspartei beim Thema Klimaanpassungen nicht vorankommen können? Weil der Emissionshandel
  als wesentliches Element für den Klimaschutz gerade angesprochen wurde, möchte ich
  das Wirtschaftsministerium noch fragen: Zieht die Bundesregierung an einem Strang,
  insbesondere was Fristen usw. angeht, oder gibt es da noch unterschiedliche Vorstellungen
  gibt? Zum Emissionshandel würde ich an das BMUKN als dafür zuständiges Ministerium
  verweisen. Die Wirtschaftsministerin hat sich zwischendurch doch auch ab und zu
  zum Thema Emissionshandel geäußert, oder habe ich das falsch im Kopf? Ja, aber in
  Ihrer Frage geht ja um die konkrete Umsetzung, und da muss ich auf die Zuständigkeit
  des BMUKN verweisen. Die Bundesregierung hat einen Vorschlag zur Reform des Emissionshandels
  vorgelegt, der weitgehender ist als der Vorschlag, den die EU-Kommission gemacht
  hat. Dieser Vorschlag, den wir bei der EU-Kommission eingereicht haben, ist in vielen
  Teilen noch wesentlich strenger und auf eine durchaus schärfere Preisentwicklung
  ausgelegt gewesen, und er beschreibt die gemeinsame Position der Bundesregierung.
  Ich überlege, ob ich noch einmal einen Anlauf nehme und vielleicht noch zwei Sätze
  dazu sage. ‑ Ich würde dafür werben, dass wir uns vielleicht nicht auf formale Fragen
  konzentrieren, die eher am Ende eines Bearbeitungsprozesses stehen sollten ‑ etwa,
  ob eine bestimmte juristische Form zwingend die Lösung eines großen Problems ist.
  Relevant ist doch ‑ und darüber haben wir gerade ausführlich gesprochen ‑, welche
  Bedeutung dieses Thema hat, wie das Verständnis der Bundesregierung grundsätzlich
  ist und was man dann mit Blick auf gesetzliche Änderungen und gegebenenfalls auch
  Grundgesetzänderungen für den richtigen Angang hält. Ich würde also dafür werben,
  diese formale Frage nicht zur zentralen Frage dieses Themas zu machen. Das wäre
  aus meiner Sicht unlautere oder unsachgemäße Verkürzung. Herr Hille, Sie haben jetzt
  so schön den Kanzler aus der Sommer-PK zitiert. Da hat er ja noch ein anderes viel
  zitiertes Zitat zu dem Thema gemacht, nämlich dass er die Wetterphänomene weiter
  beobachten werde und sich später gegebenenfalls auch noch dazu äußern würde. Hatte
  er während seines Urlaubs die Möglichkeit, diese Wetterphänomene zu beobachten,
  und ist damit zu rechnen, dass er sich gegebenenfalls tatsächlich äußern wird? Der
  Kanzler beobachtet immer, egal wo er sich aufhält, was in Deutschland, in Europa
  und in der Welt passiert. Und äußert sich dann gegebenenfalls auch? Er äußert sich
  dann, wenn er sich äußert. Ich habe nur eine formale Verständnisfrage: Im Koalitionsvertrag
  stand, dass die Gemeinschaftsaufgabe geprüft werden solle. Das ist ja schon ein
  Weilchen her, und jetzt würde ich gerne wissen: Was ist denn seitdem passiert, welche
  Prüfungen haben denn stattgefunden, und durch wen wurde geprüft? Ich dachte, gerade
  dafür geworben zu haben, uns jetzt nicht auf Aspekt zu kaprizieren, der sozusagen
  eine Formalie ist, nämlich wie man das in Gesetzestechnik übersetzt. ‑ Prüfung heißt
  Prüfung. Eine Prüfung beinhaltet einen inhaltlichen Teil ‑ da kann man zu einem
  Ergebnis kommen ‑, eine Prüfung beinhaltet aber auch den Teil, den wir gerade angesprochen
  haben. Nur als Gedankenspiel: Was hilft einem der Wille, das Grundgesetz zu ändern,
  wenn man nicht die nötigen Mehrheiten dafür hat? Da gehören nicht nur die Regierungsfraktionen
  dazu, sondern da gehören dann auch andere dazu. Wir bewegen uns hier ehrlicherweise
  ein bisschen im theoretisch luftleeren Raum. Wenn man in einen Koalitionsvertrag
  konkret hineinschreibt, dass man etwas prüfen möchte, halte ich es nicht für einen
  theoretisch luftleeren Raum, zu fragen, ob dann auch irgendwelche Schritte zur Prüfung
  unternommen werden. Vielleicht lässt sich durch die beteiligten oder zuständigen
  Ministerien ja auch nachreichen, was diesbezüglich bisher konkret vorgenommen wurde.
  Ich meinte damit jetzt nicht die Prüfung, ob Herr Merz bereit ist, über seinen Schatten
  zu springen und mit der Linkspartei eine Grundgesetzänderung für den Klimaschutz
  zu vereinbaren; diese Frage stelle ich Ihnen hier ja gar nicht. Die Frage war schlicht
  und einfach: Wer hat da denn überhaupt etwas gemacht, oder ist das einfach nur totes
  Papier? Das ist überhaupt kein totes Papier ‑ natürlich sind da schon einige Aktivitäten
  gelaufen. Zum Beispiel hat man sich mit den Ländern bereits darüber verständigt,
  wie dort so eine Gemeinschaftsaufgabe gesehen wird. Dazu haben Gespräche des Bundesumweltministeriums
  als federführendem Ministerium mit den Vertretern der Umweltministerkonferenz stattgefunden.
  Gleichzeitig hat es natürlich auch innerhalb der Regierung Gespräche auf Fachebene
  mit anderen Häusern gegeben. Klimaanpassung ist eine Querschnittsaufgabe für verschiedene
  Ressorts in der Bundesregierung. All diese Gespräche finden also statt, und wie
  gesagt hat auch schon ein intensiverer Austausch mit den Ländern stattgefunden.
  Natürlich haben auch schon juristische Prüfungen stattgefunden. All das gehört dazu.
  Der Kanzler hat in der Sommer-PK auch das Thema Hitzeschutz der Bevölkerung als
  mögliches Thema für den Nationalen Sicherheitsrat genannt. Inzwischen wissen wir,
  dass es in diesem Sommer mehrere tausend Hitzetote gegeben hat. Hat sich der Nationale
  Sicherheitsrat schon damit befasst? Frau Herzog, Sie wissen, wie es sich mit dem
  Nationalen Sicherheitsrat verhält: Wir gehen wir nie ins Detail, womit sich der
  Nationale Sicherheitsrat beschäftigt hat. In der letzten oder vorletzten Regierungspressekonferenz
  haben wir aber auch kurz über den Nationalen Sicherheitsrat insgesamt gesprochen,
  und da haben wir auch noch einmal erläutert, was dem zugrunde liegt. Auch da haben
  wir einen sehr umfassenden Begriff, ein sehr umfassendes Verständnis von Sicherheit.
  Dazu eine Anmerkung: „Nie“ stimmt ja nicht. Sie haben neulich mitgeteilt, dass sich
  der Sicherheitsrat mit der Sicherheitslage nach dem mutmaßlichen hybriden Angriff
  befasst hat. An das Außenministerium: Sind im Zusammenhang mit dem Erdbeben in Kolumbien
  irgendwelche Hilfen geplant oder gab es entsprechende Anfragen aus Kolumbien? Vielleicht
  ganz grundsätzlich: Wir sind natürlich tief betroffen vom Ausmaß der Zerstörung,
  das das Erdbeben in Kolumbien angerichtet hat. Deutschland steht in dieser Naturkatastrophe
  an der Seite der betroffenen Bevölkerung. Außenminister Wadephul hat sich gestern
  Vormittag dazu geäußert. Er hat die deutsche Anteilnahme unterstrichen und zugesichert,
  dass die kolumbianische Bevölkerung auch auf Deutschlands Unterstützung zählen kann.
  Jetzt gilt es erst einmal schnell, gezielt und koordiniert Hilfe zu leisten, um
  die Bevölkerung im Land zu unterstützen. Das ist nicht nur eine Floskel; denn es
  gibt international jetzt eine ganze Reihe von Hilfsangeboten, die zusammengeführt
  werden müssen. Da müssen Bedarfe identifiziert werden, und aus diesen Bedarfen entsteht
  dann sozusagen eine Matrix, wer was tun kann. Um das vorzubereiten, haben wir bereits
  unmittelbar nach dem Beben in enger Zusammenarbeit mit der Botschaft geprüft, wie
  Deutschland helfen kann. Hierzu stimmen wir uns mit der Europäischen Union ab. Es
  gibt einen europäischen Katastrophenschutzmechanismus, den die kolumbianische Regierung,
  mit der wir dazu direkt in Kontakt stehen, auch ausgelöst hat. Sie hat uns mitgeteilt,
  dass viele Menschen ‑ Sie haben die Bilder gesehen ‑ ihre Häuser und ihr Hab und
  Gut verloren haben. Insofern wird auch eine Nahrungsmittelknappheit bestehen. Die
  kolumbianischen Behörden haben uns gebeten, einen Beitrag dazu zu leisten, dass
  die Familien, die alles verloren haben, wieder Zugang zu sauberem Trinkwasser und
  Nahrungsmittel bekommen können. Die Filter, die dafür notwendig sind, werden wir
  zur Verfügung stellen; die bereiten wir jetzt vor. Auch eine Ausstattung für die
  Grundversorgung mit Nahrungsmitteln werden wir vorbereiten. Dann wird es eine Frage
  sein, wie diese Hilfsgüter so schnell wie möglich nach Kolumbien transportiert werden
  können. Wir werden gemeinsam mit anderen europäischen Ländern beraten, wie das geschehen
  kann. Eine der wichtigsten Agenturen, die dort jetzt Hilfe leisten kann, ist das
  Kolumbianische Rote Kreuz. Auch die Rotkreuz-Organisationen sind ja international
  vernetzt; die unterstützen wir jedes Jahr mit einer ganzen Reihe von Maßnahmen und
  auch finanziellen Mitteln. Hier stehen wir auch bereit, wenn eine Ausweitung der
  Mittel erforderlich sein sollte. Was die akut erforderlichen Maßnahmen betrifft ‑
  insbesondere die Suche nach Überlebenden ‑, so hat die kolumbianische Regierung
  jetzt gesagt, dass es dazu keine ausländische Hilfe bedarf. Wenn sich daran etwas
  ändern würde, würde natürlich auch hier gemeinsam europäisch geprüft werden, was
  wir tun können. Beim jüngsten Abschiebeflug nach Afghanistan ist laut Minister auch
  ein nicht straffällig gewordener Afghane dabei. Die Grünen kritisieren das und sagen,
  es sei unverantwortlich, dass Menschen nach Afghanistan abgeschoben würden, die
  sich nichts zuschulden haben kommen lassen. Die Hilfsorganisation Misereor kritisiert,
  durch die Zusammenarbeit mit den Taliban bei Abschiebungen erkenne das Innenministerium
  de facto das radikal-islamistische Terrorregime der Taliban an. Was entgegnet das
  BMI auf diese Kritik? Wie wir hier schon mehrfach ausgeführt haben, ist im Koalitionsvertrag
  vereinbart worden, dass Rückführungen auch nach Afghanistan wieder stattfinden werden.
  Das vollziehen wir. Zuständig sind die Bundesländer. Der Bund unterstützt dabei.
  Wir haben im Koalitionsvertrag auch festgehalten, dass wir das beginnend mit Gefährdern
  und Straftätern machen, aber eben nicht nur darauf beschränkt. Rechtlich ist es
  so, dass die Personen, die vollziehbar ausreisepflichtig sind, eben vollziehbar
  ausreisepflichtig sind und auch in ihre Länder zurückgeführt werden können. Dabei
  wird aber jeder Einzelfall geprüft. Diese Prüfung erfolgt auch im Hinblick auf mögliche
  Gefährdungen im Heimatland. Auch an das Bundesinnenministerium: Laut Berichten in
  den italienischen Medien will die Bundesregierung nach Jahren, in denen das nicht
  wirklich stattgefunden hat, wieder Rückführungen von Asylsuchenden nach Italien
  durchführen, und das schließe auch alle Personen ein, die 2026 eingereist sind und
  unter die alten Dublin-Regelungen fallen. Können Sie das bestätigen? Wir haben die
  Berichterstattung in Italien zur Kenntnis genommen; die lief auch am Wochenende
  schon. Ehrlich gesagt sind wir etwas überrascht angesichts der Aufregung, die teilweise
  herrscht; denn Deutschland und Italien arbeiten in Fragen der Migrationspolitik
  und vor allen Dingen auch in Fragen der Umsetzung des Gemeinsamen Europäischen Asylsystems
  schon länger gut zusammen. Es gibt auch bilaterale Vereinbarungen zwischen den beiden
  Ländern. Für uns war immer klar ‑ das haben wir hier und auch an anderer Stelle
  immer wieder betont ‑, dass ein funktionierendes Dublin-System die Bedingung für
  den Erfolg des Gemeinsamen Europäischen Asylsystems ist; denn es ist eine der tragenden
  Säulen des Gemeinsamen Europäischen Asylsystems. Wir haben uns als BMI innerhalb
  der EU auch sehr intensiv dafür eingesetzt, dass es dazu kommt und dass das Dublin-System
  wieder funktioniert. Dazu gehören für alle Mitgliedstaaten verbindliche praktikable
  Überstellungsmodalitäten und ein detaillierter Rechtsrahmen für freiwillige Überstellungen
  als unbürokratische effiziente Überstellungsform. Wir haben sowohl mit Italien als
  auch mit Griechenland im Herbst 2025 bilaterale Vereinbarungen abgeschlossen, dass
  die Dublin-Regeln ab der Anwendbarkeit des Gemeinsamen Europäischen Asylsystems
  im Juni 2026 wieder implementiert werden. Das bedeutet, dass Dublin-Überstellungen
  auch nach Italien wieder durchgeführt werden. Laut Medienberichten scheint es leicht
  unterschiedliche Interpretationen dieser Abkommen zu geben. Das Innenministerium
  Italiens scheint zu denken, dass diese Rückführungen nur für die Fälle gelten, in
  denen die Asylsuchenden seit dem Juni, also seit Gelten der neuen Regelung, eingereist
  sind, und nicht für die älteren Dublin-Fälle. Ist dem Ministerium bekannt, dass
  es diese Unstimmigkeiten gibt, haben Sie davon etwas erfahren? Besagt das Abkommen,
  dass das für alle Fälle gilt, oder nur für die Fälle, in denen die Asylsuchenden
  seit dem Juni eingereist sind? Auch wir haben diese Unstimmigkeiten zur Kenntnis
  genommen. Es geht vorrangig um die Fälle seit dem Inkrafttreten von GEAS. Inwieweit
  das auch für Fälle davor gilt, müsste ich nachreichen. An das Wirtschaftsministerium:
  Der Bund muss bis zum Samstag einen Revisionsbericht zum Kohleausstieg in Nordrhein-Westfalen
  bis 2030 vorlegen. Kann dieses Datum gehalten werden, oder sprechen Sie sich dafür
  aus, das noch einmal um drei Jahre zu verschieben? Der nächste Bericht ist in der
  Tat für den 15. August vorgesehen. Das Wirtschaftsministerium bereitet die Evaluierung
  vor, aber wir werden dieses Datum nicht einhalten. Wie Sie wissen, haben wir mit
  dem StromVKG ein Fördersystem zur Sicherstellung der Versorgungssicherheit umgesetzt.
  Das wollen wir neben weiteren Dingen noch in diesen Bericht einbeziehen, weil das
  nach unserer Ansicht sehr wichtig ist. Die ersten Ausschreibungen finden noch in
  diesem Jahr statt. Ich möchte hier aber ausdrücklich sagen: Die Verschiebung des
  Berichts ist keine Entscheidung in der Sache. Die gesetzlichen Zieldaten gelten
  weiter dabei. Aber gerade das in Kraft getretene StromVKG und die noch durchzuführenden
  Ausschreibungen dienen nicht zuletzt der Absicherung des Kohleausstiegs. Insofern
  ist es sehr wichtig, dass sie in diesem Bericht mit enthalten sind. Deshalb wird
  die Erstellung des Berichtes noch etwas dauern. Können Sie sagen, bis wann dieser
  Bericht voraussichtlich vorliegen wird? Zu der Frage von Gaskraftwerken statt Kohlekraftwerke
  als Reserve ist von der EU-Kommission ja noch nicht das letzte Wort gesprochen.
  Deswegen habe ich die Frage, ob die Zahl 2030 in Nordrhein-Westfalen nicht trotzdem
  wackelt, in Anführungszeichen. Dazu habe ich mich geäußert. Die Verschiebung des
  Berichts ist kein Anlass für eine eventuelle Fristverschiebung. Die gesetzlichen
  Zieldaten gelten hierbei weiter. Das Land Nordrhein-Westfalen hat sich auch dazu
  geäußert. Zu Ihrer ersten Frage: Wir sind am Bericht und daran, dass die Evaluierung
  zeitnah umgesetzt wird, dran. Aber ich kann Ihnen hier kein genaues Zieldatum nennen.
  Ich habe eine Frage an das Ressort der Landwirtschaft und Ernährung. Beim Schweinemarkt
  geht es traditionell immer mal hoch und runter. „Schweinezyklus“ ist nicht unbegründet
  ein stehender Begriff. Momentan stellen die Landwirte eine Reihe von Forderungen
  auf. Sie wollen unter anderem Finanzhilfen in Form von Zinszuschüssen und Steuererleichterungen,
  also eine steuerfreie Risikoausgleichsrücklage. Dazu habe ich zwei Fragen. Erstens,
  wie ernst schätzt der Minister in diesem Zusammenhang die aktuelle Lage der Schweinebauern
  ein? Zweitens, kommt mit dem angespannten Haushalt finanzielle Unterstützung für
  die Schweinebauern aus dem Ministerium? Vor dem Hintergrund der angespannten wirtschaftlichen
  Situation in der deutschen Schweinehaltung hat sich Bundesminister Rainer heute
  auch mit Vertretern der Branche getroffen. Es ist ihm ein wichtiges Anliegen, hierzu
  auch in den direkten Austausch zu gehen. Ich kann noch einmal sagen: Wir hatten
  rund zehn Verbände der Schweinehaltung, der ‑verarbeitung, der ‑vermarktung und
  des ‑handels eingeladen. Uns war es hierbei wichtig, die gesamte Wertschöpfungskette
  an den Tisch zu bringen und uns auszutauschen. Die Sauenhaltung und die Schweinemast
  sind Eckpfeiler der deutschen Landwirtschaft. Sie stehen aktuell wirtschaftlich
  stark unter Druck. Gründe sind vor allem ein erhöhtes Angebot an Schweinefleisch
  auf dem EU-Markt, was daher rührt, dass Möglichkeiten des Exportes in Drittländer
  beispielsweise aufgrund von Tierseuchen weggefallen sind. Dadurch sind die Erlöse
  für Schweinefleisch stark gesunken. Gleichzeitig entstehen den Landwirten aufgrund
  der jüngsten geopolitischen Situation auch höhere Kosten. Die Preise für Futtermittel
  wiederum sind wie auch die für Energie gestiegen. Wir setzen uns für eine wettbewerbsfähige
  und zukunftsfähige Tierhaltung in Deutschland ein. Wichtig ist uns, dass es Maßnahmen
  gibt, die tatsächlich auch wirken. So haben wir beispielsweise die Agrardieselrückerstattung
  vollständig wieder eingeführt, was die Wettbewerbsfähigkeit der deutschen Betriebe
  weiterhin stärkt. Wir haben eine Agrarexportstrategie auf den Weg gebracht, die
  sich schon in der Umsetzung befindet. Hierbei ist unser Ziel, neue Märkte zu eröffnen,
  beispielsweise auch für Teilstücke vom Schwein, die bei uns eben nicht nachgefragt
  werden, für die es aber in anderen Ländern, beispielsweise in Ländern in Asien,
  einen Absatzmarkt gibt. Hierbei konnten wir schon die ersten Erfolge sehen: Wir
  haben ein Regionalisierungsabkommen mit den Philippinen erreicht. Auch mit Südafrika
  und China sind wir auf gutem Weg dorthin. ‑ Das wird auch ausdrücklich von der Branche
  anerkannt. Was die Preisanstiege beispielsweise bei Düngemitteln angeht, arbeiten
  wir im Moment daran, ein Hilfsprogramm aufzusetzen. Wir haben von der EU-Kommission
  60 Millionen Euro bekommen, die wir so schnell wie möglich unbürokratisch unter
  die Landwirte bekommen möchten, um auch hierbei die Kosten abzufedern. Zur Risikoausgleichsrücklage,
  die Sie angesprochen haben, befinden wir uns in der Bundesregierung noch im Austausch.
  Ich will auch noch sagen, dass es weitere nationale steuerliche Sonderregelungen
  wie zum Beispiel die Tarifglättung gibt, die bereits bis 2028 verlängert wurde.
  Davon, dass Einkommensschwankungen über mehrere Jahre steuerlich abgefedert werden
  können, profitieren auch Tierhalter. Verstehe ich Sie also richtig? Erstens schätzt
  der Minister die Lage auch als ernst ein. Zweitens betreffen der Agrardiesel und
  die Düngemittelzuschüsse ja eher die Ackerbauern, wenn ich Landwirtschaft richtig
  verstehe. Die Risikoausgleichsrücklage könnte kommen bzw. ist im Gespräch. Aber
  sonst sind keine weiteren finanziellen Hilfen direkt für Schweinehalter geplant.
  Vielleicht noch einmal: Dass sich der Minister heute mit den Verbänden trifft ‑ es
  gibt übrigens auch noch Folgetreffen morgen und am Freitag, jeweils noch einmal
  mit Verarbeitern und Handel ‑, ist ja auch ein wichtiges Signal. Ich war bei dem
  Gespräch leider nicht dabei. Das Gespräch war noch im Gange, als ich auf dem Weg
  zur Regierungspressekonferenz war. Deshalb kann ich nichts von Ergebnissen des Gespräches
  berichten. Falls es hierzu etwas Belastbares zu kommunizieren gibt, machen wir das
  im Anschluss. Herr Hauck, ich würde gern noch zwei Sachen verstehen: Das eine ist,
  dass ich gern verstehen würde, welche Schweineteilstücke denn derzeit die problematischen
  sind. Sind das nach wie vor die früher nach China exportierten, also Schweineschwänze
  und ‑ohren? Gibt es Bestrebungen, möglicherweise den deutschen Markt auch mehr für
  diese Schweineteilstücke zu erwärmen? Das zweite ist: Wenn Sie jetzt gerade von
  den Düngemitteln sprechen, bin ich etwas irritiert, denn meines Wissens sind die
  Abfallprodukte aus der Schweinehaltung als Dünger auf deutschen Feldern in der Vergangenheit
  relativ gängig gewesen, dürfen aber aufgrund der Nitratverordnung nicht mehr in
  der alten Menge ausgebracht werden. Was ist denn jetzt der Stand der Dinge? Soll
  in Zukunft der jetzt teurere Kunstdünger wieder durch Naturdünger ersetzt werden?
  Vielleicht erst einmal zu dem ersten Punkt mit den Teilstücken oder mit dem Schweinefleisch
  an sich: Letztendlich liegt es natürlich an den Marktbeteiligten, zu schauen, wo
  Absatzmärkte für die eigenen Produkte sind. Was wir als Politik machen können, ist,
  Möglichkeiten zu schaffen und neue Absatzmärkte zu eröffnen. Genau das machen wir
  mit der Agrarexportstrategie. Tatsächlich ist es eben so, dass Teile vom Schwein
  wie Füße, Kopf oder Schwänze, wie Sie es gesagt haben, bei uns in Deutschland nicht
  sehr stark nachgefragt werden. Aufgrund der Restriktionen, der Tierseuchen gab es
  in der Vergangenheit eben Probleme beim Export bzw. die Märkte waren geschlossen.
  Unser Ziel ist einfach, Möglichkeiten zu schaffen, dass diese Teilstücke auch überall
  hin exportiert werden können. Das hat letztendlich auch etwas mit Nachhaltigkeit
  und Lebensmittelverschwendung zu tun. Das war es vielleicht zur Einordnung. Vielleicht
  können Sie die Frage zur Düngung noch einmal zusammenfassen. Üblicherweise kommt
  Gülle auf das Feld, damit man damit düngt. Das ist allerdings aufgrund der Nitratverordnung
  in weiten Teilen so nicht mehr gängig, bzw. es war teilweise zu teuer, weil Kunstdünger
  billiger war. Jetzt würde ich gern von Ihnen wissen: Gibt es ein Bestreben, dass
  Schweinegülle in Zukunft schlicht und einfach wieder auf das Feld gekippt wird,
  weil der Dünger dann günstiger wird, oder wollen Sie stattdessen jetzt Kunstdünger
  finanziell fördern? Das sind auch alles einzelbetriebliche Entscheidungen. Wir geben
  mit der Düngeverordnung den Rahmen vor. Die europäische Nitratrichtlinie steckt
  den Rahmen; mit der Düngeverordnung regeln wir die gute fachliche Praxis beim Düngen.
  Wie die Betriebe individuell düngen, ob das mit Wirtschaftsdünger ist, also mit
  Gülle, oder ob Mineraldünger zugekauft wird, kann ich jetzt hier nicht beurteilen.
  Das sind betriebsindividuelle Entscheidungen. Uns ist einfach nur wichtig: Aufgrund
  der aktuellen Situation in der Straße von Hormus und der vorgelagerten Produktion
  hat sich der Düngerpreis krass erhöht. Deshalb haben wir durch die EU-Kommission
  die Möglichkeit gehabt, den Betrieben mit dem Hilfsprogramm unter die Arme zu greifen.
  Wir arbeiten mit Hochdruck an der Umsetzung. Zu Ihrer Frage bezüglich Italien kann
  ich Ihnen ergänzend mitteilen, dass Italien im ersten Halbjahr 2026 1753 deutschen
  Übernahmeersuchen zugestimmt hat und damit auch die Zuständigkeit für die Durchführung
  des Asylverfahrens akzeptiert hat. Im Wesentlichen sind diese Fälle nicht vom Anwendungsbereich
  der bilateralen Vereinbarung erfasst. Das bedeutet, die Vereinbarung gilt vor allen
  Dingen ab Mitte Juni, seit Inkrafttreten des gemeinsamen europäischen Asylsystems.
  Ich hätte noch eine Frage an Frau Ungrad, und zwar: Wenn man die aktuellen Gasspeicherentwicklungen
  anführt, muss man auch als Mensch, der es in der Vergangenheit immer eher für Panikmache
  gehalten hat, allmählich etwas unruhig werden. Wir haben im letzten Monat noch einen
  täglichen Zuwachs von 0,16 Prozentpunkten gehabt und werden in diesem Tempo dann
  bei deutlich unter 60 Prozent Füllstand in den Winter gehen. Die vorgegebenen 80 Prozent
  zu erreichen, scheint schon technisch kaum mehr möglich zu sein. Mich würde interessieren:
  Ab welchem Zeitpunkt ist denn aus Sicht des Ministeriums der Zeitpunkt gekommen,
  an dem man dann wieder eingreifen und die Betreiber zum Auffüllen verpflichten müsste,
  statt abzuwarten, ob sie es doch noch von alleine tun? Zunächst: Die Berechnungen,
  die Sie aufgestellt haben, mit wie viel Prozent man in den Winter geht, teile ich
  nicht. Sie können nicht einfach die Prozente, die jetzt in den Speicher kommen,
  hochrechnen. Das erscheint mir keine richtige Berechnung zu sein, zumal die Speichervorbuchungen
  immer noch bei 74 Prozent liegen. Der Speicherstand ist in der Tat geringer als
  in den Vorjahren. Es ist aber Aufgabe des Marktes einzuspeichern. Das ist nach wie
  vor unsere Auffassung. Das hat auch immer funktioniert. Wir setzen auch weiterhin
  darauf, dass die Händler und die Unternehmen und Lieferanten einspeichern. Es gibt
  derzeit natürlich geopolitische Probleme, was auch auf den Preis Auswirkungen hat,
  weshalb es unter anderem zu weniger Einspeicherung gekommen ist. Das ist einer der
  Gründe. Andere Gründe könnten unter anderem sein, dass es in Asien eine größere
  Hitzewelle gegeben hat, zu der dann teilweise Öl- und LNG-Kapazitäten nach Asien
  gegangen sind, sodass es zwar genügend Gas zur Versorgung hier in Deutschland gegeben
  hat, man aber mit der Einspeicherung dann eben noch etwas abgewartet hat. Die Hitzewelle
  in Asien ist jetzt auch abgeflaut, sodass wir damit rechnen, dass es im September
  dann maßgebliche Einspeicherung gegeben haben wird. Wir haben auch im Sommer schon
  immer gesagt, dass die maßgeblichen Einspeicherungen Ende August und im September
  stattfinden. Nichtsdestoweniger äußere ich noch einmal das klare Bekenntnis, dass
  der Markt die Speicher für die Wintervorsorge füllen muss. Das ist mit unserer strategischen
  Gasreserve, die wir noch vorhaben umzusetzen, anders zu sehen. Wir haben nicht vor,
  in den Markt einzugreifen, denn das würde wieder erneute Kosten für meinetwegen
  eine Gasspeicherumlage oder Ähnliches bedeuten. Wir sehen nicht, dass diese Kosten
  den Steuerzahler bzw. die Unternehmen belasten sollten, wo die Aufgabe doch eindeutig
  beim Markt liegt. Ich entnehme es dem Energiewirtschaftsgesetz anders, als dass
  es allein Aufgabe des Marktes ist. Darin steht doch relativ klar: Wenn die Trendlinie
  erkennen lässt, dass das Ziel nicht erreicht wird, muss der Marktgebietsverantwortliche
  eingreifen. ‑ Natürlich ist es primär Aufgabe des Marktes; wenn der Markt dem nicht
  nachkommt, dann muss eingegriffen werden. Das steht relativ klar im Energiewirtschaftsgesetz,
  oder lese ich das falsch? Darin steht: in Verbindung mit der Versorgungssicherheit. ‑
  Die Versorgungssicherheit ist gewährleistet. Die Gasflüsse sind über die Gasnetze
  aus Norwegen, über unsere LNG-Terminals stabil. Man muss auch dazusagen, dass es
  in den Jahren zuvor, als die Speicherstände zu einem vergleichbaren Zeitpunkt höher
  waren, auch unsere Terminals nicht in der Form gab. Das Terminal in Stade wird dieses
  Jahr auch in Betrieb gehen. Auch das ist eine zusätzliche Absicherung und entwertet
  leicht die Gasspeicher. Wenn Sie genau schauen, welche Gasspeicher gefüllt sind,
  sehen Sie auch, dass die sogenannten Kavernenspeicher voller sind als die Porenspeicher.
  Die Kavernenspeicher sind die wichtigeren Speicher, die uns für die direkte Gasversorgung
  auch schneller Gas zur Verfügung stellen können. Es sind einige wenige Speicher,
  vorwiegend Porenspeicher, die aus verschiedenen Gründen sehr ungenügend gefüllt
  sind. Sie drücken natürlich auch die Gesamtprozentzahl. (zur wirtschaftlichen Situation
  von Betrieben mit Schweinen ) Herr Kollege, Sie hatten noch gefragt, ob wir dafür
  werben, dass in Deutschland mehr Teilstücke vom Schwein gegessen werden. Sie kennen
  unsere Antwort darauf: Die Menschen in Deutschland essen, was sie möchten. Dazu
  werden wir als Bundesregierung keine Vorgaben machen. Ich habe eine Frage an das
  BMI. Der sächsische Innenminister Schuster hat jüngst geäußert, dass es angesichts
  der nicht mehr nur abstrakten Bedrohungslage überlegenswert wäre, der Bundespolizei
  wie früher dem Bundesgrenzschutz wieder eine paramilitärische Komponente zu verleihen,
  damit sie hierbei sozusagen robuster auftreten kann. Nun kommentieren Sie ja keine
  Äußerungen von Politikern. Aber wäre das BMI grundsätzlich offen für solche Überlegungen,
  gerade hinsichtlich Ausbildung, Ausrüstung, Einsatz in geschlossenen Verbänden?
  Es ist richtig, dass wir solche Äußerungen nicht kommentieren. Soweit ich die Bundespolizei
  wahrnehme, ist die Bundespolizei robust ausgestattet. Es geht hierbei ja um eine
  Sache, die sich geändert hat. Es gibt immer wieder Überlegungen oder Anregungen
  oder Fragen, inwieweit die Bundeswehr im Innern eingesetzt wird, wozu es hohe verfassungsrechtliche
  Hürden gibt. Da wäre so etwas doch grundsätzlich erwägenswert, denn die Bundespolizei
  ist nicht mehr wie der Bundesgrenzschutz früher. Europäische Nachbarn von uns, Holland,
  Frankreich, Italien, Spanien, haben ja solche Einheiten. Die Sicherheitsarchitektur
  in Deutschland ist aus guten Gründen so, wie sie ist. Vielleicht möchte der Kollege
  vom Verteidigungsministerium auch ergänzen. Die verschiedenen Sicherheitsbehörden
  arbeiten sehr gut Hand in Hand miteinander. Wir haben am Montag erst zu den Neuerungen
  des Luftsicherheitsgesetzes ausgeführt. Ich glaube, diese Frage erübrigt sich. Ich
  habe nur wenig zu ergänzen. Wir haben eine enge Zusammenarbeit mit der Bundespolizei,
  zum Beispiel auch mit der Bundespolizei See, bei der, wenn man dort einmal hinschaut,
  auch die entsprechenden materiellen Ausstattungen sind, um diese Aufgaben durch
  die Bundespolizei zu erfüllen, auch Seite an Seite mit den anderen Sicherheitsbehörden,
  zum Beispiel der Bundeswehr. Wir nehmen sie auch als sehr robust und für den Auftrag
  gut ausgestattet wahr. Mehr kann ich dazu nicht sagen. Die Zusammenarbeit ist gut.
  Das Sicherheitsgefüge wurde gerade beschrieben. Mehr habe ich dazu nicht beizutragen.
  (zu Terminen des Bundeskanzlers ) Herr Hille, wird es nächste Woche eine Kabinettssitzung
  geben? Die Termine für die nächste Woche kündigen wir üblicherweise freitags an.
  Aber da Freitag keine RegPK ist und ich heute nichts angekündigt habe, können Sie
  daraus schließen, dass in kommender Woche keine Kabinettssitzung stattfinden wird
  und wir danach wieder in den üblichen Turnus übergehen. Dann wird also wieder der
  Bundeskanzler die Sitzung leiten. Ich habe eine Frage an das Familienministerium.
  Sie haben heute auch das Gesetz ‑ das wurde vorhin kurz gesagt ‑ zur Kinder- und
  Jugendhilfe im Kabinett verabschiedet, das auf viel Kritik von Sozialverbänden gestoßen
  ist. Haben Sie das Gefühl, Sie verschieben die Bemühungen zur Selbstbestimmung von
  Kindern und Jugendlichen mit Behinderung, die es in der Vergangenheit gegeben hat,
  mit diesem Gesetzentwurf wieder mehr in Richtung Fürsorge? Vielen Dank für diese
  Frage; denn Sie gibt mir die Gelegenheit, noch einmal ganz kurz zu skizzieren, was
  wir eigentlich mit dieser Reform erreichen wollen. Es hat in den letzten Wochen
  und Monaten sehr intensive Debatten grundsätzlicher Art über die Herausforderungen
  der Kinder- und Jugendhilfe gegeben. Was wir wollen, ist, die Funktionsfähigkeit
  der Kinder- und Jugendhilfe zu sichern, damit sie weiter ihre verfassungsmäßige
  Aufgabe erfüllen kann, Kinder und Jugendliche zu fördern, zu schützen und auch in
  ihren Familien zu unterstützen. Wir können das nur erreichen, wenn wir die Kommunen
  entlasten und grundsätzlich effektive, effiziente und vor allem resiliente Strukturen
  schaffen, kurzum: wenn wir die Kinder- und Jugendhilfe zukunftsfest machen. Wir
  wollen das erreichen, indem wir wirkungsvollen Hilfen für Kinder, Jugendliche und
  ihre Familien anbieten und sie mit mehr Prävention, niederschwelligen Zugängen,
  mehr Infrastruktur und auch weniger Verwaltungsaufwand erreichen. Wir versuchen
  das in einer zweistufigen Strukturreform zu bewerkstelligen. Was wir jetzt auf den
  Weg bringen, ist die erste Stufe. Damit versuchen wir, das gute Aufwachsen in Deutschland
  weiter zu gewährleisten. Zu der Frage, ob wir das verschieben: Ich kann Ihnen ganz
  klar sagen, dass wir für alle Kinder und Jugendlichen, die in Kita und Schule eine
  Begleitung zum Beispiel nach SGB VIII brauchen, diese Begleitung künftig durch die
  Kinder- und Jugendhilfe gewährleisten, die ein vorrangiges infrastrukturelles Angebot
  in der Bildungsassistenz zur Verfügung stellt. Dieses Angebot planen ‑ das finden
  wir wichtig ‑ Jugendämter, Kitas und Schulen zunächst gemeinsam. So wird sichergestellt,
  dass Kinder und Jugendliche, die eine Unterstützung in Kita und Schule benötigen,
  diese niederschwellig erhalten und dann eben auch schnell in Kitas und Schulen gehen
  können. Kinder und Jugendliche, die einen individuellen Bedarf haben, werden diesen
  zukünftig auch als Einzelassistent bekommen. Dieser Grundsatz bleibt bestehen; diese
  Hilfe werden Kinder und Jugendliche weiterhin erhalten. Es ist mir sehr wichtig,
  das noch einmal deutlich zu sagen. Kritik kommt ja nicht nur von den Sozialverbänden,
  sondern auch vom Behindertenbeauftragten der Bundesregierung, der sagt, der geplante
  Gesetzentwurf werde zum Beispiel Kindern mit mehrfachen Behinderungen überhaupt
  nicht gerecht und das Gesetz würde mehr statt weniger Bürokratie bedeuten. Was sagen
  Sie dazu? Dass es mehr Bürokratie bedeutet, würde ich deutlich von uns weisen; denn
  wir tun hier etwas, was für uns ein wichtiger Punkt ist: Wir haben in diesem Gesetz
  eine sogenannte Experimentierklausel eingebaut, die dazu führt, dass Leistungen
  der Eingliederungshilfe für Kinder und Jugendliche mit Behinderungen unter dem Dach
  der Kinder- und Jugendhilfe gebündelt werden können und dass Kommunen hier zusammen
  mit der Kinder- und Jugendhilfe rechtssicher erproben können, wie sie Kindern und
  Jugendlichen mit Behinderungen weiterhelfen können. Das ist auch etwas, was die
  Familien unterstützt, da sie Hilfen so aus einer Hand bekommen. Insoweit ist es
  eher ein Mehrwert. Dass Kinder und Jugendliche mit Mehrfachbehinderung ihren Anspruch
  auf Assistenz weiterhin behalten, habe ich gerade ja betont.'
