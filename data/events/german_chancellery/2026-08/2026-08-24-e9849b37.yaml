title: Bundeskanzler Merz empfängt den norwegischen Ministerpräsidenten Støre
text: Bundeskanzler Friedrich Merz wird am 27. August 2026 den Ministerpräsidenten
  des Königreichs Norwegen, Jonas Gahr Støre, im Bundeskanzleramt empfangen. Die Regierungschefs
  werden sich bei einem gemeinsamen Abendessen über die bilateralen Beziehungen, sicherheits-
  und verteidigungspolitische Themen sowie die weitere Unterstützung der Ukraine austauschen.
  Norwegen ist für Deutschland ein verlässlicher Freund sowie ein unverzichtbarer
  Werte-, Sicherheits- und Wirtschaftspartner. Eine Pressebegegnung ist nicht geplant.
