title: Bundeskanzler Merz gratuliert der Präsidentin der Republik Peru, Keiko Sofía
  Fujimori Higuchi
text: Sehr geehrte Frau Präsidentin, zu Ihrer Amtseinführung als Präsidentin der Republik
  Peru übermittle ich Ihnen meine herzlichen Glückwünsche. Deutschland und Peru verbindet
  eine langjährige Partnerschaft, die auf gemeinsamen demokratischen Werten beruht.
  Ich freue mich darauf, die freundschaftlichen Beziehungen zwischen Deutschland und
  Peru gemeinsam mit Ihnen weiter zu vertiefen. Für die vor Ihnen liegenden verantwortungsvollen
  Aufgaben wünsche ich Ihnen viel Erfolg und eine glückliche Hand. Mit freundlichen
  Grüßen Friedrich Merz Bundeskanzler der Bundesrepublik Deutschland
