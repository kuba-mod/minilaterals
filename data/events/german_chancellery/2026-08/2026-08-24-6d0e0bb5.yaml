title: Fragen und Antworten zu Unterstützungsleistungen Grundsicherungsgeld und Sozialhilfe
  – welche Hilfen gibt es für Menschen in Not?
text: 'Für den Bezug des Bürgergeldes wenden sich Betroffene an das Jobcenter. Menschen
  können aus den unterschiedlichsten Gründen unverschuldet in Not geraten: Sie verlieren
  ihren Job, können aufgrund einer chronischen Krankheit nicht arbeiten oder beziehen
  eine sehr geringe Rente. Als Folge können sie ihren Lebensunterhalt nicht aus eigener
  Kraft decken – und auch andere, etwa Angehörige, können dafür nicht aufkommen. Um
  ihnen ein menschenwürdiges Existenzminimum zu sichern und ein Mindestmaß an Teilhabe
  am gesellschaftlichen Leben zu ermöglichen, können diese Bürgerinnen und Bürger
  staatliche Sozialleistungen in Anspruch nehmen. Im Folgenden finden Sie die wichtigsten
  Fragen und Antworten im Überblick. Die neue Grundsicherung für Arbeitssuchende hat
  am 1. Juli 2026 das Bürgergeld abgelöst. Dieses hatte wiederum im Januar 2023 das
  Arbeitslosengeld II – auch „Hartz IV“ genannt – ersetzt. Grundsätzlich geht es darum,
  Menschen in existenzieller Not finanziell abzusichern, und sie gleichzeitig dabei
  zu unterstützen, aus dieser Situation so schnell wie möglich wieder herauszufinden.
  Mit der neuen Grundsicherung für Arbeitssuchende hat die Vermittlung in Arbeit wieder
  Vorrang. Es gilt der Grundsatz des Forderns und Förderns: Wer arbeiten kann, muss
  daran mitwirken, seinen Lebensunterhalt selbst zu bestreiten. Sanktionen wurden
  für diejenigen verschärft, die Termine oder Vereinbarungen nicht einhalten. Menschen,
  die Hilfe brauchen, können sich aber weiterhin auf Unterstützung verlassen. Die
  Grundsicherung für Arbeitssuchende ist im Zweiten Sozialgesetzbuch (SGB II) geregelt.
  Mehr Informationen finden Sie beim Bundesministerium für Arbeit und Soziales . Im
  Gegensatz zur Sozialhilfe richtet sich die Grundsicherung für Arbeitssuchende an
  Menschen, die einer Arbeit nachgehen können. Anspruch auf Grundsicherung für Arbeitssuchende
  hat, wer erwerbsfähig ist und trotz intensiver Bemühungen keinen Arbeitsplatz findet.
  Unterstützung erhalten aber auch Menschen, die mit ihrer Arbeit nicht genug verdienen,
  um ihren Lebensunterhalt zu decken – und für die vorrangige Leistungen wie Wohngeld
  oder Kinderzuschlag nicht ausreichen, um die Hilfebedürftigkeit zu überwinden. Sogenannte
  vorrangige Leistungen sind als erste Hilfsmaßnahme vorgesehen, falls das Einkommen
  nicht mehr reicht. Sie sollen zunächst davor schützen, dass andere Sozialleistungen
  wie die Grundsicherung für Arbeitssuchende oder die Sozialhilfe in Anspruch genommen
  werden müssen. Auch Personen, die nicht arbeiten können, die aber mit Grundsicherungsberechtigten
  in einem Haushalt zusammenleben, können Grundsicherungsgeld erhalten. Zuständig
  sind die Jobcenter . Sie sind gemeinsame Einrichtungen der Bundesagentur für Arbeit
  (BA) und eines kommunalen Trägers, zum Beispiel einer Stadt. Darüber hinaus gibt
  es Jobcenter mit zugelassenen kommunalen Trägern. Sie haben die alleinige Verantwortung
  für die Grundsicherung von Arbeitsuchenden. Jobcenter ermitteln den Bedarf und zahlen
  monatlich einen bestimmten Pauschalbetrag an die Betroffenen aus. Außerdem betreuen
  sie die Arbeitssuchenden und vermitteln sie in Arbeit. Darüber hinaus fördern die
  Jobcenter Eingliederungsmaßnahmen und berufliche Weiterbildungen. Wer Grundsicherung
  für Arbeitssuchende beantragt, muss dem Jobcenter Angaben zu seiner Lebenslage machen
  und nachweisen, dass er hilfebedürftig ist. Anhand dieser Informationen wird geprüft,
  ob die Voraussetzungen erfüllt sind und damit ein rechtlicher Anspruch auf die Leistung
  besteht. Ist das der Fall, ermittelt das Jobcenter zudem, wie viel Grundsicherungsgeld
  jemand erhält. Mehr Informationen zu den Jobcentern finden Sie bei der Bundesagentur
  für Arbeit . Der Umfang des Grundsicherungsgeldes orientiert sich an den sogenannten
  Regelbedarfen. Die Jobcenter zahlen einen pauschalierten Geldbetrag aus, der der
  Sicherung des Lebensunterhalts dienen und die Kosten für Ernährung, Kleidung, Körperpflege,
  Hausrat, Bedürfnisse des täglichen Lebens und für eine Teilnahme am kulturellen
  Leben abdecken soll. Dazu kommen die Bedarfe für Unterkunft und Heizung sowie die
  sogenannten Mehrbedarfe. Das sind zum Beispiel Leistungen für Alleinerziehende oder
  Schwangere. Die Regelbedarfe in der Grundsicherung für Arbeitssuchende und in der
  Sozialhilfe werden jährlich überprüft und angepasst – auf Grundlage der durchschnittlichen
  Preis- und Nettolohnentwicklung. Wie das funktioniert und wie hoch die Regelsätze
  derzeit sind, erfahren Sie beim Bundesministerium für Arbeit und Soziales . Die
  Sozialhilfe schützt als letztes „Auffangnetz“ vor Armut und sozialer Ausgrenzung.
  Der Begriff „Sozialhilfe“ steht für eine Reihe von Hilfen, die den verschiedenen
  persönlichen Lebenslagen entsprechen. Das Sozialhilferecht ist im Zwölften Buch
  Sozialgesetzbuch (SGB XII) geregelt. Sozialhilfe erhalten Menschen, die nicht arbeiten
  können, also „nicht erwerbsfähig“ sind. Als „nicht erwerbsfähig“ gilt laut Gesetz
  jemand, der weniger als drei Stunden täglich einer Tätigkeit nachgehen kann. Mehr
  Informationen zur Sozialhilfe finden Sie beim Bundesministerium für Arbeit und Soziales
  . Zwei wichtige Bereiche der Sozialhilfe sind die „Grundsicherung im Alter und bei
  Erwerbsminderung“ und die „Hilfe zum Lebensunterhalt“. „Grundsicherung im Alter
  und bei Erwerbsminderung“ erhalten Menschen, die Die „Grundsicherung im Alter und
  bei Erwerbsminderung“ ist nicht zu verwechseln mit der Grundrente . Diese gibt es
  seit 2021 und ist ein Zuschlag zur eigenen Rente. Voraussetzung ist, dass jemand
  viele Jahre Beiträge gezahlt hat und trotzdem nur eine geringe Rente bekommt. Mehr
  Informationen dazu erhalten Sie bei der Deutschen Rentenversicherung . Bei der „Hilfe
  zum Lebensunterhalt“ gelten dieselben Voraussetzungen wie bei der „Grundsicherung
  im Alter und bei Erwerbsminderung“: Anspruch darauf hat, wer seinen notwendigen
  Lebensunterhalt weder aus eigenen Mitteln (Einkommen und Vermögen) und Kräften (Einsatz
  der Arbeitskraft) noch mit Hilfe anderer (zum Beispiel Eltern oder Kinder) bestreiten
  kann. Während die Leistungen der „Grundsicherung im Alter und bei Erwerbsminderung“
  dauerhaft gezahlt werden, ist das bei der „Hilfe zum Lebensunterhalt“ nur vorübergehend
  der Fall. Die „Hilfe zum Lebensunterhalt“ richtet sich zum Beispiel an Menschen,
  die nur eine bestimmte Zeit erwerbsunfähig sind oder die voraussichtlich länger
  als sechs Monate stationär untergebracht sind. Welche konkrete Leistung jemand erhält,
  darüber entscheidet individuell der zuständige Sozialhilfeträger – umgangssprachlich
  das „Sozialamt“. Dabei handelt es sich um die Kommunalbehörden der Städte, Kreise,
  Landschaftsverbände und Bezirke oder die Landessozialämter. Das Sozialamt bearbeitet
  den Antrag und entscheidet dabei eigenverantwortlich. Anders als bei der „Grundsicherung
  im Alter und bei Erwerbsminderung“ müssen Hilfebedürftige für die „Hilfe zum Lebensunterhalt“
  nicht unbedingt selbst einen Antrag stellen. Auch nach einem Hinweis Dritter, wie
  etwa der Familie oder Nachbarn, muss das Sozialamt tätig werden (Amtsermittlungsgrundsatz).
  Trotzdem empfiehlt es sich, selbst einen Antrag zu stellen. Vom Sozialamt wird dann
  zunächst der persönliche Bedarf bestimmt, dann werden Einkommen und Vermögen angerechnet.
  Wieviel Sozialhilfe jemand erhält, hängt auch davon ab, ob der Empfänger oder die
  Empfängerin zum Beispiel allein lebt, Kinder hat, alleinerziehend ist oder mit einer
  anderen Person in einem Haushalt zusammenlebt. Der Regelbedarf ist deshalb in sechs
  Regelbedarfsstufen unterteilt, aus denen sich die monatlichen Regelsätze ergeben.
  Mehr Details zum Umfang der Leistungen von „Hilfe zum Lebensunterhalt“ und „Grundsicherung
  im Alter und bei Erwerbsminderung“ finden Sie beim Bundesministerium für Arbeit
  und Soziales . Die Bundesregierung plant, den Sozialstaat zu modernisieren. Er soll
  einfacher, digitaler und gerechter werden. Konkret heißt das: weniger Bürokratie
  und leichtere Antragstellung, dafür mehr Arbeitsanreize und einen leichteren Zugang
  zu Sozialleistungen. Die Kommission zur Sozialstaatsreform hat entsprechende Empfehlungen
  vorgelegt. Bund, Länder und Kommunen arbeiten derzeit an der Umsetzung. Kern ist,
  in einem einheitlichen Sozialleistungssystem Grundsicherungsleistungen, Wohngeld
  und Kinderzuschlag zusammenzuführen.'
