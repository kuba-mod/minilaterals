title: 'Neue Transparenzpflichten für KI in Deutschland – Staatsminister Weimer: „Ein
  wichtiger Meilenstein, der das Vertrauen in digitale Inhalte stärkt“'
text: 'Kulturstaatsminister Weimer sieht die neuen KI-Transparenzpflichten als bedeutenden
  Erfolg für deutsche Unternehmen und als wichtigen Gewinn für den Kultur- und Medienbereich.
  Seit dem 2. August gelten in der Europäischen Union neue Transparenzpflichten für
  bestimmte KI-Systeme und KI-generierte Inhalte. Ziel der Neuregelung ist, mehr Transparenz
  beim Einsatz von KI zu schaffen. Bürgerinnen und Bürger sollen künftig besser erkennen
  können, wann sie mit einem KI-System interagieren oder wann Inhalte mithilfe künstlicher
  Intelligenz erzeugt oder manipuliert wurden. Kulturstaatsminister Wolfram Weimer
  erklärte: „Dass nun EU-weit bestimmte Transparenzpflichten gelten, ist ein wichtiger
  Meilenstein. Die neuen Regelungen stärken das Vertrauen in digitale Inhalte. Durch
  mehr Transparenz über den Einsatz künstlicher Intelligenz leisten sie einen Beitrag
  dazu, das Risiko von Täuschungen und die Verbreitung irreführender KI-generierter
  Inhalte zu verringern. Zugleich greifen Ausnahmen zugunsten der Kunst- und Pressefreiheit,
  für deren praxistaugliche Ausgestaltung ich mich innerhalb der Bundesregierung eingesetzt
  habe.“ So sind die Transparenzpflichten so ausgestaltet, dass kreative und journalistische
  Arbeit nicht unverhältnismäßig eingeschränkt wird. Sofern KI-generierte Bilder,
  Audio oder Videos eindeutig unauthentisch oder unecht sind, entfällt die Kennzeichnungspflicht.
  Bei satirischen Bildmontagen oder bei Spielfilmen kann der erforderliche Hinweis
  in einer Weise erfolgen, die die Wahrnehmung des Werks nicht beeinträchtigt. Auch
  für journalistische Beiträge gilt keine Kennzeichnungspflicht, soweit sie vor der
  Veröffentlichung einer angemessenen Kontrolle unterliegen und eine Redaktion die
  Verantwortung übernimmt. Die Neuregelungen richten sich nicht nur an die Anbieter
  bestimmter KI-Systeme. Sie gelten auch für KI-Betreiber, also Akteure, die KI-Systeme
  in eigener Verantwortung verwenden, etwa Unternehmen und Einrichtungen. Damit können
  die neuen Transparenz- und Kennzeichnungspflichten auch für die Kultur- und Kreativwirtschaft
  relevant sein, beispielsweise für Verlage, Rundfunkveranstalter, Film- und Fernsehproduktionen
  sowie Museen und Kultureinrichtungen. Künftig sind bestimmte KI-Inhalte zu kennzeichnen,
  darunter Deepfakes - also täuschend echt wirkende, mithilfe künstlicher Intelligenz
  erzeugte oder manipulierte Bild-, Audio- oder Videoinhalte - sowie bestimmte KI-Texte
  zur Information der Öffentlichkeit. Kulturstaatsminister Weimer: „Insgesamt ist
  die KI-Verordnung ein Baustein eines europäischen Ordnungsrahmens für KI, der Innovation
  ermöglicht, Verantwortung schafft und Kreative stärkt.“ Zur Unterstützung bei der
  Umsetzung hat die EU Leitlinien, einen Verhaltenskodex, FAQs und Icons zur Kennzeichnung
  veröffentlicht. Weiterführende Informationen finden Sie auf den Internetseiten der
  Bundesnetzagentur ( Bundesnetzagentur - KI ) sowie der Europäischen Kommission (
  Kennzeichnung von KI-generierten Inhalten: EU-Kommission veröffentlicht Verhaltenskodex
  - Vertretung in Deutschland / Verhaltenskodex für die Transparenz von KI-generierten
  Inhalten | Gestaltung der digitalen Zukunft Europas )'
