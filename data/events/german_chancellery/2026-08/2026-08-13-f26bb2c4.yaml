title: Faktencheck Fakten zur „Rente mit 63“
text: 'Renteneintrittsalter: Welcher Jahrgang kann wann abschlagsfrei in Rente gehen?
  Es gibt die „Altersrente für langjährig Versicherte“ nach 35 Versicherungsjahren
  und die „Altersrente für besonders langjährig Versicherte“ nach 45 Versicherungsjahren.
  Mit welchem Alter in Rente gegangen werden kann, hängt zum einen von den Versicherungsjahren
  und zum anderen vom Geburtsjahr ab. Die „Altersrente für besonders langjährig Versicherte“
  wird oft „Rente mit 63“ genannt, weil alle vor 1953 Geborenen nach einer Versicherungszeit
  von 45 Jahren ohne Abschläge mit 63 Jahren in Rente gehen konnten. Das gilt nicht
  mehr für diejenigen, die zwischen 1953 und 1963 geboren sind. Da das Rentenalter
  schrittweise angehoben wird, verschiebt sich auch das Eintrittsalter mit dem Geburtsjahr
  nach oben. Die Anhebung begann im Jahr 2016 mit einem Anstieg um zwei Monate und
  betraf den Geburtsjahrgang 1953. Für jeden nachfolgenden Geburtsjahrgang wird die
  Altersgrenze um zwei weitere Monate angehoben. Ist Ihr Geburtsjahrgang 1964 oder
  später, können Sie nach 45 Versicherungsjahren mit 65 Jahren abschlagsfrei in Rente
  gehen. Das heißt, die „Altersrente für besonders langjährig Versicherte“ können
  Sie aktuell nicht mehr mit 63 Jahren in Anspruch nehmen. Aktuell ist sie – für den
  Geburtsjahrgang 1961 – eine Rente mit 64 Jahren und 6 Monaten. Somit ist es falsch,
  sie „Rente mit 63“ zu nennen. Die „Altersrente für langjährig Versicherte“ können
  Sie hingegen weiterhin mit 63 Jahren in Anspruch nehmen - allerdings mit einem Abschlag.
  Für jeden Monat, den Sie vorzeitig in Rente gehen, werden Ihnen 0,3 Prozent von
  Ihrer Rente abgezogen und das dauerhaft für die gesamte Zeit Ihrer Rente. Die „Altersrente
  für langjährig Versicherte“ erhalten Sie nach 35 Versicherungsjahren. Alle Versicherten
  der Jahrgänge 1949 bis 1963 können noch vor ihrem 67. Geburtstag ohne Abschläge
  in Rente gehen. Wann genau, hängt vom Geburtsjahr ab. Einen Überblick dazu bietet
  die Grafik oben. Sie zeigt die schrittweise Anhebung des Rentenalters. Für alle,
  die 1964 oder später geboren sind, liegt das abschlagsfreie Renteneintrittsalter
  für diese Rentenart bei 67 Jahren. Ihre Rente ist so individuell, wie Sie es sind!
  Hier geht es zum Rentenbeginn- und Rentenhöhenrechner der Deutschen Rentenversicherung.'
