title: Im Kabinett beschlossen Litauen soll Nordostflanke der NATO verstärken
text: Die Erweiterung verstärkt die Abschreckungs- und Verteidigungsfähigkeit an der
  NATO -Ostflanke. Zusammen mit Polen und Dänemark will Deutschland Litauen als vierte
  Rahmennation einladen, das Multinationale Korps Nordost in Stettin zu verstärken.
  Dazu hat das Bundeskabinett nun einen entsprechenden Beschluss gefasst. Der Beitritt
  Litauens zum Korps soll die sicherheitspolitische Zusammenarbeit an der Nordostflanke
  verstärken. Das Korps ist für die Führung von Operationen an der Nordostflanke der
  NATO verantwortlich. Der Beitritt Litauens stellt einen bedeutenden Meilenstein
  für die Weiterentwicklung des Korps dar. Außerdem stellt er die Lasten- und Verantwortungsverteilung
  innerhalb des Korps auf eine breitere Basis. Litauen verfügt als unmittelbar an
  der NATO -Ostflanke gelegener Bündnispartner über viel Erfahrung im Umgang mit sicherheitspolitischen
  Herausforderungen im Baltikum. Die Erweiterung verstärkt die Abschreckungs- und
  Verteidigungsfähigkeit an der NATO -Ostflanke und unterstreicht die Bereitschaft
  der Bündnispartner, den sicherheitspolitischen Herausforderungen im euro-atlantischen
  Raum gemeinsam zu begegnen. Gleichzeitig setzt der Beitritt ein deutliches Signal
  der Geschlossenheit und Solidarität innerhalb der NATO . Das Hauptquartier des Multinationalen
  Korps Nordost befindet sich in Stettin und ist Teil der NATO -Streitkräftestruktur.
  Es wurde 1999 aufgestellt. Derzeit sind im Stab des Korps in Stettin rund 400 Soldaten
  und zivile Angestellte aus mehr als 20 Nationen tätig. Das Hauptquartier führt die
  ihm bereits zugewiesenen multinationalen Landstreitkräfte an der NATO -Nordostflanke.
  Bei Bedarf ist es darauf ausgelegt, zahlreiche weitere Truppen zum Schutz der Nordostflanke
  zu führen.
