title: Zivil- und Katastrophenschutz des Bundes Technisches Hilfswerk – verlässlicher
  Partner an der Seite der Menschen
text: 'Seit 76 Jahren ist das THW im Einsatz – wie diese Helfer der Schnell-Einsatz-Einheit
  Bergung Ausland (SEEBA) bei einem Einsatz in der Türkei. Das Technische Hilfswerk
  ( THW ) ist die Zivil- und Katastrophenschutzorganisation des Bundes. Es hilft weltweit
  bei Katastrophen und Unglücken. Wenn zum Beispiel Unwetter großflächige Schäden
  anrichten oder die Stromversorgung länger ausfällt, leisten die Einsatzkräfte des
  THW schnell und effizient technische Hilfe. Gegründet wurde das THW am 22. August
  1950. Die Aufgaben des THW sind vielfältig: Rettung und Bergung von Menschen und
  Tieren, die Sicherung von Gebäuden und Infrastruktur, die Wasserversorgung in Notsituationen
  und logistische Unterstützung anderer Hilfsorganisationen. Nicht nur in Deutschland
  ist das THW aktiv. Seit mehr als 60 Jahren führt das THW Einsätze im Auftrag der
  Bundesregierung rund um den Globus durch. Die Ehrenamtlichen suchen und bergen Erdbebenopfer,
  versorgen Menschen in Katastrophengebieten mit Trinkwasser und unterstützen den
  Wiederaufbau nach Naturkatastrophen oder Bürgerkriegen. Für die akute Soforthilfe
  gibt es mehrere Spezialeinheiten: Die Schnell-Einsatz-Einheit Bergung Ausland (
  SEEBA ) ortet und rettet Menschen nach Erdbeben. Wenn die Trinkwasserversorgung
  zusammenbricht, kommt die Schnell-Einsatz-Einheit Wasser ( SEEWA ) zum Einsatz.
  Unter anderem kann diese Einheit die Bevölkerung mit Aufbereitungsanlagen innerhalb
  von wenigen Tagen mit Trinkwasser versorgen. Das THW ist bundesweit in Ortsverbänden
  organisiert, die wiederum in Regionalstellen und Landesverbände gegliedert sind.
  Es arbeitet eng mit den staatlichen Behörden, Feuerwehren und anderen Hilfsorganisationen
  zusammen. Im THW engagieren sich insgesamt etwa 88.000 Ehrenamtliche, darunter mehr
  als 15.500 Frauen. In vielfältigen Einsätzen und Übungen engagieren sich die THW
  -Kräfte in ihrer Freizeit für den Zivil- und Bevölkerungsschutz. Dabei unterstützen
  sie rund 2.200 Hauptamtliche sowie mehrere Hundert Bundesfreiwillige. Seit 2019
  bietet das THW Platz für bis zu 2.000 Bundesfreiwilligendienstleistende (Bufdis).
  Ob direkt nach der Schule oder im Ruhestand, in einem Jahr können die Bufdis die
  Aufgaben im Ehren- und Hauptamt kennenlernen, erste Arbeitserfahrungen sammeln und
  eine vollständige THW -Grundausbildung abschließen. Bufdis sind in Landes- und Ortsverbänden,
  aber auch in der THW -Leitung und in den Ausbildungszentren aktiv und entdecken
  das THW in verschiedenen Facetten. In der THW -Jugend e.V. , der Nachwuchsorganisation
  des Technischen Hilfswerks, engagieren sich mehr als 16.000 Kinder und Jugendliche
  im Alter von sechs bis 17 Jahren. Spielend helfen lernen: Das ist das Motto der
  Junghelferinnen und Junghelfer. Die Übungen und Aktivitäten gestaltet die THW -Jugend
  im Team und altersgerecht. Mehr Informationen finden Sie beim Bundesinnenministerium
  sowie beim THW.'
