title: „Lebendige Geschichte, gebaute Identität“ – Staatsminister Weimer bei der Eröffnung
  des „Zentrums Welterbe“ des Naumburger Doms
text: 'Kulturstaatsminister Wolfram Weimer hat heute anlässlich der Eröffnung des
  neuen „Zentrums Welterbe“ den Naumburger Dom besucht. In seinem Grußwort betonte
  Staatsminister Weimer: „Das ‚Zentrum Welterbe‘ ist eine wichtige Ergänzung für den
  Naumburger Dom. Es macht die kulturhistorische Bedeutung eines Bauwerks zugänglich,
  dessen Strahlkraft weit über die Grenzen Sachsen-Anhalts hinausreicht. Die grandiose
  Architektur des Doms und die schöpferische Symbiose von Kunst und Handwerk überwältigen
  mich geradezu. Dieser Dom ist gespeicherte Geschichte, gebaute Identität. Mit seiner
  herausragenden mittelalterlichen Bau- und Bildhauerkunst steht er beispielhaft für
  die Innovationskraft und den Gestaltungswillen unserer frühen Vorfahren. Auf diesen
  Mut zur Innovation können wir stolz sein. Diese Innovationskraft gehört zu unserer
  kulturellen DNA. Das 1.000-jährige Bestehen des Doms im Jahr 2028 bietet die große
  Chance, seine überragende Bedeutung international sichtbarer zu machen.“ Staatsminister
  Weimer verwies zudem auf den Naumburger Dom als besonderes Zeugnis der jüngeren
  deutschen Geschichte: „Der Naumburger Dom gehört zu den Sakralbauten, die zu DDR-Zeiten
  erhalten und restauriert wurden. Damit ist er weit mehr als ein museales Erbe: Er
  steht für die Kraft des Glaubens, für den Mut zur Tat und für eine historisch gewachsene
  Identität.“ Der Beauftragte der Bundesregierung für Kultur und Medien hat in der
  Vergangenheit mehrere Sanierungsmaßnahmen am Naumburger Dom in Höhe von 6,3 Millionen
  Euro gefördert. Der Dom ist ein herausragendes Beispiel mittelalterlicher Bau- und
  Handwerkskunst. Seine kunst- und kulturhistorischen Besonderheiten und seine Bedeutung
  für die Kulturlandschaft Saale-Unstrut werden im neu entstandenen „Zentrum Welterbe“
  nun einer breiten Öffentlichkeit lebendig und interaktiv vermittelt. Die Entstehung
  des Zentrums wurde unter anderem mit Mitteln des Bundesministeriums für Wirtschaft
  und Energie gefördert. Die Stärkung der kulturellen Infrastruktur zählt zu den zentralen
  Anliegen der Bundesregierung. Mit nachhaltigen Investitionen unterstützt der Bund
  kulturelle Einrichtungen und Kulturdenkmäler von nationaler Bedeutung. Weitere Informationen
  rund um die BKM-Förderung von Kulturbauten finden Sie unter Kulturbauten | Kulturstaatsminister
  - Der Beauftragte der Bundesregierung für Kultur und Medien'
