title: Strafverfolgung europaweit Digitale Beweismittel schneller übermitteln
text: Die Zusammenarbeit zwischen den EU-Staaten soll bei der Verfolgung von Straftaten
  verbessert werden. Digitale Spuren spielen in der Strafverfolgung eine immer größere
  Rolle. Neue Regelungen ermöglichen es den Ermittlungsbehörden, elektronische Beweismittel
  künftig schneller und über Ländergrenzen hinweg anfordern zu können. Das deutsche
  Gesetz zur Umsetzung der europäischen Richtlinie ist am 18. August 2026 in Kraft
  getreten. Bei Ermittlungen können Informationen künftig direkt bei Anbietern in
  anderen Mitgliedstaaten anfordern. Zur Umsetzung der europäischen Vorgaben hatte
  die Bundesregierung einen Gesetzentwurf erarbeitet, der im Bundestag beschlossen
  und vom Bundesrat gebilligt wurde. Damit reagiert die Bundesregierung auf die wachsende
  Bedeutung digitaler Medien bei der Anbahnung und Ausführung von Straftaten, insbesondere
  bei grenzüberschreitender Kriminalität. So können zum Beispiel Chat verläufe, IP
  -Adressen oder E-Mail -Inhalte schneller und effizienter gesichert und herausgegeben
  werden.
