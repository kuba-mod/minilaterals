title: Im Kabinett beschlossen Zoll kann stärker gegen Finanzkriminalität vorgehen
text: 'Um Informationen schneller zusammenführen zu können, soll die Generalzolldirektion
  künftig neu aufgestellt werden und mehr Befugnisse erhalten. Die Bundesregierung
  will organisierte Kriminalität, wie Finanzkriminalität, Geldwäsche, Drogenhandel,
  Banden- und Clanstrukturen mit allen Kräften effektiver bekämpfen. Eine wichtige
  Rolle spielt dabei der Zoll. Um ihn zu stärken und mit mehr Rechten auszustatten,
  hat das Bundeskabinett nun das Zollfinanzgerechtigkeitsgesetz beschlossen. Bundesfinanzminister
  Klingbeil zum Beschluss : „Damit senden wir ein klares Signal an Kriminelle: Wir
  verschärfen die Gangart! Gleichzeitig entlasten wir die ehrlichen Bürgerinnen und
  Bürger und Unternehmen. Das ist ein wichtiger Beitrag zur Gerechtigkeit in unserem
  Land.“ Mit dem neuen Gesetzpaket bekommt der Zoll neue Befugnisse, um gegen Finanzkriminalität
  und Geldwäsche besser vorgehen zu können. Darunter: Der Zoll nimmt heute deutlich
  mehr Aufgaben wahr als bisher. Neben klassischen Kontrollen von Waren und der Erhebung
  von Zöllen ist er beispielsweise auch mit Schwarzarbeit, organisierter Kriminalität,
  Geldwäsche oder der Durchsetzung von Sanktionen befasst. Ein weiterer Schwerpunkt
  des Gesetzes ist, Strafverfolgungsbehörden wie den Zoll neu und besser aufzustellen.
  So sollen die unterschiedlichen Aufgaben gezielter zusammengeführt und besser gesteuert
  werden. Das macht den Zoll insgesamt schlagkräftiger und effizienter im Kampf gegen
  Finanzkriminalität. Wichtig dafür ist es, Informationen insgesamt schneller zusammenzuführen.
  Daher soll sich die Generalzolldirektion künftig in zwei Fachstränge gliedern: „Zölle
  und Steuern“ und „Sicherheit und Vollzug“. Außerdem werden das Zollkriminalamt und
  die Zentralstelle für Sanktionsdurchsetzung in die Generalzolldirektion integriert.
  Für kürzere Entscheidungswege, schnelleren Informationsaustausch und den Abbau von
  Doppelstrukturen sollen auf regionaler Ebene die bisherigen Hauptzollämter und Zollfahndungsämter
  in Zolldirektionen überführt werden. Mit dem Zollfinanzgerechtigkeitsgesetz setzt
  die Bundesregierung zentrale Teile ihres Aktionsplans gegen Organisierte Kriminalität
  um. Er wurde gemeinsam vom Bundesfinanzministerium, dem Bundesinnenministerium und
  dem Bundesjustizministerium erarbeitet und im Februar 2026 beschlossen. Neben der
  Stärkung und Neuaufstellung des Zolls sollen auch Themen aus dem Aktionsplan angegangen
  werden, wie der Aufbau von Kompetenzzentren oder die Sicherstellung von Vermögenswerten.
  Alle Maßnahmen zusammen sollen helfen, organisierte Kriminalität effektiver zu bekämpfen
  – zum Schutz der inneren Sicherheit und des Wirtschafts- und Finanzstandortes Deutschland.'
