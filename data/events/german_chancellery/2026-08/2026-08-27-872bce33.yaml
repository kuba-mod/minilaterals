title: '1.600 weitere Unterstützerinnen und Unterstützer für das Bauhaus-Manifest
  — Staatsminister Weimer: „Großer Erfolg für die Prinzipien von Freiheit, Offenheit
  und Innovation“'
text: 'Auf Initiative von Staatsminister Wolfram Weimer hatten Verbände und Institutionen
  aus Kultur, Design, Handwerk, Architektur sowie Kirchen gemeinsam das Bauhaus-Manifest
  2026 unterzeichnet. Nun wächst das Bündnis auch in der Breite weiter. Seit der Veröffentlichung
  des Manifests vor knapp einer Woche haben sich 1.600 weitere Unterstützerinnen und
  Unterstützer aus den Bereichen Kultur, Wissenschaft, Handwerk, Design und Architektur
  angeschlossen. Auch zahlreiche Prominente, Institutionen und viele Privatpersonen
  haben unterzeichnet. Dazu Staatsminister Weimer: „Es freut mich sehr, dass das Bauhaus-Manifest
  so viel Unterstützung findet, die auch über die Kulturinstitutionen hinausgeht.
  Das ist ein großer Erfolg für die Prinzipien von Freiheit des künstlerischen Denkens,
  Unabhängigkeit, Offenheit und Innovation. Es zeigt: Die Ideen des Bauhauses haben
  eine feste Basis und gehören zu unserer lebendigen Demokratie dazu. Daher ist es
  wichtig, dass wir sie in aller Deutlichkeit verteidigen.“ Das Bauhaus wurde 1919
  in Weimar gegründet. Nach seiner Vertreibung aus Weimar wurde es 1926 – vor genau
  100 Jahren – in Dessau wieder eröffnet. 1933 – inzwischen nach Berlin umgezogen
  – musste es unter dem Druck der Nationalsozialisten endgültig schließen. Das Bauhaus
  und seine Stätten in Weimar, Dessau und Bernau sind UNESCO-Welterbe. Wir laden dazu
  ein, das Bauhaus-Manifest 2026 auch weiterhin zu unterstützen und gemeinsam ein
  Zeichen für Freiheit, Offenheit und Kreativität zu setzen. Wer das Manifest unterstützen
  möchte, kann sich hier informieren und seine Unterstützung erklären: Bauhaus-Manifest
  2026 | Akademie der Künste'
