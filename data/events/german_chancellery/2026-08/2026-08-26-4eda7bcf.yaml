date: '2026-08-26'
type: press_release
source_name: german_chancellery
title: Abschlusspressekonferenz von Bundeskanzler Merz, Bundesminister Klingbeil und
  Bundesminister Dobrindt zur Kabinettsklausur Das Land in eine gute Zukunft führen
text: '„Wir werden unser Land in eine gute Zukunft führen“, sagte Bundeskanzler Merz
  nach der Kabinettsklausur in Neuhardenberg, die er gemeinsam mit Vizekanzler Klingbeil
  und Bundesinnenminister Dobrindt abhielt. Bundeskanzler Friedrich Merz hat ein positives
  Fazit der Kabinettsklausur in Neuhardenberg in Brandenburg gezogen. Im Mittelpunkt
  der Beratungen habe die Frage gestanden, wie Innovationen besser genutzt werden
  können, um die Wettbewerbsfähigkeit und die deutsche Wirtschaft zu stärken. Dabei
  habe es sowohl im Kabinett als auch mit den eingeladenen Gastrednern eine offene,
  konstruktive und kollegiale Diskussion gegeben, sagte Merz bei einer gemeinsamen
  Pressekonferenz mit Vizekanzler Lars Klingbeil und Innenminister Alexander Dobrindt
  zum Abschluss der Klausur. Bei den Diskussionen mit Wirtschaftsvertretern sei insbesondere
  Zuversicht hinsichtlich der wirtschaftlichen Zukunft Deutschlands deutlich geworden.
  Die Botschaft der Bundesregierung sei: „Wir haben große Reformen angepackt. Wir
  werden sie auch umsetzen, und wir werden unser Land in eine gute Zukunft führen.“
  Deutschland sei bei Innovationen und Wettbewerb, Wachstum und Arbeit auf richtigem
  Kurs. Finanzminister Lars Klingbeil betonte, es gehe beim Aufbruch in ein Deutschland
  der Zukunft um „neues wirtschaftliches Wachstum und gute sichere Arbeitsplätze“.
  Diese Ziele gelte es, gemeinsam zu erreichen – in der Koalition, mit den Sozialpartnern
  und mit Ländern und Kommunen. Der eingeschlagene Kurs von Investitionen und Reformen
  sei richtig, aber dafür brauche es Geschlossenheit. „Alle in dieser Koalition wollen
  das Land voranbringen. Wir müssen dafür die Dinge, die wir auf den Weg gebracht
  haben, gemeinsam umsetzen“, so Klingbeil. Laut Innenminister Alexander Dobrindt
  geht es in der Bundesregierung darum, die Herausforderungen gemeinsam zu bewältigen
  – „mit Wachstum, Wohlstand und Widerstandsfähigkeit.“ Die Entwicklung und der Einsatz
  von künstlicher Intelligenz seien dabei zentral. Deswegen lege die Koalition darauf
  einen klaren Fokus. Es gelte, daraus auch den Wohlstand der Zukunft zu generieren.
  Meine Damen und Herren, herzlich willkommen! Ich begrüße Sie herzlich zur Pressekonferenz
  nach unserer Kabinettsklausur und nach der heutigen Kabinettssitzung zusammen mit
  Vizekanzler und Finanzminister Lars Klingbeil und Innenminister Alexander Dobrindt.
  Wir haben uns zwei Tage Zeit genommen und intensiv beraten. Wir haben uns vor allem
  mit dem Thema von Innovation und Wettbewerbsfähigkeit auseinandergesetzt. Wir haben
  über die Aufgaben der nächsten Wochen und Monate gesprochen, über die Reformen,
  die wir schon vor der Sommerpause im Koalitionsausschuss beschlossen haben und die
  jetzt umgesetzt werden müssen, und vor allem – das war unser Schwerpunkt – darüber,
  wie wir Innovationen noch besser nutzen können, um unsere Wirtschaft zu stärken.
  Dabei haben wir sehr offen und sehr konstruktiv diskutiert und – das muss ich sagen –
  in einer ausgesprochen guten, kollegialen Stimmung. Dazu hat sicherlich auch das
  Ambiente hier beigetragen, der Abend gestern und nicht zuletzt auch der Geburtstag
  einer Kollegin. Innovation und Wettbewerb sind keine Begriffe für sich allein, sondern
  sie sind entscheidende Faktoren für die Zukunftsfähigkeit unseres Landes. Innovation
  und Wettbewerb, das beinhaltet im Grunde all das, was Deutschland modern, stark,
  zukunftsfähig und optimistisch werden lässt. Wir haben auf dieser Klausurtagung
  ein Zukunftsbild unseres Landes entworfen. Wir haben Deutschland von morgen diskutiert,
  und dieses Deutschland von morgen ist optimistisch und zuversichtlich. Wir müssen
  heraus aus dem Klima der Verdrießlichkeit und des Verdrusses. Wir müssen den weit
  verbreiteten Missmut gemeinsam abschütteln, der unser Land seit langer Zeit lähmt.
  Seit einem Jahr bringen wir in der Bundesregierung Entscheidungen auf den Weg, um
  das Land besser, schneller, moderner und dynamischer zu machen. Wir legen alte Lasten
  ab. Wir beseitigen Zwänge. Wir begrüßen neue Technologien. Wir tun das alles in
  dem Bewusstsein, dass wir das Gute in Deutschland erhalten und unsere Stärken nutzen
  wollen: unsere Demokratie und unsere Vielfalt und natürlich auch unseren Sozialstaat
  und unsere guten Arbeitsplätze. – Wir haben in diesem Geist vor der Sommerpause
  – ich sagte es bereits – weitreichende Reformen beschlossen, vor allem für unser
  Rentensystem, aber auch bei Steuern, Gesundheit und vor allem beim Rückbau unserer
  Bürokratie. So machen wir das Leben für Handwerk, Industrie und für den Mittelstand
  leichter. Wir wollen für alle Wachstum und Perspektiven ermöglichen. Ich will hinzufügen:
  Wir haben heute Morgen auch noch einmal ausführlich über die Lage der Landwirtschaft,
  der Forstwirtschaft und des Obst- und Gemüseanbaus gesprochen. Wir haben über die
  Ernährungswirtschaft gesprochen. Denn das alles zusammen ist ein großer, wichtiger
  Sektor unserer Wirtschaft. Vor allem dient er aber dem Zweck einer gesicherten und
  gesunden Ernährung unseres Landes. Wir sehen die Probleme, die nicht zuletzt durch
  die Dürre und die Hitze entstanden sind. Wir haben in den letzten beiden Tagen aus
  den Ressorts und von den Unternehmerinnen und Unternehmern beeindruckende Beispiele
  gehört, von KI über Drohnentechnologie bis hin zum Wohnungsbau, zu Gesundheitsthemen
  und zu Fragen der nationalen Sicherheit und der internationalen Handelsbeziehungen.
  Überall gibt es ermutigende und, ja, auch begeisternde Signale des Aufbruchs, der
  Innovation und des Optimismus. Wir sind und bleiben das Land der Erfinder und der
  Macher. Mit modernen Werkzeugen wollen wir auch in Zukunft ein Vorbild für unsere
  Nachbarn in Europa und in der ganzen Welt sein. Nehmen wir das Beispiel der KI .
  Ob in der Industrie oder im Handwerk, im Mittelstand, in der Rüstung, in der Medizin,
  in der Pharmazie, in der Medizintechnik, Deutschland hat hier ungeahnte, große Chancen.
  Künstliche Intelligenz ist ein Katalysator für den Aufbruch, für das moderne Deutschland.
  Dabei geht es nicht nur um Arbeit, Wertschöpfung und Zukunft, dabei geht es auch
  um Souveränität für unsere Gesellschaft, für unser Lebensmodell und nicht zuletzt
  für unsere Sicherheit. Deutschland ist ein starker und handlungsfähiger Staat. Wir
  sind stark in der Sicherheitspolitik. Sie haben das hier gestern vermutlich auch
  sehen können. Wir sind stark in der Technologie. Wir sind stark bei Innovationen.
  Auf diesen starken Staat können die Bürgerinnen und Bürger unseres Landes vertrauen.
  Dieser Staat schützt seine Bürger und nimmt sie mit in eine gute Zukunft. Die wirtschaftlichen
  Kerndaten untermauern diesen Optimismus. Der Geschäftsklimaindex ist im August überraschend
  stark gestiegen, und das schon zum vierten Mal in Folge. Die Wirtschaft wächst bereits
  im dritten Quartal mit guten Werten. Die Voraussagen für das Jahr 2027 werden nach
  oben korrigiert. Wir haben drei Jahre der Rezession hinter uns, und nun wachsen
  wir wieder, trotz Krieg am Golf und in der Ukraine, trotz den Handelskonflikten,
  die wir überall sehen und die über das vergangene Wochenende auch zwischen Amerika
  und Kanada noch einmal aufgeflammt sind. Wir haben beeindruckende Zahlen von Neugründungen.
  Junge Leute, junge Frauen, junge Männer gründen Unternehmen in Deutschland in einer
  so großen Zahl, wie wir es noch nie zuvor gesehen haben. Auch traditionelle Firmen
  trauen sich wieder etwas, übrigens auch sehr stark getrieben von künstlicher Intelligenz.
  Meine Damen und Herren, diese Kabinettsklausur soll auch einen Impuls an die Koalition,
  an die Koalitionsfraktionen, aber vor allem an die Menschen in unserem Land senden.
  Unsere Botschaft ist: Wir haben große Reformen angepackt. Wir werden sie auch umsetzen,
  und wir werden unser Land in eine gute Zukunft führen. Dazu sind wir fest entschlossen,
  und dabei sind wir geschlossen und, ja, auch guter Stimmung. Das werden Sie hoffentlich
  gestern Abend ein bisschen mitbekommen haben. Wir wissen gleichzeitig um unsere
  Verantwortung. Wir lassen uns dabei nicht irritieren. Ohne Arbeit und Wachstum ist
  alles nichts. Deswegen: Volle Konzentration auf Wachstum, auf Arbeitsplätze und
  auf Innovation! Wir haben der Klausurtagung eine reguläre Kabinettssitzung angeschlossen.
  In dieser regulären Kabinettssitzung heute haben wir, wie angekündigt, auch über
  die Folgen des Hitzesommers gesprochen. Zu diesem Punkt gibt es, wie geplant, keine
  Beschlüsse. Aber wir haben aus der Breite des Kollegiums der Mitglieder der Bundesregierung
  wichtige Impulse über den Stand der Prävention, über die Folgen der Hitze für die
  Menschen, für das Land und für die Verkehrswege und auch über die wirtschaftlichen
  Konsequenzen bekommen. Diese Erfahrungen wollen wir jetzt auf einem geordneten Weg
  in politische Entscheidungen überleiten. Lassen Sie mich dazu ein paar Grundlagen
  vermitteln. Wir haben im Bereich des Klimaschutzes bereits eine ganze Reihe von
  Maßnahmen beschlossen, insgesamt 300 aus dem laufenden und aus früheren Klimaschutzprogrammen
  seit dem Jahr 2021, mit dem diese Bundesregierung ja fortgeschritten ist. Das betrifft
  alle Sektoren. Das betrifft den Verkehr, das Wohnen, die Energie, die Industrie,
  die Land- und Forstwirtschaft und natürlich den Bereich der Gesundheit und vieles
  mehr. Uns geht es um Klimaschutz, um die Erhaltung und Einhaltung der Klimaziele,
  aber auch um Klimaanpassung, weil wir wissen, dass Hitzesommer in Zukunft häufiger
  vorkommen werden. Wir müssen uns darauf einstellen. Denn wir allein in Deutschland
  können den Klimawandel auf der Welt nicht zurückdrängen, selbst dann nicht, wenn
  wir alle selbst gesteckten Ziele sofort und am heutigen Tage erreichen würden. Ich
  möchte deshalb noch einmal betonen: Es mangelt uns nicht an Programmen, und es mangelt
  nicht an Geld. Die Länder, die nach unserer Verfassung mit der Aufgabe des Hitzeschutzes
  hauptsächlich beauftragt sind, haben aus dem Sondervermögen hundert Milliarden Euro
  erhalten, die ihnen jetzt über zwölf Jahre kontinuierlich ausgezahlt werden und
  die sie nach eigenem Ermessen investieren können. Aber das Programm heißt Investition
  und Klimaschutz, und das ist genau das, was wir damit bei dem Geld gemeint haben,
  das wir für den Bund zur Verfügung haben, aber auch bei dem Geld, das wir den Ländern
  zur Verfügung stellen. Dabei wissen Länder und Kommunen am besten, wie es vor Ort
  um diesen Schutz bestellt ist. Dort sollte deshalb auch entschieden werden. Im Bund
  werden wir in einigen Ressorts weitere Programme zur Klimaanpassung und zum Hitzeschutz
  auflegen. Wir wollen nun systematisch all diese Programme prüfen, sie besser miteinander
  verzahnen, Hürden für Anträge und Befristungen abbauen und vor allem für deutlich
  mehr Transparenz sorgen, damit die Bürgerinnen und Bürger auch wissen, was wir tun.
  Ich will hinzufügen, dass ich den Staatsminister im Bundeskanzleramt für die Bund-Länder-Beziehungen,
  Kollege Philipp Amthor, darum gebeten habe, mit den Bundesländern und den betroffenen
  Ressorts jetzt konkrete Vorschläge dazu zu erarbeiten und dies auch abzustimmen.
  Wir wollen im Übrigen auch Wissen, wo die Länder das Geld investieren, das ihnen
  von uns zur Verfügung gestellt worden ist, damit wir das alles miteinander abstimmen
  können. Außerdem werden wir aus dem Hitzesommer 2026 Lehren ziehen und konkrete
  Hilfen prüfen müssen. Das betrifft vor allem die Vorsorge für Waldbrände, die Ausstattung
  der Feuerwehren und der weiteren Hilfsorganisationen. Sie haben in diesem Sommer
  bemerkenswerte Arbeit geleistet. Das betrifft aber auch die Gesundheitsprävention,
  die Folgen für den Verkehr und natürlich für die Landwirtschaft und die Forstwirtschaft.
  Meine Damen und Herren, eine Klausurtagung soll Zeit geben, um Themen auch einmal
  fernab des Tagesgeschäfts in der gebotenen Tiefe zu diskutieren. Sie dient aber
  auch der Selbstvergewisserung und der Stärkung des inneren Zusammenhalts einer Regierung.
  Ich kann es aus meiner Sicht sagen, und ich denke die Kollegen werden es teilen:
  All diese Ziele haben wir in den letzten beiden Tagen erreicht. Wir sind uns sicher,
  dass wir auf dem richtigen Kurs sind. Innovation und Wettbewerb, Wachstum und Arbeit,
  das Land kann darauf vertrauen, dass wir mit aller Kraft daran arbeiten, unser Land
  in diesem Sinne voranzubringen. Ich habe abschließend zum Ende der regulären Kabinettssitzung
  den Kolleginnen und Kollegen, die mit Impulsvorträgen und guter Vorbereitung beigetragen
  haben, noch einmal gedankt. Ich kann es aus meiner Sicht sagen: Wir gehen mit Tatkraft,
  aber auch mit großer Zuversicht in die verbleibenden Monate des Jahres 2026. Wir
  sind uns sicher, dass wir auf diesem Weg weitere Fortschritte machen und zum Jahresende
  eine Bilanz ziehen können, die sich sehen lassen kann, heraus aus der Rezession,
  heraus aus der Schwäche unserer Wirtschaft, heraus aus dem Missmut und dem Misstrauen
  und hinein in eine neue Zuversicht. Die Gäste, die wir heute hatten, haben uns das
  alle zusammen in beeindruckender Weise vermittelt. Von dieser Zuversicht und von
  diesem Optimismus nehmen wir in unsere tägliche Arbeit viel mit. Deswegen will ich
  den Kolleginnen und Kollegen des Kabinetts noch einmal herzlichen Dank sagen. Das
  waren zwei wirklich gute Tage hier in Schloss Neuhardenberg. Last, but not least
  : Wir haben uns auch ein bisschen von der Geschichte dieses Hauses beeindrucken
  lassen. Wir waren heute Morgen, wie Sie vielleicht mitbekommen haben, auch in der
  Kirche. Staatsminister Weimer hat uns einen kurzen Abriss der Geschichte dieser
  Kirche, aber auch der gesamten Anlage gegeben. Den Geist dieses historisch wirklich
  bedeutenden Ortes nehmen wir mit in unsere Arbeit nach Berlin. Auch von mir ein
  herzliches Willkommen! Vielen Dank für Ihr Interesse! Der Bundeskanzler hat gerade
  die Schwerpunkte der Kabinettsklausur deutlich gemacht. Ich will es von meiner Seite
  aus auch noch einmal sagen: Neues wirtschaftliches Wachstum und gute, sichere Arbeitsplätze,
  um diese beiden Eckpfeiler geht es, wenn wir in Deutschland den Aufbruch in ein
  Deutschland der Zukunft schaffen wollen. Wir haben uns die Zeit genommen, darüber
  intensiv zu sprechen. Klar ist, dass wir diese Ziele gemeinsam erreichen sollten.
  Gemeinsam zu handeln, ist eine Stärke, gemeinsam in der Koalition, gemeinsam mit
  Politik, mit Unternehmen, mit Beschäftigten, mit Industrie, mit Handwerk, mit Start-ups
  , aber auch gemeinsam, Bund, Länder und Kommunen zusammen. Wir haben im Vorfeld
  der letzten Sitzung des Koalitionsausschusses mit den Sozialpartnern zusammengesessen.
  Auch aus diesem Treffen ist vieles an Ideen für die spätere Sitzung des Koalitionsausschusses
  erwachsen. Deswegen haben wir uns vorgenommen, diesen Dialog zu intensivieren und
  weiterzuführen. Ich und wir wollen, dass Deutschland wieder an die Spitze gebracht
  wird, technologisch, aber auch wirtschaftlich. Entscheidend ist, dass die Jobs der
  Zukunft in Deutschland entstehen. Entscheidend ist auch, dass wir unabhängiger und
  souveräner werden, damit nicht in Washington oder in Peking über unsere Zukunft
  entschieden wird, damit nicht die „ tech bros “ im Silicon Valley mit ihrer gefährlichen
  Ideologie über die Zukunft der künstlichen Intelligenz entscheiden. In den Vorträgen
  ist deutlich geworden: Wir können als Europäer, als Deutschland handeln. Wir haben
  alle Möglichkeiten und alle Chancen, die besten Lösungen auf den Weg zu bringen.
  Als Finanzminister habe ich dazu beitragen können, dass wir viel mehr in Zukunftstechnologien
  investieren. Wir investieren mehr in KI , mehr in Rechenzentren, mehr in Hightech
  . Im Sondervermögen steigern wir die Investitionen in Forschung und Entwicklung
  im Jahr 2027 um 60 Prozent im Vergleich zum Jahr 2026. Wir fördern also KI made
  in Germany und Chips made in Germany . Die Voraussetzungen in unserm Land sind gut.
  In unserem Land stecken riesige Potenziale und große Innovationskraft, und diese
  Potenziale gilt es jetzt besser zu nutzen. Der Bundeskanzler hat es angesprochen.
  Wir sehen es gerade an den Gründungszahlen, die massiv steigen. Immer mehr Start-ups
  und junge, wachsende Unternehmen, das kann eine neue Gründerzeit werden, und wir
  sollten alles dafür tun, dass es eine neue Gründerzeit wird. Gleichzeitig sehen
  wir zum ersten Mal seit langer Zeit doch wieder positive Signale aus der Industrie.
  Die Aufträge nehmen zu, und wir haben eine gute Entwicklung im Wohnungsbau. Allerdings
  muss man auch sagen: Der wichtigste Impuls, dass es gerade wirtschaftlich in Deutschland
  wieder bergauf geht, ist das 500-Milliarden-Euro-Investitionspaket. Das ist aktuell
  der stärkste Wachstumsimpuls. Ohne diese Investitionsoffensive wären wir in einer
  Rezession. – Das muss man so klar benennen. Jahrzehntelang wurde in unserem Land
  vieles kaputtgespart. Das spüren wir alle im Alltag – die Unpünktlichkeit der Bahn,
  kaputte Straßen, marode Schulen. Der ideologische Sparkurs der letzten Jahrzehnte
  ist uns teuer zu stehen gekommen. Wir als Regierung beenden mit unseren Investitionen
  diese zukunftsfeindliche Politik. Mir war es wichtig, dass wir einen anderen Kurs
  bei Investitionen einschlagen. Vor einem Jahr habe ich auf der Kabinettsklausur
  gesagt, die Bagger müssen rollen. Heute sehen wir die Bagger rollen. Nach knapp
  einem Jahr sind von den 500 Milliarden Euro bereits 50 Milliarden Euro auf den Weg
  gebracht. Wir bringen also Projekte in unserem Land voran, die gut für die Menschen
  sind: Die Bahnstrecken werden sicherer, und die Bahn wird pünktlicher. Moderne Schulgebäude,
  in die man als Lehrerinnen und Lehrer und auch als Schüler wieder gerne geht und
  sich dort auf den Unterricht konzentrieren kann. Kitas, in die die Eltern die Kinder
  sehr gerne bringen. Wir modernisieren unsere Krankenhäuser, weil Ziel ist, dass
  wir die beste medizinische Betreuung in unserem Land anbieten können. Ich will hier
  aber auch betonen: Es sind nicht nur Investitionen in Straßen, in Brücken, in Gebäude.
  Wir schaffen mit diesem Sondervermögen und mit den Investitionen auch die Grundlage
  für sichere Arbeitsplätze, für neue wirtschaftliche Stärke und für einen Alltag
  in unserem Land, der wieder besser funktioniert und den Zusammenhalt vor Ort stärkt.
  Wir bauen jetzt das Deutschland der Zukunft. Wir – das war in der Bundesregierung
  auch klar – werden das Tempo hochhalten für Bund, Länder und Kommunen. Wir werden
  weiter Druck machen, dass schnell geplant wird, dass investiert und gebaut wird.
  So können wir in Deutschland für die nächsten Jahre einen kräftigen Modernisierungsschub
  schaffen, der unser Land dann auch positiv verändert. Lassen Sie mich ein weiteres
  Thema ansprechen, das sehr wichtig ist. In der kommenden Kabinettssitzung werde
  ich die Reform der Einkommensteuerreform vorlegen, die wir gemeinsam im Koalitionsausschuss
  vereinbart haben. Ja, wir haben knappe Kassen – und ja, wir mussten priorisieren.
  Aber wir haben einen klaren Schwerpunkt gesetzt. Wir wollen, dass Familien entlastet
  werden. Deswegen sieht der Gesetzentwurf vor, dass Familien mit zwei Kindern um
  etwa 600 Euro im Jahr entlastet werden. Das sollte niemand kleinreden. Das ist wichtig
  für Familien, gerade in diesen Zeiten. Der Bundeskanzler hat es angesprochen: Wir
  haben auch über den Hitzeschutz geredet. In diesem Jahr hatten wir eine Rekordhitze.
  Sie wissen, mir war wichtig, dass wir uns intensiv damit befassen, und das haben
  wir heute getan. Es sind 14 000 Hitzetote, die wir in diesem Sommer hatten. Das
  ist nicht nur eine dramatische Zahl; das sind viele persönliche Schicksale. Das
  sind Familien, die trauern. Allein das verpflichtet uns als Bundesregierung zu handeln.
  Wir sehen, dass das Niedrigwasser in unseren Flüssen die Wirtschaft leiden lässt.
  Wir sehen die Folgen für Handel und Logistik, und wir sehen die verheerenden Waldbrände.
  Mein größter Respekt und mein Dank – das will ich hier noch einmal sagen – gilt
  allen Feuerwehrleuten, die über sich hinausgewachsen sind, um diese Brände zu bekämpfen.
  Aus dem Bereich des Finanzministeriums gehört zur Bekämpfung des Klimawandels dazu,
  dass wir massive Investitionen in den Klimaschutz und die Klimaanpassung haben.
  Wir investieren in E-Autos, in klimaneutrale Wirtschaft, in den Ausbau der erneuerbaren
  Energien. Keine Bundesregierung hat je zuvor 100 Milliarden Euro in den Klima- und
  Transformationsfonds gesteckt. Die Investitionen, die an die Länder gegangen sind,
  hat der Bundeskanzler angesprochen. Das sind weitere 100 Milliarden Euro, die an
  die Länder und die Kommunen gehen. Die Mittel können auch für den Bevölkerungs-
  und den Hitzeschutz eingesetzt werden. Es geht jetzt also darum, dass diese Mittel
  schnell und effizient eingesetzt werden. Zum Abschluss lassen Sie mich sagen: Ich
  traue uns zu, dass wir dieses Land aus der schwierigen wirtschaftlichen Lage der
  letzten Jahre herausarbeiten. Investitionen und Reformen, das ist der richtige Kurs.
  Aber klar muss eben auch sein: Wir brauchen eine Geschlossenheit. Alle in dieser
  Koalition wollen das Land voranbringen. Wir müssen dafür die Dinge, die wir auf
  den Weg gebracht haben, gemeinsam umsetzen. Sehr geehrte Damen und Herren, als allererstes
  ein herzliches Dankeschön für die Begleitung dieser Kabinettsklausur. Lassen Sie
  mich an der Stelle auch gleich sagen: Wir haben unsere Regierungsmannschaft hier
  auf der Kabinettsklausur auf die Herausforderungen des Herbstes eingeschworen. Die
  Herausforderungen, was Chancen und Prüfungen gleichermaßen sind, wollen wir gemeinsam
  bewältigen, gemeinsam in dieser Koalition mit CDU , CSU und SPD , mit unserer Regierungsmannschaft.
  Es ist klar, dass sich diese Herausforderungen mit Wachstum, Wohlstand und Widerstandsfähigkeit
  beschreiben lassen. Das ist der Dreiklang, um den es bei unseren Beratungen geht.
  Zum Thema Wachstum haben der Bundeskanzler und der Finanzminister ausgeführt, dass
  wir uns intensiv mit der Frage der künstlichen Intelligenz in der Zukunft unserer
  Wirtschaft beschäftigt haben. Die digitale Kognition und die Umsetzung dieser in
  der Robotik sind die Grundstruktur für eine erfolgreiche Industrie und für erfolgreiches
  industrielles Wachstum. Das Lernen, das Denken, das Problemlösen – ohne Kenntnisse
  in künstlicher Intelligenz werden wir industrielles Wachstum in der Zukunft nicht
  mehr sicherstellen können. Deswegen ist es so entscheidend, dass wir selber fähig
  sind, künstliche Intelligenz zu entwickeln und auch einzusetzen. Das ist Auftrag
  und Aufgabe auch dieser Koalition, dafür zu sorgen, dass wir mit einem klaren Fokus
  auf Entwicklung und Anwendung und auch dem Beherrschen von künstlicher Intelligenz
  neue Wachstumsimpulse in der Wirtschaft setzen. Daraus können wir auch den Wohlstand
  der Zukunft generieren, denn ohne Wachstum gibt es nur Verteilungskämpfe. Mit Wachstum
  gibt es Gestaltungsspielräume. Auch das haben wir eindrücklich besprochen, und wir
  wollen die Gestaltungsspielräume größer machen. Dann geht es um die Widerstandsfähigkeit,
  ohne die Wachstum und Wohlstand heute auch nicht mehr denkbar sind. Anders als in
  vergangenen Jahrzehnten spielt dies eine deutlich größere Rolle zur Sicherung von
  Wachstum und Wohlstand. Wir haben vor einigen Wochen die Gefährdungslage in Deutschland
  angepasst und sind von einer abstrakten Gefährdungslage auf eine hohe Gefährdungslage
  gegangen. Das war begründet. Heute wird das allerorts diskutiert. Deswegen gibt
  es auch Antworten auf diese hohe Gefährdungslage, die regulatorisch sind, die technisch
  sind, die aber auch mit Klarheit und Konsequenz begleitet werden – regulatorisch,
  weil wir im Bereich des Cyber sicherheitsgesetzes bei der IP-Adressenspeicherung
  und automatisierten Datenanalysen vorankommen, aber weil wir auch eine zügige Umsetzung
  der Nachrichtendienstreform vereinbart haben. Wir wollen aus den Nachrichtendiensten
  echte Geheimdienste entwickeln. Das ist Teil dieser Nachrichtendienstreform, die
  ich vorgestellt habe. Wir rüsten technisch weiter auf im Bereich der Drohnenabwehr,
  wir rüsten technisch weiter auf im Bereich des Cyberdomes , und wir schließen Sicherheitslücken
  durch Aufbau bei Polizeikräften und Verfassungsschutz. Es geht um Klarheit, um Konsequenz.
  Wer uns angreift, der muss damit rechnen, dass wir uns zur Wehr setzen. Das gilt
  im Cyber bereich genauso wie außerhalb des Cyber bereichs. Aber der Grundsatz bleibt
  bestehen. Es sind immer Klarheit und Konsequenz, die miteinander verbunden sind.
  Auch darüber sind wir uns einig. Herr Bundeskanzler, Herr Vizekanzler, eine Frage
  an Sie beide: Sie haben jetzt über die Maßnahmen gesprochen, die die Bundesregierung
  anstoßen kann, um die Rahmenbedingungen für die Wirtschaft zu schaffen. Dazu gehört
  aber auch, dass man sich gegen unfairen Wettbewerb schützt. Deswegen hätte ich ganz
  gerne nach China gefragt. Die Automobilhersteller fordern jetzt neue EU -Zölle auch
  gegen Hybridautos aus China. Es gibt die ja schon für Elektroautos. Wären Sie beide
  dafür, dass die EU jetzt diesen Weg geht? Eine kleine Zusatzfrage: Herr Wildberger
  hat gestern gesagt, dass Deutschland bei KI ja auch den dritten oder vierten Platz
  belegen könnte. Ist das eigentlich auch Ihre Ambition oder sollte Deutschland an
  die Spitze streben? Zunächst einmal: Wir haben uns gestern ausführlich mit globalen
  Ungleichgewichten beschäftigt, auch im Vorgriff auf die verabredete Diskussion im
  Europäischen Rat im Oktober. Ich habe das Bundeskabinett gebeten, jetzt kurzfristig
  alle Vorschläge konzentriert zu sammeln und aufzuschreiben, die wir sozusagen im
  Hinblick auf entsprechende Reaktionen erwägen könnten. Wir nehmen zur Kenntnis,
  dass auch die deutsche Industrie offensichtlich ihre Meinung im Hinblick auf diese
  globalen Ungleichgewichte geändert hat. Wir werden uns damit nicht nur befassen,
  sondern wir werden Entscheidungen treffen. Wenn ich „wir“ sage, dann heißt das nicht
  allein das Bundeskabinett. Das können wir nicht. Die Handelspolitik liegt in der
  Verantwortung der Europäischen Union. Aber in der Europäischen Union wird auf eine
  klare deutsche Position gewartet, und die wird es im Oktober geben. Wir sind in
  einem Prozess. Aber dieser Prozess wird auch mit konkreten Vorschlägen abgeschlossen
  werden, die wir dann in die europäische Diskussion einbringen. Was das Thema KI
  betrifft: Wir haben heute Morgen von den Gästen, die wir angehört und mit denen
  wir diskutiert haben, auch gehört – ich sage es mal mit meinen Worten –, das Beste
  ist der Feind des Guten. Wir müssen nicht überall die Besten sein, aber wir müssen
  KI dort nutzen, wo wir sie brauchen, und zwar in der Form, in der wir sie brauchen.
  Es gibt auch einfachere Modelle, die ausreichen, zum Beispiel für große Teile des
  Mittelstandes. Die brauchen nicht die anspruchsvollsten, neuesten, intellektuell
  hervorragendsten Modelle, sondern die brauchen Instrumente, die sie nutzen können
  für ihre Fertigung, für ihre Planung, für ihre Produktion. Insofern hat Karsten
  Wildberger völlig recht. Wir müssen nicht immer nach dem Besten streben. Wir müssen
  nach dem Notwendigen schauen, was wir für unsere Industrie, für den Mittelstand,
  für das Handwerk brauchen. Mein Hinweis geht auch dahin: Dies ist ein Thema für
  alle Unternehmen, wirklich ausnahmslos für alle, nicht nur für Dienstleistungsunternehmen,
  sondern auch für produzierende Unternehmen, egal wie groß sie sind. Künstliche Intelligenz
  ist die vierte industrielle Revolution. Sie ist tiefgreifender als alle drei vorher
  zusammen, und sie geht schneller als jemals zuvor. Insofern werden wir jetzt unsere
  Geschwindigkeit erhöhen, die Anpassungsprozesse entsprechend ausrichten, und wir
  werden die Möglichkeiten, die wir haben, ausschöpfen. Was das Wort Souveränität
  angeht – Lars Klingbeil hat es gerade auch noch mal gesagt –, wollen wir uns so
  weit wie eben möglich von anderen unabhängig machen. Wir suchen nach deutschen Lösungen,
  wir suchen nach europäischen Lösungen. Wir hatten gestern den Vorstandsvorsitzenden
  des Unternehmens Cohere aus Kanada zu Besuch. Wir wollen mit den Kanadiern eng kooperieren.
  Wir suchen Partner auf der Welt, die mit uns auch Werte teilen. Das ist genau die
  Aufgabe, vor der wir stehen und die wir jetzt mit großer Entschlossenheit aufnehmen.
  Deswegen hat Karsten Wildberger völlig recht. – Noch einmal: Das Beste ist der Feind
  des Guten. Wir brauchen das Gute und das Richtige für uns. Ganz kurz nur als Ergänzung.
  Ich habe ja gestern im Kabinett auf der Klausur auch zu China vorgetragen. Ich bin
  vor allem der festen Überzeugung: Wir müssen unsere heimische Wirtschaft, unsere
  Industrie schützen. Ich bin für den freien Handel, und ich bin dafür, dass wir als
  Deutschland immer wieder auf eine regelbasierte Ordnung drängen. Aber wenn wir sehen,
  dass andere nicht nach den Regeln spielen, dann dürfen wir nicht naiv sein. Es geht
  nun darum, die Stahlindustrie, die Automobilindustrie, die chemische Industrie,
  die Pharmaindustrie auch in Deutschland und Europa zu schützen. Wir hatten eine
  sehr ernsthafte Debatte darüber, wo wir besser werden müssen, um uns anders wirtschaftlich
  aufzustellen, aber auch, wie wir uns dem Wettbewerb stellen, vor allem dem unfairen
  Wettbewerb, den wir immer stärker erleben. Insofern haben wir verabredet – der Kanzler
  hat es gesagt –, dass wir zeitnah auch im Kabinett über geeignete Maßnahmen reden
  werden. Ich fand die Debatte gestern sehr konstruktiv. Sie ist sehr offen. Ich würde
  auch behaupten: Sie hat sich weiterentwickelt, wenn man auf die letzten Wochen und
  Monate schaut. Ich habe eine Frage zu dem gemeinsamen Handeln in der Koalition,
  allen voran an Herrn Klingbeil, aber auch an den Bundeskanzler. Es kursierte gestern
  ein Papier zum Thema Zuckersteuer auf Diätgetränke. Was ist denn da jetzt die gemeinsame
  Linie, und was sagt das, Herr Bundeskanzler, über die Koalition aus, wenn solche
  Papiere kursieren, die noch nicht wirklich geeint sind? Das Gemeinsame ist, dass
  wir in der Koalition verabredet haben, dass es eine Zuckersteuer geben wird. Ich
  will auch sagen, mit meiner völligen Überzeugung: Ich stehe dahinter. Das ist wichtig,
  um den Gesundheitsschutz, die Prävention, den Schutz von Kindern in unserem Land
  voranzutreiben. Jetzt haben wir gestern etwas erlebt, das anscheinend dazugehört
  – man muss sich in Berlin daran gewöhnen –, nämlich dass Zwischenstände und die
  Arbeit von Fachreferenten an die Presse weitergegeben werden und dass dadurch öffentliche
  Debatten über Dinge entstehen, die ich noch nie auf meinem Schreibtisch hatte. Sie
  wissen vielleicht auch, dass, als die Kollegin Warken noch Gesundheitsministerin
  war, die eigentlich die Abgabe machen wollte, wir im Finanzministerium gesagt haben:
  Wir übernehmen das, weil wir eben auch die Expertise bei steuerrechtlichen Fragen
  haben. – Aber dort kursieren dann Dinge, und das bringt auf einmal eine Debatte
  ans Laufen. Ich habe das heute klargestellt, das ist meine klare Meinung: Ich werde
  als Finanzminister keine Steuer vorlegen, mit der zuckerfreie Getränke besteuert
  werden. Ich halte das für Quatsch, wenn ich das so offen sagen darf. Deswegen wird
  es das nicht geben. Aber ich finde schon, dass wir denjenigen, die in den Ministerien
  untereinander und miteinander arbeiten, denjenigen, die auch ins Ausland schauen
  – es gibt viele Länder, die eine Zuckersteuer haben, durch die auch Getränke mit
  Süßungsmitteln im Rahmen der Zuckersteuer besteuert werden –, und den Kolleginnen
  und Kollegen in den Ministerien auch die Gelegenheit geben müssen, das fachlich
  miteinander zu diskutieren, ohne dass das Gegenstand der öffentlichen Debatte wird.
  Da ist ein Interesse, das vorhanden ist. Das kann ich auch nachvollziehen. Aber
  am Ende treffe ich als Minister die Entscheidung, was ich vorlege, und ich bin da
  sehr klar: Es wird keine Steuer auf nicht zuckerhaltige Getränke geben. Ich kann
  das eins zu eins unterstreichen. Es ist offensichtlich mittlerweile ein beliebtes
  Spiel, fachliche Erwägungen, die für oder gegen eine bestimmte politische Entscheidung
  sprechen, sofort zum Streit in der Koalition hochzustilisieren und hochzujazzen.
  Das ist grober Unfug. Wir lassen uns natürlich von den Fachleuten in den Ministerien
  beraten, aber am Ende des Tages steht eine politische Entscheidung. Die treffen
  wir gemeinsam, und über dieses Thema gibt es keinen Streit, Punkt. Herr Klingbeil,
  Sie haben gerade das große Investitionsvolumen angesprochen. Gleichzeitig führt
  die hohe Staatsverschuldung auch zu Unsicherheit am Anleihemarkt. Haben Sie nicht
  die Sorge, dass unsere Kreditwürdigkeit sinkt, und was folgt dann daraus? Vielleicht
  eine ganz kleine Zusatzfrage: Herr Merz, Sie haben eben gesagt, am Ende des Jahres
  werde sich die Bilanz sehen lassen können. Vielleicht kann jeder von Ihnen einmal
  ganz kurz skizzieren, was das konkret bedeuten würde. Ab wann kann sich eine Bilanz
  also eigentlich sehen lassen? Ich will gerne antworten. Die Unruhe, die wir gerade
  an den Anleihemärkten, an den Finanzmärkten erleben – wir werden jetzt ab Sonntag
  dann auch das G20 -Treffen der Finanzminister in North Carolina abhalten –, hat
  damit zu tun, dass diese Unsicherheiten vor allem durch den Irankrieg ausgelöst
  worden sind. Wenn Sie auf die Bewertung der Rating agenturen schauen, dann sagen
  die sehr klar: Es ist richtig, dass ihr in Deutschland jetzt in die Infrastruktur
  investiert. Da wird ein Stau an Investitionen aufgeholt, der sich über 20, 25 Jahre
  aufgebaut hat. Die Rating agenturen sagen: Es ist richtig, dass ihr in eure Sicherheit
  investiert. – Ich sage übrigens auch einmal: Es ist etwas, das wir den Bürgerinnen
  und Bürgern in diesem Land schuldig sind, dass wir alles dafür tun, dass wir uns
  vor Putin und allen, die unser Land angreifen wollen, schützen, und dafür muss mehr
  investiert werden. Aber sie sagen eben auch: Neben diesen Investitionen aus dem
  Sondervermögen und neben den Investitionen aus der Bereichsausnahme für Verteidigung
  müsst ihr euren Job machen, damit das Land modernisiert wird, damit die Reform vorangebracht
  wird, damit ihr das Land auf einen Wachstumskurs zurückführt, damit ihr die Bürokratie
  abbaut und die Genehmigungen schneller macht. – Das tun wir. Das war jetzt hier
  Gegenstand der Debatte in den letzten zwei Tagen: Wie können wir durch Innovation
  und durch Bürokratieabbau und durch das Umsetzen der Reformen, die wir bereits beschlossen
  haben, stärker werden? Wenn wir das tun, neben den notwendigen Investitionen, dann
  ist Deutschland auf einem guten Kurs, aber dafür müssen wir in der Regierung hart
  arbeiten. Dann, da bin ich sicher, wird auch die Bewertung der Agenturen sehr gut
  sein. Die Rating agenturen stufen Deutschland nach wie vor und auch ohne negativen
  Ausblick auf das beste Rating ein. Wir haben zurzeit überhaupt keine Schwierigkeiten
  bei der Refinanzierung an den Kapitalmärkten. Ich sehe sie auch nicht kommen. Ich
  sehe allerdings die Notwendigkeit, dass wir das, was wir mit der hohen Verschuldung
  gemacht haben, jetzt in eine Stabilisierung unserer Wirtschaft und in eine Perspektive
  eines höheren Wachstums übersetzen. Ich habe es bei anderer Gelegenheit schon gesagt
  und fühle mich in meiner Einschätzung auch bestätigt: Wir haben die Chance, dass
  im nächsten Jahr, für das Jahr 2027, wieder eine Eins vor dem Komma steht. Welche
  Zahl hinter dem Komma steht, weiß ich nicht, aber wir haben eine Chance, dass wieder
  eine Eins vor dem Komma bei der Entwicklung unseres Bruttoinlandproduktes steht.
  Nun können Sie sagen: Das ist relativ wenig. – Ja, das stimmt. Unser Potenzialwachstum
  ist leider im Augenblick nicht größer. Aber schon ein Wachstum von einem Prozent
  bedeutet eine um knapp 50 Milliarden Euro höhere Wirtschaftsleistung in Deutschland.
  Das ist eine gewaltige Zahl, und die können wir erreichen. Ich werde alles tun,
  was ich tun kann, um diese Chance zu erarbeiten und sie dann auch im Verlauf der
  nächsten Monate zu nutzen. Dies ist die Antwort auf die Zusatzfrage nach der Bilanz:
  Die ist erstens richtig. Zweitens will ich an der Stelle einfach auch einmal den
  Hinweis geben: Wir sind in einer neuen Sicherheitslage. Das, glaube ich, ist etwas,
  das inzwischen alle weitestgehend verstanden haben. Dass wir eine hohe Einigkeit
  darüber haben, auch damit umzugehen und eine Bereitschaft dazu zu haben, war Thema
  auch auf dieser Kabinettsklausur, und wir wollen diese Sicherheitsgesetze, die wir
  für notwendig erachten, auch zügig in diesem Jahr umsetzen. Das sind Sicherheitsgesetze,
  über die wir Jahre – übrigens eigentlich auch Jahrzehnte, muss man sagen – politisch
  gestritten haben, auch zwischen den hier vertretenen Parteien. Dass das heute in
  einer guten Gemeinsamkeit gelingt – in einer Überzeugung, dass es jetzt unter den
  neuen hybriden Bedrohungslagen notwendig ist, diese Sicherheitsgesetze deutlich
  auszubauen, die Fähigkeiten und Maßnahmen deutlich auszubauen, die auch von unseren
  Nachrichtendiensten wahrgenommen werden können –, ist etwas, das die politische
  Handlungsfähigkeit dieser Koalition auch massiv unterstreicht. Damit ist aber die
  hybride Bedrohungslage nicht automatisch erledigt, sondern sie wird uns weiter beschäftigen.
  Wir sind uns dessen bewusst. Die Sabotage, die Spionage, die verdeckten Aktionen
  der, ja, fremden Mächte, und die Mehrzahl ist hier zutreffend, beschäftigen mich
  fast täglich oder täglich und unsere Koalition mit Sicherheit jede Woche. Wir gehen
  davon aus, dass wir die notwendigen Entscheidungen einfach treffen können, um auch
  deutlich zu machen, dass wir ein wehrhafter Staat sind, dass wir Sicherheit bieten
  können, dass wir nicht alles verhindern können, aber dass wir uns einer Vielzahl
  von dem, dem wir gerade an hybrider Bedrohung innerhalb und außerhalb des Netzes
  und des Cyber raums ausgesetzt sind, erwehren können. Es hat schon eine ganz, ganz
  hohe Qualität, wenn eine Koalition in der Lage ist, sich nicht wie in den vergangenen
  Zeiten über Maßnahmen zu streiten, die man zum Schutz des Staates und der Bürger
  erreichen kann, sondern wenn man diese notwendigen Entscheidungen trifft. Wir gehen
  davon aus, dass wir genau in diesem Jahr, auch in diesem Herbst, diese Entscheidungen
  auch entsprechend alle abschließen können und uns wehrhaft zeigen können. Herr Bundeskanzler,
  Sie haben schon vor der Klausurtagung gesagt, dass Sie bei den Reformen Tempo machen
  wollen. Nun hat sich in der Sommerpause Widerstand gegen einen zentralen Teil der
  Rentenreform in Ihrer Partei formiert. Drei Ministerpräsidenten haben sich gegen
  die Abschaffung der sogenannten Rente mit 63 gestellt. Welche Konsequenzen ziehen
  Sie daraus? Sind Sie da zu Kompromissen bereit, oder bleibt es dabei, dass das Reformpaket
  ein Gesamtkunstwerk ist, das nicht verändert werden kann oder soll? Wir haben die
  von uns ja angeforderten Vorschläge der Rentenreformkommission erhalten. Wir haben
  darauf am 3. Juli gemeinsam als Koalition geantwortet, dass wir diese Vorschläge
  in ihrer Gesamtheit auch in ein Gesetzgebungsverfahren geben wollen. Natürlich werden
  jetzt Gesetze geschrieben werden müssen. Aber diese Frage der Frühverrentung haben
  wir im Koalitionsausschuss besprochen, und wir sind uns einig, dass wir alle Anreize
  zur Frühverrentung beenden müssen. Dabei muss es auch bleiben. Das ist ein Kernstück
  der Reform. Es mag Härtefälle geben, über die wir dann sprechen müssen. Aber ich
  will ausdrücklich betonen: Das ist kein Ost-West-Thema. Es gibt auch im Westen eine
  Zahl von Versicherten, die außer der gesetzlichen Rentenversicherung keine Altersversorgung
  haben. Der Anteil dort ist etwas kleiner als im Osten, aber er ist auch im Westen
  vorhanden. Wenn es hier Härtefälle gibt, dann werden wir sie angemessen berücksichtigen.
  Aber der Trend zur Frühverrentung bei einer älter werdenden Gesellschaft muss gestoppt
  werden. Darüber sind wir uns in der Koalition einig, und ich gehe davon aus, dass
  ich auch die Ministerpräsidenten davon überzeugen kann, diesem Weg zu folgen. Denn
  dieser Weg ist auch und ganz besonders im Interesse der Länder, nicht zuletzt der
  Länder im Osten, die ein noch geringeres Arbeitskräftepotenzial als viele Länder
  im Westen haben. Deswegen müssen wir uns hier gemeinsam miteinander über die Interessenlagen
  austauschen. Ich gebe zu: Ich bin über diese Wortmeldung etwas erstaunt gewesen,
  weil sie nach meiner festen Überzeugung auch nicht mit ausreichenden Sachargumenten
  unterlegt war. Aber genau über diese Sachargumente werden wir sprechen, und dann
  werden wir im Herbst diese Reform, so hoffe ich jedenfalls, in zwei Teilen verabschieden.
  Es gibt den rentenrechtlichen Teil, und es gibt die übrigen Teile. Das ist eine
  anspruchsvolle gesetzgeberische Arbeit, aber die Kollegin Bärbel Bas hat auch zugesagt,
  die entsprechenden Entwürfe dazu in Kürze vorzulegen, und dann werden wir über die
  Details beraten. Noch einmal: Es wird keine Eins-zu-eins-Umsetzung geben. Das hat
  es noch nie gegeben. Der Deutsche Bundestag ist souverän in seinen Entscheidungen,
  gegebenenfalls der Bundesrat auch. Aber wir werden hier in der Bundesregierung bei
  diesem Kurs bleiben, den wir uns gemeinsam vorgenommen haben. Sie haben, Herr Merz,
  Herr Klingbeil, den Hitzesommer erwähnt. Bleibt es nun dabei, dass der Hitzeschutz
  hauptsächlich bei Ländern und Kommunen liegt, oder plant die Regierung weitere Maßnahmen
  zum Schutz der Bevölkerung, gemeinsam mit Ländern und Kommunen? Schließen Sie aus,
  dass das Ziel der Klimaneutralität bis 2045 nach hinten verschoben wird? Erst einmal
  hat ja Carsten Schneider, unser Bundesumweltminister, heute auch vorgetragen. Der
  Bundeskanzler hat gesagt, dass es mehrere Kolleginnen und Kollegen waren. Aber natürlich
  gilt auch, wie es im Koalitionsvertrag steht, dass es einen Prüfauftrag zur Gemeinschaftsaufgabe
  gibt. Meine persönliche Bewertung da nur anschließend: Ich halte eine bessere Abstimmung
  zwischen Bund, Ländern und Kommunen auch für richtig, aber ein solcher Vorschlag
  muss dann jetzt auch erarbeitet werden, und dann werden wir dazu eine gemeinsame
  Position finden. Was aber vor allem richtig ist, ist: Wir brauchen Investitionen.
  Wir brauchen Investitionen in soziale Einrichtungen, in Pflegeeinrichtungen, in
  Altenheime. Das ist etwas, das viele Kolleginnen und Kollegen uns auch aus dem Sommer
  und aus den Wahlkreisen zurückgespiegelt haben. Dafür gibt es bestehende Programme,
  und wir werden jetzt mit den Ländern darüber sprechen, wie das Sondervermögen – wir
  haben es gesagt: 100 Milliarden Euro werden an die Länder gehen, 100 Milliarden
  Euro haben wir im Klima- und Transformationsfonds – genutzt werden kann, um hier
  voranzukommen. Am besten ist, wenn man es gemeinsam tut. Was 2045 angeht: Dazu gibt
  es eine klare Aussage im Koalitionsvertrag. Das haben wir besprochen, auch während
  der Koalitionsverhandlung. Wir halten an diesem Ziel fest. Vielleicht darf ich ergänzen,
  dass wir im Kabinett auch über besondere vulnerable Gruppen gesprochen haben. Das
  sind ja ältere Menschen, das sind vor allem alleinstehende Menschen, die wenig Betreuung
  haben, und das sind Kinder. Vielleicht darf ich auch die Kollegin Karin Prien zitieren,
  die darauf hingewiesen hat, dass zum Beispiel in Israel kein Kind in die Schule
  geht, das nicht eine Flasche Wasser dabeihat. Ich nenne dieses Beispiel deshalb,
  weil wir das nicht alles allein vom Staat her lösen können. Wir brauchen auch ein
  hohes Maß an Mitwirkung der Familien, der Menschen in Deutschland. Wir brauchen
  auch gegenseitige Rücksichtnahme. Wir brauchen auch die Einbeziehung gerade von
  alleinstehenden Personen in unser Mitgefühl, in unsere Mitwirkung, unsere Hilfe.
  Gerade wenn man solche Sommer vor sich hat, muss man ausreichend Vorsorge für solche
  Fälle getroffen haben. Andere Länder in Europa haben das in den letzten Jahren auch
  aufgrund ihrer geografischen Lage schneller und besser gemacht als wir. Italien,
  Spanien und Griechenland sind schon länger von solchen Phänomenen betroffen, wie
  wir sie jetzt erleben und häufiger erleben werden. Es geht also auch darum, ein
  bisschen hinzuschauen: Was haben andere Länder in Europa gemacht, wie haben sie
  es besser gemacht, inwiefern sind sie besser vorbereitet? Mit Blick auf besondere
  Gruppen in unserer Bevölkerung müssen wir dann einfach auch ein bisschen aufeinander
  aufpassen, und letztendlich muss in jedem Dorf und in jedem Stadtteil jeder ein
  bisschen dabei mithelfen, dass wir das im gemeinsamen Interesse gut lösen. Vor allem
  an Herrn Klingbeil, aber auch an den Bundeskanzler: Sie haben sich mit Neuhardenberg
  jetzt für den Tagungsort entschieden, an dem Gerhard Schröder seinerzeit seine beiden
  großen Reformklausuren gemacht hat. Ich nehme einmal an, das war eine bewusste Entscheidung.
  Inwieweit würden Sie sagen, dass die Reformen, die Sie für den Herbst vorhaben,
  so etwas wie ein neuer Agendamoment für das Land sein sollen? Wie groß ist Ihre
  Entschlossenheit, mögliche Niederlagen bei Landtagswahlen, die sich daraus ergeben,
  anders als damals durchzustehen bzw. auszusitzen – wie auch immer Sie es formulieren
  wollen? Ich muss jetzt ganz ehrlich sagen: Ich habe gestern viel über die Geschichte
  dieses Hauses gelernt, aber Gerhard Schröder hat man mir verschwiegen. Hat man mir
  verschwiegen. – Ich finde diese historischen Vergleiche immer toll, und das ist
  gut für den Einstieg in Artikel. Wir konzentrieren uns hier aber auf uns selbst
  und auf die Aufgaben, die wir angesichts der wirtschaftlichen Lage im Land und der
  internationalen Lage zu erledigen haben. Wir müssen die sozialen Sicherungssysteme
  fit machen für die Zukunft, und als Finanzminister sage ich: Auch beim Haushalt
  haben wir ein paar Dinge, die wir klären müssen. Darauf konzentrieren wir uns. Aber
  das Miteinander und, ich glaube, auch die Richtung ‑ ‑ ‑ Der Kanzler hat es vorhin
  angesprochen, und ich will das hier auch für mich noch einmal sehr klar sagen: Wir
  hatten sehr motivierende Gäste. Gerade die Gäste aus dem Bereich der Start-ups und
  dem Bereich der Digitalisierung haben uns auch noch einmal die richtige Haltung
  im Mindset mitgegeben und gezeigt: Deutschland kann was; wir müssen jetzt das Beste
  daraus machen und uns in einer durchaus schwierigen Lage, die uns allen etwas abfordern
  wird, zurückkämpfen. Das war die richtige Einstellung. Insofern: Dieser Ort gefällt
  mir sehr gut – andere Orte sind für diese Regierung vielleicht ein bisschen verbrannt –,
  und ich komme gerne wieder hierher. Diese Klausur war jedenfalls sehr erfolgreich,
  und das setzen wir jetzt um. Ganz praktisch: Wir geben Meseberg auf. Wir werden
  vermutlich nicht zum letzten Mal hier sein; denn dieser Ort bietet alles, was wir
  brauchen: eine gute Umgebung, Abgeschiedenheit, Ruhe und eine Geschichte. Diese
  Geschichte reicht weit hinter Gerhard Schröder zurück – weit hinter Gerhard Schröder
  zurück –, und davon lassen wir uns inspirieren. Sie haben vorhin gesagt, dass Sie
  mehr Tempo haben wollen. Wie wollen Sie mehr Tempo in die Gesetzgebungsverfahren
  bekommen? Was sind also die konkreten Maßnahmen, mit denen Sie hier herausgehen,
  sodass die Bürger Ihnen glauben können, dass es jetzt aber wirklich klappen kann?
  Zunächst einmal, habe ich darauf hingewiesen, was wir schon alles gemacht haben,
  und das ist ja nicht wenig. Wir haben in den letzten 15 Monaten bereits eine große
  Zahl von Vorhaben umgesetzt. Ich will nur ein Thema nennen: Am 1. Januar 2027 tritt
  das sogenannte Vorsorgedepot in Kraft. Das ist die grundlegende Reform und die Beseitigung
  aller Fehler, die es bei der sogenannten Riesterrente gegeben hat. Wir fördern die
  Kapitalbildung in der persönlichen Ersparnis der Menschen in Deutschland so sehr
  wie nie zuvor – mit bis zu 540 Euro im Jahr unterstützt, aber mit der Perspektive,
  wirklich Vermögen aufzubauen. Das ist in der öffentlichen Wahrnehmung so gut wie
  untergegangen. Die Fehler von Riester haben dazu geführt, dass ein Drittel der Verträge
  ruhend gestellt werden und niemand mehr daran glaubt, dass er über dieses Modell
  eine wirklich verlässliche, gute Altersversorgung aufbauen kann. Wir haben den Fehler
  korrigiert; das ist beschlossen und tritt am 1. Januar 2027 in Kraft. Alle Banken
  werben im Augenblick bei ihren Kunden für dieses Modell. Ich will als weiteres Beispiel
  noch das Vorhaben nennen, in der gesetzlichen Rentenversicherung eine zusätzliche
  kapitalgedeckte Altersvorsorge in der ersten Säule aufzubauen. Es geht also nicht
  darum – wie in der früheren Regierung vom damaligen Finanzminister vorgeschlagen –,
  einen Kapitalstock anzulegen, dessen Erträge dann in die gesetzliche Rentenversicherung
  fließen. Vielmehr geht es darum, einen individualisierten, eigentumsrechtlich geschützten
  Kapitalstock in allen sozialversicherungspflichtigen Beschäftigungsverhältnissen
  aufzubauen. Das ist wesentlicher Bestandteil der Rentenreform, die wir in diesem
  Herbst verabschieden wollen. Das sind nur zwei Beispiele, mit denen ich einmal darauf
  hinweisen will, dass wir hier wirklich grundlegende Korrekturen vornehmen, zum Beispiel
  eben in der privaten Ersparnis- und Vermögensbildung. Ich halte das für sehr zentral.
  Die Gäste heute Morgen haben auch noch einmal auf die Wirkungen hingewiesen, die
  das nicht nur für die Menschen, sondern auch für die Kapitalversorgung unserer Volkswirtschaft
  hat. Was andere Länder seit Jahrzehnten tun und was wir vor Jahrzehnten hätten tun
  müssen, tun wir jetzt in dieser Koalition. Vieles von dem, was wir beschlossen haben,
  wird in seiner Wirkung natürlich erst mit der Zeit sichtbar. Ich gebe zu, ich habe
  ein bisschen unterschätzt, dass es länger dauert. Ich bin mir mit dieser Koalition
  nach diesen zwei Tagen aber sehr sicher, dass wir mit der Grundausrichtung unserer
  Politik auf dem richtigen Weg sind und dass wir auch die Ergebnisse sehr bald sehr
  viel deutlicher sehen werden als im Augenblick. Von daher: Das sind nur zwei Beispiele
  von vielen anderen, die ich Ihnen geben könnte – und das sind jetzt nur die innenpolitischen
  Beispiele; andere will ich gar nicht erwähnen –, die zeigen: Wir gehen jetzt wirklich
  mit hoher Motivation in die letzten vier Monate des Jahres 2026, aber dann auch
  mit entsprechender Motivation in das Jahr 2027.'
