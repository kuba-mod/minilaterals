title: Fragen und Antworten Was tut die Bundesregierung gegen hybride Angriffe und
  Drohnenvorfälle?
text: 'Zur Verbesserung der Drohnenabwehr hat die Bundesregierung unter anderem eine
  umfassende Reform des Bundespolizeigesetzes auf den Weg gebracht. Der sehr ernst
  zu nehmende Vorfall am Leipziger Flughafen in der Nacht vom 04. auf den 05. August
  zeigt, dass sich Deutschland zunehmend hybrider Bedrohung und Sabotage ausgesetzt
  sieht. Mit vermehrten Drohnenangriffen, Cyberattacken und aggressiven Anschlägen
  unterschiedlicher Ausgestaltung gibt es eine neue Dimension von Bedrohungen. Aber:
  Deutschland ist mit seinen Sicherheitsbehörden vorbereitet und hat bereits wichtige
  Maßnahmen zur Bekämpfung solcher Angriffe getroffen. Die aktuelle Lage wird fortlaufend
  sehr aufmerksam verfolgt. Am 07. August trat zu den Ereignissen am Flughafen Leipzig/Halle
  der Nationale Sicherheitsrat unter Vorsitz des Bundeskanzlers telefonisch zusammen.
  Nachstehend finden Sie einige Antworten zur aktuellen Gefährdungslage in Deutschland
  sowie zu Gefahren von Drohnenangriffen, hybrider Bedrohung und deren zielgenauer
  und konsequenter Bekämpfung. Nach Einschätzung von Bundesinnenminister Dobrindt
  handelt es sich bei dem Fund einer mit Sprengstoff bestückten Drohne am Leipziger
  Flughafen um einen „sehr ernsten sicherheitsrelevanten Vorfall“ und eine „neue Gefahrenqualität“.
  Das Bundesinnenministerium hatte bereits zuvor die bislang „abstrakte“ Bedrohungslage
  für Deutschland in eine „hohe“ geändert. Demnach ist aktuell jederzeit mit dem Risiko
  von Anschlägen zu rechnen. Grund für die Hochstufung sind wesentlich vermehrte Hinweise
  auf eine höhere Gefahr, sowohl von befreundeten Geheimdiensten als auch aus eigenen
  Erkenntnissen. Eine „konkrete“ Bedrohung für Bürgerinnen und Bürger besteht derzeit
  allerdings nicht. Im März 2026 ist das „ KRITIS-Dachgesetz “ in Kraft getreten.
  Es soll den Schutz kritischer Infrastruktur vor allem in folgenden Bereichen verbessern: Energie,
  Transport und Verkehr, Finanz- und Versicherungswesen, Gesundheit, Trinkwasser,
  Abwasser, Siedlungsabfallentsorgung, Informationstechnik und Telekommunikation,
  Ernährung, Weltraum sowie Öffentliche Verwaltung. Mit dem Gesetz werden die bestehenden
  Regelungen im Bereich der IT -Sicherheit kritischer Infrastrukturen ergänzt. Zudem
  wird bundesweit festgelegt, welche Unternehmen und Einrichtungen Teil der kritischen
  Infrastruktur sind. Die Einrichtung muss hierzu essenziell für die Gesamtversorgung
  in Deutschland sein und mehr als 500.000 Personen versorgen. Darüber hinaus werden
  bundeseinheitliche und sektorübergreifende Mindeststandards für den physischen Schutz
  der kritischen Infrastrukturen durch die Betreiber festgelegt. Das können zum Beispiel
  Notfal lteams , ein stärkerer Objektschutz und Maßnahmen zur Ausfallsicherheit sein.
  Eine Grundlage hierfür sind Risikoanalysen und Risikobewertungen, die von den zuständigen
  staatlichen Stellen erarbeitet und den Betreibern zur Verfügung gestellt werden.
  Zudem ist eine Meldepflicht für Vorfälle vorgesehen. In Deutschland gibt es immer
  mehr illegale Drohnenflüge über sogenannte kritische Infrastruktur. Ihre Zahl ist
  besonders seit Beginn des Angriffskrieges Russlands gegen die Ukraine angestiegen.
  Viele dieser illegalen Vorfälle werden mutmaßlich auch von ausländischen staatlichen
  Akteuren zu Spionage- und Sabotagezwecken in Deutschland gesteuert. Die Bundesregierung
  hat eine umfassende Reform des Bundespolizeigesetzes auf den Weg gebracht und die
  Befugnisse der Bundespolizei bei der Drohnenabwehr ausgeweitet. Mit den Änderungen
  im Zweiten Gesetz zur Änderung des Luftsicherheitsgesetzes soll die Drohnenabwehr
  weiter verbessert werden. Mit der Eröffnung des Gemeinsamen Drohnenabwehrzentrums
  (GDAZ) am 17. Dezember 2025 bündeln Bund und Länder erstmals ihre Kräfte zur Abwehr
  von Drohnen. Das GDAZ ist als gemeinsame Koordinierungsstelle der Polizeien von
  Bund und Ländern, des Bundeskriminalamts, der Bundespolizei sowie der Bundeswehr
  eingerichtet. Es ist bei der Bundespolizeidirektion angesiedelt und ist eine zentrale
  Plattform zur Bündelung der deutschen Drohnenabwehrkompetenzen. Bundesinnenminister
  Alexander Dobrindt : „Mit dem Gemeinsamen Drohnenabwehrzentrum schaffen Bund und
  Länder einen starken Pfeiler unserer Sicherheitsarchitektur. Behörden arbeiten hier
  Hand in Hand, Kompetenzen werden gebündelt, Lagebilder verzahnt. So erhöhen wir
  Tempo und Treffsicherheit im Kampf gegen hybride Bedrohungen, Sabotage und gezielte
  Provokationen.“ Das GDAZ wird rund um die Uhr betrieben und ist darauf ausgelegt,
  kurzfristig und koordiniert auf Gefährdungen der Sicherheitslage zu reagieren. Es
  bündelt die fachliche Expertise von Bund und Ländern und schafft einen festen Rahmen
  für kontinuierlichen Austausch, gemeinsame Lagebewertung und abgestimmtes Handeln
  in der Drohnenabwehr. Die Entscheidungskompetenzen der beteiligten Behörden bleiben
  dabei unberührt. Das Zentrum setzt vielmehr auf ein kooperatives Zusammenwirken.
  Angesichts der kurzen Innovationszyklen im Drohnenbereich verfolgt das GDAZ eine
  technologieoffene und zukunftsorientierte Beschaffungs- und Entwicklungsstrategie.
  Zugleich fördert das Gemeinsame Drohnenabwehrzentrum die enge Vernetzung mit relevanten
  Partnerinstitutionen, Forschungseinrichtungen und Sicherheitsakteuren. Es bringt
  sich aktiv in nationale, europäische und internationale Netzwerke ein – für eine
  leistungsfähige, moderne und resiliente Drohnenabwehr in Deutschland. Bundesinnenminister
  Dobrindt sprach in Zusammenhang mit dem Drohnenfund am Leipziger Flughafen von einem
  „hybriden Anschlagsszenario“. Hybride Bedrohungen bezeichnen koordinierte, illegitime
  Handlungen staatlicher und staatlich gelenkter Akteure zur Durchsetzung eigener
  Interessen zum Nachteil eines anderen Staates, die außerhalb des Rahmens eines konventionellen
  militärischen Angriffs bleiben. Hybride Bedrohungen betreffen alle politischen und
  gesellschaftlichen Ebenen. Dabei können verschiedene Mittel kombiniert werden –
  zum Beispiel diplomatische, militärische, wirtschaftliche oder technologische, sodass
  eine koordinierte Kampagne entsteht. Die Lage in Deutschland und Europa ist angespannt:
  Spionage, Sabotage, Desinformation und Cyberattacken stellen weiterhin eine erhebliche
  Bedrohung dar. Fremde Staaten versuchen zudem, in unzulässiger Weise Einfluss auf
  Politik, Wirtschaft und Gesellschaft in Deutschland zu nehmen. Das Thema hybride
  Bedrohung wird deshalb ausdrücklich im sicherheitspolitischen Dachdokument der Bundesregierung,
  der ersten Nationalen Sicherheitsstrategie, benannt. Dort wird ausgeführt: „Wir
  leben in einem Zeitalter wachsender Multipolarität und zunehmender systemischer
  Rivalität. Wie wir bekennt sich die ganz überwiegende Zahl von Staaten zur Charta
  der Vereinten Nationen und einer freien internationalen Ordnung auf der Grundlage
  des Völkerrechts. Geprägt von ihrer Auffassung von systemischer Rivalität streben
  einige Staaten jedoch an, diese Ordnung zu untergraben und so ihre revisionistischen
  Vorstellungen von Einflusssphären durchzusetzen.“ Um zukünftig noch besser gegen
  hybride Bedrohungen gewappnet zu sein, hat Bundesinnenminister Dobrindt am 16. Juni
  2026 gemeinsam mit Vertreterinnen und Vertretern von Sicherheitsbehörden des Bundes
  und der Länder das Gemeinsame Zentrum zur Abwehr hybrider Bedrohungen (GAZ Hybrid)
  eröffnet. Das Ziel von GAZ Hybrid ist es, Spionage, Sabotage, Desinformation und
  weitere Formen hybrider Bedrohungen zu erkennen und zu bekämpfen. Bei der Abwehr
  von Drohnen ist zwischen der Neutralisierung von privaten und gewerblichen Drohnen
  und der Abwehr von staatlichen oder militärischen Drohnen zu differenzieren. Für
  die Abwehr aller privaten/kommerziellen Drohnen, deren Einsatz sich nicht zweifelsfrei
  einem ausländischen Staat zurechnen lässt, sind grundsätzlich die Landesbehörden
  auf ihrem Hoheitsgebiet für die Gefahrenabwehr zuständig. Dagegen ist die Bundespolizei
  zuständig, wenn sich Drohnen auf oder über Bahnanlagen des Bundes oder Flughäfen
  befinden. Die Bundeswehr kann im Rahmen der Amtshilfe zur Unterstützung der Polizei
  auch im Bereich der polizeilichen Gefahrenabwehr im Inneren tätig werden. Ebenso
  gilt dies bei der Abwehr von staatlichen oder militärischen Drohnen zur militärischen
  Eigensicherung oder im Verteidigungsfall.'
