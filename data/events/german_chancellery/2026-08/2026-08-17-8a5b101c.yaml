date: '2026-08-17'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 17. August um 2026
text: 'stellvertretender Regierungssprecher Hille (Vorsitzende Wolf eröffnet die Pressekonferenz
  und begrüßt SRS Hille sowie die Sprecherinnen und Sprecher der Ministerien.) Ich
  habe zwei Themen vorab, zu denen ich kurz etwas sagen will. Das eine hat eine negative
  Ursache. Das andere ist etwas äußerst Positives. Zu dem Negativen zuerst: Sie haben
  ja alle mitbekommen, dass es in Deutschland bedauerlicherweise an verschiedenen
  Stellen eine Reihe von Waldbränden gab und gibt. Glücklicherweise sind überall in
  Deutschland in den letzten Tagen Tausende Einsatzkräfte im Einsatz gegen die Flammen
  gewesen. Ich möchte hier die Gelegenheit nutzen, im Namen der Bundesregierung und
  auch des Bundeskanzlers den Helferinnen und Helfern ganz herzlich zu danken. Durch
  den starken Einsatz der Männer und Frauen von Feuerwehr, THW, Polizei, Bundeswehr
  und anderen Institutionen ist es gelungen, Schlimmeres zu verhindern. Dafür gilt
  ihnen unser großer Dank. Allen, bei denen die Flammen noch nicht endgültig bekämpft
  sind, noch gutes Durchhalten. Herzlichen Dank für den großen Einsatz! Dann, Stichwort
  Positives, zum Thema Sport: Es liegen Tage von großen, tollen sportlichen Leistungen
  hinter uns. Nur zur Erinnerung: Es gab Leichtathletik, Turnen, Schwimmen, Rudern
  und Parajudo. ‑ Auch hierbei möchte ich die Gelegenheit nutzen, allen Sportlerinnen
  und Sportlern für den Einsatz bei den Wettkämpfen zu danken und natürlich den Medaillengewinnerinnen
  und Medaillengewinnern im Namen der Bundesregierung und des Bundeskanzlers ganz
  herzlich zu gratulieren. Es sind tolle Leistungen. Es hat uns große Freude bereitet.
  Auf weiterhin so gute, erfolgreiche sportliche Wettkämpfe! Außenminister Wadephul
  reist am Mittwoch in die Schweiz . In Bern trifft der Außenminister seinen Amtskollegen
  Ignazio Cassis zu politischen Gesprächen und nimmt als Gast an der jährlichen schweizerischen
  Botschafterkonferenz teil. Dort wird Außenminister Wadephul eine Rede halten und
  im Anschluss bei einer Paneldiskussion mit den Botschafterinnen und Botschaftern
  der Schweiz zur Verfügung stehen. Mit der Schweiz verbinden uns gerade wegen der
  gemeinsamen Sprache und Grenze enge Beziehungen, die wir weiter ausbauen wollen.
  Dabei geht es auch um eine noch engere Zusammenarbeit. Mit unserem engen Partner
  Schweiz tauschen wir uns natürlich auch zu allen Themen der aktuellen internationalen
  Politik aus. Das Ganze dürfte im Anschluss an die Gespräche in Bern Gegenstand einer
  Pressekonferenz sein, die dort am Nachmittag geplant ist. Herr Hille, Sie haben
  eben die Waldbrände angesprochen. Besteht aus Sicht der Bundesregierung bei den
  Waldbränden ein Zusammenhang mit dem Klimawandel? Ich überlege, von welcher Seite
  ich diese Antwort anfahre. ‑ Wir haben ja in der vergangenen Woche hier intensiv
  über das große Thema von Klimaveränderung, Klimawandel und auch Klimaanpassung gesprochen.
  Ich bin auch bereit und gehe davon aus, dass wir auch heute hier noch intensiver
  dazu sprechen werden. Was wir alle miteinander, glaube ich, wahrnehmen, ist, dass
  sich klimatische Bedingungen und Folgen daraus verändert haben. Das betrifft das
  Thema der Waldbrände und der Trockenheit. Das betrifft das Thema der Wasserstände
  sowohl im Grundwasser und in der Landwirtschaft als auch natürlich auf den Verkehrswegen.
  All das ist uns bewusst, nicht erst seit gestern. Aber ‑ auch darüber haben wir
  hier in der vergangenen Woche gesprochen ‑ all das sind natürlich keine Themen,
  bei denen man einen Schalter umlegen kann, und von heute auf morgen sieht die Welt
  plötzlich anders aus, sondern es ist natürlich ein großes Thema, das die gesamte
  Bundesregierung betrifft, das die gesamte Gesellschaft betrifft, das, wenn man so
  will, natürlich die gesamte Welt betrifft. Es geht darum, die besten Lösungen zu
  finden, um erstens den Klimawandel bestmöglich zu bekämpfen. Ich habe hier auch
  vergangene Woche den Bundeskanzler aus der Sommer-PK zitiert. Das kann ich auch
  gern noch einmal machen. Ich weiß nicht, ob Sie dabei waren. Es geht natürlich außerdem
  darum, die nötigen Maßnahmen zu treffen, was das Thema der Klimaanpassung angeht.
  Wie gesagt: Erwartungsmanagement. All das sind keine Sachen, bei denen man einen
  Schalter umlegt, und morgen sieht alles wieder anders aus. Aber es sind Herausforderungen,
  auf die wir uns als Gesellschaft und damit natürlich auch als Politik einstellen
  müssen oder weiterhin einstellen müssen. Das tun wir. Ich kann alles, was der Regierungssprecher
  gesagt hat, unterstreichen und ergänze gern: Es geht bei der Frage von Waldbränden
  einmal darum, wer den Brand legt. Aber es geht auch darum, wie gut der Wald hinterher
  brennt. Dabei ist völlig klar, dass die Wahrscheinlichkeit, dass der Wald sehr brennbar
  ist, mit dem Klimawandel durch die Dürre, durch die Trockenheit, die sich dann ausbreitet,
  steigt. In Belgien ist es ein Hochmoor, das in weiten Teilen trockengelegt wurde.
  Brände trockengelegter Moore sind ganz besonders schwer zu löschende Brände, weil
  es Schwelbrände unter der Oberfläche sind. Deswegen hat zum Beispiel auch die Wiedervernässung
  von Mooren, die wir vorantreiben, neben vielen anderen Vorteilen auch den Vorteil,
  Moore besser vor solchen Bränden zu schützen. Es ist ja aufgefallen, dass sich Herr
  Merz in den vergangenen Tagen trotz Urlaub immer mal wieder zu verschiedenen Themen
  geäußert hat: Kolumbien und Mauerbau. Sie haben eben gesagt, dass er auch den Feuerwehrleuten
  gedankt hat. ‑ Aber es fällt ja doch auf, dass er sich zu Hitze oder Klimawandel
  bisher nicht geäußert hat. Wissen Sie, woran das liegt? Ich hatte gehofft, es quasi
  schon durch meine einleitenden Ausführungen deutlich zu machen: Im Gegensatz zum
  Dank an Einsatzkräfte oder auch zur Gratulation an Medaillengewinner kann man beim
  Thema der Hitze jetzt nicht einfach einen Schalter umlegen und sagen: Ich tue jetzt
  dies, und morgen ist das Problem gelöst. ‑ Es ist ein großes, dauerhaftes und nicht
  punktuell auftretendes Thema. Das unterscheidet es von anderen Ereignissen, die
  jetzt in den vergangenen Wochen stattgefunden haben. Dieses Thema stand, steht und
  wird weit oben auf der Agenda nicht nur der Bundesregierung und der Politik, sondern
  der Gesellschaft stehen. Aber noch einmal ‑ Stichwort: Erwartungsmanagement ‑: Es
  gibt dabei keine einfachen und schnell wirksamen Lösungen. Es ist ja auch nicht
  so, dass uns erst jetzt bewusst wird ‑ das gilt wahrscheinlich für uns alle ‑, dass
  es Folgen gibt, wenn sich das Klima verändert. Von daher ist es nicht total überraschend.
  Darauf will ich hinaus. Wir haben ja auch schon ganz vieles eingeleitet. Sie wissen,
  nur als ein Beispiel ‑ der Kollege Fichtner kann es dann viel ausführlicher tun ‑,
  dass wir bei der Energieversorgung in Deutschland auf einem guten Pfad sind, sie
  klimaneutral umzustellen. Es gibt Zuwachsraten bei den erneuerbaren Energien. Ich
  will Sie damit nicht im Detail langweilen. Das soll heißen, dass es ein Thema ist,
  das nicht neu auf die politische Agenda gekommen ist, auch wenn in den vergangenen
  Wochen durch verschiedene Ereignisse eine besondere Wahrnehmung gefunden hat. Aber
  das Thema ‑ das habe ich eingangs schon gesagt ‑ stand, steht und wird weit oben
  auf der politischen Agenda bleiben. Zunächst einmal eine Frage an das Finanzministerium:
  Vizekanzler und Finanzminister Klingbeil hat sich ja wie andere SPD-Kabinettsmitglieder
  dem Vorstoß des Umweltministers angeschlossen und fordert auch eine Grundgesetzänderung
  für Klimaanpassung , Hitzeschutz etc. Vielleicht können Sie einmal erklären, was
  genau er damit verbindet. Hat er die Erwartung, dass es jetzt noch innerhalb dieser
  Legislaturperiode passiert, oder ist es vor allem eine Positionierung der SPD? Ich
  kann zunächst für das Bundesfinanzministerium sagen, dass es aus Sicht des Bundesfinanzministers
  sehr wichtig und dringlich ist, den Folgen des Klimawandels mit wirksamen Maßnahmen
  zu begegnen. Das hat er gestern noch einmal deutlich gemacht. Das Ziel ist, die
  Länder und Gemeinden dabei zu unterstützen, vor Ort wirksame Maßnahmen für einen
  besseren und vorausschauenden Umgang mit Hitze, mit Niedrigwasser und mit anderen
  Folgen des Klimawandels treffen zu können. Das BMF kann sich dabei in Abstimmung
  mit den zuständigen Ressorts vor allem vorstellen, Maßnahmen zur Klimaanpassung
  und zum Hitzeschutz auch aus dem Sondervermögen für Infrastruktur und Klimaneutralität
  zu finanzieren. Für die Ausgestaltung der einzelnen Programme sind die jeweiligen
  Ressorts zuständig. Ich kann gern ergänzen, was wir uns davon versprechen: Es geht
  nicht nur um Geld. Es geht auch um eine bessere Abstimmung und mehr Effektivität,
  damit die Maßnahmen von Bund, Ländern und Kommunen aus einem Guss möglich werden,
  zum Beispiel wenn es darum geht, Menschen vor Hitze zu schützen, gerade die Senioren
  und die Kinder, die besonders stark betroffen sind. Das kann über Warnsysteme, über
  Kühlräume funktionieren, also einfach Meldestrukturen und Abstimmungen innerhalb
  von Kommunen. Es geht um bauliche Maßnahmen, also wie man Gebäude oder auch Städte
  so umbauen kann, dass sie Hitze erträglicher machen: Schatten, Bäume, Jalousien,
  Entsiegelung. Es geht um natürliche Maßnahmen: Wie kann man Wasser in den Regionen
  halten? Wie kann man Landschaften als Schwämme aufbauen, damit das Wasser nicht
  abfließt, sondern gehalten wird? ‑ Es gibt überall im Land gute Antworten darauf.
  Es gibt viele gute Beispiele. Jetzt geht es darum, voneinander zu lernen und das
  zum Standard zu machen. Dabei kann solch eine Grundgesetzänderung zu mehr Struktur
  beitragen. Momentan dürfen wir nur in Ausnahmefällen aktiv werden, zum Beispiel
  bei Modellprojekten. Das wirft natürlich die Frage auf, was noch ein Modellprojekt
  ist und was ist schon Standard ist. Das Ziel muss aber sein, dass wir insgesamt
  standardmäßig fit im Umgang mit dem Klimawandel werden. Das könnten wir sehr viel
  strukturierter, wenn Bund, Länder und Kommunen regulär zusammenarbeiten könnten.
  Es gibt dabei schon sehr konstruktive Gespräche. Das haben wir mit dem Kreis der
  BPK hier auch letzte Woche geteilt. Alle 16 Umweltministerinnen und ‑minister der
  Bundesländer haben uns als Bund bei der Umweltministerkonferenz im Mai aufgefordert,
  diese Grundgesetzänderung voranzutreiben. Sie ist also ein überparteiliches Anliegen
  auf Ebene der Umweltministerien. Jetzt gibt es weitere, konkrete Schritte, was Formulierungen
  angeht. Es reicht nicht, einfach nur das Wort „Klimaanpassung“ hineinzuschreiben.
  Es muss genauer eingegrenzt werden, um auch die nötige juristische Eindeutigkeit
  herzuleiten. Dafür gibt es eine Bund-Länder-Arbeitsgruppe, die sich genau darum
  kümmert. Ziel ist, dass der Vorschlag, den diese Arbeitsgruppe dann erarbeitet,
  im November in die Umweltministerkonferenz eingebracht wird. Sie muss nicht der
  einzige Kanal sein, über den man es bespricht. Aber es ist schon ein sehr relevanter.
  Es zeigt, dass die Arbeiten daran gut vorangehen und unterschiedlichste Akteure
  eingebunden sind. Herr Hille, Grundgesetzänderungen sind in dieser Legislaturperiode
  ja nicht ganz unkompliziert. Deswegen wüsste ich ganz gern, ob der Kanzler dieses
  Vorgehen unterstützt. Gibt es innerhalb der Bundesregierung überhaupt eine Chance,
  dass es umgesetzt wird? Zur Größe und Bedeutung des Themas verweise ich auf das,
  was ich gerade auf die Frage des Kollegen schon gesagt habe. Ich wiederhole es nicht
  noch einmal. Ich verweise auch auf das, was wir hier in der vergangenen Woche dazu
  besprochen haben und verweise aber auch darauf ‑ das haben Sie jetzt wahrscheinlich
  auch auf dem Schirm ‑, dass ein entsprechender Prüfauftrag auch schon im Koalitionsvertrag
  steht. Ein Prüfauftrag für eine Grundgesetzänderung. Das steht im Koalitionsvertrag,
  genau. ‑ Wie es in einer Koalition so ist, spricht man in der Koalition darüber,
  wenn es Impulse und Ideen und Vorschläge gibt, denn die Bedeutung des Themas ist
  allen bewusst. Darauf würde ich eigentlich noch viel mehr den Fokus legen. Herr
  Fichtner hat gerade einen Teil davon skizziert. Natürlich betrifft es nicht nur
  die Politik im Bund. Es betrifft alle politischen Ebenen, die Kommunen, die Länder
  und den Bund. Das alles muss in engem und gutem Miteinander bearbeitet werden, denn
  nur dann können diese Dinge erfolgreich sein. Wir haben hier auch schon darüber
  gesprochen ‑ es war nicht vergangene Woche, sondern, glaube ich, in der Woche davor ‑,
  dass wir in Deutschland ja zu Recht und auch aus guten Gründen einen föderalen Staatsaufbau
  mit ganz unterschiedlichen Aufgaben und Zuschreibungen haben. Das folgt dem Ziel,
  dass die Aufgaben dort am besten erledigt werden, wo sie am besten erledigt werden
  können, also Dinge, die Kommunen betreffen, erst einmal in den Kommunen und mit
  Hilfe der Länder und des Bundes. Das alles muss zusammen interagieren und gut miteinander
  funktionieren. In diese Richtung zielt ja auch der Vorschlag des Bundesumweltministers.
  So habe ich gerade auch die Ausführungen des Kollegen Fichtner verstanden. Darüber
  wird in der Bundesregierung zu sprechen sein. Ob das dann der mehrheitlich getragene
  richtige Weg ist oder ob man zum Ergebnis kommt und sagt, dass es vielleicht auch
  andere Wege sind ‑ ‑ ‑ Aber der Kollege Fichtner hat ja gerade geschildert, wie
  die Sachlage ist. Der Kollege hat schon alles zum Grundgesetz gefragt. Ich frage
  dazu: Was könnte man vielleicht darunter noch tun, wenn man sich die einzelnen Ministerien
  anschaut, in denen man ja auch schon Klimaanpassungsmaßnahmen in der Ministeriumsarbeit
  verankern könnte, beispielsweise im Gesundheitsministerium oder Bauministerium,
  indem man dabei Maßstäbe anpasst. Könnten Sie sich unabhängig davon vorstellen,
  Bestrebungen anzugehen, Hitzeschutz mehr in der täglichen Arbeit zu verankern? Auch
  wir haben uns hier in den letzten Wochen und fast schon Monaten häufig zum Thema
  des Hitzeschutzes geäußert. Ich kann es gern ganz kurz wiederholen: Generell nehmen
  wir als BMG natürlich auch die gesundheitlichen Auswirkungen extremer Wetterereignisse
  sehr ernst. Wir unterstützen die Länder und Kommunen, damit die Menschen besser
  vor den Folgen von Hitze geschützt werden können. Wie gesagt, haben wir uns in den
  vergangenen Wochen schon häufig und auch ausführlich dazu geäußert. Darauf würde
  ich verweisen. Die Ministerin hat sich auch heute noch einmal zu dem Thema geäußert.
  Sie hat gesagt, dass eine Stadt, die Wasser hält und Schatten spendet, am Ende die
  lebenswertere ist und dass wir Klimaanpassungen dort jetzt verankern wollen. Wir
  haben ja gerade im Sommer in einer Sitzung des Bundeskabinetts die Novelle des Baugesetzbuches
  verabschiedet. Sie ist jetzt gerade zur Beratung im Deutschen Bundestag. Damit wollen
  wir den Kommunen auch mehr Handlungsspielräume dafür geben, Verschattungen zu schaffen,
  Grünflächen zu schaffen und Wasser in den Städten zu schaffen, gerade wenn es um
  Neubau geht. Das ist ein ganz entscheidender Punkt. Darüber hinaus gibt es auch
  schon länger weiterführende Maßnahmen. Ich verweise darauf, dass wir vor zwei Jahren
  eine Hitzeschutzstrategie veröffentlicht haben. Darin sind vor allem auch Best-Practice-Beispiele
  aufgeführt, wie Städte Maßnahmen zur Klimaanpassung schaffen können. Es gibt auch
  die Städtebauförderung in Höhe von einer Milliarde Euro jährlich, in der Klimaanpassung
  in den Städten eine Fördervoraussetzung ist. Es gibt auch noch ein Programm für
  Anpassung urbaner Räume an den Klimawandel, für das wir gerade eine nächste Tranche
  von 80 Millionen Euro ausgeschrieben haben, in dem es eben auch um Klimaanpassung
  in den Städten geht. Ich kann auch gern noch zwei Beispiele aus dem Bereich der
  Natur nennen, die hierbei eine wichtige Verbündete ist, sowohl beim Klimaschutz
  als auch bei der Klimaanpassung: Wälder und Moore. Wälder umzubauen, ist ein großer
  Schwerpunkt unserer Arbeit. Wir arbeiten derzeit auch an einer Weiterentwicklung
  des Förderprogramms dazu. Denn umgebaute Mischwälder sind einfach sehr viel bessere
  Wasserspeicher, sehr viel weniger anfällig für Waldbrände als Monokulturen. Das
  Thema der Wiedervernässung von Mooren, das ist auch ein Paradigmenwechsel, den wir
  gerade anstreben. Über Jahrhunderte wurden Moore entwässert. Das hat damals seinen
  Sinn gehabt. Aber jetzt merken wir, dass es gravierende Nebenwirkungen hat, weil
  einfach das Wasser fehlt. Deswegen wird jetzt wieder so umgebaut, dass Moore wieder
  vernässt werden können. Wir merken, dass es dafür eine große Akzeptanz auch bei
  Landwirten gibt, weil sie auch merken, dass es ihnen besser tut, weil sie für ihre
  wichtige Arbeit eben auch auf Wasser angewiesen sind. Insofern gibt es tatsächlich
  große, auch im historischen Maßstab, Paradigmenwechsel im Bereich der Wälder und
  Moore, die auch als Antwort funktionieren. Sie sehen aus dem, was die Kolleginnen
  und Kollegen jetzt gerade ‑ es sind ja sozusagen immer nur kurze Spotlights auf
  Einzelaspekte dieses Themas ‑ ‑ ‑ Ich möchte dem Eindruck vorbeugen, es sei ein
  Thema, das jetzt ganz neu sei. Der Eindruck kommt immer wieder auf. Das ist natürlich
  mitnichten so, sondern aus all den Äußerungen wird ja deutlich, dass dieses Thema
  bereits seit vielen Jahren auf der politischen Agenda ist und an ganz unterschiedlichen
  Stellen bearbeitet wird und es auch ein stetiger Prozess ist. Dadurch, dass sich
  Verhältnisse ändern, muss Politik damit dann wieder neu umgehen, wie es der Kollege
  Fichtner gerade beispielsweise zu den Mooren geschildert hat. Auch das sind keine
  Prozesse, bei denen man einen Schalter umlegt, und morgen ist es dann anders, sondern
  es sind Dinge, die über viele Jahre laufen. Genau daraus nähert man sich dem Zustand
  an, dass das, was der Klimawandel an Folgen für unsere Gesellschaft mit sich bringt,
  besser erträglich wird, weil wir besser damit umgehen können. Ich entnehme, dass
  das Thema nicht neu ist. Alle haben sich schon einmal damit beschäftigt. Ich möchte
  verstehen, wie wichtig es ist, jetzt auch das Grundgesetz zu ändern, um dabei vielleicht
  noch mehr Tempo hereinzubringen, wenn das Thema schon ewig da ist. Alle arbeiten
  ein bisschen daran. Wie wichtig und entscheidend wäre dieser Schritt der Grundgesetzänderung,
  oder braucht man es nicht, weil es ja sowieso bearbeitet wird? Ich verstehe Ihr
  Bedürfnis: ja, nein, Daumen herauf, Daumen herunter. Aber das ist nicht der Angang.
  Wir haben ja versucht, zu schildern, wie wir mit diesem Thema umgehen. Ich habe
  zum Thema des konkreten Vorschlags der Grundgesetzänderung gesagt, dass wir ihn
  in der Bundesregierung besprechen, so wie es in solchen Fällen üblich ist, auch
  bei anderen Themen. Dann gibt es Impulse, sie werden besprochen, und dann gibt es
  nach dem Besprechen eine Lösung. Ich bin guter Dinge, dass es auch bei diesem Thema
  genauso stattfinden wird. Herr Hille, ich entnehme daraus, dass es nicht ausgeschlossen
  ist, dass die Bundesregierung zu dem Schluss kommt, das Grundgesetz ändern zu müssen.
  Ich würde es als spekulative Frage bezeichnen, im Sinne von „Was wäre, wenn …?“
  oder „Ist ausgeschlossen, dass …?“. Ich habe dem, was ich gerade dazu gesagt habe,
  nichts Weiteres hinzuzufügen. Es wird in der Bundesregierung besprochen. Das ist
  das, was ich heute hier sagen kann und nicht: Daumen herauf, Daumen herunter. Ich
  habe noch eine Frage an das Finanzministerium. Sie haben es vorhin schon angedeutet.
  Aber was würde Ihr Haus vorschlagen, wenn das Grundgesetz geändert würde? Wie würde
  diese Klimaanpassung zusätzlich bezahlt werden, aus welchem Topf, mit welchem Geld?
  Das ist ja doppelt hypothetisch. Dazu kann ich heute noch keine Stellung nehmen.
  Alles, was ich sagen kann, ist, dass mit der Formulierung im Grundgesetz die Grundlage
  dafür gelegt würde, dass man den Bund mehr beteiligen könnte. Über die genauere
  Ausgestaltung kann ich Ihnen heute noch nichts sagen. (zu Waldbränden ) Herr Hille,
  anders als der Bundeskanzler es ja bei seiner Sommer-PK am 15. Juli angekündigt
  hatte, fragen sich trotzdem viele, warum er sich immer noch nicht explizit geäußert
  hat. Wann meldet er sich zu Wort? Die Wälder brennen. Es gibt 12 000 Hitzetote.
  Wann kommt tatsächlich einmal eine Antwort oder irgendwie eine Ansage vom Kanzler?
  Ich würde das als eine Facette bzw. Schattierung der Frage von dem Kollegen bezeichnen,
  der ja genau nach dem Gleichen gefragt hat. Der Bundeskanzler ist tief in diesem
  Thema drin. Er begleitet es auch nicht erst seit diesem Jahr, sondern es ist ein
  Thema ‑ das habe ich jetzt länglich versucht auszuführen ‑, das schon lange auf
  der politischen Agenda steht. Aber es ist auch kein Thema, das man jetzt mit einer
  Äußerung irgendwie bearbeiten könnte. Ich begebe mich jetzt nicht auf dünnes Eis
  und baue irgendwelche spekulativen Aussagen, nach dem Motto: Wir machen jetzt dies
  und dann folgt jenes, und damit ist das Thema erledigt. Ich nehme wahr, dass Sie
  gerne hätten, dass der Bundeskanzler etwas dazu sagt. Es ist aber nicht so einfach,
  dass man dazu etwas sagt, und dann wäre das Thema auch nur annähernd bearbeitet.
  Noch einmal: Das ist etwas anderes, als wenn ich jetzt im Namen der Bundesregierung
  und des Bundeskanzlers den Einsatzkräften danke oder den Sportlern gratuliere; denn
  das sind punktuelle Ereignisse. Das hier ist ein großes Megathema, wo es jetzt nicht
  mit einem Tweet, einem Post oder so etwas getan ist. Herr Hille, ich habe noch nicht
  verstanden, welche Haltung der Bundeskanzler einnimmt. Könnten Sie noch einmal klarstellen,
  welche Haltung der Bundeskanzler zu dem Vorschlag einer Grundgesetzänderung einnimmt?
  Vielleicht noch einmal zu Ihren Ausführungen allgemeiner Art: Ist für den Bundeskanzler
  die Klimaanpassung Priorität Nummer eins oder ist der Klimaschutz Priorität Nummer
  eins? Ich habe das nicht verstanden. Das tut mir leid; da bin ich natürlich auch
  ein bisschen enttäuscht, dass die Gesamtbotschaft dessen, was ich jetzt hier seit
  25 Minuten zu erläutern versuche, offensichtlich nicht herübergekommen ist. Dann
  probiere ich es noch einmal zu der konkreten Frage: Das Thema Klimaanpassung ist
  im Koalitionsvertrag als Prüfauftrag schon genannt, und ich meine mich zu erinnern,
  dass ich jetzt schon mindestens zweimal gesagt habe, dass dieser Vorschlag innerhalb
  der Bundesregierung besprochen wird. Das habe ich verstanden. Ich habe nur nicht
  verstanden, wie der Bundeskanzler, für den Sie ja sprechen, zu dieser Grundgesetzänderung
  steht. Das wird innerhalb der Bundesregierung besprochen. Ich verstehe Ihr Bedürfnis ‑
  da sind wir wieder bei „Daumen rauf“ oder „Daumen runter“. Wenn man schon eine Lösung
  hätte, bevor man etwas bespricht, dann könnte man sich das Besprechen innerhalb
  der Bundesregierung auch sparen. So einfach ist es aber nicht. Es sei auch noch
  der Hinweis erlaubt: Natürlich braucht es auch parlamentarische Mehrheiten, um gesetzliche
  Dinge zu tun. Die nötige Mehrheit, um Grundgesetzänderungen vorzunehmen, haben wir
  in der Koalition nicht. Noch zu Ihrer Frage nach den Prioritäten: Auch da habe ich
  Verständnis für das Bedürfnis einer Qualifizierung, ob das eine wichtiger als das
  andere ist. Das kann man aber nicht gegeneinander abwägen, sondern das sind die
  sprichwörtlichen zwei Seiten einer Medaille. Ich zitiere gerne noch einmal ‑ was
  ich auch vergangene Woche schon gemacht habe ‑ den Bundeskanzler aus der Sommer-PK
  am 15. Juli: Wir müssen alles tun, um den Klimawandel in den Griff zu bekommen.
  Das gelingt am besten, wenn wir „Technologien entwickeln, die so gut sind, dass
  andere sie auch nutzen wollen. Das wäre der beste Beitrag, den Deutschland leisten
  könnte, um das Problem des Klimawandels weltweit in den Griff zu bekommen. Wir wollen
  Klimapolitik mit Wirtschaftspolitik gut verbinden können.“ Zu den Waldbränden ans
  Verteidigungsministerium: Sind neben der Bereitstellung von zwei Bundeswehrhubschraubern
  weitere Hilfsmaßnahmen geplant? Wir haben in Deutschland ja leider verschiedene
  Waldbrände. Beim Waldbrand Ende der letzten Woche in NRW hatten wir ‑ das haben
  Sie verfolgen können ‑ zwei NH90-Hubschrauber und zwei CH-53-Hubschrauber im Einsatz.
  Das wurde am Wochenende dann aber eingestellt ‑ natürlich mit den örtlichen Brandbekämpfern
  abgestimmt. Insgesamt waren auch vier Bergepanzer vor Ort. Diese sind mit ca. 20
  Personen weiterhin vor Ort und werden eingesetzt, wenn es um die Einrichtung von
  Schneisen und weitere Maßnahmen geht. Der zweite Waldbrand, über den jetzt auch
  medial berichtet wird, ist der Waldbrand in Belgien an der deutschen Grenze. Auch
  dort sind jetzt ‑ der Einsatz war für 11 Uhr geplant ‑ zwei NH90-Hubschrauber im
  Einsatz, die mit Löschbehältern unterstützen sollen. Auch das läuft natürlich über
  den EU-Mechanismus und ist mit den belgischen Behörden abgestimmt. Frau Kock ergänzt
  für das Innenministerium, was die Amtshilfe angeht. Ich bemühe mich auch darum,
  das kurz zu machen. ‑ Das THW unterstützt selbstverständlich auch vor Ort und ist
  auch mit seinen Landesverbänden vor Ort. Heute Morgen um 6 Uhr waren 350 Einsatzkräfte
  aus vier Landesverbänden im Einsatz. Auch die Bundespolizei hat am zurückliegenden
  Wochenende das Land Nordrhein-Westfalen mit bis zu zwei Polizeihubschraubern und
  zwei Wasserwerfern bei der Brandbekämpfung unterstützt. Auch die Bundespolizei ist
  bereit und steht quasi abfahrtbereit parat, um bei Bedarf weiter zu unterstützen.
  An das Verteidigungsministerium: Sind Sie weiter bereit, auch bei Waldbränden in
  Deutschland zu helfen? Sie haben ja gesagt, dass Sie die Hilfe eingestellt haben,
  und sind jetzt in Belgien am Start. Unsere Maßnahmen sind immer subsidiär. Die Waldbrandbekämpfung
  ist per se keine Aufgabe der Streitkräfte; vielmehr haben die Streitkräfte vom Grundgesetz
  die Aufgabe der Gewährleistung der externen Sicherheit bzw. der Verteidigung im
  Landes- und Bündnisverteidigungsfall zugewiesen bekommen. Wenn die Kapazitäten vorhanden
  sind und die Möglichkeiten der örtlich zuständigen, originär zuständigen Stellen
  begrenzt oder ausgeschöpft sind, dann haben wir in der Vergangenheit natürlich immer
  unsere Kräfte bereitgestellt. In NRW zum Beispiel waren Logistikkräfte ‑ die Bergepanzer,
  die in der Logistikschule vorhanden sind ‑ innerhalb von wenigen Stunden vor Ort.
  Wir machen das also, aber die originäre Aufgabe der Streitkräfte ist eine andere.
  An das Wirtschaftsministerium: Wie steht Ihre Ministerin zu einer Grundgesetzänderung?
  Wäre das aus Ihrer Sicht möglich? Wie der Kollege Hille schon ausgeführt hat, ist
  die Prüfung einer etwaigen Grundgesetzänderung Teil des Koalitionsvertrags. Die
  Vorschläge, die jetzt noch auf dem Tisch liegen, sind innerhalb der Koalition zu
  besprechen, und dazu möchte ich mich zum jetzigen Zeitpunkt nicht näher äußern.
  An das Wirtschaftsministerium: Können Sie uns bitte sagen, wie Sie die wirtschaftlichen
  Auswirkungen des Niedrigwassers im Rhein und in anderen Flüssen einschätzen? Laut
  den Schätzungen einiger Wirtschaftsverbände könnte das Niedrigwasser durchaus auch
  gravierende Auswirkungen auf das Wachstum in Deutschland haben. Wie sieht das Wirtschaftsministerium
  das? Die Bundesregierung beobachtet die Pegelstände der Flüsse, insbesondere auch
  am Rhein, natürlich sehr engmaschig und befindet sich dazu auch mit den verschiedenen
  betroffenen Branchen und den entsprechenden Verbänden im Austausch. Niedrige Wasserstände
  sind historisch kein neues Phänomen, die gab es auch in den vergangenen Jahren schon.
  Ich hatte hier auch schon ausgeführt, dass viele Unternehmen darauf auch im Hinblick
  auf Lagerhaltung, Transportwege usw. reagiert haben, um ihre Lieferketten resilienter
  zu machen. Deshalb gehen wir davon aus, dass die Auswirkungen und die negativen
  Effekte potenziell besser abgefedert werden können als noch in vergangenen Jahren.
  Die Auswirkungen hängen massiv von Ausmaß und Dauer der Niedrigstände ab. Dazu habe
  ich hier gerade keine Zahlen des BMWE mitzuteilen, und da möchte ich nicht spekulieren.
  An das Ministerium des Innern: Am vergangenen Donnerstag hat die italienische Regierung
  bekanntgegeben, dass sie keine Verantwortung für die Flüchtlinge übernehmen wird,
  die Deutschland angeblich nach Italien abschieben möchte. Es geht um eine Frau aus
  Somalia, die angeblich im März in Deutschland eingereist ist, und um zwei weitere
  Personen. Rom behauptet, dass Fälle von Personen, die vor dem 12. Juni in Deutschland
  eingereist sind, erledigt seien. Ich hätte dazu gerne eine Stellungnahme. Wir hatten
  schon mehrmals Stellungnahmen gefordert und noch keine bekommen; aber am Donnerstag
  hat die italienische Regierung gesprochen. Ich kann Ihnen dazu gerne eine Stellungnahme
  von uns geben: Es ist so, dass Deutschland und Italien in Fragen der Migrationspolitik
  eng und vertrauensvoll zusammenarbeiten und dass die Abstimmungen zur Umsetzung
  des Gemeinsamen Europäischen Asylsystems in einem offenen und partnerschaftlichen
  Austausch erfolgen. Können Sie uns etwas zu den drei Fällen, von denen man spricht,
  sagen? Es gibt in diesem Zusammenhang auch noch die Frage der NGOs. Italien spricht
  von einem Ausgleich wegen der vielen Migranten, die von deutschen Schiffen nach
  Italien gebracht werden. Was sagen Sie dazu? Zu Einzelfällen ‑ das kennen Sie von
  uns ‑ äußern wir uns üblicherweise nicht. Ich kann mich nur wiederholen: Wir arbeiten
  in Fragen der Migrationspolitik eng und vertrauensvoll zusammen. Alles, was Sie
  angesprochen haben, gehört zum Gemeinsamen Europäischen Asylsystem und den Abstimmungen
  dazu. Diese erfolgen in einem offenen und partnerschaftlichen Austausch zwischen
  Deutschland und Italien. Das heißt, man versteht dieses Abkommen in Italien auf
  eine Weise und in Berlin auf eine andere Weise? Das habe ich so nicht gesagt. Ich
  habe gesagt: Wir arbeiten eng und vertrauensvoll zusammen. Frau Kock, können Sie
  diese enge und vertrauensvolle Zusammenarbeit mit Zahlen unterlegen? Es gibt ja
  seit Jahren Klagen darüber, dass Italien Flüchtlinge, die über Italien nach Deutschland
  eingereist sind, nicht wieder zurücknimmt. Ich glaube, die Zahlen gehen mittlerweile
  in einen fünfstelligen Bereich. Können Sie Zahlen liefern, wie viele Flüchtlinge
  in den letzten Monaten überhaupt nach Italien zurückgeführt werden konnten? Die
  Zahlen, wie viele Flüchtlinge in den letzten Monaten zurückgeführt werden konnten,
  müsste ich nachreichen. Dass es mehrere tausend wären, habe ich so jetzt noch nicht
  gesehen; ich kann das aber weder dementieren noch bestätigen. Es wäre nett, wenn
  Sie die Zahlen nachreichen. Ich kann es versuchen ‑ wie gesagt, unter Vorbehalt.
  Frau Kock, in der letzten Bundespressekonferenz war noch eine weitere Frage offengeblieben,
  zu der Sie etwas nachliefern wollten, und zwar dieselbe Frage, die die Kollegin
  eben schon gestellt hat: Was passiert mit den Flüchtlingen, die vor dem 12. Juni
  angekommen sind? Werden wir dazu irgendwann ‑ in der nächsten Stunde, heute oder
  in der nächsten Woche ‑ eine Antwort bekommen? Muss das noch rechtlich geprüft werden,
  oder warum bekommen wir keine Antwort? Sie bekommen eine Antwort. Meine Antwort
  darauf ist, dass die Abstimmungen mit Italien zur Umsetzung des Gemeinsamen Europäischen
  Asylsystems laufen, und zwar in einem offenen und partnerschaftlichen Austausch.
  An das BMI: Es sind jetzt Zahlen zur freiwilligen Rückkehr bekannt geworden. Wie
  bewerten Sie diese Zahlen? Gibt es Pläne, die Zahlungen in den Förderprogrammen
  für die freiwillige Rückkehr noch einmal zu erhöhen? Ich fange einmal von hinten
  an: Rückführungen sind Sache der Länder, und die Bundesländer legen dementsprechend
  auch die Höhe entsprechender Zahlungen fest. Da sind wir als Bundesinnenministerium
  nicht involviert. Zu den veröffentlichten Zahlen: Das ist nicht neu; das kursierte,
  glaube ich, schon letzte oder sogar vorletzte Woche. Da muss man ein bisschen genauer
  darauf schauen, wie viele Personen mittels erzwungener Ausreise wurden zurückgeführt
  und wie viele Personen gefördert ausgereist sind. Wenn man dann die Zahlen des ersten
  Halbjahres 2026 mit den Zahlen des ersten Halbjahres 2025 vergleicht, dann sieht
  man, dass es da keine großen Unterschiede gibt. Wir konnten die Zahl der geförderten
  Ausreisen also erheblich steigern. Wie bewerten Sie, dass die Zahlen gesteigert
  wurden? Finden Sie das gut oder schlecht? Es ist gut, dass wir zumindest den Stand
  halten können. Ich habe eine Nachreichung für den Kollegen von DTS; denn ich möchte
  nichts Falsches im Raum stehen lassen. Seit gestern Abend sind auch die Bergepanzer
  und die 20 Soldatinnen und Soldaten, die ich erwähnt habe, von der Waldbrandbekämpfung
  entlassen. Das hat die Lage vor Ort zugelassen. Da ist also nichts mehr im Einsatz.
  Lediglich der Militärflugplatz Nörvenich wird weiterhin als Basis für gegebenenfalls
  notwendige Flüge der Landespolizeibehörden, die dort noch im Einsatz sein könnten,
  genutzt. Auf den Seychellen , genauer gesagt auf der Hauptinsel Mahé, steht seit
  dem 11. August eine Maschine der Flugbereitschaft vom Typ Bombardier Global 5000
  mit dem Kennzeichen 14+03. Derzeit kursieren mehrere Erklärungen und Vermutungen
  über den Grund dieser Präsenz. Herr Müller, können Sie uns einmal die regierungsamtliche
  Erklärung darlegen, was es mit dieser Präsenz auf den Seychellen auf sich hat? Das
  kann ich machen. ‑ Sie haben recht, ein Luftfahrzeug der Flugbereitschaft steht
  auf den Seychellen. Das ist eine Global 5000, eine kleinere Geschäftsmaschine. Der
  Grund dafür ist, dass diese Maschine auf einem Trainingsflug, einem sogenannten
  Afrikatraining, war ‑ ich erkläre gerne noch, warum wir das machen ‑ und einen technischen
  Defekt an der Hydraulikanlage hatte. Die Maschine musste dann ‑ dafür gibt es Verfahren ‑
  zum nächstmöglichen bzw. bestmöglichen Flugplatz ausweichen. Sie konnte den Flug
  also nicht fortsetzen und ist dort gelandet. Das übliche Verfahren ist, dass dann
  die Fehlersuche begonnen wird, und dann werden über den Heimatverband ‑ das ist
  in diesem Fall die Flugbereitschaft in Köln ‑ Personal bzw. Werkzeug und Ersatzteile
  nachgeführt. Das ist erfolgt. Dafür haben wir einen französischen A400M genutzt,
  der sowieso in die Region unterwegs war ‑ wie Sie wissen, ist Réunion französisches
  Gebiet. Die Ersatzteile sind mittlerweile angekommen. Wir sind jetzt in der Instandsetzung
  und werden diese vermutlich am morgigen Tag abschließen. Dann wird der Flug fortgesetzt
  bzw. der Rückflug erfolgt, je nach Diplomatic Clearance. Das ist ein normales Verfahren;
  das muss dann alles neu beantragt werden, weil die normalen Clearances abgelaufen
  sind. An Bord war ‑ ich habe die Diskussionen natürlich mitverfolgt ‑ kein Politiker
  und kein weiterer Gast oder Ähnliches; vielmehr war die Crew an Bord. Normalerweise
  wird die Crew bei solchen Flügen um einen Techniker ergänzt, um eben Kleinigkeiten
  vor Ort zu beheben. Die Crew ist wohlauf und wird dann den Flug fortsetzen. Ich
  habe auch Meldungen nach dem Motto „Was machen die da und warum machen die das?“
  wahrgenommen. Ich möchte es ganz kurz erklären: Der Flugbetrieb in der Region Afrika
  unterscheidet sich fundamental vom Fliegen zum Beispiel in Europa oder Nordamerika.
  Das liegt zum einen daran, dass Sie dort andere Flugverfahren vorfinden. Zum Beispiel
  ist die Region größtenteils nicht kontrolliert. Wenn sie durch Europa fliegen ‑
  egal ob Glasgow, Rumänien oder Südfrankreich ‑ und fünf Meilen vom Track abweichen,
  dann bekommen sie sofort einen Funkspruch, ob man noch wach ist; denn diese Region
  wird ständig zum Beispiel per Radarkontrolle überwacht. Das ist in Afrika nicht
  der Fall. Dort wird alles nur im Funk miteinander besprochen, und da gibt es spezielle
  Meldeverfahren usw. Es gibt dort Funkfeuertechnik, die nicht denselben Stand hat.
  Bei uns haben wir zum Beispiel GPS-Verfahren, während man dort noch auf Funkfeuerverfahren
  setzt. Insofern ist das dort sehr eigentümlich. Darüber hinaus gibt es dort sogenannte
  Hot-and-high-Bedingungen und die ITCZ, die Innertropische Konvergenzzone, also Wetterbedingungen
  und klimatische Bedingungen, die Sie sonst nicht vorfinden. Der Umgang mit diesen
  Bedingungen wird bei solchen Flügen geübt. Es kommt ja auch ständig neues Personal
  in die Verbände, und vor allem die Flugbereitschaft ist ein Verband, der für verschiedene
  Ressorts ‑ Minister, Kanzler, Bundespräsident ‑ in jede Region der Welt fliegen
  muss, und das teilweise kurzfristig. Deswegen beüben sie mit Personal, das das noch
  nicht gesehen hat, dann auch regelmäßig diese Verfahren. Genauso machen sie zum
  Beispiel in Südamerika ab und zu Training speziell an hochgelegenen Plätzen, weil
  das natürlich die Flugzeugleistung extrem beeinflusst. Das müssen sie einmal im
  Cockpit gesehen haben, um dann auch darauf reagieren zu können, wenn Sie zum Beispiel
  den Bundespräsidenten nach Südamerika fliegen. So kommt ein solcher Trainingsflug
  zustande. Das ist also Standard. Solche Flüge sind nicht allzu häufig, aber werden
  durchgeführt. Bei so einem Flug hatten wir leider diesen technischen Defekt, der
  jetzt behoben wird. Nur zum generellen Verständnis: Wie regelmäßig finden diese
  Art von Spezialtrainings statt, sei es jetzt in Afrika oder in Lateinamerika? In
  meiner Zeit war das so, dass es vielleicht einmal pro Halbjahr so einen Flug gab,
  an dem dann zwei, drei oder sogar vier Piloten ‑ vor allem junge Piloten ‑ teilgenommen
  haben, die so etwas noch nicht gesehen haben. Die Ausbildung findet üblicherweise
  in Europa statt, größtenteils sogar in Deutschland oder bei den Transportpiloten
  in Frankreich. Diese speziellen Verfahren kann man aber nicht am Simulator trainieren;
  vielmehr muss man dafür einmal in der Region gewesen sein. Diese Anflugverfahren
  und die klimatischen Bedingungen ‑ die Hitze, die hohe Luftfeuchtigkeit und das
  schnelle Aufkommen von Gewittern, das in der ITCZ innerhalb weniger Minuten eintreten
  kann ‑ muss man einmal selbst erfahren haben. Deshalb finden diese Flüge statt,
  wenn in den Verbänden Bedarf entsteht. An Frau Deschauer: Die EU-Außenbeauftragte
  hat angekündigt oder gesagt, dass ein nächstes Sanktionspaket gegen Russland in
  Vorbereitung sein soll, das so umfangreich ist wie kein anderes vorher. Können Sie
  uns mehr darüber sagen? Unterstützt die Bundesregierung ein 22. Sanktionspaket?
  Ich glaube, die EU-Außenbeauftragte hat angekündigt, dass sie sich im Herbst dieser
  Thematik widmen wird und dass der Sanktionsdruck auf Russland erhöht werden soll
  und muss. Das ist absolut die Haltung der Bundesregierung; das haben wir hier von
  Beginn an gesagt. Wir haben auch immer deutlich gemacht, dass Sanktionspakete, wie
  zuletzt das 21., dringend abgeschlossen werden müssen, zur Umsetzung kommen müssen
  und auch effektiv wirken müssen. Weitere Details werden ‑ das wissen Sie ‑ üblicherweise
  im Brüsseler Rahmen über die europäischen Institutionen vorgelegt und dann auf dem
  Verhandlungsweg diskutiert. Das Neue an der Äußerung der Außenbeauftragten war ja,
  dass Sie von einem bisher nicht erreichten Volumen gesprochen hat. Ist das eine
  Überlegung, die es auch in der Bundesregierung gibt? Zur Interpretation ihrer Überlegungen
  und zu dem, was sie im EU-Kontext vorschlagen wird, müssten Sie in Brüssel nachfragen.
  Das Auswärtige Amt hat eine Antwort auf eine IFG-Anfrage des Anwalts des EU-sanktionierten
  deutschen Journalisten Hüseyin Doğru vollumfänglich abgelehnt, mit Verweis darauf,
  dass im vorliegenden Fall die diplomatischen Beziehungen zu NATO-Partnerstaaten
  berührt seien. Frau Deschauer, dabei scheint es sich ja nicht um EU-Staaten zu handeln.
  Können Sie sagen, um welche NATO-Staaten es sich da handelt? Sie kennen offenbar
  die Antwort auf die IFG-Anfrage; insofern habe ich dem nichts hinzuzufügen. Das
  Dokument liegt mir jetzt nicht vor. Es gab eben keine Antwort drauf. ‑ Aber dann
  noch eine andere Frage: Wenn man dem Anwalt eines EU-sanktionierten Journalisten
  vollständig die Antwort verweigert, wie soll dieser seinen Mandanten dann nach Vorstellung
  des Auswärtigen Amtes noch adäquat verteidigen können? Ich kann nicht erkennen,
  dass das Auswärtige Amt oder die Bundesregierung die Antwort verweigert hat. Sie
  haben mir eben eine Antwort vorgelesen. Der russische Außenminister ist am Wochenende
  mit Drohungen aufgefallen. Er sagte, es sei ein Ziel, all das zu zerstören, was
  Kyjiws Kriegsmaschine speise. Herr Hille, wie ordnet die Bundesregierung das ein?
  Ich kann sehr gerne anfangen. ‑ Wir haben uns dazu gestern auf Anfrage aus dem Auswärtigen
  Amt geäußert. Das hat Eingang in einen morgendlichen Newsletter gefunden. Ich kann
  es so einordnen: Drohungen und Äußerungen gegenüber EU- oder NATO-Partnern sind
  nichts Neues. Die nehmen wir zur Kenntnis, von denen lassen wir uns nicht einschüchtern,
  und wir lassen uns auch in unserer Unterstützung für die Ukraine nicht einschüchtern.
  An das BMVg: Gibt es dennoch Bewegungen, da zusätzliche Vorkehrungen zu treffen?
  Solche Vorkehrungen werden ja seit Jahren ständig getroffen. Wir hatten hier auch
  die durchaus berechtigte Diskussion darüber, wie weit Transparenz gegen militärische
  Sicherheit abgewogen werden kann. Das ist auch der Grund, warum wir nicht mehr über
  Einzellieferungen, Zeitpläne und Mengen reden; denn wir wollen eben keine Befindlichkeiten
  wecken, dass man jetzt gewisse Lieferungen ausschalten müsste. Natürlich befinden
  wir uns zum Thema Liefersicherheit in enger Abstimmung mit unseren ukrainischen
  Partnern. Das ist ein ständiger Prozess, der dazu dient, die bestmögliche Sicherheit
  zu gewährleisten, wenn es speziell um die militärische Unterstützung geht. Es gibt
  Äußerungen des US-Präsidenten , der das sicherheitspolitische Engagement in Südkorea
  herunterfahren möchte. An Herrn Müller und Frau Deschauer: Inwiefern beeinträchtigt
  dies deutsche Sicherheitsinteressen? Erst einmal mag ich diese Aussagen nicht kommentieren.
  Wir kommentieren ja nicht alles, was dort gesagt wird. Die Kooperation mit der Region
  und vor allem mit Südkorea ist eng. Minister Pistorius war vor circa zwei Jahren
  dort. Wir sind am United Nations Command beteiligt, das sich dort um die Überwachung
  der demilitarisierten Zone und um die die Überwachung des Waffenembargos kümmert.
  Es gibt außerdem eine ganze Menge an gemeinsamer Übungskooperation. Wir unterrichten
  regelmäßig über unsere Indopazifik-Deployments in der Region, wobei auch Südkorea
  immer wieder ein Thema ist ‑ teilweise wird im Rahmen von Verlegungen begleitet,
  oder wir treffen uns unterwegs. Die bilaterale Kooperation mit Südkorea ist also
  eng und vertrauensvoll. Die anderen Aussagen möchte ich nicht kommentieren. Frau
  Deschauer, ich wollte fragen, ob Sie noch etwas ergänzen können. Ich kann vielleicht
  noch einen anderen Aspekt in der Fragestellung beleuchten. Es ist ja so, dass die
  südkoreanische Seite sich auch geäußert hat. Meinem Verständnis nach hat die südkoreanische
  Seite die Hoffnung ausgedrückt, dass die Beziehungen des US-Präsidenten in die Region,
  auch zur nordkoreanischen Führung, möglicherweise zu einer Wiederaufnahme von Gesprächen
  zwischen Nord- und Südkorea führen könnten. Am Wochenende hat der südkoreanische
  Präsident auch wieder die Hand ‑ das muss man so sagen ‑ in die Richtung ausgestreckt.
  Was die Haltung der Bundesregierung angeht: Aus Sicht der Bundesregierung ist natürlich
  das unterstützenswert, was zur Sicherheit und Stabilität in der Region führen kann.
  Kurze Nachfrage ‑ das betrifft einen etwas anderen Aspekt davon ‑ an Herrn Müller
  und Frau Deschauer: Erschüttert das nicht das Vertrauen der Bundesregierung in die
  Zusammenarbeit mit der US-Administration, wenn immer wieder solche Drohungen kommen?
  Südkorea ist noch einmal etwas anders betroffen, weil es Nordkorea als Nachbarn
  gibt. Aber auch Deutschland ist ja auf die Hilfe der USA angewiesen. Es gibt gleichzeitig
  Kritik der europäischen Partner, dass Deutschland mit dem Geld, das es zur Verfügung
  hat, viel zu viele US-Waffen einkauft statt europäischer Waffen. Ist Ihr Vertrauen
  in die Zusammenarbeit mit den USA durch so eine Äußerung des US-Präsidenten erschüttert?
  Ich kann gerne beginnen und möchte an das anknüpfen, was ich gerade sagte. Ich kann
  den Aussagen des koreanischen Präsidenten nicht entnehmen, dass er das als Bedrohung
  aufgefasst hat, sondern er hat daran anknüpfend möglicherweise eine politische Perspektive
  sehen können. Unsere Beziehungen zu den Vereinigten Staaten von Amerika sind grundfest
  und tief. Das äußert sich in der politischen Zusammenarbeit, der sicherheitspolitischen
  Zusammenarbeit. Ich kann nur sagen, dass wir auf der Ebene der Außenminister sehr
  engen und regen Kontakt haben. Ich möchte jetzt nicht für die Kollegen neben mir
  sprechen, aber das gilt sicher in ähnlicher Art und Weise. Insofern lassen wir mal
  von unserer Seite aus diese Übungsankündigung unbewertet stehen. Da habe ich keine
  weiteren Details. Aber mit Blick auf die Region kann ich nicht erkennen, dass die
  südkoreanische Seite das als bedrohlich empfunden hat. Zumindest hat sie sich so
  nicht geäußert. Aus meiner Sicht möchte ich keine Korrelation herstellen zwischen
  den Aussagen und wie die Zusammenarbeit mit der US-Administration ist oder mit den
  US-Streitkräften ist. Auf politischer Ebene gibt und gab es immer einen engen Austausch.
  Wir hatten das VM-Treffen, wir hatten jetzt im Juli den NATO-Gipfel in Ankara. Wir
  haben auf Ebene der Streitkräfte eine ganz enge Kooperation. Deswegen mag ich jetzt
  diesen Aspekt hier nicht als korrelierend mit unserem Vertrauen oder unserer eigenen
  Zusammenarbeit sehen. Die Kampagne Campact hat sowohl der SPD als auch den Grünen
  letzte Woche Großspenden in Höhe von je 310 000 Euro für den Wahlkampf in Sachsen-Anhalt
  zukommen lassen. Das entspricht etwa bei der SPD einem Drittel des bisherigen Wahlkampfbudgets.
  Da würde mich interessieren: Wie bewertet denn der Kanzler diese Spenden an die
  politische Konkurrenz und damit auch den Einfluss auf den Wahlkampf vor dem Hintergrund,
  dass die von Campact gegründete und ausschließlich von dieser mit Startkapital ausgestattete
  NGO HateAid, bei der Campact bis heute einer der Hauptgesellschafter ist, 2025 Bundesmittel
  vom Familienministerium und dem SPD-geführten Justizministerium in Höhe von über
  einer Million Euro erhalten hat? Obwohl Sie es wissen, sage ich es trotzdem noch
  einmal: Ich sitze hier als Sprecher der Bundesregierung, ich bin kein Sprecher einer
  Partei. Sie werden sagen, deshalb haben Sie auch den Bundeskanzler adressiert. Das
  habe ich wohl gehört. Es ist jetzt aber nicht an mir, von dieser Stelle aus die
  Praxis von Parteispenden in Deutschland zu kommentieren. Ich kann darauf hinweisen,
  dass es dafür in Deutschland klare Regeln gibt. Die Überprüfung, ob diese Regeln
  eingehalten sind, und auch die Anzeigepflicht liegen meines Wissens bei der Bundestagsverwaltung
  und bei der Bundestagspräsidentin. Das muss kontrolliert und angewendet werden.
  Ansonsten habe ich das jetzt von dieser Stelle nicht weiter zu kommentieren. Noch
  eine Nachfrage an die erwähnten Ministerien, das Bundesfamilien- und das Justizministerium.
  Da würde mich interessieren, wie Sie jeweils rechtfertigen, dass man eine NGO wie
  HateAid mit hohen sechsstelligen Beträgen ‑ 424 000 respektive 600 000 Euro im letzten
  Jahr ‑ maßgeblich finanziert, wenn, wie schon erwähnt, deren Gründer und Gesellschafter
  Campact die Grünen und die SPD sowohl bei den Landtagswahlen 2024 in Thüringen,
  Sachsen und Brandenburg und jetzt in Sachsen-Anhalt mit insgesamt über einer Million
  Euro querfinanziert? Ich habe den Ausführungen des Regierungssprechers an dieser
  Stelle nichts hinzuzufügen. HateAid ist eine Organisation, die sich gegen Hass im
  Netz und für den Schutz der Persönlichkeitsrechte der Betroffenen einsetzt. Das
  ist ein Anliegen, das auch das BMJV teilt. Eine Frage an Herrn Hille und das Finanzministerium.
  Es gibt einen Bericht, dass die Bundesregierung bereit ist, die verbliebenen 12,7 Prozent
  an der Commerzbank zu veräußern. Ich hätte ganz gerne gewusst, ob das stimmt. Das
  habe ich auch gelesen. Das ist eine Spekulation. Sie wissen, wie wir mit Spekulationen
  umgehen; die kommentiere ich von dieser Stelle nicht. Es ist zwar eine Spekulation,
  auch innerhalb dieses Berichtes, aber das ändert ja nichts an der Frage: Ist die
  Bundesregierung bereit, über einen Verkauf ihrer Anteile zu sprechen? Da komme ich
  jetzt ehrlicherweise nicht ganz mit, was an dieser Fragekonstellation keine Spekulation
  sei. Es ist jetzt dran, dass die Vorstände der Banken miteinander sprechen. Darüber
  hinaus gehende Spekulationen werde ich von dieser Stelle jetzt nicht kommentieren.
  Eine Frage an das Innenministerium: Morgen wird ja in Sachsen-Anhalt ein Zentrum
  für Drohnensicherheit eröffnet . Was verspricht sich das Innenministerium davon,
  und wie fügt sich das Zentrum in die Gesamtstrategie der Bundesregierung zur Drohnenabwehr
  an? Wir haben ja schon viele zivile Drohnenabwehrzentren. Dazu habe ich meiner Erinnerung
  nach in einer der letzten Regierungspressekonferenzen bereits ausgeführt, weil danach
  gefragt wurde. Es wird in der Tat morgen am Testflughafen des Deutschen Zentrums
  für Luft- und Raumfahrt in Cochstedt eine Forschungseinrichtung für Drohnensicherheit
  entstehen. Das erklärt vielleicht auch, wie dieses Zentrum die bestehenden Maßnahmen
  ergänzt, die wir haben. Also es gibt zum einen die Beschaffung von Drohnentechnik.
  Wir haben das gemeinsame Drohnenabwehrzentrum eingerichtet. Wir haben ein gemeinsames
  Abwehrzentrum Hybrid, das sich auch mit Drohnen beschäftigt. Aber wir brauchen in
  diesem Bereich auch sehr viel Forschung und Entwicklung. Dazu gehört auch eine Beobachtung
  neuer Technologien und die Forschung, was wir hier wie umsetzen können. Da wird
  dieses Zentrum in Cochstedt ein wesentlicher Baustein sein, um die Entwicklung von
  neuen Technologien voranzutreiben. Ich kann für das Raumfahrtministerium kurz ergänzen.
  Morgen wird ja am DLR-Standort Cochstedt das Technologiezentrum Drohnensicherheit
  eröffnet. Der Standort Cochstedt ist schon heute ein bedeutender Standort für die
  Entwicklung von Drohnentechnologie und wird nun im Bereich der zivilen Sicherheit
  von der neuen Einrichtung ergänzt. Institutionell gefördert durch das BMFTR betreibt
  das DLR dort bereits seit 2019 das Nationale Erprobungszentrum für unbemannte Luftfahrtsysteme
  und seit 2020 das Kompetenzzentrum für unbemannte Luftfahrtsysteme. Die Einrichtungen
  betreiben dort Forschung und Entwicklung von unbemannten Luftfahrtsystemen, typischerweise
  Drohnen, und dienen der Vernetzung von Wissenschaft und Wirtschaft. Eine Frage ans
  Wirtschaftsministerium. Das war ja letzte Woche schon mal Thema hier in der Bundespressekonferenz.
  Mir geht es aber um einen anderen Aspekt, nämlich um den Gaspreis . Wie groß ist
  die Sorge im Wirtschaftsministerium, dass durch den relativ geringen Füllstand die
  Lieferanten oder die Betreiber von Gasspeichern vor allem teures Gas einkaufen müssen
  und deshalb im Winter, wenn das Gas wieder verkauft wird, Verbraucher und Nutzer
  dann auch teure Gaspreise bezahlen müssen? Bevor ich ausführe, ist es mir wichtig,
  noch einmal zu sagen: Die Gasversorgung in Deutschland ist derzeit stabil, und die
  Versorgungssicherheit ist auch gewährleistet. In der Tat sind die Gasspeicherfüllstände
  derzeit niedriger als in den vergangenen Jahren. Das liegt daran, dass wir mit leeren
  Speichern aus dem Winter gekommen sind. Das liegt aber auch daran, dass beispielsweise
  durch die Flexibilisierungsoptionen, die wir ja mit den LNG-Terminals in Deutschland
  geschaffen haben, die Speicher einfach eine andere Bedeutung haben. Mir ist auch
  wichtig zu betonen, dass derzeit circa 74 Prozent der verfügbaren Speicherkapazitäten
  gebucht worden sind. Einige Speicher, insbesondere auch Kavernenspeicher, sind zu
  100 Prozent gebucht. Die Wintervorsorge läuft; das ist Aufgabe des Marktes. Darüber
  hinaus würde ich mich jetzt spekulativ nicht äußern wollen. Wenn ich noch einmal
  nachfragen darf: Mir ging es um den Preis. Darüber müsste doch Ihr Ministerium zumindest
  Vorausberechnungen haben, wie viel eigentlich für Gas bezahlt werden muss. Sie wissen
  ja wahrscheinlich, wie viel die Betreiber von Gasspeichern jetzt für den Einkauf
  zahlen müssen. Diese hohen Preise haben dann ja auch Auswirkungen auf die Verbraucherpreise
  und die Inflation. Natürlich beobachten wir den Markt. Zu genauen Preisgestaltungen
  kann ich mich hier nicht äußern. Sie haben ja die LNG-Kapazitäten angesprochen,
  also die Importkapazitäten. Da gibt es ja derzeit ein bisschen ein Fragezeichen
  daran, ob die dann im Winter ausreichen, weil man müsste dann vielleicht zu einem
  bestimmten Punkt sehr viel LNG auf einmal importieren. Reichen denn diese Terminalkapazitäten
  aus? Wie ich schon gesagt habe: Wir haben in den letzten Jahren mit den diversen
  LNG-Standorten im Norden Deutschlands Flexibilisierungsoptionen geschaffen. Und,
  noch einmal: Spekulativ äußere ich mich nicht zu etwaigen Importen im Winter. Noch
  einmal, auch zu den LNG-Terminals: Vergangene Woche hat das Wirtschaftsministerium
  hier gesagt, dass in diesem Jahr ja auch noch das Terminal dazukommen würde. Jetzt
  gibt es aber einen Bericht, dass zwar das Terminal angeschlossen wird, aber es gar
  keine Gasleitung für den Abfluss des Gases gibt, auf jeden Fall nicht in ausreichendem
  Maße. Deswegen da noch einmal die Frage: Wenn Sie hier Stade als Entlastung für
  die Versorgung angeben, wie soll dieses Gas dann ins Netz gelangen? Ich habe ja
  gesagt, es gibt ja nicht nur einen Standort für LNG-Importe im Norden. Im Hinblick
  auf Stade habe ich jetzt keine Details vorliegen. Das müsste ich gegebenenfalls
  nachreichen.'
