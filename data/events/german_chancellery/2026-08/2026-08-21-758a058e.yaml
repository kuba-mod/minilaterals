title: 'Erfolgsjahr für die Bundesfilmförderung: Rekordanzahl an geförderten Filmen
  und Serien, Fördermittel bereits ausgeschöpft - Staatsminister Weimer: Filmförderung
  des Bundes wirkt'
text: 'Die Bundesfilmförderung blickt auf ein außergewöhnlich erfolgreiches Jahr 2026.
  Nachdem bereits 2025 eine deutlich gestiegene Nachfrage nach Fördermitteln zu verzeichnen
  war, setzt sich diese Entwicklung in diesem Jahr fort: Noch nie wurden auf Bundesebene
  so viele Film- und Serienproduktionen gefördert wie 2026. Die für die wirtschaftliche
  Filmförderung bereitgestellten Mittel sind bereits ausgeschöpft. Dazu Staatsminister
  Weimer: „Die Filmförderung des Bundes wirkt. Wir investieren in die Zukunft des
  Filmstandorts Deutschland und schaffen die Voraussetzungen dafür, dass es wieder
  mehr Filme und Serien made in Germany gibt. Das wird auch international für Aufmerksamkeit
  sorgen. Die Rekordnachfrage nach Fördermitteln ist zudem ein starkes Signal für
  die Leistungsfähigkeit unserer Wirtschaft.“ Allein für die wirtschaftliche Filmförderung
  stehen 2026 250 Millionen Euro aus dem Bundeshaushalt zur Verfügung. Das ist nahezu
  doppelt so viel wie im Vorjahr. Damit werden in den Jahren 2025 und 2026 allein
  im Rahmen der wirtschaftlichen Filmförderung mehr als 350 Film- und Serienprojekte
  ermöglicht. Auch international erlebt der deutsche Film derzeit eine Erfolgsphase.
  Deutsche Produktionen sind auf den großen internationalen Festivals so erfolgreich
  wie lange nicht. Das ist ein Beleg für die hohe Qualität des deutschen Film- und
  Produktionsstandorts. Zugleich zeigt es auch, dass die 2025 eingeleiteten Maßnahmen
  zur Vitalisierung des Standorts greifen. Unter anderem wurde die Förderintensität
  auf international wettbewerbsfähige 30 Prozent der in Deutschland ausgegebenen Produktionskosten
  angehoben. In den Jahren 2025 und 2026 stellt der Bund für die kulturelle und wirtschaftliche
  Filmförderung insgesamt mehr als 530 Millionen Euro bereit. Damit erreicht die Bundesfilmförderung
  einen historischen Höchststand. Auch in 2027 sieht der Regierungsentwurf für den
  Bundeshaushalt eine deutliche Steigerung der wirtschaftlichen Filmförderung gegenüber
  2025 vor. Zugleich soll die kulturelle Filmförderung des Bundes auf hohem Niveau
  fortgeführt werden. Hinzu kommen die abgabefinanzierte Förderung der Filmförderungsanstalt,
  die Förderungen der Länder und die beitragsfinanzierten Produktionsaufträge der
  öffentlich-rechtlichen Sender. Der Produktionswirtschaft in Deutschland steht damit
  auch im Vergleich zu anderen Wirtschaftsbranchen eine äußerst robuste und umfangreiche
  Förderlandschaft zur Verfügung.'
