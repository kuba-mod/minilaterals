  und Piantedosi stattfinden wird? Es bleibt bei dem, was ich grundsätzlich gesagt
  habe. Wir sind mit unseren Partnern auf italienischer Seite in einem regelmäßigen
  Austausch. Einen konkreten Termin auf dieser Ebene kann ich Ihnen nicht ankündigen.
  Sie haben gesagt, Sie berichten nicht über einzelne Maßnahmen, aber jetzt geht es
  um die Aussetzung der Maßnahmen. Die Frage ist vielleicht ein bisschen interessanter.
  Also, die Ausweisungen waren geplant ‑ wir wissen von drei, vielleicht sind es mehr ‑
  und sind in dem Fall ausgesetzt worden. Können Sie das bestätigen? Da gilt das Gleiche,
  was ich gesagt habe. Einzelne Maßnahmen, vor allen Dingen im Vorfeld einer möglichen
  Planung, ob sie stattfinden oder nicht, kommentieren wir nicht. Herr Hille, wie
  steht die Bundesregierung zu dem FallOwen Ansah ? Halten Sie das Vorgehen der NADA
  für verhältnismäßig? Ich würde mich da ‑ ich weiß, ein ganz anderes Thema ‑ dem
  anschließen, was der Kollege Bowinkelmann gerade gesagt hat, dass es jetzt nicht
  meine Rolle ist, einzelne Sachverhalte in dieser Form zu beurteilen. Sie wissen,
  über allem steht sowieso die Autonomie des Sportes. Es gibt Mechanismen, Kontrollmechanismen
  und Institutionen, die zuständig sind. Auch da gibt es Verfahren von Widerspruch
  und Rechtsschutz. Die gilt es zu durchlaufen und darauf zu vertrauen, dass die richtigen
  Dinge zueinander finden. Das ist jetzt nicht die Rolle des Regierungssprechers,
  das einzuordnen. Wo wir gerade schon bei Zuständigkeitsfindungen waren: Wer kümmert
  sich jetzt eigentlich aktuell im Kanzleramt um den Themenkomplex Sport? Wie Sie
  wissen, besteht der Bereich ja nicht nur aus einem Staatsminister oder einer Staatsministerin
  an der Spitze, sondern aus einer ganzen Abteilung. Da sind viele sachkundige Kolleginnen
  und Kollegen, die das Thema seit Jahren betreuen. Die kümmern sich weiterhin um
  all das, was Sport und Ehrenamt angeht. Herr Hille, in der Sommerpressekonferenz
  hier hat der Bundeskanzler dargelegt, er werde alles tun, um zu verhindern, dass
  die AfD bei den bevorstehenden Landtagswahlen die Mehrheit bekommt. Was ist unter
  „alles“ zu verstehen? Da sind wir ja fast schon wieder in so einer philosophischen
  Dimension wie am Anfang: Was ist „alles“? Was bedeutet das dann? Und wie verhält
  es sich damit, dass er jetzt bei den Wahlkampfveranstaltungen noch nicht anwesend
  gewesen ist? Ich glaube, Sie kennen unsere Grundlinie. Wir versuchen, die Herausforderungen,
  die Probleme, die Fragestellungen, die in diesem Land aufkommen und zu bearbeiten
  sind, bestmöglich zu bearbeiten. Ein Thema ist die Sicherheit, innen wie außen.
  Über ein anderes großes Thema haben wir gerade im Zusammenhang mit der Kabinettsklausur
  gesprochen ‑ wirtschaftliche Stärke, Wettbewerbsfähigkeit. Unsere Überzeugung ist:
  Wir treten damit an, mit bestmöglichen politischen Lösungen so viele Menschen wie
  möglich von unserer Politik ‑ der Politik dieser Koalition, die aus drei Parteien
  besteht ‑ zu überzeugen und so dafür zu sorgen, dass entsprechende Wahlentscheidungen
  getroffen werden. Das ist „ alles“ . Unsere Politik dient dazu, bestmögliche Lösungen
  in unserem demokratisch-parlamentarischen System zu finden, im Sinne der Menschen
  in unserem Land. Denn Politik ist ja kein Selbstzweck. Das ist, wenn Sie so wollen,
  „alles“. Dem dient das, was nicht nur der Bundeskanzler tut, sondern auch die Bundesregierung
  tut. Die Holocaustüberlebende Charlotte Knobloch hat sich für ein AfD-Verbotsverfahren
  ausgesprochen. Wie sieht der Kanzler zum jetzigen Zeitpunkt, zu dem die AfD vor
  der absoluten Mehrheit in Sachsen-Anhalt steht, ein AfD-Verbotsverfahren, wie ordnet
  er das ein? Wie Sie sich vorstellen können, haben wir diese Äußerung zur Kenntnis
  genommen, aber an der Grundhaltung des Bundeskanzlers hat sich nichts verändert.
  Unser Ansatz ist ‑ das habe ich gerade versucht zu skizzieren ‑, durch gute Politik
  so viele Menschen wie nur irgend möglich von unserer Politik zu überzeugen. Das
  ist das Ziel, und daran arbeiten wir. Ansonsten hat sich an der Auffassung nichts
  geändert. An das Finanzministerium: Der baden-württembergische Finanzminister Bayaz
  hat jetzt vorgeschlagen, dass man bei einer radikalen Politik einer AfD-Regierung
  in Sachsen-Anhalt die Finanzzuweisungen für Sachsen-Anhalt ins Visier nehmen müsse.
  Teilt der Bundesfinanzminister solche Überlegungen? Wir haben diese Vorschläge zur
  Kenntnis genommen, kommentieren aber wie üblich Vorschläge aus dem politischen Raum
  erst einmal nicht. Ich kann das aber gerne noch ein bisschen einordnen: Es geht
  dabei um das Finanzausgleichsgesetz. Dieses Gesetz haben Bund und Länder gemeinsam
  beschlossen. Um welche Leistungen es dabei geht und wie der Länderfinanzausgleich
  zu erfolgen hat, ist im Rahmen dieses Gesetzes festgelegt, und an dieses Gesetz
  sind wir auch erst einmal gebunden. Fragen, wie das geändert werden könnte, sind
  zum jetzigen Zeitpunkt hypothetischer Natur. Ist in diesem Gesetz an irgendeiner
  Stelle eine Kondition eingebaut, dass man Leistungen nicht erbringt, wenn bestimmte
  Bedingungen nicht erfüllt sind? Das ist nach meinem Wissen nicht der Fall, sondern
  es sind da verschiedene Verteilungsschlüssel vorgesehen, vor allem hinsichtlich
  der Verteilung des Umsatzsteueraufkommens. Herr Bowinkelmann, eine mögliche AfD-Regierung
  könnte eventuell auch den Königsteiner Schlüssel bei der Verteilung von Flüchtlingen
  nicht mehr beachten. Können Sie uns sagen, was passieren würde, wenn sich ein Bundesland
  weigerte, Flüchtlinge aufzunehmen? Das liegt jetzt tatsächlich im Bereich der Mutmaßung
  und ist ein hypothetischer Fall. Darauf kann ich Ihnen jetzt keine Antwort geben.
  Das würde ja auch für andere Bereiche gelten, wenn sich Länder da weigern. Das wäre
  Mutmaßung. Wir haben eine Vereinbarung, und wir gehen davon aus, dass sich die Länder
  grundsätzlich an diese Vereinbarung halten. Sie gehen davon aus, dass die die einhalten?
  Das ist der Status quo, und den nehme ich jetzt erst einmal an. Ob das für diesen
  mutmaßlichen Fall eine Antwort ist und was dann die Folgen wären ‑ etwa ob das dann
  nicht nur für den Königsteiner Schlüssel, sondern allgemein für Regelungen zwischen
  dem Bund und den Ländern gelten würde ‑, kann ich Ihnen nicht sagen. Wenn es dazu
  etwas nachzureichen gibt, würde ich das tun. Herr Hille, eines der wichtigsten Anliegen
  der Bundesregierung ist, dass die wirtschaftliche Schwäche in Deutschland überwunden
  wird. Jetzt haben wir immer noch den Kriegszustand im Iran, wir haben immer noch
  die Probleme in der Straße von Hormus, und der Chefökonom der Weltbank hat vor Kurzem
  vor einer schweren Krise für die gesamte Weltwirtschaft gewarnt. Wie bereitet sich
  die Bundesregierung auf solche Szenarien vor? Können Sie das vielleicht ein bisschen
  konkretisieren? Sie haben einige Bestandteile von Herausforderungen, die sich derzeit
  stellen, geschildert. Die gesamte Blüte besteht ja noch aus vielen anderen Fragen.
  Die Bundesregierung ist natürlich in den unterschiedlichen Ressorts, je nach Zuständigkeit,
  mit all diesen Themen befasst. Sie befasst sich mit diesen Themen im Rahmen von
  Kabinettsklausuren oder auch regulären Kabinettssitzungen und anderen Formaten.
  Nur als Erinnerung: Wir haben den Nationalen Sicherheitsrat, der sich um einige
  dieser Themen kümmert. Es gibt also viele möglichst zielgerichtete Formate, um derartige
  Themen zu begleiten ‑ im Sinne von Monitoring ‑ und daraus dann, so nötig, Entscheidungen
  abzuleiten. So funktioniert unser System. Ansonsten wäre es sehr pauschal, jetzt
  zu sagen, wie wir uns auf was perspektivisch vorbereiten. Auch das ist jetzt eine
  sehr weite Frage ‑ in welchem Bereich bereiten wir Maßnahmen vor? ‑ Politik besteht
  daraus, zu entscheiden, welche Maßnahmen ‑ so man Maßnahmen für nötig hält ‑ man
  trifft, wenn Situationen entstehen. Das ist aber grundsätzlich bei jedem Thema so.
  Ich habe jetzt nichts Konkreteres anzukündigen, im Sinne von: Dieses Gesetz beschließen
  wir nächste Woche, um das von Ihnen skizzierte Problemfeld zu bearbeiten. Wir haben
  diese Themen, weil es wichtige Themen für unser Land sind, aber immer eng im Blick
  und bearbeiten sie. An Herrn Hille und Frau Ungrad: Das chinesische Unternehmen
  Unitree Robotics hat heute einen spektakulären Börsengang hingelegt. China hat mittlerweile
  einen Anteil von 90 Prozent an der Weltproduktion von humanoiden Robotern. Wie groß
  ist die Sorge der Bundesregierung, dass Deutschland und Europa auch auf diesem Feld
  abgehängt werden? Ich glaube, es gibt Kolleginnen und Kollegen, die deutlich berufener
  sind, Ihnen darauf eine Antwort zu geben. Frau Ungrad, können Sie vielleicht den
  Anfang machen? Ich kann jetzt nicht eins zu eins sagen, was genau die Maßnahmen
  sind, um die Robotik in China abzuhängen. Das wäre, glaube ich, zu vermessen. Ich
  kann aber zum Beispiel auf die Sommerbesuche der Ministerin hinweisen, die dieses
  Jahr stattgefunden haben. Da hat sie ein Unternehmen besucht, das weltweit führend
  ist, was Teile von Robotern angeht, also Roboterarme und Ähnliches. Dieses Unternehmen
  liefert weltweit Teile für diese Art von Robotern, baut das weiter aus und ist auch
  sehr optimistisch, dass man hier auch auf diesem Gebiet Fuß fassen kann. Dementsprechend
  gibt es schon Möglichkeiten, gegen die chinesische Konkurrenz vorzugehen. Nichtsdestotrotz
  ist China auf diesem Gebiet ein sehr großer Markt. Ob es da noch weitere Maßnahmen
  gibt, würde ich gerne nachreichen. Vielleicht kann auch der Kollege vom Ministerium
  für Forschung, Technologie und Raumfahrt noch etwas zu diesem Thema beitragen. Ich
  möchte hier ergänzen, dass natürlich auch das BMFTR das Thema Robotik im Blick hat.
  Unter anderem ist es auch in der Hightech Agenda Deutschland erwähnt, in der es
  beispielsweise unter der Schlüsseltechnologie KI Maßnahmen gibt, die auf das Thema
  Robotik einzahlen, etwa den KI-Robotikbooster. Des Weiteren arbeiten wir ‑ die Ministerin
  hat sich dazu regelmäßig geäußert ‑ auch an einer Technologie-Roadmap Robotik, ähnlich
  zu den Technologie-Roadmaps der anderen Schlüsseltechnologien, die im Mai vorgestellt
  wurden. Können Sie uns trotzdem eine Einschätzung geben, wo Deutschland da im Verhältnis
  zu China steht? Denn wie gesagt sind 90 Prozent des Weltmarktes in chinesischer
  Hand. Ich kann Ihnen hier jetzt keine wissenschaftlich fundierte Einschätzung liefern,
  würde aber auf die Aussagen meiner Kollegin verweisen, denen ich mich anschließe.
  Es gibt auch im Bereich der Robotik vielversprechende Start-ups in Deutschland,
  beispielsweise NEURA Robotics. Wenn ich das vielleicht noch ergänzen darf: Wir haben
  die Hightech-Agenda ja genau deshalb beschlossen, um derartige Themen noch stärker
  in den Fokus zu rücken, als sie ohnehin schon im Fokus stehen. Das ist in diesen
  Fragen der Dreh- und Angelpunkt der Hightech-Agenda der Bundesregierung und der
  Bundesforschungsministerin. An das Justizministerium: Wir hören von der Bundesanwaltschaft,
  dass in Kroatien ein zweiter Verdächtiger im Fall der Anschläge auf die Nord-Stream-Pipelines
  2022 festgenommen worden sein soll, und zwar dieselbe Person, die vor einem Jahr
  in Polen festgesetzt wurde, dann aber nicht ausgeliefert wurde. Wann rechnen Sie
  hier in Deutschland mit der Auslieferung bzw. der Überstellung aus Kroatien? Dazu
  kann ich Sie eigentlich nur an die Pressestelle des Generalbundesanwalts verweisen.
  Wir freuen uns natürlich, dass die Ermittlungen vorankommen, aber konkrete Anfragen
  zum Verfahren müssten Sie bitte an den GBA richten. In welcher Weise freuen Sie
  sich? Worauf hoffen Sie jetzt? Wir freuen uns einfach, dass der GBA Fortschritte
  bei diesen Ermittlungen macht; denn es ist wichtig, dass die Sprengung der Pipelines
  aufgeklärt wird.'
