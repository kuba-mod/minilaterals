date: '2026-08-19'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 19. August 2026
text: 'stellvertretender Regierungssprecher Hille (Vorsitzende Wolf eröffnet die Pressekonferenz
  und begrüßt SRS Hille sowie die Sprecherinnen und Sprecher der Ministerien.) Da
  wir am Freitag hier keinen Termin haben werden, blicken wir schon heute auf die
  Termine der kommenden Woche . Es ist vor allem ein Termin. Ich freue mich, auf die
  Kabinettsklausur vorausschauen zu können. Sie wissen ja, dass die Bundesregierung
  es sich zu einem ihrer großen Themen gemacht hat, den Wirtschaftsstandort Deutschland
  zu erhalten und zu stärken, weil wir der festen Überzeugung sind, dass ein wohlhabendes,
  starkes Land auf einer gut funktionierenden, starken, wettbewerbsfähigen Wirtschaft
  basiert. Sie ist Grundlage für alles, was wir uns als Staat leisten müssen, leisten
  wollen, beim Thema der Verteidigung, beim Thema des Sozialstaates. Sie kennen es:
  Eine funktionierende Wirtschaft, ein wettbewerbsfähiger Staat ist Grundlage für
  alles. ‑ Deshalb werden die Themen der Wettbewerbsfähigkeit und des Wohlstands auch
  im Mittelpunkt der Kabinettsklausur stehen, die in der kommenden Woche am Dienstag
  und Mittwoch im Schloss Neuhardenberg stattfinden wird. Die Klausur ist ganz bewusst
  als eine Arbeitsklausur angelegt. Das Kabinett sucht ganz gezielt den Austausch
  und die Inspiration von außen und freut sich auf Gäste aus Wirtschaft, vom Handwerk
  und von Start-ups. Im Mittelpunkt ‑ das habe ich gerade schon angerissen ‑ steht
  die Frage, wie die Bundesregierung die Wettbewerbsfähigkeit in Deutschland stärken
  kann und Deutschland als starken Wirtschaftsstandort erhalten kann. Deutschland
  soll ein starkes Industrieland bleiben. Auch in Zeiten von KI wollen wir weiterhin
  zur Weltspitze gehören, in Wohlstand leben und möglichst vielen Menschen sichere
  Arbeitsplätze schaffen. Aber neben diesem inhaltlichen Teil geht es bei solch einer
  Klausur ‑ deshalb geht man ja auch in Klausur ‑ natürlich darum, miteinander ein
  bisschen Zeit außerhalb der, sage ich einmal, politischen Bannmeile zu verbringen.
  Dafür wird es dann am Abend sicherlich auch Gelegenheit geben. Das Team des Kabinetts
  ist schon eng beieinander. Aber es schadet nie, eng beieinander zu bleiben und auch
  jenseits der Themen gut miteinander auszukommen. Dafür ist es wichtig, dass man
  auch Zeiten hat, zu denen man ein bisschen abseits der Themen am Abend miteinander
  ins Gespräch kommen kann. Auch dem wird die Klausur kommende Woche dienen. So weit
  fürs Erste von mir. Das detaillierte Programm geht Ihnen auf dem üblichen Weg, wie
  gewohnt, zu. Deshalb würde ich dazu jetzt nicht weiter ins Detail gehen. Ich habe
  zwei Erklärungen. Die erste Erklärung bezieht sich auf die Ausschreibung für das
  sogenannte E1-Gebiet im Westjordanland , die gestern von der israelischen Regierung
  veröffentlicht worden ist. Dazu lautet die Erklärung des Auswärtigen Amts: Wir verurteilen
  die gestern veröffentlichte Ausschreibung von über 1000 Wohneinheiten für das israelische
  Siedlungsprojekt E1. Der Siedlungsbau verstößt gegen das Völkerrecht und einschlägige
  Resolutionen des UN-Sicherheitsrats. Er erschwert den von der internationalen Gemeinschaft
  und dem IGH geforderten Weg zur Beendigung der israelischen Besatzung des Westjordanlands
  und gefährdet damit die Perspektive einer verhandelten Zweistaatenlösung. Die Umsetzung
  des Siedlungsprojekts E1 würde das Westjordanland faktisch in zwei Hälften teilen,
  von Ostjerusalem abschneiden und somit eine Zweistaatenlösung unmöglich machen.
  Leidtragende wären in erster Linie die palästinensische Zivilbevölkerung. Wir rufen
  die israelische Regierung daher erneut auf, die Planungen für die Siedlung E1 zu
  stoppen und den Siedlungsbau im Westjordanland einzustellen. Die Bundesregierung
  wird nur solche Änderungen der Grenzen von 1967 anerkennen, die von den Konfliktparteien
  vereinbart worden sind. Jegliche Annexionspläne der israelischen Regierung lehnt
  die Bundesregierung klar ab. Die Bundesregierung wird sich weiterhin gemeinsam mit
  ihren europäischen und internationalen Partnern dafür einsetzen, dass die Voraussetzungen
  für einen nachhaltigen Frieden und eine verhandelte Zweistaatenlösung geschaffen
  werden. Die zweite Erklärung befasst sich mit einem anderen Thema. Darin geht es
  um die Erklärung der USA von gestern, Sanktionen gegen die Präsidentin des Internationalen
  Strafgerichtshofs zu verhängen. Dazu möchte ich für das Auswärtige Amt und für die
  Bundesregierung Folgendes sagen: Wir stehen zum Internationalen Strafgerichtshof
  und auch zu seiner Präsidentin Tomoko Akane. Uns ist klar, dass der Internationale
  Strafgerichtshof schlimmste Verbrechen gegen die Menschlichkeit aufgedeckt hat,
  etwa bei der Rekrutierung von Kindersoldaten in Bürgerkriegen. Er hat diejenigen
  zur Rechenschaft gezogen, die sich schwerster Verbrechen schuldig gemacht haben.
  Er kommt also seiner Aufgabe genau wie vorgesehen nach. Klar ist: Wenn es Unzulänglichkeiten
  gibt, wie bei jeder Institution, dann ist das natürlich zu kritisieren. ‑ Das ist
  für Deutschland aber unter keinen Umständen ein Anlass, diese wichtige Einrichtung
  und Errungenschaft grundsätzlich infrage zu stellen. Im Gegenteil, es ist von zentraler
  Bedeutung, den Internationalen Strafgerichtshof als unabhängige Einrichtung zu verteidigen
  und zu schützen. Herr Hille, wann war denn der letzte öffentliche Auftritt des Bundeskanzlers
  ? Es wird Sie nicht überraschen, dass ich Ihnen das aus der Hüfte nicht beantworten
  kann. Das lässt sich aber nachvollziehen. Wenn Sie es nicht selbst irgendwo finden,
  reichen wir es gern nach. Klasse, es schauen ja bestimmt viele Leute zu. Vielleicht
  kann es nachgereicht werden. Zweite Frage: Für wann ist denn der nächste öffentliche
  Auftritt des Bundeskanzlers geplant? Vielleicht beantworte ich das zuerst. Dann
  füge ich noch zwei Sätze an. In der kommenden Woche treffen wir uns zur Kabinettsklausur.
  Bei dieser werden Sie Ihre Sehnsucht nach dem Bundeskanzler auch physisch sozusagen
  wieder erfüllen können. Aber ‑ das habe ich an dieser Stelle in jeder Bundespressekonferenz,
  glaube ich, schon gesagt ‑ die Begriffe „Bundeskanzler“ und „Urlaub“ passen nicht
  wirklich richtig zueinander, weil ein Bundeskanzler nie im Urlaub ist. Aus der Tatsache,
  dass der Bundeskanzler keine öffentlichen Termine wahrnimmt, zu schließen, dass
  der Bundeskanzler im Urlaub sei, ist nicht zutreffend. Es gibt ganz viele andere
  Ebenen. Ich nenne Ihnen gleich zwei, drei, vier, auf denen Arbeit stattfindet, ohne
  öffentliche Termine wahrzunehmen. Der Bundeskanzler steht natürlich regelmäßig und
  eng mit Kabinettsmitgliedern zu Regierungsthemen in Kontakt. Der Bundeskanzler steht
  natürlich mit Staats- und Regierungschefs anderer Länder in Kontakt. Der Bundeskanzler,
  der ja, wie Sie wissen, auch Parteivorsitzender ist, ist natürlich auch in Parteithemen
  und Parteidingen unterwegs. Der Bundeskanzler nimmt sogar auch nicht öffentliche,
  aber physische Termine, beispielsweise mit anderen Leuten, im Urlaub wahr, ohne
  dass ich dabei zu sehr ins Detail gehe. Ich bin ehrlich gesagt fast ein bisschen
  erschüttert, was für Wege manche Aussagen schon finden. Nachdem ich in der vergangenen
  Woche gefragt worden bin, ob in dieser Woche eine Kabinettssitzung stattfindet,
  und ich wahrheitsgemäß gesagt habe, dass planmäßig in dieser Woche keine Kabinettssitzung
  stattfindet, wird dann eine Geschichte daraus, dass der Bundeskanzler seinen Urlaub
  um eine Woche verlängere. Ich stehe etwas entsetzt vor solchen Interpretationen,
  die mit der Wahrheit nichts zu tun haben. Das betrifft jetzt gar nicht Sie persönlich.
  Aber ich wollte einmal noch sozusagen hineinzoomen, um deutlich zu machen: Nur weil
  der Bundeskanzler öffentlich nicht in Erscheinung tritt, weil er keine öffentlichen
  Termine wahrnimmt, heißt es nicht, dass er im Urlaub ist und nichts tut. Von daher
  passen „Urlaub“ und „Bundeskanzler“ nie so wirklich gut zueinander. Bitte beziehen
  Sie es nicht auf sich persönlich. Ich habe es nur als Rampe genommen, einmal noch
  diese Einordnung vorzunehmen. Herr Hille, ich habe noch eine Frage zur Kabinettsklausur
  in der kommenden Woche: Mit welchem Stellenwert und in welchem Umfang werden Sie
  denn das Thema der Klimaanpassung und des Hitzeschutzes diskutieren? Das Thema wird
  ordentlicher Tagesordnungspunkt ‑ ‑ ‑ Wir haben ja immer ‑ das ist ein bisschen
  eine Formalie ‑ einen Teil Kabinettsklausur, und dann gibt es angehängt immer die
  formale Kabinettssitzung, die am Mittwoch dann auch in Neuhardenberg übergangslos
  nach der Kabinettsklausur stattfinden wird. Das Thema der Hitzeanpassung, der Klimaanpassung
  und alles, was damit zusammenhängt, wird als ordentlicher Tagesordnungspunkt mit
  einer Aussprache, mit Berichten mehrerer Ressorts in der Kabinettssitzung behandelt
  werden. Ich kann Ihnen heute nicht sagen, was sozusagen beschlussreif wäre und was
  nicht. Aber es ist ein fester Punkt als ordentlicher Tagesordnungspunkt. Sie wissen
  ja, dass wir zweierlei Kategorien haben: TOP-1-Themen und dann die sogenannten OTOPs,
  zu denen es immer eine Aussprache gibt. Das sind in der Regel die großen Gesetzgebungsvorhaben
  oder eben solche Themen. Wenn man es also kategorisieren will, kann man sagen: Die
  großen Themen sind OTOPs, und vieles andere läuft dann unter TOP 1. Diese sind auch
  wichtig. Wir haben eine OTOP-Aussprache zum Thema. (zu öffentlichen Auftritten des
  Bundeskanzlers ) Herr Hille, seit der Bundespressekonferenz hat sich eine vielschichtige
  Krise herauskristallisiert, und zwar betrifft sie die Außenverteidigung, die innere
  Sicherheit, den Umgang mit dem Klimawandel, Klimaanpassung und Hitzetote. Über 2000 Hitzetote
  sind zu beklagen. Die Bauern sind verunsichert. Die Ernten sind teilweise ausgefallen,
  was zu einer Verteuerung der Produkte führen wird und auch zur Belastung des Endverbrauchers.
  Es führt zu einer Verteuerung für den Endverbraucher. Wenn Sie sagen, dass der Kanzler
  nie im Urlaub ist, frage ich: Warum entscheidet sich der Kanzler nicht dafür, zur
  Lage der Nation zu den Menschen, die sehr verunsichert sind, zu sprechen? Auch wenn
  Sie jetzt sehr vieles sozusagen in den Aufgalopp der Frage eingebunden haben, auf
  das ich jetzt nicht im Detail eingehen will, will ich doch zumindest sagen, dass
  ich die Analyse, dass eine vielschichtige Krise bestehe, nicht teile. Politik besteht
  daraus, Herausforderungen, die sich bieten, zu bearbeiten. Davon haben wir im Moment
  einige. Aber es kann jetzt nicht die Rede davon sein, dass wir in einer vielschichtigen
  Krise leben. Die Sicherheitslage hat sich natürlich verändert. Darauf müssen wir
  jetzt nicht im Detail eingehen. Ich nenne sie nur als Mosaikstein. Wir haben sie
  hier schon mehrfach behandelt. Es ist eine Herausforderung, mit der wir umgehen
  müssen. Das tun wir auch. Genauso ist es bei den anderen Themen. Wir haben in der
  vergangenen Regierungspressekonferenz und auch in der vorvergangenen und auch in
  der davor über das Thema des Klimawandels, der Klimaanpassung, der Folgen für Landwirtschaft,
  für Logistik ausführlich gesprochen. Auch das möchte ich jetzt, ehrlich gesagt,
  um uns allen nicht weiter Zeit von der Uhr zu nehmen, nicht noch einmal alles wiederholen.
  Der Bundeskanzler ‑ darauf zielten Sie ja ab, und damit schließe ich an das an,
  was ich gerade auf die erste Frage gesagt habe ‑ ist bei all diesen Themen eng am
  Thema. Er begleitet die Themen, lässt sich informieren, tritt auch dann ‑ Sie verfolgen
  ja wahrscheinlich auch die Social-Media-Kanäle ‑ natürlich in Erscheinung. Wir haben
  in den vergangenen Wochen eine Sitzung des Nationalen Sicherheitsrats gehabt. Das
  hängt immer von der aktuellen Themenlage und der Dringlichkeit der Behandlung ab.
  Das Thema des Klimas ist solch ein großes Thema ‑ darüber haben wir am Montag ausführlich
  gesprochen ‑, dass es nicht damit getan ist, dass man dabei einen Schalter umlegt,
  einen Hebel umlegt, und morgen ist alles besser. Es ist ein großes Thema, das wir
  und auch schon Vorgängerregierungen auf ganz vielen Ebenen bearbeitet haben, das
  wir derzeit intensiv bearbeiten und auch die kommenden Jahre aller Voraussicht nach
  weiterhin intensiv bearbeiten werden. Herr Hille, ich habe am Montag beim Livestream
  sehr genau zugehört. Das mache ich ja immer. Sie haben versucht, darzulegen, dass
  es nichts bringe und die Situation mit der Umwelt nicht geklärt sei, wenn sich der
  Kanzler melde oder wenn er ein Statement dafür abgebe. Der Kanzler hat in Bezug
  auf die Waldbrände einen Post bei X gepostet und hat geschrieben: Wir tun das, was
  möglich ist. ‑ Ist das aufgrund der Sachlage von der Kommunikation her ausreichend?
  Ich verstehe den Zusammenhang nicht. Ich erinnere mich auch nicht an diese Worte.
  Der Bundeskanzler hat in der Phase der Waldbrände den Einsatzkräften, die an verschiedenen
  Stellen in Deutschland im Einsatz waren und auch deutlich schlimmere Entwicklungen
  durch ihren Einsatz verhindert haben, gedankt. Das halte ich auch für äußerst angemessen
  für all die beteiligten Rettungskräfte, begonnen mit, ohne dabei jemanden zu vergessen,
  der Feuerwehr, mit den Polizeien, mit der Bundespolizei, mit der Bundeswehr, mit
  dem Technischen Hilfswerk und sonstigen Institutionen, die damit beschäftigt waren,
  die Waldbrände zu bekämpfen, die Menschen, die davon betroffen waren, zu versorgen
  und mit ihrem großen Einsatz dafür gesorgt haben, dass es eben nicht zu noch schlimmeren
  Lagen gekommen ist. Ich will auch noch einmal ganz kurz zum Thema des Klimaschutzes
  im Grundgesetz nachfragen, was wir am Montag hatten. Jetzt hat der Vizekanzler ja
  gestern nachgelegt und hat der Union gesagt, sie solle keinen Hickhack darum machen.
  Er hat erklärt, warum es eigentlich wichtig wäre, eine Grundgesetzformulierung im
  Grundgesetz zu haben, nämlich weil es dann als Gemeinschaftsaufgabe zwischen Bund
  und Ländern behandelt werden könne und es für den Bund die Möglichkeit eröffne,
  in Kommunen und Ländern mehr und nicht nur Modellprojekte zu finanzieren. Deswegen
  wüsste ich ganz gern: Wird sich der Bundeskanzler bei der Klausur in Neuhardenberg
  möglicherweise dieser Argumentation des Vizekanzlers anschließen? Begonnen mit dem
  zweiten Teil: Es ist immer so eine Sache mit Dingen, die in der Zukunft liegen.
  Ich verstehe das Interesse, kann und will aber Beratungen nicht vorgreifen. Ich
  habe dem, was ich am Montag zu dem Thema hier gesagt habe, dass das innerhalb der
  Koalition und innerhalb der Bundesregierung beraten wird, nichts hinzuzufügen. Ich
  habe die Worte des Vizekanzlers jetzt auch nicht so interpretiert, wie Sie sie gerade
  interpretiert haben. Was sagen Sie zu dem Argument, dass die Definition einer Gemeinschaftsaufgabe
  dem Bund erleichtere, den Kommunen beim Klimaschutz zu helfen? Ich, Sebastian Hille,
  kann nicht beurteilen, ob es zutreffend ist oder nicht. Deshalb werde ich das auch
  nicht tun. Ich weise auf das hin, was ich gerade und am Montag auch gesagt habe:
  Dieses Thema wird ‑ „wird“ meint jetzt nicht nur „wird zukünftig“, sondern „wird
  aktuell“ ‑ in der Bundesregierung besprochen. Wie es so ist, halte ich es für ungünstig,
  dem vorzugreifen und jetzt hier Dinge zu präjudizieren, die sozusagen nach dem Besprechen
  als Ergebnis herauskommen. Deshalb müssen wir uns noch etwas gedulden. Ich weise
  noch einmal darauf hin: Kommende Woche, am Mittwoch, wird es in der Kabinettssitzung,
  die im Anschluss an die Kabinettsklausur stattfindet, ein ordentlicher Tagesordnungspunkt
  zu diesem Thema mit Berichten betroffener bzw. beteiligter Ressorts sein. Dann sind
  wir möglicherweise auch in diesen Fragen einen Schritt weiter. Aber weiter kann
  ich dem nicht vorgreifen. (zu öffentlichen Auftritten des Bundeskanzlers ) Auch
  wenn der Kanzler nie im Urlaub ist: Wann endet denn diese Phase, die irgendwie auch
  nicht der normale Gang der Dinge ist? Wann kommt er wirklich zurück? Wird es mit
  der Kabinettsklausur oder am Montag sein? Erster Teil: Wenn man sozusagen nie wirklich
  weg ist, nur weil man nicht öffentlich auftritt, kann man auch nicht wieder da sein.
  Ja, es hat schon etwas ungewollt Komisches, wenn ich Sie so lachen sehe. Das soll
  es nicht sein, sondern es soll beschreiben, was ich eingangs versucht habe, deutlich
  zu machen: Nur weil keine öffentlichen Termine stattfinden ‑ ‑ ‑ Es gibt nicht nur
  eins und null. Es gibt nicht nur öffentliche Termine ‑ dann arbeitet er ‑ und keine
  öffentlichen Termine ‑ ergo legt er die Füße hoch. Dem ist nicht so. Deshalb fällt
  es mir schwer, zu sagen, wenn jemand nicht weg ist, wann er wieder da ist. Aber
  Sie wollen doch auch nicht behaupten, Herr Hille, dass es keinen Unterschied in
  diesen Phasen gibt, oder? Ist es nicht auch gut, dass es auch Unterschiede in Phasen
  des Jahres gibt? Es tut mir leid, wenn es fast in solch eine metaphilosophische
  Richtung abgeleitet. Die Termine des Bundeskanzlers kündigen wir hier an. Das habe
  ich gerade mit Blick auf die Kabinettsklausur getan. Herr Hille, das betrifft auch
  den Bundeskanzler. Der Vizekanzler hat gesagt, dass er EU-Sanktionen gegen den Sicherheitsminister
  Ben-Gvir für richtig hielte und es für richtig hielte, dass sich der Bundesaußenminister
  damit befasse. Deshalb stelle ich an Sie die Frage, ob der Bundeskanzler solche
  Sanktionen befürwortet, und an Herrn Giese die Frage, ob das so ist und in welcher
  Weise sich der Bundesaußenminister mit dieser Frage beschäftigt, ob das also heißt,
  dass sich die Bundesregierung jetzt auf EU-Ebene für solche Sanktionen einsetzt
  und ihnen zustimmen wird. Ich würde das zum Anlass nehmen, ein klein wenig auszuholen
  und das etwas ausführlicher zu beantworten. Der Bundeskanzler verurteilt die menschenverachtenden,
  völkerrechtswidrigen Appelle von Minister Ben-Gvir scharf. Sie sind nicht hinnehmbar.
  Bei der letzten Sitzung hat der Europäische Rat die Richtungsentscheidung getroffen,
  gezielte Maßnahmen gegen radikale Politiker vorzubereiten, die zur Verletzung von
  Menschenwürde und internationalem Recht aufrufen. Diese Fragen werden die Außenminister
  in wenigen Tagen beim Gymnich-Treffen behandeln. Die Hohe Beauftragte Kallas wird
  dazu Vorschläge unterbreiten. Die jüngsten Schritte der israelischen Regierung im
  Westjordanland und ‑ ich würde das etwas weiten ‑ unter anderem die gestrige Siedlungsausschreibung
  verfolgt der Bundeskanzler mit großer Sorge. Dies hat er Premierminister Netanjahu
  immer wieder mitgeteilt, in vertraulichen Gesprächen und in öffentlichen Erklärungen.
  Diesen kritischen Austausch setzt der Bundeskanzler fort. Seine Botschaft: Es darf
  keine weiteren Annexionsschritte im Westjordanland geben, keine formellen, aber
  auch keine politischen, baulichen oder sonstigen Maßnahmen, die in ihrer Wirkung
  immer offensichtlicher auf eine Annexion hinauslaufen. Sie stehen einer Zweistaatenlösung
  entgegen. Israel muss als Besatzungsmacht Palästinenser menschenwürdig behandeln,
  ihr Eigentum schützen und öffentliche Verwaltung sowie humanitäre Versorgung sicherstellen.
  Der Bundeskanzler macht dabei immer deutlich: Deutschland steht für die Existenz
  und die Sicherheit Israels ein. Das gehört zum unveränderlichen Wesenskern unserer
  Beziehungen. Es ist Lehre aus der Schoah und Teil unserer Identität. Es ist Kompass
  der vom Bundeskanzler geführten Bundesregierung. Ich war auch angesprochen, aber
  ich glaube, es hat sich dann sozusagen schon erklärt, welchen Auftrag die Außenministerinnen
  und Außenminister haben und von wem die Vorschläge dazu kommen müssen. Es wird ja
  ein sogenanntes EU-Gymnich-Treffen der Außenminister in Irland in der übernächsten
  Woche geben. Dabei wird das ein Thema sein. Herr Hille, Sie haben jetzt diese Erklärung
  verlesen. Lässt sich die so zusammenfassen, dass der Bundeskanzler die Geduld mit
  dieser israelischen Regierung verloren hat? Wie das so ist, stehen diese Worte für
  sich. Denen habe ich nichts hinzuzufügen. Was Sie dann daraus für Interpretationen
  ziehen, obliegt Ihnen. Noch eine Ergänzung: Ich glaube, was ich gerade gesagt habe,
  war sozusagen deutlich. Ich bedauere die Form und dass ich es so verlesen musste,
  aber ich glaube, das ist in diesem Fall für alle das Beste. Ich habe im Prinzip
  noch einmal eine Nachfrage an Herrn Hille, weil ja schon sehr konkret und auch innerhalb
  der Partei des Kanzlers Sanktionsmöglichkeiten diskutiert werden, die dahin reichen,
  diesen Minister zu sanktionieren, bis aber auch dahin, Gefängnisforderungen zu stellen.
  Wo steht Friedrich Merz dabei? Auch dazu habe ich ja gerade die Perspektive genannt,
  und der Kollege Giese hat das ja auch gerade flankiert, dass sich die Außenminister
  im Gymnich-Format mit genau dieser Frage beschäftigen werden und es nicht viel Sinn
  ergibt, da jetzt präjudizierend aktiv zu werden. Aber ich glaube, das, was ich hier
  gerade für die Bundesregierung und den Bundeskanzler vorgetragen habe, ist sehr
  klar und sehr eindeutig und macht deutlich, wo wir da stehen. Ich habe noch einmal
  eine Frage, Herr Hille. Können Sie uns verraten, wie der Bundeskanzler zur Kenntnis
  genommen hat, was Herr Ben-Gvir da gestern gesagt hat? Hat er möglicherweise telefonisch
  reagiert, zum Beispiel durch einen Anruf in Jerusalem? Vielleicht öffnen Sie dieses
  Kästchen ein bisschen. Denn das ist ja wirklich nicht nur befremdlich gewesen ‑ das
  wird ja auch von allen Kommentatorinnen und Kommentatoren so gesehen ‑, sondern
  es ist ja eine Exekutionsandrohung von einem nicht unwesentlichen Mitglied des Kabinetts
  Netanjahu, die gestern auch von vielen Dolmetscherinnen und Dolmetschern in alle
  Welt getragen worden ist. Das ist ja nicht Tagesgeschäft gewesen. Deshalb habe ich
  gerade das vorgetragen, was ich vorgetragen habe. Ich kann noch einmal sagen: Der
  Bundeskanzler verurteilt die menschenverachtenden, völkerrechtswidrigen Appelle
  von Minister Ben-Gvir scharf. - Das beantwortet, glaube ich, all das, was Sie noch
  einmal wiederholt haben. Ich verstehe nicht ganz, welcher Teil der Frage sozusagen
  noch ‑ ‑ ‑ Na ja, ich wollte einfach formal wissen, wie er es an welchem Urlaubsort
  auch immer, weil er ja eigentlich nie da ist ‑ ‑ ‑ Wir spüren ja sozusagen auch
  hier die Nähe des Kanzlers und dass er eigentlich in Berlin ist. Wie hat er bzw.
  hat er reagiert? Hat er beispielsweise Sie oder Herrn Wadephul angerufen, oder was
  hat er gemacht, als er das gehört hat? Sehen Sie es mir nach, dass ich da nicht
  weiter ins Detail gehe, wenn es darum geht, bei jedem politischen Ereignis dazu
  vorzudringen, in welcher tageszeitlichen Verfassung welcher politische Entscheider
  welche Entscheidung wie aufgenommen hat. Ich glaube, das, was ich hier gerade vorgetragen
  habe, lässt in der Reaktion darauf an Klarheit nichts vermissen. Ich kann das gerne
  noch einmal wiederholen, aber ich glaube, es ist deutlich geworden. Ich habe es
  bezüglich der Sanktionen noch nicht verstanden, was das Siedlungsprojekt und auch
  den Minister angeht. Ist die Bundesregierung offen für Sanktionen, die jetzt vielleicht
