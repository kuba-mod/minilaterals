title: 'Spezialpreis der Jury für brasilianisch-deutsche Co-Produktion – Staatsminister
  Weimer: „Der deutsche Film hat in Locarno starke künstlerische Akzente gesetzt“'
text: 'Mit der heutigen Preisverleihung endet die 79. Ausgabe des Locarno Film Festivals.
  Für den deutschen Film war sie so erfolgreich wie selten zuvor. Insgesamt 20 Produktionen
  mit deutscher Beteiligung waren im Festivalprogramm vertreten, fünf davon im internationalen
  Wettbewerb um den Goldenen Leoparden. Darüber hinaus war der deutsche Film in nahezu
  allen Festivalsektionen präsent. Kulturstaatsminister Wolfram Weimer: „Der deutsche
  Film war in diesem Jahr geradezu prägend für das Festivalprogramm von Locarno. Deutschlands
  Filmkünstlerinnen und -künstler haben beindruckende Erfolge erzielt mit Geschichten,
  die weltweit ein Publikum finden sowie mit einer außergewöhnlichen Vielfalt an Perspektiven
  und filmischen Erzählformen. Damit haben sie der kreativen Kraft und internationalen
  Ausstrahlung des deutschen Films alle Ehre gemacht. Dafür danke ich allen Filmteams
  sehr.“ Staatsminister Weimer weiter: „Matheus Farias‘ und Enock Carvalhos Film „Das
  Flussufer“ wurde beim Locarno Film Festival 2026 in der internationalen Wettbewerbskategorie
  mit dem Sonderpreis der Jury ausgezeichnet. Die Jury würdigte damit Farias‘ und
  Carvalhos außergewöhnliche und einzigartige filmische Handschrift, die künstlerische
  Eigenständigkeit und erzählerischen Mut eindrucksvoll verbindet.“ Alle Preisträgerinnen
  und Preisträger finden Sie hier: www.locarnofestival.ch'
