title: Bundeskanzler Merz telefoniert mit dem Premierminister der Sozialistischen
  Republik Vietnam, Le Minh Hung
text: Bundeskanzler Merz hat heute mit dem vietnamesischen Premierminister, Le Minh
  Hung, telefoniert. Der Bundeskanzler hob die Bedeutung Vietnams als engem Partner
  in der Region und den ASEAN hervor. Er würdigte die guten Beziehungen zwischen beiden
  Staaten. Bundeskanzler Merz und Premierminister Hung vereinbarten, die wirtschaftliche
  Zusammenarbeit insbesondere zu Rohstoffen und die Kooperation bei der Fachkräfteeinwanderung
  weiter zu vertiefen. Beide sprachen gegenseitige Einladungen zu einem Besuch aus.
