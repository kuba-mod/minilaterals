title: '65. Jahrestag des Mauerbaus – Staatsminister Weimer: „Die Mauertoten mahnen
  uns, nichts zu verharmlosen.“'
text: 'Staatsminister für Kultur und Medien Wolfram Weimer gedenkt der Opfer des SED-Regimes.
  Mit dem 13. August 2026 jährt sich der Beginn des Berliner Mauerbaus zum 65. Mal.
  Heute nahm Staatsminister Weimer an der Gedenkveranstaltung für die Opfer von Mauer
  und Teilung teil. Staatsminister Weimer: „Die Berliner Mauer war fast drei Jahrzehnte
  lang das sichtbarste Symbol für die Unfreiheit und die Unterdrückung in der Deutschen
  – sogenannten Demokratischen – Republik. Sie trennte Familien, zerstörte Lebenswege
  und kostete viele Menschen das Leben. 65 Jahre nach dem Bau der Berliner Mauer gedenken
  wir heute der Opfer des SED-Regimes und all derjenigen, die ihren Drang nach Freiheit
  mit einem hohen Preis bezahlen mussten. Der temporäre Erinnerungsort am Brandenburger
  Tor, aber auch die Gedenkstätten etwa der Stiftung Berliner Mauer rücken ihre Schicksale
  in das öffentliche Bewusstsein und laden dazu ein, sich mit den Folgen von Diktatur
  und Teilung auseinanderzusetzen.“ Weimer warnt zugleich vor einem Geschichtsrevisionismus:
  „Links- wie Rechtsextreme versuchen derzeit, die DDR gezielt zu verharmlosen. Doch
  das SED-Regime war eine brutale Diktatur ohne freie Wahlen, ohne Pressefreiheit,
  ohne Reisefreiheit, dafür aber mit Stasi, Folterkellern und Todesstreifen an der
  Mauer. Da immer mehr Zeitzeugen sterben, sind Orte der Erinnerung besonders wichtig.
  Wir sollten auch die mutigen Widerstandskämpfer und friedlichen Revolutionäre von
  1989 sichtbarer ehren. Wenn die Erinnerung an die SED-Diktatur zu verblasst und
  das Unrecht und die Verbrechen verharmlost wird, beginnt Geschichtsvergessenheit.
  Eine freie Gesellschaft darf das nicht zulassen.“ In diesem Jahr stehen die individuellen
  Erinnerungen von Zeitzeuginnen und Zeitzeugen zur Teilung der Stadt sowie Biografien
  von Opfern der Mauer und ihren Hinterbliebenen im Fokus der Veranstaltung. Zeitzeuginnen
  und Zeitzeugen, die den 13. August 1961 und die Konsequenzen des DDR-Grenzregimes
  selbst miterlebten, gingen in den Dialog mit der jüngeren Generation. Vom 12. bis
  zum 17. August hat die Kulturprojekte Berlin GmbH und die Stiftung Berliner Mauer
  in Kooperation mit dem Berliner Beauftragten zur Aufarbeitung der SED-Diktatur einen
  temporären Erinnerungsort mit Installation und Open-Air-Ausstellung am Brandenburger
  Tor gestaltet sowie stadtweite Veranstaltungen organisiert. BKM förderte dieses
  Vorhaben mit 250.000 Euro.'
