  Wir haben hier über Dinge wie Ernährungssicherheit gesprochen. Wir haben hier über
  Dinge wie Sicherheit von Infrastruktur gesprochen. Die Bundesregierung folgt einem
  sehr breiten Begriff der Sicherheit. Das Gremium, in dem das mit den relevanten
  Ministerinnen und Ministern aus den jeweiligen Bereichen und je nach Themenlage
  natürlich zugeladenen Personen zusammenläuft, beschäftigt sich dann zielführend
  und fachübergreifend mit diesen Fragen. Ich glaube, das ist genau das Instrument,
  das in einer Zeit, in der sich die Sicherheitslage in den vergangenen Jahren auch
  so massiv verändert hat, genau richtig und angezeigt ist. Jetzt haben Sie nur wiederholt,
  was ich gerade schon gesagt habe, nämlich dass man da jetzt sprechen kann. Man trifft
  sich, man spricht sich, das haben wir ja verstanden. Dieses Gremium gab es jetzt
  aber 80 Jahre lang nicht, und ich hätte gerne den tatsächlichen Nutzen verstanden.
  Treffen und Sprechen ist die Grundlage dafür, dass man dann auch Entscheidungen
  vorbereitet und trifft. Bevor man Entscheidungen trifft, muss man sich über ein
  Thema ein Bild machen, das sich aus ganz vielen verschiedenen Perspektiven ergibt.
  Wenn wir als Beispiel das große Thema Cybersicherheit nehmen ‑ ohne dass das jetzt
  bedeutet, dass sich der Nationale Sicherheitsrat damit zeitnah beschäftigt hat oder
  beschäftigen wird ‑: Dieses Thema hat ja unglaublich viele Facetten. Das ist nicht
  in einem einzelnen Ressort ‑ nicht nur im Digitalministerium, nicht nur im Innenministerium,
  nicht nur im Verteidigungsministerium oder in einem beliebigen anderen Ressort ‑
  aufgehängt. Daran zeigt sich, wie breit und fachübergreifend Themen heute begriffen
  werden müssen. Genau das geschieht im Nationalen Sicherheitsrat. Da wird nicht nur
  zusammengesessen und sich ausgetauscht; vielmehr ist das ist die Grundlage dafür,
  dass dort dann auch Entscheidungen getroffen werden. Sie wissen aber ‑ auch das
  sei für das Protokoll hinterhergesagt ‑, wie es sich mit der Geheimhaltung im Nationalen
  Sicherheitsrat begibt. Auch da können und werden wir also nicht zu sehr ins Detail
  gehen. An das Finanzministerium: Der Bund der Steuerzahler und die Union kritisieren
  die geplanten Steuerentlastungen als unzureichend. Ist das Finanzministerium im
  Zuge der Ressortabstimmungen und des parlamentarischen Verfahrens offen für weitergehende
  Entlastungen? Meine zweite Frage betrifft einen Teilaspekt, nämlich die Kritik an
  der Reduzierung der Steuervergünstigungen für Vereine. Sind hier noch Zugeständnisse
  seitens des Ministeriums denkbar? Vielen Dank. ‑ Sie wissen, dass die Abstimmungen
  zur Einkommensteuerreform innerhalb der Bundesregierung gerade laufen. Insofern
  bitte ich um Verständnis dafür, dass wir zu Einzelheiten noch nicht detailliert
  Stellung nehmen können. Das machen wir dann, sobald diese Abstimmungen abgeschlossen
  sind. Da die Debatte aber recht gut läuft, möchte ich trotzdem ein paar Einordnungen
  machen. Allgemein ist erst einmal festzuhalten, dass wir genau das umsetzen, was
  im Koalitionsausschuss beschlossen wurde und auch schon im Koalitionsvertrag vorgesehen
  war: Es geht nämlich genau darum, kleine und mittlere Einkommen zu entlasten. Die
  Reform erfolgt in zwei Stufen: die erste Stufe in 2027 und die zweite Stufe in 2028.
  In 2028 wird man im Vergleich zu 2026 insgesamt auf eine Entlastung von zehn Milliarden
  Euro kommen. Das entspricht, wie gesagt, auch genau der Vereinbarung, die man im
  Koalitionsausschuss getroffen hat, mit dem Ziel, kleine und mittlere Einkommen zu
  entlasten. Zu den Vereinen: Es ist vielleicht gut, auch das noch einmal einzuordnen.
  Diese Regelung geht auf einen Prozess zum Subventionsabbau zurück. Dieser Prozess
  war Teil der Überlegungen, wie man eine Konsolidierung des Haushalts hinbekommt.
  Wichtig ist auch: Diese Regelung ist nicht Bestandteil der Gegenfinanzierung der
  Einkommensteuerreform. Wenn sie so käme, wäre das eine Regelung, die vor allem auf
  Vereine abzielt, die besonders groß sind und wirtschaftliche Gewinne erzielen. Wir
  haben ja ohnehin ein Problem, Ehrenamtliche für Vereine zu gewinnen, und die große
  Sorge ist, dass denen jetzt auch noch die Möglichkeit genommen wird, sich da zu
  betätigen und dafür Steuervergünstigungen zu bekommen, das nicht versteuern zu müssen.
  Sie sagen also, dass das den Großteil der Vereine gar nicht betrifft? Genau. Die
  meisten gemeinnützigen Vereine wären von dieser Änderung nicht betroffen. Insbesondere
  ehrenamtliche und gemeinnützige Vereinsarbeit ist davon nicht betroffen. Der Knackpunkt,
  um den es geht, ist eben, wenn damit wirtschaftliche Interessen verfolgt werden.
  An Herrn Giese: Der deutsche Staatsangehörige , der vor zwei Wochen in Niger verschleppt
  wurde, ist jetzt offenbar in Algerien; zumindest hat das algerische Verteidigungsministerium
  gesagt, dass er bald an die deutschen Behörden übergeben werden solle. Ist das schon
  passiert? Der genannte Fall ist uns bekannt. Im Übrigen bitte ich um Verständnis
  dafür, dass wir uns zu einzelnen Entführungsfällen generell nicht äußern. Da das
  algerische Verteidigungsministerium jetzt schon relativ viel gesagt hat: Können
  Sie zumindest bestätigen, dass sich das so zugetragen hat? Wenn ich da etwas zu
  bestätigen hätte, würde ich es Ihnen nachliefern. Zum jetzigen Zeitpunkt kann ich
  Ihnen jedenfalls nichts mitteilen. (zum Nahostkonflikt ) An Herrn Giese und vielleicht
  auch an Herrn Hille: Der israelische Premierminister Netanjahu hat den 15-Punkten-Plan
  des Gaza-Friedensrats wieder abgesagt. Gibt es dazu eine Stellungnahme der deutschen
  Bundesregierung? Was halten Sie davon? Wir haben als Bundesregierung zur Kenntnis
  genommen, wie sich der israelische Premierminister dazu geäußert hat. Es ist vollkommen
  klar, dass bei einem so komplexen Unterfangen sehr viele offene Fragen bestehen.
  Ich glaube, es gab da möglicherweise von Anfang an einen sichtbaren oder nicht so
  sichtbaren Dissens oder Unklarheiten, was die Sequenzierung angeht, wer sich wann
  und wie entwaffnen muss und wann ein Abzug der israelischen Streitkräfte erfolgen
  kann. Dennoch gilt, dass die vorgestellten Pläne aus Sicht der Bundesregierung eine
  Chance darstellen, Fortschritte bei der dringend notwendigen Entwaffnung der Hamas
  zu erzielen. So hat sich auch der Außenminister geäußert. Deswegen appellieren wir
  weiter an beide Seiten, diese Pläne konstruktiv umzusetzen. Was bedeutet das für
  den Friedensrat insgesamt? Kann man das noch als Erfolg bezeichnen oder muss man
  sagen, dass das nicht so gut zu funktionieren scheint? Wie Sie wissen, sind wir
  nicht Mitglied in diesem Friedensrat; deswegen würde ich das nicht von außen kommentieren
  wollen. Ich glaube, der Friedensrat müsste sich selber dazu äußern, wie er das einschätzt.
  Herr Giese, können Sie uns sagen, an was sich Israel aus Sicht der Bundesregierung
  seit dem sogenannten Waffenstillstand eigentlich hält? Wir bekommen ja täglich mit,
  dass in Gaza bombardiert wird und Kinder getötet werden. An was hält sich Israel
  aus Sicht der Bundesregierung? Ich glaube, ich habe gerade gesagt, was die Bitte
  und der Appell der Bundesregierung ist. Wir unterstützen die Bemühungen, eine Befriedung
  herbeizuführen, deren Voraussetzung die Entwaffnung der Hamas ist, und zu beschleunigen,
  dass es zu einer größeren Lieferung von humanitären Mitteln nach Gaza kommt. Ich
  glaube, es gibt Schritte, die dazu unternommen werden. In der vergangenen Woche
  veröffentlichte das Bundesverteidigungsministerium beispielsweise eine Pressemitteilung,
  in der es hieß, Deutschland werde die Wiedereröffnung des Grenzübergangs Erez unterstützen,
  einschließlich Maßnahmen zur Beschleunigung der Abfertigung. Die Bundesregierung
  tut das, was wir tun können, um zu einer Verbesserung der Lage beizutragen. Dass
  wir den 15-Punkte-Plan und den damit verbundenen Anspruch, demnächst die nächsten
  Schritte zur Befriedung in Gaza zu gehen, unterstützen, habe ich, glaube ich, eben
  ausreichend betont. Der Rückzug der Israelis aus Gaza ist ja Teil eines Stufenplans,
  genauso wie die schrittweise Entwaffnung der Hamas. Das lehnt Israel jetzt ab. Dass
  die humanitäre Versorgung weiterhin etwas anderes als ungenügend ist, wäre mir neu.
  Ich stelle hier jetzt auch fest, dass Sie uns auch keinen Aspekt nennen können,
  an den sich Israel aus Sicht der Bundesregierung hält. Ich glaube, die Position
  der Bundesregierung habe ich gerade erläutert. Aber Sie können meine Frage nicht
  beantworten. Einer der Dissenspunkte ist ja die Frage, wie die Entwaffnung von Hamas
  umgesetzt werden soll. Nach meiner Kenntnis beinhaltete der 15-Punkte-Plan, dass
  nach der Entwaffnung der Hamas die Waffen dennoch unter palästinensischer Kontrolle
  bleiben sollen bzw. in palästinensische Kontrolle außerhalb der Hamas überführt
  werden sollen. Damit ist Netanjahu nicht einverstanden, das lehnt er ab. Unterstützt
  die Bundesregierung dieses Prozedere zur Entwaffnung der Hamas bei Verbleib der
  Waffen unter palästinensischer Kontrolle? Ich habe gerade gesagt ‑ und habe das
  auch noch einmal wiederholt ‑, wie sich der Bundesaußenminister dazu über X geäußert
  hat. Das ist auch die Position, die wir weiterhin verfolgen. Wir unterstützen diesen
  Plan als eine Möglichkeit, zu einer dauerhaften Befriedung zu kommen. Es ist allerdings
  komplex, wie Sie gerade schon angemerkt haben. Diese Fragen, die jetzt im Detail
  noch zu klären sind, müssen zwischen den Parteien geklärt werden. Wir rufen die
  Parteien dazu auf, diese Klärung zu übernehmen. Ganz klar ist allerdings, dass Israel
  ein sehr berechtigtes Sicherheitsinteresse hat. Wenn sich die Hamas weigert, sich
  zu entwaffnen, wird es für die IDF sehr schwer, sich zurückzuziehen. Die Frage war
  ja, ob die Bundesregierung diesen Stufenplan, der im 15-Punkte-Plan meiner nach
  Kenntnis vorgesehen ist, unterstützt: Entwaffnung der Hamas, aber Verbleib der dann
  von der Hamas abgelegten Waffen unter palästinensischer Kontrolle. Das habe ich
  Ihrer Antwort jetzt nicht entnehmen können. Sie fragen mich zu Einzelheiten eines
  Vertrages, dessen Partei wir nicht sind. Wir wollen da nicht präskriptiv vorgehen
  und den Konfliktparteien vorschreiben, was die richtige Lösung ist. Wichtig ist,
  dass man zu einer Lösung kommt. Das beschriebene Verfahren kann ein Weg dazu sein.
  Ob es der einzige Weg ist, vermag ich nicht zu beurteilen. Wenn es da noch Nachverhandlungen
  bedarf oder eine weitere Notwendigkeit gibt, über Einzelheiten dieser Abkommen zu
  sprechen, dann sollten die Parteien das tun. Ich werde jetzt nicht von Berlin aus
  sagen: Das ist die richtige Lösung. Dafür dauert dieser Konflikt schon zu lange,
  glaube ich. An Herrn Mühlhausen: Der Deutsche Gewerkschaftsbund kritisiert, durch
  Mindestlohnbetrug seien binnen zehn Jahren wirtschaftliche Schäden in Höhe von 64 Milliarden
  Euro entstanden. Können Sie das bestätigen? Nein, das kann ich nicht bestätigen.
  Das sind nicht unsere Zahlen. Für uns als Arbeitsministerium ist wichtig zu sagen:
  Die Umgehung des Mindestlohns ist kein Kavaliersdelikt; dem gehen wir nach. Es handelt
  sich dabei oftmals auch um Arbeitszeitbetrug. Ich müsste an dieser Stelle aber noch
  kurz darauf hinweisen, dass für die Überprüfung der Einhaltung des Mindestlohns
  die Finanzkontrolle Schwarzarbeit zuständig ist. Diese haben wir in der laufenden
  Legislaturperiode auch noch einmal gestärkt. Dazu würde ich aber an das BMF übergeben
  wollen. Ich übernehme gerne. ‑ Also die Bekämpfung von Schwarzarbeit und illegaler
  Beschäftigung hat für den Bundesfinanzminister natürlich höchste Priorität. Der
  Kollege Mühlhausen hat es gerade schon erwähnt: Es gibt die Finanzkontrolle Schwarzarbeit,
  die beim Zoll angesiedelt ist und die durch umfangreiche Prüfungs- und Ermittlungsverfahren
  sowie die konsequente Ahndung von Verstößen entscheidend zur Sicherung der Sozialsysteme
  und der Staatseinnahmen beiträgt. Vielleicht noch einmal zur Einordnung: Verstöße
  gegen den Mindestlohn sind ein Aspekt, der da geprüft wird, aber es geht natürlich
  insgesamt um andere Themen, wie zum Beispiel, ob der Arbeitgeber die Beschäftigten
  ordnungsgemäß in der Sozialversicherung anmeldet oder ob Sozialleistungen zu Unrecht
  bezogen wurden etc. Wie gerade schon erwähnt, haben wir die FKS im letzten Jahr
  noch einmal gestärkt und modernisiert, auch durch KI-Einbindung etc. Zu Statistiken
  von anderen können wir uns natürlich nicht verhalten. Es ist uns aber ein sehr wichtiges
  Anliegen, dass der Mindestlohn eingehalten wird, und dafür setzt sich die FKS sehr
  stark ein. Ich wollte als Wiedereinsteiger nicht mit leeren Hemden kommen, deswegen
  habe ich für Sie noch einen Service- und Recherchehinweis zur E-Auto-Förderung :
  Das Bundesamt für Wirtschaft und Ausfuhrkontrolle wird ab heute monatlich eine Förderstatistik
  zu den aktuellen Zahlen der E ‑ Auto ‑ F ö rderung ver ö ffentlichen und damit r
  ü ckblickend ü ber den F ö rderstand informieren. Sie sehen auf der Webseite des
  Bundesamtes jetzt also den Stand mit Stichtag 1. August. Im Fokus liegen dabei vor
  allen Dingen die Zahl der Bewilligungen und die Höhe der ausgezahlten Fördermittel.
  Außerdem ist jetzt alles nach Antriebsart, Finanzierungsart, Einkommen und Haushalten
  mit Kindern sowie nach Herstellern, Marken und Modellen aufgeschlüsselt. Diese Zahlen
  werden jetzt also jeden Monat r ü ckblickend für den Vormonat veröffentlicht. Herr
  Haufe, der Autoexperte Dudenhöfer fordert heute, die E-Auto-Förderung abzuschaffen.
  Die Begründung ist, die E-Autos verkauften sich von selbst. Es ist ja eine Zeit
  der Sparzwänge. Ist das für Sie eine Option? Die E-Auto-Förderung ist im Koalitionsvertrag
  vereinbart und entsprechend umgesetzt worden. Es gibt eine gezielte soziale Staffelung
  und Förderung. Die jetzige Förderung erreicht Einkommensgruppen, die bisher gar
  keine so starke Förderung bekommen konnten, weil von der sozialen Staffelung vor
  allen Dingen Haushalte mit kleinen und mittleren Einkommen profitieren. Das funktioniert
  auch, das sehen wir. Wir können sagen, dass sieben von zehn Haushalten, die von
  der Förderung profitieren, höchstens ein zu versteuerndes Einkommen von 60 000 Euro
  haben. Die Hälfte der Haushalte, die profitieren, haben ein versteuerndes Einkommen
  von höchstens 45.000 Euro. Es war ja auch das Ziel des Ministers, die Förderung
  der Elektromobilität in einen Bereich von Haushalten bzw. von Menschen zu bringen,
  die bisher aufgrund der höheren Preise sehr zurückhaltend waren. Denn klar ist:
  Der Aufbau der E-Mobilität, die Verstromung des Verkehrs, das Fahren mit Strom hat
  in Deutschland immer wieder eine gewisse Zurückhaltung erlebt. Es hat ja eine Weile
  gedauert, ehe wir diesen Hochlauf hinbekommen konnten. Der Hochlauf der Elektromobilität
  im Verkehr und das Umstellen auf Strom ist einerseits eine zentrale Klimaschutzmaßnahme;
  es ist zweitens eine wichtige Vorsorgemaßnahme zur Erreichung einer größeren Abhängigkeit
  von Öl und Gas im Verkehrsbereich. Da wir in bestimmten Teilen der Bevölkerung bei
  der Elektromobilität eine Zurückhaltung gesehen haben, war dieses Programm genau
  dafür gedacht, und es wirkt aus unserer Sicht auch in dieser Richtung.'
