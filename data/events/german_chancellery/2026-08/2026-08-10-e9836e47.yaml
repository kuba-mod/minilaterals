date: '2026-08-10'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 10. August 2026
text: 'stellvertretender Regierungssprecher Hille (Vorsitzender Feldhoff eröffnet
  die Pressekonferenz und begrüßt SRS Hille sowie die Sprecherinnen und Sprecher der
  Ministerien.) Eine Frage an Frau Dr. Kock vom BMI: Es gibt einen neuen Medienbericht,
  wonach der Busfahrer am Leipziger Flughafen die Drohne gar nicht aus der Luft gefischt
  habe, sondern dass sie erst später am Boden gefunden wurde, nachdem sie gegen das
  ukrainische Flugzeug geprallt ist. Können Sie dazu ein paar neue Einzelheiten nennen?
  Eine zweite Frage an Herrn Müller vom BMVg und an Sie, Frau Dr. Kock: Es gibt wenig
  überraschend neue Forderungen, die Bundeswehr stärker im Inneren einzusetzen, insbesondere
  bei der Drohnenabwehr und an Flughäfen. Sehen Sie dafür rein sachlich eine Notwendigkeit?
  Würde das etwas bringen oder das Kompetenzwirrwarr noch komplizierter machen? Zu
  Ihrer ersten Frage fällt mir die Antwort relativ leicht: Es handelt sich um laufende
  Ermittlungen des Generalbundesanwalts. Ihre Fragen müssten Sie bitte dorthin richten.
  Das sind Details, die im Zuge der Ermittlungen geklärt werden und aufgeklärt werden.
  Zur zweiten Frage würde ich meinem Kollegen vom Verteidigungsministerium den Vortritt
  lassen. Die Befugnisse in Deutschland sind klar geregelt. Es gab eine Änderung zu
  § 15 des Luftsicherheitsgesetzes. Dort ist der Einsatz der Streitkräfte für diesen
  Zweck klar geregelt. Darüber hinaus sehe ich aktuell keine Maßnahmen oder weiterführenden
  Maßnahmen, um das zu ändern. Die Zuständigkeiten liegen bei den Behörden der inneren
  Sicherheit oder bei den Betreibern, zum Beispiel bei kritischer Infrastruktur. Die
  Bundeswehr kann subsidiär entweder bei der Detektion oder auch zur Verhinderung
  eines katastrophalen Schadenereignisses hinzugezogen werden und kann bei der Abwehr
  von sogenannten UAAs unterstützen. Daher sind die Zuständigkeiten aus meiner Sicht
  ganz klar geregelt. Herr Müller, das ist schon klar, aber wenn man sich den Vorfall
  in Leipzig vor Augen führt: Das Ganze geht ja so schnell, und es ist auch nicht
  immer leicht erkennbar, ob gleich ein katastrophaler Unfall droht oder nicht. Die
  Subsidiarität erfordert Absprachen, erfordert auch rechtliche Einschätzungen. Ist
  es denn praktikabel, es so zu machen, wie es jetzt geregelt ist? Der Gesetzgeber
  hat sich ganz klar dafür ausgesprochen, hat es in einem längeren Verfahren im Bundestag
  auch genau so geregelt, aus gutem Grund. Aber Sie müssen ja die andere Frage stellen,
  welche anderen Maßnahmen zu welchem Erfolg führen würden. Bei zig Regionalflughäfen -
  ich habe die Zahl nicht im Kopf -, bei großen Flugplätzen, bei internationalen Flugplätzen,
  bei Militärflugplätzen, bei 1000 Liegenschaften der Bundeswehr, bei ca. 300 Großstandorten
  haben wir bei unserem eigenen Bereich schon die Herausforderung, die wir oftmals
  ganz klar kommuniziert haben: Sie können eine Detektions- und Abwehrfähigkeit nicht
  rund um die Uhr an Zehntausenden Zaunkilometern bereitstellen. Das wird also nicht
  funktionieren. Diese trügerische hundertprozentige Sicherheit - da brauchen wir
  uns nichts vorzumachen - wird es nicht geben. Was die Bundeswehr angeht, kann ich
  nur sagen: Wir haben für unsere Schwerpunktliegenschaften, wo es sensible Aktivitäten
  gibt, wo zum Beispiel besonders schutzwürdige Informationen vorhanden sind, entsprechende
  Maßnahmen ergriffen. Wir haben für alle Teilstreitkräfte mobile Drohneneinsatztrupps,
  die schnell abgerufen werden können, die in ständiger Bereitschaft sind und die
  auch schon im Ausland tätig waren. Das wissen Sie ja. Aber jetzt eine Ausweitung
  auf die Bundeswehr zu fordern, um auch zivile Infrastruktur 24/7 zu schützen, würde
  eine Scheinsicherheit proklamieren, die wir nie erreichen können. Dafür ist einfach
  die Lage so, dass wir zu viel Fläche, zu viel Raum, zu viel Kilometer schützen würden.
  Das geht nur im Verbund, das geht nur mit Schwerpunktsetzung, das geht durch lokale
  reaktionsschnelle Maßnahmen. Da sind vor allen Dingen erst einmal die Betreiber
  und die Innensicherheitsbehörden gefordert. Wir unterstützen, so wie es der Gesetzgeber
  festgelegt hat, nach § 15, wenn es benötigt wird. Noch eine Frage an Frau Kock:
  Der Minister hatte fremde Mächte als möglichen Urheber genannt. Lässt sich das mittlerweile
  konkretisieren? Auch das ist Teil der laufenden Ermittlungen. Er hat gesagt, dass
  wir es mit einem hybriden Anschlagsszenario zu tun haben - das ist richtig -, und
  auch von fremden Mächten gesprochen. Aber alles Weitere, wie gesagt, ist Gegenstand
  der laufenden Ermittlungen des Generalbundesanwaltes. Dann noch die Frage an Herrn
  Hille: Wann ist mit einer Stellungnahme des Kanzlers zu diesem Thema zu rechnen?
  Wie Sie sich vorstellen können, begleitet der Bundeskanzler dieses Thema intensiv.
  Er ist in intensivem Kontakt, vor allen Dingen mit dem Bundesinnenminister und auch
  mit allen anderen in diesen Fragen relevanten Stakeholdern. Wie Sie ebenfalls wissen,
  kann und werde ich inhaltlich nicht viel dazu sagen. Aber am Freitag hat sich genau
  zu diesem Thema auch der Nationale Sicherheitsrat zusammengefunden und über die
  Lage ausgetauscht, sodass Sie davon ausgehen können, dass der Bundeskanzler in diesem
  Thema bestens dabei ist, das Thema engstens begleitet und für alle etwaigen, möglichen,
  nötigen Schritte immer verfügbar ist. Eine Nachfrage an Herrn Hille zum Grundgesetz
  im Zusammenhang mit der Drohnenabwehr: Wie sieht denn der Bundeskanzler das? Erwägt
  er eine Grundgesetzänderung und den Einsatz der Bundeswehr im Innern in diesem Fall,
  oder sieht er Deutschland gut genug geschützt? Ich verstehe nicht ganz, worauf Sie
  sich beziehen, aber die grundsätzliche Lage hat Ihnen Kollege Müller ja gerade geschildert.
  Wir sind gut aufgestellt. Wir sind - das ist nichts Neues - hybriden Bedrohungslagen
  ausgesetzt. Darauf haben wir, seitdem diese Bundesregierung im Amt ist, noch einmal
  im Besonderen reagiert. Als Stichworte nenne ich das Gemeinsame Drohnenabwehrzentrum
  und das Gemeinsame Abwehrzentrum Hybrid, die sich genau mit diesen Thematiken übergreifend
  auseinandersetzen, um gemeinsam schnellstmöglich zu den nötigen Entscheidungen zu
  kommen. Daher sehen wir uns, was die rechtliche Lage angeht, gut aufgestellt. Auch
  die Veränderung des Luftsicherheitsgesetzes hat Kollege Müller Ihnen gerade erläutert.
  Mit Blick auf die Drohnenabwehr, an Frau Kock gerichtet: Können Sie den Medienbericht
  bestätigen, wonach ein Technologie- und Forschungszentrum zur Drohnensicherheit
  in Cochstedt bei Magdeburg am dortigen DLR-Standort errichtet werden soll? Welche
  Rolle spielt das BMI dabei? Das ist richtig. Wir können die Medienberichterstattung
  bestätigen. Es wird in der kommenden Woche, am 18. August ein neues Technologiezentrum
  Drohnensicherheit am Standort Cochstedt des Deutschen Zentrums für Luft- und Raumfahrt
  eröffnet werden. Gemeinsam mit dem DLR errichten wir dort mit dem neuen Technologiezentrum
  eine bundesweit einzigartige Einrichtung, in der innovative Technologien für Drohnensicherheit
  in Reallaboren erforscht werden können, entwickelt werden können und vor allen Dingen
  auch vor Ort erprobt werden können. Da werden wissenschaftliche Exzellenz, technologische
  Innovation und Anforderungen der Sicherheitsbehörden zusammengeführt. Wir machen
  das gemeinsam mit dem Forschungsministerium. Eine Frage an Frau Kock zur Drohnenabwehreinheit:
  Wie viele Bundespolizisten stehen denn aktuell bei dieser Einheit zur Verfügung?
  Die „BILD“-Zeitung berichtet, dass sie auf 300 aufgestockt werden soll. Können Sie
  das bestätigen? Wenn Sie das bestätigen können: Bis wann soll das passieren? Die
  Drohnenabwehreinheit bei der Bundespolizei befindet sich derzeit noch im Aufbau.
  Es ist richtig: Der Minister wird noch heute eine Weisung an die Bundespolizei erteilen,
  den Ansatz der Spezialkräfte, die in diesem Bereich eingesetzt sind, auf 300 auszuweiten
  und auch die Zahl der Standorte zu erhöhen. Es sind bislang vier Standorte geplant,
  es werden acht - dies vor allen Dingen, um möglichst in der Fläche in ganz Deutschland
  vor Ort zu sein, um schnell und flexibel bei Bedarf vor Ort zu sein. Eine Frage
  an Frau Kock: Beim Wording über die Urheberschaft [der Drohne] ging es ein bisschen
  hin und her. Manchmal war sehr direkt Russland als mutmaßlich nutznießender Part
  genannt worden. Jetzt hat der Minister sich auf ausländische Mächte festgelegt.
  Das deutet auf die Annahme staatlicher Urheberschaft hin. Eine Macht ist eine politisch-staatliche
  Form. Schließt dies aus, dass es Gruppen geben kann, die sich in aktivistischer
  Selbstorganisation - bei Nord Stream hat es so etwas vielleicht auch gegeben - betätigen,
  aber nicht im Auftrag oder unter Anleitung einer staatlichen Macht handeln? Sind
  sie inbegriffen, oder sind sie durch den Begriff ausgeschlossen? Zum einen meine
  ich mich richtig zu erinnern, dass der Minister von fremden Mächten und nicht von
  ausländischen Mächten gesprochen hat. Das ist ein kleiner, aber feiner Unterschied.
  Zum anderen haben wir - ich meine, auch der Minister - bereits gesagt: Es wird im
  Moment in alle Richtungen ermittelt. Das schließt möglicherweise so etwas ein wie
  das, was Sie genannt haben. Dann habe ich eine Frage an Herrn Hille: Trifft der
  Begriff „Drohnenabwehrzentrum“ inhaltlich das, was da gemacht werden kann, oder
  nicht? Von Kritikern wird gesagt, es handele sich dabei nicht um ein Abwehrzentrum,
  weil da keine Abwehr betrieben werde, sondern um einen Informationsaustausch, eine
  Art runder Tisch. Ist da nicht der Begriff „Drohnenabwehrzentrum“ in gewisser Weise
  ein Euphemismus, der etwas behauptet, was es realiter so gar nicht gibt? In Anbetracht
  der fachlichen Zuständigkeit ist da die Kollegin Kock die deutlich bessere Auskunftsgeberin.
  Deshalb würde ich das an sie weitergeben. Ich verstehe, ehrlich gesagt, Ihre Frage
  nicht so ganz. Wir haben wirklich schon sehr viele Jahre ein Gemeinsames Terrorismusabwehrzentrum.
  Das wird nicht infrage gestellt. Das ist eine funktionierende Kooperationsplattform.
  Für den Bereich der Drohnenabwehr wurde aufgrund der vielen Zuständigkeiten im Bund
  und in den Ländern - Sie sehen allein schon an unseren Antworten hier: auch innerhalb
  der Bundesregierung - das Gemeinsame Drohnenabwehrzentrum gegründet. Das ist kein
  runder Tisch, sondern es ist ein Koordinierungszentrum, in dem alle Beteiligten
  gemeinsam sitzen, gemeinsam Lagen besprechen, Lagen analysieren und auch entscheiden.
  Es ist keine operative Einheit, genauso wie das Gemeinsame Terrorismusabwehrzentrum
  keine operative Einheit ist. Frau Kock, es geht mir noch einmal um die Drohnenabwehreinheit.
  Waren der geschilderte Aufwuchs und die Erhöhung der Zahl der Standorte im Zuge
  des Aufbaus ohnehin geplant, oder handelt es sich jetzt um eine neue Zahl? Oder
  wird etwas vorgezogen? Mir geht es darum, die Relation zu den bisherigen Planungen
  einschätzen zu können. Das beantwortet sich vielleicht von alleine. Ich habe ja
  gesagt: Die Weisung ergeht heute an die Bundespolizei. Es könnte ja sein, dass jetzt
  etwas vorgezogen wird, was ohnehin geplant war. Verstehe ich Sie richtig, dass es
  etwas Neues ist? Es ist jetzt eine Entscheidung des Ministers, ja. Frau Kock, wenn
  Sie „fremde Mächte“ sagen, ist das ja die Mehrzahl. Hat das damit zu tun, dass es
  sich um zwei Drohnen handelt und damit um zwei staatliche Akteure, von denen der
  Minister spricht? Ein netter Versuch! Noch einmal der Verweis auf die laufenden
  Ermittlungen des Generalbundesanwaltes. Aber ich denke, Sie verstehen meine Frage
  nach der Mehrzahl. Sie sprechen nicht von einer fremden Macht, sondern von fremden
  Mächten. Das verstehe ich. Dass „Mächte“ die Mehrzahl von „Macht“ ist, verstehe
  ich durchaus. Wie gesagt, es sind laufende Ermittlungen. Sie gehen, wie ich gerade
  auch schon gesagt habe, in verschiedenste Richtungen. Sie haben auf die Frage von
  dem Kollegen gerade von allen Richtungen gesprochen. Wenn der Minister aber von
  fremden Mächten spricht, schließt er damit einheimische Mächte aus. Wir haben auch
  inländische Terrorgefahr. Warum tut er das? Der Minister ermittelt nicht. Es ermittelt
  der Generalbundesanwalt. Aber Sie hatten gesagt, es wird in alle Richtungen ermittelt.
  Dementsprechend müsste man auch einheimische Mächte einbeziehen, oder? Ich kann
  mich nur wiederholen: Der Generalbundesanwalt ermittelt nach meinem Kenntnisstand
  in alle Richtungen. Meine Frage richtet sich wahrscheinlich an das BMV oder das
  BMI: Können Sie einen Überblick geben, welche Techniken zur Drohnenabwehr an den
  deutschen Flughäfen zur Verfügung stehen? Geschieht das elektromagnetisch, kinetisch
  oder mit anderen Verfahren? Dann noch eine Frage zu den Zuständigkeiten: Die Bundespolizei,
  aber auch die Flugsicherung und teilweise die Flughafenbetreiber sind für die Detektion
  zuständig. Können Sie einmal genau erläutern, wo da die Zuständigkeiten verlaufen?
  Zu der beschafften Technik und auch der Technik, die an den einzelnen Flughäfen
  vorhanden ist, kann ich Ihnen nur sagen, dass inzwischen nach meinem Kenntnisstand
  alle Flughäfen, die priorisiert sind, ausgestattet sind, auch mit mobilen Drohnenabwehreinheiten.
  Ich bitte um Verständnis, dass wir öffentlich keine näheren Ausführungen zur genauen
  Technik machen können. Zu den Zuständigkeiten finden Sie eine sehr gute Darstellung
  unter www.bundesregierung.de. Darauf verweise ich gerne. Es ist relativ einfach:
  Die Bundespolizei ist auf dem Flughafengelände für die Drohnenabwehr zuständig,
  außerhalb des Flughafens die Landespolizei. Wie Kollege Müller schon erläutert hat,
  wurde mit dem neuen Luftsicherheitsgesetz geregelt, dass auch die Bundeswehr zur
  Unterstützung beigezogen werden kann. Auch die Bundespolizei kann in Amtshilfe unterstützen.
  Ich beziehe mich auf eine Nachreichung Ihres Ministeriums. Da hieß es, dass auch
  die Flugsicherung und die Flughafenbetreiber an manchen Stellen zuständig seien.
  Sie können beispielsweise Systeme zur Drohnendetektion auch inszenieren. Ich habe
  eine Frage zu den Standorten, an denen die Drohnenabwehreinheit ist und ausgebaut
  werden soll. Welches sind die vier Standorte? Welches sind die acht Standorte, die
  dann kommen sollen? Meine zweite Frage bezieht sich auf die Zuständigkeit. Es gibt
  Forderungen aus der CDU, auch von den Grünen, die Zuständigkeit für die Drohnenabwehr
  insgesamt bei der Bundespolizei zu bündeln. Was sagen Sie dazu? Zu Ihrer ersten
  Frage: Ich bin mir nicht sicher, ob wir Ihnen das mitteilen können. Das würde ich
  aber selbstverständlich gerne prüfen. Die Idee ist einfach, möglichst verteilt in
  Deutschland mehrere Standorte zu haben. Ich könnte mir durchaus vorstellen, dass
  es auch darauf ankommt, wo die Bundespolizei schon Fähigkeiten hat und wo es vielleicht
  Synergieeffekte gibt. Dies spielt bei so etwas immer eine Rolle. Es wäre super,
  wenn Sie das nachreichen, auch die Zahl der Kräfte in der Drohnenabwehreinheit.
  Genau. – Was war Ihre Frage zur Zuständigkeit? Es gibt immer wieder die Debatte,
  die Zuständigkeit für die Drohnenabwehr komplett bei der Bundespolizei anzusiedeln.
  Was sagen Sie dazu? Ja, diese Debatten gibt es immer wieder, in verschiedenen Bereichen
  zu verschiedenen Themen: Der Bund soll es doch bitte zentral machen. Wenn man sich
  anschaut, wie groß Deutschland ist, dann hat sich im Bereich der Sicherheit das
  Zusammenspiel zwischen Bund und Ländern durchaus bewährt. Frau Kock, Sie sprachen
  von dem Termin beim Deutschen Zentrum für Luft- und Raumfahrt. Ist bei diesem Termin
  auch der Bundesinnenminister dabei? Ja. Es ist geplant, dass das in Anwesenheit
  des Bundesinnenministers Alexander Dobrindt eingeweiht wird. Ich habe eine Detailfrage
  zu dem Ablauf in Leipzig. Wer hat denn entschieden, dass für die Unschädlichmachung
  der Drohne die Polizei zuständig ist und nicht die Bundeswehr? Wie ich gerade ausgeführt
  habe, ist die Bundespolizei auf dem Gelände des Flughafens für die Sicherheit zuständig
  und nicht die Bundeswehr. Ich möchte fragen, wie die Ausstattung an den Flughäfen
  aktuell ausschaut, verbunden mit der Frage, wie das jetzt alles so schnell gehen
  konnte. Am Donnerstagnachmittag hieß es vom BMI noch: „Am Flughafen Leipzig ist
  noch keine stationäre Drohnenabwehrtechnik in der Zuständigkeit der Bundespolizei
  vorhanden. Mobile Drohnenabwehrtechnik kann anlassbezogen angefordert werden.“ Wie
  schaut es also jetzt an den deutschen Flughäfen aus, so auch an diesem? Sie beziehen
  Ihre Frage ja auf Leipzig und auf unsere Antworten. Wie Sie richtig zitiert haben:
  Mobile Einheiten können beigezogen werden. Das ist in Leipzig jetzt passiert. Und
  an den weiteren Flughäfen in Deutschland? Ich kann Ihnen nicht zu jedem Flughafen
  etwas en détail sagen. Es ist so, wie ich vorhin schon gesagt habe, dass alle Flughäfen
  im Zuständigkeitsbereich der Bundespolizei mit mobiler Drohnenabwehrtechnik ausgestattet
  werden. Die Bundespolizei hat da schon einiges beschafft. Priorisiert sind die acht
  Großflughäfen Frankfurt am Main, München, Berlin, Düsseldorf, Hamburg, Köln/Bonn,
  Stuttgart und Leipzig/Halle. Im Juni haben wir auch die Ausschreibung für München
  abschließen können. Alle weiteren Ausschreibungen und Vergabeverfahren sollen nach
  jetzigem Planungsstand bis Ende des Jahres abgeschlossen sein und die Flughäfen
  mit Drohnenabwehrtechnik ausgestattet sein. Es besteht durchaus die Möglichkeit,
  dass diese Prozesse jetzt noch einmal beschleunigt werden. Sie haben vorhin gesagt,
  dass alle Flughäfen jetzt schon ausgestattet sind. Deswegen waren wir, glaube ich,
  verwirrt. Sie sind also jetzt noch nicht ausgestattet? Sie sind unterschiedlich
  ausgestattet. Um Ihnen mein Problem zu erläutern: Es gibt Drohnendetektionstechnik,
  es gibt Drohnenabwehrtechnik und alles in verschiedensten Varianten, was logisch
  ist, weil es auch die unterschiedlichsten Varianten an Drohnen gibt. Deshalb ist
  das eine etwas komplexe Gemengelage. Ich war am Mittwoch in Leipzig vor Ort. Da
  war schon Drohnenabwehrtechnik vorhanden. Sie kann also sehr schnell und flexibel
  vor Ort sein. Die Ukraine bittet sehr dringend um Flugabwehrraketen . Wie ist der
  aktuelle Stand? Gibt es noch Bestände in Europa, die angezapft werden könnten? Wenn
  ja, wie viele gibt es wo? Deutschland ist seit 2025 der größte Unterstützer der
  Ukraine mit militärischer Ausstattung. Luftverteidigung ist dort ein wesentlicher
  Pfeiler. Wir bedienen uns dort aus fünf Clustern, will ich es einmal nennen. Der
  erste ist die Abgabe aus eigenen Beständen, Materialabgabe. Das haben wir vor allen
  Dingen am Anfang dieses fürchterlichen Krieges getan. Der zweite Cluster ist, dass
  wir Industrieproduktion finanzieren, unter anderem für Patriot-Systeme, die Sie
  angesprochen haben, aber auch für neue IRIS-T-Systeme zum Beispiel. Wir haben jüngst
  angekündigt, dass wir in den nächsten vier Jahren mehrere Hundert Patriot-Lenkflugkörper
  an die Ukraine liefern werden. Das ist das zweite Cluster. Das dritte Cluster ist
  die UDCG mit den Unterclustern der Capability Coalition, wo wir im multinationalen
  Rahmen nach Lösungen suchen, um Equipment zur Verfügung zu stellen. Das vierte Cluster
  sind bilaterale oder multilaterale Vereinbarungen, wie zum Beispiel „Enduring Action
  on Air Defence“, wozu der Minister persönlich seine Amtskollegen angeschrieben und
  angesprochen hat, ob nicht noch mehr möglich ist, ob wir uns nicht zusammentun können
  und gemeinsam finanzieren, gemeinsam Geräte abgeben können. Auch da kamen schon
  Patriot-Lenkflugkörper zusammen. Das fünfte Cluster bilden zum Beispiel die neuen
  Systeme, die jetzt im Rahmen einer Anti-Ballistic Missile Coalition entwickelt werden
  sollen, die mit der Ukraine und weiteren Nationen ein europäisches Verteidigungsmittel
  gegen ballistische Flugkörper aufbauen soll. Natürlich ist das mit Langfristperspektive
  oder Mittelfristperspektive. Das sind die fünf Cluster, aus denen wir uns grundsätzlich
  bedienen. Um Ihre Frage kurz zu beantworten: Ja, es wird in den nächsten Jahren
  kontinuierlich weitere Patriot-Lenkflugkörper-Lieferungen geben. Was unsere eigenen
  Möglichkeiten angeht, haben wir aus unseren Beständen sowohl fünf Systeme geliefert,
  wie Sie wissen, als auch schon Lenkflugkörper geliefert und damit einen erheblichen
  Beitrag geleistet. Irgendwann sind diese Möglichkeiten erschöpft. Im Weiteren wird
  sich ergeben, wie die internationalen Produktionskapazitäten genutzt und ausgeweitet
  werden können und wie dann die hohe Nachfrage, die aktuell weltweit besteht, gedeckt
  werden kann. Eine kurze Nachfrage, weil es in meiner Frage um die europäische Zusammenarbeit
  ging: Man hört manchmal, in Spanien und in Griechenland könnten zum Beispiel noch
  Patriots vorhanden sein, die geliefert werden könnten. Können Sie uns eine Hausnummer
  sagen, wie viele Flugabwehrraketen aus europäischen Beständen jetzt oder vielleicht
  in absehbarer Zukunft noch in die Ukraine geliefert werden könnten? Nein, das kann
  ich nicht, weil ich grundsätzlich nicht über Zahlen rede. Sowohl über eigene als
  auch über Lieferkapazitäten oder Lieferungen kann ich nichts sagen. Über Partnerländer
  und was gegebenenfalls verfügbar wäre, kann ich auch nicht sprechen. Fakt ist: Natürlich
  gibt es europäische Nutzernationen von Patriot. Der Austausch - es ist auch eine
  Form der Überredungsarbeit und der Abstimmungsarbeit - in den genannten Formaten,
  vor allen Dingen UDCG, aber auch „Enduring Action on Air Defence“, verläuft kontinuierlich.
  Es vergeht keine UDCG-Sitzung, kein NATO-Gipfel, kein NATO-VM-Treffen, kein EU-VM-Treffen,
  wo man nicht in Side Talks genau über diese Themen spricht, um den ständigen Flow,
  den die Ukraine benötigt, die ständigen Lieferungen aufrechtzuerhalten. Das ist
  ein ständiger Prozess, aber ob es da eine Bereitschaft gibt und wie hoch die Bestände
  sind und welche Möglichkeiten existieren, müssten Sie die Partnernationen fragen,
  weil ich zu anderen Nationen grundsätzlich keine Auskunft geben kann. Ich habe die
  Frage, vermutlich vor allem an das BMI und das Kanzleramt gerichtet, was Sie sich
  von der Nachrichtendienstreform zum BND und BfV erhoffen und was Sie der Kritik
  entgegnen, dass mit der Ausweitung der Kompetenzen für diese Dienste vielleicht
  ein Mangel an Kontrolle einhergeht. Wir haben gerade über einen Aspekt von Sicherheit
  relativ intensiv gesprochen, rund um die Drohnen. Hier geht es um einen anderen
  Aspekt, aber auch um das große Thema Sicherheit. Es ist ja nichts Neues für Sie,
  für niemanden: Die Zeiten, die Bedrohungslagen haben sich verändert. Die Sicherheitslage
  ist eine andere geworden. Deshalb ist es unabdingbar, dass wir schlagkräftige, effiziente
  Dienste haben, um die bestmögliche Sicherheit für unser Land, für die Bevölkerung
  in unserem Land zu gewährleisten. Deshalb hat die Koalition im Koalitionsvertrag
  eine grundlegende Reform der Gesetze für die Nachrichtendienste beschlossen. Da
  geht es darum, dass wir im Bereich der Dienste national souveräner werden, dass
