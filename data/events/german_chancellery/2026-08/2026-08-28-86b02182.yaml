title: Kondolenztelegramm von Bundeskanzler Merz an den Ministerpräsidenten von Nepal,
  Balendra Shah
text: Sehr geehrter Herr Ministerpräsident, Mit tiefer Betroffenheit habe ich von
  der schweren Flutkatastrophe in Ihrem Land erfahren. Ihnen und dem nepalesischen
  Volk spreche ich mein tief empfundenes Mitgefühl aus. Unsere Gedanken sind bei den
  Opfern, ihren Familien und allen Menschen, die durch die Katastrophe ihr Zuhause
  verloren haben. Den Verletzten wünsche ich eine rasche und vollständige Genesung.
  Mit stillem Gruß Friedrich Merz Bundeskanzler der Bundesrepublik Deutschland
