title: Bundeskanzler Merz gratuliert dem Präsidenten der Republik Kolumbien, Abelardo
  de la Espriella
text: Sehr geehrter Herr Präsident, zu Ihrem Amtsantritt gratuliere ich Ihnen herzlich.
  Deutschland und Kolumbien verbindet eine langjährige und vertrauensvolle Partnerschaft.
  Ich bin zuversichtlich, dass wir die enge und vielfältige Zusammenarbeit unserer
  Länder erfolgreich fortsetzen werden. Für die vor Ihnen liegenden verantwortungsvollen
  Aufgaben wünsche ich Ihnen viel Erfolg, Tatkraft sowie stets weitsichtige Entscheidungen
  zum Wohle Ihres Landes. Angesichts des schweren Erdbebens am 10. August möchte ich
  Ihnen und dem kolumbianischen Volk erneut mein tiefes Mitgefühl ausdrücken. Mit
  freundlichen Grüßen Friedrich Merz Bundeskanzler der Bundesrepublik Deutschland
