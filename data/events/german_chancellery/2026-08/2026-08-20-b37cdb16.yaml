title: Joint Statement from the Leaders of the United Kingdom, France, Germany, Italy,
  the Netherlands, Canada and Norway on the E1 West Bank Settlement Plan
text: 'The Israeli Government’s decision to publish construction tenders for the E1
  settlement project is unacceptable. The international community has long opposed
  this settlement expansion, and has voiced their grave concerns privately and publicly.
  The E1 settlement will undermine the prospect of the two-state solution by driving
  a wedge through the West Bank and harming the territorial contiguity of the Palestinian
  Territories. International Law is clear that Israeli settlements in the West Bank
  are illegal. This is the position of the international community reaffirmed by the
  United Nations Security Council. At a time of grave instability in the West Bank
  with unprecedented levels of violence by settlers against civilians, and serious
  restrictions on the Palestinian economy, this decision is even more concerning.
  We urge the Government of Israel to retract these plans immediately and end its
  expansion of settlements in the West Bank. Not only will they take us further from
  peace, but they further undermine Israel’s international standing. Businesses should
  not consider bidding for construction tenders. They should be aware of legal and
  reputational consequences including the risk of involving themselves in serious
  breaches of international law. We reiterate our commitment to a comprehensive, just
  and lasting peace based on the two-state solution. We will continue to act in its
  interest. Höflichkeitsübersetzung: Erklärung der Staats- und Regierungschefinnen
  und -chefs von Großbritannien, Italien, Frankreich, den Niederlanden, Kanada, Norwegen
  und Deutschland zum E1-Siedlungsplan für das Westjordanland Die Entscheidung der
  israelischen Regierung, Ausschreibungen für den Bau des E1-Siedlungsprojekts zu
  veröffentlichen, ist inakzeptabel. Die internationale Gemeinschaft lehnt diese Ausweitung
  der Siedlungen seit Langem ab und hat ihre großen Bedenken sowohl vertraulich als
  auch öffentlich zum Ausdruck gebracht. Durch das E1 Siedlungsgebiet werden die Aussichten
  auf die Zweistaatenlösung untergraben, indem das Westjordanland geteilt und die
  territoriale Einheit der Palästinensischen Gebiete beschädigt wird. Das Völkerrecht
  besagt eindeutig, dass israelische Siedlungen im Westjordanland rechtswidrig sind.
  Dies ist die Haltung der internationalen Gemeinschaft, die auch durch den Sicherheitsrat
  der Vereinten Nationen bekräftigt wird. In Zeiten massiver Instabilität im Westjordanland
  mit einem beispiellosen Ausmaß von Siedlergewalt gegen die Zivilbevölkerung  und
  schwerwiegenden Beschränkungen der palästinensischen Wirtschaft ist diese Entscheidung
  umso besorgniserregender. Wir rufen die Regierung Israels nachdrücklich dazu auf,
  diese Pläne unverzüglich zurückzunehmen und die Ausweitung der Siedlungen im Westjordanland
  zu beenden. Durch sie rücken nicht nur eine Friedenslösung in weitere Ferne; auch
  Israels internationales Ansehen wird weiter beschädigt. Wirtschaftsunternehmen sollten
  nicht erwägen, sich auf Bauausschreibungen zu bewerben. Sie sollten sich der rechtlichen
  und auch der rufschädigenden Folgen bewusst sein, einschließlich des Risikos, sich
  selbst an schweren Verstößen gegen das Völkerrecht zu beteiligen. Wir bekräftigen
  unsere Verpflichtung zu einem umfassenden, gerechten und dauerhaften Frieden auf
  der Grundlage der Zwei-Staaten-Lösung. Wir werden weiterhin in ihrem Interesse handeln.'
