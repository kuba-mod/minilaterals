title: Bauhaus-Manifest – Breites Bündnis aus Kultur, Design, Handwerk, Architektur
  und Kirchen setzt Zeichen für Freiheit, Offenheit und Kreativität
text: 'Auf Initiative von Staatsminister Weimer haben Verbände und Institutionen aus
  Kultur, Design, Handwerk, Architektur sowie Kirchen gemeinsam das Bauhaus-Manifest
  2026 unterzeichnet. Das Manifest versteht sich als ein aktuelles kultur- und gesellschaftspolitisches
  Bekenntnis zu den Prinzipien, die das Bauhaus bis heute zu einer weltweit prägenden
  kulturellen Ikone machen: Die Freiheit des künstlerischen Denkens, Offenheit gegenüber
  neuen Ideen, die Verbindung unterschiedlicher Disziplinen und die Überzeugung, dass
  kulturelle Innovation einen wichtigen Beitrag zur Entwicklung einer demokratischen
  Gesellschaft leisten kann. Gleichzeitig ist das Manifest ein Plädoyer dafür, die
  Prinzipien des Bauhauses gegen demokratiefeindliche Angriffe zu verteidigen. Zu
  den Unterzeichnern gehören: •    Akademie der Künste: Prof. Manos Tsangaris, Präsident
  der Akademie der Künste •    Beauftragter der Bundesregierung für Kultur und Medien:
  Dr. Wolfram Weimer, Staatsminister für Kultur und Medien •    Bundesarchitektenkammer:
  Andrea Gebhard, Präsidentin der Bundesarchitektenkammer •    Deutsche Bischofskonferenz:
  Dr. Gerhard Feige, Bischof des Bistums Magdeburg •    Deutsche UNESCO-Kommission:
  Prof. Dr. Maria Böhmer, Präsidentin der Deutschen UNESCO-Kommission •    Deutscher
  Designtag: Boris Kochan, Präsident Deutscher Designtag e.V. •    Deutscher Kulturrat:
  Olaf Zimmermann, Geschäftsführer Deutscher Kulturrat e.V. •    Deutscher Museumsbund:
  Menekse Wenzler, Präsidentin Deutscher Museumsbund e.V. •    Deutscher Städtetag:
  Burkhard Jung, Präsident des Deutschen Städtetages •    Deutsches Zentrum Kulturgutverluste:
  Prof. Dr. Meike Hopp, Vorständin Deutsches Zentrum Kulturgutverluste •    Evangelische
  Kirche in Deutschland: Karsten Wolkenhauer, Kirchenpräsident der Evangelischen Landeskirche
  Anhalts •    German Design Council – Rat für Formgebung: Lutz Dietzold, Geschäftsführer
  des German Design Council – Rat für Formgebung •    ICOM Deutschland: Paul Spies,
  Präsident ICOM Deutschland e.V. •    Zentralverband des Deutschen Handwerks: Holger
  Schwannecke, Generalsekretär Zentralverband des Deutschen Handwerks Das Bauhaus
  wurde 1919 in Weimar gegründet. Nach seiner Vertreibung aus Weimar wurde es 1926
  – vor genau 100 Jahren – in Dessau wieder eröffnet. 1933 – inzwischen nach Berlin
  umgezogen – musste es unter dem Druck der Nationalsozialisten endgültig schließen.
  Das Bauhaus und seine Stätten in Weimar, Dessau und Bernau sind UNESCO-Welterbe.
  Wir laden dazu ein, das Bauhaus-Manifest 2026 zu unterstützen und gemeinsam ein
  Zeichen für Freiheit, Offenheit und Kreativität zu setzen. Wer das Manifest unterstützen
  möchte, kann sich hier informieren und seine Unterstützung erklären: https://adk.de/bauhaus-manifest-2026
  Bauhaus-Manifest 2026 Vor hundert Jahren revolutionierten moderne Bewegungen die
  Welt. Das Bauhaus war einer der wesentlichen Akteure. Die neuartige Verbindung von
  Kunst und Handwerk, Gestaltung und Technik, von Design und Architektur, von gesellschaftlicher
  Verantwortung und ästhetischer Innovation wurde zu einem der bedeutendsten kulturellen
  Projekte der Moderne. Die enorme internationale Wirkung des Bauhauses, heute UNESCO-Welterbe,
  beruht jedoch nicht allein auf moderner Formensprache und Avantgarde-Design. Es
  ist seine Haltung, die Vorbildcharakter hatte und weiterhin hat: der Mut zur kühnen
  Vision, das Vertrauen in die Freiheit des künstlerischen Denkens, die Überzeugung,
  dass nur eine offene Gesellschaft die Kraft zur kulturellen Erneuerung aufbringt.
  Heute, genau hundert Jahre danach, wollen wir das Bauhaus gegen populistische Angriffe
  verteidigen. Den gesellschaftspolitischen Impetus der Bauhaus-Vordenkerinnen und
  Vordenker brauchen wir gerade in Zeiten, in denen die politischen Ränder erstarken
  und Rückschritt statt Fortschritt propagieren. Wir brauchen sie auch angesichts
  der großen Reformen, die notwendig sind, um unser Land zum Positiven zu verändern.
  Hier steht das Bauhaus exemplarisch für das Vertrauen in die gesellschaftliche Strahlkraft
  kultureller Innovationen: als Paradigma eines demokratisch grundierten, humanistisch
  orientierten Gestaltungskonzepts. Deshalb bekennen wir uns zu folgenden Grundsätzen:'
