title: Eingangsstatement von Bundeskanzler Merz zur Kabinettsklausur im Schloss Neuhardenberg
  Wachstum und Beschäftigung von morgen ermöglichen
text: '„Wir wollen unserer Wirtschaft wieder Aufschwung und Beschäftigung ermöglichen“,
  sagte Bundeskanzler Friedrich Merz vor Beginn der Kabinettsklausur. Zum Auftakt
  der Kabinettsklausur der Bundesregierung hat Bundeskanzler Friedrich Merz unterstrichen,
  um was es jetzt geht: Im Mittelpunkt stehe die Frage, wie die Wettbewerbsfähigkeit
  Deutschlands erhöht werden könne. Dafür suche man in Neuhardenberg „ganz gezielt
  den Austausch und das Gespräch mit Unternehmern aus der Industrie und dem Handwerk,
  aus Technologieunternehmen und Start-ups “. Ziel der Bundesregierung sei es, die
  Stärken des Landes zu nutzen, „um das Wachstum und die Beschäftigung von morgen
  zu ermöglichen“. Dafür seien bereits gute und mutige Schlüsse getroffen worden.
  Jetzt gehe es darum, die Geschwindigkeit zu erhöhen, die richtigen Prioritäten zu
  setzen und die Entscheidungen für den weiteren Verlauf des Jahres 2026 vorzubereiten.
  Vor dem Hintergrund hybrider Bedrohungen setze die Bundesregierung außerdem den
  Fokus auf die Sicherheit und den Schutz der Bevölkerung. Zudem gelte es weiterhin,
  den Klimawandel einzudämmen und Deutschland besser an die Folgen des Klimawandels
  anzupassen, sagte der Kanzler. Meine Damen und Herren, herzlich willkommen in Neuhardenberg,
  im Osten unseres Landes, im Osten des Landes Brandenburg, an diesem wunderbaren
  und traditionsreichen Ort! Die Ereignisse der letzten Wochen haben in unserer Bevölkerung
  einige zusätzliche Befürchtungen und Sorgen ausgelöst. Trotzdem oder gerade deshalb
  starten wir mit Zuversicht und Tatkraft in die nächsten Monate. Wir sind als Regierung
  mit guten und mutigen Beschlüssen in den Sommer gegangen. Aber unter anderem der
  Drohnenangriff in Leipzig zeigt, dass wir zugleich ganz handfest bedroht sind. All
  das, nicht zuletzt die großen Schäden durch die Folgen von Hitze und Dürre, macht
  die Lage im Land nicht leichter. Wir haben im ersten Jahr der Regierung aber nicht
  nur die Probleme unseres Landes richtig beschrieben. Wir haben auch eine neue Politik
  zum Wohle unseres Landes eingeleitet. Wir haben bei den Themen von Rente, Gesundheit,
  Steuern und bei der inneren und äußeren Sicherheit wichtige und richtige Weichen
  gestellt. Jetzt geht es um die Frage, wie wir unser Wirtschaftsmodell in die neue
  Zeit führen. Wir wollen hinaus aus der Wachstumsschwäche unserer Wirtschaft. Wir
  wollen unserer Wirtschaft wieder Aufschwung und Beschäftigung ermöglichen. Wir haben
  das – davon bin ich überzeugt – weitgehend, wenn auch nicht ausschließlich, selbst
  in der Hand. Deutschland kann im globalen Wettbewerb bestehen, und wir können sogar
  ein Vorbild sein. Dafür muss aber der Staat die notwendigen und richtigen Voraussetzungen
  schaffen. Unser Land hat große Potenziale, und es gibt überhaupt keinen Grund, uns
  kleinzumachen. In Deutschland gibt es nach wie vor eine hervorragende industrielle
  Basis. In Deutschland gibt es nach wie vor einen starken Mittelstand und ein weltweit
  angesehenes Handwerk. In Deutschland gibt es nach wie vor Weltklasseforschung. Genau
  darauf bauen wir auf. Diese Stärken wollen wir nutzen, um das Wachstum und die Beschäftigung
  von morgen zu ermöglichen. Im Mittelpunkt unserer Klausur steht deshalb Deutschlands
  preisliche Wettbewerbsfähigkeit, unsere Wettbewerbsfähigkeit durch Innovation. Was
  haben wir auf dieser Kabinettsklausur konkret vor? – Nun, diese Klausur ist eine
  Arbeitsklausur. Wir suchen ganz gezielt den Austausch und das Gespräch mit Unternehmern
  aus der Industrie und dem Handwerk, aus Technologieunternehmen und Start-ups . Im
  Mittelpunkt des heutigen Tages steht die Frage, wie wir die industrielle Basis in
  Deutschland erhalten und wieder stärken können. Denn der Anspruch der Bundesregierung
  ist klar: Deutschland soll ein starkes Industrieland bleiben. Auch im KI -Zeitalter
  wollen wir an der Weltspitze stehen. Wir werden uns später im Verlauf dieser Klausurtagung
  anschauen, wie wir Technologie konkret für unsere Sicherheit einsetzen können, zum
  Beispiel bei der Drohnenabwehr oder bei der Personenüberprüfung. In unserer Arbeitssitzung
  morgen wollen wir von Praktikern erfahren, wie sie auf die aktuelle Lage schauen.
  Wir werden insbesondere besprechen, wie wir Mittelstand, Handwerk und Innovation
  miteinander verbinden können. Nun finden unsere Anstrengungen für mehr Wettbewerbsfähigkeit
  nicht im luftleeren Raum statt. Wir haben Probleme, die zum Teil von außen kommen
  und die wir nicht ignorieren dürfen. Dazu gehört insbesondere das sich verändernde
  Klima, dazu gehören aber auch die handelspolitischen Konflikte. Dazu gehören die
  globalen Ungleichgewichte, und dazu gehört nicht zuletzt das Thema Sicherheit. Deutschland
  ist stärker ins Fadenkreuz hybrider Angreifer gerückt. Das zeigt nicht zuletzt der
  Angriff vom 4. August auf dem Flughafen in Leipzig. Angreifer nehmen zunehmend skrupellos
  auch schwere Sachschäden, sogar Verletzte und Tote in Kauf. Hier in Neuhardenberg
  wird es nicht um die Zuordnung des Leipziger Angriffs gehen. Daran arbeiten wir
  zusammen mit den Sicherheitsbehörden intensiv, und wir werden das in Kürze auch
  darlegen und uns dazu äußern. Leipzig zeigt aber auch: Es war richtig, dass die
  Bundesregierung im letzten Jahr vieles auf den Weg gebracht hat, um unser Land und
  seine Bevölkerung besser gegen hybride Angriffe zu schützen. Wir setzen diese Arbeit
  fort. Wir lassen uns dabei von einigen klaren politischen Grundsätzen leiten, die
  ich gerne nennen möchte: Erstens. Deutschland bleibt ein sicheres Land. Die Bundesregierung
  stärkt deshalb den Schutz, zuletzt durch die Einrichtung des Drohnenzentrums in
  Magdeburg Cochstedt. Zweitens. Deutschland schreckt ab. Die Bundesregierung erlegt
  Urhebern hybrider Angriffe einen Preis auf. Sie werden dafür bezahlen. Das ist ein
  wichtiges Ziel des Gesetzespaketes zu den Nachrichtendiensten, das wir bereits im
  August im Kabinett beschlossen haben. Drittens. Wir halten Kurs. Die Bundesregierung
  setzt die Unterstützung der Ukraine mit langem Atem fort. Wir sind heute ihr stärkster
  Unterstützer, [nicht], um den Krieg zu verlängern, sondern um Friedensgespräche
  zu erzwingen. Nun lassen Sie mich zum Schluss noch etwas zur Hitze und der Dürre
  der letzten Wochen und den Folgen sagen. Sie haben verfolgt, dass ich am vergangenen
  Wochenende das Waldbrandgebiet in Hürtgenwald besucht habe und dort mit den Einsatzkräften
  und mit den Helferinnen und Helfern gesprochen habe. Ich habe mir selbst ein Bild
  von diesem Brand und von den Folgen der Brände gemacht. Meine Aufgabe ist es, die
  Lage richtig einzuschätzen, die richtigen Entscheidungen zu treffen und vor allem
  die langfristigen Lehren aus Extremsituationen wie diesem Hitzesommer zu ziehen.
  Denn Trockenheit, Hitze, Waldbrände und Ernteausfälle führen uns vor Augen, dass
  konkreter Handlungsbedarf besteht. Gesundheit, Krankenhäuser, Altenheime, die Landwirtschaft
  – es gibt kaum einen Lebensbereich, der nicht betroffen ist. Für die Bundesregierung
  ist deshalb klar: Wir müssen den Klimawandel weiter eindämmen und zugleich unser
  Land besser an die Folgen des Klimawandels anpassen. Mir war es deshalb wichtig,
  dass wir morgen im Rahmen der ordentlichen Kabinettssitzung, die wir ja im Anschluss
  an die Arbeitssitzung und an die Klausurtagung durchführen werden, diesen Tagesordnungspunkt
  aufrufen. Die Ressorts der Bundesregierung werden vor dem Hintergrund der aktuellen
  Lage über ihre Einschätzung berichten, und wir werden dann daraus auch die Schlussfolgerungen
  für die nächsten Kabinettssitzungen mit konkreten Entscheidungen ziehen. Sie sehen
  also: Wir haben viel vor. Ich bin davon überzeugt, dass wir gemeinsam anpacken können
  und auch müssen, um Deutschland wieder stärker zu machen, Deutschland wettbewerbsfähiger
  zu machen und Deutschland zukunftsfest zu machen. Meine Damen und Herren, dazu gehört
  schließlich, dass wir auch die richtigen Prioritäten setzen, dass wir die Geschwindigkeit
  erhöhen, dass wir Entscheidungen treffen, dass wir, ja, parlamentarisch auch diskutieren,
  debattieren, wo notwendig streiten, aber am Ende des Tages Entscheidungen treffen,
  damit wir angesichts dieser Lage, in der wir sind, schnell aus den Problemen herauskommen,
  schnell wieder Perspektiven für die Betriebe und vor allem für die Menschen in unserem
  Land eröffnen. Sie erwarten zu Recht, dass die Bundesregierung handelt. Wir handeln,
  und wir bereiten alles das, was wir für den weiteren Verlauf des Jahres 2026 vorhaben,
  heute bei dieser Klausurtagung hier in Neuhardenberg vor. In diesem Sinne noch einmal
  herzlich willkommen! Nehmen Sie das gute Wetter und die angenehmen Temperaturen
  auch als Beleg dafür, dass wir uns in einer guten Atmosphäre hier in Neuhardenberg
  als Kabinett treffen und dass die Bundesregierung insgesamt fest entschlossen ist,
  die Probleme anzupacken und, soweit wir es in unserer Hand haben, sie auch zu lösen.
  Herzlichen Dank und noch einmal herzlich willkommen!'
