title: Fragen und Antworten Stromausfall – Was ist ein Blackout?
text: 'Hochspannungsmasten leiten Strom. Längere und flächendeckende Stromausfälle
  drohen in der Regel nur dann, wenn sie, beispielsweise bei einem Unwetter, beschädigt
  werden. Eine sichere Stromversorgung ist für unseren Alltag essenziell – und zentraler
  Standortfaktor für die Wirtschaft. Das Stromnetz in Deutschland ist seit vielen
  Jahren eines der zuverlässigsten in Europa. Energie wird immer effizienter genutzt
  und teilweise eingespart; gleichzeitig wird die Bedeutung von Elektrizität in Zukunft
  anwachsen. Denn wo Verbrennungsprozesse mit Öl und Gas wegfallen, werden sie oft
  durch elektrische Alternativen ersetzt – Beispiele sind das E-Auto oder Wärmepumpen.
  Klar ist: Die Energieversorgung in Deutschland ist sehr sicher. Doch wie hoch ist
  das Risiko, dass der Strom dennoch ausfällt? Was passiert dann? Und zeigen Preisspitzen
  an den Strombörsen und Stromimporte aus dem Ausland nicht, dass wir uns doch um
  die Stromversorgung in Deutschland sorgen müssen? Antworten auf die wichtigsten
  Fragen. Ein großflächiger Stromausfall wird auch „ Blackout “ genannt und betrifft
  viele Menschen gleichzeitig. Die Gründe für „ Blackouts “ sind vielfältig. Oft sind
  Unwetter wie Stürme, Gewitter oder heftiger Schneefall die Ursache: Durch sie können
  wichtige Strom- oder Hochspannungsleitungen beschädigt oder zerstört werden. Ein
  längerer und flächendeckender Stromausfall kann die Folge sein. Das betrifft dann
  nicht nur Haushalte, sondern auch Unternehmen, Krankenhäuser, Schulen und alle anderen
  Stromempfänger. Ein Stromausfall kann zudem entstehen, wenn das Stromnetz aus dem
  Gleichgewicht gerät: In das Netz muss immer genauso viel Strom eingespeist werden
  wie entnommen wird. Wenn das nicht passiert, greifen zunächst Sicherheitsmechanismen,
  die das Netz normalerweise stabilisieren. Nur bei sehr unerwarteten und starken
  Schwankungen helfen diese Sicherheitsmaßnahmen nicht. Davon abzugrenzen sind kurze
  Stromausfälle, die immer wieder auftreten können – etwa aufgrund der Beschädigung
  eines Stromkabels bei Bauarbeiten. Sie sind lokal sehr begrenzt und dauern in der
  Regel nur wenige Minuten oder Stunden an. Deutschlands Stromnetz gehört zu den sichersten
  und stabilsten weltweit. Großflächige und langanhaltende Stromausfälle hat es in
  der Vergangenheit in Deutschland nur äußerst selten gegeben. Sie bleiben auch weiterhin
  sehr unwahrscheinlich. Etwas häufiger, aber immer noch sehr selten kommt es zu kurzen
  und lokal begrenzten Stromausfällen. Die Bundesregierung arbeitet gemeinsam mit
  der Bundesnetzagentur (BNetzA) kontinuierlich an einer sicheren Energieversorgung.
  Dies gilt auch für die Krisenvorsorge im Bereich Strom. Derzeit wird beispielsweise
  präventiv die „Sicherheitsplattform Strom“ im Auftrag der Bundesnetzagentur aufgebaut,
  um im Ernstfall schnell handeln zu können. Die digitale Plattform soll die Kommunikation
  und Koordination im Falle einer Energiemangellage verbessern. Sie ergänzt Prozesse
  der Übertragungs- und Verteilnetzbetreiber und sorgt für eine bessere Krisenvorsorge
  durch klare Regeln und eine effizientere digitale Koordination der Beteiligten.
  Beispielsweise soll mit der Plattform im Fall einer Energiemangellage verhindert
  werden, dass Industrieprozesse kurzfristig und unvorhersehbar abgeschaltet werden
  und damit eventuell geschädigt werden. Deutschland hat eines der sichersten Stromnetze
  der Welt – dank zahlreicher Sicherungsmechanismen . Unter anderem stellt das „n-1-Prinzip“
  sicher, dass der Strom beim Ausfall einer Leitung auf einem anderen Weg fließen
  kann und das Stromnetz weiterfunktioniert. Zudem gibt es Kraftwerke, die darauf
  ausgelegt sind, das Stromnetz im Notfall schnell wieder aufzubauen und hochzufahren.
  Wichtig für die Sicherheit der Energieversorgung ist auch, die Stromproduktion sicherzustellen
  und einseitige Abhängigkeiten bei der Gasversorgung zu vermeiden. Das war eine der
  wichtigsten Lehren aus dem russischen Angriffskrieg gegen die Ukraine, der in Deutschland
  aufgrund ausbleibender russischer Gaslieferungen eine Energiekrise zur Folge hatte.
  Deutschland hat sich seit 2022 breiter aufgestellt und bezieht die Energieträger
  aus verschiedenen Quellen. Ziel der Bundesregierung ist es, die Abhängigkeiten im
  Energiebereich insgesamt zu reduzieren und damit die Energiesicherheit zu erhöhen.
  Dazu gehören neben dem Ausbau der erneuerbaren Energien auch die Erschließung und
  Nutzung heimischer Energiequellen, einschließlich ausgewählter konventioneller Gasvorkommen.
  Bisher deckt Deutschland nur einen sehr geringen Teil seines Gasbedarfs aus eigenen
  Quellen. Zur Energieunabhängigkeit und damit zur Versorgungssicherheit trägt auch
  der steigende Anteil erneuerbarer Energien bei. So wurden 2025 in Deutschland über
  55 Prozent des Stroms aus erneuerbaren Energien erzeugt . Diesen Ausbau will die
  Bundesregierung weiter beschleunigen: Bis 2030 sollen 80 Prozent Strom aus erneuerbaren
  Energien gewonnen werden. Das Erneuerbare-Energien-Gesetz (EEG) ist das zentrale
  Instrument, um eine treibhausgasneutrale und sichere Stromversorgung mit regenerativen
  Energien zu erreichen. Die Bundesregierung hat kürzlich eine Novelle des Gesetzes
  im Kabinett beschlossen. Zudem ist am 22. Juli 2026 das „Strom-Versorgungssicherheits-
  und Kapazitätengesetz“ (StromVKG) in Kraft getreten . Damit soll sichergestellt
  werden, dass auch in Zukunft ausreichend flexible Kapazitäten auf dem Strommarkt
  verfügbar sind. So soll weiterhin jederzeit eine stabile Versorgung im Stromsystem
  gewährleistet bleiben – auch wenn die Sonne nicht scheint und der Wind nicht weht.
  Mehr erneuerbare Energien im Strommix bedeuten auch: mehr Anlagen als früher, die
  Strom einspeisen und wetterabhängige Stromerzeugung. Um das Stromsystem trotz dieser
  Schwankungen weiterhin stabil zu halten, braucht es steuerbare Kapazitäten, die
  im Bedarfsfall einspringen. Das StromVKG führt daher einen sogenannten Kapazitätsmarkt
  ein. Damit soll der Bedarf für eine sichere Versorgung mit Strom ab 2031 gedeckt
  werden. Bereits in den nächsten zwölf Monaten sollen steuerbare Kapazitäten im Umfang
  von insgesamt elf Gigawatt ausgeschrieben werden – also Stromkapazitäten, die flexibel
  ein- und ausgeschaltet werden können. In den Jahren 2027 und 2029 werden zwei weitere
  Ausschreibungen folgen. Ein Kapazitätsmarkt entlohnt Anbieter schon für die Bereithaltung
  von Leistung und nicht erst, wenn der von ihrer Anlage produzierte Strom abgenommen
  wird. Das schafft wichtige finanzielle Anreize für Investitionen in neue Anlagen
  sowie den Erhalt bestehender Kapazitäten – auch, wenn die Kraftwerke nur wenige
  Stunden im Jahr benötigt werden. Mit einem Zuschlag gehen aber auch Verpflichtungen
  einher. Anlagen müssen die zugesicherte Leistung zu relevanten Zeitpunkten nachweislich
  erbringen und Neuanlagen fristgerecht errichtet werden. Um den Netzausbau voranzubringen
  und die Netze zu stabilisieren, hat die Bundesregierung auch das sogenannte Netzanschlusspaket
  im Kabinett beschlossen, also den Gesetzentwurf zur „Änderung des Energiewirtschaftsrechts
  zur Synchronisierung des Anlagenzubaus mit dem Netzausbau sowie zur Verbesserung
  des Netzanschlussverfahrens“. Ziel dieses Netzanschlusspaketes ist es, den Netzausbau
  kostengünstiger zu gestalten und die Netze zu stabilisieren. Davon profitieren alle
  Stromverbraucherinnen und -verbraucher, da die ungleiche Verteilung der Stromkapazitäten
  hohe Kosten erzeugt. Die Netzanschlusskapazität entwickelt sich zu einem zunehmend
  knappen Gut, um das verschiedene Nutzergruppen konkurrieren. Ob Batteriespeicher,
  Rechenzentren oder Industriebetriebe: Sie alle wollen an das Stromnetz angeschlossen
  werden – möglichst kurzfristig und kostengünstig. Daher sollen konkrete Anreize
  gesetzt werden, damit Großspeicher und große Erneuerbaren-Energien-Anlagen dort
  ausgebaut werden, wo im Netz Bedarf ist – und nicht dort, wo bereits ausreichend
  Anlagen vorhanden sind. Das Ziel ist dabei ausdrücklich nicht, den Erneuerbaren-Ausbau
  zu hemmen, sondern ihn regional besser zu verteilen und somit netzverträglicher
  zu gestalten. Stromimporte und -exporte sind ein Zeichen für einen funktionierenden
  europäischen Binnenmarkt und schaffen in ganz Europa Wohlstand. Denn Strom wird
  immer von dort importiert, wo die Produktion gerade günstiger ist. Deutschland und
  seine europäischen Partner können so wechselseitig von den jeweils günstigsten Erzeugungsbedingungen
  profitieren. Die Strommarktdatenplattform der Bundesnetzagentur ( SMARD ) gibt Auskunft
  darüber, wie hoch die Stromimporte nach Deutschland konkret sind: Im Jahr 2025 importierte
  Deutschland insgesamt 76,2 TWh , ein Rückgang um 1,3 Prozent im Vergleich zum Vorjahr.
  Gleichzeitig exportierte Deutschland 54,3 TWh Strom, 11,1 Prozent mehr als im Vorjahr.
  Daraus ergibt sich ein Nettoimport von 21,9 TWh, im Vorjahr waren es 28,3 TWh. Zwischenzeitliche
  Ausschläge an den Strombörsen sind nichts Ungewöhnliches und kein Grund zur Besorgnis.
  Es gibt an den Strombörsen immer Schwankungen und wetterbedingte sowie saisonale
  Effekte. In der Regel werden Stromausfälle innerhalb weniger Stunden behoben. In
  Notsituationen, insbesondere wenn Stromleitungen nach einem Unwetter beschädigt werden,
  kann es auch Tage dauern, bis der Strom wieder verfügbar ist. In diesen sehr seltenen
  Fällen ist die private Vorsorge wichtig. Das Bundesamt für Bevölkerungsschutz und
  Katastrophenhilfe informiert dazu, wie sich die Bürgerinnen und Bürger auf die Auswirkungen
  eines möglichen Stromausfalls vorbereiten können. In Notfällen unterstützt der Bund
  vor Ort mit Bundespolizei, THW und Bundeswehr – wie etwa im Januar 2026 bei dem
  Stromausfall in Berlin nach einem Kabelbrand. Einen detaillierten und tagesaktuellen
  Blick auf Stromerzeugung und -verbrauch, Großhandelspreise sowie den grenzüberschreitenden
  Stromhandel ermöglicht SMARD , d ie Informationsplattform der Bundesnetzagentur
  über den deutschen Strommarkt.'
