title: Bundeskanzler Merz zur Unterzeichnung eines Abkommens zur Sicherheit Grönlands
text: „Ich begrüße, dass die dänische Premierministerin Mette Frederiksen, der grönländische
  Premierminister Jens-Frederik Nielsen und der Präsident der Vereinigten Staaten
  Donald Trump heute ein Abkommen zur Sicherheit Grönlands unterzeichnet haben. Dass
  die Verhandlungen der letzten Monate zu einer einvernehmlichen Lösung in Einklang
  mit internationalem Recht geführt haben, ist eine gute Nachricht. Es stärkt unsere
  transatlantische Partnerschaft in der NATO und trägt zur Sicherheit im Hohen Norden
  bei. Unsere Partner können auch in Zukunft auf die Unterstützung Deutschlands zählen,
  wenn es darum geht, gemeinsam diese Ziele zu verfolgen.“ Höflichkeitsübersetzung
  Statement by Federal Chancellor Merz “I welcome the fact that Danish Prime Minister
  Mette Frederiksen, Greenland’s Prime Minister Jens-Frederik Nielsen and President
  of the United States Donald Trump have signed an agreement on the security of Greenland
  today. It is good news that the negotiations of recent months have led to a mutually
  acceptable solution in line with international law. This strengthens our transatlantic
  partnership in NATO and contributes to security in the High North. Our partners
  can count on Germany’s support also in the future when it comes to pursuing these
  aims together.”
