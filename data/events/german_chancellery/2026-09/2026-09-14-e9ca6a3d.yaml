title: Bundeskanzler Friedrich Merz beim EU -Arktis-Gipfel Europäische Partner beraten
  zum geopolitischen Wandel in der Arktis
text: 'Kanzler Merz im Gespräch mit Finnlands Ministerpräsident Orpo: Beim EU -Arktis-Gipfel
  geht es um die Rolle der EU in der Arktis. Auf Einladung des finnischen Ministerpräsidenten
  Petteri Orpo hat Bundeskanzler Friedrich Merz am EU -Arktis-Gipfel teilgenommen.
  Dieser fand am 13. und 14. September 2026 im finnischen Rovaniemi statt. Gemeinsam
  mit weiteren EU -Partnern und Vertreterinnen und Vertretern der EU-Institutionen
  tauschte sich Bundeskanzler Merz über den gemeinsamen strategischen Ansatz der EU
  für die Arktis aus. „Hier im hohen Norden Europas kann man sehen, wie gefährdet
  der Frieden in Europa ist“, betonte der Kanzler zu Beginn des zweiten Gipfeltages
  . Daher seien die Beratungen vor Ort, einem geopolitischen Hotspot, wo laut Kanzler
  Merz die Bedrohung wirklich sichtbar sei, besonders wichtig. Seine Teilnahme unterstreiche,
  dass auch in Deutschland der geopolitische Wandel der Region ernst genommen werde.
  „Wir sind Teil dieses strategisch gefährdeten Teils Europas“, machte der Bundeskanzler
  für das deutsche Interesse an der Region deutlich. Nach den zweitägigen Beratungen forderte
  Bundeskanzler Merz bei der abschließenden Pressekonferenz mit den Gipfelteilnehmenden,
  dass die Europäische Union künftig ein stärkeres Augenmerk auf den hohen Norden
  richten müsse. Russlands Präsenz in der Region und mit hybriden Angriffen in anderen
  Regionen Europas nehme täglich zu. Hierauf müssten die europäischen Partner, aber
  auch die NATO mit Einheit und Stärke reagieren. Insbesondere den europäischen Teil
  der transatlantischen Allianz forderte er auf, alle Anstrengungen zu unternehmen,
  um die Freiheit zu verteidigen und den Frieden zu bewahren. Auch durch wirtschaftliche
  und umweltpolitische Entwicklungen gewinne die Region zunehmend an Bedeutung, betonte
  der Kanzler. Folgerichtig waren diese Themen Bestandteil der Beratungen in Finnland.
  Rohstoffe, Energie, Transport- und Seewege sowie die Weltraumkapazitäten der Arktisregion
  bezeichnete Bundeskanzler Merz bei der abschließenden Pressekonferenz als zukunftsträchtige
  Wirtschaftsfelder. Als Erfolgsbeispiel hierfür bezeichnete er den ersten europäischen
  Raketenstart im Norden Norwegens mit Beteiligung eines deutschen Unternehmens. Neben
  den aktuellen sicherheitspolitischen Herausforderungen stimmten sich die Teilnehmerinnen
  und Teilnehmer zum strategischen Ansatz der EU in der Region ab. Zum Abschluss der
  Beratungen bekräftigte Bundeskanzler Merz, dass die Gespräche in Brüssel, aber auch
  mit anderen Partnern wie Island, Norwegen, Kanada und dem Vereinigten Königreich
  fortgeführt würden. Rovaniemi, 14. September 2026: Mit europäischen Partnern sowie
  Vertreterinnen und Vertretern der EU-Institutionen hat der Kanzler in Finnland über
  einen gemeinsamen strategischen Ansatz der EU für die Arktis beraten. Im Vorfeld
  standen Vorführungen auf dem Luftwaffenstützpunkt Lapland Air Wing auf dem Programm.
  Angesichts der wachsenden geopolitischen, wirtschaftlichen und umweltpolitischen
  Entwicklungen gewinnt die Region zunehmend an Bedeutung. Finnlands Regierungschef
  und Gastgeber des Treffen, Petteri Orpo, warnt vor einer wachsenden Gefahr aus Russland.
  Das Land sei „eine permanente Bedrohung für ganz Europa“. Der Kanzler appellierte
  an alle, „diese Gefährdung ernst zu nehmen“ und „das zu tun, was notwendig ist“.
  Nur wenn Europa und die NATO sich einig seien und zusammenhalten würden, könne Freiheit
  verteidigt und Frieden bewahrt werden. Bereits am Vorabend traf Bundeskanzler Merz
  Finnlands Ministerpräsident Petteri Orpo zu einem Gespräch. Bei dem zweitägigen
  Gipfel mit mehreren EU -Staats- und Regierungschefs sowie EU-Institutionen wurde
  über die Arktisstrategie der Europäischen Union beraten. Im Herbst soll eine überarbeitete
  Version der 2021 verabschiedeten Strategie vorgestellt werden. Auf dem Gipfel wurde
  eine gemeinsame Erklärung unterzeichnet, die die Europäische Union auffordert, eine
  strategische und proaktive Rolle in der Region zu spielen. Der Bundeskanzler betont,
  dass die Arktis sei zu einem geopolitischen Hotspot geworden sei. Die Region sei
  "für Europas Sicherheit und Stabilität von entscheidender Bedeutung", fügte Merz
  hinzu. Rovaniemi, 14. September 2026: Mit europäischen Partnern sowie Vertreterinnen
  und Vertretern der EU-Institutionen hat der Kanzler in Finnland über einen gemeinsamen
  strategischen Ansatz der EU für die Arktis beraten. Im Vorfeld standen Vorführungen
  auf dem Luftwaffenstützpunkt Lapland Air Wing auf dem Programm. Angesichts der wachsenden
  geopolitischen, wirtschaftlichen und umweltpolitischen Entwicklungen gewinnt die
  Region zunehmend an Bedeutung. Finnlands Regierungschef und Gastgeber des Treffen,
  Petteri Orpo, warnt vor einer wachsenden Gefahr aus Russland. Das Land sei „eine
  permanente Bedrohung für ganz Europa“. Der Kanzler appellierte an alle, „diese Gefährdung
  ernst zu nehmen“ und „das zu tun, was notwendig ist“. Nur wenn Europa und die NATO
  sich einig seien und zusammenhalten würden, könne Freiheit verteidigt und Frieden
  bewahrt werden. Bereits am Vorabend traf Bundeskanzler Merz Finnlands Ministerpräsident
  Petteri Orpo zu einem Gespräch. Bei dem zweitägigen Gipfel mit mehreren EU -Staats-
  und Regierungschefs sowie EU-Institutionen wurde über die Arktisstrategie der Europäischen
  Union beraten. Im Herbst soll eine überarbeitete Version der 2021 verabschiedeten
  Strategie vorgestellt werden. Auf dem Gipfel wurde eine gemeinsame Erklärung unterzeichnet,
  die die Europäische Union auffordert, eine strategische und proaktive Rolle in der
  Region zu spielen. Der Bundeskanzler betont, dass die Arktis sei zu einem geopolitischen
  Hotspot geworden sei. Die Region sei "für Europas Sicherheit und Stabilität von
  entscheidender Bedeutung", fügte Merz hinzu. Der EU -Arktis-Gipfel fand am 13. und
  14. September auf Einladung des finnischen Premierministers Petteri Orpo statt.
  Angesichts der wachsenden geopolitischen, wirtschaftlichen und umweltpolitischen
  Entwicklungen gewinnt die Region zunehmend an Bedeutung. Chancen bieten sich dort
  unter anderem in den Bereichen Rohstoffe, Handel, Raumfahrt und Forschung. Zudem
  öffnen sich mit dem Voranschreiten des Klimawandels neue Seewege in der Arktis.'
