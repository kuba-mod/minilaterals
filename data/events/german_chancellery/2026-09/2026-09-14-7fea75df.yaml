title: Pressestatement von Bundeskanzler Merz anlässlich des EU -Arktis-Gipfels in
  Rovaniemi Im hohen Norden zeigt sich die Gefährdung Europas
text: Der Kanzler appellierte zu tun, was notwendig sei, um unsere Freiheit zu verteidigen
  und den Frieden zu bewahren. In seinem Eingangsstatement am zweiten Tag des EU -Arktis-Gipfels
  hat Bundeskanzler Merz den geopolitischen Wandel der Region unterstrichen. Der Gipfel
  böte die Gelegenheit zu Beratungen, „dort, wo wirklich die Bedrohung sichtbar ist“.
  Eindringlich appellierte der Kanzler an die versammelten Partner, die Gefährdung
  ernst zu nehmen und in Europa wie in der NATO zusammenzuhalten. Insbesondere den
  europäischen Teil der NATO forderte er auf, „alle Anstrengungen zu unternehmen,
  um unsere Freiheit zu verteidigen und den Frieden zu bewahren“. Seine Teilnahme
  an diesem Gipfel unterstreiche, dass auch in Deutschland der geopolitische und sicherheitspolitische
  Wandel der Region ernst genommen werde. „Wir sind Teil des Nordens. Wir sind Anrainer
  am Atlantik, wir sind Anrainer der Ostsee, und damit sind wir Teil dieses strategisch
  gefährdeten Teils Europas“, betonte der Bundeskanzler abschließend vor Beginn der
  Beratungen mit den europäischen Partnern und Vertreterinnen und Vertretern der EU-Institutionen
  . Schönen guten Tag, meine Damen und Herren! Herzlich willkommen im hohen Norden.
  Hier im hohen Norden Europas kann man sehen, wie gefährdet der Frieden in Europa
  ist. Ich bedanke mich sehr herzlich bei den Gastgebern aus Finnland, beim finnischen
  Staatspräsidenten Alexander Stubb, aber auch beim Ministerpräsidenten Petteri Orpo.
  Wir arbeiten ja im Europäischen Rat sehr eng zusammen. Ich bin dankbar, dass wir
  heute einmal die Gelegenheit haben, dort, wo wirklich die Bedrohung sichtbar ist,
  gemeinsam mit einigen Kolleginnen und Kollegen aus der Europäischen Union zusammenzutreffen.
  Ich kann nur an uns alle appellieren, diese Gefährdung ernst zu nehmen, in Europa
  zusammenzuhalten und in der NATO , im europäischen Teil der NATO allemal, das zu
  tun, was notwendig ist, nämlich alle Anstrengungen zu unternehmen, um unsere Freiheit
  zu verteidigen und den Frieden zu bewahren. Hier ist es sehr offensichtlich, wie
  notwendig das ist. Deswegen noch einmal sehr herzlichen Dank an die Gastgeber. Ich
  bin heute hierhergekommen, um genau dieses Zeichen auch zu setzen, dass wir das
  aus Deutschland heraus ernst nehmen. Wir sind Teil des Nordens. Wir sind Anrainer
  am Atlantik, wir sind Anrainer der Ostsee, und damit sind wir Teil dieses strategisch
  gefährdeten Teils Europas. Insofern bedanke ich mich noch einmal. Ich freue mich
  auf die Beratungen. Aber ich nehme es ausgesprochen ernst, was wir hier zurzeit
  erleben.
