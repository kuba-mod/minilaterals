date: '2026-09-15'
type: press_release
source_name: german_chancellery
title: Empfang des irakischen Ministerpräsidenten „Deutschland hat Interesse an einem
  gedeihenden Irak“
text: 'Bundeskanzler Merz hat den irakischen Ministerpräsidenten al-Zaidi mit militärischen
  Ehren empfangen. Beide Länder wollen die Zusammenarbeit vertiefen. „Deutschland
  hat Interesse an einem gedeihenden Irak.“ Das betonte Bundeskanzler Friedrich Merz
  bei der Pressekonferenz im Anschluss an den Besuch des irakischen Ministerpräsidenten
  Ali Al-Zaidi. Man wolle ein nächstes Kapitel in der Partnerschaft gestalten, erklärte
  Merz. Dazu zähle ein deutsch-irakischer Aktionsplan, den beide Regierungen ausgehandelt
  hätten. Schwerpunkt der Zusammenarbeit sei dabei die Wirtschaft, so der Kanzler.
  Viele deutsche Unternehmen seien mittlerweile im Irak aktiv und brächten den „Handel
  in Schwung“, sagte der Bundeskanzler und hob eine heute unterzeichnete Vereinbarung
  zur irakischen Elektrizitätsversorgung hervor. Ein weiterer Schwerpunkt des Gesprächs
  war die schwierige Lage in der Region. Sehr geehrter Herr Premierminister, lieber
  Ali Al-Zaidi, herzlich willkommen in Berlin! Ich freue mich sehr, dass wir uns heute
  das erste Mal auch persönlich treffen. Denn unsere beiden Länder, Irak und Deutschland,
  verbinden bewegte Jahre und Jahrzehnte. Wir haben in schweren Zeiten an Ihrer Seite
  gestanden. Seit 2004, also seit jetzt über 20 Jahren, unterstützen wir die Stabilisierung
  Iraks mit großem Engagement. Unsere Zusammenarbeit trägt Früchte. Das Terrorkalifat
  des Islamischen Staates ist Geschichte. Irak hat sich trotz aller bestehenden Herausforderungen
  beeindruckend stabilisiert. Ihre erste Reise nach Europa führt Sie nach Paris und
  nach Berlin. Diese Reise unterstreicht, wie wichtig unsere Partnerschaft für Sie
  ist, und dafür danke ich Ihnen sehr. Wir haben heute darüber gesprochen, wie wir
  das nächste Kapitel unserer Partnerschaft gestalten. Das halten wir in einem verabredeten
  deutsch-irakischen Aktionsplan fest, den beide Regierungen in den letzten Wochen
  ausgehandelt haben. Deutschland hat Interesse an einem starken und gedeihenden Irak.
  Dazu gehört ein gutes Miteinander Bagdads mit den Kurden im Norden des Landes. Es
  ist eine gute Nachricht, dass Millionen Binnenvertriebener zurückgekehrt sind, darunter
  sehr viele Jesiden. Deutschland hilft Ihnen, diesen Menschen vor Ort wieder eine
  Perspektive zu geben. Ein Schwerpunkt unserer Zusammenarbeit ist die Wirtschaft.
  Diejenigen, die vor dem Krieg und vor Islamismus geflohen sind, werden rascher zurückkehren,
  wenn Wachstum, wenn Arbeitsplätze, wenn neuer Wohlstand entsteht. Viele deutsche
  Unternehmen sind mittlerweile im Irak aktiv. Sie entwickeln neue Lösungen, zum Beispiel
  für die Energieversorgung. Sie leisten Pionierarbeit in der Abfallwirtschaft. Sie
  bringen unseren Handel in Schwung. Das nutzt beiden Seiten. Bestes Beispiel dafür
  ist die Vereinbarung zur irakischen Elektrizitätsversorgung, die wir heute unterzeichnen
  werden. Eine starke Präsenz der deutschen und der europäischen Wirtschaft in Irak
  braucht gute Rahmenbedingungen. Wir haben deswegen auch über diese Rahmenbedingungen
  miteinander gesprochen. Wir wollen Fortschritte im Kampf gegen die Korruption erreichen,
  und wir wünschen uns eine noch transparentere und noch effizientere Verwaltung in
  einer rechtsstaatlichen Ordnung. Ihre Regierung, Herr Ministerpräsident, hat wichtige
  erste Schritte dafür eingeleitet. Zählen Sie dabei bitte auch auf unsere fortgesetzte
  Unterstützung. Im Mittelpunkt unseres heutigen Gesprächs und unserer heutigen Begegnung
  stand die schwierige Lage in der Region insgesamt. Wir haben lange über die Straße
  von Hormus und über die Rolle des Irans gesprochen. Iran muss diese Blockade endlich
  beenden. Es muss vor allem sein militärisches Nuklearprogramm einstellen. Teherans
  Unterstützung von Proxys in der gesamten Region muss aufhören. Wir sehen die Folgen
  jeden Tag. Wir fordern Iran auch dazu auf, den Konflikt nicht weiter in den Irak
  zu tragen, wie wir es gerade erst wieder erlebt haben. Herr Premierminister, auch
  wir blicken deshalb mit Sorge auf die Entwicklung im Roten Meer. Die Huthi kontrollieren
  mittlerweile strategische Stellungen um Bab al-Mandab. Sie greifen Energieanlagen
  in Saudi-Arabien an. Das verschärft die Lage auf den Energiemärkten weiter, und
  das trifft auch Deutschland. Wir sehen das mittlerweile jeden Tag. Die internationale
  Staatengemeinschaft kann nicht zulassen, dass die Huthi nun die Schifffahrt im Roten
  Meer zur Geisel nehmen. Wir beraten in der Europäischen Union und mit den Partnern
  in der Region, auch mit Ihnen, welchen Beitrag wir zusammen leisten können, um diesen
  Konflikt zu beenden. Herr Premierminister, auch Ihre Regierung hilft, Schritt um
  Schritt wieder mehr Frieden und Sicherheit in der Region zu erarbeiten. Ein wesentliches
  Element bildet dabei die von Ihnen eingeleitete und angestoßene Entwaffnung der
  Milizen. Ich ermutige Sie: Setzen Sie diese Arbeit entschlossen fort! Mit unseren
  Partnern helfen wir Ihnen, dabei voranzukommen. Deutschland bleibt bereit, die sicherheitspolitische
  Zusammenarbeit mit dem Irak fortzusetzen, wenn Ihre Regierung dies wünscht. Das
  ist Ihre Entscheidung. Das gilt für den gesamten Irak. Die Gespräche darüber verlaufen
  gut. Ich bedanke mich noch einmal für Ihren Besuch und wünsche uns allen für unsere
  weitere Zusammenarbeit viel Erfolg. Noch einmal danke für die guten Gespräche, die
  wir heute hatten! Danke für Ihren Besuch! Alles Gute! Ich freue mich sehr auf die
  Fortsetzung unserer Zusammenarbeit. Vielen Dank, Herr Bundeskanzler! Ich wiederhole
  meinen Dank auch für den herzlichen Empfang und überbringe Ihnen die Grüße aus Bagdad
  nach Berlin, aus Mesopotamien in das Land des Ingenieurwesens und der Genauigkeit.
  Die Beziehung zwischen Irak und Deutschland ist eine außergewöhnliche Beziehung,
  die die Zeit überdauert hat und auf gegenseitigem Respekt und dem gemeinsamen Glauben
  daran beruht, dass das Aufbauen immer stärker ist als das Zerstören. Wir sprechen
  die Sprache der Zukunft. Ich habe mit dem Herrn Bundeskanzler darüber gesprochen,
  dass der Irak auf die Bundesrepublik Deutschland als einen verlässlichen Partner
  schaut. Deswegen möchten wir die wirtschaftlichen Brücken zwischen unseren beiden
  Ländern aufbauen und stärken, etwa hinsichtlich des Technologieaustauschs von Deutschland
  in den Irak. Irak hat sehr viele Rohstoffe und sehr viele Arbeitskräfte, braucht
  aber die Technologie und die deutsche Expertise. Diese Partnerschaft wird keine
  einseitige Partnerschaft sein. Es wird eine bilaterale Partnerschaft, ein Austausch
  zwischen uns beiden sein. Wir haben Energiereserven und können Übereinkommen zwischen
  der Regierung Iraks und der Regierung Deutschlands über den Export von Rohöl in
  die Bundesrepublik Deutschland schließen, und Irak wird Technologie aus Deutschland,
  Ausrüstung aus Deutschland kaufen. Wir haben ebenfalls darüber gesprochen, wie die
  politische Lage aussieht. Die deutsche Regierung hat einen großen Wunsch danach ‑
  und wir auch ‑, dass wir die Eskalation stoppen und eine Lösung für den Konflikt
  zwischen Iran und den USA finden. Dieses Problem ist nicht nur ein Problem zwischen
  zwei Ländern, sondern betrifft die ganze Welt. Manche Länder sind dadurch stärker
  geschädigt als die eigentlich rivalisierenden Länder. Irak ist dadurch, dass es
  seine Ölprodukte nicht exportieren kann, am schlimmsten getroffen. Das macht sich
  auf den Ölmärkten bemerkbar und das macht sich auch für die einfachen Bürger bemerkbar.
  Es hat große Auswirkungen. Ich habe mit dem Herrn Bundeskanzler auch darüber gesprochen,
  dass wir unsere Standpunkte im politischen Bereich vereinheitlichen und dass wir
  uns über drängende Probleme, die noch zu lösen sind, vorab abstimmen. Deutschland
  war immer ein Land, mit dem man sich getroffen hat, und kein Land, von dem Feindschaft
  ausging. Es hat in seiner Geschichte viel durchgemacht. Wir möchten von der deutschen
  Erfahrung profitieren und setzen auf die deutsche Ausgeglichenheit und auf die deutsche
  Stimme der Vernunft. Frage : Ich habe eine Frage an den irakischen Ministerpräsidenten:
  Ihr Land ist einer der größten Ölproduzenten der Welt. Sie haben eben darauf hingewiesen,
  dass Sie im Moment nicht exportieren können. Was muss getan werden, damit Sie zum
  Beispiel Europa und Deutschland mit Erdöl versorgen können? Herr Bundeskanzler,
  es gibt hier eine Debatte ‑ Sie haben es heute Morgen in einer Rede kurz erwähnt ‑
  über die sehr stark gestiegenen Spritpreise. Jetzt gibt es schon Vorstellungen,
  was getan werden kann. Sind Sie mit einer Übergewinnsteuer einverstanden, mit Direktzahlungen
  an Bürger? Was können Bürger erwarten, und wie schnell können sie jetzt eine Entlastung
  bekommen? Ministerpräsident Al-Zaidi: Der Irak kann bis heute Öl nach Ostasien exportieren,
  und unser Verbrauchermarkt für Rohöl ist aufgrund der geografischen Nähe immer Ostasien
  gewesen. Wir möchten hier aber diversifizieren. Es gibt eine Pipeline nach Ceyhan
  in der Türkei, über die eine Million Barrel pro Tag transportiert werden können.
  Wir arbeiten auch am Transport von einer Million Barrel pro Tag in Richtung Syrien
  in der ersten Phase, und in der zweiten Phase möchten wir noch mehr in dieser Richtung
  exportieren. Dieses Öl wird in Richtung Europa und in die Märkte dort fließen. Wir
  möchten hier auch zu einer Übereinkunft darüber kommen, wie viel Öl benötigt wird.
  Wir möchten über das Mittelmeer auch in Richtung Frankreich exportieren. Ich habe
  mit dem französischen Partner darüber gesprochen, jetzt sprechen wir mit Deutschland
  darüber. Wir sind offen für Europa, wir sind offen für die USA, für den Westen im
  Allgemeinen. Unsere Vision ist, dass wir unsere Produktionsmenge verdoppeln können.
  Wir wollen auf eine Produktionsmenge von neun bis zehn Millionen Barrel täglich
  kommen. Das wird einen großen Teil dessen decken, was benötigt wird. Die Hälfte
  davon soll Richtung Europa und Richtung Westen gehen. Das ist unser Plan. Bundeskanzler
  Merz: Herr Kollege, wir haben das Thema der Übergewinnsteuer mehrfach diskutiert.
  Wir können nur Unternehmen besteuern, die ihren Sitz in Deutschland haben. Wir haben
  in Deutschland eine größere Zahl von Raffinerien. Diese Raffinerien stehen selbst
  unter erheblichem wirtschaftlichem Druck. Ich sehe im Augenblick keine ausreichende
  faktische Grundlage und auch keine rechtliche Grundlage für die Besteuerung von
  sogenannten Übergewinnen. Wir müssen umgekehrt ein hohes Interesse daran haben,
  dass wir in Deutschland Raffinerien behalten, und das werden wir nicht schaffen,
  wenn wir diese Unternehmen, die selbst erhebliche Schwierigkeiten im Markt haben,
  jetzt auch noch zusätzlich besteuern. Wie gesagt, ich sehe keinerlei faktische und
  keinerlei rechtliche Grundlage für eine solche Übergewinnsteuer, zumal diejenige,
  die wir im Jahr 2022 einmal zu erheben versucht haben, immer noch vor den Gerichten
  ausgetragen wird. Das ist also keine ausreichende Grundlage für Besteuerung. Insofern
  müssen wir uns etwas Einfacheres, was Anderes einfallen lassen. Wir haben in der
  Koalition schon vor langer Zeit einen Direktauszahlungsmechanismus besprochen. Das
  Finanzministerium ist hier an der Arbeit. Ich hoffe, es ist damit auch bald fertig,
  sodass wir die privaten Haushalte mit entsprechenden Unterstützungsleistungen direkt
  erreichen können. In der Zwischenzeit müssen wir uns auch noch über andere Möglichkeiten
  unterhalten. Dazu gibt es Vorschläge. Wir haben im Grunde genommen mehrere Optionen.
  Wir können verschiedene Steuern und Abgaben in den Blick nehmen, um jetzt den Verbraucherinnen
  und Verbrauchern in Deutschland zu helfen. Ich sehe die Notwendigkeit. Wir werden
  in der Koalition über dieses Thema sprechen, und ich hoffe, wir werden auch bald
  zu Lösungen kommen. Frage : Herr Ministerpräsident, alle Augen sind auf Sie gerichtet,
  nicht nur in Irak, sondern auch hier in Europa, in den USA. Es wird darauf gewartet:
  Was können Sie bringen, was können Sie schaffen? Seitdem Sie im Amt sind, haben
  Sie es tatsächlich geschafft, auf der wirtschaftlichen Seite die nationale Position
  Iraks klar darzustellen, auch ganz klar vorzuzeichnen, was die Entwicklungspolitik
  angeht. Wir möchten Details von Ihnen haben. Wie kann Deutschland auf diesen Entwicklungspfad
  eintreten? Das ist natürlich ein schwieriger Weg. Wie sind die Details? Die Öffentlichkeit
  im Irak möchte natürlich sehen, was dabei herauskommt. Sie als Ministerpräsident
  möchten natürlich den Weg so beschreiten, dass etwas geschaffen wird, das auch tatsächlich
  geschafft werden kann. Welche Politik ist jetzt, in dieser Phase, dafür erforderlich?
  Ministerpräsident Al-Zaidi: Vielen Dank. ‑ Die Beziehung zwischen Irak und Deutschland
  ist eine ganz feste Beziehung und historisch gewachsen. Die deutsche Bevölkerung
  und die deutsche Regierung sind im Irak hoch angesehen, auch bei der Bevölkerung.
  Es gibt etwa 300 000 Iraker, die in Deutschland leben. Diese wurden von der deutschen
  Regierung, von der deutschen Bevölkerung mit großer Freundschaft, Ehrerbietung und
  mit großem Respekt behandelt. Der irakische Bürger konnte in Deutschland seine Würde
  bewahren und hat hier in diesem Land großen Respekt vorgefunden. Hier in Deutschland
  sind 300 000 Iraker als Botschafter für Deutschland; die berichten nur Gutes aus
  Deutschland. Wie Sie gesagt haben: Die deutschen Unternehmen sind bei uns im Irak
  willkommen, noch willkommener als die irakischen Firmen. Sie werden sozusagen in
  ihrem eigenen Land arbeiten, in einem Land, das sie sehr stark willkommen heißt.
  Deutschland hat keine negativen Auswirkungen auf den Irak herbeigeführt. Die deutschen
  Wissenschaftler haben im Irak, noch bevor das Öl entdeckt wurde, aus Liebe zur Wissenschaft
  wichtige Entdeckungen im archäologischen Bereich gemacht, was Babylon angeht. Sie
  haben wichtige Erfahrungen in unserem Land gemacht. Wir haben wichtige Erfahrungen
  gemacht. Wir möchten von der Expertise Deutschlands profitieren. Wir begrüßen Sie
  in Ihrer zweiten Heimat im Irak. Wir möchten in der nächsten Zeit einen Plan vorlegen.
  Die Welt strebt immer nach Stabilität. Sie gehen dorthin, wo Stabilität ist. Sie
  wollen nicht kurzfristige Lösungen. Deutsche Firmen, auch andere Firmen, können
  im Irak stabil arbeiten. Es ist ein Land, das sie sehr, sehr stark willkommen heißen
  wird. Es wird eine gute Umgebung für die Firmen dort geben. Vielen Dank. Frage:
  Herr Merz, seit Jahren sitzen Personen in Gefängnissen, zunächst in Syrien und jetzt
  im Irak, die mutmaßlich für den IS gekämpft haben sollen. Aktuell sitzen 26 Personen
  mit Deutschlandbezug in Bagdad im Gefängnis. Was plant die Bundesregierung, mit
  diesen Männern zu tun? Nimmt sie sie zurück oder nicht? Herr Al-Zaidi, eine Frage
  an Sie: Was erwarten Sie von den Herkunftsländern dieser Personen? Erwarten Sie
  von der Bundesregierung, dass sie die mutmaßlichen IS-Kämpfer zurücknimmt? Wenn
  nicht, wenn sie das nicht tun sollte, unter welchen Bedingungen würden Sie diese
  quasi im Irak lassen? Gestatten Sie noch eine Frage vom Kollegen: Sie haben persönlich
  nach dem Drohnenangriff in Saudi-Arabien eine Untersuchung angekündigt. Gibt es
  Neuigkeiten zu den Ermittlungen? Hat der Irak Informationen mit Saudi-Arabien geteilt,
  fragt der Kollege. Ministerpräsident Al-Zaidi: Vielen Dank. Was die Gefangenen angeht,
  ist es ein Justizproblem, nichts, was die Regierung betrifft. Wir haben eine unabhängige
  Justiz im Irak. Die Regierung kann der Justiz nicht vorschreiben, was sie zu tun
  hat. Was die Justiz vorgibt, wird die Regierung ausführen. Was den Schlag in Saudi-Arabien
  angeht, so führen wir Ermittlungen dazu durch. Wir haben eine gemeinsame Kommission
  zwischen Irak und der Islamischen Republik Iran gebildet, und wir analysieren gerade
  die Ergebnisse. Wir möchten hier nicht vorgreifen, denn wir brauchen erst einmal
  belastbare Ergebnisse. Wenn wir Ergebnisse in diesem Bereich haben, werden wir Ihnen
  das zusammen mit den Iranern mitteilen. Bundeskanzler Merz: Ich will zunächst sagen,
  dass die Entscheidung Iraks, eine hohe Zahl von IS-Häftlingen aus Nordostsyrien
  aufzunehmen, von einem sehr hohen Maß an Verantwortungsbewusstsein zeugt. Wir betreuen
  über die deutsche Botschaft die Häftlinge konsularisch, die die deutsche Staatsangehörigkeit
  haben oder behaupten, sie zu haben. Wir stehen in engem Austausch mit der Regierung
  in Bagdad, und wir haben auch Verständnis dafür, dass die Verbrechen des IS, die
  in Irak und in Syrien begangen worden sind, auch im Irak strafrechtlich verfolgt
  werden. Mehr kann nicht dazu im Augenblick nicht sagen. Aber gehen Sie davon aus,
  dass unsere Botschaft alles tut, um die deutschen Staatsangehörigen dort so zu betreuen,
  dass sie auch verlässlich betreut werden. Alles Weitere muss mit den irakischen
  Behörden besprochen werden. Frage : Meine erste Frage richtet sich an den irakischen
  Ministerpräsidenten. Herr Ministerpräsident, Sie haben angekündigt, künftig eine
  Million Barrel Öl täglich über Syrien zu exportieren. Meine Frage ist, wohin das
  Öl exportiert werden soll. Planen Sie, die Menge zu erhöhen? Welche Vereinbarung
  hierüber besteht mit Deutschland? Welchen konkreten Anteil aus den daraus erzielten
  Einnahmen wird die Regionalregierung Kurdistans erhalten? Herr Bundeskanzler, Deutschland
  war ein sehr wichtiger Unterstützer und Partner der Peschmerga im Kampf gegen den
  IS. Bedeutet das Ende des Einsatzes der internationalen Koalition auch das Ende
  der deutschen Unterstützung für die Peschmerga sowie für die Ausbildung und das
  Training? Herr Ministerpräsident aus dem Irak, es tut mir leid, dass ich nicht so
  gut Arabisch kann. Ich bin dabei, Arabisch zu lernen. Bitte verzeihen Sie mir. Nächstes
  Mal stelle ich die Frage auf Arabisch. Danke Ihnen! Ministerpräsident Al-Zaidi:
  In jeder Sprache, in der Sie sprechen, sind Sie Irakerin! Ich habe gesagt: Ich möchte
  unsere Exportwege diversifizieren, ausweiten. Aber der Irak ist bis jetzt abhängig
  von einer einzigen Meerenge. Das war bisher immer so. Das heißt, der Irak muss souverän
  werden, was das angeht. Wir haben 50 Millionen Einwohner. Wir haben gesehen, was
  passieren kann. Das, was jetzt passiert, kann sich immer wieder wiederholen. Das
  heißt, wir müssen unsere Exporte diversifizieren, ein Teil über die Türkei, ein
  Teil über Syrien, ein Teil über das Mittelmeer. Das wird Richtung Westen verkauft,
  Richtung Europa, Richtung USA. Wir haben auch mit Präsident Macron darüber gesprochen,
  und heute habe ich mit dem Herrn Bundeskanzler darüber gesprochen. Dieses Öl wird
  zu den geltenden Preisen verkauft werden. Aber es kann auch eine Idee sein, dass
  es über den Weg der Entwicklung eine Pipeline zwischen dem Irak und Deutschland
  geben wird, dass es sozusagen eine Zweibahnstraße wird. Das ist natürlich sicherer,
  als etwas über das Meer zu transportieren. Was die RKI angeht, die Region Kurdistan-Irak:
  Sie ist ein untrennbarer Teil des Irak. Sie hat ihre Rechte, sie hat ihre gesetzliche
  oder rechtliche Stellung, und das wird nicht angetastet. Bundeskanzler Merz: Vielen
  Dank für die Frage nach der militärischen Präsenz im Irak. Diese militärische Präsenz
  endet am 30. September, also in zwei Wochen, auf Bitten des Irak. Das respektieren
  wir selbstverständlich. Aber wir werden auch unsere militärische Zusammenarbeit,
  wenn das gewünscht wird, fortsetzen, und wir stehen auch für eine Unterstützung
  des Irak weiter zur Verfügung, wenn dies seitens der Regierung gewünscht wird. Wie
  ein zukünftiges Engagement aussehen kann, ist dann eine Sache, die wir mit den irakischen
  Partnern besprechen müssen. Das weiß der Premierminister; darüber haben wir gesprochen.
  Wir respektieren das und bieten an, auch eine Zusammenarbeit in anderer Form mit
  dem Irak fortzusetzen, weil wir ein hohes Interesse daran haben, dass es dort auch
  weiterhin stabile politische Beziehungen gibt, dass es im Land Stabilität gibt.
  Wenn wir dazu beitragen können, dann tun wir das so wie in der Vergangenheit auch.
  Bundeskanzler Merz: Ja, das ist damit umfasst. Wir haben ja auch mitgeholfen, diesen
  Konflikt zu lösen. Das ist offensichtlich gelungen, jedenfalls für einen Teil der
  Region. Noch einmal: Wenn wir gebeten werden, weiterzuhelfen, dann sind wir bereit,
  das zu tun. Wir respektieren aber den politischen Willen des Irak, jetzt die militärische
  Präsenz von Deutschland zum Ende des Monats September 2026 zu beenden. Ministerpräsident
  Al-Zaidi: Vielleicht noch eine kleine Ergänzung: Der Irak hat heute Truppen, die
  das Hoheitsgebiet gut verteidigen können. Wir haben verschiedene Truppenteile und
  Ränge. Wir haben mit den USA und gestern mit dem französischen Präsidenten darüber
  gesprochen, heute auch mit dem Herrn Bundeskanzler. Irak braucht diese Unterstützung
  heute nicht mehr. Wir haben diesen Schritt gemacht, an dem wir jetzt arbeiten, dass
  wir den irakischen Himmel vor dem Eindringen von Flugzeugen beschützen, und wenn
  wir Deutschland oder andere Koalitionsländer hierfür vielleicht als Hilfe benötigen,
  dann sind sie nicht weit weg. Aber wir können unser Land jetzt tatsächlich verteidigen,
  das Gewaltmonopol des Staates wird durchgesetzt, und die Entscheidung über Krieg
  oder Frieden soll eine souveräne Entscheidung des Iraks sein. In der Geschichte
  sehen wir, dass die militärische Partnerschaft natürlich nicht das gebracht hat,
  was eine wirtschaftliche und politische Partnerschaft gebracht haben. Es ist eine
  Partnerschaft in schwierigen Zeiten gewesen. Jetzt möchten wir, dass diese Länder
  kommen und ein Teil des Aufbaus und der Investitionen in unserem Land werden und
  dass wir unsere politischen Positionen vorab koordinieren. Diese Art der Partnerschaft
  ist jetzt für uns ganz wichtig.'
