title: Bundeskanzler Merz empfängt den Staatspräsidenten der Vereinigten Arabischen
  Emirate, Scheich Mohammed Bin Zayed
text: Bundeskanzler Merz wird am kommenden Donnerstag, den 10. September, gegen 16
  Uhr den Staatspräsidenten der Vereinigten Arabischen Emirate, Scheich Mohammed Bin
  Zayed, im Bundeskanzleramt empfangen. Im Vordergrund des Gesprächs werden u.a. der
  Ausbau der strategischen Partnerschaft, die Vertiefung der wirtschaftlichen Beziehungen
  sowie das gemeinsame Engagement für Frieden und Stabilität im Nahen und Mittleren
  Osten stehen.
