title: Energiesteuersenkung ab Oktober Neues Spritpreis-Entlastungspaket der Bundesregierung
text: 'In Folge des Iran-Nahost-Konflikts und der Sperrung der Schifffahrtsroute von
  Hormus ist der Ölpreis auf dem Weltmarkt um etwa 30 Prozent gestiegen. Die Auswirkungen
  des Iran-Nahost-Konflikts auf die Kraftstoffpreise bereiten vielen Menschen Sorgen.
  Aus diesem Grund hat die Bundesregierung beschlossen, die Energiesteuer ein weiteres
  Mal um rund 17 Cent pro Liter Kraftstoff zu senken. In Abstimmung mit den Ländern
  und den Koalitionsfraktionen im Deutschen Bundestag soll der Steuerrabatt beim Tanken
  zum 1. Oktober 2026 und bis Ende des Jahres gelten. Für einen solchen Tankrabatt
  hatte sich die Regierungskoalition am 12. April bereits für Mai und Juni 2026 entschieden.
  Bundeskanzler Friedrich Merz sagte: „Wer jeden Tag auf das Auto angewiesen ist,
  kommt an seine Belastungsgrenze. Wir handeln schnell und haben einen klaren Fahrplan
  für 2027. Wir zeigen, dass wir in der Krise widerstandsfähig sind und den Bürgerinnen
  und Bürgern helfen.“ Er betonte, die Entlastung von 2,5 Milliarden Euro sei in Zeiten
  angespannter Haushalte kein Pappenstiel. „Umso mehr freue ich mich, wie schnell
  wir dieses Paket geschnürt haben“, so der Kanzler. Das sei ein starkes Signal für
  Deutschland. Darüber hinaus wird der Bund Gespräche mit der Mineralölwirtschaft
  führen, um spätestens zum 1. Januar 2027 einen vorübergehenden Spritpreisdeckel
  nach dem Vorbild Luxemburgs oder Belgiens einzuführen. Besondere Priorität hat dabei
  die Versorgungssicherheit. Die Bundesregierung bestärkt den Beschluss des Koalitionsausschusses
  vom 12. April 2026 und begrüßt die Gespräche in der Europäischen Union analog des
  EU -Energiekrisenbeitrages 2022, Maßnahmen gegenüber der Mineralölwirtschaft zu
  prüfen. Außerdem hat die Bundesregierung das Kartellrecht bereits in diesem Jahr
  weiter verschärft. Seit dem 1. April ist zudem das Maßnahmenpaket der Bundesregierung
  wirksam, um gegen die vielen täglichen Preiserhöhungen an den Tankstellen und gegen
  missbräuchlich erhöhte Kraftstoffpreise vorzugehen. Die sogenannte 12-Uhr-Regel
  erlauft Preiserhöhungen nur einmal am Tag. Das soll die Verlässlichkeit und Transparenz
  an den Tankstellen erhöhen und das Bundeskartellamt stärken. Die Senkung der Energiesteuer
  entlastet Verbraucherinnen und Verbraucher sowie Unternehmen schnell, direkt und
  unbürokratisch. Die Bundesregierung senkt die Energiesteuer ab Oktober bis Ende
  des Jahres um 14 Cent pro Liter, was zusammen mit der Umsatzsteuerersparnis eine
  Entlastung von rund 17 Cent pro Liter Kraftstoff bedeutet. Insgesamt werden Bürgerinnen
  und Bürger und Wirtschaft so um rund 2,5 Milliarden Euro entlastet. Bund und Länder
  sorgen gemeinsam für diese Entlastung. Die unabhängige Monopolkommission und das
  Bundeskartellamt kommen zu dem Schluss, dass die Energiesteuersenkung bei Benzin
  und Diesel im Mai und Juni diesen Jahres weitgehend bei Verbraucherinnen und Verbrauchern
  angekommen ist. Die Maßnahme hat gewirkt: Der Tankrabatt hat seine Funktion erfüllt,
  in einer Phase besonders hoher Kraftstoffpreise Preisspitzen effektiv abzufangen. Damals
  hatte der Bund 1,6 Milliarden Euro für den Tankrabatt eingeplant. Es gibt deutliche
  regionale Unterschiede bei der Preisgestaltung an der Zapfsäule. Die Energiesteuer,
  die im Zuge des Tankrabatts für zwei Monate gesenkt wird, ist lediglich ein Preisbestandteil
  des Kraftstoffpreises. Wie sich die Preise gestalten, liegt weiterhin vollständig
  in der Hand der Mineralölkonzerne bzw. Tankstellenbetreiber und ist von vielen Faktoren
  wie der Preisentwicklung von Rohöl oder Transportkosten abhängig. Die unabhängige
  Monopolkommission und das Bundeskartellamt kommen aber zu dem Schluss, dass die
  Energiesteuersenkung bei Benzin und Diesel im Mai und Juni diesen Jahres weitgehend
  bei Verbraucherinnen und Verbrauchern angekommen ist. Die Maßnahme hat gewirkt:
  Der Tankrabatt hat seine Funktion erfüllt, in einer Phase besonders hoher Kraftstoffpreise
  Preisspitzen effektiv abzufangen. Damals hatte der Bund 1,6 Milliarden Euro für
  den Tankrabatt eingeplant. Seit dem 1. April dürfen die Tankstellen in Deutschland
  nur noch einmal am Tag ihre Spritpreise erhöhen: um 12 Uhr. Preissenkungen sollen
  jederzeit möglich sein. Die neue Regel sorgt für Verlässlichkeit und mehr Transparenz
  für Autofahrerinnen und Pendler. Denn zuvor änderte sich der Spritpreis bis zu 22-mal
  pro Tag im Durchschnitt. Das war für Autofahrerinnen und Autofahrer sehr intransparent
  und ärgerlich. Bei Verstößen gegen das Verbot täglich mehrfacher Preiserhöhungen
  drohen nun Bußgelder bis zu 100.000 Euro. Nach einem Jahr wird die Bundesregierung
  über die Wirksamkeit und Wirkungen in der Praxis berichten. Die Marktransparenzstelle
  für Kraftstoffe im Bundeskartellamt bündelt und überwacht die Preisdaten von rund
  15.000 Tankstellen in Deutschland. Diese müssen jede Preisänderung innerhalb von
  fünf Minuten anzeigen. Sie werden beispielsweise an zugelassene Spritpreis-Apps
  und Service-Portale weitergegeben. Die Markttransparenzstelle wertet jetzt auch
  die Daten zur Einhaltung der neuen 12-Uhr-Regel aus. Jeder Verstoß wird dann den
  zuständigen Landesbehörden mitgeteilt. Die Zahlen der Abweichungen von der 12 Uhr-Regelung
  sind nach wie vor hoch, so das Bundeskartellamt am 4. August. Landesbehörden für
  die Durchsetzung der 12 Uhr-Regelung sind dem Bundeskartellamt mittlerweile aus
  Baden-Württemberg, Bayern, Berlin, Bremen, Hamburg, Hessen, Mecklenburg-Vorpommern,
  Niedersachsen, dem Saarland, Sachsen, Schleswig-Holstein und Thüringen bekannt.
  Mit allen übrigen Bundesländern steht das Amt in Kontakt. Ja, im Zusammenhang mit
  den Spritpreisen hat das Bundeskartellamt Verfahren gegen alle Raffineriebetreiber
  in Deutschland eingeleitet. Mit ihrem Maßnahmenpaket vom 1. April hat die Bundesregierung
  d ie kartellrechtliche Missbrauchsaufsicht gegenüber den Mineralölkonzernen verschärft.
  Das Bundeskartellamt kann nun gegen missbräuchliche Preiserhöhungen bei Kraftstoffen
  einfacher und schärfer vorgehen. Damit sollen insbesondere auch überhöhte Preise
  gegenüber freien Tankstellen verhindert werden. Bei Verdacht auf missbräuchlich
  überhöhte Kraftstoffpreise müssen die Unternehmen darlegen, dass die Erhöhungen
  gerechtfertigt sind. Zudem soll das Bundeskartellamt strukturelle Wettbewerbsstörungen
  einfacher feststellen und damit schneller beheben können. Verschärfte Kontrollen
  bei Kosten und Preisen können eine Voraussetzung für Preisdämpfungen sein, jedoch
  nicht unmittelbar bewirken. Mit der 12. Novelle des Gesetzes gegen Wettbewerbsbeschränkungen
  (GWB) will die Bundesregierung das Kartellrecht noch weiter verschärfen: Künftig
  müssen auch die Preiserhöhungen bei Super Plus gemeldet werden. Raffinerien und
  Kraftstoffgroßhandel müssen der Markttransparenzstelle künftig zusätzliche Daten
  melden. So soll die Marktaufsicht missbräuchlich überhöhte Preise noch effektiver
  ermitteln und sanktionieren können. Sie soll außerdem besser feststellen können,
  ob sinkende Rohstoffpreise auch schnell an Verbraucher weitergegeben werden, sobald
  sich die Marktlage wieder beruhigt. Der Bund wird Gespräche mit der Mineralölwirtschaft
  führen, um spätestens zum 1. Januar 2027 einen Spritpreisdeckel nach dem Vorbild
  Luxemburgs oder Belgiens einzuführen. Besondere Priorität hat dabei die Versorgungssicherheit.
  Die Bundesregierung wird die Preisentwicklung und mögliche wirtschaftliche Folgewirkungen
  weiterhin eng beobachten. Weitere zielgerichtete Entlastungsmaßnahmen für die von
  der Krise besonders betroffenen Menschen und Unternehmen werden zu Beginn des Jahres
  2027 ergriffen. Der Bund schafft die Voraussetzungen für die Umsetzung des einkommensbezogenen
  Direktauszahlmechanismus. Die Bundesregierung begrüßt die Gespräche in der Europäischen
  Union, analog zum EU -Energiekrisenbeitrag 2022 Maßnahmen gegenüber der Mineralölwirtschaft
  zu prüfen.us. Zudem plant die Regierungskoalition zum 1. Januar 2027 eine Reform
  der Einkommenssteuer, um kleinere und mittlere Einkommen dauerhaft zu entlasten.
  Weitere Antworten auf häufig gestellte Fragen zur Energie und Energieversorgung
  finden Sie in unserem FAQ.'
