title: Bundeskanzler Merz telefoniert mit dem indischen Premierminister Narendra Modi
text: Bundeskanzler Friedrich Merz hat heute mit dem indischen Premierminister Narendra
  Modi telefoniert. Beide bekräftigten die strategische Partnerschaft zwischen Deutschland
  und Indien und tauschten sich zu regionalen sowie internationalen Themen aus. Bundeskanzler
  Merz und Premierminister Modi berieten über Fragen der sicherheitspolitischen Zusammenarbeit.
  Sie sprachen sich für eine schnelle Unterzeichnung des Freihandelsabkommens zwischen
  der Europäischen Union und Indien aus.
