title: 28. Februar 1989 – Auf dem Weg zur Deutschen Einheit Ein folgenreicher Beschluss
  in Budapest
text: '1966 hat Ungarn seine 350 Kilometer lange Grenze zu Österreich mit elektronischen
  Grenzsperren gesichert. Gut 20 Jahre später sind die Anlagen marode und für eine
  Sanierung hat das Land kein Geld. Ende 1988 hat der neue Ministerpräsidenten Miklós
  Németh deshalb die Wartungskosten für die Signalanlagen aus dem Haushalt gestrichen.
  Parteichef Karoly Grosz will die Anlagen erst 1990 abreißen lassen, aber das ungarische
  Innenministerium möchte schneller handeln – und gibt den Befehl aus, am 2. Mai 1989
  mit dem Abbau zu beginnen. Tatsächlich starten an diesem Tag die Abrissarbeiten.
  Da Ungarn noch Mitglied des kommunistischen Militärbündnisses, des Warschauer Paktes,
  ist, braucht es allerdings die Zustimmung Moskaus. Am 3. März 1989 informiert Ministerpräsident
  Németh den sowjetischen Staats- und Parteichef Michail Gorbatschow . Seine Antwort:
  „Ich sehe da, ehrlich gesagt, kein Problem.” Welche Folgen der ungarische Schritt
  haben wird, übersehen die Machthaber in Ostberlin zunächst. Erst am 6. Mai 1989
  informiert Verteidigungsminister Heinz Keßler seinen Genossen Honecker über den
  Abbau der Sicherungsanlagen an der ungarisch-österreichischen Grenze. Zum Ausgleich,
  so schreibt Keßler, werde Ungarn den Streifendienst verstärken, das Netz der Beobachtungstürme
  erweitern, in schwer passierbarem Gelände mehr berittene Grenzstreifen einsetzen
  und die Bevölkerung des grenznahen Raumes „effektiver” in die Grenzsicherung einbeziehen.
  Die Staats- und Parteiführung in Ostberlin ahnt also nicht, welche Folgen die ungarischen
  Maßnahmen haben, die am 2. Mai 1989 beginnen – und von denen die Menschen in der
  DDR durch die Westmedien erfahren.'
