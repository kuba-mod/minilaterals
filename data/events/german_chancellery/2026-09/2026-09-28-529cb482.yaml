date: '2026-09-28'
type: press_release
source_name: german_chancellery
title: Rede von Bundeskanzler Merz zur Präsentation des Siliziumkarbidprojekts der
  Stahl- Holding -Saar „Wir müssen Industrieland bleiben“
text: 'Bundeskanzler Merz sprach vor den Mitarbeitern von Saarstahl. Bundeskanzler
  Friedrich Merz hat bei der Eröffnung der Vorhaben Power4Steel und Y-SIC in Dillingen
  an der Saar die Bedeutung der Transformation für den Industriestandort Deutschland
  betont. Im Mittelpunkt seiner Rede standen die klimafreundliche Modernisierung der
  Stahlindustrie, die Sicherung ihrer internationalen Wettbewerbsfähigkeit sowie die
  Stärkung der industriellen und technologischen Souveränität Deutschlands. Der Kanzler
  verwies zudem auf Maßnahmen der Bundesregierung zur Unterstützung der Stahlindustrie,
  zur Senkung der Energiekosten und zum Abbau von Bürokratie. Zuvor besuchte der Bundeskanzler
  die Baustelle für das Projekt Power4Steel , hier soll klimaneutral Stahl produziert
  werden. Mit dem Innovationsprojekt Y-SIC, das die Produktion von Siliziumkarbid
  für Zukunftstechnologien voranbringen soll, wird die Abhängigkeit von Importen bei
  kritischen Rohstoffen verringert. Es soll eine Produktion zur Herstellung von Siliziumkarbid
  aufgebaut werden. Siliziumkarbid wird unter anderem für die Fertigung moderner Hochleistungselektronik
  wie Chips benötigt. Sehr geehrte Frau Ministerpräsidentin, liebe Frau Rehlinger,
  sehr geehrte Mitglieder der saarländischen Landesregierung, liebe Kolleginnen und
  Kollegen aus dem Deutschen Bundestag und dem saarländischen Landtag, Exzellenzen,
  meine sehr geehrten Damen und Herren, zunächst Ihnen, Herr Rauber, und Ihnen, Herr
  Maagh, herzlichen Dank für die überaus freundliche Begrüßung und herzlichen Dank
  für diese großartige Präsentation, die wir hier gerade gesehen haben. Das macht
  Mut für Deutschland. Herzlichen Dank. Danke an alle diejenigen, die in den letzten
  Monaten so intensiv an diesem Tag heute gearbeitet haben und die diese Unternehmen
  an diesem Standort zusammengebracht haben: die Führung des Unternehmens, die Holding
  , die Mitarbeiterinnen und Mitarbeiter des gesamten Konzerns und aller vier Unternehmen,
  die heute hier vertreten sind. Meine Damen und Herren, es geht heute um nicht mehr
  und um nicht weniger als um die Zukunft eines der ältesten Unternehmen in Deutschland,
  eines Unternehmens, das sich auf den Weg gemacht hat, sich zu verändern, sich weiterzuentwickeln,
  von einem klassischen Stahlhersteller zu einem modernen, überaus innovativen Werkstoffkonzern
  mit hoher Technologiekompetenz. Sie haben es genauso ausgedrückt: Herr Rauber, Sie
  stehen in der stolzen Tradition der jahrhundertealten saarländischen Stahlindustrie.
  Diese Industrie hat Leistungskraft und technisches Können immer wieder mit dem unbedingten
  Willen zum Wandel unter Beweis gestellt. Sie nennen dies Innovation aus Tradition.
  Es ist genau das, was auch die deutsche Industrie insgesamt, jedenfalls dann, wenn
  sie es richtig gemacht hat, immer wieder ausgezeichnet hat. Genau darauf müssen
  wir uns heute alle besinnen. Denn es geht nicht anders. Wir müssen uns immer wieder
  neu erfinden und uns an neue wirtschaftliche und technologische Entwicklungen anpassen.
  Rasanter Wandel und neue Wettbewerber machen das dringender denn je. Die beiden
  Projekte, die wir soeben gesehen haben, zeigen diesen Anspruch, einen Anspruch,
  nicht in der Tradition zu verharren, sondern den künftigen Erfolg durch unternehmerische
  Weitsicht und vor allem durch Innovation zu sichern. Zugleich sind beide Projekte
  eine Antwort genau auf die Frage, wie wir denn in Deutschland und in Europa wettbewerbsfähig
  und souverän bleiben können. Vielleicht muss ich sagen: wettbewerbsfähig bleiben
  und souverän werden können. Denn, meine Damen und Herren, ich spreche nicht nur
  von der klimafreundlichen Modernisierung unserer Grundstoffindustrien und der Diversifizierung
  unserer Rohstoffversorgung, die wir aus den einseitigen Abhängigkeiten herauslösen
  müssen. Beides sind die Herausforderungen, die uns umtreiben und an denen wir arbeiten.
  So, wie Sie, Frau Rehlinger, es hier zum Ausdruck gebracht haben – wir haben es
  immer gesagt –: Klimaschutz und internationale Wettbewerbsfähigkeit dürfen nicht
  in einem Widerspruch zueinander stehen, sondern sie müssen sich vereinen lassen.
  Sie lassen sich vereinen; sie können sich sogar wechselseitig verstärken. Genau
  an diesem Punkt sind wir heute hier. Wir können diese Grundstoffindustrien, die
  das Fundament unseres wirtschaftlichen Erfolges in Deutschland seit Jahrzehnten,
  wenn nicht seit Jahrhunderten sind, klimafreundlich modernisieren, und wir können
  sie so auch wettbewerbsfähig halten. Wir fördern das. Power4Steel ist eines der
  wichtigsten Vorhaben in dieser Richtung, und zwar in ganz Europa. Das gigantische
  Bauprojekt, das wir hier heute sehen und von dem das große Baufeld um uns herum
  Zeugnis ablegt, bildet die Grundlage für moderne und nachhaltige Produktionsprozesse.
  Wasserstoff soll dabei eine zentrale Rolle als Reduktionsmittel einnehmen. Meine
  Damen und Herren, so kann auch zukünftig wettbewerbsfähiger Stahl in Deutschland
  und vor allem hier im Saarland hergestellt werden. Wenn wir Industrieland bleiben
  wollen – und wir müssen Industrieland bleiben, um den Wohlstand unseres Landes zu
  erhalten –, dann brauchen wir in Deutschland eigene Stahlerzeugung, meine Damen
  und Herren. Das, was Sie hier heute leisten und was Sie so eindrucksvoll geschildert
  haben, kann bis Mitte der 2040er–Jahre eine Produktion sein, die vollständig CO
  2 -neutral wird. Die Dekarbonisierung der Industrie kann gelingen, wenn wie hier
  mit unternehmerischem Mut und zukunftsweisendem Engineering gearbeitet wird. Deshalb
  haben wir gemeinsam mit dem Saarland als Bundesregierung Power4Steel mit 2,6 Milliarden
  Euro insgesamt unterstützt. Ich hatte - darauf haben Sie Bezug genommen, Frau Rehlinger -
  im November des letzten Jahres zu einem Stahldialog eingeladen. Wir haben dort mit
  Vertretern der Stahlindustrie, mit den Gewerkschaften und allen Bundesländern, die
  betroffen sind, vereinbart, dass wir der Branche auf ihrem Weg in die Zukunft helfen,
  wo wir es können, damit diese Industrie im globalen Maßstab wettbewerbsfähig bleibt,
  trotz aller geopolitischen Herausforderungen. Sie waren damals dabei, Frau Rehlinger
  und Herr Rauber. Wir haben entsprechend unseren Verabredungen gehandelt. Das zum
  1. Juli dieses Jahres in Kraft getretene Außenhandelsschutzinstrument der EU schützt
  unsere Stahlindustrie vor unfairen Wettbewerbsbedingungen und dem Importdruck internationaler
  Wettbewerber, insbesondere solcher, die sich nicht an die Regeln halten. Es war
  nicht einfach, das zu erreichen, denn angesichts berechtigter Interessen anderer
  Mitgliedstaaten der Europäischen Union war es ein wichtiger Kompromiss. Es gibt
  eben nicht überall Stahl, verarbeitende und Stahl erzeugende Industrie. Wir unterstützen
  in Europa eine praxistaugliche Reform des CBAM , also des Grenzausgleichs, und des
  europäischen Emissionshandels. Aber erlauben Sie mir an dieser Stelle auch den Hinweis:
  Wir haben mit ETS ein funktionsfähiges System als marktwirtschaftliches Instrument
  geschaffen. Wir wollen und wir müssen es erhalten, damit Unternehmen wie dieses
  eine Zukunft haben und nicht in die alten Zeiten zurückfallen. Meine Damen und Herren,
  wir haben die Unternehmen in Deutschland bereits bei den sehr hohen Energiekosten
  erheblich entlastet, und wir wollen mit einer ganzen Reihe weiterer Gesetzgebungsvorhaben
  die Effizienz im System erhöhen. Ja, Herr Maagh, Ihr Hinweis ist angekommen. Ich
  teile diese Einschätzung: Die Systemkosten im Stromnetz müssen sinken, und auch
  die Netzentgelte und die Stromkosten insgesamt dürfen nicht auf diesem Niveau bleiben.
  Industrielle Projekte wie die heute vorgestellten sind auf große Mengen Strom und
  vor allen Dingen auf ständig verfügbaren Strom angewiesen. Deshalb haben wir entschieden,
  dass in den kommenden Jahren auch neue Gaskraftwerke gebaut werden, jedenfalls so
  lange, wie wir nicht über ausreichende Speichermöglichkeiten für die erneuerbaren
  Energien verfügen. Diese Gaskraftwerke liefern Strom, wenn kein Wind weht und die
  Sonne nicht scheint. Gleichzeitig ist es wichtig, dass Großvorhaben ihren Strombezug
  flexibilisieren, damit sie von den schon heute günstigen Stromkosten profitieren,
  wenn viele erneuerbare Energien im Netz sind. Mit dem sogenannten Industrial Accelerator
  Act wollen wir Sie wiederum auf europäischer Ebene unterstützen. Es geht dabei nicht
  darum, uns vor Wettbewerb zu schützen. Ohne Wettbewerb gibt es keine Innovation.
  Wettbewerb brauchen wir, wenn sich alle an die Bedingungen halten, nicht zu fürchten.
  Es geht um ein „ level playing field “ und damit um die Rahmenbedingungen, die fairen
  Wettbewerb überhaupt erst ermöglichen. Meine Damen und Herren, Power4Steel sichert
  hochwertigen Stahl „made in Germany“. Ich bin auch sehr froh, dass das Projekt Y-SIC
  zustande kommt. Vor einem Jahr, zu meinem Antrittsbesuch hier im Saarland, habe
  ich von einer Stahlstrategie gesprochen. Sie sollte aus Wettbewerbsfähigkeit und
  Innovation bestehen. Ich habe die Diskussion, Frau Rehlinger, Herr Wirtschaftsminister,
  im Landeskabinett zu diesem Thema in sehr guter Erinnerung. Aber was heißt das,
  Strategie? Das heißt einerseits Entlastung bei Stromkosten, weniger Bürokratie und
  Förderung bei CO 2 -Projekten. Andererseits brauchen wir auch Projekte, mit denen
  wir nach vorn kommen, mit denen wir innovativer sind als andere Standorte, auch
  beim Thema Stahl, und mit denen wir die kritische Rohstoffversorgung absichern können.
  Meine Damen und Herren, das neue Projekt zielt genau auf die Versorgung des Hightech-Standorts
  und dieses Sektors mit sogenanntem – Sie haben es vorgestellt – Siliziumkarbid.
  Ich erinnere mich noch sehr genau: Peter Maagh, als Teil Ihres Vorstandes, hatte
  mich auf diese Technologie angesprochen, und wir, Herr Maagh, sind im Gespräch geblieben,
  um ein Projekt dann auch Wirklichkeit werden zu lassen. Siliziumkarbid wird als
  Grundmaterial – Sie haben es in dem eindrucksvollen Film eben alle gesehen, meine
  Damen und Herren – in der Hochleistungselektronik verwendet, und dann kann es in
  nahezu allen Zukunftstechnologien eine Rolle spielen, von erneuerbaren Energien
  über Clean Tech bis zu KI und Robotik. Es gibt heute in Europa keine nennenswerten
  Produktionskapazitäten für diesen Rohstoff. Unsere Industrie ist, wie bei so vielen
  anderen kritischen Rohstoffen leider auch, von Importen, vor allem aus dem asiatischen
  Raum und insbesondere aus China, abhängig. Das sind Abhängigkeiten, die wir uns
  auf Dauer in Deutschland nicht leisten können. Die Bundesregierung hilft deshalb,
  dass unsere Wirtschaft mit kritischen Rohstoffen besser versorgt wird. Das ist eine
  Schlüsselfrage für unsere industrielle und technologische Souveränität. Meine Damen
  und Herren, wir brauchen Souveränität nicht nur in der Sicherheitspolitik, in der
  Verteidigungspolitik, sondern auch in der Versorgung mit Rohstoffen und mit industriellen
  Kompetenzen. Ich gebe offen zu: Als der französische Staatspräsident Emmanuel Macron
  in seiner berühmten Rede vor der Universität Sorbonne vor nunmehr neun Jahren diesen
  Begriff für ganz Europa zum ersten Mal verwendet hat, war ich mir nicht sicher,
  ob dies der richtige Begriff ist. Aber angesichts der Zeitläufe, angesichts der
  Ereignisse der letzten Jahre, angesichts des Krieges in der Ukraine, angesichts
  der Konflikte in der Handelspolitik mit den USA , angesichts der sehr selbstbewussten
  Industriepolitik einer Volksrepublik China ist genau dies der Schlüsselbegriff für
  unsere Zukunft. Wir brauchen europäische Souveränität, und zwar auch in der Versorgung
  unserer Lieferbeziehungen, auch in der Versorgung mit kritischen Rohstoffen. Wir
  fördern und wir unterstützen dies, wo immer wir das können. Wir tun dies alles im
  engen Schulterschluss mit der Industrie. Aber, meine Damen und Herren, die Stahl-
  Holding -Saar erweitert mit genau diesem Projekt zugleich ihre industrielle Kompetenz
  in den Technologiesektor hinein. Wenn das gelingt, dann kann das für Ihr Unternehmen
  eine neue strategische Perspektive eröffnen, auch mit weniger Abhängigkeit vom zyklischen
  Stahlgeschäft. So eröffnen Sie sich hier große neue Chancen. Sie würden damit exemplarisch
  zeigen, wie sich ein traditionsreicher Industriestandort aus eigener Stärke heraus
  modernisieren, neue Technologien erschließen und so seine Wettbewerbsfähigkeit für
  die kommenden Jahre und Jahrzehnte sichern kann. Was Sie sich hier vornehmen, meine
  Damen und Herren, ist ein weiterer Beleg für eine Erkenntnis, die uns allen Mut
  machen sollte: Die Transformation in unserer Wirtschaft findet heute statt, während
  viele noch überlegen oder gar zweifeln, ob sie überhaupt gelingen kann. Sie findet
  statt. Die Veranstaltung, diese Gelegenheit heute ist ein Beleg dafür, mit welcher
  Zuversicht und mit welchem Mut sie in Deutschland stattfindet. Genau deshalb, meine
  Damen und Herren, danke, dass Sie uns das zeigen, danke, dass wir alle sagen können:
  Deutschland kann das. Ich will, dass Sie sich auch von der Politik der Bundesregierung
  hinreichend unterstützt fühlen. Ich will den Weg fortsetzen, der Stück für Stück
  auch die preisliche Wettbewerbsfähigkeit unseres Landes stärkt. Die Abschreibungsmöglichkeiten,
  die Körperschaftsteuern - Sie kennen die Entscheidungen, die wir schon im letzten
  Jahr getroffen haben. Die Entscheidungen zur Stabilisierung und mittelfristigen
  Senkung der Sozialbeiträge und damit auch der Arbeitskosten sind Teil unserer Vorhaben
  für die nächsten Wochen, Monate und vielleicht Jahre. Schließlich geht es um den
  Rückbau von Bürokratie und die Digitalisierung der Verwaltung. Meine Damen und Herren,
  wir sind in kurzer Zeit viel weiter gekommen, als es oft wahrgenommen wird. Lassen
  Sie mich Julia Jäkel zitieren, die zusammen mit Thomas de Maizière, Peer Steinbrück
  und Andreas Voßkuhle eine Kommission zur Staatsmodernisierung geleitet hat, die
  sehr konkrete Vorschläge gemacht hat. Sie sagte vor wenigen Tagen: „Wir erleben
  gerade den größten Modernisierungsschub unserer staatlichen Strukturen seit Dekaden.“
  Sie hat recht. Alles das werden wir und müssen wir weiterführen. Wenn uns das gelingt,
  dann werden sich die Erfolge auch nach und nach zeigen. Sie haben begonnen, sie
  zu zeigen, hier am Standort. Lassen Sie mich abschließend sagen, meine Damen und
  Herren: Ich war heute Morgen bei der Feierstunde zum 75-jährigen Geburtstag unseres
  Bundesverfassungsgerichts. Der Bundespräsident und der Präsident des Bundesverfassungsgerichts
  haben eindrucksvolle Reden gehalten. Wir sind heute Nachmittag hier in Dillingen
  zusammen zur Eröffnung eines hochmodernen, neuen, innovativen Standortes in einer
  traditionsreichen Industrie. Dies zusammengefasst: Am Morgen die Feier für unser
  jüngstes Organ, für das jüngste Kind unserer staatlichen Ordnung, 1951 erst gegründet,
  und heute Nachmittag hier, am ältesten Industriestandort in großen Teilen Europas.
  Dies zeigt, was wir können, wie stabil auch unsere Demokratie ist, wenn wir sie
  gemeinsam gegen ihre Feinde und Gegner verteidigen. Es zeigt aber auch, welche Chancen
  wir in Deutschland haben, wenn wir zusammenwirken: Arbeitgeber und Arbeitnehmer
  und Gewerkschaften, Politik und Wirtschaft insgesamt, aber auch die gesellschaftlichen
  Vertretungen in allen Bereichen, die Parteien, die Kirchen, die Verbände, die Vereine.
  Wenn wir zusammenhalten, wenn wir das Richtige aus den Herausforderungen machen,
  vor denen wir stehen, dann werden unsere Kinder in einigen Jahren aus der Rückschau
  sagen können: Sie standen vor großen Herausforderungen, und es war verdammt nicht
  leicht. Aber sie haben die richtigen Entscheidungen getroffen zur Stärkung unserer
  Demokratie, zur Stärkung unseres Wettbewerbs, zum Erhalt von vielen Hunderttausend
  Arbeitsplätzen in Deutschland, gerade auch in der Industrie. – Lassen Sie uns gemeinsam
  genau daran arbeiten.'
