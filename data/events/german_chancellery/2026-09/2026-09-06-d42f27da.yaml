title: Bundesweiter Warntag 2026 Bund, Länder und Kommunen testen Warnsysteme
text: 'Zum Bundesweiten Warntag erproben Bund, Länder und Kommunen gemeinsamen ihre
  Warnsysteme. Foto: Bundesamt für Bevölkerungsschutz und Katastrophenhilfe Der Bundesweite
  Warntag findet jedes Jahr am zweiten Donnerstag im September statt. Dabei sollen
  die verschiedenen Warnsysteme in Deutschland getestet und die Bevölkerung für Warnung
  und Eigenvorsorge sensibilisiert werden. Der Warntag ist damit ein Stresstest für
  die technischen Systeme. Durch ihn können Verbesserungsmöglichkeiten identifiziert
  werden. Übergeordnet geht es auch um das Thema Zivilschutz – weswegen der Bund die
  Warnung betreibt. Denn eine Warnung kann immer nur so gut sein wie die Reaktion
  auf diese. Warnung: Gegen 11 Uhr löst das Bundesamt für Bevölkerungsschutz und Katastrophenhilfe
  (BBK) eine Probewarnung aus. Das geschieht über das Modulare Warnsystem des Bundes.
  Diese Warnung wird weitergeleitet: an angeschlossene Warnmultiplikatoren wie Rundfunk-
  und Fernsehsender, digitale Anzeigetafeln, Warn- Apps und Cell Broadcast . Auf diese
  Weise können Millionen Menschen in Deutschland erreicht werden. Ergänzend dazu erproben
  viele Kommunen eigene Warnmittel wie Sirenen oder Lautsprecherwagen. Entwarnung:
  Gegen 11:45 Uhr erfolgt dann eine bundesweite Entwarnung. Es gibt zwei technische
  Möglichkeiten, via Handy gewarnt zu werden: Einerseits sind das Warn- Apps wie NINA,
  andererseits ist das der Mobilfunkdienst Cell Broadcast . Im Hinblick auf die Apps
  ist es wichtig, sie herunterzuladen beziehungsweise zu installieren. Hinsichtlich
  der Warn- App NINA ist es außerdem wichtig, einen Ort zu abonnieren, für den man
  gewarnt werden möchte. Zudem sollte das Handy am Warntag nicht stummgeschaltet sein.
  Um Cell-Broadcast -Warnungen zu erhalten, sollte das Handy eingeschaltet sein, das
  jeweils aktuellste Betriebssystem haben und sich nicht im Flugmodus befinden. Wenn
  es dennoch nicht geklappt hat mit der Warnung am Warntag, kann das verschiedene
  Gründe haben. Manche Handys sind aufgrund ihres Alters nicht mehr in der Lage, Cell-Broadcast
  -Warnungen zu empfangen. Deswegen setzt Deutschland auf den sogenannten Warnmittel-Mix.
  Fällt ein Warnmittel aus beziehungsweise können Menschen über dieses nicht erreicht
  werden, gibt es Warnungen etwa über Radio, Fernsehen und Sirenen. Ja, direkt um
  11 Uhr am 10. September 2026 wird eine Online-Umfrage gestartet. Hier können Bürgerinnen
  und Bürger ihre Erfahrungen mitteilen, die sie mit den verschiedenen Warnkanälen
  gemacht haben. Diese Ergebnisse fließen dann zusammen mit der technischen Auswertung
  in die Weiterentwicklung des Warnsystems ein. Die Teilnahme ist bis zum 17. September
  2026 möglich. Weitere Informationen finden Sie beim Bundesamt für Bevölkerungsschutz
  und Katastrophenhilfe.'
