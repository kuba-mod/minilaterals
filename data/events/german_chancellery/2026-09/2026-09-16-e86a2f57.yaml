  den Vorstoß für eine besonders enge Partnerschaft mit Kanada. Sie ist auch offen,
  neue Modelle zu diskutieren, die dem besonderen Stellenwert der Beziehungen Rechnung
  tragen. Aber ich denke, wir sollten über den Begriff auch noch einmal nachdenken.
  Das am Ende habe ich jetzt nicht ganz verstanden. Heißt das, Sie sind offen dafür,
  dass man auch diesen Vorschlag diskutiert? Die Beziehungen zu Kanada haben sich
  in den letzten Monaten sehr intensiv entwickelt, auch zwischen Deutschland und Kanada.
  Kanada ist ein besonders enger Partner für Europa. Deswegen sind wir offen, neue
  Modelle einer Partnerschaft zu diskutieren, und diese Modelle sollen dem besonderen
  Stellenwert dieser Beziehungen Rechnung tragen. Aber die Begrifflichkeit, die Überschrift,
  die damit verbunden ist, sollten wir noch einmal neu bedenken. Herr Kornelius, ich
  hätte gerne generell gefragt, was denn Ihr Fazit nach der Rede zur Lage der Union
  ist. Bei welchen Vorschlägen gehen Sie mit, und wo sehen Sie noch Handlungsbedarf?
  Der Schwerpunkt der Rede war ja die Wettbewerbsfähigkeit der EU und vor allem des
  Investitionsstandortes. Das ist das prioritäre Ziel des Bundeskanzlers. Insofern
  sind wir da mit der Kommissionspräsidentin absolut deckungsgleich und unterstützen
  ihre Vorstöße. Die politische Priorität für die EU ist im kommenden Jahr ganz klar
  die Wettbewerbsfähigkeit, dazu der Bürokratieabbau, der auch ein europäischer Bürokratieabbau
  sein muss, und natürlich das gemeinsame politische Ziel, einen gemeinsamen europäischen
  Haushalt bis zum Ende des Jahres aufzustellen. Dann habe ich auch noch eine Nachfrage
  zu einem konkreten Thema: Unterstützt die Bundesregierung den angedachten Pakt gegen
