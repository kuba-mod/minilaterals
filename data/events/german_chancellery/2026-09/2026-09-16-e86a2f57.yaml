  häufig einmal feststellen, und insofern ist der Vorstoß, die Umsetzung von EU-Richtlinien
  bzw. EU-Maßnahmen entlang der Notwendigkeit und nicht im Sinne eines Überbietungswettbewerbs
  stattfinden zu lassen. Zu einem weiteren Aspekt der Rede: Sie hat auch vorgeschlagen
  oder hat angekündigt, dass die EU jetzt Kindern unter 13 Jahren den Zugang zu Plattformen
  wie Instagram, TikTok etc. verbieten wird. Jugendliche unter 15 Jahren dürfen diese
  sozialen Medien nur noch mit speziellen Konten unter elterlicher Aufsicht nutzen.
  Ich hätte ganz gerne gewusst, was das für die Planung der Bundesregierung bedeutet.
  Wird jetzt in naher Zukunft eine Entscheidung fallen? Was genau wird die Bundesregierung
