  Ende des Jahres ein Sofortprogramm vorlegen möchte. Darin sollen auch Maßnahmen
  enthalten sein, die jetzt sehr schnell umgesetzt werden können, beispielsweise eine
  Öffentlichkeitskampagne oder Ähnliches. Das heißt, wir sind sehr eng an diesem Thema
  dran. Die Experten weisen ja darauf hin, dass die Suchtproblematik nicht bei Kindern
  und Jugendlichen aufhört. Wie sieht es denn mit dem unregulierten Social-Media-Konsum
  bei Erwachsenen aus? Was wollen Sie dagegen tun? Wollen Sie etwas dagegen tun? Wir
  sind jetzt erst einmal sehr froh, dass die Wichtigkeit des Themas bei Kindern und
  Jugendlichen erkannt ist. Es ist noch gar nicht so lange, dass wir in dieser Art
  und Weise darüber reden. Die Ministerin hatte das ja sehr schnell nach Amtsantritt
  aufs Tablett gesetzt. Alles, was sich möglicherweise weiter daraus ergeben kann,
  ist sicher gut und richtig und wird in einem nächsten Schritt besprochen werden.
  Sie erkennen aber schon die Suchtproblematik bei Erwachsenen an? Ich glaube, die
  Forschung ist dazu eindeutig. Ich habe zwei Fragen zum Missbrauch von Smartglasses;
  die erste geht an das BMJV. Da würde mich interessieren, ob Sie im Strafrecht noch
  Schutzlücken sehen, was heimliches Filmen und natürlich auch die Verbreitung von
  Aufnahmen mit solchen Smartglasses angeht, besonders in Kontexten, die vielleicht
  nicht sexueller oder voyeuristischer Natur sind? Das kann ich kurz machen. Ich kann
  sagen: Ja, wir sehen Schutzlücken. Der Schutz, insbesondere vor digitalem Voyeurismus,
  ist uns ein großes Anliegen. Wir haben mit dem Gesetz gegen digitale Gewalt einen
  konkreten Regelungsvorschlag für Nachbesserung, insbesondere bei § 184k, also bei
  den Sexualtatbeständen, vorgelegt. Aber auch jetzt haben wir schon Regelungen, zum
  Beispiel in § 201a, was heimliche Aufnahmen angeht. Der Gesetzentwurf nimmt auch
  Smartglasses gezielt in Bezug. Wenn es jetzt darum geht, ein Verbot von Smartglasses
  oder so zu regeln, dann wären wir im Bereich der Telekommunikationsdienste beim
  Datenschutzgesetz, dem TDDDG. Dafür ist, glaube ich, das BMDS zuständig. Darin gibt
  es auch Straftatbestände im Zusammenhang mit möglichen Gegenständen, die danach
  verboten sind. Aber ja ‑ wir sehen einen gewissen Handlungsbedarf und nehmen diesen
  ganz gezielt im Gesetz gegen digitale Gewalt in Bezug. Ich hätte dazu eine Nachfrage,
  wenn ich darf; die geht wahrscheinlich ans BMI oder BMDS. Die Bundesnetzagentur
  hält Meta-Brillen ja nicht für einen verbotenen Alltagsgegenstand zum heimlichen
  Filmen, weil an der Seite dieses Aufnahmelicht leuchtet. Das gilt aber als unauffällig
  und auch als manipulierbar. Dazu würde mich interessieren, ob Sie genauere Vorgaben
  für notwendig halten, wie solche Aufnahmen sichtbar gemacht werden müssten. Für
  das BMDS kann ich ‑ anschließend an die Ausführungen des Kollegen ‑ sagen, dass
  wir mit Blick auf die bestehende Rechtslage in unserer Zuständigkeit keinen Anlass
  für weitergehende gesetzgeberische Maßnahmen sehen. Es gibt in Deutschland klare
  Regeln zum Datenschutz und Recht am persönlichen Bild; die hatte die Bundesnetzagentur
  schon ausgeführt. Der § 8 des eben genannten TDDDGs eröffnet schon jetzt die Möglichkeit,
  gegen Gegenstände vorzugehen, mit denen Menschen unbemerkt abgehört oder gefilmt
  werden können. § 8 fällt in die Zuständigkeit der Bundesnetzagentur, die den Markt
  auch im Hinblick auf Smartglasses mit integrierten Kameras und Mikrofonen beobachtet
  und bei Bedarf konkrete Untersuchungen durchführt. Die DSGVO regelt den Einsatz
  von Smartglasses mit Blick auf die Verarbeitung von personenbezogenen Daten Dritter.
  Darüber wachen die unabhängigen Datenschutzaufsichtsbehörden der Länder. Eine Frage
  an das AA zu den Razzien, die in der Türkei gegen Vereine und Veranstaltungsorte
  der queeren Community stattgefunden haben; dabei wurden ja auch mehrere Menschen
  festgenommen. Dazu wüsste ich gern: Wie bewertet die Bundesregierung das Vorgehen
  der türkischen Behörden, und wird das Thema auch gegenüber der Türkei angesprochen
  werden? Das kann ich jetzt wirklich sehr kurz machen, weil der Menschenrechtsbeauftragte
  der Bundesregierung sich für die Bundesregierung geäußert hat. Das können Sie auf
  X nachlesen. Entsprechende Fragen, die menschenrechtsbezogene Themen adressieren,
  sind regelmäßig Gegenstand unserer Gespräche. Der türkische Botschafter wurde aber
  bisher nicht einbestellt? Sie kennen das Verfahren, dass wir Dinge in dem entsprechenden
  Zusammenhang verkünden. Ich habe mich das heute nicht selber vorstellen hören. Insofern
  habe ich Ihnen dazu nichts anzukündigen.'
