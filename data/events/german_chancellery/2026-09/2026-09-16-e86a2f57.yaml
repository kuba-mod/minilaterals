  die Umfrageinstitute hätten gar nicht die Ressourcen, so etwas in der Schlagzahl
  durchzuführen: Sie wissen doch auch, dass diese Umfragen normalerweise von Medien
  in Auftrag gegeben werden, die sie dann veröffentlichen, und auch honoriert werden.
  Worauf basiert also Ihre Einschätzung, dass die Institute gar nicht die Ressourcen
  dafür hätten? Ich glaube, die demoskopischen Grundlagen für viele Umfragen ‑ nicht
  für alle Umfragen ‑ könnten durchaus eine nähere Betrachtung vertragen. Die demoskopischen
  Grundlagen für viele dieser Umfragen ‑ nicht für alle ‑ geben es nicht her, dass
