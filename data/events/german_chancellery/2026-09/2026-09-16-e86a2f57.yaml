date: '2026-09-16'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 16. September 2026
text: 'Sprecherinnen und Sprecher •    Staatssekretär Kornelius •    Dr. Rüll (BMF)
  •    Ungrad (BMWE) •    Deschauer (AA) •    Lenz (BMBFSFJ) •    Kirschner (BMJV)
  •    Sänger (BMDS) (Vorsitzende Küfner eröffnet die Pressekonferenz und begrüßt
  StS Kornelius sowie die Sprecherinnen und Sprecher der Ministerien.) Sie haben es
  heute Morgen schon durch die Pressestatements der zuständigen Ministerin und des
  zuständigen Ministers gehört: Heute wurde im Kabinett der Entwurf eines Maßnahmenplanes,
  eines Zehnpunkteplanes für einen besseren Schutz vor islamistischem Terrorismus
  verabschiedet. Mit diesem Plan bringen wir eine Reihe sehr konkreter Ma ß nahmen
  zur Stärkung der inneren Sicherheit und zum besseren Schutz der Bevölkerung vor
  gewaltbereiten Islamisten auf den Weg. Der Anschlag in Berlin zum CSD hat uns erneut
  auf tragische Weise vor Augen gef ü hrt, wie hoch die Bedrohung durch den islamistischen
  Terror in Deutschland ist. Die Bundesregierung hat in den letzten Monaten bereits
  zahlreiche Ma ß nahmen f ü r die innere Sicherheit beschlossen. Darauf baut der
  Zehnpunkteplan auf. Mit ihm wollen wir die innere Sicherheit stärken und den Schutz
  vor Terror und Extremismus weiter verbessern. Terrorismus wird konsequenter bestraft.
  Islamistische Gef ä hrder werden wirksamer ü berwacht. Die Finanzierung dieses Terrorismus
  wird bek ä mpft und die Radikalisierung effektiv verhindert. Der Gewalt der Terroristen
  wird also mit der Kraft des Rechtsstaates begegnet. Die Freiheit und die Sicherheit
  der Bev ö lkerung werden dadurch auch gest ä rkt und gesch ü tzt. Die Details des
  Planes haben Sie heute Morgen schon erfahren. Meine Frage bezieht sich auf die Pressekonferenz
  heute Morgen des Bundesinnenministers zum Thema des Schutzes vor dem islamistischen
  Terrorismus. Warum sollte man das auf die Muslime begrenzen, obwohl es hier in Deutschland
  viele Gruppen gibt, die gegen die Bundesrepublik sind, aber mit dem Islam nichts
  zu tun haben? Das bekräftigt den Eindruck, Muslime seien Terroristen. Die Gleichsetzung
  von Muslimen mit Terrorismus ist nicht richtig. Die Bundesregierung tut das nicht.
  Selbstverständlich bekämpft die Bundesregierung Terrorismus und Extremismus in allen
  Formen. In dem konkreten Fall ging es um islamistischen Terrorismus. Auch dieser
  ist eine Form des Terrorismus, die wir kennen und verstärkt beobachten und die in
  diesem Fall nun konkret adressiert wurde. Aber es gibt keine Beweise. Seit dem Anschlag
  auf dem Christopher Street Day in Berlin ist die Hetze gegen Muslime noch weiter
  und weiter aktiv geworden. Herr Kornelius, ich habe eine Frage zu den Spritpreisen.
  Können Sie den Zeitrahmen eingrenzen, innerhalb dessen mit dem Beginn der vom Kanzler
  angekündigten Entlastungen zu rechnen ist? Der Bundeskanzler hat sich gestern zahlreich
  zu dem Thema geäußert. Andere Kabinettsmitglieder haben sich ebenfalls geäußert.
  Wir haben Äußerungen aus den Ländern. Die hohen Preise belasten die Wirtschaft.
  Sie belasten die Bürgerinnen und Bürger. Sie belasten Freiberufler, Ehrenamtliche,
  Pendler und Familien. Das ist der Bundesregierung durchaus bewusst. Deswegen hat
  der Bundeskanzler gestern auf dem Unternehmertag gesagt, dass viele Menschen, die
  täglich das Auto brauchen, nun die Belastungsgrenze spüren und dass sie für diese
  Menschen erreicht ist. Andere Kabinettsmitglieder haben sich in ähnlicher Form geäußert.
  Sie sehen daraus, dass die Bundesregierung den Handlungsbedarf erkannt hat und dass
  sie handeln wird. Momentan wird intern beraten, welche Lösungen nun greifen können
  und welche Vorschläge dazu gemacht werden können. Diese Beratungen dauern an. Sie
  werden sehr bald abgeschlossen sein. Wir werden Sie dann sofort informieren. Wir
  müssen unmissverständlich sagen, dass die hohen Preise im Wesentlichen auch durch
  die Unsicherheiten an den Märkten ausgelöst wurden, nämlich infolge der kriegerischen
  Ereignisse am Persischen Golf. Das muss einschränkend gesagt werden. Wir sehen also
  Markteffekte, die stärker wirken als die Steuerpolitik. Die Nahostpolitik beeinflusst
  den Rohölpreis. Gleichzeitig bleiben die Produktionskapazitäten von Raffinerien
  begrenzt. Diese knappen Verarbeitungskapazitäten halten die Spritpreise hoch. In
  diesen Parametern sucht die Bundesregierung nun nach einer sinnvollen Lösung. Dies
  geschieht unter allerhöchstem Druck. Sie können sich sicher sein, dass den Worten
  sehr schnell Taten folgen werden. Woran genau hakt es noch? Haben Sie schon spezifische
  Instrumente im Sinn? Der Bundeskanzler hat gestern einige Parameter genannt, auch
  nach dem Besuch des irakischen Premierministers. Es hakt nicht. Es ist eine klassische
  Aufgabe der Politik, die verschiedenen Lösungswege und vor allem die Finanzierung
  ‑ das ist auch eine Frage der Gegenfinanzierung ‑ sowie rechtliche Rahmenbedingungen
  und für einige Vorschläge europarechtliche Rahmenbedingungen zu prüfen. Diese Prüfung
  geht nicht über Nacht, aber sie geht vielleicht über Nacht und über Tag und dann
  noch einmal eine Nacht und vielleicht noch einen Tag, aber sie soll schnell gehen.
  Herr Kornelius, ich habe eine Nachfrage zum Zeitpunkt. Herr Frei, der Fraktionsvorsitzende
  der Union, hat gesagt, die Maßnahmen müssten auf jeden Fall zum 1. Oktober greifen.
  Ist das auch der Zeitrahmen, den sich die Bundesregierung gesetzt hat? Die Bundesregierung
  hat sich keinen festen Zeitrahmen gesetzt. Sie stellt sich eine schnellstmögliche
  Entscheidung und dann auch eine schnellstmögliche Umsetzung vor. Ich nenne jetzt
  bewusst keinen Zeitrahmen. Denn ich möchte jetzt keine falschen Erwartungen wecken.
  Es muss wirklich wasserdicht geprüft werden, welche Maßnahmen möglich sind. Diese
  werden dann schnell umgesetzt. Herr Rüll, ist das Finanzministerium offen für eine
  Mehrwertsteuersenkung? Dieser Vorschlag wurde ja neu in die Debatte eingebracht.
  Wäre das ein Weg, um die Verbraucher zu entlasten? Ich kann mich zunächst den Ausführungen
  des Regierungssprechers anschließen und sagen, dass auch Bundesfinanzminister Lars
  Klingbeil immer wieder deutlich gemacht hat, dass wir die Bürgerinnen und Bürger
  genauso wie die Unternehmen, die die stark gestiegenen Kraftstoffpreise gerade hart
  treffen, entlasten wollen. Darüber, wie diese Unterstützung genau aussieht und wie
  sie finanziert werden kann, wird innerhalb der Bundesregierung und mit den Ländern
  gerade gesprochen; auch das hat der Regierungssprecher schon gesagt. Zu den Details
  kann ich an dieser Stelle noch keine Stellung nehmen. Im Zusammenhang mit einer
  möglichen Mehrwertsteuersenkung wurde auch von Summen in Höhe von vier bis sieben
  Milliarden Euro gesprochen. Diese Zahlen stammen vom Kieler Institut für Weltwirtschaft,
  veröffentlicht unter anderem von REUTERS. Teilen Sie das? Wie soll über eine Mehrwertsteuersenkung
  überhaupt Treffsicherheit erreicht werden? Diese Frage geht auch an das Wirtschaftsministerium.
  Dieser Punkt war Ihnen bzw. der Ministerin in den letzten Tagen ja sehr wichtig.
  Ich kann nur meine Worte von eben wiederholen. Zu den einzelnen Vorschlägen kann
  ich mich noch nicht äußern. Dazu zählt auch eine Antwort auf Ihre Frage, was eventuelle
  Mehrwertsteuerausfälle angeht. Ich möchte dem Ergebnis der Gespräche, die wir innerhalb
  der Bundesregierung führen, hier auch nicht vorgreifen. In der Tat hat sich die
  Ministerin immer dafür ausgesprochen, dass die Maßnahmen ankommen. Aber das ist
  ja selbstverständlich. Das wäre auch Sinn und Zweck von Maßnahmen, die die Bundesregierung
  eventuell treffen würde. Kann ich davon ausgehen, dass die Maßnahmen, die man jetzt
  ausdiskutiert, durch den Bundestag und den Bundesrat gehen müssen? Das ist klar.
  Aber ist dann überhaupt ‑ das wäre die Schlussfolgerung daraus ‑ eine Regelung bis
  zum 1. Oktober möglich? Es gab ja auch zuletzt, als wir schon einmal auf gestiegene
  Energiepreise reagiert haben, eine sehr zügige Umsetzung. Aber ich werde jetzt,
  wie gesagt, nicht auf Zieldaten reagieren, die möglicherweise an Fristen scheitern
  könnten, oder Ähnliches. Es geht um eine schnellstmögliche Umsetzung. Was die Berechnungsgröße
  angeht, so hängt das von vielen Parametern ab. Es ist auch eine Frage der Verbrauchsmengen.
  Wir werden durch die gestiegenen Spritpreise sicherlich auch einen Rückgang des
  Verkehrs sehen. Das hat wiederum Auswirkungen auf die Steuerfragen. Ich habe eine
  Frage an das Bundesfinanzministerium. Immer wieder in der Diskussion ist auch ein
  Direktüberweisungsmechanismus, der ja entwickelt wurde und auch schon weiter gediehen
  ist. Können Sie uns ein Update dazu geben, inwiefern und ab wann dieser Mechanismus
  zur Verfügung steht? Dazu hat sich Herr Kall hier bereits am Montag geäußert. Aber
  ich kann gern noch einmal den aktuellen Stand erläutern. Der Direktauszahlungsmechanismus
  wurde bereits technisch aufgebaut. Er kann zum jetzigen Stand Auszahlungen an Bürgerinnen
  und Bürger pauschal pro Kopf ermöglichen. Um aber wirklich zum Einsatz zu kommen,
  braucht es noch ein sogenanntes Leistungsgesetz. Dieses Leistungsgesetz müsste insbesondere
  den genauen Anwendungsfall und die Höhe des auszuzahlenden Betrages beschreiben.
  Auch das hat mein Kollege schon am Montag erzählt. Die Auszahlung setzt voraus,
  dass wir die Kontoverbindungen der Bürgerinnen und Bürger haben, also die IBAN.
  Dies ist momentan für etwa 19 Prozent der Bevölkerung der Fall. Es ist Bürgerinnen
  und Bürgern möglich, ihre IBAN eigeninitiativ dem Bundeszentralamt für Steuern zu
  melden. Das geht auf drei verschiedenen Wegen. Der erste Weg führt über ELSTER.
  Das ist das Portal, über das Sie auch Ihre Steuererklärungen abgeben können. Der
  zweite Weg ist eine extra eingerichtete App. Sie heißt BZSt IBAN+. Drittens gibt
  es die Möglichkeit, die IBAN über die Bank mitzuteilen, indem man seine Bank damit
  beauftragt, dem BZSt die IBAN mitzuteilen. Herr Kornelius, welche Priorität genießt
  die Wahrung der Profitinteressen der Mineralölkonzerne für den Kanzler? Die Mineralölkonzerne
  und vor allem die Raffinerien in Deutschland sind essenziell auch für die Versorgungssicherheit.
  Die Profitabilität ist Voraussetzung dafür, dass diese Betriebe arbeiten können.
  Insofern ist das ein rein marktwirtschaftlicher Mechanismus, der hier wirkt, und
  unterliegt den Gesetzen, die hier bei uns im Lande gelten. Es gibt ja einen Unterschied
  zwischen „keinen Verlust machen“ und Profitmaximierung. Das ist eine ideologische
  Grenze, die Sie jetzt ziehen. Ich kann sie nicht mitziehen. Das ist ‑ ‑ nicht rechtlich
  vorgegeben. Insofern geht es jetzt nicht um eine Bewertung von Profiten, sondern
  es geht darum, auch die Marktstabilität durch Produktionskapazitäten zu ermöglichen.
  Herr Kornelius, werden die Maßnahmen, die Sie jetzt diskutieren, zeitlich begrenzt
  sein, oder werden zeitlich unbegrenzte Maßnahmen ins Visier genommen? Darüber ist
  keine Entscheidung getroffen worden. Deswegen möchte ich auch keine Aussage dazu
  treffen. Die Maßnahmen sind im Idealfall zeitlich begrenzt, weil das Problem hoffentlich
  zeitlich begrenzt sein wird. Ich habe eine Nachfrage an Herrn Rüll. Vielleicht können
  Sie erklären, wie es kommt, dass bei dem Auszahlungsmechanismus jetzt erst 19 Prozent
  der Menschen erreicht werden. Das verwundert viele, weil das Projekt schon von der
  alten Regierung angegangen wurde und weil die meisten Steuern zahlen und deswegen
  vermuten, dass die Finanzämter und der Staat eigentlich alle nötigen Daten haben
  sollten. Warum kann sich der Staat für diesen Auszahlungsmechanismus nicht die Daten
  von anderen Stellen besorgen? Nach meinem Verständnis liegt es daran, dass wir die
  Klarheit haben möchten, dass das Auszahlungskonto auch genau bestimmt ist. Deshalb
  braucht es diesen Schritt in Eigeninitiative. Wir haben dafür mehrere Wege eröffnet,
  um es so leicht wie möglich zu gestalten. Wir kommunizieren auch sowohl auf der
  Seite des Bundesfinanzministeriums als auch des Bundeszentralamts für Steuern über
  diese Möglichkeit und machen auch immer wieder darauf aufmerksam, zuletzt zum Beispiel
  im Rahmen der Einführung des antragslosen Kindergeldes. Herr Kornelius, was ist
  denn aus der Aussage des Kanzlers geworden, dass man einen Ölpreis von 100 Dollar
  nicht wegsubventionieren könne? Der Bundeskanzler beobachtet den Ölpreis und sieht
  wie alle Mitglieder der Bundesregierung, dass der Ölpreis auch von geopolitischen
  Schwankungen abhängig ist. Ich habe eben gesagt, dass wir feststellen müssen, dass
  der hohe Preis im Wesentlichen von der Unsicherheit der Märkte ausgelöst wird, dass
  es die kriegerischen Ereignisse sind, auf die wir keinen Einfluss haben. Das ist
  die Aussage des Bundeskanzlers. Anknüpfend an das Zitat, das der Kollege eben gebracht
  hat: Wäre denn die Festlegung eines Höchstpreises für Mineralölprodukte ein Wegsubventionieren,
  oder ist das nicht eine ganz andere Maßnahme? Ich will jetzt nicht über den Charakter
  der Maßnahmen diskutieren. Die Einordnung möchte ich Ihnen überlassen. Aber wir
  haben ja verschiedene Maßnahmen, die momentan diskutiert werden. Die Direktauszahlung
  war eine davon. Die Übergewinnsteuer ist eine andere. Sie kennen die Debatte um
  Tankrabatt oder -deckel. Die Direktauszahlung habe ich genannt. Noch einmal: Es
  gibt viele Maßnahmen. Ihre Praktikabilität und Machbarkeit hängen von vielen auch
  sachlichen Faktoren ab, die momentan geprüft werden. Darf ich daraus schließen,
  dass die Festlegung eines Höchstpreises für Mineralölprodukte in den Tankstellen,
  wie es in anderen europäischen Ländern ja gemacht wird, zu den Optionen gehört,
  die die Bundesregierung diskutiert? Die Erfahrungen der europäischen Nachbarn fließen
  in die Entscheidungsfindung sicherlich mit ein. Ich habe noch eine Nachfrage an
  das Finanzministerium: Inwiefern verfolgt der Vizekanzler und Finanzminister sein
  Ziel der Einführung einer europäischen Übergewinnsteuer weiter? Können Sie uns dazu
  einen neuen Sachstand geben? Als neuesten Sachstand kann ich Sie darüber informieren,
  dass am Freitag eine informelle Sitzung des ECOFIN-Rates stattfinden wird. Es handelt
  sich um ein Treffen der europäischen Finanzministerinnen und Finanzminister. Im
  Rahmen dieses Treffens wird auch die Übergewinnsteuer ein Thema sein. Es ist dann
  Aufgabe der Europäischen Kommission, einen Vorschlag zur konkreten Ausgestaltung
  einer Übergewinnsteuer auszuarbeiten. Ansonsten hat sich Bundesfinanzminister Lars
  Klingbeil auch erst gestern dazu geäußert. Herr Kornelius, es gibt in diesen Tagen
  aktuell verschiedene Berichte über Äußerungen von Medienstaatsminister Weimer, wonach
  er unter anderem eine Zusammenlegung oder Abschaffung von ARD-Anstalten und die
  Privatisierung des ZDF ins Spiel gebracht haben soll. Mich würde interessieren,
  wie die Bundesregierung und wie der Bundeskanzler solche Überlegungen bewertet.
  Sie nehmen Bezug auf Berichte aus einer nicht öffentlichen Veranstaltung, die wir
  nicht kommentieren, weil es eine nicht öffentliche Veranstaltung ist und insofern
  jetzt eine Kommentierung von Berichten von unserer Seite nicht möglich ist. Ich
  kann Ihnen aber grundsätzlich sagen, dass der Bundesregierung ein funktionierender
  und akzeptierter öffentlich-rechtlicher Rundfunk am Herzen liegt, dass dieser eine
  der tragenden Säulen der dualen Medienordnung in Deutschland ist und dass die vielfältige
  Berichterstattung zentral für die demokratische Meinungsbildung ist. In diesem Zusammenhang
  noch weiter gefragt: Hält die Bundesregierung es überhaupt für denkbar, in die Rundfunkhoheit
  der Länder in diesem Zusammenhang einzugreifen? Sie wissen ja, dass die Rundfunkfinanzierungsordnung
  in der Gesetzgebungskompetenz der Länder liegt. Dort liegt sie aus gutem Grund.
  Daran werden wir auch nichts ändern. Beinhaltet die eben noch einmal von Ihnen zum
  Ausdruck gebrachte hohe Wertschätzung der Bundesregierung für ein öffentlich-rechtliches
  Rundfunksystem, dass es mehr als ein Unternehmen öffentlich-rechtlicher Natur geben
  muss, wobei ich jetzt die ARD, obwohl sie ein Senderverbund ist, als ein Unternehmen
  sehen würde? Basiert also die hohe Wertschätzung darauf, dass es nicht nur ein generelles
  öffentlich-rechtliches Unternehmen, sondern auch dabei eine Art konkurrierende Präsenz
  verschiedener Anstalten gibt? Ich habe davon gesprochen, dass die vielfältige Berichterstattung
  zentral sei. Das ist die Aussage, die ich getroffen habe. Ich habe aber keine Aussage
  über die Zahl der Rundfunkanstalten getroffen, weil es mir auch nicht obliegt, darüber
  zu urteilen und hier Positionen der Bundesregierung zu vertreten. Es geht allerdings
  darum, dass man das Ganze erstens auskömmlich finanzieren können muss und zweitens
  auch, dass in der Bevölkerung weiterhin eine Akzeptanz für das System erhalten bleibt.
  Sieht die Bundesregierung diese Akzeptanz bei der Dualität von ARD und ZDF für audiovisuelle
  Medien im Wesentlichen noch gegeben? Die Bundesregierung betreibt jetzt hier keine
  Fernsehkritik. Können Sie kurz erklären, wie sich die Pläne von Herrn Weimer, wenn
  auch in nicht öffentlichen Aussagen, von den AfD-Plänen unterscheidet? Die AfD fordert
  auch seit 2016 schon die Privatisierung dieser Anstalten. Da ich keine Weimer-Pläne
  kenne, kann ich sie nicht vergleichen. Ich kommentiere auch nicht die AfD-Vorhaben.
  Es ist jetzt hier nicht die Rolle des Regierungssprechers, die Wahlprogramme der
  AfD durchzudeklinieren. Aber wir sprechen ja gerade seit Wochen von Demokratie zersetzenden
  Parteien und ihren Wahlerfolgen. Jetzt schaltet sich ein Mitglied der Bundesregierung
  mit Forderungen ein, die man in Sachen Feindschaft gegenüber öffentlich-rechtlichen
  Anstalten bisher von der AfD kennt. Nein, das ist ein unlauterer Vergleich, den
  ich jetzt zurückweise. Ich glaube, dass die Vorhaben in der mitteldeutschen Medienlandschaft
  ein wirkliches juristisches und kostspieliges Chaos verursachen würden. Solch ein
  Vorhaben, wie es dabei geplant wäre, wird kein einziges Problem lösen. Meine Frage
  ist zum Thema der Europäischen Zentralbank. Ich weiß jetzt nicht, wer von Ihnen
  dazu sprechfähig ist. Es gibt einen Vorstoß von Frankreich, dass es den niederländischen
  Kandidaten Knot unterstützen würde, aber dafür den Posten des Chefvolkswirts beansprucht,
  der ja auch im Interesse Deutschlands liegt, wenn ich es richtig verfolgt habe.
  Ich wollte wissen, ob die Bundesregierung darüber informiert ist, ob sie einverstanden
  ist oder ob sie eigene Pläne hat. Mir ist ein Vorstoß Frankreichs nicht bekannt,
  was aber auch an mir liegen könnte. Die Sensibilität dieser Fragen gebietet es,
  dass wir darauf nicht öffentlich reagieren, sollte denn ein solcher Vorschlag vorliegen.
  Darüber ist öffentlich berichtet worden. Das ist sozusagen die Quelle. Insofern
  hat ‑ ‑ ‑ Öffentlich zu berichten ist keine Quelle. Es wird seit Monaten darüber
  spekuliert. Deswegen ist es keine Quelle. Ich wüsste nicht, dass die Regierung einen
  offiziellen Vorschlag gemacht hat. Das weiß ich nicht. Haben Sie eine Quelle? Ich
  kann Ihnen jetzt keine Quelle nennen. Die müsste ich jetzt nachschauen. Dann checken
  wir es doch beide einmal und setzen uns später damit auseinander. Jetzt ist aber
  die Frage, ob Axel Weber EZB-Präsident wird, von der Bundesregierung in einer früheren
  Legislaturperiode immer beantwortet worden mit: Wir erklären uns öffentlich nicht
  dazu. ‑ Das Ergebnis war, dass der Kandidat dann hinterher abhandenkam. Vielleicht
  ist es ja doch eine Möglichkeit, sich in diesem Disput oder in dieser Auseinandersetzung
  öffentlich zu positionieren. Ich verstehe, dass vor allem die Zentralbankbeobachter
  momentan eine hohe Freude haben, Personalspekulationen voranzutreiben. Ich habe
  keinerlei Anlass, diese Spekulationen weiter zu befördern. Ich sehe auch gerade,
  dass das von Ihnen genannte französische Thema auch auf anonymen Quellen beruht.
  Sehen Sie mir nach, dass ich anonyme Debatten um solch ein hochsensibles Thema nicht
  kommentiere. Weil wir gerade im Bereich der Banken sind und auch der europäischen
  Banken: Ich habe eine Quelle, nämlich Frau von der Leyen. Sie hat heute gesagt,
  sie ist für ein Bankenprojekt, um die Zersplitterung des europäischen Bankensystems
  zu vermeiden. Wie steht die Bundesregierung dazu? Das war wahrscheinlich Teil der
  Rede. Die Bundesregierung teilt die Meinung von Frau von der Leyen, dass eine starke
  europäische Bankenlandschaft wichtig ist, auch für die Frage der europäischen Souveränität,
  und dass eine starke europäische Bankenlandschaft auch für die Finanzierungsherausforderungen
  und für die für die finanzmarktpolitischen Herausforderungen für Europa von enormer
  Bedeutung ist. Das ist eine Feststellung, die, glaube ich, länderübergreifend geteilt
  wird. Die regulatorischen Fragen, die zu einem solchen starken Finanzmarkt führen,
  werden diskutiert, auch was die Frage zum Beispiel des digitalen Euros und auch
  der Aufsicht usw. angeht. Insofern, glaube ich, deckt sich das Ziel von Frau von
  der Leyen mit dem Ziel der Bundesregierung. (zu Medienberichten über Vorschläge
  zur Besetzung von Posten bei der Europäischen Zentralbank) Ich wollte noch einmal
  bezüglich der EZB nachfragen. Herr Kornelius, wenn Sie zu den Berichten nicht Stellung
  nehmen können, frage ich: Unterstützt die Bundesregierung eine Kandidatur von Herrn
  Nagel, Bundesbankpräsident, für einen der beiden Topposten bei der EZB? Ich kann
  nur noch einmal wiederholen, dass ich jetzt nicht zur Personalspekulation beitragen
  möchte und deswegen jetzt nicht der Moment ist, zu diesen Fragen Stellung zu nehmen.
  Das Thema des europäischen Bankenmarkts impliziert ja auch gleich die Frage, wie
  die Neuaufstellung bezüglich der Commerzbank und UniCredit ist. Sie geht wahrscheinlich
  an das Finanzministerium. Kurz nach dem Gespräch von Herrn Minister Klingbeil und
  dem UniCredit-Chef Andrea Orcel gab es Meldungen, dass sich eine der Bedingungen,
  Ideen, Erwartungen der Bundesregierung nicht erfüllen werde, nämlich dass es weiterhin
  zwei Aufsichtsratsmandate des Bundes im Commerzbank-Kontrollgremium und mit Blick
  auf die Governance Commerzbank-Manager im Board der UniCredit gibt. Die Quelle ist,
  glaube ich, Reuters und Insider, genau wie in dem anderen Fall. Trotzdem wüsste
  ich gerne, wie die Bundesregierung direkt nach so einem Gespräch zu einer solchen
  Entwicklung steht. Hat das eine Rolle gespielt? Können Sie sagen, wie Sie sich jetzt
  verhalten werden? Zu dem am Montag stattgefundenen Gespräch zwischen Herrn Orcel
  und Bundesfinanzminister Lars Klingbeil hat Herr Kall auch in der Regierungspressekonferenz
  umfassend die Position der Bundesregierung dargelegt. Da muss ich jetzt, glaube
  ich, nichts ergänzen. Im Übrigen hatten Bundesfinanzminister Lars Klingbeil und
  Herr Orcel vereinbart, dass ihr Gespräch vertraulich ist, und daran halten wir uns
  als Bundesfinanzministerium auch. Darüber hinaus nehmen wir keine Stellung. Die
  Erwartungen, was die Governance und den Aufsichtsrat betrifft, waren aber nicht
  Gegenstand der Ausführungen von Herrn Kall; die waren erst Gegenstand der Presseerklärung,
  die hinterher von Ihnen verteilt wurde. Dann können Sie davon ausgehen, dass das
  auch Gegenstand der Position des Bundesfinanzministers war. Aber inwiefern das Gesprächsgegenstand
  war und welche Inhalte das Gespräch hatte, kann ich hier nicht kommentieren. Herr
  Kornelius, zu den Zufriedenheitswerten des Kanzlers: Reiner Haseloff empfiehlt dem
  Kanzler, mit einer empathischen Rede an die Nation wieder Zugang zum eigenen Volk
  zu finden. Wäre das etwas, was der Kanzler in Erwägung zieht? Laut Forsa sind nur
  noch zehn Prozent der Deutschen mit der Arbeit des Kanzlers zufrieden. Wie will
  er konkret verhindern, dass der Wert bald vielleicht auf eine einstellige Zahl sinkt?
  Herr Kollege, das sind Stöckchen, über die ich jetzt nicht springen werde. Die Bundesregierung
