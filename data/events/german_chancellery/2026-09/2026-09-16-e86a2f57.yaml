  geäußert, in der er die inhaltlichen Schwerpunkte noch einmal genannt hat. Er hat
  auch noch einmal den überwölbenden Rahmen beschrieben, warum die Bundesregierung
  diese Reformen vorwärtstreibt. Umfragewerte sind Momentaufnahmen, die ihn auf diesem
  Weg nicht irritieren. Insofern können wir auch jeden dritten Tag eine Umfrage hervorziehen.
  Ich möchte aber einmal sehr infrage stellen, wie sie vernünftig und seriös zustande
  kommen. Keines der Institute, die in dieser Frequenz Umfrageergebnisse auf den Tisch
  legen, haben die nötigen Finanzressourcen, um solche Umfragen durchzuführen. Insofern
  sollten wir alle sehr vorsichtig mit diesem Instrument umgehen. Daran anknüpfend:
  Der Kanzler hat gestern mit der Absage der Reise zur UN letztlich eingestanden,
  dass es enormen innenpolitischen Druck gibt. Nachdem sich jetzt der Fraktionschef
  und acht CDU-Ministerpräsidenten geäußert haben: Glauben Sie, dass der Kanzler nun
  für die nächsten Monate oder Jahre fest im Sattel sitzt? Das ist eine Meinungsfrage,
  die ich hier nicht beantworten kann und muss. Es geht nicht darum, ob jemand im
  Sattel sitzt. Die Reise wird nicht angetreten ‑ eine Reise können wir nur absagen,
  wenn wir sie vorher zugesagt haben, und das ist nicht erfolgt. Neben dieser semantischen
  Feinheit geht es aber schlicht darum, dass die Situation die Präsenz hier in Berlin
  erfordert und deswegen eine Terminkollision vorliegt. Ich kann Sie erinnern, dass
  vor einem Jahr die Terminkollision mit der Haushaltswoche vorlag. Auch das wurde
  dem Kanzler vorgehalten. Wäre er gefahren, dann würde ihm, glaube ich, vorgeworfen,
  dass er hier nicht präsent ist. Die Fähigkeit der Ubiquität ist ihm nicht gegeben,
  und deswegen hat er eine Entscheidung getroffen. Die Tatsache, dass ihn jetzt die
  Ministerpräsidenten unterstützen, ändert nichts daran, dass diese Reise abgesagt
  bleibt? Man könnte ja vermuten, dass damit eines der Probleme, das der Kanzler hier
  in Berlin hat, nun beseitigt sei. Ich glaube, die innenpolitische Situation erfordert,
  dass er in Berlin ist. Deswegen ist diese Entscheidung gefallen. Herr Kornelius,
