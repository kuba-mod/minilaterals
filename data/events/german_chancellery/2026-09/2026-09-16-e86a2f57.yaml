  einen Abschluss vorgelegt. Ich denke, dazu können Sie später etwas sagen. Im Prinzip
  unterstützen wir also den Ansatz, dass wir in der EU selbst festlegen, was gut für
  unsere Kinder ist. Die konkreten Vorschläge der Kommission schauen wir uns jetzt
  an und ergänzen sie gegebenenfalls sinnvoll mit nationalen Regeln. Ich kann dem
  an sich auch gar nicht mehr viel hinzufügen. Ich schließe mich dem Regierungssprecher
  da voll und ganz an. Richtig ist: Wir begrüßen den Vorschlag bzw. das, was die Kommissionspräsidentin
  in ihrer Rede eben schon einmal zum EU-Kids-Act angerissen hat, den sie demnächst
  vorlegen will. Entscheidend für uns ist, die Plattformen hierbei stärker in die
  Verantwortung zu nehmen ‑ das begrüßen wir an der Stelle also sehr ‑ und sichere
  Voreinstellungen zu gewährleisten. Gleichzeitig wollen wir Kinder und Jugendliche
  durch nationale Maßnahmen zu einem verantwortungsvollen Umgang mit sozialen Medien
  befähigen. Vielleicht darf ich die Gelegenheit nutzen: Die Ministerin hat sich gerade
  auch gegenüber der Mediengruppe Bayern dazu geäußert. Daraus würde ich einmal kurz
  zitieren: Insbesondere die Entscheidung „keine sozialen Medien für Kinder unter
  13 Jahren“, halte ich für einen wichtigen Grundsatz, fast noch wichtiger, dass Kinder
  unter drei Jahren grundsätzlich bildschirmfrei aufwachsen können. Sobald der erste
  Entwurf des EU-Kids-Act veröffentlicht ist, werden wir uns die Ausgestaltung anschauen,
  diesen sehr genau prüfen und konstruktiv mit unseren europäischen Partnern an einer
  Stärkung des Jugendmedienschutzes arbeiten. Wir erwarten jetzt schnelles Handeln
  von der EU angesichts der erwiesenen Folgen für die Psyche und Gesundheit von Kindern
  und Jugendlichen, die der unregulierte Social-Media-Konsum anrichten kann. - Das
  ist ein Zitat der Ministerin. Darf ich kurz nachfragen, wenn wir gerade bei den
  amerikanischen Plattformen sind? Es gab ein Urteil in den USA gegen das Unternehmen
  Meta, das ja letztlich eingestanden hat, dass es süchtig machende Instrumente bzw.
  Algorithmen verwendet. Besteht die Bundesregierung eigentlich darauf, dass diese
  Instrumente, die mit den Plattformen verbunden sind, jetzt auch für Deutschland
  und Europa abgeschaltet werden? Zumindest ist das Gegenstand dessen, was wir uns
  jetzt sehr genau anschauen und über das wir jetzt auch mit der EU gemeinsam ins
  Gespräch kommen wollen. Die Ministerin hat immer wieder deutlich gemacht, dass wir
