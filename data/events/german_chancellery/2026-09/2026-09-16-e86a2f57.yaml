  tut. Ich meine, die kaufen ganz teuer ein. Das müssen ja komplette Idioten an der
  Spitze dieses Unternehmens sein! War das eine Frage? Es wäre toll, wenn Sie etwas
  fragen würden. Möchten Sie dementieren, was das „Handelsblatt“ berichtet, dass die
  Ministerin SEFE dazu bewegt bzw. damit beauftragt hat? Ich kommentiere Medienberichte
