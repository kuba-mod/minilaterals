  wir gehört haben, vor allen Dingen auch für junge Wehrpflichtige zu verschärfen.
  Diese Gruppe würde ja, ganz laienhaft gesagt, im Fall einer russischen Mobilmachung
  wahrscheinlich verstärkt in die Ukraine geschickt werden. Warum werden besonders
  junge Männer im wehrpflichtigen Alter in den Fokus genommen? Ich glaube, das müsste
  ich ein bisschen einordnen, weil ich den Vorlauf Ihrer Frage in der Form nicht bestätigen
  kann. Was bekannt ist und was auch in der gemeinsamen Pressekonferenz des Bundesinnenministers
  und des Bundesaußenministers nach dem vereitelten hybriden Anschlagsversuch in Leipzig
  als eine der verschiedenen Maßnahmen in Aussicht gestellt wurde bzw. angekündigt
  wurde, sind verschärfte Einreisekontrollen. Dabei geht es darum, konkret Sicherheitsrisiken
  für die Bundesrepublik Deutschland zu minimieren. Wenn der Kollege des BMI dazu
  noch weiter ausführen möchte, kann er das sehr gerne tun. Ich gehe jetzt erst einmal
  noch etwas auf die Visathematik ein. Es ist auch bekannt, dass sich die Bundesregierung
  seit Beginn des völkerrechtswidrigen russischen Angriffskriegs gegen die Ukraine
  im Kreis der Schengen-Mitgliedstaaten für eine einheitliche restriktive Visumpolitik
  gegen Russland eingesetzt hat und einsetzt. Seit dem Jahr 2022 gibt es von der Europäischen
  Kommission herausgegebene Leitlinien zur einheitlich restriktiven Visumsvergabe
  an russische Staatsangehörige. Diese Leitlinien wendet die Bundesregierung an. Gemäß
  der seit 2025 geltenden Regelung dürfen russischen Staatsangehörigen, die in Russland
  Visa beantragen, grundsätzlich nur noch Schengen-Visa zur einfachen Einreise mit
  kurzer Gültigkeitsdauer erteilt werden. Das ist notwendig, da der russische Angriffskrieg
  und russische hybride Aktivitäten eine Bedrohung für die Sicherheit und die öffentliche
  Ordnung der EU und ihrer Mitgliedstaaten sowie auch für die Bundesrepublik Deutschland
  darstellen können. Das ist die Visumsregelung. Ich werde hier nicht „unter eins“
  auf konkrete Einzelfälle und Maßnahmen eingehen, aber Sie können sich sicher sein,
  dass, so wie das nach Recht und Gesetz erfolgt, jeder einzelne Visumsantrag, der
  den vielen Auslandsvertretungen weltweit ‑ auch mit Blick auf die Zielgruppe, die
  Sie hier gerade erwähnt haben ‑ vorgelegt wird, nach Recht und Gesetz und sehr gewissenhaft
  geprüft wird. Davon völlig unbenommen gibt es andere Kategorien und Möglichkeiten.
  Das sind sogenannte ‑ich benenne es extra „sogenannt“, weil dahinter ein Paragraf
  steht ‑ humanitäre Sonderfälle, für die Sonderregelungen gelten. Das ist eine andere
  Kategorie. Es ist also nicht richtig, dass es irgendeine besondere Behandlung von
  Männern im wehrfähigen Alter gibt? Ich weiß nicht, wie Sie darauf kommen. Ich habe
  zum einen dargelegt, wie die Visumspolitik ist. Die wird aus gutem Grund restriktiv
  gehandhabt. Da gibt es einheitliche Regelungen für den Kreis der Schengen-Staaten.
  Die Bundesrepublik Deutschland wendet dies restriktiv an. Zum anderen gibt es jetzt
  Beschlüsse, die Einreisekontrollen zum Schutz der Bundesrepublik Deutschland weiter
  zu verschärfen. Das sind verschiedene Aspekte, verschiedene Dinge. Ich habe eine
  Frage an das AA zu dem russischen Flugzeug, das heute Vormittag in Köln-Bonn gelandet
  ist. Die Maschine soll zur russischen staatlichen Flugstaffel gehören. Was ist der
  Grund für die Landung in Deutschland gewesen? Dazu kann ich ganz kurz sagen und
  bestätigen, dass es eine entsprechende Genehmigung für einen russischen Sonderflug
  gibt. Der Flug steht im Zusammenhang mit der Ausreise der Mitarbeiterinnen und Mitarbeiter
  des russischen Generalkonsulats Bonn. Können Sie sagen, wie viele Personen ausgeflogen
  wurden? In diesem Zusammenhang habe ich eine Nachfrage an Herrn Kornelius über den
  Status, in dem wir uns mit Russland befinden: Der Kanzler hat gestern Abend bei
  einer Veranstaltung gesagt, Russland führe Krieg gegen die Ukraine und den Westen.
  Deswegen hätte ich ganz gerne nachgefragt: Sind wir jetzt in einem Kriegszustand
  mit Russland? Wir sehen uns vielfältigen hybriden Bedrohungen ausgesetzt. Wir sehen
  uns auch tatsächlichen Angriffsversuchen ausgesetzt, wie Leipzig gezeigt hat. Die
  Bundesregierung nimmt diese Gefahren sehr ernst. Sie reagiert darauf mit den nötigen
  Maßnahmen der Abschreckung und auch des Selbstschutzes. Die Bundesregierung bemüht
  sich um diplomatische Lösungen des Konfliktes, und sie wird weiterhin klar zu ihren
  Prinzipien stehen, um die Ukraine in ihrer Abwehr der russischen Aggression zu unterstützen.
  Es geht mir da wirklich um die Begrifflichkeit. Bisher war die Rede von einem hybriden
  Krieg. Jetzt hat er gesagt, Russland befinde sich im Krieg gegen die Ukraine und
  den Westen. Ist das jetzt ein ‑ wie soll ich es sagen? ‑ voller Kriegszustand? Das
  ist eine Analyse der russischen Position. Das ist eine Beschreibung dessen, was
  wir aus der russischen Haltung sehen. Ich glaube, dass diese Worte jetzt erst einmal
  für sich stehen. Wir sehen, wie ich gesagt habe, ein stark zugenommenes Drohverhalten
  und auch hybride Angriffe, die sich auch über die Ukraine hinaus gegen europäische
  Staaten und auch gegen Deutschland richten. Herr Kornelius, ein amerikanischer Regierungsbeamter
  hat bestätigt, dass es in der vergangenen Woche ein hochrangiges Treffen von Generalstabschefs
  auf Einladung des CENTCOM-Chefs in Deutschland zur Lage im Nahen Osten gegeben habe.
  Können Sie das bestätigen? Es gibt auch Berichte, das Treffen habe in Berlin stattgefunden,
  und Vizepräsident JD Vance habe teilgenommen. Können Sie dazu etwas sagen? Wann
  und wo war das Treffen, und war die Bundesregierung informiert? Dafür müssten Sie
  sich an die amerikanischen Stellen wenden. Die Bundesregierung kann dazu nichts
  sagen. Ich glaube, der amerikanische Vizepräsident wird nicht ganz unbeobachtet
  nach Berlin reisen können. Deswegen könnten Sie doch vielleicht schon sagen, ob
  Ihnen das bekannt ist. Ist Ihnen also nicht bekannt, dass Herr Vance letzte Woche ‑ ‑ ‑
  Ich beteilige mich da nicht an Gerüchten. Wie gesagt, Sie müssten sich, was konkrete
  Treffen angeht, die nicht in die Zuständigkeit der Bundesregierung fallen, auch
  bitte bei den jeweiligen Stellen erkundigen. Ich hätte noch eine Frage an das Wirtschaftsministerium
  zur Gasversorgung im Winter. Es gibt Berichterstattungen, wonach die Ministerin
  SEFE angewiesen habe, Gas einzuspeichern. Es geht um zehn Prozentpunkte mehr. Wenn
  dem so ist, könnten Sie uns erklären, warum die Ministerin ihre Meinung geändert
  hat, in welchem Umfang das geschieht und wie viel Geld das kostet? Die Ministerin
  hat ihre Meinung nicht geändert. Das BMWE bewertet die Lage fortlaufend. Wir befinden
  uns kontinuierlich im Austausch mit allen Marktteilnehmern der Gasbranche. Das gilt
  unverändert. Das habe ich öfter gesagt, das ist auch durchaus wortwörtlich zu nehmen,
  und das betrifft alle Mitglieder des Bundeswirtschaftsministeriums, von der Fachebene
  bis zur Ministerin. Die Wintervorsorge ist Aufgabe des Marktes. Das gilt auch weiterhin.
  Dass die SEFE ihre Aktivitäten zur Befüllung der Speicher verstärken will, begrüßen
  wir ausdrücklich und unterstützen das auch, indem wir grundsätzlich Gespräche mit
  allen Marktteilnehmern führen. Aber ich sehe da keine andere Herangehensweise der
  Ministerin. Ist es so, dass die Aktivitäten von SEFE auf Anregungen oder auf Anordnungen
  der Ministerin erfolgt sind, und wie werden diese finanziert? Kann das Unternehmen
  das aus dem eigenen Kapitalbestand tun, oder fließt dafür Geld aus dem Bundeshaushalt?
  Es ist ja Aufgabe aller Marktteilnehmer, aller Händler, ihre eigenen Speicher zu
  füllen. Das gilt für SEFE wie für andere Unternehmen auch. Sie dürfen das jetzt
  nicht mit dieser THE-Maßnahme verwechseln, die es 2022 gab, im Rahmen derer die
  Speicher im Auftrag der Bundesregierung gefüllt worden sind. Das ist jetzt hier
  eine Maßnahme, die die SEFE für ihre eigenen Gasspeicher startet, die wir eben ausdrücklich
  begrüßen; das zum einen. Ich bitte noch einmal um die Anfangsfrage. Was war Ihr
  erster Satz? Hat Frau Reiche bei dem Unternehmen für eine Anregung oder vielleicht
  sogar für eine Anordnung gesorgt? Eine Anordnung kann es gar nicht geben, weil das
  operative Geschäft der SEFE autark vom Bundeswirtschaftsministerium ist. Eine Anordnung
  kann gar nicht stattfinden. Ich würde hier auf das verweisen, was ich am Anfang
  gesagt habe, nämlich dass wir uns fortlaufend in Gesprächen mit allen Marktteilnehmern
  befinden und das eben auch wortwörtlich zu nehmen ist. Hat SEFE allein aus eigenem
  Antrieb und eigenem Entschluss gehandelt, oder ist Grundlage der jetzigen SEFE-Aktivitäten
  eine Anregung oder ein Wunsch der Wirtschaftsministerin? Ich hatte nach meiner Kenntnis
  gerade geantwortet, dass wir uns im Austausch mit allen Marktteilnehmern der Gasbranche
  befinden. Das gilt auch für SEFE. Die Äußerung, dass es hier keine Anordnung gab,
  habe ich auch getätigt. Dem kann ich nichts hinzufügen. Austausch ist eben etwas
  anderes als Anordnung, und Anordnung ist etwas anderes als Anregung oder Wunsch.
  Die Frage zielt also darauf ab, und die haben Sie substanziell nicht beantwortet,
  ob es die Artikulation eines Wunsches aus dem Wirtschaftsministerium an SEFE gab,
  die Befüllaktivitäten verstärkt auszuweiten. Das war die Frage. Zur Anordnung habe
  ich mich so geäußert, dass es da keine gab. Noch einmal: Die Wintervorsage ist Aufgabe
  des Marktes und der Energieversorgungsunternehmen. Das gilt, und das hat die Ministerin
  immer wieder gesagt, für alle Unternehmen, und das gilt auch für SEFE. Hier geht
