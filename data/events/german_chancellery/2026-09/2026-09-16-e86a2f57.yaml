  Statement der Ministerpräsidenten angesprochen. Es wird berichtet, dass der Wunsch
  nach diesem Statement aus dem Kanzleramt lanciert wurde. Möchten Sie das dementieren?
  Das ist Ihre Wahrnehmung. Ich habe gesagt: Das kann ich nicht bestätigen. Ich weiß
  nicht, woher diese Behauptungen kommen, deswegen kann ich sie nicht bestätigen.
  Das kommt von der Table-Kollegin Sara Sievert. ‑ In dem Statement heißt es, dass
