title: Kanzler ehrt Preisträgerinnen und Preisträger von „Jugend forscht“ „Unser Land
  lebt von Exzellenz, lebt von guten Ideen“
text: 'Für den Bundeswettbewerb „Jugend forscht“ qualifizierten sich 159 Jugendliche
  mit insgesamt 116 Projekten. Bundeskanzler Friedrich Merz hat die Preisträgerinnen
  und Preisträger der 61. Wettbewerbsrunde von „Jugend forscht“ im Bundeskanzleramt
  empfangen. In seiner Rede dankte er den über 11.000 Forscherinnen und Forschern
  aus ganz Deutschland, die sich in diesem Jahr beteiligt hatten. Beim Empfang verlieh
  Friedrich Merz den „Preis des Bundeskanzlers für die originellste Arbeit“. Preisträger
  in diesem Jahr ist Tim Kammel, 18 Jahre, aus Nordrhein-Westfalen. Der Gymnasiast
  befasste sich mit der Mechanik und der Physik von Sanduhren. Anhand eines eigenen
  Versuchsaufbaus analysierte er den Effekt unterschiedlicher Öffnungsgrößen und Trichterformen
  auf das Strömungs- und Laufverhalten des Sands und entwickelte eine Computersimulation
  der Dynamik. Die Ergebnisse könnten dazu beitragen, technische Prozesse wie beispielsweise
  das Entleeren großer Getreidesilos oder die Dosierung eines Medikaments in der Pharmazie
  besser zu verstehen. Im Interview erzählt Tim Kammel von seiner Projektidee, den
  besonderen Herausforderungen bei der Umsetzung und was er macht, wenn er nicht gerade
  forscht. Die Einladung aller Bundessiegerinnen und Bundessieger sowie der Platzierten
  (2. bis 5. Preise der sieben Wettbewerbskategorien) zu einem Empfang im Bundeskanzleramt
  und die Überreichung des „Preises des Bundeskanzlers für die originellste Arbeit“,
  der mit 3000 Euro dotiert ist, unterstreicht die große Bedeutung des Wettbewerbs
  und die Wertschätzung des Forschungsnachwuchses. Bundeskanzler Merz würdigte das
  Engagement der Schülerinnen, Schüler, Studentinnen und Studenten, die seit mehr
  als sechs Jahrzehnten an kreativen Ideen forschen und Höchstleistungen erbringen.
  Dabei brauche Deutschland den Einsatz natürlicher Intelligenz, nicht nur Künstlicher
  Intelligenz, betonte Friedrich Merz. Unter dem Motto „Maximale Perspektive“ fand
  der 61. Bundeswettbewerb vom 28. bis 31. Mai 2026 in Herzogenaurach statt. Bundespatenunternehmen
  in diesem Jahr war die Schaeffler AG. Für den Bundeswettbewerb , qualifizierten
  sich 159 Jugendliche mit insgesamt 116 Projekten. Sie setzten sich zuvor in insgesamt
  120 Wettbewerbsveranstaltungen auf Regional- und Landesebene durch. Die Projekte
  teilen sich in sieben Fachgebiete auf: Arbeitswelt, Biologie, Chemie, Geo- und Raumwissenschaften,
  Mathematik/Informatik, Physik und Technik. Die jeweils besten fünf Projekte pro
  Fachgebiet werden mit Geld- und Sachpreisen wie beispielsweise Forschungspraktika
  und Stipendien ausgezeichnet. Meine Damen und Herren, liebe Schülerinnen und Schüler,
  Preisträgerinnen und Preisträger, herzlich willkommen im Bundeskanzleramt! Ich freue
  mich sehr, dass Sie und Ihr heute Morgen da seid und dass ich erneut die Gelegenheit
  habe, so viele junge Menschen bei uns zum Empfang für die Preisträgerinnen und Preisträger
  des Wettbewerbs „Jugend forscht“ willkommen zu heißen. Sie stehen in diesem Jahr
  für insgesamt rund 11.000 Schülerinnen und Schüler, Teilnehmerinnen und Teilnehmer,
  die aus ganz Deutschland mitgemacht haben. Wir sind jetzt seit mehr als 60 Jahren
  mit dem Wettbewerb unterwegs. Ich finde, das ist ein großer Erfolg, der sich sehen
  lassen kann, wenn seit sechs Jahrzehnten junge Schülerinnen und Schüler, Studentinnen
  und Studenten an kreativen Ideen forschen und Höchstleistungen erbringen. Viele
  Ehemalige haben im Übrigen große Karriere gemacht; das werden Sie verfolgt haben.
  Aus diesem Wettbewerb heraus sind in Deutschland große Talente entstanden. Wissenschaftlerinnen
  und Wissenschaftler, Unternehmensführer haben ihr Talent eingebracht in den Dienst
  unseres Landes, in den Dienst von Wissenschaft und Forschung, auch mit großartigen
  Ergebnissen in unserer Wirtschaft. Ich brauche Ihnen das nicht besonders zu sagen,
  aber ich will es trotzdem tun: Karin Prien, die zuständige Bundesministerin und
  ich, wir freuen uns wirklich, dass Sie so engagiert dabei sind, dass Sie das auch
  in diesem Jahr wieder so engagiert gemacht haben und Sie Ihre Neugier und Ihre natürliche
  Intelligenz einsetzen und nicht nur künstliche Intelligenz. Ich finde, gerade in
  diesen Tagen muss man das einmal sagen.   In diesem Sinne heiße ich Sie noch einmal
  sehr, sehr herzlich willkommen hier in Berlin. Meine Damen und Herren, vielleicht
  ein ganz grundsätzliches Wort zur Bildungspolitik   ich darf das auch im Namen von
  Karin Prien sagen  : Wir haben in der letzten Woche mit größter Besorgnis die Ergebnisse
  der PISA-Studie zur Kenntnis genommen. Das muss uns allen zusammen ein großer Ansporn
  sein, in der Bildungspolitik besser zu werden, mit Anstrengungen besser zu werden,
  auch in den MINT -Fächern besser zu werden, für die ja viele von Ihnen stehen. Sie
  sind diejenigen, die auch Vorbilder sind für viele Schülerinnen und Schüler, für
  viele Studentinnen und Studenten, die sich durch das angespornt fühlen sollen, was
  Sie leisten. Deswegen will ich einfach nur einmal herzlichen Dank sagen; denn das
  ist alles wichtig für unser Land. Unser Land lebt von Exzellenz, lebt von guten
  Ideen, lebt von Innovationen, lebt von Erfindungen, lebt von jungen Menschen, die
  mit Begeisterung an der Arbeit sind   und das sind Sie alle. Deswegen ein herzliches
  Willkommen und einen großen Beifall für Sie alle! Die Stiftung Jugend forscht hat
  das Projekt in diesem Jahr „Maximale Perspektive“ genannt. Das ist das Motto, unter
  dem in diesem Jahr die Forschungsprojekte ausgetüftelt wurden. Maximale Perspektive
  zu haben heißt auch, neue Möglichkeiten zu öffnen, den Blickwinkel zu weiten für
  das, was unmittelbar vor einem liegt, einen neuen Weg einzuschlagen, den zuvor noch
  niemand gegangen ist. Wir haben in diesem Jahr ein besonders interessantes Beispiel,
  wie ich bei der Vorbereitung gelesen habe, und ich bin gespannt auf das, was ich
  hier gleich sehen werde. Tim Kammel vom Engelbert-Kaempfer-Gymnasium in Lemgo hat
  im Fachgebiet Physik ein Projekt entwickelt, bei dem es um die Frage geht - ich
  habe ehrlich gesagt ein bisschen gelacht, als ich es gelesen habe -: „Wie tickt
  eine Sanduhr?“ Das werden wir gleich sehen. Dabei geht es um die Genauigkeit von
  Sanduhren und deren Mechanik. Ich vermute einmal, wir kennen alle Sanduhren, aber
  die wenigsten von uns kennen das, was wir hier gleich vorgeführt bekommen. Er hat
  in einer Sanduhr eine ganz neue wissenschaftliche Frage entdeckt, und dieser Frage
  ist er mit seiner Computersimulation auf den Grund gegangen. Wir freuen uns also,
  gleich zu hören, was genau dahintersteckt. Wir sind, glaube ich, alle sehr gespannt.
  Lieber Tim Kammel, ganz herzlichen Glückwunsch, insbesondere zum diesjährigen Sonderpreis,
  und herzlich willkommen! Meine Damen und Herren, ich will auch nicht versäumen,
  den Lehrerinnen und Lehrern sowie den Eltern ein herzliches Wort des Dankes für
  die Begleitung der Preisträger in diesem Jahr zu sagen. Ich will auch nicht versäumen,
  der Stiftung herzlich zu danken   Frau Bönsch, Sie stehen heute erneut stellvertretend
  für die Stiftung hier. Last but not least möchte ich auch noch dem Partnerunternehmen
  des Jahres 2025/26, der Schaeffler AG, und ihrem Chef Klaus Rosenfeld danken. Herzlich
  willkommen auch Ihnen beiden. Schön, dass Sie heute dabei sind und dass Sie dieses
  Projekt unterstützt haben. Meine Damen und Herren, das war es schon von meiner Seite.
  Ich wünsche Ihnen allen noch einmal ein herzliches Willkommen im Bundeskanzleramt.
    Und jetzt schauen wir uns einmal an, wie die Sanduhr tickt. „Wir suchen die Forscher
  von morgen!“. Unter diesem Motto rief 1965 der damalige stern-Chefredakteur Henri
  Nannen erstmals zur Teilnahme an Jugend forscht auf. In der ersten Wettbewerbsrunde
  waren es „nur“ 244 Mädchen und Jungen, die sich beteiligten. Bis heute haben sich
  mehr als 350.000 Nachwuchswissenschaftlerinnen und Nachwuchswissenschaftler am Wettbewerb
  beteiligt. Der Preis des Kanzlers hat eine lange Tradition: 1971 wurde er das erste
  Mal vom damaligen Bundeskanzler Willy Brandt gestiftet.'
