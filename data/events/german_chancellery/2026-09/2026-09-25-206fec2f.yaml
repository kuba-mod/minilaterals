title: Rede von Bundeskanzler Merz beim 150-jährigen Jubiläum der Henkel AG Ein starker
  Partner mit Geschichte
text: 'Bundeskanzler Merz würdigte Henkel als Unternehmen mit strategischer Relevanz.
  Bundeskanzler Friedrich Merz hat an den Feierlichkeiten zum 150. Jubiläum der Henkel
  AG in Düsseldorf teilgenommen. In seiner Festrede betonte er: „Wir brauchen Unternehmen
  wie Henkel als starke Partner mit weltweitem Gewicht.“ Henkel sei Zulieferer für
  deutsche Schlüsselbranchen – für die Automobilindustrie, die Chipindustrie, die
  Luft- und Raumfahrt – und damit von großer strategischer Relevanz. Gleichzeitig
  sei das Unternehmen resilient und zeige das durch die Diversifizierung zwischen
  Konsumgütergeschäft und Industriegeschäft und die Produktion vor Ort für die jeweiligen
  Absatzmärkte. „Sie übernehmen auch ganz direkt nach innen und nach außen Verantwortung
  für unser Land“, sagte der Bundeskanzler . Die Henkel AG wurde 1876 gegründet und
  ist seit 1985 im DAX vertreten. Heute hat sie einen Jahresumsatz von über 20 Milliarden
  Euro. Neben dem Hauptstandort in Düsseldorf ist Henkel international an 100 weiteren
  Standorten vertreten und beschäftigt rund 50.000 Mitarbeiter weltweit. Sehr geehrte,
  liebe Familie Henkel, insbesondere sehr geehrte, liebe Frau Bagel-Trah, sehr geehrte
  Mitglieder des Gesellschafterausschusses, des Aufsichtsrates und des Vorstands,
  vor allem lieber Carsten Knobel, sehr geehrte, liebe Mitarbeiterinnen und Mitarbeiter
  des Unternehmens, liebe Henkelaner, liebe Kolleginnen und Kollegen des Europäischen
  Parlaments, des Deutschen Bundestages und des nordrhein-westfälischen Landtags,
  sehr geehrte Mitglieder der Landesregierung des Landes Nordrhein-Westfalen, sehr
  geehrter Herr Oberbürgermeister, Exzellenzen, meine sehr geehrten Damen und Herren!
  1876, das Jahr, in dem Fritz Henkel in Aachen die Henkel & Cie. gründete, ist uns
  sehr, sehr fern. Das deutsche Kaiserreich ist gerade einmal fünf Jahre alt. Auf
  dem Balkan erklären Serbien und Montenegro dem Osmanischen Reich den Krieg. Auf
  der anderen Seite des Atlantiks kämpfen Dakota und Cheyenne gegen die US -Kavallerie.
  In Deutschland setzt Nikolaus Otto einen Viertaktmotor in Gang. In Bayreuth öffnet
  Richard Wagners Festspielhaus seine Türen. Und in Köln erblickt ein kleiner Junge
  mit den Vornamen Conrad Hermann Joseph das Licht der Welt. Nun, meine Damen und
  Herren, das Osmanische Reich existiert schon lange nicht mehr, und der kleine Junge
  aus Köln wird 73 Jahre nach seiner Geburt der erste Bundeskanzler der jungen Bundesrepublik
  Deutschland. Dort, wo zur Gründungszeit Ihres Unternehmens die Dakota gegen die
  US -Kavallerie kämpften, entstehen heute riesige KI -Rechenzentren von dem Ausmaß
  ganzer Städte. 150 Jahre also im Zeitraffer: das Kaiserreich, der Erste Weltkrieg,
  die erste gescheiterte deutsche Demokratie, das Weltverbrechen des Nationalsozialismus,
  der Zweite Weltkrieg und danach, bis heute, schon mehr als die Hälfte dieser 150 Jahre,
  die wir heute feiern, eine zweite deutsche Demokratie, die mit dem einst kleinen
  Jungen aus Köln, geboren in eben jenem Jahr 1876, als erstem deutschen Bundeskanzler,
  Konrad Adenauer, ihre Arbeit aufnimmt. Tiefe Brüche, und immer wieder neue Aufbrüche
  also in Deutschland, und dabei doch bemerkenswerte Konstanten, Konstanten, die bis
  heute dazu beitragen, dass wir sind, wer wir sind, als Menschen und als Gemeinschaft.
  Ein Unternehmen wie Henkel ist so eine Konstante. Vor wenigen Wochen habe ich in
  Bayreuth gesagt: Wir waren eine Kulturnation, bevor wir eine politische Nation wurden.
  - Mit Blick auf Ihr heutiges Jubiläum will ich es in ähnlicher Weise sagen: Wir
  waren ein Land der Gründer, der Entdecker und der Erfinder, ein Land des Pioniergeistes,
  lange bevor wir eine politische Nation wurden. Es ist bis heute erstaunlich und
  begeisternd zugleich, was ein solcher Geist bewirken kann. Denn heute, 150 Jahre
  nach Ihrer Gründung, feiern wir in Düsseldorf einen Weltkonzern mit – wir haben
  es gehört – rund 50 000 Mitarbeiterinnen und Mitarbeitern in mehr als 100 Produktionsstätten
  weltweit, mit einem Umsatz von mehr als 20 Milliarden Euro, mit Produkten, die nicht
  nur in den Supermärkten rund um den Globus vertreten sind, sondern in nahezu allen
  modernen Hightechprodukten. Sie, liebe Henkelaner, sitzen fest im Sattel eines globalen
  Champions , und dazu gratuliere ich Ihnen von ganzem Herzen. Herzlichen Glückwunsch
  zu 150 Jahren Henkel und zu 150 Jahren Erfolgsgeschichte! Das ist wirklich ein Grund,
  stolz zu sein. Es ist ein Grund, zu feiern und stolz zu sein, weil es Ihrem Unternehmen
  gut geht. 1985 hat Henkel den Weg an die Börse gewagt und seit seinem Börsengang
  durchgehend Dividenden ausgezahlt, eines von ganz wenigen DAX -Unternehmen, denen
  das gelungen ist. Selbst während der Pandemie mussten Sie weder Staatshilfen in
  Anspruch nehmen noch Mitarbeitende entlassen. Wir werden in den nachfolgenden Reden
  etwas mehr darüber erfahren, was Ihre Erfolgsgeschichte möglich gemacht hat, über
  die Henkel-Familie, die besondere Henkel-Kultur, über die Menschen, die das Unternehmen
  geprägt haben, und über die wesentlichen strategischen Weichenstellungen der vergangenen
  Jahrzehnte. Wer könnte uns Spannenderes darüber erzählen als die Aufsichtsratsvorsitzende
  und Ururenkelin des Gründers, liebe Frau Bagel-Trah, oder der Vorsitzende des Vorstandes,
  lieber Carsten? Wir freuen uns auf Ihre Beiträge und auf deinen Beitrag heute Abend.
  Aber lassen Sie mich auch eine sehr persönliche Anmerkung hinzufügen. Du hast es,
  lieber Carsten, schon gesagt: Kurze Zeit nach dem Börsengang hatte ich selbst Gelegenheit,
  einige Monate bei Henkel hier in Holthausen zu arbeiten. Ich war damals junger Referent
  beim Verband der Chemischen Industrie und hatte im Verband mit einigen Kolleginnen
  und Kollegen einen berufsbegleitenden Aufenthalt in den Mitgliedsunternehmen etabliert.
  Ich bin damals zu Henkel gegangen und hatte die Chance, im Vorstandssekretariat
  unter dem damaligen Vorstandsvorsitzenden Helmut Sihler zu arbeiten. Mich hat diese
  große Persönlichkeit und mich hat die damalige Zeit in diesem Unternehmen und in
  dieser Industrie sehr geprägt, und ich fühle mich bis heute gerade dieser Industrie
  besonders verbunden. Als ich als junger Europaabgeordneter einige Jahre später zum
  ersten Mal die Gelegenheit hatte, mit Helmut Kohl zu reisen, hat er mich gefragt,
  was ich denn vor der Politik beruflich gemacht habe. Als ich ihm dann gesagt habe,
  dass ich beim Chemieverband war, war seine spontane Antwort: Na ja, dann können
  Sie ja noch Bundeskanzler werden! – Nun, meine Damen und Herren, genug der persönlichen
  Anmerkungen. Henkel ist ein großartiges Beispiel dafür, dass langfristig erfolgreiche
  Unternehmen aus mehr bestehen als aus Patenten, Produkten und Fabriken. Glaubwürdigkeit
  und Verlässlichkeit der Führung, Verwurzelung am Standort, Vertrauen und gute Kommunikation
  in der Belegschaft, eine Eigentümerstruktur, die mehr auf nachhaltige Rentabilität
  setzt als auf kurzfristigen Erfolg, das sind die Voraussetzungen, die Henkel seit
  150 Jahren so erfolgreich sein lassen. Deswegen ist dieses Fest, liebe Henkelaner,
  zuvorderst ein Fest für Sie, für die, die in der Vergangenheit gemeinsam mutige
  Entscheidungen getroffen und auch umgesetzt haben, für die, die heute gemeinsam
  gestalten und Ihre besondere Erfolgskultur weitertragen. Schaut man sich Ihr Unternehmen
  an, dann kann man wirklich voller Zuversicht sagen: Future? Ready! Nun stehe ich
  hier nicht als Historiker, sondern als Bundeskanzler, und als Bundeskanzler will
  ich Ihnen sagen: Dieser Erfolg, Ihr Erfolg, ist wichtig, nicht nur für Sie. Ihr
  Erfolg ist wichtig für unser Land. Wir leben in außergewöhnlich herausfordernden
  Zeiten. Europa und mit Europa auch Deutschland, wir stehen geoökonomisch und geostrategisch
  unter Druck wie selten zuvor. Der technologische Wandel, angetrieben von KI , verändert
  zudem unsere Arbeit und verschiebt globale Wertschöpfungslogiken. Wichtige Handelspartner
  setzen auf Abschottung und stellen die regelbasierte internationale Ordnung infrage.
  Bestehende Abhängigkeiten werden für machtpolitische Ziele genutzt. Kriege gefährden
  nicht nur unsere Sicherheit, sondern treiben auch die Energiekosten. Sie alle wissen
  das, und Sie spüren das, meine Damen und Herren, als ein global tätiges Unternehmen
  unmittelbar. In dieser Lage sind zwei Dinge von größter Bedeutung: Wir müssen Europa
  und damit unser Land, Deutschland, fit machen in dieser unsicheren Welt. Deshalb
  engagiere ich mich so sehr im Kreis der 27 Staats- und Regierungschefs der Europäischen
  Union, aber auch darüber hinaus. Europa muss endlich souverän werden in der Verteidigung
  seiner Integrität und seiner Interessen, aber auch im Abschluss mit Abkommen mit
  Staaten außerhalb Europas, die mit uns die gleichen Werte und das gleiche Interesse
  an den Regeln des Miteinanders und der Verlässlichkeit teilen. Und wir brauchen
  Unternehmen wie Henkel als starke Partner mit weltweitem Gewicht. Sie sind nicht
  nur Zulieferer für deutsche Schlüsselbranchen – für die Automobilindustrie, die
  Chip industrie, die Luft- und Raumfahrt – und damit selbst von großer strategischer
  Relevanz. Sie zeigen nicht nur, wie Resilienz gelebt werden kann. Die Diversifizierung
  etwa zwischen Konsumgütergeschäft und Industriegeschäft, die Produktion vor Ort
  für Ihre jeweiligen Absatzmärkte: All das macht Henkel widerstandsfähiger und stabiler.
  Sie übernehmen auch ganz direkt nach innen und nach außen Verantwortung für unser
  Land. Sie sind Ihrem Stammsitz hier in Düsseldorf-Holthausen treu geblieben – bis
  heute ist der weltweit zweitgrößte Produktionsstandort Ihres Unternehmens mitten
  in der Stadt Düsseldorf. Sie bieten vielen tausend Menschen gute Arbeitsplätze,
  die diesen Menschen etwas bedeuten und mit denen sie sich identifizieren: von der
  Jugend an, mit hunderten von Ausbildungsplätzen in ganz Deutschland und mehreren
  dualen Studiengängen, und bis ins Alter, wie der Tag morgen zeigen wird, mit vielen
  tausend Mitgliedern dieser großen Gemeinschaft der Henkel-Pensionäre. Sie investieren
  jedes Jahr in Forschung, Entwicklung und Fertigung in Deutschland. Bei meinem Besuch
  im letzten Jahr hier bei Ihnen vor Ort – Carsten, du hast es angesprochen – war
  ich beeindruckt: 30 Labore, vier Technologiezentren, 650 Wissenschaftlerinnen und
  Wissenschaftler, die forschen und entwickeln. Von hier kommen die Fachkräfte und
  die Innovationen, die sicherstellen, dass Deutschland an der Spitze der Wertschöpfungskette
  steht und die Zukunft mitgestalten kann, ja an dieser Zukunft bereits teilhat: an
  Robotik, Raumfahrt, KI und Mobilität. Dafür möchte ich Ihnen heute noch einmal meinen
  Dank aussprechen. Ihr unternehmerischer Einsatz und Ihr Verantwortungsbewusstsein
  tragen ganz erheblich zur Zukunftsfähigkeit unseres ganzen Landes bei. Danken möchte
  ich auch dir, lieber Carsten, für deinen Einsatz im Rahmen der Initiative „ Made
  for Germany “. Die Beiträge von Henkel in Form der Investitionszusagen, aber auch
  dein persönlicher, fachlicher Input, alles das ist von größtem Wert für unser Land.
  Würdigen will ich genauso, meine Damen und Herren, und danken will ich dafür, dass
  Henkel nach Beginn des Angriffskriegs gegen die Ukraine unmittelbar Konsequenzen
  gezogen hat: mit konkreter Hilfe für die Ukraine und mit einer klaren Entscheidung,
  sich aus seinem milliardenschweren Russlandgeschäft zurückzuziehen. Vielleicht sind
  Sie, meine Damen und Herren, in diesem Unternehmen gerade deshalb so erfolgreich,
  weil sie wissen und vorleben: Wirtschaft ist kein Selbstzweck. Meine Damen und Herren,
  die Bundesregierung muss und will ihren Beitrag leisten, damit die nächsten Jahre
  und Jahrzehnte für uns alle so erfolgreich werden wie die 150 Jahre für Henkel,
  die wir heute feiern. Wir haben dafür die Bedingungen zu schaffen. Deshalb werden
  wir den Aufbruch, den wir begonnen haben, ambitioniert fortsetzen – ambitioniert
  fortsetzen müssen, weil das die Bedingung für eine gute Zukunft unseres Landes ist.
  Wir arbeiten weiter daran, Planungs- und Genehmigungsverfahren zu beschleunigen.
  Wir machen den Bau von Infrastruktur, von Straßen, Brücken, Schienen, Industrieanlagen,
  jetzt schneller und effizienter. Wir arbeiten daran, den regulatorischen Rahmen
  insgesamt und damit auch im Bereich der chemischen Industrie zu modernisieren. Wir
  arbeiten weiter an der Entlastung von Berichtspflichten und Dokumentationspflichten.
  Wir verbessern die steuerlichen Rahmenbedingungen. Die Abschreibungsmöglichkeiten
  wirken. Die Absenkung der Sätze folgt. Auch auf europäischer Ebene ist unser Einsatz
  für den Bürokratierückbau erfolgreich. Ich will ein Beispiel nennen: Die EU-Kommission
  nimmt Abstand von einer Revision der REACH -Verordnung. Der Fokus der weiteren Arbeiten
  wird hier auf Vereinfachung und Implementierung liegen, und nicht auf weiterer Komplizierung.
  Meine Damen und Herren, das sind nur kleine Ausschnitte. Ich habe nicht gesprochen
  über die Handelspolitik, über MERCOSUR und die vielen weiteren Handelsabkommen,
  die wir verhandeln und die noch kommen. Ich habe nicht gesprochen über die Renten-,
  Gesundheits- und Pflegeversicherung oder unsere vielfältigen Arbeiten an Digitalisierung
  und Staatsmodernisierung. Das alles fügt sich in eine Agenda für eine gute Zukunft
  unseres Landes: Für eine Wirtschaft, die stark und innovativ bleibt. Für einen Staat,
  der ermöglicht und verlässlich seine Aufgaben erledigt. Für soziale Sicherheit,
  die auch im demografischen Wandel diesen Namen verdient. Für ein freies, rechtlich
  und sozial gesichertes Leben, auch für die heute Jungen in den kommenden Jahrzehnten.
  Und wir sehen, dass in unserem Land etwas in Gang kommt. Die deutsche Wirtschaft
  wächst wieder, und wenn wir die richtigen Entscheidungen treffen, dann hält dieses
  Wachstum auch an. Die ausländischen Direktinvestitionen ziehen wieder deutlich an,
  und wir sehen Rekordzahlen bei der Gründung junger Start-ups . Meine Damen und Herren,
  die Transformation unserer Wirtschaft, sie findet statt, während viele noch fragen,
  ob sie gelingen kann. Wir sind in der Lage, diesen Wandel erfolgreich zu gestalten.
  Meine Damen und Herren, ich habe zu Beginn mit einem Blick auf die Gründungszeit
  Ihres Unternehmens, mit Konrad Adenauer und Richard Wagners Festspielhaus begonnen,
  und ich möchte für Sie als rheinisches Unternehmen mit einem kurzen Zitat aus dem
  „Rheingold“ schließen: Henkel lebt und liebt Wandel und Wechsel. Auf sie ist seit
  150 Jahren eben darum Verlass: weil sie Wandel und Wechsel nicht fürchten, sondern
  lieben; weil sie sich selbst immer wieder neu erfinden und auf jede neue Zeit klug
  reagieren – für das Wohl nachfolgender Generationen. Lassen wir uns als Land von
  dieser 150-jährigen Erfolgsgeschichte – und übrigens von so vielen ähnlichen Erfolgsgeschichten
  in der deutschen Wirtschaft – inspirieren. Trauen wir uns Wandel und Wechsel zu.
  Wir sind ein lebendiges, ein starkes, ein freies Land. Arbeiten wir dafür, dass
  auch unsere Kinder in einem solchen Land leben können, dass unsere Enkel es genauso
  vorfinden und dass „Wohlstand für Alle“, wie es Ludwig Erhard gesagt hat, auch für
  die junge Generation in Deutschland ein Versprechen bleibt, das wir alle zusammen,
  meine Damen und Herren, einlösen. Herzlichen Dank und herzlichen Glückwunsch zum
  Geburtstag!'
