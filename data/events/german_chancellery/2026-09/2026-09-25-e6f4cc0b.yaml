title: Abwechslungsreiche Angebote der Bundesregierung beim Tag der Deutschen Einheit
  2026 in Bremen
text: Vom 2. bis 4. Oktober feiern wir mit dem Tag der Deutschen Einheit das große
  Demokratiefest in Deutschland. Auch die Bundesregierung wird mit einer Reihe von
  Gesprächsangeboten, Informationen und Unterhaltung in Bremen vertreten sein. Im
  Dialogforum der Bundesregierung diskutieren vom 2. Oktober an Bundesministerinnen
  und -minister und weitere prominente Gäste aus Wissenschaft, Sport und Journalismus
  über Zukunftsthemen und über entscheidende Momente der deutschen Geschichte. Das
  bietet den Besucherinnen und Besuchern auch die Möglichkeit, direkt mit Vertreterinnen
  und Vertretern der Bundesregierung ins Gespräch zu kommen. Das Dialogforum ist in
  der Nähe des Bremer Weserstadions aufgebaut. Den Fragen der Besucherinnen und Besucher
  stellen sich u.a. Nina Warken, Chefin des Bundeskanzleramtes, Lars Klingbeil, Bundesfinanzminister
  und Vize-Kanzler, Boris Pistorius, Bundesverteidigungsminister und Karsten Wildberger,
  Bundesminister für Digitales und Staatsmodernisierung. Zum Abschluss des Programms
  am 4. Oktober findet dort eine Zollauktion statt, bei der Fundsachen ersteigert
  werden können. Das vollständige Programm im Dialogforum finden Sie hier. Die Bundesministerien
  präsentieren sich zudem in direkter Nachbarschaft zum Dialogforum mit Informationsständen,
  die zum Austausch über die Arbeit der Bundesregierung einladen. Auf einem Video-Cube
  und in der historischen Foto-Ausstellung „Momentaufnahmen – Auf dem Weg zur Deutschen
  Einheit“ werden die Wendejahre in bewegenden Bildern präsentiert. Eine Reihe weiterer
  Unterhaltungsangebote erwartet die Besucherinnen und Besucher, zum Beispiel ein
  Selfie-Spot am Rednerpult des Bundeskanzlers oder eine „Rallye“ zu Stationen auf
  der Ausstellungsfläche der Bundesregierung. Bundeskanzler Friedrich Merz wird am
  3. Oktober nach seiner Teilnahme am ökumenischen Festgottesdienst im St. Petri Dom
  und am Festakt im Konzerthaus „Die Glocke“ auch das Bürgerfest besuchen. Die zentralen
  Feierlichkeiten zum Tag der Deutschen Einheit unter dem Motto „VIELE STÄRKEN – EIN
  LAND“ finden dieses Jahr vom 2. bis zum 4. Oktober in Bremen statt. Alle weiteren
  Informationen, Programmpunkte und Updates finden Sie auf der offiziellen Webseite
  zum Tag der Deutschen Einheit.
