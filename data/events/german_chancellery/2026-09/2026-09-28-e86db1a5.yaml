title: Pressestatement von Kanzler Merz zu 75 Jahre Bundesverfassungsgericht „In unserer
  Demokratie steht das Recht über der Macht“
text: 'Neben Kanzler Merz nahmen Vertreterinnen und Vertretern der Verfassungsorgane
  aus Bund und Ländern sowie Bürgerinnen und Bürger an dem Festakt in Karlsruhe teil.
  Zum 75. Jubiläum des Bundesverfassungsgerichts würdigte Bundeskanzler Friedrich
  Merz dessen Bedeutung für die Demokratie und dankte allen ehemaligen und aktiven
  Richterinnen und Richtern für ihre geleistete Arbeit. „Sie sind eine wichtige Säule
  unserer Demokratie, gerade in diesen turbulenten Zeiten.“ Das höchste deutsche Gericht
  verfolge seit 75 Jahren einen sehr einfachen, aber wirkungsvollen Grundsatz: „In
  unserer Demokratie steht das Recht über der Macht. Das ist die wichtigste Säule
  in einer Gewaltenteilung, in einer Demokratie.“ In der Stadthalle in Karlsruhe fand
  ein Festakt mit rund 1.000 Gästen statt. Unter den Teilnehmenden waren neben den
  Vertreterinnen und Vertretern der Verfassungsorgane aus Bund und Ländern auch Bürgerinnen
  und Bürger. Zudem nahmen auch Gäste aus dem Ausland an der Feierstunde teil. Der
  Bundespräsident, Frank-Walter Steinmeier, wandte sich mit einer Rede zum 75. Geburtstag
  des Bundesverfassungsgerichts an die Festgesellschaft. Das Bundesverfassungsgericht
  wurde am 28. September 1951 durch Bundeskanzler Konrad Adenauer und Bundespräsident
  Theodor Heuss im Prinz-Max-Palais in Karlsruhe feierlich eröffnet. Seine erste Entscheidung
  traf es bereits Tage zuvor, am 9. September 1951, zur geplanten Neugliederung der
  Länder Baden, Württemberg-Baden und Württemberg-Hohenzollern (BVerfG, Beschluss
  vom 09.09.1951 – 2 BvQ 1/51). Bundesverfassungsgericht : Das Bundesverfassungsgericht
  ist Gericht und Verfassungsorgan zugleich. Jeweils acht Richterinnen und Richter
  arbeiten in zwei Senaten unabhängig und für eine Amtszeit von zwölf Jahren. Das
  höchste deutsche Gericht wacht über die Einhaltung des Grundgesetzes, in dem es
  staatliches Handeln kontrolliert und Grundrechte durchsetzt. Das  Bundesverfassungsgericht
  prüft beispielsweise Verfassungsbeschwerden von Bürgerinnen und Bürgern und stellt
  die Verfassungsmäßigkeit von Gesetzen fest. Seine Entscheidungen sind unanfechtbar.
  Meine Damen und Herren, das war eine würdige Feierstunde zum 75. Geburtstag des
  Bundesverfassungsgerichts. Das Bundesverfassungsgericht folgt seit 75 Jahren einem
  sehr einfachen, aber sehr wirkungsvollen Grundsatz: In unserer Demokratie steht
  das Recht über der Macht. Das ist die wichtigste Säule in einer Gewaltenteilung,
  in einer Demokratie. Ich bedanke mich bei dieser wichtigen Institution für 75 Jahre
  Rechtsprechung, die mich auch als Jurist geprägt hat und bis heute prägt. Ich bedanke
  mich bei allen ehemaligen Richterinnen und Richtern und bei den aktiven Mitgliedern
  der zwei Senate des Bundesverfassungsgerichts. Sie sind eine wichtige Säule unserer
  Demokratie, gerade in diesen turbulenten Zeiten. Ich wünsche dem Bundesverfassungsgericht
  weiter, so wie wir es auch heute gesehen haben, Mut bei diesen Entscheidungen und
  immer das Recht über die Macht zu stellen. Das macht unsere Demokratie aus. Das
  hat sie 75 Jahre mit dem Bundesverfassungsgericht gestärkt. Ich wünsche mir das
  auch für die Zukunft. Herzlichen Dank und herzlichen Glückwunsch, Bundesverfassungsgericht!'
