title: Rede von Bundeskanzler Merz beim Jahrestreffen der Initiative „Made for Germany“
  Vertrauen in den Wirtschaftsstandort Deutschland
text: 'In seiner Rede würdigte Bundeskanzler Merz die Initiative „ Made for Germany
  “ und ihr Vertrauen in den Wirtschaftsstandort Deutschland. Bei seiner Rede anlässlich
  des Jahrestages der Unternehmensinitiative „ Made for Germany “ sagte Bundeskanzler
  Friedrich Merz, die Initiative sei eine ermutigende Botschaft für das ganze Land.
  Er hob die Erfolge der Initiative hervor – seit ihrem Start hat sich die Mitgliederzahl
  mehr als verdoppelt und die Unternehmen haben Investitionen in Höhe von über 800
  Milliarden Euro zugesagt. „S ie senden auch ein wichtiges Signal an die Menschen
  in unserem Land, ein Signal an Arbeitnehmerinnen und Arbeitnehmer, dass die Wirtschaft
  in die Verantwortung geht “, sagte der Bundeskanzler. Die Unternehmen seien in der
  Lage, die Herausforderungen in Deutschland anzunehmen und sich im weltweiten Wettbewerb
  auch zu behaupten. Daraus ergebe sich zusammen mit dem Sondervermögen für Investitionen
  und Klimaschutz eine der größten Innovationsinitiativen. Die Initiative „ Made for
  Germany “ wurde im Juli 2025 mit 60 Unternehmen gegründet und besteht mittlerweile
  aus 147 Unternehmen – darunter Start-ups sowie mittlere und große Unternehmen. Die
  Initiative will zur Verbesserung des Investitionsklimas in Deutschland beitragen.
  Dafür investieren die Unternehmen unter anderem in neue Standorte in Deutschland
  – aber auch in Forschung und Entwicklung sowie in die Modernisierung deutscher Infrastruktur. Die
  Investitionszusagen der Teilnehmenden belaufen sich inzwischen auf über 800 Milliarden
  Euro für den Zeitraum zwischen 2025 und 2028. Lieber Roland Busch, lieber Christian
  Sewing, lieber Martin Blessing, meine sehr geehrten Damen und Herren, herzlichen
  Dank für die Einladung und die freundliche Begrüßung heute. Ich freue mich, dass
  wir zusammen das einjährige Bestehen der Initiative „ Made for Germany “ feiern
  können. Wir können es wirklich feiern, denn es ist ein großer Erfolg. Als wir uns
  vor einem Jahr zur Auftaktveranstaltung im Bundeskanzleramt getroffen haben, da
  hatten wir Zusagen von gut 600 Milliarden Euro bis zum Jahr 2028. Diese Summe ist
  mittlerweile auf über 800 Milliarden Euro angewachsen. Herr Busch, Sie haben es
  gerade gesagt: Die Zahl der Mitglieder dieser Initiative, die Zahl der Unternehmen,
  die konkrete Investitionszusagen am Standort Deutschland geben, hat sich auf über
  140 verdoppelt. Man kann es einfach so sagen: Hier in diesem Raum sitzt Zuversicht,
  hier in diesem Raum sitzt Optimismus, hier in diesem Raum sitzt auch Vertrauen in
  den Wirtschaftsstandort Deutschland. Dafür möchte ich mich ganz herzlich bei Ihnen
  allen bedanken. Das ist eine nicht nur notwendige, sondern vor allem ermutigende
  Botschaft in diesen Tagen – für mich, für die gesamte Bundesregierung, aber vor
  allem für unser Land, für die Bundesrepublik Deutschland. Wir sind – das sage ich
  ganz offen und ehrlich – noch nicht da, wo wir in der Bundesregierung zum jetzigen
  Zeitpunkt im Herbst 2026 sein wollten, aber wir haben einiges auf den Weg gebracht.
  Dass Sie dabeibleiben, dass sich diese Initiative so gut entwickelt, dass „ Made
  for Germany “ wirklich eine Marke geworden ist, das ist ein starkes Signal, das
  auch mir persönlich Mut macht. Meine Damen und Herren, die Investitionszusagen sind
  nicht nur von volkswirtschaftlicher und strategischer Bedeutung für den Standort
  Deutschland, sie senden auch ein wichtiges Signal an die Menschen in unserem Land,
  ein Signal an Arbeitnehmerinnen und Arbeitnehmer, dass die Wirtschaft in die Verantwortung
  geht, dass sie bereit ist, am Standort Deutschland zu investieren und einfach auch
  an junge Menschen in Deutschland die Botschaft zu geben: Es lohnt sich, in Deutschland
  zu investieren. – Ich glaube, das ist die wichtigste Botschaft, die wir in diesen
  Tagen geben können. Ihre Unternehmen sind in der Lage, die Herausforderungen der
  heutigen Zeit in Deutschland anzunehmen und sich auch im weltweiten Wettbewerb zu
  behaupten. Wenn wir das zusammennehmen mit dem Sondervermögen für Infrastruktur
  und Klimaneutralität, ergibt sich eine der größten Innovations- und Investitionsinitiativen
  der vergangenen Jahrzehnte, die wir in Deutschland gesehen haben; ich komme gleich
  darauf zurück. Genau das schafft Wachstum, und das schafft Arbeitsplätze in Deutschland.
  Diese Investitionen erhöhen auch die Produktivität unseres Wirtschaftsstandortes.
  Genau darauf sind wir dringend angewiesen, um unseren Wohlstand in der Zukunft zu
  erhalten. Das ist die abstrakte Version der Geschichte. Aber das Großartige ist:
  Es wird jetzt sehr konkret. – Herr Busch, Sie haben gerade schon einige Beispiele
  genannt. Dank der Investitionen von Unternehmen, die hier vertreten sind, sahen
  wir im vergangenen Jahr etwa die Eröffnung der industriellen KI - Cloud von Telekom
  und SAP in München. Dadurch werden die souveränen KI -Rechenkapazitäten in Deutschland
  um bis zu 50 Prozent erhöht, spezifisch für die Bedarfe der schon genannten industriellen
  KI -Anwendung. Wir sehen die Eröffnung der Smart Power Fab von Infineon in Dresden
  – das haben Sie gerade auch angesprochen –, die nicht nur 1.000 neue Arbeitsplätze
  schafft, sondern auch zur Resilienz der Lieferketten für unser Land beiträgt. Wir
  sehen den Ausbau des Gründungsstandortes von Zeiss in Jena zu einem der hochmodernsten
  integrierten Hightech -Campus in Europa. Wir sehen die Weiterentwicklung des Standorts
  von Festo im saarländischen Rohrbach, mal ganz am anderen Ende der Republik, zum
  Leitwerk und damit zu einem der weltweit führenden Zentren für Linear- und Automatisierungstechnologie.
  Und wir sehen, was mich besonders freut, den Aufbau von Forschungs- und Entwicklungshubs
  für Laserfusion, unter anderem durch Marvel Fusion. Meine Damen und Herren, das
  ist wirklich eine großartige Sache. Wir wissen noch nicht, ob diese Technologie
  eines Tages wirklich zu einem Fusionsreaktor am Netz führt, aber wir haben den Optimismus,
  die Zuversicht. Das ist ja auch der Anspruch im Koalitionsvertrag, dass wir den
  ersten Fusionsreaktor auf der Welt in Deutschland ans Netz nehmen wollen. Über jedes
  dieser einzelnen Projekte könnten wir jetzt lange sprechen. Das würde sich lohnen,
  weil es in vielfältiger Hinsicht spannend ist. Aber das schaffen wir heute Abend
  nicht, denn es sind mittlerweile insgesamt 300 Leuchtturmprojekte dieser Art, die
  Sie als Unternehmen auch gemeldet haben. Jedes einzelne dieser Projekte verschafft
  uns einen Ausblick auf unsere Zukunft in Deutschland. Es geht um Investitionen in
  souveräne Recheninfrastruktur, damit wir in Zukunft in Deutschland industrielle
  Datenschätze heben können und sie für KI -Anwendungen nutzen können. Erlauben Sie
  mir an dieser Stelle etwas zu sagen, insbesondere mit einem Appell an den Mittelstand:
  Der Mittelstand in Deutschland muss seine Daten besser nutzen. Wenn der Mittelstand
  in Deutschland diesen Datenschatz hebt und ihn nutzbar macht, dann haben wir einen
  der größten Standortvorteile auf der Welt, weil kein zweites Land auf der Welt über
  einen so vielfältigen und tief gestaffelten industriellen Mittelstand wie Deutschland
  verfügt. Bitte öffnen Sie sich für diese Möglichkeiten, auch im Zusammenhang mit
  zukünftigen Investitionen. Ich will hinzufügen: Es gibt Investitionen in neue und
  erneuerbare Energiequellen, durch die wir Emissionen reduzieren und resilienter
  werden können. Es geht um moderne Medizintechnik. Auch dafür: ein Standort wie kaum
  ein zweiter auf der Welt. Ich habe dem neuen Bundesgesundheitsminister gesagt: Du
  übernimmst nicht nur ein großes Aufgabengebiet in der sozialen Sicherung, sondern
  du übernimmst die Zuständigkeit für den am schnellsten wachsenden Sektor unserer
  Volkswirtschaft. ‑ Das ist der gesamte medizinische Bereich, angefangen bei der
  Geburtshilfe, über die gesamte Wertschöpfungskette der medizinischen Versorgung,
  bis hin zur Betreuung in Alten- und Pflegeheimen. Wir sehen das immer als einen
  Kostenfaktor. Ja, es ist ein gewaltiger Kostenfaktor. Aber es ist auch ein Wirtschaftsfaktor
  für unser Land. Noch einmal: der am schnellsten wachsende Sektor unserer Volkswirtschaft,
  wenn man diesen gesamten Sektor einschließlich der Medizintechnik, der pharmazeutischen
  Industrie zusammennimmt. Wir gehen ganz gezielt in die Erhöhung unserer Verteidigungsfähigkeit
  durch den Bau von modernsten Produktionsstätten. Es geht um Robotik, es geht um
  kritische Rohstoffe, die wir zum Beispiel aus gebrauchten Batteriezellen zurückgewinnen
  können, usw. Kurzum: Hier bei Ihnen, meine Damen und Herren, wird ganz konkret und
  greifbar Zukunft für Deutschland gemacht. – Darum geht es, wenn wir jetzt ganz konkret
  über Wachstum und Wettbewerbsfähigkeit unseres Landes sprechen. Darum geht es für
  Sie mit dieser Initiative „ Made for Germany “. Darum geht es auch mir als Bundeskanzler
  und uns in der Bundesregierung. Wir wollen Sie und alle Ihre Mitarbeiterinnen und
  Mitarbeiter dabei unterstützen, in die Zukunft unseres Landes zu investieren. Wir
  wollen es Ihnen und uns allen zusammen leichter machen. Das ist die wichtigste Botschaft.
  In der Politik kann man dieses Zukunftsbild zeichnen. Aber zum Leben erwecken können
  nur Sie es in Ihren Unternehmen. Ja, um das zu erreichen, müssen wir etwas tun,
  müssen wir mehr tun. Der Bedarf an Strukturreformen in unserem Land ist groß. Darüber
  haben wir ausführlich vor einem Jahr im Bundeskanzleramt gesprochen. Darüber haben
  wir auch vor einem halben Jahr auf der Hannover Messe gesprochen, die, wie ich finde,
  übrigens eine der erfolgreichsten Hannover Messen war, die ich in den vergangenen
  Jahren besucht habe, obwohl die Zahl der Aussteller kleiner geworden ist. Aber auch
  die Zusammenarbeit mit Brasilien, kurz nachdem das MERCOSUR -Abkommen in Kraft getreten
  ist, für das wir uns auch sehr auf der europäischen Ebene eingesetzt haben ‑ ‑ ‑
  Übrigens einmal in Klammern hinzugefügt: Die Entscheidung, diesem Abkommen im Europäischen
  Rat zuzustimmen, erstmalig einem Handelsabkommen der Europäischen Union zuzustimmen,
  obwohl Frankreich nicht zugestimmt hat, ist mir nicht ganz leichtgefallen. Ich habe
  es trotzdem getan, es mit dem Staatspräsidenten von Frankreich auch abgestimmt und
  ihm gesagt: Ich werde zustimmen, damit dieses Abkommen in Kraft treten kann. Kurze
  Zeit darauf folgte die Hannover Messe mit Brasilien als Partnerland. Ich finde,
  es war ein großartiger Erfolg und auch eine sehr schöne Sequenz in den Entscheidungen.
  Meine Damen und Herren, wir haben einiges an Gesetzgebungsarbeit geleistet. Ich
  will hier nur das Infrastruktur-Zukunftsgesetz nennen. Es ist ein Gesetz, das uns
  die Beschleunigung beim Straßenbau, bei Brücken, Schienen und Industrieanlagen ermöglicht,
  sodass im Infrastrukturausbau jetzt auch eine wirkliche Dynamik entsteht. Wir haben
  das Geld und wir haben jetzt auch die regulatorischen Möglichkeiten geschaffen.
  Das Gesetz ist seit dem 21. Juli in Kraft. Diejenigen, die aus dem Rhein-Ruhr-Gebiet
  oder aus dem Rhein-Main-Gebiet kommen, wissen, dass es dort eine Autobahnverbindung
  gibt, die wir mit größter Mühe innerhalb eines Zeitraums von knapp vier Jahren neu
  gebaut haben. Das ist die berühmte Sauerlandlinie, A 45, Rahmedetalbrücke. Sie ist
  für den Verkehr untauglich geworden, gesprengt und neu aufgebaut worden, innerhalb
  von vier Jahren, mit Hunderten von Ausnahmegenehmigungen. Das, was wir da mit Ausnahmegenehmigungen
  gemacht haben, weil es dringend notwendig war, einschließlich des Verzichts auf
  ein neues Planfeststellungsverfahren, ist jetzt für alle Infrastrukturvorhaben in
  Deutschland möglich. Wir haben das durch dieses Gesetz ermöglicht. Ersatzbauten
  brauchen kein neues Planfeststellungsverfahren mehr. Wir können das alles jetzt
  beschleunigt machen. Dieser Infrastrukturausbau steht unter dem besonderen öffentlichen
  Interesse, und dieses besondere öffentliche Interesse verdrängt alle anderen Genehmigungsverfahren.
  Deswegen ist das jetzt eine richtige Entscheidung, die uns auch ermöglicht, schnell
  die Infrastruktur auszubauen. Wir haben die Hightech Agenda Deutschland beschlossen.
  Wir konzentrieren uns durch entsprechende Entscheidungen beim Bürokratierückbau
  auf die wesentlichen Begrenzungen hinsichtlich der Bürokratie. Wir haben vor dem
  Sommer verabredet, dass wir auch den Arbeitsmarkt flexibilisieren wollen. Da haben
  wir einiges nachzuholen. Wir werden das nächste Woche im Koalitionsausschuss besprechen,
  weil hier noch eine ganze Reihe von Arbeitsmarktgesetzgebung folgen muss. Aber die
  Krankenversicherungsstrukturreform ist beschlossen, was den ersten Teil angeht,
  und in Kraft. Eine Pflegereform wurde heute Morgen im Bundeskabinett beschlossen
  und auf den parlamentarischen Weg gebracht, ebenso eine Kapitaldeckung in der gesetzlichen
  Rentenversicherung, vorgeschlagen durch die Kommission; ein wichtiger Schritt für
  unser Land. Meine Damen und Herren, das hätten wir schon vor 30 Jahren so machen
  müssen, wie viele andere Länder auf der Welt es längst gemacht haben, dass ein wesentlicher
  Teil der Altersversorgung für die Breite der Bevölkerung kapitalgedeckt ist. Wir
  machen es jetzt, und die geniale Idee der Kommission war, das nicht in der zweiten
  oder dritten Säule zu machen, sondern in der ersten, sodass automatisch alle sozialversicherungspflichtigen
  Arbeitnehmerinnen und Arbeitnehmer in Deutschland eine zusätzliche kapitalgedeckte
  Altersversorgung haben. Ein kurzer Blick noch auf die Europäische Union: Wir werden
  in der übernächsten Woche im Europäischen Rat erneut über die Kapitalmarktunion
  oder, wie es jetzt heißt, über die Spar- und Investitionsunion sprechen. Hierbei
  geht es nicht in erster Linie um die Frage der Anpassung der Haftungsregime, sondern
  es geht um die Öffnung der Kapitalmärkte auch zum Beispiel für die Börsengänge,
  die wir in Europa gerne hätten, die wir zurzeit noch in viel zu großer Zahl in den
  USA sehen. Wir wollen die in Europa haben. Das setzt aber voraus, dass wir einen
  breiteren und tieferen Kapitalmarkt in der gesamten Europäischen Union haben. Nun,
  das sind alles nur Ausschnitte. Sie sollen an meiner Entschlossenheit nicht zweifeln,
  dies alles jetzt auch weiter Schritt für Schritt umzusetzen. Wenn das alles einigermaßen
  gut gelingt – es gibt ja durchaus Zweifel an der Bereitschaft der Bundesregierung,
  ob wir das wirklich wollen –, wenn es einigermaßen gut gelingt, diese Dinge dann
  auch tatsächlich ins Gesetz zu bringen, dann sind wir in Deutschland einen großen
  Schritt nach vorn gekommen. Wir kommen nur so wirklich weiter. Nur so werden wir
  auch tragfähiges Wachstum in der längeren Perspektive haben. Wir haben in diesem
  Jahr ein Wachstum von 1,3 Prozent. Die Wirtschaftsforschungsinstitute haben das
  nach oben korrigiert. Dafür sind wir dankbar. Das ist das Ergebnis auch von politischen
  Entscheidungen. Aber ich gebe zu: Es ist auch das Ergebnis der Entscheidung, mit
  sehr viel Schulden zu investieren. Das ist noch kein selbsttragender Aufschwung
  für die nächsten Jahre. Die Prognosen für das Jahr 2027 gehen wieder leicht nach
  unten. Das müssen wir korrigieren, indem wir substanzielle Entscheidungen treffen,
  Reformen in diesem Land auf den Weg bringen, damit das auch wirklich tragfähig und
  dauerhaft bleibt. In diesem Sinne, meine Damen und Herren, noch einmal vielen Dank!
  Der Geist dieses Abends ist klar: Wir arbeiten mit voller Kraft am Standort Deutschland,
  Projekt für Projekt, Entscheidung für Entscheidung, und dass es sich bei dem, was
  ich hier gerade sage, nicht um Motivations- Voodoo handelt, zeigen die eben genannten
  Zahlen. Vielleicht füge ich noch eine Bemerkung hinzu, weil ich auch Verena Pausder
  hier sehe: Wir sehen Rekordzahlen bei der Gründung von Start-ups . Das Jahr 2025
  war schon ein Rekordjahr. Das Jahr 2026 hat den Rekord des Jahres 2025 schon im
  Sommer eingeholt. Wir haben zehn Unicorns in diesem Jahr in Deutschland hinzugewonnen.
  Jetzt sind es 39. In den ersten neun Monaten des Jahres haben Start-ups acht Milliarden
  Euro an Wagniskapital eingeworben. Im gesamten letzten Jahr waren es 7,5 Milliarden
  Euro. Sie sehen also: Dieses Momentum verdanken wir, und ich will es wirklich noch
  einmal sagen, ganz wesentlich Ihnen hier im Saal, Ihrem Engagement für den Standort
  Deutschland. Lassen Sie uns dieses Momentum nutzen! Auch deshalb organisieren wir
  ja mit der tatkräftigen Unterstützung von Martin Blessing die Investorenkonferenz
  „ Invest in Germany “ in der übernächsten Woche. Herzlichen Dank unserer Wirtschaftsministerin
  Katherina Reiche und diesem, meinem Investitionsbeauftragten Martin Blessing, auch
  für die Vorbereitung dieser Konferenz in zwei Wochen. Ich freue mich, dass viele
  von Ihnen auch daran teilnehmen werden. Als Mitglieder dieser Initiative „ Made
  for Germany “, meine Damen und Herren, sind Sie wichtige Multiplikatoren, auch auf
  dem internationalen Parkett. In diesem Sinne noch einmal sehr, sehr herzlichen Dank.
  Ich freue mich auf unseren weiteren Austausch und vor allem auf ein weiteres Jahr
  „ Made for Germany “. Herzlichen Dank!'
