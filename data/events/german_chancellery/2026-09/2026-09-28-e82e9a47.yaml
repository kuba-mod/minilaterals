title: Rede des Kanzlers anlässlich der Einweihung der Helmut-Kohl-Straße und Rue
  François Mitterrand „Staatsmänner haben Brücken gebaut“
text: '„Europa ist die Lösung“, betonte der Bundeskanzler bei der bei der Einweihung
  der Helmut-Kohl-Straße und Rue François Mitterrand in Saarlouis. Bundeskanzler Friedrich
  Merz hat an der Einweihung der Helmut-Kohl-Straße und der Rue François Mitterrand
  in Saarlouis teilgenommen und mit einer Rede gewürdigt. Dabei betonte er: „Europa
  ist die Lösung. Europa ist der Weg, mit dem wir unsere Art zu leben sichern“. Die
  enge Partnerschaft zwischen Deutschland und Frankreich sei von zentraler Bedeutung
  für die Handlungsfähigkeit Europas und müsse immer wieder mit Leben gefüllt werden.
  Die nach François Mitterrand und Helmut Kohl benannten Straßen treffen auf einer
  Brücke über die Saar in der Stadt Saarlouis aufeinander. Für Merz ist dies ein starkes
  Symbol für die Brücken, die beide Staatsmänner zwischen Deutschland und Frankreich
  gebaut haben. Mit Blick auf das berühmte Bild von Mitterrand und Kohl in Verdun
  betonte er zudem die Bedeutung solcher Zeichen: Sie machten spürbar, was sich mit
  Worten nur schwer ausdrücken lasse, und erinnerten daran, was für Frieden, Freiheit
  und ein geeintes Europa auf dem Spiel steht. Die deutsch-französischen Beziehungen
  haben für die Bundesregierung einen hohen Stellenwert. Beide Länder unterhalten
  auf allen Ebenen der Regierungszusammenarbeit enge und vertrauensvolle Verbindungen.
  Die Geschlossenheit und enge Verbundenheit ging auch vom Deutsch-Französischen Ministerrat
  Ende Juli 2026 aus. Diese Freundschaft ist und bleibt für die Handlungsfähigkeit
  Europas von größter Bedeutung. Sehr geehrter Herr Oberbürgermeister, lieber Marc
  Speicher, lieber Jérôme Spinoza , liebe Gäste aus Frankreich, aus Luxemburg, aus
  Italien, liebe Freundinnen und Freunde der deutsch-französischen Freundschaft, liebe
  Kolleginnen und Kollegen aus dem Deutschen Bundestag und dem saarländischen Landtag,
  meine Damen und Herren, herzlichen Dank für die sehr freundliche Begrüßung. Was
  für ein wunderbarer Rahmen, vor allem mit den Kindern und mit den Schülerinnen und
  Schülern! Ganz besonders herzlichen Dank an euch, dass ihr dabei seid und heute
  für diese Feierstunde den musikalischen Rahmen gebt. Und was für ein wunderbares
  Symbol! Diese Stadt – Marc Speicher hat es gesagt: seit 2006 Europastadt – benennt
  eine Straße nach einem großen französischen Staatspräsidenten und wählt dafür eine
  Straße aus, die in eine bestehende Straße mündet, die bereits den Namen eines großen
  deutschen Bundeskanzlers trägt. Beide Straßen weihen wir heute ein. Beide Straßen
  tragen den Namen großer europäischer Staatsmänner, François Mitterrand und Helmut
  Kohl, die beide Brücken gebaut haben und Brücken gefestigt haben zwischen zwei Nationen,
  die furchtbare Kriege, fürchterliche Erfahrungen von Gewalt, Rachegedanken und tiefes
  Misstrauen voneinander getrennt haben. Wo treffen heute diese beiden Straßen aufeinander?
  Mitten auf einer Brücke, hier auf dieser Brücke über die Saar. Meine Damen und Herren,
  liebe Freundinnen und Freunde, Politik und historischer Fortschritt brauchen Symbole.
  Sie machen sinnfällig und überhaupt erst spürbar, was sich vielleicht mit Worten
  nur in Grenzen sagen und mit vielen Worten kaum aussprechen lässt. Ein unvergessliches
  Symbol ist jene Geste von Verdun, die diese beiden Männer miteinander gefunden haben:
  François Mitterrand und Helmut Kohl reichen sich über den Gräbern hunderttausender
  Gefallener die Hand, halten einander die Hand, während sie nebeneinander stehend
  der unzähligen jungen Männer beider Länder gedenken, die sinnlos ihr Leben verloren
  haben. Dieses Bild – so kann man es heute wohl sagen – ist eine Ikone der Geschichte
  des 20. Jahrhunderts geworden, für meine Generation jedenfalls zu einem der politischen
  Bilder schlechthin, zu einem Symbol für die menschliche Fähigkeit zum Frieden. Das
  war 1984. Lieber Marc Speicher, ich habe in dieser Zeit im Saarland gelebt – ich
  gebe zu: in Saarbrücken. Aber ich habe diese Zeit auch genutzt, um das erste Mal
  überhaupt nach Verdun zu reisen und anzuschauen, was dort bis heute ausgestellt
  ist. Es war kein Geringerer als der luxemburgische Ministerpräsident, der einmal
  gesagt hat: Wer Europa verstehen will, der soll die Gräber von Verdun anschauen.
  Aber wahr ist auch: Schon die heute 50-Jährigen haben die Emotionen, die wir damals
  geteilt haben, die die Zeitgenossen damals mit diesem Bild und mit dieser Geste
  verbunden haben, nicht erlebt und nicht empfinden können. Noch weit älter muss man
  sein, um noch gefühlt zu haben, wie sehr beide Kriege in Europa die eigenen Familien
  geprägt und auch traumatisiert haben. Das wiederum zeigt: Wir müssen immer wieder
  neu solche Symbole finden und zugleich immer wieder neu auch die Worte, die uns
  deutlich machen, was auf dem Spiel steht – was auf dem Spiel steht, solange wir
  als Menschen mit allen unseren Fehlern in einer unvollkommenen Welt leben. Ja, es
  scheint uns heute in der Tat undenkbar, dass Deutsche und Franzosen gegeneinander
  Krieg führen. Aber es ist nicht undenkbar, dass wir vergessen, wie sehr der europäische
  Friedenszustand, den wir – sagen wir doch, wie es ist – historisch einmalig gegenwärtig
  erleben, abhängt von der Einigkeit in Europa; noch mehr: wie er abhängt von der
  Weiterentwicklung dieses Europas, von der Einigkeit, von einer Vertiefung dieser
  Einigkeit. Diese Vertiefung braucht immer wieder neu mit Leben gefüllte Partnerschaft
  zwischen zwei großen Volkswirtschaften, zwischen diesen beiden großen Volkswirtschaften
  und diesen zwei starken Ländern Europas, Deutschland und Frankreich. Mit Leben gefüllt,
  das heißt auch, dass nicht nur zwei Straßen auf einer Brücke aufeinandertreffen,
  sondern dass immer neu Menschen beider Länder aufeinandertreffen und unzählige Brücken
  zwischen unseren Nationen bauen. Es gehört zu dem vielen Guten in unserem Land,
  das wir oft nicht genug würdigen, dass es in großer Zahl diese Menschen gibt, dass
  es dieses Aufeinandertreffen in vielfältiger Weise gibt, auch über die Kontakte
  dieser Stadt Saarlouis mit ihren Städtepartnerschaften und Freundschaften, über
  diese vielen Initiativen, die heute hier auch vertreten sind, und über das alltägliche
  Leben in dieser europäischen Großregion Saar-Lor-Lux , in der Europa ein Lebensgefühl
  und eine Lebenspraxis im Alltag ist. Wir brauchen, meine Damen und Herren, dieses
  europäische Gefühl, weil wir jede Ressource brauchen, die uns heute hilft, es wirklich
  erneut zu verstehen: Europa ist die Lösung. Europa ist der Weg, mit dem wir unsere
  Art zu leben sichern, nämlich frei, solidarisch, in rechtlicher Gleichheit und selbstregierend
  und dabei Minderheiten schützend, wie wir diese Art zu leben in der Welt heute verteidigen
  und bewahren können. Sagen wir, wie es ist: Europa wird heute angegriffen. Wir sagen
  „hybrid“. Aber das Wort beginnt schon nach Verharmlosung zu klingen. Die Werte,
  für die Europa steht, haben auch nach 1990 eben nicht die ganze Welt erobert. Im
  Gegenteil: Diese Werte ziehen Hass auf sich, und deshalb ist Europa bedroht. Nur
  gemeinsam kann sich Europa gegen diese Bedrohung verteidigen. Manche Dinge werden
  lange gesagt, bevor sie tatsächlich beherzigt werden. Manche Einsichten bleiben
  lange bloße Worte, bevor sie im politischen Handeln wirksam werden. Wir stehen in
  Europa jetzt endlich an einem solchen Punkt. Europa hat endlich begonnen, für seine
  eigene Sicherheit, für die Sicherung seiner Freiheit, für die Souveränität Europas
  das Nötige zu tun. Wir beginnen endlich, den europäischen Pfeiler der NATO wirklich
  zu stärken. Aber der Weg von der Machtvergessenheit zur Friedensmacht Europa ist
  weit. Manche bekämpfen ihn als Aufrüstung, wie in den 80er-Jahren die Aufrüstung
  damals zur Abschreckung der Sowjetunion bekämpft worden ist. Aber so wie damals
  ist auch heute dieser Weg notwendig. Kohl und Mitterrand hätten das gewusst, und
  sie würden, trügen sie heute Verantwortung, auch diesen Weg gehen. Sie liebten die
  Freiheit, und sie wollten den Frieden, aus ganz unterschiedlichen politischen, parteipolitischen
  Richtungen kommend. Aber sie wussten auch, dass es Freiheit und Frieden auf dieser
  Welt nur gibt, wenn sie geschützt werden. Wir wollen uns verteidigen können, damit
  wir uns nicht verteidigen müssen. Dieser Satz bleibt unverändert richtig. Zugleich
  sehen wir in diesen Monaten einmal mehr – wie heißt es so schön –: Wo aber Gefahr
  ist, wächst das Rettende auch. Europa besinnt sich jetzt auf seine Stärken und auf
  das wirklich Wichtige. Der Druck, unter dem Europa, auch andere freie Länder dieser
  Welt, stehen, führt dazu, dass neue Gemeinsamkeiten gefühlt und neue Allianzen geschlossen
  werden. Auch alte Gemeinsamkeiten werden neu gefühlt. Wer hätte das vor einigen
  Jahren gedacht? Kanada wendet sich Europa zu. Auch Australien und Neuseeland am
  anderen Ende der Welt wollen, aus ihrer Geschichte historisch und ideell so viel
  in Verbindung mit uns, neu an Europa heranrücken. Überall in der Welt will man mit
  Europa regelbasiert und verlässlich Handel treiben. Und wir in Europa? Wir strecken
  neu allen die Hand aus, die unsere Werte teilen. Europa ist Teil des Westens. Wie
  der Westen, so ist auch Europa nicht in erster Linie ein geografisches, sondern
  ein normatives Projekt, ein Projekt von gemeinsamen Werten. Deshalb warten große
  Chancen auf ein Europa, das sich mit den freien Ländern dieser Welt verbindet und
  verbündet. Ergreifen wir also all diese Chancen, die sich uns heute neu zeigen.
  Diese Zeit, in der unser Europa unter Druck steht, vielleicht wie noch nie seit
  seiner Gründung, kann Europa zu einer neuen Blüte führen, zur neuen Blüte europäischer
  Freiheit, zur neuen Blüte europäischen Rechts, zur neuen Blüte europäischen Friedens,
  auch zur neuen Blüte europäischen Wohlstands. Das ist möglich. Unsere Väter und
  Vorfahren haben uns das eindrucksvoll gezeigt. Das ist erreichbar. François Mitterrand
  und Helmut Kohl haben sich genauso wie vor ihnen Konrad Adenauer und Charles de
  Gaulle auf diesen Weg gemacht. Sie haben diese Chancen ergriffen. Tun wir es heute
  bitte auch. Dank an die Stadt, Dank an alle diejenigen, die zu dieser großartigen
  Initiative beigetragen haben, Dank an alle diejenigen, die in diesem Geist europäisch
  in dieser Stadt und in dieser Region leben. Herzlichen Dank, Herr Oberbürgermeister,
  noch einmal für die Gelegenheit, dies hier heute zu sagen. Ich wünsche uns Europäern
  in diesem Sinne Freiheit, Frieden, eine gerechtere Welt, in der wir leben, hier,
  mitten in Europa.'
