title: Spritpreis-Entlastungspaket Bund und Länder beschließen Steuersenkung für Diesel
  und Benzin
text: 'Bund und Länder sorgen gemeinsam für schnelle Entlastung an der Tankstelle.
  Die kriegerischen Ereignisse und die erneute Eskalation im Nahost-Konflikt sorgen
  für Unsicherheiten an den Märkten. Diese Entwicklung ist verantwortlich für die
  hohen Spritpreise in Deutschland. Die Situation belastet nicht nur die Wirtschaft,
  sondern auch die Bürgerinnen und Bürger – Pendler, Freiberufler, Ehrenamtliche ebenso
  wie Familien. Bund und Länder sorgen nun gemeinsam für schnelle Entlastung. Der
  Bund wird die Energiesteuer auf Benzin und Diesel bis Ende 2026 um 14 Cent pro Liter
  senken. Inklusive Umsatzsteuer summiert sich die Steuerentlastung für Kraftstoffe
  so auf ca. 17 Cent pro Liter. Insgesamt sollen Bürgerinnen und Bürger und die Wirtschaft
  um rund 2,5 Milliarden Euro entlastet werden. Bund und Länder tragen die geplanten
  Entlastungen gemeinsam. Die Länder leisten einen Beitrag in einer Höhe von 1,25
  Milliarden Euro über einen Umsatzsteuerfestbetrag. In Abstimmung mit den Ländern
  und den Koalitionsfraktionen im Deutschen Bundestag soll das Entlastungspaket zum
  1. Oktober 2026 umgesetzt werden . Bundeskanzler Friedrich Merz: „Wer jeden Tag
  auf das Auto angewiesen ist, kommt an seine Belastungsgrenze. Wir handeln schnell
  und haben einen klaren Fahrplan für 2027. Wir zeigen, dass wir in der Krise widerstandsfähig
  sind und den Bürgerinnen und Bürgern helfen. Die Entlastung von immerhin 2,5 Milliarden
  Euro ist in Zeiten angespannter Haushalte kein Pappenstiel. Umso mehr freue ich
  mich, wie schnell wir dieses Paket geschnürt haben. Das ist ein starkes Signal für
  unser Land.“ Die unabhängige Monopolkommission und das Bundeskartellamt kommen zu
  dem Schluss, dass die Energiesteuersenkung bei Benzin und Diesel im Mai und Juni
  2026 weitgehend bei Verbraucherinnen und Verbrauchern angekommen ist. Die Maßnahme
  hat gewirkt: Der Tankrabatt hat seine Funktion erfüllt, in einer Phase besonders
  hoher Kraftstoffpreise Preisspitzen effektiv abzufangen. Die Bundesregierung wird
  Gespräche mit der Mineralölwirtschaft führen, mit dem Ziel, spätestens zum 1. Januar
  2027 einen vorübergehenden Spritpreisdeckel nach dem Vorbild Luxemburgs oder Belgiens
  einzuführen. Die Versorgungssicherheit muss gewährleistet sein. Missbräuchliche
  Preisaufschläge müssen unterbunden werden. Die Bundesregierung begrüßt zudem die
  Gespräche in der Europäischen Union, analog zum EU -Energiekrisenbeitrag 2022 Maßnahmen
  gegenüber der Mineralölwirtschaft zu prüfen. Die Bundesregierung wird die Preisentwicklung
  und mögliche wirtschaftliche Folgen weiterhin eng beobachten, um gegebenenfalls
  besonders betroffene Menschen und Unternehmen zielgerichtet zu entlasten. Der Bund
  schafft dafür die Voraussetzungen für einen einkommensbezogenen Direktauszahlmechanismus.
  Die Bundesregierung hat mit der dauerhaften Erhöhung der Pendlerpauschale für steuerliche
  Erleichterungen gesorgt. Pendlerinnen und Pendler profitieren deutlich stärker als
  zuvor. Außerdem erhalten Steuerpflichtige mit geringen Einkünften weiterhin die
  Mobilitätsprämie. Familien und Menschen mit geringen und mittleren Einkommen sollen
  durch die Reduzierung der Einkommensteuer ab 2027 steuerlich entlastet werden. In
  der Landwirtschaft wurde die Agrardiesel-Rückvergütung wieder vollständig eingeführt.
  Die Bundesregierung schärft zudem das Kartellrecht weiter, um die Preissetzung beim
  Tanken noch besser überwachen zu können.'
