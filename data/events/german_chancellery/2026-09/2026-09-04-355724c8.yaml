title: Versuchter Anschlag am Flughafen Leipzig/Halle Entschlossenes Vorgehen gegen
  hybriden Angriff
text: 'Bundesaußenminister Johann Wadephul und Bundesinnenminister Alexander Dobrindt
  äußerten sich zum versuchten Anschlag am Flughafen Leipzig/Halle. Die Bundesregierung
  ist zu dem Schluss gekommen, dass Russland den hybriden Angriff am Flughafen Leipzig/Halle
  vom 4. August 2026 zu verantworten hat. Dies teilten Bundesinnenminister Alexander
  Dobrindt und Bundesaußenminister Johann Wadephul am 1. September in Berlin mit.
  Gleichzeitig kündigten sie Maßnahmen an, mit denen die Bundesregierung auf den Angriff
  reagiert. Diese wurden innerhalb des Nationalen Sicherheitsrats und der Ressorts
  der Bundesregierung abgestimmt, Bundeskanzler Friedrich Merz war dabei eng eingebunden.
  „Zusammen betrachtet, belegen polizeiliche Ermittlungen, Tatmuster und nachrichtendienstliche
  Erkenntnisse eine russische Verantwortung für den versuchten Anschlag am Flughafen
  Leipzig“, so der Bundesinnenminister. Das Tatmuster lasse sich klar Russland zuordnen.
  Das gelte sowohl für das Ziel, die Tatmittel, die technische Expertise sowie den
  Einsatz von Low-Level -Agenten bei dem hybriden Angriff. Dies erlaube eine klare
  politische Attribuierung der Geschehnisse. Unabhängig davon sind die strafrechtlichen
  Ermittlungen und juristischen Verfahren in der Angelegenheit noch nicht abgeschlossen
  und laufen weiter. Bei der Attribuierung (Zuschreibung) eines hybriden Angriffs
  geht es darum, Ermittlungen durchzuführen, um ein vollständiges Bild des Vorfalls
  zu erhalten, zu belastbaren Erkenntnissen zu kommen und ihn auf politischer Ebene
  – nicht strafrechtlich – bestimmten Bedrohungsakteuren zuzuordnen. Bei den Ermittlungen
  in Leipzig standen drei Dimensionen im Vordergrund, die eine klare Attribuierung
  in Richtung Russland bestätigt haben: Erstens die Tatmuster und Dinge, die bei dem
  Angriff zum Einsatz gekommen sind, zweitens die polizeilichen und drittens die nachrichtendienstlichen
  Ermittlungen. Dabei hätte für eine eindeutige Zuordnung zu Russland bereits jede
  einzelne dieser Dimensionen ausgereicht. Die Bundesregierung beantworte diesen hybriden
  Angriff von Leipzig verhältnismäßig und besonnen, aber gleichermaßen entschlossen,
  betonte Innenminister Dobrindt. Sie erschwere so, „weitere hybride Maßnahmen in
  Deutschland und Europa durchzuführen“, unterstrich Minister Wadephul. Der Bundesaußenminister
  bestellte in der Folge den russischen Botschafter ein, um diesem die Maßnahmen in
  angemessener Form mitzuteilen. Als Reaktion kündigten die beiden Bundesminister
  eine entschlossene Verstärkung des Schutzes gegen hybride Angriffe an. Außenminister
  Wadephul erklärte, die Bundesregierung setze die Stärkung der deutschen Verteidigungsfähigkeit
  und ihre Unterstützung der Ukraine entschlossen fort. Hybride Bedrohungen bezeichnen
  verschiedene Formen koordinierter, illegitimer Handlungen staatlicher und staatlich
  gelenkter ausländischer Akteure zur Durchsetzung eigener Interessen zum Nachteil
  eines anderen Staates. Sie richten sich gegen unsere Werte und die freiheitliche
  demokratische Grundordnung. Zu ihnen zählen beispielsweise Desinformation, Cyber
  angriffe auf staatliche Stellen und Unternehmen, Spionage oder – wie in Leipzig
  – versuchte Sabotage von Kritischen Infrastrukturen. Sie bleiben außerhalb des Rahmens
  eines konventionellen militärischen Angriffs und betreffen alle politischen und
  gesellschaftlichen Ebenen. Dabei können verschiedene Mittel kombiniert werden, zum
  Beispiel diplomatische, militärische, wirtschaftliche oder technologische, sodass
  eine koordinierte Kampagne entsteht – für die aber kein Akteur des Auslands offen
  Verantwortung übernimmt. Der Bundesaußenminister kündigte in Absprache mit dem Bundeskanzler
  Maßnahmen an, mit denen die Bundesregierung auf den Vorgang reagiert: Die Bundesregierung
  geht davon aus, dass man im Kreml das Signal klar und deutlich verstanden hat. „Diese
  hybriden Angriffe erreichen ihr politisches Ziel nicht. Russland schadet sich am
  Ende selbst“, sagte der stellvertretende Regierungssprecher Steffen Meyer am 2.
  September in Berlin. Außenminister Wadephul erklärte, dass die Bundesregierung sich
  eng mit den Partnern in der NATO und der Europäischen Union abstimme und dies auch
  weiter tun werde. „Sie hat deren Unterstützung und unterstützt sie ihrerseits“,
  so der Minister. Die Außenminister der Europäischen Union versicherten Deutschland
  bei ihrem Treffen am 2. September in Irland ihre volle Solidarität und Unterstützung.
  Auch der NATO -Botschafterrat trat zu Beratungen zusammen. Bundeskanzler Merz stand
  in den vergangenen Tagen und Wochen sowohl mit NATO -Generalsekretär Mark Rutte,
  EU -Kommissionspräsidentin Ursula von der Leyen als auch vielen anderen Partnern
  zu diesem Thema in Kontakt.'
