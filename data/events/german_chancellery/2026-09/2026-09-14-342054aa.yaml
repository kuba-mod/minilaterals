title: Sitzung des Nationalen Sicherheitsrates im September 2026
text: Der Nationale Sicherheitsrat ist heute unter dem Vorsitz des Bundeskanzlers
  zusammengetreten. Nach dem hybriden Angriff Russlands in Leipzig am 4. August befasste
  sich der NSR heute erneut mit hybriden Bedrohungen und knüpfte damit an intensive
  Abstimmungen der NSR-Ressorts in den letzten Wochen an. Der NSR verschaffte sich
  ein umfassendes Lagebild. Er geht davon aus, dass Deutschland Ziel hybrider Angriffe
  Russlands bleibt. Er setzte die Beratungen zur Frage fort, wie die Bundesregierung
  auf künftige hybride Angriffe reagieren wird. Zudem nahm der NSR eine Bestandsaufnahme
  der im Rahmen des entsprechenden Aktionsplans vereinbarten Maßnahmen zur Abwehr
  hybrider Bedrohungen vor. Er beschloss neue Schritte gegen Spionage und Sabotage
  sowie zum Schutz kritischer Infrastruktur. Der NSR traf Verabredungen zum Abbau
  einseitiger Abhängigkeiten von strategischer wirtschaftlicher und sicherheitspolitischer
  Bedeutung für Deutschland. Er beschloss in diesem Zusammenhang eine zügige Novellierung
  des Investitionsprüfungsrechts und Maßnahmen, um eine diversifizierte und resiliente
  Versorgung mit kritischen Rohstoffen sicherzustellen. Hierzu hat die Bundesregierung
  im Rahmen des Aktionsplans Rohstoffpolitik mit dem Rohstofffonds ein zentrales Förderinstrument
  geschaffen. Der NSR befasste sich zudem erneut mit Fragen der militärischen und
  zivilen Verteidigung sowie mit dem sicherheitspolitischen Aspekt künstlicher Intelligenz.
