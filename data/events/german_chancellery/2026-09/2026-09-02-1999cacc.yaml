title: Im Kabinett beschlossen Für bezahlbare Windenergie auf See
text: Investitionen in Offshore -Anlagen werden durch das Windenergie-auf-See-Gesetz
  attraktiver. Das Bundeskabinett hat einen Gesetzentwurf für einen kostengünstigeren
  und optimierten Ausbau der Windenergie auf See beschlossen. Die Windenergie auf
  See – sogenannte Offshore -Windenergie – ist für eine zuverlässige Versorgung der
  Industrie mit Energie unverzichtbar. Sie ist damit ein essentieller Bestandteil
  einer sicheren und zunehmend unabhängigen Energieversorgung in Deutschland. Die
  Bundesregierung gibt mit dem Entwurf ein deutliches Signal für Planungs- und Investitionssicherheit
  für Offshore -Windenergieanlagen in Deutschland. Dabei werden konsequent die Kosten
  des Ausbaus in den Fokus genommen. Eine sichere, bezahlbare und saubere Energieversorgung
  ist ein zentrales Ziel der Bundesregierung. Dazu hatte sie zuletzt eine Reform des
  Erneuerbaren Energien-Gesetzes sowie das Netzanschlusspaket beschlossen. Lesen Sie
  hier , was die Bundesregierung darüber hinaus für niedrigere Energiekosten unternimmt.
  Die ambitionierten Ausbauziele bei den erneuerbaren Energien bleiben unverändert
  – auch bei der Windenergie auf See. Das nun beschlossene Gesetz richtet den weiteren
  Ausbau der sogenannten Offshore -Windenergie aber stärker auf Bezahlbarkeit, Kosteneffizienz
  und Versorgungssicherheit aus. Die Bundesregierung schafft so verlässliche Bedingungen
  für Investoren und macht Investitionen in Offshore -Anlagen attraktiver. Damit stärkt
  sie die Versorgungssicherheit, nationale Widerstandsfähigkeit und Unabhängigkeit.
