title: Im Kabinett beschlossen Sicherheit stärken, Freiheit bewahren, Radikalisierung
  verhindern
text: 'Der Schutz vor allen Formen des Extremismus soll verbessert werden. Mit einem
  im Kabinett beschlossenen Aktionsplan („ Sicherheit stärken, Freiheit bewahren,
  Radikalisierung verhindern – 10-Punkte-Plan zu einem besseren Schutz vor islamistischem
  Terrorismus“) reagiert die Bundesregierung auf die anhaltend hohe Bedrohungslage
  durch den islamistischen Terrorismus. Zuletzt hat der Anschlag am Rande des Christopher
  Street Day (CSD) in Berlin am 25. Juli 2026 dies auf tragische Art und Weise erneut
  vor Augen geführt. Die Bundesregierung unterstreicht mit dem Aktionsplan nochmals
  ihr Bestreben, die liberale und tolerante Gesellschaft in Deutschland zu verteidigen,
  Bürgerinnen und Bürger besser vor Terrorismus und Extremismus zu schützen und die
  innere Sicherheit zu stärken. Bundesinnenminister Alexander Dobrindt : „ Islamismus
  – und alle anderen Formen des Extremismus – werden konsequent mit den Mitteln des
  Rechtsstaats bekämpft.“ Der von Bundesinnenministerium und Bundesjustizministerium
  gemeinsam entwickelte Aktionsplan enthält zehn neu umzusetzende Maßnahmen. Vorgesehen
  ist unter anderem, die Regelungen zur elektronischen Aufenthaltsüberwachung (sogenannte
  „Fußfessel“) und zur Präventivhaft von Gefährdern zu vereinheitlichen. Zudem sehen
  die Maßnahmen weitere Änderungen im Strafrecht vor – beispielsweise die Erhöhung
  der Mindestfreiheitsstrafe für gefährliche Körperverletzungen mit Messern auf ein
  Jahr. Bundesjustizministerin Stefanie Hubig : „ Mit den 10 Maßnahmen machen wir
  Deutschland sicherer – ohne Abstriche bei Rechtsstaatlichkeit, Verhältnismäßigkeit
  und heute schon bewährten Instrumenten des Jugendstrafrechts.“ Der Maßnahmenkatalog
  sieht außerdem Änderungen im Jugendstrafrecht vor. Das Sicherheitsinteresse der
  Allgemeinheit soll ausdrücklich im Jugendgerichtsgesetz verankert werden. Darüber
  hinaus soll das Sicherheitsinteresse generell bei Bewährungsentscheidungen stärker
  berücksichtigt werden. Schließlich will die Bundesregierung die Prävention und Deradikalisierung
  stärken. Beispielsweise sollen Bund und Länder einen gemeinsamen Aktionsplan zur
  Islamismus-Bekämpfung erarbeiten. Neben den nun vom Kabinett beschlossenen Maßnahmen
  hat die Bundesregierung bereits zahlreiche Gesetzesentwürfe auf den Weg gebracht,
  um die innere Sicherheit zu stärken. Es werden unter anderem die Befugnisse der
  Sicherheits- und Strafverfolgungsbehörden sowie der Nachrichtendienste an die gestiegene
  Bedrohungslage angepasst. Zudem hat das Kabinett die Einführung einer IP-Adressenspeicherung
  verabschiedet. Weitere Informationen und den gesamten 10-Punkte-Plan finden Sie
  beim Bundesinnenministerium .'
