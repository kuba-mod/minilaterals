title: Im Kabinett Einkommensteuerreform beschlossen
text: 'Die Einkommensteuerreform soll vor allem Familien mit Kindern und Menschen
  mit geringen und mittleren Einkommen entlasten. Die Bundesregierung hat mit dem
  Entwurf eines Einkommensteuerreformgesetzes 2027 eine Reform der Einkommensteuer
  beschlossen. Damit sollen insbesondere Familien und Menschen mit geringen und mittleren
  Einkommen entlastet werden. Vorgesehen sind die Erhöhung des Kindergeldes sowie
  Verbesserungen beim Grund- und Kinderfreibetrag und beim Arbeitnehmer-Pauschbetrag.
  Der Steuertarif wird im Bereich zwischen 17.800 und 70.600 Euro Einkommen etwas
  abgeflacht. Die Maßnahmen sollen ab 2027 greifen und ab 2028 ihre volle Wirkung
  entfalten. Die Entlastung erfolgt in zwei Schritten – der erste 2027, die volle
  Entlastung dann ab 2028. Das heißt: Die Maßnahmen werden ab 2027 bereits spürbar
  sein und ab 2028 ihre volle Wirkung entfalten. Ab 2028 kann etwa eine berufstätige
  Familie mit zwei Kindern und einem zu versteuernden Gesamteinkommen von 60.000 Euro
  gegenüber heute um mehr als 600 Euro jährlich steuerlich entlastet werden. Das Entlastungsvolumen
  beträgt circa zehn Milliarden Euro pro Jahr. Die Gegenfinanzierung wird unter anderem
  durch Veränderung des Reichensteuersatzes ermöglicht. Auf diese Weise lässt sich
  das Steuersystem gerechter gestalten. Gleichzeitig werden Subventionen mit Augenmaß
  abgebaut und gezielt Arbeitsanreize gesetzt.'
