title: Bundeskanzler Merz nimmt am EU-Arktis-Gipfel im finnischen Rovaniemi teil
text: Bundeskanzler Friedrich Merz nimmt am 13. und 14. September 2026 mit weiteren
  EU-Partnern und Vertreterinnen und Vertretern der EU-Institutionen am EU-Arktis-Gipfel
  teil. Der Gipfel im finnischen Rovaniemi findet auf Einladung des finnischen Ministerpräsidenten
  Petteri Orpo statt. Das Treffen bietet die Gelegenheit, den gemeinsamen strategischen
  Ansatz der EU für die Arktis zu stärken.
