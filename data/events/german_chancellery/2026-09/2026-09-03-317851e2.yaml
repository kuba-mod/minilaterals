title: Bundeskanzler Merz stellt Ronald Rauhe als Staatsminister für Sport und Ehrenamt
  vor
text: 'Bundeskanzler Friedrich Merz hat heute den neuen Staatsminister für Sport und
  Ehrenamt ins Amt eingeführt. Der zweifache Kanu-Olympiasieger Ronald Rauhe ist ab
  sofort für die Sport- und Ehrenamtspolitik der Bundesregierung zuständig. Als langjähriger
  Spitzensportler bringt er vor allem umfangreiche persönliche Erfahrungen aus dem
  nationalen und internationalen Leistungssport in sein neues Amt ein. Bundeskanzler
  Friedrich Merz betonte anlässlich der Vorstellung: „Ich freue mich sehr, dass ich
  Ronald Rauhe dafür gewinnen konnte, diese Aufgabe zu übernehmen. Ronald Rauhe ist
  der richtige Mann, um auch hier im Bundeskanzleramt den großen Bereich des Sports
  und des Ehrenamts in unserer Republik zu stärken und zu unterstützen. Wir wollen
  damit auch ein Zeichen setzen, dass wir den deutschen Sport als ein wichtiges Aufgabengebiet
  sehen. Wir haben in wenigen Tagen die Entscheidung darüber, welcher Ort in Deutschland
  sich um die übernächsten Olympischen und Paralympischen Spiele bewirbt. Wir wollen
  uns dann, wenn die Entscheidung feststeht, wo sie stattfinden sollen, mit ganzer
  Kraft für diese Olympischen Spiele bewerben.“ Der neue Staatsminister ist als Kanute
  zweifacher Olympiasieger, 16-facher Weltmeister, 31-facher Europameister und Träger
  von über 70 deutschen Meistertiteln. „Es ist für mich eine große Ehre und Verantwortung,
  künftig als Staatsminister für Sport und Ehrenamt tätig zu sein. Als ehemaliger
  Spitzensportler weiß ich, was es bedeutet, das gesamte Leben einem Ziel zu widmen.
  Nach Monaten und Jahren harter Arbeit einen Erfolg zu erringen, auf dem Treppchen
  zu stehen und die Nationalhymne zu hören, ist das Größte. Diese Motivation nehme
  ich in mein neues Amt mit. Ich werde sie nutzen, um gemeinsam mit Athletinnen und
  Athleten, Trainerinnen und Trainern sowie den vielen Millionen ehrenamtlich Engagierten
  die Rahmenbedingungen für Sport und Ehrenamt in unserem Land weiter zu verbessern.
  Der Sport hat mir in meinem Leben unheimlich viel gegeben. Jetzt möchte ich etwas
  zurückgeben, und dabei liegen mir drei Dinge ganz besonders am Herzen. Wir wollen
  Olympische und Paralympische Spiele wieder nach Deutschland holen, und diese Bewerbung,
  das kann ich Ihnen versprechen, werde ich mit voller Kraft vorantreiben. Sie ist
  unser Zugpferd für eine Generation Olympia, mit Kindern, die wieder Vorbilder haben,
  die sich wieder etwas zutrauen und sich vor allen Dingen eines erlauben dürfen,
  nämlich wieder groß zu träumen. Deutschland soll wieder zu den erfolgreichsten Sportnationen
  der Welt gehören. Damit aus Talent auch wieder Gold wird, werden wir die Spitzensportreform
  konsequent weiter vorantreiben. Denn unsere Athletinnen und Athleten brauchen Rahmenbedingungen,
  in denen Hochleistung auch entstehen kann, sicher und mit starken Trainerinnen und
  Trainern an ihrer Seite und vor allen Dingen mit Stolz, mit Stolz, unser Land zu
  vertreten und die deutsche Fahne zu tragen, für ein Land, in dem täglich Millionen
  Menschen Verantwortung in einem Ehrenamt übernehmen, in Sportvereinen, bei der Feuerwehr
  oder in der Nachbarschaft, meistens ohne eine große Bühne und ohne Applaus. Genau
  diese Menschen halten unser Land zusammen. Sie verdienen weniger Hürden, mehr Unterstützung
  und vor allem unsere volle Wertschätzung“, erklärte Rauhe. Der neue Staatsminister
  wird sich beim Ehrenamt für den Abbau bürokratischer Hürden, für die Gewinnung ehrenamtlichen
  Nachwuchses und einen stärkeren Schutz engagierter Bürgerinnen und Bürger einsetzen.
  Mit dem Zukunftspakt Ehrenamt sollen Anerkennung und Wertschätzung gestärkt und
  die Voraussetzungen für freiwilliges Engagement weiter verbessert werden.'
