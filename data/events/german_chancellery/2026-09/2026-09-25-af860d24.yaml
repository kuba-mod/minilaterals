title: Bundeskanzler Merz empfängt den Präsidenten der Republik Kasachstan, Tokajew
text: Bundeskanzler Friedrich Merz wird am 29. September 2026 um 16 Uhr den Präsidenten
  der Republik Kasachstan, Kassym-Schomart Tokajew, im Bundeskanzleramt empfangen.
  In einem gemeinsamen Gespräch werden Themen wie der Ausbau der bilateralen Energie-
  und Rohstoffpartnerschaft, Fragen der regionalen Zusammenarbeit sowie die internationale
  Sicherheitspolitik im Mittelpunkt stehen. Eine gemeinsame Pressekonferenz ist für
  17 Uhr geplant.
