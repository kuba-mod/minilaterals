title: Besuch des Präsidenten des Europäischen Rates, António Costa, in Berlin
text: Bundeskanzler Friedrich Merz empfängt am Mittwoch, den 9. September 2026, ab
  17 Uhr den Präsidenten des Europäischen Rates, António Costa, im Bundeskanzleramt.
  Anlass des Besuchs ist die jährliche Hauptstadtreise von Präsident Costa, der sogenannten
  „Tour des Capitales“. Der Bundeskanzler wird sich mit ihm über wichtige Themen der
  zahlreichen bevorstehenden Treffen des Europäischen Rates im zweiten Halbjahr 2026
  austauschen. Im Zentrum steht dabei die Arbeit am nächsten Mehrjährigen Finanzrahmen
  der EU für die Jahre 2028 bis 2034. Im Anschluss an das Treffen ist eine Pressekonferenz
  geplant.
