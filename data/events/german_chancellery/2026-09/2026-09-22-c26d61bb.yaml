title: Jede Aktion zählt – gemeinsam sichtbar! Nachhaltigkeit erleben und mitgestalten
text: 'Je mehr Veranstaltungen im Aktionszeitraum stattfinden, desto größer das gemeinsame
  Zeichen für eine nachhaltige Welt. Foto: Rat für Nachhaltige Entwicklung (RNE) Bei
  den Deutschen Aktionstagen Nachhaltigkeit soll vorbildliches Engagement in Deutschland
  sichtbar gemacht werden: Dabei können alle mitmachen, die sich mit einer Aktion
  an den 17 Nachhaltigkeitsziele (Sustainable Development Goals, SDGs) der Vereinten
  Nationen beteiligen wollen. Angesprochen sind dabei Privatpersonen, aber auch soziale
  Einrichtungen, Verbände oder Kommunen. Die Aktionstage finden vom 18. September
  bis 8. Oktober statt. Anmelden kann man sich mit Kleidertauschpartys, Kochseminaren,
  Podiumsdiskussionen oder Online-Workshops. Aktionen und Projekte können noch bis
  zum 8. Oktober kostenlos auf der Webplattform Gemeinschaftswerk Nachhaltigkeit gemeldet
  werden. Hier gelangen Sie zu Aktionsbeispielen und Veranstaltungen in der Nähe .
  Im Zentrum der Aktionstage stehen in diesem Jahr fünf Gemeinschaftsziele zum Thema
  Wasser : Bewusstseinsbildung, Flächenentsiegelung, Regenwassernutzung, Gewässerpatenschaften
  und Trinkwasserspender. Durch möglichst viele Aktionen passend zu diesen Zielen
  soll ein spürbarer Beitrag zur Nachhaltigkeit im Wassersektor erreicht werden. Seit
  2015 sind die Deutschen Aktionstage Nachhaltigkeit Teil der Europäischen Nachhaltigkeitswoche
  , einer Initiative von Deutschland, Frankreich und Österreich. Seit 2015 wurden
  insgesamt 46.786 Veranstaltungen über das „European Sustainable Development Network“
  (ESDN) registriert, an denen mehr als zehn Millionen Menschen teilgenommen haben.
  Seit 2023 laufen die Deutschen Aktionstage Nachhaltigkeit über die Plattform des
  Gemeinschaftswerks Nachhaltigkeit. Der Rat für Nachhaltige Entwicklung hat die Aktionstage
  anlässlich der Weltkonferenz der Vereinten Nationen über nachhaltige Entwicklung
  (Rio+20) im Jahr 2012 ins Leben gerufen und koordiniert sie seither.'
