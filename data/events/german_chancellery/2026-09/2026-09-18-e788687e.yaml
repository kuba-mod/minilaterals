date: '2026-09-18'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 18. September 2026
text: 'Sprecherinnen und Sprecher •    stellvertretender Regierungssprecher Hille
  •    Deschauer (AA) •    Köppl (BMUKN) •    Geiger (BMZ) •    Kall (BMF) •    Lorenzat
  (BMWE) •    Swistek (BMVg) •    Kirschner (BMJV) •    Kaminski (BMI) (Vorsitzende
  Küfner eröffnet die Pressekonferenz und begrüßt SRS Hille sowie die Sprecherinnen
  und Sprecher der Ministerien.) Einen schönen guten Tag auch von mir! Schön, Sie
  zu sehen! Wie üblich am Freitag der Blick auf die kommende Woche und die öffentlichen
  Termine des Bundeskanzlers: Am Mittwoch, den 23. September, tagt wie üblich um zehn
  Uhr das Bundeskabinett unter der Leitung des Bundeskanzlers. Am Donnerstag, den
  24. September, trifft sich der Bundeskanzler um 13 Uhr mit den Ministerpräsidentinnen
  und Ministerpräsidenten der Bundesländer zu einem informellen Austausch im Bundeskanzleramt.
  Dabei wird es um den nächsten Mehrjährigen Finanzrahmen gehen. Der MFR stellt, wie
  Sie wissen, die Weichen für das politische Handeln der EU im Zeitraum von 2028 bis
  2034 und ist von zentraler Bedeutung für Europas Zukunft. Am Freitag, den 25. September,
  nimmt der Bundeskanzler an der Feier zum 150-jährigen Jubiläum der Henkel AG in
  Düsseldorf teil. Er wird dort gegen 19.45 Uhr eine Festrede halten. Henkel ist ein
  bedeutendes Unternehmen für den Wirtschaftsstandort Deutschland und für das Land
  Nordrhein-Westfalen. Der Konzern entwickelt, forscht und produziert in Deutschland
  und zeigt damit, wie wettbewerbsfähig der Wirtschaftsstandort ist, unter anderem
  auch für die hochmoderne chemische Industrie. Die Veranstaltung ist nicht presseöffentlich,
  aber es wird einen Livestream des Veranstalters zur Rede des Bundeskanzlers geben.
  Ich habe eine Frage zu dem Treffen mit den Ministerpräsidenten. Sie haben als Thema
  den MFR erwähnt, aber es gibt ja noch eine Reihe von anderen Themen, die Bund und
  Länder miteinander besprechen könnten oder sollten. Stehen auch noch andere Themen
  auf der Agenda? Gibt es danach wie sonst bei MPK-Treffen auch eine Pressekonferenz?
  Herr Kollege, wie es bei Terminen, die vor uns liegen, immer ist, können wir erst
  danach final sagen, was dabei stattgefunden hat. Aber Inhalt dieses Termins ist
  explizit ein Austausch zwischen dem Bundeskanzler und den Ministerpräsidentinnen
  und Ministerpräsidenten zum Thema des MFR. Ob dann rechts und links davon noch anderes
  zur Sprache kommt, vermag ich jetzt noch nicht zu sagen, aber Hauptthema ist der
  MFR. Zu der zweiten Frage: Da es sich um ein informelles Treffen handelt, ist keine
  Pressebegegnung vorgesehen. Herr Hille, ich würde es einfach ganz gern verstehen.
  Was hat der Kanzler bezüglich des MFR mit den Ministerpräsidenten denn konkret zu
  besprechen? Worum geht es? Die Antwort haben Sie in Ihrer Frage schon gegeben. Es
  geht um den MFR. Der MFR ‑ das habe ich gerade einleitend gesagt ‑ stellt die Weichen
  für das politische Handeln der EU von 2028 bis 2034 und ist maßgeblich für das,
  was die EU als Gemeinschaft von Staaten tun will und kann. Davon ist ja nicht nur
  der Bund betroffen, sondern auch die Länder. Von daher ist es sehr naheliegend und
  richtig, dass sich der Bundeskanzler dazu eng und gut mit den Bundesländern austauscht,
  wie wir es bei solchen Themen immer tun. Beim MFR gibt es ja diverseste Streitpunkte,
  die auch die Länder betreffen, unter anderem die Frage der Mittelverteilung. Gibt
  es seitens des Bundeskanzlers irgendwelche Dinge in den derzeitigen MFR-Planungen,
  so wie sie kommissionsseitig vorgeschlagen wurden, aus denen seiner Meinung nach
  Schwierigkeiten konkret für die deutschen Bundesländer erwachsen könnten? Die allgemeinen
  Bedenken sind mir bekannt. Die allgemeinen Bedenken sind Ihnen bekannt. Natürlich
  kann man das nach meinem Dafürhalten nicht haarfein, sozusagen chirurgisch voneinander
  trennen, sondern Deutschland als Ganzes und als Mitglied der EU ist Teil dieses
  MFR. Deutschland besteht neben dem Bund aus den Ländern. Deshalb betrifft das, was
  Deutschland betrifft, auch die Länder. Deshalb würde ich dazwischen keinen chirurgischen
  Trennstrich setzen wollen, sondern darauf abheben, dass wir mit einer gemeinsamen,
  klaren Linie die Verhandlungen weiter bestreiten. Die Grundlinie ist Ihnen, denke
  ich, bekannt. Der Bundeskanzler hat sich ja mehrfach zum MFR und unserer Haltung
  dazu eingelassen. Herr Hille, das Großthema dieser Tage ist die Belastbarkeit oder
  Nicht-mehr-Belastbarkeit der Bürger durch steigende Energiepreise. Der Kanzler hat
  gesagt, es müsse etwas getan werden. Das klang so, als sei das sehr bald nötig.
  Es gibt verschiedenste Vorschläge. Wird dieses Thema bei dem Treffen mit den Ministerpräsidenten
  denn nicht eine Rolle spielen müssen? Können wir davon ausgehen, dass der Kanzler
  mit einem Vorschlag der Bundesregierung, wie eine Entlastung auszusehen hat, die
  am Ende ja auch die Länder betrifft, in diese Gespräche gehen wird? Ich bin immer
  wieder beeindruckt, Herr Kollege, von Ihrer Verbindung der Themen mit dem Thema,
  das gerade angesprochen ist. Aber von meiner Seite aus wäre es nötig, auf ein bisschen
  mehr einzugehen als nur auf den Termin. Wollen wir das jetzt tun? Ich vermute, dass
  sich daran dann weitere Nachfragen anschließen würden. Ich denke, allen ist bekannt,
  dass uns sehr bewusst ist, wie die aktuellen Energiepreise vor allem an der Zapfsäule,
  aber nicht nur da, die Bürgerinnen und Bürger in Deutschland und die Unternehmen
  belasten. Dementsprechend ist das ein Thema von hoher politischer Priorität für
  uns. Sie haben es schon angerissen: Dazu hat sich nicht nur der Bundeskanzler sehr
  klar eingelassen, sondern auch die Vorsitzenden der anderen beiden die Koalition
  tragenden Parteien, namentlich Finanzminister Klingbeil und Ministerpräsident Markus
  Söder. Es besteht also ein klares politisches Commitment, dass es zu einer Entlastung
  kommen soll. Derzeit laufen die Beratungen darüber, über welchen Weg das stattfinden
  wird. Das ist wie bei so vielen Themen ‑ auch das wird Sie nicht überraschen ‑ komplex
  im Detail. Deshalb muss man sich die Dinge sehr genau anschauen, gegeneinander abwägen
  und dann den besten Weg gemeinschaftlich vereinbaren. In diesem Prozess befinden
  wir uns gerade. Daher muss ich Sie noch um etwas Geduld bitten. Ich bin aber optimistisch,
  dass wir bald zu einer gemeinsamen Lösung kommen. Daraus ergibt sich die Nachfrage:
  Strebt der Bundeskanzler alsbald einen Äußerungszeitpunkt an, noch vor den Wahlen
  in Mecklenburg-Vorpommern und Berlin? Ich kenne Sie, Herr Kollege, und Sie kennen
  mich. Sie werden wissen, dass ich den Begriff „bald“ nicht ganz zufällig gebraucht
  habe. Ich bin optimistisch, dass wir bald eine Lösung haben werden, aber ‑ auch
  um mögliche weitere Nachfragen schon vorwegzunehmen ‑ ich werde dieses „bald“ zum
  jetzigen Zeitpunkt nicht weiter konkretisieren, weil es einfach unseriös wäre, und
  das bin ich nicht. Damit diese Pressekonferenz besser strukturiert ist, werde ich
  jetzt die Reiseankündigungen abarbeiten und dann als erstes Thema das Thema des
  Tankrabatts aufrufen. Außenminister Wadephul reist am Montag als Leiter der deutschen
  Delegation zur Eröffnung der Generaldebatte der 81. UN-Generalversammlung nach New
  York zur sogenannten „High Level Week“. Am Donnerstag reist er nach Kanada weiter
  und kehrt danach nach New York zurück, um am Samstag für Deutschland die Rede vor
  der UN-Generalversammlung zu halten. In der kommenden Woche nimmt der Außenminister
  eine Reihe von Terminen zu aktuellen Krisen und zu Reformanstrengung der Vereinten
  Nationen wahr und führt Gespräche, um weltweite Partnerschaften zu pflegen. Denn
  nächste Woche wird sich eine dreistellige Zahl von Staats- und Regierungschefs sowie
  von Außenministerinnen und Außenministern in New York aufhalten. Ich werde jetzt
  keinen kompletten Tagesdurchgang machen können, will aber ein paar Termine hervorheben.
  Wir werden Sie auf dem üblichen Wege darüber informiert halten, was im Laufe der
  Woche für den Außenminister ansteht. Folgende Termine will ich hervorheben: das
  Treffen der G7-Außenministerinnen und ‑Außenminister, auf dem der russische Angriffskrieg
  gegen die Ukraine, aber sicherlich auch die Lage am Golf und hinsichtlich Irans
  ein maßgebliches Thema sein werden, die Eröffnung der Generaldebatte in der UN-Generalversammlung,
  an der der Außenminister teilnehmen wird, eine Veranstaltung auf Einladung Deutschlands
  zur Zukunft der Vereinten Nationen sowie auch ein Treffen im Rahmen der sogenannten
  G4 ‑ das sind Deutschland, Indien, Brasilien, Japan ‑ zur Reform des UN-Sicherheitsrats,
  ein Treffen der EU- und der CELAC-Staaten, unter anderem auch eine Sitzung des UN-Sicherheitsrats
  zum russischen Angriffskrieg gegen die Ukraine und die Bedrohung der europäischen
  Sicherheit in der NATO, auf der der Außenminister sprechen wird. Der Außenminister
  wird in New York in Vertretung des Bundeskanzlers auch an einem Austausch mit jüdischen
  Organisationen teilnehmen. Darüber hinaus finden zahlreiche bilaterale Gespräche
  mit Außenministerinnen und Außenministern aus allen Weltregionen statt. Ich hatte
  gesagt, dass der Außenminister seine Reise nach Kanada fortführt. In Kanada wird
  er mit seiner kanadischen Amtskollegin zusammentreffen. In diesem Jahr begehen wir
  das 75-jährige Jubiläum unserer diplomatischen Beziehungen. Im Zentrum der Gespräche
  steht die Vertiefung der Zusammenarbeit in den Bereichen von Sicherheit und Verteidigung
  sowie Zukunftstechnologien. Kanada ist ein enger und verlässlicher Partner und wichtiger
  NATO-Verbündeter, mit dem wir die Zusammenarbeit angesichts gemeinsamer Herausforderungen
  weiter ausbauen wollen. Auch deshalb haben wir im Juli beschlossen, eine strategische
  Partnerschaft abzuschließen. Die weiteren Schritte dazu werden ebenfalls Gegenstand
  der Gespräche sein. Zu dem Gespräch über die Reform des Sicherheitsrates: Geht Deutschland
  mit dem Gedanken einer Reform des Modus, der im Moment noch einzelnen Staaten die
  Möglichkeit gibt, per Veto Beschlüsse zu blockieren, in diese Reform? Ist Deutschland
  also für eine Reform des Vetorechts im Sicherheitsrat? Deutschland ist für eine
  grundlegende Reform des Sicherheitsrats, insbesondere auch dessen Zusammensetzung.
  Das sind wir seit geraumer Zeit. Die Ausgestaltung des Vetorechts in der jetzigen
  Form, so wie sie angelegt ist, ist natürlich auch ein Relikt aus der Zeit, in der
  der Sicherheitsrat entstanden ist. Insofern blicken wir gemeinsam mit den drei Partnern,
  die ich genannt habe, auch darauf. Bedeutet das, dass Deutschland vorschlägt, das
  Vetorecht gegenüber seiner derzeitigen, wie Sie gesagt haben, historisch sehr radikalen
  Form so zu verändern, dass dann nicht mehr einzelne Staaten nach Belieben blockieren
  können? Sie dürfen sich den Termin, den ich gerade angekündigt habe, nicht als einen
  öffentlichen Termin vorstellen, auf dem wir eine Forderung stellen, die wir in die
  Vereinten Nationen einbringen, sondern das ist ein Treffen im Kreise derjenigen
  großen Staaten, deren Repräsentanz in den Vereinten Nationen, insbesondere in dem
  höchsten Weltgremium, angebracht und angezeigt wäre und die seit geraumer Zeit gemeinsam
  Ideen entwickeln, um den Sicherheitsrat der Vereinten Nationen weiterzubringen.
  Um Ihre Frage zu beantworten: Es geht um eine Gesamtreform des Sicherheitsrats,
  der in seiner geografischen Zusammensetzung und in den Modalitäten, in denen er
  arbeitet, die Gegebenheiten dieser Welt nicht mehr widerspiegelt. Aber wir werden
  jetzt keinen öffentlichen Vorstoß oder so etwas erleben, sondern es ist eine gemeinsame
  Sitzung der entsprechenden Mitgliedstaaten dieser Gruppe. Frau Deschauer, bisher
  war die deutsche Position, dass man für Deutschland einen ständigen Sitz in einem
  dann erweiterten Gremium vorschlägt. Seit einiger Zeit gibt es eine Debatte, ausgelöst
  von Botschafter Heusgen, ob man das nicht besser lassen und zu anderen Möglichkeiten
  kommen sollte, etwa zu rotierenden permanenten Mitgliedschaften, bei denen sich
  europäische Länder ablösen oder so etwas. Ist das mittlerweile Teil der Überlegungen
  der Bundesregierung, oder hält man an der alten Position fest? Externe Impulse würde
  ich hier normalerweise nicht kommentieren. Es gibt immer vielfältige Vorschläge
  zu der Gesamtdebatte. Ich denke, wir müssen den Realismus an den Tag legen, dass
  das eine sehr langwierige Debatte ist. Die Reformfortschritte, so notwendig sie
  sind, halten sich seit geraumer Zeit leider in Grenzen. Insofern habe ich jetzt
  auch keine neue Positionierung der Bundesregierung oder der G4-Staaten, in deren
  Rahmen wir uns gemeinsam zusammenbringen, anzukündigen. Auch Bundesumweltminister
  Carsten Schneider reist am Montag nach New York und nimmt nicht nur an Terminen
  im Rahmen der 81. Generalversammlung teil, sondern auch an Terminen im Rahmen der
  New York Climate Week. Er führt im Anschluss politische Gespräche in Washington,
  D. C. Im Mittelpunkt der Reise stehen die internationale Klima- und Umweltpolitik
  sowie die Vorbereitung der anstehenden UN-Naturkonferenz im Oktober und natürlich
  der UN-Klimakonferenz im November. Schneider wird dazu mit internationalen Partnern
  über eine stärkere Zusammenarbeit beim Klimaschutz, beim Schutz der Natur und bei
  der globalen Energiewende beraten. Um nur zwei Schlaglichter auf diesen Besuch zu
  werfen: Unter anderem trifft der Umweltminister den kalifornischen Governor Gavin
  Newsom. Im Mittelpunkt des Gesprächs stehen die globale Energiewende und die Zusammenarbeit
  bei Klimaschutz und Klimaanpassung. Am Dienstag hinterlegt er bei den Vereinten
  Nationen zudem die deutsche Ratifikationsurkunde zum UN-Hochseeschutzabkommen. Damit
  vollzieht Deutschland einen wichtigen Schritt zur Umsetzung des internationalen
  Abkommens zum Schutz der biologischen Vielfalt auf hoher See. Auch Entwicklungsministerin
  Reem Alabali Radovan reist von Montag bis Freitag zur UN-Generalversammlung nach
  New York City. Sie wird dort am Dienstag an der Eröffnung der Generaldebatte teilnehmen
  und gemeinsam mit ihren deutschen Amtskollegen die Rolle Deutschlands als eines
  verlässlichen Partners unterstreichen. Die Entwicklungsministerin setzt sich dabei
  im Kreis der UN-Mitgliedstaaten für Vertrauen, Solidarität und gemeinsames Handeln
  ein. Die Ministerin lädt im Rahmen ihrer Reise nach New York City zu mehreren Veranstaltungen
  ein und wird zudem als Gast diversen Veranstaltungen zu unterschiedlichen Themen
  beiwohnen. Alabali Radovan vertritt Deutschland unter anderem bei der Veranstaltung
  zu Themen globaler Bildungsgipfel und auf dem International Panel on Inequality
  und nimmt an Veranstaltungen zur Lage und Lösungen für den Nahostkonflikt teil,
  beispielsweise an einem Treffen der Globalen Allianz zur Umsetzung der Zweistaatenlösung.
  In eigenen Veranstaltungen wird sie über die Auswirkungen der Schließung der Straße
  von Hormus auf den globalen Handel, über den UN-Reformprozess und über Ernährungssicherheit
  diskutieren. Angesichts dessen, dass fast das halbe Kabinett nach New York zur Generalversammlung
  fliegt, wüsste ich gern: Fliegt eigentlich jeder einzeln in einer Regierungsmaschine,
  oder hat man das gebündelt und fliegt gemeinsam? Ich übernehme die Antwort für das
  Haus, das die Delegationsleitung hat. Meiner Kenntnis nach ist das gebündelt. Herr
  Geiger, Sie sprachen gerade von Deutschlands verlässlichen Partnern und haben gleichzeitig
  die Nahostthematik angesprochen. Inwiefern passt das für die Ministerin zusammen?
  Deutschland steht international immer isolierter da, angesichts der Israelunterstützung,
  von Völkermord in Gaza und der Nichtsanktionierung der Westjordanaktivitäten. Wie
  passt das mit der Verlässlichkeit Deutschlands international zusammen? Ich finde,
  ja. Deutschland hat sich immer als verlässlicher Partner der UN dargestellt und
  wird das auch im Rahmen der Reise und auch in den Gesprächen und Veranstaltungen
  tun, die geplant sind. Deutschland wird sich als verlässlicher Partner darstellen.
  Das bezog sich auf UN-Aktivitäten, nicht auf Völkerrecht und so. Wir haben uns jetzt
  in dem Zusammenhang als verlässlicher Partner der UN dargestellt. Frau Deschauer,
  Palästinenserpräsident Abbas wird die Einreise zur UN-Versammlung verweigert. Hat
  die Bundesregierung dazu eine Haltung? Ich denke, das Thema müssten Sie mit den
  Behörden aufnehmen, die für die Einreise zuständig sind. Doch, das habe ich ja getan.
  Ich habe Sie an die Behörden verwiesen, die dafür zuständig sind. Ich will ja wissen,
  was Sie sagen, nicht, was die Behörden ‑ ‑ ‑ Sie haben doch gehört, was ich gesagt
  habe. Frau Deschauer, da würde ich gern nachfragen. Halten Sie denn das Prinzip
  der UN, dass die UN-Vollversammlung eigentlich eine Diskussionsrunde zwischen allen
  Mitgliedern der Völkergemeinschaft sein sollte, noch für gewährleistet? Herr Abbas
  war früher ja tatsächlich schon in New York anwesend. Wird also das Prinzip, dass
  sich alle dort austauschen können, nicht unterlaufen, wenn man einzelnen Regierungen
  keine Einreisegenehmigung gibt? Dann ergänze ich jetzt gerne noch: Natürlich ist
  es durchaus so, dass Sie, Herr Kollege und Herr Kollege, sich in dieser Fragestellung
  an die entsprechenden Behörden der internationalen Organisation sowie des Sitzstaates
  wenden müssten. Ich kann aber sagen: Unsere Haltung ist, dass eine physische Teilnahme
  wichtig wäre, um auch einen direkten Austausch zu ermöglichen. Wir begrüßen im Grundsatz
  aber, dass die virtuelle Teilnahme ermöglicht wird ‑ das ist in der Fragestellung
  zumindest von Herrn Kollege noch nicht zum Ausdruck gekommen ‑; denn das ist wichtig.
  Dann geht natürlich die logische Folgefrage an Herrn Hille: Warum ermöglicht der
  Bundeskanzler nicht zumindest eine virtuelle Teilnahme? Wir haben hier letzte Woche,
  glaube ich, argumentiert, warum der Bundeskanzler kommende Woche bedauerlicherweise
  nicht in New York mit dabei sein kann. Seine Anwesenheit ist hier noch etwas erforderlicher,
  als das in New York der Fall ist. Sie haben aber auch gehört, wie hochrangig wir
  vertreten werden. In diesem Fall geht es ja gerade darum, ob ein Staat vertreten
  ist oder nicht vertreten ist. Wir sind dort, wie gesagt, hochrangig physisch vertreten ‑
  wir haben gerade gehört, wer alles aus der Bundesregierung da sein wird. Die Rede
  wird der Bundesaußenminister halten, so wie er es im vergangenen Jahr auch schon
  getan hat. Damit ist Deutschland bestmöglich bei der UN vertreten. Ich muss noch
  einmal zu dem nachfragen, was Herr Kollege schon gefragt hat: Letztes Jahr wurde
  Herrn Abbas auch schon die Einreise zur UN-Vollversammlung versagt. Da haben sich
  die europäischen Staaten gemeinsam dazu geäußert und das kritisiert. Darum jetzt
  noch einmal die Frage: Wird sich Deutschland einer weiteren Kritik der europäischen
  Staaten in Bezug auf die Versagung der Einreise von Herrn Abbas anschließen, oder
  wird es das diesmal nicht tun? Dazu habe ich Ihnen im Moment nichts anzukündigen.
  Herr Hille, können Sie noch einmal genau sagen, wofür der Kanzler so dringend hierbleiben
  muss? Die Anwesenheit des Bundeskanzlers in Deutschland ist in der kommenden Woche
  wichtig, und deshalb hat er schweren Herzens seine Teilnahme an der UN-Generalversammlung
  absagen müssen. Sie wissen alle, dass es nicht nur um die Zeit vor Ort geht; vielmehr
  müssten dafür auch erhebliche Reisezeiten aufgebracht werden. Das ist in Anbetracht
  anderer Themen, die auf der Agenda stehen, kommende Woche leider nicht möglich.
  Deshalb hat der Bundeskanzler seine Teilnahme absagen müssen. Es war ja anders geplant.
  Welche Termine sind denn so wichtig, dass diese Reise abgesagt wurde? Herr Kollege,
  ich kann nur noch einmal darauf verweisen, dass die Anwesenheit des Bundeskanzlers
  in Deutschland nötig ist und er nicht die Zeit aufbringen kann. Ich habe gerade
  auch auf den Reiseaufwand verwiesen, der damit verbunden ist. Seine Anwesenheit
  in Deutschland ist noch etwas wichtiger als seine Anwesenheit bei der UN. Der Reiseaufwand
  wäre bei einer virtuellen Teilnahme ja eher gering. Ist eine virtuelle Teilnahme
  erwogen worden oder stand die gar nicht zur Disposition? Herr Kollege, ich dachte,
  das hätte ich gerade schon auf die Frage von Herrn Kollege hin beantwortet. Es geht
  ja nicht darum, dass Deutschland gar nicht teilnimmt, sondern es geht um die Frage,
  durch wen Deutschland vertreten ist. Deutschland ist durch den Bundesaußenminister,
  durch den Bundesumweltminister und durch die Bundesentwicklungsministerin hochrangig
  vertreten, und deshalb stellt sich diese Frage nicht. In der anderen Konstellation
  geht es darum, ob ein Staat oder eine Entität überhaupt teilnimmt oder nicht. Das
  ist hier nicht der Fall. Wir sind physisch stark und hochrangig vertreten. Würde
  das denn bedeuten, dass bei der ursprünglich geplanten physischen Teilnahme des
  Kanzlers die anderen jetzt reisenden Vertreter der Bundesregierung nicht nach New
  York gereist wären? Schöner Versuch, Herr Kollege, aber Sie wissen ja, wie wir mit
  hypothetischen Fragen umgehen. In diesem Fall handelt es sich, glaube ich, zweifellos
  um eine hypothetische Frage ‑ sogar in einer doppelt hypothetischen Variante. Geht
  der Kanzler davon aus, dass er im nächsten Jahr dabei ist? Das macht es mir sehr
  leicht: Das eine sind die hypothetischen Fragen und das andere sind die Spekulationen ‑
  erst recht, wenn sie so weit in der Zukunft liegen. Es ist natürlich das Ziel, bei
  der UN-Generalversammlung dabei zu sein. Es ist in der Politik aber immer wieder
  der Fall, dass sich Prioritätensetzungsnotwendigkeiten auftun. Was diesen Fall betrifft,
  habe ich gerade geschildert, wie die Entscheidung ausgefallen ist. Wie das in künftigen
  Konstellationen in einem Jahr aussehen wird, das werden wir dann im Lichte der Zeit
  beurteilen. Die Legislaturperiode läuft offiziell bis 2029. Der Kanzler ist bis
  dahin offiziell im Amt. Wir erleben gerade komplexe Zeiten. Darum frage ich mich:
  Geht der Kanzler davon aus, dass er dann nächstes Jahr dabei ist, oder glaubt er,
  dann nicht mehr im Amt zu sein? Sie versuchen da jetzt fast elegant ‑ ‑ ‑ Sie können
  ja sagen: Natürlich ist er nächstes Mal dabei. Ich habe doch gerade gesagt, dass
  das grundsätzliche Ziel ist, dass der Bundeskanzler an den UN-Generalversammlungen
  teilnimmt. Wie das dann aber konkret in einem Jahr aussieht und ob dann nicht wieder
  irgendwelche Prioritäten anders gesetzt werden müssen, das kann ich nicht vorhersagen.
  Ich habe hier keine Glaskugel. Zu dem anderen Teil Ihrer Frage: Ja, der Bundeskanzler
  geht natürlich davon aus, dass er weiter Bundeskanzler sein wird. Herr Hille, ich
  muss auch noch einmal nachfragen, weil das natürlich durchaus ein Signal nach außen
  aussendet: Andere Staats- und Regierungschefs schaffen es ja, trotz innenpolitischer
  Probleme nach New York zu reisen. Sie haben jetzt gesagt, dass innenpolitische Probleme
  in diesem Fall quasi über dem Engagement für die UN stehen, das durch einen Besuch
  dokumentiert würde. Herr Wadephul kann natürlich den Kanzler nicht bei allen Treffen
  vertreten; denn es gibt da auch Treffen, die nur auf der Ebene Staats- und Regierungschefs
  stattfinden. Muss man daraus, dass der Bundeskanzler nicht nach New York reisen
  kann, also schließen, dass Deutschland derzeit instabiler ist als andere Länder?
  Nein, in keiner Weise. ‑ Soll ich noch zwei Sätze mehr dazu sagen? Ich finde die
  interpretatorisch mögliche Abqualifizierung anderer Regierungsmitglieder in diesem
  Fall ‑ ich weiß, das ist nicht so gemeint ‑ auch nicht zutreffend. Es geht nicht
  darum, ob Deutschland vertreten ist oder ob Deutschland nicht vertreten ist. Deutschland
  ist hochrangig durch den Bundesaußenminister, durch den Bundesumweltminister, durch
  die Bundesentwicklungsministerin bei der UN-Generalversammlung vertreten, und ich
  denke, das ist angemessen. So wünschenswert es auch aus Sicht des Bundeskanzlers
  wäre, dass er das einrichten könnte, musste die Entscheidung in diesem Fall anders
  fallen. Aber das ist ja keine Abqualifizierung der Minister. Es gibt eben bestimmte
  Formate, die nur für Staats- und Regierungschefs stattfinden. Da wäre natürlich
  auch interessant zu erfahren, welche Treffen jetzt wegfallen ‑ zum Beispiel Treffen
  mit anderen wichtigen Regierungschefs oder Präsidenten, etwa von China oder den
  USA. Das kann ich Ihnen in diesem Moment in der Tat nicht sagen, weil ich mir gar
  nicht sicher bin, ob das bereits so klar avisiert war. Das setzt ja voraus, dass
  Dinge geplant gewesen wären, die jetzt abgesagt worden sind. Üblicherweise ist der
  Zulauf auf solche Veranstaltungen sehr fluide und kurzfristig, und viele Dinge entstehen
  dann im kurzfristigen Zulauf. Insofern: Ich bin skeptisch, dass es eine solche Liste
  gibt, Herr Kollege, aber sollte es eine solche Liste mit Terminen geben, die jetzt
  nicht stattfinden können, weil sie zwingend an die Person des Bundeskanzlers gekoppelt
  wären, dann würden wir das nachliefern. Vielleicht kann uns Frau Deschauer als Sprecherin
  des Auswärtigen Amts aufklären, wie das bei den UN-Vollversammlungen protokollarisch
  abläuft. Bei welchen Treffen ‑ formell, informell ‑ ist der Regierungschef zwingend
  erforderlich? Ich glaube, da gibt es keine ganz feste Regel. Sie erleben ja, dass
  der Bundesaußenminister als Delegationsleiter für die Bundesrepublik Deutschland
  die Rede vor der Vollversammlung halten wird. Das tut er wie im vergangenen Jahr.
  Ich glaube, die protokollarische Regelung, gerade was die Generalversammlung angeht,
  ist einfach die Redereihenfolge. Es ist klar, dass da Staats- und Regierungschefs
  der Rangordnung nach zuerst kommen, und sodann Außenministerinnen und Außenminister.
  Es gibt auch Länder, die durch ständige Vertreter ‑ das sind quasi die Botschafter
  vor Ort ‑ vertreten sind, die die Reden dann einbringen. Das ist quasi das UN-Protokoll,
  das dann die Rangfolge festlegt. Ich habe nicht nach den Reden bei der Vorversammlung
  gefragt. Herr Kollege hat gerade ja angesprochen, was der Kontext ist. Können Sie
  uns das vielleicht nachreichen? Das kann ich Ihnen nicht nachreichen, weil ich nicht
  sagen kann, welche Termine, die der Regierungssprecher gar nicht angekündigt hat,
  dann in welcher Form wahrgenommen werden. Was die Frage nach den protokollarischen
  Regeln betrifft, können Sie sich auch an die Vereinten Nationen wenden. (zu den
  Kraftstoffpreisen) Herr Hille, Sie sagten, es solle bald eine Lösung geben und derzeit
  fänden Abstimmungen statt. Vielleicht können Sie uns ein bisschen an die Hand nehmen:
  Welche Abstimmungen finden konkret heute statt, wer stimmt sich da mit wem ab? Ich
  kann da Bedürfnis verstehen, sowohl den Begriff „bald“ als auch die Frage, wer da
  wie zusammensitzt, konkretisiert haben zu wollen. Aber sehen Sie es mir nach: Das
  sind die Koalitionsparteien, die Fraktionen, die Verantwortlichen in den betroffenen
  Ministerien; ich werde da jetzt aber keine Namensliste aufmachen. Die Koalition
  berät intern mit allen, die dafür nötig sind, über eine entsprechende Lösung. Aber
  es macht ja einen Unterschied, ob man koalitionsintern mit den zuständigen Ministerien
  berät oder ob beispielsweise auch die Länder mit an Bord sind. Vielen Dank, dass
  Sie damit auch deutlich machen, dass das alles etwas komplexer ist. Mit allen, die
  in diesen Fragen betroffen sind ‑ und das hängt dann wiederum davon ab, auf was
  für einen Lösungspfad man sich begibt ‑, wird natürlich gesprochen; das ist ja ganz
  klar. Auch das erfordert Zeit. Ich sage das, weil ich allgemein eine gewisse Ungeduld
  wahrnehme, dass am liebsten schon Lösungen vorliegen sollten. Es ist komplexer und
  braucht einfach etwas Prüfungs- und Beratungszeit. Aber noch einmal: Ich bin optimistisch,
  dass wir bald einen Vorschlag vorlegen werden, der mit denjenigen abgestimmt ist ‑
  ohne jetzt die einzelnen Entitäten zu benennen ‑, die damit befasst bzw. davon betroffen
  sind. Herr Hille, das Datum 1. Oktober geistert durch die Debatte. Ist das erklärte
  Ziel, dass die Entlastung ab dann greift? Wäre es dann auch das Ziel, das nächste
  Woche durch das Parlament und mit entsprechenden Sondersitzungen auch durch den
  Bundesrat zu bringen? Rückwirkend kann man eine Entlastung an der Zapfsäule nach
  meinem Verständnis ja nicht vornehmen, wenn ich mich nicht täusche. Was die Relevanz
  dieses Themas angeht, hatte ich gerade schon gesagt: Wir sind uns alle bewusst,
  was die hohen Energiepreise ‑ zuvorderst an der Zapfsäule, aber nicht nur da ‑ für
  Bürgerinnen, Bürger und Unternehmen in Deutschland bedeuten. Deshalb steht dieses
  Thema hoch auf der politischen Agenda und deshalb haben sich auch die verantwortlichen
  Vorsitzenden der die Koalition tragenden Parteien alle mit ähnlicher Richtung geäußert.
  Wir sind uns darin einig, dass wir an dieser Stelle zu Entlastungen kommen wollen
  und müssen. Ich habe gerade geschildert, dass das in der Umsetzung allerdings nicht
  trivial ist, und man kann auch nicht einen Schalter umlegen und sagen: Wir machen
  es jetzt ganz einfach von heute auf morgen so. Von der gewählten Lösung ist dann
  natürlich auch die Zeitschiene abhängig. ‑ Hilft Ihnen das ein bisschen? Ich hatte
  ja ganz konkret gefragt: Ist der 1. Oktober das Ziel, steht das noch, oder sagen
  Sie, dass das zum jetzigen Stand gar nicht mehr erreichbar ist? Ich möchte weder
  sagen „Das ist das Ziel“, noch möchte ich sagen „Das ist nicht erreichbar“. Ich
  habe mit dem Hinweis darauf versucht deutlich zu machen: Es kommt auf den Pfad an,
  auf den man sich einigt, und auf die Maßnahmen, die dann darin stecken. Die einen
  kann man zu einem früheren Zeitpunkt scharf stellen, die anderen brauchen einfach,
  weil es technisch nicht anders möglich ist, gegebenenfalls noch etwas länger. Ich
  kann das nicht sagen. Das Ziel ist natürlich, das schnellstmöglich zur Wirkung zu
  bringen. Ob dann Wunsch und Realität auch deckungsgleich sind, das liegt in den
  Details, in der Materie. Also: schnellstmöglich, und ich bin optimistisch, dass
  wir bald einen Vorschlag vorlegen werden. Ich bin mir sicher, der Kollege Kall wird
  das genauso sehen. Von der CDU-Generalsekretärin sind gestern schon Volumina genannt
  worden. Ich weiß, dass Sie Äußerungen im politischen Raum nicht kommentieren, aber
  welche Größenordnung schwebt der Bundesregierung denn vor? Ist eine Entlastung zwischen
  20 und 25 Cent geplant? ‑ Diese Fragen richten sich an Herrn Hille, Herrn Kall und
  Frau Lorenzat. so sehr ich Ihr Interesse verstehe, jetzt möglichst schnell zu wissen,
  zu welchem Zeitpunkt von welchen Personen verhandelt wird und mit welcher Entlastungswirkung
  wir eine Lösung finden werden, muss ich Sie um etwas Geduld bitten; denn das alles
  hängt davon ab, für was für ein Paket wir uns entscheiden. Dazu laufen die Beratungen
  mit allen, die dafür nötig sind. Wenn diese Beratungen abgeschlossen sind, können
  wir genau diese Frage ganz konkret beantworten. Uns ist die Dringlichkeit des Themas
  bewusst. Uns ist bewusst, in welchen Größenordnungen sich die Energiepreise derzeit
  bewegen und wie groß die dadurch entstehende Belastung ist. Aus dieser Beschreibung
  dessen, was uns bewusst ist, muss dann noch ein konkretes politisches Ergebnis werden,
  das dann mit einer Entlastungsgrößenordnung versehen ist. Die werde ich hier jetzt
  aber nicht nennen können, und gleiches gilt, glaube ich, für den Kollegen Kall.
  Ergänzen Sie gerne ‑ die Mikrofone sind offen. Wir warten erst einmal die weiteren
  Fragen ab, würde ich sagen. Dann möchte ich gerade beim Wirtschaftsministerium noch
  einmal nachfragen: Im Mai hat es schon einmal eine Entlastung gegeben. Damals hatte
  die Wirtschaftsministerin vor allem gefordert, dass auch die betroffenen Gewerbe
  entlastet werden. Was ist jetzt ihre Position? Wir reden die ganze Zeit über einen
  allgemeinen Rabatt und über eine Mehrwertsteuersenkung. Fordert die Wirtschaftsministerin,
  dass jetzt zum Beispiel Speditionen gesondert entlastet werden müssen? Die Ministerin
  hat sich diese Woche verschiedentlich zu diesem Thema geäußert, und ihre Worte stehen
  für sich. Ansonsten verweise ich auf das, was Herr Hille gesagt hat. Herr Kall,
  hält das BMF eine Senkung der Mehrwertsteuer auf Mineralölprodukte für mit der Mehrwertsteuersystemrichtlinie
  vereinbar? Herr Kollege, ich komme gleich zu Ihrer Frage. Ich möchte zunächst einmal
  vorwegstellen, dass sich Bundesfinanzminister Lars Klingbeil zuletzt heute Morgen
  vor den Beratungen der EU-Finanzministerinnen und Finanzminister in Dublin ausführlich
  geäußert hat und noch einmal darauf hingewiesen hat, wie groß die Belastungen für
  alle sind, die auf das Auto angewiesen sind ‑ für Pendlerinnen und Pendler, für
  Familien, aber auch für viele Betriebe, seien es Handwerksbetriebe oder andere Unternehmen.
  Deswegen müssen die Spritpreise runter. Dazu liegen auch schon seit Längerem Vorschläge
  des Bundesfinanzministers auf dem Tisch. Diese Vorschläge berät er, soweit es um
  europäische Instrumente geht, heute auch in Dublin berät, und er hat sich sehr zuversichtlich
  gezeigt, dass es da auch sehr schnell zu einer Lösung in der Koalition und auch
  im Austausch mit den Ländern kommt. Diese Äußerungen von heute Morgen finden Sie
  in den Agenturmeldungen, und dort können Sie auch nachlesen, welche konkreten Instrumente
  jetzt diskutiert werden. Zu Ihrer vorherigen Frage kann ich noch sagen, dass der
  Tankrabatt, den es gegeben hat, durchaus auch Gewerbebetrieben und Unternehmen zugutegekommen
  ist; denn natürlich wirkt sich die Energiesteuersenkung anders als eine Senkung
  der Umsatzsteuer für alle aus. Mehr will ich zu konkreten Instrumenten aber überhaupt
  nicht sagen; denn die Gespräche über das konkrete Entlastungsinstrument und über
  die konkreten Maßnahmen zur Gegenfinanzierung laufen aktuell noch. Daher brauchen
  wir einfach noch einen kleinen Moment Geduld, bis es da eine Einigung gibt. Entschuldigung,
  aber das hat jetzt alles nichts mit meiner direkten Frage zu tun. Meine direkte
  Frage hat ganz konkret auf die Mehrwertsteuersystemrichtlinie abgezielt: Hält das
  BMF einen anderen Steuersatz im Rahmen der geltenden Mehrwertsteuersystemrichtlinie
  überhaupt für möglich? Das müsste juristisch geprüft werden, wenn man dieses Instrument
  wählen würde. Aber wie gesagt, es ist zu früh, als dass wir uns hier jetzt zu konkreten
  Instrumenten äußern könnten. Dazu laufen die Gespräche. Herr Hille, Sie schildern
  die Dringlichkeit, die jetzt besteht, zu handeln. Aber das Problem besteht ja nicht
  erst seit gestern. Wieso hat eigentlich die Bundesregierung nicht die Sommerpause
  genutzt, um sich mit verschiedenen Szenarien auf die Entwicklung vorzubereiten,
  die jetzt eingetreten ist? Dann hätte man ja quasi schon einen Instrumentenkasten
  im Koffer haben können. Herr Kollege. Sie wissen ja: Wir beschäftigen uns hier seit
  Monaten mit dieser Frage. Wir beschäftigen uns innerhalb der Bundesregierung natürlich
  seit Monaten mit dem Thema der Energiepreise und sind an allen Baustellen, wenn
  man so will, dauerhaft dran. Trotzdem entsteht Politik immer im Zulauf auf konkrete
  Punkte. Politik funktioniert nicht, indem man drei Lösungen in der Kiste hat, die
  auch gar nicht in der Kiste bleiben würden, sondern es wird ja heutzutage alles
  immer auf dem öffentlichen Marktplatz ausgetragen. Von daher gibt es diese vielleicht
  wünschenswerte Konstellation, wie Sie sie geschildert haben, in der realen Politik
  also nicht wirklich, sondern Politik entsteht ‑ wie es im Fußball heißt: entscheidend
  ist auf dem Platz ‑ entscheidend im Zulauf auf Entscheidungszeitpunkte. Herr Kall,
  zum Verständnis, weil Sie gerade meinten, die Spritpreise müssten heruntergehen:
  Des einen Belastung ist des anderen Profit. Müssen die Profite der Mineralölkonzerne
  aus Sicht des Finanzministers heruntergehen? Darüber haben wir hier vielfach gesprochen
  und hat der Finanzminister zuletzt vor zweieinhalb Stunden in seinem Statement in
  Dublin gesprochen, davor gestern, davor vorgestern und bei vielen anderen Gelegenheiten.
  Das findet sich auch in einem Koalitionsbeschluss aus den letzten Monaten wieder.
  Ja, deswegen verfolgen wir eine europäische Übergewinnsteuer und erwarten von der
  Europäischen Kommission Vorschläge dafür, weil die maßlosen Krisenprofite, die einige
  Mineralölkonzerne machen, abgeschöpft werden sollen, um damit Entlastungen auch
  gegenzufinanzieren. Das ist weiterhin die Position des Bundesfinanzministers, über
  die er heute mit seinen europäischen Amtskolleginnen und -kollegen berät. Vielen
  Dank. - Ist es auch die Position des Bundeskanzlers, Herr Hille, dass die Profite
  der Mineralölkonzerne heruntergehen müssen, die ja andersherum die Belastung der
  Verbraucher sind? Die Position des Bundeskanzlers und der Bundesregierung in Sachen
  der Spritpreise und der Notwendigkeit von Entlastungen habe ich gerade, glaube ich,
  und hat auch der Kollege Kall gerade ausführlich dargestellt. Sorry, ich habe nach
  den Profiten der Mineralölkonzerne gefragt! Sie stellen eine Frage ‑ so habe ich
  hier die Regeln bisher verstanden ‑, und wir geben ‑ ‑ ‑ Wir sind nicht bei Loriot!
  Bitte beantworten Sie meine Frage, nicht Ihre Frage! Trotzdem müssen Sie, Herr Kollege,
  mit dem umgehen, so leid es mir tut, was ich Ihnen sage. Uns ist bewusst, was für
  eine große Belastung die Energiepreise für Bürgerinnen, Bürger, Familien, Pendler,
  Unternehmen sind. Deshalb besteht Einigkeit darüber, dass es zu Entlastungen kommen
  muss, und darüber, wie diese Entlastungen aussehen, laufen jetzt die Beratungen.
  Ich bin optimistisch, dass wir bald einen Vorschlag dafür machen werden, wie wir
  dieses politische Ziel, Entlastungen zu erreichen, in praktische Politik umsetzen,
  und einen Vorschlag vorlegen werden, der genau diesem Ziel folgt, Entlastungen für
  Bürgerinnen und Bürger, Unternehmen, für die Menschen in diesem Land zu erzeugen.
  Herr Kall, der Bundesfinanzminister muss ja immer die Solidität der Staatsfinanzen
  im Auge haben. Beim ersten Tankrabatt hat man sich sehr bewusst für eine von vornherein
  befristete Lösung entschieden. Ist das jetzt auch geplant? Denkt man, eine Lösung,
  die ein oder zwei Monate lang entlastet, reicht im Moment aus? Jegliche Lösung,
  die die Bundesregierung finden wird, muss gegenfinanziert sein, und darüber laufen
  die Gespräche. Entsprechend geht es dann natürlich auch um Laufzeiten bestimmter
  Maßnahmen; das ist ja klar. Aber nochmals: Konkreter können wir jetzt noch nicht
  werden, weil diese Gespräche noch laufen. Wann erwarten Sie erstmals Einnahmen in
  Deutschland aus der europäischen Übergewinnsteuer? Das hängt ja davon ab, wann die
  Kommission dafür einen Vorschlag macht, wie der ausgestaltet ist, auf welche Zeiträume
  der sich bezieht. Deshalb drängt ja der Bundesfinanzminister darauf, dass die Europäische
  Kommission einen Vorschlag macht. Frau Küfner, wenn ich darf, würde ich für das
  Gesamtbild noch zwei Sätze anfügen, was die Ursache für diese Entwicklungen angeht.
  Sie wissen das alle, und trotzdem möchte ich es noch einmal unterstreichen: Das
  liegt an Faktoren, die wir nicht beeinflussen können. Das, was im Iran und an der
  Straße von Hormus passiert, das, was in anderen Regionen der Welt passiert und die
  Märkte beeinflusst, sorgt dafür, dass bei uns die Energiepreise auf diese besonders
  großen Höhen gestiegen sind. Wir werden auch, wenn wir jetzt eine Lösung finden,
  nicht jedes dieser Risiken so weit abfedern können, dass Sie alle zufrieden sind.
  Es gibt also ein Restrisiko, das am Ende jeder selbst weiter tragen muss. Dann versuche
  ich es doch einmal mit den ganz praktischen Maßnahmen. Herr Swistek, der italienische
  Verteidigungsminister hat angekündigt, dass Italien den Schutz von Schiffen durch
  die Bab-al-Mandab-Meerenge für italienische Schiffe garantieren wolle. Er wolle
  nicht auf die EU warten. Steht denn die Bundesregierung, steht das BMVg bereit,
  einen vergleichbaren Schutz auch für Schiffe, die für Deutschland wichtige Güter
  transportieren, zur Verfügung zu stellen? Zunächst einmal sage ich auf Ihre Frage
  direkt: Wir kommentieren Äußerungen auch unserer Alliierten ja nicht direkt. Sie
  wissen auch ‑ wir haben uns auch hier mehrfach darüber ausgelassen und dazu geäußert ‑,
  welche Maßnahmen wir bereits ergriffen haben, um bereit zu sein, sollten die Rahmenbedingungen
  erfüllt sein. Wir haben zum Beispiel Einheiten im Mittelmeer vorausstationiert,
  die, sollten die Rahmenbedingungen gegeben sein und ein Mandat, eine völkerrechtliche
  Grundlage vorhanden sein, dann zum Beispiel auch für den Schutz der Seewege eingesetzt
  werden können. Demnächst steht ‑ auch das werden Sie wissen, wenn Sie in den Kalender
  schauen und aufmerksamer Verfolger von Mandaten sind ‑ wieder das Mandat für Aspides
  an. Da möchte ich aber der Bundestagsbefassung auch nicht vorgreifen. Da sind wir
  auch seit Jahren engagiert und haben dazu unter anderem mit Luftraumüberwachung
  und Sensorik ja auch in den letzten Jahren beigetragen. Dann habe ich eine Nachfrage
  zum zweiten Teil der praktischen Möglichkeiten. Frau Lorenzat, PCK Schwedt war lange
  Zeit unterausgelastet. Eine Vergrößerung des Angebots an Kraftstoffen wäre natürlich
  preismindernd. Da würde ich gerne wissen: Wie schaut es denn momentan aus? Die Ministerin
  hat sich ja sehr dafür eingesetzt, dass PCK Schwedt seine Verarbeitungskapazitäten
  stärker ausnutzen kann. Was hat die Bundesregierung da in den vergangenen Monaten
  erreicht? Ich kann jetzt zur konkreten Auslastung der PCK Schwedt gerade nichts
  sagen, das müsste ich gegebenenfalls nachreichen. Aber meiner Erkenntnis nach war
  sie immer sehr gut ausgelastet. Ich habe eine Frage an das Wirtschaftsministerium
  und den Regierungssprecher. Saudi-Arabien hat jetzt die Lieferung von Öl per Schiff
  nach Europa gestoppt. Was bedeutet das konkret für Ihre Prognosen für Preissteigerungen
  an den Zapfsäulen? Ich dachte, das ginge an Herrn Hille. Können Sie Ihre Frage noch
  einmal wiederholen? Ich habe sie leider nicht in Gänze verstanden. Saudi-Arabien
  hat die Lieferung von Öl per Schiff nach Europa gestoppt. Was bedeutet das für Ihre
  Prognose der Preissteigerung? Wie wird sich das, diese weitere Verknappung des Angebots,
  auf Preise auswirken? Zu dieser Weltregion kann ich Ihnen sagen: Von dort beziehen
  wir tatsächlich selbst kein Öl. Wir beobachten natürlich die Entwicklung der Preise.
  Eine Prognose kann ich jetzt hier konkret nicht abgeben. Es geht ja dann um die
  Auswirkungen dieser Verknappung auf den Ölpreis auf dem Weltmarkt, und da gibt es
  natürlich einen sehr konkreten Zusammenhang; den kennen Sie doch auch. Haben Sie
  keine Prognose? Gehen Sie nicht davon aus, dass sich dieser Stopp der Öllieferung
  nach Europa preistreibend auswirkt? Das habe ich ja gesagt. Wir beobachten die Preisentwicklung
  natürlich, und im Grundsatz ist der ökonomische Zusammenhang so, wie Sie ihn schildern;
  im Grundsatz. Konkrete Prognosen für diesen Sachverhalt kann ich jetzt nicht abgeben.
  Ansonsten, wenn ich das noch sagen darf, Herr Kollege, beteiligen wir uns natürlich
  nicht an derartigen Spekulationen darüber, was welche Auswirkungen haben könnte,
  und daran, sozusagen irgendwelche Schreckensszenarien aufzumachen. Wir arbeiten
  daran, und genau darüber, Entlastungen zur Wirkung zu bringen, laufen gerade die
  Beratungen. Das ist doch der entscheidende Punkt und nicht die Frage, wo uns was
  noch eventuell hinführen könnte. Dann muss man gegebenenfalls ‑ das ist Politik ‑
  die Lage neu beurteilen und daraus dann neue Schlussfolgerungen ziehen. Aber jetzt
  geht es darum, Entlastungen für die Bürgerinnen und Bürger, Unternehmen und alle
  in diesem Land zu erreichen. Ich hätte eine Frage an Herrn Kall, noch einmal zur
  Übergewinnsteuer. Der Kanzler hat sich ja schon skeptisch gegenüber dieser Idee
  ausgesprochen, und ein Argument war, dass bezüglich der letzten national verhängten
  Übergewinnsteuer noch Gerichtsverfahren anstünden. Vielleicht können Sie uns bitte
  einmal sagen, um dieses Argument zu verstehen, was aus diesen alten Verfahren noch
  an Belastungen auf die Bundesregierung zukommen könnte und ob der Finanzminister
  optimistisch ist, dass die Bundesregierung diese Verfahren gewinnt. Das kann ich
  Ihnen noch nicht sagen, weil da ja noch Verfahren laufen. Wie Gerichte darüber entscheiden,
  werden wir abwarten müssen. Aber genau deshalb setzen wir ja auf eine rechtssichere
  europäische Lösung und auf Vorschläge der Europäischen Kommission. Das heißt, um
  es zu verstehen, ohne eine europäische Lösung würden Sie auch nicht den Weg einer
  neuen nationalen Übergewinnsteuerbesteuerung gehen? Wir setzen, und so findet es
  sich auch in einem Beschluss des Koalitionsausschusses wieder, auf die Prüfung eines
  europäischen Weges für eine Übergewinnsteuer. Herr Hille hat vorhin die Faktoren,
  die zu dieser Energiekrise geführt haben, angesprochen. Bereut der Kanzler seine
  Billigung der amerikanischen und israelischen Aggression, die zu dieser Energiekrise
  geführt hat? Herr Kollege, ich weiß nicht, worauf Sie da Bezug nehmen, aber ich
  habe versucht, deutlich zu machen, dass die Dinge, die im Moment die hohen Energiepreise
  beeinflussen ‑ um nicht „verursachen“ zu sagen ‑, außerhalb unseres engeren Einflussbereiches
  liegen, dass wir da externen Faktoren unterworfen sind, mit denen wir umgehen müssen,
  die wir uns nicht ausgesucht haben, aber denen wir bestmöglich mit Maßnahmen zur
  Entlastung hier bei uns zu begegnen verursachen. Das habe ich gesagt. Herr Hille,
  Sie waren wahrscheinlich auch dabei. Nachdem die Amerikaner und Israelis Ende Februar
  den Angriff gestartet haben, hat sich Herr Merz hier am 1. März vor die Presse gestellt,
  das unterstützt, hat dem iranischen Regime Goodbye gesagt und gesagt, dass es bald
  vorbei sei. Er hat damit den Angriffskrieg gebilligt. Daraufhin stelle ich meine
  Frage. Das hat jetzt zu dieser Energiekrise geführt, das ist zweifelsfrei so. Das
  ist zweifelsfrei eine Billigung dessen. Bereut er das? Da hängen so viele weitere
  Entwicklungen dazwischen, Herr Kollege! Sie sind sehr gut darin, große Dinge immer
  sehr klein gegeneinander zu schneiden. So funktioniert das aber nicht. Man kann
  nicht sagen, weil der Bundeskanzler das im März gesagt hat, habe er dazu beigetragen,
  dass die Preise jetzt so sind, wie sie sind. Das ist, gelinde gesagt, ziemlicher
  Quatsch. Das sind zwei unabhängig voneinander zu betrachtende Dinge. Dass sich die
  Lage in der Straße von Hormus so entwickelt hat, wie sie sich entwickelt hat, war
  in keiner Weise absehbar. Dass wir jetzt, am 18. September, immer noch eine solche
  Lage haben, war auch in keiner Weise absehbar. Deshalb bringt es nichts, solche
  Dinge miteinander zu verrühren. Ich will nur noch nach einer ganz konkreten Maßnahme
  fragen, die die Bundesregierung ja ohne Probleme treffen könnte, nämlich die Frage
  der Dienstwagenbeschaffung für die eigene Tätigkeit. Gibt es dort eine Vorschrift
  zum Abschied vom Verbrenner? Entschuldigung, Herr Kollege, ich habe mir große Mühe
  gegeben, da mitzukommen, aber was ist das Thema? Die Frage lautet, ob die Bundesregierung
  für eigene Zwecke respektive alle Bundesoberbehörden weiterhin auch Verbrennerautos
  kauft oder ob zukünftig alle nur noch Elektroautos kaufen. Trotzdem fällt es mir
  schwer ‑ ich habe die Frage jetzt einigermaßen verstanden ‑, sie in den Kontext
  zu dem Thema, das wir gerade besprechen, zu stellen. Nachfrageverringerung für Gas
  und für Benziner und Kosteneinsparung. Ich habe Ihnen dazu jetzt keinen neuen Stand
  mitzuteilen und bin auch sehr skeptisch, dass das, was auch immer man in dieser
  Frage entscheiden würde, kurzfristig irgendeine Entlastungswirkung für die Bürgerinnen
  und Bürger dieses Landes mit sich bringen würde. Also von daher ‑ ‑ ‑ Ich habe eine
  Frage an das Wirtschaftsressort. Die Ministerin hat ja die Woche bekannt gegeben,
  dass die bundeseigenen Unternehmen wie SEFE dazu übergegangen sind, langfristige
  Gaslieferverträge abzuschließen. Wird sich das jetzt schon auf die Versorgungssituation
  in diesem Winter auswirken? Grundsätzlich begrüßen wir natürlich, dass die Unternehmen
  ihre Gasflüsse diversifizieren. Das ist wichtig. Das machen auch nicht nur SEFE
  und die Unternehmen, die Sie genannt haben, sondern auch weitere. Wie Sie wissen,
  flankiert das Wirtschaftsministerium politische Gespräche, um solche Verträge auch
  zu begleiten. Aber am Ende schließen die Unternehmen diese Verträge. Deshalb würde
  ich Sie bitten, sich dafür auch an die Unternehmen zu wenden. Haben Sie Hoffnung
  darauf, dass sich das bereits in diesem Winter auswirkt bzw. will das Ministerium
  Anreize geben, damit die Händler genug Energie oder genug Gas in den kommenden Monaten
  zur Verfügung stellen? Wir haben ja immer betont: Es ist Aufgabe des Marktes, für
  den Winter Vorsorge zu treffen. Insofern begrüßen wir auch Bestrebungen, diese zu
  verstärken. Soweit Sie von Anreizen reden: Es gibt da keine Anreize. Wir haben immer
  wieder betont, dass der Markt für die Wintervorsorge zuständig ist. Dann muss ich
  noch einmal ganz kurz nachfragen. Sie haben das zwar immer betont, aber Sie haben
  ja auch betont und prüfen lassen, ob es weitere Instrumente braucht, um eben tatsächlich
  eine ausreichende Gasversorgung bzw. Gasspeicherung sicherzustellen. Dafür gab es
  ja unter anderem das Gutachten und auch entsprechende Schlüsse daraus. Ich verstehe
  also noch nicht so ganz, wie Sie jetzt sagen können, da gebe es keinerlei Anreize;
  denn es war ja ausdrücklich auch ein Anreizsystem, das dort vorgesehen war. Ich
  weiß jetzt gerade nicht, worauf Sie sich beziehen. Ich kann noch einmal betonen,
  dass die Bundesregierung stets diese Lage im Blick behält, sich mit den Akteuren
  austauscht und auch Handlungsoptionen für den Fall vorbereitet, dass sie erforderlich
  sind. Es ging ganz konkret um die Frage, wie eine ausreichende Gasversorgung sichergestellt
  sein kann, eine ausreichende Befüllung der Gasspeicher. Dazu hat Ihr Haus ein Gutachten
  in Auftrag gegeben, dessen Schlussfolgerungen in Ihrem Haus diskutiert wurden, und
  darunter waren natürlich auch Anreizinstrumente. Ich verstehe also nicht so ganz,
  wie Sie jetzt von den Anreizinstrumenten wegkommen und sagen können, dass es da
  keine Anreize für die einspeichernden Unternehmen geben sollte. Sie müssten mir
  jetzt noch einmal darlegen, wie Sie darauf gekommen sind. Ich kann nur noch einmal
  betonen: Wir haben stets die Lage im Blick behalten und Handlungsoptionen vorbereitet,
  und darüber hinaus kann ich Ihnen hier jetzt gerade keine Informationen geben. Ich
  hätte ganz gerne nach der Wachstumsprognose gefragt. Herr Hille, der Kanzler hat
  gestern davon gesprochen, dass er erwartet, dass die deutsche Wirtschaft in diesem
  Jahr um 1,3 Prozent wachsen werde. Er hat sich damit sehr aus dem Fenster gelehnt.
  Deswegen hätte ich ganz gerne vom Wirtschaftsministerium und auch Finanzministerium
  gewusst, ob man eigentlich diese Erwartung teilt, dass die Wirtschaft schon wieder
  so weit ist, dass sie in diesem Jahr um 1,3 Prozent wachsen wird. Ich kann darauf
  verweisen, dass wir, wie üblich, im Oktober unsere Herbstprognose veröffentlichen
  werden, und dabei würde ich es jetzt in diesem Moment belassen. Ich würde für das
  BMF auch erst einmal sagen: Es ist Sache der Wirtschaftsforschungsinstitute, diese
  Prognosen zu machen. Die nehmen wir natürlich zur Kenntnis, und die fließen ein
  Stück weit auch in unsere Planungen ein. Was wir weiterhin sehen, ist, dass die
  öffentlichen Investitionen, die die Bundesregierung angestoßen hat ‑ vor allen Dingen
  die massiven Infrastrukturinvestitionen ‑, der wesentliche Wachstumstreiber sind,
  also dass die leichte konjunkturelle Erholung, die wir jetzt in den eigentlich von
  allen Instituten nach oben korrigierten Wachstumsprognosen sehen, zu einem ganz
  wesentlichen Teil auf der Politik dieser Bundesregierung, auf den Investitionen,
  die wir machen, beruhen. Das ist erst einmal ein erfreuliches Signal. Aber ansonsten
  sind wir auch vorsichtig geworden, weil wir gesehen haben, wie sich etwa der Beginn
  des Irankrieges im Frühjahr auf die damaligen Prognosen niedergeschlagen hat, wie
  sehr das immer noch von äußeren Faktoren, von äußeren Krisen bestimmt ist. Deswegen
  nehmen wir die Prognosen zur Kenntnis. Sie sind auch gerade ein erfreuliches Signal.
  Aber wir bleiben vorsichtig, und wir bleiben auf dem Kurs der Investitionen und
  Reformen, um das Wachstumspotenzial auch dauerhaft zu erhöhen. Der Kanzler jetzt
  in den Reden auch mehrfach gesagt hat, ein seichtes Zeichen dafür, dass es aufwärts
  gehe, seien ja die Gründungen von Start-ups, die boomen würden. Ich habe jetzt die
  genaue Zahl nicht im Kopf. Er hat, glaube ich, von „roundabout“ 3000 gesprochen.
  Wie nachhaltig ist das denn? Werden die also nur gegründet und sind dann ein halbes
  Jahr später auch wieder weg, weil es doch nicht geklappt hat, oder haben Sie eine
  Übersicht darüber, wie nachhaltig diese Gründungen tatsächlich sind und wie viele
  von diesen neu gegründeten Unternehmen nach wie vor existieren? Zu der hypothetischen
  Frage, wie viele Unternehmen davon jetzt demnächst noch da sein werden, kann ich
  natürlich nichts sagen. Nein, das ist nicht die hypothetische Frage, wie viele demnächst
  noch da sein werden, sondern die Frage, wie viele von denen, die möglicherweise
  im letzten Halbjahr oder auch schon im letzten Jahr gegründet wurden, jetzt noch
  da sind. Ich kann Ihnen sagen: Wir haben derzeit einen Höchststand an Gründungen,
  und falls es dazu Zahlen gibt, kann ich die gegebenenfalls nachreichen. Ich habe
  dazu spontan nichts zu sagen. Ich wollte das Thema der Mehrwertsteuersenkung in
  der Gastronomiebranche aufmachen. Das wurde hier vor fast genau einem Jahr vom Kabinett
  besprochen. Herr Hille, dabei waren Sie ja dankenswerterweise auch hier zu Gast
  und hatten uns diese Mehrwertsteuersenkung schmackhaft gemacht. Da hatten wir uns
  ja auch schon gewundert. Dann würde ich Sie gern angesichts aktueller Studien zur
  Bilanz nach einem Jahr zitieren. Sie haben uns gesagt: Die Erwartung der Bundesregierung
  ist, dass die Entlastung an die Verbraucher weitergegeben werde. ‑ Was ist aus Ihrer
  Hoffnung bzw. aus Ihrer Erwartung geworden? Erst einmal würde ich sagen, dass ich
  das doch ganz gut gesagt habe. Es bleibt natürlich auch nicht nur die Hoffnung,
  sondern auch die Erwartung. Aber wir sehen natürlich auch, dass alle Beteiligten,
  in diesem Fall die Gastronomie, auch mit besonderen Herausforderungen umzugehen
  haben. Aber grundsätzlich hat sich an meiner Aussage von damals nichts geändert.
  Nun hatten schon damals Fachleute darauf hingewiesen, dass es für die Fast-Food-Ketten
  quasi ein Steuergeschenk sein würde. Genau so scheint es ja gekommen zu sein. Es
  gibt jetzt Untersuchungen der Gewerkschaft Nahrung-Genuss-Gaststätten, die darauf
  hinweisen, dass die Preise sich sogar noch weiter erhöht haben und sich damit Ihre
  Erwartung, warum Sie es gemacht haben, nachweislich nicht erfüllt hat, Herr Hille.
  Herr Kall, ich würde noch das Finanzministerium ins Spiel bringen. Ich glaube, Sie
  waren damals noch nicht Sprecher. Aber Ihr Ministerium hat ebenfalls auf unsere
  Frage gesagt: Dem Charakter einer Verbrauchersteuersenkung wie in diesem Fall entspricht
  es grundsätzlich, dass sie an die Verbraucher weitergegeben werde. ‑ Warum haben
  Sie sich geirrt? Herr Kollege, es tut mir leid, ich kann die Frage spontan nicht
  beantworten bzw. nicht bewerten, weil ich die Zahlen nicht kenne, die Sie zitiert
  haben. Aber wir reichen gern eine Antwort nach. Herr Hille, bei der Frage- und Antwortsituation
  vor einem Jahr haben Sie gesagt ‑ man könnte fast „hypothetisch“ sagen ‑, Entlastung
  sei ja auch, wenn Preise in Zukunft nicht weiter steigen würden. Gilt der Satz noch?
  Sehen Sie insofern den Sinn der damaligen Mehrwertsteuerreduzierung dadurch erfüllt,
  dass Preise nicht weiter gestiegen wären? Diesen Satz finde ich noch besser als
  den, den Herr Kollege zitiert hat. Er ist natürlich richtig, auch wenn Sie den Eindruck
  haben, es sei ein bisschen humoristisch. Aber natürlich sind nicht stattfindende
  Belastungen auch Entlastungen. Das Wort, das ich verwendet habe, war nicht humoristisch,
  sondern hypothetisch. Es ist gut zu erfahren, dass manchmal auch auf hypothetische
  Fragen geantwortet wird. Nun haben aber ‑ das ist durchaus ernsthaft gemeint ‑ Untersuchungen
  ergeben, dass die Senkungen nicht weitergegeben wurden, die Preise aber auch nicht
  stabil gehalten wurden, sondern, im Gegenteil, weiterhin gestiegen sind. Wie bewerten
  Sie, dass auch sozusagen die zweite Ebene der Entlastung in Form einer Nichtweitersteigerung
  nicht hält? Ist es denn nicht doch ein mindestens partielles Scheitern des damaligen
  Ansatzes? Ich weiß genauso wie Kollege Kall nicht, auf welche Zahlen und Untersuchungen
  Sie sich beziehen. Ich kenne sie nicht. Auch wenn es zwischen heute und vor einem
  Jahr Entwicklungen gegeben haben sollte, dann ist das sozusagen der Lauf des Lebens.
  Ich kann es jetzt nicht anders beantworten als so, auch wenn es Sie nicht zufriedenstellen
  wird. Es macht jetzt jedenfalls die Aussagen von vor einem Jahr nicht verkehrt.
  Herr Hille oder Frau Deschauer, am Mittwoch haben die Kosovosonderkammern in Den
  Haag vier frühere UÇK-Führer erstinstanzlich wegen Kriegsverbrechen verurteilt.
  Welche Bedeutung hat dieses Urteil aus Sicht der Bundesregierung für die heutige
  Einordnung der deutschen Kosovopolitik während des Krieges und der Zusammenarbeit
  mit der UÇK? Ich kann es sehr kurz machen, auch angesichts der Zeit, aber auch,
  weil wir uns dazu geäußert haben: Ich würde Sie auf das Statement des deutschen
  Botschafters verweisen, das auf der Website eingestellt ist. Können Sie dazu vielleicht
  etwas nachreichen? Ich habe eine kurze Frage zum deutsch-französischen Panzerbauer
  KNDS. Die Frage geht an Herrn Hille, denke ich, und Herrn Kall. Ist die Bundesregierung,
  weil sich der Börsengang immer weiter verzögert, jetzt bereit, 40 Prozent des Unternehmens
  für 6 Milliarden Euro zu kaufen, zu übernehmen? Herr Kollege, ich kann sagen, dass
  ich dazu keinen neuen Stand habe. Ich habe eine Frage an Herrn Hille: Welchen Gruß
  schickt die Bundesregierung an die russische Bevölkerung angesichts der heute startenden
  Wahlen? Herr Kollege, ich verstehe die Frage nicht. Was für Grüße? Ich bin nicht
  in der Rolle, Grüße zu schicken. Sie kennen unsere Grundhaltung mit Blick auf diese
  Wahlen. Aber ich bin hier jetzt nicht der Grußbeauftragte der Bundesregierung. Sehen
  Sie es mir nach. Wie groß ist denn die Hoffnung der Bundesregierung, dass bei den
  Wahlen alles mit rechten Dingen zugeht? Auch in Anbetracht der Zeit halte ich es
  kurz. Ich glaube, wir müssen uns leider wieder auf Ergebnisse eines inszenierten
  Wahlrituals einstellen, über das wir uns dann in der kommenden Woche austauschen
  müssen. Am Sonntag wird in Berlin gewählt. Möglicherweise wird die Wahl eine Partei
  gewinnen, die sich für die Enteignung von Wohnungskonzernen ausspricht. Auf Bundesebene
  hat man verabredet, genau dagegen ein Gesetz zu verabschieden. Hält die Bundesregierung
  an diesem Vorhaben fest? Wie ist der aktuelle Stand? Ich kann nur sagen, dass wir
  uns vor ein paar Wochen hier in der RegPK dazu geäußert haben und ich dem nichts
  hinzufügen kann. Können Sie ganz kurz meinem Gedächtnis auf die Sprünge helfen?
  Gibt es einen Zeitplan? Die Gespräche dazu innerhalb der Bundesregierung laufen
  noch. Sonst kann ich Sie gern auf das Protokoll verweisen. Ich habe eine Frage an
  das BMI und das BMVg zu dem Fund der abgestützten Drohne nahe des Fliegerhorstes
  Wunstorf. Der GBA hat jetzt die Ermittlungen übernommen. Es gibt offenbar Hinweise
  auf einen möglichen Zusammenhang mit dem Vorfall in Leipzig. Die Drohne soll Medienberichten
  zufolge baugleich oder ähnlich aufgebaut sein. Was können Sie dazu mitteilen? Der
  Sachverhalt ist uns natürlich bekannt. Die Ermittlungen werden im Auftrag des GBA
  durch das BKA geführt. Wie Sie es gerade selbst schon gesagt haben, hat der GBA
  hierbei die Verantwortung bzw. die Zuständigkeit. Ich würde Sie also gern an die
  dortige Pressestelle verweisen. Dem kann ich mich grundsätzlich auch nur anschließen.
  Auch uns ist der Vorfall bekannt. Die ermittelnden Behörden ermitteln. Dazu äußern
  wir uns nicht. Zusätzlich kann ich sagen, dass wir natürlich den Standort Wunstorf,
  unsere Liegenschaft, im Zusammenhang mit dem Vorfall in der Nähe des Standortes
  auch noch einmal genauer untersucht haben. Dabei sind aber keine neuen Erkenntnisse
  herausgekommen. Herr Swistek, Sie sagten, Sie haben den Standort noch einmal genau
  untersucht. Haben Sie auch noch irgendetwas verändert, was Drohnenabwehr bzw. Drohnenerkennung
  an dem Standort angeht? Schärfen Sie dabei noch einmal nach? Auch dass wir an allen
  unseren Standorten, insbesondere wenn es sich um Fliegerhorste oder Ähnliches, auch
  Häfen, handelt, die Abwehrerkennung von Drohnen als Fähigkeit ausbauen, ist ein
  Prozess, der schon länger läuft. Dabei sind gerade unsere Fliegerhorste auch ganz
  führend. Dabei gibt es jetzt aufgrund dieses einen Vorfalls keine neuere Entwicklung.
  Es ist ein Prozess, der schon seit Längerem angestoßen ist und läuft und der quasi
  auch entsprechende Ergebnisse hervorbringt, sodass wir Aufzeichnungen und Bilder
  über Vorgänge haben, die über unseren Standorten passieren. Herr Swistek, kann das
  BMVg für die Bundeswehr denn derzeit ausschließen, dass die Trümmerteile dadurch
  entstanden sind, dass die Bundeswehr über der eigenen Liegenschaft oder nahe der
  eigenen Liegenschaft eine entsprechende Abwehr vorgenommen hat? Dazu sind mir aktuell
  gar keine Informationen bekannt.'
