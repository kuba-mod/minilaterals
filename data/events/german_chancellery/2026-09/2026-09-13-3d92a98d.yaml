title: Bundeskanzler Friedrich Merz reist zum EU -Arktis-Gipfel Europäische Partner
  beraten zum geopolitischen Wandel in der Arktis
text: 'Kanzler Merz im Gespräch mit Finnlands Ministerpräsident Orpo: Beim EU -Arktis-Gipfel
  geht es um die Rolle der EU in der Arktis. Auf Einladung des finnischen Ministerpräsidenten
  Petteri Orpo reist Bundeskanzler Friedrich Merz zum EU -Arktis-Gipfel. Dieser findet
  am 13. und 14. September 2026 im finnischen Rovaniemi statt. Gemeinsam mit weiteren
  EU -Partnern und Vertreterinnen und Vertretern der EU-Institutionen tauscht sich
  Bundeskanzler Merz über den gemeinsamen strategischen Ansatz der EU für die Arktis
  aus. Angesichts der wachsenden geopolitischen, wirtschaftlichen und umweltpolitischen
  Entwicklungen gewinnt die Region zunehmend an Bedeutung. Chancen bieten sich dort
  unter anderem in den Bereichen Rohstoffe, Handel, Raumfahrt und Forschung. Zudem
  öffnen sich mit dem Voranschreiten des Klimawandels neue Seewege in der Arktis.
  So wird die Region immer weiter ins geopolitische Rampenlicht gerückt. Dadurch zeigen
  neben der EU auch weitere Akteure Interesse an einer stärkeren Präsenz in der Arktis.
  Der EU -Arktis-Gipfel beginnt am Sonntag mit einem gemeinsamen Arbeitsessen, bei
  dem sich die Teilnehmerinnen und Teilnehmer über den strategischen und politischen
  Kontext des Gipfels austauschen. Am Montag findet eine Arbeitssitzung zu aktuellen
  Herausforderungen und sicherheitspolitischen Themen statt. Abschließend werden sich
  die Teilnehmerinnen und Teilnehmer über die Rolle der EU in der Arktis abstimmen.
  Am Nachmittag ist eine gemeinsame Pressebegegnung geplant.'
