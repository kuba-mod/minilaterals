title: Entlastung bei den Energiekosten Abschaffung der Gasspeicherumlage
text: 'Von der Abschaffung der Gasspeicherumlage werden alle Verbraucherinnen und
  Verbraucher profitieren. Die Gasspeicherumlage hat in den letzten Jahren eine wichtige
  Rolle bei der Sicherung der Gasversorgung in Deutschland gespielt. Seit dem 1. Januar
  2026 entfällt sie. Das ist ein wichtiger Schritt, um Verbraucherinnen und Verbraucher
  weiter zu entlasten und die Energiepreise in Deutschland zu stabilisieren. Gleichzeitig
  bleibt die Versorgungssicherheit gewährleistet. Die Gasspeicherumlage wäre ursprünglich
  bis zum 31. März 2027 erhoben worden. Die Kosten übernimmt der Bund. Die Bundesregierung
  hat damit eine der Maßnahmen des Energiepreis-Entlastungspakets und des Koalitionsvertrages
  umgesetzt. Das Gesetz zur Abschaffung der Gasspeicherumlage (Gesetz zur Änderung
  des Energiewirtschaftsgesetzes sowie zur Änderung des Kohleverstromungsbeendigungsgesetzes)
  ist am 28. November 2025 in Kraft getreten. Was bedeutet das für Gasverbraucher,
  die Energiepreise und die Versorgungssicherheit? Hier finden Sie alle wichtigen
  Informationen. Die Gasspeicherumlage wurde eingeführt, um die Kosten für das Befüllen
  von Gasspeichern in Deutschland zu decken. Diese Maßnahme wurde notwendig, um eine
  Gasmangellage im Krisenjahr 2022 zu verhindern. Die Trading Hub Europe GmbH (THE),
  der Marktgebietsverantwortliche für Gas in Deutschland, ist für die Befüllung der
  Gasspeicher zuständig. Die Kosten wurden bisher über die Gasspeicherumlage auf sogenannte
  Bilanzkreisverantwortliche verteilt. Diese Unternehmen sind für die Balance zwischen
  Gasangebot und -nachfrage verantwortlich. Letztlich wurden die Kosten an die Gaskundinnen
  und -kunden weitergegeben, sodass alle Verbraucherinnen und Verbraucher die Umlage
  mitgetragen haben. Von der Abschaffung der Gasumlage ab dem 1. Januar 2026 profitieren
  alle Verbraucherinnen und Verbraucher. Entlastung beim Gaspreis : Die Abschaffung
  wird alle Gasverbraucherinnen und -verbraucher im Jahr 2026 direkt um mehr als 3
  Milliarden Euro entlasten – sowohl Bürgerinnen und Bürger als auch Unternehmen.
  Private Haushalte und sonstige Kleinabnehmer werden um rund eine Milliarde Euro
  entlastet. Sie verbrauchen zusammen rund ein Drittel der Gasmenge. Großkunden, etwa
  energieintensive Produktionsunternehmen, benötigen zwei Drittel der Gasmenge und
  werden um rund zwei Milliarden Euro entlastet. Entlastung beim Strompreis: Auch
  beim Strom dürfte die Entlastung spürbar sein: Die niedrigeren Gaspreise sorgen
  für eine günstigere Stromproduktion von Gaskraftwerken. Die Strompreise am Markt
  dürften sich ebenfalls reduzieren, da sie sich nach den teuersten Energien ausrichten
  – das ist oft Gas. Weitergabe der Entlastung: Die Weitergabe der Entlastungen an
  die Endkundinnen und -kunden wird zudem überwacht. Damit wird sichergestellt, dass
  die Kundinnen und Kunden direkt mit einer niedrigeren Gasrechnung profitieren. Das
  hängt vom individuellen Verbrauch und von der Beschaffenheit des Wohngebäudes ab.
  beträgt die Gasspeicherumlage 0,289 Cent pro Kilowattstunde (kWh). Unterstellt man
  beispielsweise bei einem Haushalt mit Gasheizung einen Gasverbrauch von 20.000 kWh
  pro Jahr kommt man zu einer Entlastung von knapp 58 Euro. Hinzu kommen noch die
  weiteren geplanten Entlastungen beim Strompreis. Hier ist mit einer zusätzlichen
  Entlastung in Höhe von etwa 100 Euro zu rechnen. Die Abschaffung der Gasspeicherumlage
  ist Teil des Energiepreis-Entlastungspakets. Weitere Schritte zur Entlastung bei
  den Energiepreisen sind: Der Bundeszuschuss zu den Netzentgelten und die Senkung
  der Stromsteuer für produzierende Unternehmen. Insgesamt werden Bürgerinnen, Bürger
  und Unternehmen ab 2026 um etwa 10 Milliarden Euro entlastet. Mit ihren Maßnahmen
  für niedrigere Energiekosten will die Bundesregierung die Wirtschaft in Deutschland
  stärken und helfen, Arbeitsplätze zu sichern. Es ist Aufgabe der Unternehmen und
  der Händler, die Speicher zu füllen. Die Wintervorsorge des Markts läuft aktuell.
  Die Bundesregierung geht davon aus, dass neue staatlich angeordnete Befüllungsmaßnahmen
  in Folge des Iran-Krieges und der ungewissen Entwicklungen in der Straße von Hormus
  derzeit nicht notwendig sind. Die Bundesregierung beobachtet die Lage täglich. Durch
  flexiblere Möglichkeiten einzuspeisen, etwa durch LNG , und durch die seit 2022
  strukturell gesunkene Gasnachfrage, verringert sich zudem der Bedarf an Gasspeicherkapazitäten.'
