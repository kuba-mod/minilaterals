  Bühne abgeben. Sie können Ihre Kommentare gerne woanders abgeben. Ich beantworte
  gerne Fragen, aber ich kommentiere nicht Ihre Kommentare. Ich würde darum bitten,
  dass wir den Ton wieder mäßigen und uns auch nicht ins Wort fallen. Ich würde jetzt
  tatsächlich gerne mit der Frageliste fortfahren, weil hier Kolleginnen im Raum sind,
  die auch schon seit fast einer Stunde warten, ihre Fragen loszuwerden. Der Bundesumweltminister
  hatte ja vor ein paar Wochen mit seiner Partei einen Vorstoß zur Gemeinschaftsaufgabe
  Klimaanpassung gewagt. Mich würde interessieren, wie da die Beratungen laufen und
  wie der Stand der Dinge innerhalb der Bundesregierung ist. Es ist richtig, dass
  wir innerhalb der Bundesregierung und mit den Ländern darüber beraten. Eine konkrete
  Entwicklung ist die, dass im Rahmen der Umweltministerkonferenz an einer konkreten
  Ausgestaltung gearbeitet wird. Es soll im November ein konkreter Entwurf dafür vorgelegt
  werden, wie diese Aufgabe dann direkt aussehen kann. Innerhalb der Bundesregierung
  laufen die Gespräche noch. Wie ist denn da inzwischen die Haltung des Koalitionspartners?
  Die war am Anfang ja durchaus skeptisch. Ich glaube, das ist eine Frage, die nicht
  an mich geht. Dann gerne an Herrn Kornelius: Wie ist bei der Gemeinschaftsaufgabe
  Klimaanpassung die Haltung der Bundesregierung bzw. des Bundeskanzlers? Sollte man
  sich angesichts dieses Hitzesommers und des Klimawandels auch in der Bundesregierung
  weiter dafür einsetzen? Sie wissen, dass die Bundesregierung beschlossen hat, mit
  den Ländern dazu jetzt das Gespräch aufzunehmen. Staatsminister Amthor ist damit
  beauftragt. Ein Ergebnis kann ich Ihnen noch nicht präsentieren. Ich glaube, die
  wird sich jetzt auch mit diesen Gesprächen entwickeln. Es geht wieder um das Geld:
  In dem Entwurf des Bundeshaushalts hat die Bundesregierung keine Mittel für die
  sogenannte humanitäre Geste gegenüber den noch lebenden polnischen Opfern der NS-Besatzung
  vorgesehen, obwohl der Außenminister gehofft hat, dass diese Mittel gefunden werden.
  Liegt das an der angespannten Bundeshaushaltslage oder an verschiedenen Vorstellungen
  zwischen Polen und Deutschland, oder gibt es einen anderen Grund? Es gibt keine
  Entscheidung zu einer humanitären Geste, und diesen Stand, dass es keine Entscheidung
  gibt, reflektiert der Haushaltsentwurf aktuell. Es gibt keine Entscheidung der Bundesregierung?
  Und es gibt keine Chance, dass sich das im Laufe der Beratungen im Bundestag ändert?
  Das habe ich nicht gesagt. Ich habe gesagt: Aktuell gibt es keine Entscheidung zu
  einer humanitären Geste. Diesen Stand reflektiert der Haushaltsentwurf. Sowohl der
  Bundeskanzler als auch der Außenminister haben aber immer wieder deutlich gemacht,
  dass Deutschlands Verantwortung für das Gedenken und für die Erinnerungs- und Versöhnungsarbeit
  keinen Schlussstrich kennt. An das Verteidigungsministerium: Es gibt Berichte, dass
  der Verteidigungsminister Anfang Oktober nach Emden fährt . Können Sie das bestätigen?
  Sie beziehen sich da auf mehrere Berichte dazu. Die kommentieren wir selbstverständlich
  nicht. Über Ministerreisen informieren wir wie gewohnt, und wir würden Sie bitten,
  diese Berichte entweder abzuwarten oder auch nicht zu vernehmen. An das Auswärtige
  Amt: Die EU-Botschafter haben heute zwei russische Milliardäre von der EU-Sanktionsliste
  gestrichen . Anscheinend hat Deutschland zugestimmt. Warum ist das der Fall, warum
  können diese beiden Oligarchen jetzt nicht mehr sanktioniert werden? Sie rekurrieren
  auf eine Entscheidung der EU-27, also eine gemeinsam getroffene Entscheidung, zur
  Verlängerung der Sanktionen. Wichtig ist, dass wir das Ziel und auch das Gesamtbild
  in diesem Ziel weiter im Blick behalten, im Auge behalten. Über 3000 Personen und
  Unternehmen sind weiterhin gelistet, und 1600 Listungen sind in Vorbereitung. Es
  gibt also schon jetzt eine beträchtliche Zahl an Listungen, und es werden bald noch
  mehr Listungen sein. Wir haben jetzt auch eine Verlängerung von sechs Monaten auf
  36 Monate, also auf drei Jahre, erreicht. Das ist ein ganz erheblicher Fortschritt.
  Die Frage nach dem Auslaufen dieses Regimes und den damit verbundenen, ich sage
  einmal, Unebenheiten, die sich an diesen Nahtstellen immer wieder ergeben, entfällt
  damit erst einmal für geraume Zeit. Am Ende zählt, dass wir mit unserem Druck auf
  Moskau nicht nachlassen. Das ist, glaube ich, der wesentliche Punkt. Weil Sie mich
  darauf ansprechen: Die Verhandlungen selbst sind vertraulich, und ich werde jetzt
  keine Bewertungen zu Einzelpositionen abgeben. Das ist eine gemeinsame Entscheidung
  der EU-27, auf die man sich geeinigt hat. Alles andere ist medial aufbereitet worden,
  aber das werde ich hier jetzt nicht kommentieren. Ich habe ja gefragt, was die Gründe
  sind, genau diese beiden Personen von der Sanktionsliste zu nehmen, denen unterstellt
  wird, dass sie auch einen Beitrag zu dem Krieg gegen die Ukraine leisten. Ich kenne
  die Begründung der Entlistung noch nicht. Es wird sie geben, aber ich habe sie nicht
  vorliegen. Insofern kann ich dazu jetzt stante pede nicht referieren und würde Ihnen
  die Begründung gerne nachliefern. Die Ukraine fordert jetzt, nationale Sanktionen
  gegen die zwei Oligarchen zu verhängen. Wird Deutschland dem nachkommen? Ich habe
  Ihnen hier nichts anzukündigen. Ich habe ja gerade ausgeführt, wie wir insgesamt
  den Druck auf Russland über Sanktionen sehen und was das Ziel des Ganzen ist, nämlich
  dass wir die Ukraine in ihrer Verteidigung gegen den russischen Aggressionskrieg
  unterstützen und dass wir den Druck auf Moskau zugleich erhöhen, damit Verhandlungen
  zustande kommen können. Diesem Ziel bleiben wir weiter verpflichtet. Was sind die
  Erwartungen der Bundesregierung an den dreitägigen USA-Reise des chinesischen Präsidenten
  und das Treffen von Trump und Xi? Die Bundesregierung hat hier keine Erwartungen
  zu formulieren. Wir werden dieses Treffen, das ja eines von sehr, sehr vielen Treffen
  ist und auch im Umfeld der UN-Woche stattfindet, aufmerksam beobachten. Unsere Positionen
  gegenüber beiden Ländern sind bekannt. Natürlich ist es bedeutsam, dass sich diese
  zwei wichtigen Großmächte vor allem in handelspolitischen Fragen, aber auch in großen
  Fragen von Krieg und Frieden abstimmen. Die Bundesregierung hat insofern natürlich
  Hoffnungen, dass auch hier positive Impulse zu sehen sind. In welchen Bereichen
  wäre aus deutscher Sicht eine Entspannung zwischen Washington und Peking toll? Wie
  gesagt, wir wollen solche Beziehungen nicht von der Seitenlinie kommentieren; das
  steht uns nicht zu. Wir warten dieses Treffen jetzt einmal ab. Ich glaube, es gibt
  dann genug, das man von journalistischer Seite aus bemeinen kann. Weil wir ja vielleicht
  auch ein eigenes Handeln vorzutragen haben, möchte ich kurz ergänzen: Der Außenminister
  hat mit seinem chinesischen Amtskollegen Wang Yi gesprochen. Wir stehen mit der
  chinesischen Seite grundsätzlich in einem kontinuierlichen und regelmäßigen Austausch
  zu einer ganzen Bandbreite an internationalen Themen. Das Telefonat, das vorgestern
  geführt wurde, unterstreicht das noch einmal. Sie können auf X auch noch einmal
  nachlesen, was Inhalte des Gesprächs waren. An das Finanzministerium: Laut einem
  Bericht des „Handelsblatts“ möchte das Finanzministerium eine Verschärfung des Übernahmerechts
  angehen. Das sind wahrscheinlich Auswirkungen der Commerzbankübernahme. Können Sie
  das bestätigen, und wenn ja, können Sie sagen, worum es da genau geht? Da würde
  ich es so halten, dass wir Presseberichte nicht kommentieren. In dem Bericht steht,
  dass Sie sogar schon kommentiert haben. Deswegen habe ich es jetzt einfach einmal
  versucht. Ich habe Ihnen an dieser Stelle gerade nichts mitzuteilen. Wir können
  uns darüber aber gerne noch einmal austauschen. Falls es etwas nachzuliefern gibt,
  geht das auch über die üblichen Kanäle.'
