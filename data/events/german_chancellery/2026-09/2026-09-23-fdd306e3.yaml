date: '2026-09-23'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 23. September 2026
text: '(Vorsitzende Buschow eröffnet die Pressekonferenz und begrüßt StS Kornelius
  sowie die Sprecherinnen und Sprecher der Ministerien.) Einen schönen guten Tag auch
  von mir! Das Kabinett hat einige Beschlüsse gefasst, die ich Ihnen gerne weitergebe.
  Das Kabinett hat heute den von der Bundesministerin für Wirtschaft und Energie vorgelegten
  Bundesbericht Energieforschung 2026 beschlossen. Im Fokus der Energiepolitik der
  Bundesregierung steht das Zieldreieck von Versorgungssicherheit, Wettbewerbsfähigkeit
  und Klimaschutz. Der Energieforschung als strategisches Instrument dieser Politik
  kommt hierbei eine zentrale Rolle zu. Der Bericht behandelt das Berichtsjahr 2025,
  in dem die Bundesregierung rund 1,5 Milliarden Euro in die Erforschung innovativer
  Energietechnologien investiert hat. Das reicht von Grundlagenforschung bis zu anwendungsnaher
  Forschung und Erprobung. Wir schaffen damit die Voraussetzungen für ein bezahlbares,
  resilientes und klimaneutrales Energiesystem. Die Forschungsförderung der Bundesregierung
  im Energiebereich richtet den Blick dabei verstärkt auf den Markthochlauf von Innovationen.
  Es geht also darum, die Innovationszyklen zu verkürzen und Investitionen zu mobilisieren,
  die in die Energieinnovation gesteckt werden. Die Energieforschung ist Teil der
  Hightechagenda der Bundesregierung und stärkt damit auch die technologische Souveränität.
  Sie schafft Grundlagen für eine neue Wertschöpfung, Arbeitsplätze und natürlich
  Wettbewerbsfähigkeit. Das Kabinett hat heute auch die Abschaffung der Papierbelege
  , der Bonpflicht beschlossen. Die Bundesregierung will die Pflicht zur Ausgabe von
  Kassenbelegen aus Papier abschaffen. Papierbons sollen ab dem Jahr 2028 der Vergangenheit
  angehören. Stattdessen sollen die Belege digital bereitgestellt werden, zum Beispiel
  per QR-Code auf dem Kassendisplay. Wer weiterhin eine Papierquittung erhalten möchte,
  hat natürlich Anspruch darauf. Das soll aber ausdrücklich nur noch auf Wunsch der
  Kunden passieren. Ziel ist es, den Verkaufsalltag für die Händlerinnen und Händler,
  aber natürlich auch für die Kunden zu vereinfachen und zu modernisieren. Technik
  soll mit Bürokratierückbau im Handel verbunden werden. Moderne Technologien in digitalen
  Kassensystemen sollen dann zum Standard werden und damit auch den digital erstellten
  Kassenbon möglich machen. Durch den Wegfall von Papierbons werden Unternehmen von
  Bürokratie und Sachaufwand entlastet. Das wurde auch durchgerechnet und ergibt einen
  erklecklichen Betrag. Der Verzicht auf unzählige Mengen gedruckter Belege dient
  auch dem Schutz der Umwelt. Schließlich wird mit dem Gesetzentwurf dem Risiko von
  Steuerhinterziehung vorgebeugt. Es wird verringert. Dafür soll ab dem Jahr 2028
  eine Kassenpflicht ab einem jährlichen Gesamtumsatz von 100 000 Euro gelten. Ausnahmeregelungen
  sind möglich und auch vorgesehen. Außerdem wird die Bundesregierung Sanktionsmöglichkeiten
  einführen und die Ermittlungsbefugnisse der Finanzbehörden stärken, um Steuerhinterziehung
  effektiver zu bekämpfen. Als Letztes hat das Bundeskabinett heute den Aktionsplan
  gegen Sozialleistungsmissbrauch und Ausbeutung, insbesondere im Zusammenhang mit
  EU-Zuwanderung beschlossen. Sie wissen, dass Sozialleistungsmissbrauch das Vertrauen
  in den Sozialstaat schwächt und den Sozialstaat insgesamt schwächer macht. Der Aktionsplan
  bringt nun Instrumente auf den Tisch, um den Missbrauch besser aufzudecken und zu
  bekämpfen. Der Sozialstaat muss für diejenigen da sein, die ihn wirklich brauchen
  und nicht für jene, die ihn ausnutzen. Das ist natürlich eine Frage der Gerechtigkeit.
  Die Koalition setzt damit den Auftrag aus dem Koalitionsvertrag um und wird konkret
  der Einwanderung in die Sozialsysteme ein starkes Hindernis entgegensetzen. Sie
  wird damit deutlich reduziert. Der groß angelegte Missbrauch von Sozialleistungen
  im Inland, aber auch durch Menschen, die im Ausland leben, wird beendet. Sie wissen,
  dass der Aktionsplan verschiedene Maßnahmen bündelt, die in unterschiedlichen Ressorts
  angesiedelt sind. Dabei geht es zum Beispiel um Datenaustausch zwischen Behörden,
  damit Missbrauch noch schneller geahndet werden kann. Kommunen sollen leichter gegen
  Schrottimmobilien und missbräuchliche Vermietungspraktiken vorgehen können. Ein
  drittes Beispiel: Wer per Haftbefehl gesucht ist, soll keine Leistungen aus der
  Grundsicherung mehr erhalten. Grundlage dieses Aktionsplans sind die Entscheidungen
  des Koalitionsausschusses vom 1. Juli. Die Maßnahmen sind nun im Kabinett beschlossen
  und sollen bis Ende des Jahres auch parlamentarisch umgesetzt werden. (zum Bundesbericht
  Energieforschung 2026 ) Herr Kornelius, bei diesem Bericht war in der Vergangenheit
  oft Deutschlands Unabhängigkeit von fossilen Energien ein Thema. Dazu haben Sie
  jetzt nichts gesagt. Was ist der Zielplan? Der Zielplan? Meinen Sie den Bundesbericht
  Energieforschung? Aber das ist ja das Ziel dieser Energieforschung ‑ ‑ ‑ Sie sprechen
  jetzt nicht von dem Plan, der heute in New York verabschiedet wurde, oder? Sorry!
  Ziel dieses Berichts, warum man an Energie forscht, ist ja die Unabhängigkeit von
  fossilen Energien. Was ist die Zielmarke laut diesem Bericht? Nein, dieser Bericht
  dient nicht der Unabhängigkeit von fossiler Energie. Der Bericht Energieforschung
  bezieht sich auf Forschung, wie es schon im Titel steht. Es geht um innovative,
  um neue Energietechnologien und damit natürlich die Ablösung von fossilen Energien.
  Aber im Kern steht die Forschung an den neuen Energieträgern und vor allem an der
  Möglichkeit, den Hochlauf zu beschleunigen und sie in den Markt zu bringen. Vielleicht
  haben wir jetzt aneinander vorbeigeredet. Ziel dieser Forschung sind innovative
  Energien, damit man nicht mehr von fossilen Energien abhängig ist. Wann will man
  denn unabhängig von fossilen Energien sein? Die Zeitpläne dazu kennen Sie. Sie haben
  sich nicht geändert. Dazu wurde heute in New York auch ein Plan übergeben. Dazu
  wird das Umweltministerium sicherlich noch detaillierter Auskunft geben können.
  Wir legen in New York den Fahrplan für die Abkehr von fossilen Energieträgern vor.
  Das ist die sogenannte TAFF-Roadmap. TAFF steht für Transitioning Away from Fossil
  Fuels. Das ist das dritte Land, das einen solchen Plan vorlegt. Bei der Weltklimakonferenz
  2023 hat man ja beschlossen, dass man schrittweise von den fossilen Brennstoffen
  wegkommt. Wir wollen mit diesem Fahrplan weitere Dynamik in dem Prozess erzeugen.
  Das Wichtige ist: Es sind bekannte Maßnahmen, die darin stehen, wie Deutschland
  den Weg zur Klimaneutralität wählt. Dabei geht es um erneuerbare Energien und die
  Elektrifizierung von Mobilität, Wärmeerzeugung und industriellen Prozessen. Wir
  veröffentlichen dazu auch eine Pressemitteilung. Ich darf den Bundesumweltminister
  an dieser Stelle schon einmal zitieren: „Nicht nur die weltweiten Wetterextreme
  zeigen, wie dringend mehr Klimaschutz ist. Immer mehr Ländern wird bewusst, wie
  teuer und wie gefährlich die Abhängigkeiten von fossilen Energien sind. Wenn die
  Lage an der Straße von Hormus darüber entscheidet, ob Menschen sich den täglichen
  Weg zur Arbeit noch leisten können, dann ist das kein guter Zustand. Wir müssen
  die Abhängigkeit von fossilen Energien überwinden, und wir können sie überwinden.
  Mit diesem Fahrplan legen wir nicht nur eine Klimastrategie vor, sondern auch eine
  wirtschaftspolitische Strategie.“ (zum Gesetzentwurf zur Fortentwicklung von Kassenaufzeichnungen
  und zur Bekämpfung von Steuerhinterziehung sowie zur weiteren Digitalisierung handels-
  und steuerrechtlicher Aufzeichnungen ) Bedeutet das, dass ab 2028 alle Supermarktkassen
  QR-Codes erzeugen und den Kunden anbieten müssen oder ich wahlweise meine E-Mail-Adresse
  bei der Kassiererin hinterlegen muss, um den elektronischen Bon zu bekommen, oder
  wie stellt man sich das vor? Die technologische Umsetzung wird gerade erarbeitet.
  Vielleicht kann das BMF, in dessen Federführung das liegt, mehr dazu sagen. Es sieht
  so aus, wie Sie sagen. Standard wird der digitale Beleg sein. Wie das dann im Einzelnen
  genau aussehen wird, hängt davon ab, wie es umgesetzt wird. Aber die Form, die Ihnen
  wahrscheinlich schon bekannt ist, ist, dass einem ein QR-Code auf dem Display angezeigt
  wird. Wenn man die Rechnung erhalten will, scannt man ihn. Heißt das, dass dann
  Hunderttausende Kassen umgerüstet werden müssen, weil solche QR-Code-Kassen bisher
  ja die Ausnahme sind? Es wird einen gewissen Umrüstungsbedarf geben. Aber was bei
  Umsätzen ab 100 000 Euro verwendet werden muss, ist eine sogenannte Registrierkasse.
  Diese Registrierkassen sind jetzt schon sehr weit verbreitet. Wir haben nur noch
  ein bisschen mehr als 100 000 Kassen, die keine solchen Registrierkassen sind. Insofern
  wird sich der Umrüstungsbedarf in Grenzen halten. Aber ja, der Standard wird der
  digitale Beleg sein. Nur auf Nachfrage gibt es noch einen physischen Beleg. Die
  normalen Supermarktkassen verfügen ja bereits über ein Display. Es wird kein großer
  technischer Aufwand sein, da auch einen QR-Code aufzuspielen. Vielleicht kann man
  das auch durch NFC lösen, also durch Near Field Communication. Vielleicht können
  Sie es auch an Ihre Kreditkarte koppeln, wenn Sie bargeldlos zahlen. Ich denke,
  technologische Fantasien sind jetzt willkommen. Es gibt Möglichkeiten, das umzusetzen.
  In vielen Supermärkten gibt es kein WLAN. In vielen Supermärkten gibt es auch keinen
  Mobilfunkempfang. Wie soll man dann diesen QR-Code scannen? Ich bin mir sicher,
  dass das technisch umgesetzt werden kann. Auch jetzt schon gibt es Supermärkte ‑ das
  kann ich aus eigener Anschauung sagen ‑, die selbst ein WLAN-Netzwerk anbieten.
  So ist mir das bisher aus der Praxis bekannt. Aber bis 2028 werden sicherlich Lösungen
  gefunden werden, damit das flächendeckend abgerufen werden kann, vielleicht auch
  über Wege, die nicht unbedingt eine Internetverbindung erfordern, wie der Regierungssprecher
  eben schon ausgeführt hat. Es gibt Umrüstungsbedarf; das haben Sie uns erklärt.
  Wer zahlt das denn? Müssen das die betroffenen Geschäfte aus eigener Tasche zahlen,
  oder lässt sich das steuerlich geltend machen? Schon im jetzigen Einkommensteuerrecht
  gibt es Möglichkeiten, das steuerlich geltend zu machen. Das Statistische Bundesamt
  hat im Rahmen des Gesetzgebungsverfahrens berechnet, welche Kosten auf die Unternehmen
  wahrscheinlich zukommen. Die günstigste Möglichkeit ist eine sogenannte cloudbasierte
  Lösung. Das bedeutet, dass man dann die Hardware anschafft, Tablets oder Smartphones,
  und eine cloudbasierte Software aufspielt. Dann halten sich die Anschaffungskosten
  in engen Grenzen ‑ hundert Euro oder etwas mehr für die Software, und dann kommt
  noch die Hardware dazu ‑, sodass man in einkommenssteuerrechtlichen Begriffen oft
  im Rahmen der sogenannten geringwertigen Wirtschaftsgüter ist, die man, ohne Absetzung
  für Abnutzung geltend zu machen, schon im Jahr der Anschaffung vollumfänglich geltend
  machen kann. Was auch möglich sein wird, ist, vom Investitionsabzugsbetrag, der
  noch etwas mehr Spielraum lässt, Gebrauch zu machen. Freuen Sie sich, dass der Zettel
  wegfällt! (zum Aktionsplan gegen Sozialleistungsmissbrauch und Ausbeutung, insbesondere
  im Zusammenhang mit EU-Zuwanderung ) Wenn ich mich richtig erinnere, war es der
  Innenminister, der davon sprach, dass damit auch eine Lücke im Sozialstaat gestopft
  werden solle. Können Sie beziffern, welches Ausmaß diese Lücke in Einzelfällen und
  in Euro hat? Zunächst einmal der Hinweis, dass hierzu um 15 Uhr eine PK stattfinden
  wird, auf der der Innenminister Rede und Antwort stehen wird. Zu der konkreten Frage
  kann ich Ihnen sagen, dass ganz klar ist, dass verschiedene Schlupflöcher im Sozialstaat
  geschlossen werden sollen. Wer mit Haftbefehl gesucht wird, soll zukünftig keine
  Sozialleistungen mehr beziehen dürfen. Es ist auch Teil des Aktionsplans, in dem
  Bereich, auf den sich der zweite Teil Ihrer Frage bezieht, mehr Klarheit zu schaffen.
  Denn tatsächlich wird nicht systematisch erfasst, wie viele Personen im konkreten
  Fall trotz Haftbefehl noch Sozialleistungen erhalten. Durch den verbesserten Datenaustausch,
  der durch den Aktionsplan vorgesehen ist, soll auch gerade in diesem Bereich das
  Dunkelfeld erhellt werden. Unter den Maßnahmen, bei denen es unter dem Stichwort
  „Schrottimmobilien“ um Vermietungsmodelle geht, befindet sich, wenn ich es richtig
  verstanden habe, auch das Mittel der Enteignungen. Warum hier, aber nicht auch bei
  missbräuchlicher Vermietung zum Beispiel in Berlin? Sie bringen jetzt zwei Dinge
  zusammen, die ich so nie zusammenbringen würde. Ich verweise noch einmal darauf,
  dass die Detailvorstellung tatsächlich gleich im Anschluss stattfinden wird. Das
  betrifft auch die Novelle des Baugesetzbuches. Insofern sehe ich die primäre Zuständigkeit
  dafür auch nicht in meinem Hause. Es geht ja auch um die Verpflichtung zur Instandhaltung.
  Wenn ihr nicht nachgekommen wird, dann muss den Behörden natürlich eine Zugriffsmöglichkeit
  gegeben werden. Das ist nach Baugesetzbuch sehr schwierig, und das wird erleichtert.
  Vielleicht kann das Bauministerium dazu ergänzen. Genau, ich kann gern ergänzen.
  Wie der Kollege gerade schon gesagt hat, hat das eine ‑ Schrottimmobilien ‑ mit
  dem anderen ‑ Enteignung von Wohnungskonzernen in Berlin ‑ nicht zwingend etwas
  zu tun. Die Ministerin hat sich gerade dazu geäußert. Es geht darum, dass man gegen
  Schrottimmobilien vorgeht. Denn sie belasten ganze Nachbarschaften. Wenn in Quartieren
  Gebäude seit Jahren leer stehen, Fassaden bröckeln, Grundstücke vermüllen etc.,
  dann betrifft das alle. Man will den Kommunen jetzt Möglichkeiten an die Hand geben,
  dagegen vorzugehen. Das war rechtlich bisher schwierig, und das wollen wir jetzt
  im Baugesetzbuch lösen, damit die Kommunen damit nicht allein gelassen werden. Wie
  gesagt, bekommen sie Werkzeuge an die Hand. Sie sollen leichteren Zugang zu den
  Immobilien und ein besseres Vorkaufsrecht bei Schrottimmobilien bekommen. Als letztes
  Mittel, wenn andere Maßnahmen nicht greifen, soll in äußersten Härtefällen auch
  die Enteignung eine Möglichkeit sein. Das ist ausdrücklich kein Instrument für den
  Regelfall, sondern steht am Ende einer abgestuften Reaktionskette. Das alles soll
  im Baugesetzbuchupgrade beschlossen werden, das derzeit im Deutschen Bundestag beraten
  wird. Im Vorfeld gab es, gerade was das Thema des Datenaustauschs zwischen Jobcentern
  und den Justizbehörden angeht, erhebliche Nachfragen. Eigentlich war dieses Papier
  ja schon für Juli erwartet worden. Jetzt ist es September geworden. Können Sie uns
  vielleicht einmal mitnehmen und darstellen, was denn zu dieser Verzögerung geführt
  hat? Sie wurde in der Vergangenheit aus dem politischen Raum ja heftiger kritisiert.
  Das können wir nur bedingt darstellen, weil es sich um regierungsinternes Handeln
  handelt, das wir üblicherweise ja nicht kommentieren. Ich kann Ihnen sagen, dass
  Ministerin Bas dieses Thema als eines ihrer ersten größeren Themen schon im Frühjahr
  des vergangenen Jahres angesprochen hatte. Sie hatte sich auch noch im Herbst des
  vergangenen Jahres mit den betroffenen Kommunen vor allem aus dem Ruhrgebiet, aber
  auch anderswo zusammengesetzt und sich konkret schildern lassen, was aus kommunaler
  Sicht die Probleme sind und was mögliche Lösungen sind. Dann wurde auch sehr schnell
  eine Staatssekretärsrunde eingerichtet. Das BMAS hat dazu im Juni, meine ich ‑ vielleicht
  war es auch im Juli ‑, einen Entwurf vorgelegt. Danach wurde dieser intern in der
  Regierung abgestimmt. Das betraf das Thema von Schrottimmobilien. Das ist durchaus
  richtig. Es betraf aber nicht den Datenaustausch zwischen Jobcentern und Justizbehörden
  wegen der offenen Haftbefehle. Darauf möchte ich noch einmal hinweisen. Es hat ja
  auch seitens der Unionsfraktionen noch heftige Kritik gegeben, namentlich durch
  Herrn Krings. Auch dazu sage ich: Wir kommentieren Kritik aus dem politischen Raum
  wie üblich nicht. Ich kann Ihnen sagen, dass jetzt im Aktionsplan steht, dass wir
  gesetzlich ausschließen werden, dass per Haftbefehl gesuchte Personen weiterhin
  Leistungen nach SGB II und SGB XII erhalten. Dies betrifft insbesondere rechtskräftig
  zu einer Freiheitsstrafe verurteilte Straftäter, die sich dem Haftantritt trotz
  Ladung zum Haftantritt entziehen. Die weitere Festlegung der von der Regelung umfassten
  Arten von Haftbefehlen bleibt den Regierungsberatungen des Gesetzentwurfs vorbehalten.
  Ich habe eine kurze Nachfrage zu den Zahlen: Von wie vielen konkreten Fällen bzw.
  Personen sprechen wir bei den Haftbefehlen? Ich glaube, das hatte der Kollege schon
  ausgeführt: Es gibt diese Zahlen bislang nicht. ‑ Deswegen, damit wir diese Zahlen
  überhaupt erheben können, wollen wir diesen Datenaustausch ermöglichen. Vielleicht
  noch zur Erläuterung der Komplexität: Es sind ja sehr viele Gewerke, die dabei ineinandergreifen
  und die dann in Einklang gebracht werden müssen. Das hat natürlich dann einen umfassenden
  Prüfungsauftrag nach sich gezogen. Wir sprechen von Datenaustausch zwischen Sozialämtern,
  Ausländerbehörden, Meldebehörden, Finanz- und Sicherheitsbehörden, Baubehörden,
  Krankenpflegekassen, Pushnachrichten aus dem Ausländerzentralregister usw. Es sind
  also alles Entitäten, die in unserer Behördenarchitektur auch unterschiedliche Aufhängungen
  haben und deswegen in Einklang gebracht werden müssen. „Per Haftbefehl gesucht“
  heißt ja noch nicht „rechtskräftig verurteilt“. Mich würde aber interessieren: Heißt
  es denn jetzt, dass nicht rechtskräftig verurteilte Menschen kein Recht mehr auf
  ein Existenzminimum haben? Genau das habe ich vorgetragen. Es betrifft in der Regelung,
  die jetzt festgehalten ist, insbesondere rechtskräftig zu einer Freiheitsstrafe
  verurteilte Straftäter, die sich einem Haftantritt entziehen. Weitere Festlegungen,
  zu anderen Arten von Haftbefehlen, werden im Gesetzgebungsverfahren geregelt. Das
  heißt, es ist noch nicht geregelt. Das müsste ich an das Justizministerium übergeben.
  Das kann ich jetzt für das BMAS nicht rechtsförmlich beantworten. Es geht also um
  rechtskräftig Verurteilte, die ihre Haft nicht antreten und darum ein Haftbefehl
  auf sie ausgesetzt ist. Diese haben dann kein Existenzminimum? Das ist so im Aktionsplan
  festgelegt, denn sie können ihr Existenzminimum ja in der Haftanstalt verwirklichen.
  Können die Ressorts, die an dem Arbeitstreffen beteiligt waren, das es gestern Abend
  im Bundeskanzleramt gab, vielleicht etwas dazu sagen, ob es mit Blick auf die Ergebnisse
  der Landtagswahlen jetzt Pläne zu Abstrichen bei den bisherigen Plänen gibt, zum
  Beispiel in Sachen von Pflegereform, Rentenreform? Sollten jetzt zum Beispiel beim
  Thema der Übergangsfristen, beim Thema der Rente andere Regelungen getroffen werden?
  Wie Sie zu Recht sagen, handelte es sich um ein Arbeitstreffen. Diese Arbeitstreffen
  kommentieren wir nicht. Der Gegenstand der Beratungen, nicht übrigens erst des letzten
  Treffens, das Sie angesprochen haben, sondern schon einiger Treffen davor in verschiedenen
  Rahmen, ist natürlich die Umgestaltung der Koalitionsbeschlüsse vom 2. Juli, das
  heißt die Beschlüsse zur Rentenreform, aber auch den anderen Reformen, die in diesem
  Paket beschlossen wurden. Dabei geht es jetzt um Zeitpläne und konkrete Ausgestaltungen,
  um die Abstimmung zwischen den Ressorts. Es wird vorgenommen und dann zeitnah, in
  dem Moment, in dem es auch Gesetzgebungsreife erfahren hat, öffentlich gemacht.
  Hat es denn aber Abweichungen von bisherigen Zeitplänen gegeben, zum Beispiel was
  die letzten Tage angeht? Die Zeitpläne werden miteinander abgestimmt, auch mit den
  Ländern. Auch die Länder müssen zustimmen. Das heißt, wir haben es hierbei mit einem
  sehr umfassenden Abstimmungswerk zu tun. Es tut mir leid, dass unser System diese
  Abstimmungen vorsieht. Das erzeugt eine gewisse Schwerfälligkeit und aus Ihren Augen
  möglicherweise eine Langsamkeit. Aber es dient auch der Genauigkeit und am Ende
  der Qualität einer Reform. Direkt daran anknüpfend habe ich eine Frage an Herrn
  Kornelius und Herrn Elsässer. Es geht um die Pflegereform . Dazu hatte der Minister
  ja schon Änderungen angekündigt. Es ging um die Frage, wie man es finanzieren kann.
  Können Sie uns sagen, ob eine Finanzierung für die Rentenzuschüsse für pflegende
  Angehörige gefunden wurde? Auch hierzu befindet sich die Koalition in den letzten
  Abstimmungsrunden und wird sehr zeitnah den Entwurf vorlegen. Herr Elsässer, können
  Sie sagen, wann die Pflegereform ins Kabinett kommen soll? Inhaltlich werde ich
  mich hier auch nicht dazu verhalten. Dem habe ich nichts hinzuzufügen. Was ich bestätigen
  kann, ist, dass wir einen Kabinettsbeschluss für den kommenden Mittwoch, den 30. September,
  anstreben. Ich habe noch eine Frage zu den Äußerungen des Kanzlers zum Thema der
  Krankenkassen . Helfen Sie uns einmal, wie man folgenden Satz verstehen muss; er
  hat gesagt: „Wir haben in der Koalition verabredet, dass wir die Entscheidungen
  in der gesetzlichen Krankenversicherung wirkungsgleich auch auf die private Krankenversicherung
  übertragen.“ Das habe man bisher nicht getan und werde es jetzt nachholen. Um was
  für Entscheidungen, die auf die private Krankenversicherung übertragen werden sollen,
  geht es dabei? Ich werde hier die Äußerungen des Bundeskanzlers nicht weiter kommentieren.
  Spielen Sie auf die Diskussion um den Finanzausgleich an, oder was ist Ihre Frage?
  Nein, ich möchte einfach nur wissen, was der Kanzler damit gemeint hat. Deswegen
  hatte ich auch Herrn Kornelius gefragt. Der Bundeskanzler hat sich ja in einer sehr
  allgemeinen Form zum System unserer Krankenversicherung geäußert. Er hat das System
  nicht infrage gestellt. Ich sage es auch, weil ich es in den vergangenen Tagen mehrfach
  lesen musste. Ich lege Ihnen sehr nahe, das Zitat korrekt wiederzugeben und zu lesen.
  Dieses Zitat beinhaltet keine Infragestellung unseres Systems. Er hat auf das wachsende
  Gefühl der Ungerechtigkeit in der Bevölkerung hingewiesen und darauf, dass viele
  Menschen Unterschiede beim Zugang zur Versorgung wahrnehmen, vor allem bei den Facharztterminen.
  Bei der Umsetzung ‑ das ist nun Ihre Frage ‑ hat er eine Gleichanwendung thematisiert.
  Geht es dabei dann auch um das Sparpaket, das sich bisher auf die gesetzlichen Kassen
  bezieht, also zum Beispiel höhere Zuzahlungen bei Medikamenten, die auf die privaten
  übertragen werden sollen? Ich glaube, dass der Bundeskanzler jetzt nicht im Detail
  Vorgaben macht, wie diese Umgestaltung auszusehen hat. Aber es ist jetzt natürlich
  Teil der Umsetzung, im System insgesamt auf eine gleichwertige Belastung zu achten.
  Herr Kornelius, ich muss noch einmal nachfragen, was der Kanzler damit gemeint hat,
  weil es ja selbst in der Union unterschiedliche Deutungen gab. Ja, er hat nicht
