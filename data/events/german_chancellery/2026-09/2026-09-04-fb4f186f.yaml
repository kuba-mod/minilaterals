title: Bundesregierung aktuell
text: 'Deutschland wird schon seit geraumer Zeit bedroht und verdeckt angegriffen.
  Wir sprechen in diesem Fall von einem hybriden Szenario – ein Begriff, der nicht
  ohne Grund in den letzten Tagen in Frage gestellt wurde. Denn der Angriff auf die
  Flugzeuge in Leipzig war konkret, er hätte eine Katastrophe auslösen können, wäre
  er geglückt. Verdeckt war allenfalls der Angreifer, aber auch hier herrscht nun
  Gewissheit: Die Bundesregierung hat Russland als Drahtzieher benannt. Tatmuster,
  polizeiliche Ermittlungen und nachrichtendienstliche Erkenntnisse belegen eine russische
  Verantwortung für den Drohnenangriff. Vielerorts, und vor allem vom russischen Präsidenten
  selbst, wird die Beweiskraft dieser Attribuierung angezweifelt. Aber Präsident Putin
  kennt den deutschen Rechtsstaat und weiß, dass die Beweise bis hin zu einem Gerichtsverfahren
  ihre Kraft entfalten können. Der Rechtsstaat weist keine Täterschaft zu, wenn er
  sich nicht zweifelsfrei sicher ist. Konkrete Informationen – die Namen mutmaßlicher
  Täter, Reisewege, Aufnahmen, DNA-Spuren – werden bewusst nicht genannt, um keine
  Rückschlüsse auf die Ermittlungen zu ermöglichen. Die Bundesregierung hat also auf
  den missglückten Angriff eine klare Antwort gegeben. Das russische Generalkonsulat
  in Bonn wird geschlossen, der Vertrag für das Russische Haus in Berlin gekündigt,
  russische Staatsangehörige werden bei der Einreise verschärft kontrolliert und der
  Druck auf die russische Schattenflotte erhöht. Auch steht die Bundesregierung zur
  ihren sicherheitspolitischen Grundüberzeugungen. Die militärische Hilfe für die
  Ukraine wird verstärkt. Deutschland reagiert entschlossen, besonnen und verhältnismäßig
  – und ohne zu eskalieren. Die Unterstützung der Partner in der Europäischen Union
  und der NATO gibt all dem zusätzliche Sicherheit. Trotz dieser harten Erkenntnis
  gilt: Deutschland befindet sich nicht im Krieg, aber es ist täglich Ziel hybrider
  Kriegsführung mit Angriffen auf die Kommunikationsnetzwerke, mit Desinformation
  oder Brandanschlägen etwa auf die Rüstungsindustrie. Dieser Befund ist ernst. Die
  Angriffe sollen Unsicherheit schüren und politische Instabilität auslösen. Sie finden
  nicht zufällig vor wichtigen Wahlen statt. Der Spielplan sieht Sabotage, Spionage,
  Desinformation und die Vorbereitung von Anschlägen vor. In den Zielkoordinaten findet
  sich vor allem die kritische Infrastruktur – also Verkehrswege, die Infrastruktur
  oder Stromnetze. Am Ende wird getestet, wie widerstandsfähig ein modernes demokratisches
  Land solchen Angriffen gegenüber ist. Die Bundesregierung hat im letzten Jahr vieles
  auf den Weg gebracht, um Deutschland und seine Bevölkerung besser zu schützen. Ein
  Abwehrzentrum Hybrid wurde eingerichtet, das Dachgesetz zur kritischen Infrastruktur
  (KRITIS) verabschiedet. Hier geht es um die Lebensadern im Land für Energie und
  Verkehr, um das Gesundheitswesen oder die Trinkwasserversorgung. Zur Widerstandsfähigkeit
  gehört aber auch, dass Deutschland wirtschaftlich stark sein muss. Sicherheit und
  Wachstum verstärken sich gegenseitig. Deshalb hat die Bundesregierung in dieser
  Woche die erste Einkommenssteuerreform seit 20 Jahren beschlossen, die untere und
  mittlere Einkommen spürbar entlastet. Besser wird es auch beim Grund- und Kinderfreibetrag,
  bei Kindergeld und Arbeitnehmerpauschbetrag sowie bei Zuschlägen, die für Sonn-
  und Feiertagsarbeit gezahlt werden. Finanziert werden die Entlastungen unter anderem
  dadurch, dass sehr hohe Einkommen künftig einen höheren Beitrag leisten und einzelne
  Steuervergünstigungen reduziert werden. Die Einkommenssteuerreform kommt besonders
  Familien mit Kindern zugute. Von 2028 an kann eine Familie mit zwei Kindern und
  einem Einkommen von 60.000 Euro gegenüber heute um rund 600 Euro jährlich steuerlich
  entlastet werden. Gut, dass zeitgleich auch die Kerndaten für die Wirtschaftsentwicklung
  besser werden. Die Prognosen für das Bruttoinlandsprodukt verbessern sich – das
  ist ein erfreuliches Zeichen. Außenminister Johann Wadephul am 01.09.2026: „Deutschland
  bleibt sicher und Deutschland wehrt sich gegen Gegner, die Unsicherheit stiften
  wollen. Die Bundesregierung geht deshalb gegen Russland als Urheber des hybriden
  Angriffs von Leipzig vor.“ Das Weimarer Dreieck ist ein europäisches Gesprächs-
  und Kooperationsformat. Es wurde 1991 nach der deutschen Wiedervereinigung und dem
  Ende der Teilung Europas zwischen dem deutschen Außenminister Genscher und seinen
  polnischen und französischen Amtskollegen gegründet. Damals wie heute geht es darum,
  gemeinsam Verantwortung für ein freies, sicheres und handlungsfähiges Europa zu
  übernehmen. Der zweifache Kanu-Olympiasieger Ronald Rauhe ist neuer Staatsminister
  für Sport und Ehrenamt. Die wichtigsten Aufgaben sind die anstehende deutsche Olympiabewerbung,
  die Spitzensportreform und die Stärkung des Ehrenamts. Als langjähriger Spitzensportler
  bringt er umfangreiche persönliche Erfahrungen aus dem nationalen und internationalen
  Leistungssport in sein neues Amt ein. Wir freuen uns über Ihr Feedback: Nutzen Sie
  bitte dafür das Kontaktformular (nicht die Antwortfunktion auf diese E-Mail).'
