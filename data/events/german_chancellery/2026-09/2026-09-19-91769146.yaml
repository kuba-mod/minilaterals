title: Bundesregierung aktuell
text: 'hinter uns liegt eine Woche der Neuentdeckungen - terra incognita, Neuland,
  wohin das Auge reicht. Von der Arktis bis zur Sanduhr - der politische Alltag kennt
  keine Routine. Auch nicht im Umgang mit den Krisen dieser Erde, wo in dieser Woche
  die Golf-Region für einen dramatischen Schock gesorgt hat. Dort nutzen iranische
  Erfüllungsgehilfen wie die jemenitischen Huthis die Abhängigkeit großer Teile der
  Welt von den Rohstoffen der Golf-Staaten. Die Sprengung einer zentralen Ost-West-Pipeline
  in Saudi-Arabien hat die Verwundbarkeit offenbart und schlagartig die Spritpreise
  auch in Deutschland nach oben gejagt. Für viele Menschen, die jeden Tag auf ihr
  Auto angewiesen sind, war eine Belastungsgrenze erreicht. Die Bundesregierung hat
  deshalb gemeinsam mit den Bundesländern in nur drei Tagen gehandelt. Der Bund senkt
  die Spritpreise um 17 Cent pro Liter. Das wird man an der Tankstelle spüren. Insgesamt
  werden die Bürgerinnen und Bürger und die Wirtschaft um rund 2,5 Milliarden Euro
  entlastet. Die Länder leisten ihren Beitrag in einer Höhe von 1,25 Milliarden Euro
  über einen Umsatzsteuerfestbetrag. Darüber hinaus wird der Bund mit der Mineralölwirtschaft
  sprechen, um einen Spritpreisdeckel nach dem Vorbild Luxemburgs oder Belgiens spätestens
  zum 1. Januar 2027 einzuführen. Spritpreisdeckel, das bedeutet: Die Bundesregierung
  wird mit den Mineralölkonzernen zusammenarbeiten, damit der realistische, vom Markt
  erzwungene Preis, auch bei den Verbrauchern ankommt. Ausschläge sollen so verhindert
  werden. Auch wenn das Zeitalter der Entdecker längst hinter uns liegt – auch die
  Arktis bleibt terra incognita. Die Erderwärmung und neue technologische Möglichkeiten
  zwingen dazu, die Polarregion aus vielen Winkeln neu zu betrachten. Rohstoffe, Transportwege,
  Sicherheit, das Klima und der Lebensraum Arktis: Die Exploration dieser gewaltigen
  Erdmasse ist entbrannt, der Kampf um die geopolitischen Interessen hat begonnen.
  Auch die Europäische Union widmet sich diesem Thema, konkret beim Arktis-Gipfel
  im finnischen Rovaniemi, an dem auch Bundeskanzler Friedrich Merz teilgenommen hat.
  Die bestehende Arktis-Strategie soll schnellstmöglich um das Kapitel Sicherheit
  und Verteidigung erweitert werden. Daran hat auch Deutschland als Ostsee-Anrainer
  und Nachbar der unmittelbaren Arktis-Nationen ein Interesse. Das Treffen in der
  Stadt des Weihnachtsmannes ließ dabei wenig Platz für Winterromantik und Polarlicht-Euphorie.
  Es ging um die Sicherheit Europas, den Schutz von Datenleitungen und Pipelines,
  sichere Seewege, eine lange Landgrenze zu Russland und das Vertrauen in die Bündniskraft
  der Europäer. Die wachsende Präsenz Russlands beherrscht das sicherheitspolitische
  Bewusstsein nicht nur der Finnen. Deswegen ist das Signal von NATO und EU auch wichtig
  für die Menschen vor Ort, die sich in atemberaubender Geschwindigkeit ihrer neuen
  Exponiertheit gestellt haben. Ob Golfregion oder Arktis – das Gefühl der Unsicherheit
  wächst. Allerdings wächst auch die Entschlossenheit der Regierung, gegen diese Angriffe
  vorzugehen. Beispiel dafür: Der Beschluss des Kabinetts in dieser Woche über härtere
  Strafen gegen islamistischen Terror und bessere Prävention. Was diese Gesellschaft
  am Ende tatsächlich sicher macht, sind die Bürgerinnen und Bürger, ob jung oder
  alt, die Lust an einer guten Zukunft haben, und die sich vom grassierenden Pessimismus
  nicht die Lebensfreude verderben lassen. Von ansteckender Freude war deshalb ein
  ganz besonderer Kanzlertermin. Der Wettbewerb „Jugend forscht“ zeigt jedes Jahr,
  wie viel Erfindergeist in jungen Menschen stecken. Friedrich Merz hat die Preisträgerinnen
  und Preisträger im Kanzleramt begrüßt. Der Sonderpreis ging an einen leidenschaftlichen
  Nachwuchs-Physiker. Tim Kammel hat die simple Frage gestellt: Wie tickt eigentlich
  eine Sanduhr? Die Antwort hat er dann nach langen Studien, mit Hilfe von Computersimulationen
  und mit der nötigen Portion Esprit gegeben. Trichterwinkel, Öffnungsgröße oder Schaftlänge
  – was spielerisch anmutet, kann in einerseits kommerziell genutzt werden, etwa in
  der Medizin oder beim Bau von Getreidesilos genutzt werden. Viel wichtiger ist aber
  das Beispiel, das Tim Kammel abgibt: Er hat eine simple Frage gestellt, seinen Entdeckergeist
  aktiviert und sich dann seine ganz persönliche terra incognita erschlossen. Das
  entsprach 12,9 Prozent der Bevölkerung, so das Statistische Bundesamt (Destatis).
  Der Kinderanteil ist binnen zehn Jahren leicht gestiegen: 2015 lag er bei 12,3 %,
  das waren 10,1 Millionen Kinder. Wir freuen uns über Ihr Feedback: Nutzen Sie bitte
  dafür das Kontaktformular (nicht die Antwortfunktion auf diese E-Mail).'
