date: '2026-09-18'
type: press_release
source_name: german_chancellery
title: Fragen und Antworten zu Energiepreisen und Energieversorgung Genug Energie
  für Deutschland, den Urlaub und die Tankstelle?
text: 'Bundeskanzler Merz hat das klare Ziel betont, dass zentrale Produkte wie Diesel
  und Benzin verfügbar bleiben müssen. Für die Bundesregierung hat die sichere Versorgung
  mit Energie in Deutschland höchste Priorität – für die Wirtschaft und für die Mobilität
  ihrer Bürgerinnen und Bürger. Die Bundesregierung hat mit Blick auf die stark gestiegenen
  Kraftstoffpreise ein neues Spritpreis-Entlastungspaket beschlossen: Dafür senkt
  der Bund die Energiesteuer auf Benzin und Diesel bis Ende 2026 um 14 Cent pro Liter.
  Inklusive Umsatzsteuer summiert sich die Steuerentlastung für Kraftstoffe auf 17
  Cent pro Liter. Bund und Länder tragen die geplanten Entlastungen von 2,5 Milliarden
  Euro gemeinsam. „Wer jeden Tag auf das Auto angewiesen ist, kommt an seine Belastungsgrenze",
  sagte Bundeskanzler Friedrich Merz: „Wir handeln schnell und haben einen klaren
  Fahrplan für 2027. Wir zeigen, dass wir in der Krise widerstandsfähig sind und den
  Bürgerinnen und Bürgern helfen.“  Er betonte, "die Entlastung von immerhin 2,5 Milliarden
  Euro ist in Zeiten angespannter Haushalte kein Pappenstiel. Umso mehr freue ich
  mich, wie schnell wir dieses Paket geschnürt haben. Das ist ein starkes Signal für
  unser Land.“ Das hatte der Bundeskanzler zuvor angekündigt. „ Für viele Menschen,
  die täglich das Auto brauchen, ist eine Belastungsgrenze erreicht. Wir stehen dazu
  deshalb in engem Austausch in der Bundesregierung und mit den Ländern, und ich bin
  der Meinung, dass wir handeln müssen“, so Merz beim Unternehmertag . Ursache für
  die Preissteigerungen ist insbesondere der andauernde Nahost-Konflikt und die damit
  verbundene Unsicherheit an den Märkten. Trotzdem ist die Versorgung in Deutschland
  mit Erdgas und Treibstoffen weiterhin gesichert. Lieferungen finden weiter statt.
  Die Lage rund um die Straße von Hormus zeigt, wie verletzlich insbesondere die globalen
  Energiemärkte in Krisen reagieren. Die Entwicklungen zeigen aber auch, dass sich
  der Markt mit seiner Nachfrage und alternativen Lieferwegen anpasst. Die Bundesregierung
  entlastet in kurzer Zeit ein zweites Mal nach den Maßnahmen im Frühjahr zur Energiesteuersenkung
  und der Verschärfung des Kartellrechts. Die Regierung beobachtet die Lage, handelt
  bei Bedarf zügig und entlastet Unternehmen und Bürgerinnen und Bürger gezielt. Gleichzeitig
  stellen sich im Alltag viele Fragen: Die Bundesregierung weiß, dass die hohen Preise
  an den Zapfsäulen nicht nur die Wirtschaft, sondern natürlich auch die Bürgerinnen
  und Bürger erheblich belastet – Pendler, Freiberufler, Ehrenamtliche ebenso wie
  Familien. Sie hat daher beschlossen, Unternehmen sowie Bürgerinnen und Bürger mit
  einem weiteren Tankrabatt in Abstimmung mit den Ländern und den Koalitionsfraktionen
  im Deutschen Bundestag ab Oktober bis zum Jahresende schnell zu entlasten. Dafür
  senkt der Bund die Energiesteuer auf Benzin und Diesel um 14 Cent pro Liter, das
  ergibt zusammen mit der eingesparten Umsatzsteuer eine Steuerentlastung von 17 Cent
  pro Liter. Bund und Länder entlasten damit gemeinsam Bürgerinnen und Bürger und
  die Wirtschaft um rund 2,5 Milliarden Euro. Zudem plant der Bund regelmäßige Gespräche
  mit der Mineralölwirtschaft zu führen, mit dem Ziel, spätestens zum 1. Januar 2027
  vorübergehend einen Spritpreisdeckel nach dem Vorbild Luxemburgs oder Belgiens einzuführen.
  Die Versorgungssicherheit muss gewährleistet sein. Missbräuchliche Preisaufschläge
  müssen unterbunden werden. Spritpreisdeckel Belgien : Das belgische Wirtschaftsministerium
  legt jeden Werktag mit Hilfe einer festen Formel den täglichen Höchstpreis fest,
  den Tankstellen nicht überbieten dürfen. Möglich bleibt es, den Kraftstoff günstiger
  anzubieten. Luxemburg: Hier ist es das zuständige Ministerium, das mehrfach wöchentlich
  einheitliche Höchstpreise für Kraftstoffe festlegt. Die Bundesregierung wird die
  Preisentwicklung und mögliche wirtschaftliche Folgen weiterhin eng beobachten, um
  gegebenenfalls die besonders betroffenen Menschen und Unternehmen zielgerichtet
  zu entlasten. Der Bund schafft dafür die Voraussetzungen für einen einkommensbezogenen
  Direktauszahlmechanismus. Das Bundeskartellamt überprüft zudem mit mehreren Verfahren
  die Preisgestaltung verschiedener Raffinerien. Klar ist aber auch, dass die hohen
  Preise im Wesentlichen durch die Unsicherheiten an den Märkten infolge der kriegerischen
  Ereignisse am Persischen Golf ausgelöst wurden. Für eine dauerhafte Entlastung kleiner
  und mittlerer Einkommen hat die Regierungskoalition zudem eine Reform der Einkommensteuer
  zum 1. Januar 2027 auf den Weg gebracht. Im Mai und Juni hat die Bundesregierung
  mit dem Tankrabatt insbesondere Autofahrerinnen und Autofahrer sowie Betriebe mit
  hohem Verbrauch in einer Phase besonders hoher Kraftstoffpreise um insgesamt etwa
  1,6 Milliarden Euro entlastet. Die von Anfang an befristete Steuersenkung hat erfolgreich
  dazu beigetragen, die damaligen Preisspitzen an der Zapfsäule abzufangen. Die unabhängige
  Monopolkommission und das Bundeskartellamt sind zu dem Schluss gekommen, dass die
  Energiesteuersenkung für Benzin und Diesel im Mai und Juni weitgehend bei Verbraucherinnen
  und Verbrauchern angekommen ist. Die Maßnahme hat gewirkt: Der „Tankrabatt“ erfüllte
  die Funktion, in einer Zeit besonders hoher Kraftstoffpreise Preisspitzen effektiv
  abzufangen. Auch die Erkenntnisse weiterer Wissenschaftler bestätigen diesen Befund.
  Im Zusammenhang mit den hohen Kraftstoffpreisen hat das Bundeskartellamt Verfahren
  gegen alle Raffineriebetreiber in Deutschland eingeleitet, um zu prüfen, ob diese
  ihre Marktstellung durch missbräuchliche überhöhte Preise missbraucht haben. Dies
  erfordert neben der Feststellung missbräuchlich überhöhter Preise auch die Feststellung
  einer marktbeherrschenden Stellung oder relativer Marktmacht. Denn ohne eine solche
  herausgehobene Stellung, aus der eine gewisse Verantwortung für den Wettbewerb folgt,
  gibt es in einer freien Marktwirtschaft keine Beschränkungen der Preissetzungsfreiheit.
  Mit dem Maßnahmenpaket vom 1. April hat die Bundesregierung die kartellrechtliche
  Missbrauchsaufsicht gegenüber den Mineralölkonzernen verschärft. Das Bundeskartellamt
  kann nun gegen missbräuchliche Preiserhöhungen bei Kraftstoffen durch marktbeherrschende
  oder marktstarke Anbieter einfacher und schärfer vorgehen. Bei Verdacht auf missbräuchlich
  überhöhte Kraftstoffpreise müssen marktbeherrschende oder marktstarke Unternehmen
  darlegen, dass die Erhöhungen gerechtfertigt sind. Dabei können aber auch knappheitsbedingt
  erhöhte Preise eine Rechtfertigung sein. Mit dem Maßnahmenpaket vom 1. April wurde
  dem Bundeskartellamt zudem die Möglichkeit eröffnet strukturelle Wettbewerbsstörungen
  einfacher feststellen und damit schneller beheben zu können. Verschärfte Kontrollen
  bei Kosten und Preisen können eine Voraussetzung für Preisdämpfungen sein, jedoch
  können sie eine solche nicht unmittelbar bewirken. Mit der 12. Novelle des Gesetzes
  gegen Wettbewerbsbeschränkungen (GWB) will die Bundesregierung das Kartellrecht
  noch weiter verschärfen: Künftig müssen auch die Preiserhöhungen bei Super Plus
  gemeldet werden. Raffinerien und Kraftstoffgroßhandel können zudem verpflichtet
  werden der Markttransparenzstelle zusätzliche Absatzdaten zu melden. So soll die
  Marktaufsicht noch effektiver ihre Funktion erfüllen. Ermöglicht wird hierdurch
  zudem, besser feststellen zu können, ob sinkende Rohstoffpreise auch schnell an
  Verbraucher weitergegeben werden, sobald sich die Marktlage wieder beruhigt. Aktuell
  gilt: Die Versorgung in Deutschland ist gesichert. Bundeskanzler Merz hat das klare
  Ziel betont, dass zentrale Produkte wie Diesel, Benzin und Flugbenzin auch weiter
  verfügbar bleiben müssen. Mineralölprodukte – also etwa Benzin und Diesel – werden
  überwiegend in Deutschland aus importiertem Rohöl hergestellt. Deutschland bezieht
  nur etwa sechs Prozent seines Rohöls aus dem Nahen Osten. Rohöl wird vor allem aus
  Norwegen, den USA , Libyen und Großbritannien bezogen. Spritpreis- Apps und Service-Portale
  helfen dabei, Preise zu vergleichen. Die zugelassenen Dienste bekommen ihre Daten
  von der Markttransparenzstelle für Kraftstoffe (MTS-K). Sie sammelt fast in Echtzeit
  die aktuellen Kraftstoffpreise und stellt sie Anbietern von Apps und Webseiten zur
  Verfügung. Neben dem inzwischen ausgelaufenen Tankrabatt wurde zum 1. Januar 2026
  die Pendlerpauschale dauerhaft auf 38 Cent ab dem ersten Kilometer erhöht. Zuvor
  galt dieser Satz erst ab dem 21. Kilometer. Wer täglich pendelt, profitiert damit
  deutlich stärker. Außerdem können Steuerpflichtige mit geringen Einkünften weiterhin
  die Mobilitätsprämie erhalten. Nein. Es gibt in Deutschland keine Energieversorgungskrise
  – anders als in den Jahren 2022 und 2023. Unsere Energieversorgung mit Öl, Kraftstoffen,
  Gas und Strom ist derzeit gesichert, die Lage bleibt aber sehr dynamisch. Dies zeigt
  sich derzeit vor allem bei der Entwicklung der Preise. Anders als in der Energiekrise
  2022 hat sich Deutschland heute aber breiter aufgestellt und bezieht die Energieträger
  aus verschiedenen Quellen. Aus diesem Grund ist der Markt in Deutschland ausreichend
  mit Öl und Gas versorgt. Auch der Strommix in Deutschland mit seinem hohen Anteil
  Solar- und Windenergie hilft dabei, die Unabhängigkeit zu sichern. Die „Task Force Energieversorgung“
  der Bundesregierung ist als Reaktion auf den Konflikt im Nahen Osten im April eingesetzt
  worden und liefert auch weiterhin ein wöchentliches, vorausschauendes und umfassendes
  Lagebild. Das ermöglicht die operative Steuerung von Maßnahmen auf allen Ebenen:
  Für den Fall, dass sich die Lage verschärfen sollte, ist die Bundesregierung vorbereitet.
  Die Bundesregierung hat schon zu Beginn des Konflikts schnell auf die Entwicklungen
  auf dem Kraftstoffmarkt reagiert. Sie hatte kurzfristig die Mineralölsteuer für
  zwei Monate gesenkt und damit private Haushalte und Unternehmen um 1,6 Milliarden
  Euro entlastet. Das tut sie nun für die Monate Oktober bis Dezember 2026 erneut.
  Zudem plant der Bund Gespräche mit der Mineralölwirtschaft, um spätestens zum 1.
  Januar 2027 vorübergehend einen Spritpreisdeckel nach dem Vorbild Luxemburgs oder
  Belgiens einzuführen. Die Versorgungssicherheit muss dabei gewährleistet sein. Außerdem
  wird die Bundesregierung die Preisentwicklung und mögliche wirtschaftliche Folgen
  weiterhin eng beobachten, um gegebenenfalls besonders betroffene Menschen und Unternehmen
  zielgerichtet zu entlasten. Der Bund schafft dafür die Voraussetzungen für einen
  einkommensbezogenen Direktauszahlmechanismus. Und sie hat durch die sogenannte „12
  Uhr-Regel“ für mehr Preistransparenz beim Tanken gesorgt. Zudem hat sie das Kartellrecht
  geschärft, damit die Kartellbehörden schnellstmöglich und wirksam gegen missbräuchliche
  Kraftstoffpreise vorgehen können. Aktuell prüft das das Bundeskartellamt in mehreren
  Verfahren, insbesondere gegen Raffineriebetreiber, ob eine missbräuchliche Preispolitik
  vorliegt. Das Bundesministerium für Wirtschaft und Energie (BMWE) hatte zudem mit
  anderen Ländern der IEA einen Teil der nationalen Ölreserven freigegeben, um das
  Angebot auf den Märkten zu stabilisieren. Derzeit ist der deutsche Markt ausreichend
  versorgt mit Öl und Gas. Die höheren Preise bieten einen Anreiz für einen verantwortungsvollen
  und sparsamen Umgang mit Energie. Ein sparsamer Umgang ist hilfreich in der derzeitigen
  Lage. Daher sind derzeit keine weiteren staatlich vorgegebenen Energiesparmaßnahmen
  geplant. Die Bundesregierung wird die Entwicklungen weiterhin genau beobachten.
  Sollte es notwendig werden, besteht die Möglichkeit, Maßnahmen zur Sicherstellung
  der Energieversorgung zu aktivieren. Im Gasbereich beobachtet und bewertet die Bundesnetzagentur
  die Lage fortlaufend. Die Bundesnetzagentur schätzt die Gefahr einer angespannten
  Gasversorgung im Augenblick als gering ein. Gleichwohl bestehen Maßnahmen zur Krisenvorbereitung,
  die kontinuierlich weiterentwickelt werden. Auch die physische Versorgung mit Rohöl,
  Raffinerieprodukten wie Benzin, Diesel und Kerosin ist in Deutschland derzeit weiter
  gesichert, bestätigt auch der Nationale Sicherheitsrat . Deutschland hat gemeinsam
  mit anderen Mitgliedsstaaten der Internationalen Energieagentur einen Teil der strategischen
  Ölreserven, darunter auch Flugbenzin, freigegeben. Für den Fall von Knappheiten
  gibt es Notfallpläne und gesetzliche Grundlagen, die den Umgang und die Priorisierung
  regeln. Aktuell läuft die Versorgung ganz normal. Die 32 Mitgliedstaaten der IEA
  hatten sich im März auf Vorschlag der IEA darauf verständigt, Ölreserven im Umfang
  von insgesamt 400 Millionen Barrel (gut 54 Millionen Tonnen) freizugeben. Die Freigaben
  haben zu diesem Zeitpunkt auch zu einer Entspannung auf den internationalen Ölmärkten
  beigetragen. Zweck der Reserven ist die Sicherstellung der Versorgungssicherheit.
  Deutschland hat die Freigabe am 18. März erteilt. Deutschlands Notfallreserve für
  etwa 90 Tage umfasst insgesamt etwa 20 Millionen Tonnen Rohöl und Ölprodukte. Die
  IEA hatte Deutschland gebeten, 2,6 Millionen Tonnen aus seiner Reserve freizugeben.
  Eine erste Tranche dieser für die Freigabe vorgesehenen Mengen wurde mittlerweile
  von den Marktteilnehmern abgerufen. Derzeit wird vom Markt keine weitere Freigabe
  für erforderlich gehalten. Die Bundesregierung beobachtet allerdings die volatile
  Lage sehr genau und handelt, wenn n ö tig, um die Energieversorgung in Deutschland
  zu sichern. Das hat oberste Priorit ä t. Die Gasspeicherstände sind derzeit in der
  Tat niedriger als in vorangegangenen Jahren. Die Wintervorsorge des Markts läuft
  aber. Es ist Aufgabe der Unternehmen und der Händler, die Speicher für den Winter
  zu füllen. Durch flexiblere Möglichkeiten einzuspeisen, etwa durch LNG , und durch
  die seit 2022 strukturell gesunkene Gasnachfrage, verringert sich der Bedarf an
  Gasspeicherkapazitäten. Die Bundesregierung geht davon aus, dass die privaten Akteure
  im aktuellen Markt die Befüllung der Speicher und ihre Lieferverpflichtungen im
  Winter wie gewohnt nachkommen. Auch der europäische Energiebinnenmarkt ist entscheidend
  für die Versorgungssicherheit mit Gas. Die grenzüberschreitende Zusammenarbeit funktioniert
  sehr gut und wurde in den letzten Jahren unter anderem durch neue grenzüberschreitende
  Kapazitäten und Ausbau von Pipelines verstärkt. Die Füllstände sind zwar derzeit
  auf einem relativ niedrigen Niveau. Auch hier zahlt sich aber aus, dass die Gasversorgung
  auf einer breiteren und flexibleren Grundlage beruht als in der Vergangenheit. So
  kann kurzfristig durch Pipeline gas sowie nunmehr auch durch LNG an die neuen Terminals
  in Deutschland sichergestellt werden, dass jederzeit ausreichend Gas in Deutschland
  vorhanden ist. Gasspeicher haben also bei der Energieversorgung relativ an Bedeutung
  verloren. Im Vergleich zur Energiekrise 2022 infolge des russischen Überfalls auf
  die Ukraine fällt der aktuelle Preisanstieg deutlich geringer aus. Deutschland verfügt
  über ausreichend Import- und Speichermöglichkeiten von Gas. Dank neuer LNG -Terminals
  und Pipelines ist die Versorgung in den letzten Jahren deutlich breiter und flexibler
  aufgestellt. Generell schätzt die Bundesnetzagentur die Gasversorgung in Deutschland
  als stabil ein. Die Versorgungssicherheit ist gewährleistet. Die Bundesnetzagentur
  beobachtet und bewertet die Lage weiter. Ein sparsamer Umgang mit Gas bleibt angesichts
  des weiterhin erhöhten Preisniveaus für Haushaltskunden sinnvoll. Wichtigster Gas-Lieferant
  in Deutschland ist Norwegen (etwa 44 Prozent), vor Belgien und den Niederlanden.
  Anlandungen an den deutschen LNG -Terminals machen rund 10 Prozent des importierten
  Gases aus. Über 90 Prozent des über die deutschen LNG -Terminals anlandenden Erdgases
  stammen aus den USA . Es ist das Ziel der Bundesregierung, die Abhängigkeiten im
  Energiebereich insgesamt zu reduzieren und damit die Energiesicherheit zu erhöhen.
  Dazu gehören neben dem Ausbau der Erneuerbaren Energien auch die Erschließung und
  Nutzung heimischer Energiequellen, einschließlich ausgewählter konventioneller Gasvorkommen.
  Deutschland deckt derzeit nur einen sehr geringen Teil seines Gasbedarfs aus eigenen
  Quellen. Im Vergleich zum Sommer 2025 sind die durchschnittlichen Strompreise deutlich
  gestiegen. Trotzdem: Deutschland hat es mit einer grundlegend anderen Situation
  zu tun als in der Energiekrise 2022. Denn der seitdem stark angestiegene Anteil
  Erneuerbarer Energien dämpft die Auswirkungen hoher Gaspreise am Strommarkt. Grund
  für die damaligen Strompreisspitzen war, dass im Strommarkt immer die Kraftwerksart
  den Strompreis bestimmt, die zur Deckung der Nachfrage noch benötigt wird („ Merit-Order
  -Prinzip“). Das sind häufig Gaskraftwerke. Der höhere Anteil Erneuerbarer Energien
  senkt aber die Wahrscheinlichkeit, dass Gaskraftwerke überhaupt zugeschaltet werden
  müssen, um die Nachfrage zu decken. Die Bundesregierung hat die Lage und Entwicklung
  der Strompreise weiter genau im Blick. Und sie entlastet Verbraucherinnen und Verbraucher
  sowie die Wirtschaft bei den Energiepreisen schon deutlich – um mehr als 10 Milliarden
  Euro alleine in 2026. Mehr Unabhängigkeit von fossilen Energiequellen hilft nicht
  nur beim Klimaschutz, sie schützt auch vor Preisausschlägen an den Rohstoffmärkten
  und geopolitischen Krisen. Das gilt sowohl beim Verkehr als auch beim Wohnen und
  in der Industrie. Auch daher treibt die Bundesregierung den Ausbau der Erneuerbaren
  Energien ambitioniert voran – sowohl der Solar- als auch der Windenergie. So ist
  der Anteil Erneuerbarer Energien weiterhin auf Rekordniveau. Um die Systemkosten
  der erneuerbaren Energien möglichst gering zu halten, will die Bundesregierung den
  Ausbau erneuerbarer Energien besser mit dem Ausbau der Netze synchronisieren. Das
  ist auch wichtig für langfristig bezahlbare Strompreise. Aus diesem Grund hat sie
  das Netzanschlusspaket und die Reform des Erneuerbaren-Energien-Gesetzes im Juli
  im Kabinett beschlossen. Der Zubau soll zukünftig vor allem dort stattfinden, wo
  es noch freie Netzkapazitäten gibt. Die physische Versorgung mit Kerosin ist in
  Deutschland derzeit gesichert. Gemeinsam mit anderen Mitgliedsstaaten der Internationalen
  Energieagentur (IEA) hat Deutschland strategische Ölreserven freigegeben - darunter
  Flugbenzin - und damit das Angebot erhöht. Weitere Reserven stehen zur Verfügung.
  Kerosin wird zudem in Deutschland in eigenen Raffinerien aus Rohöl hergestellt.
  Deutschland hat eigene Raffinerien und damit einen Vorteil gegenüber Ländern, die
  komplett von Importen abhängig sind. Deutschland bezieht nur etwa sechs Prozent
  seines Rohöls aus dem Nahen Osten. Rohöl wird vor allem aus Norwegen, den USA ,
  Libyen, und Großbritannien bezogen. Der Luftverkehr ist für den Wirtschaftsstandort
  Deutschland wesentlich und die Bundesregierung tauscht sich laufend mit den Transportbranchen,
  mit der Industrie und der Energiewirtschaft, der EU -Kommission und den europäischen
  Partnern aus. Die EU und die Bundesregierung werden entschlossen reagieren, sollten
  sich bei der Kerosinversorgung Engpässe abzeichnen. Dies ist aber derzeit nicht
  der Fall. Tatsächlich hat das Statistische Bundesamt für das erste Halbjahr 2026
  festgestellt, dass die Preise für Flugtickets sich im Vergleich zum Vorjahr um im
  Schnitt 8,5 Prozent verteuert haben. Inlandsflüge wurden um 9,5 Prozent teurer.
  Für die Kosten sind viele unterschiedliche Faktoren entscheidend, auch die Frage,
  wie sich Iran-Krieg mit seinen Auswirkungen entwickelt. Generell lässt sich sagen,
  dass die Kerosinpreise und damit auch die Ticketpreise umso mehr steigen werden,
  je länger der Konflikt andauert.'
