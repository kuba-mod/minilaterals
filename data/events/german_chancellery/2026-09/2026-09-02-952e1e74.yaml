title: Erntebericht 2026 Schnelle Hilfen für Landwirte nach Ernteverlusten
text: 'Aufgrund von Trockenheit und Dürre ist die Getreideernte in diesem Jahr zurückgegangen.
  Bundeslandwirtschaftsminister Alois Rainer hat den Erntebericht 2026 vorgestellt.
  Nach vorläufigen Ergebnissen können die Landwirte in diesem Jahr mit einer Getreideernte
  von rund 37,4 Millionen Tonnen rechnen. Damit liegt die Erntemenge um 7,3 Prozent
  unter der des Vorjahres. Der Hektarertrag liegt bei 69,1 Dezitonnen und damit um
  5,6 Prozent niedriger als 2025. Bei der wichtigsten Getreideart in Deutschland,
  dem Winterweizen, beläuft sich die Erntemenge voraussichtlich auf 20,2 Millionen
  Tonnen. Das sind 2,4 Millionen Tonnen beziehungsweise 10,4 Prozent weniger als 2025.
  Die Erntemenge von Winterraps wird voraussichtlich 3,5 Millionen Tonnen betragen
  und sinkt damit um 11,5 Prozent beziehungsweise 456.000 Tonnen gegenüber dem Vorjahr.
  „Die Bilanz fällt insgesamt deutlich ernster aus, als wir es uns erhofft hatten“,
  betonte der Bundeslandwirtschaftsminister. „Trockenheit und Hitze haben in einigen
  Regionen Deutschlands deutliche, teils verheerende Spuren auf den Feldern hinterlassen.“
  Er führte aus, dass es zum Beispiel den Mais im Süden und Südwesten besonders schwer
  getroffen habe. Dort ist er vielerorts kaum gewachsen, teilweise haben die Pflanzen
  keine Kolben ausgebildet. Auch bei der Getreideernte musste der Süden starke Verluste
  hinnehmen. In Mecklenburg-Vorpommern, dem größten Rapsanbauland, würden die Hektarerträge,
  vor allem durch Insektenschäden, voraussichtlich rund 25 Prozent unter dem mehrjährigen
  Durchschnitt liegen. Extrem angespannt sei die Lage auch beim Futter: Im Süden und
  Südwesten sei auf vielen Wiesen nach dem ersten Schnitt kaum noch Gras nachgewachsen.
  Viele Betriebe mussten deshalb schon im Sommer auf ihre Futterreserven zurückgreifen,
  die eigentlich für den Herbst und Winter vorgesehen sind. Der Bundesminister hob
  hervor, dass der Blick auf die offiziellen Erntedaten nicht ausreiche, um ein Gesamtlagebild
  der Landwirtschaft zu geben. Das Zusammentreffen vieler Faktoren sei zu berücksichtigen:
  „Dürre, Trockenheit, regionale Ernte- und Qualitätsverluste, massive Futterknappheit,
  hohe Betriebsmittelkosten bei Diesel und Dünger infolge geopolitischer Krisen, wirtschaftlicher
  Druck in der Tierhaltung, insbesondere im Schweinemarkt, und erhebliche Belastungen
  unserer Wälder treffen gleichzeitig zusammen.“ Laut Alois Rainer handele es sich
  um „eine Krise von nationaler Tragweite“. Es gehe nicht darum, jede Ertragsschwankung
  staatlich auszugleichen. „Wenn aber die Substanz unserer Betriebe und damit Produktionskapazitäten
  dauerhaft gefährdet sind, dann dürfen wir nicht einfach zur Tagesordnung übergehen.
  Daran hängen regionale Wertschöpfung, Arbeitsplätze im ländlichen Raum und auch
  unsere Versorgungssicherheit in Deutschland“, so der Minister. Die Bundesregierung
  steht hinter den Landwirten. „Es geht um wirtschaftliche Existenzen, um Familienbetriebe
  und um die Zukunft der Landwirtschaft in unserem Land“, so Rainer. Folgende Maßnahmen
  sind unter anderem geplant: Auf der Webseite des BMLEH sind alle bereits geltenden
  sowie geplanten Instrumente zur finanziellen Unterstützung der landwirtschaftlichen
  Betriebe dargestellt.'
