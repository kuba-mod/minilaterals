title: Pressekonferenz von Kanzler Merz und dem Präsidenten des Europäischen Rates,
  Costa Europäische Union steht vor weitreichenden Entscheidungen
text: 'Europas Finanzen, Wettbewerbsfähigkeit und Erweiterungspolitik: Über Themen
  wie diese sprachen Kanzler Merz und der Präsident des Europäischen Rates, Costa
  . Im Rahmen von dessen jährlicher Hauptstadtreise, der sogenannten „ Tour des Capitales
  “, hat Bundeskanzler Friedrich Merz den Präsidenten des Europäischen Rates, António
  Costa , empfangen. Im Bundeskanzleramt tauschten sich beide über wichtige Themen
  der bevorstehenden EU -Gipfel aus. Zentral seien die unionale Wettbewerbsfähigkeit
  und der neue EU -Haushalt für die Jahre 2028 bis 2034, auch bekannt als Mehrjähriger
  Finanzrahmen. Darüber hinaus stünden im zweiten Halbjahr 2026 weitere wichtige Themen
  auf der Agenda. Merz nannte hier insbesondere die Unterstützung der Ukraine sowie
  die europäische Migrations- und Erweiterungspolitik.'
