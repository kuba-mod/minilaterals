title: Fragen und Antworten Neue Gentechnik-Regeln in der EU
text: 'Die neuen Techniken können die Züchtung von Pflanzen erleichtern, die klima-
  und schädlingsresistenter sind und weniger Düngemittel und Pestizide benötigen.
  Die EU hat mit einem Parlamentsbeschluss am 17. Juni 2026 den Markt für NGT-Pflanzen
  geöffnet – also Pflanzen, die mit „Neuen Genomischen Techniken“ verändert sind.
  Zugleich gewährleistet die neue Gesetzgebung einen hohen Schutz der menschlichen
  und tierischen Gesundheit sowie der Umwelt. Die neuen Regelungen werden nach einer
  zweijährigen Übergangszeit wirksam. Mit NGT -Verfahren ist es möglich, unerwünschte
  Pflanzeneigenschaften auszuschalten oder gezielt zu verändern. Dies geschieht durch
  Genom-Editierung. Auf diese Weise können Pflanzen beispielsweise besser vor schädlichen
  Umwelteinflüssen, wie Hitze und Wassermangel sowie Krankheiten und Schädlinge geschützt
  werden. Ein bekanntes NGT -Verfahren ist CRISPR / Cas , auch „Genschere“ genannt.
  Mit dieser Methode kann das Erbgut von Pflanzen an gewünschten Stellen verändert
  werden. Ein Vorteil des Verfahrens ist, dass pflanzliche DNA präzise verändert werden
  kann. Veränderungen des Erbguts können in ähnlicher Form auch auf natürlichem Wege
  entstehen, etwa durch Mutationen oder klassische Züchtung. Durch Einsatz der Genschere
  wird die Pflanzenzüchtung wesentlich zeitsparender und effizienter. Die neue Verordnung
  unterscheidet zwei Kategorien von genetisch veränderten Pflanzen: NGT -Pflanzen
  der Kategorie 1 und der Kategorie 2. NGT -Pflanzen der Kategorie 1 werden nur geringfügig
  verändert. Sie enthalten kein fremdes Erbgut und weisen maximal zwanzig genetische
  Veränderungen auf. Hinsichtlich des Zulassungsverfahrens werden NGT -1-Pflanzen
  ähnlich wie konventionelle Züchtungen behandelt. Risikoprüfung und Zulassungspflicht
  entfallen. Für diese Kategorie besteht keine Kennzeichnungspflicht. Das bedeutet,
  dass auf Lebensmitteln oder Futtermitteln kein Hinweis auf NGT oder Gentechnik enthalten
  ist. Allerdings ist das Saatgut zu kennzeichnen, sodass Landwirte klar erkennen,
  dass es sich um NGT -1-Pflanzen handelt. Um Bedenken bezüglich der Patentierbarkeit
  von NGT -1-Pflanzen entgegenzukommen, haben die EU -Mitgliedstaaten und das Europäische
  Parlament sich auf einen Transparenz- und Beobachtungsansatz verständigt. Beantragte
  oder vorliegende Patente müssen grundsätzlich offengelegt werden. NGT -Pflanzen
  der Kategorie 2 werden stärker verändert als NGT -Pflanzen der Kategorie 1. Hier
  sind umfassendere Eingriffe in das Erbgut sowie mehr als zwanzig genetische Veränderungen
  möglich. Für diese Pflanzen ist eine verpflichtende Risikoprüfung vorgesehen. Sie
  unterliegen damit strengen Auflagen. Lebensmittel und Futtermittel müssen für Verbraucherinnen
  und Verbraucher gekennzeichnet werden. Auch das Saatgut unterliegt der Kennzeichnungspflicht.
  Die neuen Pflanzenzuchttechniken sollen dazu beitragen, dass Lebensmittelhersteller
  auf Herausforderungen, wie die weltweite Ernährungsunsicherheit und den Klimawandel
  besser reagieren können. Die neuen Methoden können die Züchtung von Pflanzen erleichtern,
  die klima- und schädlingsresistenter sind, weniger Düngemittel und Pestizide benötigen,
  weniger Allergene enthalten, höhere Erträge sicherstellen sowie Wasser und andere
  natürliche Ressourcen effizienter nutzen. Ernteausfälle durch Trockenheit oder Krankheiten
  können reduziert werden. Anders als Lebensmittel aus NGT -2-Pflanzen unterliegen
  die Pflanzen der Kategorie 1 nicht der Kennzeichnungspflicht. Damit können Verbraucher
  zukünftig im Supermarkt nicht erkennen, ob die Lebensmittel gentechnisch veränderte
  Bestandteile enthalten. Da für die Verordnung eine zweijährige Übergangsfrist ab
  Inkrafttreten gilt, können ab Juli 2028 entsprechend erzeugte Lebensmittel im Handel
  verfügbar sein. Wer in Zukunft sichergehen will, Lebensmittel ohne NGT -Zutaten
  zu erwerben, kann als Alternative Bio-Produkte kaufen. Im ökologischen Landbau ist
  der Einsatz von gentechnisch verändertem Saatgut nach wie vor verboten. Auch Lebensmittelprodukte
  mit der nationalen „Ohne-Gentechnik-Kennzeichnung“ enthalten keine NGT -Zutaten.
  Neben dem Einsatz in der Landwirtschaft, der sogenannten „grünen Gentechnik“, wird
  in Deutschland Gentechnik seit vielen Jahren in weiteren Bereichen eingesetzt, insbesondere
  in der Medizin und der Pharmazeutik. Medikamente werden beispielsweise mithilfe
  genetisch veränderter Zellkulturen hergestellt, etwa bei Insulin oder bestimmten
  Impfstoffen. Hier spricht man von „roter Gentechnik“. Auch in der Industrie kommt
  Gentechnik zum Einsatz, beispielsweise in der sogenannten „weißen Biotechnologie“.
  Diese wird unter anderem bei der Herstellung von Waschmitteln genutzt. Weitere Einsatzbereiche
  sind die „blaue Gentechnik“ zur Erforschung und Nutzung von Organismen aus dem Meer,
  wie etwa Algen für Kosmetik, Medizin oder Nahrungsergänzung. Die „graue Gentechnik“
  wird unter anderem für die Abwasserreinigung genutzt. Die „gelbe Gentechnik“ befasst
  sich mit der Herstellung und Modifikation von Lebensmitteln, zum Beispiel mit Enzymen
  für die Käse- oder Bierherstellung. In diesem Video erklärt das Bundesamt für Verbraucherschutz
  und Lebensmittelsicherheit, welche alltäglichen, gentechnisch hergestellten Produkte
  in Verkehr gebracht werden und welche davon einer Genehmigungspflicht unterliegen.
  Der Koalitionsvertrag sieht vor, die Biotechnologie als Schlüsseltechnologie zu
  fördern und ihre Anwendung regulatorisch zu erleichtern – auch mit Blick auf die
  neuen genomischen Techniken in der Pflanzenzüchtung. Biotechnologie ist damit Teil
  der Hightech Agenda Deutschland : Durch Forschung und Technologie sollen die Wettbewerbsfähigkeit
  gestärkt sowie mehr Wertschöpfung und Souveränität erreicht werden.'
