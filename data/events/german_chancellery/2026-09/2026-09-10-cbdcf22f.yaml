title: 'Bundeskanzler Friedrich Merz sagt zum bevorstehenden Jahrestag der Anschläge
  vom 11. September:'
text: '„Dass sich 9/11 zum 25. Mal jährt, geht uns nahe. Wir Deutsche haben damals
  gespürt, wie viel uns mit unseren amerikanischen Freunden verbindet. Wir wussten:
  Die Terrorangriffe von New York, Washington und Pennsylvania galten auch unserer
  Lebensweise, unserer Freiheit und unserer Demokratie. Vor 25 Jahren konnten die
  Vereinigten Staaten deshalb auf die volle Solidarität Deutschlands und Europas zählen.
  Beim NATO-Gipfel von Ankara haben wir diese transatlantische Partnerschaft erneuert;
  das war ein gemeinsamer Erfolg. Deutschland ist auch heute entschlossen, gemeinsam
  mit den Vereinigten Staaten für die Werte einzutreten, die uns ausmachen und verbinden:
  Freiheit, Demokratie und Respekt.“'
