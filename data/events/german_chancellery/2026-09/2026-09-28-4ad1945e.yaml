  Ich glaube, der richtige Adressat dafür ist die israelische Seite. Wir haben unsere
  Forderung dahingehend klar gemacht. Ich glaube, der Außenminister hat das vor zwei
  Wochen auf einer Reise nach Genf zu einer Sitzung des Menschenrechtsrats sehr deutlich
  gesagt. Grundsätzlich ist es so, dass die Technik bereitsteht, und auch die Vorbereitungen
  für die Öffnung dieses Grenzübergangs sind aus unserer Sicht eigentlich gegeben.
  Insofern ist es an Israel, zu erklären, warum das nach wie vor nicht der Fall ist.
  Inwieweit kommt Israel als Besatzungsmacht der humanitären Versorgung Gazas aktuell
  nach? Ich kann Ihnen keine grundsätzliche Einschätzung dazu geben, wie das aktuell
  ist. Vielleicht haben wir darüber auch Zahlen, Daten und Fakten, die ich nachliefern
  könnte. Nach wie vor ist es grundsätzlich so, dass die humanitäre Versorgung in
  Gaza zwar leicht verbessert ist, aber dass wir nach wie vor bei der Umsetzung des
  Gaza-Plans ja nicht in die Phasen kommen, in denen es eben um wichtige Dinge wie
  den Wiederaufbau geht. Wir haben jetzt Ende September. Auch der nächste Winter steht
  also vor der Tür. Es wird festere Behausungen brauchen. Insofern ist es gerade aus
  diesem Grund wichtig, dass Dual-Use-Güter in den Gazastreifen gelangen, und dafür
  wurden eben diese Scanner bereitgestellt. Durch die Bereitstellung dieser Scanner
  ist eigentlich ein Hindernis und ein Flaschenhals dafür aus dem Weg geschafft, diese
  Dual-Use-Güter nicht in den Gazastreifen zu lassen, sondern man kann dann sehr genau
  feststellen, welche Güter in den Gazastreifen gelangen. Unser Aufruf und unser Appell
  ist es, die Lieferung von humanitärer Hilfe, die übrigens die Pflicht einer Besatzungsmacht
  ist, sicherzustellen. Unabhängig von dem Scanner erleben wir ja nach UN-Aussagen,
  basierend auf den IGH-Maßnahmen in Sachen Völkermordklage, dass viel zu wenige Güter
  täglich hereinkommen. Sie hatten uns auch manchmal Zahlen genannt. Es seien 30 bis
  40 Prozent der notwendigen Mittel pro Tag. Vielleicht können Sie uns tatsächlich
  etwas Konkretes sagen. Soweit ich weiß, leben aktuell ungefähr 60 Prozent der Bevölkerung
  in einer Ernährungsnotlage. Herr Meyer, der israelische Machthaber hat in seiner
  Rede auf der Generalversammlung , bei der mehr als 70 Länder den Saal verlassen
  haben, als er geredet hat, das Zitat des Bundeskanzlers, Israel mache für uns die
  Drecksarbeit, erwähnt, dieses Zitat aber einer kontextuellen Verschiebung unterzogen,
  indem er es nicht auf den Krieg in Gaza, sondern auf den Krieg im Iran bezogen hat.
  Meine Frage ist: Wie hat der Bundeskanzler dieses Zitat wahrgenommen? Diese Kontextuierung
  könnte man semantisch so verstehen, als würde er sagen: Ihr geht raus ‑„cowards“
  hat er die Leute auch genannt ‑, aber Kanzler Merz hat gesagt, wir machen die Drecksarbeit
  für uns alle. Das ist mir eine Ableitung zu viel, und ich würde jetzt auch bezüglich
  einer Rede eines Ministerpräsidenten eines anderen Staates hier nicht in die Exegese
  gehen und sie im Einzelnen beurteilen. Aber er hat das Zitat des Bundeskanzlers
  der Bundesrepublik Deutschland dafür verwendet! Deshalb gebe ich noch einmal den
  Hinweis darauf ‑ die Ableitung haben Sie jetzt vorgenommen, und das ist mir einen
  Schritt zu weit ‑, dass es üblich ist, dass wir Reden und andere Äußerungen in der
  Regel nicht kommentieren. So würde ich es hier auch halten. Na ja, sachlich ist
  es ja aber richtig, dass Netanjahu das Kanzlerzitat, das auf den Irankrieg gemünzt
  war, zur Begründung seiner Position in Gaza verwendet hat. Fühlt sich der Bundeskanzler
  in dieser Verschiebung des Zitats, was die Adressatensituation angeht, missverstanden?
  Wie gesagt, ich kommentiere das hier an dieser Stelle nicht weiter. Herr Hinterseher,
  ich habe Sie richtig verstanden, dass Sie Israel auch als Besatzungsmacht im Gazastreifen
  bezeichnet haben. Jetzt gibt es ja auch mehrere Vertreter aus der Regierungskoalition,
  die das hinterfragen. Könnten Sie deswegen noch einmal die offizielle Haltung der
  Bundesregierung in Bezug auf Israel und den Besatzungsstatus in Gaza darlegen? Ich
  glaube, es ist unstreitig, dass es im Gazastreifen derzeit eine gelbe Linie gibt,
  und diese liegt innerhalb des Gazastreifens. Das heißt ‑ es gibt ja immer diese
  berühmte grüne und rote Zone ‑, die sogenannte grüne Zone steht unter israelischer
  Kontrolle. Insofern, glaube ich, ist Ihre Frage damit beantwortet. Aber die Bundesregierung
  hat ja auch vor dem israelischen Angriff auf Gaza den gesamten Bereich von Gaza
  als unter Besatzungsmacht stehend bezeichnet. Steht denn die Bundesregierung dazu
  auch noch? Ich habe Ihnen ja gerade dargelegt, wie der Komplex oder Sachverhalt
  zu bewerten ist.'
