date: '2026-09-28'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 28. September 2026
text: '(Vorsitzende Buschow eröffnet die Pressekonferenz und begrüßt SRS Meyer sowie
  die Sprecherinnen und Sprecher der Ministerien.) Die außerordentliche Mitgliederversammlung
  des DOSB hat am Samstag München als Kandidaten für die Bewerbung um die Olympischen
  und Paralympischen Spiele 2036, 2040 und 2044 ausgewählt. Damit ist klar: Deutschland
  sagt Ja zu Olympia und geht mit München ins Rennen. Der Bundeskanzler hat dem Freistaat
  Bayern und der Landeshauptstadt München in einem Beitrag auf Instagram bereits gratuliert
  und deutlich gemacht, dass jetzt ganz Deutschland hinter der Bewerbung Münchens
  steht. Mit der Münchner Bewerbung haben wir ein Konzept, das uns international alle
  Chancen gibt. Denn jetzt geht es darum, im internationalen Wettbewerb zu überzeugen.
  Olympische und Paralympische Spiele können unserem Land einen Schub geben. Schon
  die Bewerbung stärkt den Glauben daran, dass wir hier in Deutschland Großes erreichen
  können, wenn wir alle an einem Strang ziehen. Olympische und Paralympische Spiele
  können uns zusammenbringen und inspirieren. Verbunden mit einer Bewerbung können
  weitere Investitionen in Sportstätten, aber auch in die sonstige Infrastruktur sein.
  Der Imagegewinn der Spiele kann positiv auch auf Wirtschaft und Gesellschaft abstrahlen.
  Die Bundesregierung will eine Generation Olympia, mehr Kinder und Jugendliche im
  Sport und generell mehr Bewegung und Aktivität in der gesamten Gesellschaft. Die
  Bundesregierung wird die Bewerbung deshalb weiterhin umfassend unterstützen. Bundesumweltminister
  Carsten Schneider nimmt heute zunächst am Deutsch-Französischen Umweltrat teil.
  Das heißt, er trifft seine französische Amtskollegin in Frankreich . Daran schließt
  sich ein Treffen der beiden mit der polnischen Amtskollegin im Format des Weimarer
  Dreiecks an. Dabei steht die Frage im Mittelpunkt, wie Klimaschutz, industrielle
  Wettbewerbsfähigkeit und leistungsfähige europäische Infrastruktur besser miteinander
  verbunden werden können. Konkret ‑ das kann ich schon sagen ‑ wird es auch um den
  grenzüberschreitenden Ausbau von Lade- und Betankungsinfrastruktur für schwere Nutzfahrzeuge
  gehen, also um leistungsfähige Lademöglichkeiten für batterieelektrische LKW und
  um langfristig verlässlich erreichbare Wasserstofftankstellen für Brennstoffzellen-LKW.
  Ein weiteres Thema wird die Ausgestaltung des Industrial Accelerator Act der EU
  sein. Es soll darüber gesprochen werden, wie die europäische Industrie wettbewerbsfähiger
  werden kann und zugleich Investitionen in die Dekarbonisierung beschleunigt und
  verlässliche Absatzmärkte für klimafreundlich hergestellte Produkte entstehen können.
  Wenn die drei Länder hierbei gemeinsam vorangehen, sehen wir konkrete Fortschritte
  für den europäischen Binnenmarkt insgesamt. Ich habe eine Frage an das Auswärtige
  Amt zum Treffen von Lawrow und Wadephul in New York. Herr Wadephul hat in einem
  Interview danach gesagt, einige Länder hätten ihn gebeten, das Thema der Getreideexporte
  aus Russland und der Ukraine anzusprechen. Was war das Ergebnis? Wie hat die russische
  Seite reagiert? Ich kann Ihnen zusätzlich zu dem, was der Minister gestern in den
  Abendnachrichten gesagt hat, jetzt kein konkretes Ergebnis daraus mitteilen. Aber
  es ist richtig, mehrere Partner sind auf uns mit genau dieser Bitte zugekommen.
  Es geht darum, die Blockade der Getreideexporte über das Schwarze Meer zu beenden.
  Sie wissen, dass die Schwarzmeerregion eine überragende Bedeutung hat, wenn es darum
  geht, die Welt mit Getreide, vor allem mit Weizen, zu versorgen. Insofern ist der
  Außenminister dieser Bitte nachgekommen. Das ist etwas, was die ganze Welt betrifft,
  insbesondere natürlich auch den globalen Süden, wo sich viele der Abnehmer dieses
  Getreides aus der Schwarzmeerregion, vor allem aus der Ukraine, befinden. Zugleich
  gab es in dem Gespräch auch einen bilateralen Aspekt. Ihn hat der Minister auch
  wiederholt betont. Es geht um den Drohnenvorfall von Leipzig. Aber ich kann Ihnen
  mit Blick auf den zweiten Aspekt, also auf die Getreideexporte, darüber hinaus jetzt
  nichts ankündigen, was ein konkretes Ergebnis dieses Treffens gewesen wäre. Aber
  ich möchte zitieren, was der Minister schon gesagt hat, dass nämlich jeder Versuch,
  das voranzubringen, es wert ist, unternommen zu werden. Sie wissen, dass es sich
  bei Getreide um ein verderbliches Gut handelt. Insofern ist diesbezüglich auch eine
  Dringlichkeit gegeben, mit der man handeln muss, wenn man das in diesem Herbst angehen
  möchte. Dieser Bitte ist der Außenminister nachgekommen. Aber sehen Sie es mir bitte
  nach ‑ das sage ich gleich vorab ‑, dass ich nicht weiter darauf eingehen kann und
  werde, welche Länder das genau waren. Denn Diplomatie braucht auch einen Rahmen
  der Vertraulichkeit. Ihn versuchen wir an der Stelle natürlich zu wahren. Zum Thema
  der Ernährung: Es gibt viele Medienberichte über eine drohende Hungersnot in der
  ukrainischen Ortschaft Oleschky im Süden der Ukraine, bei Cherson. Diese Ortschaft
  ist von Russland schon seit vier Jahren besetzt. Wurde das beim Treffen mit Lawrow
  angesprochen? Wie schätzt die Bundesregierung die Lage in Oleschky ein? Wie kritisch
  ist sie? Zur Länge des Treffens ist, denke ich, medial einiges kolportiert worden.
  Ich kann Ihnen jetzt zu Details und Einzelheiten dieses Treffens nichts sagen. Wir
  sehen die Versorgungslage in der abgeschnittenen Ortschaft mit großer Sorge. Grundsätzlich
  wurde die Lage in der Ukraine gegenüber dem russischen Außenminister natürlich angesprochen.
  Zum Einzelfall kann ich Ihnen nichts sagen. Herr Hinterseher, können Sie kurz darstellen,
  wie es überhaupt zu dem Treffen gekommen ist? Ich denke, auch dazu ist seitens des
  Ministers am Wochenende letztlich alles gesagt worden, was ich Ihnen jetzt hier
  darzubieten hätte. Die Vereinten Nationen als zentrales Forum für Frieden und Sicherheit
  bieten sich natürlich dafür an, genau solch ein Thema zu adressieren. Es gab die
  Bitte. Es gibt verschiedene Voraussetzungen, einerseits eine bilaterale Dringlichkeit,
  nämlich die, dass wir im bilateralen Umgang mit Russland ein klares Signal und auch
  noch einmal sehr klar die Nachricht setzen wollten, dass wir hybride Vorfälle wie
  den versuchten Drohnenanschlag von Leipzig nicht hinnehmen werden. Diese Botschaft
  ist sehr klar übermittelt worden. Darüber hinaus gibt es noch eine andere Dringlichkeit,
  nämlich die des Getreideexports aus der Schwarzmeerregion und deren Bedeutung für
  die Versorgung weltweit, insbesondere im globalen Süden. Daneben gibt es natürlich
  das größere Thema, das wir natürlich auch auf lange Frist behandeln wollen und bei
  dem wir als Europäer natürlich eine eigene Rolle spielen wollen. Denn dabei geht
  es um europäische Sicherheit. Das ist ja nichts Neues. Es gibt ja schon den Track
  der außenpolitischen Berater der E3. In diesem Sinne kann man das Ganze verstehen.
  Diese drei Stränge bündeln sich in diesem Gespräch. Sie sagten, es habe die Bitte
  gegeben. Meinen Sie damit die Bitte Deutschlands? Nein. Es gab die Bitte, die an
  Deutschland von verschiedenen Staaten herangetragen wurde, sich einzusetzen, um
  die Versorgungslage im globalen Süden zu verbessern. Sie wissen, dass es um multiple
  Krisen geht. Es ist ja nicht nur der Getreideexport aus der Schwarzmeerregion. Wir
  wissen auch, dass zum Beispiel der Düngemittelexport über die Straße von Hormus
  deutlich zurückgegangen ist. Insofern steuert die Welt diesbezüglich auf eine globale
  Mangelversorgung zu. Angesichts dessen ist es zumindest den Versuch wert, sich einzubringen
  und auf diplomatischem Wege zu versuchen, eine Lösung herbeizuführen. Das war der
  Versuch und der Anfang, das anzugehen. Das Treffen von Wadephul mit Lawrow ist ein
  mutiger Schritt. Gibt es weitere Schritte, zum Beispiel eine Einladung Lawrows nach
  Berlin? Nein, ich habe Ihnen keinen solchen Schritt anzukündigen. Insofern möchte
  ich gern auf das verweisen, was ich gerade gesagt habe. New York und gerade die
  Generaldebatte ist ein Forum, auf dem so etwas möglich ist. Wir wissen natürlich
  um den sozusagen propagandistischen Mehrwert eines physischen Treffens. Er wurde
  und wir von russischer Seite auch entsprechend genutzt. Dennoch war es, denke ich,
  an dieser Stelle vertretbar, ein physisches Treffen zu haben, um auch noch einmal
  klar zu machen, was unsere Positionen sind. Ich denke, dass an der Stelle festgestellt
  wurde, dass zwischen unseren öffentlichen Positionen und den Positionen, die wir
  im Gespräch vermitteln, keine Differenz besteht. Das ist völlig klar, und das ist
  natürlich in unserem Sinne. Denn unsere Positionen mit Blick auf Russlands Angriffskrieg
  in der Ukraine sind unverändert. Dort hat sich nichts verändert. Alexander Dugin
  hat vor zwei Wochen gesagt, Deutschland blockiere einen Frieden und eine Beendigung
  des Krieges in der Ukraine. Das Treffen vorgestern war ein klares Zeichen, dass
  das nicht wahr ist. Der Minister hat verschiedentlich von einem Lackmustest gesprochen,
  auch mit Blick auf die Einladung von Präsident Putin zum G20-Treffen. Ich denke,
  in diesem Sinne muss man das verstehen. Es wurde ein Gespräch geführt. Noch einmal:
  Die Ukraine hat zu sehr vielen Gelegenheiten klargemacht, dass sie bereit ist, zu
  verhandeln. Wir haben auch wiederholt klargemacht, dass wir, wenn Russland ernsthaft
  bereit ist, über eine friedliche Lösung in der Ukraine und allem voran einen Waffenstillstand
  zu verhandeln und nachzudenken, jederzeit dazu bereit sind, uns dabei einzubringen.
  Das Gespräch hat leider im Ergebnis noch einmal gezeigt, dass Russland dazu nach
  wie vor nicht bereit scheint. Aber ich denke, dass uns dieses Ergebnis in der Substanz
  nicht überrascht. Herr Hinterseher, können Sie die Darstellung der russischen Seite
  bestätigen, dass es Deutschland war, das einen eingeschränkten Medienzugang zu dem
  Treffen verlangt hat, auch keine Fragen der Presse und keine Audioaufnahmen der
  Eingangsstatements? Wenn ja, was waren die Gründe dafür? Nein, das kann ich so nicht
  bestätigen. Sie haben vielleicht auch die Szenen vor dem Raum gesehen, wo 30 Leute
  versucht haben, sich Zugang zu einem Raum zu verschaffen. Ich denke, dazu können
  Sie vielleicht auch die Kolleginnen und Kollegen fragen, die dabei waren. In einem
  solchen Format ist es ganz üblich, dass man versucht, den Zugang vor allem für die
  Bildpresse so zu beschränken oder so zu handhaben, dass dabei möglichst gute Bilder
  für die Presse, die ja frei arbeiten möchte, entstehen können. In diesem Sinne finden
  üblicherweise Absprachen statt. Dann gibt es natürlich Partner weltweit, mit denen
  diese Absprachen besser funktionieren, und Partner, mit denen diese Absprachen weniger
  gut funktionieren. Sie haben jetzt mehrmals auf den Drohnenvorfall in Leipzig verwiesen.
  Das hatte auch der Außenminister angesprochen. Bisher hat die Bundesregierung davon
  abgesehen, der Öffentlichkeit entsprechende Belege zu präsentieren. Wurden bei diesem
  Treffen denn zumindest dem russischen Counterpart mehr Belege vorgelegt? Ich denke,
  wir haben uns hierzu mehrfach verhalten. Ich habe hier für Sie auch keine neuen
  Belege. Ich denke, Herr Meyer hat hier vor einigen Wochen sehr deutlich dargelegt,
  wie es um die Belege steht. Wir haben diesen Drohnenvorfall attribuiert. Wir haben
  diese Aspekte mit der russischen Seite sehr klar besprochen. Der Mehrwert eines
  solchen Treffens ist natürlich, das noch einmal auf höchster diplomatischer Ebene
  zu übermitteln, auch dem Adressaten, der es dann hoffentlich an die richtige Stelle
  innerhalb der Russischen Föderation weitergeben kann, sodass in Zukunft solche hybriden
  Vorfälle unterlassen werden. Herr Hinterseer, Russland sagt, die deutsche Seite
  habe um das Treffen gebeten. Können Sie das bestätigen? Der Minister hat im ZDF
  auch in Bezug auf den Drohnenvorfall gesagt: „wir können uns wehren, das werden
  wir auch tun.“ Ich denke, der Minister hat damit ausgedrückt, dass wir jederzeit
  verteidigungsbereit sind und dass wir uns gegen etwaige Vorfälle zur Wehr setzen
  können, ohne das jetzt weiter spezifizieren zu wollen, weil es natürlich im Rahmen
  des NATO-Bündnisses gegenseitige Bündnisverpflichtungen gibt, bei denen wir uns
  immer auf unsere Partner verlassen können. Das ist Sinn und Zweck der Aussage. Darüber
  hinaus habe ich Ihnen keine konkreten Darbietungen zu machen, was damit gemeint
  ist. Noch einmal: Es ging sehr klar darum, der russischen Seite zu signalisieren,
  dass wir nicht bereit sind, weitere Eskalationsschritte, wie wir sie in den vergangenen
  Wochen und Monaten gesehen haben, übrigens nicht nur gegen Deutschland, sondern
  auch gegen andere NATO-Verbündete, hinzunehmen und dass wir bereit sind, im NATO-Verbund
  darauf zu reagieren, sollte das nötig sein. Noch einmal mit Blick auf Leipzig: Dort
  haben wir angemessen und besonnen reagiert, aber mit einer entschiedenen Maßnahme
  zugleich auch klargemacht, dass wir nicht bereit sind, solche Provokationen weiterhin
  hinzunehmen. Herr Hinterseher, mit Blick auf das Ergebnis des Treffens haben Sie
  eben schon signalisiert, es sei eher ein bisschen ernüchternd, dass die russische
  Seite so reagiert habe, wie sie reagiert habe. Was folgt eigentlich daraus? Sind
  in den nächsten Monaten weitere Treffen denkbar? Welche Konsequenzen ziehen Sie
  beim Auswärtigen Amt aus diesem Treffen? Ich denke, eines ist klar; auch das wurde
  verschiedentlich schon dargelegt. Deutschland steht bereit, den Weg der Diplomatie
  zu verfolgen, sobald Russland sich zu ernsthaften Verhandlungen über einen nachhaltigen
  Waffenstillstand bereiterklärt. Die Ukraine ist hierzu längst bereit. Dass unsere
  Positionen natürlich meilenweit auseinanderlagen, das ist klar und das hat sich
  auch noch einmal verdeutlicht. Deshalb auch noch einmal die Analyse daraus, dass
  wir diese Bereitschaft auf russischer Seite nach wie vor nicht sehen. Das heißt
  aber nicht, dass wir nicht weiterhin bereit sind, uns dort einzubringen, zu investieren,
  sollte sich das bei Gelegenheit dann eben ändern. Noch einmal: Russlands Invasionskrieg
  in der Ukraine ist ja nicht der einzige Aspekt, sondern es gibt auch noch andere
  Aspekte, die in dem Treffen behandelt wurden, also der Getreideexport und auch der
  Drohnenvorfall von Leipzig. Dazu hatte ich ja gerade ausgeführt. Aber dann könnte
  ich Sie so verstehen, dass ein neues Treffen keinen Sinn ergebe, solange sich die
  russische Position nicht ein bisschen ändere. Ich möchte nicht über ein neues Treffen
  spekulieren. Wie gesagt, hatten wir jetzt ein Treffen. Wir haben die Positionen
  mit dem beschriebenen, weitestgehend äußerst ernüchternden Ergebnis abgeglichen.
  Aber noch einmal: Wir sind bereit, uns inhaltlich einzubringen. Sie haben vielleicht
  gesehen, dass die russische Seite in der Sache, glaube ich, wenig zu dem Treffen
  Preis gegeben hat. Insofern würde ich darüber jetzt nicht spekulieren wollen. Herr
  Lawrow hat das Treffen ja als sinnlos bezeichnet. Würden Sie sich dieser Wertung
  anschließen? Nein, dieser Wertung würden wir uns explizit nicht anschließen. Ansonsten
  hätten wir das Treffen auch nicht verfolgt. Aber natürlich geht es bei einem Positionsabgleich
  auch darum, festzustellen, wie weit die Positionen tatsächlich auseinander liegen.
  Ich habe gerade „meilenweit“ gesagt. Das heißt aber nicht, dass das Treffen als
  solches sinnlos war. Die Einordnung möchte ich nicht weiter kommentieren. Das ist
  unsere Einschätzung der Dinge. Ich glaube, es ist wichtig, zu sehen, dass wir uns
  dort für eine diplomatische Lösung einbringen würden, wo diese möglich erscheint.
  Dieser Abgleich hat jetzt zunächst einmal stattgefunden. Ich habe gerade, glaube
  ich, dazu ausgeführt, was wir machen würden und welche Intentionen wir mit dem Treffen
  verfolgt haben. Meine Frage richtet sich an Herrn Meyer. Herr Hinterseher hat ja
  jetzt gesagt, es sei der Lackmustest gewesen. Dieser ist jetzt sozusagen erfolgt
  und abgehakt. Wie blicken Sie vor diesem Hintergrund auf eine mögliche Teilnahme
  des russischen Präsidenten am G20-Gipfel, was die deutsche Teilnahme an sich, die
  Art der Teilnahme und auch die Frage nach einem gemeinsamen Familienfoto angeht?
  Es war ja schon einmal Thema. Aber jetzt ist man vielleicht einen Schritt weiter.
  Herr Hinterseher hat ja eben auch über das Thema der propagandistischen Ausschlachtung
  von solchen Terminen gesprochen. Ich kann nur unterstreichen, was Herr Hinterseher
  gerade gesagt hat. Die Möglichkeit einer Rückkehr zu einem konstruktiven Verhältnis
  mit Russland setzt eben auch die ernsthafte Bereitschaft der russischen Führung
  voraus, diesen völkerrechtswidrigen Angriffskrieg zu beenden und wirklich ernsthaft
  über Frieden für die Ukraine, aber auch über die Stabilität in Europa und natürlich
  auch über Frieden für Russland am Ende zu sprechen. Solange das nicht der Fall ist,
  kann es eine Rückkehr zur Normalität aus unserer Sicht definitiv nicht geben. Was
  den G20-Gipfel angeht, sprechen wir uns mit unseren Partnern im Vorfeld natürlich
  darüber ab. Wie gesagt, laufen die Vorbereitungen dazu. Es war ja auch schon einmal
  Thema. Wir wissen ja nicht erst seit gestern, dass es in Miami so stattfinden könnte.
  Sie haben ja schon einmal gesagt, dass Sie sich abstimmen wollen. Hat diese Abstimmung
  schon begonnen? Kann man schon eine Tendenz herauslesen, wie die anderen europäischen
  G20-Mitglieder darauf blicken? Wir stimmen uns mit unseren Partnern ständig eng
  ab, übrigens nicht nur über die Frage des G20-Gipfels, sondern auch über alle Fragen,
  die Herr Hinterseher gerade auch angesprochen hat. Das gilt natürlich auch mit Hinblick
  auf den G20-Gipfel. Das ist ganz klar. Noch einmal: Eine Rückkehr zur Normalität
  ist für uns schwer vorstellbar. Meine Frage geht an Herrn Hinterseher, auch wenn
  Sie diskret bleiben möchten, was die Namen der Staaten betrifft, die Deutschland
  gebeten haben, ein solches Gespräch zu führen: Gab es denn im Anschluss eine gesonderte,
  detaillierte Information dieser Staaten, die Deutschland darum gebeten haben? Wie
  war deren Reaktion? Ich habe Ihnen hier nichts von einer gebündelten Information ‑ ‑ ‑
  Wie gesagt, war es eine mehrfache Ansprache. Mit Sicherheit werden die Informationen
  und Erkenntnisse, die im Rahmen eines solchen Gesprächs eben gewonnen werden, dann
  entsprechend weitergegeben, gerade natürlich an diejenigen Staaten, die versucht
  haben, es zu initiieren. Ich möchte aber weiterhin nicht auf den Adressatenkreis
  eingehen. Meine zweite Frage betrifft den Komplex von Leipzig. Die Bundesregierung
  geht ja davon aus, dass der Komplex von Leipzig von Menschen initiiert und zumindest
  begleitet wurde, die im Umfeld oder Zusammenhang des russischen Geheimdienstes arbeiten
  und sich jetzt wieder in Russland aufhalten sollen. Gab es im Gespräch eine Aufforderung,
  eine Erwartung an den russischen Außenminister, bei der Aufklärung den Zugang zu
  diesen russischen Staatsbürgern zu ermöglichen? Wie war die Reaktion darauf? Wie
  üblich werde ich mich nicht zu Details dieses dann doch vertraulich geführten Gesprächs
  äußern und Ihnen hier nicht die Einzelheiten darbieten können. Aber Sie können davon
  ausgehen, dass wir diesen Punkt, was Russlands Verantwortung für den Drohnenvorfall
  von Leipzig angeht, natürlich noch einmal sehr deutlich gemacht haben. Wir haben
  dazu in der Vergangenheit kommuniziert. Dass es eine Zurückweisung russischerseits
  gibt, dürfte uns alle hier wahrscheinlich nicht überraschen. Ich habe eine Frage
  an Herrn Hinterseher, nachdem Sie vorhin von Vertrautheit gesprochen haben. Der
  Minister hat sich nach dem Treffen sehr abwertend geäußert und auch die Autorität
  des deutschen Außenministers infrage gestellt, indem er sinngemäß gesagt hat: Er
  saß dann da, hat ein Buch aufgemacht und den Text abgelesen, den wir sowieso schon
  kannten. ‑ Seine Sprecherin hat im russischen Fernsehen detailliert über das Treffen
  gesprochen und dies auch sehr abwertend dargelegt. Wie ordnet das Außenministerium
  diese Äußerung gegebenenfalls für ein anderes Treffen ein? Welche Basis gibt es
  für ein zweites Treffen womöglich? Ich möchte den Versuch, das Treffen propagandistisch
  oder wie auch immer zu instrumentalisieren, zu werten, gar nicht im Einzelnen bewerten.
  Sie haben gestern Abend vielleicht gesehen ‑ ich weiß nicht, ob Sie Abendnachrichten
  gesehen haben ‑, dass der Minister auch mehrfach danach gefragt wurde. Ich würde
  es jetzt einmal sinngemäß wiedergeben, weil ich den genauen Wortlaut gerade nicht
  kenne: Wer keine Argumente hat, argumentiert eben gern ad hominem. Ich schaue sehr
  gern Abendnachrichten, Herr Hinterseher. Aber in der Frage geht es ja darum, wie
  es um das diplomatische Gewicht von Deutschland bestellt ist, gerade bei solch einem
  sehr schweren Themenkomplex. Ich weiß nicht. Ich mache mir um das diplomatische
  Gewicht Deutschlands in der Welt keine Sorgen. Sie gaben gerade ein klares Nein
  dazu, dass die Bitte zum Gespräch von deutscher Seite kam. Das heißt im Umkehrschluss,
  dass die russische Seite darum gebeten hatte. Ich glaube, ich habe mehrfach ausgeführt,
  wie das Gespräch zustande kam und wie es angebahnt wurde. Darüber hinaus habe ich
  Ihnen heute nichts mehr darzubieten. Herr Meyer, zum G20-Treffen: Es ja allgemein
  bekannt, dass Lawrow nicht mehr zum inneren Zirkel Putins gehört und dementsprechend
  als nicht wirklich ernst zu nehmender Gesprächspartner gilt. Wird denn der Kanzler
  das Gespräch mit dem russischen Präsidenten suchen, damit man tatsächlich mit jemandem
  redet, der Einfluss auf das Ende dieses Angriffskrieges hat? Wir haben grundsätzlich
  immer gesagt, dass wir natürlich bereit sind, wenn es Sinn ergibt, auch direkte
  Gespräche zu führen. Aber noch einmal: Die Bedingungen habe ich ja gerade genannt.
  Was dieses Gespräch noch einmal sehr deutlich gemacht hat ‑ auch darauf hat Herr
  Hinterseher ja sehr klar hingewiesen ‑, ist, dass es auf der russischen Seite offensichtlich
  überhaupt kein Interesse gibt, diesen Angriffskrieg und das Leid, das auch über
  das ukrainische Volk gebracht wird, in irgendeiner Form abzumildern oder zu beenden.
  Wir setzen uns auf allen Wegen, auf diplomatischen Wegen, aber natürlich auch durch
  die Unterstützung der Ukraine, für einen gerechten und nachhaltigen Frieden ein.
  Das tun wir weiterhin. Mit Blick auf den G20-Gipfel ‑ das habe ich gerade schon
  gesagt ‑ gibt es gewisse Ankündigungen und Einladungen, die ausgesprochen sind.
  Wir stimmen uns mit unseren Partnern ab. Anzukündigen habe ich nichts. Herr Hinterseher,
  die Kollegin hat noch einmal die Wahrnehmung, zumindest von Ihnen abgesehen, dass
  das diplomatische Gewicht Deutschlands leidet, angesprochen. Herr Wadephul hatte
  im Januar 2025 gegenüber, wie er glaubte, dem Leiter des ukrainischen Präsidialamtes
  erklärt: Wie immer auch der Krieg mit Russland ausgehen wird, Russland wird für
  uns immer ein Feind sein. ‑ Dazu würde mich interessieren, ob das eine Haltung ist,
  mit der er auch in dieses Gespräch mit Herrn Lawrow gegangen ist? Nein, ich glaube,
  er hat die Position mehrfach deutlich gemacht. Unsere Position, was das angeht,
  bleibt ja unverändert. Wir stehen an der Seite der Ukraine. Das haben wir mehrfach
  deutlich gemacht. Dafür steht die Bundesregierung insgesamt. Wir verhandeln nicht
  ohne die Ukraine über die Ukraine. Wir werden die Ukraine in ihrer Verteidigung
  gegen Russlands Invasionskrieg auch weiterhin vollumfänglich unterstützen. Es wird
