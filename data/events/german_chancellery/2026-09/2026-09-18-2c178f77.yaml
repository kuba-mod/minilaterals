title: Tag der Deutschen Einheit 2026 Kommen Sie mit uns ins Gespräch – die Bundesregierung
  zu Gast in Bremen
text: Beim Dialogforum der Bundesregierung können Sie mit vielen Bundesministerinnen
  und Bundesministern ins Gespräch kommen. Sprechen Sie mit der Bundesregierung, statt
  über sie – diese Möglichkeit gibt es rund um den Tag der Deutschen Einheit. Dort
  präsentieren sich die Bundesministerien in vier großen Zelten. Außerdem stehen die
  Bundesministerinnen und -minister sowie weitere spannende Gäste im Dialogforum der
  Bundesregierung Rede und Antwort. Es soll um die Deutsche Einheit gehen, um die
  Politik der Bundesregierung aber auch um die Frage, wie wir in unserem Land zusammenleben
  und die Zukunft gestalten wollen. 150 Gäste können dort jeweils Platz finden. Der
  Eintritt ist selbstverständlich frei und barrierefrei möglich. Den Auftakt im Dialogforum
  der Bundesregierung macht am 2. Oktober um 18 Uhr die Chefin des Bundeskanzleramtes,
  Nina Warken, gefolgt von Bundesumweltminister Carsten Schneider. Am 3. Oktober sind
  Bundesverteidigungsminister Boris Pistorius, Bundesdigitalmister Karsten Wildberger,
  Bundesfinanzminister Lars Klingbeil und Bundesjustizministerin Stefanie Hubig im
  Dialogforum. Am 4. Oktober stehen unter anderem die Ostbeauftragte der Bundesregierung,
  Elisabeth Kaiser, der Bundeswehrgeneral Christian Freuding und der ehemalige Werder
  Bremen-Profi Tim Borowski auf dem Bühnenprogramm. Anschließend folgen ein Talk über
  KI und Start-ups und eine Gesprächsrunde über Opfer der ehemaligen Stasi der DDR
  . Außerdem wird der Zoll mit seinen Hunden und einer Auktion zu sehen sein. Hier
  finden Sie das gesamte Bühnenprogramm der Bundesregierung für den Tag der Deutschen
  Einheit 2026 in Bremen. Wer weniger diskutieren will, sondern mehr nach Unterhaltung
  sucht, ist bei dem Auftritt der Bundesregierung auf dem Bürgerfest in Bremen ebenfalls
  genau richtig.
