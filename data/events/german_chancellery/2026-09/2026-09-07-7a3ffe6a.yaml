  geeigneten Zeit. - Es zeigt, wie wir eingangs auch schon kurz besprochen haben,
  wie sich die Gesamtlage verändert hat, wie wir ständig hybriden Angriffen, Cyberangriffen
  ausgesetzt sind. Dieser Angriff ist einmal mehr der Beleg dafür. Das führt natürlich
  dazu, dass alle beteiligten Einheiten, die mit Daten umgehen, in der Verantwortung
  stehen, bestmöglich mit diesen Daten umzugehen und sich dagegen sicher aufzustellen.
  Wir haben hier schon verschiedentlich darüber gesprochen, was für Wettrennen da
  auch technologisch unterwegs sind. Das ist, wenn man so will, ein Wettrüsten zwischen
  denen, die versuchen, Systeme anzugreifen, und auf der anderen Seite uns, dem Staat,
  der versucht, Systeme zu schützen. Grundsätzlich, und das war ja Ihre Frage, kann
  ich noch einmal das sagen, was ich eingangs auch schon gesagt habe: Unsere Sicherheitsbehörden
  sind wachsam, und zwar 360 Grad. Es gibt ganz unterschiedliche Arten von Bedrohungen,
  physische Bedrohungen, digitale Bedrohungen. Wir sind in all diesen Räumen mit den
  Sicherheitsbehörden vertreten und unterwegs. Ich erwähne noch einmal den Hinweis
  darauf, wie viele Anschläge auch nicht zur Wirkung gekommen sind, weil sie verhindert
  worden sind, was ja ein Beleg dafür ist, dass unsere Sicherheitssysteme funktionieren.
  Dennoch passieren immer wieder Dinge wie jetzt in Berlin. Das ist natürlich äußerst
  misslich. Die Menge der Daten ‑ das haben die Kollegen gerade ja schon gesagt ‑,
  ist groß, sodass auch der Schaden, der entstanden ist, noch nicht wirklich profund
  und valide abgeschätzt werden kann. Was für Daten sind betroffen? Sind es Daten
  über Grünanlagen, die ich jetzt einmal als weniger brisant bezeichnen würde, oder
  sind es andere Daten? Diese Analysen erfolgen im Moment. Einige Medien waren da
  ja schon tätig, und sie erfolgen natürlich auch bei uns und den Sicherheitsbehörden.
  Dann, wie der Kollege Müller und der Kollege Bowinkelmann es gerade dargestellt
  haben, geht es darum, damit umzugehen, daraus abzuleiten, was an Veränderungen hinsichtlich
  der Sicherheitslage, an Sicherheitsvorkehrungen nötig ist. Aber auch da kann man
  nur einen Schritt nach dem anderen machen, ansonsten verknotet man sich die Beine.
  Ich würde gerne noch einmal auf das hinweisen, Frau Kollegin, was ich hinsichtlich
  Ihrer Frage gesagt habe, inwiefern dann eine Reaktionsfähigkeit auf möglicherweise
  sensible Daten, hinsichtlich der ein Handlungsdruck besteht, für Sicherheitsbehörden
  gegeben ist. Der Fall befindet sich im Nationalen Cyber-Abwehrzentrum, wo die Sicherheitsbehörden
  zusammen sind, wo ein kontinuierlicher Informationsabgleich stattfindet, genau deshalb,
  um für den Fall der Frage, die Sie aufgeworfen haben, schnell reagieren zu können.
  Darüber hinaus ist aber natürlich verständlich, dass, wenn es sicherheitsrelevante
  Informationen betrifft, wir oder die anderen Sicherheitsbehörden gegebenenfalls
  nicht explizit auch noch darauf hinweisen und ausführliche Informationen zu sensiblen
  Informationen herausgeben. In Weilerbach nahe der US-Luftwaffenbasis Ramstein wird
  derzeit laut offiziellen Angaben ein US‑Militärkrankenhaus gebaut. Bauherr ist die
  Bundesrepublik. Die öffentlich bekannten Kennzahlen weisen erhebliche Widersprüche
  auf. Das Bauvolumen beträgt 1,8 Milliarden US‑Dollar. Das Baugelände umfasst 47
  Hektar. Vorgesehen sind 4800 Räume und 2500 Beschäftigte. Gleichzeitig werden aber
  lediglich 68 reguläre Krankenhausbetten ausgewiesen. Das ergibt rechnerisch 27 Millionen
  Dollar und 2800 Quadratmeter Fläche pro Bett. Klinikmanagementexperten, die das
  geprüft haben, sagen, dass diese Kennzahlen weder nach deutschen noch nach US-Maßstäben
  einem Krankenhaus entsprechen. Da würde mich interessieren: Die Bundesregierung
  ist als Organisator baulich verantwortlich und trägt auch die Planungskosten. Ist
  ihr denn die vollständige Nutzungsplanung dieses Komplexes bekannt? Wenn ja, wie
  erklärt sie diese Widersprüche? Vielen Dank für die Frage, die Sie ja schon zwei-
  oder dreimal gestellt haben. Ich kann Ihnen gerne den aktuellen Sachstand aus unserer
  Sicht darlegen. Das Bauministerium ist im Außenverhältnis Bauherr. Vor Ort hat die
  Fachaufsicht das Amt für Bundesbau. Es ist ein Krankenhauskomplex, in dem auch ein
  Labor errichtet wird. Der Rohbau wurde im Oktober 2024 fertiggestellt, der Bezug
  ist für 2029 vorgesehen. Aktuell gibt es keinen Klinikbetrieb und auch keinen Laborbetrieb.
  Bei dem Labor handelt es sich um ein Krankenhauslabor; es ist kein Forschungslabor,
  wie Sie schon zwei- oder dreimal gefragt hatten. Zu den einzelnen Kennzahlen müsste
  ich mich schlau machen, dazu kann ich Ihnen jetzt nichts zu sagen. Genau, ich hatte
  früher zu dem geplanten Biolabor angefragt, aber nie zu diesem Widerspruch bei den
  Kennzahlen. 68 Betten, das entspricht einem deutschen Provinzkrankenhaus. Alle anderen
  Kennzahlen passen aber eher zu einem Megakomplex. Deshalb zielte meine Frage darauf
  ab, inwieweit Sie da eingebunden sind und ob Sie der Öffentlichkeit darlegen können,
  was da tatsächlich gebaut wird. Denn die Kennzahlen entsprechen in keiner Form nur
  68 Krankenhausbetten. Wie gesagt, das kann ich Ihnen gerne nachliefern. Das Amt
  für Bundesbau hat die Aufsicht, aber die Baumaßnahme ist eben ein Projekt der US-Armee.
  Herr Hille, was ist Ihr Fazit zu den Ukraine-Gesprächen in Kyjiw? Herr Kollege,
  ich kann dazu noch kein Fazit ziehen. Ich kann nur sagen, dass es gut ist, dass
  derartige Gespräche laufen, und ich kann auch bestätigen, dass wir in Person des
  außenpolitischen Beraters des Bundeskanzlers gemeinsam mit den Kollegen aus den
  E3-Staaten an diesen Gesprächen mit beteiligt waren. Das war ein Wunsch von ukrainischer
  wie auch von US-Seite. Es geht darum Wege auszuloten, wie es zu einem Verhandlungsprozess
  kommen kann. Die Ausgangslage ist die gleiche, die wir hier seit vielen, vielen
  Monaten sehen: Die Ukraine ist bereit, sich auf einen Verhandlungsweg zu machen.
  Russland dagegen verweigert jegliche Bewegung in dieser Richtung und beharrt auf
  Maximalforderungen. Das ist die Ausgangslage. Deshalb waren wir an diesen Gesprächen,
  die wir begrüßen, mit beteiligt, und wünschen uns, dass das auf diesem Weg weitergeht.
  Sehen Sie durch die erneuten US-Bemühungen eine andere Dynamik im Friedensprozess?
  Es ist positiv, dass es zu solchen Gesprächen kommt. Auch da wird ja ein Schritt
  nach dem anderen gegangen, und die Gespräche ein Schritt auf einem solchen Weg.
  Dennoch gehört dazu, dass Russland von seinen Maximalforderungen abrücken muss,
  um überhaupt einen Weg in Richtung Verhandlungen möglich zu machen. Die Ukraine
  ist seit Langem zu solchen Schritten bereit, Russland ist es nicht. Auf EU-Ebene
  ist eine Expertengruppe zum Thema Verteidigung geplant, die bei der Außenbeauftragten
  angesiedelt sein soll. Das wurde heute Morgen wohl kurzfristig abgesagt, angeblich
  auch auf Druck oder wegen Widerstands Deutschlands. Welche Vorbehalte gab es gegen
  dieses Projekt? Es gab seitens der EU in der Vergangenheit regelmäßig diverse Initiativen.
  Manche finden Zustimmung, manche weniger. Zu dem konkreten Vorschlag möchte ich
  aktuell nichts sagen, weil wir uns zu internen Abstimmungen zwischen den Mitgliedstaaten
  und der EU nicht äußern. Grundsätzlich gilt, dass die Verteidigungspolitik und Rüstungspolitik
  in der Verantwortung der Mitgliedstaaten liegt und sich die Fähigkeitsplanung und
  die Verteidigungsplanung aus der NATO-Planung ableiten. Die EU stellt mit Verteidigungsministertreffen,
  mit „Group of Five“-Treffen und auch mit eigenen Projekten wie zum Beispiel PESCO,
  EDF, SAFE und Military Mobility wichtige und gute Instrumente bereit, um das alles
  zu begleiten. Daran sieht man auch, dass der EU-Rahmen intensiv und in vielen Bereichen
  auch erfolgreich genutzt wird. Außerdem spricht Bundesminister Pistorius regelmäßig
  mit Frau Kallas, und auch das funktioniert sehr gut. Darüber hinaus habe ich nichts
  zu kommentieren.'
