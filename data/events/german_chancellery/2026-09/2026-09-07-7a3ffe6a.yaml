date: '2026-09-07'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 7. September 2026
text: 'Sprecherinnen und Sprecher •    stellvertretender Regierungssprecher Hille
  •    Bowinkelmann (BMI) •    Wentzel (BMWE) •    Grüneberg (BMFTR) •    Müller (BMVg)
  •    Hinterseher (AA) •    Totz (BMWSB) (Vorsitzende Hamberger eröffnet die Pressekonferenz
  und begrüßt SRS Hille sowie die Sprecherinnen und Sprecher der Ministerien.) (zum
  Ergebnis der Landtagswahl in Sachsen-Anhalt) Herr Hille, hat der Bundeskanzler dem
  Wahlsieger Herrn Siegmund schon gratuliert? Herr Kollege, ich habe mir natürlich
  gedacht, dass das heute das große Thema sein wird, über das wir hier intensiv sprechen.
  Deshalb möchte ich gleich zum Eingang, auch um mögliche weitere Fragen zu antizipieren,
  die Möglichkeit nutzen, noch einmal klarzumachen, als wer ich hier sitze. Ich sitze
  hier als Regierungssprecher. Ich verstehe jedes Interesse an einer Ausdeutung der
  Wahlergebnisse und allem, was damit zusammenhängt, würde aber darauf verweisen,
  dass zur Stunde bei der Union und bei allen anderen Parteien die Gremien zusammensitzen
  und dass sich der Bundeskanzler nach den Gremiensitzungen zu dem äußern wird, was
  in Sachsen-Anhalt passiert ist. Ich würde den Spannungsbogen noch etwas aufrechterhalten
  wollen. Ist seitens der Bundesregierung denn irgendeine Kontaktaufnahme geplant?
  Es ist vielleicht wichtig, noch einmal in den Blick zu nehmen, worüber wir reden.
  Wir sprechen von einer Landtagswahl, auch wenn man zwischenzeitlich den Eindruck
  bekommen könnte, es würde um eine andere Wahl gehen. Aber es ist die Wahl des Landtags
  in Sachsen-Anhalt gewesen. Dafür gibt es übliche Verfahren, und von dieser Stelle
  aus gibt es für mich nicht mehr zu sagen. Heißt das, dass der Bundeskanzler erst
  einmal keine Verantwortung seiner Politik für so ein Wahlergebnis sieht, unabhängig
  von der Partei? Genau das hatte ich vermutet, Herr Kollege. Deshalb hatte ich den
  Hinweis darauf vorausgeschickt, wo die Wahlanalyse und die Bearbeitung dessen, was
  an Wahlergebnis gestern Abend in Sachsen-Anhalt entstanden ist, passiert, nämlich
  in den Gremien der Parteien. Ich verstehe jedes Interesse daran, jetzt tiefer einsteigen
  zu wollen. Aber sehen Sie es mir nach: Ich sitze hier in der Rolle als Regierungssprecher
  und werde jetzt nicht der Erste sein, der am Montagvormittag die Ergebnisse einordnen
  wird, so unzufrieden Sie das wahrscheinlich zurücklassen wird. Sie können es gern
  probieren, aber ich werde dazu nicht mehr bieten können. Bevor Herr Merz Kanzler
  wurde, wollte er die AfD halbieren. Jetzt hat sich das CDU-Ergebnis in Sachsen-Anhalt
  halbiert. War das einfach ein feuchter Traum des damaligen Kanzlerkandidaten, ist
  es aber jetzt nicht mehr des Kanzlers? Auch all diese Fragen sind natürlich Teil
  einer Wahlanalyse. Es bleibt dabei, dass wir ‑ das gilt im Bund wie in allen Bundesländern ‑,
  wir als Bundesregierung und die sie tragenden Parteien, jeweils so viele Menschen
  wie möglich für unser Politikangebot gewinnen wollen. Wir machen Angebote, weil
  wir der Überzeugung sind, auf dem richtigen Weg zu sein, zu dem Ziel, Deutschland
  als erfolgreichen Wirtschaftsstandort zu erhalten, Deutschland so sicher wie möglich
  zu machen, Deutschland die Transformation in die Zeit der KI zu ermöglichen und
  das bestmöglich zu gestalten. Das ist unser Weg, das ist unser Angebot an die Menschen,
  und damit treten wir an. Wir sind mitten in diesem Prozess, was die Zukunftsfähigkeit
  der Sozialsysteme und den Ausbau unserer Sicherheitsstrukturen angeht. Das ist das,
  was wir anbieten. Damit wollen wir so viele Menschen wie möglich ansprechen und
  für unsere Politik gewinnen. Eine Regierungsübernahme der AfD rückt jetzt sehr nah.
  Welche Vorbereitungen wurden auf der Ebene der Innenminister getroffen, um die Sicherheitsbehörden
  vor einer Informationsweitergabe durch einen etwaigen AfD-Innenminister zu schützen?
  Welche Vorbereitungen wurden überhaupt getroffen, um auf diese Situation zu reagieren?
  Heute ist der Tag nach dem Wahlabend. Insofern haben wir in diesem Bundesland noch
  keine neue oder geänderte Regierung. Darüber hinaus kann ich Ihnen keine Angaben
  machen. Jetzt gilt es auch erst einmal abzuwarten, was passiert. Die Sicherheitsbehörden
  und auch die Innenministerkonferenz sind im Austausch zu Sicherheitsfragen, aber
  ich kann hier keine Details oder Ähnliches im Vorfeld mitteilen. Sieht Ihr Haus
  Bedarf an Maßnahmen? Was sagen Sie zu Vorwürfen, die von SPD-Innenministern aus
  den Ländern bereits geäußert wurden, die Unionsseite habe sich geweigert, im Vorhinein
  über dieses Thema überhaupt nur zu reden? Sie sprechen jetzt Aussagen aus dem politischen
  Raum an, die wir als Bundesinnenministerium grundsätzlich nicht kommentieren. Herr
  Hille und Herr Wentzel, inwieweit befürchtet die Bundesregierung negative Konsequenzen
  für die wirtschaftliche Entwicklung Deutschlands? Herr Kollege, auch diese Frage
  ist natürlich im Lichte einer Wahlanalyse zu betrachten. Wir arbeiten daran, genau
  das zu verhindern und Deutschland ‑ ich werde nicht müde, das zu betonen ‑ als wettbewerbsfähigen
  und erfolgreichen Wirtschaftsstandort zu erhalten. Wir haben am Freitag hier schon
  darüber gesprochen, wie das in Abstufung zwischen Bund und Ländern der Fall ist.
  Wir als Bundesregierung machen keine Politik für einzelne Bundesländer. Wir machen
  Politik für Deutschland, und da ist der Pfad ganz klar, Deutschland wettbewerbsfähig
  und erfolgreich zu halten. Unsere Überzeugung ist, dass davon alle profitieren.
  Herr Hille, Sie haben vorhin die Punkte der Agenda der Bundesregierung aufgelistet.
  Sie wollen Politik für die Menschen machen und haben dafür ein paar Punkte aufgelistet.
  Warum fehlt Ihnen die Erkenntnis, dass die Menschen diese Punkte nicht gut finden
  und dass die Menschen auch keine Verbesserung in ihrem täglichen Leben finden? Spätestens
  das Ergebnis gestern müsste Ihnen diese Erkenntnis bringen. Warum ist das nicht
  der Fall? Frau Kollegin, wir sprechen hier immer wieder über die Herausforderungen
  und die Umstände, in denen wir uns derzeit befinden. Sie sind auf ganz verschiedenen
  Ebenen herausfordernd, geopolitisch, ökonomisch. Wir machen in diesen Fragen ein
  Angebot, weil wir der Überzeugung sind, dass das die Antworten sind, die diese herausfordernde
  Situation benötigt, um Deutschland sicherer zu machen, nach innen wie nach außen.
  Deshalb investieren wir deutlich in die Verteidigungsfähigkeit, weil sich die Weltlage
  verändert hat. Es geht darum, Deutschland ‑ wir haben es gerade angesprochen ‑ als
  wirtschaftlich erfolgreichen und wettbewerbsfähigen Industrie- und Wirtschaftsstandort
  zu erhalten, weil wir der Überzeugung sind, dass das die Grundlage unseres Wohlstands
  ist, der wiederum all das, was wir bei der Sicherheit, bei der Infrastruktur, bei
  der Bildung und bei ganz vielen anderen Themen tun wollen, überhaupt erst ermöglicht.
  Ich erspare Ihnen, jeden einzelnen Politikbereich einmal aufzublättern. Das ist
  der Weg dieser Bundesregierung. Der Koalitionsvertrag ist mit dem Namen überschrieben:
  „Verantwortung für Deutschland“. Genau das ist es, was diese Koalition trägt, und
  auf diesem Weg sind wir. Das beinhaltet viele Entscheidungen, die im ersten Moment
  erst einmal nicht viel Zuspruch bekommen, etwa wenn man die Sozialsysteme in eine
  neue Zukunft führen möchte. Von daher ist es auch nicht überraschend, dass es dafür
  erst einmal nicht viel Zuspruch gibt. Aber es sind Entscheidungen, von deren Richtigkeit
  wir überzeugt sind, weil wir Deutschland als Ganzes zukunftsfähig machen wollen.
  Wir sind auch davon überzeugt, dass sich diese Entscheidungen positiv auswirken
  werden. Ein ganz zartes erstes Pflänzchen sehen wir bei der wirtschaftlichen Entwicklung.
  In den letzten Wochen haben wir mehrere nach oben korrigierte Wachstumsprognosen
  bekommen. Das hat ganz unterschiedliche Gründe, ist aber sicherlich auch Folge der
  Politik, die wir eingeschlagen haben. Da heißt es, konsequent zu bleiben, mit dem
  Ziel, Deutschland in eine erfolgreiche Zukunft zu führen. Sie haben gerade gesagt:
  „konsequent bleiben“, und Sie haben auch den Koalitionsvertrag erwähnt. Heute Morgen
  bei Phoenix hat der Generalsekretär der SPD im Zusammenhang mit dem Thema, dass
  eine Krankschreibung am ersten Krankheitstag vorzulegen sei, dezidiert von einer
  ‑ ich zitiere ‑ Korrektur gesprochen. Auch in Bezug auf die Rentenreform hat er
  sinngemäß dargelegt, die SPD werde reklamieren, dass dabei Justierungen stattfinden.
  Wie wird die Bundesregierung bzw. der Bundeskanzler mit diesem Vorstoß der SPD umgehen,
  nachdem die Wahl gestern so ausgefallen ist, wie sie ausgefallen ist? Frau Lacerda,
  ich darf noch einmal in Erinnerung rufen, wie sich der Bundeskanzler beispielsweise
  nach der Kabinettsklausur in Neuhardenberg eingelassen hat. Dort hat er sich zu
  all diesen Themen ausführlich geäußert, beispielsweise zum Thema von Rente und Krankenversicherung.
  Die Projekte sind in unterschiedlichen Stadien. Die Reform der Krankenversicherung
  ist bereits beschlossen und im parlamentarischen Verfahren. Es ist immer so, dass
  es dabei Debatten gibt. Wenn es Erkenntnisse und Einigungen darüber gibt, dass man
  Dinge verändern will, dann ist das so. Es gilt das alte Struck’sche Gesetz: Kein
  Gesetz verlässt den Bundestag so, wie es hineingegangen ist. Ich habe vor vier Wochen
  gehört, dass die Bundesregierung Russland für einen Drohnenangriff verantwortlich
  gemacht hat. Der Flughafen liegt ja zumindest zum Teil auf sachsen-anhaltischem
  Gebiet. Hat die Bundesregierung Befürchtungen, dass Informationen zu Ermittlungen
  in Richtung Russlands abfließen? Wir sind uns dessen bewusst, was wir als hybride
  Bedrohungslage bezeichnen. Wir sind täglich hybriden Einflüssen und Angriffen ausgesetzt.
  Auch darüber haben wir auf vergangenen Regierungspressekonferenzen gesprochen. Hybride
  Angriffe erfolgen auf ganz unterschiedliche Arten und Weisen. Auch gezielte Desinformation,
  mögliche Einflussnahmen, all das fällt in den Bereich der hybriden Angriffe. Dessen
  sind wir uns bewusst. Wir sind höchst wachsam. All unsere Sicherheitsbehörden sind
  höchst wachsam. Da, wo es nötig ist, greifen dann auch die Mechanismen. Auch die
  Zahl möglicher Anschläge, zu denen es nicht gekommen ist, weil sie durch die Sicherheitsbehörden
  aufgedeckt und verhindert worden sind ‑ ich denke, am Freitag haben wir intensiver
  darüber gesprochen ‑, zeigt ja, dass diese Mechanismen funktionieren. Das ist unsere
  Linie in diesen Fragen. Sie haben meine Frage nicht beantwortet. Haben Sie als Bundesregierung
  die Befürchtung, dass durch den Regierungswechsel, der bevorsteht, Informationen
  von der AfD in Richtung Russlands abfließen? Diese Frage geht an Sie und an das
  Bundesinnenministerium. Sie können gerne anfangen, Herr Bowinkelmann. Ich würde
  das Gleiche, was ich gerade gesagt habe, noch einmal in anderer Schattierung sagen.
  Aber vielleicht machen Sie den Anfang. Es gilt das Gleiche, was ich eben gesagt
  habe. Wir haben noch keine neue Regierung. Insofern wären das Mutmaßungen. Es gilt
  auch zu dem, was der stellvertretende Regierungssprecher gerade gesagt hat: Die
  Sicherheitsbehörden sind hochwachsam, was die hybriden Bedrohungen gerade aus dem
  russischen Raum angeht. Dabei geht es um verschiedene Themenfelder, um Desinformation,
  Sabotage, aber auch Spionage. Der Bereich, den Sie angesprochen haben, wäre ein
  Bereich der Spionage, in dem die Verfassungsschutzbehörden und die weiteren Sicherheitsbehörden
  sensibilisiert, hochwachsam sind und, wie wir ja festgestellt haben, in der Lage
  sind, Attribuierungen vorzunehmen. Es war auch möglich ‑ ich kann es nur betonen ‑,
  rechtzeitig Anschlagsversuche oder Planungen zu verhindern, wie wir das zuletzt
  bei den Festnahmen im Umfeld von Berlin hatten, wo ein Waffendepot gefunden worden
  ist. Die Frage geht an Herrn Hille. Der Vizekanzler und Finanzminister hat vor wenigen
  Stunden erklärt, die Wahl in Sachsen-Anhalt zeige auch deutliche Kritik am Reformkurs
  der Bundesregierung. Das hatte Frau Bas ähnlich erklärt. Das sind zwei Regierungsmitglieder.
  Ist der Kanzler dazu bereit, die Reformprojekte im weiteren Sinne, vor allem in
  den Sozialsystemen, erneut zu diskutieren? Herr Kollege, es ist nicht an mir, wie
  Sie sich vorstellen können, derartige Äußerungen von hier zu kommentieren. Ich kann
  noch mal darauf hinweisen, dass wir natürlich wahrnehmen, was politisch passiert,
  aber hier nicht der Ort für die Analysen darüber ist. Ich bin auch nicht die Person,
  die die jetzt hier an dieser Stelle um diese Uhrzeit anzustellen hat. Die sich daraus
  ergebenden Fragen ‑ Frau Lacerda hatte gerade auch schon nach einem Spezialaspekt
  gefragt ‑, was denn die weitere Entwicklung der Reformen angeht, das wird in der
  Koalition, wie es bei allen Themen der Fall ist, besprochen und entschieden werden.
  Wir sind auf dem Weg, die Krankenversicherung zu reformieren, die Rentenversicherung
  zu reformieren. Da sind zum Teil Beschlüsse getroffen worden, andere sind in der
  Umsetzung. Da finden natürlich regelmäßig Konsultationen und Gespräche statt. Wenn
  es Wünsche zur Veränderung von bereits Vereinbartem gibt, dann muss auch das in
  der Koalition besprochen werden, so wie es der gute Ablauf bei diesen Fragen ist.
  Herr Hille, Sie lehnen etwas ab, worum ich Sie gar nicht gebeten hatte. Ich hatte
  Sie gar nicht gebeten oder aufgefordert, das Wahlergebnis oder diese Kommentare
  zu kommentieren. Da die Äußerungen von zwei Regierungsmitgliedern, davon einer der
  Vizekanzler, bekannt sind ‑ aus deren Sicht besteht die Notwendigkeit zu Reformen ‑,
  war meine Frage: Ist der Regierungschef, der Kanzler, für eine solche Debatte bereit?
  Herr Kollege, ich dachte, genau dazu hätte ich in dem zweiten Teil meiner Antwort
  etwas gesagt. Sie haben sich jetzt in Ihrer Replik gleich auf meine erste Einordnung
  konzentriert. Aber das habe ich doch gesagt. Wenn es in der Koalition die Auffassung
  gibt, dass man Dinge, die man vereinbart hat, in einem anderen Licht betrachtet
  und modifizieren muss, dann muss das in der Koalition besprochen werden. Das ist
  doch ganz normal. Das hängt nicht an dieser Wahl, sondern so ist das Verhalten in
  einer solchen Koalition. Bisher ist in der Koalition besprochen, dass die Dinge
  ‑ Krankenversicherung, Rentenversicherung ‑ so beschlossen werden, wie sie auf dem
  Tisch liegen. Wenn es andere Auffassungen gibt ‑ Sie haben gerade zwei nicht unwesentliche
  Personen genannt ‑, dann muss das in der Koalition besprochen werden, und das wird
  auch in der Koalition besprochen werden. Eine Frage an Herrn Hille, aber vielleicht
  auch wahlweise ans BMI und ans Forschungsministerium. Es gibt ja eine große Unruhe
  im Bereich Bildung, Kultur, Forschung im Land Sachsen-Anhalt. Der Bund spielt eine
  gewisse Rolle für die Szenerie in Sachsen-Anhalt mit wichtigen Institutionen, angefangen
  vom Umweltbundesamt über die Bundeskulturstiftung, das noch zu errichtende Zentrum
  Deutsche Einheit. Alles das liegt in Sachsen-Anhalt. Auch in bestimmten Gremien
  spielt der Bund eine wichtige Rolle, Stichwort Bauhaus. Inwieweit ist man da auf
  einen Politikwechsel vorbereitet, wenn die AfD an die Macht kommen sollte? Wir haben
  ja von der AfD gehört, dass sie auf diesen Gebieten sehr aktiv durchgreifen will.
  Herr Kollege, da würde ich gleich, was Wissenschaft angeht, an die Kollegin vom
  BMFTR verweisen. Sie wissen ja, dass sich Bund und Länder in der gemeinsamen Wissenschaftskonferenz
  im Juli einstimmig zu Änderungen und Verfahrensregeln in diesem Zusammenhang geeinigt
  haben. Die Änderungen haben das Ziel, die Entscheidungsfähigkeit der GWK und damit
  die Verlässlichkeit der konstruktiven Bund-Länder-Zusammenarbeit in der Forschungspolitik
  abzusichern. Herr Hille, für Kultur wären Sie ja dann zuständig. Herr Kollege, ich
  würde das erst einmal mit einem allgemeinen Verweis beantworten wollen: Es gibt
  noch keine neue Regierung in Sachsen-Anhalt. Es sieht auch nicht so aus, dass das
  jetzt, auch wenn das nun, was ich sonst nie mache, sozusagen ein Vorgriff auf die
  Zukunft ist, sehr zügig der Fall sein wird. Natürlich gibt es Überlegungen in allen
  möglichen Bereichen, aber es ist jetzt zu früh, das aufzublättern. Wir reagieren
  dann, wenn es geboten ist zu reagieren, aber das ist heute noch nicht der Zeitpunkt.
  Ich würde noch ein Zitat der Forschungsministerin Dorothee Bär hinzufügen wollen:
  „In unserem Land ist die Wissenschaftsfreiheit im Grundgesetz verankert. Das ist
  unser Wettbewerbsvorteil. Sie zu bewahren, ist unsere Aufgabe, denn wer die Freiheit
  liebt, übernimmt auch Verantwortung für sie und schützt sie. Dafür stehen Bund und
  Länder gemeinsam ein.“ Herr Hille, Sie hatten jetzt noch einmal ausgeführt, der
  Kanzler sieht Deutschland auf einem guten Weg. Betrachtet er denn auch das Wahlergebnis
  in Sachsen-Anhalt als eine Bestätigung dieses von ihm eingeschlagenen politisch-wirtschaftlichen
  Weges? Herr Kollege, als erstes: Auch wenn Sie sich Mühe geben ‑ ich gehe davon
  aus ‑, meine Äußerungen richtig zusammenzufassen, habe ich nicht gesagt, dass der
  Kanzler Deutschland auf einem guten Weg sieht. Ich habe gesagt, was unsere Ziele
  sind, dass wir uns auf diesen Weg gemacht haben. Das ist unser Angebot an die Menschen,
  weil wir der Überzeugung sind, dass das der richtige Weg ist, um wieder auf einen
  guten Weg zu kommen. Gut, dann vielleicht anders gefragt: Sieht denn der Bundeskanzler
  die Ergebnisse der aktuellen Landtagswahl in Sachsen-Anhalt als Bestätigung des
  eben von Ihnen skizzierten Weges? Auch das fällt nach meinem Eindruck in die Kategorie
  Wahlanalyse: Was ist da passiert? Warum ist das passiert? Was sind die Schlussfolgerungen,
  die wir daraus ziehen? ‑ Dafür sind die Gremien in den Parteien als erstes Mal die
  Adressaten oder die richtigen Orte, in denen das besprochen wird, weil bei den Wahlen
  ja Parteien gewählt werden. Ich werde das jetzt nicht zu diesem Zeitpunkt von dieser
  Position in irgendeiner Form vorwegnehmen. Herr Hille, mit Verlaub, Sie haben schon
  gesagt ‑ ich habe es aufgeschrieben ‑, „wir sind auf dem richtigen Weg“, auch wenn
  es vielleicht bei diesem Reformkurs ist. Inwiefern kann man bei Zustimmungswerten
  von 16 Prozent auf nationaler Ebene und von 9 Prozent, glaube ich, in Sachsen-Anhalt
  sagen, dass man auf dem richtigen Weg ist? Beschäftigt man sich damit? Macht man
  sich Gedanken darüber? Wie ist es dazu gekommen? Ohne jetzt semantisch zu tief darin
  einzusteigen: Zwischen „richtig“ und „gut“ gibt es nach meinem Dafürhalten einen
  qualitativen Unterschied. ‑ Könnten Sie den zweiten Teil der Frage wiederholen?
  Inwiefern ist man auf einem „richtigen“ Weg, um nicht „gut“ zu sagen, wenn der Kanzler
  Zustimmungswerte von 16 Prozent auf nationaler Ebene und von 9 Prozent in Sachsen-Anhalt
  hat? Macht man sich darüber Gedanken? Fragt man sich: Was können wir besser machen,
  was ist schiefgelaufen? Ja, natürlich fragt man sich: Was können wir besser machen,
  was ist schiefgelaufen? Das ist ein wesentlicher Teil der Wahlanalyse, verkürzt
  in zwei Fragen gebracht. Natürlich fragt man sich das. Dennoch muss man es nach
  unserem Dafürhalten abschichten. Man kann doch überzeugt von einem Weg sein. Ich
  habe beschrieben, in welcher herausfordernden Zeit wir leben. Die Welt ist in Bewegung,
  und es gibt neue Sicherheitsanforderungen ‑ mal ganz grundsätzlich gesprochen. Wir
  haben eine herausfordernde wirtschaftliche Lage, nicht nur in Deutschland, sondern
  in vielen Teilen der Welt. Damit hängen Energiefragen und dergleichen zusammen.
  Wir erleben eine riesige Transformation im Bereich KI, eine industrielle Revolution,
  wie wir sie wahrscheinlich noch nie erlebt haben und deren Auswirkungen wir noch
  nicht ermessen können. Da ist es doch die Aufgabe einer Institution wie der Bundesregierung,
  die Verantwortung für dieses Land trägt, eine Vorstellung davon zu haben, was die
  Antworten auf diese Herausforderungen sind. Das ist das, was ich mit „richtigem“
  Weg beschreibe. Das ist nach unserer Auffassung der richtige Weg, um Deutschland
  wirtschaftlich wieder zu Stärke zu bringen, zu einer noch größeren Stärke. Es geht
  darum, Deutschland noch wettbewerbsfähiger zu machen, Deutschland sicherer zu machen,
  Deutschland den Schritt ins KI-Zeitalter zu gestalten, die Sozialsysteme zukunftsfähig
  zu machen. All das sind Bereiche, in denen wir Angebote machen mit dem Ziel, dass
  sich all diese Politikbereiche ins Positive entwickeln. Ich glaube, wir entfernen
  uns schon ein bisschen vom Thema. Sie sagen: Ich werde als Regierungssprecher die
  Ergebnisse nicht einordnen. ‑ Das verstehe ich. Trotzdem hätte ich gerne eine erste
  Reaktion vom Kanzler. Haben Sie heute mit ihm gesprochen? Sieht er das Ergebnis
  in Sachsen-Anhalt als Niederlage für seine Partei und vielleicht auch ein bisschen
  für sich selbst? Noch einmal: Ich verstehe Ihr Interesse und das Interesse aller
  Kolleginnen und Kollegen hier im Raum. Aber gedulden Sie sich noch, wahrscheinlich
  anderthalb Stunden. Es ist üblich, dass man sich nach einem solchen Abend erst einmal
  im Präsidium, im Parteivorstand, intern berät. Gegen 13.30 Uhr wird sich der Bundeskanzler
  nach den Sitzungen der Gremien äußern. Ich werde jetzt hier ‑ dafür kann ich nur
  noch einmal um Verständnis bitten ‑ dem nicht vorgreifen. Ich bin nur der Regierungssprecher.
  Noch einmal zum Verständnis, Herr Hille, in Sachen Reformpolitik und Wunsch nach
  Wettbewerbsfähigkeit: Sie investieren Milliarden in Aufrüstung, während jetzt beim
  Sozialstaat gekürzt werden soll und das Leben in Zukunft für immer mehr Menschen
  unsicherer wird ‑ laut den Umfragen jetzt noch einmal, auch auf Wahlgründe. Registriert
  diese Bundesregierung nicht, dass die Bevölkerung die Interessen der deutschen Superreichen
  und Konzerne nicht als ihre eigenen versteht? Herr Kollege, auch darin waren schon
  wieder eine Reihe von Unterstellungen, die ich zurückweise ‑ ‑ beispielsweise, dass
  wir Politikbereiche gegeneinander ausspielen würden. Das tun wir nicht. Es ist die
  große Herausforderung, das eine zu tun und das andere nicht zu lassen, das heißt,
  Deutschland in eine neue Sicherheitswelt zu führen. Es wird seit über vier Jahren
  wieder Krieg in unserer unmittelbaren Nachbarschaft geführt. Das muss etwas mit
  uns tun. Deshalb hat das Thema Sicherheit eine ganz neue Bedeutung. Genauso hat
  es aber eine Bedeutung, dass wir unsere Sozialsysteme zukunftsfähig machen. Wir
  müssen beides tun. Wir können nicht nur das eine oder das andere tun, und wir spielen
  erst recht nicht das eine gegen das andere aus. Hierbei geht es ja um soziale Sicherheit.
  Wenn die Menschen sehen, dass die Zukunftsfähigkeit der Sozialsysteme bedeutet,
  dass sie ärmer werden oder Angst vor der Zukunft haben und gleichzeitig die Reichsten
  nicht angetastet werden, dann macht es etwas mit den Leuten. Dann suchen sie Sündenböcke,
  wie gestern. Darauf bezieht sich die Frage. Ich glaube, das hatten Sie auch verstanden.
