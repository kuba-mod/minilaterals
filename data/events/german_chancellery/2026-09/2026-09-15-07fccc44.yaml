title: Interview mit Sonderpreisträger von „Jugend forscht“ 2026 Wie tickt eine Sanduhr?
  Banaler Alltagsgegenstand oder komplexe Physik?
text: 'Tim Kammel hat in seinem Projekt die Genauigkeit von Sanduhren und deren Mechanik
  untersucht. Eine ungenaue Sanduhr in der mündlichen Englischprüfung gab Tim Kammel
  den Anstoß, das vermeintlich banale Alltagsobjekt physikalisch zu durchleuchten.
  Die überraschende Erkenntnis für den 18-Jährigen: Viele herkömmliche Sanduhren laufen
  je nach Richtung unterschiedlich schnell – ein Phänomen, das sogar die Gewinnchancen
  beim Spieleabend beeinflusst. Davon und welche Herausforderungen es bei der Umsetzung
  seines Projekts gab, berichtet Tim Kammel in diesem Interview. Für seine Forschungsarbeit
  erhielt der Jungforschende den „P reis für die originellste Arbeit“ beim Bundeswettbewerb
  „Jugend forscht“. Diesen Preis vergibt traditionell der Bundeskanzler. Es ist für
  mich eine sehr große Ehre, als Preisträger von „Jugend forscht“ ins Bundeskanzleramt
  eingeladen zu werden. Dass darüber hinaus gerade ich derjenige bin, der sein Projekt
  dem Bundeskanzler vorstellen darf, erfüllt mich einerseits mit sehr viel Stolz und
  Dankbarkeit, ist auf der anderen Seite auch eine große, neue Herausforderung, auf
  die ich mich aber sehr freue. In meiner mündlichen Englischprüfung wurde die Zeit
  mit einer Sanduhr gestoppt. In der vorgegebenen Zeit bin ich einfach nicht fertig
  geworden. Ich habe mich gefragt, woran es liegen könnte. An mir ja hoffentlich nicht...
  Deshalb bin ich direkt im Anschluss mit folgenden Worten zu meiner Englischlehrerin
  gegangen: „Ich glaube, die Sanduhr gucke ich mir nochmal genauer an!“ In meinem
  Projekt habe ich mich mit der Frage auseinandergesetzt, wie eine Sanduhr tickt.
  Hierfür habe ich , neben Untersuchungen zur Genauigkeit herkömmlicher Sanduhren,
  einen Versuchsaufbau konstruiert, mit dem ich Einflussfaktoren wie Trichterwinkel,
  Öffnungsgröße oder Schaftlänge variieren kann . Dies diente dazu, die Mechanik hinter
  der Sanduhr besser zu verstehen und teils überraschende Phänomene erklären zu können.
  Mit meiner modellbasierten Simulation kann ich darüber hinaus die Durchlaufzeiten
  für unterschiedliche Sanduhren voraussagen. Am meisten überrascht hat mich, welch
  komplexe Physik hinter einem so vermeintlich banalen Alltagsgegenstand wie der Sanduhr
  steckt. Außerdem weiß ich jetzt endlich, warum man beim Tabu-Spielen immer verliert…
  Schließlich ist es tatsächlich so, dass ein und dieselbe Sanduhr je nach Laufrichtung
  unterschiedliche Durchlaufzeiten aufweisen kann. So besitze ich beispielsweise eine
  Sanduhr, die der Hersteller mit 600 Sekunden angibt, welche in die eine Richtung
  zwar tatsächlich 600 Sekunden, in die andere aber nur 540 Sekunden läuft. Jede Überraschung
  ist beim Forschen gleichzeitig auch immer eine Herausforderung: Wieso passiert nicht
  das, was ich erwartet habe? Reichen meine Messreihen aus? Habe ich wirklich keine
  anderen Einflussfaktoren unabsichtlich mitverändert? All diese Fragen haben mich
  während meines Forschungsprojektes durchgängig begleitet. Aber genau das macht Forschung
  für mich so spannend: Je größer die Herausforderung, desto größer ist auch die Freude,
  wenn man diese einmal überwunden hat. Während in der heutigen Zeit wohl vermeintlich
  jeder mit dem Handy seine Stoppuhr jederzeit bei sich hat, scheint die Sanduhr vollständig
  überholt zu sein. Nicht jedoch die von mir untersuchte Mechanik, die dahintersteckt.
  Die Anwendungen hierfür sind vielfältig: Von dem Entleeren eines Getreidesilos über
  die Dosierung eines Medikaments in der Pharmazie bis möglicherweise hin zu einem
  besseren Verständnis von Besucherströmen. Letzteres könnte zum Beispiel für die
  Evakuierung von Großveranstaltungen von großer Relevanz sein. Neben dem Forschen spiele
  ich in meiner Freizeit in unserem örtlichen Verein Tennis, engagiere mich in der
  Schülervertretung und gehe regelmäßig Schwimmen. Mein Abitur werde ich nächstes
  Jahr machen. Danach möchte ich gerne studieren. Durch die Arbeit an meinem Forschungsprojekt
  hat sich mein Wunsch, später im MINT -Bereich zu studieren, noch einmal verstärkt
  . G anz festgelegt habe ich mich aber noch nicht.'
