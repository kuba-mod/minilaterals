title: 'Neues Förderprogramm mit zehn Millionen Euro für Projekte in NS- und SED-Gedenkstätten
  – Staatsminister Weimer: „Gerade jetzt Orte der Erinnerung stärken“'
text: 'Ab sofort können sich Gedenkstätten und Erinnerungsorte zur Aufarbeitung der
  NS-Terrorherrschaft und der SED-Diktatur um eine Projektförderung durch den Bund
  bewerben. Der Beauftragte der Bundesregierung für Kultur und Medien (BKM) stellt
  dafür im Rahmen der Umsetzung der neuen Gedenkstättenkonzeption insgesamt zehn Millionen
  Euro zur Verfügung. Zum Bewerbungsstart des neuen Förderprogramms sagte Wolfram
  Weimer, Staatsminister für Kultur und Medien: „In den Gedenkstätten schlägt das
  Herz unserer Erinnerungskultur. Deshalb verdienen sie jede Unterstützung. Mit der
  Projektförderung wollen wir Gedenkstätten und Erinnerungsorten dabei helfen, ihre
  historischen Orte zu bewahren, neue digitale Zugänge zu schaffen und zeitgemäße
  Bildungs- und Vermittlungsangebote zu entwickeln. Gerade angesichts der wachsenden
  Herausforderungen, vor denen Gedenkstätten stehen, ist es wichtig, dass innovative
  Ideen und nachhaltige Projekte die notwendige Stärkung erfahren.“ Gefördert werden
  Projekte in drei Förderfeldern: Gedenkstätten und Erinnerungsorte können ihre Anträge
  ab sofort einreichen. Die Bewerbungsfrist endet am 1. Oktober 2026. Über die Auswahl
  der zu fördernden Projekte wird eine unabhängige Jury beraten. Frühestmöglicher
  Projektbeginn ist der 1. Juli 2027. Mit der Projektförderung setzt der Bund die
  im November 2025 neu beschlossene Gedenkstättenkonzeption um und trägt damit den
  wachsenden Herausforderungen für Gedenkstätten und Erinnerungsorte Rechnung. Für
  Projekte zur Aufarbeitung der nationalsozialistischen Verbrechen und des SED-Unrechts
  sieht der Regierungsentwurf zum Bundeshaushalt 2027 insgesamt zehn Millionen Euro
  vor. BKM verdoppelt damit die bisher zur Verfügung stehende Förderung. Darüber hinaus
  sollen die vom Bund geförderten Gedenkstätten ab dem kommenden Jahr jährlich weitere
  fünf Millionen Euro zusätzlich erhalten, insbesondere zum Ausgleich gestiegener
  Personalausgaben sowie zunehmender Bewachungskosten aufgrund der verschärften Bedrohungslage.
  Weiterführende Informationen zur Ausschreibung und zu den Fördergrundsätzen sowie
  die Antragsformulare sind auf der Website der Stiftung Erinnerung, Verantwortung
  und Zukunft (EVZ) zu finden, die die Ausschreibung unterstützt. Der Regierungsentwurf
  zum Bundeshaushalt 2027 steht unter dem Vorbehalt der weiteren Haushaltsaufstellung,
  insbesondere des parlamentarischen Haushaltsaufstellungsverfahrens.'
