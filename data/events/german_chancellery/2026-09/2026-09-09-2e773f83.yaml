title: Neuer Österreichisch-Deutscher Lyrikpreis zum Bachmann-Jubiläum würdigt zeitgenössische
  Lyrik
text: 'Im Jubiläumsjahr anlässlich des 100. Geburtstags von Ingeborg Bachmann würdigen
  Österreich und Deutschland gemeinsam die deutschsprachige Gegenwartslyrik mit einer
  neuen Auszeichnung: dem Österreichisch-Deutschen Lyrikpreis. Initiiert wird dieser
  vom Bundesministerium für europäische und internationale Angelegenheiten der Republik
  Österreich (BMEIA) und dem Beauftragten der Bundesregierung für Kultur und Medien
  (BKM). Der einmalige Preis zeichnet eine Lyrikerin beziehungsweise einen Lyriker
  mit Lebensmittelpunkt in Österreich und eine Lyrikerin beziehungsweise einen Lyriker
  mit Lebensmittelpunkt in Deutschland aus. Er ist mit jeweils 15.000 Euro dotiert.
  Staatssekretär Sepp Schellhorn: „‚Alles ist eine Frage der Sprache‘, schreibt Ingeborg
  Bachmann. Darin liegt auch eine Grundidee Europas: Wir müssen nicht immer dieselbe
  Sprache sprechen, aber wir müssen versuchen, einander zu verstehen. Für Österreich
  und Deutschland sagt man: Nichts trennt uns so sehr wie die gemeinsame Sprache.
  Was könnte also geeigneter sein als die Lyrik, um uns wieder zusammenzubringen?
  Dass wir im Bachmann-Jahr gemeinsam herausragende Gegenwartslyrik vor den Vorhang
  holen, freut mich ganz besonders.“ Staatsminister Wolfram Weimer: „Lyrik schlägt
  Brücken zwischen Menschen und Nationen. Gedichte überschreiten Grenzen: Grenzen
  der Herzen, der Sprachen, der Kulturen und der Staaten. Gerade deshalb war es uns
  wichtig, im Jubiläumsjahr der großen Schriftstellerin Ingeborg Bachmann diesen gemeinsamen
  Preis ins Leben zu rufen. Damit setzen wir ein Zeichen für die enge kulturelle Verbundenheit
  unserer beiden Länder und für die Kraft der Literatur, Menschen zusammenzubringen.“
  Prämiert werden Lyrikbände, die in den vergangenen drei Jahren erschienen sind und
  – wie Ingeborg Bachmanns Werk und Leben – geprägt sind von der Verbindung verschiedener
  poetischer Traditionen, Sprachwelten und Kulturräume. Zum Preis gehört auch eine
  Teilnahme an Übersetzungswerkstätten in Berlin und Wien. Dort beschäftigen sich
  die Preisträgerinnen und Preisträger gemeinsam mit Literaturübersetzerinnen und
  -übersetzern mit Sprachen und Werken, die für Ingeborg Bachmann von besonderer Bedeutung
  waren. Im Mittelpunkt steht dabei der Austausch darüber, wie sich ihre eigenen Texte
  in andere Sprachen übertragen lassen und welche neuen Perspektiven dadurch entstehen.
  Der Preis schafft damit nicht nur Sichtbarkeit für herausragende zeitgenössische
  Lyrik, sondern auch einen Raum für literarischen und europäischen Austausch. Zugleich
  knüpft er an das reiche literarische Werk Ingeborg Bachmanns an, das bis heute weit
  über den deutschsprachigen Raum hinauswirkt. Die gemeinsame feierliche Preisverleihung
  des Österreichisch-Deutschen Lyrikpreises findet am Eröffnungstag der Buch Wien
  am 25. November 2026 statt. Projektträger sind auf österreichischer Seite die Österreichische
  Gesellschaft für Literatur (ÖGfL) und in Deutschland das Literarische Colloquium
  Berlin e.V. (LCB), in Kooperation mit dem TOLEDO-Programm des Deutschen Übersetzerfonds.
  Über die Vergabe des Preises entscheidet eine unabhängige österreichisch-deutsche
  Jury. Ihr gehören an: Jan Bürger (Marbach), Bernhard Fetz (Wien), Daniela Strigl
  (Wien), Beate Tröger (Frankfurt am Main), TOLEDO/LCB, Berlin (Aurélie Maurin) sowie
  die ÖGfL Wien (Ursula Ebel/Manfred Müller).'
