date: '2026-09-11'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 11. September 2026
text: 'Sprecherinnen und Sprecher •    stellvertretender Regierungssprecher Meyer
  •    Bowinkelmann (BMI) •    Hinterseher (AA) •    Pauly (BMDS) •    Harmsen (BMF)
  •    Dr. Noack (BMVg) •    Wentzel (BMWE) (Vorsitzende Buschow eröffnet die Pressekonferenz
  und begrüßt SRS Meyer sowie die Sprecherinnen und Sprecher der Ministerien.) Wir
  fangen an mit den Terminen des Bundeskanzlers in den kommenden Tagen und der kommenden
  Woche. Bundeskanzler Friedrich Merz wird am kommenden Sonntag, dem 13. September,
  nach Rovaniemi in Finnland reisen. Dort nimmt er am 13. und 14. September auf Einladung
  des finnischen Ministerpräsidenten Petteri Orpo gemeinsam mit weiteren EU-Partnern
  und Vertreterinnen und Vertretern der EU-Institutionen am EU-Arktis-Gipfel teil.
  Das Treffen bietet die Gelegenheit, den gemeinsamen strategischen Ansatz der EU
  für die Arktis zu diskutieren und zu stärken. Eine gemeinsame Pressebegegnung ist
  für den Nachmittag des 14. Septembers vorgesehen. Am Dienstagmorgen um 10 Uhr empfängt
  der Bundeskanzler die Preisträgerinnen und Preisträger des 61. Bundeswettbewerbs
  „Jugend forscht“ im Kanzleramt. Am Empfang nimmt auch Bundesbildungsministerin Karin
  Prien teil. Die Einladung zu einem Empfang im Bundeskanzleramt an die Bundessiegerinnen
  und Bundessieger sowie die Platzierten des Wettbewerbs gibt es schon seit 1981 und
  ist somit eine gute Tradition. Im Rahmen der Veranstaltung wird Bundeskanzler Merz
  den mit 3000 Euro dotierten Preis des Bundeskanzlers für die originellste Arbeit
  übergeben. Die Präsentation des Jungforschers, die Preisverleihung und die anschließende
  Diskussion mit allen Preisträgerinnen und Preisträgern sind presseöffentlich. Interessierte
  können die Veranstaltung auch über einen Livestream auf www.bundesregierung.de verfolgen.
  Ab 13 Uhr nimmt der Bundeskanzler dann am Unternehmertag des Bundesverbandes Großhandel,
  Außenhandel und Dienstleistungen, kurz BGA, teil. Er hält gegen 13.15 Uhr eine Rede.
  Die Teilnehmenden aus Politik und Wirtschaft diskutieren über die aktuelle Lage
  und den Wirtschaftsstandort Deutschland in Zeiten globaler Umbrüche. Unter dem Titel
  „Systemrelevant.“ geht es um die zentrale Rolle von Groß- und Außenhandel sowie
  Dienstleistungen. Gegen 15 Uhr wird der Bundeskanzler den Ministerpräsidenten des
  Irak, Herrn al-Zaidi, mit militärischen Ehren im Bundeskanzleramt empfangen. Im
  Vordergrund des Gesprächs stehen unter anderem die Fortentwicklung der bilateralen
  Beziehungen und insbesondere die wirtschaftliche Zusammenarbeit. Ebenso wird sicherlich
  die regionalpolitische Lage Gegenstand des Austausches sein. Eine gemeinsame Pressebegegnung
  ist für 16.30 Uhr geplant. Am Mittwoch, dem 16. September, tagt um 10 Uhr wie gewohnt
  das Kabinett. Am Mittwochabend um 19 Uhr, empfängt der Bundeskanzler den Strategiekreis
  für Technologie und Innovation zu seiner dritten Sitzung. Der Strategiekreis des
  Bundeskanzlers setzt dabei seine Beratung zur Stärkung des nationalen KI-Ökosystems
  und den Innovationspotenzialen im Verteidigungsbereich fort. Die Bundesregierung
  hat sich das Ziel gesetzt, Deutschland als führende KI-Nation insbesondere bei der
  industriellen Anwendung von KI zu etablieren. Das war auch Schwerpunkt bei der Kabinettsklausur
  in Neuhardenberg. Innovationen in der Sicherheits- und Verteidigungsindustrie gilt
  es angesichts der geopolitischen Herausforderungen zu beschleunigen. Die KI-Aktivitäten
  des Strategiekreises fließen auch in die KI-Taskforce der Bundesregierung ein. Der
  Termin am Mittwochabend ist nicht presseöffentlich. Soweit zu den Terminen. ‑ Ich
  mache gerne direkt weiter. Wir haben das gestern Abend schon kommuniziert, ich möchte
  es aber an dieser Stelle auch noch einmal tun: Die Bundesregierung begrüßt ausdrücklich
  die Ankündigung eines Investitionspakets der Vereinigten Arabischen Emirate in Höhe
  von insgesamt 40 Milliarden Euro in Deutschland. Das wäre eine Verdopplung der bisherigen
  Investitionen aus den VAE hier in Deutschland. Es zeigt, wie stark die Vereinigten
  Arabischen Emirate in Deutschland als führenden Standort für Investitionen, Innovation
  und industrielles Wachstum vertrauen. Das sichert mittel- und langfristig Arbeitsplätze
  in Deutschland und stärkt unsere Souveränität. Die Nachricht bettet sich ein in
  ermutigende Nachrichten, die wir für den Wirtschaftsstandort Deutschland in den
  vergangenen Tagen bekommen haben. Es zeigt einmal mehr die Attraktivität des Wirtschaftsstandortes
  Deutschland. Es ist vor allem ein Vertrauensbeweis in den Standort und zeigt auch
  den Wert von stabilen politischen Verhältnissen in unruhigen Zeiten. Angeknüpft
  an den Besuch des Präsidenten der Vereinigten Arabischen Emirate in Deutschland:
  Wurde im Gespräch des Bundeskanzlers mit dem Präsidenten eigentlich thematisiert,
  ob es das von Haaretz berichtete Gespräch zwischen Mohammed bin Zayed und Netanjahu
  vor dem 7 Oktober gegeben hat, oder war das kein Thema? Israel und Israels Sicherheit
  sowie auch die Situation in der Region waren in der Tat Gesprächsthema. Ich würde
  da auch noch einmal an die im Nachgang veröffentlichte gemeinsame Erklärung verweisen,
  die den ganzen Strauß der Themen aufmacht. Zu den kolportierten Medienberichten
  kann ich eigentlich nur wiederholen, was am Mittwoch bereits gesagt wurde: Wir haben
  dazu keine eigenen Erkenntnisse. Man kann solche Erkenntnisse ja in einem direkten
  Gespräch gewinnen. Hat der Bundeskanzler die Möglichkeit der direkten Begegnung
  genutzt, um zu fragen, ob ein solches Gespräch stattgefunden hat? Wenn ja, was war
  die Antwort? Wenn nein, warum hat er das nicht gefragt? Ich habe diese Antwort sehr
  bewusst gewählt und würde deshalb auch dabei bleiben. Ich habe eine eher allgemeine
  Frage zum Besuch des Scheichs: Sicherheitsvorkehrungen, wie wir sie gestern gesehen
  haben, gab es sonst nur beim Besuch des US-Präsidenten oder zum Beispiel von Herrn
  Selenskyj. Was war der genaue Grund dafür? Solche Sicherheitsvorkehrungen erfolgen
  aufgrund der Einstufung einer potenziellen Gefahrenlage und der Bewertung der Sicherheitsbehörden.
  Über Details kann ich hier keine Auskunft geben. Herr Meyer, es steht der Vorwurf
  im Raum, dass man Protestler fernhalten wollte oder eben einfach dem Scheich schmeicheln
  wollte. Was können Sie dazu sagen? Diese Vorwürfe kenne ich nicht. Ich glaube, wenn
  unsere Sicherheitsbehörden das für notwendig halten, dann gibt es dafür gute Gründe.
  Ich kann aber auch noch sagen, dass wir natürlich Verständnis gerade für die Berlinerinnen
  und Berliner haben, die immer wieder von Sicherheitsvorkehrungen im Straßenverkehr
  beeinflusst sind. Da können wir nur um Verständnis bitten, und wir hoffen, dass
  es Verständnis dafür gibt, dass wir die Sicherheit hier gewährleisten wollen. Ich
  darf Ihnen eine Reise des Außenministers ankündigen: Außenminister Wadephul reist
  am Montag nach Budapest. Das wird die erste Reise des Außenministers nach Ungarn
  und zugleich auch der erste Besuch eines deutschen Außenministers in Budapest seit
  2019 sein. In Ungarn trifft Außenminister Wadephul den neuen ungarischen Staatspräsidenten
  András Bálint Baka sowie seine Amtskollegin Anita Orbán zu politischen Gesprächen.
  Darüber hinaus wird er auch mit dem ungarischen Wirtschaftsminister István Kapitány
  und Wirtschaftsvertretern aus Deutschland und Ungarn zusammentreffen. Der Aufbruch
  in den deutsch-ungarischen Beziehungen bietet aus unserer Sicht auch wirtschaftlich
  viel Potenzial für eine neue Dynamik. Bei dem Besuch in Budapest geht es auch darum,
  ein neues Kapitel mit Ungarn aufzuschlagen. Wie Sie wissen, sind seit dem Regierungswechsel
  in Budapest die Weichen gestellt für eine Rückkehr Ungarns zur Rechtsstaatlichkeit
  und zu den europäischen Grundwerten. Wir wollen diesen Schwung unsererseits aufnehmen
  und unsere Partnerschaft dadurch neu beflügeln und erweitern. Ungarn ist nicht nur
  Partner in der EU, sondern auch in der NATO. In den Gesprächen am Montag wird es
  folglich auch um alle drängenden Themen gehen, die unsere europäische Sicherheit
  und unseren Zusammenhalt in Europa angehen, insbesondere um den fortgesetzten russischen
  Angriffskrieg gegen die Ukraine. Wir sind froh, dass wir mit Ungarn seit dem Regierungswechsel
  diesbezüglich sehr konstruktiv zusammenarbeiten. Im Anschluss an die Gespräche in
  Budapest wird es eine Pressekonferenz geben. Bundesdigitalminister Dr. Karsten Wildberger
  reist kommende Woche nach Kanada. Anlass ist die ALL IN in Montreal. Der Minister
  wird am 16. und 17. September eine Reihe presseöffentlicher Termine wahrnehmen.
  Er wird von einer Wirtschaftsdelegation begleitet. Deutschland ist in diesem Jahr
  Partnerland der Konferenz. Auf dem Programm stehen gemeinsame Termine mit dem kanadischen
  Minister für KI und digitale Innovation, Evan Solomon, sowie Treffen mit kanadischen
  und deutschen Wirtschaftsvertretern. Die ALL IN ist das wichtigste Event für die
  Technologie- und KI-Branche in Kanada und findet in diesem Jahr zum vierten Mal
  statt. Im Mittelpunkt stehen die Themen von KI-Infrastruktur, angewandter KI in
  der Wirtschaft, KI und Gesellschaft sowie Robotik. Kanada ist ein bedeutender strategischer
  Partner der Bundesrepublik Deutschland. Die Reise verfolgt das Ziel, die guten politischen
  und wirtschaftlichen Beziehungen beider Staaten weiter zu vertiefen. Herr Meyer,
  der Kanzler hatte ‑ ich meine, es war in Belém ‑ dem UN-Fonds zum Schutz des Regenwaldes
  eine Milliarde Euro mehr oder weniger zugesagt. Dagegen regt sich jetzt Widerstand
  innerhalb der Unionsfraktion im Bundestag. Wie bewertet der Kanzler solch eine Entwicklung?
  Kratzt das nicht an seiner Autorität? Ich kann mir vorstellen, dass es auch noch
  weitere Nachfragen zu aktuellen Äußerungen zu Dingen gibt, die wir vorhaben und
  die aktuell im parlamentarischen Verfahren sind. Ich weiß, dass Sie es möglicherweise
  nicht mehr hören können, aber ich finde es trotzdem wichtig, darauf hinzuweisen,
  dass es erst einmal völlig normal ist, dass die Bundesregierung Vorschläge macht
  und Beschlüsse fasst, die dann vom Gesetzgeber, also vom Parlament, weiterberaten
  und in vielen Fällen ‑ ich will jetzt nicht das Struck’sche Gesetz zitieren ‑ auch
  verändert werden. Insofern ist es grundsätzlich etwas völlig Normales, dass sich
  die Parlamentarier positionieren. Ich möchte eigentlich nicht dahin kommen, jede
  einzelne Äußerung sozusagen wie beim Pingpong hin- und herzuspielen. In der Sache
  würde ich dazu trotzdem gern sagen: Die Bundesregierung unterstützt den bei der
  letzten Weltklimakonferenz von Brasilien vorgeschlagenen Waldschutzfonds, um den
  Schutz des tropischen Regenwalds weltweit zu sichern. Bundeskanzler Merz hat eine
  Milliarde Euro als Beitrag Deutschlands für den Tropenwaldfonds zugesagt. Dazu stehen
  wir als Bundesregierung. Alles Weitere wird jetzt im Parlament diskutiert. Herr
  Harmsen, eine Frage zur Commerzbank und zu UniCredit. Anfang der Woche wird es ein
  Treffen des Finanzministers mit dem Chef der UniCredit geben, um über die Zukunft
  der Commerzbank zu sprechen. Welche Hebel hat die Bundesregierung ganz konkret,
  um auf die UniCredit einzuwirken? Ich möchte noch einmal unsere Position deutlich
  machen. Für die Bundesregierung hat die Rolle der Commerzbank für die Finanzierung
  der deutschen Wirtschaft und des deutschen Mittelstands hohe Priorität. Sie ist
  als bedeutender Arbeitgeber zudem zentral für den Finanzstandort Frankfurt. Das
  gilt es auch in Zukunft sicherzustellen. Die Bundesregierung wird daher weiterhin
  im Sinne des deutschen Mittelstands, des Finanzstandorts Frankfurt und der Beschäftigten
  handeln. Dazu stimmt sich die Bundesregierung eng ab. Sie ist zudem in Gesprächen
  mit der Commerzbank und dem Betriebsrat. Wir haben stets deutlich gemacht, dass
  wir eine feindliche Übernahme ablehnen. Inzwischen sind beide Banken in Verhandlungen
  eingetreten. Aktuell berät das Management der Commerzbank mit dem Management der
  UniCredit Group. Sie haben es richtig gesagt. Bundesfinanzminister Klingbeil hat
  den CEO der UniCredit zu einem Gespräch am Montag, den 14. September, im BMF eingeladen,
  um die Position, die ich gerade genannt habe, darzulegen und in den Austausch zu
  treten. Das begleitet die Gespräche der beiden Banken, denen es weiterhin obliegt,
  in direkte Beratung über den weiteren Weg zu sprechen. Ich will diesen Gesprächen
  nicht vorgreifen, aber natürlich werden wir die Position, die ich gerade genannt
  habe, auch gegenüber der UniCredit und in weiteren Gesprächen weiterhin sehr deutlich
  machen. Herr Meyer, der Spitzenkandidat der AfD in Sachsen-Anhalt, Herr Siegmund,
  wurde jetzt nach der Ansiedlung einer israelischen Rüstungsfirma in Sachsen-Anhalt
  gefragt und hat gesagt, das könne man sich durchaus vorstellen, weil Rüstungsgüter
  ja auch für die angestrebte Remigration und den Beginn verstärkter Abschiebung genutzt
  werden könnten. Was sagt die Bundesregierung zu solch einer Äußerung? Ich will das
  von dieser Stelle nicht weiter kommentieren, aber ich denke, das steht für sich.
  Herr Bowinkelmann, können Sie sagen, in welcher Form Rüstungsgüter beim Umgang mit
  Asylbewerbern und auch bei möglichen Abschiebungen zum Einsatz kommen? Was kann
  man darunter verstehen? Dass Beamte, die möglicherweise abgelehnte Asylbewerber
  auf den Flügen begleiten, bewaffnet sind, kann man sich ja vorstellen. Aber was
  an Rüstungsgütern ist bei Asylverfahren darüber hinaus im Einsatz? Darüber hinaus
  ist nichts im Einsatz, und darunter kann ich mir auch weiter nichts vorstellen.
  Ich habe eine Frage an Frau Noack vom Verteidigungsministerium zum aktuellen Stand
  beim Bundeswehreinsatz im Nordirak, der ‑ so heißt es zumindest hinter den Kulissen ‑
  beendet zu sein scheint. Wenn es so ist, Frau Noack, dass das Feldlager in Erbil
  bereits geräumt wurde, ist das dann ein bewusst leiser Abschied aus dem Irak? Wie
  umfänglich ist der Rückzug vor dem Hintergrund, dass man ja eigentlich Berater dort
  belassen wollte? Um das allgemein einzuordnen: Die Beendigung der Mission erfolgt
  auf Bitten der irakischen Regierung. Selbstverständlich akzeptieren das alle Partner.
  Ich möchte aber dafür werben ‑ auch hier haben wir das schon mehrfach dargestellt,
  auch ich selbst ‑, dass wir aus Gründen der militärischen Sicherheit dazu nicht
  ausführen können. Selbstverständlich werden wir darüber informieren, wenn unsere
  Exitstrategie vollzogen ist und alle unsere Soldatinnen und Soldaten wohlauf wieder
  zu Hause sind. Wie fällt Ihre Bilanz des Einsatzes im Irak aus? Dem greifen wir
  nicht vor. Eine Bilanz zieht man natürlich erst dann, wenn alles abgeschlossen ist.
  Ich würde Sie darum bitten, auf unsere Berichterstattung dazu noch zu warten. Herr
  Meyer, es gab jetzt in der Haushaltswoche des Bundestags Berichte darüber, dass
  es in der Unionsfraktion Widerstand gegen den Haushaltsentwurf, gegen die Steuerpolitik
  gab. 20 Abgeordnete ‑ davon war die Rede ‑ würden dem Haushaltsentwurf in der jetzigen
  Form nicht zustimmen. Wie schaut der Bundeskanzler darauf? Nimmt er das vielleicht
  auch zum Anlass, die Debatte noch einmal steuerpolitisch voranzutreiben und da mehr
  Ehrgeiz hineinzubringen? In der Frage war jetzt viel drin! Ich will noch einmal
  auf das verweisen, was ich gerade auch zu einer ähnlich gelagerten Frage gesagt
  habe: Es ist doch völlig normal, dass wir als Kabinett Dinge auf den Weg bringen,
  sie dann an das Parlament überweisen und sie dort auch kontrovers diskutiert werden.
  Ich meine, das ist der Wesenszug unserer Demokratie. Insofern kann ich darin einen
  Aufstand, offen gesagt, nicht erkennen, sondern entsprechende Diskussionen. Ich
  will es noch einmal sagen: Für die Einkommenssteuerreform haben wir uns sehr bewusst
  entschieden, trotz einer sehr, sehr angespannten Haushaltslage, die ja breit dokumentiert
  ist, Wege zu finden, insbesondere kleine und mittlere Einkommen, insbesondere aber
  auch Familien mit Kindern an dieser Stelle zu entlasten. Das hat auch etwas mit
  gestiegenen Preisen zu tun, die viele Menschen sicherlich belasten. Deshalb war
  uns wichtig, hier ein klares Entlastungssignal zu senden. Entscheidend ist am Ende
  natürlich immer, dass Dinge gegenfinanziert sind. Das haben wir entsprechend auch
  vorgelegt. Wir haben hier ein Entlastungsvolumen von zehn Milliarden Euro vorgelegt.
  Wenn es im Parlament Wege, Möglichkeiten gibt, dass sich die Koalitionsfraktionen
  auf Wege verständigen, diese Entlastungssumme zu erhöhen, dann liegt das in der
  Freiheit des Parlaments. Noch einmal: Der Schwerpunkt der Entlastung kleiner und
  mittlerer Einkommen und von Familien ist uns besonders wichtig. Würde der Bundeskanzler
  denn die Unionsfraktion ausdrücklich ermutigen, „Schaut doch bitte noch einmal nach,
  was das Thema der Subventionen angeht“ zu sagen? Da gab es ja Versuche. Die sind
  gestoppt worden. Der Bundeskanzler hat dann gesagt: Ich bin jetzt mit dieser Steuerreform
  in dieser Form zufrieden, die kann durch das Kabinett gehen. - Wie stark ist der
  Wunsch, beim Thema der Steuerentlastung tatsächlich noch größer zu denken? Noch
  einmal: Wir halten das Aussenden dieses Signals, kleinere und mittlere Einkommen
  sowie Familien auch wirklich zu entlasten ‑ Familien sogar um bis zu 600 Euro, als
  Beispiel für eine Familie mit zwei Kindern; das ist ja am Ende ein Gesamtpaket ‑,
  für besonders wichtig. Noch einmal: Alles Weitere wird jetzt das Parlament beraten,
  und das ist doch auch völlig in Ordnung. Herr Meyer, in der Generaldebatte hat der
  Bundeskanzler gestern erklärt, dass von der AfD verfolgte Konzept der Remigration
  laufe auf eine ethnische Säuberung hinaus, und zwar nach Herkunft und Abstammung.
  Ist diese ethnische Säuberung aus Sicht der Bundesregierung eine verfassungswidrige
  Position? Ich glaube, Stefan Kornelius hat sich hier am Mittwoch in der Regierungspressekonferenz
  nach der Generaldebatte auch zu diesem Thema schon geäußert und auch auf die Aussagen
  des Bundeskanzlers verwiesen. Das kann ich an dieser Stelle nur wiederholen. Die
  Folgefrage ist natürlich: Der Bundeskanzler hat ja in seiner Rede auch erklärt,
  implizit gegen welche Grundgesetzartikel das verstieße. Folgt daraus nicht logisch,
  dass die Bundesregierung einen Verbotsantrag gegen eine Partei, die solche nach
  ihrer Auffassung verfassungswidrigen Positionen vertritt, zumindest in Erwägung
  zieht? Auch zu diesem möglichen Schluss hat sich Herr Kornelius am Mittwoch schon
  auf Nachfrage geäußert. Was die Frage nach dem Verbotsverfahren angeht, hat sich
  der Bundeskanzler vorgestern in einer PK mit EU-Ratspräsident Costa auch noch einmal
  geäußert. Darauf kann ich nur verweisen. Ich könnte es jetzt nur wiederholen. Tatsächlich,
  Herr Kollege, vielleicht ein Hinweis für das Protokoll: Die identische Frage wurde
  am Mittwoch von Herrn Jung gestellt. Ich war auch hier und meine, das so gehört
  zu haben. Dann können Sie es dort nachlesen. Ich habe eine Frage an das BMF. Nachdem
  es ja ein kleines Hin und Her über das Thema der Zuckersteuer gegeben hat, würde
  mich interessieren, wo das Thema jetzt steht. Wann kommen Sie mit einem Entwurf
  an, und welches Einnahmevolumen streben Sie an? Auch da kann ich nur sagen: Das
  BMF arbeitet zusammen mit dem BMG daran. Wir befinden uns da in internen Abstimmungen.
  Die sind, wie ich es schon gesagt habe, intern. Ich kann Ihnen noch keinen Zeitplan
  nennen, aber sobald wir einen abgestimmten Entwurf haben, werden Sie natürlich davon
  erfahren. Aber Sie verfolgen das Vorhaben weiter dahingehend, dass nennenswerte
  Einnahmen für den Bundeshaushalt in diesem Bereich erzielt werden sollen? Als eine
  Zuckergetränkesteuer, genau. Aber daneben, also neben dem Einnahmeaspekt, geht es
  natürlich auch um gesundheitspolitische Aspekte. Das haben wir hier auch in der
  Vergangenheit betont. Herr Hinterseher, die Lage im Jemen spitzt sich derzeit weiter
  zu. Es droht jetzt auch Gefahr für die Meerenge, die dann zum Roten Meer führt.
  Wie bewertet das Auswärtige Amt die Situation? Ja, wir beobachten die Entwicklungen
  in der Region und im Roten Meer, aber vor allem um die Meerenge Bab al-Mandab ganz
  genau. Die jüngsten Meldungen ‑ darin geht es ja unter anderem um die Einnahme einer
  Hafenstadt ‑ sind aus unserer Sicht besorgniserregend, und dass neben Iran auch
  die Huthi schon seit Wochen versuchen, die internationale Schifffahrt zu beschränken
  und in Geiselhaft zu nehmen, auf Energieanlagen in Saudi-Arabien zielen und nun
  auch eben die Regierung Jemens ins Visier nehmen, verurteilen wir. Bei zunehmender
  Kontrolle der Huthi über diesen Seeweg drohen dann natürlich weitere Einschränkungen
  bei Öl- und auch LNG-Lieferungen aus der Region, mit den entsprechenden negativen
  Auswirkungen für die Versorgungslage auf dem Weltmarkt. Schon gestern hat Saudi-Arabien
  an die OPEC zum Beispiel für August eine eigene Rohölproduktion von nur ungefähr
  sechs Millionen Barrel pro Tag gemeldet. Das ist der niedrigste Stand seit 1990.
  Wir unterstützen die legitime Regierung Jemens, die sich ‑ anders als die Huthi ‑
  um Fortschritt und Entwicklung für ihre Bevölkerung kümmern möchte. Der Außenminister
  hat hierüber unter anderem am Sonntag mit seinem saudischen Amtskollegen gesprochen
  und Saudi-Arabien Deutschlands Solidarität versichert. Wir werden den Austausch
  darüber im strategischen Dialog mit der saudischen Seite fortführen, den der Außenminister
  mit seinem saudischen Amtskollegen vereinbart hat. Auch mit der jemenitischen Regierung
  stehen wir natürlich im Austausch darüber. An das Wirtschaftsministerium: Können
  Sie sagen, wie viel Öl und Gas durch diese Meerenge transportiert wird, dann auch
  für Deutschland? Gibt es da Schätzungen? Das habe ich aus dem Stand nicht vorliegen.
  Ich schaue einmal, ob ich Ihnen dazu etwas nachreichen kann.'
