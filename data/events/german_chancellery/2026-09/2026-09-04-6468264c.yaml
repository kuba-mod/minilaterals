title: 110 Millionen Euro für Schloss Friedenstein - Staatsminister Weimer und Ministerpräsident
  Voigt überreichen symbolischen Scheck
text: 'Staatsminister Wolfram Weimer besucht Eisenach und Gotha. Im Mittelpunkt seiner
  Kulturbautenreise steht ein echter Meilenstein bei der Sanierung von Schloss Friedenstein.
  Denn am heutigen Nachmittag überreichen Kulturstaatsminister Wolfram Weimer und
  Ministerpräsident Mario Voigt einen symbolischen Scheck über 110 Millionen Euro.
  Dieser steht dabei für das Gesamtvolumen des Sanierungsprogramms, das Bund und Land
  zu gleichen Teilen finanzieren. Darin enthalten sind sowohl die Mittel für die anstehenden
  Sanierungsabschnitte als auch bereits abgeschlossene Investitionen. Mit dem aktuellen
  Zuwendungsbescheid für das zweite Teilprojekt kann die Stiftung Thüringer Schlösser
  und Gärten nun ein großes Vorhaben in Angriff nehmen: Die Sanierung des Westflügels
  für die museale Nutzung durch die Friedenstein Stiftung Gotha. 2027 sollen dann
  die Arbeiten am Ostturm mit Teilen des Ostflügels beginnen. Ziel ist es, die historische
  Bausubstanz dauerhaft zu sichern und zugleich die Voraussetzungen für die Zukunft
  von Schloss Friedenstein zu schaffen. Historische Räume werden konserviert, die
  Arbeitsbedingungen für Museum und Forschungsbibliothek verbessert und der Zugang
  für Besucherinnen und Besucher weiterentwickelt. So wird das Schloss nicht nur als
  herausragendes Baudenkmal bewahrt, sondern auch als lebendiger Ort für Kunst, Kultur,
  Forschung und Bildung gestärkt. Staatsminister Wolfram Weimer erklärt: „Schloss
  Friedenstein ist ein herausragendes Zeugnis unseres kulturellen Erbes und von nationaler
  Bedeutung. Es ist ein starkes Zeichen, dass Bund und Freistaat Thüringen heute gemeinsam
  einen symbolischen Scheck über 110 Millionen Euro übergeben. Mit den Fördermitteln
  schaffen wir die Voraussetzungen dafür, dass Schloss Friedenstein für kommende Generationen
  erhalten bleibt und mehr Menschen diesen einzigartigen Kultur-, Museums- und Forschungsort
  erleben können. Damit stehen Bund und Land zu ihrer Verantwortung für unser Kulturerbe.
  Thüringen ist ein ganz besonderer Kulturstandort: Neben Schloss Friedenstein steht
  hier mit der Wartburg eine UNESCO-Welterbestätte von herausragender Bedeutung.“
  Thüringens Ministerpräsident Mario Voigt fügt hinzu: „Thüringen ist ein Kulturland
  von nationaler und internationaler Bedeutung. Die Wartburg und Schloss Friedenstein
  stehen beispielhaft für ein kulturelles Erbe, das weit über die Grenzen unseres
  Freistaats hinausstrahlt. Dieses Erbe wollen wir bewahren und zugleich für die Zukunft
  weiterentwickeln. Mein Dank gilt allen, die sich mit großer Leidenschaft dafür einsetzen.
  Mit dem Zuwendungsbescheid für Schloss Friedenstein übernehmen Bund und Land gemeinsam
  Verantwortung: Insgesamt 110 Millionen Euro sichern die weitere Sanierung dieses
  einzigartigen Ensembles und schaffen eine verlässliche Perspektive für die kommenden
  Jahre. Und dass wir diesen Tag mit der Eröffnung von ‚Rembrandt 1632‘ beschließen,
  zeigt zugleich Thüringens kulturelle Stärke. Die Ausstellung macht die internationale
  Qualität der herzoglichen Sammlungen sichtbar und lädt dazu ein, Gotha neu zu entdecken.
  Ich wünsche ihr viele Besucher – und bin sicher: Rembrandt und Gotha passen sehr
  gut zusammen.“ Thüringens Kulturminister Christian Tischner erklärt: „Mit dem Zuwendungsbescheid
  schaffen Bund und Freistaat Verlässlichkeit für die nächste entscheidende Etappe
  der Sanierung von Schloss Friedenstein. Dieses Schloss bewahrt weit mehr als historische
  Bausubstanz: Es verbindet Sammlungen, Forschung und kulturelle Bildung und ist für
  Gotha und ganz Thüringen ein Ort von großer Identität und Ausstrahlung. Dass wir
  den Besuch auf der Wartburg beginnen und mit der Rembrandt-Ausstellung im Herzoglichen
  Museum fortsetzen, zeigt die ganze Spannweite unseres kulturellen Erbes. Mein Dank
  gilt allen, die die anspruchsvolle Sanierung und die Arbeit der Einrichtungen mit
  Sachverstand und Ausdauer voranbringen.“ Im Rahmen seiner Kulturbautenreise in Thüringen
  besucht Staatsminister Weimer folgende Orte: Wartburg Zum Auftakt seines Besuchs
  traf Staatsminister Weimer auf der Wartburg Thüringens Kulturminister Christian
  Tischner, um sich gemeinsam mit dem Direktor der Wartburg-Stiftung Eisenach und
  Burghauptmann Martin Eberle zu national bedeutenden Kulturorten auszutauschen. „Der
  Besuch zeigt einmal mehr die Wertschätzung der Arbeit der Wartburg-Stiftung durch
  den Bund und den Freistaat Thüringen - besonders auch im Hinblick auf die bevorstehenden
  großen Baumaßnahmen im Jahr 2027, in deren Ergebnis die Wartburg in die Lage versetzt
  wird, sich zeitgemäß zu präsentieren und ihrem Bildungsauftrag noch besser gerecht
  zu werden“, so Prof. Dr. Eberle im Anschluss an den Besuch auf der Wartburg. Schloss
  Friedenstein Anschließend besucht Staatsminister Weimer Schloss Friedenstein mit
  einem Rundgang durch den Nordflügel mit den historischen Repräsentationsräumen,
  der Forschungsbibliothek und dem Ekhof-Theater. Dr. Doris Fischer, Direktorin der
  Stiftung Thüringer Schlösser und Gärten, begleitet Staatsminister Weimer beim Rundgang
  und erklärt: „Mit 110 Millionen Euro von Bund und Land sind wir in der Lage, Schloss
  Friedenstein in ersten wichtigen Bereichen zukunftssicher zu machen. Dabei verfolgen
  wir zwei wesentliche Schwerpunkte. Erstmals seit der Errichtung des Schlosses vor
  mehr als 350 Jahren setzen wir in den Sanierungsbereichen die Baukonstruktion grundlegend
  instand und haben damit die Chance, den imposanten Bau wieder für mehrere Generationen
  in seinem Bestand zu sichern. Genauso wichtig ist, dass wir durch denkmalgerechten
  Ausbau die Bedingungen für Museum und Bibliothek erheblich verbessern und damit
  sichtbare Wirkung und konkrete Zukunftsperspektiven für die beiden Nutzerinstitutionen
  erzielen, die Friedenstein Stiftung Gotha und die Forschungsbibliothek Gotha der
  Universität Erfurt. Ein erstes Teilprojekt ist bereits geschafft. Wir sind den Zuwendungsgebern
  in Bund und Land sehr dankbar, dass wir nun mit voller Kraft in die gründlich vorbereiteten
  weiteren Vorhaben einsteigen können.“ Rembrandt-Ausstellung im Herzoglichen Museum
  Gotha Am Nachmittag eröffnen Kulturstaatsminister Wolfram Weimer, Ministerpräsident
  Mario Voigt sowie der Direktor der Friedenstein Stiftung Gotha, Dr. Tobias Pfeifer-Helke,
  gemeinsam mit Gothas Oberbürgermeister Knut Kreuch die Ausstellung „Rembrandt 1632.
  Entstehung einer Marke“ im Herzoglichen Museum. Die Jahreshauptausstellung der Friedenstein
  Stiftung Gotha ist vom 5. September bis 6. Dezember 2026 zu sehen. Sie widmet sich
  dem Schlüsseljahr 1632, in dem sich Rembrandts unverwechselbare Malweise und sein
  internationaler Ruf herausbildeten. Erstmals werden zentrale Werke aus Gotha und
  Kassel gemeinsam mit ausgewählten internationalen Leihgaben gezeigt. Die in Kooperation
  mit Hessen Kassel Heritage entstandene Ausstellung wird im Rahmen des Bundesförderprojekts
  „Open-Friedenstein“ realisiert. Stiftungsdirektor Dr. Tobias Pfeifer-Helke erklärt:
  „Die Eröffnung der Rembrandt-Ausstellung im Herzoglichen Museum ist das kulturelle
  Großereignis des Jahres 2026 in Thüringen. Sie macht deutlich, welch enormes Potential
  die Gothaer Sammlungen haben, die verbunden sind mit der ganzen Welt. So haben uns
  27 Leihgeber aus insgesamt sieben Ländern ihre Schätze zur Verfügung gestellt und
  uns damit ihr Vertrauen ausgesprochen. Der größte Dank gilt den Bayerischen Staatsgemäldesammlungen.
  Durch die historischen Zeitumstände ging das wohl schönste Selbstporträt Rembrandts
  aus Gotha verloren und ist nun nach mehr als 80 Jahren wieder in Gotha zu erleben.
  Eine Sensation, die man sich nicht entgehen lassen sollte.“ Hintergrund: Schloss
  Friedenstein wurde zwischen 1643 und 1654 errichtet und zählt zu den größten und
  frühesten Barockschlössern Deutschlands. Das Schloss mit mehr als 20.000 Quadratmetern
  Nutzfläche gehört der Stiftung Thüringer Schlösser und Gärten. Zu den Nutzern zählen
  die Friedenstein Stiftung Gotha und die Forschungsbibliothek Gotha der Universität
  Erfurt. Die historischen Sammlungen gehen auf die Kunst- und Wunderkammer der frühneuzeitlichen
  Residenz zurück. Pressekontakte Beauftragter der Bundesregierung für Kultur und
