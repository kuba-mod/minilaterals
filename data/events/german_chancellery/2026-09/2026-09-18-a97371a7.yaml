title: Bund und Länder beschließen Spritpreis-Entlastungspaket
text: 'Angesichts der anhaltend hohen Spritpreise in Deutschland sorgen Bund und die
  Länder nun für eine schnelle Entlastung. Dafür senkt der Bund die Energiesteuer
  auf Benzin und Diesel bis Ende 2026 um 14 Cent pro Liter. Inklusive Umsatzsteuer
  summiert sich die Steuerentlastung für Kraftstoffe auf 17 Cent pro Liter. Insgesamt
  werden die Bürgerinnen und Bürger und die Wirtschaft um rund 2,5 Milliarden Euro
  entlastet. Die Länder leisten einen Beitrag in einer Höhe von 1,25 Milliarden Euro
  über einen Umsatzsteuerfestbetrag. Das Entlastungspaket soll bis 1. Oktober umgesetzt
  werden. Darüber hinaus wird der Bund Gespräche mit der Mineralölwirtschaft führen,
  mit dem Ziel, spätestens zum 1. Januar 2027 einen Spritpreisdeckel nach dem Vorbild
  Luxemburgs oder Belgiens einzuführen. Die Versorgungssicherheit muss gewährleistet
  sein. Missbräuchliche Preisaufschläge müssen unterbunden werden. Die Bundesregierung
  begrüßt die Gespräche in der Europäischen Union, analog zum EU-Energiekrisenbeitrag
  2022 Maßnahmen gegenüber der Mineralölwirtschaft zu prüfen. Die Bundesregierung
  wird die Preisentwicklung und mögliche wirtschaftliche Folgen weiterhin eng beobachten,
  um gegebenenfalls die besonders betroffenen Menschen und Unternehmen zielgerichtet
  zu entlasten. Der Bund schafft dafür die Voraussetzungen für einen einkommensbezogenen
  Direktauszahlmechanismus. Bundeskanzler Friedrich Merz: „Wer jeden Tag auf das Auto
  angewiesen ist, kommt an seine Belastungsgrenze. Wir handeln schnell und haben einen
  klaren Fahrplan für 2027. Wir zeigen, dass wir in der Krise widerstandsfähig sind
  und den Bürgerinnen und Bürgern helfen. Die Entlastung von immerhin 2,5 Milliarden
  Euro ist in Zeiten angespannter Haushalte kein Pappenstiel. Umso mehr freue ich
  mich, wie schnell wir dieses Paket geschnürt haben. Das ist ein starkes Signal für
  unser Land.“ Bundesfinanzminister Lars Klingbeil: „Die Spritpreise runterkriegen,
  die Menschen entlasten, die Abzocke an den Zapfsäulen beenden – genau das war mir
  wichtig und das erreichen wir mit unserer Einigung. Denn für Familien, für Pendler,
  für Handwerker und alle anderen, die das Auto jeden Tag brauchen, sind diese Spritpreise
  nicht mehr zu stemmen. Mit der Senkung der Energiesteuer sinken die Preise schnell.
  17 Cent weniger pro Liter, das macht einen Unterschied. Mit dem Spritpreisdeckel
  können wir die Preise begrenzen. Und wir arbeiten weiter daran, dass wir die Krisenprofite
  der Mineralölkonzerne an die Bürgerinnen und Bürger zurückgeben können." Ministerpräsident
  Olaf Lies, Niedersachsen: „Die Spritpreise sind derzeit völlig außer Kontrolle.
  Mit dieser Einigung handeln wir endlich entschlossen. Wir müssen die Pendler und
  diejenigen, die auf das Auto angewiesen sind, genauso aber auch die Unternehmen
  jetzt unterstützen. Was wir jetzt hier haben, ist ein echtes Lösungspaket: Wir bringen
  die Preise jetzt akut nach unten, sichern aber gleichzeitig eine weitere Entspannung
  durch einen Spritpreisdeckel. Dazu wollen wir eine Übergewinnsteuer, die die Ölmultis
  bei der Finanzierung heranzieht. So wird nicht nur ein Symptom bekämpft, sondern
  das Problem gelöst – und das ist gerecht. Wir werden alles tun, um diese Einigung
  in Bund und Ländern zügig durch- und umzusetzen." Ministerpräsident Gordon Schnieder,
  Rheinland-Pfalz: „Es ist ein wichtiges Signal, dass Bund und Länder trotz angespannter
  Haushaltslagen schnell einen gemeinsamen Weg gefunden haben. Die hohen Spritpreise
  belasten uns alle. Mit der Senkung der Energiesteuer nehmen wir nicht nur die Menschen
  in ihrem Alltag, sondern auch unsere mittelständischen Betriebe in den Blick. Gerade
  in schwierigen Zeiten können sich die Menschen darauf verlassen, dass Politik handlungsfähig
  bleibt und Probleme löst.“ Thorsten Frei, Vorsitzender der CDU/CSU-Bundestagsfraktion:
  „Die Regierung zeigt Handlungsfähigkeit. Bund und Länder senden ein wichtiges Signal,
  dass sie an einem Strang ziehen. Es kommt jetzt schnell zu einer Entlastung für
  Bürger und Unternehmen. Wir lassen die Menschen nicht allein mit der hohen Belastung.“
  Matthias Miersch, Vorsitzender der SPD-Bundestagsfraktion: „Ich bin sehr froh, dass
  wir uns auf eine schnelle, spürbare Entlastung der Menschen einigen konnten. Der
  Tankrabatt bringt sofortige finanzielle Erleichterung. Zudem führen wir frühestmöglich,
  spätestens Januar 2027, den Spritpreisdeckel ein. Er sorgt dafür, dass die Preise
  nach oben gedeckelt sind und nach unten Wettbewerb weiterhin möglich ist. So schafft
  er mehr Transparenz, Verlässlichkeit und Sicherheit für die Verbraucher. Das ist
  ein zentraler Schritt, um die Lage in einer krisenhaften außenpolitischen Situation
  zu stabilisieren. Darüber hinaus ist uns ganz wichtig, im Jahr 2027 die Voraussetzungen
  zu schaffen von der Krise besonders belastete Haushalte mit sozial gestaffelten
  Entlastungsmaßnahmen unterstützen zu können, wenn es in Zukunft notwendig wird.“'
