title: Im Kabinett beschlossen Bundeswehr im Einsatz in Südsudan
text: 'UN -Soldaten patrouillieren in der süd-sudanesischen Stadt Pibor auf einem
  Markt, um das Vertrauen wiederherzustellen und ein Gefühl der Sicherheit zu vermitteln.
  Um den Südsudan und die Region zu stabilisieren, beteiligt sich Deutschland an der
  UNMISS -Mission der Vereinten Nationen (UN) in der Republik Südsudan. Dazu hat das
  Bundeskabinett beschlossen, dass weiterhin bis zu 50 deutsche Soldatinnen und Soldaten eingesetzt
  werden können. Konkret wird der Einsatz bis zum 31. Oktober 2027 verlängert. Der
  Deutsche Bundestag muss dem Beschluss noch zustimmen. Die vom Sicherheitsrat der
  Vereinten Nationen beschlossene Mission umfasst den Schutz von Zivilpersonen sowie
  die Unterstützung bei der Umsetzung des Friedensabkommens vom 12. September 2018
  und des Friedensprozesses. Die erfolgreiche Umsetzung dieses Mandats bleibt für
  die Stabilisierung und langfristige friedliche Entwicklung Südsudans und dessen
  Zivilbevölkerung unverzichtbar. Um das Ziel zu erreichen, werden die deutschen Soldatinnen
  und Soldaten in den Stäben der Mission als Führungs-, Beratungs-, Verbindungs- und
  Beobachtungsoffiziere eingesetzt. Darüber hinaus kann deutsches Personal im Bedarfsfall
  die Aus- und Fortbildung von Angehörigen der Vereinten Nationen zeitlich befristet
  unterstützen. Südsudan ist weiterhin auf die intensive Unterstützung durch die internationale
  Gemeinschaft angewiesen. Auch wenn wichtige Fortschritte gemacht wurden, wie die
  Einrichtung einer Übergangsjustiz, bleiben sicherheitspolitische Herausforderungen
  bestehen. Es kommt immer wieder zu Verletzungen des Waffenstillstandsabkommens und
  zum Einsatz von Gewalt. Leidtragende sind die Bevölkerung und auch Mitarbeiterinnen
  und Mitarbeiter der Vereinten Nationen sowie Angehörige von Hilfsorganisationen.
  Dies verletzt immer wieder Menschenrechte vor Ort und behindert den Friedensprozess.
  Das deutsche Engagement bei UNMISS ist Teil langjähriger Bemühungen um nachhaltige
  Konfliktbewältigung und Friedensförderung, die ihre Grundlagen in den ressortübergreifenden
  Leitlinien „Krisen verhindern, Konflikte bewältigen, Frieden fördern“ haben. Die
  Mission genießt hohes Ansehen sowohl bei der Zivilbevölkerung als auch bei der Regierung.
  Mit der Unterstützung deutscher ziviler Expertinnen und Experten konnte im Jahr
  2023 eine Übergangsjustiz eingerichtet werden. Zudem einigten sich alle Parteien
  darauf, einheitliche Kommandostrukturen der Sicherheitskräfte einzurichten. Die
  nächsten Wahlen wurden für Dezember 2026 angekündigt. Die Bundesregierung unterstützt
  die südsudanesische Bevölkerung in dieser Krise durch einen integrierten Ansatz
  über die Beteiligung an UNMISS : Neben umfangreicher humanitärer Hilfe sind die
  Maßnahmen der deutschen Entwicklungszusammenarbeit auf die Sicherung der Existenzgrundlagen
  im Bereich Ernährungssicherung, Wasser- und Sanitärversorgung ausgerichtet. Außerdem
  werden Hilfen im Bereich Krisenschutz geleistet. Die deutschen Ansätze fokussieren
  sich dabei vor allem auf gefährdete Bevölkerungsgruppen wie Frauen, Kinder, Binnenvertriebene
  und Flüchtlinge. Südsudan bleibt von einer der drängendsten humanitären Krisen weltweit
  betroffen.'
