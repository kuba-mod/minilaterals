title: 'Bund und Länder starten neue Bewerbungsrunde für Auslandsstipendien – Kulturstaatsminister
  Weimer: „Künstlerischer Austausch stiftet kulturelle Verständigung“'
text: 'Ab dem 1. Oktober startet die neue Bewerbungsrunde für die renommierten Artist-in-Residence-Programme
  von Bund und Ländern. Der Bund fördert prägende Talente der zeitgenössischen Kunst
  mit Stipendienaufenthalten in der Villa Massimo in Rom, der Casa Baldi in Olevano
  Romano und dem Deutschen Studienzentrum in Venedig. Die Länder ermöglichen dies
  in den Bundesateliers der Cité Internationale des Arts in Paris. Beide Programme
  zählen zu den wichtigsten Instrumenten der künstlerischen Begabtenförderung der
  Bundesrepublik Deutschland. Insbesondere der Stipendienaufenthalt in der Deutschen
  Akademie Rom Villa Massimo (Rompreis) gilt als bedeutendste Auszeichnung für deutsche
  und in Deutschland wirkende Künstlerinnen und Künstler. Kulturstaatsminister Wolfram
  Weimer: „Die Residenzprogramme in Italien und Frankreich sind ein bedeutender Pfeiler
  der auswärtigen Kulturpolitik Deutschlands. Rom, Olevano Romano, Venedig und Paris
  sind seit jeher die sinnlichen Sehnsuchtsorte unserer kulturellen Beziehungen. Ehrwürdige
  Künstlerschmieden wie die Casa di Goethe oder die Villa Massimo prägen als hoch
  angesehene Botschafter deutscher Kultur bis heute das kulturelle Leben vor Ort.
  Hier vernetzen sich internationale Künstlerinnen und Künstler zu einem schöpferischen
  Austausch von Ideen, Arbeitsweisen und Perspektiven. Diese Begegnungen sind es,
  die seit Jahrhunderten zum gegenseitigen Verständnis unserer Kulturnationen beitragen.“
  Generalsekretärin der Kulturstiftung der Länder Christine Regus: „Künstlerische
  Entwicklung braucht Freiräume – und manchmal auch den bewussten Ortswechsel. Die
  Auslandsstipendien von Bund und Ländern eröffnen Künstlerinnen und Künstlern genau
  diese Möglichkeit. Zugleich stehen sie beispielhaft für die fruchtbare und vertrauensvolle
  Zusammenarbeit von Bund und Ländern, mit der sie gemeinsam Verantwortung für die
  Förderung von Kunst und Kultur übernehmen.“ Bewerben können sich bis einschließlich
  15. Dezember 2026 Künstlerinnen und Künstler der Sparten Architektur, Bildende Kunst,
  Literatur und Musik. Über die Vergabe der Stipendien entscheidet eine unabhängige
  Jury. Das Bewerbungsverfahren wird von der Kulturstiftung der Länder durchgeführt.
  Interessierte können ihre Bewerbung über das Online-Portal der Kulturstiftung einreichen.
  Alle weiteren Informationen zu den Bewerbungsvoraussetzungen und den Zielorten stehen
  dort ebenfalls bereit.'
