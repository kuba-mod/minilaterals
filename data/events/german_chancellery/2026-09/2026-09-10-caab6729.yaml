title: International Space Summit Gemeinsame Weichen für die europäische Raumfahrt
text: 'Beim International Space Summit in Paris traf Bundesraumfahrtministerin Dorothee
  Bär auch den deutschen Astronauten Alexander Gerst. Die europäische Raumfahrt bewege
  sich hin zu mehr Wettbewerb, mehr Resilienz und mehr Souveränität: Das betonte Bundesforschungsministerin
  Dorothee Bär beim Abschluss des International Space Summits in Paris. Auch Bundesverteidigungsminister
  Boris Pistorius nahm an dem Treffen teil. „Raumfahrt ist längst ein strategisches
  Forschungsfeld – für Innovation und Wettbewerbsfähigkeit ebenso wie für Sicherheit,
  Kommunikation sowie für die Erweiterung unseres Wissens durch Exploration“, sagte
  die Ministerin. Es gelte, gemeinsam mit den europäischen Partnern die Weichen zu
  stellen, um Innovationen zu ermöglichen, den Wettbewerb zu stärken und den gemeinsamen
  Werten verpflichtet zu bleiben. „Unser Ziel ist eine starke, wettbewerbsfähige und
  wertebasierte europäische Raumfahrt, die Deutschland als führenden Wissenschafts-,
  Technologie- und Innovationsstandort stärkt“, sagte sie. Im Rahmen des International
  Space Summit gab es zahlreiche gemeinsame Erklärungen zu zentralen Zukunftsfragen
  der Raumfahrt. EU-Staaten , EU-Kommission , ESA und die Industrie bekannten sich
  zu einer gemeinsamen Vision für einen unabhängigen Zugang zum Weltraum und ein souveränes
  Erdbeobachtungssystem. Die Stärke der europäischen Raumfahrt zeigen die jüngsten
  Erfolge: Dazu gehört der erfolgreiche Start der Spectrum -Rakete von Isar Aerospace
  am 5. September 2026, bei dem die Trägerrakete den Orbit erreichte. Auch die Entwicklung
  und der Bau des European Service Module ( ESM ) für die Mondmission Artemis II.
  ist ein Spiegel der starken Zusammenarbeit Europas: Das ESM versorgte das Orion-Raumschiff
  während der Mondumrundung unter anderem mit Energie, Wasser und Sauerstoff. Und
  diese Erfolge haben beides, Tradition und Zukunft: Nur einen Tag vor dem Summit
  erhielt die Unternehmerin Christa Fuchs für den erfolgreichen Aufbau des Raumfahrt-
  und Technologiekonzerns OHB SE den Deutschen Gründerpreis. Die Firma zählt zu den
  größten unabhängigen Raumfahrtunternehmen Europas, baute schon 1994 den ersten Satelliten
  und heute die Satelliten für mehrere der wichtigsten europäischen Raumfahrtprogramme,
  etwa für das Satelliten-Navigationssystem Galileo. Die OHB SE ist auch beteiligt
  an internationalen Raumfahrtmissionen und Programmen rund um die Internationale
  Raumstation ISS . In die Zukunft weisen erfolgreiche europäisches Start-ups wie
  etwa The Exploration Company . Das Unternehmen arbeitet an einer Raumfahrtkapsel
  und konnte jüngst nicht nur eine sehr erfolgreiche Finanzierungsrunde von 450 Millionen
  Dollar, sondern auch eine neu gestartete Kooperation mit der ESA verkünden. Die
  Luft- und Raumfahrtindustrie gehört zu den industriellen Schlüsselbranchen für Deutschland.
  Die Branche zeigt, dass Innovation und Wachstum möglich sind: 2025 wuchs die Beschäftigtenanzahl
  in der Branche um acht Prozent, der Umsatz stieg um 19 Prozent auf 62 Milliarden
  Euro. In wichtigen Technikfeldern der Luft- und Raumfahrt ist Deutschland technologisch
  führend. Das gilt zum Beispiel vor allem in der Triebwerkstechnologie, im Satellitenbau
  – vor allem Erdbeobachtung und Navigation – , unter anderem auch durch den Einsatz
  von Innovationen wie Quanten computing . Um diesen Weg fortzusetzen, setzt die Bundesregierung
  auf starke Investitionen. Deutschland hat bei der jüngsten Ministerratskonferenz
  der ESA mehr als fünf Milliarden Euro zugesagt und ist damit größter Beitragszahler
  der Organisation. 60 Staaten sowie eine große Anzahl internationaler Organisationen
  und Unternehmen haben an dem von Deutschland und Frankreich organisierten Treffen
  International Space Summit teilgenommen.'
