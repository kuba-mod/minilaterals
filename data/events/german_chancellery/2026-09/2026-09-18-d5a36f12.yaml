title: '1,3 Millionen Euro für Sanierung des St. Katharinenspitals in Regensburg –
  Staatsminister Weimer: „Ort des Glaubens und der gelebten Nächstenliebe“'
text: 'Kulturstaatsminister Wolfram Weimer hat heute an der Festveranstaltung zum
  800-jährigen Bestehen des St. Katharinenspitals in Regensburg teilgenommen und setzte
  den Spatenstich für das Projekt „OIKOS Katharinenspital Leben-Arbeit-Kultur“. Für
  die Umsetzung dieses Vorhabens stellt der Bund 1,3 Millionen Euro zur Verfügung.
  Kulturstaatsminister Weimer: „Seit 800 Jahren ist das St. Katharinenspital ein Ort
  des Glaubens und der gelebten Nächstenliebe. Er steht für Verantwortung und für
  die Überzeugung, dass wir füreinander da sind. Heute entsteht hier ein neuer Kulturort,
  der Geschichte greifbar vermitteln und Raum für Austausch und Begegnung schaffen
  soll. Ich freue ich mich daher sehr, dass mein Haus einen Beitrag dazu leistet,
  diesen besonderen Ort zu bewahren und das kulturelle Erbe der UNESCO-Welterbestadt
  Regensburg zu erhalten.“ Die Förderung des Bundes ermöglicht die Sanierung des historischen
  Baus: Im Erdgeschoss eines denkmalgeschützten Ökonomiegebäudes sollen ein Museums-,
  Veranstaltungs- und Kulturzentrum entstehen. Hier soll Historisches und Zeitgenössisches
  zum Regensburger Hospital multimedial vermittelt werden. Die Stärkung der kulturellen
  Infrastruktur zählt zu den zentralen Anliegen der Bundesregierung. Mit nachhaltigen
  Investitionen unterstützt der Bund kulturelle Einrichtungen und Kulturdenkmäler
  von nationaler Bedeutung. Weitere Informationen rund um die BKM-Förderung von Kulturbauten
  finden Sie unter Kulturbauten | Kulturstaatsminister - Der Beauftragte der Bundesregierung
  für Kultur und Medien'
