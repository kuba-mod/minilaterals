title: Bundeskanzler Merz empfängt den irakischen Ministerpräsidenten, al-Zaidi
text: Am Dienstag, den 15.09., wird der Bundeskanzler gegen 15 Uhr den Ministerpräsidenten
  des Irak, Ali al-Zaidi, mit militärischen Ehren im Bundeskanzleramt empfangen. Im
  Vordergrund des Gesprächs stehen u.a. die Fortentwicklung der bilateralen Beziehungen
  und insbesondere die wirtschaftliche Zusammenarbeit. Ebenso wird die regionalpolitische
  Lage Gegenstand des Austauschs sein.
