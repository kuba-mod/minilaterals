title: Im Kabinett beschlossen Missbrauch von Sozialleistungen verhindern – Vertrauen
  in Sozialstaat stärken
text: 'Teil des Aktionsplanes gegen Sozialleistungsmissbrauch ist auch, dass bei Verdacht
  auf Schwarzarbeit die Arbeitgeberhaftung gilt sowie Anzeigepflichten der Jobcenter
  an den Zoll. Ausbeuterische Geschäftsmodelle und organisierter Sozialleistungsmissbrauch
  belasten die Kommunen und schwächen das Vertrauen in unseren Sozialstaat. Sozialleistungsmissbrauch
  ist unfair gegenüber denjenigen, die das System mit Steuern und Beiträgen finanzieren.
  Die Bundesregierung will deshalb für klare Konsequenzen bei denjenigen sorgen, die
  Leistungen missbräuchlich in Anspruch nehmen. Gleichzeitig will sie weiterhin diejenigen
  schützen, die Hilfe benötigen. Mit dem Aktionsplan gegen Sozialleistungsmissbrauch
  und Ausbeutung, den das Kabinett jetzt beschlossen hat, setzt die Koalition wichtige
  Anliegen aus dem Koalitionsvertrag um – insbesondere für betroffene Kommunen. Der
  von Bundessozialministerin Bärbel Bas und Bundesinnenminister Alexander Dobrindt
  vorgelegte 10-Punkte-Plan enthält Maßnahmen, mit denen der Missbrauch von Sozialleistungen
  und ausbeuterischen Strukturen noch wirksamer bekämpft werden soll. „Wir schließen
  Schlupflöcher im Sozialstaat und zeigen klare Kante gegenüber Sozialbetrügern“,
  so Dobrindt. Der Blick richtet sich dabei besonders auf die Bekämpfung von Missbrauch
  durch EU -Zugewanderte. Deutschland profitiert in hohem Maße von der Freizügigkeit
  in der Europäischen Union. Dennoch gibt es Fehlentwicklungen: Kommunen berichten
  zunehmend, dass Zugewanderten kein guter Einstieg in Gesellschaft und Arbeitsmarkt
  gelingt, oder sie Opfer ausbeuterischer Strukturen sind. Die Möglichkeit, grenzüberschreitend
  in der EU unbürokratisch eine Arbeit aufzunehmen, sei sehr wichtig, so Bundessozialministerin
  Bas. „Was aber nicht geht, ist, die Freizügigkeit auszunutzen, um Menschen auszubeuten
  und ihre Not für organisierten Missbrauch auszunutzen.“ Grundlage des Aktionsplans
  sind die Ergebnisse des Koalitionsausschusses vom 1. Juli . Der Aktionsplan bündelt
  Maßnahmen unterschiedlicher Ministerien.'
