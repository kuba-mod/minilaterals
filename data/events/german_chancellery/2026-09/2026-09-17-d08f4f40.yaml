title: 'Weimer: „Stärken das Bauhaus von allen Seiten“ – Vier Millionen Euro jährlich
  für Berliner Bauhaus-Archiv und große Unterstützung für Bauhaus-Manifest'
text: 'Das Bauhaus erhält eine bedeutende Unterstützung durch den am Dienstag unterzeichneten
  Hauptstadtfinanzierungsvertrag für die Jahre 2028 bis Ende 2037. Darin ist erstmals
  eine künftig stärkere Beteiligung des Bundes am Bauhaus-Archiv – Museum für Gestaltung
  in Berlin verankert worden. Das Bauhaus-Archiv beherbergt die weltweit größte Sammlung
  von Bauhaus-Objekten und ist damit ein zentraler Ort für die Bewahrung und Vermittlung
  des Bauhaus-Erbes national und international. Nach Abschluss von Sanierung und Erweiterungsbau
  sowie der Änderung der Rechtsform des bisher als Verein tätigen Bauhaus-Archivs
  kann der Bund sich mit bis zu vier Millionen Euro jährlich an den Betriebskosten
  beteiligen. Dazu Staatsminister Weimer: „Wir stärken das Bauhaus von allen Seiten
  und schützen seine Errungenschaften gegen rechte Anfeindungen. Die steigenden Zahlen
  der Unterstützerinnen und Unterstützer des Bauhaus Manifests, als auch die künftige
  Unterstützung des Bauhaus-Archivs durch den Bund zeigen, wie bedeutend das Bauhaus
  für unsere offene und freiheitliche Gesellschaft ist. Gerade in Zeiten, in denen
  die Prinzipien des Bauhauses von antidemokratischen Kräften angegriffen werden,
  ist dies ein wichtiges und ermutigendes Signal.“ Das Bauhaus erfährt zudem eine
  breite Unterstützung: Seit der Erstveröffentlichung des Bauhaus-Manifests 2026 Ende
  August haben sich bereits mehr als 3.770 weitere Unterstützerinnen und Unterstützer
  aus Kultur, Wissenschaft, Handwerk, Design und Architektur dem Aufruf angeschlossen.
  Auch zahlreiche prominente Persönlichkeiten, Institutionen und Privatpersonen haben
  ihre Unterstützung öffentlich erklärt. Das starke Echo macht deutlich, welchen Stellenwert
  die Ideen von Freiheit, Offenheit und Kreativität, die das Bauhaus ausmachen, in
  unserer Gesellschaft haben. Das Bauhaus wurde 1919 in Weimar gegründet. Nach seiner
  Vertreibung aus Weimar wurde es 1926 – vor genau 100 Jahren – in Dessau wieder eröffnet.
  1933 – inzwischen nach Berlin umgezogen – musste es unter dem Druck der Nationalsozialisten
  endgültig schließen. Das Bauhaus und seine Stätten in Weimar, Dessau und Bernau
  sind UNESCO-Welterbe. Wer das Bauhaus-Manifest unterstützen und ein Zeichen für
  Freiheit, Offenheit und Kreativität setzen möchte, kann sich hier informieren und
  unterzeichnen: Bauhaus-Manifest 2026 | Akademie der Künste Das Manifest ist auch
  auf Englisch abrufbar.'
