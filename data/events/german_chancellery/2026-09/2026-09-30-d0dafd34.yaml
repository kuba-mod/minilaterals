title: 'Im Kabinett beschlossen EUNAVFOR ASPIDES-Mandat: Seeschifffahrt im Roten Meer
  schützen'
text: 'Die Bundeswehr beteiligt sich an der EU -Mission, um die internationale Schifffahrt
  vor Angriffen zu schützen. Seit Mitte November 2023 greift die Huthi-Miliz aus Jemen
  die internationale Schifffahrt an – insbesondere im südlichen Roten Meer und in
  der Meeresstraße Bab al-Mandab, die das Rote Meer mit dem Indischen Ozean verbindet.
  Die Angriffe gefährden die Sicherheit des Seeverkehrs und die Stabilität in der
  Region. Das Bundeskabinett hat deshalb beschlossen, die Beteiligung der Bundeswehr
  an der EU -geführten Operation EUNAVFOR ASPIDES bis zum 31. Oktober 2027 fortsetzen.
  Der Deutsche Bundestag muss dem Beschluss noch zustimmen. Die Mandatsobergrenze
  bleibt bei 350 Soldatinnen und Soldaten. Die Bundeswehr kann damit weiterhin Personal
  und Luftunterstützung für den Aufbau von Lagebildern bereitstellen. Auch die Bereitstellung
  einer Fregatte ist weiterhin möglich. Dabei sollen unter anderem Informationen über
  die sogenannte Schattenflotte und verdächtige Aktivitäten an der kritischen Unterseeinfrastruktur
  erhoben und mit den internationalen Partnern ausgetauscht werden. Das maritime Lagebild,
  das die Bundeswehr im engen Austausch mit internationalen Partnern – insbesondere
  die Europäische Union und den USA – erstellt, gibt einen Überblick darüber, welche
  feindlichen Kräfte sich im Einsatzgebiet aufhalten und welche Gefahren von ihnen
  zu erwarten sind. Auf dieser Grundlage wird entschieden, welche Abwehrmaßnahmen
  möglich und notwendig sind. Auch die USA schützen die zivilen Handelsschiffe im
  Einsatzgebiet mit der Operation PROSPERITY GUARDIAN . Dabei stimmen sie sich eng
  mit der EU -Operation ab. Das Einsatzgebiet der EU -Operation umfasst die zentrale
  Verbindungsroute zwischen Asien und Europa. Dazu gehören neben der Meerenge von
  Bab al-Mandab und  dem Roten Meer, die Straße von Hormus, der Golf von Aden, das
  Arabische Meer, der Golf von Oman und der Persische Golf. Über diese Route wird
  ein Großteil aller Energielieferungen nach Europa transportiert. Die Handelsroute
  durch das Rote Meer ist die kürzeste von Asien nach Europa. Vor Beginn der Angriffe
  umfasste das globale Handelsvolumen hier 15 Prozent des weltweiten maritimen Handels.
  Rechtliche Grundlage : Das Völkerrecht erlaubt es, sich gegen rechtswidrige Angriffe
  auf eigene oder fremde Schiffe und Besatzungen zu wehren. Das Mandat EUNAVFOR ASPIDES
  ist defensiv ausgerichtet. Die Abwehr von Angriffen steht auch im Einklang mit dem
  Seerechtsübereinkommen der Vereinten Nationen (UN) von 1982 und der Resolution 2722
  des Sicherheitsrats der Vereinten Nationen vom 10. Januar 2024.'
