title: 'Denkmal für die polnischen Opfer des Zweiten Weltkriegs: Errichtung ab 2027
  – Staatsminister Weimer zum Jahrestag des deutschen Überfalls auf Polen'
text: 'Am 1. September 1939 überfiel das nationalsozialistische Deutschland Polen
  und begann damit den Zweiten Weltkrieg. Um an die Millionen Opfer der deutschen
  Aggression und Besatzung zu erinnern, soll im Zentrum Berlins ein dauerhafter Ort
  des Gedenkens entstehen: das vom Deutschen Bundestag beschlossene Denkmal für die
  polnischen Opfer des Zweiten Weltkriegs und der deutschen Besatzung in Polen 1939–1945.
  Derzeit läuft ein Gestaltungswettbewerb; im Dezember 2026 wird ein Preisgericht
  über einen Siegerentwurf beraten. Anlässlich des Jahrestages des deutschen Überfalls
  auf Polen sagte Wolfram Weimer, Staatsminister für Kultur und Medien: „Der Krieg
  und die deutsche Besatzung brachten unermessliches Leid über Polen und seine Bevölkerung.
  Wir gedenken heute der Millionen Menschen, die ermordet, vertrieben und ihrer Heimat
  beraubt wurden. An die polnischen Opfer der deutschen Aggression zu erinnern, sind
  wir ihnen und ihren Nachkommen schuldig. Denn nur durch eine lebendige Erinnerung
  und die konsequente Aufarbeitung der deutschen Verbrechen können wir aus unserer
  Geschichte lernen und Verantwortung für die Zukunft übernehmen. Deshalb bin ich
  sehr froh, dass die Errichtung des Denkmals für die polnischen Opfer des Zweiten
  Weltkriegs und die Opfer der deutschen Besatzung in Polen 1939 – 1945 ab 2027 startet.“
  Das Denkmal soll auf dem Gelände der früheren Kroll-Oper, unweit des Bundeskanzleramts
  und des Deutschen Bundestages, entstehen. Bereits im Juni 2025 wurde dort in Anwesenheit
  von Staatsminister Wolfram Weimer der vom Deutschen Polen-Institut initiierte temporäre
  Gedenkort für die Opfer der deutschen Besatzung Polens der Öffentlichkeit übergeben.'
