title: 'Strategiekreis für Technologie und Innovation des Bundeskanzlers: Industrielle
  KI bietet eine große Chance für Deutschland'
text: 'Der Beraterkreis hat bereits in den vergangenen Monaten Optionen für Künstliche
  Intelligenz und für die Innovationsfähigkeit im Verteidigungsbereich erarbeitet.
  Nun stand ein ressortübergreifender Ansatz für eine resiliente und wettbewerbsfähige
  KI-Positionierung Deutschlands im Mittelpunkt der Debatte. Um die nationalen KI-Ökosysteme
  zu stärken, kommt es vor allem auf die Verzahnung der Hightech Agenda Deutschland
  mit wichtigen europäischen Vorhaben für bahnbrechende Innovationen (Important Projects
  of Common European Interest – IPCEIs) an, u.a. durch die KI-Taskforce der Bundesregierung.
  Die Expertinnen und Experten waren sich einig, dass vor allem die industrielle KI
  eine besondere Chance darstellt, Deutschland als KI-Nation zu etablieren. Politik,
  Wirtschaft und Wissenschaft müssen daher gemeinsam der hohen Entwicklungsgeschwindigkeit
  dieser Zukunftstechnologie und ihrer geopolitischen Dimension gerecht werden. Der
  Strategiekreis nahm ebenfalls das Potenzial der KI für die nächste Generation der
  Robotik in den Blick. In seiner Diskussion zu den Innovationspotenzialen im Verteidigungsbereich
  fokussierte sich der Strategiekreis darauf, die strukturelle Transformation zu unterstützen
  und zu beschleunigen. Der Strategiekreis bekräftigte den eingeschlagenen Kurs, Beschaffungsentscheidungen
  am operativen Bedarf der Truppe auszurichten. Dieses zentrale Prinzip für eine schnelle
  und wirksame Ausstattung der Bundeswehr hat sich bewährt. Beschaffer und Anbieter
  innovativer Lösungen sollen die Potenziale der Digitalisierung in der Sicherheits-
  und Verteidigungsindustrie voll ausschöpfen können. Anknüpfend an den Austausch
  in der zweiten Sitzung unterstrich der Strategiekreis zudem die Bedeutung geistigen
  Eigentums und dessen Verwertung für den Standort Deutschland. Der Strategiekreis
  für Technologie und Innovation des Bundeskanzlers wird inhaltlich von einer Geschäftsstelle
  vorbereitet, die bei acatech – Deutsche Akademie der Technikwissenschaften angesiedelt
  ist. Expertinnen und Experten aus Wirtschaft und Wissenschaft im Strategiekreis
