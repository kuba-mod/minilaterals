title: Im Kabinett beschlossen Digitale Belege statt Papierbons
text: 'Die Abschaffung der Papierbons soll die Wirtschaft entlasten und die Umwelt
  schützen. Papierbons sollen ab dem Jahr 2028 der Vergangenheit angehören. Das Bundeskabinett
  hat einen Gesetzentwurf beschlossen, der die Pflicht zur Ausgabe von Papierbelegen
  abschafft. Stattdessen sollen Kundinnen und Kunden beim Einkauf ihre Quittung digital
  abrufen können – zum Beispiel per QR - Code auf dem Kassen display , per Download
  -Link oder direkt im Kundenkonto. Ziel des Gesetzentwurfs ist es, den Verkaufsalltag
  für Händlerinnen und Händler sowie für ihre Kundschaft einfacher zu gestalten. Die
  Bundesregierung will Technik mit Bürokratierückbau im Handel verbinden. Moderne
  Technologien in digitalen Kassensystemen sollen ebenso zum Standard werden wie der
  digital erstellte Kassenbon. Durch den Wegfall der Papierbons werden Unternehmen
  spürbar von Bürokratie- und Sachaufwand entlastet. Für die Wirtschaft reduziert
  sich der jährliche Erfüllungsaufwand voraussichtlich um etwa 106 Millionen Euro.
  Der Verzicht auf unzählige gedruckter Belege dient auch dem Schutz der Umwelt. Dabei
  gilt: Wer weiterhin eine Papierquittung erhalten möchte, hat Anspruch darauf. Das
  soll aber nur noch ausdrücklich auf Wunsch der Kundinnen und Kunden passieren. So
  soll sichergestellt werden, dass digitale Belege künftig vorrangig sind und Papierbelege
  nur die Ausnahme bleiben. Mit dem Gesetzentwurf will die Bundesregierung außerdem
  das Risiko von Steuerhinterziehung verringern. Dafür soll ab dem Jahr 2028 eine
  Kassenpflicht für Geschäfte ab einem jährlichen Gesamtumsatz von 100.000 Euro gelten.
  In Deutschland gibt es noch etwa 115.000 offene Ladenkassen, deren Umsätze teilweise
  nicht oder nur handschriftlich erfasst werden. Das kann Steuerhinterziehung begünstigen.
  Kommen moderne elektronische Kassensysteme zum Einsatz, werden Missbrauchsmöglichkeiten
  eingeschränkt. Steuerbetrug aufzudecken und konsequent zu verfolgen, wendet Schaden
  von der großen Mehrheit des Einzelhandels sowie anderer Unternehmen ab, die korrekt
  ihre Steuern zahlen. Die Bundesregierung will deshalb weitere Sanktionsmöglichkeiten
  einführen und die Ermittlungsbefugnisse der Finanzbehörden stärken, um zum Beispiel
  die Fälschung technischer Aufzeichnungen besser ahnden zu können. Ausgenommen von
  der Kassenpflicht sind Steuerpflichtige, die im Jahr Barumsätze im Wert von unter
  12.000 Euro haben. Weitere Ausnahmen sind vorgesehen, etwa um die Besonderheiten
  bei landwirtschaftlichen Betrieben und anderen Branchen zu berücksichtigen.'
