date: '2026-09-14'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 14. September 2026
text: '(Vorsitzende Küfner eröffnet die Pressekonferenz und begrüßt SRS Meyer sowie
  die Sprecherinnen und Sprecher der Ministerien.) Außenminister Wadephul reist morgen
  nach München und Genf . In München besucht Außenminister Wadephul die Zentrale des
  Goethe-Instituts. Dort trifft er mit der Leitung des Instituts, unter anderem mit
  der Präsidentin Gesche Joost, zusammen. Anschließend ist ein Austausch mit Mitarbeiterinnen
  und Mitarbeitern vor Ort, auf der ganzen Welt, per Videostream geplant. Das Goethe-Institut
  leistet in fast 100 Ländern wichtige Arbeit bei der Förderung der Kenntnis der deutschen
  Sprache, der Pflege der internationalen kulturellen Zusammenarbeit sowie der Vermittlung
  eines umfassenden Deutschlandbildes, das zum Ansehen unseres Landes in der Welt
  beiträgt. Im globalen Wettbewerb um die besten Köpfe und Narrative kommt dieser
  Arbeit eine immer wichtigere Rolle bei der Wahrung unserer Interessen zu. Auf Einladung
  des bayerischen Ministerpräsidenten nimmt der Außenminister in München außerdem
  an der Sitzung des bayerischen Kabinetts teil. Das Auswärtige Amt vertritt auch
  die Interessen der Bundesländer im Ausland. Bayern ist ein stark international ausgerichteter
  Wirtschafts- und Wissenschaftsstandort. Die bayerische Industrie leistet einen essenziellen
  Beitrag zur Landes- und Bündnisverteidigung. Im Anschluss an die Kabinettssitzung
  ist eine Pressekonferenz vorgesehen. Anschließend reist Außenminister Wadephul nach
  Genf weiter, zum Sitz des Menschenrechtsrats der Vereinten Nationen und verschiedener
  humanitärer Organisationen. Er wird dort mit dem UN-Hochkommissar für Menschenrechte
  Volker Türk zusammentreffen und Gespräche mit der Präsidentin des Internationalen
  Komitees vom Roten Kreuz und dem Generaldirektor der Weltgesundheitsorganisation
  führen. Deutschland kandidiert für den UN-Menschenrechtsrat und will gerade zu Zeiten,
  zu denen Menschenrechte unter Druck stehen, mehr Verantwortung übernehmen. Deutschland
  ist zudem einer der stärksten und verlässlichsten Unterstützer des internationalen
  humanitären Systems. Deutschland will die UN weiter darin stärken, auf Krisen und
  Notlagen effektiver zu reagieren. Frau Deschauer, das Goethe-Institut steht ja international
  in schwierigen Situationen. Inwiefern ist die Situation in Russland, die geschlossenen
  Institute und die personellen und programmatischen Konsequenzen, Thema? Wird es
  auch auf die Arbeit anderer Goethe-Institute in anderen Nationen Auswirkungen haben,
  oder sehen Sie ähnliche Auswirkungen? Ich kann dem Termin am morgigen Tage nicht
  vorgreifen. Ich kann mir gut vorstellen, dass natürlich auch die aktuelle Lage mit
  Blick auf die Schließung der Goethe-Institute in Russland Gegenstand des dortigen
  Austausches sein könnte. Es ist natürlich ein naheliegendes Thema, weil es einen
  aktuellen Vorgang betrifft. Sie wissen, dass die deutschen Goethe-Institute auch
  dort noch eine wichtige Brücke hin zum deutschen Kulturraum geschlagen haben, in
  einem sehr eingeschränkten, sehr repressiven und sehr schwierigen Umfeld mit, würde
  ich sagen, zunehmender Kriminalisierung von freier Arbeit von Medien‑ und Kulturschaffenden
  in Russland. Diese musste jetzt leider abgebrochen werden, weil Russland denjenigen
  Kolleginnen und Kollegen der Goethe-Institute vor Ort, die dort wichtige Arbeit
  getan haben, die Arbeit nicht mehr weiterhin ermöglicht. Das bedauern wir sehr.
  Dazu hat sich der Außenminister geäußert. Ich nehme an, dass es in dieser akuten
  Situation auch ein Thema sein könnte. Ich möchte nicht weiter spekulieren, ob es
  Auswirkungen auf weitere Goethe-Institute weltweit haben kann. Die Arbeit der Goethe-Institute
  wird auch dadurch erschwert, dass sie zehn Prozent ihres Etats ‑ ich glaube, es
  handelt sich um 24 Millionen Euro ‑ einsparen mussten. Ist das angesichts der erschwerten
  Arbeitsbedingungen aus Sicht der Bundesregierung immer noch der richtige Schritt
  gewesen, oder planen Sie für die Zukunft eine Ausweitung des Etats auf den vorherigen
  Stand? Die Etatrestriktionen für die gesamte Bundesregierung und damit auch für
  das Auswärtige Amt ergeben sich aus einer gesamtwirtschaftlichen Lage unseres Landes.
  Diese hat sich das Auswärtige Amt so für seinen eigenen Etat nicht ausgesucht. Das
  wissen Sie. Wir haben uns auch schon öfter darüber ausgetauscht, dass natürlich
  auch im Bereich der humanitären Hilfe ‑ das ist ein weiter, vor allem deutlich größerer
  Bereich ‑ in Zeiten zunehmender Krisen und Konflikte intensive Mittel notwendig
  sind. Im Rahmen dessen, was als Vorgabe gegeben ist, müssen wir natürlich selbst
  eine Repriorisierung und auch eine entsprechende Fokussierung vornehmen. Insofern
  kann ich mir vorstellen, dass es dazu sicherlich auch Fragen geben wird. Aber noch
  einmal: Auch die Goethe-Institute müssen ihre Arbeit unter den vorhandenen Umständen
  präzise und effektiv und sicherlich auch im Rahmen eines Reformmodus angehen. Das
  kann sicherlich auch Gegenstand des Austausches sein. Frau Deschauer, ich habe eine
  kurze Verständnisfrage. Ich war ein bisschen überrascht, dass Sie es eben so dargestellt
  haben, als seien die Goethe-Institute in Russland proaktiv und einseitig von russischer
  Seite geschlossen worden. Dem Ganzen ging ja die Schließung des Russischen Hauses,
  also des Äquivalents zum Goethe-Institut, hier in Berlin voraus. Können Sie kurz
  darlegen, wieso Sie es so dargelegt haben, wie Sie es dargelegt haben? Ich habe
  es so dargelegt, weil es den Tatsachen entspricht, dass die Kolleginnen und Kollegen
  des Goethe-Instituts dort wichtige kulturbildende Maßnahmen in einem sehr repressiven
  Raum vorgenommen haben. Darüber, dass es eine ungerechtfertigte Reaktion auf die
  deutschen Schritte war, die notwendig und maßvoll waren, haben wir uns, glaube ich,
  in den vergangenen Tagen sehr intensiv ausgetauscht. Wenn Sie mir einen Moment geben,
  dann suche ich auch noch einmal das Zitat des Bundesaußenministers anlässlich der
  russisch verhängten Schließung der Goethe-Institute heraus. Das kann ich Ihnen gleich
  noch einmal vorlesen. Andernfalls haben Sie es sicherlich auch wahrgenommen. Ich
  habe noch eine kurze Verständnisfrage. Das heißt, in Ihrer jetzigen Darlegung waren
  Sie überrascht von diesem reziproken Akt der russischen Seite, also dass die Schließung
  des Russischen Hauses hier zur Folge hatte, dass die Goethe-Institute auch geschlossen
  worden sind. Das war vom Auswärtigen Amt vorher so nicht antizipiert worden. Ich
  weiß nicht, wie Sie auf die Schlussfolgerung kommen. Aber das können Sie gerne machen.
  Ich habe eine Frage an das BMWE zur Schließung der Ost-West-Pipeline in Saudi-Arabien
  und der Huthioffensive im Jemen: Welche Folgen hat diese jüngste Eskalation im Nahen
  Osten auf die Versorgungslage in Deutschland? Deutschland bezieht aus der Region
  ‑ das gilt für die Meerenge genauso wie für die Straße von Hormus ‑ kein Gas, kein
  LNG und kein Öl. Es gibt direkt also keine Folgen, was die Versorgungssicherheit
  angeht, was direkte Lieferungen angeht. Aber natürlich betreffen die erhöhten Preise
  auch uns hier, in Deutschland. Es hat aber keine Auswirkungen auf die Sicherheit
  der Versorgung mit Rohöl und Rohölprodukten. Engpässe sind hierbei derzeit nicht
  zu erwarten. Die fehlenden Mengen sind für andere Länder, in die jetzt nicht geliefert
  worden ist, durch strategische Freigaben von Ölreserven kompensiert worden. Gleichzeitig
  laufen die Raffinerien in den USA, aber auch in Europa und auch in Deutschland auf
  Hochtouren, was Rohölprodukte angeht. Insofern gibt es derzeit keine Sorge, was
  die Versorgungssicherheit angeht. Aber natürlich betreffen uns die Preise. Dann
  habe ich noch eine Frage an Herrn Müller: Was sind denn die Auswirkungen der Huthierfolge
  in der Meerenge Bab al-Mandab auf die Bundeswehraktivitäten im Roten Meer? Ich frage
  mich gerade, welche Bundeswehraktivitäten Sie meinen. Können Sie das spezifizieren?
  Mit Blick auf die Straße von Hormus wurden ja das Minenjagdboot „Fulda“ und das
  Versorgungsschiff „Mosel“ in die Region geschickt und dann im östlichen Mittelmeerraum
  in Bereitschaft gehalten. Unsere beiden seegehenden Einheiten sind weiterhin für
  eine mögliche Entwicklung, die sich für die Straße von Hormus herauskristallisieren
  könnte, im Mittelmeer in Bereitschaft. Direkte Auswirkungen auf vor allen Dingen
  das Rote Meer sehe ich für die beiden Einheiten, die im Mittelmeer gerade weiterhin
  an der Ausbildung beteiligt sind oder sich im Hafenaufenthalt weiterhin ausrüsten
  und kleinere Instandsetzungsarbeiten machen, aktuell nicht. Die Diesel- und Benzinpreise
  haben am Wochenende teilweise wieder neue Rekordwerte erreicht. Herr Meyer, ist
  die Diskussion, ob die Bundesregierung etwas dagegen unternehmen sollte und Verbraucherinnen
  und Verbraucher entlasten möchte oder dafür eine Notwendigkeit sieht, Thema in der
  Bundesregierung? Wie blicken Sie auf die zuletzt doch stark gestiegenen Spritpreise?
  Wir beobachten die Entwicklung mit großer und auch zunehmender Sorge. Wir sehen
  absolut, wie die hohen und auch in den vergangenen Tagen und Wochen noch einmal
  gestiegenen Preise nicht nur Unternehmen, sondern insbesondere auch Bürgerinnen
  und Bürger wirklich sehr belasten, gerade Pendler, die nach wie vor auf das Auto
  angewiesen sind. Wir sehen das, und wir teilen diese Sorge. Wir sehen aber auch,
  dass der Preis hierbei natürlich auf globale Marktentwicklungen reagiert. Es ist
  mir auch noch einmal wichtig, das zu sagen. Es ist also keine Entscheidung der Bundesregierung
  oder Ähnliches, die dafür sorgt, dass die Preise so stark anziehen, sondern sie
  hängen wirklich maßgeblich an der Zuspitzung der Situation im Nahen Osten, an Angriffen
  auf Ölpipelines, an der Blockade von Seewegen. Das heißt, der Weg, diese Preise
  wieder herunterzubekommen, ist am Ende ein Ende der Kampfhandlungen und eine Gewährleistung
  der freien Seeschifffahrt insbesondere. Wir als Bundesregierung tun einiges, um
  insbesondere die Versorgungssicherheit zu gewährleisten. Das ist uns natürlich extrem
  wichtig. Gleichzeitig wird auf europäischer Ebene ja auch eine Übergewinnsteuer
  geprüft. Das wäre dann eine Möglichkeit, wenn man dazu käme, auf europäischer Ebene
  möglicherweise in Zukunft auch Entlastungen zu finanzieren. Aber noch einmal: Dafür
  bräuchte es auf europäischer Ebene eine Einigung und einen Vorschlag. Ich würde
  dazu gern noch nachfragen und vielleicht auch das Wirtschafts- und das Finanzministerium
  hinzuholen. Es gibt ja jetzt wieder die Diskussion um einen Spritpreisdeckel oder
  auch das Stichwort der Übergewinnsteuer, also wie man einfach konkret reagieren
  könnte oder möchte. Dazu würde mich interessieren, wie die beiden Ministerien vielleicht
  auch zusammen an Konzepten arbeiten. Wir, die beiden Ministerien, arbeiten stets
  vertrauensvoll zusammen. Zum Deckel würde ich mich äußern. Zur Übergewinnsteuer
  würde ich wegen der Zuständigkeit dann übergeben. Einen Preisdeckel zu beschließen,
  ist nicht sehr leicht und bedarf sehr vieler Voraussetzungen. Es muss nicht unbedingt
  positiv sein: Wenn er zu hoch angesetzt wird, wäre er wirkungslos. Die Marktakteure
  würden möglicherweise dazu verleitet, die Höchstpreise tatsächlich aufzurufen. Wäre
  er zu niedrig angesetzt, könnten Standorte mit hohen Kosten bzw. mit niedrigen Umsätzen,
  zum Beispiel im ländlichen Raum, die Kraftstoffe nicht mehr kostendeckend anbieten.
  Wir haben ein sehr großes Tankstellennetz, größer als vielleicht in anderen Ländern,
  in dem es etwas mehr Wirkung entfalten könnte. ‑ All diese Dinge müssen bedacht
  werden. Es würde auch einen großen bürokratischen Aufwand nach sich ziehen. Nichtsdestoweniger
  sind wir für Gespräche in alle Richtungen bereit. Aber es ist nicht einfach umsetzbar.
  Die Frage zur Übergewinnsteuer war ja noch offen. Ich würde aber gern erst einmal
  an das anknüpfen, was Herr Meyer gesagt hat und auch für den Bundesfinanzminister,
  Herrn Klingbeil, sagen, dass wir sehen, wie stark die enorm gestiegenen Spritpreise
  Menschen in unserem Land, Pendlerinnen und Pendler, Familien, Handwerksbetriebe
  und andere Unternehmen treffen. Deswegen ist es ein drängendes Thema für uns. Der
  Bundesfinanzminister wird bei der informellen Sitzung des ECOFIN-Rates, des Rates
  der Finanzministerinnen und Finanzminister der EU, die am Freitag in Dublin stattfinden
  wird, stark darauf drängen, dass eine europäische Übergewinnsteuer kommen wird.
  Sie wissen, dass sich der Finanzminister seit Monaten intensiv dafür einsetzt und
  dass es auch Konsens in der Koalition ist, hierfür eine europäische Lösung zu finden.
  Die Kommission ist auch aufgefordert, dazu, Vorschläge zu machen. Große Mitgliedstaaten
  wie Spanien und Polen stehen an unserer Seite. Eine solche Übergewinnsteuer wäre
  ein Instrument, um die übermäßigen Krisenprofite, die Mineralölkonzerne aufgrund
  von Abzocke der Verbraucherinnen und Verbraucher und überzogener Preissteigerungen
  ziehen, für gezielte Entlastungen für die Menschen zu nutzen, die von diesen hohen
  Spritpreisen besonders betroffen sind. Als Finanzminister muss Herr Klingbeil immer
  darauf achten, dass es eine Gegenfinanzierung gibt. Das heißt, wenn wir über Instrumente
  sprechen, müssen wir darüber sprechen, wie wir sie finanzieren. Die Übergewinnsteuer
  wäre ein Weg, genau diese Krisenprofite zu nutzen, um sie durch Entlastungen an
  die Menschen zurückzugeben. Deswegen drängt der Finanzminister darauf so sehr. Wir
  haben jetzt auch erreicht, dass das thematisiert werden wird, auch von der irischen
  Präsidentschaft beim ECOFIN Ende der Woche. Das ist ein wichtiger Zwischenschritt.
  Aber, wie gesagt: Die Kommission wird da auch in die Rechtsetzung gehen müssen,
  Vorschläge machen müssen, damit wir eine solche Übergewinnsteuer bekommen. Ich will
  vielleicht bei der Gelegenheit auch einmal sagen, weil das in dem Zusammenhang immer
  kursiert: Es gibt bisher keinerlei Erkenntnisse dazu, dass der Staat zusätzlich
  aus hohen Spritpreisen höhere Steuereinnahmen gewinnt. Das haben wir in den letzten
  Monaten sehr, sehr intensiv beobachtet. Die Energiesteuer, die auf Kraftstoffe gezahlt
  wird, ist eine Mengensteuer. Das heißt, die steigt nicht mit den Preisen. Wir sehen
  hier eher einen Konsumrückgang, dass also aufgrund der hohen Spritpreise weniger
  getankt wird. Das ist eine Entwicklung, die wir insbesondere für die letzten Monate
  nachvollziehen können. Deshalb können wir sagen: Wir gehen nicht davon aus, dass
  der Staat hier ein Krisenprofiteur ist, dass der Staat hier höhere Steuereinnahmen
  hat. Gleiches gilt nach den bisherigen Erkenntnissen und Einschätzungen auch für
  die Umsatzsteuer. Denn jeder Euro kann nur einmal ausgegeben werden. Die Menschen
  sind schon von den hohen Preisen so unter Druck, dass sie dann an anderer Stelle
  sparen, wenn sie höhere Spritpreise bezahlen müssen. Insofern: Alle aktuellen Erkenntnisse
  sagen, dass der Staat keine höheren Steuereinnahmen durch die gestiegenen Spritpreise
  hat. Der Finanzminister hat auch immer deutlich gemacht: Sollte es sich in den nächsten
  Monaten in der Steuerentwicklung zeigen, dass es doch höhere Steuereinnahmen geben
  sollte ‑ wie gesagt, entgegen der aktuellen Erkenntnisse ‑, dann würden diese selbstverständlich
  für Entlastungen genutzt. Aber nochmals: Im Moment sehen wir das nicht. Herr Meyer,
  Sie haben den aktuellen massiven Anstieg der Kraftstoffpreise unter anderem auf
  Zuspitzungen der Situation im Nahen Osten zurückgeführt. So waren Ihre Worte. Dahinter
  stehen ja konkrete Länder und Akteure. Da würde mich nur interessieren: Wen würde
  denn die Bundesregierung als Hauptverantwortliche benennen für diese von Ihnen genannte
  Zuspitzung und deren Folgen auch für die Bundesbevölkerung? Das ist jetzt nicht
  mein Job, irgendwelche Verantwortlichkeiten zu verteilen, sondern ich habe beschrieben,
  wie sich der Markt entwickelt und welche Länder daran beteiligt sind. Das ist, glaube
  ich, bekannt. Gut. ‑ Dann noch eine Frage ans Wirtschaftsministerium: Herr Meyer
  hat von Marktentwicklung gesprochen. Diese genannten massiven Anstiege bei Kraftstoffpreisen
  reflektieren sich ja sehr unterschiedlich. Sowohl die westlichen als auch die östlichen
  Nachbarstaaten dieses Landes sind davon weniger betroffen. Was ist denn der Erklärungsansatz
  des Wirtschaftsministeriums dazu, dass diese Preissteigerungen vor allem in Deutschland
  so deutlich ausfallen? Die unterschiedlichen Länder haben ja unterschiedliche Steuersysteme.
  Sie haben aber unterschiedliche Maßnahmen ergriffen, sodass die Preise auf einer
  anderen Ebene sind. Wir haben ja hier ausführlich dargelegt, was unsere Möglichkeiten
  und die Vorhaben der Bundesregierung sind, und dass wir uns hierzu in Gesprächen
  befinden. Ich habe noch eine Nachfrage an Herrn Kall. Es gibt ja diesen Direktauszahlungsmechanismus,
  der in den letzten Jahren aufgebaut wurde. Da würde mich mal interessieren ‑ wenn
  das Geld da wäre, um direkt an die Bürgerinnen und Bürger etwas auszuzahlen zur
  Entlastung bei den hohen Spritpreisen ‑: Wie ist der Stand? Geht das mittlerweile
  an alle? Könnte man das auch nach Einkommen gestaffelt machen? Den Direktauszahlungsmechanismus
  gibt es; der ist technisch soweit aufgebaut. Aber es gibt erst von ungefähr 19 Prozent
  der Steuerpflichtigen die IBANs. Das heißt, da müsste noch einiges passieren, um
  wirklich an alle Bürgerinnen und Bürger, an alle Steuerpflichtigen, eine solche
  Leistung auszahlen zu können. Dafür wäre dann ein Leistungsgesetz, das das entsprechend
  vorsieht, notwendig. Aber den Mechanismus gibt es. Nochmals: Die entscheidende Frage,
  die man aber vorher stellen muss, ist, wie man das finanzieren kann. Da ist eben
  die Übergewinnsteuer ein Instrument, das wir verfolgen. Danach kann man entscheiden:
  Wir haben das und das Volumen; damit können wir entlasten. Welches Instrument nutzen
  wir dafür? ‑ Die Frage stellt sich danach. Gedenken Sie denn besondere Maßnahmen
  einzuführen, damit es mehr als die 19 Prozent der IBANs werden? Soll noch eine Kampagne
  gefahren werden, um die Leute darauf aufmerksam zu machen, dass sie das melden sollten?
  Wenn die Bundesregierung entscheidet, diesen Direktauszahlungsmechanismus zu nutzen,
  dann ganz sicher. Natürlich werden wir dann sehr umfassend informieren, etwa über
  eine App und verschiedene Webseiten dazu. Wir gehen davon aus, dass dann auch mehr
  Menschen ihre IBAN angeben werden. Aber das würden wir dann auch mit der konkreten
  Leistung verknüpfen wollen. Herr Kall, Sie haben eben den Mineralölkonzern in einem
  sehr deutlichen Wording Abzocke bei den Verbrauchern durch überhöhte Preise vorgeworfen.
  Verbraucher empfinden aber auch das, was sie hier in Deutschland an den Tankstellen
  zu zahlen haben, teilweise als Abzocke des Staates. Im Nachbarland Polen ist der
  Spritpreis um 50 Cent niedriger als bei uns. Wir sind in der EU auf Platz vier der
  Preisskala. Sieht die Bundesregierung, sieht der Bundesfinanzminister irgendwelche
  Möglichkeiten, die beschriebene Systematik der Kostenentstehung für die Verbraucher
  bei den Spritpreisen auch noch auf andere Weise als eine mögliche Übergewinnsteuer
  zu beschneiden oder zu bremsen? Also das ist das Instrument, über das wir aktuell
  sprechen. Deswegen habe ich es dargestellt. Das wäre eben ein Instrument, das es
  ermöglichen würde, Verbraucherinnen und Verbrauchern auch die Krisenprofite, die
  Mineralölkonzerne erzielen, zurückzugeben. Ja, aber warum nicht andere Instrumente,
  die, wie gesagt, in 23 von 27 EU-Staaten ‑ offenbar anders als in Deutschland ‑
  auch angewendet werden? Warum nicht die auch? Das wäre dann wieder eine Frage nach
  Preisdeckel und Ähnlichem, zu dem das Wirtschaftsministerium ja schon Stellung genommen
  hat. Frau Ungrad, der Tatbestand der Abzocke würde ja bedeuten, dass die Marktaufsicht
  versagt. Sehen Sie denn Anzeichen für Preisabsprachen zwischen den Unternehmen,
  die die Raffinerien betreiben? Inwiefern ist das Bundeskartellamt da bereits tätig?
  Die Frage müssten Sie in der Tat ans Bundeskartellamt richten. Der aktuelle Stand
  liegt mir jetzt hier nicht vor. Wir haben zu Beginn des Krieges gesetzmäßig sehr
  zügig die Möglichkeiten für das Bundeskartellamt geschaffen. Jetzt überprüft das
  Bundeskartellamt. Inwieweit es da schon Maßnahmen gibt, müssten Sie fragen. Ich
  kann sagen, dass das Kartellamt derzeit unter anderem vorsätzliche oder fahrlässige
  Verstöße gegen die 12-Uhr-Regel, die wir ja auch eingeführt haben, überprüft. Es
  hat dazu bereits veröffentlicht, dass es einzelne Verstöße gibt. Für die Sanktionierung
  sind die Länder zuständig; für die genaueren Hinweise müssten Sie sich an die Länderbehörden
  wenden. Aber zum aktuellen Stand müssten Sie sich bitte ans Kartellamt wenden; die
  sind separat von uns. Okay. ‑ Dann hätte ich trotzdem noch eine Nachfrage. Gegen
  einen Preisdeckel wurde ja immer ins Feld geführt, dass man die Werkzeuge des Bundeskartellamts
  nachgeschärft hat und dies verhindern soll, dass es zu überhöhten Preisen kommt.
  Sehen Sie denn da auch noch einmal Nachsteuerungsbedarf seitens der Politik? Reicht
  es also allein, dem Bundeskartellamt die Verantwortung zuzuschieben? Wir verschieben
  dem Bundeskartellamt keine Verantwortung zu. Das Bundeskartellamt ist dafür zuständig.
  Das ist die Behörde, die die Instrumente hat, um das zu machen. Sie ist dafür zuständig,
  und das nutzt sie auch. Wir haben sehr umfangreich die Maßnahmen des Bundeskartellamtes
  erweitert. Insofern sehen wir hier derzeit keine Notwendigkeit der Nachschärfung.
  Herr Meyer, ich hätte noch eine Nachfrage zu dem, was Sie gerade gesagt haben. Sie
  haben das ja ausgeführt. „Große Sorge“, glaube ich, waren Ihre Worte mit Blick auf
  die doch stark gestiegenen Preise. Mich würde einmal interessieren: Ist es ein Thema,
  das jetzt der Kanzler zur Chefsache macht? Ich würde einfach gern wissen, wenn Sie
  dieses Problem so erkannt haben, wie die Bundesregierung jetzt agiert oder wer möglicherweise
  den Hut aufhat, auch bei der Frage, ob oder wie man möglicherweise entlasten könnte.
  Ich halte von der Kategorie nichts. Es wird häufiger mal gefragt, ob man Dinge zur
  Chefsache erklärt. Wie gesagt, grundsätzlich halte ich von der Kategorie nichts.
  Aber klar ist doch: Spätestens seit Ausbruch des Krieges im Iran und den Folgen
  daraus ‑ die Gegenangriffe des Irans auf verschiedene Partner in der Region, jetzt
  die erneute Zuspitzung, die wir auch durch die Huthis erlebt haben ‑, seit Beginn
  dieser Auseinandersetzung haben wir uns im Bundeskabinett, quasi in jeder Sitzung,
  mit diesem Thema befasst. Da geht es um Sicherheitsfragen, da geht es um die Frage
  der Energiesicherheit, da geht es um Speicher. Dabei geht es natürlich am Ende auch
  um die Preise. Die Wirtschaftsministerin hat regelmäßig berichtet, sie hat auch
  immer wieder Optionen vorgelegt. Da ist es auch richtig aufgehoben. Insofern: Der
  Kanzler beschäftigt sich sehr, sehr intensiv damit. Wir tun das insgesamt als Bundeskabinett,
  quasi in jeder Sitzung. Die Frage geht an Frau Ungrad, gegebenenfalls auch ans Justizministerium
  ‑ eine Lernfrage: Wären denn Preisdeckel oder Preiskontrolle nach derzeitiger Gesetzeslage
  möglich oder müssten dazu in relevanter Weise neue gesetzliche Regelungen verabschiedet
  werden? Den Fall streben wir ja derzeit nicht an. Ob es gesetzlich möglich wäre,
  wie das umgesetzt wird, das kann ich Ihnen nicht sagen. Das weiß ich nicht. Das
  müsste ich nachreichen. Sie meinen die Regelungstechnik? Also wie soll es anders
  ‑ ‑ ‑ Nein, die Frage ist wirklich eine Lernfrage. Wenn sozusagen Preisdeckel, Preiskontrollen
  als politische Forderung diskutiert werden, vermutlich auch in den Ministerien,
  ist es doch wichtig zu wissen: Wäre das eigentlich auf Grundlage bestehender Gesetze
  umsetzbar oder müssten dafür in signifikanter Weise neue rechtliche Regelungen geschaffen
  werden? Ich kann nicht allgemein Auskunft zur Rechtslage von allen Märkten geben,
  die der Regulierung unterliegen. Aber grundsätzlich gilt: Für Preisdeckel oder Preisgrenzen
  braucht man gesetzliche Grundlagen in Deutschland. Die Frage ist, ob die bisherigen
  Gesetze diese ermöglichen oder nicht. Aber ich habe verstanden, Frau Ungrad will
  sich schlau machen und nachliefern. ‑ Danke. Herr Kall, wenn dem Bundesfinanzminister
  die Übergewinnsteuer so sehr am Herzen liegt, warum führt er sie nicht national
  ein? Er braucht dafür die EU nicht, soweit ich weiß. Andere EU-Länder haben es auch
  gemacht. Warum verstecken Sie sich da hinter Europa? Wir verstecken uns überhaupt
  nicht hinter Europa. Natürlich ist es wichtig, im Binnenmarkt für gleiche oder ähnliche
  Bedingungen zu sorgen. Wir haben aus den letzten Jahren ein erfolgreiches Vorbild,
  bei dem das genau über diesen europäischen Weg gelöst und dann national umgesetzt
  wurde. Diesem Vorbild folgen wir, anstatt jetzt sehr komplexes juristisches Neuland
  zu betreten. Wir wollen ja eine Lösung, die schnell funktioniert und die dann auch
  Entlastungen der Verbraucherinnen und Verbraucher ermöglicht. Deshalb gibt es in
  der Koalition ‑ das wurde im Koalitionsausschuss entschieden ‑ die Verständigung
  darauf: Wir suchen hier den europäischen Weg. Eine Frage an das BMDS zum allgemeinen
  Thema KI: Wie stehen Sie zu der Forderung führender KI-Unternehmen aus den USA,
  die Forschung in dem Bereich zu drosseln ? Wir verfolgen die globale KI-Entwicklung
  sehr genau, und wir nehmen die öffentlichen Warnungen, auch von führenden KI-Entwicklern,
  sehr ernst. Wenn KI-Modelle immer wirkmächtiger werden, aus Testumgebungen ausbrechen
  und eigenständig in andere Systeme eindringen, haben wir es mit einem völlig neuen
  Bedrohungsszenario zu tun. Das ist ein Paradigmenwechsel, auf den diese Bundesregierung
  reagiert und auch handelt. Sie wissen, wir bauen gerade das nationale KI-Sicherheitsinstitut
  auf; das hat die Arbeit aufgenommen. Es wird uns in die Lage versetzen, sicherheitsrelevante
  Risiken mit Blick auf KI frühzeitig zu identifizieren und ihnen zu begegnen. Wir
  treiben den Aufbau entschlossen voran. Das KI-Institut ist auch schon im engen Austausch
  mit Vergleichsinstitutionen, mit Partnern in Großbritannien und Frankreich. Bundesdigitalminister
  Dr. Karsten Wildberger hat sich auch kürzlich für eine globale KI-Aufsicht ausgesprochen
  und gesagt, es brauche dringend eine internationale Zusammenarbeit, wie wir Systeme,
  die zunehmend autonomer werden, in den entscheidenden Fragen sicher machen. Wir
  als Bundesregierung bringen dieses Thema auch auf G7-Ebene ein. Ein solcher Dialog
  funktioniert nur, wenn die USA und China mit eingebunden werden. Zu Ihrer Frage
  bezüglich eines Entwicklungsstopps: Das sehen wir für Europa als nicht gangbaren
  Weg. Es ist erklärtes Ziel dieser Bundesregierung, die digitale Souveränität zu
  stärken. Dazu gehört auch, die KI-Entwicklung in Europa voranzutreiben. Für wie
  realistisch halten Sie so eine Drosselung in den USA, wenn eben, wie Sie sagen,
  Europa oder unter anderem China nicht mitmachen? Das ist eine Frage, die wir sehr
  ernst nehmen. Diese Frage werden wir aber in Europa nicht alleine beantworten werden
  können, sondern die wir gemeinsam auf internationaler Ebene besprechen müssen. Genau
  das tun wir auf G7-Ebene. Der Minister ist diese Woche auch in Kanada, und dort
  wird dieses Thema sicherlich auch besprochen werden. Herr Meyer, die Warnungen,
  die es am Wochenende von großen KI-Firmen gab, klingen wirklich drastisch, und zwar
  sowohl was den Zeitrahmen als auch was die Schwere möglicher Schäden angeht. Ist
  das ein Thema, das nicht nur das Digitalministerium, sondern beispielsweise auch
  den Nationalen Sicherheitsrat beschäftigt? Wie blickt der Kanzler auf dieses Thema?
  Wir nehmen die Warnungen, die wir da gehört haben, sehr ernst ‑ das BMDS hat gerade
  auch darauf hingewiesen. Es ist in der Tat so, dass sich das höchste Gremium, das
  wir für die nationale Sicherheit haben, nämlich der Nationale Sicherheitsrat, bereits
  zweimal mit diesem Thema beschäftigt hat. Darüber haben wir im Nachgang dann auch
  kurz informiert. Insofern nehmen wir das sehr ernst, und die richtigen Schlüsse
  hat das BMDS gerade geschildert. Das gilt für die gesamte Bundesregierung. Man muss
  sich ja wahrscheinlich auf verschiedene Szenarien vorbereiten. In den letzten Berichten
  von Anthropic ging es um Hacking, da ging es aber auch um Militäroperationen oder
  um biologische Kampfstoffe. Muss ich mir das so vorstellen, dass die Bundesregierung
  da mit Planspielen arbeitet und jeweils schaut, wie man darauf reagieren kann, oder
  wie sieht eine Vorbereitung auf dieses doch sehr schwer zu greifende Bedrohungsszenario
  aus? Da würde ich jetzt ungern spekulieren wollen. In dieser gesamten Entwicklung
  rund um die künstliche Intelligenz müssen wir uns aber damit beschäftigen, dass
  wir da eine Gleichzeitigkeit haben. Es gibt riesige Chancen, die in dieser Entwicklung
  stecken, auch für unsere Wirtschaft. Wir haben uns bei der Kabinettsklausur in Neuhardenberg
  intensiv mit dem Thema KI und den Auswirkungen auch auf unseren Wirtschaftsstandort
  beschäftigt. Auch da ist noch einmal deutlich geworden, welch großes Potenzial gerade
  für unsere industriell geprägte Wirtschaft in dieser Technologie steckt ‑ für Produktivitätsgewinne,
  im Bereich der Medizin usw. Es gibt auf der einen Seite also riesige Chancen; gleichzeitig
  befinden wir uns aber in einer Entwicklung, die relativ neu ist und die auch Risiken
  und Gefahren mit sich bringt, mit denen wir jetzt umgehen müssen und denen wir auch
  begegnen müssen. Da wir so etwas als Deutschland am Ende nicht alleine machen können,
  ist unser Ziel natürlich immer, nach europäischen Lösungen, ehrlicherweise aber
  sogar auch nach globalen Lösungen zu suchen, zum Beispiel im Rahmen der G7, bei
  denen das Thema immer wieder auf der Tagesordnung stand. Deshalb ist es wichtig,
  dass wir jetzt nicht nur in Doomsday-Szenarien denken dürfen, sondern beides machen
  müssen: zum einen die Chancen ergreifen, zum anderen aber dort, wo wir Risiken sehen,
  entschlossen agieren und handeln. Ich will auch noch einmal auf das KI-Sicherheitsinstitut
  hinweisen, das sich ‑ das ist gewissermaßen ein Ergebnis der Diskussion im Nationalen
  Sicherheitsrat ‑ auch mit genau diesen Fragen beschäftigen wird. Ich kann vielleicht
  noch ergänzen, dass es beim KI-Sicherheitsinstitut und dem Austausch mit den globalen
  Partnern auch um die Frage geht, wie wir KI einsetzen können, um Sicherheitslücken
  zu identifizieren und unsere Systeme sicherer zu machen. Die Institute sind auch
  in Kontakt mit den Herstellern, um Meldewege zu etablieren. Es gibt also nicht nur
  ein passives Abwehren, sondern es geht auch darum, KI aktiv einzusetzen, um Systeme
  sicher zu machen. Herr Meyer, können Sie mich erhellen, in welchem Zug Herr Sautter
  in der Ukraine gesessen hat: in dem der angegriffen wurde, oder in einem Zug in
  der Nähe? Da gibt es ein bisschen Unklarheit. Was können Sie dazu sagen? Über Reisebewegungen
  des sicherheitspolitischen Beraters gebe ich hier öffentlich keine Auskunft. Was
  wir sagen können, ist, dass wir offensichtlich wieder Angriffe gesehen haben, die
  sich hier auch gegen die Zuginfrastruktur gerichtet haben. Russland hat das ukrainische
  Eisenbahnnetz eigentlich seit Beginn dieses Angriffskrieges immer wieder gezielt
  massiv angegriffen. Wir sehen das als einen weiteren Schritt in der Eskalationsdynamik,
  in der sich Russland derzeit offensichtlich befindet. Wie gesagt, darüber hinaus
  möchte ich hier zu Reisebewegungen nichts sagen. Durch diese russischen Angriffe
  ist es für Regierungsmitarbeiter also gefährlicher geworden, in die Ukraine zu reisen?
  Bei allen Reisen, die die Bundesregierung betreffen, haben wir natürlich allerhöchste
  Sicherheitsvorkehrungen und Sicherheitsstandards. Das gilt generell und das gilt
  auch in Zukunft. An das Innenministerium und das Gesundheitsministerium zu einem
  bislang kaum beachteten Aspekt der geplanten Reform des Nachrichtendienstrechts
  , nämlich dem Schutz des ärztlichen und psychotherapeutischen Berufsgeheimnisses
  : Während Vertrauensverhältnisse zum Beispiel bei Anwälten in dieser Gesetzesnovelle
  absolut geschützt werden, gilt für Ärzte und Psychotherapeuten lediglich eine Abwägungslösung.
  Für Patienten heißt das unter Umständen, dass Verfassungsschutz und BND künftig
  legal Krankenakten und vertrauliche Arzt- und Therapiegespräche durchleuchten können.
  Da würde mich interessieren: Warum schützt die Bundesregierung das Mandantenverhältnis
  von Anwälten absolut, aber das Arzt-Patienten-Geheimnis nicht? Was sind die sachlichen
  und verfassungsrechtlichen Grundlagen für diese Art der Ungleichbehandlung? Sie
  sprechen von der Reform des Nachrichtendienstrechts. Ganz grundsätzlich kann ich
  Ihnen dazu sagen, dass die Regelung ähnlich ist wie bereits bestehende Regelungen
  in der Strafprozessordnung. Sie ist also erst einmal nichts Neues. Hier passiert
  also nichts Revolutionäres; vielmehr ist das vergleichbar mit Regelungen, die schon
  bestehen, und das auch schon seit Längerem. Rein praktisch sind Psychotherapeuten
  kein primäres Aufklärungsziel des Bundesverfassungsschutzes. Daher wird das in der
  Praxis höchstwahrscheinlich nicht besonders viel Relevanz haben. Falls diese Aufklärung
  doch notwendig ist, wird zwischen der Notwendigkeit der Aufklärung und dem Berufsgeheimnis
  sowie dem Schutz des Kernbereichs privater Lebensgestaltung abgewogen. Wird bei
  einer solchen Aufklärung gesehen oder gehört, dass es um primär private oder ausschließlich
  private Inhalte geht, dann wird eine entsprechende Aufklärung auch nicht stattfinden
  bzw. abgebrochen. Die Nachrichtendienstreform schafft auch in diesem Fall grundsätzlich
  klarere Regelungen als die bisherigen einschlägigen Gesetze. Beispielsweise werden
  die Überwachungsbefugnisse dahingehend nicht erweitert. Ich habe den Äußerungen
  des Kollegen nichts hinzuzufügen. Eine Frage an das BMG hätte ich dann aber doch
  noch: Schließt der Gesetzentwurf den Zugriff der Nachrichtendienste auf Praxisverwaltungssysteme
  und die elektronische Patientenakte eindeutig aus? Die Zuständigkeit für den Entwurf
  liegt beim BMI, auf das ich diesbezüglich verweisen würde. Zu dieser ganz konkreten
  Frage müsste ich Ihnen etwas nachliefern. Zum Thema Commerzbank und UniCredit an
  das Finanzministerium: Es soll heute ein Treffen des Finanzministers mit dem Chef
  von UniCredit geben. Herr Kall, können Sie ein paar Details zu diesem Treffen nennen?
  Was ist Gegenstand und Ziel dieses Gesprächs? Das kann ich gerne machen, mit der
  Einschränkung, dass das natürlich ein vertrauliches Gespräch sein wird, dem wir
  hier auch nicht vorgreifen. Ich kann aber einmal deutlich machen, wo wir aktuell
  stehen. Es ist so, dass die beiden Banken, UniCredit und die Commerzbank, über den
  weiteren Weg verhandeln. In diesem Prozess der Verhandlungen zwischen den beiden
  Banken ist es jetzt an der Zeit, dass die Bundesregierung auch klarmacht, was die
  Interessen Deutschlands und die Interessen des Bundes sind. Ganz wichtig ist aber:
  Die Verhandlungen führt nicht der Bund, sondern die führen zwei Banken miteinander.
  Wenn es um die Interessen der Bundesregierung geht, dann stehen immer drei Themen
  im Mittelpunkt: Das erste Thema ist die Mittelstandsfinanzierung, für die die Commerzbank
  in Deutschland einfach eine sehr wichtige Funktion hat. Die Commerzbank ist eine
  sehr wichtige Bank, wenn es darum geht, den deutschen Mittelstand zu finanzieren.
  Dieses primäre zentrale Geschäftsmodell der Commerzbank soll natürlich auch erhalten
  werden. Der zweite Punkt ist: Für den Finanzstandort Frankfurt, einen der wichtigsten
  Finanzstandorte in Europa, ist die Commerzbank zentral. Deswegen ist es der Bundesregierung
  wichtig, den Standort Frankfurt für die Commerzbank zu erhalten. Das dritte und
  vielleicht wichtigste ist Thema ist: Die Bundesregierung hat natürlich die Interessen
  der Beschäftigten im Blick. Die Commerzbank hat über 40 000 Beschäftigte, und deren
  Interessen wollen wir natürlich wahren, soweit die Bundesregierung ihren Einfluss
  da geltend machen kann. Das sind die drei wichtigsten Punkte: Mittelstandsfinanzierung,
  Finanzstandort Frankfurt und die Interessen der Beschäftigten. Dazu wird Bundesfinanzminister
  Klingbeil mit Herrn Orcel heute Nachmittag sprechen. Dazu hat er sich sowohl in
  der Bundesregierung als auch mit der Commerzbank, dem Land Hessen, dem Betriebsrat
  und anderen im Vorfeld intensiv beraten. Die Bundesregierung hat seit vielen, vielen
  Monaten auch hier in der Regierungspressekonferenz immer wieder deutlich gemacht,
  dass sie die Übernahmepläne der UniCredit ablehnt. Die UniCredit hat sich davon
  weitgehend unbeeindruckt gezeigt. Mich würde interessieren: Welche Druckmittel hat
  der Finanzminister überhaupt, um eine feindliche Übernahme durch die UniCredit abzuwenden?
  Was kann er da heute überhaupt präsentieren? Ein aggressives und feindliches Vorgehen
  lehnt die Bundesregierung ab; das haben wir immer deutlich gemacht und das gilt
  auch weiterhin. Nun sind die beiden Banken aber in einer anderen Phase, da sie jetzt
  über eine Transaktion verhandeln. Das heißt, da geht es jetzt gerade nicht mehr
  um eine feindliche Übernahme, sondern darum, den besten Weg für beide Banken zu
  finden. In dieser Phase der Verhandlungen zwischen den Banken bringt die Bundesregierung
  ihre Interessen ein. Dass wir ein feindliches Vorgehen ablehnen, gilt weiterhin,
  aber in dieser Phase sind die Banken gerade nicht mehr. Ich habe eine Frage zur
  EU-Handelspolitik: Wie steht die Bundesregierung zu der Entscheidung von Frankreich
  aus der vorigen Woche, das sich über den bestehenden EU-Konsens hinwegsetzen und
  Handelsbeschränkungen für Waren aus dem Westjordanland verhängen will? Ist das aus
  deutscher Sicht eine Verletzung der ausschließlichen Zuständigkeit der EU für Handelspolitik?
  Wenn ich Ihre Frage richtig verstanden habe und richtig informiert bin, haben wir
  uns in zwei Regierungspressekonferenzen schon ziemlich umfangreich dazu geäußert.
  Ich hätte jetzt nichts Neues anzubieten. An das Verteidigungsministerium: Herr Müller,
  trifft es zu, dass fast ein Drittel der Menschen, die sich im zweiten Quartal dieses
  Jahres freiwillig zur Bundeswehr gemeldet haben, von den Ärzten als wehrdienstuntauglich
  ausgemustert worden sind? Ihre Frage bezieht sich in auf alle Menschen, die sich
  freiwillig gemeldet haben. Ich glaube, bei dem Sachverhalt, der gerade thematisiert
  wird, geht es um die Rückläufer aus dem sogenannten Fragebogen; das muss man ja
  trennen. Der Großteil der Personalgewinnung der Bundeswehr erfolgt aus freiwilligen
  Meldungen, die aufgrund von Interesse aus den Kampagnen und aus Berufsbildungstagen
  usw. entsteht. Ich kann die Zahl so nicht bestätigen, weil sie Teil einer parlamentarischen
  Anfrage ist. Parlamentarische Anfragen gehen erst einmal an den parlamentarischen
  Bereich und werden dann über das Dokumentations- und Informationssystem des Bundestages
  bereitgestellt, in dem man die Dinge dann nachlesen kann. Wir haben Mitte August
  eine große Pressemitteilung herausgegeben, in der wir uns mit Stand vom 31. Juli
  dazu äußern, wie viel Rücklauf wir zu dem Fragebogen haben. Darin stellen wir genau
  dar, wie viele Personen am Assessment teilgenommen haben und wie viele eingestellt
  wurden. Auf diese Pressemitteilung mit den offiziellen Zahlen kann ich verweisen.
  Wir werden zeitnah auch die nächsten Zahlen herausbringen. Wir tun das im Monatsrhythmus
  mit etwas zeitlichem Nachlauf, der meistens sechs oder sieben Wochen beträgt, weil
  wir den Monatsendstand benötigen. Die Zahlen, die an eine Parlamentsfraktion geliefert
  wurden, sind inzwischen veröffentlicht worden. Deswegen erlaube ich mir doch nachzufragen.
  Danach geht es um knapp 1500 Personen. Wenn Sie sagen, das seien die Rückläufe aus
  dem Fragebogen, dann ist das natürlich nur eine Teilmenge. Aber trifft es denn zu,
  dass 31 Prozent davon und damit ein höherer Prozentsatz als im ersten Quartal bei
  einer vergleichbaren Menge als untauglich ausgemustert wurden? Ist das aus Sicht
  der Bundeswehr ein höherer Prozentsatz? Man muss zwischen Assessment und Musterung
  unterscheiden. Was wir gerade diskutieren, ist ein Assessmentverfahren. Es geht
  um Menschen, die sich bewusst entschieden und gesagt haben: Ich möchte zur Bundeswehr
  und durchlaufe nicht nur den Anteil Musterung ‑ dieser Teil ist ja im Grunde ab
  Mitte 2027 für alle verpflichtend ‑, sondern darüber hinaus auch ein Assessment. ‑
  Dabei geht es darum, festzustellen, ob sie für das, was sie gern machen würden,
  geeignet sind. Das betrifft auch mentale und kognitive Fähigkeiten, Allgemeinbildung
  und natürlich noch mehr. In diesem Kontext ist es durchaus nicht ungewöhnlich, dass
  wir aus verschiedensten Gründen im Bereich zwischen 20 Prozent und 30 Prozent liegen.
  Dabei geht es um körperliche Voraussetzungen, aber auch um andere Fähigkeiten, die
  für den Bereich, in dem man sich qualifizieren will, mitgebracht werden müssen.
  Das geben auch die Zahlen vom 31. Juli ungefähr so wieder. Wir hatten 2636 Teilnahmen
  am Assessment. Knapp unter 1700 haben das Assessment erfolgreich bestanden. Daraus
  folgen die kommunizierten 865 Einstellungen. Das ist immer die normale Schrittfolge.
  Nach der Interessenbekundung durchläuft man ein Assessment. Aus diversen Gründen
  ist man vielleicht nicht geeignet oder bringt vielleicht die körperlichen Voraussetzungen
  nicht mit. Aber auch nicht alle, die das Assessment erfolgreich durchlaufen, werden
  am Ende eingestellt. Gegebenenfalls entsprechen die Angebote der Bundeswehr nicht
  genau dem, was jemand tun möchte, weil zum Beispiel eine Verwendung nicht an dem
  Ort verfügbar ist, den der Betreffende wünscht, oder weil der Betreffende in der
  Zeit, bis der Brief bei ihm ankommt, doch etwas anderes gefunden hat. Deswegen verringert
  sich die Gesamtmenge bis zu dem Punkt, an dem eine Einplanung entsteht, immer um
  einen gewissen Teil. Aber noch einmal: Das sind die Rückläufe und die Assessments,
  die sich aus den Fragebögen ergeben. Wir haben in diesem Jahr bis zum jetzigen Zeitpunkt
  schon 25 000 Einstellungen. Das heißt, dass die Zahlen, die wir jetzt diskutieren,
  wirklich nur einen Bruchteil davon ausmachen. Die Personalgewinnung ist im Grunde
  ein Nebeneffekt aus dem Fragebogen. Der Haupteffekt ist die Wehrerfassung. Wir wollen
  ja wieder wissen, wer in einem Jahrgang wo wohnt, welche Daten er mitbringt und
  wie fit er ist. Das ist die Hauptaufgabe. Der Nebeneffekt ist im Grunde, dass wir
  auch abfragen: Könnt ihr euch etwas bei uns vorstellen? ‑ Dieser Nebeneffekt ist
  in der Gesamtmenge trotzdem nur ein kleiner Ausschnitt dessen, was insgesamt zur
  Bundeswehr kommt. In der Pressemitteilung von Mitte August haben wir die Daten zu
  Einstellungen und Bewerbungen mitgeteilt. Darüber hinaus haben wir darin mitgeteilt,
  dass wir 75 000 Interessenbekundungen hatten. Wir haben also 75 000 Erstberatungsgespräche
  bzw. Erstkontaktaufnahmen durchgeführt. Deswegen sind die Punkte, die wir jetzt
  besprechen, wirklich nur ein kleiner Punkt aus der Gesamtschau der Personalgewinnung.
  Der Beauftragte der Bundesregierung für Kultur und Medien, der dem Bundeskanzleramt
  zugeordnet ist, hat der politischen NGO Abraham Accords Institute , AAI, erneut
  Bundesmittel für 2026 zugesagt. Der Trägerverein des Instituts wird von dem CDU-Bundestagsabgeordneten
  Armin Laschet geführt. Zugleich gibt es mehrere personelle Überschneidungen mit
  seinem Abgeordnetenbüro. Herr Meyer, wie begründet die Bundesregierung die erneute
  Förderung, obwohl es bereits in der ersten Förderperiode ‑ die Förderung lag durchaus
  in Millionenhöhe ‑ dokumentierte Unregelmäßigkeiten gab, darunter verspätete und
  nach Einschätzung des Bundesverwaltungsamtes nicht nachvollziehbare Abrechnungen
  sowie nicht umgesetzte Projektbestandteile? Mir sind weder der Vorgang noch die
  in Ihrer Frage enthaltenen Vorhaltungen bekannt. Das wäre klassischerweise eine
  Frage, die man an die Pressestelle des Kulturstaatsministers richten könnte. Aber
  er untersteht ja Ihnen. Deswegen dachte ich, dass es ‑ ‑ ‑ Mir untersteht er nicht.
  Wie gesagt, hat er eine eigene Pressestelle, die dazu sicherlich Auskunft geben
  kann. Ich kenne den Vorgang nicht. Deswegen kann ich leider nichts dazu sagen. Herr
  Müller, laut aktueller Berichterstattung will Herr Minister Pistorius Verpflichtungen
  für die Brigade Litauen anordnen. Können Sie das bestätigen? Das kann ich zum jetzigen
  Zeitpunkt nicht bestätigen. Ich verweise auf ein TV-Interview des Ministers von
  Ende Juni. Das ist also gar keine so neue Nachricht. Darin hat sich der Minister
  schon dahingehend geäußert, dass er davon ausgehe, dass wir für einen gewissen Anteil,
  nämlich für Spezialverwendungen, Verpflichtungen ziehen werden müssen. Das Thema
  haben wir hier vor zwei Wochen schon einmal besprochen. Ich kann nur sagen, dass
  die Zahl der freiwilligen Meldungen in der Zwischenzeit noch einmal zugenommen hat.
  Wir werden anlassbezogen, wenn es wirklich neue Zahlen gibt, noch einmal darüber
  informieren. Das tun wir regelmäßig. Die Transparenz ist uns sehr wichtig. Geben
  Sie uns deswegen noch ein bisschen Zeit. Wir werden die nächste Iteration der Information
  auf jeden Fall durchführen. Meine Frage richtet sich an das BMI und das BMJV. Trifft
  es zu, dass die Generalbundesanwaltschaft Anklage gegen eine Berliner Unternehmerin
  erhoben hat, der vorgeworfen wird, Spionage zugunsten Russlands betrieben zu haben?
  Wenn ja, können Sie uns substanziell etwas zu der Causa sagen? Ich kann Sie nur
  auf die entsprechende Pressemitteilung des Generalbundesanwalts verweisen, die zu
  dem Fall bereits veröffentlicht wurde. Dem schließe ich mich an. Es handelt sich
  um laufende Ermittlungen, und Sie wissen, dass wir uns von hier aus nicht dazu äußern
  oder es kommentieren.'
