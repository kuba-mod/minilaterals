title: Bundeshaushalt 2027 Etat im Zeichen von Wohlstand und Sicherheit
text: 'Bundesfinanzminister Klingbeil stellte den Bundeshaushalt 2027 im Deutschen
  Bundestag vor. Wachstum, Beschäftigung und Sicherheit bleiben Schwerpunkte der Bundesregierung.
  Globale Krisen und Konflikte stören Lieferketten, treiben Energiepreise in die Höhe
  und erschweren das Wirtschaftswachstum. Die Bundesregierung begegnet diesen Herausforderungen
  mit Handlungsstärke. Sie hat weitreichende Entscheidungen für Reformen getroffen,
  um die Wirtschaft zu stärken, Arbeitsplätze zu sichern und die Sozialsysteme zukunftsfest
  aufzustellen. Mit dem Kabinettsbeschluss des Bundeshaushalts 2027 und des Finanzplans
  bis 2030 vom 6. Juli setzt die Bundesregierung weiterhin auf einen Dreiklang aus
  Investitionen, Strukturreformen und Konsolidierung. Bundesfinanzminister Lars Klingbeil
  stellte den Haushalt am 8. September im Deutschen Bundestag vor und ging dabei auf
  die Prinzipien der Bundesregierung ein: „Wir investieren in unsere Zukunft, wir
  investieren in unsere Sicherheit und wir schaffen uns die Freiheit, damit wir auch
  morgen noch handeln können. Dieser Haushalt bildet ein neues Fundament für Wachstum,
  für Beschäftigung und für soziale Sicherheit.“ Mit dem Bundeshaushalt 2027 setzt
  die Bundesregierung ihren Kurs zur Stärkung der Sicherheit sowie zur Belebung der
  Wirtschaft fort. Insgesamt stehen rund 118 Milliarden Euro zur Verfügung. Mit diesen
  Rekordinvestitionen sollen das Land modernisiert, Beschäftigung gesichert und die
  Innovationskraft Deutschlands gestärkt werden. Diese Investitionsoffensive soll
  auch in den Folgejahren konsequent fortgeführt werden. Eine zentrale Rolle spielt
  das Sondervermögen Infrastruktur und Klimaneutralität . Für 2027 sind über 36 Milliarden
  Euro für Investitionen des Bundes vorgesehen. Hinzu kommen zehn Milliarden Euro
  für den Klima- und Transformationsfonds sowie rund acht Milliarden Euro zur Unterstützung
  von Ländern und Kommunen. Damit soll der Investitionsstau in Deutschland beendet
  werden. „Wir bauen die Infrastruktur von morgen. Wir machen aus dem Sondervermögen
  für Infrastruktur und Klimaneutralität ein einzigartiges Zukunftsprogramm für unser
  Land“, so Bundesfinanzminister Klingbeil. „Die Bagger rollen, Brücken und Schienen
  werden repariert. Schulen, Kitas, Krankenhäuser werden saniert – Feuerwehrhäuser,
  Sportplätze und bezahlbare Wohnung neu gebaut.“ Die Bundesregierung erhöht zudem
  die Verteidigungsausgaben, um die Abschreckungs- und Verteidigungsfähigkeit Deutschlands
  zu verbessern. Vorderstes Ziel ist es, militärische Auseinandersetzungen zu verhindern.
  „So kraftvoll, wie wir in Infrastruktur und Innovation investieren, so kraftvoll
  investieren wir auch in unsere Sicherheit und in die Verteidigungsfähigkeit", sagte
  Finanzminister Klingbeil. Für Verteidigung steigen die vorgesehenen Ausgaben im
  kommenden Jahr deutlich auf über 109 Milliarden Euro, ergänzt durch Mittel aus dem
  Sondervermögen Bundeswehr. Der Bundeshaushalt trägt insgesamt dazu bei, die Krisenfestigkeit
  zu stärken. Die in der Koalition vereinbarten Konsolidierungsmaßnahmen setzt die
  Bundesregierung Schritt für Schritt um. „Wir konsolidieren, damit wir wieder mehr
  gestalten können. Investieren und Konsolidieren gehört deshalb zusammen“, sagte
  Klingbeil. Handlungsspielraum soll unter anderem durch den drastischen Rückbau von
  Bürokratie, eine noch wirksamere Bekämpfung von Finanz- und Steuerkriminalität,
  die Besteuerung von Kryptowerten und die Anpassung der Tabaksteuer entstehen. Finanzhilfen
  sollen verringert werden. Die Bundesregierung hat mit einem konsequenten Subventionsabbau
  begonnen. 2027 werden auf diese Weise knapp drei Milliarden Euro eingespart. In
  den Folgejahren wird dieser Betrag noch deutlich aufwachsen. Außerdem werden – wie
  im Koalitionsvertrag vereinbart – weitere Kürzungen der Mittel für Entwicklungszusammenarbeit
  vorgenommen. Sparen beginnt in der Bundesverwaltung selbst. Effizientere Abläufe
  und Strukturen in den Bundesministerien sparen im kommenden Jahr 1,2 Milliarden
  Euro im Bundeshaushalt ein. Der Bund überprüft alle Maßnahmen hinsichtlich ihrer
  Wirkung und konnte so für 2027 bereits ressortübergreifende Einsparungen in Höhe
  von vier Milliarden Euro umsetzen. Dies entspricht der Einsparvorgabe von einem
  Prozent pro Jahr je Ministerium. Diesen Weg wird die Bundesregierung fortsetzen:
  Ab 2028 sollen auf diese Weise weitere acht Milliarden Euro pro Jahr eingespart
  werden. Der Bund führt außerdem den bereits begonnenen Stellenabbau in der Verwaltung
  – Sicherheitsbehörden sind ausgenommen – fort. Die Einsparquote beim Personal soll
  für 2027 zwei Prozent betragen. Insgesamt werden bis 2029 beim Personal acht Prozent
  eingespart. Das Kabinett hat im Haushaltsbegleitgesetz zudem weitere Maßnahmen beschlossen,
  um den Bundeshaushalt zu stärken. So soll der Steuersatz für bestimmte alkoholische
  Getränke – außer Bier und Wein – angehoben werden. Darüber hinaus soll der Bundeszuschuss
  an die gesetzliche Rentenversicherung im Jahr 2027 um eine Milliarde Euro abgesenkt
  werden, was zu einer Entlastung des Bundeshaushalts in gleicher Höhe führt.'
