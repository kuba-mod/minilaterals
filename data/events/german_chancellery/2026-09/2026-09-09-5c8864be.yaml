title: Rede des Bundeskanzlers bei der Generaldebatte zum Haushalt 2027 „Wir werden
  die Zukunft unseres Landes in die Hand nehmen“
text: '„Reformen dienen dem Zusammenhalt, dem Fortschritt und der weiteren Entwicklung
  unseres Landes in Freiheit und in Frieden“, betonte der Kanzler in seiner Rede.
  Bundeskanzler Friedrich Merz forderte in der Generaldebatte zum Haushalt 2027 im
  Deutschen Bundestag auf, die Zukunft des Landes in die Hand zu nehmen, sie zu gestalten
  und sie besser zu machen. Man wolle „dafür sorgen, dass unsere Kinder und unsere
  Enkelkinder wieder eine Zukunftshoffnung haben, dass sie wieder eine Perspektive
  haben.“ Dafür werde man weiter die Freiheit in Deutschland verteidigen und die Sicherheit
  vor äußeren und inneren Bedrohungen stärken. Diese Aufgaben könnten nur mit einer
  starken Wirtschaft gelöst werden. Das prognostizierte Wirtschaftswachstum von 1,3
  Prozent für 2026 zeige, dass man hier auf dem richtigen Weg sei, so der Kanzler.
  Die Bundesregierung habe Entscheidungen getroffen, die Wirtschaftswachstum in Deutschland
  wieder ermöglichen. Dennoch seien weitere Reformen notwendig, betonte der Kanzler.
  Die Belastung der Unternehmen durch hohe Energiekosten und Bürokratie müsse weiter
  abgebaut werden. Bei der „vierten industriellen Revolution“ durch Künstliche Intelligenz
  solle Deutschland an der Spitze der technologischen Entwicklung stehen, forderte
  Merz. Dafür habe man innerhalb der Bundesregierung eine Taskforce eingerichtet und
  bereits für den Bau von Rechenzentren „in großem Umfang“ gesorgt. Die Geschehnisse
  der letzten Zeit hätten gezeigt, dass Deutschland widerstandsfähiger und verteidigungsfähiger
  werden müsse, betonte der Bundeskanzler. Die Ukraine solle weiter unterstützt werden,
  weil sie auch „unsere Freiheit verteidigt“. Zudem kündigte Merz eine weitere Stärkung
  des Zivil-, Bevölkerungs- und Katastrophenschutzes an. Den Ländern habe der Bund
  dafür 100 Milliarden Euro zugesagt. Man wolle und müsse das leisten, damit die Gesellschaft
  insgesamt sicherer werde. Denn das würden die Menschen in Deutschland von der Politik
  erwarten, so der Kanzler: „Sie wollen Sicherheit vor äußerer Bedrohung. Sie wollen
  Sicherheit vor innerer Bedrohung.“ Die Bundesregierung korrigiere Fehlentwicklungen
  in der Energiepolitik, betonte Bundeskanzler Merz. Man sorge etwa für den Bau von
  Gaskraftwerken und eine sichere Energieversorgung in der Zukunft – „und zwar mit
  den regenerativen Energien und nicht ohne sie“, so der Kanzler. Zudem unterstrich
  Merz, dass es klare Hinweise dafür gebe, dass die Energieversorgung und insbesondere
  die Gasversorgung in Deutschland über den Winter hinweg gesichert seien. Das Ziel
  der umfassenden Reformen sei es, das Wohlstandsversprechen an die junge Generation
  erneuern zu können, so Bundeskanzler Merz. Er betonte: „Wir müssen der jungen Generation
  die Perspektive geben, die mindestens drei Generationen vor ihnen in Deutschland
  gehabt haben. Das ist der Sinn unserer Politik.“ Reformen würden dem Zusammenhalt
  dienen, „dem Fortschritt und der weiteren Entwicklung unseres Landes in Freiheit
  und in Frieden“, so der Kanzler weiter.'
