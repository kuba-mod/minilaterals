  hat sie in dem Interview das Wort Standortgarantie ja nicht selbst verwendet, aber
  sie hat eben darauf hingewiesen, dass staatliche Hilfen für Unternehmen keine Einbahnstraße
  sein können und dass man dann natürlich auch erwartet, dass eben alles, was möglich
