  als solche jetzt von dieser Stelle aus nicht kommentieren. Ich darf aber ganz klar
  unterstreichen, dass die Brigade Litauen auch derzeit aus Kräften besteht, die allesamt
  freiwillig da sind. Insbesondere beträgt der Besetzungsstand in Litauen vor Ort
  92 Prozent, und das alles wurde auch durch entsprechende Freiwilligenmeldungen erreicht.
  Wir haben auch nie ein Geheimnis daraus gemacht, und auch der Minister hat es ja
  kürzlich gesagt, dass wir an dem Grundsatz der Freiwilligkeit festhalten wollen,
  dass aber natürlich Einsatzbereitschaft die oberste Priorität ist, sodass es durchaus
  dazu kommen kann, dass wir offene Posten entsprechend auch verpflichtend besetzen
  müssen. Dazu, ob und in welchem Umfang das der Fall ist, kann ich aber heute hier
  noch keine abschließende, belastbare Aussage treffen, denn ich darf hier noch einmal
  betonen, dass wir ja vielfältige Maßnahmen eingeleitet haben und auch umsetzen,
  die erste Wirkung zeigen, die aber natürlich auch die Zeit brauchen, um die Wirkung
  auch gänzlich entfalten zu können. Dafür brauchen wir einen angemessen zeitlichen
  Vorlauf, sodass ich hier jetzt nicht sagen kann, ob und in welchem Umfang es tatsächlich
  zur Verpflichtung kommen wird. Da möchte ich Sie auf die Aussagen des Ministers
  verweisen. Ich kann Ihnen aber garantieren, dass, wenn es dort zu Änderungen kommt,
  wir das auch entsprechend kommunizieren werden. Ich habe es gerade vielleicht einfach
  intellektuell noch nicht ganz durchdrungen. Wofür ist der angemessene zeitliche
  Vorlauf vorgesehen, für mögliche Verpflichtungen? Vielleicht können Sie das einfach
  noch einmal erläutern. Es geht dabei tatsächlich um die vielfältigen Maßnahmen,
  die wir ja auch sozusagen vor allen Dingen intern fahren, um über die Brigade Litauen
  zu informieren. Es gibt natürlich umfangreiche Informationen, die wir zur Verfügung
  stellen. Es gibt aber auch beispielsweise die Möglichkeit, nach Litauen zu reisen
  und sich das vor Ort anzuschauen, um also auch ganz transparent mit den Soldatinnen
