  nicht beziehen. Ich glaube, unsere Position ist da vollkommen unmissverständlich.
  Ich habe eine Frage zum Thema „VW und EU-Zölle gegen chinesische Autos“, vielleicht
  erst einmal an Herrn Hille. VW hat ja gestern eine Einigung erzielt, was Sanierungskonzepte
  angeht . Das ist aber heute aus VW-Kreisen damit verbunden worden, dass die Bundesregierung
  unbedingt sehr schnell für EU-Importzölle auf chinesische Hybridautos sorgen müsse.
  Wenn das nicht geschehe, hätte das dramatische Folgen bei VW, und der Beschluss
