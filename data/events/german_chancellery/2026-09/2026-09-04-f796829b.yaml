  Lage. Das verfolgen wir nicht nur, das begleiten wir. Sie erinnern sich auch an
  diverse Termine der Bundesregierung und im Bundeskanzleramt, um auszuloten, was
  für Bedürfnisse es aufseiten der Industrie gibt und wie Politik flankieren kann.
  Auch das von Ihnen angesprochene Thema ist ja nicht neu. Da würde ich gerne den
