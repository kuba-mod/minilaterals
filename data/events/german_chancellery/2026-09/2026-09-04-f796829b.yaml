  Herr Hille, der Bundeskanzler ist ein gewählter Volksvertreter. Er ist der mächtigste
  Mann im Land, Sie nicht. Es ist schon ein qualitativer Unterschied, mächtige Menschen,
  die wir hier zu kontrollieren haben und bei denen wir nicht nur auf Vertrauen setzen
