  die eigentlich der Palästinensischen Autonomiebehörde zur Verfügung gestellt werden
  müssten. Das haben wir gegenüber der israelischen Regierung sehr, sehr häufig thematisiert.
  Das hat der Außenminister auch bei seinem letzten Besuch in Israel als sehr, sehr
  dringend angesprochen. Dann würde ich das andere Thema auch noch ansprechen. Es
  ist zwar jetzt gerade Wahlkampf in Israel, aber es gibt eine Holocaustanspielung
  des israelischen Sicherheitsministers Ben-Gvir . Der hat ein KI-generiertes Video
  in Umlauf gebracht , in dem palästinensische Gefangene in ein Schlachthaus geführt
