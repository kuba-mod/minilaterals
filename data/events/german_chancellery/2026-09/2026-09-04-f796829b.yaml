  Wentzel darf sich sonst auch aufgefordert fühlen. Ich weiß nicht, welchen Zusammenhang
  Sie da aufmachen, dass die Wahlergebnisse jetzt Folgen für ein VW-Werk in Zwickau
  haben. Ich verstehe nicht, auf welchen Punkt Sie hinaus wollen. Also, wie Sie das
  einordnen und deuten ‑ ‑ ‑ Ich habe gerade ausführlich deutlich zu machen versucht,
  was die Linie dieser Bundesregierung ist. Sehen Sie es mir nach, dass das nicht
  beinhaltet ‑ denn genau das würden Sie dann ja oben drüber schreiben ‑, mich auf
  einzelne Standorte einzulassen und zu sagen, dass der Bundesregierung dieser Standort
  besonders wichtig ist und der Bundesregierung jener Standort besonders wichtig ist.
  Der Bundesregierung ist es wichtig, dass Deutschland ein wettbewerbsfähiges Industrieland
  bleibt, ein wettbewerbsfähiger Wirtschaftsstandort, denn ohne Wettbewerbsfähigkeit
  können wir unseren Wohlstand nicht erhalten. Unser Wohlstand ist die Grundlage für
  all das, was wir tun, für das, was wir an notwendigen Investitionen in unsere Verteidigung
  tätigen müssen, für das, was wir an notwendigen Investitionen in die Infrastruktur
  tätigen müssen, in die Bildung, in den Sozialstaat, in alles. Deshalb ist der Bundesregierung
  das Ziel, die Wirtschaft in all ihren Facetten zu stärken, so wichtig. Das ist kein
  Selbstzweck, und das ist kein Thema wie jedes andere. Das ist neben der Sicherheit
  das grundlegende Thema unseres Landes. Aber ohne eine wettbewerbsfähige Wirtschaft,
  ohne dass wir darüber unseren Wohlstand erhalten, ist all das, was wir auch für
  das Thema der Sicherheit brauchen, nicht möglich. Ich hatte gehofft, dass das irgendwie
  verfängt und wir uns nicht über einzelne Standorte unterhalten. Aber das ist jedenfalls
  der Grund, warum ich mich nicht zu einzelnen Standorten äußere. Ich hoffe, dass
  Zwickau, solange es in Sachsen liegt, mit Sachsen-Anhalt nicht so schrecklich viel
  zu tun haben wird. Gleichzeitig, Herr Hille, an der Stelle die Frage vor Montag
  ‑ ‑ ‑ Ich habe nicht gesagt, dass das in Sachsen-Anhalt liegt. Nein, ich weiß, nicht
  Sie. Ich wollte es nur einmal in das Protokoll hineingeschrieben haben. Ich würde
  jetzt trotzdem ganz gerne ganz konkret vor diesem Sonntag, vor dieser Landtagswahl
  in Sachsen-Anhalt , noch von Ihnen wissen, was diese Bundesregierung, wie sie jetzt
  seit einem Jahr und einigen Monaten amtiert, konkret Gutes für Sachsen-Anhalt getan
  hat. Jetzt kommen wir von den großen Fragen zu den ganz großen, denke ich. In Anbetracht
  der Zeit ‑ ich sage es noch einmal: bald laufen wir auf die 90 Minuten zu ‑ kann
  ich die Antwort relativ kurz halten, weil all das, was ich gerade ausführlich darzustellen
  versucht habe, natürlich auch für Sachsen-Anhalt, aber auch für Niedersachsen, für
  Bayern, für Schleswig-Holstein und für alle anderen deutschen Bundesländer gilt:
  Wir arbeiten aus den gerade sehr, sehr ausführlich erläuterten Gründen daran, Deutschland
  als Ganzes wirtschaftlich erfolgreich zu halten, und natürlich gilt das auch für
  Sachsen-Anhalt. Von daher differenziere ich nicht, und das kann eine Bundesregierung
  auch nicht tun, zwischen Politik für den Bund und Politik für einzelne Bundesländer,
  sondern wir machen Politik für das gesamte Land und für alle Bürgerinnen und Bürger.
  Ich will nur einmal kurz für die Bundespressekonferenz festhalten, dass diese Bundespressekonferenz
  so lange dauert, bis die letzte Frage in diesem Raum gestellt worden ist! Das ist
  die Vereinbarung. Wir haben vereinbart, dass wir in der Regel eine Stunde haben,
  und es gibt davon auch immer wieder Ausnahmen. Möglicherweise ist heute ein Tag
  der Ausnahmen. Dann haben wir noch zwei Nachlieferungen des Auswärtigen Amtes und
  des BMVg, zuerst das Auswärtige Amt. Ich kann es ganz kurz machen. Dabei ging es
  um die Frage der Bezeichnung der Falkland-Inseln . Es ist so, wie ich es gesagt
  habe: Da gibt es die beiden Bezeichnungen. Die stehen dann entweder nebeneinander,
  mit Schrägstrich oder in Klammern. Darin, wie Sie das schreiben wollen, sind Sie
  ganz frei. Ich habe auch noch eine Nachlieferung zu diesen sogenannten Fokusreisen.
  Das waren diese Reisen für Interessierte nach Litauen . Daran gibt es ein sehr,
  sehr großes Interesse. Wir führen diese Reisen seit Mai durch, und tatsächlich ist
  erst gestern die sechste Reise zu Ende gegangen. Auch die siebte und die achte Reise
  befinden sich schon für den September und den Oktober in der Ausplanung. Es ist
  eine hohe zweistellige Anzahl an Teilnehmenden, die dann mitfliegen werden. Ich
  würde mich über eine konkrete Zahl freuen.'
