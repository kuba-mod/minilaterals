  auch betont ‑, dass der Dienst in Litauen für viele Kameradinnen und Kameraden auch
  sehr wohl sehr attraktiv ist. Beispielsweise im Bereich von CIR haben wir mehr Freiwilligenmeldungen,
  als wir tatsächlich in Litauen einsetzen können, sodass es hier wirklich darum geht,
  zu schauen, wie sich diese Maßnahmen auswirken. Aber dann ist die Frage, auch in
  entsprechenden internen Gesprächen, denen ich hier natürlich weder vorgreifen kann
  noch die ich irgendwie terminlich bestätigen möchte, ob wir für einzelne Posten
  von diesem Grundsatz der Freiwilligkeit abrücken müssen. Jetzt noch einmal ganz
  kurz nachgefragt, weil ich das einfach nicht auf dem Schirm habe: Seit wann besteht
  diese Möglichkeit, nach Litauen zu reisen, und wie oft wurde die bereits wahrgenommen?
  Können Sie uns dazu etwas sagen? Diese Reisen finden bereits seit mehreren Wochen
  statt. Ich kann jetzt tatsächlich akut nicht eine absolute Zahl nennen, wie oft
  das schon durchgeführt wurde, aber ich kann gerne einmal schauen, inwiefern ich
  Ihnen das nachreichen kann. Ich hätte vielleicht danach noch einmal ein separates
  Israel-Thema, oder falls Sie das zusammenbringen können, umso besser. - Herr Giese,
