  muss der Unterricht gekürzt werden, Klassen werden auf eine Größe von 50 Kinder
  pro Lehrkraft ausgeweitet. Das Problem ist ja diese 100 Millionen Dollar große Finanzierungslücke.
  Der Generalsekretär hat auch Deutschland aufgefordert, die Lücke zu schließen, natürlich
  gemeinsam mit anderen Staaten. Was haben Sie bisher dafür getan? Ich glaube, wir
  haben hier schon sehr, sehr häufig über unsere Unterstützung im humanitären, aber
  auch im Bildungsbereich und in sehr, sehr vielen Bereichen sowohl für die Arbeit
  der Palästinensischen Autonomiebehörde als auch für VN-Organisationen, die da vor
