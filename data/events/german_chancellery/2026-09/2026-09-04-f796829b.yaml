  recht. Darauf bezieht sich meine Aussage natürlich auch nicht, sondern auf die Tatsache,
  dass es zu einer Einigung gekommen ist, weil ansonsten möglicherweise noch viel
  größere Probleme und Arbeitsplatzverluste im Raum gestanden hätten. Deshalb ist
