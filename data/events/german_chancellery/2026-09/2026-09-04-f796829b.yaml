date: '2026-09-04'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 4. September 2026
text: 'stellvertretender Regierungssprecher Hille (Vorsitzender Feldhoff eröffnet
  die Pressekonferenz und begrüßt SRS Hille sowie die Sprecherinnen und Sprecher der
  Ministerien.) (zu den Terminen des Bundeskanzlers) Am Mittwoch, den 9. September,
  findet ab 9 Uhr die Generaldebatte im Deutschen Bundestag zum Bundeshaushalt 2027
  statt. Wie üblich, wird der Bundeskanzler als zweiter Redner das Wort ergreifen.
  Als Servicehinweis: Wegen der Generaldebatte findet in der kommenden Woche keine
  Kabinettssitzung statt, weil die Generaldebatte üblicherweise bis zum Mittag dauert.
  Am Mittwochnachmittag empfängt der Bundeskanzler den Präsidenten des Europäischen
  Rates , António Costa, ab 17 Uhr im Bundeskanzleramt . Das Treffen findet im Rahmen
  der jährlichen Hauptstadtreise des Präsidenten statt, der sogenannten „Tour des
  Capitales“. Inhaltlich wird es um die bevorstehenden Treffen des Europäischen Rates
  im zweiten Halbjahr 2026 gehen. Im Zentrum des Austausches wird natürlich auch der
  Mehrjährige Finanzrahmen, MFR, stehen. Im Anschluss an das Treffen ist eine Pressekonferenz
  vorgesehen. Am Donnerstag, den 10. September, empfängt der Bundeskanzler im Bundeskanzleramt
  die Leiterinnen und Leiter der deutschen Auslandsvertretungen - aka Botschafterinnen
  und Botschafter. Sie werden sich im Rahmen der jährlichen Botschafterkonferenz in
  Berlin aufhalten. Der Bundeskanzler wird diese Gelegenheit nutzen, um den Botschafterinnen
  und Botschaftern seine außenpolitischen Prioritäten darzustellen. Im Anschluss wird
  er mit den Kolleginnen und Kollegen auch in eine Diskussion einsteigen. Am Donnerstagnachmittag
  wird Bundeskanzler Merz gegen 16 Uhr den Staatspräsidenten der Vereinigten Arabischen
  Emirate , Scheich Mohammed Bin Zayed, im Bundeskanzleramt empfangen . Im Vordergrund
  dieses Gesprächs werden unter anderem der Ausbau der strategischen Partnerschaft,
  die Vertiefung der wirtschaftlichen Beziehungen sowie das gemeinsame Engagement
  für Frieden und Stabilität im Nahen und Mittleren Osten stehen. Mohamed bin Zayed
  ist am Donnerstag im Rahmen eines Staatsbesuchs beim Bundespräsidenten hier in Deutschland.
  In diesem Rahmen findet dann auch das Gespräch mit dem Bundeskanzler statt. Die
  Bundesministerin für Forschung, Technologie und Raumfahrt, Dorothee Bär , wird am
  9. und 10. September in Vertretung des Bundeskanzlers am International Space Summit
  in Paris teilnehmen. Am 9. September wird die Ministerin gemeinsam mit dem französischen
  Forschungsminister Philippe Baptiste an der Eröffnung teilnehmen. Sie wird ihre
  Reise zum International Space Summit nutzen, um am Rande bilaterale Gespräche mit
  Amtskolleginnen und -kollegen zu führen. Die Bedeutung der Raumfahrt für Deutschlands
  Wettbewerbsfähigkeit, technologische Souveränität und auch Sicherheit ist immens.
  Raumfahrt ist als strategisches Forschungsfeld Teil der Hightech Agenda Deutschland,
  mit der wir Deutschland zum Toptechnologieland machen. Der Austausch mit internationalen
  Partnern zu den Themen der Raumfahrt leistet hierzu einen essenziellen Beitrag.
  Es wurde gerade schon erwähnt, ich möchte das aber für das Auswärtige Amt noch einmal
  ausführlich sagen: Vom 7. bis zum 11. September findet die jährliche Konferenz der
  Leiterinnen und Leiter der 225 deutschen Auslandsvertretungen im Auswärtigen Amt
  statt. Das ist ein Arbeitstreffen, bei dem die Leiterinnen und Leiter der deutschen
  Auslandsvertretungen mit den Führungskräften und der Hausleitung in Berlin zusammenkommen.
  Sie treffen dabei unter anderem Vertreterinnen und Vertreter aus Politik, Wirtschaft,
  Wissenschaft und Kultur. In diesem Jahr werden erneut Abgeordnete aus dem Bundestag
  sowie Vertreterinnen und Vertreter anderer Ressorts in Praxiswerkstätten und auf
  Panels vertreten sein und mit den Leiterinnen und Leitern in einen Dialog treten.
  Die drei Schwerpunktthemen der Konferenz sind in diesem Jahr Sicherheit, Handel-
  und Außenwirtschaftsförderung sowie Digitalisierung, Technologie und künstliche
  Intelligenz. Am Montagmorgen wird der Außenminister die angereisten Leiterinnen
  und Leiter im Auswärtigen Amt begrüßen. Am Montagmittag wird Außenminister Wadephul
  mit Digitalminister Wildberger im Plenum darüber diskutieren, wie wir unseren Staat
  und das Auswärtige Amt digitaler, unbürokratischer und fit für die Zukunft machen.
  Die Veranstaltungen am Montag sind AA-intern. Am Dienstag findet dann der traditionelle
  Wirtschaftstag der Konferenz statt. Hier kommen die Leiterinnen und Leiter mit Vertreterinnen
  und Vertretern aus der Wirtschaft zusammen, um sich über die aktuellen Ziele und
  Herausforderungen der Außenwirtschaft auszutauschen. Als Ehrengast des Wirtschaftstages
  wird EU-Handelskommissar Šefčovič zu Gast sein. Der Donnerstag steht dann ganz im
  Zeichen der Sicherheit, wenn wir NATO-Generalsekretär Rutte bei der Abschlussveranstaltung
  im Auswärtigen Amt begrüßen können. Die Wirtschaftsveranstaltung und die Plenumsveranstaltung
  am Abschlusstag sind presseöffentlich. Meine Frage geht an das Auswärtige Amt. Bei
  den Schwerpunkten, die Sie genannt haben, fällt auf, dass ein Schwerpunkt fehlt,
  der für die deutsche Außenpolitik doch mindestens im vergangenen Jahr sehr wichtig
  war, nämlich das Ansehen oder auch teilweise der Reputationsverlust deutscher Politik
  in der Welt im Kontext des Krieges in Nahost. Ist das kein Thema, oder schwingt
  sowieso immer mit, wie die Botschafter diese Veränderungen wahrnehmen und ob sie
  Empfehlungen an die Bundesregierung haben, wie man sich dazu positioniert? Darauf
  würde ich so antworten, dass ich mir die Prämisse Ihrer Frage wirklich gar nicht
  zu eigen machen will, dass es hier irgendeine Art von Ansehensverlust, wie Sie es
  formuliert haben, gibt. Das entspricht nicht den Tatsachen. Im Übrigen habe ich
  die Schwerpunkte, die dort besprochen werden, vorgetragen. Das ist natürlich kein
  abschließender Bericht über alle Themen, die dort besprochen werden. Die Art und
  Weise, wie Deutschland in der Welt wahrgenommen wird, wie wir beispielsweise die
  globalen Partnerschaften in dieser Welt der großen Umbrüche ausbauen, ist natürlich
  ein überschneidendes Thema. Ohne mir irgendeine der Prämissen Ihrer Frage zu eigen
  zu machen, kann ich sagen: Das ist natürlich eine Schwerpunktsetzung. Das bedeutet
  aber nicht, dass es abschließend ist, sondern dort werden natürlich globale Themen
  besprochen. Das Ansehen und die Partnerschaften Deutschlands in der Welt sind dort
  natürlich ganz zentral. Das ist das überwölbende Thema von Außenpolitik, wenn Sie
  so wollen. Wenn ich noch anmerken darf: Die Wahrnehmung eines Ansehensverlustes
  ist ja nicht die Privatmeinung eines einzelnen Journalisten, sondern das drückt
  sich für viele Beobachter auch in der Wahl zum Sicherheitsrat aus, und das ist auch
  die Beobachtung von anderen, auch ehemaligen Außenministern. Das wird innerhalb
  des Auswärtigen Amtes aber nicht so gesehen? Ich denke, ich habe das gerade beantwortet.
  Herr Hille, ich würde gern verstehen, ob die Prioritätensetzung, die der Bundeskanzler
  gegenüber den Botschaftern äußert, explizit auch den Bereich der Klimadiplomatie
  einschließt. Nach den Worten in Hürtgenwald wäre das ja eine logische Folge. Wie
  es bei Gesprächen ist, die in der Zukunft liegen: Sie wissen, dem können wir nicht
  vorgreifen. Aber ich würde gar keine Liste aufstellen und irgendwelche Themen ausschließen.
  Die Leiterinnen und Leiter der Auslandsvertretungen sind die Ohren und das Gesicht
  Deutschlands in der Welt. Dort stehen grundsätzlich alle Themen auf dem Zettel,
  die von Relevanz sind. Deshalb mache ich weder eine Positiv- noch eine Negativliste
  über Themen, um die es gehen wird. Herr Hille, ich habe Sie jetzt, ehrlich gesagt,
  so verstanden, dass der Bundeskanzler seine Prioritäten den Botschaftern mitgeben
  möchte. Habe ich das jetzt irgendwie falsch verstanden? Nein, das haben Sie nicht
  falsch verstanden. Das haben Sie richtig verstanden. Aber das eine schließt das
  andere ja nicht aus. Zwischen „Prioritäten mitgeben“ und „keine Themen ausschließen“
  sehe ich, ehrlich gesagt, keinen Widerspruch. Herr Hille, wird es am Donnerstag
  nach dem Treffen des Bundeskanzlers mit dem Gast aus den Vereinigten Arabischen
  Emiraten eine Pressebegegnung, eine Pressekonferenz geben? Das ist nicht vorgesehen,
  und zwar aus folgendem Grund: Das Ganze ist ein Staatsbesuch und findet dann ‑ das
  wissen Sie ja ‑ unter sehr klaren protokollarischen Rahmenbedingungen statt. Der
  Präsident ist zuerst bei unserem Bundespräsidenten. Dort finden auch alle Presseelemente
  statt. Was dort an Presseelementen vorgesehen ist, müssten Sie bitte im Präsidialamt
  erfragen. Dieses Land spielt ja durchaus eine Rolle, was die Energieversorgung angeht.
  Gibt es einen dringenden Redebedarf seitens der Bundesregierung angesichts der Gasspeicherfüllstände?
  Natürlich geht es um die Vertiefung wirtschaftlicher Beziehungen. Es geht auch um
  gegenseitige Investitionstätigkeiten in den Ländern. In diesen Bereich fallen natürlich
  auch Fragen zur Energie. Das ist ja klar. Wenn Energie ein Thema ist, das auf jeden
  Fall adressiert wird, dann würde ich natürlich auch gerne wissen, ob auch das Rüstungsthema
  noch einmal ein besonderer Schwerpunkt der Gespräche mit diesem speziellen Partner
  sein wird. Dazu würde ich auf meine Antwort auf die vorherige Frage verweisen, was
  das Thema einer Positiv- und Negativliste angeht. Grundbogen: wirtschaftliche Beziehungen,
  Investitionstätigkeiten, gemeinsame Rolle für Frieden in der Region im Nahen Osten.
  Was dann rechts und links noch an Themen zur Sprache kommt, werden wir gerne im
  Nachklapp besprechen. Auch ich möchte jetzt dem Besuch nicht vorgreifen. Wir werden
  dann sicherlich laufend und im Nachgang auf unseren Kanälen informieren. Herr Hille,
  die Vereinigten Arabischen Emirate, aber vor allem auch Dubai machen immer wieder
  Schlagzeilen, weil Kriminelle das Land nutzen, um sich dort vor Strafverfolgung
  auch in Europa zu verstecken, und dort aber oft auch in der Öffentlichkeit leben.
  Da hat es in den vergangenen Jahren immer wieder auch prominente Fälle gegeben,
  Stichwort auch „Finanzkriminalität“. Können Sie sagen, wie die Bundesregierung gerade
  auch bei der Strafverfolgung deutscher Straftäter mit den Vereinigten Arabischen
  Emiraten zusammenarbeitet und wie sie die Kooperationsbereitschaft dort bewertet?
  Da würde ich qua Zuständigkeit nach rechts und links schauen. Entweder das AA oder
  Herr Bowinkelmann, was die Strafverfolgung angeht, sind, glaube ich, die besseren
  Ansprechpartner. ‑ Können Sie etwas sagen, Herr Bowinkelmann? Das wäre die internationale
  Zusammenarbeit in Strafsachen. Ich glaube, das liegt zwischen dem Auswärtigen Amt
  und dem BMJV. Dann erweitern wir die Reihe um das BMJV. Ich muss gestehen, dass
  ich den aktuellen Sachstand nicht dabei habe. Ich kann noch einmal nachschauen und
  auch etwas nachliefern. Ich weiß aber, dass wir mit den Vereinigten Arabischen Emiraten
  im Austausch sind, was die strafrechtliche Kooperation angeht. Zu Einzelheiten von
  Verfahren äußern wir uns sowieso nicht. Aber wir sind auch in Verhandlungen über
  ein Rechtshilfeabkommen mit den Vereinigten Arabischen Emiraten, um die Zusammenarbeit
  in diesem Bereich zu verbessern. Dazu habe ich den aktuellen Sachstand nur leider
  nicht dabei. Wenn Sie „verbessern“ sagen und etwas nachreichen würden, wäre ich
  Ihnen dankbar, wenn Sie dann vielleicht auch eine Bewertung abgeben könnten, wie
  gut es läuft und ob es dabei möglicherweise Probleme gibt. Herr Giese, weil die
  Bundesregierung ja auch immer betont, dass man sich weiterhin dafür einsetzt, dass
  der Bürgerkrieg im Sudan ein Ende findet ‑ das sind ja nach wie vor sehr brutale
  Massaker ‑, wüsste ich gerne, ob dieser Staatsbesuch auch in diesem Sinne zwischen
  AA und Regierungschef, also dem Kanzler, genutzt wird. Ganz grundsätzlich schließe
  ich mich dazu dem an, was schon gesagt worden ist. Dieser Besuch findet in der kommenden
  Woche statt. Ich kann den Inhalten jetzt nicht vorgreifen, kann aber darauf hinweisen,
  wie sich die Bundesregierung in Bezug auf die Beendigung des Bürgerkrieges in Sudan
  engagiert. Sie wissen, dass es auf Einladung von Außenminister Wadephul im vergangenen
  Jahr eine große Sudankonferenz in Berlin gab. Es gibt auch mehrere Arbeitsstränge,
  die sich davon ableiten und an denen weitergearbeitet wird. Ganz klar ist: Es gibt
  eine teilweise Stabilisierung, aber das ist bei Weitem noch nicht genug. Alle, die
  Einfluss auf die Konfliktparteien haben, tragen die Verantwortung dafür, dass das
  Leid der Menschen im Sudan endlich beendet wird. Deswegen rufen wir alle auf, die
  Einfluss auf die Konfliktparteien haben, diesen Einfluss geltend zu machen, um diesen
  Konflikt und die schreckliche humanitäre Katastrophe, die mit diesem Konflikt einhergeht,
  endlich zu beenden. Insbesondere Waffenlieferungen an die Konfliktparteien verlängern
  den Krieg und das Leid der Menschen. Das ist die klare Position der Bundesregierung.
  Im Übrigen, wie gesagt, würde ich den Gesprächen in der kommenden Woche ungern vorgreifen.
  Das ist aber die Position der Bundesregierung. Wer ist denn mit „alle“ gemeint,
  also die relevanten Player? Alle, die dort Waffen liefern und diesen Konflikt verschärfen,
  die von außen auch mit finanzieller Unterstützung diesen Konflikt anheizen. Ich
  denke, wer da gemeint sein könnte, kann man mit einer Recherche schnell herausfinden.
  Das können wir machen, aber ich will Ihren offiziellen Stand wissen. Wer sind für
  die Bundesregierung diese relevanten Player? Aber Sie können gerne noch einmal schauen,
  wen wir alles zu dieser Sudankonferenz eingeladen haben. Dort war eine ganze Reihe
  von Ländern dabei, die in diesen Konflikt involviert waren und weiterhin sind, die
  eine der beiden Seiten unterstützen. Teilweise gibt es auch Unterstützer beider
  Seiten. In Bezug auf diese ganzen Aktivitäten sagen wir ganz klar: Wir wollen, dass
  dieser Konflikt endet, und deswegen müssen auch Waffenlieferungen, Unterstützungen
  und Anheizen dieses Konfliktes enden. Das sagen wir allen direkt. Aber diese Gespräche
  finden üblicherweise nicht vor laufender Kamera statt. Ich habe eine Frage an das
  Wirtschaftsministerium. Wird es ein Treffen von Frau Reiche mit dem Gast aus den
  VAE geben? Wir kündigen Termine dann an, wenn sie anstehen. Das steht ja nächste
  Woche an. Deswegen wurde der Termin gerade angekündigt. Herr Hille, ich habe eine
  Nachfrage zu einem Termin, den Sie gar nicht genannt haben und der am Dienstag stattfindet.
  Es gab eine Medienberichterstattung , dass der Kanzler auch das Präsidium der EZB
  empfängt oder sich mit ihm trifft. Können Sie uns dazu etwas sagen? Wie das so ist,
  kündigen wir am Freitag die öffentlichen Termine des Bundeskanzlers hier an dieser
  Stelle an. Das habe ich gerade getan. Mehr kann ich Ihnen dazu nach jetzigem Stand
  nicht sagen. Es findet also ein Treffen statt, aber es ist nicht öffentlich? Das
  kann ich Ihnen gerade tatsächlich nicht sagen. Aber vielleicht finden wir das noch
  heraus, während die PK läuft. Im Moment weiß ich es nicht. (zur Reise von Bundesministerin
  Bär zum International Space Summit in Paris ) Frau Grüneberg, wie schaut es mit
  der Unterstützung des BMFTR bzw. der Bundesrepublik für Iris² in seiner aktuellen
  Iteration aus? Wird das dort Thema sein? Gibt es darüber mit der französischen Seite
  derzeit einen Dissens? Zu dieser expliziten Frage müsste ich Ihnen etwas nachliefern.
  Natürlich geht es um die Themen Wettbewerbsfähigkeit, technologische Souveränität
  und Sicherheit. In diesem Rahmen wird die Ministerin sprechen. Wahrscheinlich dann
  auch gleich für die Nachlieferung: Ist Frankreich am GOVSATCOM-Hub in Köln mit beteiligt
  oder nicht? Ich vermute: Nachlieferung. Frau Grüneberg, Sie haben gesagt, dass die
  Ministerin in Vertretung des Kanzlers dorthin fliegt. Warum nimmt der Kanzler nicht
  daran teil? Der Hintergrund der Frage ist, dass die amerikanische Regierung offenbar
  US-Firmen und hohe Vertreter aufgefordert hat, nicht an dieser Konferenz in Frankreich
  teilzunehmen. Gibt es einen politischen Grund, warum der Kanzler nicht daran teilnimmt?
  Ich habe bei den Terminen unter anderem auf die Generaldebatte im Bundestag verwiesen,
  die am Mittwoch stattfindet und relativ lange dauert. Das ist aber eine zweitägige
  Konferenz, glaube ich. Es gäbe ja durchaus noch Möglichkeiten, einen Slot zu finden.
  Ich habe hier aber gerade auch zwei Termine für den Donnerstag vorgestellt, sodass
  sich zwischen Generaldebatte und den Donnerstagsterminen, ehrlich gesagt, nicht
  viel Raum ‑ um genau zu sein: kein Raum ‑ ergibt. Zum Thema von Russland und der
  Ukraine: In der Politik bleibt der Feind nicht immer der Feind ‑ und auch der Freund.
  Gibt es noch Kommunikationswege nach Russland oder nicht mehr? Gibt es noch Beziehungen
  oder sonst irgendetwas? Wenn nein: Ist die Bundeswehr in Alarmbereitschaft, gegen
  Russland zu schießen? Dazu würde ich gerne auf das Bezug nehmen, was der Außenminister
  gesagt hat, als er die Attribuierung in dieser Woche vorgenommen hat. Er hat gesagt,
  dass uns, der Bundesregierung, Deutschland insgesamt, natürlich auch an konstruktiven
  Beziehungen zur russischen Föderation gelegen ist. Allerdings gibt es die Herausforderung,
  dass dazu auch ein Mindestmaß an Kooperationsbereitschaft von der anderen Seite
  erforderlich ist. Das sehen wir vor dem Hintergrund der aufgedeckten Anschläge und
  der von uns attribuierten Anschläge in Leipzig leider nicht. Das fügt sich in eine
  ganze Reihe von Vorgängen und Feindseligkeiten gegenüber der Bundesrepublik Deutschland
  ein. Insofern: Ja, es gibt natürlich eine Kommunikation. Wir haben weiterhin eine
  Botschaft in Moskau. Es gibt weiterhin eine Botschaft der Russischen Föderation
  hier. Es gibt die üblichen diplomatischen Kontakte, die dafür erforderlich sind,
  dieses Arbeiten aufrechtzuerhalten. Aber wie sich die Situation gerade darstellt,
  haben der Außenminister und der Innenminister in dieser Woche sehr deutlich gemacht.
  Dem würde ich jetzt ungern etwas hinzufügen wollen. Ich glaube, das steht für sich.
  Russland hat die kulturellen Stiftungen unter anderem in Moskau und Sankt Petersburg
  geschlossen. Wie geht die Bundesregierung damit um? Wird das Personal abgezogen,
  oder verbleibt es dort? Wie sind dazu der Stand und die Perspektive? Dazu hat sich
  Außenminister Wadephul gestern geäußert. Er hat die angekündigte Maßnahme bedauert.
  Das war eine Äußerung von Außenminister Lawrow, zu der wir zum jetzigen Stand die
  genauen Einzelheiten nicht kennen. Das war eine öffentliche Äußerung. Der Minister
  hat unterstrichen, dass sich das Goethe-Institut jeden Tag für die Kulturbeziehungen
  und den gesellschaftlichen Austausch zwischen Deutschland und Russland starkmacht
  und dass es letztlich ein Verlust im Austausch zwischen unseren Ländern ist. Darüber,
  wie die genaue Abwicklung dieser Arbeiten nun stattfindet, würde ich hier ungern
  spekulieren. Darüber, wie das genau umgesetzt wird, wird uns die Russische Föderation
  informieren. Ja, es gibt dort entsandte Mitarbeiterinnen und Mitarbeiter. Sie müssten
  dann wahrscheinlich das Land verlassen. Aber Weiteres kann ich an dieser Stelle
  nicht mitteilen. Das ist der Hintergrund der Frage. Es gab ja auch schon in der
  Vergangenheit Schließungen von Goethe-Instituten. Soweit mir bekannt ist, wurde,
  wenn das dauerhaft verfügt wurde, das Personal abgezogen. Das ist also etwas, womit
  hier auch zu rechnen ist, richtig? Können Sie sagen, um wie viele Personen es sich
  dabei in etwa handelt? Nein, zum Schutz der Beschäftigten kann ich Ihnen das nicht
  sagen. Ich kann Ihnen aber sagen: Es gibt dort entsandte Mitarbeiterinnen und Mitarbeiter
  aus Deutschland. Wenn diese Kolleginnen und Kollegen das Land verlassen würden,
  dann hätte das natürlich auch Auswirkungen beispielsweise auf den Deutschunterricht
  in Schulen in Russland, die ein verstärktes Deutschangebot haben. Es gibt es eine
  ganze Reihe von Partnerschulen in diesem Bereich. Diese Deutschtests, die standardisiert
  sind, in Deutschland anerkannt und dort durchgeführt werden, werden auch von den
  Mitarbeiterinnen und Mitarbeitern beispielsweise des Goethe-Instituts abgenommen.
  Insofern hat das auch eine Wirkung auf den Deutschunterricht in ganz Russland. Wir
  bedauern sehr, dass es dazu kommt. Aber es ist eine Entscheidung der Russischen
  Föderation, das so zu tun. An Herrn Giese oder Herrn Hille: Die Schließung der Goethe-Institute
  ist ja eine Reaktion auf die Schließung des Russischen Hauses hier in Berlin. Plant
  die Bundesregierung, darauf wiederum mit Gegenmaßnahmen zu reagieren? Wir haben
  diese Schließung verfügt. Ich habe am Mittwoch erklärt, was es damit auf sich hat
  und welche Folgen das auch für die entsandten Mitarbeiterinnen und Mitarbeiter dort
  hat. Es gibt jetzt keinen weiteren Reaktionsbedarf. Um noch kurz bei dem Komplex
  der Goethe-Institute zu bleiben: Herr Giese, es gibt natürlich auch Ortsmitarbeiter
  ‑ ich nenne sie jetzt einmal Ortskräfte ‑, die für die Goethe-Institute gearbeitet
  haben. Was soll mit ihnen in absehbarer Zeit passieren? Gibt es für sie irgendeine
  Chance auf Visa in Deutschland, oder überlässt man sie Russland? Wie gesagt, wissen
  wir nicht, wie die genaue Maßnahme aussehen wird. Deswegen will ich darüber jetzt
  nicht spekulieren. Ich probiere es bei Herrn Hille, gegebenenfalls bei Herrn Giese.
  Die EU-Außenbeauftragte Kallas hat mit Blick auf Leipzig gesagt: „Es ist offensichtlich,
  dass dies alle Merkmale von staatlich gefördertem Terrorismus aufweist“. Ich glaube,
  es gab in dieser Woche, beginnend am Dienstag mit den Statements des Bundesinnenministers
  und des Bundesaußenministers und in Folge auch hier in der RegPK am Mittwoch, sehr
  viele Aussagen zu dem Komplex. Dem habe ich jetzt, ehrlich gesagt, nichts mehr hinzuzufügen.
  Es ist doch unsere Aufgabe, danach zu fragen. Sie sprechen ja hier von einem hybridem
  Angriff . Die Wortwahl der EU-Außenbeauftragten ist eine andere, nämlich „staatlich
  geförderter Terrorismus“, Staatsterrorismus. Ist das angesichts der Äußerung von
  Frau Kallas eine Wortwahl, die auch die Bundesregierung übernimmt oder kritisiert?
  Sie haben richtig zitiert. Wir sprechen von hybriden Angriffen. Deutschland ‑ nicht
  nur Deutschland, aber wir sitzen ja hier für die Bundesregierung ‑ ist hybriden
  Angriffen täglich ausgesetzt. Ich werde jetzt keine Qualifizierung vornehmen, ob
  der eine Begriff zutreffend ist oder nicht. Für uns geht es darum, wie wir mit diesen
  hybriden Angriffen umgehen. Das haben wir in dieser Woche auf den konkreten Vorfall
  in Leipzig sehr klar und auch sehr zügig getan. Alle weiteren Interpretationen,
  ob Sie den einen Begriff oder einen anderen passender finden, bleiben dann Ihnen
  überlassen. Ich würde das Thema jetzt gerne in Richtung des Inneren weiten, wenn
  wir schon so weit sind, und von Herrn Bowinkelmann wissen, was er uns darüber sagen
  kann, ob es irgendwelche weiteren Erkenntnisse über mögliche Zusammenhänge zwischen
  den verschiedenen Ereignissen gibt, die in den vergangenen fünf Wochen, glaube ich,
  gesehen und auch unterschiedlich attribuiert bzw. noch nicht attribuiert wurden.
  Ich weiß jetzt nicht, welche Ereignisse Sie mit einschließen, Aber wir haben ja
  jetzt gerade die Medienberichterstattung über mutmaßliche Sabotageakte. Die Ermittlungen
