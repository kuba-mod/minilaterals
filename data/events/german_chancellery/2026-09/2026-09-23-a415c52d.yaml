title: 'Staatsminister Weimer gratuliert Iris Berben zum Kulturpolitikpreis: „Mit
  Mut und Haltung für Demokratie und ein respektvolles Miteinander“'
text: 'Kulturstaatsminister Wolfram Weimer gratuliert Iris Berben vorab herzlich zur
  Verleihung des Deutschen Kulturpolitikpreises 2026 am morgigen Donnerstag: „Iris
  Berben hat als Schauspielerin Außergewöhnliches geleistet und unser kulturelles
  Leben über Jahrzehnte geprägt. Zugleich steht sie für ein entschlossenes Eintreten
  gegen Antisemitismus und Menschenfeindlichkeit, für eine lebendige Erinnerungskultur
  und die Sichtbarkeit jüdischen Lebens in Deutschland. Sie scheut den Widerspruch
  nicht und lässt sich von den Feinden der offenen Gesellschaft nicht einschüchtern.
  Mit Mut und Haltung setzt sie sich für Demokratie, Toleranz und ein respektvolles
  Miteinander ein. Damit ist sie für viele Menschen ein Vorbild. ‚Reagiere darauf,
  wie über Menschen geredet wird. Korrigiere.‘ Dieser Satz von Iris Berben bringt
  eine Haltung zum Ausdruck, die gerade heute von großer Bedeutung ist: die Komfortzone
  zu verlassen, Widerspruch zu wagen und Verantwortung für unser Miteinander zu übernehmen.
  Für dieses aufrichtige und inspirierende Engagement danke ich Iris Berben und gratuliere
  ihr zur Auszeichnung mit dem Deutschen Kulturpolitikpreis 2026 sehr herzlich.“ Der
  Deutsche Kulturpolitikpreis wird seit 2021 vom Deutschen Kulturrat für besondere
  kulturpolitische Verdienste vergeben.'
