title: 'Inzwischen mehr als 2.500 Unterstützerinnen und Unterstützer für das Bauhaus-Manifest
  — Staatsminister Weimer: „Jede Unterschrift ist ein Zeichen für Kunstfreiheit, Unabhängigkeit,
  Offenheit und Innovation“'
text: 'Die Unterstützung für das Bauhaus-Manifest 2026 wächst weiter. Inzwischen haben
  sich über 2.500 Kulturschaffende, Wissenschaftler, Handwerker, Designer und Architekten
  dem Bündnis angeschlossen. Auch zahlreiche Prominente, Institutionen und viele Privatpersonen
  haben unterzeichnet. Dazu Staatsminister Weimer: „Jeden Tag wächst die Unterstützung
  für das Bauhaus-Manifest weiter. Jede Unterschrift ist ein Zeichen für die Prinzipien
  von Kunstfreiheit, Unabhängigkeit, Offenheit und Innovation. Die Ideen des Bauhauses
  sind lebendig und das machen wir sichtbar. Es ist wichtig, dass wir die Bauhaus-Prinzipien
  in aller Deutlichkeit verteidigen.“ Wegen der großen Nachfrage an Unterstützung
  auch aus dem Ausland ist eine englische Version des Manifests in Arbeit. Auf Initiative
  von Staatsminister Wolfram Weimer hatten Ende August Verbände und Institutionen
  aus Kultur, Design, Handwerk, Architektur sowie Kirchen gemeinsam das Bauhaus-Manifest
  2026 unterzeichnet. Auch die sechzehn Länder hatten sich in der „ Dessauer Erklärung
  “ eindeutig zur Kunstfreiheit und zum Bauhaus positioniert. Gestern veröffentlichten
  die drei Bauhaus-Einrichtungen in Berlin, Dessau und Weimar eine gemeinsame Stellungnahme
  . Sie forderten dazu auf, das Bauhaus weiterzudenken und begrüßten ausdrücklich
  das Bauhaus-Manifest sowie die Positionierung der Länder. Das Bauhaus wurde 1919
  in Weimar gegründet. Nach seiner Vertreibung aus Weimar wurde es 1926 – vor genau
  100 Jahren – in Dessau wiedereröffnet. 1933 – inzwischen nach Berlin umgezogen –
  musste es unter dem Druck der Nationalsozialisten endgültig schließen. Das Bauhaus
  und seine Stätten in Weimar, Dessau und Bernau sind UNESCO-Welterbe. Wir laden dazu
  ein, das Bauhaus-Manifest 2026 auch weiterhin zu unterstützen und gemeinsam ein
  Zeichen für Freiheit, Offenheit und Kreativität zu setzen. Wer das Manifest unterstützen
  möchte, kann sich hier informieren und seine Unterstützung erklären: https://adk.de/bauhaus-manifest-2026'
