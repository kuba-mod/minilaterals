title: Im Kabinett beschlossen Besserer Schutz für Zugbegleiter, Rettungskräfte und
  Feuerwehrleute
text: 'Wer Einsatzkräfte behindert oder angreift, soll härter bestraft werden können.
  Angriffe auf Polizeibeamte, Gerichtsvollzieher, Ärzte, Pflegekräfte, Beschäftigte
  der Bahn, kommunaler Verkehrsbetriebe und Energieversorger sollen künftig härter
  bestraft werden. Damit reagiert die Bundesregierung auf besorgniserregende Vorfälle,
  bei denen diese Personengruppen das Ziel von Angriffen waren. Der Gesetzentwurf
  stellt für das Gemeinwohl tätige Beschäftigte unter einen besonderen strafrechtlichen
  Schutz. Denn: Angriffe auf sie sind verwerflich. Der Rechtsstaat schützt die, die
  für andere da sind. Es geht um den Schutz unseres Gemeinwesens und unseres Zusammenlebens.
  Ein Gericht soll künftig eine höhere Strafe verhängen können, wenn eine Straftat
  eine Tätigkeit beeinträchtigt, die dem Gemeinwohl dient. Zudem sieht der Gesetzentwurf
  eine Strafrahmenerhöhung für die Behinderung von beziehungsweise den tätlichen Angriff
  auf Polizeibeamte, Feuerwehrleute, Rettungs- und andere Einsatzkräfte vor. Wer diese
  Personen tätlich angreift, soll künftig mit einer Freiheitsstrafe von mindestens
  sechs Monaten bestraft werden. Die Bundesregierung erweitert ferner den besonderen
  strafrechtlichen Schutz um andere Berufsgruppen, wie Ärzte, medizinisches Personal,
  Zugbegleiter und weitere Beschäftigte von sogenannten gemeinschaftswichtigen Unternehmen.
  Mit dem Gesetzentwurf werden außerdem die Vorschriften zur Nötigung von Verfassungsorganen,
  um die europäische- und kommunale Ebene erweitert. Schließlich bekommen die Gerichte
  bei einer Verurteilung wegen Volksverhetzung die Möglichkeit, den Entzug des passiven
  Wahlrechts auszusprechen – wenn eine Freiheitsstrafe von mindestens einem Jahr verhängt
  wird.'
