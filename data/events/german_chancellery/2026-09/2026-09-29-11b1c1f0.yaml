date: '2026-09-29'
type: press_release
source_name: german_chancellery
title: Pressekonferenz von Bundeskanzler Merz und dem Staatspräsidenten Kasachstans,
  Tokajew Enge Partner für Energie und Frieden
text: 'Kasachen und Deutsche seien auch kulturell sehr nah, sagte Bundeskanzler Merz
  beim Empfang des kasachischen Präsidenten Tokajew in Berlin. Kasachstan sei Deutschlands
  wichtigster Handelspartner in Zentralasien, sagte Bundeskanzler Friedrich Merz beim
  Besuch des kasachischen Präsidenten Kassym-Schomart Tokajew am Dienstag in Berlin.
  Er wies auf die Aufnahme diplomatischer Beziehungen beider Länder vor 35 Jahren
  hin. Dass Kasachstan Russland zum Einlenken bei seinem Angriffskrieg gegen die Ukraine
  aufgerufen habe, verdiene größten Respekt, so Merz. Der Mittlere Korridor (Transkaspische
  Route) ist eine Handels- und Transportroute zwischen Asien und Europa. Er führt
  von China über Zentralasien und den Kaukasus in die EU und umgeht dabei Russland.
  Seit dem russischen Angriffskrieg gegen die Ukraine dient der Mittlere Korridor
  als wichtige Alternative, um Lieferketten und Energietransporte unabhängig von Moskau
  abzusichern. (Die Protokollierung des fremdsprachlichen Teils erfolgte anhand der
  Simultandolmetschung.) Meine Damen und Herren, herzlich willkommen! Ich heiße den
  Staatspräsidenten aus Kasachstan besonders herzlich willkommen in Berlin. Sehr geehrter
  Präsident Tokajew, herzlich willkommen in Berlin! Ich freue mich sehr, dass wir
  uns heute zum ersten Mal treffen und dass wir Gelegenheit haben, auch über unsere
  Zusammenarbeit zu sprechen. Wir feiern in diesen Tagen 35 Jahre diplomatischer Beziehungen
  zwischen unseren beiden Ländern, und wir können sagen, dass wir 35 Jahre am Wohlstand
  und an der Sicherheit unserer Bürgerinnen und Bürger gearbeitet haben. Wir haben
  uns heute auch über die internationale Lage ausgetauscht. Wir haben sehr intensiv
  über Russland und über den Krieg gesprochen, den Russland gegen die Ukraine führt.
  Ich habe unsere Haltung zu diesem Krieg deutlich gemacht. Wir arbeiten sehr ernsthaft
  an Verhandlungen, aber wichtig ist und bleibt, dass Russland nach bald fünf Jahren
  diesen Krieg beenden und dazu bereit sein muss, in ernsthafte Verhandlungen einzutreten.
  Friedensverhandlungen kann es natürlich nur mit den Europäern am Tisch geben. Ziel
  solcher Friedensverhandlungen muss eine souveräne Ukraine in einem sicheren Europa
  sein. Solange Russland zu diesem Frieden nicht bereit ist, wird die Bundesregierung
  die Unterstützung der Ukraine fortsetzen. Wir leisten diese Hilfe mit unseren Partnern.
  Ich will es wiederholen: Diese Hilfe dient nicht dazu, den Krieg zu verlängern.
  Diese Hilfe dient ausschließlich dazu, die Führung in Moskau zum Einlenken zu bewegen.
  Meine Damen und Herren, wir haben natürlich auch über unsere bilateralen Beziehungen
  gesprochen. Wirtschaftliche Fragen haben dabei eine sehr große Rolle gespielt. Kasachstan
  ist Deutschlands wichtigster Handelspartner in Zentralasien. Das wollen wir weiter
  ausbauen, auch mit dem für heute Abend geplanten Wirtschaftsforum in Berlin. Ich
  begrüße deshalb unsere gemeinsame Roadmap für die Jahre von 2026 bis 2028. Mit ihr
  bringen wir unsere Zusammenarbeit zu Industrie, Technologie und Rohstoffen voran.
  Wir haben uns auch auf die Förderung gemeinsamer Analysen für unsere Lieferketten
  geeinigt. Wir wollen uns enger verbinden. Dafür wollen wir resiliente Logistikketten
  und den Mittleren Korridor weiter ausbauen. Kasachstan leistet schon heute einen
  wichtigen Beitrag zur europäischen Ölversorgung. Der deutsch-kasachische Energiedialog
  beweist hierbei seinen großen Wert. Herr Präsident, ich möchte mich sehr herzlich
  auch für die sehr freundlichen Worte bedanken, die Sie zur Zusammenarbeit mit der
  deutschen Wirtschaft gefunden haben. Gerade für den Mittelstand sind Investitionen
  über große Distanzen häufig herausfordernd. Die schon genannte Roadmap wird daher
  verlässliche Rahmenbedingungen für Unternehmen beider Seiten eröffnen, beispielsweise
  bei der Anerkennung von Standards. Last, but not least sind Kasachen und Deutsche
  einander auch kulturell sehr nah. Die deutsche Minderheit in Kasachstan ist eine
  lebendige Brücke. Die Deutsch-Kasachische Universität in Almaty und die geplante
  deutsch-kasachische Schule in Astana zeigen, dass wir unsere Partnerschaft in die
  nächste Generation tragen. Das freut mich sehr. Ich darf hier einmal sagen, dass
  es gut 200.000 Deutschstämmige in Kasachstan gibt, die nach wie vor ihre Kultur
  sehr pflegen und gleichzeitig Bürger Kasachstans sind, sich dort wohl und zu Hause
  fühlen und gleichzeitig die Verbindungen in ihre alte Heimat, die zum Teil nur die
  Heimat ihrer Eltern und Großeltern war, intensiv pflegen. Danke, dass Sie das in
  Kasachstan möglich machen und dass auch die deutsche Sprache dort ihren Platz hat
  und dort gesprochen werden darf! In diesem Sinne noch einmal, Herr Präsident, sehr
  herzlichen Dank für Ihren Besuch! Ich will es noch einmal sagen: Es hat mich sehr
  gefreut, dass wir heute die Gelegenheit hatten, einander kennenzulernen und uns
  auch so intensiv über unsere Beziehungen auszutauschen. Herzlichen Dank auch für
  das eine oder andere persönliche Wort, das wir miteinander gefunden haben! Sehr
  geehrter Herr Bundeskanzler! Sehr geehrte Vertreterinnen und Vertreter der Massenmedien!
  Wir haben heute Berlin besucht, eine Stadt mit reichen Traditionen und mit reicher
  Kultur. Ich bedanke mich ganz herzlich für den herzlichen Empfang und die ganz besondere
  Gastfreundschaft, die unserer kasachischen Delegation entgegengebracht wurde. Vielen
  herzlichen Dank! Zwischen unseren Ländern gibt es einen festen, freundschaftlichen
  Dialog, der auf gegenseitigem Vertrauen aufbaut. Wir haben heute viele Verhandlungen,
  die gute Chancen für die Zukunft der bilateralen Kooperation öffnen. Dessen bin
  ich mir sicher. Was Deutschland betrifft, so genießt Deutschland natürlich hohes
  Ansehen in den Bereichen von Wirtschaft, Wissenschaft, Forschung und Handel. Es
  gibt sehr viele Errungenschaften in Deutschland. Ich möchte diese Gelegenheit nutzen,
  um Sie, sehr geehrter Herr Bundeskanzler, aber natürlich auch das gesamte deutsche
  Volk zum bevorstehenden Tag der Deutschen Einheit zu beglückwünschen. Deutschland
  ist ein sehr wichtiger Partner für uns. Was die deutsche Bevölkerung betrifft, so
  möchte ich natürlich alles Gute für das weitere Gedeihen Deutschlands wünschen.
  Deutschland ist für uns einer der führenden Partner in der Europäischen Union. Wir
  wissen, dass Deutschland eines der ersten Länder war, das die Unabhängigkeit der
  Republik Kasachstan anerkannt hat. Wir werden den 35. Jahrestag der Aufnahme diplomatischer
  Beziehungen haben. Im Bereich der Kultur, im humanitären Bereich, in den Bereichen
  von Wirtschaft und Politik haben wir sehr gute Beziehungen, die sich sehr dynamisch
  entwickeln. Wir legen sehr viel Wert auf den Ausbau dieser Beziehungen. Unsere Beziehungen
  bauen auf gegenseitigem Respekt auf. Wir sind uns sicher, dass der Dialog fortgesetzt
  wird. Sehr geehrte Journalistinnen und Journalisten, wir hatten heute ein sehr inhaltsreiches
  Gespräch mit dem deutschen Bundeskanzler. Wir haben uns über aktuelle Fragen in
  den Bereichen von Politik und Wirtschaft ausgetauscht. Es gibt auch einen Anstieg
  bei den Wirtschaftsbeziehungen. Das bilaterale Handelsvolumen entwickelt sich sehr
  dynamisch. In Kasachstan gibt es über 1.000 Unternehmen mit deutscher Kapitalbeteiligung.
  Wir schätzen die Teilnahme der deutschen Wirtschaft am kasachischen Markt sehr und
  werden uns mit ganzer Kraft darum bemühen, dass die deutschen Investoren, die deutschen
  Unternehmen gute Bedingungen bei uns in Kasachstan haben. Wir haben eine neue Verfassung.
  Natürlich schätzen wir unsere internationalen Partner. Die deutschen Investitionen
  betragen über acht Milliarden US -Dollar. Derzeit gibt es 40 gemeinsame Projekte
  mit einem Gesamtvolumen von über vier Milliarden Dollar. Unternehmen wie CLAAS,
  Siemens, Linde, Goldbeck Holding, Rhenus und andere sind in Kasachstan aktiv und
  arbeiten erfolgreich zusammen. Unser Ziel besteht darin, die Investitionszusammenarbeit
  mit der deutschen Seite auf ein qualitativ neues Niveau zu bringen. Wir sind sehr
  an langfristigen Aktivitäten der Vertreter der deutschen Wirtschaft interessiert.
  Wir legen sehr viel Wert auf die Zusammenarbeit in den Bereichen von Energie, Maschinenbau
  und Chemie. Denn es sind weltweit führende Unternehmen aus Deutschland, an denen
  wir interessiert sind. Wir sind uns sicher, dass das Potenzial bei Weitem nicht
  ausgeschöpft ist. Deutschland hat einen sehr starken Mittelstand, die Vertreter
  der kleinen und mittleren Unternehmen. Wir sind sehr daran interessiert, dass der
  Mittelstand aus Deutschland nach Kasachstan kommt und dort Produktionsstätten aufbaut.
  Die Zusammenarbeit mit Deutschland genießt für uns hohe Priorität. Was die Zusammenarbeit
  zwischen unseren beiden Ländern betrifft, so sind wir uns sicher, dass wir auf eine
  langfristige Partnerschaft setzen können. Kasachstan ist einer der wichtigsten Erdöllieferanten
  für Deutschland. Wir haben vor, die Volumina der Lieferung von Erdöl zu steigern
  und möchten auch in der Zukunft ein zuverlässiger Partner im Bereich der Erdöllieferungen
  für Deutschland sein. Der grüne Wasserstoff und erneuerbare Energien sind weitere
  Bereiche. Auch die Zusammenarbeit im Bereich der Umwelt, um die Schäden für die
  Umwelt reduzieren zu können, spielt für uns eine wichtige Rolle. Linde und Siemens
  Energy sind hierfür die besten Beispiele, und wir arbeiten mit diesen Unternehmen
  erfolgreich zusammen. Wir schätzen diese Zusammenarbeit sehr. Verkehr und Logistik
  sind weitere Bereiche, die für uns wichtig sind. Wir haben ja eine günstige geografische
  Lage und sind gerne bereit, das Potenzial in diesem Bereich auszuschöpfen. Die Transkaspische
  Internationale Transportroute hat in dieser Hinsicht eine sehr große Bedeutung.
  Der Mittlere Korridor erfreut sich einer großen Nachfrage. Bis auf 20 Millionen
  Tonnen möchten wir das Transportaufkommen hier vergrößern und verbessern. Aus diesem
  Grund möchte ich die deutschen Unternehmen im Bereich des Verkehrs und der Logistik
  dazu auffordern, dass sie ihre Aktivitäten ausweiten. Es gibt dafür natürlich auch
  die Häfen in Kasachstan, wie den Hafen in Aktau. Wir sind gerne dafür bereit und
  planen konkrete Projekte mit der deutschen Seite. Der Bereich der Landwirtschaft,
  der Ernährung und der Lebensmittel freut sich auch auf eine große Nachfrage. Wir
  legen sehr viel Wert auf diesen Bereich. Die deutschen Erfahrungen sind für uns
  wichtig. Aktivitäten wie zum Beispiel die von CLAAS mit der Montage der landwirtschaftlichen
  Maschinen in Kasachstan und von Westfalia im Bereich des Baus der Milchfabriken,
  der Milchfarmen, sind uns wichtig und haben sehr gute Chancen. Ökolandbau spielt
  eine wichtige Rolle. Natürlich ist es wichtig, dass die kasachischen Unternehmen
  einen Zugang zu dem europäischen Lebensmittelmarkt bekommen. Wir schätzen die Arbeit
  des Deutsch-Kasachischen Agrarpolitischen Dialog in Kasachstan sehr. KI und Digitalisierung
  sind Bereiche mit großer Zukunft, auch Robotik. Wir sind hier sehr interessiert
  am Ausbau der Zusammenarbeit. Geologische Erkundung und Digitalisierung der geologischen
  Leistung stehen ganz hoch auf der Agenda. Das gilt auch für den kulturell-humanitären
  Bereich, denn er bildet ja eine wichtige Brücke für unsere beiden Länder. Es gibt
  ja, wie gesagt, die deutsche Minderheit in Kasachstan, ca. 200.000 Menschen, die
  uns sehr wichtig sind und eine lebendige Brücke bilden. In Aktau gibt es ja ein
  deutsch-kasachisches Ingenieurszentrum. Es gibt auch weitere deutsch-kasachische
  Bildungseinrichtungen. Es wurde vor Kurzem eine Filiale einer deutschen Hochschule
  eröffnet. Wir hegen die Hoffnung auf den Ausbau der Zusammenarbeit im Bereich hochschulischer
  Bildung, denn dies ermöglicht langfristige Partnerschaft auch unter jungen Menschen.
  Die heutigen Gespräche waren sehr inhaltsreich. Wir haben vor, im Laufe der Verhandlungen
  mehr als 30 kommerzielle Verträge zu unterzeichnen, und sind daran interessiert,
  dass die Verträge effizient umgesetzt werden. Morgen habe ich vor, nach Bayern zu
  reisen. Es sind eine Reihe von Gesprächen mit den bayerischen Vertretern, auch mit
  Regierungsvertretern und Wirtschaftsvertretern vorgesehen. Ich werde auch am Technologieforum
  teilnehmen und bin mir sicher, dass dieses Forum einen weiteren Schritt auf dem
  Wege der Stärkung der Zusammenarbeit bilden wird. Sehr geehrte Damen und Herren,
  heute haben wir uns hier im Laufe der Verhandlungen über die Fragen der internationalen
  Agenda, aber auch der bilateralen Agenda ausgetauscht. Natürlich ist es sehr wichtig,
  dass wir so einen Austausch haben und dass die Herausforderungen auf dem diplomatischen
  Wege auf der internationalen Bühne bewältigt werden. Wir haben verabredet, dass
  wir die Zusammenarbeit ausbauen. Die Zusammenarbeit sollte von gegenseitigem Vorteil
  sein. Deutschland ist ein strategischer Partner für uns. Vielen Dank für Ihre Aufmerksamkeit!
  Frage : Herr Präsident, wie bewerten Sie die Zukunftschancen der zwischenstaatlichen
  Beziehungen? Präsident Tokajew : Wir bewerten sie als sehr hoch. Wir sehen diesen
  Weg, den wir zurückgelegt haben, und schätzen ihn sehr. Wie Sie gesagt haben, legt
  der, der sich vorwärts bewegt, auch einen guten Weg zurück. Wir haben einen langen
  Weg hinter uns, haben aber große Erfolge gefeiert. Wie Sie wissen, wird Deutschland
  in unserem Land sehr geschätzt. Wir lieben dieses Land, wir mögen es, wir respektieren
  dieses Land. Wir wissen objektiv zu schätzen, wie viel dieses Land erreicht hat,
  vor allem in der Wirtschaft, aber auch in anderen Bereichen. Deutschland ist ein
  sehr wichtiger Staat auf der internationalen Bühne. Deswegen bin ich mit sehr vielen
  Erwartungen, mit vielen Hoffnungen hierhergekommen, um hier neue Abkommen und neue
  Übereinkünfte mit diesem Land zu schließen, und wir haben das auch erreicht. Wie
  ich bereits sagte, besteht unsere Aufgabe jetzt darin, all das umzusetzen, was in
  diesen Abkommen und Memoranden of Understanding festgehalten wurde. Daher ist mein
  Blick in die Zukunft ziemlich positiv. Ich bin fast davon überzeugt bzw. , nein,
  ich bin vollkommen davon überzeugt, dass wir noch sehr viel mehr Erfolge erzielen
  werden, denn beide Seiten verspüren den Wunsch, solche Erfolge zu verzeichnen. Ich
  muss sagen: Während der Verhandlungen sagte ich, dass wir den Bundeskanzler bei
  uns für einen Staatsbesuch erwarten, wann immer er möchte. Wir erwarten ihn im nächsten
  Jahr und werden uns darauf vorbereiten; denn Besuche sind ja nicht einfach nur dazu
  da, sich gegenseitig zu besuchen, sondern auch dazu, mehr Verständnis in schwierigen
  Fragen zu erhalten und weitere Abkommen zu schließen. Ich kann sagen, dass ich hier
  ein solches gegenseitiges Verständnis habe feststellen können, sowohl bei den Gesprächen
  mit dem Herrn Bundespräsidenten Steinmeier als auch mit dem Bundeskanzler Merz.
  Ich bin dankbar für die Gastfreundschaft, mit der ich hier empfangen wurde. All
  meine Erwartungen sind in Erfüllung gegangen. Wir werden selbstverständlich weiterhin
  darauf hinarbeiten, unsere Zusammenarbeit, unsere Kooperation mit diesem großen
  Land weiter voranzutreiben. Herzlichen Dank! Frage : Herr Bundeskanzler, Ihr Außenminister
  Johann Wadephul hat am Wochenende Sergej Lawrow, den russischen Außenminister, getroffen.
  Er sprach anschließend in einem Interview mit der ARD von einer neuen Entscheidung.
  Jetzt wird ja bald auch der G20 -Gipfel in Miami stattfinden, zu dem der russische
  Präsident Putin eingeladen ist, und Sie werden wahrscheinlich auch da sein. Würden
  Sie mit Herrn Putin sprechen? Falls ja, unter welchen Bedingungen? Herr Präsident
  Tokajew, vor zwei Monaten haben Sie im Beisein des russischen Präsidenten Putin
  das Einfrieren des Konflikts ins Spiel gebracht. Bisher ist davon nichts zu sehen.
  Was würden Sie heute sagen, auch mit Blick auf Russland? Präsident Tokajew : Ich
  bin dem Präsidenten Putin sehr dankbar dafür, dass er mit sehr großem Verständnis
  meine persönliche Position eingeschätzt hat, da wir als Staatsoberhäupter dafür
  eintreten, dass der Krieg auf dem Territorium der Ukraine beendet wird. Ich habe
  sehr guten Kontakt mit Präsident Putin. Ich halte ihn für eine herausragende politische
  Persönlichkeit. Ich habe heute auch mit Überzeugung gesagt, dass ich Präsident Putin
  als Staatsmann für eine geeignete politische Persönlichkeit halte. Vielleicht klingt
  das für Sie etwas eigenartig, aber meines Erachtens gilt das sowohl für Zentralasien
  einschließlich Kasachstan als auch für Europa und für die ganze Welt. Ich kenne
  ihn sehr gut, und er verfügt über die notwendigen Charaktereigenschaften für die
  Rolle als Staatsoberhaupt eines sehr großen Landes mit einer komplexen Geschichte
  und mit einem eigenen Verständnis für die strategischen Zielen, vor denen dieses
  Land steht. Natürlich sind wir beunruhigt über die Ereignisse in der Ukraine. Ich
  habe von Anfang an betont, dass Kasachstan für die Einhaltung der UN -Charta ist,
  und wir bestehen auf der Achtung der territorialen Unverletzbarkeit jedes Landes.
  Ich habe immer darüber gesprochen, weil wir das ukrainische Volk sowie die Kultur,
  die Tradition, die Geschichte dieses Landes und natürlich auch die ukrainische Sprache
  respektieren. Ich habe nicht darüber gesprochen, dass der Krieg so schnell wie möglich
  beendet wird; denn ich verstehe, dass das unter den gegenwärtigen Bedingungen unrealistisch
  wäre. Ich spreche vielmehr über das Einfrieren der Kampfhandlungen auf dem Territorium
  der Ukraine, damit wir uns dann in die Richtung von Diplomatie und Verhandlungen
  begeben. Das ist unser Standpunkt. Was auch immer auf dem Territorium der Ukraine
  geschehen mag: Wir vergessen nie, dass sowohl Russland als auch die Ukraine unsere
  guten Freunde sind. Was Russland betrifft, so darf man nicht vergessen, dass Kasachstan
  und Russland über eine gemeinsame Staatsgrenze mit einer Länge von über 7.500 Kilometern
  verfügen. Das ist das die längste Grenze der Welt. Auch das ist ein Faktor mit Blick
  auf die Entwicklung der Freundschaft und der Zusammenarbeit. In Kasachstan leben
  etwa 2.700.000 kasachische Bürger russischer Abstammung. Wir haben in unserem Land
  auch eine sehr aktive orthodoxe Kirche. Wir respektieren die orthodoxe Kirche und
  den orthodoxen Glauben. All diese Aspekte darf man nicht vergessen. Kasachstan braucht
  Frieden und braucht Stabilität; denn ohne diese Faktoren werden wir nie ein erfolgreiches
  Land sein. Bislang erzielten wir gute Ergebnisse in unserer dynamischen Entwicklung.
  Hier zeigt sich also ein Fortschritt, und ich als Präsident werde alles Mögliche
  tun, um Frieden und Stabilität in meinem Land zu gewährleisten und meinen Beitrag
  dazu zu leisten. Ich kann meine Möglichkeiten in dieser Frage natürlich nicht überschätzen,
  was den Frieden und ein Ende des Krieges auf dem Territorium unseres Nachbarlandes
  betrifft. Bundeskanzler Merz : Präsident Tokajew und ich haben sehr ausführlich
  über diesen Krieg gesprochen. Ich habe die Position der Bundesregierung und auch
  meine persönliche Position zu diesem Krieg sehr deutlich zum Ausdruck gebracht.
  Sie wissen, dass wir von Anfang an auf der Seite der Ukraine gestanden haben und
  unvermindert stehen, und dass wir alles tun, damit die Ukraine diesen Krieg bestehen
  kann und die territoriale Souveränität des Landes in Freiheit erhalten kann. Ich
  bin Präsident Tokajew dankbar, dass er auch mit Präsident Putin darüber spricht,
  wie wir zu einem Ende dieses Krieges kommen können. Wir unternehmen umfangreiche
  diplomatische Bemühungen. Eine davon war der Besuch des deutschen Außenministers
  in New York und sein Gespräch mit dem russischen Außenminister. Die anschließende
  Bewertung dieses Gesprächs durch Russland hat gezeigt, dass Russland zum jetzigen
  Zeitpunkt offensichtlich überhaupt nicht an ernsthaften Gesprächen interessiert
  ist. Wir werden deswegen alle unsere Anstrengungen unternehmen, der Ukraine weiter
  behilflich zu sein und sie zu unterstützen, und zwar nicht nur militärisch, sondern
  auch politisch, finanziell und ökonomisch. Sie wissen, dass es darüber eine große
  Übereinstimmung in der Europäischen Union gibt. Wir können die russische Regierung
  nur noch einmal auffordern, an den Verhandlungstisch zu kommen und ernsthafte Gespräche
  zu führen, um diesen Krieg zu beenden. Wenn Russland dazu aber nicht bereit ist,
  dann sind wir in der Lage und auch bereit, die Ukraine noch über eine lange Zeit
  zu unterstützen. Ich kann von meiner Seite aus nur noch einmal sagen: Russland wird
  diesen Krieg nicht gewinnen, und Russland wird selbst massiven Schaden nehmen, auch
  in seiner Wirtschaft. Wir sehen schon heute, in welcher prekären Situation die russische
  Wirtschaft ist. Es wird einen Preis haben, wenn Russland diesen Krieg fortsetzt.
  Frage : Sehr geehrter Herr Bundeskanzler, welche Möglichkeiten sehen Sie für eine
  aktivere Einbeziehung der kasachischen Betriebe in die Lieferketten Deutschlands
  und auch für den Zugang zu den deutschen Technologien? Welche Maßnahmen könnten
  hier ergriffen werden? Bundeskanzler Merz : Vielen Dank für die Frage. Genau darüber
  haben wir sehr intensiv gesprochen. Darüber gibt es auch eine ganze Reihe von Vereinbarungen,
  von MOUs , die unterzeichnet wurden und auch noch unterzeichnet werden. Es wird
  heute eine Fortsetzung der Wirtschaftsgespräche geben, und morgen geht das dann
  in München weiter. Wir suchen nach Wegen, auch den Mittelstand an den Möglichkeiten
  zu beteiligen, die Kasachstan uns in den bilateralen Beziehungen bietet. Wir wollen
  auch die Energieversorgung weiter miteinander besprechen; denn wir sind sehr daran
  interessiert, zum Beispiel Öl aus Kasachstan geliefert zu bekommen – als Ersatz
  für das Öl, das wir aus Russland nicht mehr beziehen. Wir suchen also nach der Diversifizierung
  unserer Lieferbeziehungen, und da ist Kasachstan ein wichtiger Baustein in dieser
  Region der Welt. Wir haben über das Format Z5+1 gesprochen – ein Treffen, das ja
  aus Termingründen eines der Beteiligten abgesagt werden musste. Wir wollen das im
  zweiten Quartal 2027 nachholen. Es gibt für uns also aus deutscher Sicht, aber auch
  aus europäischer Sicht ein großes Interesse an guten bilateralen Wirtschaftsbeziehungen
  zu Kasachstan, aber auch ein großes Interesse an guten europäischen Beziehungen
  zu den zentralasiatischen Staaten. Ich denke, dies ist eine große Chance für beide
  Länder, aber auch und vor allem für die Wirtschaft in beiden Ländern. Frage : Herr
  Bundeskanzler, Sie haben intensiv über den Krieg in der Ukraine gesprochen. In den
  letzten Tagen hat sich dieser Krieg verändert. Russland greift die Ukraine – vor
  allem die Hauptstadt – jeden Tag mit Drohnen an. Gestern wurde das Haus der Wirtschaft
  angegriffen. Es gingen Bilder von Menschen, die aus Fenstern springen, um die Welt.
  Was könnte Deutschland noch zusätzlich tun – Stichwort Flugabwehr, aber auch finanzielle
  Hilfe –, um die Ukraine stärker zu unterstützen? Bundeskanzler Merz : Vielen Dank. –
  Auch zur Vorbereitung des nächsten Treffens des Europäischen Rats, das am 15. und
  16. Oktober in Brüssel stattfinden wird, sind wir mit den europäischen Partnern
  in der Abstimmung und in intensiven Beratungen darüber, wie wir unsere Hilfen noch
  einmal verbessern können. Wir sprechen auch über sehr konkrete Hilfen für den ukrainischen
  Haushalt. Wir sprechen darüber, alle Möglichkeiten auszuschöpfen, um die Luftverteidigung
  zu verbessern. Das ist zurzeit eine der größten Herausforderungen, vor denen die
  Ukraine steht. Ich bemühe mich auch in persönlichen Gesprächen mit einer ganzen
  Reihe von Staats- und Regierungschefs auf der Welt, entsprechenden Nachschub für
  die Luftverteidigung in der Ukraine zu ermöglichen. Das ist zurzeit die größte Schwachstelle.
  Ich hoffe, dass es uns gelingt, die Ukraine – bis hin zur Energieversorgung – auf
  den bevorstehenden Winter vorzubereiten. Ich glaube, wir dürfen uns alle keine Illusionen
  machen: Russland wird weiter rücksichtslos bombardieren und wird auch die zivile
  Infrastruktur zerstören. Das sind Kriegsverbrechen, die dort jeden Tag stattfinden.
  Wir lassen uns davon aber nicht abschrecken. Wir werden die Ukraine weiter unterstützen,
  weil wir eines wissen: Die Ukraine ist Teil Europas, und wenn die Ukraine fällt,
  dann sind der Frieden und die Freiheit in ganz Europa in Gefahr. Deswegen stehen
  wir so klar und so eindeutig auf der Seite der Ukraine, und ich werde aus meiner
  Sicht alles tun, um diesem Land auch zu helfen, über einen möglicherweise sehr,
  sehr schwierigen Winter hinwegzukommen.'
