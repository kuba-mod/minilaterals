title: 'Kulturstaatsminister Weimer verdoppelt Bundesmittel für die Wartburg – Weimer:
  „Wir wollen das UNESCO-Welterbe zum Leuchten bringen“ – Große Denkmalsanierung startet'
text: 'Bei seinem Besuch der Wartburg hat sich Kulturstaatsminister Wolfram Weimer
  im Rahmen seiner Kulturbautenreise zusammen mit Thüringens Kulturminister Christian
  Tischner, dem Chef der Thüringer Landesgruppe im Deutschen Bundestag, Christian
  Hirte (MdB), und dem Thüringer Bundestagsabgeordneten Michael Hose (MdB) über die
  anstehende Sanierung informiert. Dabei betonte Weimer die Bedeutung der Wartburg
  als herausragende UNESCO-Welterbestätte. Bisher fördert der Bund die Wartburg jährlich
  mit 248.000 Euro für den Bauunterhalt. Im Regierungsentwurf zum Haushalt 2027 ist
  eine Verdopplung der Mittel auf 498.000 Euro vorgesehen. Dazu Staatsminister Weimer:
  „Die Wartburg ist ein Schatz Thüringens und zugleich ein Schatz der ganzen Nation.
  Ihr UNESCO-Welterbestatus macht deutlich, dass ihre Bedeutung weit über unser Land
  hinausreicht. Wir wollen gemeinsam dafür sorgen, dass dieser besondere Ort auch
  in Zukunft lebendig bleibt. Wir wollen die Wartburg weit über die Grenzen Thüringens
  hinaus zum Leuchten bringen. Denn sie ist das kulturelle Gedächtnis unserer Nation.“
  Gemeinsam stehen Bund und Land in der Verantwortung, die Wartburg weiterhin zu unterstützen
  und als historische Stätte für kommende Generationen sichtbar zu machen und zu erhalten.
  Denn hier verbindet sich kulturelle Identität mit der Geschichte unseres Landes.
  Dazu der Chef der Thüringer Landesgruppe im Deutschen Bundestag, Christian Hirte,
  MdB: „Die Wartburg ist ein Leuchtturm deutscher Kultur und Geschichte. Es ist gut,
  dass der Bund die Bedeutung für Musik, Sprache, für nationale Identität und Einheit
  sowie die europäische Verbundenheit anerkennt.“ Dazu Michael Hose, MdB: „Staatsminister
  Weimer ist ein geschätzter Gast im Freistaat Thüringen. Ich freue mich, dass der
  Bund Thüringens einzigartige Kultur- und Demokratiegeschichte in hohem Maße unterstützt,
  wie die aktuellen Förderungen für die Wartburg und das Schloss Friedensstein belegen.“
  Die Wartburg ist eine der bekanntesten und am besten erhaltenen romanischen Höhenburgen
  Deutschlands. Sie ist seit 1999 UNESCO Welterbestätte und mit knapp 500.000 Besuchern
  jährlich eine der meistbesuchten Kultureinrichtungen Deutschlands. Als Zufluchtsort
  Martin Luthers und Ort der Bibelübersetzung ist sie von herausragender historischer
  Bedeutung. Auch als Ort des Wartburgfestes ist sie zentral für die deutsche Demokratiegeschichte.'
