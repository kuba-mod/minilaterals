title: Im Kabinett beschlossen Bessere Startchancen für Kinder
text: 'Mit dem Startchancen- und Qualitätsentwicklungsgesetz will die Bundesregierung
  die Chancengleichheit für Kinder stärken. Frühe Bildungs- und Fördermaßnahmen schaffen
  für Kinder die Grundlage für gute Startchancen und mehr Chancengerechtigkeit – unabhängig
  von Herkunft oder sozialem Status. Das Bundeskabinett hat deshalb nun den Entwurf
  für das sogenannte „Startchancen- und Qualitätsentwicklungsgesetz“ für Kitas beschlossen.
  Die Bundesregierung setzt damit ein wichtiges Vorhaben aus dem Koalitionsvertrag
  um. Der Gesetzentwurf führt erstmals bundesweit einheitliche Qualitätsstandards
  in der frühkindlichen Bildung ein. Er soll: Ein wichtiger Schwerpunkt ist dabei
  die Feststellung des Sprach- und Entwicklungsstands bei Kindern spätestens mit vier
  Jahren und die anschließende Förderung bei ermitteltem Förderbedarf. Auch die besondere
  Unterstützung von Kitas mit einem erhöhten Anteil von Kindern in „herausfordernden
  Lebenslagen“ steht im Fokus. Dabei spielen insbesondere die finanzielle Bedürftigkeit
  der Familien, die Familiensprache oder die sprachliche Entwicklung der Kinder eine
  Rolle. Außerdem soll der Übergang von der Kita in die Grundschule verbessert werden.
  Der Bund unterstützt die Länder hinsichtlich der Mehrbelastungen, die sich aus diesem
  Gesetz ergeben. Dafür stellt er ab 2027 über einen Zeitraum von acht Jahren insgesamt
  rund 9,25 Milliarden Euro bereit.'
