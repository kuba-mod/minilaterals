title: Pressekonferenz nach EU-Arktis-Gipfel Die Arktis als geopolitischer Hotspot
text: Die EU wolle künftig ein stärkeres Augenmerk auf die Arktis legen, bekräftigte
  der Bundeskanzler. Bei der Pressekonferenz zum Abschluss des zweitägigen EU -Arktis-Gipfels
  im finnischen Rovaniemi bekräftigte Bundeskanzler Merz die Relevanz des hohen Nordens
  für die Sicherheit des gesamten europäischen Kontinents. Angesichts russischer Aggressionen
  in Europa müssten die Partner mit Einheit und Stärke reagieren. Die Arktis biete
  aber auch wichtige wirtschaftliche Chancen, so Kanzler Merz. Vor dem Hintergrund
  wachsender russischer Präsenz im hohen Norden, aber auch täglicher hybrider Angriffe
  wie zuletzt in Leipzig, sei es im Interesse der Partner, hier in Finnland gemeinsam
  über die russische Aggression zu sprechen, betonte Kanzler Merz. Diese sei auch
  in der Arktis, einem geopolitischen Hotspot mit hoher Relevanz für die europäische
  Sicherheit und Verteidigung, zu spüren. Mit seinen europäischen Partnern stimmte
  Kanzler Merz überein, dass die Europäische Union künftig ein stärkeres Augenmerk
  auf die Arktis legen solle. Auch die NATO demonstriere Einigkeit und habe ihre Aktivitäten
  in der Region gestärkt. Die europäischen Partner demonstrierten Einheit und Stärke,
  so zuletzt auch nach dem hybriden Vorfall am Flughafen Leipzig/Halle . Nicht nur
  der sicherheitspolitische Wandel, sondern auch die wirtschaftlichen Chancen der
  Region waren Thema der Beratungen. Als zukunftsträchtig bezeichnete Bundeskanzler
  Merz die kritischen Rohstoffe in der Region, die vorhandenen Energiereserven, mögliche
  Transport- und Seewege sowie die Weltraumkapazitäten. Als besonderen Erfolg bezeichnete
  der Kanzler den ersten europäischen Raketenstart am 5. September 2026 vom norwegischen
  Weltraumbahnhof Andøya aus mit Beteiligung eines deutschen Unternehmens. Kanzler
  Merz bekräftigte, dass die jüngsten Beratungen in Brüssel fortgeführt und weitere
  Partner wie Island, Norwegen, Kanada und das Vereinigte Königreich hinzugezogen
  werden sollten. Dies sei wichtig angesichts dieser Region, die so bedeutend sei
  für den europäischen Kontinent und dessen Bevölkerung.
