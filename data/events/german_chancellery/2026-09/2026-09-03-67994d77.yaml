title: Pressestatement des Kanzlers zur Vorstellung des neuen Staatsministers für
  Sport und Ehrenamt Rauhe will Spitzensport und Ehrenamt stärken
text: 'Bundeskanzler Friedrich Merz stellte den ehemaligen Kanuten und zweifachen
  Olympiasieger Ronald Rauhe als neuen Staatsminister für Sport und Ehrenamt vor.
  Bundeskanzler Friedrich Merz hat Ronald Rauhe als neuen Staatminister für Sport
  und Ehrenamt ins Amt eingeführt. Der zweifache Kanu-Olympiasieger Ronald Rauhe ist
  ab sofort für die Sport- und Ehrenamtspolitik der Bundesregierung zuständig. Als
  langjähriger Spitzensportler bringt er umfangreiche persönliche Erfahrungen aus
  dem nationalen und internationalen Leistungssport in sein neues Amt ein. „Wir wollen
  damit auch ein Zeichen setzen, dass wir den deutschen Sport als ein wichtiges Aufgabengebiet
  sehen“, hob der Bundeskanzler hervor. Zugleich übernimmt der Staatsminister „auch
  die Aufgabe, das Ehrenamt in Deutschland zu stärken“, so Merz weiter. Staatsminister
  Rauhe bedankte sich beim Kanzler für das Vertrauen und betonte: „Sport und Ehrenamt
  können unser Land stärker machen, und genau dafür möchte ich arbeiten – für den
  Sport, für das Ehrenamt, für unser Land.“ Meine Damen und Herren, herzlich willkommen
  im Bundeskanzleramt! Ein ebenso herzliches Willkommen dem von mir gerade ernannten
  und vereidigten neuen Staatsminister für Sport und Ehrenamt beim Bundeskanzler,
  Ronald Rauhe! Ich freue mich sehr, dass ich Sie dafür gewinnen konnte, diese Aufgabe
  zu übernehmen. Diejenigen, die im Sport ein bisschen zu Hause sind, wissen mit dem
  Namen etwas anzufangen. Ronald Rauhe ist mehrfacher Olympiasieger. Er hat insgesamt
  fünf olympische Medaillen gewonnen, 16 Weltmeisterschaften und insgesamt 31 Medaillen
  bei Weltmeisterschaften, Olympischen Spielen und Europameisterschaften im Kanu.
  Ich freue mich sehr, dass ich ihn gewinnen konnte. Denn er ist auch nach seinem
  Ausscheiden aus dem aktiven Sport aktiv im Sport geblieben. Zum Schluss war er der
  Träger der Deutschlandfahne bei den Abschlussfeiern der Olympischen Spiele in Tokio
  2021. Das war sozusagen das Ende der sportlichen Karriere. Er ist aber dem Deutschen
  Olympischen Sportbund und dem Europäischen Olympischen Komitee verbunden geblieben.
  Er ist der Sprecher der Aktiven dort. Bis heute ist er Soldat gewesen und ist jetzt
  hier im Haus. Wir wollen damit auch ein Zeichen setzen, dass wir den deutschen Sport
  als ein wichtiges Aufgabengebiet sehen. Wir haben in wenigen Tagen die Entscheidung
  darüber, welcher Ort in Deutschland sich um die übernächsten Olympischen und Paralympischen
  Spiele bewirbt. Wir wollen uns dann, wenn die Entscheidung feststeht, wo sie stattfinden
  sollen, mit ganzer Kraft für diese Olympischen Spiele bewerben. 2036, 2040, 2044,
  diese Jahre stehen im Raum. Ich erhoffe mir dabei eine tatkräftige Unterstützung
  durch Ronald Rauhe. Aber auch die ganze Bundesregierung wird hinter dieser Entscheidung
  stehen. Gleichzeitig übernimmt Ronald Rauhe auch die Aufgabe, das Ehrenamt in Deutschland
  zu stärken. Wir haben bereits einen Pakt für das Ehrenamt geschlossen. Wir haben
  die Bedingungen für die ehrenamtliche Tätigkeit deutlich verbessert. Sport und Ehrenamt
  überschneiden sich in vielfältiger Hinsicht. Sehr viele ehrenamtlich Tätige sind
  im Sport unterwegs. Aber es gibt darüber hinaus viele Organisationen. Ich nenne
  nur aus sehr konkretem Anlass des Sommers 2026 die ehrenamtlich tätigen Feuerwehrmänner
  und ‑frauen. Ich nenne diejenigen, die beim Deutschen Roten Kreuz und in anderen
  Hilfsorganisationen unterwegs sind. Auch sie sollen einen Ansprechpartner im Bundeskanzleramt
  haben. Insofern bin ich mir sehr sicher, dass Ronald Rauhe der richtige Mann sein
  wird, um auch hier im Bundeskanzleramt den großen Bereich des Sports und des Ehrenamts
  in unserer Republik zu stärken, zu unterstützen und auch jederzeit den Zugang zum
  Bundeskanzler zu haben. Deswegen war ja mein Wunsch, dass ich diese Aufgabe in das
  Bundeskanzleramt übernehme. Insofern sage ich noch einmal ein sehr herzliches Willkommen,
  auf gute Zusammenarbeit! Ich freue mich sehr und danke noch einmal für die Bereitschaft,
  hier im Haus diese Aufgabe zu übernehmen. Vielen Dank! Ich freue mich auch sehr,
  sehr geehrter Herr Bundeskanzler, sehr geehrte Damen und Herren! Ich kann mich noch
  sehr genau an den Moment erinnern, als ich meine erste olympische Medaille in den
  Händen hielt. Es war ein besonderer Moment. Ich war 18 Jahre alt. Ich war stolz,
  ich war glücklich, natürlich auch ein bisschen überwältigt. Aber eines wusste ich
  schon damals sehr genau: Diese Medaille gehört mir nicht alleine. Dahinter standen
  Trainerinnen und Trainer, meine Familie, Ehrenämter und ein Land, das mir die Möglichkeit
  gegeben hat, diesen Traum zu leben. Heute erlebe ich wieder einen Moment, der mich
  sehr berührt – nicht als Athlet, sondern ab heute als Staatsminister für Sport und
  Ehrenamt. Herr Bundeskanzler, vielen Dank für dieses Vertrauen! Der Sport hat mir
  in meinem Leben unheimlich viel gegeben. Jetzt möchte ich etwas zurückgeben, und
  dabei liegen mir drei Dinge ganz besonders am Herzen. Wir wollen Olympische und
  Paralympische Spiele wieder nach Deutschland holen, und diese Bewerbung, das kann
  ich Ihnen versprechen, werde ich mit voller Kraft vorantreiben. Sie ist unser Zugpferd
  für eine Generation Olympia, mit Kindern, die wieder Vorbilder haben, die sich wieder
  etwas zutrauen und sich vor allen Dingen eines erlauben dürfen, nämlich wieder groß
  zu träumen. Deutschland soll wieder zu den erfolgreichsten Sportnationen der Welt
  gehören. Damit aus Talent auch wieder Gold wird, werden wir die Spitzensportreform
  konsequent weiter vorantreiben. Denn unsere Athletinnen und Athleten brauchen Rahmenbedingungen,
  in denen Hochleistung auch entstehen kann, sicher und mit starken Trainerinnen und
  Trainern an ihrer Seite und vor allen Dingen mit Stolz, mit Stolz, unser Land zu
  vertreten und die deutsche Fahne zu tragen, für ein Land, in dem täglich Millionen
  Menschen Verantwortung in einem Ehrenamt übernehmen, in Sportvereinen, bei der Feuerwehr
  oder in der Nachbarschaft, meistens ohne eine große Bühne und ohne Applaus. Genau
  diese Menschen halten unser Land zusammen. Sie verdienen weniger Hürden, mehr Unterstützung
  und vor allem unsere volle Wertschätzung. Ich weiß, es liegen große Aufgaben vor
  uns. Aber wenn ich eines im Sport gelernt habe, ist es, dass man große Ziele niemals
  alleine erreicht. Man erreicht sie gemeinsam. Sport und Ehrenamt können unser Land
  stärker machen, und genau dafür möchte ich arbeiten – für den Sport, für das Ehrenamt,
  für unser Land.'
