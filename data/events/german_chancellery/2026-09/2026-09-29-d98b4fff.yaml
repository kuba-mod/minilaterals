title: Deutscher Schulpreis 2026 „Ihr geht mit tollen Beispielen voran“
text: 'Eine der wichtigsten Aufgaben der Gesellschaft sei, Kinder und Jugendliche
  gut auszubilden, sagte Bundeskanzler Merz bei der Verleihung des Deutschen Schulpreises.
  Mit dem Deutschen Schulpreis werden jedes Jahr Schulen ausgezeichnet, die mit innovativen
  Ideen guten Unterricht gestalten. Bundeskanzler Friedrich Merz hat den diesjährigen
  Hauptpreis übergeben: Er ging an die Bertha-von-Suttner-Schule in Mörfelden-Walldorf
  in Hessen, eine der größten Gesamtschulen Deutschlands. Die Schule entwickelt ihren
  Unterricht kontinuierlich weiter – mit Hilfe von systematisch ausgewerteten Daten,
  die pädagogische Entscheidungen lenken. Gleichzeitig haben die Schülerinnen und
  Schüler eine feste Bezugsperson: Sie werden von sogenannten „Hausleitungen“ persönlich
  begleitet. Mit sehr gutem Ergebnis: Obwohl nur 15 Prozent der Kinder eine Gymnasialempfehlung
  mitbringen, erreichen zwei Drittel der Jugendlichen am Ende das Abitur. Der Bundeskanzler
  würdigte die Arbeit dieser Schule und der weiteren 14 Schulen, die für das Finale
  des Deutschen Schulpreises nominiert wurden: „Ihr geht mit tollen Beispielen voran.“
  Man müsse sich aber um alle Schulen kümmern, auch um die, die keine Chance gehabt
  hätten, den Wettbewerb zu gewinnen oder daran teilzunehmen. Der Bundeskanzler dankte
  insbesondere auch den Lehrerinnen und Lehrern und sagte, sie seien die wichtigste
  Berufsgruppe: „Sie leisten wirklich Großartiges für unser Land.“ „Für die Bundesregierung,
  für mich als Bundeskanzler ist es eine der wichtigsten, wenn nicht sogar die wichtigste
  Aufgabe unserer Gesellschaft, dafür zu sorgen, dass Kinder, Jugendliche und junge
  Menschen in diesem Land eine gute Ausbildung bekommen“, betonte er. Der Deutsche
  Schulpreis ist der renommierteste und höchstdotierte Preis für vorbildlich arbeitende
  Schulen. Die Robert Bosch Stiftung vergibt die Auszeichnung seit 2006 gemeinsam
  mit der Heidehof Stiftung. Seit dem Start der Initiative haben sich mehr als 2.800
  Schulen für den Preis beworben. Bei der Auswahl der Preisträger-Schulen steht für
  die Jury die Unterrichtsqualität und die Frage, wie Schulen das Lehren und Lernen
  für ihre Schülerinnen und Schüler am besten gestalten können, im Mittelpunkt. Vielen
  Dank für die freundliche Begrüßung! Herzlichen Dank, dass Sie und dass ihr alle
  heute nach Berlin gekommen seid! Ich will mich bei Herrn Straub und der Boschstiftung,
  bei Herrn Danner-von Wilpert und der Heidehof-Stiftung sowie bei der „ZEIT“ bedanken,
  aber auch bei allen, die diese tolle Veranstaltung heute möglich machen. Für mehr
  gute Schulen! – Das war 2006 der Anstoß zur Verleihung des Deutschen Schulpreises,
  vor 20 Jahren. Das Ergebnis der PISA -Studie hat mit zu dieser Idee und zu dieser
  Initiative geführt. Meine Damen und Herren, wir haben vor zwei Wochen erneut Ergebnisse
  der PISA -Studie gesehen. Erneut wurden uns die großen Defizite in unserem Bildungssystem
  dokumentiert. Aber dies ist kein Grund, um zu verzweifeln. Dies ist kein Grund,
  um aufzugeben. Dies ist ein Grund, um jetzt noch mehr zu tun, und zwar dafür, dass
  unsere Bildung in Deutschland besser wird. Das zeigen wir auch heute mit einem solchen
  Tag. Denn es gibt ja nicht nur die PISA-Studien, diese abstrakte Beschreibung dessen,
  was in unserem Bildungssystem im Argen liegt. Es gibt so etwas wie den Tag heute.
  Es gibt Schulen, es gibt Schülerinnen und Schüler voller Optimismus, voller Enthusiasmus,
  Bildungskonzepte, Ideen in den Schulen, die etwas Neues ausprobieren. Aus diesem
  Grund habe ich gesagt, dass ich den Sonderpreis des heutigen Tages gern selbst überreichen
  will. Denn mir ist wichtig, dass Sie und dass Ihr alle Schülerinnen und Schüler,
  vor allen Dingen ihr, wisst: Für uns, für die Bundesregierung, für mich als Bundeskanzler
  ist es eine der wichtigsten, wenn nicht sogar die wichtigste Aufgabe unserer Gesellschaft,
  dafür zu sorgen, dass Kinder, Jugendliche und junge Menschen in diesem Land eine
  gute Ausbildung bekommen und für den Weg ihres Lebens vorbereitet werden. Deswegen
  bin ich heute hier. Ich bin dankbar, dass ich noch einige Minuten zuhören und zuschauen
  durfte, wie die Preise vergeben worden sind. Es gibt sie, diese Schulen, diese Ideen,
  diese Eltern und diese Lehrerinnen und Lehrer, die dazu beitragen, dass unser Bildungssystem
  besser wird. Wir haben es gesehen. Deswegen will ich den Eltern, die heute hier
  sind und ihre Kinder begleiten, ein Wort des Dankes sagen. Ich will ein ganz besonders
  herzliches Wort des Dankes an die Lehrerinnen und Lehrer richten. Sie leisten wirklich
  Großartiges für unser Land. Wenn Sie dies nicht täten, dann wären die Kinder heute
  nicht da. Deswegen noch einmal: Danke für Ihr Engagement ! Danke für Ihre Arbeit!
  – Ich werde nicht müde zu sagen – ich sage das nicht deshalb, weil wir heute hier
  sind, sondern ich sage das auch bei vielen anderen Gelegenheiten, wenn gar kein
  Lehrer im Raum sitzt – : Lehrerinnen und Lehrer sind die wichtigste Berufsgruppe
  unseres Landes. Sie sind die wichtigste Berufsgruppe. Denn, ganz einfach – jetzt
  spreche ich einmal nicht als Bundeskanzler, sondern als Vater und Großvater – :
  Wir vertrauen Ihnen das Wertvollste an, was wir haben. Das sind unsere Kinder. Deswegen,
  liebe Kinder, will ich es euch sagen: Ihr geht mit tollen Beispielen voran. Ich
  habe in der Vorbereitung gesehen, was für Schulen hier vertreten sind, aus ganz
  unterschiedlichen Teilen unseres Landes, und was ihr macht, was auch dazu geführt
  hat, dass ihr heute hier seid und verdientermaßen diese Preise bekommt. Ihr seid
  Vorbilder. Aber bitte lasst uns heute auch an die Schulen denken, die sich am Wettbewerb
  beteiligt haben und nicht in diese oberste Liga vorgestoßen sind! Lasst uns bitte
  auch an diejenigen denken, die gar nicht erst teilgenommen haben, weil sie vielleicht
  nicht die Chancen gesehen haben, ausgezeichnet zu werden! Wir müssen uns um alle
  kümmern. Vielleicht darf ich das an dieser Stelle auch hinzufügen: Ich habe mit
  meiner Frau – auch vor 20 Jahren; das war ein reiner zeitlicher Zufall – eine eigene
  Stiftung für Bildung und Ausbildung in meiner Heimatstadt Arnsberg gegründet. Das
  ist die Stadt, in der wir leben, eine Stadt mit 80.000 Einwohnern, gut 20 Schulen
  und einem breiten Bildungsangebot. Wir fördern jedes Jahr Schülerinnen und Schüler,
  Schulen, Stipendien, und wir versuchen, auch Lehrerinnen und Lehrern zum Beispiel
  Fortbildung zu ermöglichen. Ich möchte, dass Sie dieses Beispiel, und ich nehme
  mich nur als einen von vielen, die es auch machen, als Ansporn dafür nehmen, dass
  wir uns alle in unserer Gesellschaft mehr um unsere Schulen kümmern. Ich will einen
  Aufruf wiederholen, den ich gestern gehört habe, und vielleicht hat es der ein oder
  andere von euch und von Ihnen mitbekommen. Wir haben gestern 75 Jahre Bundesverfassungsgericht
  gefeiert. Wir haben das wirklich gefeiert, weil es ein Grund zum Feiern war. Das
  höchste deutsche Gericht, erst 1951 eingerichtet, das letzte Verfassungsorgan, das
  in Deutschland eingerichtet wurde, ist gestern 75 Jahre alt geworden, und der Präsident
  des Bundesverfassungsgerichtes hat gesagt: Unser Rechtsstaat, unsere Demokratie
  lebt von einem Grundprinzip: Bei uns steht das Recht über der Macht. – Es gibt etwas,
  das über mir steht als Bundeskanzler. Es ist das Recht, die Rechtsordnung, unsere
  freiheitliche, offene Gesellschaft, verteidigt und geschützt vom Bundesverfassungsgericht.
  Jetzt sage ich den Lehrerinnen und Lehrern und den Eltern etwas. Der Präsident des
  Bundesverfassungsgerichts hat gestern einen guten Vorschlag gemacht, und den möchte
  ich mir zu eigen machen: Laden Sie in Ihren Städten, in Ihren Gemeinden, in Ihren
  Ortsteilen, in Ihren Stadtteilen, in denen Sie die Schulen haben, ganz regelmäßig
  auch einmal die Richter der örtlichen Gerichte ein, um den Schülerinnen und Schülern
  zu erklären, was eigentlich unsere Rechtsordnung ausmacht. Was macht unseren Staat
  aus? Was macht unsere Demokratie aus? Was macht es aus, in einem Staat zu leben,
  in dem Recht gesprochen wird? Zu akzeptieren, wie unser Rechtsstaat funktioniert,
  zu akzeptieren, dass Demokratie der Wille der Mehrheit ist, aber begrenzt wird durch
  Recht, durch Ordnung und durch Verfassung! Das, finde ich, ist eine großartige Idee,
  und die möchte ich heute Morgen spontan ansprechen, hier wiederholen und Sie bitten,
  die Eltern und die Schülerinnen und Schüler und die Lehrer: Laden Sie die Rechtsprechung
  in Ihre Schulen ein, weil diejenigen, die Recht sprechen, diejenigen sind, die das
  Wertvollste verteidigen, das wir in unserer Demokratie haben, nämlich die Freiheit.
  In diesem Sinne noch einmal herzlichen Dank für die Einladung, aber einen ganz besonders
  herzlichen Dank an alle diejenigen, die dieses großartige Ereignis hier heute ermöglichen.
  Ich freue mich, wenn ich euch sehe. Ich freue mich, wenn ich diese strahlenden,
  optimistischen Gesichter von euch sehe! Ich werde oft gefragt, und dies soll meine
  abschließende Bemerkung sein, warum ich das mache, warum ich in die Politik gegangen
  bin, warum ich zwölf Jahre draußen war und dann wieder zurückgekehrt bin und jetzt
  auch das Amt des Bundeskanzlers innehabe. Ich will eine ganz einfache Antwort geben,
  und das ist meine ehrliche, innere Antwort, die ich von ganzem Herzen gebe: Ich
  mache das, damit ihr die gleichen Chancen habt, in einem offenen, freiheitlichen,
  liberalen Land zu leben, wie meine Generation sie gehabt hat. Ich bin jetzt 70 Jahre
  alt. Ich habe nichts anderes kennengelernt als Frieden, als Freiheit und als ein
  wohlhabendes Land. Ich möchte, dass das so bleibt, und ich werde alles dafür tun,
  dass ihr diese Chance habt, es genauso zu erleben und dass ihr vielleicht eines
  Tages, rückblickend auf diesen heutigen Tag hier in Berlin, sagen könnt: Ihr habt
  da damals jemanden gehört, der war Bundeskanzler, und der hat etwas gesagt, das
  ihr vielleicht noch nicht so ganz richtig verstanden habt, aber verdammt noch einmal,
  ja, das war richtig. Darum geht es: in einem offenen, freiheitlichen Land mit Toleranz
  zu leben, in einer Gesellschaft, die mit sich selbst im Reinen ist und die den jungen
  Menschen alle Chancen gibt, die die jungen Menschen verdienen. – Ihr habt es verdient.
  Herzlichen Glückwunsch!'
