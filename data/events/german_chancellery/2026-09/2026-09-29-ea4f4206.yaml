title: 'Sperrfrist: 29. September 2026, 16:30 Uhr Kulturbauten-Initiative: 5 Millionen
  Euro für das Kultur- und Technikdenkmal „Kapitän Meyer“ in Niedersachsen – Staatsminister
  Weimer: „Beeindruckendes Beispiel der Deutschen Schifffahrtsgeschichte“'
text: 'Im Rahmen seiner Kulturbauten-Initiative reist Staatsminister Weimer heute
  zum ersten Mal nach Niedersachsen. Er besuchte in Wilhelmshaven das historische
  Tonnenleger-Schiff „Kapitän Meyer“ und überreichte einen symbolischen Förderbescheid
  in Höhe von 5,095 Millionen Euro für die Entstehung eines modernen Museumsschiffs.
  Staatsminister Weimer: „Die Kapitän Meyer ist ein bedeutendes Kulturdenkmal und
  das letzte erhaltene Schiff dieser Klasse. Mit ihrer einzigartigen historischen
  Rolle ist sie zugleich ein beeindruckendes Beispiel der Deutschen Schifffahrtsgeschichte
  und sorgte mehr als drei Jahrzehnte für eine sichere Navigation durch unsere Küstengewässer.
  Heute fährt die Kapitän Meyer nicht mehr die Küste entlang, sondern lässt die Besucherinnen
  und Besucher als modernes und innovatives Museumsschiff in die Welt der Kaiserlichen
  Marine um 1913 eintauchen. Ich freue mich daher sehr, dass BKM die Sanierung des
  Museumsschiffs mit 5,095 Mio. Euro unterstützt und diesen besonderen Ort für künftige
  Generationen erhält.“ Die Kapitän Meyer ist der erste Tonnenleger einer deutschen
  Werft nach dem Zweiten Weltkrieg und war bis 1983 im Seezeichen- und Versorgungsdienst
  im Einsatz. Er ist der letzte erhaltene Vertreter seiner Klasse und steht seit 1988
  unter Denkmalschutz. Seine besondere technische Ausstattung unterstreicht seine
  technik- und seefahrtgeschichtliche Bedeutung. Als jederzeit für die Seefahrt reaktivierbares,
  technisch vollständig intaktes Schiff ist die „Kapitän Meyer“ das letzte seegängige
  Doppelschrauben-Dampfschiff Deutschlands. Die Bewahrung des Dampftonnenlegers „Kapitän
  Meyer“ stellt einen weiteren wichtigen Beitrag zum Erhalt des nationalen maritimen
  Erbes in Wilhelmshaven dar. Die Fördermittel in Höhe von 5,095 Millionen Euro dienen
  der denkmalgerechten Sanierung des Schiffes und der Umgestaltung in ein modernes
  und außergewöhnliches Schiffsmuseum. Ein besonderes Highlight ist die virtuelle
  Hafenrundfahrt mit einer Virtual-Reality-Brille: Besucherinnen und Besucher können
  hierbei unter anderem den Hafen der Kaiserlichen Marine um 1913 erleben. Weitere
  Stationen der Reise waren das Museumsdorf Cloppenburg und der historische Museumshafen
  Carolinensiel. Beiden Institutionen überreichte Staatsminister Weimer im Mai symbolische
  Förderbescheide im Bundeskanzleramt. Das Museumsdorf Cloppenburg erhielt für die
  Sanierung von 50 historischen Gebäuden Fördermittel in Höhe von 3 Millionen Euro.
  Für die Erneuerung und den Erhalt des bedeutsamen Museumshafens Carolinensiel, stellte
  BKM 2 Millionen Euro Fördermittel zur Verfügung. Kulturstaatsminister Weimer konnte
  sich vor Ort nun ein Bild der Baumaßnahmen machen. Die Stärkung der kulturellen
  Infrastruktur zählt zu den zentralen Anliegen der Bundesregierung. Mit nachhaltigen
  Investitionen unterstützt der Bund kulturelle Einrichtungen und Kulturdenkmäler
  von nationaler Bedeutung. Weitere Informationen rund um die BKM-Förderung von Kulturbauten
  finden Sie hier.'
