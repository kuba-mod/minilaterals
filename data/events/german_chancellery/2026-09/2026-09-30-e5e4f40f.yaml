title: 'Bericht der Ostbeauftragten 2026 – Staatsminister Weimer: „Kulturförderung
  in Ostdeutschland stärkt auch Wirtschaft und Gesellschaft“'
text: 'Staatsministerin Elisabeth Kaiser hat heute im Kabinett den Bericht der Ostbeauftragten
  2026 vorgestellt. Unter dem Titel „In Bewegung bleiben“ nimmt der Bericht die Entwicklungsmöglichkeiten
  der Menschen in Ostdeutschland in den Blick. Ein eigenes Kapitel zeigt, wie die
  Kulturförderung des Bundes hierzu beiträgt. Staatsminister für Kultur und Medien
  Wolfram Weimer: „Kultur ist ein wichtiger Faktor für die Entwicklung von Regionen
  und für die Chancen der Menschen, die dort leben. Museen, Theater, Gedenkstätten
  und andere Kulturorte schaffen Arbeitsplätze, vermitteln Wissen und bringen Menschen
  zusammen. Kulturförderung ist deshalb auch Struktur- und Standortpolitik. Wir wollen
  kulturelle Stärke in Ostdeutschland sichern und damit Menschen Möglichkeiten eröffnen,
  sich beruflich und persönlich zu entwickeln.“ Die vom Bund geförderten Kultureinrichtungen
  sind verlässliche Arbeitgeber, Ausbildungs- und Begegnungsorte und stärken insbesondere
  in ländlichen Regionen Ostdeutschlands die kulturelle und soziale Infrastruktur.
  Dazu zählen etwa die Stiftung Preußische Schlösser und Gärten Berlin-Brandenburg,
  die Klassik Stiftung Weimar, die Stiftung Bauhaus Dessau oder die Stiftung Deutsches
  Meeresmuseum in Stralsund. Investitionen in Kultur schaffen konkrete wirtschaftliche
  Effekte. Beim 400 Millionen Euro umfassenden Sonderinvestitionsprogramm für mitteldeutsche
  Schlösser und Gärten in Thüringen und Sachsen-Anhalt, das von beiden Ländern und
  dem Bund gemeinsam finanziert wird, gehen beispielsweise rund 80 Prozent der Aufträge
  an regionale Handwerksbetriebe. Davon profitieren Unternehmen, Beschäftigte und
  junge Menschen in Ausbildung. Mit dem Förderprogramm „Industriekultur“ stellt der
  Bund auch in den früheren Braunkohlerevieren in Brandenburg, Sachsen und Sachsen-Anhalt
  bis 2038 verlässlich Fördermittel für den Erhalt und die Umgestaltung herausragender
  Industriegebäude und -anlagen bereit. Kulturförderung eröffnet zugleich individuelle
  berufliche Perspektiven. Über das Programm „Press Start: Gründungsstipendium Games“
  erhielten 22 Stipendiatinnen und Stipendiaten aus Ostdeutschland zwischen 2024 und
  2026 Unterstützung bei der Entwicklung eigener Computerspiele und der Unternehmensgründung.
  Die Stiftung Kunstfonds vergab 2025 und 2026 insgesamt 77 Stipendien an Künstlerinnen
  und Künstler in Ostdeutschland. Auch die Exzellenzförderung stärkt die kulturelle
  Infrastruktur: Der mit 200.000 Euro dotierte Theaterpreis des Bundes ging 2026 an
  HELLERAU – Europäisches Zentrum für die Künste in Dresden. Das stellwerk junges
  Theater Weimar erhielt die mit 100.000 Euro dotierte Auszeichnung in der Kategorie
  Freie Produktionshäuser. Darüber hinaus stärkt die Bundesregierung die freie Szene
  durch die Förderung von Einzelkünstlerinnen und -künstlern, Künstlerresidenzen an
  freien Theaterhäusern und Programmen wie dem Fonds Darstellende Künste, dem Nationalen
  Performance Netz und dem Tanzpakt. Ein erheblicher Teil der Förderung kommt regelmäßig
  Produktionsorten in Ostdeutschland zugute. Darüber hinaus stärken Festivals und
  Kulturprogramme die Regionen. Die sechs vom Bund geförderten Filmfestivals in Ostdeutschland
  schaffen Sichtbarkeit, ziehen Besucherinnen und Besucher an und eröffnen Zugänge
  zur Film- und Kreativwirtschaft. Das Programm „Aller.Land“ unterstützt bis 2030
  Kultur, Beteiligung und Demokratie in 30 vor allem strukturschwachen ländlichen
  Räumen, davon elf in Ostdeutschland. Den Bericht finden Sie auf der Website der
  Beauftragten der Bundesregierung für Ostdeutschland. Ostdeutschland beherbergt zahlreiche
  kulturelle Schätze und historische Orte von nationaler und internationaler Bedeutung,
  die Teil des reichen kulturellen Erbes Deutschlands sind. Der Bund engagiert sich
  dafür, diese Kulturorte zu erhalten, weiterzuentwickeln und für kommende Generationen
  zugänglich zu machen. Einen Überblick über das Engagement des Bundes in Ostdeutschland
  finden Sie hier.'
