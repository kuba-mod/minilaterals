title: Halbjahresbilanz Rechenzentrumsstrategie Mehr Rechen power für Deutschland
text: 'Eine hochleistungsfähige Recheninfrastruktur stärkt die Souveränität und Wettbewerbsfähigkeit
  Deutschlands. Der Ausbau der Kapazität von Rechenzentren in Deutschland ist eine
  notwendige Grundlage dafür, KI -gestützte Lösungen und Anwendungen zu entwickeln.
  Rechenzentren spielen also eine Schlüsselrolle, um die digitale Leistungsfähigkeit
  Deutschlands und Europas auf ein neues Niveau zu heben. Mit ihrer Rechenleistung
  ermöglichen sie technologische Innovationen in vielen Wirtschafts- und Lebensbereichen
  und tragen zu mehr Wertschöpfung und Wettbewerbsfähigkeit bei. Mit der Halbjahresbilanz
  stellten Bundesdigitalminister Wildberger, Bundeswirtschaftsministerin Reiche, Bundesfinanzminister
  Klingbeil und Bundesforschungsministerin Bär gemeinsam den aktuellen Umsetzungsstand
  vor. Sechs Monate nach dem Beschluss sind bereits 25 der 28 Maßnahmen gestartet,
  vier bereits abgeschlossen, fünf befinden sich im parlamentarischen Verfahren. Zu
  den bereits erfolgreich abgeschlossenen Maßnahmen gehört die Bereitstellung einer
  souveränen KI - Cloud und die Fortführung von Staatszuschüssen zur Senkung der EEG
  -Kosten. Hier finden Sie das vollständige Zwischenmonitoring mit einer kurzen Statusbeschreibung
  zu allen 28 Maßnahmen. „Wir haben geliefert, was unser Land braucht: einen klaren
  Fahrplan für den Rechenzentrumsstandort Deutschland. Nach sechs Monaten zeigt sich,
  dass wir diesen gemeinsam zügig umsetzen“, so Bundesdigitalminister Karsten Wildberger.
  Die im Kabinett beschlossene Rechenzentrumsstrategie der Bundesregierung bündelt
  Ziele und Maßnahmen, um Deutschland zu einem attraktiven und führenden Standort
  für Rechenzentren weiter zu entwickeln. Der Anspruch: Die IT -Anschlussleistung
  von Rechenzentren in Deutschland soll sich bis 2030 gegenüber 2025 verdoppeln, die
  Anschlussleistung für High Performance Computing und KI mindestens vervierfachen.
  „Deutschland braucht mehr Rechenpower. Wir wollen führend bei Künstlicher Intelligenz
  in Europa werden und diese Technologie überall in Wirtschaft und Gesellschaft einsetzen“,
  sagte Bundesdigitalminister Karsten Wildberger. Die Strategie der Bundesregierung
  konzentriert sich auf drei Handlungsfelder: Energie und Nachhaltigkeit, Standort
  und Fläche sowie Technologie und Souveränität. Ziele sind wettbewerbsfähige Strompreise
  und eine nachhaltige Stromversorgung für Rechenzentren. Ein leistungsfähiges und
  flexibles Energiesystem ist die Voraussetzung für einen zukunftsfähigen Rechenzentrumstandort.
  Energieeffizienz, erneuerbare Energien, Abwärmenutzung und wassersparende Kühlsysteme
  sind zentrale Hebel für Nachhaltigkeit und Versorgungssicherheit. Die Bundesregierung
  will geeignete Flächen für neue Rechenzentren verfügbar machen sowie Planungs- und
  Genehmigungsverfahren beschleunigen. Um den Flächenverbrauch nicht weiter zu steigern,
  sollen vorhandene Flächen vorrangig nach-, um- und doppelgenutzt werden. Durch wirtschaftliche
  Anreize soll die Ansiedlung von Rechenzentren auch attraktiv für betroffene Kommunen,
  die Bevölkerung und die Wirtschaft vor Ort werden. Eine hochleistungsfähige Recheninfrastruktur
  für KI und Cloud -Anwendungen macht Deutschland und Europa souveräner und wettbewerbsfähiger.
  Die Rechenzentrumsstrategie ist ein Projekt der Modernisierungsagenda des Bundes
  mit Hebelcharakter.'
