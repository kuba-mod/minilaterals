date: '2026-09-29'
type: press_release
source_name: german_chancellery
title: Rede von Bundeskanzler Merz bei der Jahreskonferenz des Rats für Nachhaltige
  Entwicklung „Wir sind dabei, unsere Zukunft zu gewinnen“
text: '„Nachhaltigkeit, der Aufbau einer modernen Welt, das ist die Aufgabe unserer
  ganzen Gesellschaft“, sagte Bundeskanzler Merz in seiner Rede. In seiner Rede bei
  der Jahreskonferenz des Rates für Nachhaltige Entwicklung (RNE) betonte Bundeskanzler
  Merz, Deutschland sei auf gutem Weg zu einem nachhaltigen, zukunftsfähigen Sozialstaat,
  und „auf sehr gutem Weg zu einem digitalen, modernen, bürgernahen Staat“. „Anders
  formuliert: Wir sind dabei, um das Motto dieser Veranstaltung noch einmal aufzugreifen,
  eben unsere Zukunft zu gewinnen“, so der Kanzler. Mit dem Aktionsplan Nachhaltigkeit,
  den das Kabinett am Mittwoch beschließen will, wolle die Bundesregierung die deutsche
  Nachhaltigkeitspolitik pragmatischer machen, sagte Kanzler Merz weiter. „Vor allem
  messen wir ihre Erfolge daran, dass sie spürbar und schnell das alltägliche Leben
  der Menschen verbessert.“ Sehr geehrter Herr Vorsitzender, lieber Herr Professor
  Haug, lieber Herr Hoffmann, sehr geehrte Mitglieder des Rats für Nachhaltige Entwicklung,
  liebe Kolleginnen und Kollegen aus dem Deutschen Bundestag, meine Damen und Herren,
  herzlichen Dank für die sehr freundliche Begrüßung, Herr Haug, vielen Dank für die
  guten Gespräche, die wir auch in den letzten Monaten verschiedentlich führen konnten,
  und Ihnen, meine Damen und Herren, herzlichen Glückwunsch zum 25-jährigen Bestehen
  – zum 25. Geburtstag sozusagen – des Rats für Nachhaltige Entwicklung. Ich freue
  mich sehr, dass Sie uns, dass Sie die Bundesregierung nunmehr seit 25 Jahren gut
  beraten. Sie tun das kritisch und unbequem, so wie Sie es gerade auch gesagt haben,
  aber immer konzentriert und auch konzentriert auf ein Ziel. Denn, meine Damen und
  Herren, Ihr Rat ist so alt wie unser Jahrhundert, das 21. Jahrhundert. Dieses Jahrhundert
  muss eben geprägt sein vom Gedanken der Nachhaltigkeit. Sie, die Mitglieder dieses
  Rates, haben damit eine prägende Aufgabe – eine prägende Aufgabe für die Herausforderungen
  der Gegenwart, denen wir uns alle stellen müssen. Wir haben im 20., im letzten Jahrhundert
  gelernt, dass Globalisierung, Industrialisierung und Digitalisierung sehr segensreiche
  Entwicklungen sein können: Sie haben mehr Wohlstand ermöglicht, sie haben wissenschaftlichen
  Fortschritt ermöglicht, sie haben einen ungeheuren medizinischen Fortschritt ermöglicht,
  sie haben Vernetzung ermöglicht – sie haben schlicht ein besseres Leben und ein
  freieres Leben für viele Menschen auf der Welt – nicht für alle, aber für viele –
  ermöglicht. Wir haben in dieser Zeit auch gelernt, dass diese Entwicklungen politisch
  gestaltet werden wollen und dass sie auch gesteuert werden müssen, weil sie ohne
  Steuerung und ohne politische Gestaltung die Grundlagen unserer Freiheit und sogar
  die Grundlagen unseres Lebens gefährden können. Meine Damen und Herren, diese Entwicklungen
  des 20. Jahrhunderts – das gehört zum ganzen Bild dazu – haben eben auch zum Teil
  den Klimawandel verursacht und auch neue Ungleichheiten auf der Welt ausgelöst.
  Wir müssen jetzt lernen, mit dieser Dialektik umzugehen. Das war die Lektion des
  letzten Jahrhunderts. Nachhaltigkeit ist das Schlüsselwort, das uns zu den Antworten
  des 21. Jahrhunderts führen kann. Was heißt das? Es heißt, langfristig zu denken,
  aber auch generationengerecht zu handeln. Das ist eine Definition guter Politik
  in der Moderne und eben eine Definition von Nachhaltigkeit. Nachhaltigkeit ist also
  kein spezifisches Themenfeld. Nachhaltigkeit ist ein Leitprinzip für viele Themenfelder.
  Das heißt weiterhin: Nachhaltigkeit ist kein Vorrecht, kein Privileg einzelner Parteien,
  sondern sie ist allenfalls eine Dimension des parteipolitischen Wettbewerbs. Und
  schließlich heißt das: Nachhaltigkeit hat sehr viele Gesichter. In Deutschland bringen
  wir damit heute vor allem in Verbindung: Investitionen in die äußere Sicherheit,
  in die innere Sicherheit und genauso in ökologische Sicherheit, also in Umweltschutz,
  in Klimaschutz und auch in Klimaanpassung. Meine Damen und Herren, liebe Mitglieder
  des Rates, die Modernisierung und Digitalisierung des Staates ist eine solche zentrale
  Aufgabe, so wie auch der Wohnungsbau, die Verbesserung der Wettbewerbsfähigkeit
  unseres Wirtschaftsstandortes, die Sicherung unserer Rohstoffversorgung – eines
  der besonders kritischen Themen –, der Schutz der biologischen Vielfalt und nicht
  zuletzt die Stärkung der Bindekräfte unserer Gesellschaft. Ich hatte heute Morgen
  das große Glück, bei der Verleihung des Deutschen Schulpreises dabei zu sein und
  den Hauptpreis an eine Schule aus Baden-Württemberg zu vergeben. Meine Damen und
  Herren, die Förderung von Investitionen in Schulen und Ausbildungsstätten, die unsere
  Kinder und Jugendliche für diese Welt des 21. Jahrhunderts befähigen, ist eine für
  mich besonders erfüllende und begeisternde Aufgabe. Wenn man die Gesichter dieser
  Kinder sieht und sieht, wie sie sich über einen solchen Schulpreis freuen können,
  den Sie zum Teil mit jahrelangen Anstrengungen erstritten und erkämpft haben – und
  dann die Erfüllung an einem solchen Tag hier in Berlin: Es ist ein großes Glück
  nicht nur für die Kinder, sondern auch für die Eltern, für die Lehrer und schließlich,
  ganz offen gesagt, auch für mich, dies erleben zu dürfen. Das alles geht aber nur
  mit auf Dauer tragfähigen öffentlichen Haushalten auf allen staatlichen Ebenen.
  Genau deswegen reden wir auch über die Reformen unserer sozialen Sicherungssysteme.
  Diese Reformen sind kein Selbstzweck, sondern sie dienen der Zukunftsfähigkeit,
  der Nachhaltigkeit, der Tragfähigkeit für junge Generationen, die genauso einen
  Anspruch darauf haben, ein sicheres und verlässliches System der sozialen Absicherung
  vorzufinden. Das alles ist zusammengenommen eine Agenda für Nachhaltigkeit. Es ist
  auch die Agenda der Bundesregierung. Wir haben in allen diesen Bereichen Maßnahmen
  ergriffen, wir haben in allen diesen Bereichen Gesetze verabschiedet, und wir haben
  in allen diesen Bereichen Pläne miteinander ausgearbeitet, die wir in dieser Wahlperiode
  in die Umsetzung bringen wollen. Lassen Sie mich auch das hinzufügen: Dies sind
  keine normalen Zeiten. Dies sind auch keine einfachen Zeiten. Wir beklagen uns nicht
  darüber, aber wir leben in einer historischen Situation. Was wir in den nächsten
  vier Jahren entscheiden –  und genauso, was wir in diesen Jahren nicht entscheiden –,
  das wird das Gesicht unseres Landes für vielleicht Jahrzehnte prägen – mehr jedenfalls
  als in normalen Zeiten. Das alles, meine Damen und Herren, ist keine Frage von Optionen,
  von Möglichkeiten, nach dem Motto: Das könnte man tun und das könnte man vielleicht
  auch lassen. Nein, wir müssen jetzt die Grundlagen dafür legen, dass unser Land
  im 21. Jahrhundert lebenswert ist bzw. in möglichst vielen Bereichen vielleicht
  sogar noch lebenswerter ist, als es heute schon ist. Wir wollen – ich betone das
  erneut –, dass die junge Generation ein Land übernimmt, das ihnen nicht nur eine
  Chance auf Wohlstand, sondern auch ein besseres Leben insgesamt ermöglicht. Generationengerechtigkeit,
  das ist Nachhaltigkeit. Das fordert nicht nur von uns, sondern das fordert von unserer
  Gesellschaft insgesamt, dass wir auf einer ganzen Reihe von Baustellen gleichzeitig
  tätig werden – zum Teil – auch das sagen wir ganz offen –, weil wir zu lange von
  der Substanz gelebt haben, zum Teil, weil sich die Welt um uns herum in so rasantem
  Tempo verändert, und zum Teil, weil wir neue Wege und Mittel finden müssen, um diesen
  Wandel eben in unserem Sinne mitzugestalten. Ich will an dieser Stelle keine Hierarchie
  der verschiedenen Aufgaben der Nachhaltigkeit aufstellen. Es ist aber kein Geheimnis,
  dass ich die ökonomische Nachhaltigkeit, die Nachhaltigkeit in Fragen der inneren
  und äußeren Sicherheit, aber auch die Nachhaltigkeit in Fragen des Klimaschutzes
  und der Ökologie für besonders drängend halte. Alle diese Bereiche sind auf ihre
  Weise dringlich. Auch darum ist es aus meiner Sicht einfach kontraproduktiv, dass
  immer wieder behauptet wird, es gebe insbesondere zwischen Klimaschutz und Wirtschaftswachstum
  einen geradezu unauflöslichen Zielkonflikt. Wir haben es aus meiner Sicht vielmehr
  mit einem – lassen Sie mich das so ausdrücken – Ergänzungsverhältnis zu tun, und
  zwar nicht nur auf einer abstrakten Ebene, sondern ganz konkret. Die dynamischen
  Zukunftsmärkte heute entstehen mit Methoden, Verfahren und Produkten, die erneuerbare
  Energieerzeugung oder die intelligente Nutzung von Energie ermöglichen, indem man
  einspart und auch effizient speichert. Deutschland ist – das wissen viele hier im
  Raum – führend in vielen dieser Wachstumsbranchen. Der Cleantech -Sektor wächst
  in Deutschland seit 2010, also seit 15 Jahren, überdurchschnittlich mit rund fünf
  Prozent pro Jahr und damit deutlich dynamischer als die gesamte Wirtschaft. Fünf
  Prozent in 15 Jahren, das ist mehr als eine Verdopplung innerhalb von anderthalb
  Jahrzehnten. Wir hatten, um es einmal in Zahlen auszudrücken, bereits im Jahr 2023
  eine Bruttowertschöpfung in Höhe von über 300 Milliarden Euro in diesem Bereich.
  Umwelttechnologien könnten in den nächsten Jahren bis zu zwei Prozent unseres Bruttoinlandproduktes
  ausmachen. Nachhaltiger Klimaschutz und nachhaltiges Wirtschaftswachstum sind in
  diesem Sinne also keine Gegensätze, sondern zwei Seiten derselben Medaille. Sie
  sind genauso Hebel für Resilienz und Energiesouveränität und also für Sicherheit
  im umfassenden Sinne. Innovationspolitik ist darum ein zentraler Baustein der Nachhaltigkeitsstrategie
  der Bundesregierung. Die meisten von Ihnen, meine Damen und Herren, werden wissen,
  dass wir vor einem Jahr mit unserer Hightech Agenda eine große Innovationsoffensive
  gestartet haben. Wir fördern Schlüsseltechnologien, die langfristig den Wohlstand
  unseres Landes sichern sollen und die gleichzeitig dabei helfen können, Probleme
  der Menschheit zu lösen. Technologien für klimaneutrale Mobilität etwa stehen darin
  im Fokus, auch die Fusionstechnologie, Biotechnologie, künstliche Intelligenz, die
  uns allen zusammen schneller Fortschritte in diesen Bereichen ermöglichen. Wenn
  wir nur über Möglichkeiten sprechen, dann wird oft übersehen, was tatsächlich schon
  stattfindet. Deutschland steht – das wird gern übersehen – im internationalen Vergleich
  sehr gut da, etwa mit Blick auf industrielle KI und Robotik. Das heißt, wir sind
  in der Lage, mitzubestimmen, wie sich diese vierte industrielle Revolution –  wir
  nennen es ja so – entwickelt und dass sie sich eben im Sinne der Nachhaltigkeit
  entwickelt. Wie wir diese Entwicklung am besten lenken, das ist eine politische
  Frage. Sie alle kennen meine Position, dass die Politik nicht der Versuchung erliegen
  sollte, diese Transformation bis ins Kleinste zu regulieren. Wir kommen der Steuerungsaufgabe,
  die wie in der Politik haben, am besten nach, indem wir einfach einen verlässlichen,
  dauerhaften und auch nachhaltigen Rahmen für die Unternehmen setzen, die in diesen
  Bereichen tätig sind. Die wichtigste Botschaft dabei ist: Die Transformation zur
  Klimaneutralität zahlt sich langfristig aus. – Wir wissen dabei, dass marktwirtschaftliche
  Instrumente funktionieren. Ich will Ihnen ein Beispiel nennen. Der europäische Emissionshandel
  hat ganz wesentlich dazu beigetragen, den CO 2 -Ausstoß zu senken, Investitionen
  in saubere Technologien auszulösen und neue, nachhaltige Geschäftsmodelle zu ermöglichen.
  Ein zweiter Schritt, nachdem wir im Kabinett und im Parlament entschieden haben,
  neue Technologien wie etwa CCS und CCU zu ermöglichen, wäre es, nun die Kohlenstoffmärkte
  international stärker zu vernetzen. Denn klar ist auch: Unsere europäischen Unternehmen
  stehen im internationalen Wettbewerb mit Volkswirtschaften, in denen teilweise deutlich
  geringere Anforderungen an den Klimaschutz gelten. Aber niemandem ist doch geholfen,
  wenn Produktionskapazitäten in Europa abgebaut und andernorts mit höheren Emissionen
  wiederaufgebaut werden, nur damit wir die dort hergestellten Produkte anschließend
  nach Deutschland importieren. Also tun wir es doch besser selbst und besser. Meine
  Damen und Herren, der internationale Kohlenstoffmarkt ist eine Lösung für dieses
  Problem. Die Idee ist nicht neu. Aber sie ist bisher nicht auf ein entsprechendes
  politisches Möglichkeitsfenster getroffen. Dieses Möglichkeitsfenster wird sich
  desto mehr öffnen, je mehr sich in der Welt die Erkenntnis von der Wachstumskraft
  klimaneutraler Märkte durchsetzt, und das geschieht im Augenblick. Wir, die Deutschen,
  sind bereit. Wir sollten jedenfalls bereit sein, gemeinsam mit anderen Staaten und
  Regionen zu prüfen, wie wir gemeinsam in diesen Fragen vorankommen. Nun, meine Damen
  und Herren, Sie werden mich aber über den Klimawandel nicht nur als Wachstumschance
  sprechen hören. Das wäre unzureichend. Denn wir sind an einem Punkt angelangt, an
  dem der Klimawandel nicht mehr allein eine Frage der Prävention ist, sondern längst
  eine Realität, die Schäden anrichtet. Wir sehen und spüren das immer drastischer
  auch hier bei uns im Land. Wir alle haben die Bilder der Waldbrände in diesem Jahr
  noch vor Augen. Es war der heißeste Sommer seit Beginn der Aufzeichnung. Ich kenne
  viele Landwirte und Forstwirte, die mit den Folgen der Trockenheit schwer zu kämpfen
  haben und deren Dürre im Boden noch längst nicht vorbei ist. Wir alle kennen Menschen
  mit Erkrankungen, für die die Hitzewochen eine echte Belastung waren. Der Klimawandel
  ist zu einer Bedrohung für Leib und Leben geworden. Ökologische Sicherheit bedeutet
  darum auch Klimaanpassung. Wir müssen vorsorgen. Wir müssen unsere Städte widerstandsfähiger
  gegen Hitze machen, unsere Infrastruktur besser vor Extremwetter schützen, unsere
  Wasserressourcen sichern und unsere Land- und Forstwirtschaft an veränderte Bedingungen
  anpassen. Das Bundeskabinett hat sich im August genau damit befasst. Ich habe die
  Bundesregierung und insbesondere die Mitarbeiterinnen und Mitarbeiter im Kanzleramt
  darum gebeten, mit den Ländern einen Abgleich vorzunehmen, um festzustellen, an
  welchen Stellen Verbesserungen für uns alle denkbar sind. Wir haben dafür auch umfassende
  Haushaltsmittel zur Verfügung gestellt. Es gibt schon viele Förderprogramme, etwa
  das Programm des Bundesbauministeriums zur Anpassung urbaner und ländlicher Regionen
  an den Klimawandel, das Programm des Landwirtschaftsministeriums zum klimaangepassten
  Waldumbau und das Programm des Umweltministeriums zur Klimaanpassung in sozialen
  Einrichtungen. Wir werden gleichzeitig unsere nationalen Anstrengungen verstärken,
  um auf nationaler Ebene die 17 Ziele der Agenda 2030, die Sie alle kennen, zu erreichen.
  Wir haben deswegen schon im November des vergangenen Jahres im Kabinett einen Beschluss
  gefasst, um die Deutsche Nachhaltigkeitsstrategie weiterzuentwickeln. Wir haben
  darin fünf Handlungsfelder definiert, auf die wir uns fokussieren wollen. Ich nenne
  sie: Staatsmodernisierung, nachhaltiges Wirtschaftswachstum, soziale Gerechtigkeit,
  Bewahrung der natürlichen Lebensgrundlagen und internationale Zusammenarbeit. Morgen
  – deswegen passt es gut, dass wir uns heute sehen – werden wir im Kabinett mit dem
  Aktionsplan „Nachhaltigkeit für ein modernes und zukunftsfähiges Deutschland“ unser
  Instrument für den politischen Fortschritt auf diesen Handlungsfeldern verabschieden.
  Wir machen die deutsche Nachhaltigkeitspolitik damit pragmatischer. Vor allem messen
  wir ihre Erfolge daran, dass sie spürbar und schnell das alltägliche Leben der Menschen
  verbessert. Meine Damen und Herren, denn genau an diesem Punkt entscheidet sich
  auch die Akzeptanz für die Nachhaltigkeitspolitik und die Zukunftsfähigkeit unserer
  Gesellschaft insgesamt, am Zukunftswillen der Bürgerinnen und Bürger. Dieser Wille
  wiederum steht in direkter Abhängigkeit von der Erfahrung, dass langfristorientierte,
  nachhaltige Politik etwas Gutes bringt. Im Augenblick sind in unserem Land die Ängste
  vor der Zukunft weit stärker ausgeprägt als die Zuversicht. Darauf muss wohlverstandene
  Nachhaltigkeitspolitik reagieren. Nachhaltigkeitspolitik muss etwas zum Positiven
  wenden. Dann wird sie auch die breite Unterstützung in der Bevölkerung finden. Sie
  werden darum in dem Aktionsplan, den wir morgen verabschieden, etwa auch Maßnahmen
  zur Bekämpfung von Einsamkeit finden. Einsamkeit ist eine zentrale Ursache für Zukunftsangst,
  gerade auch bei jungen Menschen. Sie finden darin Maßnahmen zur Prävention von Krankheiten,
  zur Verbesserung der Luftqualität, auch zur Verbesserung der Ernährungsgewohnheiten.
  Sie finden darin Maßnahmen zur Unterstützung des organisierten Sports in Deutschland.
  Sie finden darin Maßnahmen für nachhaltige Entwicklung und nachhaltiges Wirtschaften
  im globalen Kontext, zum Beispiel über den Hebel der globalen Textillieferketten.
  Wir haben schließlich die großen Investitionsvorhaben der Bundesregierung in dem
  Aktionsplan abgebildet. Eine Mission etwa arbeitet daran, Investitionen aus dem
  Sondervermögen für Infrastruktur und Klimaneutralität genau auf ihre Wirkungen hin
  zu messen und transparent zu machen. Die Erfolgschancen dieser Mission, meine Damen
  und Herren, hängen übrigens nicht zuletzt davon ab, dass wir in den Verwaltungen
  ressortübergreifend und verständlich arbeiten. Genau das ist sozusagen auf der Metaebene
  ein weiterer Zweck unseres Aktionsplans, dass wir Staat und Verwaltung trainieren,
  kooperativ komplexe Herausforderungen zu lösen, dass wir wegkommen von dem Silodenken
  in Ressortzuständigkeiten. Auch ein moderner, flexibler Staat ist eine Dimension
  der Nachhaltigkeit. In diesem Sinne verstehen wir den Aktionsplan auch als nicht
  abgeschlossen, sondern als ein lernendes Programm. Wir wollen und wir werden ihn
  weiterentwickeln. Ich möchte ausdrücklich hinzufügen: Wir setzen dabei auf Ihre
  Mitwirkung und auf Ihre Ideen. Sie haben in der ersten Runde ja bereits konkrete
  Vorschläge eingebracht. Auf die erste Fassung dieses Aktionsplans hin sind bei uns
  80 Stellungnahmen der Vertreterinnen und Vertreter der Zivilgesellschaft, der Wirtschaft,
  der Wissenschaft eingegangen, viele von denen, die hier auch im Raum sitzen. Lassen
  Sie mich sagen: Ich danke Ihnen sehr dafür. Ich bitte Sie aber auch, darin nicht
  nachzulassen. Nun, meine Damen und Herren, ich weiß nicht, wer von Ihnen die neue
  Enzyklika von Papst Leo XIV. zur Kenntnis genommen hat, die sogenannte KI -Enzyklika.
  Er war ja gestern in Frankreich und hat dort viel Zustimmung gerade aus der jungen
  Generation bekommen. Diese Enzyklika enthält eine schöne Definition von Nachhaltigkeit.
  Dort ist die Rede vom „Aufbau einer Welt, in der alle ,zur Blüte gelangen‘ können“.
  – Und die Enzyklika e enthält auch diesen folgenden schönen Satz: „Einem jeden seinen
  Mauerabschnitt: den Wissenschaftlern und Forschern, den Unternehmern und Arbeitnehmern,
  den Pädagogen und Gesetzgebern, der Zivilgesellschaft, den Volksbewegungen und den
  Glaubensgemeinschaften.“ Ich finde, das ist ein schönes Wort und eine schöne Aufforderung
  an uns alle, denn genau so ist es: Nachhaltigkeit, der Aufbau einer modernen Welt,
  das ist die Aufgabe unserer ganzen Gesellschaft. Die Zukunft, unsere Zukunft entsteht,
  während wir diese Aufgabe lösen, mit der ganzen Hartnäckigkeit und Kreativität,
  die uns doch zur Verfügung steht. Die Transformation der nächsten Jahre – auch das
  sei hinzugefügt – wird nicht ohne Anstrengungen und auch nicht ohne Wachstumsschmerzen
  vor sich gehen. Wir wechseln gewissermaßen die Achse, während der Zug fährt. Es
  gibt keine Trockenübungen, keine Versuchslabore. Die Welt um uns herum, sie dreht
  sich in atemberaubender Geschwindigkeit weiter. Aber mit jedem Schritt, der uns
  gelingt, und uns gelingt auch viel, wird auch die Zuversicht in unserem Land wachsen
  und damit das Vertrauen in die Kraft der liberalen Demokratie. So war es in der
  Vergangenheit, so wird es auch jetzt wieder sein. Reale Erfolge, reale Erfahrung,
  genau das ist der Stoff für Zuversicht. Wenn wir uns umsehen, dann werden wir jetzt
  schon eine Menge davon in unserem Land finden, und zwar in allen Milieus, in allen
  Sektoren und in allen politischen Lagern. Um es beispielhaft abschließend noch einmal
  für den Bereich der Wirtschaft konkret zu machen: 2025 war ein Rekordjahr für den
  Ausbau der erneuerbaren Energien, und diese Dynamik setzt sich fort, entgegen mancher
  Behauptung, wir würden hierbei auf die Bremse treten. 2025 war ein Rekordjahr für
  die Gründung von Start-ups in Deutschland, und diese Dynamik zieht noch einmal an.
  Wir haben die Zahlen des Jahres 2025 schon zur Mitte des Jahres 2026 wieder erreicht.
  Wir sind also auf dem Weg zu einem innovationsstarken und nachhaltigen Wirtschaftswachstum.
  Wir sind genauso auf gutem Weg zu einem verteidigungsfähigen Europa, und wir sind
  auf einem guten Weg – lassen Sie mich dieses Wort sagen – zur strategischen Souveränität
  Europas. Wir sind auf gutem Weg zu einem nachhaltigen, zukunftsfähigen Sozialstaat,
  und wir sind auf sehr gutem Weg zu einem digitalen, modernen, bürgernahen Staat.
  Anders formuliert: Wir sind dabei, um das Motto dieser Veranstaltung noch einmal
  aufzugreifen, eben unsere Zukunft zu gewinnen. Meine Damen und Herren, wenn Sie
  als Rat für Nachhaltige Entwicklung in, sagen wir einmal, 75 Jahren Ihren 100. Geburtstag
  feiern, dann wird es hoffentlich auch möglich sein, festzustellen: Dieses 21. Jahrhundert
  ist tatsächlich ein Jahrhundert der Nachhaltigkeit geworden – in der Welt, in Europa
  und auch und ganz besonders bei uns in Deutschland.'
