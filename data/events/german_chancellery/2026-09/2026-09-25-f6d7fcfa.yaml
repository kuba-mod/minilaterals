date: '2026-09-25'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 25. September 2026
text: '(Vorsitzende Buschow eröffnet die Pressekonferenz und begrüßt SRS Meyer sowie
  die Sprecherinnen und Sprecher der Ministerien.) Es wird jetzt etwas länger, weil
  es eine vollgepackte nächste Woche für den Kanzler gibt. Ich würde an dieser Stelle
  einmal auf die öffentlichen Termine hinweisen. Am Montag, den 28. September 2026,
  wird der Bundeskanzler um 11 Uhr am Festakt zum 75-jährigen Jubiläum des Bundesverfassungsgerichts
  in der Stadthalle in Karlsruhe teilnehmen. Der Festakt ist presseöffentlich. Am
  Nachmittag wird der Bundeskanzler gegen 15.30 Uhr im Saarland die Dillinger Hütte
  besuchen und an einer Veranstaltung der Stahl-Holding-Saar teilnehmen. Dabei wird
  der Kanzler eine Rede halten und sich ein Bild von der Transformation des Unternehmens
  machen. Dort ist eines der aktuell größten Bauvorhaben in Europa zu besichtigen.
  Die Stahlproduktion wird auf moderne, nachhaltige Verfahren umgestellt. Außerdem
  wird dort eine Produktion zur Herstellung von Siliziumkarbid aufgebaut, das auch
  für die Fertigung moderner Hochleistungselektronik wie Chips benötigt wird. Das
  Ziel ist es, Abhängigkeiten in diesem Bereich zu verringern. Deutschland ist der
  größte Stahlproduzent in Europa, und die Stahlindustrie ist in vielen Regionen Deutschlands
  ein wichtiger Arbeitgeber. Die Veranstaltung vor Ort ist presseöffentlich. Anschließend,
  gegen 17.30 Uhr, wird der Bundeskanzler an der Einweihung der Helmut-Kohl-Straße
  und der Rue François Mitterrand in Saarlouis teilnehmen und dort auch eine Rede
  halten. Auch dieser Termin ist presseöffentlich. Nun sind wir beim Dienstag, den
  29. September. Dann wird der Bundeskanzler ab 10.30 Uhr an der Verleihung des Deutschen
  Schulpreises in Berlin-Adlershof teilnehmen. Er wird dort ein Grußwort sprechen
  und anschließend den Hauptpreis an die Vertreterinnen und Vertreter der Gewinnerschule
  übergeben. Der Deutsche Schulpreis ist der renommierteste und mit 100 000 Euro höchstdotierte
  Preis für vorbildlich arbeitende Schulen. Die Robert Bosch Stiftung vergibt die
  Auszeichnung seit 2006 gemeinsam mit der Heidehof Stiftung. Seit dem Start der Initiative
  haben sich bereits etwa 2500 Schulen für den Preis beworben. 15 Schulen wurden für
  das diesjährige Finale nominiert. Die Veranstaltung wird in einem Livestream auf
  ARD alpha und auf der Internetseite des Schulpreises übertragen. Am Dienstagnachmittag,
  ab 14 Uhr, wird der Kanzler dann an der 25. Jahreskonferenz des Rates für Nachhaltige
  Entwicklung teilnehmen. Der Bundeskanzler wird dort eine Rede halten und anschließend
  Fragen aus dem Publikum beantworten. Die Jahreskonferenz steht unter dem Motto „25
  Jahre RNE: Zukunft gewinnen“ und findet im Radialsystem in Berlin statt. Die gesamte
  Veranstaltung ist presseöffentlich und wird live gestreamt. Das Programm finden
  Sie auf der Internetseite des Rates für Nachhaltige Entwicklung. Danach, um 16 Uhr,
  wird Bundeskanzler Merz den kasachischen Präsidenten Kassym-Schomart Tokajew im
  Bundeskanzleramt empfangen . Im anschließenden Vier-Augen-Gespräch wird es um den
  Ausbau der bilateralen Energie- und Rohstoffpartnerschaft, um Fragen der regionalen
  Zusammenarbeit und die internationale Sicherheitspolitik gehen. Anschließend ist
  für 17 Uhr eine gemeinsame Pressekonferenz geplant. Am Mittwoch, den 30. September,
  wird um 10 Uhr wie gewohnt die Kabinettssitzung unter der Leitung des Bundeskanzlers
  stattfinden. Am Nachmittag ab 17.30 Uhr wird der Bundeskanzler am Jahrestreffen
  der Initiative „Made for Germany“ in der Mosaikhalle der Siemens AG in Berlin teilnehmen.
  Er wird dort einen Impulsvortrag halten. Dieser Termin ist ebenfalls presseöffentlich.
  Anschließend wird er mit Mitgliedern der Initiative sprechen. Ihr gehören zahlreiche
  namhafte Unternehmen an. Angeführt von Siemens und der Deutschen Bank, wurde sie
  vor einem Jahr mit dem Ziel angestoßen, einen Beitrag zur Verbesserung des Investitionsklimas
  in Deutschland zu leisten. Die Bundesregierung begrüßt die Absicht der Unternehmen,
  in den Wirtschafts- und Industriestandort Deutschland und seine Arbeitsplätze zu
  investieren und ihn für die Zukunft zu rüsten. Zum Abschluss des Besuchs ist ein
  gemeinsames Pressestatement des Bundeskanzlers mit dem Vorstandsvorsitzenden der
  Siemens AG, Roland Busch, und dem Vorstandsvorsitzenden der Deutschen Bank AG, Christian
  Sewing, geplant. Am Donnerstag, den 1. Oktober, wird der Bundeskanzler das Deutsch-Niederländische
  Korps in Münster besuchen , gemeinsam mit dem niederländischen Ministerpräsidenten
  Rob Jetten und NATO-Generalsekretär Mark Rutte. Nach einem Lagebriefing und einem
  Austausch mit Soldatinnen und Soldaten wird es dort eine Pressebegegnung geben,
  voraussichtlich gegen 13.40 Uhr. Im Anschluss wird der Bundeskanzler jeweils ein
  bilaterales Gespräch mit dem niederländischen Ministerpräsidenten und dem NATO-Generalsekretär
  führen. Dabei werden sicherheits-, europa- und außenpolitische Themen im Vordergrund
  stehen. Im Anschluss wird der Internationale Preis des Westfälischen Friedens im
  historischen Rathaus von Münster an die NATO verliehen, welcher durch NATO-Generalsekretär
  Mark Rutte stellvertretend entgegengenommen wird. Der Bundeskanzler wird zu diesem
  Anlass die Laudatio halten. Am Wochenende dann, vom 2. bis zum 4. Oktober, werden
  in Bremen die Feierlichkeiten zum Tag der Deutschen Einheit stattfinden. Der Bundeskanzler,
  aber auch die Bundesregierung insgesamt werden zu Gast sein. Der Bundeskanzler wird
  am 3. Oktober gegen 9.20 Uhr am Rathaus der Freien Hansestadt Bremen eintreffen
  und sich gemeinsam mit den anderen Repräsentantinnen und Repräsentanten der Verfassungsorgane
  in das Goldene Buch der Stadt eintragen. Um 10 Uhr wird der Bundeskanzler den Ökumenischen
  Gottesdienst im St. Petri Dom besuchen. Um 12.15 Uhr wird er am Festakt im Konzerthaus
  „Die Glocke“ teilnehmen. Im Anschluss wird er zu Gast beim Empfang des Bundespräsidenten
  sein. Besucherinnen und Besuchern bietet sich bei den Feierlichkeiten in Bremen
  unter anderem die Gelegenheit, vom 2. bis zum 4. Oktober die Arbeit der Ministerien
  kennenzulernen und mit vielen Bundesministerinnen und Bundesministern sowie weiteren
  Gäste aus Kultur, Wissenschaft, Sport und Politik ins Gespräch zu kommen. Das gesamte
  Programm finden Sie unter anderem auf der Internetseite der Bundesregierung sowie
  auf der offiziellen Seite der Stadt Bremen. So weit zu den Terminen in der nächsten
  Woche. Dann würde ich gern noch einen Punkt aktiv ansprechen. Die Gemeinschaftsdiagnose
  der deutschen Wirtschaftsinstitute sieht die deutsche Wirtschaft im Aufwind. Ich
  glaube, wir können sagen: Der Aufschwung ist da, und es geht jetzt darum, daraus
  einen langfristigen und nachhaltigen Aufschwung zu machen. Die Wirtschaft ist im
  ersten Halbjahr stärker als erwartet gewachsen. Zudem verdoppeln die Wirtschaftsforschungsinstitute
  ihre Konjunkturprognose für 2026 von 0,6 Prozent auf 1,3 Prozent. Nach einer mehrjährigen
  Schwächephase liege die deutsche Wirtschaftsleistung erstmals wieder über dem Niveau,
  das 2022, vor dem Ausbruch der Gaspreiskrise, erreicht worden war. Gründe für das
  Wachstum sind vor allem höhere Exporte sowie Impulse aus den Investitionen und dem
  Sondervermögen. Das zeigt auch: Das Geld aus dem Sondervermögen fließt schnell ab,
  was zeigt, dass auch die neuen, schnelleren Vergaberegeln, die wir als Bundesregierung
  eingeführt haben, wirken. Auch die neue OECD-Prognose unterstützt die positiven
  Erwartungen. Es gibt also auch Grund zur Zuversicht, dass sich diese Entwicklung
  auch bei der Lohnentwicklung und auch am Arbeitsmarkt positiv für die Bürgerinnen
  und Bürger auswirken kann, wenn es gelingt, aus diesem Aufschwung wirklich einen
  nachhaltigen Aufschwung zu machen. Deutschland verfügt über eine im internationalen
  Vergleich niedrige Staatsschuldenquote. Damit das so bleibt, wird die Bundesregierung
  den Bundeshaushalt weiter konsolidieren und auf Zukunftsausgaben ausrichten. Die
  Bundesregierung setzt weiterhin alles daran, diese Entwicklung zu einem langfristigen
  Aufschwung zu machen und Deutschlands Wirtschaft weiter auf Wachstumskurs zu bringen,
  und zwar, indem wir den eingeschlagenen Reformkurs entschlossen und mit großem Tempo
  fortsetzen, insbesondere dort, wo es der Wettbewerbsfähigkeit unseres Landes dient.
  Ich habe eine Reise des Außenministers anzukündigen. Außenminister Wadephul reist
  am Montag zu seinem Antrittsbesuch nach Den Haag . Dort trifft er zunächst seinen
  niederländischen Amtskollegen Tom Berendsen zu politischen Gesprächen. Die Niederlande
  sind für Deutschland einer der engsten Partner überhaupt. Im Mittelpunkt der Gespräche
  werden unter anderem unser gemeinsames Engagement für einen modernen und zielgerichteten
  EU-Haushalt, die enge militärische Zusammenarbeit und Integration ‑ Stichwort Deutsch-Niederländisches
  Korps ‑ sowie die gemeinsame Unterstützung der Ukraine stehen. Den Haag kommt als
  Sitz mehrerer internationaler Gerichtshöfe eine besondere Bedeutung für die Wahrung
  und Stärkung des internationalen Rechts zu. Im Anschluss an ihr bilaterales Gespräch
  werden die beiden Außenminister daher gemeinsam den Internationalen Strafgerichtshof
  besuchen. Dort werden sie mit der Präsidentin des IStGH, Tomoko Akane, sowie mit
  der Vize-Chefanklägerin, Nazhat Shameem Khan, zusammentreffen. Der IStGH steht derzeit
  unter erheblichem Druck. Mit seinem Besuch will Außenminister Wadephul die klare
  und unverbrüchliche Unterstützung Deutschlands für den Gerichtshof unterstreichen.
  Am Dienstag setzt Außenminister Wadephul seine Reise in der Slowakei fort. In Bratislava
  wird er sowohl seinen Amtskollegen Juraj Blanár als auch Ministerpräsident Robert
  Fico treffen. Im Zentrum der Gespräche stehen die gemeinsamen Verpflichtungen und
  die Verantwortung, die sich für die Slowakei aus ihrer Mitgliedschaft in der Europäischen
  Union sowie auch aus der Mitgliedschaft in der NATO ergeben. Dies gilt insbesondere
  mit Blick auf die Unterstützung der Ukraine und das Verhältnis zu Russland. Angesichts
  der Herausforderungen, vor denen Europa steht, ist es entscheidend, dass alle europäischen
  Partner ihre Verantwortung wahrnehmen und gemeinsam handeln. Das ist eine der Botschaften
  dieser Reise in die Slowakei. Den Abschluss der Reise bildet ein Besuch des Außenministers
  beim Europarat in Straßburg . Dort wird er eine Rede vor der Parlamentarischen Versammlung
  des Europarates halten und sowohl Gespräche mit der Präsidentin der Parlamentarischen
  Versammlung, Petra Bayr, dem Generalsekretär des Europarats, Alain Berset, sowie
  dem Präsidenten des Europäischen Gerichtshofs für Menschenrechte, Mattias Guyomar,
  führen. Gerade mit Blick auf die Unterstützung der Ukraine ist der Europarat zentral.
  Beispielsweise ist das Schadensregister für die Ukraine, das vom Europarat eingerichtet
  wurde, ein erster Schritt zu einem umfassenden künftigen Entschädigungsmechanismus
  für den völkerrechtswidrigen Angriff Russlands auf die Ukraine. Deutschland kommt
  als einem der größten bilateralen Geber des Europarats eine wichtige Rolle zu. In
  Straßburg wird Außenminister Wadephul daher das deutsche Engagement für den Schutz
  und die Stärkung von Menschenrechten, Rechtsstaatlichkeit und Demokratie hervorheben.
  Meine Frage richtet sich an das BMF. Mit wie hohen Mehreinnahmen rechnen Sie dadurch,
  dass die Benzin- und Dieselpreise in den vergangenen Monaten so hoch lagen? Wir
  hatten das Thema hier bereits in der vergangenen Woche. Ich bin nicht mehr ganz
  sicher, ob es am Mittwoch oder am Freitag war. Die Frage gibt mir aber die Gelegenheit
  noch einmal mit einer Sache aufzuräumen, die in der öffentlichen Diskussion immer
  wieder einmal auftaucht. Wir gehen derzeit nicht davon aus, dass der Staat, dadurch,
  dass die Preise so hoch liegen, Mehreinnahmen hat. Alle Indikatoren, die uns momentan
  vorliegen ‑ das sind noch keine abschließenden Zahlen ‑, deuten darauf hin, dass
  das Gegenteil der Fall ist, dass also die Steuereinnahmen in dem Zeitraum gesunken
  sind, zum einen durch die Absenkung der Energiesteuer selbst, aber natürlich auch
  dadurch, dass ‑ darauf deuten die Daten hin ‑ Menschen einfach weniger getankt haben.
  Herr Meyer, die Wirtschaftsforschungsinstitute, die Sie eben noch zitiert haben,
  haben gestern zum Tankrabatt gesagt, er sei zwar populär, aber total unvernünftig,
  weil es am Ende doch alle bezahlen müssten. Dem müssen Sie doch etwas entgegenhalten.
  Sagen Sie uns, warum es vernünftig ist! Eine volkswirtschaftliche Betrachtung von
  Maßnahmen ist eine mögliche Betrachtung. Sie ist natürlich total relevant und wichtig
  für uns. Aber gleichzeitig ging es uns ja darum, ein klares Signal an der Zapfsäule
  zu setzen, und angesichts der gestiegenen Tankpreise die Bürgerinnen und Bürger,
  insbesondere diejenigen, die aufs Auto angewiesen sind, die jeden Morgen zur Arbeit
  fahren und auch weite Wege zur Arbeit in Kauf nehmen müssen, die auch keine Möglichkeit
  haben, auf den öffentlichen Nahverkehr umzusteigen, schnell zu unterstützen. Die
  Entscheidung ist vor wenigen Tagen getroffen worden. Wir haben jetzt die Möglichkeit,
  dass sie bereits zum 1. Oktober greift. Der Weg, bei der Energiesteuer zu einer
  Absenkung zu kommen, ist derjenige, der schnell und wirksam funktioniert. Deshalb
  sind wir diesen Weg gegangen. Eine Nachfrage an das Wirtschaftsministerium: Die
  Forschungsinstitute haben gestern vor allem bemängelt, dass das sogenannte Preissignal
  verloren gehe. Dieses Argument war auch aus dem Wirtschaftsministerium zu hören.
  Können Sie uns erklären, warum das Argument jetzt nicht mehr zählt? Ich kann mich
  den Worten des Regierungssprechers nur anschließen. Das ist eine gemeinsame Aktion
  innerhalb der Bundesregierung, zu der das Bundeswirtschaftsministerium absolut steht.
  Für uns war es auch wichtig, dass sich die Länder beteiligen. Das ist der Fall.
  Insofern trägt das Bundeswirtschaftsministerium die Entscheidung natürlich mit.
  Herr Harmsen, wenn Sie sich schon so sicher sind, was die Berechnungen angeht, gibt
  es dann eine Möglichkeit, dass Sie diese Berechnungen offenlegen? Welche Erwartungshaltung
  hat das BMF momentan in Bezug auf Mehreinnahmen oder Mindereinnahmen? Ich kann Ihnen
  noch keine abschließenden Zahlen für den gesamten Zeitraum präsentieren. Dabei gibt
  es immer einen gewissen zeitlichen Verzug. Auch die ganz konkreten Steuereinnahmen
  aus den Kraftstoffen können wir zum jetzigen Zeitpunkt noch nicht beziffern. Wir
  sehen aber, dass beispielsweise im August 2025 die Einnahmen aus der Energiesteuer
  deutlich unter denen im Vergleichszeitraum des Vorjahres lagen. Wir reden dabei
  über ungefähr 13 Prozent weniger, also knapp 400 Millionen Euro weniger als im gleichen
  Zeitraum des Vorjahres. Wenn ich es richtig in Erinnerung habe, dann haben wir all
  diese Zahlen in den letzten drei Monatsberichten des BMF auf unserer Website einzeln
  aufgelistet. Dort können Sie das alles gern nachlesen. Ich würde gern wissen ‑ ich
  weiß es einfach nicht; vielleicht können Sie es erklären ‑, inwieweit sich die Senkung
  der Energiesteuer auch auf Erdgaspreise auswirkt, die Verbraucher zu zahlen haben.
  Das müsste ich noch einmal im Einzelnen nachsehen. Das reiche ich gern nach. Ich
  habe eine Frage, die am Mittwoch, so meine ich, nicht geklärt werden konnte. Wie
  sieht es mit Heizöl aus, von dem viele private Nutzer in der Wintersaison einfach
  abhängig sind, um ihre Wohnungen warm zu halten? Sind dafür ähnliche Entlastungsmaßnahmen
  geplant? Das wäre ja nur logisch und fair. Ich würde gern auf das verweisen, was
  der stellvertretende Regierungssprecher gerade gesagt hat. Die Bundesregierung hat
  sich auf Maßnahmen verständigt, die jetzt sehr schnell vor allen Dingen die Autofahrerinnen
  und Autofahrer entlasten. Wir haben von dieser Stelle aus immer betont, dass wir
  die Lage weiterhin genau beobachten und natürlich auch prüfen, wo wir zielgenau
  vor allen Dingen diejenigen entlasten können, die von den hohen Energiepreisen besonders
  betroffen sind. Natürlich müssen solche Maßnahmen immer gegenfinanziert werden.
  Insofern beobachten wir die Lage weiterhin. Aber ich habe Ihnen für diesen Bereich
  von hier aus jetzt nichts Konkretes anzukündigen. Müsste die Argumentation, dass
  man sagt: „Menschen sind an der Zapfsäule von steigenden Energiepreisen betroffen;
  deswegen müssen sie entlastet werden“, nicht gleichermaßen gelten, wenn andere oder
  teilweise dieselben Menschen bei ihrer Heizung gleichermaßen von steigenden Energiepreisen
  betroffen sind? Dass die hohen Energiepreise sowohl die Bürgerinnen und Bürger als
  auch die Unternehmen in unserem Land belasten, ist klar. Das hat auch die Bundesregierung
  früh erkannt. Schon Ende vergangenen Jahres gab es Beschlüsse im Koalitionsausschuss,
  um die Energiepreise zu senken. Wir haben die Stromsteuer für das produzierende
  Gewerbe gesenkt. Das entlastet insgesamt mehr als 600 000 Unternehmen in Deutschland.
  Das sichert Arbeitsplätze, und das sichert Standorte. Wir haben die Verbraucherinnen
  und Verbraucher von den Kosten der Gasspeicherumlage entlastet, die ab diesem Jahr
  nicht mehr erhoben wird. Alle Stromverbraucherinnen und Stromverbraucher profitieren
  von der teilweisen Übernahme der Übertragungsnetzentgelte und Umlagen, was wir über
  den Klima- und Transformationsfonds regeln. Es gab also schon eine ganze Reihe von
  Entlastungsmaßnahmen. Wie gesagt, beobachten wir weitere Entlastungsmöglichkeiten.
  Aber ich habe Ihnen momentan von hier aus nichts anzukündigen. Herr Meyer, wie blickt
  die Bundesregierung auf die Entscheidung in Heidenau , dass keine Stolpersteine
  mehr auf öffentlichen Straßen verlegt werden sollen, sondern dass das auf den Friedhof
  ausgelagert werden soll? Es war ein gemeinsamer Antrag von CDU und AfD. Wie bewertet
  man das? Ich muss gestehen, dass ich zwar Überschriften dazu gelesen habe, aber
  die Details dieser Entscheidung nicht kenne. Ich würde hier von einer detaillierten
  Kommentierung absehen, weil ich, wie gesagt, die Hintergründe und auch die Entscheidung
  nicht genau kenne. Ich kann aber zumindest sagen, dass das Gedenken insbesondere
  der Opfer auch des Holocausts für uns an verschiedensten Stellen natürlich ein ganz
  wichtiges Thema ist. Es ist auch Schwerpunkt von Fördermaßnahmen etc. Uns als Bundesregierung
  ist das sehr wichtig. Den Einzelfall kann ich leider einfach aus Unkenntnis nicht
  bewerten. Das Konzept der Stolpersteine kennen Sie ja. Wie findet die Bundesregierung
  dieses Kunstprojekt generell? Noch einmal: Verschiedene Formen der Erinnerung sind
  für uns enorm wichtig, insbesondere deshalb, weil die Kultur des Erinnerns, wenn
  Zeitzeugen aus dieser Zeit fehlen, enorm wichtig bleibt. Dafür werden wir auch sehr
  viel tun. Das will ich wirklich noch einmal unterstreichen. Ich kenne nur leider
  die Hintergründe des Einzelfalls in dem Gemeinderat ‑ wie gesagt, habe ich die Überschriften
  gesehen ‑ nicht genau. Es gab an dem Konzept seit Jahren ja auch Kritik, unter anderem
  von der früheren Chefin des Zentralrats der Juden, Knobloch. Sie hat gesagt, es
  sei unerträglich, dass auf den Namen der Opfer mit Füßen herumgetreten werde. Was
  sagen Sie zu dem Argument? Ich würde jetzt nicht in eine detaillierte Bewertung
  einsteigen. Noch einmal: Erinnerungskultur ist uns wichtig. Wir fördern sie auf
  verschiedenste Art und Weise. Sie ist für uns als Bundesregierung unabhängig von
  konkreten Projekten enorm wichtig. Auch in Berlin gibt es zahlreiche Stolpersteine,
  die sozusagen Alltagsgedenken und ‑erinnerungen sind. Findet die Bundesregierung,
  dass diese Form der Erinnerungskultur, Stolpersteine als konkrete Erinnerungsform,
  sinnvoll ist? Ich bewerte das jetzt nicht weiter. Das kann man sicherlich diskutieren.
  Ich ziehe mich auf das zurück, was ich gerade gesagt habe: Erinnerungskultur ist
  uns enorm wichtig. Auch zivilgesellschaftliches Engagement in diesem Bereich ist
  uns enorm wichtig. Das unterstützen wir. Aber Sie sind nicht in der Lage, aus der
  langjährigen historischen Erfahrung zu sagen, dass das Projekt der Stolpersteine
  aus Sicht der Bundesregierung eine sinnvolle Form der Erinnerungskultur ist. Können
  Sie das nicht sagen? Ich denke, ich habe gerade mehrfach gesagt, wie wichtig unsere
  Erinnerungskultur ist. Das möchte ich an der Stelle noch einmal unterstreichen und
  bitte auch darum, mir da nicht die Worte im Munde umzudrehen. Herr Meyer, erst kürzlich
  hat der Bund den Hauptstadtvertrag mit dem Land Berlin erneuert. Der Deutschlandfunkt
  berichtet, nachdem am vergangenen Sonntag die Linkspartei als Wahlsieger aus den
  Abgeordnetenhauswahlen hervorgegangen sei, habe Minister Weimer dieses Geld mit
  bestimmten Bedingungen verknüpft, zum Beispiel mit der Bedingung, dass jüdische
  Künstlerinnen und Künstler nicht von geförderten Projekten ausgeschlossen würden.
  Neben diesem Tatbestand gibt es noch den Kodex, der der Berlinale auf den Tisch
  gelegt wurde. Ist d as nicht eine Einschränkung für den Kulturbetrieb, was in Deutschland
  bis vor Kurzem noch ein Tabu war, wofür andere Länder Deutschlands auch bewundert
  haben? Ich würde unterschiedliche Punkte nicht miteinander vermischen. Insbesondere
  werden wir uns hier zu möglichen Regierungsbildungen oder anderen Dinge nicht äußern.
  Das ist nicht Aufgabe der Bundesregierung. Das ist Aufgabe im politischen Raum.
  Staatsminister Weimer hat immer wieder deutlich gemacht, dass Kultureinrichtungen
  und Kulturprojekte keine finanzielle Unterstützung vom Bund erhalten dürfen, wenn
  sie Antisemitismus verbreiten oder zum Boykott jüdischer Künstlerinnen und Künstler
  aufrufen. Das gilt, und das gilt natürlich auch weiterhin. Herr Meyer, als was hat
  sich Herr Weimar denn geäußert, wenn sich die Bundesregierung nicht in diese Dinge
  einmischt? Als Privatperson? Wir müssen das schon sauber miteinander machen. Ich
  habe gerade gesagt, dass wir jetzt keine Regierungsbildung kommentieren, die zwischen
  den Parteien abläuft. Ich habe formell auf das hingewiesen, was hier unsere Aufgabe
  als Bundesregierung ist. Natürlich macht sich aber der Kulturstaatsminister immer
  wieder auch Gedanken darüber, wie man Kulturförderung und andere Dinge ausrichtet.
  Deshalb habe ich auf die Grundsätze hingewiesen, die für unsere Kulturförderung
  gelten. Sie gelten übrigens generell und unabhängig von einer Regierungsbildung
  in Berlin. Aber einen Hauptstadtvertrag gibt es natürlich nur mit Berlin. Das ist
  naheliegend. Die Äußerung in der Rolle kann ich dann noch nicht verstehen. Ich habe
  noch nicht verstanden, in welcher Kapazität ‑ ‑ ‑ Dann muss ich akzeptieren, dass
  Sie die Äußerung nicht verstehen. Ich habe versucht, seine Position darzustellen.
  Dabei würde ich bleiben. Wenn es denn wirklich keine Einmischung ist, warum äußert
  sich Minister Weimer dann so? Das verstehe ich nicht ganz. Kultur war in Deutschland
  immer Ländersache, und zwar aus gutem Grund. Warum äußert sich der Minister überhaupt
  erst, seitdem die Linkspartei ‑ ‑ ‑ Sie haben gesagt, Sie mischten sich nicht in
  Regierungsbildungen ein. Das haben wir verstanden. Aber der Minister hat sich laut
  Deutschlandfunk erst dazu geäußert, als die Linkspartei am vergangenen Sonntag als
  Wahlsieger aus der Abgeordnetenhauswahl hervorgegangen ist. Warum dieses Timing?
  Das kann ich nicht teilen. Der Staatsminister hat, denke ich, seit Beginn und auch
