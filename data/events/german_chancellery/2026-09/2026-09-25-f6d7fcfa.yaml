  und nach dem handeln wir auch. Was möglicherweise in der aktuellen Diskussion etwas
  zu kurz kommt, ist der Punkt, den ich jetzt hier noch ansprechen möchte, nämlich
  dass natürlich auch seitens der Hersteller dieser Systeme und der Agenten eine Verantwortung
  vorliegt. Es ist dezidiert Aufgabe der Hersteller, für die Sicherheit ihrer Produkte
  zu sorgen. Wenn jetzt etwa einzelne Systeme aus gesicherten Testumgebungen ausbrechen,
  in das freie Internet gelangen und dort dann Schaden anrichten, ist es natürlich
  auch unsere Aufgabe, unsere Systeme abzusichern. Das hat der Kollege gerade gesagt.
  Aber natürlich ist es auch so, dass die Hersteller hierbei in der Verantwortung
  sind. Das ist ein wichtiger Punkt. Einen Punkt, den wir in der Vergangenheit auch
  schon hervorgehoben haben, möchte ich jetzt auch noch einmal erneuern: Wir setzen
  uns auf internationaler Ebene mit Nachdruck für globale Standards und für gemeinsame
  Leitlinien ein, denn es ist klar, dass wir es mit globalen Sicherheitsrisiken zu
  tun haben, die wir nicht im nationalen Rahmen regulieren bzw. abwenden können. Wir
  brauchen dafür gemeinsame Lösungen. Dafür setzen wir uns auch bei den dafür zuständigen
  Institutionen ein. Jetzt arbeiten KI-Modelle mit den Daten, die sie haben. Diese
  bekommen sie üblicherweise von ihren Nutzern, zumindest indirekt. Die Tokenisierung
  von Wissen findet ja dadurch statt, dass es angewandt wird. Ich würde also gern
  wissen: Welche Schlussfolgerungen ziehen Sie innerhalb der Bundesregierung und den
  nachgeordneten Bereichen denn für die eigene Nutzung von KI-Modellen aus den Vorkommnissen,
  die sich in den vergangenen Wochen und Monaten gehäuft haben? Auch dabei möchte
  ich vielleicht noch einmal ganz kurz ausholen. Ich habe ja vorhin gesagt, dass die
  Risiken real sind. Es ist aber auch keine neue Entwicklung. Sie verfolgen die fachliche
  Diskussion ja sehr intensiv und schon seit sehr langer Zeit. All diejenigen, die
  das so intensiv verfolgen, wird es nicht überrascht haben, dass jetzt solche Szenarien
  eingetreten sind, über die wir diskutieren. Ich weiß nicht genau, was der Hintergrund
  Ihrer Frage ist. Wenn Sie darauf hinauswollen, dass man sich aus dem Bereich künstlicher
  Intelligenz zurückziehen sollte, dann ist das selbstverständlich nicht unsere Position,
  im Gegenteil. Die aktuellen Entwicklungen bestärken uns natürlich in unserer Position
  und auch in unserem Vorgehen, dass wir als Bundesrepublik Deutschland, staatliche
  Behörden, aber natürlich auch unsere Wirtschaft, eigene Kompetenzen im Bereich der
  künstlichen Intelligenz entwickeln müssen und anwenden müssen. Künstliche Intelligenz
  ist die digitale Schlüsselindustrie und ‑technologie. Hierbei können wir uns nicht
  abschotten oder von bestimmten Entwicklungen abgrenzen, sondern wir müssen natürlich
  aktiv versuchen, diese Entwicklung nach unseren Wertvorstellungen mitzugestalten.
  Das ist zentral. Wir haben ja auch in der vergangenen Woche relativ viel im Rahmen
  einer Reise von Bundesminister Wildberger vorangebracht. Ich möchte nur die Stichworte
  Cohere und Aleph Alpha, aber auch LawZero nennen. Hierbei sind wir auf einem guten
  Weg. Dabei ist noch einiges zu gehen. Aber wir haben die Risiken im Blick, und wir
  setzen alles daran, diese Risiken auch zu minimieren. Wir hatten ja bereits über
  die „High Level Week“ der Vereinten Nationen gesprochen, die derzeit in New York
  stattfindet. Ich liefere vielleicht einfach noch die Information, dass es natürlich
  auch bei einer ganzen Anzahl von Veranstaltungen Thema in der „High Level Week“
  war, an denen auch Deutschland teilgenommen hat. Es gab dazu auch eine Sitzung des
  Sicherheitsrats der Vereinten Nationen unter dem französischen Monatsvorsitz, an
  der auch CEOs von zwei großen Unternehmen im Bereich von KI teilgenommen haben.
  Zur deutschen Position: Auch der Generalsekretär der Vereinten Nationen, Herr Guterres,
  hat sich in seiner letzten Ansprache an die Generalversammlung noch einmal mit diesem
  Thema befasst und die Weltgemeinschaft vehement dazu aufgefordert, die Risiken künstlicher
  Intelligenz anzugehen. Das haben im Übrigen auch die beiden genannten CEOs. Deutschland
  unterstützt die Forderung nach Informationsaustausch, nach Zusammenarbeit bei Tests
  und auch nach der Evaluierung sowie in Bezug auf die Entwicklung eines multilateralen
  Risikomanagementsystems für KI mit den VN im Zentrum. Dafür machen wir uns stark.
  Insbesondere unterstützt Deutschland auch die Forderung nach einem besseren Schutz
  Minderjähriger vor KI-Risiken und die Ablehnung sogenannter Killerroboter. Das klang
  früher wie Zukunftsmusik, ist allerdings beispielsweise auf dem Schlachtfeld in
  der Ukraine bereits Realität. Darüber hinaus unterstützt Deutschland auch die Verhinderung
  der Delegierung lebenswichtiger Entscheidungen an Maschinen. Für das alles braucht
  es ein internationales System, eine multilaterale Vereinbarung. Dafür sind die Vereinten
  Nationen der richtige Rahmen. Dort wird auf verschiedenen Ebenen daran gearbeitet.
  Deutschland arbeitet daran mit sehr großem Nachdruck mit. Das AA hat am 28. August
  erklärt, dass absolut dringender Regelungsbedarf bestehe und dass Deutschland sich
  weiterhin deutlich dafür einsetzen wolle, dass die menschliche Kontrolle sozusagen
  permanent sei. So habe ich das verstanden. Vier Tage später aber, am 1. September,
  beantragte die deutsche Delegation in Genf, die Formulierung zu streichen, dass
  Menschen während des gesamten Betriebs Kontrolle behalten müssten. Das ist doch
  ein Widerspruch in der deutschen Position. Ich glaube, um darauf wirklich substanziell
  eingehen zu können, müsste ich wissen, um welches Dokument in Genf es geht. Es gibt
  ja eine ganze Reihe von Spezialorganisationen der Vereinten Nationen. In jedem Rechenschritt
  der KI muss wahrscheinlich kein Mensch daneben sitzen. Ansonsten ist sie auch kein
  Gewinn. Wenn Entscheidungen über Leben und Tod getroffen werden, dann ist es natürlich
  so. Das habe ich gerade noch einmal unterstrichen. Ansonsten müssten Sie mir ein
  bisschen mehr Informationen geben, damit ich darauf wirklich substanziell eingehen
  kann. Es bezog sich auf den Einsatz von Killerrobotern. Das kann ich aber gern noch
  bilateral erklären. Auch wenn wir spät dran sind, erlaube ich mir eine Anmerkung.
  Hierbei geht es im Grunde um den Gedanken des „human in the loop“ oder „human on
  the loop“. Betrachten Sie als Beispiel eine Fregatte, die sich auf hoher See oder
  in der Meerenge befindet. Nehmen Sie an, dass es rundherum ein kontrolliertes Gebiet
  gibt, von dem man weiß, dass es zum Beispiel keine zivile Schifffahrt, aber eine
  anfliegende Bedrohung, ein Bedrohungsszenario gibt. Schon heute gibt es Schiffabwehrsysteme,
  die dabei mit einem „man on the loop“, der die Zielfreigabe und die Schussfreigabe
  erteilt, im Grunde teilautonom arbeiten. Das System kann in diesem abgegrenzten
  Szenario dann aber selbstständig agieren. Das ist solch ein Beispiel, bei dem der
  Mensch entscheidet, wann diese Waffe eingesetzt wird. Aber aufgrund der Reaktionszeiten,
  die es bei anfliegenden Bedrohungen gibt, muss die Waffe reagieren, bevor der Mensch
  ein zweites Mal Ja sagen kann. Das sind Szenarien eines „man on the loop“, die wir
  natürlich bei der Bundeswehr auch betrachten. Wenn man keine Zeit hat, um Menschen
  zu schützen, dann gibt es Ausnahmesituationen, in denen die Maschine die Entscheidung
  übernehmen muss. Das wird aber zum Beispiel nicht im urbanen Umfeld so sein. Man
  wird solch ein Szenario nicht im urbanen Umfeld freigeben. Dafür gibt es den Menschen
  als Entscheider, der das Gesamtsystem betrachtet, immer obendrauf. Aber es ist so:
  Wir haben auch die KI-Konzeption bei uns im BMVg vorgestellt. Darin werden zum Beispiel
  auch diese Aspekte mit betrachtet. Herr Giese, Brasilien steht vor einer Richtungswahl.
  Am kommenden 4. Oktober werden Präsidentschaftswahlen sein. Werden aus Deutschland
  Wahlbeobachter nach Brasilien geschickt? Eine Nachfrage vorab: Der brasilianische
  Nachrichtendienst hat ermittelt, dass in Brasilien immer mehr Einflüsse der US-Administration
  festzustellen sind, um eben das Ergebnis der Wahlen zu beeinflussen. In den vergangenen
  Tagen gab es einen Brief mit 30 Unterschriften aus dem demokratischen Lager, Senator
  Bernie Sanders vorneweg, an Marco Rubio, in dem genau diese Sachlage dargelegt wurde.
  Wie sieht die Bundesregierung diese Entwicklung in Südamerika, auch am Beispiel
  Brasiliens mit den bevorstehenden Präsidentschaftswahlen am 4. Oktober? Sie werden
  sicherlich Verständnis dafür haben, dass ich das bilaterale Verhältnis zwischen
  den USA und Brasilien hier nicht kommentieren werde. In Bezug auf die erste Frage,
  müsste ich mich in Bezug auf die Wahlbeobachtung schlaumachen. Dazu liegt mir nichts
  vor. Es ist auch nicht immer so, dass das über das Auswärtige Amt koordiniert wird.
  Wenn ich etwas dazu habe, dann würde ich das mit der Allgemeinheit hier teilen.
  Ich kann es Ihnen leider derzeit nicht sagen.'
