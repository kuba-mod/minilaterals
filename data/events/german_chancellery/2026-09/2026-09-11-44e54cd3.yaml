title: Rekordinvestitionen der Vereinigten Arabischen Emirate in Deutschland „Wuchtiges
  Signal“ für Wettbewerbsfähigkeit
text: Bundeskanzler Merz und Scheich Bin Zayed wollen die Zusammenarbeit Deutschlands
  und der Vereinigten Arabischen Emirate ausbauen. Bundeskanzler Friedrich Merz hat
  den Staatspräsidenten der Vereinigten Arabischen Emirate, Scheich Mohammed Bin Zayed,
  im Kanzleramt begrüßt. In einer Gemeinsamen Erklärung betonten sie das große Interesse
  beider Seiten an einer vertieften Zusammenarbeit. Diese sei etwa durch gemeinsames
  Engagement für Frieden, Sicherheit, wirtschaftlichen Wohlstand und nachhaltige Entwicklung
  geprägt. Beide Politiker begrüßten die Ankündigung eines Investitionspakets der
  Vereinigten Arabischen Emirate in Höhe von insgesamt 40 Milliarden Euro in Deutschland. Das
  sei „ein wuchtiges Signal“ und zeige, „das Vertrauen internationaler Investoren
  in Deutschland als Investitions- und Innovationsstandort ist enorm“, unterstrich
  der Bundeskanzler. Die Investitionen schafften Arbeitsplätze, Wettbewerbsfähigkeit
  und Innovationskraft. Das von den Vereinigten Arabischen Emiraten angekündigte Paket
  in Höhe von 40 Milliarden Euro umfasst Investitionen in fortschrittliche digitale
  Infrastruktur, darunter den Aufbau neuer, hochmoderner Rechenzentren. Gleichzeitig
  wurde die Unterzeichnung von 29 Absichtserklärungen und Vereinbarungen zwischen
  Unternehmen der Vereinigten Arabischen Emirate und deutscher Unternehmen mit einem
  Gesamtwert von mehr als 9,3 Milliarden Euro bekannt gegeben. Zukünftig soll es außerdem
  einen Deutsch-Emiratischen-Investitionsrat geben. Er wird als Plattform zur Förderung
  von Investitionen und zur Stärkung der Zusammenarbeit zwischen dem öffentlichen
  und dem privaten Sektor dienen. Beide Seiten vereinbarten auch die Einrichtung eines
  strategischen Dialogs. So soll die Zusammenarbeit sowohl im außenpolitischen Bereich
  als auch in Bereichen wie Wirtschaft, Energie und Umwelt ausgebaut werden. Das unterstreicht
  das Ziel, der im April 2004 vereinbarten Strategischen Partnerschaft zwischen Deutschland
  und den Vereinigten Arabischen Emiraten, neue Impulse zu geben. Der Bundeskanzler
  und Scheich Bin Zayed betonten ihre Entschlossenheit, gemeinsam für die Verteidigung
  der internationalen Ordnung einzutreten. Im Rahmen des Besuchs beim Bundeskanzler
  wurden zudem weitere Absichtserklärungen beschlossen. So soll es eine verstärkte
  Zusammenarbeit in den Bereichen Verteidigung und Verteidigungstechnologie geben.
  Die langjährige Zusammenarbeit in vielen Energiebereichen soll durch Partnerschaften
  zwischen führenden Unternehmen beider Seiten weiter vertieft werden. Die Vereinigten
  Arabischen Emirate sind der wichtigste Handelspartner für Deutschland am Golf. Scheich
  Mohammed Bin Zayed war auf Einladung des Bundespräsidenten zum Staatsbesuch in Berlin.
