title: Bundeskanzler Merz telefoniert mit US-Präsident Trump
text: Bundeskanzler Merz hat heute mit Präsident Trump telefoniert. Beide erinnerten
  an die Anschläge vom 11. September 2001 in den USA, die sich in der vergangenen
  Woche zum 25. Mal gejährt haben. Der Bundeskanzler betonte die besondere Verbundenheit
  zwischen Deutschen und Amerikanern. Der Bundeskanzler und der Präsident tauschten
  sich über nächste Schritte zur Beendigung des Krieges in der Ukraine aus. Bundeskanzler
  Merz würdigte die Verabschiedung des Grahams-Sanktionsgesetzes durch den Kongress.
  Auch die Lage in der Straße von Hormus und im Roten Meer war Gegenstand des Gesprächs.
  Es bestand Einigkeit, dass es einer schnellen Öffnung beider Wasserwege bedarf.
