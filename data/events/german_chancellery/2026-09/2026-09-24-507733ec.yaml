title: Im Bundestag beschlossen Wissenschaftsfreiheitsgesetz erweitert
text: 'Flexiblere Vergütungsregelungen sollen es Forschungseinrichtungen erleichtern,
  internationale Spitzenkräfte zu gewinnen. Foto: mauritius images / Bruno Golemac
  / Alamy Das deutsche Wissenschaftssystem steht in einem fortgesetzten internationalen
  Wettbewerb. Die außeruniversitäre Forschung in Deutschland ist daher auch weiterhin
  auf forschungsfreundliche Bedingungen angewiesen. Denn gemeinnützige, außeruniversitäre
  Forschungseinrichtungen sollen im internationalen Wettbewerb um die besten Köpfe
  bestehen können. Die Bundesregierung hat deshalb eine Änderung des Wissenschaftsfreiheitsgesetzes
  im Januar 2026 beschlossen. Der Bundestag hat das Gesetz im September 2026 mit Änderungen
  angenommen. Änderungen und Erweiterungen des Gesetzes nach Beschluss des Bundestages
  : Der Kreis der außeruniversitären Forschungseinrichtungen wurde von ursprünglich
  11 auf 15 Einrichtungen erweitert. Außerdem dürfen Gehälter für Forschende künftig
  auch aus Fördermitteln der Europäischen Union finanziert werden, sofern die europäischen
  Förderbestimmungen es erlauben. Danach sollen künftig insbesondere auch industrienahe,
  gemeinnützige Forschungseinrichtungen ihre Wissenschaftlerinnen und Wissenschaftler
  durch die Zahlung von Gehältern besserstellen dürfen als vergleichbare Bundesbeschäftigte.
  Das gilt für Einrichtungen, die Projektförderungen aus öffentlichen Mitteln erhalten,
  jedoch für die Gehaltszahlungen keine öffentlichen Mittel einsetzen. Die beschlossene
  Regelung sorgt auch dafür, dass künftig weniger Einzelanträge auf Ausnahmen von
  diesem sogenannten Besserstellungsverbot gestellt und geprüft werden müssen. Sie
  leistet also zugleich einen Beitrag zur Entbürokratisierung. Mit der Gesetzesänderung
  wird ein entsprechender Auftrag aus dem Koalitionsvertrag umgesetzt.'
