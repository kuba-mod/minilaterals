title: 'Bund stärkt im Hauptstadtfinanzierungsvertrag kulturelle Exzellenz in Berlin
  – Staatsminister Weimer: „Berlin soll international leuchten“'
text: 'Der heute unterzeichnete Hauptstadtfinanzierungsvertrag zwischen Bund und Land
  Berlin enthält weitreichende Regelungen zu den bundesseitigen Kulturförderungen
  in der Hauptstadt. Der Fokus liegt dabei auf bundesweit bedeutsamen Exzellenzprojekten
  und -einrichtungen, vor allem im Musik- und Museumsbereich. Dafür sollen vom Bund
  - stufenweise aufsteigend - zusätzlich insgesamt bis zu 12,2 Millionen Euro pro
  Jahr zur Verfügung gestellt werden. Darüber hinaus beteiligt sich der Bund mit bis
  zu insgesamt 225 Millionen Euro an der Sanierung der Berliner Philharmonie. Das
  Land Berlin beteiligt sich erstmals am Hauptstadtkulturfonds. Kulturstaatsminister
  Wolfram Weimer sagte: „Mit dem neuen, auf zehn Jahre geschlossenen Hauptstadtfinanzierungsvertrag
  stellt sich der Bund verlässlich hinter die Hauptstadtkultur und leitet auch notwendige
  Strukturveränderungen ein. Dabei nehmen wir noch stärker jene kulturellen Juwelen
  in den Blick, die weit über Berlin hinaus leuchten und vielfach auch Deutschland
  in der Welt repräsentieren.“ Der Hauptstadtfinanzierungsvertrag sieht folgende Anpassungen
  vor: Staatsminister Weimer zu den Anpassungen: „Wir lassen die Berliner Philharmoniker
  als Orchester von Weltrang noch intensiver erstrahlen und beteiligen uns in erheblichem
  Umfang an der Sanierung der weltberühmten Heimstadt dieses Orchesters. Wir investieren
  in die nationale und internationale Exzellenz der Staatskapelle Berlin unter der
  Leitung von Maestro Thielemann. Außerdem etablieren wir eine Kooperation der Staatskapelle
  mit der Barenboim-Said Akademie mit dem Ziel der Exzellenzförderung und Völkerverständigung.
  Ganz besonders freue ich mich, dass es dem Bund zukünftig möglich sein wird, auch
  in der Hauptstadt das Bauhaus-Erbe in seiner nationalen und internationalen Bedeutung
  zu würdigen und somit das Bauhaus-Archiv – Museum für Gestaltung noch sichtbarer
  zu machen. Damit stehen wir mit Stolz zu unserem Bauhaus und schützen seine Errungenschaften
  gegen rechte Anfeindungen nun auch in Berlin. Besonders erfreulich ist, dass wir
  zukünftig für ein angemessenes Informationsangebot am auch international bekannten
  historischen Ort am Checkpoint Charlie sorgen können. Ein besonderes Signal ist
  für mich auch die künftige gemeinsame Verantwortung von Bund und Land für den Hauptstadtkulturfonds.
  An der freien Szene wird nicht gespart.“ Mit dem Hauptstadtfinanzierungsvertrag
  werden hauptstadtbedingte Mehraufwendungen des Landes Berlin für innere Sicherheit
  und Infrastruktur durch den Bund abgegolten sowie Regelungen für die Hauptstadtkultur
  getroffen. Der neue Vertrag umfasst den Zeitraum von 2028 bis 2038; die genannten
  Aufwüchse stehen unter dem Vorbehalt zukünftiger Haushaltsaufstellungsverfahren.
  Die Unterzeichnung fand im Bundesministerium der Finanzen statt. Der Bund wurde
  vertreten durch Bundesfinanzminister Lars Klingbeil sowie Staatsminister für Kultur
  und Medien Wolfram Weimer. Das Land Berlin wurde vertreten durch den Regierenden
  Bürgermeister, Kai Wegner, sowie den Bürgermeister und Senator für Finanzen (auch
  zuständig für den Geschäftsbereich Kultur und Gesellschaftlicher Zusammenhalt),
  Stefan Evers, und die Senatorin für Inneres und Sport, Iris Spranger. Service für
  Redaktionen Bildmaterial kann voraussichtlich ab 16.30 Uhr auf Anfrage zur Verfügung
  gestellt werden.'
