title: 'Internationaler Tag der Demokratie – Staatsminister Weimer: „Kultur und Medien
  halten unsere Demokratie lebendig“'
text: 'Zum heutigen Internationalen Tag der Demokratie erklärt Staatsminister für
  Kultur und Medien Wolfram Weimer: „Unsere Demokratie ist von unschätzbarem Wert.
  Sie gibt uns die Freiheit, unser Land mitzugestalten, unsere Meinung zu sagen und
  über unsere Zukunft mitzuentscheiden. Das ist ein großes Geschenk und zugleich eine
  große Verantwortung. Die aktuellen politischen Entwicklungen geben Anlass dazu,
  uns wieder stärker bewusst zu machen, was uns unsere Demokratie gibt, und mehr Menschen
  für sie zu gewinnen.“ Der 15. September erinnert zugleich an einen wichtigen Moment
  der deutschen Demokratiegeschichte: Vor 77 Jahren wurde Konrad Adenauer zum ersten
  Bundeskanzler der Bundesrepublik Deutschland gewählt. Dazu Staatsminister Weimer:
  „Adenauers Wahl stand für den demokratischen Neubeginn unseres Landes. Was damals
  geschaffen wurde, hat sich bewährt – aber es ist nicht selbstverständlich. Unsere
  Demokratie lebt von uns allen: davon, dass wir uns einmischen, Verantwortung übernehmen
  und anderen zuhören.“ Eine besondere Verantwortung komme dabei Kultur und Medien
  zu. „Kultur schafft Räume für Begegnung und Perspektivwechsel. Freie, unabhängige
  und vielfältige Medien sind unverzichtbar, damit Bürgerinnen und Bürger sich informieren,
  sich eine eigene Meinung bilden und politische Macht kritisch kontrollieren können“,
  so Staatsminister Weimer. Weimer betont: „Deshalb müssen wir Kultur und Medien politisch
  stärken und ihre Freiheit und Vielfalt sichern.“ Gerade in Zeiten von Desinformation,
  Polarisierung und wachsendem Misstrauen komme es auf eine starke demokratische Öffentlichkeit
  an. „Demokratie muss man nicht nur verteidigen“, so Weimer, „man muss sie auch täglich
  attraktiv machen. Kultur und Medien halten unsere Gesellschaft im Gespräch und damit
  unsere Demokratie lebendig.“'
