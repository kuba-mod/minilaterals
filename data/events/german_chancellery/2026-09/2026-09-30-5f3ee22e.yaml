title: 'Im Kabinett beschlossen Pflegeneuordnungsgesetz: Pflege sichern, Angehörige
  stärken'
text: 'Eine fachliche Pflegebegleitung vor Ort soll Familien künftig frühzeitig unterstützen
  und pflegende Angehörige entlasten. Foto: mauritius images / Westend61 / Halfpoint
  In Deutschland sind bereits mehr als sechs Millionen Menschen pflegebedürftig. Mit
  ihrer Zahl wächst der Bedarf an Pflegeleistungen. Das setzt die Pflegeversicherung
  finanziell unter Druck. Für 2027 wäre ohne Gegenmaßnahmen mit einem rechnerischen
  Defizit von rund 7,6 Milliarden Euro zu rechnen, 2028 wären das mehr als 15 Milliarden
  Euro. Deshalb hat das Bundeskabinett einen Gesetzentwurf zur Neuordnung der Pflegeversicherung
  beschlossen. Damit will die Bundesregierung die Finanzierung stabilisieren und gleichzeitig
  die Versorgung für die Zukunft sichern. Bundesgesundheitsminister Carsten Linnemann
  erklärt: „Pflegebedürftige und ihre Angehörigen zu unterstützen, ist eine zentrale
  Aufgabe unserer Solidargemeinschaft. Damit wir sie heute und in Zukunft erfüllen
  können, müssen wir das System der sozialen Pflegeversicherung reformieren.“ Der
  Gesetzentwurf sieht einen neuen Anspruch auf fachliche Pflegebegleitung vor Ort
  vor. Sie soll Pflegebedürftige und ihre Angehörigen frühzeitig unterstützen, die
  Versorgung zu Hause verbessern und helfen, die Selbstständigkeit möglichst lange
  zu erhalten. Die Absicherung pflegender Angehöriger bleibt dabei ein wichtiges Anliegen.
  Gesundheitsminister Linnemann: „Wir machen keine Abstriche bei der Rente von pflegenden
  Angehörigen, denn sie sind die stillen Helden unserer Gesellschaft.“ Ein neues Sozialraumbudget
  soll Menschen ab Pflegegrad 2 den Zugang zu niedrigschwelligen Hilfen aus ihrem
  sozialen Umfeld erleichtern und damit die Unterstützung im Alltag verbessern. Für
  Familien mit pflegebedürftigen Kindern, Jugendlichen und jungen Erwachsenen bis
  25 Jahre ist ein höheres Budget vorgesehen. Fällt eine pflegende Person ungeplant
  aus, soll ein Überbrückungsbudget helfen, die Versorgung sicherzustellen. Es ist
  ebenfalls für Pflegebedürftige ab Pflegegrad 2 vorgesehen und soll Leistungen in
  akuten Pflege- und anderen Überbrückungssituationen finanzieren. Fragen zu Leistungsansprüchen
  und deren Nutzung sollen künftig leichter beantworten werden. Dazu werden verschiedene
  Einzelleistungen in neuen Budgets für die ambulante Pflege gebündelt. Zusätzlich
  sollen die Pflegekassen mit einem digitalen „Pflege-Cockpit“ Informationen und Angebote
  an einem Ort bereitstellen. So sollen Pflegebedürftige und ihre Angehörigen einen
  besseren Überblick über die verfügbaren Hilfen erhalten. Auch Pflegeeinrichtungen
  sollen mehr Spielraum bekommen, neue Lösungen zu erproben und Technik sowie Digitalisierung
  einzusetzen. Ziel ist es, Pflegekräfte zu entlasten und die Versorgung zu verbessern.
  Prävention, Früherkennung und Rehabilitation sollen stärker dazu beitragen, Pflegebedürftigkeit
  zu vermeiden, zu verringern oder eine Verschlechterung zu verhindern. Kranken- und
  Pflegeversicherung sollen ihre Leistungen konsequenter darauf ausrichten. Minister
  Linnemann sagt dazu: „Wir stärken mit dem aktuellen Gesetzentwurf die Früherkennung
  und Rehabilitation. Denn der beste Schutz vor Pflegebedürftigkeit beginnt mit der
  Prävention.“ Die Bundesregierung will den allgemeinen Beitragssatz der sozialen
  Pflegeversicherung in den nächsten Jahren bei 3,6 Prozent halten und damit einem
  weiteren Anstieg der Lohnnebenkosten entgegenwirken. Auf der Einnahmenseite sieht
  der Entwurf unter anderem eine höhere Beitragsbemessungsgrenze, einen höherer Beitrag
  für Kinderlose sowie Änderungen bei der Mitversicherung von Ehepartnerinnen und
  Ehepartnern sowie bei Minijobs vor. Für einzelne Versicherte können die Beiträge
  deshalb steigen, auch wenn der allgemeine Beitragssatz stabil bleibt. Die Pflegeversicherung
  übernimmt weiterhin einen Teil der Pflegekosten. Auch die Länder sind aufgerufen,
  durch die Übernahme von Investitionskosten zur Senkung der Eigenanteile von Pflegebedürftigen
  beizutragen. Parallel soll eine Pflegestrukturkommission Vorschläge für eine langfristig
  tragfähige Pflegeversorgung und Finanzierung erarbeiten. Der Einsetzungsbeschluss
  ist für den 7. Oktober 2026 vorgesehen. Die Kommission soll ihre Vorschläge bis
  Ende Januar 2027 vorlegen. Angestrebt wird, darauf aufbauende Reformen zum 1. Juli
  2027 in Kraft treten zu lassen. Mit dem Kabinettsbeschluss beginnt das parlamentarische
  Gesetzgebungsverfahren. Die vorgeschlagenen Änderungen gelten damit noch nicht.
  Weitere Informationen finden Sie beim Bundesgesundheitsministerium .'
