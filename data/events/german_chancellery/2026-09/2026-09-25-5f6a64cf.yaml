title: Bundesregierung aktuell
text: 'was braucht es, damit auch die nächste Generation in unserem Land gut leben
  kann? Diese Frage beschäftigt heute alle, die in diesen Tagen über Wirtschaft und
  Arbeit, über Sicherheit und soziale Gerechtigkeit sprechen. Der Bundeskanzler hat
  in dieser Woche und nach der Erregung um die Landtagswahlen deutlich gemacht: Er
  wird an seinem Reformkurs festhalten. Auch das ist eine Botschaft der Stabilität.
  Wer beim Radfahren aufhört, in die Pedale zu treten, der fällt früher oder später
  um. Viele Reformen sind zu lange aufgeschoben worden. Das wissen alle, die sich
  mit Rente, Gesundheit oder Pflege auseinandersetzen und die Demografie kennen. Stabilität
  entsteht, wenn die großen Steuerungssysteme er sozialen Marktwirtschaft in der Balance
  sind. Alle Themen auf der Reformagenda zahlen auf dieses Ziel ein: die Wettbewerbsfähigkeit
  der Wirtschaft, der Abbau der Bürokratie, die Schlagkraft der Verwaltung oder die
  Modernität der Infrastruktur. Vieles ist angestoßen, aber der Weg wird noch ein
  wenig Kraft und Geduld erfordern. Die Bundesregierung kann dabei nur um Unterstützung
  werben, und sie kann versprechen, dass sie ihre Aufgaben gut erledigen wird. Der
  Bundeskanzler hat schon vor einigen Monaten an das Versprechen erinnert, das eng
  mit Ludwig Erhard verbunden ist: „Wohlstand für alle“. So hat es der Vater des Wirtschaftswunders
  für seine Zeit formuliert – und das Versprechen wurde eingelöst. Heute wirbt der
  Bundeskanzler für eine moderne Übersetzung: Aus Wohlstand für Alle wird Wohlstand
  für die nächste Generation. Die Botschaft dahinter: Auch die nächste Generation
  soll Lust auf die Zukunft, auf ihre Zukunft haben. Was heute entschieden wird, soll
  für lange Zeit seine Wirkung entfalten. Im Kern dieses Reformversprechens steht
  die soziale Marktwirtschaft, die in einem fairen Prozess erwirtschaftet, was die
  Gemeinschaft trägt und zusammenhält. Wachstum ist dabei der Kitt der Gesellschaft.
  Genauso fair und gerecht müssen die Reformen sein. Wer Unterstützung braucht, soll
  sie bekommen. Aber ebenso klar muss sein: Wer soziale Systeme missbraucht, muss
  mit Konsequenzen rechnen. Das ist ein Prinzip der Gerechtigkeit. Hier setzt der
  in dieser Woche vom Bundeskabinett beschlossene Aktionsplan gegen Sozialleistungsmissbrauch
  und Ausbeutung an. Er nimmt besonders den Missbrauch im Zusammenhang mit Zuwanderung
  aus anderen EU-Staaten in den Blick. Um hier einen Riegel vorzuschieben, sollen
  Behörden ihre Daten leichter austauschen können, Kommunen sollen gegen Schrottimmobilien
  vorgehen können und organisierter Sozialleistungsmissbrauch soll besser verfolgt
  werden. Zwei wichtige Entscheidungen aus Parlament und Kabinett verdienen ebenfalls
  Beachtung: Der Kassenbon wird bald Geschichte sein. So hat es die Ministerrunde
  beschlossen. Von Januar 2028 an wird der Papierbeleg abgeschafft, digitale Alternativen
  stehen dann zur Verfügung. Das macht es dem Einzelhandel leichter, produziert weniger
  Bürokratie und spart Papier. Hochgerechnet summieren sich die Einsparungen auf 106
  Millionen Euro. Zweitens haben nach der Bundesregierung (am Montag) auch Bundestag
  und Bundesrat der Reduzierung der Energiesteuer auf Benzin und Diesel zugestimmt.
  Damit sinkt der Spritpreis am 1. Oktober um etwa 17 Cent pro Liter. Das sind bei
  einer Tankfüllung von 60 Litern immerhin 10,20 Euro. Alles, was der Staat ausgibt,
  muss der Staat auch erwirtschaften. Der Staat – das sind alle seine Bürgerinnen
  und Bürger. Nach einem Schock-Moment wie nach dem Angriff auf die saudische Ölpipeline
  vor zwei Wochen erwarten diese Bürgerinnen und Bürger Hilfe. Die muss dann die Politik
  organisieren. Ideale Politik arbeitet natürlich langfristig und sorgt auf viele
  Jahre vor. Deswegen die Reformen, die unliebsame Schocks verhindern und den Staat
  stabilisieren sollen. Gerade nach turbulenten Wochen ist diese Botschaft wichtig:
  Stabilität im Staat ist nicht gottgegeben, sie muss immer wieder hart erarbeitet
  werden. Denken Sie an das Fahrrad. PS: Hier noch ein kurzer Werbeblock für die kommende
  Woche: In Bremen wird vom 2. bis 4. Oktober der Tag der Deutschen Einheit gefeiert.
  Auch die Bundesregierung wird dabei sein. Die Ministerien stellen ihre Arbeit vor
  und Besucherinnen und Besuchern können mit Kabinettsmitgliedern ins Gespräch kommen.
  Das gesamte Programm finden Sie auf www.bundesregierung.de unter dem Stichwort „Deutsche
  Einheit“. Wir freuen uns auf Ihren Besuch. „Ich begrüße, dass die dänische Premierministerin
  Mette Frederiksen, der grönländische Premierminister Jens-Frederik Nielsen und der
  Präsident der Vereinigten Staaten Donald Trump heute ein Abkommen zur Sicherheit
  Grönlands unterzeichnet haben. Dass die Verhandlungen der letzten Monate zu einer
  einvernehmlichen Lösung in Einklang mit internationalem Recht geführt haben, ist
  eine gute Nachricht. Es stärkt unsere transatlantische Partnerschaft in der NATO
  und trägt zur Sicherheit im Hohen Norden bei. Unsere Partner können auch in Zukunft
  auf die Unterstützung Deutschlands zählen, wenn es darum geht, gemeinsam diese Ziele
  zu verfolgen.“ Wir freuen uns über Ihr Feedback: Nutzen Sie bitte dafür das Kontaktformular
  (nicht die Antwortfunktion auf diese E-Mail).'
