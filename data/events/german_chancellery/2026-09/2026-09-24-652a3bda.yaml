title: Anmeldeverfahren werden vereinfacht Das Designrecht bekommt ein Update
text: 'Künftig soll das Designrecht auch digitale Produkte und virtuelle Gestaltungen
  umfassen. Design ist heute mehr als statische Formen. Ein Logo rotiert, ein Button
  „gleitet“ ins Bild und eine Produktform liegt als 3D -Modell vor, noch bevor sie
  physisch existiert. Genau diese digitale Praxis greift die Bundesregierung auf.
  Der von der Bundesregierung eingebrachte Entwurf eines Gesetzes zur Modernisierung
  des Design rechts wurde vom Bundestag angenommen. Ziel ist es, den Design schutz
  an die EU -Reform anzupassen, ihn zeitgemäßer auszugestalten und Verfahren zu vereinfachen
  – auch im Sinne des Bürokratierückbaus. Im parlamentarischen Verfahren wurde der
  Gesetzentwurf geringfügig an zwischenzeitliche Rechtsänderungen angepasst, u.a.
  aufgrund der kodifizierten EU - Verordnung „über das Unionsdesign“ sowie der Patentkostenzahlungsverordnung
  und der Designverordnung. Künftig sollen neue digitale Erscheinungsformen ausdrücklich
  als Design anerkannt werden, etwa animierte Designs . Außerdem werden die Begrifflichkeiten
  erweitert, sodass auch digitale Produkte und virtuelle Gestaltungen erfasst sind.
  Für die Vermarktung geschützter Designs wird es künftig auch ein neues Eintragungssymbol
  geben: Ähnlich wie © im Urheberrecht oder ® im Markenrecht soll es für eingetragene
  Designs das Zeichen Ⓓ genutzt werden können. Damit der Schutz auch in der Praxis
  leichter und früher erreichbar ist, sollen die Anmeldeverfahren für Designs vor
  den Ämtern vereinfacht und effizienter werden. Modernisierung bedeutet zudem, typische
  neue Verletzungsszenarien besser abzudecken: Zudem soll eine europaweit einheitliche
  Reparaturklausel den Ersatzteilmarkt in der EU erleichtern. Es besteht kein Schutz
  eines Designs an Ersatzteilen, die lediglich ein Gesamterzeugnis reparieren sollen.
  Damit wird der Binnenmarkt gestärkt und Verbraucherinnen und Verbrauchern so der
  Zugang zu günstigeren Ersatzteilen, zum Beispiel bei Fahrzeugen, ermöglicht.'
