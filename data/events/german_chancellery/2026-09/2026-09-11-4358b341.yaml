title: Grußwort des Bundeskanzlers zum jüdischen Neujahrsfest „Offenheit bewahren,
  auch damit sich jüdisches Leben weiter entfalten kann“
text: 'Ein Ritual zu Rosch Haschana: Das Tauchen von Apfelstücken in Honig – verbunden
  mit dem Wunsch für ein gutes neues Jahr. Foto: picture alliance/Shotshop/valentyn
  seme In diesem Jahr begeht die jüdische Gemeinschaft Rosch Haschana, das jüdische
  Neujahrsfest, ab dem Abend des 11. Septembers und an den beiden darauf folgenden
  Tagen. Durch die unterschiedliche Zählung im jüdischen und gregorianischen Kalender
  fällt Rosch Haschana jedes Jahr auf ein anderes Datum – in der Regel in den September
  oder Oktober des gregorianischen Kalenders. Dabei steht das Erleben von Gemeinschaft
  ganz besonders im Mittelpunkt. Zum Neujahrsfest Rosch Haschana übermittele ich Ihnen
  meine herzlichen Grüße. Rosch Haschana lädt dazu ein, auf das vergangene Jahr zurückzuschauen:
  Auf Erlebnisse, die geprägt haben; auf Momente, die zum Nachdenken angeregt haben;
  auf die Zeit, die Sie zusammen mit Freunden und Familien verlebt haben. Mir ist
  bewusst, dass auch das vergangene Jahr nicht unbeschwert war: Mit Entsetzen schauen
  wir auf die antisemitischen Vorfälle und Angriffe. Jeder Einzelne ist zu viel. Ich
  versichere Ihnen, dass die Bundesregierung mit aller Kraft dagegen angehen und Antisemitismus
  in unserem Land nicht dulden wird. Wir setzen uns dafür ein, dass Jüdinnen und Juden
  hierzulande sicher und geschützt leben können – damit das nächste Jahr besser wird.
  Rosch Haschana lädt dazu ein, den Blick auf das neue Jahr zu richten. Unsere freiheitliche
  Gesellschaft steht unter Druck, die Feinde der Demokratie und der Toleranz sammeln
  ihre Kräfte. Dagegen werden wir mit aller Entschlossenheit  angehen. Wir wollen
  unsere Offenheit bewahren, auch damit sich jüdisches Leben weiter entfalten kann
  und es viele positive Gelegenheiten für Begegnung, Austausch und Dialog geben wird.
  Ich freue mich, dass mit dem Gemeindetag im Dezember bereits ein erster Anlass in
  Sichtweite ist. Der Gemeindetag ist ein Raum für Austausch und Miteinander. Das
  Motto des diesjährigen Gemeindetages zeigt dabei die Leitlinie auf: „Zusammen füreinander“.
  Dies ist eine Haltung, die wir uns als gesamte Gesellschaft zu eigen machen können.
  Die vielen Herausforderungen unserer Zeit können wir nur meistern, wenn wir gemeinsam
  Lösungen suchen und Verantwortung übernehmen. Wenn möglichst viele sich daran beteiligen,
  werden wir unsere Zukunft gut gestalten und zuversichtlich nach vorne schauen können.
  Ich wünsche Ihnen für die kommenden Tage einen solch zuversichtlichen Blick und
  viele stärkende Begegnungen mit Freunden und Familie. Dieses Grußwort ist am 10.
  September 2026 in der Jüdischen Allgemeinen erschienen.'
