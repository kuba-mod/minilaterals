title: Bundeskanzler Merz telefoniert mit dem Präsidenten der Ukraine, Wolodymyr Selenskyj
text: Bundeskanzler Friedrich Merz hat heute mit dem Präsidenten der Ukraine, Wolodymyr
  Selenskyj, telefoniert. Der Bundeskanzler hat Präsident Selenskyj über die gestern
  erfolgte Attribuierung des hybriden Angriffes auf den Flughafen Leipzig unterrichtet.
  Der Bundeskanzler betonte, dass sich die Ukraine auf die entschlossene Fortsetzung
  der zivilen und militärischen Unterstützung Deutschlands verlassen kann. Präsident
  Selenskyj dankte dem Bundeskanzler für die deutsche Unterstützung, auch im Bereich
  der Luftverteidigung.
