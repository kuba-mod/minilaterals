title: 'Bund fördert Beethoven-Jubiläum mit 2,3 Millionen Euro – Staatsminister Weimer:
  „2027 wird Beethoven-Jahr!“'
text: '200 Jahre Beethoven, 40 Jahre Warhol und eine Ausstellung, die beide Ikonen
  zusammenbringt: 2027 erinnert Deutschland an den 200. Todestag Ludwig van Beethovens;
  zugleich jährt sich der Todestag des Pop-Art-Künstlers Andy Warhol zum 40. Mal.
  Das Beethoven-Haus Bonn verbindet beide Anlässe in der spektakulären Sonderausstellung
  „Beethoven by Warhol“, die Kulturstaatsminister Wolfram Weimer gestern Abend als
  Schirmherr eröffnet hat. Der Bund unterstützt das Programm des Beethoven-Hauses
  zum Gedenkjahr mit rund 900.000 Euro und trägt so dazu bei, das kulturelle Erbe
  des Bonner Komponisten einem breiten Publikum zugänglich zu machen. Staatsminister
  für Kultur und Medien Wolfram Weimer: „Warhol meets Beethoven! Diese Ausstellung
  ist ein wahres Gipfeltreffen zweier ikonischer Künstler und ein einzigartiger ästhetischer
  Brückenschlag über mehrere Epochen hinweg. Andy Warhol hat die weltweite Faszination
  für Beethoven in seinem weltberühmten Porträt genial auf den Punkt gebracht. Es
  ist der perfekte Moment, diesem Porträt jetzt erstmals eine eigene Schau zu widmen.
  Die Ausstellung ist ein grandioser Auftakt für all das, was uns im nächsten Jahr
  erwartet: eine Vielzahl außergewöhnlicher Veranstaltungen, die Beethoven aufs Neue
  erlebbar machen. 2027 wird das Beethoven-Jahr!“ Im Zentrum der Ausstellung steht
  Warhols vierteiliges Siebdruck-Portfolio BEETHOVEN aus dem Jahr 1987, das unmittelbar
  vor seinem plötzlichen Tod entstand. Neben den Siebdrucken sind weitere Arbeiten
  auf Papier und Leinwand sowie bislang weitgehend unbekannte Beethoven-Arbeiten Warhols
  zu sehen. Einige Werke werden erstmals öffentlich präsentiert. Den Höhepunkt bildet
  ein unbekanntes Beethoven-Gemälde Warhols auf Leinwand, das noch nie dokumentiert
  worden ist. Das Engagement des Bundes für das Beethoven-Gedenkjahr reicht allerdings
  über die Aktivitäten des Beethoven-Hauses hinaus: Auch das Beethovenfest Bonn wird
  2027 anlässlich des 200. Todestages Beethovens verschiedene vom Bund geförderte
  Projekte realisieren. Insgesamt stellt Kulturstaatsminister Weimer für das Beethoven-Jubiläum
  2,3 Millionen Euro bereit.'
