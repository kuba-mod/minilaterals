title: Bundesregierung aktuell
text: 'die Terroranschläge vom 11. September 2001 haben die Welt verändert. Fast 3
  000 Menschen wurden an diesem Tag ermordet, Tausende verletzt. Deutschland und seine
  Verbündeten standen damals an der Seite der Vereinigten Staaten. Und auch heute
  gilt: Wir bekennen uns zu den Werten, die uns verbinden. Und wir wissen: So wie
  vor 25 Jahren ein religiöser Fanatismus und Totalitarismus den Weltfrieden angegriffen
  hat, so leidet die Welt auch heute unter dem Angriff totalitärer Mächte, die den
  Freiheitsgedanken als ihre größte Bedrohung ausgemacht haben. Deswegen gedenken
  wir am 11. September nicht nur aller Opfer und ihrer Angehörigen. Wir werden daran
  erinnert, dass Frieden, Freiheit und Sicherheit niemals selbstverständlich sind.
  In dieser Woche hat der Deutsche Bundestag über den Haushalt für das kommende Jahr
  beraten. Dabei ging es um Milliardenbeträge und Einzelpläne - aber in Wahrheit um
  weit mehr als finanzpolitische Kernziffern. Die Bundesregierung muss Prioritäten
  setzen für das Land, das in einem tiefgreifenden Reform- und Umbauprozess steht.
  Die Sondervermögen waren notwendig, um lange aufgestaute Reformen und Investitionen
  in der Sicherheitspolitik und für die Infrastruktur zu ermöglichen. Die Bundesregierung
  muss diesen Spielraum aber auch nutzen, um das Land zu modernisieren und neues Wachstum
  zu generieren. Nur so können die Schulden auch wieder zurückgefahren werden. Mit
  dem Bundeshaushalt 2027 setzt die Bundesregierung auf Investitionen, Reformen und
  Konsolidierung. Diese drei Ziele zusammen zu bringen, ist anspruchsvoll. Rund 118
  Milliarden Euro stehen für Investitions-Projekte zur Verfügung – mehr als je zuvor.
  Damit werden Brücken und Schienen erneuert, Schulen, Kindergärten und Krankenhäuser
  saniert, Wohnungen gebaut und Investitionen in Digitalisierung, Forschung und neue
  Technologien ermöglicht. Es geht um moderne Infrastruktur, um Arbeitsplätze und
  darum, die Innovationskraft zu stärken. Gleichzeitig ist klar: Auch in schwierigen
  Zeiten darf sich der Staat nicht durch Schulden lähmen. Deswegen werden Subventionen
  abgebaut und Strukturen angepasst. Investieren und konsolidieren – das sind keine
  Gegensätze. All die kleinen und großen Reformschritte, die Investitionen und Haushaltsentscheidungen
  dienen einem großen Ziel: Es geht um ein neues Wohlstandsversprechen für die Bürgerinnen
  und Bürger und besonders für die junge Generation. Dafür müssen die sozialen Sicherungssysteme
  überprüft und reformiert werden, denn nur so werden sie im demographischen Wandel
  sicher bleiben. Dafür bauen wir Bürokratie ab und befreien uns von Fesseln, die
  wir uns selbst auferlegt haben. Erste Zeichen für ein neues Wirtschaftswachstums
  sind bereits erkennbar. Die Konjunktur-Indikatoren machen Hoffnung. Wir haben Grund
  zur Zuversicht. Ohne Sicherheit ist all dies nichts. Auch das ist die Lehre aus
  9/11. Deswegen steht die Bundesregierung zu ihren Investitionen in die eigene Verteidigung.
  Darüber hinaus werden wir in der Hilfe für die Ukraine nicht nachlassen – auch das
  dient dem Schutz Deutschlands. Gerade in wirtschaftlich unsicheren Zeiten mag vielen
  die Logik dieser Abschreckungspolitik nicht einleuchten. Am Ende aber ist es die
  beste Investition, wenn Abschreckung funktioniert. „Unser Bildungssystem muss Antworten
  geben auf PISA und viel früher ansetzen, bevor sich bei den Schülerinnen und Schülern
  Bildungsungleichheit verfestigt. Anders als beim PISA-Schock 2000 haben wir heute
  einen Plan, jeder in seiner Verantwortung. Heute kennen wir die Antworten und müssen
  sie konsequent und nachhaltig umsetzen.“ Bundesfamilienministerin Prien am 08.09.2026
  „ Dass sich 9/11 bald zum 25. Mal jährt, geht uns nahe. Wir Deutsche haben damals
  gespürt, wie viel uns mit unseren amerikanischen Freunden verbindet. Wir wussten:
  Die Terrorangriffe galten auch unserer Lebensweise. Deutschland ist auch heute entschlossen,
  gemeinsam mit den USA für die Werte einzutreten, die uns ausmachen und verbinden:
  Freiheit, Demokratie und Respekt. “ Bundeskanzler Merz am 10. September 2026 auf
  X Wir freuen uns über Ihr Feedback: Nutzen Sie bitte dafür das Kontaktformular (nicht
  die Antwortfunktion auf diese E-Mail).'
