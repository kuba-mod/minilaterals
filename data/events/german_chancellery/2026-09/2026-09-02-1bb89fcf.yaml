title: Im Kabinett beschlossen Bundeszuschuss für niedrigere Stromkosten
text: 'Ab 2026 sinken die Stromkosten für Unternehmen und private Haushalte. Die Bundesregierung
  will Haushalte und Unternehmen auch in den Jahren 2027 bis 2029 weiter spürbar entlasten.
  Ein jährlicher Bundeszuschuss zu den Netzentgelten soll die Stromkosten für alle
  Verbraucherinnen und Verbraucher weiter dämpfen. 2026 beträgt der Zuschuss 6,5 Milliarden
  Euro. Für die Jahre 2027 bis 2029 will die Bundesregierung jährlich 5,525 Milliarden
  Euro aus dem Klima- und Transformationsfonds bereitstellen. Das Kabinett hat nun
  die notwendigen Regelungen zur Gewährung des Bundeszuschusses an die Übertragungsnetzbetreiber
  im Energiewirtschaftsgesetz beschlossen. Diese werden den Zuschuss in ihren Netzentgelt-Kalkulationen
  berücksichtigen. Die Kostendämpfung erreicht die Verbraucherinnen und Verbraucher
  letztlich über die Stromlieferanten. Seit dem 1. Januar 2026 werden Bürgerinnen,
  Bürger und Wirtschaft – zusammen mit der weggefallenen Gasspeicherumlage und der
  Stromsteuersenkung für rund 600.000 produzierende Unternehmen – um rund 10 Milliarden
  Euro entlastet. Ab dem Jahr 2027 steigt die geplante Entlastung auf rund 13 Milliarden
  Euro durch den Industriestrompreis für energieintensive Unternehmen. Mit diesen
  Maßnahmen für niedrigere Energiekosten will die Bundesregierung die Wirtschaft in
  Deutschland stärken und helfen, Arbeitsplätze zu sichern. Im Jahr 2026 kann die
  Entlastung durch das niedrigere Netzentgelt für einen Haushalt mit einem Stromverbrauch
  von 3.500 Kilowattstunden (kWh) rechnerisch etwa 100 Euro betragen. Das Vergleichsportal
  Verivox rechnete mit bis zu rund neun Prozent niedrigeren Strompreisen bei vielen
  Grundversorgern. Wie hoch die Entlastung im Einzelfall ist, hängt von etlichen Faktoren
  ab: beispielsweise davon, in welchem Verteilernetz der Haushalt angeschlossen ist,
  wie und wann Strom verbraucht wird, wie groß die Wohnung und wie gut gedämmt das
  Wohngebäude ist sowie davon, wie viel Strom etwa die Wärmepumpe verbraucht. Für
  das Jahr 2027 liegen noch keine Daten vor. Die Übertragungsnetzbetreiber müssen
  den Bundeszuschuss zunächst in ihren Kalkulationen für die Netzentgelte berechnen.
  Lohnt sich ein Wechsel des Energieversorgers? Gerade in der Grundversorgung kann
  Energie teuer sein. Mit einem Wechsel in günstigere Strom- und Gastarife sind zwei-
  bis dreistellige Einsparungen möglich. Informationen bieten die Verbraucherzentralen
  und die Bundesnetzagentur. Der Bundeszuschuss wird von den Netzbetreibern bei der
  Kalkulation der Netzentgelte berücksichtigt. Die Kostendämpfung erreicht die Verbraucherinnen
  und Verbraucher letztlich über die Stromlieferanten. Die Betreiber sowohl der großen
  Übertragungsnetze als auch der regionalen Verteilnetze müssen transparent machen,
  wie sich der Bundeszuschuss auf die Höhe der Netzentgelte auswirkt. In Deutschland
  gibt es vier große Unternehmen, die das Höchstspannungsnetz – die „Stromautobahnen”
  – Deutschlands betreiben: Amprion, 50Hertz Transmission, TenneT TSO und Transnet
  BW. Informationen, etwa zu Strompreisen oder zum Ausbau der Stromnetze, finden Sie
  bei der Bundesnetzagentur. Wie viele Unternehmen werden durch die niedrigere Stromsteuer
  entlastet? Die Stromsteuer für 600.000 produzierende Unternehmen und die Land- und
  Forstwirtschaft bleibt seit dem 1. Januar 2026 dauerhaft niedrig – auf dem EU -Mindeststeuersatz.
  Entlastet werden große, aber vor allem auch die vielen mittelständischen Betriebe
  – angefangen von der Fleischerei, der Bäckerei über energieintensive Industrieunternehmen
  bis hin zum Baugewerbe. Auch diese Maßnahme dient dazu, das Wirtschaftswachstum
  zu stärken und Arbeitsplätze zu sichern. Denn der befristete EU -Mindeststeuersatz
  wäre ansonsten Ende 2025 ausgelaufen. Damit hätten sich die Strompreise für die
  Unternehmen wieder erhöht und die Rahmenbedingungen für Investitionen verschlechtert.
  Um das zu vermeiden, hatte die Bundesregierung die dauerhafte Stromsteuersenkung
  für Unternehmen entschieden. Die Entlastung belastet den Bundeshaushalt mit etwa
  drei Milliarden Euro jährlich. Seit 2026 werden alle Verbraucherinnen und Verbraucher
  bei den Energiekosten um insgesamt rund 10 Milliarden Euro pro Jahr entlastet. Private
  Haushalte können im Jahr 2026 durch den Wegfall der Gasspeicherumlage und niedrigere
  Netzentgelte im Schnitt bis zu 160 Euro sparen. Diese Entlastung wird auch ab 2027
  gesichert, indem die Bundesregierung die Netzentgelte jährlich mit 5,5 Milliarden
  Euro bezuschusst. Die Bundesregierung will die Energiepreise weiter für alle senken,
  muss aber auch den Haushalt konsolidieren. Um die Stromsteuer ebenfalls für private
  Haushalte zu senken, wären auch entsprechende Spielräume im Haushalt erforderlich.'
