date: '2026-09-15'
type: press_release
source_name: german_chancellery
title: Bundeskanzler beim Unternehmertag des BGA Freier Handel und Reformen für Wachstum
  und Wohlstand
text: '„Unsere Wirtschaft muss wieder wachsen“, so der Kanzler. Die Unternehmer des
  Groß -und Außenhandels wären besonders betroffen von geopolitischen Krisen und handelspolitischen
  Verwerfungen. Für sie seien funktionierende Lieferketten und faire Handelsbeziehungen
  systemrelevant, sagte Bundeskanzler Friedrich Merz beim Unternehmertag des Bundesverbands
  des Groß- und Außenhandels. Unter dem Motto „Systemrelevant“ ging es um die schwierige
  wirtschaftliche Lage, die zunehmenden geopolitischen Spannungen und darum, wie Deutschland
  wieder wettbewerbsfähiger werden kann. Die Bundesregierung arbeite daran, die Abhängigkeiten
  und Verletzlichkeiten zu verringern, Handelspartnerschaften und Zulieferer zu diversifizieren
  und für sichere Transportwege zu sorgen. Europa sei erfolgreich, wenn es geschlossen
  auftrete, auch im Wettbewerb mit China. „Wenn wir geschlossen auftreten, in Deutschland
  und in Europa, wenn wir an unseren Werten, an Offenheit, Rechtsstaatlichkeit, fairem
  Wettbewerb, freier Forschung und Entwicklung festhalten, dann haben wir internationales
  Gewicht“, sagte der Kanzler.  Innerhalb eines Jahres sei es gelungen neue Freihandelsabkommen
  mit den Mercosur-Staaten, Mexiko, Indien, Australien und Indonesien zu schließen.
  „Unsere Wirtschaft muss wieder wachsen“, so der Kanzler. Daher arbeite die Bundesregierung
  daran, Deutschland zu reformieren sowie die Verteidigungsfähigkeit zu stärken. Denn
  diese „zahlt im Ergebnis auf unsere wirtschaftliche Wettbewerbsfähigkeit ein“. Der
  Bau von Straßen, Brücken, Bahnlinien und Industrieanlagen werde durch das Infrastrukturzukunftsgesetz
  beschleunigt. „Das alles wird in den nächsten Monaten spürbar und sichtbar werden“.
  Die Regierung werde mit der Gesundheitsreform und mit der Rentenreform die Sozialversicherungsbeiträge
  stabilisieren. Die Energiewende werde mit der EEG -Novelle, dem Netzanschlusspaket
  und dem Gebäudemodernisierungsgesetz pragmatisch, technologieoffen und kosteneffizient.
  Aber diese energiepolitische Wende schütze nicht vor den aktuellen Ausschlägen am
  Benzinmarkt in Folge des Iran-Kriegs. Durch die steigenden Spritpreise an den Zapfsäulen
  sei für viele Menschen eine Belastungsgrenze erreicht. „Und ich bin der Meinung,
  dass wir handeln müssen“, so der Kanzler. Das genaue Instrumentarium stehe noch
  nicht fest. „Sie können aber davon ausgehen, dass wir sehr bald einen Vorschlag
  dazu vorlegen werden.“ Der BGA (Bundesverbandes Großhandel, Außenhandel, Dienstleistungen
  e.V.) vertritt die Interessen der Unternehmen des Groß- und Außenhandels sowie der
  B2B-Dienstleistungen auf nationaler, europäischer und internationaler Ebene. Dazu
  zählen 70 Fachverbände mit mehr als 100.000 Unternehmen, etwa der Agrar- und Autohandel,
  E-Commerce- und Versandhandel, Pharma-, Metall-, Nahrungsmittelgroßhandel, Personaldienstleister,
  Logistikservices bis zur Werbeartikel-Wirtschaft. Sehr geehrter Herr Präsident,
  lieber Herr Jandura, Kolleginnen und Kollegen aus den Parlamenten, Herzlichen Dank
  für die freundliche Begrüßung! Herzlichen Dank auch für die Einladung, zu Ihrem
  diesjährigen Unternehmertag des BGA zu kommen! Ich freue mich trotz aller Kritik,
  hier zu sein, und ich freue mich, dass Sie in diesem Jahr diesen Unternehmertag
  unter das Motto „Systemrelevant“ gestellt haben. Das ist, wie Sie alle wissen, eigentlich
  ein Begriff, den wir in der Finanzkrise gelernt haben. Aber nach den Erfahrungen
  der Pandemie, nach den Erfahrungen des russischen Angriffskriegs gegen die Ukraine,
  nach den Erfahrungen mit den Kriegen im Mittleren Osten und nach den jüngsten handelspolitischen
  Verwerfungen wissen wir: Systemrelevanz ist eines der großen, wenn nicht das große
  Thema unserer Zeit. Sie kennen als Unternehmerinnen und Unternehmer die Bereiche
  und die Eigenschaften, die Besonderheiten Ihrer Unternehmen, die für das Funktionieren
  des gesamten Systems unverzichtbar sind. Ja, Sie, der Groß- und Außenhandel, sind
  systemrelevant. Wir haben zuletzt erlebt, wie sich in unseren weltweit fein verzahnten
  Lieferketten der Ausfall eines einzigen Teils wie zum Beispiel eines Zulieferers
  oder eines Rohstoffs entlang ganzer Wertschöpfungsketten fortsetzt und verstärken
  kann. Eine solche Kaskade kann ganze Volkswirtschaften zum Erliegen bringen. Solche
  Abhängigkeiten erhöhen also unsere Anfälligkeit für Krisen, sie schränken unsere
  Handlungsfähigkeiten ein, und sie können auch als Druckmittel gegen uns verwendet
  werden. Ein Großteil der Arbeit der Bundesregierung zielt darauf ab, genau diese
  Abhängigkeiten und diese Verletzlichkeiten unserer Volkswirtschaft ganz umfassend
  aufzuarbeiten und sie Schritt für Schritt zu verringern. Es geht darum, unsere,
  wie wir es jetzt sagen, Resilienz, also unsere gesamtgesellschaftliche Widerstandsfähigkeit
  zu verbessern. Spätestens damit, meine Damen und Herren, bin ich an dieser Stelle
  bei Ihnen und Ihren Unternehmen. Der Königsweg zu mehr Resilienz – Herr Jandura,
  Sie haben es gesagt – ist nicht Abschottung, sondern ist Diversifizierung, also
  mehr Handelspartner, mehr Zulieferer desselben Produkts, sichere Transportwege,
  also das, womit Sie sich in Ihren Unternehmen jeden Tag beschäftigen. Versorgungssicherheit
  und Widerstandsfähigkeit, das ist das Ergebnis auch Ihrer persönlichen Arbeit, Ihrer
  oft über Generationen hinweg geleisteten Arbeit, Ihrer Verbindungen, Ihrer Kreativität,
  Ihrer Fähigkeit, auf all das zurückzugreifen, um im Notfall auch kurzfristig Alternativen
  in Handelspartnern und Handelsrouten zur Verfügung zu haben. Wenn wir also von Systemrelevanz
  sprechen, dann sprechen wir oft in abstrakten und in zum Teil sehr technischen Begriffen,
  als handele sich dabei um ein Problem, das man am Reißbrett lösen kann. Nein, meine
  Damen und Herren, es ist am Ende konkretes Wissen, es ist die Flexibilität, es sind
  die Ressourcen einzelner Unternehmen, einzelner Unternehmer und Sie ganz persönlich,
  meine Damen und Herren, auf die es dann und im Einzelfall auch ankommt. Zu den neuen
  Realitäten, mit denen Sie sich in Ihren Unternehmen und wir uns in unserer Volkswirtschaft
  auseinandersetzen müssen, gehört die fundamentale Veränderung der Handelsbeziehungen
  der vergangenen Jahrzehnte. Sie haben es angesprochen: Heute verknüpft die Volksrepublik
  China ihre marktwirtschaftliche Dynamik gezielt mit staatlichen Interventionen,
  mit Überkapazitäten, aggressiver Preissetzung, mit einer unterbewerteten Währung
  und mit in hohem Maße subventionierten Exporten. Damit werden unsere Unternehmen
  im EU -Binnenmarkt und auch auf Drittmärkten massiv unter Druck gesetzt. Sie haben
  die Zahl angesprochen. Ich will sie noch einmal kurz erläutern und vertiefen. Meine
  Damen und Herren, es gibt in der Europäischen Union heute nicht mehr ein einziges
  Land, das noch einen Handelsbilanzüberschuss mit der Volksrepublik China erzielt.
  Alle 27 Länder der Europäischen Union weisen ein Handelsbilanzdefizit auf, wir alle
  zusammen von mehr als 300 Milliarden Euro im Jahr, Tendenz in allen 27 Mitgliedstaaten
  steigend. Wir spüren das ganz besonders in Deutschland. Deutsche und chinesische
  Unternehmen konkurrieren mittlerweile sehr häufig in unseren traditionellen Kernindustrien.
  Sie konkurrieren miteinander und gegeneinander im Automobilbau, im Maschinenbau,
  in der chemischen Industrie. Sie erleben schließlich – auch das haben Sie angesprochen,
  Herr Jandura –, dass auch von jenseits des Atlantiks ein anderer Wind weht. Durch
  das neue US-Zollregime sind Kooperation und Handel mittlerweile deutlich zurückgegangen.
  Wir sehen, dass immer weniger Staats- und Regierungschefs an den wechselseitigen
  Nutzen der wirtschaftlichen Öffnung glauben, sondern ganz anders die Rechnung in
  Nullsummen oder sogar in Übervorteilung und Erpressung suchen. Meine Damen und Herren,
  aber wir sind diesen neuen Realitäten nicht einfach nur ausgeliefert. Wir können
  in dieser Welt unsere Interessen wahren. Wir haben Stärken, die für andere wichtig
  sind, von denen andere sogar abhängig sind, vor allem, wenn wir geschlossen auftreten,
  in Deutschland und in Europa, wenn wir an unseren Werten, an Offenheit, Rechtsstaatlichkeit,
  fairem Wettbewerb, freier Forschung und Entwicklung festhalten. Dann haben wir internationales
  Gewicht. Wir in Europa, ja, wir nutzen diese Chancen. Das zeigt sich im Übrigen
  seit einigen Monaten sehr deutlich. Auch das haben Sie angesprochen. Das Abkommen
  mit den MERCOSUR -Staaten ist nach 26 Jahren intensiver Verhandlungen unterzeichnet
  und vorläufig in Kraft getreten. Meine Damen und Herren, das war nicht so ganz selbstverständlich.
  Wir haben es mit einer knappen qualifizierten Mehrheit im Rat verabschiedet, und
  ich habe mich entschlossen, das erste Mal in der Geschichte der europäischen Handelspolitik
  einem Handelsabkommen zuzustimmen, obwohl unser wichtigster Partner in Europa ihm
  nicht zustimmen konnte, nämlich die Französische Republik. Das war nicht ohne Risiko.
  Ich habe es trotzdem auf uns genommen, weil die Vorteile dieses Abkommens bei Weitem
  die Nachteile überwiegen. Das Abkommen mit Mexiko ist unterzeichnet. Die Abkommen
  mit Indien, Australien und Indonesien sind politisch geeint, all das, meine Damen
  und Herren, innerhalb eines Jahres. MERCOSUR , Mexiko, Indien, Australien, all das
  bedeutet mehr Diversifizierung, höhere Resilienz und neue Räume für Sie, für Ihre
  Unternehmen, und es geht weiter mit Abkommen mit Malaysia, den Philippinen, Thailand
  und den Golfstaaten. Sie alle werden intensiv verhandelt. Vielleicht haben Sie die
  Bilder noch vor Augen: In der letzten Woche hat uns am letzten Donnerstag und Freitag
  der Präsident der Vereinigten Arabischen Emirate besucht, Scheich bin Zayed, erst
  in Berlin und dann in München. Wir haben bei dieser Gelegenheit Investitionen in
  Deutschland von 40 Milliarden Euro miteinander verabredet und eine ganze Reihe von
  weiteren bilateralen Abkommen miteinander geschlossen. Sie sehen also: Wir arbeiten
  auch über die europäische Handelspolitik hinaus an weiteren Impulsen. Wir wollen
  sie einsetzen, auch für ein interregionales Abkommen zwischen der Europäischen Union
  und der Transpazifischen Partnerschaft CPTPP. Wir wollen die Handelsbeziehungen
  mit den ASEAN-Staaten vertiefen, und ich unterstütze dabei auch den von der EU -Kommission
  vorgeschlagenen Aufbau einer Allianz über die WTO hinaus für regelgebundenen Handel
  mit „like-minded“ Staaten, mit einer starken Rolle für die EU und mit einer engen
  Partnerschaft mit Kanada, das so europäisch ist, wie es das in der jüngeren Geschichte
  nie gewesen ist. Meine Damen und Herren ‑ auch das gehört zur Vollständigkeit des
  Bildes ‑, wir brauchen wirksame Instrumente, mit denen wir unsere Abhängigkeiten
  reduzieren und uns gegen unfairen Wettbewerb schützen können. Für die Schärfung
  unseres handelspolitischen Werkzeugkastens haben wir der EU -Kommission beim Europäischen
  Rat im Juni einen Auftrag gegeben. Genau heute in einem Monat, am 15. und 16. Oktober,
  werden wir darüber im Europäischen Rat in Brüssel beraten. Damit keine Missverständnisse
  entstehen: Es geht dabei nicht darum, uns vor Wettbewerb zu schützen ‑ ohne Wettbewerb
  gibt es keine Innovation, und gerade Wettbewerb brauchen wir nicht zu fürchten ‑,
  es geht um ein „level playing field“ und damit um Rahmenbedingungen, die fairen
  Wettbewerb überhaupt erst ermöglichen. Ich will zusammenfassen: Wir wollen neue
  Handelspartner gewinnen, Abhängigkeiten gezielt abbauen, unsere Interessen wahrnehmen
  und uns in der Welt als führende europäische Handelsmacht positionieren. Mit 450 Millionen
  Verbraucherinnen und Verbrauchern sind wir einer der größten zusammenhängenden Märkte
  der Welt, auch für die Volksrepublik China einer der wichtigsten Absatzmärkte auf
  der Welt. Meine Damen und Herren, deswegen lassen Sie mich an dieser Stelle vielleicht
  eine persönliche Anmerkung machen: Ich werde ja hin und wieder als Außenkanzler
  bezeichnet. Ich empfinde das nicht als eine Kritik. Ich denke ‑ das muss ich bei
  Ihnen vermutlich nicht näher erläutern ‑, es gibt heute keine Gegensätze mehr zwischen
  Außenpolitik und Innenpolitik, zwischen äußerer Sicherheit und innerer Sicherheit.
  Es gibt auch keinen Gegensatz mehr zwischen Außenpolitik, Außenwirtschaftspolitik
  und Wirtschaftspolitik. Und schließlich: Es gibt auch in der Migration keine Gegensätze
  mehr zwischen Innen- und Außenpolitik, zwischen nationaler und europäischer Politik.
  Das sind keine getrennten Sphären. Jede außenpolitische Reise und jede Begegnung
  dienen nicht nur mittelbar, sondern ganz unmittelbar auch unseren nationalen, innenpolitischen
  Interessen. Außenwirtschaftspolitik ist und bleibt deshalb ein zentrales Handlungsfeld
  meiner Bundesregierung. Dennoch ist genauso wichtig: Wir können nur dann außenpolitisch
  und außenwirtschaftspolitisch stark sein, wenn wir auch hier im Innern wieder stark
  werden. Meine Damen und Herren, das bedeutet vor allem: Wir müssen wirtschaftlich
  stärker werden. Unsere Wirtschaft muss wieder wachsen. Wir müssen den Wirtschaftsstandort
  Deutschland wettbewerbsfähiger machen, die strukturelle Wachstumskrise unseres Landes
  überwinden, unsere Volkswirtschaft in dieser geopolitisch und geoökonomisch neuen
  Welt ‑ ja! ‑ resilienter machen. Für all das arbeitet die Bundesregierung von Tag eins
  an. Offen gesagt: Wir wollen und wir müssen nachholen, was in Deutschland zum Teil
  über Jahre, wenn nicht über zwei Jahrzehnte, nicht getan wurde. Wir haben für die
  Bundeswehr eine Bereichsausnahme im Grundgesetz geschaffen. Das ist mir nicht leichtgefallen,
  aber es war richtig. Ohne die konkrete Zusage auf dem NATO-Gipfel in Den Haag im
  Juni letzten Jahres wäre die NATO nicht nur in eine tiefe Krise gestürzt, sie wäre
  möglicherweise in einen europäischen und einen amerikanischen Teil auseinandergefallen.
  Wir investieren jetzt in unsere Verteidigung. Die zunehmenden Bedrohungen zeigen
  ‑ denken Sie dabei nicht nur an die Ukraine, sondern auch an den Vorfall in Leipzig
  im August ‑, dass sich die Gefährdungslage auch für unser Land massiv verändert
  hat. Unsere Verteidigungsfähigkeit zahlt im Ergebnis auf unsere wirtschaftliche
  Wettbewerbsfähigkeit ein. Auch das ist ein wesentlicher Teil von Resilienz. Wir
  haben außerdem ‑ das ist mir noch schwerer gefallen ‑ Sonderschulden gemacht, um
  den Sanierungsstau unserer Infrastruktur aufzulösen. Um die Mittel auf die Straße
  zu bringen, beschleunigen wir jetzt auch die Verfahren, um die es geht. Wir haben
  dafür vor den Sommerferien das Infrastruktur-Zukunftsgesetz in Bundestag und Bundesrat
  verabschiedet. Das wird jetzt den Bau von Brücken, Straßen, Schienen, und Industrieanlagen
  schneller machen ‑ so wie wir das in Ausnahmefällen bisher konnten. Ich denke dabei
  nur an die große Verbindung zwischen dem Ruhrgebiet und der Rhein-Main-Region, der
  A45, der sogenannten Sauerlandlinie. Sie erinnern sich an diese berühmte Brücke,
  die Rahmedetalbrücke: innerhalb von drei Jahren geschlossen, gesprengt, neu aufgebaut
  und wiedereröffnet, mit zahlreichen Ausnahmegenehmigungen im Planungsrecht, im Genehmigungsrecht,
  im gesamten Bauverlauf. Meine Damen und Herren, das, was da Ende 2025 nach drei
  Jahren wiedereröffnet wurde ‑ mit zahlreichen Ausnahmen, die wir gemacht haben,
  bis zum Verzicht auf ein neues Planfeststellungsverfahren ‑, wird nach dem Gesetz,
  das wir jetzt in Kraft gesetzt haben, der normale Regelfall beim Ausbau unserer
  Infrastruktur werden: bei den Straßen, Brücken, Bahnlinien und auch bei den Wasserstraßen.
  Das alles läuft auf Hochtouren, und die Umsetzung eines zusätzlichen Planungs- und
  Genehmigungsbeschleunigungspaktes mit den Ländern ist in Kraft. Das alles wird in
  den nächsten Monaten spürbar und sichtbar werden. Spüren wollen wir auch, bzw. spüren
  müssen Sie, Schritt für Schritt die verbesserten steuerlichen Rahmenbedingungen.
  Sie haben es angesprochen: Die ausgebauten Abschreibungsmöglichkeiten gelten seit
  dem 1. Juli des letzten Jahres. Die Senkung der Körperschaftssteuer geschieht stufenweise
  ab 2028. Insgesamt ist das eine Steuerreform, die natürlich vor allem den Kapitalgesellschaften
  zugutekommt. Wir wollen darüber hinaus aber auch die Sozialversicherungsbeiträge
  stabilisieren. Deshalb haben wir die Gesundheitsreform beschlossen. Die Ausgaben
  in der gesetzlichen Krankenversicherung werden wieder an die Einnahmen gekoppelt,
  so wie wir das früher schon einmal hatten. Wir kontrollieren damit die Kosten; die
  Beiträge sollen nicht mehr steigen. Eine ähnliche Kostenkontrolle brauchen wir für
  die Pflegeversicherung. Mittel- und langfristig wird es große Vorteile durch die
  überfällige Rentenreform geben, die uns eine auch von der Politik besetzte Kommission
  im Sommer vorgeschlagen hat. Wir stärken die private und die betriebliche Altersvorsorge.
  Wir nutzen die Chancen des Kapitalmarkts erstmalig. Wir beenden die abschlagsfreie
  Frühverrentung, die in Wahrheit unsoziale Wirkung entfaltet, weil Ältere und Jüngere
  sie bezahlen müssen. Allein die Umstellung auf einen kapitalgedeckten Teil der Rente
  ist für dieses Land eine gewaltige Veränderung ‑ eine Entscheidung, die im Übrigen
  viele unserer Nachbarn schon vor Jahren, wenn nicht vor Jahrzehnten, getroffen haben.
  Wir holen das jetzt nach. Das alles ist bedeutend. Das macht eben einen großen Unterschied.
  Schließlich haben wir auch in dem sehr schwierigen Bereich der Energiepolitik die
  überfällige Wende eingeleitet. Mittel- und langfristig können wir die Preise wieder
  in den Griff bekommen, indem wir tun, was wir seit gut einem Jahr tun: die Energiewende
  pragmatisch, technologieoffen und kosteneffizient machen. Drei wichtige Gesetzesvorhaben
  hat das Kabinett dazu im Sommer beschlossen: die EEG -Novelle, das Netzanschlusspaket
  und die Novelle des Gebäudeenergiegesetzes. Weil es eine aktuelle Situation betrifft:
  Das schützt uns noch lange nicht vor den Ausschlägen, die wir momentan etwa am Benzinmarkt
  erleben, weil der Krieg am Golf immer neue Volten schlägt. Ja, wir werden auf Preistreiberei
  reagieren. Wir haben dazu das Kartellamt mit einer entsprechenden Missbrauchsaufsicht
  ausgestattet. Wir spüren aber auch, dass das ‑ jedenfalls aus dem Blickwinkel der
  Verbraucherinnen und Verbraucher ‑ nicht reicht. Die Lage im Mittleren Osten eskaliert.
  Die Energiepreise, die Spritpreise an den Zapfsäulen steigen. Für viele Menschen,
  die täglich das Auto brauchen, ist eine Belastungsgrenze erreicht. Wir stehen dazu
  deshalb in engem Austausch in der Bundesregierung und mit den Ländern, und ich bin
  der Meinung, dass wir handeln müssen. Das genaue Instrumentarium steht noch nicht
  fest. Sie können aber davon ausgehen, dass wir sehr bald einen Vorschlag dazu vorlegen
  werden. Lassen Sie mich nun zu den Reformen insgesamt noch einmal sagen: Es geht
  hier noch lange nicht um einen Abschluss. Wir wissen, dass wir weitermachen müssen.
  Es geht auch nicht darum, mit dem Erreichten zufrieden zu sein. Wir wissen, dass
  das alles noch nicht reicht. Wir haben deshalb vor der Sommerpause in der Koalition
  ein umfassendes weiteres Reformpaket verabredet, das wir jetzt im zweiten Halbjahr
  umsetzen wollen. Lassen Sie mich an dieser Stelle auch aus ganz aktuellem Anlass
  noch einmal deutlich sagen: Die Bundesregierung wird die Maßnahmen, die wir im Koalitionsausschuss
  am 1. Juli beschlossen haben, umsetzen. Das bittere Wahlergebnis vom 6. September
  in Sachsen-Anhalt ändert daran gar nichts. Wir müssen unser Land reformieren. Wir
  müssen das tun, damit unser Land wirklich wieder zukunftsfest wird, damit unsere
  Kinder und Enkelkinder eine Chance haben, das Land zu gestalten, und auch sie ein
  Leben in Freiheit, in Frieden und in Wohlstand erreichen können, damit wir alle
  nicht jeden Morgen unzufrieden und skeptisch aufwachen, damit wir nicht Sorge um
  Arbeitsplätze haben, sondern uns neu erfinden, auch in der Arbeitswelt. Ich möchte,
  dass wir uns wieder auf die Zukunft freuen können, dass wir stolz auf unser schönes
  und modernes Land sein können und dass wir auch mit Selbstbewusstsein sagen können:
  Deutschland ist stark. Wir können das. ‑ Darum geht es, und davon werde ich auch
  persönlich nicht abrücken. Wir haben verabredet, den Arbeitsmarkt zu flexibilisieren:
  mehr Möglichkeiten zur sachgrundlosen Befristung, die Lockerung des Kündigungsschutzes
  für diejenigen, die viel verdienen und den Kündigungsschutz in dieser Form nicht
  brauchen. Schließlich: Ich weiß, dass viele von Ihnen durch zu viel Bürokratie eingeengt
  und geradezu stranguliert werden. Das muss und das wird sich ändern. Beim Bürokratierückbau
  gehen wir einen wirklich großen Schritt. Wir schaffen nämlich alle Berichtspflichten
  für die Unternehmen ab. Erhalten bleiben nur solche, deren Notwendigkeit von den
  zuständigen Ministerien neu begründet wird. Mit einer dauerhaften Berichtspflichtenbremse
  verhindern wir, dass in zukünftigen Gesetzen wieder neue bürokratische Meldepflichten
  für Unternehmen eingeführt werden. Wir haben auch verabredet, dass wir die EU -Lieferkettenrichtlinie
  nur eins zu eins umsetzen, eine Richtlinie, die übrigens auf das Betreiben der deutschen
  Bundesregierung erheblich verändert worden ist. Die mittelbaren Informations- und
  Prüfpflichten, insbesondere für kleine und mittlere Zulieferer, sollen mit möglichst
  geringem Aufwand leistbar sein. Gerade auf europäischer Ebene, wo es wirklich wichtig
  ist, arbeiten wir gemeinsam an einem solchen Mentalitätswechsel. Inzwischen wird
  tatsächlich nach Vereinfachungsmöglichkeiten gesucht, und die Kommission findet
  sie. Wir helfen ihr dabei. Meine Damen und Herren, so weit waren wir in dieser Europäischen
  Union in den letzten Jahren und Jahrzehnten noch nie, auch in der Verabredung der
  27 Staats- und Regierungschefs der Europäischen Union, dass wir jetzt wirklich ernst
  machen müssen mit der Vollendung des europäischen Binnenmarktes und auch mit der
  Wiederherstellung der Wettbewerbsfähigkeit unserer Europäischen Union. All das zeigt:
  Wir haben einen Plan für Europa und für unser Land. Wir haben ein Ziel, und dieses
  Ziel heißt ‑ noch einmal ‑: Freiheit, Sicherheit und Wohlstand, auch für die kommenden
  Generationen. Das Ziel heißt Chancen für die Jungen, so wie wir Ältere sie in den
  letzten Jahrzehnten hatten und in Deutschland ergreifen durften. Meine Damen und
  Herren, in dem Deutschland, das ich mir vorstelle, soll der Sozialstaat gerecht
  und bei allen demografischen Schwankungen stabil sein. In dem Deutschland, dass
  ich mir vorstelle, wünsche ich mir zuversichtliche Unternehmen, eine agile und verlässliche
  Verwaltung, eine moderne und begeisternde Infrastruktur. Ich möchte ein Land, das
  im Innern und nach außen Sicherheit garantiert, und ein Europa, das sich tatsächlich
  auf das Wichtige konzentriert. Um dieses Ziel zu erreichen, reformieren wir. Und
  noch einmal: Ich bin fest entschlossen, an diesem Kurs festzuhalten. Wir werden
  dieses Ziel nicht erreichen, wenn wir aus Europa und dem Binnenmarkt aussteigen.
  Wir werden es nicht erreichen, wenn wir unseren Widerstand gegen autokratische Aggressoren
  aufgeben und uns in eine nationalstaatliche Nullsummenlogik verkriechen. Wir werden
  dieses Ziel auch nicht erreichen, wenn wir unser Land schlechtreden. Ja, wir haben
  Probleme, aber, meine Damen und Herren, es gibt auch so viel Gutes und Starkes im
  Land. Ich kann mich jedenfalls immer noch über die kleinen und großen Dinge freuen,
  über die ehrenamtliche Solidarität vor Ort und die deutsche Rakete im Weltraum.
  Ich habe mich darüber gefreut, dass dies möglich wurde. Ich freue mich auch darüber,
  dass wir nun die ersten Lichtblicke sehen, dass die Reformen offenbar wirken und
  uns anspornen. Die Löhne in Deutschland steigen aktuell schneller als die Verbraucherpreise.
  Die Stimmung in den Unternehmen hellt sich Schritt für Schritt auf. Die ausländischen
  Investitionen in Deutschland steigen in bedeutendem Umfang. So viele neue Start-ups
  wie noch nie seit dem Jahr 2025 nutzen die Chancen, die es in Deutschland gibt.
  Viele Unternehmen gründen sich mit neuen Geschäftsideen auf der Basis neuer Technologien,
  die Hälfte davon KI-basiert. Die Transformation unserer Wirtschaft findet also statt.
  Die Botschaft ist: Das kann gelingen. Deutschland kann das. Meine Damen und Herren,
  die Bundesregierung wird deshalb weiterhin ihren Auftrag erfüllen und diese Probleme
  anpacken. Aber auch das will ich abschließend hinzufügen: Ich schaffe das nicht
  allein. Auch die Bundesregierung schafft das nicht allein. Das schaffen wir nur
  gemeinsam. Sie in der Außenwirtschaft leisten bereits einen großen Beitrag. Wir
  in der Bundesregierung arbeiten daran, dass Sie Ihre Stärken noch besser entfalten
  können. Gehen wir diesen Weg! Gehen wir ihn mit Zuversicht, auch mit Demut angesichts
  der großen Herausforderungen, vor denen wir stehen, aber gehen wir ihn mit der Zuversicht,
  die unser Land in schwierigen Zeiten immer stark gemacht hat! Ich jedenfalls gebe
  diese Zuversicht nicht auf.'
