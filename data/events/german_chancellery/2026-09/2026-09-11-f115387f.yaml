title: Bundeskanzler Merz begrüßt Rekordinvestitionen der Vereinigten Arabischen Emirate
  in Deutschland
text: 'Bundeskanzler Friedrich Merz begrüßt die angekündigten Milliardeninvestitionen
  der Vereinigten Arabischen Emirate. „Ich bin beeindruckt von der Investitionsbereitschaft
  der Vereinigten Arabischen Emirate in Deutschland. Das ist ein wuchtiges Signal.
  Die Investition schafft Arbeitsplätze, Wettbewerbsfähigkeit und Innovationskraft.
  Scheich Mohammed Bin Zayed Al Nahyan hat mich mit seiner Sachkenntnis und seinem
  Engagement beeindruckt: Er kennt den Standort Deutschland genau. Die 40 Milliarden
  Euro zeigen: Das Vertrauen internationaler Investoren in Deutschland als Investitions-
  und Innovationsstandort ist enorm. Ich danke den Vereinigten Arabischen Emiraten
  für ihr Vertrauen.“ Während seines Staatsbesuchs in Deutschland hat Staatschef der
  VAE, Scheich Al Nahyan, ein Investitionspaket in Höhe von 40 Milliarden Euro angekündigt.
  Die Investition soll dazu beitragen, die industrielle Wettbewerbsfähigkeit Deutschlands
  zu stärken, die technologische Führung zu fördern und das Wirtschaftswachstum langfristig
  zu unterstützen. Investitionen sollen auch in eine hochmoderne digitale Infrastruktur
  einschließlich der Entwicklung neuer, modernster Rechenzentren mit einer Kapazität
  von etwa 1 Gigawatt fließen. Merz und Al Nahyan begrüßten darüber hinaus die Pläne
  für weitere Investitionen und Partnerschaften zwischen Unternehmen aus den VAE und
  Deutschland einschließlich Initiativen unter Beteiligung von Covestro, RWE, ADNOC
  und Masdar. Die vertiefte Zusammenarbeit der beiden Länder drückt sich auch durch
  insgesamt 11 Abkommen und Absichtserklärungen zwischen den Regierungen aus. Neben
  dem Investitionsbereich umfassen diese Abkommen Themen wie KI und Rechenzentren,
  Verkehrsrechte, Kriminalitäts- und Sicherheitszusammenarbeit, Einreise (Easy Pass
  System bei der Grenzkontrolle), außenpolitischer strategischer Dialog, Kulturzusammenarbeit,
  Rechtshilfe in Strafsachen, Sicherheits- und Verteidigungskooperation, Umwelt (siehe
  Liste).'
