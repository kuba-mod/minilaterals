title: Im Wortlaut Pressestatement von Bundeskanzler Merz anlässlich des Jahrestreffens
  der Initiative „Made for Germany“ am 30. September 2026 in Berlin
text: 'Meine Damen und Herren, herzlich willkommen zu unseren kurzen Pressestatements
  nach der dritten Begegnung, die wir heute im Rahmen der Initiative „Made for Germany“
  hatten, die wir vor gut einem Jahr gemeinsam gegründet haben. Ich will noch einmal
  ausdrücklich Dank sagen an Christian Sewing und Roland Busch, die es auch übernommen
  haben, diese Initiative zu führen. Wir haben heute eine intensive Diskussion über
  den Standort geführt, über unsere Chancen geführt, und ich bin sehr dankbar, dass
  ich feststellen darf: Die Zahl der Mitglieder dieser Initiative hat sich innerhalb
  von einem Jahr verdoppelt. Wir sind von anfänglich 600 Milliarden Euro an Investitionen
  in Deutschland ausgegangen. Wir gehen jetzt von mehr als 800 Milliarden Euro an
  Investitionen in Deutschland aus. Die deutschen Unternehmen und auch viele ausländische
  Unternehmen investieren in Deutschland. Wir diskutieren über die Rahmenbedingungen,
  aber wir haben diese Rahmenbedingungen auch kontinuierlich verbessert. Ich bin sehr
  dankbar, dass das heute hier so zum Ausdruck gekommen ist, aber dass natürlich auch
  die Aufgaben beschrieben worden sind, die wir noch leisten müssen. Dazu gehört nach
  wie vor die preisliche Wettbewerbsfähigkeit unseres Standortes. Die muss besser
  werden. Daran arbeiten wir in der Bundesregierung. Es war insofern heute auch ein
  gutes zeitliches Zusammentreffen, weil wir heute Morgen im Bundeskabinett die umfangreiche
  Reform der Pflegeversicherung verabschiedet haben und sie auf den parlamentarischen
  Weg bringen. Das ist ein weiterer Baustein zur Begrenzung der Lohnzusatzkosten in
  Deutschland, zur Stabilisierung unserer sozialen Sicherungssysteme und eben auch
  zur Verbesserung der Investitionsbedingungen in Deutschland. Abschließend vielleicht
  nur dies: Ich bin wirklich richtig begeistert von den vielen Beispielen von Investitionen
  und Innovationen in Deutschland, die wir heute gesehen und gehört haben. Deutschland
  entwickelt sich zu einem der besten Investitionsstandorte auf der Welt, zu einem
  der wirklich besten Innovationsstandorte auf der Welt. Ich darf das, glaube ich,
  aus einer Studie der Deutschen Bank zitieren: Wenn darin dokumentiert wird, dass
  internationale Investoren gefragt werden, was für sie heute ein guter Standort ist,
  und eine große Zahl sagt, Europa sei besser als Amerika und andere Standorte und
  in Europa sei Deutschland der beste Standort, dann ist das der Optimismus, den ich
  gerne mit vielen Menschen in unserem Lande teilen möchte.'
