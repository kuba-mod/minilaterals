title: Bund und Berlin unterzeichnen neuen Hauptstadtfinanzierungsvertrag
text: 'Vertrag über zehn Jahre sieht 2,1 Mrd. Euro des Bundes für Sicherheit und 2,9
  Mrd. Euro des Bundes für Kultur in der Hauptstadt vor Der Bund und das Land Berlin
  haben am 15. September 2026 einen neuen Hauptstadtfinanzierungsvertrag unterzeichnet.
  Dieser schafft für den neuen Zehn-Jahres-Zeitraum vom 1. Januar 2028 bis zum 31.
  Dezember 2037 verlässliche finanzielle Perspektiven und Planungssicherheit. Damit
  trägt der Bund wesentlich dazu bei, die Entwicklung Berlins als sichere und attraktive
  Hauptstadt zu fördern. Mit dem Vertrag werden hauptstadtbedingte Mehrausgaben des
  Landes Berlin durch den Bund getragen. Der Vertrag regelt die Unterstützung des
  Bundes in den Bereichen Innere Sicherheit und Hauptstadtkultur. Der Hauptstadtfinanzierungsvertrag
  sieht ein Volumen von rund fünf Mrd. Euro als Beitrag des Bundes für Sicherheit
  und Kultur in Berlin vor. Die Unterzeichnung fand im Bundesministerium der Finanzen
  statt. Der Bund wurde vertreten durch Bundesfinanzminister Lars Klingbeil sowie
  Staatsminister für Kultur und Medien Wolfram Weimer. Das Land Berlin wurde vertreten
  durch den Regierenden Bürgermeister, Kai Wegner, sowie den Senator für Finanzen
  und für Kultur und Gesellschaftlichen Zusammenhalt, Stefan Evers, und die Senatorin
  für Inneres und Sport, Iris Spranger. Bundesfinanzminister Lars Klingbeil : „Wir
  investieren in Sicherheit und Kultur in Berlin. Trotz angespannter Haushaltslage
  kommt der Bund seiner Verantwortung für die Hauptstadt voll und ganz nach. Der Bund
  engagiert sich nicht nur weiter wie bislang, sondern baut die Unterstützung für
  Berlin deutlich aus. Angesichts der aktuellen Bedrohungen ist es absolut notwendig,
  noch stärker in die Sicherheit der Hauptstadt zu investieren. Und: Berlin ist eine
  Weltklasse-Kulturmetropole. Die Konzerthäuser, Museen und anderen Kulturorte sind
  Aushängeschilder für unser Land, die wir als Bund fördern. Das ist sehr gut eingesetztes
  Geld – für Berlin und für Deutschland.“ Staatsminister für Kultur und Medien Wolfram
  Weimer: „Mit dem neuen Hauptstadtfinanzierungsvertrag haben wir eine wichtige Grundlage
  geschaffen, um die Kultur in Berlin zu stärken und ihre gesamtstaatliche Bedeutung
  noch stärker zur Geltung zu bringen. Der Bund bleibt damit ein zuverlässiger Partner
  der Hauptstadtkultur und ihrer herausragenden Einrichtungen, die national und international
  das kulturelle Bild Deutschlands prägen. Das Wichtigste ist: die Kernpfeiler der
  Bundeskultur werden auch in schwierigen Zeiten fortgeführt. Zugleich haben wir uns
  für eine maßvolle Erhöhung der Kulturförderung eingesetzt. Unsere Schwerpunkte reichen
  von der Exzellenzförderung in Musik und Museen über die Stärkung der Erinnerungskultur
  bis hin zur gleichbleibend großen Unterstützung der freien Szene. Wir stärken herausragende
  Musikinstitutionen, würdigen das Bauhaus-Erbe, entwickeln den Checkpoint Charlie
  als Erinnerungs- und Bildungsort weiter und sichern mit dem Hauptstadtkulturfonds
  die Vielfalt der Berliner Kulturlandschaft.“ Regierender Bürgermeister von Berlin
  Kai Wegner : „Der Bund bekennt sich zu seiner Hauptstadt: Mit dem neuen Hauptstadtfinanzierungsvertrag
  ab 2028 investiert die Bundesregierung in den nächsten zehn Jahren in die Sicherheit
  2,1 Milliarden Euro und insgesamt 2,9 Mrd. Euro in die Kultur in Berlin. Damit stärken
  wir angesichts der zunehmenden Bedrohungslagen die Sicherheit in Berlin, aber auch
  unsere herausragenden Kultureinrichtungen wie die Staatsoper Berlin oder die Philharmonie.
  Ich danke besonders Senator Stefan Evers für die intensiv geführten Verhandlungen
  mit dem Bund, die zu guten Ergebnissen für Berlin geführt haben. Berlin ist die
  Hauptstadt Deutschlands – und wird seine Aufgaben gewissenhaft, zuverlässig und
  verantwortungsvoll erfüllen.“ Senator für Finanzen und für Kultur und Gesellschaftlichen
  Zusammenhalt Stefan Evers: „Berlin trägt Verantwortung weit über die eigenen Stadtgrenzen
  hinaus. Als Hauptstadt Deutschlands und politisches Zentrum der größten Volkswirtschaft
  Europas ist Berlin Regierungssitz, Ort unserer demokratischen Institutionen und
  zugleich eines der wichtigsten Schaufenster unseres Landes in die Welt. Aus dieser
  besonderen Rolle erwächst eine gemeinsame Verantwortung von Bund und Land. Der neue
  Hauptstadtfinanzierungsvertrag schafft dafür eine verlässliche Grundlage: Er stärkt
  die Sicherheit der Hauptstadt und ihrer demokratischen Institutionen, sichert Kultur
  von nationaler und internationaler Strahlkraft und gibt Berlin Planungssicherheit
  für die kommenden zehn Jahre. Das ist mehr als eine Finanzierungsvereinbarung. Es
  ist ein klares Bekenntnis des Bundes zu Berlin als Hauptstadt und zur gemeinsamen
  Verantwortung für ihre Zukunft.“ Senatorin für Inneres und Sport Iris Spranger :
  „Ich freue mich, dass das Land Berlin für die Leistung von hauptstadtbedingten Sicherheitsmaßnahmen
  künftig 200 Millionen Euro statt bisher 120 Millionen Euro pro Jahr erhält. Der
  Bund stellt diesen Betrag in 2028 und 2029 bereit. Dieser wird alle zwei Jahre um
  je fünf Millionen Euro erhöht. Berlin trägt als Bundeshauptstadt eine besondere
  Last für die Sicherheit unseres Landes. Die Polizei Berlin schützt das Parlaments-
  und Regierungsviertel, Bundesministerien und diplomatische Vertretungen, sichert
  Staatsbesuche sowie mehr als 7.000 Versammlungen und Veranstaltungen im Jahr. Das
  alles kostet viel Geld.“ Die Vereinbarung setzt deutliche Akzente für die Sicherheit
  und Kultur in der Hauptstadt. Im Bereich der Inneren Sicherheit werden die Ausgleichsleistungen
  des Bundes auf anfänglich 200 Mio. Euro ansteigen, die alle zwei Jahre um fünf Mio.
  Euro erhöht werden. Damit erhält Berlin über die Vertragslaufzeit bis 2037 2,1 Mrd.
  Euro vom Bund, rund eine Mrd. Euro mehr als im Vorgängervertrag. So leistet der
  Bund einen starken Beitrag für die Sicherheit der Hauptstadt und der Menschen in
  Berlin. Erhebliche Leistungen des Bundes sind auch für die Hauptstadtkultur vorgesehen:
  Die bestehenden Förderungen werden fortgeführt und aufgestockt. Teilweise geschieht
  dies durch die Erhöhung bestehender Förderungen, beispielsweise. mit Blick auf die
  Stiftung Oper in Berlin und die Stiftung Berliner Philharmoniker. Der Bund und das
  Land Berlin erkennen die herausragende nationale und internationale Bedeutung der
  Berliner Philharmonie an. Abhängig von der Vorlage eines von Bund und Land unterstützten
  Sanierungskonzeptes beteiligt sich der Bund mit einem Festbetrag von maximal 225
  Mio. Euro an der Finanzierung der Sanierung der Philharmonie Berlin. Der Baustart
  ist für 2032 vorgesehen. Andere Förderungen werden neu aufgenommen – zum Beispiel
  die Förderung für das Bauhaus Archiv Berlin. Insgesamt ergibt sich über die Vertragslaufzeit
  eine Erhöhung der Kulturförderung um 352 Mio. Euro gegenüber dem vorangegangenen
  Hauptstadtfinanzierungsvertrag. Insgesamt werden die Leistungen des Bundes für Kultur
  in Berlin dann rund 2,9 Mrd. Euro betragen. Damit schafft der Hauptstadtfinanzierungsvertrag
  klare Zukunftsperspektiven für die Kulturinstitutionen der Stadt. Die Fortsetzung
  und Erhöhung der Förderungen im Kulturbereich schafft nicht nur Kontinuität und
  Planungssicherheit für die geförderten Einrichtungen, sondern stellt auch langfristig
  die Repräsentation der Bundesrepublik Deutschland durch die kulturellen Einrichtungen
  in der Bundeshauptstadt sicher.'
