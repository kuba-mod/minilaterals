title: Bundeskanzler Merz zur Auswahl der deutschen Bewerberregion für Olympische
  und Paralympische Spiele
text: '„Deutschland hat einen Olympia-Kandidaten. München wird für uns ins Rennen
  gehen, wozu ich der Landeshauptstadt und dem Freistaat Bayern herzlich gratuliere.
  Der Region KölnRheinRuhr und dem Land Nordrhein-Westfalen sowie der Freien und Hansestadt
  Hamburg und dem Land Berlin danke ich ausdrücklich für die eingereichten Bewerbungen
  und ihren Einsatz, Olympische und Paralympische Spiele in Deutschland wieder zu
  ermöglichen. Nun fiebern wir zusammen mit unserem Olympia-Kandidaten auf dieses
  Großereignis hin. Wir gehen mutig voran: Deutschland kann Olympia. Wir packen jetzt
  gemeinsam die internationale Bewerbung an.“'
