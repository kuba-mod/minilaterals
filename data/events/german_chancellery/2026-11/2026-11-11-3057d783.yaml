title: Integrationsbericht im Kabinett vorgestellt Integration so erfolgreich wie
  nie
text: Die Integrationsbeauftragte der Bundesregierung, Natalie Pawlik, und der Direktor
  des Deutschen Zentrums für Integrations- und Migrationsforschung, Frank Kalter,
  haben den 15. Integrationsbericht vorgestellt. Nachkommen von Eingewanderten erreichen
  im Vergleich zu ihren Eltern deutlich höhere Bildungsabschlüsse und damit verbunden
  bessere Chancen auf dem Arbeitsmarkt. Das geht aus den Daten des aktuellen Integrationsberichtes
  hervor, den die Beauftragte der Bundesregierung für Migration, Flüchtlinge und Integration,
  Natalie Pawlik, dem Kabinett vorlegte. Für Eingewanderte selbst hingegen, insbesondere
  für eingewanderte Frauen, sieht der Bericht nach wie vor Hürden und Ungleichheiten
  in der Bildung, auf dem Arbeitsmarkt und bei der gesellschaftlichen Teilhabe. Die
  schnelle Integration eingewanderter Menschen ist der Bundesregierung ein wichtiges
  Anliegen. Integration gelingt besonders gut über Kontakte am Arbeitsplatz. Berufssprachkurse
  – gefördert durch das Bundesministerium für Arbeit und Soziales ( BMAS) – etwa sind
  ein wichtiger Hebel, um Menschen in Arbeit zu bringen. Der Integrationsbericht gibt
  alle zwei Jahre einen umfassenden Überblick über die Entwicklung der Integration
  in Deutschland und ordnet sie wissenschaftlich ein. Insgesamt betrachtet der Integrationsbericht
  14 Themenfelder – darunter Bildung, Gesundheit, Wohnen sowie auch Einkommen, Sprache
  und Rassismus. Er liefert damit eine wichtige Orientierungshilfe für die integrationspolitische
  Debatte in Deutschland. Alle Indikatoren sind online im „ Dashboard Integration“
  des Statistischen Bundesamtes zugänglich. Mit Programmen wie " MY TURN ” und „Mehr
  Unternehmerinnen für den Mittelstand“ fördert die Bundesregierung zudem Projekte,
  die speziell eingewanderte Frauen auf ihrem Weg in Ausbildung, Qualifizierung und
  Beschäftigung oder Selbstständigkeit unterstützen. Mit dem Startchancen-Programm
  setzt die Bundesregierung sich für mehr Chancengerechtigkeit in der Bildung ein.
  Sie leistet damit einen entscheidenden Beitrag, um den Zusammenhang zwischen sozialer
  Herkunft und Bildungserfolg aufzubrechen. Davon profitieren auch Kinder aus Einwandererfamilien.
  Im Jahr 2025 lebten in Deutschland 21,8 Millionen Menschen mit Einwanderungsgeschichte,
  dies entspricht mehr als jeder vierten Person. Eingewanderte und ihre Nachkommen
  leisten einen wichtigen Beitrag zur Fachkräftesicherung und zur Stabilisierung systemrelevanter
  Bereiche, zum Beispiel im Gesundheits- und Sozialwesen, in der Pflege, im Gastgewerbe
  sowie in Verkehr und Lagerei.
