title: 'Wiedereröffnung des Dokumentationszentrums Reichsparteitagsgelände in Nürnberg
  – Staatsminister Weimer: „Nürnberg zeigt, was es bedeutet, Verantwortung für die
  Vergangenheit zu übernehmen.“'
text: 'Im Rahmen einer Festveranstaltung wurde heute in Nürnberg das Dokumentationszentrum
  Reichsparteitagsgelände wiedereröffnet. Dabei wurde die neue Dauerausstellung „Nürnberg
  und die Reichsparteitage“ erstmals vorgestellt, die die Geschichte des Geländes
  multimedial und innovativ vermittelt. Anwesend waren unter anderem Christian Wulff,
  Bundespräsident a. D., Joachim Hermann, der Bayerische Staatsminister des Innern,
  für Sport und Integration sowie Oberbürgermeister Marcus König und Maria Bering,
  Stellvertretende Amtschefin des Beauftragten der Bundesregierung für Kultur und
  Medien (BKM), in Vertretung für Kulturstaatsminister Wolfram Weimer. Staatsminister
  Wolfram Weimer: „Das ehemalige Reichsparteitagsgelände ist ein Ort von besonderer
  historischer Bedeutung und eine eindringliche Mahnung an die Verbrechen des Nationalsozialismus.
  Die neue Ausstellung des Dokumentationszentrums setzt sich auf innovative Weise
  mit der propagandistischen Inszenierung des NS-Regimes auseinander sowie mit den
  verheerenden Folgen der Ausgrenzung und Menschenfeindlichkeit. Gerade in Zeiten,
  in denen Rechtsextreme und Populisten unsere Demokratie angreifen und einen Schlussstrich
  unter die Geschichte ziehen wollen, brauchen wir Orte des Lernens und der kritischen
  Reflexion – Orte wie diese: Hier in Nürnberg zeigt sich, was es bedeutet, wenn demokratische
  Gesellschaften Verantwortung für ihre Vergangenheit übernehmen und Orientierung
  für die Zukunft geben können. Ich freue mich, dass BKM dieses wichtige Vorhaben
  unterstützt.“ Das Dokumentationszentrum feiert in diesem Jahr sein 25-jähriges Bestehen.
  Nach fünfjähriger Bauzeit ist die Neugestaltung abgeschlossen. Nun öffnet es wieder
  seine Türen. BKM hat die Neukonzeption mit Fördermitteln in Höhe von 3,7 Mio. Euro
  unterstützt. Der Freistaat Bayern und die Stadt Nürnberg gaben jeweils rund 1,85
  Mio. Euro dazu. Das ehemalige Reichsparteitagsgelände ist das größte erhaltene Ensemble
  nationalsozialistischer Staats- und Parteiarchitektur in Deutschland. Von 1933 bis
  1938 fanden hier die Reichsparteitage als jährlicher Höhepunkt der NS-Propaganda
  statt, an denen Hunderttausende Menschen teilnahmen. Im Rahmen des parlamentarisch
  initiierten Förderverfahrens KulturInvest unterstützt BKM zahlreiche Projekte zur
  Aufarbeitung des Nationalsozialismus in Nürnberg. Mit insgesamt über 90 Millionen
  Euro Fördermitteln werden unter anderem der Erhalt der historischen Bausubstanz
  der Kongresshalle sowie ihre kulturelle Nutzung und die Weiterentwicklung der Zeppelintribüne
  und des Zeppelinfelds als Lern- und Begegnungsorte gefördert. Darüber hinaus unterstützt
  BKM im Rahmen der Gedenkstättenkonzeption des Bundes bis 2029 die Erweiterung der
  Dauerausstellung des Memorium Nürnberger Prozesse mit 750.000 Euro.'
