title: Bundesregierung aktuell
text: 'es ist gar nicht so einfach, fünf Regierungschefs über eine Brücke zu bringen.
  Die irische Hauptstadt Dublin wird vom Fluss Liffey durchzogen, und über diesen
  Fluss führt in den schick herausgeputzten Docklands der Stadt die Samuel-Beckett-Brücke.
  Dort also sollen die Ministerpräsidenten und Kanzler von Dänemark, Deutschland,
  Finnland, Österreich und Schweden möglichst fototauglich hinüberlaufen, wozu der
  Begleittross von mindestens 50 Personen und eine beachtliche Zahl von Sicherheitskräften
  das Bild frei machen müssen. Die Operation gelingt, die fünf schreiten voran und
  erreichen sehr fotogen das Konferenzzentrum von Dublin, rechtzeitig für den Sonderrat
  der Europäischen Union. Die perfekte Flussquerung ist keine schlechte Metapher für
  Europas Arbeitsprogramm in diesem Herbst. Zwei gewaltige, geradezu geschichtsmächtige
  Aufgaben warten auf die Staatengemeinschaft: Die EU will sich bis zum Jahresende
  ihren Haushalt geben, der wie stets sieben Jahre lang wirkt und deshalb besonders
  umkämpft ist; und zweitens sind der Krieg in der Ukraine und die andauernde Bedrohung
  durch Russland die größte Gefahr für Europas Sicherheit, Stabilität und auch den
  Wohlstand des Kontinents. Beide Probleme sind miteinander verknüpft, weshalb die
  irische Ratspräsidentschaft zwei Sonderräte (der nächste findet bereits in zwei
  Wochen statt) einberufen hat, um an Lösungen zu arbeiten. Von außen betrachtet ist
  Fortschritt dabei eine Schnecke, tatsächlich aber ergeben sich hinter den Kulissen
  wichtige Begegnungen, Gespräche und Vorabsprachen. Informelle Räte lassen Platz
  für Speed-Rating, Beichtstuhlgespräche, ehrliche Bekenntnisse über wahre Absichten
  und Möglichkeiten. Deutschland wie den vier anderen Brückenläufer-Nationen kommt
  dabei eine besondere Rolle zu, weil es sich hier um die Nettozahler handelt, die
  wichtigsten Financiers der EU. Ziel ist es, das Euro-Umwälzprogramm aus den sogenannten
  Kohäsionsmitteln, den Landwirtschaftshilfen und den anderen Töpfen so zu gestalten,
  dass ein ökonomischer Mehrwert für die gesamte Gemeinschaft entsteht. Wer also Europa
  fördert, möchte auch vom Wachstum und vom pulsierenden Binnenmarkt profitieren.
  Das zumindest ist im Kern das deutsche Interesse. Dass der Krieg in der Ukraine
  dabei eine gewichtige Rolle spielt, hat Bundeskanzler Friedrich Merz schon immer
  klar gesagt. Deutschland ist wichtigster Unterstützer der Ukraine, aber die Finanzierung
  des Landes liegt im Interesse aller Europäer, deren Sicherheit im Donbas verteidigt
  wird. Darüber haben die Staats- und Regierungschefs ein offenes Gespräch geführt
  – und sich der deutschen Einsicht nicht verweigert. Genauso wichtig ist die Erkenntnis,
  dass die sich nun abzeichnenden Verhandlungen über einen Frieden in der Ukraine
  nicht von einer einzigen Person geführt werden kann. Europa war immer die Gemeinschaft
  der Vielen, die aus dem Ausgleich der Interessen ihre Stärke gezogen hat. Deswegen
  wird Europa auch künftig in unterschiedlicher Zusammensetzung diese politische Großaufgabe
  leisten: mal als E-3 (also der Gruppe aus Deutschland, Frankreich und Großbritannien),
  mal als E-5, im Berliner Format, als EU oder EPG. Die Idee der „variablen Geometrie“
  ist eine europäische Spezialität, und sie hilft schon seit vielen Jahren dabei,
  in möglichst großer Formation Brücken zu überqueren. Behandlungen gab es 2025 in
  Notfallambulanzen. Wir freuen uns über Ihr Feedback: Nutzen Sie bitte dafür das
  Kontaktformular (nicht die Antwortfunktion auf diese E-Mail).'
