title: Wolf Biermann wird 90 – Staatsminister Weimer würdigt den Liedermacher als
  unbeugsame Stimme der Freiheit
text: 'Staatsminister für Kultur und Medien Wolfram Weimer gratuliert dem Liedermacher
  und Lyriker Wolf Biermann zu dessen 90. Geburtstag am 15. November 2026. Staatsminister
  Weimer erklärte vorab: „Wolf Biermann ist ein außergewöhnlicher Künstler und eine
  der prägenden Stimmen des Widerstands gegen die SED-Diktatur. Mit seinen Liedern
  und Gedichten forderte er das Regime heraus und ließ sich auch durch Repressionen
  und Auftrittsverbote nicht zum Schweigen bringen. Sein Mut und seine Beharrlichkeit
  erschienen der SED-Führung als Gefahr für ihren Machterhalt. Seine Ausbürgerung
  aus der DDR 1976 setzte eine große Solidaritätsbewegung in Ost und West in Gang.
   Aus dem Freiheitskampf der DDR-Bevölkerung ist Biermanns Name seitdem nicht wegzudenken.
  Mit seiner Kunst und seiner Haltung hat Wolf Biermann eindrucksvoll gezeigt, welche
  Kraft das freie Wort entfalten kann. Seine Lieder haben bis heute nichts von ihrer
  Wirkung verloren. Zu seinem 90. Geburtstag gratuliere ich ihm herzlich und wünsche
  ihm alles Gute.“ Der 1936 in Hamburg geborene Wolf Biermann lebte seit 1953 in der
  DDR. Als Liedermacher und Lyriker setzte er sich stets kritisch mit der SED-Diktatur
  auseinander. 1965 verhängte die SED-Führung ein generelles Auftritts- und Publikationsverbot
  gegen ihn. Am 16. November 1976 – vor 50 Jahren – wurde Wolf Biermann während einer
  Tournee durch die Bundesrepublik aus der DDR ausgebürgert. Dies löste heftige Proteste
  in West- und Ostdeutschland aus. In den folgenden Jahren verließen viele Künstlerinnen
  und Künstler vermehrt die DDR. Für sein herausragendes künstlerisches und gesellschaftliches
  Wirken wurde Wolf Biermann vielfach ausgezeichnet. Zu den renommierten Ehrungen,
  die er erhielt, zählt auch das Bundesverdienstkreuz. Zuletzt wurde Wolf Biermann
  am 31. Mai 2026 im Konzerthaus Berlin das Große Ordenszeichen des Orden Pour le
  mérite für Wissenschaften und Künste überreicht. Die Aufnahme in den Orden Pour
  le mérite zählt zu den höchsten Ehrungen, die einem Wissenschaftler oder Künstler
  in Deutschland zuteilwerden kann. Der Staatsminister für Kultur und Medien finanziert
  den Orden und betreut ihn organisatorisch. Seit Ende Oktober ist der Dokumentarfilm
  „BIERMANN“ von Jens Meurer, Gewinner des Europäischen Filmpreises und des Golden
  Globes, bundesweit in den Kinos zu sehen. Der mit dem Gilde Filmpreis als Bester
  Dokumentarfilm ausgezeichnete Film erzählt Biermanns Biografie als unmittelbaren
  Rückblick und verbindet persönliche Erinnerungen mit politischer Zeitgeschichte.
  Der Beauftragte der Bundesregierung für Kultur und Medien (BKM) hat die Produktion
  über den Deutschen Filmförderfonds (DFFF) mit mehr als 200.000 Euro gefördert.'
