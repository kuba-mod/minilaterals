title: 'Erneut Rekordetat von knapp 2,6 Milliarden Euro für Kultur und Medien – Staatsminister
  Weimer: „Kraftvoller Vertrauensbeweis für die Kulturnation Deutschland“'
text: 'Mit 2,58 Milliarden Euro steht für 2027 ein Kultur- und Medienetat auf Rekordniveau
  bereit. Damit steigt der Haushalt von Staatsminister Wolfram Weimer gegenüber dem
  Regierungsentwurf um mehr als 220 Millionen Euro. Dies beschloss der Haushaltsausschuss
  des Deutschen Bundestages in der entscheidenden Sitzung zum Bundeshaushalt 2027.
  Kulturstaatsminister Wolfram Weimer: „Mehr als 2,58 Milliarden Euro sind in diesen
  Zeiten ein Riesenerfolg für unsere Kultur- und Medienlandschaft. Eine Kulturnation
  wie Deutschland braucht solch einen kraftvollen, finanziellen Vertrauensbeweis gerade
  jetzt. Unsere Kultur lebt von ihrer Vielfalt und Unabhängigkeit. Sie baut auf starke
  Institutionen und bewährte Strukturen. Was wir heute hier reininvestieren, zahlt
  sich morgen als gesellschaftlicher Zusammenhalt aus. Besonders wichtig sind hierfür
  auch die Gelder in nie dagewesener Höhe für unsere Kulturbauten und Denkmäler. Damit
  stärken wir bundesweit die gebauten Zeitzeugen unserer Geschichte. Dafür danke ich
  den Abgeordneten des Deutschen Bundestages.“ Die nun beschlossenen Steigerungen
  treten zu Aufwüchsen hinzu, die bereits im Regierungsentwurf 2027 enthalten waren.
  Dazu gehören 10 Millionen Euro zusätzlich für den Gedenk- und Erinnerungsbereich,
  1 Million Euro für das Beethoven-Jubiläum und 400.000 Euro für die Stiftung Hambacher
  Schloss. Für sie stehen nun insgesamt 750.000 Euro bereit. Investitionsschub für
  Kulturbauten und Denkmalschutz Den stärksten Mittelaufwuchs erhält die Kulturbauten-Initiative.
  Dafür sind beim parlamentarisch initiierten Förderverfahren „KulturInvest“ 280 Millionen
  Euro etatisiert. Damit sollen unter anderem Baumaßnahmen am Freiburger Münster,
  bei den Bad Hersfelder Festspielen und der Sammlung Prinzhorn gefördert werden.
  Auch das Marineehrenmal in Laboe, Burg Hohnstein in Sachsen und die Wartburg in
  Eisenach sollen davon profitieren. Bis zu 50 Millionen Euro sollen zudem für eine
  Neuauflage eines XVI. Denkmalschutz-Sonderprogramms bereitgestellt werden. Erinnerung
  für die Zukunft lebendig halten Neben dem Mittelzuwachs für das Hambacher Schloss
  erhält das Deutsche Historische Museum als zentraler Ort für die Deutsche Geschichte
  zusätzlich 1,5 Millionen Euro für seine wichtige Ausstellungs- und Vermittlungsarbeit.
  Das Bauhaus-Archiv Berlin wird mit 3 Millionen Euro gefördert. Auch das Bundesarchiv
  erhält 4,5 Millionen Euro zusätzlich, um unter anderem die laufende Digitalisierung
  nachhaltig zu unterstützen. Mehr Geld für Freie Szene, Musik und Tanz Die einzigartige
  Vielfalt der Freien Szene wird ebenfalls mit zusätzlichen Fördermitteln in der Fläche
  gestärkt: Die sechs Bundeskulturförderfonds erhalten insgesamt bis zu 26,6 Millionen
  Euro. Neben der Förderung des Beethoven-Jubiläums werden im Musikbereich der Festivalförderfonds
  und der Amateurmusikfonds mit 3 Millionen Euro zusätzlich ausgestattet. Weitere
  Mittel sollen unter anderem dem Bundesjugendballett, den Brüder-Grimm-Festspielen
  in Hanau sowie verschiedenen Tanzprojekten, darunter die Initiative Dance on, zugutekommen.
  Der Haushalt tritt voraussichtlich zum 1. Januar 2027 in Kraft.'
