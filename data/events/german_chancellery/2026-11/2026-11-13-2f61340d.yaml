  Tatsache, dass sich jetzt alles um diese Badeente dreht, ein bisschen zeigt, dass
  wir da diesen Punkt getroffen haben und es um ein Sammlerstück geht. Es geht natürlich
  nicht darum, die Bundeswehr ins Kinderzimmer zu bringen oder Ähnliches. Sie kennen
  unsere ganz deutliche Position dazu, wie wir mit Minderjährigen umgehen. An dieser
  Position hat sich dadurch, dass es jetzt eine Badeente als Sammlerstück in dem Onlineshop
  gibt, nichts geändert. Sie haben gesagt, dass es eine Ausschreibung gab und die
  Anbieter ein Angebot gemacht haben. Was für ein Angebot haben die denn gemacht?
  Die Bundeswehr verdient schließlich nichts daran. Wie Ausschreibungsverfahren so
  sind, ging es darum, zu schauen, in welcher Form das umgesetzt werden kann. Wenn
  Sie auf die Internetseite schauen, wenn die Aufrufzahlen wieder etwas zurückgegangen
  sein werden und sie wieder erreichbar sein wird, dann sehen Sie, dass der Lizenznehmen
  Kooperationen mit anderen Marken eingegangen ist usw. Wie Sie wissen, kann ich hier
  nicht im Detail auf das Ausschreibungsverfahren als solches eingehen. Bekommt die
  Bundeswehr oder bekommen Sie im Gegenzug Merchandiseprodukte, die Sie bei Ihren
  öffentlichen Aktionen zur Verfügung stellen können, oder müssen Sie sie von dem
  Lizenznehmer kaufen? Wir verfügen auch so schon über ein breites Portfolio an Merchandiseprodukten.
  Hier ist auch die Preiskategorie zu beachten. Zum Teil geht es deutlich über den
  Notizblock oder den Kugelschreiber hinaus. Insofern werden viele Produkte dieser
  Produktpalette einfach schon aus diesem Grunde nicht als Merchandise zum Beispiel
  beim Tag der Bundeswehr verteilt. Wir haben dort zum Teil sehr hochpreisige Produkte.
  Es gibt eine gewisse Grenze bezüglich dessen, was frei verfügbar als Merchandise
  verteilt werden kann. Sie können sich vorstellen, dass wir zum Beispiel die Collegejacke
  nicht in breitem Umfeld verteilen können oder werden. Selbstverständlich können
  wir Produkte, wie wir sie haben, auch bestellen. Aber das sind dann nicht die Produkte
  dieses Unternehmens. Das heißt, von ihm bekommen wir keine Produkte extra gestellt,
  sondern das läuft wirklich in zwei separaten Linien, weil es der Lizenznehmer ist
  und er das alles auf eigenes wirtschaftliches Risiko macht. Herr Hille, Norwegen,
  aber davor auch schon Finnland hat russischen Athleten bis zum Ende des Kriegs in
  der Ukraine die Einreise verboten. Wird Ähnliches in Deutschland erwogen, also ein
  Einreiseverbot ? Ich frage das auch mit Blick auf die Eishockeyweltmeisterschaft
  , die am 14. Mai 2027 hier im Land starten soll. Von diesem Zusammenhang, Frau Kollegin,
  bin ich ausgegangen. Ich erspare mit jetzt, für die anderen noch einmal den ganzen
  Kontext aufzumachen. In aller Kürze: Der Internationale Sportgerichtshof hat entschieden,
  dass russische Mannschaften wieder zugelassen werden können, was die erste Anwendung
  in Bezug auf Deutschland bei der bevorstehenden Eishockeyweltmeisterschaft in Deutschland
  haben könnte. Es gab, wenn man so sagen will, eine breite internationale Ablehnung
  oder zumindest Hinweise darauf, dass die Mannschaften nicht mehr gegen Russland
  spielen werden. Sie haben Finnland und Norwegen genannt. Insgesamt haben sich mittlerweile
  elf im Eishockey führende nationale Verbände dahin gehend geäußert, dass sie bei
  den nächsten internationalen Eishockeyturnieren nicht gegen Russland antreten würden.
  Neben den beiden genannten sind es unter anderem Kanada, Tschechien, Schweden, Dänemark,
  die Ukraine, Lettland, also im Eishockey führende Mannschaften, die man dabeihaben
  möchte. Aus Sicht der Bundesregierung zeigt diese deutliche Reaktion eines, dass
  nämlich der internationale Eishockeysport die Wiederzulassung Russlands durch die
  Entscheidung des Internationalen Sportgerichtshofs nicht akzeptiert. Die Gespräche
  des Bundeskanzleramtes, in diesem Fall des Staatsministers und seines Amtes, mit
  dem Deutschen Eishockey-Bund, dem Deutschen Olympischen Sportbund und dem Präsidenten
  des internationalen Eishockeyverbandes haben gezeigt, dass die Teilnahme Russlands
  angesichts der breiten Ablehnung, die ich gerade geschildert habe, die Durchführbarkeit
  der Eishockeyturniere aus sportlichen und wirtschaftlichen Gründen faktisch unmöglich
  machen. Aufgrund dieser jüngsten Entwicklung unterstützt die Bundesregierung den
  Deutschen Eishockey-Bund als Partner in seinem Bemühen, diese Lage zum Schutz der
  Integrität des Eishockeysports und der Durchführbarkeit der geplanten Turniere zusammen
  mit dem IIHF und den anderen Ausrichtern neu zu bewerten und zu einer gemeinsamen
  Lösung zu führen. Das heißt aber auch, dass Sie froh darüber sind, dass die anderen
  dagegen waren und Sie das nicht sagen mussten. Das ist eine nicht zutreffende Interpretation.
  Das habe ich nicht gesagt. Ich habe darauf verwiesen, um zu zeigen, wer neben uns
  diese Entscheidung der Zulassung der Mannschaft durch den CAS für nicht angebracht
  und für nicht gut hält. Die Lösung ist aber nicht ‑ darauf spielen Sie ja wahrscheinlich
  auch an ‑, Visa in unserem Land zu verweigern. Denn dann wird das Turnier im Zweifel
  in einem anderen Land stattfinden, und das Problem bleibt bestehen. Das Grundproblem
  muss gelöst werden; darum geht es. Das muss im Zusammenspiel zwischen uns und den
  verantwortlichen Verbänden, dem nationalen und dem internationalen Eishockeyverband,
  zu einer Lösung geführt werden. Das Thema ist hier ja ein Dauerbrenner. Vor zwei
  Wochen hat Herr Kornelius gesagt, die Bundesregierung und die Verbände setzten sich
  zusammen und wollten zeitnah eine Lösung finden. Man gehe auch so weit, das Thema
  der Visavergabe hochzuziehen. Jetzt sagte Herr Rauhe im Sportausschuss, nein, die
  Visavergabe sei keine Option, das solle der Sport allein klären. Was ist eigentlich
  die Haltung der Bundesregierung? Warum schlingern Sie da so? Da schlingern wir nicht.
  Ich denke, das ist eine gewisse Missinterpretation dessen, was der Staatsminister
  gesagt hat. Es geht um das, was ich gerade skizziert habe. Das Problem muss grundsätzlich
  gelöst werden. Es bringt nichts, das Problem zu verschieben, indem wir sagen: Wir
  verweigern Visa, und deshalb kann das bei uns nicht stattfinden. ‑ Denn dann wird
  das Turnier woanders stattfinden. Daran haben wir kein gesteigertes Interesse, sondern
  wir würden das Turnier natürlich gern in Deutschland ausrichten. Das Problem der
  Teilnahme russischer Mannschaften besteht in anderen Ländern genauso. Darauf hat
  der Staatsminister mit dem Hinweis, dass das nicht das Problem löse, Bezug genommen.
  Das Problem, wie man damit umgeht, muss im Zusammenspiel zwischen uns und vor allen
  Dingen den verschiedenen nationalen Eishockeyverbänden sowie dem internationalen
  Eishockeyverband gelöst werden. Deshalb habe ich eingangs die breite Ablehnung geschildert.
  Wenn elf weltweit führende Eishockeyverbände nicht mehr gegen Russland antreten
  wollen, dann beschreibt das das Grundproblem, und das muss gelöst werden. Ich nehme
  die Aussagen hier trotzdem als „mal so, mal so“ wahr. Wie gesagt, letzte Woche war
  es noch so, dass man das eindeutig in die Überlegungen mit einbezogen und auch gesagt
  hat: Wir setzen uns zusammen hin. ‑ Herr Rauhe ‑ ich zitiere ihn ‑ hat gesagt, dass
  der Sport selbstständig eine Lösung finden solle. Ich sehe den Gegensatz, den Sie
  aufmachen, nicht, sondern wie so häufig geht es um Schritte, die aufeinander folgen.
  Nach meinem und unserem Dafürhalten ergibt es keinen Sinn, den fünften Schritt vor
  dem ersten zu tun. Es ist erstrebenswert, das Grundproblem zu lösen, und zwar in
  der Autonomie des Sportes, durch die Sportverbände, die dafür zuständig sind, mit
  unserer Unterstützung. Dann lassen Sie uns doch ‑ Kollege Kornelius hat „zeitnah“
  gesagt; ich habe jetzt gesagt „so schnell wie möglich“; auch das halte ich nicht
  für einen Widerspruch ‑ in den nächsten Wochen im Gespräch bleiben und schauen,
  ob nicht eine solche Lösung innerhalb der Sportverbände gefunden wird. Dann kann
  man gegebenenfalls auch über andere Optionen diskutieren, die natürlich mit in das
  Gesamtportfolio gehören.'
