date: '2026-11-13'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 13. November 2026
text: 'Sprecherinnen und Sprecher •    stellvertretender Regierungssprecher Hille
  •    Dr. Laiadhi (BMF) •    Hinterseher (AA) •    Lagé (BMFTR) •    Lenz (BMBFSFJ)
  •    Jenning (BMVg) •    Druckenthaner (BMDS) •    Bowinkelmann (BMI) •    Reck
  (BMV) •    Ehrentraut (BMAS) •    Wentzel (BMWE) (Vorsitzende Wolf eröffnet die
  Pressekonferenz und begrüßt SRS Hille sowie die Sprecherinnen und Sprecher der Ministerien.)
  Ich habe, wie am Freitag üblich, die Termine des Bundeskanzlers für die kommende
  Woche mitgebracht. Bundeskanzler Merz wird am Montag, dem 16. November, an der Eröffnung
  des neuen Entwicklungs- und Technologiezentrums der MTU Aero Engines AG teilnehmen
  und dort gegen 14.25 Uhr eine Rede halten. Die Veranstaltung findet im neuen Entwicklungs-
  und Technologiezentrum des Unternehmens am Hauptsitz in München statt. MTU Aero
  Engines beschäftigt weltweit rund 14 000 Mitarbeiterinnen und Mitarbeiter und ist
  ein führender Hersteller von Triebwerkskomponenten und -systemen für die zivile
  und militärische Luftfahrt, unter anderem auch für den Eurofighter. Die Rede des
  Bundeskanzlers ist presseöffentlich. Ebenfalls am Montag, dem 16. November, findet
  am Abend hier im Haus der Bundespressekonferenz das Jubiläum des Vereins der Ausländischen
  Presse statt. Auch dort wird der Bundeskanzler zu Gast sein. Anlässlich des 120. Geburtstags
  dieser traditionsreichen Vereinigung wird der Bundeskanzler gegen 18 Uhr die Festrede
  halten und dabei den Auslandskorrespondentinnen und Auslandskorrespondenten für
  ihre Arbeit danken. Die bewegte Geschichte des Vereins spiegelt auch die Geschichte
  der Herausbildung unserer Demokratie wider - ein freudiger Anlass, den es zu feiern
  gilt. Am Dienstag, dem 17. November, wird der Bundeskanzler den finnischen Staatspräsidenten
  Alexander Stubb im Bundeskanzleramt empfangen. Dabei werden die Themen Sicherheit
  und Verteidigung sowie der Angriffskrieg Russlands gegen die Ukraine im Vordergrund
  stehen. Im Anschluss ist für ca. 10.45 Uhr eine gemeinsame Pressebegegnung geplant.
  Am Mittwoch, dem 18. November, findet wie gewohnt um 10 Uhr unter der Leitung des
  Bundeskanzlers eine Sitzung des Bundeskabinetts statt. Am Donnerstag, dem 19. November,
  lädt der Bundeskanzler gemeinsam mit Präsident Macron und Premierminister Burnham
  zu einem Treffen der „Koalition der Willigen“ nach Berlin ein. Das Gipfeltreffen
  im Bundeskanzleramt steht unter dem Motto „United for Peace in Ukraine and European
  Security“. Drei Themen werden im Mittelpunkt des Treffens stehen: Erstens die Abstimmung
  zu laufenden diplomatischen Bemühungen, zweitens Sicherheitsgarantien für die Ukraine
  nach dem Krieg und drittens die weitere Unterstützung der Ukraine. Deutschland nimmt,
  wie Sie wissen, als größter Unterstützer der Ukraine seine Verantwortung wahr. Unsere
  Unterstützung ist im deutschen und im europäischen Interesse; denn der Ausgang dieses
  Krieges wird die Sicherheit Europas auf lange Sicht prägen. Gemeinsames Ziel der
  Koalition bleibt ein gerechter und dauerhafter Frieden für die Ukraine. Am Freitag,
  dem 20. November, nimmt der Bundeskanzler ab 10 Uhr am 9. Deutsch-Ukrainischen Wirtschaftsforum
  im Haus der Deutschen Wirtschaft hier in Berlin teil. Unter den Teilnehmerinnen
  und Teilnehmern werden deutsche und ukrainische Ministerinnen und Minister sowie
  Entscheidungsträgerinnen und Entscheidungsträger aus der Wirtschaft sein. Der Bundeskanzler
  wird zu Beginn gegen 10.20 Uhr eine Rede halten. Am Rande des Treffens ist auch
  ein Austausch des Bundeskanzlers mit dem ukrainischen Ministerpräsidenten Korezkyj
  vorgesehen. Das Wirtschaftsforum findet in diesem Jahr mittlerweile zum neunten
  Mal auf Einladung der DIHK, der deutsch-ukrainischen Auslandshandelskammer und des
  Ost-Ausschusses der Deutschen Wirtschaft statt. Im Mittelpunkt sollen insbesondere
  die deutsch-ukrainischen Wirtschaftsbeziehungen und ihre Bedeutung bei der Unterstützung
  der Ukraine stehen. Der Bundeskanzler will zudem deutsche Unternehmen unterstützen,
  die sich in der Ukraine engagieren, und sie zu fortgesetztem Engagement ermutigen.
  Ebenfalls am Freitag, dem 20. November, wird der Bundeskanzler um 14 Uhr den Emir
  von Katar , Scheich Tamim bin Hamad Al Thani, im Kanzleramt empfangen . Bei dem
  sich anschließenden Vieraugengespräch werden ‑ ohne dass ich dem Gespräch vorgreifen
  kann ‑ die bilateralen Beziehungen zwischen Deutschland und Katar, das gemeinsame
  Engagement für nachhaltige Stabilität im Mittleren Osten und wirtschaftliche Aspekte
  im Vordergrund stehen. Ich kann ankündigen, dass Bundesfinanzminister Lars Klingbeil
  am Montag, dem 16. November, nach London reisen wird. Er wird sich dort mit seinem
  britischen Amtskollegen John Healey treffen. Diese Gespräche bieten die Gelegenheit,
  die Arbeitsbeziehungen zum Vereinigten Königreich weiter zu intensivieren und das
  gegenseitige Vertrauen unter engen Partnern zu fördern. Themen bei dem Treffen werden
  unter anderem die allgemeine politische Lage ‑ insbesondere geopolitisch ‑, die
  Unterstützung der Ukraine, die Zusammenarbeit in G7 und G20, Wachstum und Investitionen
  sowie die wirtschaftlichen Auswirkungen der künstlichen Intelligenz sein. Der Termin
  dient zudem der Vorbereitung der Zusammenarbeit unter der anstehenden britischen
  G20-Präsidentschaft sowie auch der Regierungskonsultationen Anfang 2027. Ich darf
  Ihnen ausnahmsweise eine Reise des Außenministers zum Außenrat in Brüssel ankündigen,
  weil sich dort weitere Termine anschließen. Außenminister Wadephul wird am Montag
  nach Brüssel reisen. Dort wird er zunächst am EU-Außenrat teilnehmen, wo es vorrangig
  um die Unterstützung der Ukraine mit Blick auf den Winter sowie um die Lage im Nahen
  Osten und insbesondere in Syrien gehen wird. Im Anschluss an den Außenrat nimmt
  der Außenminister am Ministertreffen zur regionenübergreifenden Sicherheit und Konnektivität
  teil, bei dem die Sicherheit in der Schwarzmeerregion sowie ein Waffenstillstand
  im Schwarzen Meer Themenschwerpunkte bilden werden. Sie wissen, dass sich Außenminister
  Wadephul dort auf diplomatischem Wege für eine Lösung eingesetzt hat. In der Diskussion
  werden auch die Fortschritte bei der Einrichtung eines Maritime Security Hub im
  Rahmen der EU-Schwarzmeerstrategie stehen, die dann Teil der Gespräche sein wird.
  Am Treffen nehmen neben den EU-Außenministern auch hochrangige Vertreter der Schwarzmeer-
  und Südkaukasusregion sowie aus Zentralasien teil. Außerdem wird der Außenminister
  Kommissionspräsidentin von der Leyen und die EU-Parlamentspräsidentin Metsola zu
  bilateralen Gesprächen in Brüssel treffen. Die Reise steht im Zeichen der Verantwortung
  Europas für seine eigene Sicherheit, ob in der Ukraine, in der Schwarzmeerregion
  oder in der direkten Nachbarschaft. Am Montagmorgen wird sich Außenminister Wadephul
  dann, wie üblich, in einem kurzen Live-Pressestatement vor dem Außenrat äußern.
  Am 16. November wird Bundesministerin Dorothee Bär mit einer Delegation zum Space-Roundtable
  Westkap nach Südafrika reisen. In Kapstadt trifft sie Vertreterinnen und Vertreter
  südafrikanischer Raumfahrtunternehmen. Raumfahrt ist ein strategisches Forschungsfeld
  der Hightech Agenda Deutschland, mit der wir Deutschland zu einem Top-Technologieland
  machen wollen. Der Austausch mit internationalen Partnern zu den Themen der Raumfahrt
  leistet hierzu einen essenziellen Beitrag. Von Kapstadt aus reist die hochrangige
  Wissenschaftsdelegation weiter, und zwar geht es vom 16. bis zum 19. November zur
  deutschen Forschungsstation Neumayer III in der Antarktis . Wie Sie wissen, darf
  der Südpol laut Antarktisvertrag allein zu friedlichen Zwecken genutzt werden. Die
  Antarktis ist damit der Wissenschaft und Forschung vorbehalten. Deutschland ist
  eine der aktiven Forschungsnationen vor Ort. Die Antarktis spielt eine bedeutende
  Rolle im globalen Klimasystem. Ein gutes Verständnis der Antarktis und ihres Ozeansystems
  ist zur Einschätzung und Bekämpfung des Klimawandels unerlässlich. Ich habe noch
  ein Kabinettsthema . Das Bundeskabinett hat gestern im Umlaufverfahren eine Reform
  des Elterngeldes und des Mutterschutzes beschlossen. Das neue Elterngeld soll durch
  die Reform noch partnerschaftlicher, attraktiver und einfacher werden. Es bleibt
  dabei, dass Eltern gemeinsam bis zu 14 Monate Basiselterngeld beziehen können. Künftig
  sind je vier Monate pro Elternteil reserviert, und sechs weitere Monate können flexibel
  unter den Eltern aufgeteilt werden. Alleinerziehende können weiterhin bis zu 14 Monate
  Elterngeld erhalten. Der Mindestbetrag beim Basiselterngeld wird von 300 auf 330 Euro
  angehoben, und der Höchstbetrag wird von 1800 auf 1900 Euro steigen. Für die vier
  reservierten Elterngeldmonate erhalten Mütter und Väter künftig einen Einkommensersatz
  von jeweils 80 Prozent des bisherigen Einkommens. Damit schafft die Bundesregierung
  einen echten Anreiz für eine partnerschaftliche Aufteilung der Elterngeldmonate,
  weil es so für Väter in der Regel attraktiver wird, sich zu beteiligen. Für jeden
  weiteren Monat Elterngeld gibt es künftig 50 Prozent Einkommensersatz, wobei auch
  hier der Höchstbetrag von 1900 Euro gilt. Das Elterngeld kann künftig wieder unbeschränkt
  durch beide Eltern gleichzeitig bezogen werden. Durch diese und weitere Vereinfachungen
  wird die Antragstellung für die Eltern erleichtert und die Bearbeitung durch die
  Elterngeldstellen beschleunigt. Auch im Mutterschutzgesetz wird ein präziserer und
  zugleich differenzierterer Schutz geschaffen werden, um die berufliche Teilhabe
  von schwangeren und stillenden Frauen zu fördern. So werden unter anderem nicht
  erforderliche pauschale Beschäftigungsverbote abgebaut. Die Reform des Elterngeldes
  gilt ja ab dem neuen Jahr. Gilt das nur für nach dem 1. Januar geborene Kinder,
  oder ändert sich auch etwas für bereits laufenden Elterngeldbezug? Herr Kollege,
  wie üblich würde ich Sie für diese Fragen an den Kollegen des Ressorts verweisen,
  der da noch viel besser drinsteckt als ich. Dann habe ich noch eine inhaltliche
  Rückfrage. Die ursprünglichen Pläne sahen ja vor, dass man das Elterngeld gar nicht
  mehr parallel beziehen kann, statt der zwei Monate, die bisher parallel laufen konnten.
  Nun kommt das Gegenteil: Man kann alle Monate parallel nehmen. ‑ Was war der Grund
  für diese Komplettumkehr von der einen Richtung in die andere? Wie der Stellvertretende
  Regierungssprecher gerade schon gesagt hat, geht es darum, dass das Ganze vereinfacht
  werden soll. Wir hoffen, dass wir damit dem Anspruch auf Vereinfachung nachkommen
  können. Können Sie näher ausführen, welche pauschalen Beschäftigungsverbote im Rahmen
  des Mutterschutzes konkret abgeschafft werden? Aber Sie haben es ja offenbar beschlossen.
  Es gibt ja zum Beispiel „nicht nach 20 Uhr“ oder „nicht am Wochenende“. Geht es
  in diese Richtung, oder ist das etwas komplett anderes? Darum kümmern sich die Kolleginnen
  und Kollegen im Ressort und versorgen Sie. Habe ich es richtig verstanden, dass
  das gestern im Umlaufverfahren beschlossen wurde? War es wegen des Haushalts nötig,
  das im Umlaufverfahren zu beschließen? Der Entwurf lag am Mittwoch zum Kabinett
  vor. Es gab meines Wissens kleine Formalia, die noch geklärt werden mussten, sodass
  das jetzt im Umlaufverfahren beschlossen werden konnte, worüber wir uns sehr freuen.
  Ich habe eine Frage an den Stellvertretenden Regierungssprecher und gegebenenfalls
  an das Auswärtige Amt zum Empfang des finnischen Staatspräsidenten . Im Sommer hatten
  Bundespräsident Steinmeier und Alexander Stubb gemeinsam einen Vorschlag für einen
  Friedensprozess im Nahen und Mittleren Osten gemacht, der die KSZE als Vorbild nimmt,
  einen ähnlich strukturierten Prozess mit allen Akteuren der Region und auch Externen,
  zu denen auch Deutschland gehören würde, zu initiieren. Wird das ein Thema sein?
  Können Sie das jetzt schon sagen? Herr Stubb trifft ja bei seinem Besuch in Berlin
  auch den Bundespräsidenten. Schließt sich die Bundesregierung einem solchen Vorschlag
  an? Herr Kollege, ich kann vielleicht den Disclaimer, wenn man so will, vorwegnehmen:
  Wie das bei Gesprächen, die in der Zukunft liegen, immer so ist, kann und will ich
  ihnen von dieser Stelle aus nicht vorgreifen. Vielleicht mögen Sie etwas dazu sagen,
  ob der Vorschlag einer solchen regionalen Friedenskonferenz für den Nahen und Mittleren
  Osten seitens des Außenministeriums aufgegriffen und unterstützt wird. Ich denke,
  ich würde mich dem anschließen, was der Stellvertretende Regierungssprecher gerade
  gesagt hat. Wenn das Themen und, ich sage mal, ein Impetus sind, den es zu diskutieren
  gilt, dann würde das in den Gesprächen entsprechend thematisiert und diskutiert
  werden. Natürlich stehen wir im fortlaufenden Austausch mit unseren europäischen
  Partnern auch zu allen Fragen, die den Nahen und Mittleren Osten betreffen. Sie
  wissen auch, der Außenminister hatte vor drei Wochen, am 23. Oktober., in Istanbul
  ein Gespräch mit seinen Kollegen aus Frankreich, Großbritannien und Italien und
  den sogenannten R4-Staaten, bestehend aus Ägypten, der Türkei, Saudi-Arabien, und
  Pakistan, um über Themen, die sowohl die europäische Sicherheit als auch die Sicherheit
  im Nahen und Mittleren Osten betreffen, zu sprechen. Dazu haben wir hier, glaube
  ich, im Nachgang ausführlich informiert und Stellung genommen, und darauf würde
  ich Sie gern verweisen. Herr Hille, wird bei dem Treffen des Kanzlers mit Herrn
  Stubb auch darüber gesprochen, wer Europa in Gesprächen mit Russland beim Thema
  der Ukraine repräsentiert? Hintergrund ist, dass Herr Stubb gerade mit Herrn Putin
  telefoniert hat und dass gerade eine breite Debatte darüber ausgebrochen ist, wer
  bei möglichen Friedensgesprächen für Europa sprechen soll. Herr Kollege, die Antwort
  würde ich zweiteilen. Der erste Teil ist das, was ich gerade auf die Frage des Kollegen
  schon gesagt habe, dass es mit Gesprächen in der Zukunft immer so eine Sache ist
  und ich ihnen nicht vorgreifen kann. Das ist der eine Teil. Zu dem anderen Teil,
  sozusagen der inhaltlichen Frage, hat sich der Bundeskanzler gestern auch geäußert
  und gesagt ‑ darauf würde ich verweisen ‑, dass es jetzt nicht um Personen geht,
  sondern darum, dass Russland anerkennen muss, an den Verhandlungstisch zu kommen.
  Das ist die Haltung, die nicht nur gestern galt, sondern die auch weiterhin gilt.
  Gibt es also keine Kritik daran, dass Herr Stubb mit Herrn Putin telefoniert hat?
  Herr Kollege, ich denke, dazu haben wir uns an dieser Stelle schon mehrfach geäußert.
  Sowohl vor als auch nach dem Telefonat gab es eine enge Information der europäischen
  Partner durch Finnland und Norwegen. Präsident Stubb und Ministerpräsident Støre
  haben in diesem Telefonat ausdrücklich für ihre beiden Länder gesprochen. Die Initiative
  von Finnland und Norwegen ist komplementär zur Arbeit der USA und der Europäer zu
  sehen. So habe ich mich an dieser Stelle, glaube ich, unmittelbar nach diesem Telefonat
  geäußert. In der Sache haben sie auf der mit den Europäern verabredeten Linie argumentiert,
  die lautet: Es braucht einen Waffenstillstand und starke Sicherheitsgarantien für
  die Ukraine. Ich habe eine Frage an das Forschungsministerium . Sie haben in Sachen
  Südafrika eine Delegation angesprochen. Was können wir uns darunter vorstellen?
  Wer kommt mit? Das sind Vertreterinnen und Vertreter der Helmholtz-Gemeinschaft,
  des Alfred-Wegener-Instituts und der ESA. Das heißt, nur Wissenschaftsorganisationen
  und eine Raumfahrtbehörde, keine Wirtschaftsdelegation? Herr Hille, nehmen Sie uns
  einmal mit: Wenn der finnische Präsident kommt, gibt es eine Pressekonferenz, wenn
  der katarische Emir kommt, einmal wieder nicht. Wieso? Herr Kollege, ich habe diese
  Frage quasi schon erwartet. Der Emir von Katar ist im Rahmen eines Staatsbesuchs
  hier. Wie das bei Staatsbesuchen immer so ist, finden sie hauptsächlich beim Bundespräsidenten
  statt. Entsprechende Presseelemente, sofern sie stattfinden, finden auch dort statt.
  Details müssten Sie dann bitte dort erfragen. Im Rahmen des Staatsbesuchs treffen
  die Staatsgäste ja auch immer wieder den Bundeskanzler zu Gesprächen. Aber den Rahmen
  bildet der Staatsbesuch beim und des Bundespräsidenten. Ich erinnere mich an andere
  Staatsbesuche, bei denen auch mit dem Kanzler im Kanzleramt gesprochen wurde und
  es danach Pressebegegnungen gab. Es ist ja auffällig, dass Herr Merz, wenn Autokraten
  kommen, offenbar auf eine Pressekonferenz verzichtet. Ist der Eindruck falsch? Herr
  Kollege, ich habe nicht die gleiche Erinnerung wie Sie. Ich kann mich nur daran
  erinnern, dass ich bei diversen Staatsbesuchen genau diese Argumentation von dieser
  Stelle gebracht habe. Das ist auch in diesem Fall der Fall. Ich würde gerne das
  Verteidigungsministerium fragen, ob es weitere Details zu dem Angriff auf Quantum
  geben könnte. Die Drohnen der Bundeswehr sind ja anscheinend davon abhängig. Wir
  haben natürlich die Berichterstattung hierzu zur Kenntnis genommen. Ich darf Sie
  aber bitten, Ihre Fragen diesbezüglich an das Unternehmen zu richten. Ich kann das
  von dieser Stelle nicht weiter kommentieren. Ich gehe aber davon aus, dass die Drohnen
  der Bundeswehr davon irgendwie betroffen waren. Zumindest wurde berichtet, dass
  die Drohnen am Wochenende nicht geflogen werden. Können Sie dazu nichts Weiteres
  sagen? Nein. Ich kann die Berichterstattung von dieser Stelle ausdrücklich weder
  bestätigen noch dementieren und vielleicht ganz allgemein für Ihre Einordnung ergänzen,
  dass wir es ja grundsätzlich immer so halten, dass wir mit Informationen zu unserer
  Einsatzbereitschaft sehr zurückhaltend sind. Das ist einfach im Hinblick auf die
  militärische und operative Sicherheit geboten. Noch einmal: Ja, das ist der Grund,
  aber das ist weder eine Bestätigung noch ein Dementi der Berichterstattung, auf
  die Sie sich beziehen. Frau Jenning, habe ich richtig verstanden, dass die Bundeswehr
  bzw. Ihr Haus so etwas aus der Berichterstattung erfährt? Nein, das habe ich ausdrücklich
  nicht gesagt, sondern ich habe gesagt, dass wir die Berichterstattung, auf die der
  Kollege Bezug genommen hat, zur Kenntnis genommen haben. Ich habe keine Aussagen
  darüber getroffen, von wo oder wann wir von diesem Vorfall Kenntnis erlangt haben,
  und ich werde hier auch nichts bezüglich Details ausführen. Sie müssen uns ja keine
  Details ausführen. Aber Sie können schon sagen, wie Sie davon erfahren haben. Ich
  habe gerade auch schon erklärt, dass es hier um Details hinsichtlich unserer Einsatzbereitschaft
  geht. Insofern habe ich meinen Ausführungen von eben nichts hinzuzufügen. Herr Kollege,
  es bleibt dabei, dass ich dem, was ich eben gesagt habe, nichts hinzuzufügen habe.
  Auch wenn Sie den Medienbericht nicht kommentieren: Gibt es irgendwelche Konsequenzen
  oder verändertes Verhalten mit Blick auf das Drohnenregiment? Vielleicht kann ich
  noch einmal ganz allgemein einordnen, ausdrücklich nicht mit Bezug zu diesem Einzelfall,
  zu dem ich mich nicht äußern werde, egal wie oft wir die Fragen noch verändern:
  Ganz allgemein ist natürlich klar, dass Sicherheit für uns immer oberste Priorität
  hat. Insofern können Sie sich sicher sein, dass diese nicht nur überprüft wird,
  wenn zum Beispiel ein System eingeführt wird, sondern das behalten wir natürlich
  fortlaufend im Blick, und das wird auch fortlaufend geprüft. Es gilt in allen Bereichen,
  dass wir, wenn Hinweise von uns wahrgenommen werden, dass es irgendwie Probleme
  geben könnte, dem natürlich nachgehen. Das gilt für alle unsere Systeme. Es gab
  heute einen neuen Hinweis des BSI, dass Kühlanlagen eines bestimmten Typs betroffen
  sein könnten. Ich will da gar nicht ins Detail gehen. Zuständig für solche Fälle
  ‑ das haben wir gelernt ‑ ist ja das BSI und damit wiederum das BMI. Für die Cybersicherheit
  der Verwaltung ‑ ganz grob gesprochen ‑ ist ja das BMDS zuständig. Es gibt Kritiker,
  die sagen, diese Verantwortungsdiffusion sei Teil des Problems und eine Schwachstelle
  in der Cybersicherheitsarchitektur des Landes. Was sagen Sie zu den Forderungen,
  das alles in der Zuständigkeit des BMDS zusammenzulegen? Wir können diese Kritik
  nicht nachvollziehen. Wir arbeiten mit dem Bundesinnenministerium sehr gut zusammen.
  Die geteilte Aufsicht über das Bundesamt für Sicherheit in der Informationstechnik
  funktioniert gut. Wir sind für die Cybersicherheit in der Bundesverwaltung zuständig,
  wie Sie eben schon sagten. Für alle anderen Themen liegt die Aufsicht beim BMI.
  Wir arbeiten da sehr gut in der Bundesregierung zusammen. Gerade wenn es um neue
  Bedrohungslagen durch künstliche Intelligenz oder um den Aufbau des KI-Sicherheitsinstituts
  geht, ziehen wir an einem Strang. Was spricht denn dagegen, das zusammenzulegen,
  also bei Ihnen im Ministerium zu bündeln? Die Sicherheitsbehörden liegen beim BMI.
  Zum Beispiel geht es dabei auch viel um Fragen der Strafverfolgung und Täteridentifizierung.
  Ich würde gerne Herrn Bowinkelmann fragen, wie ernst Sie das nehmen. Das BSI hat
  ja verschiedene Klassifizierungen. Das war eine sehr hohe Warnstufe, die es ausgesprochen
  hat. Was sind jetzt die Konsequenzen daraus? Denn in dieser Warnung wird ja auch
  gesagt, wenn ich es richtig verstanden habe, dass es kein Sicherheitsupdate für
  dieses spezielle Kühlsystem gibt, mit dem man sich wirklich schützen könnte. Wie
  groß ist die Bedrohung zum Beispiel für Supermärkte und andere Einrichtungen? Zunächst
  einmal ist die Warnung ganz neu. Teil dieser Warnung ist die klare Empfehlung, dass
  die betroffenen Geräte von den entsprechenden Controllern möglichst vom Internet
  getrennt werden sollen oder die Fernwartung maximal über VPN-Vorschaltung erfolgen
  soll. Das BSI informiert aktiv weiter hinsichtlich dieses Sachverhalts und entsprechend
  auch über weitere notwendige Maßnahmen oder entsprechende Patches, die gegebenenfalls
  möglich sind und deren nachträgliche Installation empfohlen wird. Können Sie etwas
  zum Umfang sagen? Das ist jetzt eine Warnung. Hat es gestern oder vorgestern entweder
  in Supermärkten oder anderen Einrichtungen, die diese Kühlsysteme verwenden, neue
  Fälle gegeben? Genau, das ist eine proaktive Warnung. Bisher sind uns und den Sicherheitsbehörden
  keine Fälle bekannt, bei denen diese offene Schnittstelle kompromittiert worden
  sein oder ein Hack erfolgt sein könnte. Inwiefern ist die Bundesregierung von dem
  Microsoft-Ausfall betroffen? Es handelt sich um eine weltweite Störung von Microsoft-365-Diensten.
  Das Bundesamt für Sicherheit in der Informationstechnik steht dazu auch mit Microsoft
  im Austausch und geht von einer sehr großen Betroffenheit in der deutschen Wirtschaft
  aus. Es gibt nach derzeitigem Kenntnisstand keine Hinweise auf einen Cyberangriff.
  Microsoft kommt nach eigenen Darstellungen bei der Behebung der umfassenden Störung
  Stück für Stück voran. Aus der Bundesverwaltung liegen uns keine Meldungen über
  größere Ausfälle vor. Der Bundesclient als Standard-IT-Arbeitsplatz in der Bundesverwaltung
  läuft stabil. Der Bundesclient nutzt Microsoft nicht in der Cloud, sondern wird
  On-Premise betrieben, das heißt auf eigener Infrastruktur, auf eigener Hardware.
  Deswegen sind wir ‑ zumindest der Bundesclient ‑ von diesem Ausfall nicht betroffen.
  Noch nicht alle Behörden nutzen ihn, aber er soll bis 2032 der Standardarbeitsplatz
  in der gesamten Bundesverwaltung werden. Darüber hinaus nutzt die Bundesverwaltung
