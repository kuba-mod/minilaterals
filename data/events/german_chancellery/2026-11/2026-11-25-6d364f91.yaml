title: „Orange Day“ – Internationaler Tag zur Beseitigung von Gewalt gegen Frauen
  Maßnahmen gegen Gewalt
text: 'Frauen, die Hilfe oder Beratung suchen, können sich beispielsweise telefonisch
  oder online an das Hilfetelefon „Gewalt gegen Frauen“ (116 016) wenden. Besonders
  häufig werden Frauen und Mädchen Opfer von Häuslicher Gewalt oder von Sexualstraftaten.
  Auch im digitalen Raum sind über die Hälfte der Opfer weiblich. Rund um den „ Orange
  Day “, den Internationalen Tag zur Beseitigung von Gewalt gegen Frauen am 25. November,
  wird weltweit auf geschlechtsspezifische Gewalt gegen Frauen aufmerksam gemacht.
  Für die Bundesregierung hat die Bekämpfung jeglicher Form von Gewalt gegen Frauen
  ressortübergreifend oberste Priorität. Gewalt gegen Frauen und Mädchen nimmt weiter
  zu: Mehr als 142.800 Frauen und Mädchen wurden im vergangenen Jahr Opfer von Partnerschaftsgewalt.
  54.675 Frauen und Mädchen wurden Opfer eines Sexualdelikts. Mit 31.221 Opfern ist
  die Zahl der Frauen und Mädchen, die von digitaler Gewalt betroffen sind, um 16%
  gestiegen. Weitere Zahlen in den Lagebildern „Häusliche Gewalt“ und „Geschlechtsspezifisch
  gegen Frauen gerichtet Straftaten“ Es gibt viele Erscheinungsformen von Gewalt gegen
  Frauen: körperliche Gewalt, sexualisierte Gewalt und sexuelle Belästigung, psychische
  Gewalt und strukturelle Gewalt, die persönliche Freiheiten und Lebenschancen einschränkt.
  Hier finden Sie eine Übersicht mit Hintergründen zu verschiedenen Formen der Gewalt.
  Das Hilfetelefon „Gewalt gegen Frauen“ ist ein bundesweites Beratungsangebot für
  Frauen, die Gewalt erlebt haben oder noch erleben. Unter der Nummer 116 016 und
  via Online -Beratung werden Betroffene aller Nationalitäten, mit und ohne Behinderung
  – 365 Tage im Jahr, rund um die Uhr unterstützt. Auch Angehörige, Freundinnen und
  Freunde sowie Fachkräfte werden anonym und kostenfrei beraten. Zudem finden v on
  Gewalt betroffene Frauen auf der Webseite des Vereins Frauenhauskoordinierung e.V.
  Kontakte zu Frauenhäusern. Der Verein wird vom Bundesfamilienministerium gefördert
  und unterstützt deutschlandweit Frauenhäuser und Fachberatungsstellen fachlich und
  bei ihrer politischen Arbeit. Unter der Nummer 116 016 und via Online-Beratung unterstützt
  das Hilfetelefon „Gewalt gegen Frauen“ Betroffene rund um die Uhr. Jede Frau hat
  das Recht auf ein Leben ohne Gewalt und frei von Bedrohung. Das gilt im öffentlichen
  Raum, in den eigenen vier Wänden und auch im digitalen Raum. Die Bundesregierung
  arbeitet deshalb entschlossen daran, Gewalt zu bekämpfen, Strukturen zu verbessern
  und Betroffenen die Unterstützung zu geben, die sie brauchen. Die Bundesregierung
  hat einen neuen Gewaltschutz auf den Weg gebracht. Dieser verankert erstmals die
  elektronische Fußfessel bundeseinheitlich und stärkt den Schutz vor häuslicher Gewalt.
  Die Familiengerichte können Gewalttäter künftig in Hochrisikofällen zum Tragen einer
  elektronischen Fußfessel verpflichten. Das folgt aus dem Gesetz, das auf Vorschlag
  der Bundesregierung vom Bundestag beschlossen und bereits verkündet wurde. Durch
  die Einführung der elektronischen Fußfessel wird sichergestellt, dass unerlaubte
  Annäherungen früh erkannt und Schutzmaßnahmen rechtzeitig ergriffen werden können,
  ohne dass Betroffene Verstöße selbst melden müssen. Die Neuregelung trägt damit
  erheblich zur wirksamen Durchsetzung von Abstands- und Kontaktverboten bei. Darüber
  hinaus können die Familiengerichte künftig soziale Trainingskurse wie Anti-Gewalt-Trainings
  anordnen. Diese können dabei helfen, die Gewaltbereitschaft und das Rückfallrisiko
  von Tätern zu senken. Die Regelungen greifen ab dem 1. Juli 2027. Betroffene von
  schweren Straftaten sollen vor Gericht leichter professionelle Unterstützung durch
  psychosoziale Begleitung erhalten. Der Bundestag hat dafür am 15. Oktober 2026 einen
  Gesetzentwurf der Bundesregierung beschlossen. Für Kinder und Jugendliche soll eine
  Begleitung in Zukunft ohne Antragstellung eingerichtet werden, um bestehende Hürden
  zu beseitigen. Zudem sollen Opfer gravierender häuslicher Gewalt aufgrund ihrer
  besonderen Schutzbedürftigkeit erstmals einen Anspruch auf Beiordnung einer Nebenklagevertretung
  oder psychosozialen Prozessbegleitung erhalten. Inzwischen hat auch der Bundesrat
  das Gesetz zur Stärkung der Rechte von Verletzten gebilligt. Wer sogenannte K.-o.
  -Tropfen zur Begehung einer Vergewaltigung oder eines Raubes einsetzt, muss zukünftig
  mit mindestens fünf Jahren Freiheitsstrafe rechnen. Der entsprechende Gesetzentwurf
   zur Strafverschärfung beim Einsatz von K.o.-Tropfen wurde von der Bundesregierung
  beschlossen. Hass, Deepfakes und Beleidigungen im Netz treffen vor allem Frauen.
  Das Bundesministerium für Justiz und Verbraucherschutz hat ein digitales Gewaltschutzgesetz
  vorgelegt. Ziel ist es, es den Betroffenen künftig leichter zu machen, gegen Verletzungen
  ihrer Persönlichkeitsrechte im Netz vorzugehen und etwa Accounts per richterlicher
  Anordnung sperren zu lassen, wenn diese massiv ihre Rechte verletzen. Zudem sollen
  Strafbarkeitslücken bei pornografischen Deepfakes und anderen Formen bildbasierter
  sexualisierter Gewalt geschlossen werden. Ziel ist zudem, das Herstellen und Verbreiten
  pornografischer Deepfakes künftig unter Strafe zu stellen. Das im Februar 2025 verabschiedete
  Gewalthilfegesetz (GewHG) etabliert ab 2032 einen Rechtsanspruch auf kostenlosen
  Schutz und Beratung für von Gewalt betroffene Frauen und deren Kinder in Deutschland.
  Es verpflichtet Länder und Kommunen zu einem bedarfsgerechten Ausbau von Frauenhäusern
  und Beratungsstellen, um bundesweit einheitliche Hilfe unabhängig vom Wohnort zu
  sichern. Der Bund unterstützt die Länder zwischen 2027 und 2036 mit 2,6 Milliarden
  Euro, um den Ausbau zu finanzieren.'
