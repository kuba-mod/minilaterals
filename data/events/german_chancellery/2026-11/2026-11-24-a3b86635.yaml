title: '1,5 Millionen Euro für den Sound von morgen – APPLAUS-Award 2026: Staatsminister
  Weimer stellt Deutsche Clubszene ins Rampenlicht'
text: 'Kulturstaatminister Wolfram Weimer hat heute in Potsdam die APPLAUS-Awards
  2026 an Musikclubs und Veranstaltungsreihen verliehen. Die Auszeichnung würdigt
  kleine und mittlere Livemusikspielstätten sowie Veranstaltungsreihen in den Bereichen
  Popularmusik und Jazz für ihr herausragende Arbeit in der unabhängigen Livemusikkultur.
  Insgesamt wurden 80 Preisträgerinnen und Preisträger aus allen Bundesländern mit
  Preisgeldern in Höhe von insgesamt 1,5 Millionen Euro ausgezeichnet. Staatsminister
  Weimer: „Livemusik-Spielstätten sind wichtige Treffpunkte unserer Gesellschaft und
  zugleich Kulturförderer, Talentscouts und regionale Wirtschaftsunternehmen. Vor
  allem aber sind Sie essentiell für die musikalische Vielfalt in unserem Land: Sie
  schaffen die Bühne für Neues, für Nischiges, für Ideen, die vielleicht morgen schon
  die große Konzerthalle füllen. Sie bieten Raum für künstlerische Experimente und
  bringen unterschiedliche Menschen für ein einzigartiges Erlebnis zusammen. Umso
  mehr freue ich mich, dass heute mit den APPLAUS-Awards diese besonderen Orte gewürdigt
  werden.“ Der Beauftragte der Bundesregierung für Kultur und Medien fördert den APPLAUS-Award
  über die Initiative Musik, die zentrale Fördereinrichtung der Bundesregierung für
  die deutsche Musikwirtschaft. Die vollständige Liste der Preisträgerinnen und Preisträger
  sowie weitere Informationen sind auf der Webseite von APPLAUS-Award verfügbar.'
