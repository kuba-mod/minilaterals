date: '2026-11-02'
type: press_release
source_name: german_chancellery
title: Pressekonferenz von Bundeskanzler Merz und Bundesminister Wildberger beim Digital-Gipfel
  2026 Künstliche Intelligenz – eine Jahrhundertchance für die Industrienation
text: 'Die Bundesregierung sei entschlossen, die Chancen, die sich durch KI bieten,
  zu nutzen, betonte Kanzler Merz. Unter dem Motto „ Shaping AI: safe, sovereign,
  competitive “ knüpfte der Digital-Gipfel 2026 neben dem Themenschwerpunkt Künstliche
  Intelligenz auch an den letztjährigen Gipfel zur europäischen digitalen Souveränität
  an. Bei der gemeinsamen Pressekonferenz mit Bundesdigitalminister Karsten Wildberger
  betonte Bundeskanzler Friedrich Merz, dass Europa die technologische Gestaltungsmacht
  nicht anderen überlassen dürfe. „Wir haben uns dazu bekannt, einen eigenen europäischen
  Weg zu gehen, einen Weg, der auf Offenheit, Vertrauen und unseren demokratischen
  Werten basiert“, erklärte Merz. Der Bundeskanzler verwies in diesem Zusammenhang
  auch auf die European Future AI Initiative: Mit ihr „bündeln wir nun die Kräfte
  von Deutschland, Frankreich und vielen weiteren Partnern wie Finnland, Italien und
  Polen“. G emeinsam mit privaten Investoren wolle man souveräne europäische „frontier“-Modelle
  entwickeln. „Wir sichern uns damit die technologische Basis unserer eigenen Freiheit“,
  unterstrich Merz. Investitionsgipfel: Die 230 Milliarden Euro an Investitionszusagen
  beim Investitionsgipfel in Berlin seien ein wichtiges Signal, so Merz: Deutschland
  wolle nicht nur Nutzer von KI sein, sondern Vorreiter bei der industriellen KI und
  der Physical AI. Ressortübergreifende KI -Taskforce: Unter der Federführung des
  Digitalministeriums habe eine KI -Taskforce die übergreifende Vision von Deutschlands
  Weg zur KI -Nation bis 2030 erarbeitet. Der heute veröffentlichte Ergebnisbericht
  setze dafür messbare Ziele und bündele 18 ressortübergreifende Schlüsselmaßnahmen,
  so der Kanzler. KI -Sicherheitsinstitut AISI Deutschland: „Sicherheit und Vertrauen
  sind für uns ein ganz erheblicher Standortvorteil“, betonte der Bundeskanzler. Deshalb
  habe man das KI -Sicherheitsinstitut AISI Deutschland geschaffen. „ Wir bauen eine
  Infrastruktur auf, die KI -Systeme vertrauenswürdig macht. Dabei wollen wir mit
  unseren Ressourcen effizient umgehen.“ Souveräne digitale Verwaltung: „Wir setzen
  auf eine souveräne digitale Verwaltung, und wir engagieren uns auf der europäischen
  Ebene im Rahmen des sogenannten Digital-Omnibus für die Entlastung unserer kleinen
  und mittelständischen Unternehmen“, sagte der Kanzler. Bürokratie dürfe kein Hemmnis
  sein, so Merz. Meine Damen und Herren, herzlich willkommen zum diesjährigen Digital-Gipfel!
  Wir treffen uns in einer Zeit, in der sich die digitale Welt rasant entwickelt.
  Die Geschwindigkeit, mit der künstliche Intelligenz in unsere Wirtschaft, unsere
  Verwaltung und unser gesellschaftliches Miteinander eindringt, ist geradezu beispiellos.
  Wir haben vergangenes Jahr auf unserem Digital-Gipfel eine wichtige Richtungsentscheidung
  getroffen. Wir haben uns dazu entschlossen und setzen es auch durch: Europa darf
  die technologische Gestaltungsmacht nicht anderen überlassen. Wir haben uns dazu
  bekannt, einen eigenen europäischen Weg zu gehen, einen Weg, der auf Offenheit,
  Vertrauen und unseren demokratischen Werten basiert. Wir wollen souverän handeln.
  Heute, ein Jahr später, können wir sagen: Wir sind auf diesem Weg nicht nur angetreten,
  sondern wir haben das Tempo deutlich beschleunigt. Wir begleiten den Wandel nicht
  mehr nur, sondern wir gestalten ihn. – Das ist ein zentraler Pfeiler dieser Strategie,
  einer Strategie, für die wir uns mit internationalen Partnern vernetzen. Wir wollen,
  dass Europa an der Spitze dieser Technologien mitspielt. Ich habe es in meiner Rede
  eben erwähnt: Mit der European Future of AI Initiative bündeln wir nun die Kräfte
  von Deutschland, Frankreich und vielen weiteren Partnern wie Finnland, Italien und
  Polen, die auf unsere Einladung hin hier heute auch dabei sind. Wir wollen gemeinsam
  mit privaten Investoren souveräne europäische „ frontier “-Modelle entwickeln. Wir
  sichern uns damit die technologische Basis unserer eigenen Freiheit. Ich habe auf
  meiner Reise in der vergangenen Woche nach Singapur, Japan und Korea auch die Weichen
  für weitere Kooperationen gestellt, gerade bei KI -„ frontier “ und KI -Security.
  Diese Partnerschaften mit, wie wir es nennen, „like-minded “ Staaten, sind essenziell,
  um einseitige Abhängigkeiten zu reduzieren und am besten gar nicht erst entstehen
  zu lassen. Auch die sehr beeindruckenden über 200 Milliarden Euro an Investitionszusagen,
  die wir bei unserem Investitionsgipfel vor gut einer Woche hier in Berlin bekommen
  haben, sind für mich ein wichtiges Signal. Deutschland will nicht nur Nutzer von
  KI sein, sondern Vorreiter, insbesondere bei der industriellen KI , die wir dringend
  brauchen, auch für unseren Mittelstand. Wir haben vor dem Sommer auf meine Bitte
  hin in der Bundesregierung eine ressortübergreifende KI -Taskforce eingesetzt. Unter
  der Federführung von Bundesminister Karsten Wildberger hat diese Taskforce nun ressortübergreifende
  Vorschläge für Deutschlands Weg zur KI -Nation 2030 unterbreitet. Der Ergebnisbericht,
  der heute veröffentlicht wird, setzt dafür messbare Ziele und bündelt insgesamt
  18 ressortübergreifende Schlüsselmaßnahmen Ich will Karsten Wildberger bei dieser
  Gelegenheit noch einmal sehr herzlichen Dank dafür sagen, dass er diese Arbeit in
  seinem Haus so zügig und so zielgerichtet durchgeführt hat. Herzlichen Dank dafür!
  Sie haben es in meiner Rede eben gehört, aber ich will es hier wiederholen: Sicherheit
  und Vertrauen sind für uns ein ganz erheblicher Standortvorteil. Deshalb haben wir
  mit dem ganzen Thema auch den Aspekt der Sicherheit verbunden. Wir haben ein KI
  -Sicherheitsinstitut geschaffen. Wir bauen eine Infrastruktur auf, die KI -Systeme
  vertrauenswürdig macht. Wir wollen mit unseren Ressourcen effizient umgehen. Wir
  wissen gleichzeitig, dass Vertrauen in die Technik und die Sorge um die Ressourcen
  sehr viele Menschen in unserem Lande umtreiben. Wir arbeiten an diesen Strategien.
  Wir arbeiten parallel dazu auch an einer Nationalen Rechenzentrumsstrategie, um
  unsere Rechenkapazitäten bis zum Jahr 2030 zu vervierfachen. Das ist eine enorme
  Kraftanstrengung, die wir leisten, die wir aber auch leisten müssen; denn Rechenleistung
  ist die Währung für KI . Wir setzen auf eine souveräne digitale Verwaltung, und
  wir engagieren uns auf der europäischen Ebene im Rahmen des sogenannten Digital-Omnibus
  für die Entlastung unserer kleinen und mittelständischen Unternehmen. Wir wollen
  einen Rechtsrahmen auch in Europa, der Innovation ermöglicht. Bürokratie darf dabei
  kein Hemmnis sein. Meine Damen und Herren, die zentrale Frage ist für uns nicht
  mehr nur, was wir kaufen und produzieren, sondern, wer den tiefgreifenden technologischen
  und geopolitischen Wandel, in dem wir uns befinden, gestaltet und wer die Chancen
  nutzt. Ich persönlich bin sehr davon überzeugt, dass Deutschland und Europa, wenn
  wir unsere technologische Exzellenz und unsere Innovationskraft mit unseren demokratischen
  Werten verbinden, diese Rolle übernehmen werden. Ich freue mich darauf, diesen Weg
  gemeinsam mit den Unternehmen und vor allen Dingen auch mit unseren internationalen
  Partnern zu gehen. Diese Bemerkung will ich zum Schluss noch machen: Ich habe gerade
  die Gelegenheit gehabt, mit Karsten Wildberger an einem Round Table teilzunehmen,
  an dem unsere Gäste aus vielen Ländern der Welt und auch Unternehmen vertreten waren,
  die uns sozusagen den Spiegel vorgehalten haben: Was ist in Deutschland möglich,
  und was müssen wir noch leisten? – Ich habe es in meinen Schlussbemerkungen dort
  gesagt und will es hier gern wiederholen: Ich gehe noch zuversichtlicher aus diesem
  Gipfel heraus, als ich hineingekommen bin. Ich war ohnehin sehr optimistisch, dass
  wir auf dem richtigen Weg sind, aber wir bekommen es auch von unseren internationalen
  Partnern und von vielen Unternehmen bestätigt: Deutschland ist auf dem richtigen
  Weg. Europa ist auf dem richtigen Weg. Wir haben alle Chancen, ein großer Profiteur
  dieser neuen Technologie zu sein. Wir wollen das nutzen. Wir wollen unsere Bevölkerung
  dabei mitnehmen. Aber wir sehen eben auch die großen Chancen, die sich für uns als
  Industrienation ergeben. Denn wir haben etwas, was die meisten Länder auf der Welt
  nicht haben, jedenfalls nicht in dieser Form. Das ist eine tief gestaffelte, breit
  aufgestellte industrielle Basis in unserem Land, vor allem geprägt durch große internationale
  Unternehmen, große mittelständische Unternehmen bis in den kleinteiligen Mittelstand
  hinein, die mit dieser neuen Technologie Chancen haben, wie sie sich wahrscheinlich
  nur einmal in Jahrzehnten, vielleicht nur einmal in einem Jahrhundert so ergeben,
  wie wir sie gegenwärtig sehen. Wir sind entschlossen, diese Chance zu nutzen. Sehr
  geehrter Herr Bundeskanzler, sehr geehrte Damen und Herren, erst einmal herzlich
  willkommen hier beim Digitalgipfel! Sie hören es den ganzen Tag: KI verändert unsere
  Wirtschaft schneller, als viele erwarten. Die Technologie geht immer schneller voran.
  Im vergangenen Jahr, in der Zeit seit dem vorigen Gipfel bis heute, ist in Deutschland
  unglaublich viel in Bewegung gekommen. Dinge nehmen Gestalt an. Gleichzeitig sage
  ich, auch bei der Geschwindigkeit: Wir müssen schneller werden. Sicherlich ist es
  so, dass KI mit vielen Risiken kommt. Wir nehmen sie sehr ernst. Deshalb unternehmen
  wir auch ganz konkrete Dinge wie das Sicherheitsinstitut. Wir investieren in Sicherheitsforschung.
  Aber das größte Risiko, das wir haben, ist, an der KI technologisch und wirtschaftlich.
  nicht ausreichend teilzunehmen. Das ist das größte Risiko. Deshalb komme ich zu
  der Seite der Möglichkeiten durch KI . Sie kann Forschung beschleunigen. Sie kann
  Unternehmen produktiver machen. Sie kann den Produktentwicklungsprozess verbessern.
  Sie kann den Staat leistungsfähiger machen. Wir brauchen das Wachstum, das KI produzieren
  kann – Wachstumsraten, die wir lange schon nicht mehr kennen, sind mit KI möglich –,
  um damit auch unseren Wohlstand zu sichern, auch Arbeitsplätze zu sichern, unseren
  Sozialstaat zu finanzieren und Menschen auch neue Chancen zu eröffnen. Es geht auch
  um das Vertrauen, dass unsere Demokratie eine bessere Zukunft möglich macht. Das
  geht nicht, ohne dass wir an dieser Technologie führend teilhaben. Wir haben alle
  Möglichkeiten dazu. Um das konkret zu machen, haben wir in der Taskforce zum allerersten
  Mal als Bundesregierung, und zwar über alle Ressorts geeint, KI -Ziele für 2030
  definiert. Das ist ein ganz wichtiger Schritt. Wir als Regierung übernehmen gemeinsam
  Verantwortung dafür, uns zu beschleunigen und uns messbar zu machen: Bis 2030 sollen
  mindestens 55 Prozent der kleinen und mittleren Unternehmen KI einsetzen. Wir werden
  über die Zeit auch bewerten, wie tief das geht. Mindestens 90 Prozent der Bundesbehörden
  sollen wenigstens eine KI -Anwendung produktiv nutzen. Das setzen wir um. Die Rechenzentrumskapazität
  – Herr Bundeskanzler, Sie haben es gesagt – wird sich vervierfachen. Mindestens
  eine europäische KI -Gigafabrik soll auch in Deutschland ihren Betrieb aufnehmen.
  Wir haben in Summe 18 Maßnahmen auf sechs Feldern vereinbart. Daraus entsteht ein
  Arbeitsprogramm. Jetzt werden manche, die das lesen, sagen: Was heißt denn das? –
  Ganz einfach: Wir haben ein klares, definierbares Arbeitsprogramm. So, wie auch
  unser Ministerium arbeitet, indem wir uns transparent machen, gehen wir in der Regierung
  jetzt an die Arbeit und kommen regelmäßig zusammen, um den Fortschritt voranzubringen.
  Wir werden über diese Fortschritte regelmäßig berichten, und wir wollen uns an den
  Ergebnissen messen lassen, auch ich persönlich. Entscheidend ist, was tatsächlich
  entsteht: Rechenzentren, die in Betrieb gehen, Unternehmen, die mit KI wettbewerbsfähiger
  werden, neue Unternehmen, die entstehen und wachsen, und auch eine Verwaltung, die
  Anträge schneller bearbeitet und auch diese Technologie nutzt. Wir in Deutschland
  haben alle Möglichkeiten, hierbei wirklich nach vorn zu kommen und auch vorn mitzuspielen.
  Wir haben die Ingenieurskunst. Wir haben unsere Industrie und unseren Mittelstand
  mit all der Industrieexpertise in den verschiedenen Sektoren. Wir haben unglaubliche
  Datenschätze, die man braucht, um auch industrielle KI entsprechend zu trainieren.
  Unser Anspruch ist deshalb auch die Fabrik, die denkt, die man schneller produzieren
  kann, die man schneller und flexibler umbauen kann. Dafür brauchen Unternehmen Rechenleistung,
  nutzbare Daten und Regeln, die Innovation besser ermöglichen. Sicherheit ist selbstverständlich
  auch ein entscheidender Faktor und ein Fokusthema. Wir müssen Missbrauch verhindern
  und KI unter menschlicher Kontrolle halten. Deshalb gründen und bauen wir gerade
  das KI -Sicherheitsinstitut in Deutschland aus und investieren auch in Sicherheitsforschung,
  aus der dann Produkte und Modelle entstehen, die sicherer funktionieren als heutige
  Modelle. Aber auch der technologische Rückstand ist, wie gesagt, ein Risiko, und
  ihn halte ich für massiv. Ich werbe noch einmal dafür, dieses Thema aufzuholen und
  es auch positiv zu begleiten. Das ist, denke ich, für unsere Zukunft, für die Zukunft
  aller Menschen in Deutschland ein wichtiger Faktor. Am Ende geht es um die Menschen.
  Gerade junge Menschen müssen auch sehen, dass sich Lernen und Anstrengungen lohnen,
  dass sie Arbeit finden, von der sie leben können und sich etwas aufbauen können.
  Ich habe es heute auch in meiner Rede gesagt. Es wird auch eine große Aufgabe sein,
  in dieser Zeit der neuen Technologie junge Menschen, die ja noch lernen müssen,
  zu befähigen, ihren Weg in dieser Technologie zu finden. Die Frage, wie wir junge
  Menschen auf diesem Weg mitnehmen, dass sie lernen, dass sie ihre Zukunft bauen
  können und auch die Möglichkeiten spüren, wird auch für uns in der Regierung ein
  wichtiges Thema sein. Das ist nämlich eine echte Chance, am Ende auch selbst zu
  gestalten. Wir als Bundesregierung haben uns gemeinsam auf diese Ziele verpflichtet,
  und jetzt übernehmen wir gemeinsam Verantwortung für die Ergebnisse. Wie machen
  wir das? – Indem wir arbeiten. Frage: Herr Bundeskanzler, der Minister hat jetzt
  schon mehrfach die Einschätzung geäußert, dass die KI neben allen Chancen, die sie
  bietet, auch zu Arbeitsplatzverlusten führen wird, insbesondere – das haben Sie
  jetzt nur zart angedeutet, Herr Wildberger – bei Einsteigerjobs, und dass man in
  dem Zusammenhang eine Art Grundeinkommens bräuchte, ganz vorsichtig formuliert.
  Wie stehen Sie dazu? Teilen Sie diese Einschätzung? Bundeskanzler Merz: Ich bin
  bei diesem Thema in den letzten Jahren immer etwas zurückhaltend gewesen, weil ich
  auch die vielen Nachteile sehe, die mit einem solchen Grundeinkommen verbunden sind.
  Ich bin mir allerdings darüber im Klaren – mir ging das heute Morgen auch bei der
  Vorbereitung meiner Rede hier noch einmal durch den Kopf –, dass das Thema der KI
  unsere Arbeitswelt so fundamental verändern wird, dass wir uns in den nächsten Jahren
  über viele dieser Aspekte Gedanken machen müssen. Im Augenblick ist unsere Produktivität
  nicht hoch genug. Aber wir werden sie durch KI natürlich deutlich anheben können.
  Die Frage ist dann: Was passiert mit bestimmten Jobs, die wir heute haben und die
  wir morgen möglicherweise ersetzen können, und was macht das dann mit den Menschen,
  was macht das mit der Bevölkerung? – Ich würde aus meiner Sicht heute sagen: Genauso
  wie es in der Vergangenheit immer falsch war, mit dem technologischen Wandel angstbesetzt
  umzugehen, ist es auch heute falsch, damit angstbesetzt umzugehen. Ich bin mit Karsten
  Wildberger in einer Frage besonders einig. Die größte Gefahr für uns wäre heute,
  in diesem Bereich nichts zu tun. Das ist für unsere Wirtschaft und letztendlich
  für den Wohlstand unseres Landes die größte Gefahr. Wenn wir uns dieser Technologie
  verweigern, dann ist der Abstieg vorprogrammiert. Wenn wir uns dieser Technologie
  öffnen, dann müssen wir natürlich auch mit allen Risiken umgehen. Deswegen haben
  wir das KI -Sicherheitsinstitut gegründet, und deswegen beschäftigen wir uns eben
  auch ressortübergreifend mit den Fragen, was das konkret für unseren Arbeitsmarkt
  bedeutet, was das konkret für die Menschen bedeutet, was das konkret für Jobs bedeutet.
  Wir haben ja eben den Roboter gesehen. Ich habe so etwas übrigens schon in der praktischen
  Anwendung gesehen. Ich habe in einem Alten- und Pflegeheim schon gesehen, wie Roboter
  dort zum Beispiel das Abendessen in den Zimmern bringen und wieder zurücknehmen.
  Was bedeutet das konkret für uns? Ich bin der festen Überzeugung, dass die Chancen
  überwiegen. Aber es gibt Risiken, und über sie müssen wir reden. Wir stehen aber
  gerade am Anfang dieses Prozesses. Bevor wir zu sehr und zu häufig über die Risiken
  sprechen, möchte ich zunächst einmal garantiert wissen, dass wir die Chancen nutzen.
  Dann werden sich die Risiken natürlich in einem anderen Licht darstellen, aber sie
  werden nicht verschwinden. Frage: Herr Bundeskanzler, am Ende geht es bei wirtschaftlicher
  Entwicklung immer um Geld. In den USA und in China werden gigantische Summen in
  die Entwicklung künstlicher Intelligenz investiert. Im Vergleich damit sind die
  öffentlichen Mittel hier lächerlich gering. Die Energiepreise hier in Deutschland
  sind hoch; das wissen wir alle. Was kann Ihre Regierung denn konkret tun, um mehr
  privates Kapital für die Entwicklung von KI nach Deutschland zu holen? Bundeskanzler
  Merz: Dazu kann Karsten Wildberger aus seiner Sicht gleich noch etwas sagen, weil
  er im Gegensatz zu mir natürlich jeden Tag mit diesen Themen beschäftigt ist. Aber
  ich kann es nur noch einmal mit Verweis auf den Investitionsgipfel sagen, den wir
  vor zwei Wochen hier in Berlin hatten. Es war vor genau zwei Wochen, Montag und
  Dienstag. Wir haben eine unglaublich große Bereitschaft von großen Investoren, in
  Deutschland in dieses Thema zu investieren. Unsere Aufgabe ist es vor allen Dingen,
  den regulatorischen Rahmen und die Infrastruktur dafür zu schaffen ‑ wir haben gerade
  auch über Netze gesprochen; wir haben natürlich über Energieversorgung gesprochen ‑
  und dafür zu sorgen, dass das Ganze hier in Deutschland und in Europa möglich wird.
  Deswegen ist es aus meiner Sicht und auch für die Bundesregierung am allerwichtigsten,
  die Rahmenbedingungen dafür zu schaffen, dass diese Investitionen aus dem privaten
  Sektor in Deutschland und in Europa stattfinden. Dabei sind wir, denke ich, auf
  einem sehr guten Weg. Ich habe es in der Schlussrunde hier gerade gesagt und will
  es hier wiederholen: Ich hätte vor zwei bis drei oder vier Jahren noch nicht gewagt,
  über das Thema digitaler Souveränität in Europa zu sprechen. Ich habe das nicht
  für möglich gehalten. Ich bin heute anderer Meinung, weil ich sehe, dass nicht zuletzt
  durch die geopolitischen Veränderungen und durch den Druck, dem wir ausgesetzt sind,
  heute die Bereitschaft der Europäer besteht, hier wirklich etwas zu tun, so wie
  Emmanuel Macron das in seiner berühmten Rede vor der Sorbonne schon im Frühjahr
  2017 angesprochen hat. Damals haben wir alle ihm nicht geglaubt. Er hat keine Antwort
  aus Deutschland bekommen. Wir alle haben nicht geglaubt, dass es geht. Ich glaube
  heute, dass es geht, und zwar nicht nur, dass es gehen kann, sondern dass es gehen
  muss. Wir müssen diese europäische Souveränität hinbekommen. Dafür schaffen wir
  im Augenblick alle Bedingungen. Ich habe mich in der Europäischen Union sehr dafür
  eingesetzt, dass wir die Doppelregulierung für die Industrie bei künstlicher Intelligenz
  aufgeben. Das war ein gewaltiger Kraftakt. Am Anfang waren die Mehrheitsverhältnisse
  komplett dagegen. Ich habe das über ein Wochenende gedreht und dafür gesorgt, dass
  der Vorschlag der Kommission die Zustimmung bekommen hat. Das sind die Schritte,
  die wir jetzt gemeinsam gehen. Das ist zum Teil mühevolle Kleinarbeit. Aber wir
  schaffen den Rahmen dafür, dass wir in Europa diese digitale Souveränität erreichen
  können. Noch eine zweite Bemerkung in dem Zusammenhang: Unterschätzen wir bitte
  nicht, wie abhängig andere auch von uns sind. Es ist nicht etwa so, als ob wir von
  Amerika, China und anderen nur abhängig wären. Umgekehrt ist das auch der Fall.
  Die Europäer sind mit 450 Millionen Verbrauchern einer der größten Binnenmärkte
  der Welt. Wir haben Industrie. Wir haben Software. Wir haben Chipindustrie. Wir
  haben Produktion in Europa, die für die ganze Welt gebraucht wird. Bitte unterschätzen
  wir unsere eigenen Möglichkeiten nicht, und unterschätzen wir bitte nicht, wie abhängig
  andere auch von uns sind. Das ist eine gute Ausgangsvoraussetzung dafür, dass wir
  das tatsächlich so erreichen, wie ich es gerade zu skizzieren versucht habe. Moderatorin:
  Herr Bundeskanzler, ich bekomme liebevolle Zeichen, dass Sie losmüssen. Bundeskanzler
  Merz: Sie sehen, dass ich in diesem Thema so engagiert bin. Deswegen fallen meine
  Antworten etwas länger aus als sonst. Aber vielleicht sollte Karsten Wildberger
  trotzdem noch die Gelegenheit haben. Moderatorin: Ich würde vorschlagen, dass wir
  dennoch bis halb fünf Uhr weitermachen. Ich habe noch ein paar Wortmeldungen. Wenn
  Sie dann weg sind, dann wird Herr Wildberger übernehmen. Bundeskanzler Merz: Ja.
  Nächste Antwort kurz. Bundesminister Wildberger: Ganz kurz als Ergänzung zu dem,
  was der Bundeskanzler gesagt hat: Eine Vorbemerkung: Wir können uns immer im absoluten
  Maßstab vergleichen. Wenn wir uns verändern wollen, dann müssen wir uns auch damit
  vergleichen, woher wir kommen. Ich schaue mir die Entwicklung an, wie sich der Status
  quo gerade verändert. Der Bundeskanzler hat eben gesagt, beim Investitionsgipfel
  seien 200 Milliarden Euro „ committed “ worden. Wir kommen eben aus einem Meeting,
  in dem viele Unternehmen waren, die sagten: Wir geben im Bereich der industriellen
  KI noch einmal doppelt drauf. – Wir haben mit Mistral, Aleph Alpha, Cohere Unternehmen,
  die gerade auch Finanzierungsrunden hinter sich haben, die besser gelaufen sind,
  als zu erwarten war. Wir kennen deren Ambitionsniveau. Im Verhältnis dazu ist unheimlich
  viel in Bewegung. Wenn wir die absoluten Zahlen vergleichen, dann müssen wir auch
  konstatieren, dass KI in den USA natürlich nicht nur durch KI passiert. Sie setzen
  auch auf „ hyperscaler “, auf 15 Jahre Rechenzentrum, Cloudinfrastruktur. Das holen
  wir natürlich nicht in einem Jahr auf. Aber in der Veränderung, im Vorankommen,
  bekommen wir mit den Mitteln doch verdammt viel hin. Es ist auch sehr viel in Bewegung.
  Gleichzeitig konstatiere ich, dass der Abstand noch groß ist. Wir haben auch entsprechende
  Ambitionen bei den „ frontier “-Modellen, auch beim Rechenzentrumsausbau. Ich will
  auch noch eine Sache sagen: Die Preise, die heute für „ compute “ bezahlt werden,
  sind, weil die Knappheit so groß ist, viel höher als der Energiepreis. Den Energiepreis
  bekommen wir auch lokal mit Projekten ganz gut hin. Wir haben auch noch ausreichend
  Energien, und wir werden das Ganze auch beschleunigen. Wir sehen da auch große Nachfrage.
  Das ist ein sehr lohnender Case , und wir haben viele Gespräche mit Investoren geführt,
  auch beim Investitionsgipfel, wie man Rechenzentren hier ausbaut. Das heißt, ich
  fokussiere mich vor allen Dingen darauf: „Wie ist die relative Verbesserung“, aber
  habe immer auch im Blick, absolut: Wo stehen die anderen? Frage: Herr Merz, das
  Stichwort kam gerade schon von Herrn Wildberger: „ hyperscaler “. Ich stelle die
  Frage aber jetzt Ihnen. Sie sagen, Sie strebten nicht nach Autarkie, sondern nach
  Souveränität. Gleichzeitig setzen die deutschen Nachrichtendienste jetzt offenbar
  auf die Google-Cloud als eine Möglichkeit. Ist es nicht ein schlechtes Zeichen um
  das Bestelltsein der deutschen Rechenzentrenbetreiber, wenn deutsche Nachrichtendienste
  Google brauchen, um ihre Aufgaben durchführen zu können, oder übersehe ich etwas?
  Bundeskanzler Merz: Ich denke, Sie übersehen in der Tat, dass Google auch in Deutschland
  und in Europa investiert und wir hier europäische Souveränität auch mit einem amerikanischen
  Anbieter ermöglichen können. Das ist ja keine voll integrierte Infrastruktur, sondern
  das ist eine europäische Infrastruktur. Gleichzeitig bauen wir parallel dazu unsere
  eigenen Systeme auf. Wir haben Unternehmen in Deutschland – Sie kennen sie; es sind
  bekannte Namen –, die entsprechende Cloudinfrastruktur auch für uns errichten. Ich
  bin gerade bei diesem Thema – wir koordinieren im Kanzleramt ja die Dienste – sehr
  zuversichtlich, dass wir wirklich Souveränität erreichen. Zusammenarbeit mit anderen
  Diensten gibt es immer dann, wenn sie auf Augenhöhe stattfindet. Ich habe ein hohes
  Vertrauen in unsere Dienste, dass die Daten, die wir dort haben, sicher und geschützt
  sind, auch dann, wenn zum Beispiel ein amerikanischer Anbieter eine große Cloudinfrastruktur
  baut. Sie ist für uns sicher.'
