title: Im Kabinett beschlossen EU -Mission zur Stabilisierung des Libanon
text: Der Rat der Europäischen Union hat im Oktober 2026 die Einrichtung der Mission
  EUSM Libanon beschlossen. Das Bundeskabinett hat einen Beschluss zur deutschen Beteiligung
  an der zivilmilitärischen Mission EUSM Lebanon gefasst. Zuvor hatte am 12. Oktober
  2026 der Rat der Europäischen Union die Einrichtung dieser neuen EU -Mission beschlossen.
  Durch Ausbildungs- und Trainingsmaßnahmen soll sie einen Beitrag zu dauerhaftem
  Frieden und zu Stabilität in Libanon leisten. Der zivile und militärische libanesische
  Sicherheitssektor sollen dabei unterstützt werden, das Gewaltmonopol im gesamten
  Staatsgebiet durchzusetzen. Das betrifft insbesondere die Streitkräfte ( LAF ) und
  die inneren Sicherheitskräfte ( ISF ). Die Maßnahmen erfolgen im Einklang mit der
  Sicherheitsratsresolution der Vereinten Nationen 1701 (2006). Die Arbeitsaufnahme
  der Mission soll frühestens im Dezember 2026 beschlossen werden. Im Zuge der Beteiligung
  sollen bis zu 15 deutsche Beamte der Polizeien des Bundes und der Länder sowie des
  Zolls im zivilen Bereich der Mission eingesetzt werden. Außerdem wird sich die Bundeswehr
  mit einem geringen personellen Umfang an den Ausbildungs- und Trainingsmaßnahmen
  für die libanesische Marine beteiligen. Das Einsatzgebiet der Mission ist auf das
  libanesische Staatsgebiet nördlich des Litani-Flusses begrenzt. Es entspricht dem
  Einsatzgebiet der UNIFIL -Mission , die am 31. Dezember 2026 ausläuft und an der
  die Bundeswehr beteiligt war. Die politische Lage im Libanon ist geprägt von den
  Bemühungen der Regierung von Ministerpräsident Nawaf Salam, das staatliche Gewaltmonopol
  durchzusetzen, die territoriale Integrität des Landes wiederherzustellen und notwendige
  wirtschaftliche und institutionelle Reformen voranzutreiben. Mit dem Auslaufen des
  UNIFIL -Mandats gewinnt die Unterstützung der libanesischen Sicherheitskräfte zusätzlich
  an Bedeutung. Die Bundesregierung wird den Deutschen Bundestag über das beschlossene
  Mandat informieren. Da es sich um einen nicht bewaffneten Einsatz der Streitkräfte
  handelt, ist ein Beschluss des Bundestages nach dem Parlamentsbeteiligungsgesetz
  nicht notwendig.
