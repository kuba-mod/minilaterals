  „Es wird ein sehr schwerer Winter für das Land. Es kommt darauf an, dass die Europäer
  zusammenstehen.“ Mehrere bilaterale Gespräche runden das Programm für den Kanzler
  ab. Den Auftakt machte der rumänische Präsident Nicusor Dan. Die zahlreichen bilateralen
  und multilateralen Gespräche am Rande des Gipfels sind charakteristisch für das
  Format der Europäischen Politischen Gemeinschaft. Als eigenständiges, informelles
  Forum ist die EPG institutionell weder Teil der Europäischen Union noch des Europarats.
  Ziel ist es, allen europäischen Staaten, die die gemeinsamen Werte Europas teilen,
  eine Plattform für Dialog und Kooperation zu bieten. Das Treffen gilt damit als
  Ausdruck konstruktiver Zusammenarbeit über die Grenzen der Europäischen Union hinaus.
  Am Freitag schließt sich in Dublin das Treffen eines informellen Europäischen Rats
  an. Dann tauschen sich die Mitgliedsstaaten zu Fragen des EU -Haushaltes sowie zur
  Ukraine aus. Charakteristisch für das Format der Europäischen Politischen Gemeinschaft
  sind die zahlreichen bilateralen und multilateralen Gespräche am Rande des Gipfels,
  die den direkten Austausch zwischen den Staats- und Regierungschefs fördern. Das
  Treffen gilt damit als Ausdruck konstruktiver Zusammenarbeit über die Grenzen der
  Europäischen Union hinaus. Die Europäische Politische Gemeinschaft ist ein eigenständiges,
  informelles Forum und institutionell weder Teil der Europäischen Union noch des
  Europarats. Ziel ist es, allen europäischen Staaten, die die gemeinsamen Werte Europas
  teilen, eine Plattform für Dialog und Kooperation zu bieten.'
