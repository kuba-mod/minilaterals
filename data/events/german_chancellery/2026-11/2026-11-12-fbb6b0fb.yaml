title: EPG -Treffen in Dublin Signal der Geschlossenheit und Stärke
text: 'Es komme darauf an, „ dass die Europäer zusammenstehen“, betonte Kanzler Merz
  b eim Treffen zur Europäischen Politischen Gemeinschaft in Dublin . Unter dem Motto
  „ Europe – strong, secure, connected “ kamen am Donnerstag in Dublin zur Tagung
  der Europäischen Politischen Gemeinschaft ( EPG ) insgesamt 48 Staats- und Regierungschefinnen
  und -chefs sowie die Spitzen wichtiger europäischer und transatlantischer Institutionen
  zusammen. Bundeskanzler Friedrich Merz appellierte zu Beginn an „ein solides Budget
  und eine gemeinsame weitere Hilfe aus der Europäischen Union für die Ukraine“. Die
  Zusammenkunft in der irischen Hauptstadt sollte vor allem den informellen und offenen
  Austausch über die großen Herausforderungen Europas ermöglichen. Im Mittelpunkt
  standen dabei Fragen der wirtschaftlichen Wettbewerbsfähigkeit des Kontinents, der
  Sicherheit und Verteidigung. Mit Blick auf die Ukraine machte Bundeskanzler Merz
  deutlich: „Es wird ein sehr schwerer Winter für das Land. Es kommt darauf an, dass
  die Europäer zusammenstehen.“ An die Tagung der Europäischen Politischen Gemeinschaft
  schließt sich am Freitag ein informeller Europäischer Rat an. Dublin, 12. November
  2026: Unter dem Motto „ Europe – strong, secure, connected “ tagte in Irland mit
  Gastgeber Micheál Martin die Europäische Politische Gemeinschaft (EPG). Insgesamt
  48 Staats- und Regierungschefinnen und -chefs sowie die Spitzen wichtiger europäischer
  und transatlantischer Institutionen kamen zusammen. Zu Beginn betonte der Kanzler
  die hohe Bedeutung von Geschlossenheit und Stärke in Europa und appellierte an „ein
  solides Budget und eine gemeinsame weitere Hilfe aus der Europäischen Union für
  die Ukraine“. Im Mittelpunkt des Treffens standen Fragen der wirtschaftlichen Wettbewerbsfähigkeit
  des Kontinents, der Sicherheit und Verteidigung. Mit Blick auf die Ukraine machte
  Bundeskanzler Merz deutlich: „Es wird ein sehr schwerer Winter für das Land. Es
  kommt darauf an, dass die Europäer zusammenstehen.“ Mehrere bilaterale Gespräche
  runden das Programm für den Kanzler ab. Den Auftakt machte der rumänische Präsident
  Nicusor Dan. Die zahlreichen bilateralen und multilateralen Gespräche am Rande des
  Gipfels sind charakteristisch für das Format der Europäischen Politischen Gemeinschaft.
  Als eigenständiges, informelles Forum ist die EPG institutionell weder Teil der
  Europäischen Union noch des Europarats. Ziel ist es, allen europäischen Staaten,
  die die gemeinsamen Werte Europas teilen, eine Plattform für Dialog und Kooperation
  zu bieten. Das Treffen gilt damit als Ausdruck konstruktiver Zusammenarbeit über
  die Grenzen der Europäischen Union hinaus. Am Freitag schließt sich in Dublin das
  Treffen eines informellen Europäischen Rats an. Dann tauschen sich die Mitgliedsstaaten
  zu Fragen des EU -Haushaltes sowie zur Ukraine aus. Dublin, 12. November 2026: Unter
  dem Motto „ Europe – strong, secure, connected “ tagte in Irland mit Gastgeber Micheál
  Martin die Europäische Politische Gemeinschaft (EPG). Insgesamt 48 Staats- und Regierungschefinnen
  und -chefs sowie die Spitzen wichtiger europäischer und transatlantischer Institutionen
  kamen zusammen. Zu Beginn betonte der Kanzler die hohe Bedeutung von Geschlossenheit
  und Stärke in Europa und appellierte an „ein solides Budget und eine gemeinsame
  weitere Hilfe aus der Europäischen Union für die Ukraine“. Im Mittelpunkt des Treffens
