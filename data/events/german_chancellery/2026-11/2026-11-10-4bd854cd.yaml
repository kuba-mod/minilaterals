date: '2026-11-10'
type: press_release
source_name: german_chancellery
title: Pressekonferenz von Bundeskanzler Merz und dem ungarischen Ministerpräsidenten,
  Péter Magyar Ein Neustart der Beziehungen
text: 'Das Treffen mit Ministerpräsident Magyar umfasste auch Gespräche im erweiterten
  Kreis zu bilateralen Themen mit mehreren Fachministerinnen und -ministern. Beim
  Besuch des ungarischen Ministerpräsidenten Péter Magyar hat Bundeskanzler Friedrich
  Merz bekräftigt, dass die Beziehungen zwischen Ungarn und Deutschland wiederbelebt
  werden sollen. Dazu wolle man „den Schwung des Neustarts in der Regierung nutzen“,
  unterstrich Merz. Neben Bundeskanzler Merz und Ministerpräsident Magyar nahmen auch
  mehrere Ministerinnen und Minister beider Länder an den Gesprächen im Kanzleramt
  teil. Bundeskanzler Merz sprach von einem „Neustart unserer Beziehungen“ und verwies
  auf die engen wirtschaftlichen Verflechtungen beider Länder. Neben einer Intensivierung
  der Wirtschaftsbeziehungen wird die Zusammenarbeit in den Bereichen Energie und
  Verteidigung vertieft. Zudem kündigte der Kanzler eine Stärkung der kulturellen
  Verbindungen an, etwa mit dem deutsch-ungarischen Kulturjahr 2028. Sehr geehrte
  Damen und Herren, herzlich willkommen! Vor allen Dingen ein ganz besonders herzliches
  Willkommen zurück in Berlin, Péter Magyar! Du warst bereits im Juni hier, kurz nach
  deiner Amtseinführung. Deine Regierung hat seitdem mit beeindruckendem Tempo Reformen
  in Ungarn vorangetrieben. Du machst damit klar: Ungarn ist wieder ein aktiver Teil
  der europäischen Familie, und als solcher habe ich nicht nur dich persönlich heute
  herzlich in Berlin willkommen geheißen, sondern auch einen Teil deiner Regierung.
  Die gestrige Europarede hat gezeigt: Die ungarische und die deutsche Geschichte
  sind eng miteinander verbunden. Deswegen war es mir ein wichtiges Anliegen, heute
  mit dir in diesem besonderen Format – mit mehreren unserer Minister – diesen Neustart
  unserer Beziehungen zu besprechen; denn die Aufgaben, die vor uns liegen, sind groß.
  In den Verhandlungen etwa über den Mehrjährigen Finanzrahmen treten wir in eine
  entscheidende Phase. Wir wollen die Verhandlungen gemeinsam schnell zum Abschluss
  bringen. Der Mehrjährige Finanzrahmen muss dabei zukunftsfähig sein. Dazu gehört
  auch, dass wir in der finanziellen Unterstützung der Ukraine jetzt nicht nachlassen.
  Dies ist aus unserer Sicht eine Frage der kollektiven europäischen Sicherheit und
  damit Aufgabe für uns alle. Der MFR muss für die Mitgliedstaaten zugleich finanziell
  tragbar sein. Ich erwarte von den neuen Vorschlägen des Präsidenten des Europäischen
  Rates, António Costa, daher deutliche Veränderungen. Ohne diese Veränderungen wird
  es so schnell keinen Abschluss der Verhandlungen geben können. Wir haben auch über
  die europäische Wettbewerbsfähigkeit gesprochen. Wir wollen die Rahmenbedingungen
  für unsere Wirtschaft verbessern und globale Handelspartnerschaften ausbauen. Auch
  die Erweiterung der Europäischen Union ist uns beide wichtig. Ich will ausdrücklich
  das große Engagement Ungarns für die Westbalkanstaaten anerkennen, denn wenn diese
  Kandidaten beitrittsreif sind, dann müssen wir unser Beitrittsversprechen auch erfüllen.
  Ich freue mich daher sehr, dass wir zum Beispiel mit Montenegro kurz vor dem Abschluss
  der Beitrittsverhandlungen stehen. In Bezug auf die Ukraine und Moldau möchte ich,
  dass wir endlich alle Verhandlungskapitel öffnen können. Ich bin zuversichtlich,
  dass wir das bis Ende des Jahres auch hinbekommen werden. Uns allen ist nämlich
  klar: Russland versteht nach wie vor nur die Sprache der Stärke. Daher müssen wir
  als Europäer geeint auftreten – in der Bereitschaft zu ernsthaften Verhandlungen,
  aber auch im weiteren Druck auf Russland und in der langfristigen Unterstützung
  der Ukraine –, und dazu zählt auch eine klare Perspektive für den Beitritt zur Europäischen
  Union. Meine Damen und Herren, wir wollen auch bilateral die Beziehungen zwischen
  Ungarn und Deutschland wiederbeleben und den Schwung des Neustarts in der Regierung
  nutzen. Deutschland ist größter bilateraler Handelspartner Ungarns, und Ungarn ist
  ein wichtiger Handelspartner für uns. Es gibt, wie Sie ja wissen, eine große Zahl
  von Unternehmen, die in Ungarn produzieren, die Automobilindustrie etwa, die Zulieferindustrie,
  aber auch viele andere Industrien. Entsprechend groß ist das Interesse an einer
  intensivierten Zusammenarbeit. Daher begrüße ich die positiven Signale aus Budapest
  zur Verbesserung der Wettbewerbsbedingungen auch für unsere Unternehmen sehr. Etwa
  der direkte Austausch zwischen deutschen und ungarischen Unternehmen, zum Beispiel
  mit dem Ost-Ausschuss der Deutschen Wirtschaft, der gerade erst in Ungarn war, wird
  intensiviert. Wir haben schließlich über unsere Energiequellen und auch über die
  gemeinsame Nutzung gesprochen. Wir haben angeboten, mit Kapazitäten an deutschen
  LNG -Terminals und Know-how in Bezug auf erneuerbare Energien die ungarische Abkehr
  von russischen Energieimporten zu unterstützen. Schließlich wird unsere Rüstungskooperation
  weiter ausgebaut. Wir wollen vor allem im Bereich der Luftverteidigung das vorhandene
  Potenzial nutzen. Der SAFE-Kredit und die Modernisierung der Armeen, flankiert von
  einem intensiven verteidigungspolitischen Dialog, bieten gute Gelegenheiten für
  die Intensivierung der Zusammenarbeit. Schließlich – auch darauf hinzuweisen lege
  ich Wert – werden wir die kulturellen Verbindungen unserer Länder stärken, zum Beispiel
  mit dem deutsch-ungarischen Kulturjahr 2028. Auch darüber haben wir heute beim Mittagessen
  noch einmal gesprochen, und ich bin sehr dankbar, dass die ungarische Regierung
  genauso viel Wert auf eine gute Vorbereitung dieses Jahres legt wie auch die deutsche.
  In diesem Sinne noch einmal ganz herzlichen Dank an dich, lieber Péter, für dein
  heutiges Kommen mit Teilen deiner Regierung nach Berlin. Herzlichen Dank für die
  gute Zusammenarbeit und vor allem auf weiterhin gute Zusammenarbeit zwischen Ungarn
  und Deutschland! Ich möchte mich auch bei dem Herrn Bundeskanzler dafür bedanken,
  dass wir bereits zum zweiten Mal seit der Regierungsbildung hier sein dürfen. Das
  zeigt auch die Bedeutung der bilateralen Beziehungen und den Erfolg der bilateralen
  Beziehungen, denn davor gab es solche bilateralen Treffen zwischen den Regierungen
  der beiden Länder nicht, und nun ist es innerhalb von sechs Monaten das zweite Mal.
  Ich freue mich auch sehr, dass ich ausgerechnet um den 9. November herum hier sein
  kann. Das ist ja ein sehr wichtiger Tag im Leben des deutschen Volkes, und gleichzeitig
  sind auch wir sehr stolz darauf, welche Rolle Ungarn bei diesem historischen Ereignis
  gespielt hat, beim Fall der Berliner Mauer, bei der Wiedervereinigung Deutschlands.
  Ungarn hat auch mit dem Paneuropäischen Picknick eine wichtige Rolle dabei gespielt.
  Ich hatte die Gelegenheit, auf Einladung der Konrad-Adenauer-Stiftung eine Europaansprache
  zu halten, und dabei habe ich auch gesagt, wie sehr und wie gut sich die Ungarn
  an den Sommer, an den Herbst 1989 erinnern, an die Öffnung der Grenze, an das Durchschneiden
  des Eisernen Vorhangs, daran, wie damit auch die Wiedervereinigung Deutschlands
  ermöglicht wurde, und daran, wie so auch ein gemeinsamer Weg zwischen den beiden
  Ländern ermöglicht wurde. Ich bin also auch deshalb sehr froh, hier zu sein. Ich
  bin auch sehr glücklich, dass ich den Herrn Bundeskanzler nach Budapest einladen
  durfte und er meine Einladung angenommen hat und uns irgendwann im Frühjahr besuchen
  wird. Im Frühjahr sind sowohl Berlin als auch Budapest viel schöner. Wir freuen
  uns also auf seinen Besuch. Ich möchte noch einige Anmerkungen und Kommentare zum
  vorher Gesagten hinzufügen: Ich glaube, dass alles gegeben ist. Die Beziehungen
  zwischen den beiden Ländern sind auf kulturellem und wirtschaftlichem Gebiet traditionell
  sehr stark. Die Sterne sind sehr günstig dafür, dass alle Beziehungen jetzt noch
  weiter gestärkt werden – das Vertrauen zwischen den beiden Ländern, das Vertrauen
  zwischen den wirtschaftlichen Akteuren, das Vertrauen zwischen den Investoren der
  beiden Länder und auch zwischen den Politikern der beiden Länder. Die Handelsbilanz
  beträgt über 60 Milliarden Euro. Es gibt bereits sehr bedeutende deutsche Investitionen
  in Ungarn, aber wir sind beide der Meinung, dass es noch sehr viel Raum nach oben
  gibt – sei es für Leuchtturmprojekte oder kleinere Projekte. Ich möchte mich dafür
  bedanken, dass der Herr Bundeskanzler noch einmal die Bedeutung der kulturellen
  Zusammenarbeit betont hat und es 2028 zum deutsch-ungarischen kulturellen Jahr kommen
  wird. Es werden verschiedene Ereignisse sein; sie betreffen etwa die Zusammenarbeit
  der Jugend oder die Andrássy-Universität. Das sind alles Dinge, die erhalten und
  weiterentwickelt werden müssen. Denn die deutsch-ungarische Zusammenarbeit hat eine
  sehr starke Tradition, und sie muss auch für die jüngere Generation gestärkt werden.
  Wie bereits erwähnt, ist der 9. November ein sehr wichtiger Tag und auch ein sehr
  wichtiger Ausgangspunkt. Es war sehr schön, hier zu sein, ganz nah am Brandenburger
  Tor und hier über dieses wichtige Ereignis zu sprechen. Der Herr Bundeskanzler hat
  sehr wichtige Themen erwähnt. Ich bin sehr froh darüber, dass von der ungarischen
  Regierung die Außenministerin, der Wirtschaftsminister, der Verteidigungsminister
  und der Minister des Innern hier sind als auch der Staatssekretär des Finanzministeriums
  und mein Berater auf europäischer Ebene. Das zeigt auch die Bedeutung der Themen,
  der Fragen, die erörtert wurden. Der Herr Bundeskanzler erwähnte den siebenjährigen
  europäischen Haushalt. Ich werde jetzt erst einmal Berlin verlassen. Aber wie der
  Herr Bundeskanzler gesagt hat, werden wir Donnerstag und Freitag trotzdem zusammen
  sein. Wir werden uns in diesem Jahr noch unzählige Male treffen. Das Ziel ist, dass
  die 27 europäischen Länder einen gemeinsamen Finanzrahmen annehmen, ratifizieren
  können. Das wird keine leichte Aufgabe sein. Der Bundeskanzler erwähnte auch, welche
  Erwartungen Deutschland mit Hinblick auf diesen Haushalt hat. Natürlich verfügen
  alle Länder über eigene nationale Interessen. Es ist keine Überraschung, dass Ungarn
  als mitteleuropäisches Land etwas abweichende Interessen hat. Wir halten es für
  sehr wichtig, dass die traditionellen Politikbereiche wie Agrarpolitik, Kohäsionspolitik
  und die Finanzierung der nationalen Bereiche, Portfolios, nicht reduziert werden.
  Wir finden es auch sehr wichtig, dass es mit Hinblick auf die Einzahlungen eine
  Änderung geben wird. Der gegenwärtige Vorschlag sieht vor, dass Ungarn einer der
  größten Nettozahler, Pro-Kopf-Einzahler sein wird, was natürlich bei einem Kohäsionsland
  nicht sehr passend ist. Es gibt also an diesem Haushalt von allen Seiten noch einiges
  zu verändern. Es gibt auch noch weit erfahrenere Menschen als mich. „ Nothing is
  agreed until everything is agreed .“ Ich denke, dass wir noch zusammen Weihnachten
  verbringen werden. Das soll keine Drohung sein. Aber der Vorsitzende des Europäischen
  Rats hat uns damit gedroht, dass das passieren könnte. Ungarn wird auf jeden Fall
  ein konstruktiver Partner sein. Natürlich werden wir nicht nachgeben, was unsere
  nationalen Interessen angeht. Aber das gilt ja für alle Länder; das ist für alle
  Länder gültig. Wie ich gestern auch in meiner Rede erwähnt habe, können wir natürlich
  sehr lange darüber sprechen, wie wir noch wettbewerbsfähiger werden können. Sehen
  wir uns zum Beispiel die Diversifizierung der Energie, die Energiepreise und die
  Energieunabhängigkeit an. Wenn wir da nicht etwas Bedeutendes tun, dann werden wir
  sehr große Schwierigkeiten bekommen. Wir haben sehr große Aufgaben vor uns. Wir
  spüren die Frustration der Europäer. Das ist berechtigt, weil in sehr vielen Ländern
  die Energiepreise sehr stark gestiegen sind. Wir müssen irgendetwas tun. Der Herr
  Bundeskanzler erwähnte auch, dass Ungarn für die Energiediversifizierung arbeitet.
  Es wurde auch die LNG -Versorgung seitens Deutschlands vorgeschlagen. Wir müssen
  uns auf den Preis einigen. Ungarn ist daran interessiert, dass Gas, Erdöl oder andere
  Energieträger aus allen Richtungen, aus vielen Richtungen kommen können. Der Preis
  ist natürlich sehr wichtig, weil die ungarische Regierung weder die Unternehmen
  noch die Bevölkerung stärker belasten will. Ganz im Gegenteil: Wir wollen eher Erleichterungen
  erreichen. Denn es gibt momentan ja sehr hohe Energiepreise, und dadurch wird die
  Wettbewerbsfähigkeit geschwächt. Für Ungarn ist auch die Unterstützung der Länder
  des Westbalkans sehr wichtig. Wir sind sehr stolz darauf, dass Ungarn als Stabilisator
  auf dem Westbalkan agieren kann. Aus historischen Gründen kennen wir die Westbalkanstaaten
  sehr gut. Ich kann sagen: Wir haben, ohne Ausnahme, ein gutes Verhältnis zu allen
  Ländern des Westbalkans. Ich hatte auch die Gelegenheit, mit den Führungspolitikern
  des Westbalkans zu sprechen. Wir haben auch die Ergebnisse der Wahlen in Serbien
  gesehen. Ich hatte die Ehre, am Telefon zuerst den neuen gewählten Politikern der
  serbischen Regierung gratulieren zu können. Ich kann sagen, dass Ungarn auf jeden
  Fall Serbien unterstützen wird. Sie können auf uns zählen. Wir werden da sein. Wir
  werden sie unterstützen ‑ sei es bei der europäischen Integration, beim Beitrittsprozess
  zur Europäischen Union oder in anderen Fragen. Ich werde mit sehr großer Freude
  einer der Ersten sein, der die neue Führung in Belgrad besucht oder sie nach Budapest
  einlädt. Das Gleiche werde ich mit allen anderen Westbalkanländern tun. Ich werde
  alle besuchen. Wenn es nötig ist, werde ich sie sehr stark und sehr laut in Brüssel
  vertreten oder die Notwendigkeit der Beschleunigung ihrer Beitrittsprozesse betonen.
  Es sind schon sehr wichtige Fortschritte auf dem Weg zum EU -Beitritt erreicht worden.
  Aber natürlich gibt es noch sehr viel zu tun. Ich bin sehr froh, dass wir mit Deutschland
  darin absolut einer Meinung sind; Deutschland stärkt und unterstützt den Beitritt
  der Westbalkanstaaten zur Union. Aber ich denke auch, dass Ungarn einen sehr wichtigen
  Beitrag leisten wird. Was Ukraine und Moldau angeht, kann ich sagen: Ich habe in
  Brüssel Präsident Selenskyj getroffen, und wir haben uns auf einen Neuanfang geeinigt.
  Glücklicherweise läuft die Wiederherstellung der Rechte der ungarischen Minderheit
  in der Ukraine sehr gut. Im Bereich der Bildung gibt es noch etwas zu tun, aber
  es gibt schon große Fortschritte. Wir haben auf Ministerialebene schon sehr gute
  Austausche. Ich hoffe, dass es noch weitere Treffen geben wird. Was Moldau angeht,
  so habe ich mich mit der Präsidentin getroffen. Ich habe mich davon überzeugt, wie
  viel dafür getan wird, dass Moldau der Europäischen Union beitreten kann. Ich habe
  der Bevölkerung dort versichert, dass Ungarn die Integration unterstützt. Ich bin
  nicht ganz davon überzeugt, dass diese Verbindung zwischen Moldau und der Ukraine
  existiert. Ich denke, es wäre sehr wichtig, anzuerkennen, dass man wirklich einen
  „ merit-based “ Beitrag fördern sollte. Damit können wir die Glaubwürdigkeit und
  Transparenz des gesamten Erweiterungsprozesses bewahren. Ich denke, dass das nächste
  Kapitel nur dann eröffnet werden sollte, wenn das jeweilige Land dafür bereit ist.
  Ich bin mir sicher, dass Moldau und auch mehrere Westbalkanstaaten dafür bereit
  sind. Wenn ein Land dafür bereit ist, dann wird Ungarn nicht im Weg stehen. Wir
  verstehen, dass die EU in dieser sehr fragilen internationalen Sicherheitssituation
  auf jeden Fall das Interesse hat, diese Staaten beitreten zu lassen. Denn wo die
  EU nicht ist, da gibt es andere, und da werden andere erscheinen. Das betrifft nicht
  nur die Ukraine, sondern auch den Westbalkan. Es ist nicht nur deren, sondern auch
  unser Interesse. Wir haben über sehr viele verschiedene Themen gesprochen. Herr
  Bundeskanzler erwähnte die Verteidigungspolitik. In Bezug auf den SAFE-Kredit können
  wir natürlich noch sehr viel tun. Natürlich gibt es auch die deutsche Verteidigungsindustrie
  in Ungarn. Wir wollen diese Zusammenarbeit noch fruchtbarer gestalten. Wir können
  auch Joint-Venture -Investitionen tätigen und uns auf das deutsche technologische
  Know-how stützen. Wir haben uns darauf geeinigt, dass die bereits existierenden
  Kapazitäten und Investitionen, sei es im Bereich des Tourismus oder der Autoindustrie,
  noch weiter gestärkt und erhöht werden müssen. Das ist im Interesse beider Staaten
  und im Interesse der ungarischen und deutschen Unternehmen. Wir stehen vor sehr
  vielen Herausforderungen, nicht nur in Deutschland, sondern auch in Ungarn. Wir
  werden jetzt zum Beispiel den ersten Haushalt nach den Wahlen verabschieden. Wir
  haben ein sehr schwieriges Erbe übernommen. Wir haben in Ungarn ein Haushaltsdefizit
  in Höhe von 8,3 Prozent übernommen. Wir wollen es auf 4,9 Prozent reduzieren. Das
  ist natürlich immer noch sehr hoch. Wir müssen es weiter reduzieren. Gleichzeitig
  werden wir aber die Steuerlast für 2,5 Millionen Bürger reduzieren. Wir werden zum
  Beispiel die Familienunterstützungen und ‑zahlungen für 1,7 Millionen Kinder erhöhen.
  Für sehr viele Sozialarbeiter, Gesundheitsmitarbeiter und Polizeikräfte werden wir
  Lohnerhöhungen erwirken. Wir werden dabei den Haushalt stabilisieren. Ich habe gehört,
  dass in Deutschland die Haushaltsverhandlungen bereits begonnen haben. Ich weiß,
  dass Sie immer noch in einer besseren Situation sind als viele europäische Kollegen,
  und ich hoffe, dass das so bleibt und dass Ungarn dabei erfolgreich sein wird. Wir
  bedanken uns dafür, dass wir hier sein durften. Deutschland und das deutsche Volk
  können immer auf Ungarn zählen. Frage: Herr Bundeskanzler, in einem Brief an Herrn
  António Costa schrieben Sie, dass alle ihren fairen Beitrag zur Ukraineunterstützung
  leisten müssten. Sie sagten auch, dass das eine Vorbedingung für weitere Unterstützung
  sein könne. Einige in Ungarn haben das sogar als Ultimatum aufgefasst. Man nimmt
  an, dass das nicht von ungefähr vor dem heutigen Treffen herausgekommen sei. Robert
  Fico hat es als Drohung bewertet. Was denken Sie? Wird es tatsächlich so kommen,
  wenn ein Staat nicht seinen Beitrag zur Unterstützung leistet? Kann es tatsächlich
  zu einer Blockade kommen? Können zum Beispiel die Landwirtschaft und die Kohäsionsunterstützung,
  nach der es im ungarischen Staatshaushalt eine brennende Nachfrage gibt, an diese
  Vorbedingung gekoppelt werden? Bundeskanzler Merz: Wir stehen in der Tat vor schwierigen
  Haushaltsverhandlungen in der Europäischen Union. Wir brauchen den nächsten Mittelfristigen
  Finanzrahmen ab 2028. Aber wir wissen auch, dass wir ihn nicht erst Ende 2027 verabschieden
  können, sondern wir brauchen einen Vorlauf von einem Jahr, um die Implementierung
  zu ermöglichen. Insofern stehen wir jetzt unter Handlungszwang. Für mich und für
  die Bundesregierung gibt es zwei wichtige Themen, und ich teile diese Einschätzung
  mit anderen Regierungen in Europa: Zum einen müssen wir neue Prioritäten setzen.
  Das ist unser gemeinsamer Wille. Neue Prioritäten zu setzen, heißt, dass frühere
  Prioritäten dahinter zurückstehen müssen. Wenn die neuen Prioritäten Verteidigung
  und Wettbewerbsfähigkeit sind, dann müssen wir in diesem Bereich mehr tun als in
  der Vergangenheit. Die zweite Vorbedingung für einen erfolgreichen Abschluss der
  Haushaltsverhandlungen ist unser Grundverständnis dessen, wie wir die Ukraine in
  den nächsten Jahren unterstützen. Denn dies ist eine gemeinsame europäische Aufgabe.
  Es ist keine Aufgabe einzelner Mitgliedstaaten, sondern es ist eine gemeinsame Aufgabe
  der Europäischen Union. So haben wir sie immer verstanden, und so haben wir unsere
  Ukrainepolitik in den letzten Jahren angelegt. Deswegen gehört die Frage, wie wir
  die Ukraine in den nächsten Jahren, wenn notwendig, finanzieren, natürlich mit in
  den Kontext dieser Haushaltsverhandlungen. Wir mussten im vergangenen Jahr kurz
  vor Weihnachten den Weg der verstärkten Zusammenarbeit in der Europäischen Union
  gehen. 24 von 27 Mitgliedstaaten haben sich dazu bereit erklärt, den Weg zu gehen.
  Aber es ist aus meiner Sicht keine gute Option, diesen Weg fortzusetzen. Wir müssen
  die Ukrainepolitik vollständig im europäischen Haushalt abbilden. Ich weiß, dass
  es darüber unterschiedliche Vorstellungen gibt – es gibt mindestens vier Mitgliedstaaten,
  die das anders sehen. Aber dann müssen wir über diese Frage sprechen, und Péter
  Magyar und ich haben ganz offen darüber gesprochen, dass es diesbezüglich auch ein
  innenpolitisches Thema in Ungarn gibt, das wir selbstverständlich respektieren.
  Ich habe aber umgekehrt um Verständnis dafür geworben, dass der größte Beitragszahler
  in den Haushalt der Europäischen Union und gleichzeitig das Land, das mit Abstand
  den größten Beitrag zur Unterstützung der Ukraine leistet, Wert darauf legt, dass
  wir diese grundsätzliche Frage miteinander klären. Das steht in den nächsten Tagen
  und möglicherweise den nächsten Wochen dann eben auch auf der Tagesordnung. Herzlichen
  Dank für die Frage. Ich möchte diese Frage im weiteren Kontext angehen und möchte
  erläutern, dass es hier nicht nur darum geht, dass die Ukraine unterstützt werden
  kann; vielmehr leisten die einzelnen Mitgliedstaaten jeweils unterschiedliche Beiträge
  im europäischen Sicherheitssystem, je nach finanziellen Rahmen, Vorbereitungsgrad
  und geopolitischen Gegebenheiten. Ungarn leistet seit Jahren, seit Anfang der Migrationskrise,
  einen sehr großen Beitrag durch den Schutz der Südgrenze der EU , und zwar nicht
  nur menschlich, sondern auch logistisch. Es gibt hier auch – wie soll ich sagen? –
  polizeiliche Aufgaben, die sehr wichtig sind, und nie haben wir dazu Unterstützung
  oder Anerkennung von der Europäischen Union bekommen. Dies hat in den letzten Jahren
  mehrere Milliarden Euro gekostet, aber Ungarn muss dafür jeden Tag eine Million
  Euro Strafe zahlen. Es kostet also wirklich viel Geld, die Außengrenzen zu beschützen,
  und aufgrund eines Urteils des Europäischen Gerichtshofs müssen wir hier Strafe
  zahlen. Ich hoffe deshalb sehr darauf, dass in den Verhandlungen mit der ungarischen
  Regierung so schnell wie möglich eine Lösung gefunden werden kann, damit wir Europa
  und die europäischen Außengrenzen weiter beschützen können, ohne diese Millionen
  zahlen zu müssen. Europa spielt eine sehr aktive Rolle im Westbalkan, im Kosovo,
  in Bosnien-Herzegowina. Nicht nur – das „nur“ in Anführungszeichen – in der Ukraine
  muss die europäische Sicherheit verteidigt werden; denn wie gesagt, wo Europa nicht
  präsent ist, sind andere präsent. Deswegen unterstützen wir die Bundeswehr an mehreren
  Stellen, Ungarn geht seinen Verpflichtungen an den Ostgrenzen nach, und wir unterstützen
  die baltischen Staaten auch bei der Luftabwehr. Hier haben wir schon früher Unterstützung
  angeboten, und auch jetzt tragen wir zu diesen Anstrengungen bei. Ich möchte hier
  jetzt nicht alle Instanzen auflisten, aber welchen Beitrag leistet Ungarn? Wir haben
  mehrere Tausende von Menschen – Kinder, Flüchtlinge aus der Ukraine – aufgenommen;
  auch meine Familie hat Flüchtlinge aus Kyjiw aufgenommen. Ich war 2024 persönlich
  in Kyjiw, als Putin das große Kinderkrankenhaus bombardiert hat, und ich habe Spendenbeiträge
  von Ungarinnen und Ungarn dorthin gebracht. Wir leisten ständig humanitäre und weitere
  Hilfe an die Ukraine, und wir sind gerne bereit, diesen Beitrag auch weiterhin zu
  leisten. Ich bin mir sicher, dass beide Seiten dies anerkennen. Wir wissen, dass
  unser Erbe nicht einfach ist, aber wir tun, was wir können. Ich möchte hier diplomatisch
  und mit allem Respekt als ungarischer Ministerpräsident anmerken: Ich halte es nicht
  unbedingt für die richtige Richtung, wenn man den europäischen Haushalt – also den
  Siebenjahreshaushalt, bei dem es letztlich um die Europäische Union geht, um ungarische,
  deutsche und französische Landwirte und Studenten, um KMUs und ihre Entwicklung
  und Unterstützung –, mit anderen Angelegenheiten koppelt. Ich sehe das nicht als
  Erpressung – ich will dieses Wort nicht in den Mund nehmen; denn natürlich hängt
  alles mit allem zusammen –, aber ich bin mir nicht sicher, ob das die richtige Botschaft
  vermittelt. Wir werden am Verhandlungstisch sitzen, und wie der Herr Bundeskanzler
  schon gesagt hat, haben wir ganz offen darüber gesprochen. Auch als diese Angelegenheit
  zu unserer Überraschung in Brüssel zur Sprache kam, haben wir dort unsere Argumente
  vorgebracht und unseren Standpunkt begründet. Für Ungarn ist es nicht möglich, dass
  wir Anleihen in Milliardenhöhe für diese Angelegenheiten aufnehmen. Wir haben ja
  über das Defizit gesprochen, das wir von der vorherigen Regierung geerbt haben und
  das wir reduzieren müssen. In diesem Sinne ist dies für uns aus innenpolitischen
  Gründen nicht zulässig, aber wir werden in Berlin, in Dublin und in Brüssel weiter
  verhandeln, und wir werden eine Lösung für den EU -Haushalt finden.'
