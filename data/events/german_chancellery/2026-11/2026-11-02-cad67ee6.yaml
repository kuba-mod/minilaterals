  gesprochen? Wie Sie zu Recht sagen, haben die beiden klargemacht, dass sie in ihrer
  nationalen Eigenschaft mit dem russischen Präsidenten gesprochen haben. Der Kenntnis
  der Bundesregierung zufolge fand dieses Gespräch auch exakt auf der Grundlage der
  europäischen Vorstellungen statt und wird insofern begrüßt. Jede Form der Kommunikation
  über eine klare europäische Position ist im Sinne der Bundesregierung. Die zentralen
  Gespräche aber müssen mit der Ukraine und nicht nur über die Ukraine stattfinden.
  Das war immer Gegenstand der Botschaft, die die Bundesregierung ausgesandt hat.
  Über direkte Gespräche des Bundeskanzlers mit den Teilnehmern kann ich Ihnen momentan
  nichts berichten. Könnte man das noch erwarten? Man kann ja davon ausgehen, wenn
  da auf geheimer Ebene bzw. nicht öffentlich gesprochen wird, dass auf einer nicht
  öffentlichen Ebene zwischen Kanzler und zum Beispiel Herrn Stubb mehr herauskommt
  als das, was bis jetzt öffentlich verlautbart wurde. Sie können sicher sein, dass
  die Bundesregierung auch mit den Regierungen der jeweiligen Länder in engem Kontakt
  ist und dass auch über dieses Gespräch bereits ein enger Austausch stattfand. Sie
  fragten ja nach einem direkten Gespräch des Bundeskanzlers. Außenminister Wadephul
  begründete den Verzicht auf das G20-Gruppenfoto mit Sergei Lawrow (beim Treffen
  der G20-Außenminister ) damit, man dürfe keine falschen optischen Signale aussenden.
  Zugleich hat er ja nach dem völkerrechtswidrigen US-israelischen Angriff gegen den
  Iran mehrmals auf Fotos sowohl mit dem US-Außenminister als auch mit seinem israelischen
  Counterpart posiert. Dazu würde mich interessieren: Nach welchen konkreten Kriterien
  entscheidet die Bundesregierung, wann ein gemeinsames Foto mit einem Außenminister
  trotz völkerrechtswidrigen Angriffs des jeweiligen Landes, das er repräsentiert,
  ein falsches Signal der Normalität sendet und wann nicht? Sie vergleichen hier Sachen,
  die man nicht miteinander vergleichen kann. Deswegen kann ich darauf auch keine
  Antwort geben. Können Sie mir trotzdem sagen, was der Unterschied ist? Ist es eine
  völkerrechtliche Bewertung oder die Tatsache, dass die zwei anderen genannten Außenminister
  zu Partnern Deutschlands zählen? Der reine Befund, ein völkerrechtswidriger Angriffskrieg,
  steht in beiden zur Disposition. Deswegen wäre es schon interessant zu sagen: Wieso
  ist das Foto mit diesem Vertreter legitim und mit diesem nicht? Sie haben mich hier
  auf eine Aussage des Außenministers angesprochen. Ich glaube, der Außenminister
  hat sich relativ klar geäußert. Das können Sie vielleicht noch einmal in der Gesamtheit
  nachlesen. Dem habe ich jetzt nichts hinzuzufügen. Das Foto hätte für eine Normalität
  gesprochen, die es mit Russland nicht geben kann. Die Frage geht ans Verteidigungsministerium.
  Herr Swistek, der „SPIEGEL“ meldet, der neueKampfhubschrauber könne zwar fliegen,
  aber nicht schießen. Das klingt schon mal sehr interessant. Können Sie sagen, woran
  das liegt und bis wann man da abhilft? Grundsätzlich kommentieren wir ja Medienberichterstattung
  nicht. Ich kann Ihnen aber zu dem konkreten Projekt sagen, dass uns Probleme, Verzögerungen
  durchaus bekannt sind. Wir sind auch mit dem Bundesrechnungshof dazu in einem engen
  Austausch. Wir haben einen Zeitplan für die Beschaffung, Bereitstellung, die wir
  mit allen beteiligten Stellen abstimmen. Entscheidend für die Beschaffung ist letztendlich,
  dass wir einen signifikanten Fortschritt bei der Bereitstellung der Fähigkeiten
  sehen müssen. Wir sehen derzeit ganz klar die Industrie in der Bringschuld. Dementsprechend
  würde ich Sie bitten, falls Sie weitere Detailfragen dazu haben, sich an die Industrie
  zu wenden. Ich habe tatsächlich eine weitere Detailfrage. Der „SPIEGEL“ meldet,
  es gehe um Munition, die nicht beschafft werden könne. Stimmt das? Das deckt sich
  mit unseren bekannten Informationen, ja. Können Sie ein bisschen genauer sagen,
  worum es bei der Munition geht? Die Munition kann also nicht eingesetzt werden?
  War es eine Fehlproduktion? Sie passt nicht in den Hubschrauber, oder worum geht
  es? Diese technischen Details liegen mir in der Tat nicht vor. Herr Kornelius, die
  russische Eishockeymannschaft darf laut dem Urteil des CAS an der WM 2027 teilnehmen.
  Wie beurteilen Sie die Entscheidung des CAS? Welche sicherheitspolitischen Konsequenzen
  sehen Sie, beispielsweise für eine Visa-Vergabe? Die Bundesregierung sieht die Entscheidung
  des Internationalen Sportgerichtshofs sehr kritisch. Der Deutsche Eishockeybund
  und die Internationale Eishockey-Föderation haben angekündigt, das Urteil und die
  Begründung jetzt sorgfältig auszuwerten. Die möglichen Folgen, auch auf die Eishockey-WM
  2027 in Deutschland, wird die Bundesregierung nun mit dem Deutschen Eishockeybund
  diskutieren. Das wird sehr zeitnah geschehen. Allgemein möchte ich anmerken: Seit
  Beginn des völkerrechtswidrigen Angriffskrieges Russlands gegen die Ukraine setzt
  sich die Bundesregierung im Kreis der Schengen-Mitglieder für eine einheitlich restriktive
  Visumspolitik gegenüber Russland ein. Gerade nach dem Leipzig-Zwischenfall haben
  wir das noch einmal verstärkt. Diese Leitlinien werden uns auch bei der Entscheidung
  in diesem Fall leiten. Eine Frage an das Verkehrsministerium: Stichwort sind sogenannte
  Handyblitzer , also nicht Geschwindigkeitsblitzer, sondern Kameras, die schauen,
  ob Menschen am Steuer telefonieren. Trifft es zu, dass es Bemühungen von Bund und
  Ländern gibt, dazu eine bundeseinheitliche gesetzliche Grundlage zu schaffen? Falls
  ja, könnten Sie den Stand mitteilen? Vielen Dank für die Frage. Das BMV steht einer
  Schaffung einer bundesgesetzlichen Regelung im Straßenverkehrsgesetz offen gegenüber.
  Wir teilen die Ansicht, dass eine moderne Überwachungstechnologie ein erhebliches
  Potenzial zur Verbesserung der Regelbefolgung hat und damit zur Erhöhung der Verkehrssicherheit
  beitragen kann. Ich bitte Sie aber zum jetzigen Zeitpunkt um Verständnis, dass ich
  noch nicht weitere Details nennen kann. Arbeitet man jetzt schon an einem möglichen
  Gesetz? Oder wird das Thema erst einmal grundsätzlich evaluiert? Das Thema ist auch
  erst kürzlich im Rahmen der Verkehrsministerkonferenz debattiert worden, auf der
  dieses Thema aufgegriffen wurde. Es gab eine Pilotierung dieser Handyblitzer, die
  es schon in Rheinland-Pfalz gibt, die durchweg positiv aufgenommen wurde. Da geht
  man jetzt weiter. Wir prüfen jetzt, inwiefern eine bundeseinheitliche Regelung sinnvoll
  ist. Deswegen bitte ich um Verständnis, dass ich die weiteren Schritte noch nicht
  vorwegnehmen kann. Meine Frage geht ans BMI. Es kursieren derzeit mehrere Videos,
  datiert auf letzte Woche, die Einsatzwagen der deutschen Bundespolizei mitten auf
  polnischem Staatsgebiet auf der Schnellstraße S8 in der Nähe von Łódź zeigen, rund
  150 Kilometer von Warschau entfernt. Da würde mich interessieren: Kann das Bundesinnenministerium
  den Einsatz der Bundespolizei in Polen im Verlauf des Monats Oktober bestätigen?
  Wenn ja, was war der Grund? Dazu liegen mir keinerlei Erkenntnisse vor. Zumindest
  in polnischen Netzwerken wird das auch im Kontext der ganzen Vorfälle um das Verfassungsgericht
  debattiert. Da würde mich interessieren: Können Sie ausschließen, dass deutsche
  Beamte, Fahrzeuge oder andere Art von Ausrüstung im Zusammenhang mit den aktuellen
  Vorgängen am polnischen Verfassungsgericht, was die dortigen Versammlungen und deren
  Absicherung angeht, eingesetzt worden sind? Das können Sie vollumfänglich dementieren?
  Habe ich das Ja so richtig gedeutet? Eine Frage ans Justizministerium zum Referentenentwurf
  gegen verbale sexuelle Belästigung ; der wurde heute vorgelegt. Was sind darin genau
  die Eckpunkte, und können Sie ein konkretes Beispiel nennen, für welchen Fall das
  gilt ‑ also das Pfeifen, die verbale Äußerung, was auch immer? Könnten Sie das bitte
  konkretisieren? Das Bundesministerium der Justiz hat heute einen Gesetzentwurf veröffentlicht,
  der sich mit sexuellen Übergriffen befasst, nicht ausschließlich mit verbalen sexuellen
  Übergriffen, sondern auch mit körperlichen sexuellen Übergriffen. Dabei geht es
  um längere Verjährungsfristen für die Verfolgung von Vergewaltigungen und höhere
  Mindeststrafen für besonders schwere Fälle von Vergewaltigung. Gleichzeitig enthält
  der Gesetzentwurf auch den Vorschlag für eine neue Strafvorschrift zu verbaler sexueller
  Belästigung. Der Vorschlag lautet, quasi einen neuen Absatz in der Strafvorschrift
  über sexuelle Belästigung aufzunehmen. Es geht dabei um sexuelle Belästigungen,
  die geeignet sind, einzuschüchtern oder zu bedrängen. Das ist eine wichtige Qualifikation.
  Es geht um die Schaffung von Situationen, die für die Betroffenen einschüchternd
  oder bedrängend sind. Einen konkreten Fall nennt der Gesetzentwurf auch als Begründung.
  Das geht zurück auf eine Entscheidung des Bundesgerichtshofs vor einigen Jahren.
  Da hat ein älterer Mann ein jüngeres Mädchen spazierend gehend verfolgt und in dem
  Zusammenhang geäußert ‑ ich möchte die Äußerung jetzt nicht wörtlich wiedergeben ‑,
  er würde ihr gerne an das Geschlechtsteil fassen. Das ist ein Beispiel ‑ ich denke,
  das kann man so ganz konkret sagen ‑ für eine verbale sexuelle Belästigung, die
  zugleich eine einschüchternde oder bedrängende Situation schafft. All dem, was nun
  sonst kolportiert wird, dass sozusagen das missglückte Kompliment oder der etwas
  dümmliche Anmachspruch ein Fall für den Staatsanwalt sei, kann man mit dem Verweis
  auf den konkreten Wortlaut dieser Gesetzesvorschrift entgegentreten. Meine Frage
  geht ans Auswärtige Amt. Deutschland hat seit 2002 die UN-Resolution , die das US-Embargo
  gegen Kuba verurteilt und zu deren Aufhebung aufruft, unterstützt und dieser zugestimmt,
  zuletzt am 29. Oktober 2025. In diesem Jahr hat sich die Bundesregierung zum ersten
  Mal seit über zwei Jahrzehnten enthalten, dies, obwohl enge EU-Partner wie Frankreich,
  Spanien oder auch andere Partner wie Kanada und Großbritannien dem zugestimmt haben.
  Da würde mich interessieren: Was hat sich denn seit vergangenem Jahr an der Bewertung
  der Bundesregierung bezüglich des Embargos geändert, und hält die Bundesregierung
  die extraterritoriale Wirkung der US-Sanktionen, die die Resolution schon immer
  kritisiert, nicht mehr für völkerrechtswidrig? Dazu gibt es eine gemeinsame Erklärung
  der EU-27, in der auch die unterschiedlichen Abstimmungsmodi erläutert werden. Auf
  die würde ich Sie gerne verweisen. Zahlreiche Länder haben von einem massiven Lobbyversuch
  der USA berichtet, sich bei dieser Abstimmung zu enthalten oder auch den Saal zu
  verlassen. Der kubanische Außenminister hat ein entsprechendes Dokument vorgelegt,
  das an alle US-Botschaften ging. Da würde mich interessieren: Hat die US-Regierung
  die Bundesregierung vor besagter UN-Abstimmung in schriftlicher oder mündlicher
  Form aufgefordert, der Resolution nicht zuzustimmen, ja oder nein? Sie wissen ja,
  wie wir das mit vertraulicher diplomatischer Kommunikation so halten, mit welchem
  Partner auch immer. Dazu würde ich mich ganz grundsätzlich nicht einlassen. Wie
  gesagt: Die Gründe, die für dieses Abstimmungsverhalten gesprochen haben, sind in
  dieser gemeinsamen EU-Erklärung dargelegt. Auf die würde ich Sie gerne verweisen.
  Aber Sie können auch jetzt ganz kurz hier öffentlich machen, was dazu geführt hat,
  dass man sich seit über 20 Jahren bei der Abstimmung erstmals enthält. Ich kann
  Sie gerne auf das hinweisen, was ich gerade schon gesagt habe, nämlich: Das steht
  alles geschrieben. Das können Sie nachlesen. Eine Lernfrage: Die jetzt von der US-Administration
  genehmigten 500 Patriots an die Ukraine werden ja bezahlt, unter anderem von Europa
  und Kanada. Wie erfolgt die Bezahlung ‑ gegen Vorkasse oder bei Lieferung, die ja
  erst in einigen Jahren erfolgen wird? Ich kann für das BMVg sagen, dass ich jetzt
  nicht in den Details finanzieller Transaktionen stecke. Sie haben es richtig erwähnt:
  Das wird aus zwei verschiedenen Bereichen bezahlt, über das Programm „Jumpstart“
  und den EU-Supportlohn. Vielleicht können Sie es nachliefern. Das Verfahren muss
  ja irgendwo dokumentiert sein. Dann wüsste ich noch gern: Wie hoch ist der direkte
  deutsche Anteil und der über die EU an dem Volumen, das ja für die 500 Patriots
  insgesamt, glaube ich, 1,8 Milliarden beträgt? Zu den Details unserer Beteiligung
  werden wir uns nicht äußern. Es ist eine grundsätzliche Entscheidung, dass wir uns
  den Details der Unterstützungsleistungen nicht äußern.'
