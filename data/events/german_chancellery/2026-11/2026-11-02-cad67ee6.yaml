date: '2026-11-02'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 2. November 2026
text: '(Vorsitzende Wefers eröffnet die Pressekonferenz und begrüßt StS Kornelius
  sowie die Sprecherinnen und Sprecher der Ministerien.) Vielleicht fange mit etwas
  an, das wir schnell wegdrücken können, mit der BPA-Jahresakkreditierung . Ein technischer
  Hinweis für alle Journalistinnen und Journalisten: Die BPA-Jahresakkreditierung
  für 2027 kann ab sofort bis zum 17. Dezember 2026 online beantragt werden. Sie kennen,
  glaube ich, das Portal www.akkreditierung.bundesregierung.de. Die Voraussetzungen
  für den Antrag finden Sie in der Pressemitteilung, die wir auch gerade veröffentlicht
  haben, oder auch auf dieser Landingpage. Die Ausgabe der Akkreditierungen wird dann
  vom 4. Januar bis zum 5. Februar 2027 in Berlin und Bonn stattfinden. Dazu gibt
  es vermutlich keine Frage. Es sieht nicht so aus, als ob es dazu Fragen gäbe. Dann
  jetzt ein paar Worte zu den Demonstrationen am Wochenende : Die Bundesregierung
  nimmt die Sorgen und die Forderungen der jungen Menschen sehr ernst. Die politischen
  Anliegen werden in der Bundesregierung gespiegelt und selbstverständlich auch intensiv
  diskutiert und behandelt. Der Bundeskanzler hat zur Kenntnis genommen, dass eine
  sehr große Zahl junger Menschen friedlich demonstriert hat. Er stellt fest, dass
  sich die Botschaft der jungen Leute mit der Botschaft deckt, die er auch seit Monaten
  wiederholt. Sie wissen, dass der Bundeskanzler in seinen Reden immer wieder sagt,
  dass die Bundesregierung besonders der jungen Generation neue Chancen eröffnen möchte.
  Die Bundesregierung arbeitet deswegen in allen politischen Bereichen daran, den
  jungen Menschen eine Perspektive zu eröffnen. Ganz besonders ist das beim Fall der
  Renten zu sehen, aber auch in der Frage des Haushalts, der Sicherheit und der Gesundheit.
  Stabile Staatsfinanzen sind die Voraussetzung dafür, quasi das Fundament, dass die
  junge Generation auch ihren Wohlstand aufbauen kann. Bundesministerin Prien hat
  eine Vertiefung des Gesprächs angekündigt. Das ist der richtige Weg. Der Bundeskanzler
  unterstützt diesen Weg. Vielleicht noch ein Wort zu den Gewaltausbrüchen, die wir
  auch gesehen haben: Ich hatte vorhin gesagt, dass der Bundeskanzler festgestellt
  hat, dass sehr viele junge Menschen friedlich demonstriert haben. Diese Friedfertigkeit
  ist dann im Laufe des Abends gekippt. Der Innenminister hat die Lage umfassend dargestellt.
  Der Bundeskanzler schließt sich dieser Einschätzung an. Der Gewaltausbruch am Ende
  des Tages wird auf das Schärfste verurteilt. Gewaltexzesse haben in unserem Land
  nichts verloren. Die Polizei hat darauf zu Recht mit aller Härte reagiert. Der Bundeskanzler
  hat der Polizei und den Einsatzkräften gedankt, die die Lage auch sehr schnell wieder
  beruhigt haben. Die Situation wird die Bundesregierung jetzt weiter beschäftigen,
  natürlich vor allem inhaltlich. Wie gesagt, das Gespräch durch die Fachministerin,
  aber auch durch den Bundeskanzler wird gesucht. Der Bundeskanzler wird sich heute
  Abend auch am Rande der Kreisvorsitzendenkonferenz der CDU/CSU äußern. Aber die
  Kernaussagen habe ich Ihnen hier wiedergegeben. Sind Sie auch mit der Auswahl der
  Wörter „migrantische Chaoten“ einverstanden, oder ist die Bundesregierung damit
  einverstanden? Ich habe gesagt, dass der Bundeskanzler die Gewaltausbrüche verurteilt
  hat, dass er Gewalt als Mittel der politischen Auseinandersetzung natürlich verurteilt.
  Der Innenminister hat die Lage umfassend dargestellt, und der Bundeskanzler schließt
  sich der Einschätzung des Innenministers an. Ist Ihnen oder dem Bundesminister aber
  nicht bewusst, dass man, wenn man so ein Wort wählt, alle Leute mit Migrationsbiografie
  unter Generalverdacht stellt? Ich würde Ihrem Urteil widersprechen. Das ist eine
  Aussage, die sich auf die Ereignisse an dem Abend bezieht und nicht in der Breite
  getroffen wurde, in der Sie es gerade darstellen. Herr Kornelius, Sie haben jetzt
  schon zweimal deutlich gemacht, dass sich der Bundeskanzler den Aussagen des Innenministers,
  von Herrn Dobrindt, anschließt. Ich würde da gerne noch einmal nachhaken, auch in
  Bezug auf das, was die Kollegin gefragt hat. Er sprach von einem „migrantischen
  Milieu“ und „migrantischen Chaoten“, zusätzlich zu gewaltbereiten linken Gruppen.
  Können Sie einmal sagen, wie Sie dieses migrantische Milieu definieren und was Sie
  konkret damit meinen? Vor allem habe ich zweimal festgestellt, dass ein Großteil
  der jungen Menschen friedlich demonstriert hat, dass der Bundeskanzler das gewürdigt
  hat, dass er die inhaltlichen Positionen aufnimmt, sie zum großen Teil teilt und
  dass er dies auch in seinen bisherigen Reden sehr, sehr oft gesagt hat. Das ist
  die Kernaussage des Bundeskanzlers. Anschließend hat er sich der Analyse des Innenministers
  angeschlossen. Aber, noch einmal, die Hauptbotschaft ist, dass der Großteil der
  Demonstrationen friedfertig verlief. Viele 10 000 junge Menschen haben friedlich
  demonstriert, und wenn einige Hundert anschließend nicht friedlich demonstrieren,
  dann sollten wir hier die Proportionalität nicht verschwimmen lassen, sondern das
  würdigen. Der Großteil der Demonstrationen war friedlich. Deswegen gibt es jetzt
  keinen Grund, auf wenige Chaoten mit dieser großen Aufmerksamkeit zu reagieren.
  Wonach ich frage, würde ich gerne selbst festlegen. - Mir geht es aber tatsächlich
  genau um diese Gruppe, die ja jetzt doch sehr prominent angesprochen wurde, auch
  von Ihnen und von dem Innenminister. Ich würde gerne trotzdem noch einmal nachzuvollziehen
  versuchen, wer eigentlich gemeint ist. Vielleicht könnte auch Frau Kock aushelfen
  und einfach sagen, ob man sagen kann, dass überwiegend Menschen ohne deutschen Pass
  festgenommen wurden. Was sind das für Zahlen? Ich versuche also, zu verstehen, wen
  Sie hier als Gruppe ausgemacht haben, von der ‑ neben linken Gruppen, die Sie ja
  benannt haben ‑ die Gewalt ausging. Ich glaube, das Lagebild hat das Bundesinnenministerium
  am Laufe des Sonntags und des Samstags am besten im Blick gehabt. Der Innenminister
  hat sein Urteil aufgrund des Lagebilds und aufgrund der Sachkenntnis gefällt, und
  insofern vertraut der Bundeskanzler dem Innenminister in seiner Beurteilung. Aber
  vielleicht kann das Innenministerium das unterfüttern. Ich kann mich da noch einmal
  anschließen und vielleicht ein bisschen erläutern, wie so ein Bild entsteht, auch
  so ein Lagebild. Sie wissen ja: Wir haben ein föderales System. Für Versammlungen
  wie auch für die Polizei sind in erster Linie die Länder zuständig. Unsere Kollegen
  von der Bundespolizei haben das gerade an diesem Wochenende bundesweit auch sehr
  breit unterstützt. Solche Lagebilder speisen sich aus Beobachtungen vor Ort. Vielleicht
  noch einmal zur Klarstellung: Der Minister sprach von gewaltbereiten linken Gruppen
  und Chaoten aus dem migrantischen Milieu. Wie Herr Kornelius auch schon gesagt hat,
  ist das keine Verallgemeinerung. Wird dieses Lagebild von der gesamten Bundesregierung
  geteilt? Wenn ich mich richtig entsinne, hat der Bundesverteidigungsminister gesagt,
  er könne das, was Herr Dobrindt da geäußert hat, nicht erkennen. Vielleicht kann
  sich Herr Swistek dazu äußern. Ich sage: Bezüglich der Äußerungen des Bundesministers
  lassen wir uns grundsätzlich nicht ein. Die stehen für sich, die brauchen wir nicht
  zu kommentieren. Wer sich das gestern angehört hat, weiß: Die waren klar und deutlich.
  Da bedarf es auch keiner weiteren Einordnung. Das heißt, die Einschätzungen von
  Herrn Dobrindt und Herrn Pistorius sind uneinheitlich, richtig? Ich habe meine Aussage
  gemacht. Das Statement des Ministers steht für sich. Ich glaube, Sie werden jetzt
  mit Ihrer versuchten Zuspitzung auch der Differenzierung des Verteidigungsministers
  nicht gerecht. Ich glaube also wirklich, dass es sich lohnt, das in der Gänze zu
  sehen. Noch einmal: Es geht darum, dass es eine große, große Zustimmung zu friedlichen
  Demonstrationen gibt, auch Unterstützung dafür, sich politisch im Zuge des Demonstrationsrechts
  zu äußern und Gewalt abzulehnen. In der Form sind sich alle einig, und so hat sich
  auch der Bundesverteidigungsminister sehr klar geäußert. Für das Lagebild obliegt
  dem Innenministerium die Zuständigkeit, und es hat sich dazu geäußert. Es geht ja,
  glaube ich, jetzt nicht unbedingt um Zuspitzung, sondern um Erklärung von politischen
  Debatten, die anlaufen. Deswegen stelle ich noch einmal eine Frage an Frau Dr. Kock.
  Könnten Sie einordnen, was das Innenministerium denn unter dem Begriff „migrantisches
  Milieu“ versteht? Gehören dazu auch Menschen, die hier in dritter Generation leben
  bzw. einen deutschen Pass haben? Können die auch aus dem migrantischen Milieu kommen,
  oder wie ist das zu verstehen? Ich glaube nämlich, auch Herr Pistorius hat sich
  in diesem Zusammenhang im weitesten Sinne geäußert, und diese politische Debatte
  haben wir ja. Ich glaube, dafür gibt es allgemein verfügbare Definitionen, auch
  aus dem sozialwissenschaftlichen Bereich. Dazu gibt es Forschung. Darunter sind
  Personen mit Migrationshintergrund zu verstehen. Das heißt also auch, wenn ich das
  richtig verstanden habe, dass es um Menschen bis in die dritte Generation hinein
  geht. Das ist ja auch ein Migrationshintergrund. Ich möchte mich jetzt nicht auf
  eins, zwei, drei, vier, fünf, sechs, sieben Generationen festlegen. Bis zur siebten
  habe ich nicht gefragt, sondern nur bis zur dritten. Ich sage: Personen mit Migrationshintergrund.
  Da schließe ich direkt an, weil das auch meine Frage gewesen wäre. So ganz verstehe
  auch ich es nicht. Wir wollen ja sprachlich präzise bleiben. Ich will also einfach
  nur wissen: Ab wann verwendet man diesen Begriff „migrantisches Milieu“? Es muss
  ja irgendwie eine Einordnung geben. Sind das Menschen, die zugewandert sind, die
  erste Generation, die zweite Generation? Irgendwann muss es ja aufhören, weil das
  ganze Ruhrgebiet aus migrantischen Milieus besteht, die irgendwann einmal nach Deutschland
  eingewandert sind. Darauf bezieht sich, glaube ich, auch die Frage des Kollegen
  Blank. Meine wäre es auch. Wo ist da die Grenze? Sonst kann man immer von „migrantischen
  Milieus“ sprechen. Das bezieht sich auf Frau Kock. Ich glaube, wir haben jetzt ausführlich
  über das Thema gesprochen. Frau Kock hat das definiert. Es ist eine breit gefasste
  Definition, die sich aus den Beobachtungen der Ermittlungsbehörden und der Einsatzkräfte
  vor Ort speist und die sich auch mit dem Bildmaterial deckt, das viele gesehen haben,
  ohne dass die Bundesregierung jetzt eine Quantifizierung oder eine Konkretisierung
  vornehmen kann und will. Es ist eine Feststellung, die durch die Erkenntnisse gedeckt
  ist, die wir zu diesem Zeitpunkt haben, die allerdings auch vor allem den Kern hat,
  auf die Unzulässigkeit von Gewalt hinzuweisen. Ich möchte das noch einmal machen,
  unabhängig davon, von wem Gewalt ausgeht: Sie ist nicht Teil unserer Gesellschaft,
  sie wird von der Gesellschaft verurteilt, sie wird von den Strafverfolgungsbehörden
  bzw. von den Polizeikräften mit aller Härte verfolgt, und es wird ihr die Kraft
  des Gesetzes entgegengesetzt. Das ist die Botschaft, die die Bundesregierung an
  diesem Tag hat. Wenn ich noch einmal nachfragen darf, würde ich trotzdem ganz gerne
  darauf beharren. Vielleicht können Sie das auch nachliefern. Ich weiß es einfach
  nicht. Wo gibt es da eine Grenze, ab der man nicht mehr davon redet, dass Menschen
  einem migrantischen Milieu angehören? Das wäre doch für unsere Berichterstattung
  auch wichtig. Es geht gar nicht darum, ob das Gewalttäter sind und was der erste
  Eindruck ist, sondern darum, wie man diesen Terminus verwendet, weil der natürlich
  eine politische Bedeutung hat. Das kann ich gerne versuchen. Ich kann mich aber
  auch Herrn Kornelius nur noch einmal anschließen. Es war weitgehend friedlich, und
  es ist darunter keine Verallgemeinerung zu verstehen. Es geht nicht um migrantische
  Milieus insgesamt. Es geht um einzelne Personen, auch einzelne Personen aus der
  linken Szene. Es geht auch nicht um die gesamte linke Szene. Es sind einzelne Personen,
  deren Verhalten hier aus dem Ruder gelaufen ist und einfach zu massiven Ausschreitungen
  geführt hat – teilweise, auch nicht in allen Städten, in denen Demonstrationen stattfanden.
  Mir fehlt auch, Frau Dr. Kock, ein bisschen die Konkretisierung. Ich frage mich,
  welche Erkenntnisse Herr Dobrindt zum Zeitpunkt seiner Aussage vorlagen, als er
  „migrantische Chaoten“ gesagt hat? Ihm lagen zu dem Zeitpunkt seiner Aussage Erkenntnisse
  aus den Ländern vor, die an uns gemeldet werden. Das geschieht nicht im Rahmen eines
  festen Meldesystems. Die Länder sind auch nicht verpflichtet, uns Erkenntnisse zu
  melden. Aber es haben sich eben Länder bei uns gemeldet und Erkenntnisse mitgeteilt.
  Das sind die Länderpolizeien über ihre Lagezentren, die konkret vor Ort auf der
  Straße sind, die die friedlichen Demonstrationen schützen ‑ auch das möchte ich
  hier gerne noch einmal betonen ‑ und die eben gegen Gewalttäter und Straftäter vorgehen.
  Dass friedlich demonstriert wird, wissen wir ja, aber die Debatte dreht sich ja
  um die, die nicht friedlich demonstriert haben. Ich bin auch eine deutsche Staatsangehörige
  mit Migrationshintergrund. Ich frage mich: Was würde in meinem Fall eine Rolle spielen,
  meine Staatsangehörigkeit oder mein Migrationshintergrund? Mir fehlen von diesem
  Wochenende Zahlen dazu, die von irgendjemandem vorgelegt werden, wie viele der bislang
  identifizierten Tatverdächtigen deutsche Staatsangehörige und wie viele nichtdeutsche
  Staatsangehörige waren. Soweit ich weiß, ist es nämlich bei den Polizeiermittlungen
  so, dass man zwischen Nichtdeutschen und Deutschen unterscheidet. Was ist also dieser
  Migrationshintergrund? Ich habe ganz konkret nach den Zahlen gefragt, weil wir unsere
  Arbeit ja auf Fakten basieren. Wo sind die Zahlen hinsichtlich dieser Tatverdächtigen,
  und was ist die Unterscheidung zwischen Nichtdeutschen und Deutschen? Verfügt die
  Bundesregierung über diese Zahlen? Noch einmal zu Ihrem letzten Satz: Die Polizei
  differenziert bei ihren Ermittlungen nicht zwischen deutschen und nichtdeutschen
  Tatverdächtigen. Das möchte ich ‑ ‑ ‑ Die Polizei ermittelt unabhängig von der Staatsangehörigkeit
  von Straftätern. In der polizeilichen Statistik werden Deutsche und Nichtdeutsche
  separat ausgewiesen; das ist richtig. Das hat aber nichts mit den Ermittlungen der
  Polizei zu tun. Bezüglich der Zahlen vom jetzigen Wochenende bitte ich um Verständnis,
  dass uns diese noch nicht vorliegen. Uns liegen auch noch keine abschließenden Zahlen
  über Festnahmen und Ähnliches vor. Zu einem anderen Aspekt des Themas, Herr Kornelius:
  Könnten Sie konkretisieren, welche Anliegen der Demonstranten die Bundesregierung
  jetzt für die eigene Arbeit mitnimmt? Ich hatte ja darauf hingewiesen, dass der
  Bundeskanzler in vielen, vielen Reden und in seiner Arbeit immer wieder betont,
  dass das Ziel der Reformen zum Beispiel die Verbesserung der Lebensverhältnisse
  oder der Zukunftsaussichten der jungen Generation sind. Das bezieht sich vor allem
  auf die Arbeit in der Rentenpolitik. Das bezieht sich auf die Frage eines stabilen
  und konsolidierten Haushalts. Das bezieht sich auf die Frage, die Lebenshaltungskosten
  zu senken. Der Bundeskanzler wird auch in seiner heutigen Rede einräumen, dass es
  Defizite gibt, die natürlich erkannt worden sind. Die Bundesregierung ist sehr stark
  im Wohnungsbau engagiert, so mit dem Bau-Turbo oder jetzt mit dem Gebäudetyp E,
  der das Bauen einfacher und schneller und kostengünstiger machen soll. Das sind
  alles Themen, die auch auf die legitimen Forderungen und Proteste der jungen Generation
  einzahlen. Es geht um das Thema der Sicherheit. Ein Thema, das die jungen Menschen
  umtreibt, ist zum Beispiel die Wehrpflicht. Die Bundesregierung wirbt dafür, dass
  die Verteidigung des Landes ja genau dem Ziel dient, einen Konflikt zu verhindern.
  Eine Abschreckungsfähigkeit der deutschen Bundeswehr soll ja gerade dazu führen,
  dass dieses Land in keinen Krieg verwickelt wird. All das sind Ziele, die die Bundesregierung
  auch vermitteln möchte, und Fragen, die von der jungen Generation gestellt werden.
  Der Bundeskanzler hat wirklich sehr, sehr viele Male betont, dass es sein oberstes
  Anliegen ist, dieses Land so zu übergeben, dass die jungen Leute eine Zukunftschance
  haben, dass sie ein Recht auf einen eigenen Wohlstand haben, den sie sich erarbeiten,
  und dass wir die Voraussetzungen dafür schaffen, dass auch der Übergang der Generationen,
  der demografisch in dieser Zeit nicht ganz leicht ist, positiv wirkt. Das klingt
  jetzt ein bisschen so, als ob der Kanzler nur noch einmal betonen will, was er ja
  sowieso schon tut. Gibt es jetzt aber auch einen Punkt, an dem die Proteste den
  Kanzler vielleicht zum Umdenken gebracht haben? Der Bundeskanzler fühlt sich darin
  bestärkt, dass seine Politik fortgesetzt wird. Das sind Themen, die ja wirklich
  auch ein legitimes Anliegen sind. Nehmen Sie das Thema der Rente. Wenn ein Generationenkonflikt
  von den jungen Leuten thematisiert wird, dann doch in der Hinsicht, dass jetzt eine
  Generation in das Rentenalter und möglicherweise auch in eine stärkere medizinische
  Bedürftigkeit eintritt, die die junge Generation perspektivisch überlasten wird,
  weil, demografisch betrachtet, diese Generationengruppe nicht mehr die Lasten der
  jetzt Älteren schultern kann. Deswegen gibt es die Reform des Gesundheitssystems
  und des Rentensystems. Das sind ganz zentrale Steuerungspunkte in den sozialen Sicherungssystemen,
  die diese Bundesregierung vorantreibt. Frau Kock, das ist ja nicht das erste Mal,
  dass Minister Dobrindt dieses Wording verwendet hat. Vor zwei Wochen, am 19. Oktober,
  sagte er in identischer Wortwahl in Bezug auf die Ausschreitungen in Frankreich,
  es sei ein linksextremes und, wörtlich, migrantisches Milieu, das sich da auf der
  Straße treffe. Wenn man Frankreich und Deutschland hinsichtlich der Ausschreitungen
  jetzt nicht gleichsetzen will, warum nutzt man dann einen solchen Begriff, der in
  seiner Unschärfe einfach einen Generalverdacht für alle Menschen bedeutet, die mit
  einem Migrationshintergrund nach Deutschland gekommen sind? Dazu würden dann übrigens
  auch der amtierende Ministerpräsident Baden-Württembergs und Polizeibeamte gehören,
  die dem migrantischen Milieu entstammen. Warum? Also noch einmal: Der Minister hat
  nicht von „dem migrantischen Milieu“ gesprochen, sondern von Chaoten aus dem migrantischen
  Milieu. Das ist dann doch ein Unterschied, finde ich. Der Minister hat das migrantische
  Milieu als den Pool genannt, den Ursprungszusammenhang, aus dem dann Einzelne entsprungen
  sind, und die Benennung eines Ursprungszusammenhangs als Quelle für Unruhen ist
  eine Zuschreibung. Wird sich denn der Minister oder wird sich der Bundeskanzler
  mit Vertretern zum Beispiel der Studierenden, die, wie Sie sagen, berechtigte Anliegen
  vorbringen, treffen? Das könnte ja auch ein Krisengipfel sein. Der Minister ist
  Bundesinnenminister und nicht Bundesbildungsminister. Von daher sehe ich da jetzt
  nicht genau unsere Zuständigkeit. Das andere weise ich von mir. Das ist Ihre Interpretation.
  ( ohne Mikrofon, akustisch unverständlich ) Ach so, das war hier nicht angekommen,
  Entschuldigung. Nach welchem Teil fragen Sie jetzt? Die Frage war, ob der Bundeskanzler
  ein Gespräch mit Vertretern von Menschen, die sozusagen existenzielle Sorgen haben,
  plant, wenn man so will, einen sozialen Krisengipfel. Ich glaube, genau ist dieser
  Kreis schwer ( akustisch unverständlich ). Der Bundeskanzler hat häufig Kontakte
  mit der jungen Generation. Sie wissen, dass er kürzlich den Bundesjugendring empfangen
  hat. Er hat immer wieder Schüler und Schulgruppen und junge Leute in verschiedenen
  Gruppierungen zu Besuch. Er stand bei der Verleihung des Schulpreises noch mit jungen
  Leuten in Kontakt. Ich glaube, er ist sogar dankbar für jeden Kontakt, den er mit
  jungen Leuten hat. Künftige Termine werden geprüft. Es gibt Möglichkeiten, auch
  in den nächsten Wochen und Monaten, dass man Begegnungen organisiert, dass bereits
  bestehende Formate genutzt werden, um das Gespräch zu suchen. Die Bildungsministerin
  hat sich bereits geäußert und gesagt, dass sie das Gespräch intensivieren und fortsetzen
  wird. Ich denke, die Bundesregierung wird diesem Auftrag nachkommen. Frau Kock,
  zum Thema des Milieus: Sie waren ja hier auch schon Ende 2023 Sprecherin des BMI,
  darum passt das ganz gut. Damals hat sich das BMI auf eine Anfrage der AfD, die
  nach „migrantischen Milieus“ gefragt hat, in einer Bundesdrucksache ausdrücklich
  gegen diesen Begriff gewehrt und darauf hingewiesen, dass der nicht zu verwenden
  sei, dass das BMI nicht von fiktiven Milieus ausgehe, sondern nur von konkreten
  Personen. Warum hat sich das seitdem geändert? Der Bundesminister selbst benutzt
  diese Begriffe, die vorher von Ihrem Ministerium gegenüber der AfD abgelehnt worden
  sind. Ich glaube, diese Frage, warum sich das geändert hat, können Sie sich selbst
  beantworten. Weil sich der Minister der AfD angenähert hat? Herr Kornelius, Sie
  meinten zu den Gewaltausbrüchen, dass die Polizei darauf mit aller Härte reagiert
  habe, und gleichzeitig, dass Sie jegliche Gewalt natürlich verurteilen, egal, von
  wem Gewalt ausgeht. Sie werden wahrscheinlich auch die Bilder und Videos am Wochenende
  gesehen haben ‑ ich war live dabei ‑, davon, wie die Polizei gegen Jugendliche Gewalt
  angewendet hat, teils sehr hart. Sie haben selbst davon gesprochen, dass Bilder
  von vor Ort gesehen wurden, und zwar durch Sicherheitskräfte, durch Medien, vielleicht
  durch den Minister selbst, durch Sie. Was sagen Sie dann zu der Polizeigewalt gegenüber
  Kindern, gegenüber Jugendlichen, die nachweislich passiert ist? Mir fehlt die Empirie,
  die Sie haben. Ich war nicht vor Ort. Insofern kann ich mir Ihre Prämisse nicht
  zu eigen machen. Aber wenn Sie davon sprechen, dass Bilder von vor Ort ausschlaggebend
  für Ihre Bewertung des Wochenendes in Bezug auf die sogenannten migrantischen Milieus
  sind, und die Bilder von vor Ort auch nachweislich zeigen, dass Polizeigewalt passiert
  ist ‑ ‑ ‑ Ich habe schon einmal gesagt: Bezüglich solch subjektiver empirischer
  Betrachtungen kann ich Ihnen jetzt keine Antwort geben. Mir ist von Polizeigewalt
  ‑ exzessiver Polizeigewalt ‑ nichts bekannt. Die Polizei verhält sich auch angemessen.
  Sie muss aggressiver Gewalt aufseiten der Demonstranten, die am Abend dann vor allem
  in Frankfurt, in Köln usw. ausgebrochen ist, entgegentreten. Es gibt ein Ordnungsinteresse,
  es gibt ein Sicherheitsinteresse der Bevölkerung und dem wird die Polizei gerechnet.
  Herr Kornelius, Sie hatten noch einmal extra betont, dass sowohl die Bildungsministerin
  als auch der Kanzler ‑ das haben Sie hinterhergeschoben ‑ das Gespräch mit den Protestierenden
  suchen wollen. Da würde mich noch interessieren, und das hat sich mir bisher nicht
  ganz erschlossen: Wie sieht diese Kontaktaufnahme mit den Vertretern der Generation
  Z denn konkret aus, und was ist da schon konkret in der Pipeline? Sie geben mich
  nicht korrekt wieder. Ich habe nicht gesagt, dass sie das Gespräch suchen wollen,
  sondern dass sie das Gespräch bereits führen. Der Bundeskanzler hat immer wieder
  Termine, auch mit jungen Leuten, nicht zwingend mit den Organisatoren dieser Demonstration,
  aber mit jungen Leuten. Es gibt immer wieder Formate wie die Bundesschülerkonferenz
  oder andere Möglichkeiten, die in der Terminplanung des Bundeskanzlers eine Rolle
