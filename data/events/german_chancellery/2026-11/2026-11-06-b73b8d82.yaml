title: Ausstellungen im Bundespresseamt Besondere Einblicke der offiziellen Fotografinnen
  und Fotografen
text: Die ausgestellten Bilder entstanden jenseits des offiziellen Protokolls – aufgenommen
  von den offiziellen Fotografinnen und Fotografen des Presse- und Informationsamtes
  der Bundesregierung. „Ein Bild sagt mehr als 1000 Worte“ – das Bild vom „Kniefall“
  Willy Brandts erscheint sofort in unserer Vorstellung, wenn über die damalige deutsche
  Ostpolitik berichtet wird. Auch das „Hände-Reichen“ von Helmut Kohl und Francois
  Mitterand in Verdun als Symbol für die deutsch-französische Versöhnung oder das
  G7 -Foto mit Angela Merkel und Donald Trump hat sich in unser visuelles Gedächtnis
  eingebrannt. Das sind nur einige Beispiele aus dem umfangreichen Bildarchiv der
  offiziellen Fotografinnen und Fotografen der Bundesregierung. Ihr besonderer Zugang
  zum politischen Geschehen eröffnet Einblicke jenseits des Protokolls, die auch in
  Ausstellungen im BPA gezeigt werden. Wer nicht die Zeit gefunden hat, die Ausstellungen
  im Besucherzentrum anzusehen, kann sich hier noch einmal durchklicken. Seit der
  Gründung des Bundespresseamts 1949 dokumentieren die offiziellen Fotografinnen und
  Fotografen der Bundesregierung das politische Handeln der jeweiligen Regierungen.
  Derzeit begleiten eine Fotografin und drei Fotografen den Bundeskanzler und den
  Bundespräsidenten auf all ihren Terminen – in ganz Deutschland und auch im Ausland.
  Mit möglichst erzählerischen und atmosphärischen Bildern soll Offenheit geschaffen
  und Politik verständlich gemacht werden. Dabei legen sie höchsten Wert auf Nachrichtlichkeit,
  Authentizität und Sachlichkeit. Fast täglich wächst das Bildarchiv mit den Fotografien
  der offiziellen Fotografinnen und Fotografen. Laut Bundesarchivgesetz (BArchG -
  Gesetzt über die Nutzung und Sicherung von Archivgut des Bundes) ist das Bundespresseamt
  verpflichtet, den Bildbestand sukzessiv an das Bundesarchiv zu übergeben. Diese
  rund 1,1 Millionen Fotos sind mit dem Bestand "B 145 Bild" im Bundesarchiv zu erkennen.
  Über die Bundesbildstelle sind Fotos aus der laufenden Legislaturperiode abrufbar.
