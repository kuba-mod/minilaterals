title: Bund und Länder unterzeichnen Finanzierungsabkommen für die Stiftung Preußische
  Schlösser und Gärten – 54,5 Millionen Euro jährlich für den Erhalt von Schlössern,
  Gärten und Kunstsammlungen
text: 'Die Stiftung Preußische Schlösser und Gärten Berlin-Brandenburg (SPSG) erhält
  auch in den kommenden Jahren eine verlässliche Finanzierung. Der Bund sowie die
  Länder Berlin und Brandenburg unterzeichneten heute im Berliner Schloss Charlottenburg
  das neue Finanzierungsabkommen für die Stiftung. Dieses gilt ab dem 1. Januar 2027
  und läuft bis 31. Dezember 2030. Es sichert der SPSG eine jährliche Mindestförderung
  von 54.544.700 Euro, von denen der Bund 22.555.000 Euro, das Land Brandenburg 19.579.100
  Euro und das Land Berlin 12.410.600 Euro trägt. An der feierlichen Unterzeichnung
  nahmen für den Bund Kulturstaatsminister Dr. Wolfram Weimer, für das Land Brandenburg
  Kulturministerin Dr. Manja Schüle sowie für das Land Berlin Kultursenator Stefan
  Evers teil. Dr. Wolfram Weimer, Staatsminister für Kultur und Medien: „Die preußischen
  Schlösser und Gärten erzählen deutsche Geschichte und gehören zu unserem kulturellen
  Gedächtnis. Mit dem neuen Finanzierungsabkommen geben Bund und Länder der Stiftung
  die nötige Sicherheit, dieses einzigartige Erbe zu bewahren. Das ist ein starkes
  Signal: Wir übernehmen gemeinsam Verantwortung dafür, dass die Schlösser und Gärten
  auch künftige Generationen und Besucherinnen und Besucher aus aller Welt begeistern.“
  Dr. Manja Schüle, Ministerin für Wissenschaft, Forschung und Kultur des Landes Brandenburg:
  „Mit dem Aufwuchs für die SPSG bewahren wir Schlösser vor dem Verfall, retten Gärten
  und Parks vor den Auswirkungen des Klimawandels, ermöglichen spannende Ausstellungsprojekte.
  Und, was mir besonders am Herzen liegt: Wir schaffen Lebensqualität für alle – unabhängig
  vom Geldbeutel. Mit dem heutigen Abkommen geben wir der SPSG für weitere vier Jahre
  Planungssicherheit. Und mit zusätzlichen 800.000 Euro sichern wir als Land zudem
  den kostenfreien Zugang zum Park Sanssouci für alle Bürgerinnen und Bürger. Diese
  Gärten wurden einst für Könige angelegt. Heute gehören sie uns allen und wir sorgen
  dafür, dass das so bleibt.“ Stefan Evers, Senator für Kultur und Gesellschaftlichen
  Zusammenhalt des Landes Berlin: „Die Schlösser und Gärten der Stiftung prägen das
  kulturelle Gesicht Berlins und sind zugleich Orte, die Geschichte erfahrbar machen.
  Mit Schloss Charlottenburg, der Pfaueninsel und Schloss Glienicke mit seinem wunderbaren
  Park verfügt unsere Stadt über historische Ensembles von herausragender Bedeutung,
  die jedes Jahr Menschen aus Berlin und aller Welt anziehen. Ihr Erhalt und ihre
  Pflege erfordern langfristige Planung und verlässliche finanzielle Grundlagen. Dass
  Bund, Brandenburg und Berlin diese Verantwortung auch unter schwierigen haushaltspolitischen
  Bedingungen gemeinsam tragen, ist ein wichtiges Bekenntnis zu unserem kulturellen
  Erbe und zur Attraktivität unserer Region.“ Prof. Dr. Christoph M. Vogtherr, Generaldirektor
  der SPSG: „Die Stiftung Preußische Schlösser und Gärten Berlin-Brandenburg ist ein
  sehr erfolgreiches Beispiel der Bund-Länder-Kooperation in der Kulturförderung.
  Wir freuen uns über diese gut funktionierende Partnerschaft. Das Finanzierungsabkommen
  gibt uns Planbarkeit für die kommenden Jahre und ist die Grundlage für die Erhaltung
  und Vermittlung des uns anvertrauten Kulturerbes.“ Die SPSG wurde 1995 durch den
  Staatsvertrag zwischen Berlin und Brandenburg gegründet. Aufgrund ihrer gesamtstaatlichen
  Bedeutung erhält die Stiftung neben den Zuwendungen der beiden Länder auch Mittel
  des Bundes. Im Rahmen des auslaufenden Finanzierungsabkommens (2023 bis 2026) erhält
  die SPSG jährlich rund 48 Millionen Euro. Bis 2030 kommen weitere Mittel von Bund
  sowie den Ländern Berlin und Brandenburg von insgesamt 400 Millionen Euro zur Instanthaltung
  der preußischen Schlösser und Gärten über das Sonderinvestitionsprogramm II hinzu.
  Der SPSG mit ihren mehr als 500 Mitarbeiterinnen und Mitarbeitern obliegt die Präsentation,
  Pflege, Restaurierung und wissenschaftliche Bearbeitung der Kunstsammlungen sowie
  der mehr als 30 Museumsschlösser in Berlin und Brandenburg, von rund 750 Hektar
  Garten- und Parkflächen sowie zahlreicher weiterer Gebäude und baulicher Anlagen.
  Ein Großteil der Stiftungsliegenschaften in Berlin und Potsdam ist seit 1990 UNESCO-Welterbestätte.'
