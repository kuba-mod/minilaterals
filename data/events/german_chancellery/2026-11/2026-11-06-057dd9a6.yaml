title: '37 Jahre Mauerfall - Staatsminister Weimer: „Ein kritisches, wissenschaftlich
  fundiertes Geschichtsbewusstsein ist heute wichtiger denn je“'
text: 'Zum 37. Jahrestag des Mauerfalls warnt Staatsminister für Kultur und Medien,
  Wolfram Weimer, vor Geschichtsrevisionismus und einer Verklärung der SED-Diktatur.
  Wer heute die DDR verkläre, erliege populistischen Vereinfachungen und verhöhne
  die Opfer. Staatsminister Weimer: „Fast drei Jahrzehnte lang war die Berliner Mauer
  das sichtbarste Symbol der brutalen Grenze mitten durch Deutschland und der Unfreiheit
  in der DDR. Ihre friedliche Überwindung hatte welthistorische Bedeutung und ermöglichte
  die Wiedervereinigung Deutschlands am 3. Oktober 1990. Die Schreckensszenarien des
  Kalten Krieges gehörten wenige Jahre später der Vergangenheit an.“ Staatsminister
  Weimer weiter: „Wir verdanken den Mauerfall den mutigen Menschen, die während der
  Friedlichen Revolution im Herbst 1989 in zahlreichen Städten der DDR für Freiheit,
  Demokratie und Menschenrechte auf die Straße gingen. In einer Zeit, in der autoritäre
  Ideen und politische Verlockungen wieder an Einfluss gewinnen, dürfen wir nicht
  vergessen, welche persönlichen Risiken diese Menschen eingingen und wie das wahre
  Gesicht der SED-Diktatur aussah: despotisch, gewalttätig und menschenverachtend.
  Wer heute geschichtsrevisionistische Thesen verbreitet und die DDR nachträglich
  zu einer vermeintlich heilen Welt verklärt, ignoriert bewusst die historischen Fakten
  und verhöhnt die Opfer des DDR-Regimes. Deshalb ist ein kritisches, wissenschaftlich
  fundiertes Geschichtsbewusstsein wichtiger denn je. Es hilft uns, populistischen
  Vereinfachungen entgegenzutreten, den demokratischen Zusammenhalt zu stärken und
  uns den Wert der Freiheit zu vergegenwärtigen.“ Am Abend des 9. November 1989 erzwangen
  die Bürgerinnen und Bürger der DDR mit ihrem friedlichen Protest die Öffnung der
  Grenzübergänge nach West-Berlin. Das scheinbar unüberwindbare Bollwerk der Berliner
  Mauer wurde binnen weniger Stunden durchlässig.'
