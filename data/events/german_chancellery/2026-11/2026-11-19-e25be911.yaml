title: 'Staatsminister Weimer zum vierten weltweiten Religionsbericht: „Religionsfreiheit
  auch in Deutschland verteidigen“'
text: 'Das Bundeskabinett hat gestern den vierten Bericht der Bundesregierung zur
  weltweiten Lage der Religions- und Weltanschauungsfreiheit beschlossen. Der Bericht
  macht deutlich, dass die Religions- und Weltanschauungsfreiheit zunehmend bedroht
  ist. Anlässlich des Berichts betonte Staatsminister für Kultur und Medien Wolfram
  Weimer: „Religions- und Weltanschauungsfreiheit ist ein unveräußerliches Menschenrecht.
  Der aktuelle Bericht der Bundesregierung macht deutlich, dass dieses Recht in vielen
  Teilen der Welt weiterhin eingeschränkt wird und Menschen aufgrund ihres Glaubens
  Diskriminierung und Verfolgung erfahren. Auch Christinnen und Christen sind davon
  betroffen.“ Staatsminister Weimer weiter: „Religionsfreiheit muss für alle Menschen
  gelten – unabhängig davon, welchem Glauben sie angehören. Auch hierzulande müssen
  wir wachsam sein und unsere religiösen Traditionen und die Freiheit, den eigenen
  Glauben zu leben, als Teil unserer gewachsenen Kultur verteidigen. Wenn Jüdinnen
  und Juden aus Sorge vor Anfeindungen nicht mehr mit Kippa auf die Straße gehen können,
  wenn Weihnachtsmärkte vor Attentaten geschützt werden müssen, zeigt das: Auch bei
  uns steht die Freiheit, den eigenen Glauben zu leben, unter Druck. Auch in unserem
  Land müssen wir das jüdisch-christliche Kulturerbe schützen als wichtigen Ankerpunkt
  der Kulturnation Deutschland.“ Den vollständigen 4. Bericht der Bundesregierung
  zur weltweiten Lage der Religions- und Weltanschauungsfreiheit finden Sie hier.'
