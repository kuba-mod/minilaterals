title: Im Wortlaut Pressestatements von Bundeskanzler Merz und Emir Tamim bin Hamad
  Al Thani zum Besuch des Emirs in Deutschland am 20. November 2026
text: 'Bundeskanzler Merz Eure königliche Hoheit, Emir Al Thani, ich heiße Sie sehr
  herzlich willkommen im Bundeskanzleramt. Ich freue mich sehr, dass Sie nach meinem
  sehr erfolgreichen Besuch in Doha am 5. Februar heute in Deutschland zu Gast sind.
  Wir haben uns schon im Februar verabredet, die Partnerschaft zwischen Katar und
  Deutschland zu vertiefen, und daran haben wir heute angeknüpft. Wir wollen eine
  360-Grad-Partnerschaft. Wir Deutsche messen dieser strategischen Partnerschaft große
  Bedeutung zu. In einer Welt, die zunehmend von der Politik großer Mächte bestimmt
  wird und von einer Erosion der internationalen Ordnung geprägt ist, wollen wir ein
  Netz globaler Partner knüpfen. Das ist gut für alle Beteiligten, es dient unserer
  Souveränität, unserer Sicherheit und unserem Wohlstand. Katar ist schon seit langer
  Zeit ein starker Partner Deutschlands, und umgekehrt ist Deutschland schon seit
  langer Zeit ein starker Partner Katars. Wir kommen zusammen gut voran. Unsere Regierungen
  haben jetzt eine ganze Reihe von Vereinbarungen aus den unterschiedlichsten Bereichen
  miteinander getroffen. Wir haben erstens vor, wirtschaftlich noch enger zu kooperieren.
  Bei meinem Besuch in Doha haben wir über eine neue strategische Investition Katars
  in Deutschland gesprochen. Ich freue mich nun über die Ankündigung von katarischer
  Seite, die Investitionen in die deutsche Wirtschaft noch einmal um 15 Milliarden
  Euro zu erhöhen. Das stärkt uns beide gerade in Zukunftstechnologien wie künstlicher
  Intelligenz, Halbleiter und Luftfahrt. Wir wollen zweitens zur Sicherheit und Verteidigung
  enger zusammenarbeiten. Wie wichtig das ist, führt uns der Irankrieg seit Februar
  drastisch vor Augen. Wir sind insbesondere offen für neue Kooperationen in der Verteidigungsindustrie.
  Unsere Sicherheitsbehörden werden sich in der Gefahrenabwehr noch sehr viel enger
  miteinander austauschen. Wir wappnen uns auch gegenseitig gegen Cyberangriffe. Wie
  notwendig das ist, konnten wir in den letzten Tagen und Wochen immer wieder sehen.
  Wir arbeiten drittens diplomatisch enger zusammen. Wir kooperieren zu Entwicklungszusammenarbeit
  und Mediationen im Mittleren Osten und darüber hinaus. Eine gemeinsame Priorität
  hat für uns dabei der Wiederaufbau Syriens. Danke, Königliche Hoheit, für die Einschätzung,
  die Sie mir zu dieser Zusammenarbeit gegeben haben, gerade was Syrien betrifft.
  Wir haben außerdem verabredet, in den Bereichen Sport und Kultur enger zusammenzuarbeiten.
  Schließlich haben wir heute auch über Anstrengungen beraten, den Irankrieg zu beenden.
  Ich habe Emir Al Thani unsere Solidarität versichert. Teherans Angriffe gegen Katar
  und andere Staaten der Region verurteilt die Bundesregierung auf das Schärfste.
  Katar leistet enorme, wertvolle Arbeit als Vermittler zwischen den Konfliktparteien.
  Zu den entsprechenden diplomatischen Anstrengungen stehen unsere Teams des Bundeskanzleramtes
  und auch des Außenministeriums in fast täglichem Austausch. Eine diplomatische Lösung
  bleibt möglich. Sie ist auch unverzichtbar, damit die Region zur Ruhe kommt und
  die Menschen in Katar wieder sicher leben können. Schließlich brauchen auch wir
  Deutsche diese Lösung, weil wir auf bezahlbare und zuverlässige Energie angewiesen
  sind. Zweierlei wird entscheidend sein: Es muss eine dauerhafte, sichere Öffnung
  der Straße von Hormus geben, und Teheran muss nachprüfbar sein militärisches Nuklearprogramm
  einstellen. Wir haben darüber gesprochen: Wir hatten gestern den Tag der Koalition
  der Willigen hier in Berlin. Ich habe Ihnen, Königliche Hoheit, über unsere Anstrengungen
  berichtet, wie wir versuchen wollen, den Krieg in der Ukraine zu beenden. Russlands
  Kriegsführung untergräbt ja nicht nur die Sicherheit Europas. Die Angriffe zum Beispiel
  auf Schiffe im Schwarzen Meer gefährden die globale Ernährungssicherheit. Wir sind
  uns darüber einig: Russland muss sein diplomatisches Spiel auf Zeit beenden. Moskau
  muss sich auf eine echte Friedensverhandlung einlassen. Deutschland wird alles in
  seiner Kraft Stehende tun, um einen dauerhaften Frieden zu erreichen. Lassen Sie
  mich noch einmal auf unsere Beziehungen zurückkommen: In Zeiten großer Instabilität
  sind belastbare, langfristige Partnerschaften wichtiger denn je. Eine solche Partnerschaft
  bauen Katar und Deutschland mit langem Atem weiter auf. Wir mögen nicht zu jeder
  Frage immer einer Meinung sein, aber beide Seiten haben verstanden: Zusammen erreichen
  wir mehr. Eure Hoheit, noch einmal sehr herzlichen Dank für den Besuch in Berlin.
  Ich freue mich, dass Sie heute im Bundeskanzleramt sind, und ich freue mich, dass
  wir uns heute Abend beim Herrn Bundespräsidenten auch noch einmal sehen werden.
  Emir Al Thani Vielen Dank, Herr Bundeskanzler. Es freut mich sehr, heute bei Ihnen
  hier in der Bundesrepublik Deutschland zu sein. Ich danke Ihnen für die Einladung
  und den herzlichen Empfang. Dieser Besuch ist eine Chance für einen vertieften Dialog
  zwischen uns beiden. Wir haben eine jahrzehntelange gute Partnerschaft. Wir haben
  heute über die Zukunft der Beziehungen zwischen Deutschland und Katar gesprochen.
  Wir haben Wege erörtert, wie wir auf dem aufbauen können, was wir in der Zusammenarbeit
  im Bereich der Energie, der Investitionen, der Wirtschaft, der Technologie, der
  Rüstungsindustrie, der Sicherheitsindustrie geschafft haben. Wir haben neue Horizonte
  eröffnet, die uns beiden und unseren beiden Völkern dienen werden. Die Investitionen
  Katars in Deutschland sind langfristig. Das zeigt unser Vertrauen in die Stärke
  der deutschen Wirtschaft und die Stärke der Industrie. Das spiegelt auch die Leistungen
  der deutschen Unternehmen wider. Wir haben eine sehr tiefe Partnerschaft mit ihnen.
  Im Energiebereich möchten wir eine Partnerschaft, die auf Vertrauen gründet, die
  Energiesicherheit gewährleistet und die die Märkte stabilisiert. Wir haben auch
  eine Partnerschaft im Bereich der Wissenschaft, der Technologie, der fortschrittlichen
  Technologien und der Spitzentechnologien. Außerdem haben wir einen strategischen
  Dialog zwischen unseren beiden Ländern und möchten diesen fortführen. Wir haben
  uns auch über die regionalen und internationalen Entwicklungen ausgetauscht, vor
  allem im Nahen Osten, und wir haben unterstrichen, wie wichtig die Souveränität
  der Staaten ist und dass sich die diplomatischen Bemühungen darum drehen sollten,
  eine Deeskalation herbeizuführen und die Konflikte zu lösen. Wir haben über die
  palästinensische Frage und über andere Konflikte gesprochen. Es geht darum, Zivilisten
  zu schützen, damit die Hilfen ankommen, und dass Bemühungen zur Deeskalation unternommen
  werden. Katar wird seine Bemühungen in der Vermittlung und in der Mediation fortführen,
  zusammen mit seinen Partnern. Wir sind davon überzeugt, dass der dauerhafte Frieden
  nur mit echten politischen Lösungen möglich ist. Wir müssen Konflikte und die Folgen
  von Krisen bearbeiten. Unsere beiden Länder verbindet mehr als nur Interessen. Wir
  haben eine Partnerschaft von Werten zur Konfliktlösung durch Dialog und Verhandlungen.
  Wir halten an der Charta der Vereinten Nationen fest und haben die Überzeugung,
  dass über die Vertiefung des Friedens Verbesserung herbeigeführt werden kann. Deutschland
  und Europa sehen es auch so, dass wir Vertrauen zwischen Partnern herbeiführen müssen.
  In dieser Überzeugung sprechen wir auch miteinander. Wir möchten eine gute Nachbarschaft
  haben, in der es stabile Staaten gibt, die ihre Verantwortung tragen können. Wir
  schauen auf Deutschland als wichtigen Partner und freuen uns darauf, dass unsere
  Beziehungen in der Folge der heutigen Gespräche noch einmal ein neues Momentum erreichen,
  einen neuen Impuls erreichen. Wir werden unsere gemeinsamen Interessen im Sinne
  unserer beiden Bevölkerungen weiterverfolgen. Zum Schluss möchte ich mich noch einmal
  herzlich für diesen herzlichen Empfang bedanken und wünsche der Bundesrepublik Deutschland
  und ihrer Bevölkerung alles Gute, Prosperität und alles Gute für die Zukunft. Vielen
  Dank!'
