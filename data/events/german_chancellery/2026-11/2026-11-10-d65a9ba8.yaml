title: '13 neue Erinnerungsorte an Bahnhöfen machen NS-Geschichte in ganz Deutschland
  sichtbar: „Erinnerung braucht jede und jeden von uns“'
text: 'Im bundesweiten Förderprogramm „MemoRails – Halt! Hier wird an NS-Geschichte
  erinnert“ haben 13 Projekte Gedenkzeichen an Bahnhöfen geschaffen und mit Bildungsangeboten
  die lokale Auseinandersetzung mit den NS-Verbrechen gestärkt. Die Ergebnisse werden
  vom 13. November 2026 bis zum 28. Februar 2027 im DB Museum Nürnberg präsentiert.
  Während des Nationalsozialismus waren Bahnhöfe Orte der Deportation, Zwangsarbeit
  und Verfolgung. Heute erinnern an 13 Bahnhöfen neue Gedenkzeichen an diese Geschichte.
  Im Programm „MemoRails“ haben Vereine, Bildungseinrichtungen, Gedenkstätten und
  Kommunen lokale NS-Geschichte erforscht und vermittelt. Das Programm der Stiftung
  Erinnerung, Verantwortung und Zukunft (EVZ) wird vom Beauftragten der Bundesregierung
  für Kultur und Medien (BKM) gefördert und in Zusammenarbeit mit der Deutschen Bahn
  umgesetzt. BKM hat für das Programm einmalig eine Million Euro zur Verfügung gestellt.
  Die Stiftung Erinnerung, Verantwortung und Zukunft (EVZ) beteiligt sich mit weiteren
  100.000 Euro. 13 Bahnhöfe, 13 Geschichten Meppen, Cottbus, Weiden, Trebnitz, Ober-Roden,
  Neumünster, Köln-Deutz, Böhlen, Göttingen, Birkenwerder, Meiningen, Königstein,
  Berlin Die Projekte zeigen, wie eng die Geschichte der Bahnhöfe mit den nationalsozialistischen
  Verbrechen verbunden ist. Entstanden sind Gedenkzeichen, Ausstellungen, Rundgänge
  sowie künstlerische und digitale Bildungsangebote. Unterschiedliche Organisationen
  haben damit bislang wenig bekannte Geschichten sichtbar gemacht und neue Zugänge
  zur lokalen NS-Geschichte geschaffen. Die Deutsche Bahn hat die Anbringung der Gedenkzeichen
  engagiert unterstützt und übernimmt auch künftig Verantwortung für deren Erhaltung
  an den Bahnhöfen. Staatsminister für Kultur und Medien Wolfram Weimer: „Erinnerung
  braucht jede und jeden von uns. Die Projekte zeigen eindrucksvoll, wie Menschen
  Verantwortung für die Aufarbeitung der Verbrechen des Nationalsozialismus übernehmen
  und eigenverantwortlich vergessene Geschichten von Verfolgung, Zwangsarbeit und
  Ermordung sichtbar machen. Das Programm MemoRails hat damit eine lebendige Erinnerungskultur
  gestärkt, die aus der Gesellschaft heraus stattfindet. Die Ausstellung in Nürnberg
  würdigt dieses Engagement und verdeutlicht die gesellschaftliche Wirkung, die Aufarbeitung
  vor Ort entfalten kann.“ Zwei Projekte zeigen, was bleibt Meppen: Spuren von Deportation
  und Zwangsarbeit Das Projekt „Spuren der Nachbarn“ der VHS Meppen beleuchtet die
  Rolle des Bahnhofs Meppen während der NS-Zeit und erinnert an die Menschen, die
  von hier aus in die Emslandlager deportiert wurden. Eine Stadtrallye, Bildungsmaterialien
  sowie Kunstworkshops machen die lokale Geschichte sichtbar. Birkenwerder: Die Geschichte
  einer jüdischen Überlebenden Das Projekt „VON HIER AUS“ lässt Kinder und Jugendliche
  die NS-Geschichte an Bahnhöfen in Brandenburg erforschen. In Birkenwerder steht
  Ruth Winkelmann im Mittelpunkt, eine jüdische Überlebende der NS-Verfolgung. Ihre
  Lebensgeschichte zeigt, wie Ausgrenzung und Verfolgung den Alltag prägten und vertraute
  Orte veränderten. Das Projekt verbindet historische Recherche mit der Perspektive
  junger Menschen und eröffnet neue Zugänge zur lokalen Geschichte. Dr. Andrea Despot,
  Vorstandsvorsitzende, Stiftung EVZ: „Die MemoRails-Projekte zeigen, wie lokale Recherchen
  und persönliche Lebensgeschichten dazu beitragen, NS-Verbrechen sichtbar zu machen
  und die Erinnerung daran in die Gegenwart zu tragen. Sie machen deutlich, dass die
  Auseinandersetzung mit der NS-Geschichte nicht nur an bekannten Gedenkstätten stattfindet,
  sondern auch im Alltag von Städten und Gemeinden ihren Platz hat.“ Die Ergebnisse
  von MemoRails im DB Museum Nürnberg Zum Abschluss des Programms führt eine Präsentation
  im DB Museum Nürnberg die Ergebnisse der 13 Projekte zusammen und stellt sie in
  den Kontext der Geschichte der Deutschen Reichsbahn im Nationalsozialismus. Großformatige
  Stelen stellen ausgewählte Projekte ausführlich vor; digitale Inhalte, über QR-Codes
  abrufbar, vertiefen einzelne Geschichten. Auch durch die installierten Gedenkzeichen
  an den Bahnhöfen bleiben die 13 neuen Erinnerungsorte auch in Zukunft bestehen.
  Dr. Katja Hüske, Vorständin Personenbahnhöfe, DB InfraGO AG: „Bahnhöfe stehen heute
  für Begegnung, Aufbruch und Ankommen. Doch unter den Nationalsozialisten begann
  für viele Verfolgte hier eine Reise ohne Wiederkehr in die Vernichtungslager. Deshalb
  war und ist es uns ein Anliegen, mit unserer Beteiligung am Programm MemoRails dazu
  beizutragen, ein öffentliches Bewusstsein für die Geschichte hinter den Bahnhöfen
  zu schaffen. Die 13 Projekte machen auf ganz unterschiedliche Weise sichtbar, warum
  sich Geschichte nicht wiederholen darf.“ An folgenden Orten wurden MemoRails-Projekte
  umgesetzt: Die MemoRails-Präsentation ist vom 13. November 2026 bis zum 28. Februar
  2027 im DB Museum, Lessingstraße 6, 90443 Nürnberg, zu sehen. Die Eröffnung findet
  am 12. November 2026 ab 18 Uhr statt (Einlass ab 17:30 Uhr). Informationen zur Anmeldung
  für die Ausstellung.'
