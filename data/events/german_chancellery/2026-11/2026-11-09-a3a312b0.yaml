date: '2026-11-09'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 9. November 2026
text: 'stellvertretender Regierungssprecher Meyer (Vorsitzende Wolf eröffnet die Pressekonferenz
  und begrüßt SRS Meyer sowie die Sprecherinnen und Sprecher der Ministerien.) Der
  Kanzler hat am Freitagabend bei einer Veranstaltung der „Westfalenpost“ gesagt,
  er werde einem Gespräch mit Putin nicht aus dem Weg gehen. Herr Meyer, wie passt
  das zu der bisherigen Ansage? Wir haben hier ganz oft danach gefragt und es hieß
  immer, das sei der dritte Schritt vor dem ersten usw. Warum hat der Kanzler jetzt
  seine Meinung geändert? Das kann ich, ehrlich gesagt, nicht erkennen. Ich finde,
  das passt genau in das, was wir hier immer kommuniziert haben. Wir haben immer gesagt,
  dass wir dazu natürlich grundsätzlich bereit sind, aber dass es Sinn ergeben muss,
  und ein Gespräch um des Gesprächs willen ergibt keinen Sinn. Was Sinn ergeben kann,
  ist natürlich, auf einer vernünftigen Basis, in einem vernünftigen „surrounding“,
  mit klaren Zielen und auch auf einer gewissen Augenhöhe miteinander zu sprechen.
  Wenn dieser Moment kommt, dann ‑ das hat der Kanzler gesagt ‑ wird er diesen Moment
  auch nutzen und ergreifen. Aber, noch einmal, das passt zu dem, wie wir immer kommuniziert
  haben: Es muss am Ende Sinn ergeben. Für Scheingespräche stehen wir nicht zur Verfügung.
  Die Aussage war ja auf den G20-Gipfel im Dezember gemünzt. Wenn es so ist, wie Sie
  jetzt sagen, warum wollen Sie dann bis dahin warten? Was hält den Kanzler davon
  ab, jetzt in Moskau anzurufen, wie das sein Vorgänger ja auch einmal gemacht hat?
  Noch einmal: Gespräche werden dann geführt, wenn sie Sinn ergeben, wenn sie ein
  klares Ziel haben und wenn es auch die Bereitschaft gibt, zum Beispiel über einen
  ernsthaften Frieden in der Ukraine zu sprechen. Es finden ja in diesen Tagen weitere
  Gespräche in Abu Dhabi statt. Es ist auch gut und richtig, wenn hier eine neue Dynamik
  entsteht. Wir haben aber bisher eben auch immer gesagt, dass eine ernsthafte Bereitschaft
  Russlands dazu, auch wirklich über einen gerechten, einen nachhaltigen Frieden zu
  sprechen, für uns nicht zu erkennen war. Deshalb gilt, noch einmal: Es gibt eine
  grundsätzliche Bereitschaft, aber es muss am Ende Sinn ergeben, und es muss am Ende
  dann auch auf einer vernünftigen Basis passieren. Herr Meyer, ich wollte nach den
  morgen beginnenden Gesprächen in Abu Dhabi fragen. Ich hätte ganz gerne gewusst,
  wer aus Deutschland wie daran teilnehmen wird. Für uns ist wichtig, dass wir Teil
  dieses Prozesses sind ‑ das haben wir immer deutlich gemacht ‑, weil wir natürlich
  nicht nur ukrainische Interessen, sondern auch europäische Sicherheitsinteressen
  vertreten wollen. Wir werden auf Ebene des sicherheitspolitischen Beraters an diesen
  Gesprächen beteiligt sein. Darf ich nochmal nachfragen? In welcher Form? Sitzt der
  also draußen, oder gibt es einen Vorraum mit den E3, oder gibt es die Hoffnung,
  dass die Europäer doch noch direkt mit am Tisch sitzen? Solche Gespräche, gerade
  dann, wenn sie auf mehrere Tage angesetzt sind, haben ja immer auch eine gewisse
  Dynamik. Insofern werde ich jetzt hier nichts über Aufstellung, Sitzordnung oder
  andere Dinge sagen. Wir haben inhaltliche Interessen bei diesen Gesprächen, und
  die werden wir auch vor Ort wahrnehmen. Wir sind nah dran und Teil dieses Prozesses,
  und das ist so auch vernünftig. Wie lange werden die deutsche Seite und auch Europäer
  im Allgemeinen in Abu Dhabi vertreten sein? Wie lange werden wir also vor Ort vertreten
  sein? Darüber habe ich keine gesicherten Informationen. Wenn wir schon dabei sind:
  Was wäre denn aus deutscher Sicht ein, sagen wir einmal, auch rational wirklich
  erwartbarer Erfolg? Ab wann würden Sie sagen, dass das wirklich etwas gebracht hat?
  Es hat ja schon verschiedene Versuche gegeben, solche Gespräche zu führen. Die Ergebnisse
  waren oft eher durchwachsen. Ab wann würde die Bundesregierung sagen, dass es sich
  in Abu Dhabi gelohnt hat? Es ist wichtig, dass diese Gespräche stattfinden und dass
  wir da auch eine neue Dynamik sehen. Ich will sie aber auch nicht mit Erwartungen
  überfrachten, indem ich jetzt hier im Vorfeld Aussagen mache. Das müssen wir in
  gewisser Weise auch dem Prozess überlassen. Klar ist aber, und darauf haben wir
  immer hingewiesen, dass ein Waffenstillstand aus unserer Sicht natürlich eine ganz,
  ganz wichtige Grundlage ist, um dann auch ernsthaft über Frieden verhandeln zu können,
  weil es, wenn jeden Tag Bomben fliegen, wenn jeden Tag Menschen sterben, unter diesen
  Voraussetzungen eben sehr, sehr schwierig ist, dann auch über Frieden zu verhandeln.
  Darauf haben wir immer hingewiesen. Aber, noch einmal, wir müssen das jetzt ein
  Stück weit auch den Gesprächen überlassen. Vielleicht noch eine kurze Nachfrage:
  Wie muss man sich das praktisch vorstellen, wenn Herr Sautter dabei ist? An den
  eigentlichen Verhandlungen ist er nicht beteiligt. Ist er ist irgendwie am Rande
  dabei, wird er dann konsultiert, oder passiert das spontan? Wir haben in der Vergangenheit
  ein bisschen Erfahrung mit diesen Formaten gesammelt. Das ist auch eingespielt.
  Wir sind da eng abgestimmt, nicht nur im Bereich der E3, sondern auch weiter im
  europäischen Kontext. Wir sind nah dran. Wir beteiligen uns in diesem Prozess und
  haben auch Möglichkeiten, Einfluss zu nehmen. Vielleicht würde ich zu der Frage,
  wie lange wir dann vor Ort sein werden, noch sagen: So lange es notwendig ist. US-Präsident
  Trump erwartet von der Ukraine offenbar Konzessionen. Er hat in einem Fernsehinterview
  gesagt, am Ende werde die Ukraine eine andere Form haben, „another shape“. Das bedeutet
  ja, dass sie das Land, das von Russland besetzt ist, abgeben soll. Ist das in irgendeiner
  Weise mit deutschen Positionen zu vereinbaren? Da würde ich es, mit Bitte um Verständnis
  eigentlich so halten, wie wir es hier häufig gehalten haben, nämlich dass wir öffentliche
  Aussagen anderer Staatschefs ‑ auch solche, die über Medien getätigt werden ‑ hier
  jetzt nicht weiter kommentieren. Was doch aber klar ist, und darauf haben wir immer
  hingewiesen, ist, dass die Ukraine über ihr Territorium am Ende natürlich auch selbst
  entscheiden muss. Das ist aber auch völlig klar, auch in diesen Gesprächen. Ja,
  es steht ja auch in der ukrainischen Verfassung, dass die besetzten Territorien
  oder die besetzten Gebiete zum staatlichen Territorium der Ukraine gehören. Deswegen
  stelle ich aber noch einmal die Frage. Das ist ja eine prinzipielle. Ist es aus
  deutscher Sicht vorstellbar, dass die Ukraine, um einen Frieden zu erreichen, ganz,
  teilweise oder zeitweise auf Gebiete verzichtet? Das ist eine fundamentale Grundsatzfrage.
  Ja, genau, aber darüber spekuliere ich jetzt nicht. Ich habe gerade auf die Bedingungen
  hingewiesen. Die Ukraine entscheidet souverän über ihr Territorium. Herr Meyer,
  der Vorsitzende des Auswärtigen Ausschusses, Herr Laschet, hat sich am Wochenende
  in einer italienischen Zeitung gegen die Annahme der Bundesregierung gestellt, dass
  die E3 für die Europäer mitverhandeln sollten, und hat gefordert, dass bei dem informellen
  EU-Treffen, das diese Woche stattfinden wird, darüber geredet werden solle, wer
  Europa eigentlich vertritt. Was ist jetzt eigentlich die aktuelle Position der Bundesregierung?
  Sieht sie weiterhin die E3 in der Form des Sprachrohrs für die Europäer bei diesen
  Verhandlungen, oder gibt es da neue Überlegungen? Für uns ist die enge europäische
  Abstimmung enorm wichtig, und die ist gewährleistet. Es wird dann in den nächsten
  Tagen ja auch die Gelegenheit geben, im Rahmen der EPG, aber auch des informellen
  Europäischen Rates, die Dinge weiter zu vertiefen. Sie wissen, dass wir für den
  19. November ja auch die Koalition der Willigen nach Berlin eingeladen haben. Das
  ist für uns der entscheidende Maßstab, nämlich dass wir eng abgestimmt miteinander
  agieren und dass wir uns dann vor allen Dingen auch auf die inhaltlichen Bereiche
  der Verhandlungen und Gespräche konzentrieren, weil die am Ende entscheidend sind,
  um hierbei auch Schritte voranzukommen. Dabei geht es, wie gesagt, um einen Waffenstillstand,
  dabei geht es aber auch um den Bereich der Sicherheitsgarantien. Das sind am Ende
  notwendige Bedingungen, um überhaupt Schritte voranzukommen. Darauf konzentrieren
  wir uns und stimmen uns darüber auch im europäischen Rahmen wirklich ab, eigentlich
  täglich, wie man sagen kann. Das ist für uns entscheidend. Wenn ich kurz nachfragen
  darf, nur damit kein Missverständnis entsteht: In Abu Dhabi werden die E3 vertreten
  sein, also jeweils die außenpolitischen Berater, richtig? Ich gehe davon aus, dass
  auch weitere Entitäten vertreten sein werden. Ich kann hier aber nur über die deutsche
  Seite sprechen. Insofern kann ich Ihnen die Vertretung durch Herrn Sauter bestätigen.
  Herr Hinterseher, Ihr Außenminister hat letzte Woche im Bundestag erklärt, die Staatsideologie
  des Iran sei es, die Juden zu töten. Da würde mich interessieren, auf welche konkrete
  Quelle sich der Minister in seiner Aussage gegenüber dem Bundestag denn gestützt
  hat. Ich denke, es gibt genügend Aussagen dazu, um das zu substanziieren. Ansonsten
  stehen die Aussagen des Ministers aber für sich. Ich hatte nach einer konkreten
  Quelle gefragt. Sie konnten sie anscheinend nicht vorlegen. Die jüdische Gemeinschaft
  im Iran ist die größte innerhalb des Nahen Ostens außerhalb Israels. Allein in Teheran
  gibt es 20 Synagogen. Sie haben Religionsfreiheit. Es gibt renommierte Schulen und
  Krankenhäuser der jüdischen Gemeinschaft. Vor diesem Hintergrund würde mich interessieren,
  wo der Minister konkret Indizien dafür sieht, dass der Iran als Staatsideologie
  habe, Juden zu töten. Das ist ja schon eine Aussage mit enormem Gewicht, und der
  Außenminister dieser Republik sollte sie zumindest mit konkreten Quellen belegen
  können. Ja, und ich hatte Ihnen darauf gerade eine Antwort gegeben. Es gibt hinlänglich
  Aussagen der iranischen Staatsführung, die das belegen. Sie müssen sie allerdings
  selbst konsultieren und herausfinden. Ich denke, das ist Teil Ihrer Recherche, nicht
  unserer. Sie hatten die Möglichkeit, eine Zusatzfrage zu stellen. Wenn ich das gleich
  eingangs sagen darf: Ich würde Sie darum bitten, Antworten nicht zu kommentieren.
  Das können Sie gern in Ihrer Berichterstattung tun, das braucht aber nicht in diesem
  Raum stattzufinden. Sie können sich Ihren Teil dazu denken, aber die Regel ist:
  Wir stellen die Fragen, und es werden Antworten gegeben. Das Statistische Bundesamt
  hat heute Morgen eine auf Syrer bezogene Wanderungsstatistik veröffentlicht. Wie
  bewertet die Bundesregierung das? Die Frage geht wahrscheinlich an das BMI. Ich
  muss gestehen, dass ich diese Statistik nicht kenne. Ich wüsste jetzt aber auch
  nicht, wie wir als BMI diese Wanderungsstatistik bewerten könnten oder sollten.
  Die Zahl der Syrer, die nach Deutschland gehen, ist deutlich zurückgegangen. Meine
  Nachfrage für die Nachreichung: Ändert sich dadurch die Strategie der Bundesregierung,
  was Abschiebungen und Programme zur freiwilligen Rückkehr angeht? Vielleicht können
  Sie die Antwort nachreichen. Im Gazastreifen gab es am Wochenende starke Regenfälle
  . Eine Million Vertriebener soll kein Dach mehr über dem Kopf haben. Ist die Bundesregierung
  dazu bereit, Hilfe bereitzustellen? Als Sprecher des für humanitäre Hilfe federführenden
  Ressorts würde ich die Antwort gern übernehmen. Wir haben uns zu den katastrophalen
  Bedingungen im Gazastreifen hier mehrfach geäußert. Der Außenminister hat das, denke
  ich, zuletzt Ende September in Genf getan. Hier war es mehrfach Thema. Ich habe
  Ihnen im Moment keine konkrete Neuaufstockung humanitärer Hilfe anzukündigen. Sie
  wissen allerdings, dass die Bundesregierung humanitäre Hilfe leistet und sich im
  Übrigen auch stark dafür einsetzt, in der Umsetzung des 20-Punkte-Planes voranzukommen,
  und wesentliche Beiträge dafür geleistet hat. Wir haben hier in letzter Zeit auch
  über den Einsatz eines Scanners für die Einfuhr von aus humanitärer Sicht wichtigen
  Gütern gesprochen, vor allem vor dem Winter. Dabei geht es um die sogenannten Dual-Use-Güter.
  Es ist nach wie vor unsere Position und Haltung, dass diese Scanner so bald wie
  möglich in Betrieb genommen werden sollten. Akut gibt uns vor allem die mangelhafte
  Vorbereitung auf den Winter Anlass zu größter Sorge. Berichte vom Wochenende über
  70 000 überflutete Zelte unterstreichen diesen Handlungsbedarf. Im vergangenen Winter
  hat die mangelhafte Versorgung auch zu Todesfällen durch Unterkühlung, durch Brände
  in provisorischen Unterkünften und durch die Verbreitung von Atemwegserkrankungen
  geführt. Wir müssen befürchten, dass sich dies in diesem Winter wiederholt. Insofern
  ist die Frage berechtigt. Ja, wir gehen davon aus, dass deutlich mehr humanitäre
  Hilfe im Gazastreifen ankommen muss. Solange die Einfuhrbeschränkungen bestehen
  bleiben, ist es schwierig, eine Rehabilitierung der Basisinfrastruktur dort vorzunehmen.
  Dann droht sich die humanitäre Lage weiter zu verschlechtern, vor allem vor dem
  Hintergrund der Witterungsbedingungen. Israel knüpft die Zulassung von Wiederaufbauarbeiten
  ganz konkret an die Entwaffnung der Hamas. Hält die Bundesregierung das angesichts
  der ganz aktuellen Zustände noch für verhältnismäßig? Ich denke, beides ist wichtig.
  Die Entwaffnung der Hamas ist ein elementarer Punkt, der im 20-Punkte-Plan vorgesehen
  ist. Zugleich ist in einer ersten Phase aber auch eine Aufstockung der humanitären
  Hilfe vorgesehen. Man muss konzedieren, dass es keine Fortschritte bei der Entwaffnung
  der Hamas gibt. Es gilt, dabei Fortschritte zu erzielen. Zugleich gilt es aber,
  unabhängig davon auch Fortschritte im humanitären Bereich zu erzielen, wie ich gerade
  ausgeführt habe. Der Bundesgerichtshof entschied am 21. Oktober, dass der Präsident
  des Landgerichts Hamburg eine Unterlassungsklage gegen den EU-Rat wegen der EU-Sanktionen
  gegen Einzelpersonen rechtswidrig blockiert habe. Geklagt hatte der inzwischen entlistete
  Unternehmer Alischer Usmanow. Zuvor hatte allerdings das Auswärtige Amt beim Landgerichtspräsidenten
  in der Angelegenheit interveniert. Ich zitiere kurz aus dem Schriftverkehr: Wir
  wollen nicht, bzw. es wäre mit dem supranationalen Charakter dieser Maßnahmen nicht
  vereinbar, dass sie durch nationale Gerichte der Mitgliedstaaten beeinflusst oder
  gar überprüft werden. Herr Hinterseher, wie passt diese Intervention des AA zur
  Gewaltenteilung und zur Ihnen sicherlich bekannten Rechtswegegarantie in Artikel 19
  Absatz 4 des Grundgesetzes? Die kurze Antwort darauf wäre: Sie passt sehr gut dazu.
  Aber an dieser Stelle würde ich gern einmal darlegen, dass Sie zwei Punkte vermischen.
  Es geht an dieser Stelle nämlich um zwei unterschiedliche Verfahren, die getrennt
  werden müssen. Das Verfahren, über das auch medial berichtet wurde, also die Klage
  gegen den Rat, ist uns nur aus der Presse bekannt geworden. Der Beschluss des BGH
  liegt uns zwischenzeitlich vor. Wir kommentieren ihn allerdings nicht, wie es hier
  Usus ist. Es ist aber richtig, dass das AA in einem insofern ähnlich gelagerten
  Fall – ich betone: in einem ähnlich gelagerten Fall – Stellung genommen hat. Hierbei
  ging es um die Anwendung verschiedener Zustellungsvorschriften sowie die Zuständigkeitsanordnung
  europäischer Gerichte. In schwierigen Fällen der internationalen Rechtshilfe ist
  eine Abstimmung der Justizbehörden mit dem BfJ und gegebenenfalls auch mit dem BMJV
  und dem Auswärtigen Amt gängige Praxis, die in der Rechtshilfeordnung für Zivilsachen
  ausdrücklich vorgesehen ist. Dass auch in diesen Fällen Rechtsschutz gewährleistet
  wird, belegt die ergangene BGH-Entscheidung. Insofern kann ich die Berichterstattung
  in dieser Frage nur sehr schwer nachvollziehen. An das Justizministerium: Die Intervention
  des AA kam über das Bundesamt für Justiz beim Gerichtspräsidenten an. Es gehört
  zum Geschäftsbereich Ihres Ministeriums. Ist es aus Ihrer Sicht mit der Gewaltenteilung
  vereinbar, dass eine Bundesbehörde außenpolitische Bedenken der Regierung an ein
  Gericht weitergibt? In wie vielen anderen Fällen hat das Amt bereits ähnlich interveniert?
  Die Antwort auf die letzte Frage können Sie gern nachreichen. Zahlen dazu habe ich
  jetzt nicht dabei. Es geht um eine Angelegenheit der internationalen Rechtshilfe.
  Wie schon erläutert, ist es in diesen Angelegenheiten übliche Praxis und auch rechtlich
  vorgesehen, dass BMJV, AA und BfJ eine Stellungnahme abgeben, wenn sie darum gebeten
  werden. Es ist vielleicht wichtig, noch hervorzuheben, dass diese Stellungnahme
  natürlich keinerlei bindende Wirkung hat und die Entscheidung weiterhin vom Gericht
  getroffen wird, und zwar unabhängig. Wie kommt die Prioritätensetzung des Bundeskanzlers
  bezüglich der Nichtteilnahme am Tag der COP mit Staats- und Regierungschefs zustande?
  Darüber haben wir hier schon mehrfach gesprochen. In dieser Woche steht eine sehr
  wichtige Kabinettssitzung an, in der es um den Bundeshaushalt geht, also quasi die
  Geschäftsgrundlage dieser Bundesregierung, übrigens auch mit einem großen Schwerpunkt
  auf dem Thema des Klimas und des Klimaschutzes. Die Investitionen in diesem Bereich
  sind so hoch angesetzt wie vielleicht noch nie, auch durch die Möglichkeiten, die
  uns das Sondervermögen bietet. In Dublin geht es mit der Sitzung der EPG und dann
  der informellen Sitzung des Europäischen Rates direkt weiter. Am Ende stellt der
  Kalender des Bundeskanzlers immer eine Abwägung zwischen verschiedenen sehr wichtigen
  Terminen dar. Deshalb muss man immer eine Abwägung treffen. Wir haben uns in dieser
  Woche deshalb für die Kabinettssitzung und die Teilnahme an sehr wichtigen europäischen
  Gipfeltreffen – wir haben gerade über die Ukraine gesprochen – entschieden. Nichtsdestoweniger
  haben wir klare klimapolitische Prioritäten, auch auf der COP, die dort von Bundesminister
  Schneider auch im Namen der Bundesregierung vertreten werden. Wenn ich Ihre Abwägungsprozesse
  richtig verstanden habe, dann ist beispielsweise die EPG in dieser Woche höher zu
  gewichten als die COP, richtig? Ich würde mich ungern auf dieses Spiel einlassen.
  Noch einmal: Es ist immer eine Abwägung zwischen verschiedenen sehr wichtigen Terminen.
  Dass alle europäischen Zusammenhänge, insbesondere die europäische Sicherheit, aber
  auch die Zukunft der europäischen Wirtschaft und der europäischen Wettbewerbsfähigkeit,
  Themen sind, die enorm wichtig sind, das liegt, denke ich, auf der Hand. Deshalb
  kommt es in dieser Woche zu dieser Abfolge. Es geht um die deutschen Zusagen für
  Klimaschutzfonds. Auf der vorigen COP waren 60 Millionen Euro zugesagt worden. Können
  Sie mir sagen, wie viele der zugesagten 60 Millionen Euro bislang tatsächlich gezahlt
  oder für wie viele konkrete Zahlungstermine und Summen in Aussicht gestellt wurden?
  Ich weiß nicht, ob die Frage an das Finanzministerium oder ein anderes Ressort zu
  richten wäre. Ich kann gern vorlegen, wobei internationale Klimafinanzierung auch
  ganz stark beim BMZ liegt. Vielleicht weg von den spezifischen Zahlen und hin zur
  zusammenfassenden Aussage: Deutschland ist unverändert eines der starken Länder
  internationaler Klimafinanzierung. Wir leisten weiterhin unseren fairen Anteil.
  Es ist richtig, dass das Ziel für das vergangene Jahr hinsichtlich Haushaltsmittel
  und Schenkungsäquivalente, also ohne in der Privatwirtschafts Gehebeltes, bei sechs
  Milliarden Euro lag und dass wir nur bei gut 4,7 Milliarden sind. Das ändert aber
  nichts daran, dass wir international weiterhin als starke und zuverlässige Säule
  des internationalen Klimaschutzes gelten und Anerkennung erfahren. Die Kritik vor
  allem seitens der vom Klimawandel besonders bedrohten finanzschwachen Nationen besagt
  ja, der Bedarf durch „global warming“ und die Folgen wachse enorm an. Wenn in einer
  solchen Situation die zugesagten Summen in der Praxis verringert würden, dann öffne
  das eine ungünstige, eine gefährliche Schere. Gibt es also jenseits der Feststellung,
  dass Deutschland ein wichtiger Player und Zahler ist, irgendwelche Absichten, diese
  Lücke zu schließen? Ich möchte jetzt, zu Beginn der COP, den einzelnen COP-Verhandlungen
  natürlich nicht unnötigerweise im Detail vorgreifen, aber selbstverständlich gibt
  es mehrere Möglichkeiten, gerade die am meisten vom Klimawandel betroffenen Staaten
  auch jenseits von Geldmitteln stark zu unterstützen. Das führt mich zu den drei
  wichtigen Zielen: Erstens engagiert sich Deutschland im Zuge der internationalen
  Initiative zur Abkehr von fossilen Energien und hat als eines der ersten Länder
  auch seinen nationalen Plan vorgelegt. Das ist natürlich ein wichtiges Element,
  um andere Staaten einzuladen, sich dem anzuschließen. Wir gehen davon aus, dass
  wir diesbezüglich auf der COP eine positive Dynamik sehen werden. Zweitens ist eine
  weitere wichtige Initiative, für die sich Deutschland schon ausgesprochen hat und
  die Deutschland unterstützen wird, der Vorschlag der COP-Präsidentschaft für eine
  Elektrifizierung: 35 Prozent Stromanteil am Endenergieverbrauch bis 2035. Die Zusammenarbeit
  mit den stark betroffenen Staaten haben wir nicht zuletzt auch dadurch gestärkt,
  dass es vor einigen Wochen die sogenannte Pre-COP gab, an der Deutschland wieder
  teilgenommen hat, um die Bedarfe gemeinsam zu besprechen und auch mögliche Lösungslinien
  ins Auge zu fassen. Zur grundsätzlichen Einordnung der Bedeutung: Gerade das Anliegen
  der besonders betroffenen und häufig auch besonders schwach aufgestellten Staaten
  ist natürlich ein ganz besonderes Anliegen, das auch Entwicklungsministerin Alabali
  Radovan besonders im Blick hat. Hinsichtlich der Unterstützung der Klimapolitik
  ist es besonders relevant, vor allem auch die präventiven Maßnahmen in den Blick
  zu nehmen. Was Deutschland in der Zusammenarbeit unmittelbar auf der COP, aber auch
  in der Zeit zwischen den COP und in der bilateralen Arbeit mit Partnern besonders
  in den Blick der Kooperation nimmt, sind deshalb Klima- und Katastrophenrisikomanagementsysteme,
  um Länder besser darauf vorzubereiten, mit den Risiken umzugehen, die – damit müssen
  wir alle ja umgehen – der Klimawandel auch jetzt schon mit sich bringt. Nepal war
  ein Beispiel. Die Zahl solcher Extremwetterereignisse wird zunehmen. Wir arbeiten
  gemeinsam mit Partnern weltweit daran, entsprechende Anpassungen und Frühwarnsysteme
  aufzubauen. Mein kundiges und hilfreiches Backoffice hat mich darauf aufmerksam
  gemacht, dass ich noch etwas ergänzen sollte. Ich hatte die Summe von 4,7 Milliarden
  Euro deutscher eigentlicher Haushaltsmittel plus Schenkungsäquivalente ‑ damit also
  weniger als sechs Milliarden Euro ‑ schon erwähnt. Es ist aber eine stärkere Hebelung
  gelungen, sodass private Mittel stärker zum Tragen gekommen sind. Dieser Zuwachs
  hat die Verringerung der im engeren Sinne öffentlichen Mittel ausgeglichen. Wir
  sehen, dass die stärkere Konzentration zum einen auf die Klimaschutzwirkung der
  Finanzmittel und zum anderen auf eine stärkere Hebelung funktioniert. (zu Kandidaten
  für die Wahl zum Bundespräsidenten ) Herr Meyer, ich wüsste gern, welche Konsequenzen
  der Vorschlag für Frau Aigner, den der Kanzler jetzt gemacht hat, für das Verhältnis
  von CDU und CSU hat. Heißt das, dass damit eine Kanzlerkandidatur von Herrn Söder
  künftig ausgeschlossen ist? Das Verhältnis ist genauso gut wie vorher. Es kann ja
