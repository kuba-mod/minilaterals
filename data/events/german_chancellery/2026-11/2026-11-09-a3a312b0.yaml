  Rohstoffagentur ‑ DERA ‑, die das alles organisiert. Wir werden in den nächsten
  Tagen auch Neuerungen in der Rohstoffaußenpolitik der Bundesregierung, die wir im
  Ressortkreis abgestimmt haben, vorstellen. Das ist also, wie gesagt, ein breites
  Feld, in dem wir in vielerlei Hinsicht aktiv sind. Zu einem möglichen AfD-Verbot
  ‑ wir hatten das Thema ja schon öfter ‑ habe ich eine Frage an den Regierungssprecher
  in Bezug auf die aktuellen Äußerungen der Justizministerin , die jetzt noch einmal
  eine systematische Prüfung gefordert hat: War das in der Bundesregierung abgesprochen?
  Hat sich die Haltung der Bundesregierung da jetzt irgendwie weiterentwickelt? Ich
  möchte diesbezüglich noch einmal auf die Worte des Bundeskanzlers verweisen, der
  sich auch zu diesem Thema am Freitag bei der „Westfalenpost“ sehr aktuell geäußert
  hat. Seine Äußerungen lagen auf der bisherigen Linie, und die gilt weiterhin. Hat
  die Bundesregierung bzw. hat das Bundeskanzleramt oder das Bundespresseamt die 400 000
  geleakten E-Mails eigentlich selber schon heruntergeladen? Ich glaube nicht, dass
  das Bundespresseamt E-Mails herunterlädt. Ich glaube, dieses Thema ‑ das ja ein
  ernsthaftes ist ‑ war auch schon Gegenstand hier in der Regierungspressekonferenz.
  Ich glaube, das BMI hatte sich dazu geäußert, wie damit zu verfahren ist. Darauf
  würde ich gern noch einmal verweisen. Unabhängig von der Frage des Herunterladens
  geht es natürlich um die Bewertung dieser Causa. Die Frage, zu der wir uns geäußert
  haben, ist, inwiefern das für die Beobachtung durch das Bundesamt für Verfassungsschutz
  relevant ist. Da gilt grundsätzlich ‑ und das war die Aussage ‑, dass das Bundesamt
  für Verfassungsschutz alle verfügbaren Erkenntnisse für Beobachtungen dieser Art
  nutzt. Ich habe eine etwas philosophische Frage an das BMWE zum Spritpreisdeckel
  : Ist ein Deckel noch ein Deckel, wenn er nichts deckelt? Ich weiß nicht, welche
  Antwort Sie darauf erwarten. Zum Hintergrund ‑ den Sie sicherlich kennen ‑: Laut
  Berechnungen hätte der Deckel, so wie er derzeit ausgestaltet ist, in den vergangenen
  zehn Jahren nie gegriffen. Wird da noch einmal nachgearbeitet? Es gab jetzt auch
  Kritik von einer Kabinettskollegin. Wir nehmen die verschiedenen Äußerungen aus
  dem politischen Raum wahr. Wir haben einen Vorschlag zur Umsetzung dieses Koalitionsbeschlusses
  vorgelegt, und darüber wird jetzt innerhalb der Bundesregierung beraten. Dann noch
  einmal an die Bundesregierung allgemein gefragt: Ab dem 1. Januar stehen nicht nur
  wegen des auslaufenden Tankrabatts Preissteigerungen an bei Benzin und Diesel .
  Kann sich die Bundesregierung darüber hinaus weitere Entlastungen vorstellen, etwa
  beim CO 2 -Preis oder der THG-Minderungsquote? Erst einmal können wir festhalten,
  dass das, was wir diesbezüglich auf den Weg gebracht haben, nämlich die Energiesteuersenkung,
  gerade Tag für Tag Verbraucherinnen und Verbraucher wirklich entlastet. Das sehen
  wir ja an der Zapfsäule, und das möchte ich noch einmal festhalten. Wir haben aber
  auch gesagt ‑ und das ist auch Teil des damaligen Beschlusses des Koalitionsausschusses
  gewesen ‑, dass wir uns natürlich auch über die Phase ab Januar weiter unterhalten
  werden. Der Spritpreisdeckel ist eine Maßnahme, die bis dahin entscheidungsreif
  sein soll; darüber führen wir weiterhin Gespräche. Darüber hinaus prüfen wir auch
  weitere Möglichkeiten. Am Ende hängt dieser Preis aber auch von globalen Entwicklungen
  ab, die wir nur sehr mittelbar in der Hand haben. Es ist immer wichtig, das auch
  einzuordnen. Das ist nicht ein Knopf, den wir drücken können, und auf einmal sind
  globale Marktentwicklungen erledigt. Die größte Hoffnung, die wir haben ‑ auch dafür
  setzen wir uns natürlich ein ‑, ist, dass es an verschiedenen Krisenherden zu einer
  Beruhigung kommt, was auch einen Einfluss auf den Preis haben wird. Und noch einmal:
  Trotzdem prüfen wir weitere Möglichkeiten für die Zeit ab Januar. Eine kleine Ergänzung,
  ohne damit jetzt irgendeine Art von Festlegung zu verbinden: Sie hatten jetzt ganz
  konkret auch den CO 2 -Preis angesprochen. Ich möchte deshalb noch einmal darauf
  aufmerksam machen: Ja, das ist eine Bepreisung, aber die steht ja nicht alleine;
  vielmehr zahlt diese Bepreisung dann auf die Unterstützung des Umstieges ein. Dazu
  gehören auch Industriestrompreis, energieeffiziente Gebäude ‑ Wärmepumpen, Dämmung ‑
  und auch unsere hier schon öfter thematisierte sozial gestaffelte E-Auto-Förderung.
  Das heißt, es ist völlig falsch zu denken, der CO 2 -Preis sei eine reine Belastung.
  Es ist vielmehr eine Bepreisung, die bei der Abkehr von den fossilen Energien unterstützen
  soll. Das, was Sie jetzt zum Anlass nehmen, nämlich die Preise, die wir an den Tankstellen
  sehen, das ist ja gerade die fossile Welt. Umso wichtiger ist es, da herauszukommen
  und die Abhängigkeit von fossilen Energien möglichst schnell zu verringern. Alles
  Weitere hat Herr Meyer schon gesagt. Herr Bowinkelmann, sind dem BMI noch weitere
  Betroffenheiten durch Angriffe auf Kühlgerätesteuerungen bekannt geworden sind in
  den vergangenen Tagen und wenn ja, welche? Grundsätzlich kann ich Ihnen keine Auskunft
  über die Anzahl neuer oder zukünftiger Fälle geben. Insofern habe ich das, was meine
  Kollegin vergangene Woche Mittwoch zu diesem Thema gesagt hat, nicht zu ergänzen.
  Das heißt, seit Mittwoch gibt es bei Ihnen keinen neuen Sachstand, was entsprechende
  Vorfälle ‑ jenseits von Supermärkten auch ein Pharmahändler etc. ‑ angeht? Der aktuelle
  Sachstand wird vor allen Dingen durch das BSI eng beobachtet, das auch mit betroffenen
  Unternehmen bzw. betroffenen Supermärkten im Austausch ist. Ich kann Ihnen hier
  jetzt aber keinen tagesaktuellen Sachstand zum Stand der Ermittlungen und zur Fallzahl
  geben. Da müsste ich gegebenenfalls etwas nachliefern, aber besser kann das gegebenenfalls
  das BSI selbst. Auch an das BMI, aber zu einem anderen Thema: Am Wochenende ist
  vor dem Reichstagsgebäude die Flagge der deutschen Einheit heruntergerissen und
  durch eine Palästinaflagge ersetzt worden. Wie bewerten Sie, dass das möglich war?
  Welche Möglichkeiten sehen Sie, so etwas in Zukunft zu verhindern? Zu der Bewertung
  verweise ich auf die Aussagen von Bundesinnenminister Dobrindt, der sich gestern
  bereits dazu geäußert hat und dies unter anderem als einen Akt der absoluten Respektlosigkeit
  und eine bewusste Provokation beschrieben hat. Er hat auch gesagt, dass es ganz
  offensichtlich mehr Schutzmaßnahmen braucht, um unsere Symbole für Freiheit und
  Demokratie gegen solche Aktionen zu schützen. Bezüglich des Schutzes ist es so,
  dass es sich bei dem Bereich um den Deutschen Bundestag herum um einen eigenen Polizeibezirk
  handelt, in dem sowohl die Bundestagspolizei als auch die Polizei des Landes Berlin
  zuständig ist. Es war auch so, dass vor Ort Kräfte aus beiden genannten Polizeien
  unmittelbar tätig geworden sind und die mutmaßlichen Tatverdächtigen festgenommen
  haben. Zu der Frage, wie der Schutz dieses Flaggenmastes und weiterer Symbole in
  diesem Bereich gestärkt werden kann, ist ein Aushandlungsprozess der Bundestagspolizei
  und der Polizei des Landes Berlin erforderlich. Nach meiner Kenntnis ist es so,
  dass die die Bundestagspolizei für die konkrete Liegenschaft des Bundestages zuständig
  ist, das Areal um den Bundestag herum aber in der Zuständigkeit der Berliner Polizei
  liegt. Insofern würden etwaige Schutzmaßnahmen vor allem in Kooperation und Absprache
  dieser genannten Polizeien erfolgen müssen.'
