title: Statement des Kanzlers beim Europäischen Rat in Brüssel „Europa muss handlungsfähig
  bleiben und souverän werden“
text: 'Kanzler Merz fordert, die Stärkung von Wettbewerbsfähigkeit und Verteidigungsfähigkeit
  in den Fokus des Mehrjährigen Finanzrahmens zu stellen. In Brüssel kommen am 26.
  und 27. November die Staats- und Regierungschefs der EU zu einer Sondertagung des
  Europäischen Rates zusammen. Im Mittelpunkt des Gipfels stehen die Beratungen zum
  kommenden EU -Haushalt, dem sogenannten Mehrjährigen Finanzrahmen. Zum Auftakt der
  Verhandlungen für die Jahre 2028 bis 2034 hat Bundeskanzler Friedrich Merz die Bedeutung
  der Gespräche für die zukünftige Ausrichtung Europas hervorgehoben. Die bislang
  vorliegenden Vorschläge seien aus seiner Sicht noch nicht geeignet, eine Einigung
  zu erzielen. Bundeskanzler Merz nannte die Prioritäten des neuen Haushalts: Europa
  brauche solide Finanzen und dürfe keine neuen Schulden aufnehmen. Zugleich müsse
  die EU zentrale Aufgaben verlässlich finanzieren, insbesondere die Stärkung von
  Wettbewerbsfähigkeit und Verteidigungsfähigkeit sowie die militärische, humanitäre
  und langfristige Unterstützung der Ukraine. Der Bundeskanzler betonte, dass die
  Finanzverhandlungen einem übergeordneten Ziel dienen: „Europa soll handlungsfähig
  bleiben und seine Souveränität stärken.“ Guten Morgen! Wir beginnen heute mit den
  Verhandlungen über den Mittelfristigen Finanzrahmen der Europäischen Union von 2028
  bis 2034. Das heißt, wir sprechen in der Tat über die Zukunft der Europäischen Union,
  über die Zukunft der europäischen Politik für die nächsten Jahre. Deswegen sind
  diese Verhandlungen ausgesprochen wichtig. Die Vorschläge, die bisher auf dem Tisch
  liegen, sind aus unserer Sicht keine Grundlage für einen Abschluss. Nach wie vor
  ist das Volumen zu hoch. Das alles muss ja von den Mitgliedstaaten bezahlt werden
  können. Europa braucht solide Finanzen. Wir werden in der Europäischen Union auch
  keine neuen Schulden machen können und dürfen. Zugleich gibt es eine Reihe von Aufgaben,
  die wir zuverlässig erfüllen müssen. Diese Aufgaben müssen priorisiert werden. Die
  Priorität für Europa ist aus meiner Sicht eine prosperierende Wirtschaft. Der Binnenmarkt
  muss sein ganzes Potenzial entfalten können. Wir brauchen auch eine bessere Verteidigungsfähigkeit.
  Das gilt für ganz Europa, und das gilt auch für die Ukraine. Sie kennen meine Position.
  Wir müssen auch dafür sorgen, dass die Ukraine in den nächsten Jahren ausreichend
  unterstützt wird. Das gilt sowohl militärisch als auch humanitär. Auch der humanitäre
  Aspekt darf nicht kleingeredet werden. Er ist wichtig. Wir müssen diesem Land über
  einen sehr schwierigen Winter helfen, aber wir müssen diesem Land eben auch im Wiederaufbau
  helfen. Das alles ist eine Aufgabe, die wir in der Europäischen Union auch gemeinsam
  leisten müssen. Ich möchte, dass wir konstruktiv in die Gespräche gehen. Ich sehe
  auch die Bereitschaft zu Kompromissen. Aber wir stehen in der Tat erst ganz am Anfang
  dieser Verhandlungen. Insofern werden wir heute zunächst einmal Positionen austauschen.
  Wir werden auch sehen, dass es in einzelnen Bereichen sehr unterschiedliche Vorstellungen
  gibt. Aber ich möchte, dass sozusagen der Überbau erkennbar wird, und er lautet:
  Wir alle müssen ein hohes Interesse daran haben, dass diese Europäische Union politisch
  handlungsfähig bleibt. Denn wir sind in einem globalen Umfeld unterwegs, in dem
  wir ein souveränes Europa brauchen. – Das ist aus meiner Sicht die wichtigste Überschrift:
  Europa muss handlungsfähig bleiben und souverän werden. – Dem muss auch der Mittelfristige
  Finanzrahmen entsprechen, und dem muss er dienen. Frage: (ohne Mikrofon akustisch
  unverständlich) … but not on the Ukraine loan. Bundeskanzler Merz: Für mich gibt
  es einen Zusammenhang zwischen unserer Unterstützung für die Ukraine und dem europäischen
  Budget. Wir mussten im vergangenen Jahr einen Kompromiss machen, auch weil es sehr
  spät im Jahr war. Aber ich sehe für dieses Jahr keine Möglichkeit, das zu wiederholen.
  Ich denke aber, dass es Möglichkeiten gibt, um das zu lösen. Wir werden das in Einzelgesprächen
  vertiefen und darüber möglicherweise erst im Dezember entscheiden. Aber ich hoffe,
  dass wir darüber zu einem Konsens kommen. Frage: (ohne Mikrofon, akustisch unverständlich)
  … die Ukrainefinanzierung an die Budgetverhandlungen zu koppeln, oder hat das die
  Lösung kompliziert? Bundeskanzler Merz: Nein, ich höre sehr viel Zustimmung dafür,
  dass wir das miteinander verbinden. Es gehört ja auch zusammen. Wenn die Europäische
  Union etwas finanziert, dann tut das die Europäische Union als Europäische Union,
  und zu dieser Europäischen Union gehören 27 Mitgliedstaaten und nicht 23 oder 24.
  Wir stehen hier in der Tat vor der ganz grundsätzlichen Frage: Was wollen wir gemeinsam
  als Europäer erreichen? Noch ein Wort zur Ukraine: Das, was wir hier tun, tun wir
  nicht, um den Krieg zu verlängern. Das, was wir hier tun, tun wir, um den Krieg
  so schnell wie möglich zu beenden. Wir tun es auch, um dem Land und den Menschen
  in diesem Land in einer sehr schwierigen Lage zu helfen. Ich denke, niemand in Europa
  kann ein Interesse daran haben, dass wir neue Flüchtlingsströme aus der Ukraine
  bekommen, wenn dieser Krieg nicht zu Ende geht. Wir tun alles, um diesen Krieg zu
  beenden, und wir tun vieles, um den Menschen in der Ukraine zu helfen.'
