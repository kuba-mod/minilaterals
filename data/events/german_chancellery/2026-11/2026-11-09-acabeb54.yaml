title: Rede von Bundeskanzler Merz zum Festakt „20 Jahre Hauptsynagoge Ohel Jakob“
  Kampf gegen Antisemitismus ist fortdauernde Aufgabe
text: 'Bundeskanzler Merz würdigte Charlotte Knobloch, für ihren Verdienst, da ss
  München heute ein Zentrum jüdischen Lebens, nicht nur in Deutschland, sondern in
  ganz Europa sei. In seiner Ansprache zur Festveranstaltung „20 Jahre Hauptsynagoge
  Ohel Jakob“ würdigte Bundeskanzler Friedrich Merz die Entwicklung Münchens zu einem
  Zentrum jüdischen Lebens in Europa. Zugleich betonte er die Verantwortung, jüdisches
  Leben zu schützen, Antisemitismus entschieden entgegenzutreten und die Erinnerung
  an die Shoah in der Mitte der Gesellschaft lebendig zu halten. Neben dem Bundeskanzler
  hielten auch der bayerische Ministerpräsident Markus Söder, die Präsidentin des
  Bayerischen Landtags Ilse Aigner, sowie der Münchner Oberbürgermeister Dominik Krause
  Ansprachen. Für die jüdische Gemeinde sprach die Präsidentin der Israelitischen
  Kultusgemeinde München und Oberbayern, Charlotte Knobloch. Die ursprüngliche Hauptsynagoge
  Münchens stand an anderer Stelle. Sie wurde als eine der ersten Synagogen Deutschlands
  bereits Monate vor der Reichsprogromnacht von den Nationalsozialisten abgerissen.
  Der Grundstein für die neue Hauptsynagoge wurde am 9. November 2003 in Anwesenheit
  von Bundespräsident Johannes Rau gelegt. Ihre Einweihung fand im November 2006 statt.
  Die Ohel-Jakob-Synagoge ist Teil des Jüdische Zentrum München, dem Gemeindezentrum
  der Israelitischen Kultusgemeinde München und Oberbayern in der Altstadt Münchens.
  Zum Jüdischen Zentrum gehören neben der Synagoge außerdem das Kultur- und Gemeindehaus
  mit Versammlungsräumen, Grundschule und Gymnasium, Kindergarten, Jugendzentrum und
  Restaurant sowie das Jüdische Museum. Mit dem Namen Ohel Jakob (deutsch: Zelt Jakobs)
  wird an die in der Reichsprogromnacht 1938 zerstörte orthodoxe Synagoge gleichen
  Namens erinnert. Sehr geehrte Frau Präsidentin, liebe Frau Knobloch, sehr geehrte
  Frau Präsidentin des Bayerischen Landtages, sehr geehrter Herr Ministerpräsident
  und mit Ihnen die Mitglieder der Bayerischen Staatsregierung, sehr geehrte Präsidiumsmitglieder
  und Mitglieder der Israelitischen Kultusgemeinde, Kolleginnen und Kollegen aus dem
  Deutschen Bundestag und aus dem Bayerischen Landtag, erlauben Sie mir zunächst,
  liebe Frau Knobloch, Ihnen für die Einladung, aber auch für Ihre großartige Begrüßungsrede
  herzlich Dank zu sagen. Herzlichen Dank! Hoffnung, so schrieb der ehemalige britische
  Oberrabbiner Jonathan Sacks, ist eine aktive, eine schöpferische Tugend. Die volle
  Bedeutung dieser Worte können wir vielleicht zu verstehen beginnen, wenn wir in
  oder vor dieser Synagoge stehen: ein jüdisches Gotteshaus, mitten in der Stadt,
  aber unter Polizeischutz, bei Tag und Nacht, 365 Tage im Jahr. Die Mauern erinnern
  uns an die mehrtausendjährige Geschichte der Verfolgungen und Vertreibungen, die
  das jüdische Volk erlitten hat. Der Name dieses Hauses ist derselbe, den die Synagoge
  trug, die heute vor 88 Jahren unweit von hier verwüstet und niedergebrannt worden
  ist: Ohel Jakob, Zelt Jakobs. Wie schön sind deine Zelte, Jakob, deine Wohnungen,
  Israel! – So lauten die Segensworte, die im vierten Buch der Tora, im 4. Buch Mose,
  über das jüdische Volk gesprochen werden. Wir werden sie gleich noch einmal vom
  Chor als Psalm in hebräischer Sprache hören. Ich vermag mir nicht vorzustellen,
  wie dieser Psalm in den Ohren derer geklungen hat, die in München und in anderen
  Städten Deutschlands in der Nacht des 9. auf den 10. November 1938 davon wach wurden,
  dass bewaffnete Trupps mit Steinen, Äxten und Benzinkanistern in ihre Geschäfte,
  in ihre Wohnungen, in die Stätten jüdischen Gemeindelebens eindrangen. Sie, liebe
  Frau Knobloch, haben es erlebt. Sie haben erlebt, was kein Mensch, was kein sechsjähriges
  Kind, kein Kind, je erleben sollte. Wie muss dieser Psalm in den Ohren der Millionen
  Männer, Frauen und Kinder geklungen haben, die in den Folgetagen und Folgejahren
  verhaftet und verschleppt worden sind, in die Hölle auf Erden, in die Hölle der
  Konzentrationslager. Wir versuchen oft, die monströse Dimension dieses Verbrechens
  mit der unvorstellbar großen Zahl der Ermordeten zu verstehen, und doch ist der
  Massenmord nur ein Teil dieses Verbrechens, das auf deutschem Boden geschehen ist.
  Wer sich den Fotos aussetzt, die es von dem Leben in den Konzentrationslagern gibt,
  wer den Berichten der Überlebenden zuhört und sie liest, der sieht und hört von
  einem System der gnadenlosen Erniedrigung und Entmenschlichung, der versuchten Zerstörung
  des Menschlichen im Menschen. Man versuchte, die Person im Menschen zu töten, so
  schreibt es Hannah Arendt, noch bevor man den Mord an der physischen Existenz beging.
  Wir können die Namen der deportierten und ermordeten jüdischen Münchnerinnen und
  Münchner an den Wänden des Tunnels lesen, der die Synagoge mit dem Gemeinde- und
  Kulturzentrum verbindet. Ihr Leid sprengt unser aller Vorstellungsvermögen. Wir
  können es nicht in Worte fassen. Aber was ich sagen kann, das ist dies: Ich bin
  als Deutscher unendlich dankbar dafür, dass Jüdinnen und Juden nach der Schoah hier
  in unserem Land und hier in München gleichsam wieder ihre Zelte aufgeschlagen haben,
  dass hier Gemeinden entstanden, Kindergärten, Seniorenheime, Restaurants, dass Synagogen
  gebaut worden sind und immer noch gebaut oder wiederhergestellt werden. Ich denke
  an den bewegenden Festakt, mit dem wir die Synagoge Reichenbachstraße im vergangenen
  Jahr wiedereröffnet haben, und ich denke an die Worte, die Sie, liebe Frau Knobloch,
  bei der Eröffnung dieser Synagoge vor 20 Jahren gesprochen haben ‑ wir haben es
  im Film eben noch einmal gehört ‑: „Wir haben gebaut, wir bleiben, denn wir gehören
  hierher.“ Wir gehören hierher – trotz des Brandanschlags auf ein jüdisches Altenheim
  1970, trotz des Olympia-Attentats 1972, trotz des antisemitischen Anschlags vor
  zwei Jahren, am 5. September 2024. Wir gehören hierher. – Das sind Worte der Hoffnung,
  einer schöpferischen Hoffnung, die „trotzdem“ sagt. Wir gehören „trotzdem“ hierher.
  Ich bin Ihnen, liebe Frau Dr. Knobloch, für dieses „trotzdem“ unendlich dankbar.
  Ich denke, ich darf das im Namen aller sagen, die heute hier dabei sind. Ich bin
  der Israelitischen Kultusgemeinde München und Oberbayern für dieses „trotzdem“ dankbar.
  Dieses „trotzdem“ hat so vieles entstehen lassen. München ist heute – Sie wissen
  es, das ist Ihr großes Verdienst – ein Zentrum jüdischen Lebens, nicht nur in Deutschland,
  sondern in ganz Europa. Seit 2023 hat in dieser Stadt, auf deutschem Boden, die
  Europäische Rabbinerkonferenz ihren Sitz. Das ist ein Grund zu großer Freude. Vergangene
  Woche ist in Frankfurt die Jüdische Akademie eröffnet worden ‑ die erste überregionale
  jüdische Bildungseinrichtung, die es in Deutschland seit der Schoah gibt, ein der
  Zukunft zugewandter Ort für Dialog und Begegnung. Auch das ist Grund zur Freude.
  Meine Damen und Herren, die Bundesrepublik Deutschland ist gegründet worden in dem
  großen Wunsch, dass solche Taten der Hoffnung auf deutschem Boden wieder geschehen
  würden. „Die Würde des Menschen ist unantastbar“, das ist, wie Sie alle wissen,
  der erste Satz unseres Grundgesetzes, formuliert in der frischen Erinnerung und
  im frischen Entsetzen darüber, dass in Deutschland ein Regime gegen diese tiefe
  Wahrheit, gegen dieses oberste moralische Gebot errichtet worden ist. Es war ein
  zentraler Bestandteil des Reifungsprozesses unserer Demokratie, unserer Bundesrepublik,
  anzuerkennen, dass dieses Gebot für uns Deutsche eine besondere Verantwortung gegenüber
  dem jüdischen Volk bedeutet. Die deutsche Gesellschaft hat nach 1945 zunächst versucht,
  die Schuld zu verdrängen. Der Antisemitismus wirkte fort. Ich möchte Ihnen sagen,
  die Sie heute hier sind: Ich stehe hier vor Ihnen – als Deutscher und als Bundeskanzler
  der Bundesrepublik Deutschland –, froh darüber, dieses Jubiläum mit Ihnen feiern
  zu können, in Bewunderung für Ihre Widerstandsfähigkeit. Ich stehe hier im vollen
  Wissen um Deutschlands Pflicht gegenüber dem jüdischen Volk und in dem Wissen, dass
  die Zeiten uns in die Pflicht nehmen, dass sie von uns höchste Wachsamkeit und Taten
  verlangen. Denn der Antisemitismus ist heute wieder allgegenwärtig. Wir sehen und
  wir hören ihn auf unseren Straßen, in unseren Städten, in den Städten unserer europäischen
  Nachbarn und weltweit; in den Parlamenten, in den Vereinen, in Schulen. Bisweilen
  wird er mit der Sprache des antikolonialen Freiheitskampfes oder der Israelkritik
  getarnt; hin und wieder wird er mit Geschichtsklitterung gerechtfertigt. Wir wissen
  aus der historischen Forschung, dass Antisemitismus, dass Judenhass, besonders in
  Zeiten der Krisen, in Zeiten der Umwälzung aufgeflammt ist. Die lange Geschichte
  des jüdischen Lebens in München ist auch davon geprägt – von Zyklen der Vertreibung,
  Verfolgung, Gewalt. Wir leben erneut in Zeiten historischer Umwälzungen. Darum ist
  jetzt die Bewährungsprobe des „Nie wieder“, das wir so oft und zu so vielen Anlässen
  aussprechen. Wir tun als Bundesregierung und wir werden weiterhin tun, was in unserer
  Macht steht, um jüdisches Leben in unserem Land und in der Welt zu schützen. Wir
  stehen dabei unverbrüchlich an der Seite Israels. Dass es auf der Welt ein Land,
  einen Staat gibt, in dem Jüdinnen und Juden keine schutzbedürftige Minderheit sind,
  in dem sie Schutz finden können, wenn die Barbarei in ihren Heimatländern erneut
  gewinnt, auch das gehört zu unserer historischen Verantwortung. „Wie schön sind
  deine Zelte, Jakob, deine Wohnungen, Israel!“ Ich vermag mir nicht vorzustellen,
  wie diese Worte in den Ohren derer klingen, die am 7. Oktober 2023 erleben mussten,
  wie die barbarischen Angreifer der Hamas auf das Gelände des Nova-Musikfestivals,
  in die Kibbuzim, in Wohn- und Schlafzimmer eindrangen mit nur diesem einen Ziel,
  zu morden und Leid über Israel zu bringen. Wir unterstützen Israel, dass es nach
  außen und innen wieder sicher wird. Wir verstärken in Zusammenarbeit mit den Ländern
  den Schutz jüdischen Lebens, jüdischer Einrichtungen in unserem Land. Meine Damen
  und Herren, geben wir es zu: Und doch sind diese Maßnahmen immer nur Notbehelf.
  Ein Gotteshaus, ein Kindergarten mit Polizisten davor ist sicher ‑ ja, wahrscheinlich.
  Aber es ist doch zugleich ein entsetzlicher Anblick. Hohe Mauern, Panzerglas, bewaffnete
  Sicherheitskräfte vor jüdischen Einrichtungen: Das erinnert beständig daran, dass
  ein normales, offenes, sichtbares jüdisches Leben in Deutschland eben immer noch
  nicht möglich ist. Nun können wir den Kampf gegen den Antisemitismus nur in den
  Köpfen gewinnen. Ich dachte – und viele meiner Generation dachten wohl auch –, dass
  wir damit erfolgreicher gewesen wären, als wir es wohl tatsächlich bisher gewesen
  sind. Und ich muss zweifelnd fragen: Wissen wir eigentlich genug über die Ursachen
  von Antisemitismus, und haben wir genug getan, diese Ursachen zu bekämpfen? Haben
  wir als deutsche Gesellschaft Antworten darauf, wie wir die Erinnerung an die Shoah
  nach dem Verstummen der Zeitzeuginnen und Zeitzeugen tatsächlich lebendig halten
  können? Ja, wir haben eine ganz vielfältige Erinnerungslandschaft in Deutschland.
  Sie ist das Werk von großartig engagierten Menschen jeden Alters, von vielfältigen
  Initiativen – und ich danke allen. Es kommt jetzt aber darauf an, dass wir das Gedenken
  sichtbar in der Mitte der Gesellschaft halten und dass wir seine parteipolitische
  Instrumentalisierung verhindern, ebenso wie seine Auslagerung in Milieus oder Erstarrung
  in Ritualen. Denn auch das müssen wir wieder neu lernen und neu verstehen: Erinnerung
  und der Kampf gegen Antisemitismus sind fortdauernde Aufgaben, die immer neue Anstrengung
  und immer neuen Einsatz von uns fordern. Und wenn ich „uns“ sage, dann meine ich
  jede und jeden, der in unserem Land lebt; gleichgültig, ob als Kind deutscher Eltern
  geboren, ob eingebürgert, ob auf der Suche nach Heimat hier. Historische Verantwortung
  heißt, Antisemitismus zu widersprechen und ihm entgegenzutreten, wo immer er sich
  zeigt. Jüdinnen und Juden zuzuhören und sich solidarisch an ihre Seite zu stellen,
  wo sie von Antisemitismus berichten. Anteil zu nehmen am Schicksal Israels. Sich
  auch immer wieder dem Blick in den Abgrund zu stellen, den die Bilder der Konzentrationslager
  bedeuten. Aber auch: freudigen Anteil zu nehmen, wo Jüdinnen und Juden ein Zeichen
  der Hoffnung auf ein friedliches Leben in unserem Land setzen – so wie hier und
  heute. Historische Verantwortung heißt, meine Damen und Herren, die demokratische
  Mitte, die Lebensader unserer freiheitlichen Demokratie, lebendig zu halten – durch
  unser aller Engagement in Parteien, in Vereinen und Ehrenämtern; durch gutes Regieren;
  durch Überzeugen; ja, auch durch Streit, wo er notwendig ist; aber auch durch Eintreten
  für unsere Werte dort, wo Menschen die Systemfrage stellen. Unser freiheitlicher
  demokratischer Rechtsstaat ist die Grundlage für ein Miteinander, in dem alle sicher
  sind. Seine Wehrhaftigkeit ist unsere gemeinsame Aufgabe. Daran mitzuarbeiten, schafft
  Hoffnung und stiftet Hoffnung. Sehr geehrte Damen und Herren, ich möchte es ein
  drittes Mal sagen: „Wie schön sind deine Zelte, Jakob, deine Wohnungen, Israel!“
  Es sind die besten Worte für das, was wir den Jüdinnen und Juden in aller Welt,
  den Jüdinnen und Juden in Israel, den Jüdinnen und Juden in Deutschland und hier
  in München wünschen: die Sicherheit, ein langes und gutes und erfülltes Leben führen
  zu dürfen; Heimstätte; die Ruhe und den Schutz von Heimat. Wir feiern heute 20 Jahre
  Ohel Jakob – 20 Jahre, liebe Frau Knobloch, tätiger Hoffnung. Möge dieses Zelt Jakobs
  200 Jahre alt und älter werden. Möge es der Ort für ein unbeschwertes jüdisches
  Leben in unserem Land sein – ein Leben, in dem es Grund für Hoffnung im Überfluss
  gibt. Das ist das Land, das wir sein wollen. Wenn wir alle mitmachen, meine Damen
  und Herren, ist es das Land, das wir auch sein können.'
