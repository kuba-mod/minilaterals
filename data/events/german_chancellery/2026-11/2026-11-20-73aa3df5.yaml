title: Bundeskanzler Merz empfängt NATO-Generalsekretär Rutte
text: Bundeskanzler Friedrich Merz wird am Montag, den 23. November 2026 um 15:30
  Uhr NATO-Generalsekretär Mark Rutte im Kanzleramt empfangen. In einem gemeinsamen
  Gespräch werden sicherheitspolitische Themen im Mittelpunkt stehen, vor allem die
  weitere Unterstützung der Ukraine und die Anstrengungen zur Beendigung des russischen
  Angriffskrieges. Vor dem Gespräch ist eine Begegnung mit der Presse geplant.
