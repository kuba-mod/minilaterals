title: 'Nach Beitritt Spaniens: Europäisierung von ARTE entschlossen voranbringen
  – Staatsminister Weimer: „Eine Blaupause für weitere europäische Senderzusammenarbeit"'
text: 'Staatsminister Wolfram Weimer hat gemeinsam mit dem spanischen Kulturminister,
  Ernest Urtasun, und der französischen Kulturministerin, Catherine Pégard, die Europäisierung
  von ARTE in Spanien im Kreise der europäischen Kultur- und Medienministerinnen und
  -minister vorgestellt. ARTE und der spanische öffentlich-rechtliche Medienanbieter,
  Radio Televisión Espanola (RTVE), hatten Ende September eine neue bilaterale Kooperationsvereinbarung
  geschlossen. Damit wird das Angebot von ARTE für ein spanisches Publikum geöffnet.
  Inhalte des europäischen Kulturkanals ARTE können demnach künftig über einen eigenen
  ARTE-Bereich in der Video-on-Demand-Plattform „RTVE Play" geschaut werden. Durch
  Untertitelung und Synchronisierung soll das spanische Publikum einen leichteren
  Zugang zu einer Auswahl europäischer Produktionen haben. „Mit dieser Europäisierung
  tragen wir gemeinsam ganz wesentlich zur Gestaltung einer sachlich demokratischen
  Debatte bei", sagte Staatminister Weimer an Rande des Rates in Brüssel. „Ich begrüße
  den Beitritt Spaniens zu diesem wichtigen Schritt ARTEs hin zu einer Europäisierung.
  Spanien zeigt: Das ist der Weg zu einem europäischen Ansatz. Darüber habe ich gestern
  auch mit meiner französischen Amtskollegin gesprochen. Dies könnte auch ein Vorbild
  für eine noch engere Zusammenarbeit zwischen Deutscher Welle und France Médias Monde
  sein. Durch eine weitere Bündelung ihrer Kräfte könnten sie noch wirksamer für die
  Verfügbarkeit verlässlicher Informationen auch außerhalb der Europäischen Union
  vorgehen." Der Kulturminister Spaniens Ernest Urtasun: „Spanien ist einen weiteren,
  wesentlichen Schritt zur Europäisierung von ARTE gegangen. Dieses Projekt ist ein
  profund europäisches. Wir wollen, dass sich ARTE zu einer Plattform weiterentwickelt,
  die die Vielfalt und Diversität unserer europäischen Kulturen vertieft und widerspiegelt
  und damit tatsächlich zu einer europäischen Plattform wird." Spanien hat einen AOB
  (Any Other Business) zu ARTE und RTVE in die Sitzung des Rates für Bildung, Jugend,
  Kultur und Sport eingebracht. Vor dem Hintergrund eines zunehmenden Wettbewerbs
  zwischen globalen Plattformen und einer größeren Vielfalt bei den Zugangswegen zu
  Kulturgut und der Verbreitung von Inhalten sei die Stärkung der Zusammenarbeit zwischen
  öffentlich-rechtlichen Medien nicht nur eine kulturelle Frage, heißt es in dem zugrundeliegenden
  Papier. Es sei auch ein strategisches Bekenntnis zu einem pluralistischen europäischen
  audiovisuellen Ökosystem, das die Werte der Europäischen Union und der Einheit in
  Vielfalt widerspiegele.'
