date: '2026-11-16'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 16. November 2026
text: 'stellvertretender Regierungssprecher Hille (Vorsitzender Szent-Iványi eröffnet
  die Pressekonferenz und begrüßt SRS Hille sowie die Sprecherinnen und Sprecher der
  Ministerien.) Ich darf Ihnen eine Reise des Außenministers ankündigen. Außenminister
  Wadephul wird morgen, am Dienstag, nach Aserbaidschan reisen. Er wird sich dort
  mit Staatspräsident Alijew und Außenminister Bayramov treffen. In den Gesprächen
  wird es vor allem um die Umsetzung der gemeinsamen strategischen Agenda, die im
  Juli zwischen Bundeskanzler Merz und Präsident Alijew unterzeichnet wurde, und Themen
  der regionalen Sicherheit und der Konnektivität gehen. Dazu gehört natürlich der
  Friedensprozess zwischen Armenien und Aserbaidschan sowie die Rolle Russlands im
  Südkaukasus. Am Mittwoch wird der Außenminister weiternach Armenien reisen . Dort
  wird er auf Premierminister Paschinjan und Außenminister Mirsojan treffen. Auch
  in Armenien wird es um die Umsetzung der strategischen Agenda gehen, die im Dezember
  2025 zwischen Bundeskanzler Merz und Premierminister Paschinjan vereinbart wurde,
  sowie Fragen regionaler Sicherheit, der Normalisierung der Beziehungen mit Aserbaidschan
  und der Türkei und Möglichkeiten für eine vertiefte Zusammenarbeit mit der Europäischen
  Union. Insgesamt dient die Reise dazu, die positive Dynamik zu unterstützen, die
  sich seit dem Washingtoner Friedensgipfel von 2025 zwischen Armenien und Aserbaidschan
  entwickelt hat, und diese zu verstärken. Meine Frage richtet sich zunächst an das
  Auswärtige Amt. Herr Hinterseher, in Wien treffen sich heute verschiedene Staaten,
  unter anderem auch der deutsche Innenminister, um über „Return Hubs“ in Ruanda zu
  sprechen, und immer wieder taucht das Thema der Rechtsstaatlichkeit auf. Jetzt war
  Staatsministerin Güler gerade in Ruanda. Deshalb hätte ich gerne einfach eine Einschätzung
  von Ihnen: Wie bewertet das Auswärtige Amt die Rechtsstaatlichkeit von Ruanda? Ich
  kann Ihnen jetzt eine grundsätzliche, generelle Darlegung der Rechtsstaatlichkeit
  in Ruanda nicht anbieten. Das Thema als solches liegt beim Bundesinnenministerium,
  und deshalb würde ich Sie gerne an den Kollegen verweisen. Dann kann man es vielleicht
  so machen, dass Herr Menkel kurz etwas sagt, und dann frage ich noch einmal nach.
  Das würde mich nämlich schon sehr interessieren, weil ja die Staatsministerin auch
  mit Paul Kagame persönlich zusammengetroffen ist. Herr Menkel, wir wissen ja auch,
  dass es noch zu einer Pressekonferenz kommen wird. Aber kommt dieser Schritt jetzt,
  und wie bewerten Sie die Lage in Ruanda? Warum ist das das Land, für das man sich
  womöglich entscheidet? Vielen Dank für die Frage. Was ich Ihnen nach jetzigem Stand
  bestätigen kann, ist, dass Deutschland mit vier weiteren europäischen Staaten unter
  Beteiligung der EU-Kommission bekanntermaßen Gespräche mit verschiedenen Partnerländern
  in der Absicht führt, die auf europäischer Ebene geschaffene Rechtsgrundlage für
  „Return Hubs“ auch auszufüllen. Konkreten Anlass, mich zur Menschenrechtslage gerade
  in Ruanda zu äußern, sehe ich nach jetzigem Stand nicht. Der Minister befindet sich,
  wie Sie sagten, heute in Wien bei der Vienna Migration Conference. Am Rande derselben
  wird es auch ein Treffen der sogenannten „core group“ aus den EU-Mitgliedstaaten
  geben, und im Anschluss ist auch eine Pressekonferenz vorgesehen. Wenn Sie mich
  nach der grundsätzlichen Menschenrechtslage und der Lage für Geflüchtete in Ruanda
  fragen, dann würde ich sagen, dass Ruanda eine gute Bilanz im Umgang mit Migranten
  und Geflüchteten hat. Es nimmt bereits jetzt Geflüchtete aus der Region auf, auch
  vulnerable Geflüchtete, zum Beispiel aus Libyen. Der UNHCR äußerte sich wiederholt
  positiv zur ruandischen Flüchtlingspolitik und zur Inklusion von Flüchtlingen in
  Ruanda, und insgesamt befinden sich nach unserem Kenntnisstand 120 000 Geflüchtete
  in Ruanda. Sie können ja vielleicht zu den „Return Hubs“ zumindest schon sagen ‑ Frage
  an das BMI ‑, unter welchen Bedingungen denn die Menschen dort untergebracht werden.
  Muss man sich das also eher als Lager oder als Haft vorstellen, oder haben die da
  ganz freie Bewegungsmöglichkeiten? Da werde ich dem Ergebnis der Gespräche jetzt
  nicht vorgreifen. Was Sie schon der Rechtsgrundlage der europäischen Rückkehrverordnung
  entnehmen können, ist, dass diese vorsieht, dass verbindliche Vereinbarungen mit
  einem Partnerstaat getroffen werden, um neben Verfahrensfragen natürlich insbesondere
  die Garantie von Menschenrechtsstandards abzusichern, und dem wird im Rahmen der
  Gespräche natürlich Rechnung getragen werden. An das BMI: Warum sehen Sie keinen
  Anlass, sich über die konkrete Situation der Menschenrechtslage in Ruanda ins Bild
  zu setzen und diese auch mitzuteilen? Es ist doch Rechtslage, dass Deutschland nicht
  in Länder ausweisen oder abschieben darf, und faktisch wäre es so etwas, in denen
  Betroffenen Gefahr für Leib und Leben und Verfolgung droht. Dann müssen Sie doch
  die Voraussetzung dafür schaffen, dass Sie sagen, und zwar, bevor Sie eine solche
  Entscheidung treffen: Ja, in Ruanda sind die Verhältnisse so, dass wir das machen
  können. Ich verweise noch einmal auf die Gespräche mit mehreren in Betracht kommenden
  Partnerstaaten. Diese Gespräche führen wir auch vertraulich, sodass ich dem Ergebnis
  unter anderem der Vienna Migration Conference nicht vorgreifen kann. Noch einmal:
  Die Rechtsgrundlage schon auf europäischer Ebene sieht Sicherungsmechanismen zur
  Einhaltung der Menschenrechte vor, und dem wird Rechnung getragen werden. Ist der
  Bundesregierung bekannt, dass der Europäische Gerichtshof für Menschenrechte in
  einem vorangegangenen Fall der britischen Regierung untersagt hatte, illegal ins
  Land gekommene Menschen nach Ruanda abzuschieben, weil denen eben dort Gefahr für
  Leib und Leben droht? Das ist doch eine konkrete historische Erfahrung. Inwiefern
  fließt die in Ihre Überlegungen und die Feststellung der Rechtsstaatlichkeit ein?
  Die Tatsache, dass Sie sich mit anderen darüber absprechen, enthebt doch die Bundesregierung
  nicht der Verpflichtung, für sich selbst diese Grundlagen zu prüfen. Grundsätzlich,
  ohne das großbritannische Modell oder andere Modelle bewerten zu wollen, sind „Return
  Hubs“ etwas anderes. Es geht hierbei um vollziehbar ausreisepflichtige Personen,
  deren Asylverfahren zum Beispiel in Deutschland abgeschlossen sind und bei denen
  feststeht, dass diese die Bundesrepublik und auch Europa grundsätzlich wieder verlassen
  müssen. Noch einmal: Die EU-Rückkehrverordnung gibt uns vor, im Verfahren zur Errichtung
  von „Return Hubs“ menschenrechtlichen Fragen Rechnung zu tragen, und dem wird in
  diesem Verfahren Rechnung getragen werden. Herr Hille und auch Herr Menkel, die
  nichtstaatliche Organisation Freedom House bezeichnet Ruanda als unfrei. Inwiefern
  ist es denn politisch sinnvoll, mit so einem Land zusammenzuarbeiten und es dann
  in solchen Fragen als Partnerland zu bezeichnen? Auf die Gefahr hin, mich zu wiederholen,
  sehe ich jetzt keinen Anlass, mich konkret zu Ruanda zu äußern. Der Kollege hat
  das doch gerade in aller Breite ausgeführt. Es geht darum, dass Optionen geprüft
  werden ‑ so habe ich die Ausführungen des Kollegen verstanden ‑, und genau das findet
  statt. Ich kann vielleicht noch einmal ein Dach oben drüber bauen: Sie wissen alle,
  was für eine Bedeutung die Migrationspolitik für diese Bundesregierung, aber auch
  in der Europäischen Union hat. Sie wissen, was wir an nationalen Maßnahmen getroffen
  haben. Ihnen ist bewusst, dass in diesem Jahr GEAS, das gemeinsame Asylsystem, beschlossen
  worden ist und anfängt, erste Wirkungen zu entfalten. Genau in diesem Bogen sind
  auch weitere Maßnahmen wie das Eruieren von Möglichkeiten für solche „Return Hubs“
  zu betrachten, und genau daran arbeitet die Bundesregierung. Die Organisation Reporter
  ohne Grenzen spricht in Bezug auf Ruanda von einer sehr ernsten Lage für die Pressefreiheit.
  Kolleginnen und Kollegen, die dort hinfahren wollen, berichten regelmäßig, dass
  Visaanträge von Journalisten nicht bearbeitet oder abgelehnt werden. Inwieweit würden
  Sie sich denn dafür einsetzen, dass Kolleginnen und Kollegen dort hinfahren und
  sich die Lage vor Ort anschauen können, wenn es zur Einrichtung solcher Zentren
  vor Ort kommt? Ich will nicht sagen, dass ich etwas erschrocken über diese Frage
  bin, aber ein bisschen bin ich es. Natürlich spielen menschenrechtliche Standards
  eine große Rolle für diese Bundesregierung, und natürlich wird sich das in allen
  möglichen Vereinbarungen über solche Modelle niederschlagen und wiederfinden müssen;
  das ist doch vollkommen klar. Ich habe zwei Fragen, eine davon an das BMZ. Die erste
  Frage ist, auch wenn Sie der PK noch nicht vorgreifen wollen: Führt das BMI die
  Gespräche allein, oder ist das Auswärtige Amt beteiligt, das ja üblicherweise eher
  mit anderen Staaten redet? Wer genau führt also diese Gespräche über die „Return
  Hubs“? Die Frage an den Sprecher im BMZ: Deutschland hat die Entwicklungszusammenarbeit
  mit Ruanda vor gut einem Jahr wegen der Unterstützung Ruandas der Rebellen im Kongo
  ausgesetzt. Hat sich daran etwas geändert? Wie bewerten Sie gerade die Grundlage
  für eine Zusammenarbeit mit Ruanda? Ich würde vielleicht gerne einmal den Aufschlag
  bezüglich Ihrer zweiten Frage machen. Natürlich befinden wir uns hinsichtlich dieser
  Themen, also der außenpolitischen Themen im Umgang mit Ruanda, in einem stetigen
  Austausch. Sie wissen: Unsere Beziehungen zu Ruanda sind vielfältig und auch nicht
  immer einfach, und das liegt natürlich vor allem auch an der völkerrechtswidrigen
  Präsenz Ruandas im Ostkongo. Gleichzeitig würdigen wir auch die bewegte Geschichte
  des Landes nach dem Genozid an den Tutsi Mitte der Neunzigerjahre und die beeindruckende
  Entwicklung seither. Ich glaube, es wurden jetzt auch Themen vermischt, einerseits
  die Presse- und Meinungsfreiheit und dann auf der anderen Seite die Situation von
  Geflüchteten im Land. Diese beiden Dinge würde ich gerne einmal voneinander trennen.
  In Ruanda werden Basisdienstleistungen bereitgestellt ‑ es gibt Sicherheit und Versorgung
  für die Menschen ‑, und wir sehen zugleich die Bemühungen Ruandas, auch die Menschenrechtslage
  im Land zu verbessern. Zugleich werden im Ostkongo, beispielsweise durch M23 und
  auch ruandische Truppen, Menschenrechtsverletzungen begangen. Sie wissen auch, Sie
  hatten es selbst erwähnt: Staatsministerin Güler war vor einigen Wochen in Kigali
  ‑ ich glaube, das war Ende oder Mitte Oktober ‑ und hat dort Gespräche geführt.
  Es gibt also all diese Bemühungen. Es gibt auch einen Menschenrechtsdialog mit dem
  Land. Zugleich hatten wir gerade etwas zur Lage für Geflüchtete im Land selbst ausgeführt.
  Dies nur als Vorwegnahme einer Einordnung. Ja, ich kann das auch gerne noch einordnen.
  Auch hierbei ist es wichtig, das voneinander zu trennen. Sie haben völlig recht:
  Die Entwicklungszusammenarbeit und neue Zusagen an Ruanda wurden aufgrund der Rolle
  Ruandas im Konflikt im Ostkongo ausgesetzt. Anfang dieses Jahres gab es in geringem
  Umfang einige neue Zusagen. Das ist aber jetzt völlig unabhängig von der Frage nach
  der Einrichtung von „Return Hubs“ in Ruanda zu betrachten, die im Raum steht. Das
  eine, wie gesagt, war ganz klar eine Reaktion mit Blick auf die Rolle Ruandas im
  Ostkongo, die wir in der Zusammenarbeit mit Ruanda gezogen haben. Was aus entwicklungspolitischer
  Perspektive mit Blick auf Migration und Rückkehr besonders relevant ist, ist vor
  allem die Arbeit an freiwilliger Rückkehr. Die Ministerin befindet sich gerade im
  Irak, wo das eine große Rolle spielt. Der Wiederaufbau im Irak hat erstaunliche
  und wirklich herausragende Fortschritte gemacht. Wir arbeiten zum Beispiel mit dem
  Irak daran, freiwillige Rückkehr zu ermöglichen und auch präventiv Menschen im Irak
  in die Lage zu versetzen, dort künftig ihr Leben zu bestreiten, was zum Beispiel
  Wassersicherheit angeht. Auch das ist ein großes Thema der aktuellen Reise. Wenn
  ich nachfragen darf: Habe ich das richtig verstanden? Sie haben erst gesagt, die
  Zusammenarbeit sei ausgesetzt, aber es gab dieses Jahr kleinere Zusagen. Die Aussetzung
  gilt also damit nicht mehr, oder wie ist das zu verstehen? Korrekt. Es gab kein
  Aussetzen der Entwicklungszusammenarbeit, sondern es gab ein Zurückhalten neuer
  Zusagen in Reaktion auf die Rolle Ruandas im Ostkongo, und in diesem Jahr gab es
  erste geringe Neuzusagen. Herr Hille, wie kann der Innenminister oder das Innenministerium
  bzw. der CDU-Teil der Regierung so ein Projekt angesichts der Ablehnung durch den
  Koalitionspartner vorantreiben? Es gab sehr viele SPD-Abgeordnete, die sich heute
  Morgen dagegengestellt haben. Dazu hat der Kollege doch gerade auch schon Stellung
  genommen und darauf hingewiesen, dass es erste Überlegungen und Prüfungen der Umsetzung
  eines solchen Modelles mit diversen Partnerländern gibt. Es ist ein frühes Stadium,
  und da verstehe ich, ehrlich gesagt, jetzt die gewisse Aufregung, die entsteht,
  auch nicht. Das Thema der Migrationspolitik hat für diese Bundesregierung und hat
  in Deutschland eine große Bedeutung. Wir haben die Migrationswende, wie Sie sich
  erinnern können, seitdem wir an der Regierung sind, umgesetzt. Das zeigt deutliche
  Wirkung in Deutschland. Ich habe gerade schon auf den europäischen Schritt verwiesen,
  der mit dem Gemeinsamen Europäischen Asylsystem verbunden ist. Genau diesen Pfad,
  diesen Weg gehen wir weiter. In diesem großen Bogen sind auch sogenannte Drittstaatenmodelle
  bzw. „Return Hubs“ eine Option, die derzeit geprüft wird, und dazu hat der Kollege
  Ihnen gerade die Rahmenbedingungen erläutert. Das heißt also, es geht nicht um eine
  Endentscheidung, sondern das ist noch ein Prozess. Stimmt das? Das befindet sich
  alles im Prozess. Genau so hat der Kollege es ja gerade gesagt. Ja, aber darum dreht
  sich die Frage schon, und ich würde auch gerne noch einmal in Bezug auf das nachfragen,
  wonach die Kollegin fragte. Sie sagten eben, es gehe um Optionen, die man prüfen
  würde usw. Deswegen stellt sich erstens die Frage: Fährt die Bundesregierung in
  Form von Herrn Dobrindt jetzt sozusagen mit einer abgestimmten Haltung der Bundesregierung
  nach Wien, die auch mit der SPD im Konsens gefunden worden ist, und können wir zusammen
  mit Partnerländern eine Entscheidung in Wien über die Einrichtung eines möglichen
  Abschiebehubs erwarten, oder ist das nur, wie Sie es eben gesagt haben, eine Option,
  die man prüft, und der Prozess wird dann weitergehen? Das habe ich tatsächlich auch
  noch nicht verstanden. Da würde ich auch wieder zu dem Kollegen aus dem BMI schauen,
  weil ich jetzt keinen so detaillierten Blick auf den Termin in Wien habe, da ja
  der Bundesinnenminister daran teilnimmt. Sie, Herr Hille, wissen also nicht von
  einer abgestimmten Haltung der Bundesregierung mit der SPD und der Koalition, die
  jetzt dort in Wien verhandelt wird? Ich habe doch gerade darauf verwiesen, dass
  es um die Prüfung von Optionen und erste Gespräche in dieser Frage geht. Deswegen
  habe ich zur Konkretisierung noch einmal nachgefragt, aber vielleicht kann Herr
  Menkel es ja konkreter sagen. Geht es heute um eine Entscheidung? Gibt es eine mit
  der SPD abgestimmte Position der Bundesregierung? Etwas ausholend: Der Bundesinnenminister
  als in der Bundesregierung für Fragen der Migration und Rückführung federführend
  zuständige Minister führt heute Gespräche in Wien. Dabei geht es um die Ausfüllung
  von Rechtsgrundlagen des europäischen Rechts, die Mitte Oktober in Kraft getreten
  sind, denen Deutschland so zugestimmt hat. Wir wissen im Hintergrund auch noch von
  einem Beschluss der Ministerpräsidentenkonferenz. Von daher ist das ein relativ
  üblicher Vorgang. Den Gesprächen ‑ da bitte ich Sie noch um vier Stunden und rund
  elf Minuten Geduld ‑ werde ich jetzt nicht vorgreifen. Aber Sie können doch sagen,
  ob es einen mit der SPD abgestimmten Vorschlag oder einen abgestimmten Vorstoß gibt,
  den der Minister ‑ egal, ob es um Ruanda oder Timbuktu oder was auch immer geht ‑
  jetzt dort vorlegen wird. Das ist ja nur die Frage. Ich bitte um Verständnis, dass
  ich mich zu politischen Vorabstimmungen innerhalb der Bundesregierung nicht äußere
  und den Gesprächen in Wien heute nicht vorgreife. Auch auf die Gefahr hin, dass
  wir uns zum zweiten, dritten, vierten Mal wiederholen: Sowohl der Kollege als auch
  ich haben darauf hingewiesen, dass die Gespräche über dieses Thema auf europäischer
  Ebene laufen und auch innerhalb der Bundesregierung laufen. Sie kennen das von mir:
  Ich bin ein Freund der Einhaltung von Schrittfolgen. Es ergibt doch auch in diesem
  Fall wenig Sinn, wieder den fünften Schritt vor dem ersten Schritt zu machen. Ein
  Schritt nach dem anderen! Es werden Optionen geprüft, dazu laufen Gespräche auf
  europäischer Ebene und innerhalb der Bundesregierung, dann kommt man zu einem Ergebnis,
  und dann schauen wir weiter. Ich wage zu prognostizieren, dass wir uns an dieser
  Stelle noch das eine oder andere Mal mit diesem Thema beschäftigen werden. Wir versuchen
  ja nur, nicht über die Füße zu stolpern, Herr Hille. Ich habe eine Lernfrage an
  Sie und gegebenenfalls an Herrn Hinterseher: Deutschland ist noch Teil der Europäischen
  Menschenrechtskonvention, und Deutschland muss sich weiterhin an die Rechtsprechung
  des Europäischen Gerichtshofs für Menschenrechte halten, korrekt? Herr Menkel, dann
  habe ich eine Frage an Sie. Das Bundesverfassungsgericht ‑ Sie sind ja auch das
  Verfassungsministerium ‑ hat klargestellt, dass es eine Berücksichtigungspflicht
  deutscher Behörden bzw. deutscher Ministerien bei Urteilen des EGMR, also des Europäischen
  Gerichtshofs für Menschenrechte, gibt. Der Kollege hat es gerade schon angesprochen.
  Es gibt ein Urteil in Sachen Großbritannien, das Ähnliches probiert hat. Es wurde
  aufgrund der Menschenrechtsgefährdung und der fehlenden fairen Asylverfahrenslage
  abgelehnt, Abschiebungen, Rückführungen und alles andere durchzuführen. Wie kommt
  der Minister als Verfassungsminister überhaupt auf diese Idee, oder kennt er dieses
  Urteil nicht? Sie sagten gerade vollkommen zu Recht: Großbritannien hat Ähnliches
  versucht. Im Übrigen, auf die Gefahr hin, mich zu wiederholen: Schon die EU-Rechtsgrundlage
  sieht Besicherungsmechanismen vor, die rechtsverbindlich mit einem etwaigen Partnerstaat
  zu vereinbaren sind, damit Menschenrechtsstandards eingehalten werden. Dem wird,
  schon weil es die Rechtsgrundlage zwingend vorgibt, in Verhandlungen über „Return
  Hubs“ Rechnung unter Berücksichtigung einschlägiger Rechtsprechung getragen werden.
  Ich wüsste gerne, welche Fragen sich das Justizministerium hinsichtlich der „Return
  Hubs“ stellt. Interessanter Dreh, dass die Fragen jetzt umgedreht werden. Das Thema
  liegt ja, wie schon gesagt wurde, in der Federführung des BMI, und deswegen sind
  wir in die Verhandlungen bisher auch noch nicht eingebunden. Wir haben dazu auch
  nichts weiter zu sagen. Das Thema der „Return Hubs“ beschäftigt das BMI ja schon
  seit vielen Jahren, also die Prüfung der Option des sogenannten Ruanda-Modells.
  Nancy Faeser ging bei den Prüfungen eigentlich noch deutlich weiter als Alexander
  Dobrindt, weil sie ja viele Modelle geprüft hat, um Asylverfahren auch außerhalb
  der Europäischen Union durchführen zu lassen. Möchte der Bundesinnenminister jetzt
  auch daran anknüpfen und das weiterführen? Die aktuellen Planungen beziehen sich,
  wie mittlerweile recht umfänglich dargestellt wurde, darauf, die Grundlage des europäischen
  Rechts auszufüllen, „Return Hubs“ einzurichten. Ich glaube, ich sagte bereits: Dabei
  geht es um vollziehbar ausreisepflichtige Personen. Personen, die hier ein Asylverfahren
  bis zum Schluss durchlaufen haben, mit dem Ergebnis, dass festgestellt wurde, dass
  sie keine Bleibeperspektive in Deutschland oder der Europäischen Union haben. Die
  Auslagerung von Asylverfahren ist also kein Thema? Das ist nicht in der Rückkehrverordnung
  vorgesehen, deren Ausfüllung wir jetzt vorrangig betreiben. Nochmal ans BMI: Bislang
  galt ja, dass Rückführungen in Nationen oder Länder zu erfolgen haben, die entweder
  die Herkunftsnationen der Zurückgeführten sind oder zu denen sie einen kulturellen
  Bezug haben. Bei wie viel Prozent der möglicherweise nach Ruanda abgeführten oder
  zugeführten Menschen trifft das zu? Ist es eine Mehrheit, ist es eine Minderheit?
  Wie viele Menschen erfüllen diese Voraussetzung, die kulturell-politische Voraussetzung?
  Auch durch die Hintertür werde ich jetzt nicht bestätigen, was Sie die ganze Zeit
  von mir bestätigt sehen wollen. Wir sind in Gesprächen mit mehreren Partnerstaaten.
  Zutreffend ist, dass die europäische Rechtsgrundlage die Rückkehrverordnung in Bezug
  auf „Return Hubs“, die Anforderungen in Bezug auf das Verbindungselement, von dem
  man bisher immer ausging, stark zurückfährt. Diese Rechtsgrundlage wurde in einem
  regulären europäischen Gesetzgebungsverfahren geschaffen und soll jetzt von der
  Bundesregierung ausgeführt werden. Dennoch die Frage, da Ruanda sozusagen exemplarisch
  gilt: Wer hätte bei einem „Return Hub“ ‑ dieser technizistische Begriff bedeutet
  ja, auf Deutsch gesagt, eigentlich eine Art Verschiebebahnhof oder Verteilzentrum ‑
  die Rechtsträgerschaft, die Rechtsaufsicht, und ist die Einrichtung eines solchen
  Verschiebebahnhofs mit Zahlungen seitens der EU-Partnerstaaten, die das machen wollen,
  verbunden? Ihrer Wortwahl kann ich mich explizit nicht anschließen. Alles Weitere
  ist Gegenstand laufender Verhandlungen. Noch eine Frage an Herrn Hille – entschuldigen
  Sie bitte ‑: Heute Nachmittag wird der österreichische Bundeskanzler mit der dänischen
  Ministerpräsidentin dieses Projekt ankündigen. Sie sagten, das sei im Prozess. Wie
  kann man so etwas ankündigen, wenn das im Prozess ist? Erstens. Sie müssen sich
  nicht für Fragen entschuldigen; das ist das Wesen dieser Veranstaltung. Zweitens.
  Im Gegensatz zu Ihnen habe ich keine Glaskugel, in die ich gucken und mit der ich
  die Zukunft voraussagen kann. Da würde ich es halten wie sonst auch: Lassen wir
  doch erst einmal die Zukunft zur Gegenwart werden, und dann können wir uns in der
  nächsten Veranstaltung dieser Art gerne über die Entscheidungen unterhalten. Eine
  zweite Frage, Herr Menkel: Wie viele Abschiebungen scheitern derzeit daran, dass
  Herkunftsländer ihre Staatsangehörigen nicht zurück akzeptieren, zurücknehmen? Haben
  Sie die Zahl parat? Da müssten wir nochmal in die Statistiken einsteigen. Das müsste
  ich gegebenenfalls nachreichen. Der SPD-Politiker Fiedler hat heute im „POLITICO“-Podcast
  gesagt, dass man für 20 Millionen Euro, die im nächsten Jahr eingestellt sind, 40 Plätze
  deutschlandweit finanzieren könnte. Ist das eine Rechnung, die Sie nachvollziehen
  oder bestätigen können? Das klingt ja ganz schön teuer. Sie ahnen bereits, was ich
  zu Äußerungen aus dem politischen Raum grundsätzlich sagen kann, ohne dem Haushalt,
  der noch im parlamentarischen Verfahren befindlich ist, zu weit vorzugreifen: Die
  Summe, die dort im Raum steht, ist nicht allein für Maßnahmen wie „Return Hubs“
  gedacht. Darin sind auch andere Vorhaben, beispielsweise Migrationsabkommen, Rückführungsabkommen,
