  davon aus, dass es drei Gründe gibt, die in verschiedenem Maße dafür ausschlaggebend
  sind, dass diese Zahlen jetzt gestiegen sind, nachdem wir in den Jahren davor immer
  ungefähr gleichbleibende Zahlen hatten. Der erste Grund ist, dass wir die statistische
  Erfassung vereinfacht haben, dass also auch Meldezahlen aus den Sanitätseinrichtungen
  der jeweiligen Kasernen schneller in das Gesamtmeldesystem einfließen können, zum
  Beispiel bei einem Verdachtsfall. Der zweite Grund ist, dass wir intensivere Aufklärungsarbeit
  leisten. Zum Beispiel haben wir 2025 spezielle Fragebögen für Angehörige herausgebracht;
  denn Angehörige sind meistens diejenigen, die es zuerst merken. Wenn sich also jemand
  zu Hause anders verhält, also zum Beispiel schreckhaft ist oder sich bei bestimmten
  Bildern anders verhält, dann besteht die Chance, über diesen Fragebogen herauszufinden:
  Liegt da vielleicht was vor und muss ich mit jemandem irgendwo hingehen? Der dritte
  Punkt ist, dass wir in einer medialen Welt leben, in der wir speziell in den letzten
  Jahren ‑ das nimmt ja auch immer weiter zu ‑ Bilder im Fernsehen und in den Medien
  hatten, durch die Flashbacks bzw. Erinnerungen an traumatische Ereignisse aufgerüttelt
  werden können. Auf diese drei Gründe – mit unterschiedlicher Gewichtung ‑ führt
  der Beauftragte die festgestellte Häufung zurück. Ich möchte aber noch einmal unsere
  Maßnahmen aufzählen: Wir haben sehr viel in die Prävention investiert. Wir haben
  sehr viel in die Erkennung investiert, zum Beispiel durch geschulte Truppenärztinnen
  und Truppenärzte. Wir haben sehr viel in die Behandlung investiert: In den fünf
  Bundeswehrkrankenhäusern gibt es spezielle Ansprechpartner und auch Traumaspezialisten;
  wir nutzen aber oft auch auf im zivilen Bereich sowohl Psychotherapeuten als auch
  Traumazentren. Wir haben spezielle Maßnahmen zur Rehabilitation und haben Rehabilitationsschwerpunkte
  gesetzt. Darüber hinaus haben wir auch noch Betreuungsschwerpunkte, wir haben das
  sogenannte Psychosoziale Netzwerk, und wir haben ein Netzwerk der Hilfe, das im
  gesamten Bereich, auch außerhalb der Bundeswehr, insgesamt 45 Organisationen umfasst,
  die bei der Betreuung auch ehemaliger Soldatinnen und Soldaten ‑ also der Veteranen,
  die wir beim Veteranentag immer besonders im Blick haben, aber natürlich auch in
  Gänze betrachten ‑ unterstützen. Mit diesem Gesamtpaket gehört unser System weltweit
  wirklich zu den führenden Systemen, und wir nehmen das Thema sehr, sehr ernst. Ich
  glaube, ich habe die Breite des Themas hier dargestellt. Es ist ein sehr schweres
  und ein sehr wichtiges Thema. Wir bleiben beim selben Ministerium, und im Zweifel
  geht meine Frage auch noch an das Auswärtige Amt: Die deutsche Botschaft in Warschau
  hatte am 5. November bestätigt, dass Fahrzeuge und Soldaten der Bundeswehr in Warschau
  unterwegs waren. Jetzt hat das polnische Militärinspektorat, welches die Erlaubnis
  für Durchfahrt und Aufenthalt von ausländischen Streitkräften erteilt, auf Nachfrage
  offiziell mitgeteilt, dass zuletzt mehrere Genehmigungen für Bewegungen der Bundeswehr
  in Polen erteilt wurden; es sagte allerdings auch ‑ ich zitiere ganz kurz ‑: Keine
  davon umfasste Warschau. Da würde mich interessieren: Mit welcher polnischen Genehmigung
  und auf welcher Rechtsgrundlage sind die Bundeswehrfahrzeuge nach Warschau gekommen
  und dort auch herumgefahren? Wenn wir in ein anderes Land zu unseren Partnern und
  Verbündeten fahren, dann tun wir das immer abgestimmt mit diesen. Wie Sie wissen,
  haben wir in Polen sogar Bundeswehrdienststellen, zum Beispiel in Stettin, wo wir
  gar keine eigene Sondererlaubnis benötigen, einfach weil wir dort Personal haben,
  das sich in diesem Land auch bewegen kann und bewegen darf. Wir haben in Warschau
  eine deutsche Botschaft mit einem Militärattachéstab. In diesem Fall gab es in Warschau
  eine Veranstaltung, die das polnische Militär und das deutsche Militär gemeinsam
  durchgeführt haben, unter anderem zum Jahrestag der Luftwaffe. Auf dieser Grundlage
  und aufgrund der engen Abstimmung mit Polen haben wir an diesen Veranstaltungen
  teilgenommen. Da Sie gerade auf diese Veranstaltung zum 71. Jahrestag der Bundeswehr
  und 70. Jahrestag der Luftwaffe hinweisen: Der deutsche Botschafter in Warschau,
  Herr Berger, hat diese Präsenz dadurch gerechtfertigt, dass alle deutschen Auslandsvertretungen
  daran teilnehmen würden. Jetzt haben stichprobenartige Befragungen ergeben, dass
  diese Feierlichkeiten mitnichten an allen deutschen Auslandsvertretungen stattfinden.
  Herr Hinterseher, können Sie uns das einmal darlegen: War diese absolute Aussage
  von Herrn Berger falsch, oder war die Darstellung von einzelnen Auslandsvertretungen
  falsch, die gesagt haben, diese Veranstaltungen hätten bei ihnen nicht stattgefunden?
  Ich habe diese Aussage in Gänze nicht vorliegen. Es ist aber natürlich mitnichten
  so, dass an jeder deutschen Auslandsvertretung ein Militärattachéstab ist. Vielleicht
  löst das einen Teil Ihrer Frage auf. Ich möchte auch noch einmal ganz kurz darauf
  eingehen. Das deutsch-polnische Verhältnis, vor allen Dingen zwischen Bundeswehr
  und polnischen Streitkräften, ist ausgezeichnet. Wir haben in Polen die Koalicja-Übung
  gehabt, an der auch andere Verbündete teilgenommen haben. Wir haben regelmäßig Truppenverlegungen
  durch Polen. Sie wissen, dass wir aktuell auch im Baltikum größere Übungen haben,
  mit denen wir einfach die Einsatzbereitschaft an der Ostflanke trainieren – „Grand
  Eagle“ zum Beispiel. Wir haben außerdem Air Policing in Polen durchgeführt und haben
  unsere Patriots da gehabt. Ich möchte deshalb einmal ganz klar sagen: Zwischen die
  Zusammenarbeit von polnischen Streitkräften und Bundeswehr passt kein Blatt; die
  ist wirklich richtig gut. Der Minister wird diese Woche, wie wir angekündigt haben,
  noch nach Polen fahren und wird dort seinen polnischen Counterpart treffen. Er wird
  auch die Gedenkstätte des ehemaligen Konzentrationslagers Auschwitz-Birkenau besuchen
  und wird dort natürlich auch an die Erinnerungskultur anknüpfen. Er wird dort der
  Verbrechen gedenken, die dort geschehen sind, sowie des Leids, das auch Polen erlitten
  hat. In diesem gesamten Kontext ist es für mich wirklich befremdlich, wie auf diese
  Anwesenheit der deutschen Streitkräfte in Polen eingegangen wurde. Wir haben ein
  sehr enges Verhältnis und fühlen uns in Polen auch immer willkommen, wenn wir mit
  unseren Streitkräften dort sind ‑ im Rahmen der Patriot-Stationierung, bei den Air-Policing-Übungen
  und bei allen anderen Bewegungen. Es gibt erneute Diskussionen darüber, das in Europa
  eingefrorene russische Vermögen als mögliche Unterstützungsquelle für die Ukraine
  zu nutzen. Wie steht die Bundesregierung aktuell dazu? Ist das etwas, was der Bundeskanzler
  immer noch unterstützt? Sie wissen, dass das Thema der Finanzierung und damit der
  Durchhaltefähigkeit der Ukraine ein großes Thema für die Europäische Union und für
  Deutschland im Besonderen ist. Der nächste Termin, bei dem dieses Thema eine große
  Rolle spielen wird, ist das Treffen der Koalition der Willigen am Donnerstag hier
  in Berlin, das auf Einladung des Bundeskanzlers, des französischen Staatspräsidenten
  und des Premierministers von Großbritannien stattfindet. Mehr als 20 Staats- und
  Regierungschefs werden dazu hierher nach Berlin kommen. Das Thema der Finanzierung
  war auch ein wichtiges Thema des informellen Treffens des EU-Rates am vergangenen
  Freitag in Dublin. Sie haben wahrscheinlich wahrgenommen, wie im Nachhinein darüber
  berichtet wurde. Der Bundeskanzler hat dort die Position noch einmal ganz klar gemacht,
  dass die Finanzierung der Ukraine ein Thema für alle ist. Dafür hat er ‑ ich zitiere
  sinngemäß Berichterstattung ‑ viel Unterstützung in diesem Kreis bekommen. Sie sehen
  also, dass die Finanzierung der Ukraine ein großes, wichtiges Thema ist. Zu Ihrer
  konkreten Frage habe ich jetzt aber keine weiteren Ankündigungen zu machen. Aber
  er hat sich in der Vergangenheit ja sehr dafür eingesetzt, dass die eingefrorenen
  russischen Vermögen benutzt werden. Können Sie sagen, ob das immer noch der Status
  quo ist? Noch einmal: Das Thema der Finanzierung der Ukraine ist ein ganz wichtiges
  für uns. Deutschland ist im Schulterschluss mit den E3 an der Spitze der Bewegung.
  Wir ‑ der Bundeskanzler unter anderem am Freitag in Dublin ‑ haben sehr deutlich
  gemacht, dass das ein Thema für alle ist und dass es auf alle Schultern verteilt
  werden muss. Zu der konkreten Frage habe ich jetzt keinen Stand, den ich Ihnen von
  hier aus mitteilen könnte. Eine Frage an das Gesundheitsministerium: Wie steht der
  Minister zu der Frage, ob gesetzlich Versicherte Geld bezahlen sollen, wenn sie
  schneller einen Termin bekommen wollen? Sie zielen damit auf die Aussage von Herrn
  Gassen ab. Wie Sie wissen, kommentieren wir politische Aussagen von hier aus nicht.
  Ich kann Ihnen aber sagen, dass der Minister natürlich grundsätzlich an einem effizienteren
  Gesundheitssystem arbeitet. Dabei geht es auch darum, Patienten zielgerichteter
  und besser zu versorgen. Aus unserem Haus gibt es dazu auch einige Reformvorhaben.
  Ich nenne nur die Stichworte „Notfallreform“ und „Primärversorgung“. Vielleicht
  gestatten Sie mir noch eine Metabemerkung: Das Ziel all dieser Reformen ist natürlich,
  das Gesundheitssystem zukunftsfest zu machen und auch für künftige Generationen
  ein sicheres und bezahlbares System zu haben. Das ist das Narrativ der Regierung,
  und dieser Logik folgen alle Reformen. Was Sie jetzt nicht erwähnt haben, ist das
  Stichwort der Termingarantie. Klingbeil hat am Wochenende darauf hingewiesen, dass
  man sich schon im Koalitionsausschuss im Juli darauf geeinigt hatte, dass sie kommen
  solle. Der Gesundheitsminister soll bald Konzepte dafür vorlegen. Was ist der Stand
  dabei? Wird es diese Termingarantie bald geben? Ich kann die einzelnen Aussagen
  des Vizekanzlers von hier aus jetzt nicht kommentieren. Ich kann Ihnen aber sagen,
  dass wir natürlich mit Hochdruck an den Reformvorhaben arbeiten und Sie zu gegebener
  Zeit informieren werden. Herr Hinterseher, heute beginnt in Genf die Beratung der
  Vertragsstaaten der UN-Waffenkonvention . Es geht um Killerroboter, also autonome
  Waffensysteme . Können Sie uns zumindest schnell sagen, ob Deutschland mit dem Ziel
  eines bindenden Verbots dieses Waffensystems ohne wirksame menschliche Kontrolle
  verhandelt? Wir haben von Ihnen ja immer wieder gehört, dass es um verantwortungsvolle
  Regulierung gehe usw. Was heißt „verantwortungsvoll“, ein bindendes Verbot? Lassen
  Sie mich vielleicht zur CCW-Überprüfungskonferenz ausführen. Das UN-Waffenübereinkommen
  über bestimmte konventionelle Waffen legt fest, welche konventionellen Waffen im
  Krieg verboten sind oder in ihrer Verwendung eingeschränkt werden. Bisher gibt es
  bereits fünf Zusatzprotokolle dazu. Sie regeln beispielsweise Minen- und Sprengfallen,
  Brandfallen, Blendlaserwaffen, Explosivwaffenrückstände oder Waffen, deren Splitter
  im menschlichen Körper zum Beispiel durch Röntgenstrahlen nicht erkennbar sind.
  Autonome Waffensysteme, wie Sie sie beschreiben, gehören schon zum Kriegsalltag.
  Jetzt geht es um die Frage, ob die Vertragsstaaten nun offizielle Verhandlungen
  über ein neues völkerrechtliches Abkommen zu autonomen Waffensystemen beginnen.
  Das ist Gegenstand der Fragestellung, und das ist der Kern der jetzigen CCW-Verhandlungen.
  Festgelegt werden könnte zum Beispiel, ob Maschinen künftig eigenständig entscheiden
  dürfen, wen sie im Krieg töten oder ob immer ein Mensch die letzte Entscheidung
  treffen muss. Wir setzen uns innerhalb der Verhandlungen ‑ das haben wir auch im
  September im Kreise von 128 Vertragsstaaten getan ‑ natürlich für ein Instrument
  zur Regulierung letaler autonomer Waffensysteme ein. Das ist sozusagen ein Katalog
  möglicher Regelungsinhalte, der erarbeitet wurde. Diese Einigung war aus unserer
  Sicht schon ein Meilenstein. Sie verdeutlicht noch einmal das gemeinsame Verständnis
  der Vertragsstaaten. Allerdings ist der Modus in dieser Vertragsstaatenkonferenz
  Einstimmigkeit. Aber das Idealziel dieser Regulierung wäre ein bindendes Verbot
  der Killerroboter, korrekt? Wir haben seit Beginn des Prozesses, den ich gerade
  beschrieben habe, in dem wir jetzt diesen Meilenstein hatten und jetzt die Konferenz
  losgeht, für einen zweistufigen Ansatz geworben. Dazu gehören sowohl ein Verbot
  vollautonomer Waffensysteme, die vollständig der Verfügungsgewalt des Menschen entzogen
  sind ‑ ich denke, das ist in anderen Worten in etwa das, was Sie meinen ‑, als auch
  Regulierungen für Waffensysteme mit autonomen Funktionen. Meine Frage geht ans Innenministerium,
  denke ich. Vielleicht kann auch Herr Hille etwas dazu sagen. Es geht wieder um die
  Eishockey-WM . Der Eishockey-Weltverband will die U20-Weltmeisterschaft ohne Russland
  stattfinden lassen. Hat das Auswirkungen auf die Entscheidung der Bundesregierung
  im Zusammenhang mit der Männer-WM im nächsten Jahr? Das kann ich vielleicht auch
  in Anbetracht der Zeit ganz kurz machen. Wir haben am Freitag intensiver darüber
  gesprochen. Damals habe ich die Situation, wie sie sich darstellt, geschildert.
  Es gibt weltweit eine ganze Reihe von Verbänden, die deutlich gemacht haben, dass
  sie nicht gegen Russland spielen werden. Am Freitag waren es elf, und zwar sehr
  namhafte Verbände. Ich weiß nicht, ob sich die Zahl noch erhöht hat. Viele Sponsoren
  haben angekündigt, dass sie bei einer Beteiligung Russlands nicht mit dabei sind.
  Das skizziert den Rahmen und macht sehr deutlich, welch großer Handlungsbedarf besteht,
  und dass der internationale Eishockeyverband eine Teilnahme Russlands ablehnt. Jetzt
  sind die Verbände, der Weltverband im Zusammenspiel mit dem nationalen Verband,
  gefordert, dafür eine Lösung zu finden. An diesen Gesprächen sind wir immer wieder
  beteiligt. Das Ziel ist es, dafür eine Lösung zu finden. Denn alles andere würde
  ja nur zu einer Verschiebung des Problems führen. Welche Maßnahmen dann möglicherweise
  noch nötig sind, das würde ich dann auf der Strecke betrachten und noch einmal beurteilen.
  Es ist ja noch ein bisschen Zeit. Aber jetzt ist der Sport daran ‑ die Autonomie
  des Sportes ist hier immer ein großes Thema ‑, eine Lösung zu finden, der Weltverband
  mit dem nationalen Verband, unter Beteiligung der Bundesregierung. UniCredit hat
  aus Brüssel grünes Licht für die Pläne zur Übernahme der Commerzbank bekommen. Dagegen
  gebe es keine wettbewerbsrechtlichen Bedenken. Ich hätte gerne eine Reaktion von
  Herrn Hille und vom BMF. Ich habe dazu keinen neuen Stand. Unsere grundsätzliche
  Position haben wir hier vielfach hinlänglich behandelt. Eine Entscheidung von Aufsichtsbehörden
  kommentieren wir grundsätzlich nicht. Ich würde noch versuchen, zumindest zwei offene
  Fragen zu beantworten. Zum einen kam von Ihnen die Frage, ob es einen Neuen Termin
  in Abu Dhabi gebe. Dazu habe ich jetzt keine Ankündigung zu machen. Wir sind ‑ das
  nur als Hinweis ‑ im Übrigen auch nicht Veranstalter eines solchen Formates. Es
  muss immer betrachtet werden, welches Format zu welchem Zeitpunkt in diesem großen
  Prozess ‑ wir sprachen gerade darüber ‑ Sinn ergibt. Sie hatten nach einem konkreten
  Termin für das Pressestatement im Rahmen des Treffens der Koalition der Willigen
  gefragt. Der konkrete Ablauf, ist noch in Abstimmung. Sie werden darüber detailliert
  informiert werden, wenn das abgeschlossen ist. Es sind ja viele Beteiligte dabei.
  Aber gehen Sie davon aus, dass eine Pressekonferenz natürlich Bestandteil dieser
  Planungen ist.'
