date: '2026-11-16'
type: press_release
source_name: german_chancellery
title: Rede von Bundeskanzler Merz anlässlich der Festveranstaltung zum 120-jährigen
  Jubiläum des Vereins der Ausländischen Presse am 16. November 2026
text: 'Freundinnen und Freunde des Vereins der Ausländischen Presse, liebe Korrespondentinnen
  und Korrespondenten, liebe Gäste der Deutschen Bundespressekonferenz, insbesondere
  Herr Vorsitzender, herzlichen Dank für die freundliche Begrüßung und die Einladung
  und die Gelegenheit für mich, kurzfristig an einer ungewohnten Stelle zu sitzen.
  Häufiger werden Sie mir nicht erlauben, dass ich das tue und dass ich Gelegenheit
  habe, auch hier von einem Rednerpult aus zu sprechen, und das vor einem solchen
  Hintergrund. Vielen Dank! Ich habe gelernt: VAP steht auch für „Vergnügungsausschuss
  der Presse“. Ich freue mich, dass ich Ihnen heute im Namen der Bundesregierung,
  aber auch persönlich sehr herzlich zu Ihrem großen, eindrucksvollen Jubiläum gratulieren
  darf. 120 Jahre! Sie sind fast ein halbes Jahrhundert älter als die Bundesrepublik
  Deutschland, und Sie sind sogar ein bisschen älter als das Gründungsdatum der Weimarer
  Republik. Was für eine bemerkenswerte Leistung Ihres Vereins, der Vorsitzenden und
  der Mitglieder! Natürlich zeigt sich in diesem Umstand auch eine tiefe historische
  Wahrheit über unsere modernen, liberalen Demokratien. Denn bevor es demokratisch
  gewählte Politikerinnen und Politiker gab, gab es in der Regel schon Journalistinnen
  und Journalisten. Die Entstehung einer kritischen, einer bürgerlichen Öffentlichkeit
  geht unseren Demokratien voraus, und diese kritische Öffentlichkeit, meine Damen
  und Herren, ist ganz erheblich Ihr Werk. Das ist Ihre Verantwortung, das ist Ihr
  Berufsstand. Das sind Sie, vor denen ich hier heute spreche. Nun werden Sie in vielen
  deutschen Schulbüchern in den Kapiteln, in denen es um die Geburt der liberalen
  Moderne geht, ein Bild finden, das nicht weit von hier im Deutschen Historischen
  Museum im Original hängt. Es ist das Bild von Heinrich Lukas Arnold, das Gemälde
  „Das Lesekabinett“, um, wenn ich es richtig im Kopf habe, 1840 gemalt, also noch
  einmal rund 60 Jahre vor Ihrer Gründung. Was sehen wir auf diesem Bild? Diejenigen,
  die es kennen, werden es sofort präsent haben: Es ist eine Wohnstube mit eifrig
  lesenden und diskutierenden, ja, Männern. Alle halten großformatige Zeitungsseiten
  in ihren Händen. Man hört sozusagen beim Zuschauen, beim Betrachten dieses Bildes
  das Rascheln der Zeitungen. Wenn wir heute von modernen Heldengeschichten und modernen
  Heldinnen und Helden sprechen, dann fällt uns in unseren Breitengraden auch sehr
  bald der eine oder andere rasende Reporter oder die eine oder andere Investigativgeschichte
  ein. So ist die Geschichte Ihres Vereins; so viel ist sicher. Sie ist voll von legendären
  Journalistinnen und Journalisten, die neben Ausdauer und Rückgrat zu oft auch Heldenmut
  beweisen mussten, um ihre Arbeit zu tun. Sie haben Ihren Gründungsvorsitzenden bereits
  genannt, den Österreicher Paul Goldmann, der diesen Verein auch deshalb gründete,
  um der kaiserlichen Zensur etwas entgegenzusetzen. Sie werden auch die anderen berühmten
  Namen kennen, zum Teil haben Sie sie schon genannt: Dorothy Thompson, die 1931 im
  Hotel Kaiserhof hier in Berlin ein Interview mit Adolf Hitler führte und 1934 zu
  den ersten Journalisten gehörte, die von den Nationalsozialisten des Landes verwiesen
  wurden, Louis P. Lochner ‑ Sie haben auch ihn genannt ‑, Pulitzerpreisträger und
  von 1928 bis 1941 Leiter des Berliner Büros der Associated Press, der über die Bücherverbrennung
  1933 und über die Novemberpogrome 1938 berichtete, und schließlich auch der schon
  genannte William Lawrence Shirer, von 1934 bis 1940 Rundfunk- und Zeitungskorrespondent
  in Berlin, der kreativ werden musste, um am Propagandaministerium vorbei seine Berichte
  auf dem Weg, den Sie eben hier auch beschrieben haben, an CBS schicken zu können.
  Alle drei schufen, wie viele andere auch im Ausland, kritische Öffentlichkeit über
  die nationalsozialistische Herrschaft, und dies alles zum Teil unter Inkaufnahme
  erheblicher persönlicher Risiken. Sie waren Chronisten unserer Geschichte, zum Teil
  sogar wirkliche Zeithistoriker. Was sie über Deutschland berichteten, beeinflusste
  politische Entscheidungen im und gerade auch nach dem Krieg. Das Buch „Berlin Diary“
  des schon zitierten William Shirer und sein Buch zum „Aufstieg und Fall des Dritten
  Reiches“, eines der ersten umfassenden Analysen des nationalsozialistischen Deutschlands,
  wurde von mehreren amerikanischen Präsidenten gründlich gelesen, wie wir heute wissen.
  Schließlich hat Ihr ehemaliger Vorsitzender Alain Clément als Korrespondent für
  „Le Monde“ im Bonn der 1950er- und 60er-Jahre, also in der Zeit Ihrer Wiederbegründung,
  ganz zweifellos dazu beigetragen, dass die deutsch-französische Verständigung und
  schließlich die Versöhnung möglich wurden. Ja, meine Damen und Herren, insgesamt
  und überhaupt hat Deutschland, wenn man so will, ja eine ganz besondere Geschichte
  mit Auslandskorrespondentinnen und Auslandskorrespondenten, und auch darum stehe
  ich heute hier vor Ihnen. Während des Krieges haben sich ehemalige Deutschlandkorrespondenten
  aus dem Ausland über das Radio auch an die Deutschen gewandt. „Hör zu, Hans“ hieß
  eine Reihe von Radioansprachen von der schon erneut genannten Dorothy Thompson,
  und nach dem Krieg, als ein Großteil der Welt mit Hass, mit Abscheu, zumindest aber
  mit allertiefstem Misstrauen auf Deutschland schaute, da waren es wiederum die Deutschlandkorrespondenten,
  die mit ihren Berichten unseren Nachbarn und der Welt ein differenziertes Bild von
  den Deutschen und von der noch jungen Bundesrepublik Deutschland gaben. Meine Damen
  und Herren, es ist noch immer so, auch in unserer heutigen hochvernetzten, globalisierten,
  digitalen Welt, in der wir mit Videos und Nachrichten „from all around the world“
  tagtäglich überschwemmt werden: Sie prägen mit dem, was Sie tun, was die Welt, was
  unsere Nachbarn von uns Deutschen denken. Was Sie berichten, wie Sie es einordnen,
  das nimmt Einfluss auf das Deutschlandbild unserer Nachbarn, der Franzosen, der
  Polen, der Italiener, der Briten, der Brasilianer, der Argentinier, der Australier,
  der Südafrikaner, der Amerikaner, um nur einige wenige Beispiele zu nennen. Das
  Deutschlandbild, das mir in Ihren Medien begegnet, ist übrigens in aller Regel,
  und das müssen Sie, Herr Feldhoff, jetzt aushalten, deutlich positiver und deutlich
  wohlwollender als das Deutschlandbild, das häufig genug deutsche Medien zeichnen,
  vielleicht, weil Sie als Auslandskorrespondentinnen und Auslandskorrespondenten
  den größeren Abstand zum Gegenstand Ihrer Berichterstattung haben, vielleicht auch,
  weil Sie ein bisschen weniger getrieben sind von der Aufregung des politischen Tagesgeschäftes.
  Ich finde auch Ihre Fragen gelegentlich interessanter als die ‑ ‑ ‑ Na ja, ich brauche
  nicht weiterzusprechen. Jedenfalls, meine Damen und Herren, lerne ich immer wieder
  von Ihren Berichten über unser Land, und genau so sollte es auch sein. Ein gesundes
  Selbstbild entsteht aus der Auseinandersetzung mit dem Bild, das die anderen sich
  machen, und dieser Abgleich ist in unseren sehr bewegten, sehr turbulenten Zeiten
  wohl noch einmal viel wichtiger geworden, als er es ohnehin war. Die Welt, und das
  sagen wir nun jeden Tag, ist im Umbruch ‑ geopolitisch, geoökonomisch, technologisch ‑,
  und diese Veränderungen betreffen uns in Deutschland, sie betreffen uns in Europa
  insgesamt, zum Teil an sehr empfindlichen Stellen. Um diesen Umbruch gut mitgestalten
  zu können ‑ und das ist mein Ziel, das ist unser Ziel ‑, müssen wir als deutsche
  Gesellschaft in mancher Hinsicht neu sehen und auch neu denken. Wir müssen unser
  Selbstbild und unser Weltbild auf veraltete Annahmen, auf unproduktive Klischees,
  auf ideologische Versatzstücke überprüfen, und davon haben wir so einige. Sie alle
  könnten wahrscheinlich spontan das eine oder andere deutsche Vorurteil nennen, das
  wir Deutsche so mit uns herumtragen, große und kleine, harmlose und auch weniger
  harmlose. Ist in der deutschen Gesamtgesellschaft wirklich angekommen, wie wachstumsstark
  die asiatischen Volkswirtschaften sind, wie viel Potenzial in Partnerschaften mit
  vielen Ländern des afrikanischen Kontinents oder Lateinamerika liegt? Gibt es hinreichend
  Bewusstsein darüber, dass die Zeit der sogenannten Friedensdividende vorbei ist,
  dass wir wieder Feinde haben in der Welt? - Sie werden auf diese Fragen Ihre eigenen
  Antworten haben. Sicher ist: Wir Deutsche sind bisweilen etwas eigen, und es gibt
  bei uns vielleicht mehr Veränderungsangst als bei manchem unserer Nachbarn. Aber
  wir sind durchaus, und das möchte ich doch für uns in Anspruch nehmen, neugierig,
  und wir sind vor allem immer ziemlich gründlich. Wenn wir uns entschieden haben,
  uns neue Ziele zu setzen, dann machen wir uns auch mit viel Ausdauer daran, diese
  Ziele zu erreichen. Wir fangen manchmal ziemlich spät an. Das Thema Digitalisierung
  haben Sie genannt ‑ das ist ein schmerzhafter Punk, aber wir arbeiten daran. Wir
  haben in der deutschen Bundesregierung eine Zielvorstellung von dem Deutschland
  der kommenden Jahrzehnte und auch von dem Europa in dieser neuen Weltordnung. Beides
  hängt ja auch sehr eng miteinander zusammen. Schon im Sinne unseres Grundgesetzes
  hängt es zusammen; es ist der Bundesrepublik Deutschland schon in der Präambel von
  den Vätern und Müttern unseres Grundgesetzes sozusagen ins Stammbuch geschrieben
  worden, die da geschrieben haben, dass wir in unserem Land „von dem Willen beseelt“
  sein mögen, „als gleichberechtigtes Glied in einem vereinten Europa dem Frieden
  der Welt zu dienen“. Meine Damen und Herren, genau das ist zentrales Leitprinzip
  meines politischen Handelns und Entscheidens sowie des politischen Handelns der
  Bundesregierung insgesamt. Denn ein freies, ein wehrhaftes, ein wettbewerbsfähiges
  und ‑ ich gehe heute so weit zu sagen, was ich vor zwei Jahren noch nicht getan
  hätte ‑ ein souveränes Europa, in dem wieder Frieden herrscht, in dem die Ukraine
  frei ist und das außerdem über ein Netz von Partnerschaften die neue Welt mitprägt,
  und zwar im Sinne von Freiheit, Frieden, Völkerrecht, Freihandel und ökologischer
  Sicherheit: Das ist meine Zielvorstellung. Ich bin, wie viele von Ihnen wissen,
  im Europäischen Parlament politisch sozusagen sozialisiert worden. Ich habe die
  europäischen Einigungsschritte, auch die Überwindung der deutschen Teilung, im Europäischen
  Parlament miterlebt. Ich habe diese Entwicklung, diese historischen Jahre aus der
  Perspektive auch meiner europäischen Kolleginnen und Kollegen ‑ damals Gott sei
  Dank auch noch mit den britischen Kollegen ‑ im Europäischen Parlament zusammen
  erlebt und immer wieder auch die Perspektive auf unser Land aus dem Blick unserer
  europäischen Partner bekommen. Ich weiß, was in dieser Europäischen Union, in diesem
  Europa alles an politischer Dynamik zum Vorteil aller Europäerinnen und Europäer
  möglich ist. Dass wir diese Dynamik wieder gemeinsam nach Europa zurückholen, das
  ist meines Erachtens die große historische Aufgabe, vor der wir stehen. Wir versuchen
  aus Deutschland heraus darauf hinzuwirken, dass diese Entscheidungen kommen, die
  jetzt reif sind: indem wir Impulse setzen und neue Formate etablieren ‑ wie zum
  Beispiel das Leaders‘ Retreat in Alden Biesen zur europäischen Wettbewerbsfähigkeit
  in diesem Februar und im nächsten Februar zum zweiten Mal; wie der Gipfel der Koalition
  der Willigen, der in dieser Woche auf meine Einladung hier in Berlin tagen wird,
  mit einer bisher unerreicht großen Zahl von persönlich teilnehmenden Staats- und
  Regierungschefs aus aller Welt ‑, und selbstverständlich, indem wir auf nationaler
  Ebene vorangehen und unseren Teil tun, auch unseren Teil der Verantwortung zu tragen.
  Darum investieren wir Rekordsummen in unsere Verteidigung. Darum unterstützen wir
  die Ukraine in ihrem Freiheitskampf gegen Russland. Darum haben wir unsere Präsenz
  an der Ostflanke der NATO verstärkt. Und darum investieren wir viel in die baltischen
  Staaten bis hin zu einer ganzen Brigade, die dort erstmalig als großer Verband der
  Bundeswehr im Ausland stationiert wird. Meine Damen und Herren, ich weiß, dass in
  einigen Ihrer Länder genauso wie auch bei uns hier in Deutschland die antieuropäischen
  Stimmen von Populisten wieder laut sind. Bisweilen sind sie vermischt mit einer
  erheblichen Polemik gegen Deutschland. Das Beste, was wir dagegen tun können, ist
  einmal mehr zu beweisen, was ein geeintes Europa vermag, und zwar mit Blick auf
  das Grundversprechen, das uns Europäer, das unsere Länder miteinander verbindet:
  Bei uns dient die Politik dem Ziel, dass wirklich jede Bürgerin und jeder Bürger
  ein freies und möglichst gutes Leben führen kann, und zwar in Frieden und in Sicherheit.
  Das verlangt von uns Hausaufgaben, und zwar europäisch und national. In Deutschland
  verlangt das ganz konkret, dass wir uns weiterentwickeln zu noch mehr Chancengerechtigkeit,
  zu noch mehr Generationengerechtigkeit und auch zu noch mehr Nachhaltigkeit. Dass
  wir unbürokratischer werden, ja, digitaler, moderner in Staat und Verwaltung, als
  wir es heute sind. In diesen Bereichen haben wir es ganz sicher in den letzten Jahren
  und Jahrzehnten an Ehrgeiz vermissen lassen. Umso mehr Ehrgeiz will ich in diesen
  Bereichen jetzt auch sehen. Das ist nötig, damit die deutsche Wirtschaft den tiefen
  Strukturumbruch dieser vierten industriellen Revolution, die wir gerade erleben,
  meistert. Die Welt ist eben kompetitiver geworden. Sie ist durch einen Systemwettbewerb
  bestimmt. Wir haben sowohl in Deutschland als auch in Europa insgesamt erhebliche
  Potenziale; aber sie werden sich nur entfalten, wenn wir eben weniger Bürokratie
  und weniger Regulierung ermöglichen. Wettbewerb an sich ist eine ganz grundsätzliche
  Frage des guten Lebens und der Freiheit in Europa. Denn unsere Welt wird in wachsendem
  Maß von Technologien bestimmt, die bis tief in unsere und auch in Ihre Alltagswelt
  hineinreichen und die nicht politisch neutral sind. Wir wollen diese technologische
  Infrastruktur in Deutschland und in Europa mitgestalten, und zwar im Sinne unserer
  Werte. Wir wollen aber auch die Menschen in unserem Land darin befähigen, dass sie
  die neuen Technologien gewinnbringend und ‑ wenn ich das so sagen darf ‑ auch emanzipatorisch
  für sich nutzen können. Das setzt eben auch Technologiekompetenz voraus, die eine
  Bildungsaufgabe und vor allem eine staatliche Aufgabe ist. Das alles nehmen wir
  ernst, weil wir wissen, wie sehr die Grundfesten unserer freiheitlich-demokratischen
  Gesellschaft vom technologischen Umbruch berührt werden. Ich spreche das, meine
  Damen und Herren, hier an dieser Stelle heute an Ihrem großen Geburtstag deshalb
  mit so großem Nachdruck an, weil ich weiß, dass der technologiegetriebene digitale
  Strukturwandel der Öffentlichkeit ‑ und das ist nicht ein Wort von mir, sondern
  das ist ein Wort von Jürgen Habermas ‑ für Ihre Arbeit, für das Mediengeschäft,
  eine besonders große Herausforderung darstellt – und übrigens auch für uns in der
  politischen Kommunikation. Viele von Ihnen werden erleben, dass Sie sich mit Ihren
  sorgsam recherchierten Berichten, mit Ihren der Wahrheit verpflichteten Einordnungen
  gegen Inhalte durchsetzen müssen, die immer schriller, immer polemischer, immer
  polarisierender und immer weniger an den Maßstäben von Wahrheit, Wahrhaftigkeit
  und Richtigkeit orientiert sind, die zum Teil nicht einmal mehr von Menschen geschrieben
  und verbreitet werden und die sich auch immer entgrenzter darstellen ‑ im Wortsinn;
  denn im digitalen Raum verschwimmen Ort und Zeit der Nachrichten und Bilder, und
  wir sind diesen Bildern dort oftmals ohne Vorwissen zu kulturellen und kontextualen
  Zusammenhängen ausgesetzt. Sie wissen als Auslandskorrespondentinnen und Auslandskorrespondenten
  besser als viele, dass die Globalisierung die Welt hat zusammenrücken lassen. Dennoch
  bleiben kulturelle Unterschiede ganz erheblich, selbst innerhalb Europas, und darum
  sind wir auf Ihre ‑ lassen Sie mich das so sagen ‑ interkulturelle Übersetzungshilfe
  in unseren nationalen Öffentlichkeiten auch in Zukunft angewiesen, genauso wie auf
  Faktenchecks und Hintergrundrecherchen. Ich sagte es: Die kritische Öffentlichkeit
  ging der Entstehung der freiheitlichen, liberalen Demokratien voraus, und die kritische
  Öffentlichkeit sichert, dass unsere Demokratien freiheitlich und eben auch demokratisch
  bleiben. Wie sichern wir aber die kritische Öffentlichkeit? Das ist die Frage, vor
  der wir alle miteinander stehen. Wie machen wir unsere Diskursräume wehrhaft gegen
  Desinformationskampagnen und Deepfakes? Wie stellen wir sicher, dass es auf den
  digitalen Plattformen und in den Köpfen aller Generationen weiterhin Raum und Zeit
  gibt für faktenbasierte Berichterstattung und eigene Urteilsbildung? Meine Damen
  und Herren, das sind die Fragen, auf die wir gesellschaftlich und politisch gute
  Antworten finden müssen, und zwar möglichst bald. Die kritische Öffentlichkeit ist
  heute nicht mehr allein durch Beschneidungen der Pressefreiheit in Gefahr. Das soll
  nicht etwa heißen, dass diese Gefahr gebannt wäre. Die Pressefreiheit ist das oberste
  Gut, das in Zeiten der Krisen eben massiv unter Beschuss steht. Wir müssen gar nicht
  in die Autokratien blicken, um das zu sehen; wir sehen es eben auch in der transatlantischen
  Welt. Lassen Sie mich insofern auch das sagen: Natürlich gibt es auf dem Deutschlandbild
  der Bundesregierung eine lebendige, diverse Presselandschaft und eine große Menge
  von Auslandskorrespondentinnen und Auslandskorrespondenten, die genau wie ihre deutschen
  Kolleginnen und Kollegen frei und unbehindert ihre Arbeit machen. Zu den Dingen,
  auf die wir als Deutsche stolz sein können, gehört meines Erachtens ganz besonders,
  dass es in unserem Land um die Pressefreiheit eben immer noch gut bestellt ist.
  Wir wissen das ja aus den internationalen Rankings. Meine Damen und Herren, als
  Bundeskanzler hat man die „ déformation professionnelle “, sich vor allem darauf
  konzentrieren zu müssen, was im eigenen Land besser werden muss und sollte ‑ und
  ich habe davon gesprochen, was wir besser machen wollen und was wir auch schon tun.
  Im Ausland und gegenüber Vertreterinnen und Vertretern des Auslandes gehört es aber
  auch zu meinen Aufgaben, für Deutschland zu werben, und da gibt es durchaus Abrisskanten.
  Ich habe im vergangenen Jahr zum Beispiel gelernt, dass man im Ausland besser lieber
  nicht anmerkt, dass man das großartige deutsche Brot vermisst, obwohl das eine weithin
  geteilte Erfahrung von Deutschen jenseits deutscher Grenzen ist. Aber abgesehen
  von Brot und vielleicht von Bier usw.: Ich mache meinen Job, weil ich die unendlich
  vielen Potenziale Deutschlands kenne und ein Land vor mir sehe, das man für einen
  Großteil der Geschichte ‑ auch der jüngeren Geschichte ‑ schlicht für eine Utopie
  gehalten hätte: geeint, frei, friedlich, relativ wohlhabend, europäisch und mit
  einer ungeheuren Menge an Entfaltungsmöglichkeiten. Ihr Verein hat die Tiefen, aber
  eben auch die Höhen unseres Landes in den vergangenen 120 Jahren sozusagen aus der
  ersten Reihe mit angesehen. Sie wissen also, was an Veränderungs- und auch an Gestaltungskraft
  in unserem Land steckt. Wenn ich mir an Ihrem Geburtstag auch etwas von Ihnen wünschen
  darf, dann ist es einfach dieses: Bleiben Sie neugierig auf Deutschland ‑ auf das
  Deutschland der Gegenwart, das Deutschland der Vergangenheit und vor allem das Deutschland
  der Zukunft. Bleiben Sie wo immer menschenmöglich objektiv, bleiben Sie fair und
  bleiben Sie um Wahrheit bemüht ‑ und bewahren Sie uns Deutschen eben auch den klaren
  Blick auf unser eigenes Land.'
