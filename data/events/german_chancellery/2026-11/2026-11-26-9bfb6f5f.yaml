title: Doorstep des Kanzlers beim Europäischen Rat in Brüssel „Europa muss handlungsfähig
  bleiben und souverän werden“
text: 'In Brüssel kommen am 26. und 27. November die Staats- und Regierungschefs der
  EU zu einer Sondertagung des Europäischen Rates zusammen. Im Mittelpunkt des Gipfels
  stehen die Beratungen zum kommenden EU -Haushalt, dem sogenannten Mehrjährigen Finanzrahmen.
  Zum Auftakt der Verhandlungen für die Jahre 2028 bis 2034 hat Bundeskanzler Friedrich
  Merz die Bedeutung der Gespräche für die zukünftige Ausrichtung Europas hervorgehoben.
  Die bislang vorliegenden Vorschläge seien aus seiner Sicht noch nicht geeignet,
  eine Einigung zu erzielen. Bundeskanzler Merz nannte die Prioritäten des neuen Haushalts:
  Europa brauche solide Finanzen und dürfe keine neuen Schulden aufnehmen. Zugleich
  müsse die EU zentrale Aufgaben verlässlich finanzieren, insbesondere die Stärkung
  von Wettbewerbsfähigkeit und Verteidigungsfähigkeit sowie die militärische, humanitäre
  und langfristige Unterstützung der Ukraine. Der Bundeskanzler betonte, dass die
  Finanzverhandlungen einem übergeordneten Ziel dienen: „Europa soll handlungsfähig
  bleiben und seine Souveränität stärken.“'
