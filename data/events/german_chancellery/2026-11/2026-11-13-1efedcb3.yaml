title: Statement des Bundeskanzlers bei der informellen Tagung des Europäischen Rates
  in Dublin „Es geht um unser aller Sicherheit“
text: '„Europa ist der entscheidende Unterstützer der Ukraine“, betonte Bundeskanzler
  Merz. Neben dem Schwerpunkt „Künstliche Intelligenz“ bestimmten auch die Themen
  EU -Haushalt und Ukraine die Gespräche der Staats- und Regierungschefs bei der informellen
  Tagung des Europäischen Rates in Dublin. Die deutsche Zustimmung zum MFR an die
  kollektive Finanzierung der Ukraine-Unterstützung zu knüpfen, sei bei den Partnern
  auf breite Zustimmung gestoßen, betonte Kanzler Merz. Die Verantwortung der EU als
  größter Unterstützer der Ukraine müsse auch in Zukunft solidarisch getragen werden.
  „Es geht eben um unser aller Sicherheit. Also müssen auch alle fair dazu beitragen“,
  so der Kanzler. Als „der entscheidende Unterstützer“ der Ukraine – sowohl finanziell
  als auch militärisch – werde die EU mit am Verhandlungstisch in den kommenden Friedensgesprächen
  sitzen. Gemeinsam mit den US -Sondergesandten Witkoff und Kushner seien hier Fortschritte
  erzielt worden. Gleichzeitig appellierte Bundeskanzler Merz an die USA , weiter
  „im Team Europa und im Team mit der Ukraine“ zu spielen und gemeinsam für einen
  echten Frieden in der Ukraine zu arbeiten. Über eine geeinte EU-Position in den
  Verhandlungen werde man außerdem nächste Woche in Berlin mit der Koalition der Willigen
  beraten. Herzlich Willkommen. Ich möchte erst einmal die Gelegenheit nutzen, um
  herzlich Dank zu sagen. Der Taoiseach, wie man auf Irisch sagt, Micheál Martin,
  ist ein exzellenter Gastgeber. Wir haben hier in Dublin gestern ein sehr gutes Treffen
  der Europäischen Politischen Gemeinschaft mit intensiven Diskussionen – auch Diskussionen
  über den weiteren Gang der europäischen Finanzen – gehabt. Wir treten jetzt ein
  in die entscheidende Phase der Verhandlungen über den nächsten, den zukünftigen
  europäischen Finanzrahmen, der ab dem Jahr 2028 für sieben Jahre gelten soll. Ich
  habe am Rande des Treffens gestern und auch gestern Abend spät bzw. heute Morgen
  früh eine ganze Reihe von intensiven Gesprächen geführt. Ich muss zunächst feststellen:
  Wir sind von einer Einigung noch sehr weit entfernt. Ich habe aber große Zustimmung
  zu meiner Haltung zur Ukrainepolitik bekommen. Die Unterstützung der Ukraine ist
  und bleibt im Interesse aller Europäer, und deswegen müssen sich daran auch alle
  beteiligen. Wir beraten in Dublin auch intensiv darüber, wie wir den Frieden in
  der Ukraine und für die Ukraine erreichen können und wie wir damit auch Sicherheit
  für ganz Europa gewährleisten können. Was die Friedensverhandlungen betrifft, sind
  gewisse Fortschritte erreicht worden; das haben Sie vermutlich gestern Abend und
  heute Morgen auch erfahren. Daran haben wir hart gearbeitet. Unsere Berater haben
  gestern die amerikanischen Sondergesandten Witkoff und Kushner gesehen, und sie
  haben uns über ihr Gespräch mit Präsident Putin unterrichtet. In den nächsten Wochen
  soll es erstmals konkrete Friedensgespräche geben, in denen Europa vertreten ist.
  Das war für uns immer selbstverständlich: nicht über Europa ohne Europa und nicht
  über die Ukraine ohne die Ukraine. Das wird voraussichtlich im Kreis derjenigen
  europäischen Länder erfolgen, die diese Woche in Abu Dhabi dabei waren. Deutschland
  ist dabei gesetzt, das ist völlig klar. Wir werden dort natürlich weiter gemeinsame
  europäische Interessen vertreten. Russland will über Fragen einer europäischen Sicherheitsarchitektur
  sprechen. Darüber müssen wir nicht sprechen, die gibt es: Das ist insbesondere die
  NATO und das ist der europäische Teil der NATO . Wir sind uns als Europäer hier
  in Dublin einig: Es war Moskau – und nur Moskau –, das die Friedensordnung von Helsinki
  zerstört hat. Europas Sicherheit wird deshalb auch in Zukunft zuallererst durch
  eine starke, einige und auch europäische NATO gewährleistet. In den jetzt anstehenden
  Gesprächen muss es um die eine Frage gehen: In welchem Rahmen ist nach einem Frieden
  auch die Sicherheit der Ukraine garantiert? Zunächst aber müssen wir diesen Frieden
  überhaupt erst einmal erreichen. Hierzu muss Moskau sein Spiel auf Zeit beenden.
  Wir sind bereit, mit Moskau zu verhandeln. Diese Verhandlungen müssen aber aus einer
  Position der Stärke heraus geführt werden. Voraussetzung ist, dass sich die Ukraine
  auch in Zukunft weiter erfolgreich verteidigen kann. Europa ist der entscheidende
  Unterstützer der Ukraine; das gilt finanziell und auch militärisch. Ich habe mit
  vielen anderen hier in Dublin noch einmal deutlich gemacht: Diese Verantwortung
  müssen wir auch in Zukunft solidarisch tragen. Es geht eben um unser aller Sicherheit.
  Also müssen auch alle fair dazu beitragen. Sie wissen, dass ich in der nächsten
  Woche zu einem Treffen der sogenannten Koalition der Willigen eingeladen habe. Wir
  werden mit über 20 Staats- und Regierungschefs der Koalition in Berlin zusammenkommen.
  Wir wollen dabei zweierlei Dinge erreichen: erstens die Finanzierung der ukrainischen
  Verteidigung für das nächste Jahr, für 2027; zweitens eine erneut einige Position
  zu den anstehenden Friedensgesprächen. Wir wissen auch, dass Präsident Trump plant,
  in der nächsten Woche in China mit Präsident Putin über die Ukraine zu sprechen.
  Hier in Dublin befürchten einige, das könnte sozusagen ein zweiter Anchorage-Moment
  werden. Ich will deswegen unsere Botschaft an die USA noch einmal sehr deutlich
  sagen: Bitte keine Überraschungen – spielt weiter im Team Europa und im Team mit
  der Ukraine, und lasst uns gemeinsam für einen echten Frieden in der Ukraine arbeiten.
  Das ist unser Ziel, und an dem halten wir fest. Ich gehe davon aus, dass wir dies
  auch in den Beratungen im zweiten Teil des heutigen Tages gemeinsam so feststellen
  werden. Frage : Herr Bundeskanzler, Sie sagten gerade: Bitte keine Überraschungen.
  Werden Sie dazu auch noch einmal mit dem US -Präsidenten sprechen, um sicherzugehen,
  dass eben nicht genau das wieder passiert? Innenpolitisch gibt es ja immer noch
  die große Debatte zur Stromsteuersenkung. Wie wollen Sie das noch durchsetzen? Gibt
  es da noch einen Koalitionsausschuss, gibt es noch Gesprächsbedarf, und wo sollen
  die nötigen fünf Milliarden Euro herkommen? Bundeskanzler Merz: Ich habe mit Präsident
  Trump in der letzten Woche telefoniert, wir haben das schon miteinander besprochen.
  Wir sind auch ganz eng im Austausch mit den außenpolitischen Beratern, wir sind
  im engen Kontakt mit Kushner und Witkoff. Insofern gehe ich davon aus, dass das
  ausreichend kommuniziert wird. Wir haben gestern Nacht gesehen, dass die Beratungen
  über den Haushalt abgeschlossen worden sind. Darin ist die Stromsteuer nicht enthalten.
  Ich gehe davon aus, dass wir nächste Woche Dienstag im Koalitionsausschuss erneut
  darüber sprechen, und halte an meinem Ziel fest, die Stromsteuer auf das europäische
  Minimum abzusenken, und zwar ab dem nächsten Jahr in vollständiger Höhe. Frage :
  Herr Bundeskanzler, Frau Kallas hat heute noch einmal sehr deutlich gemacht, dass
  sie sich eigentlich in der perfekten Lage dafür sieht, die europäischen Positionen
  in möglichen Verhandlungen mit Moskau zu vertreten. Wie bewerten Sie ihre Äußerung?
  Ist es überhaupt noch sinnvoll, da wirklich nach einer Person zu suchen, oder wäre
  es nicht vielleicht sogar besser, das in einem etwas größeren Format zu machen?
  Noch ganz kurz: Wann können wir die Entscheidung zum neuen EZB -Präsidenten erwarten?
  Das war ja gestern Abend offenbar auch Thema. Bundeskanzler Merz: Wir sprechen über
  die Besetzung der Europäischen Zentralbank sehr intensiv. Es stehen Einigungen an,
  aber wir haben sie noch nicht abgeschlossen. Insofern brauchen wir noch einige Tage
  dafür. Wir wollen in der nächsten Woche den deutschen Vorschlag unterbreiten. Aber
  auch die Gespräche dazu sind noch nicht abgeschlossen, und ich muss sie über das
  Wochenende auch noch mit der SPD abstimmen. Insofern sind die Gespräche, wie gesagt,
  noch nicht abgeschlossen. Über die Vertretung der Europäischen Union werden wir
  natürlich weiter sprechen. Es gibt institutionelle Vertretungen. Kaja Kallas gehört
  selbstverständlich dazu, aber auch das E3-Format hat sich sehr bewährt. Wir beziehen
  im Übrigen Italien und Polen jederzeit mit ein; auch gestern Abend ist das der Fall
  gewesen. Insofern gibt es aus meiner Sicht im Augenblick keinen Bedarf, eine institutionelle
  Debatte zu führen. Frage: Erste Frage: Sind Sie sich sicher, Herr Bundeskanzler,
  dass Europa wirklich beteiligt werden kann? Der Sprecher von Präsident Putin hat
  heute gesagt, dass eine Entscheidung erst getroffen werden könne – wörtlich zitiert –,
  „wenn wir ihre wirklichen Absichten und ihre Bereitschaft verstehen, zum Friedensprozess
  beizutragen“. Ist das aus Ihrer Sicht jetzt klar oder noch nicht? Zweite Frage:
  Wann rechnen Sie mit einem Treffen auf Ebene der Chefs in einem Viererformat, und
  wer sollte dann aus Ihrer Sicht für Europa an einem solchen Treffen teilnehmen?
  Bundeskanzler Merz: Herr Kollege, für eine Beantwortung der zweiten Frage ist es
  viel zu früh. Das lässt sich jetzt noch nicht absehen. Zu der ersten Frage: Das
  ist das übliche Spiel, dass wir insbesondere vom Sprecher des Kremls immer wieder
  sehen. Es hat gestern Abend eine klare Botschaft gegeben. Wir sind uns mit den Amerikanern
  einig – ich will es wiederholen –: kein Gespräch über die Ukraine ohne die Ukraine
  und kein Gespräch über Europa ohne Europa. Über eine europäische Sicherheitsarchitektur
  müssen wir nicht sprechen, die haben wir.'
