title: 'Mendelssohn-Haus in Leipzig erhält 225.000 Euro für neue Dauerausstellung
  – Staatsminister Weimer: „Ein wertvolles Stück unseres musikalischen Erbes lebendig
  halten“'
text: 'Anlässlich des heutigen Todestages von Felix Mendelssohn-Bartholdy freut sich
  der Beauftragte der Bundesregierung für Kultur und Medien, das Mendelssohn-Haus
  in Leipzig mit 225.000 Euro für die Modernisierung und Digitalisierung seiner Dauerausstellung
  zu unterstützen. Diese soll zum Festjahr 2027 fertiggestellt werden. Dann feiert
  das Mendelssohn-Haus sein 30-jähriges Bestehen und erinnert zugleich an den 100.
  Geburtstag seines Gründers Kurt Masur. Dazu erklärt Staatsminister Weimer: „Mit
  der Erneuerung der Dauerausstellung des Mendelssohn-Hauses halten wir ein wertvolles
  Stück unseres musikalischen Erbes lebendig und machen es in der Musikstadt Leipzig
  erfahrbar. Ich freue mich besonders auf die digitalen Angebote, etwa die Erweiterung
  des virtuellen Orchesters, in dem Besucher selbst den Taktstock übernehmen können.
  Zugleich ist es gerade in Zeiten erstarkenden Rechtsextremismus wichtig, auch die
  antisemitische Verunglimpfung Mendelssohns und die Schattenseiten seiner Rezeptionsgeschichte
  sichtbar zu machen.“ Neben Mendelssohns musikalischer Vielseitigkeit und seinem
  Wirken als Künstler und Europäer wird künftig auch die antisemitische Rezeptionsgeschichte
  stärker beleuchtet. Ihr trauriger Höhepunkt war 1936 die Zerstörung des Leipziger
  Mendelssohn-Denkmals durch die Nationalsozialisten. Zugleich schlägt die Ausstellung
  eine Brücke zu Kurt Masur, der sich zeitlebens eng mit Mendelssohns Musik und Persönlichkeit
  verbunden fühlte. Dazu Patrick Schmeing, Direktor des Mendelssohn-Hauses: „Die neue
  Dauerausstellung soll die unglaubliche Vielseitigkeit Mendelssohns beleuchten: als
  künstlerischer Visionär, gesellschaftlicher Akteur und humanistisch gebildeter Europäer.“
  Die Förderung erfolgt aus dem Programm „Investitionen für national bedeutsame Kultureinrichtungen
  in Deutschland“ (INK). Auch die Ostdeutsche Sparkassenstiftung und der Förderverein
  des Mendelssohn-Hauses beteiligen sich an der Finanzierung.'
