title: Bundeskanzler Merz empfängt den finnischen Staatspräsidenten Stubb
text: Bundeskanzler Friedrich Merz wird am 17. November 2026 den finnischen Staatspräsidenten
  Alexander Stubb in Berlin empfangen. Nach der Begrüßung um 9:45 Uhr am Bundeskanzleramt
  ist ein Vier-Augengespräch geplant sowie anschließend ein Delegationsgespräch. Im
  Vordergrund des Austauschs werden voraussichtlich die Themenbereiche Sicherheit
  und Verteidigung sowie der Angriffskrieg Russlands gegen die Ukraine stehen. Für
  10:45 Uhr ist eine gemeinsame Pressebegegnung von Bundeskanzler Friedrich Merz und
  Staatspräsident Alexander Stubb geplant.
