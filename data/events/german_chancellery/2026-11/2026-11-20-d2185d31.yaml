title: '14 EU-Staaten schließen sich deutscher Initiative zum Schutz des digitalen
  Raums an – Staatsminister Weimer: „Starkes Urheberrecht und Jugendmedienschutz haben
  höchste Priorität.“'
text: 'Kulturstaatsminister Wolfram Weimer hat sich heute beim Rat der Europäischen
  Union für Bildung, Jugend, Sport und Kultur in Brüssel als Vertreter Deutschlands
  mit den europäischen Kultur- und Medienministerinnen und -ministern über die Stärkung
  des Urheberrechts und den Schutz junger Menschen im digitalen Raum ausgetauscht.
  Von deutscher Seite angestoßen, haben sich vierzehn weitere Mitgliedstaaten, darunter
  Frankreich, Polen und Spanien, an die Europäische Kommission gewandt, so bald wie
  möglich einen Legislativvorschlag zur Stärkung des Urheberrechts im KI-Zeitalter
  vorzulegen. Die „Gezielte Initiative für eine besseres urheberrechtliches Umfeld
  für Kreativität und Innovation in Europa“ der EU-Kommission ist ein entscheidender
  und wichtiger Schritt hin zu einem europäischen Regulierungsrahmen. Dieser müsse
  Kreativen im Zeitalter von KI den notwendigen Schutz bieten und gleichzeitig KI-Unternehmen
  nachhaltige Innovation durch rechtmäßigen Zugang zu geschützten Inhalten ermöglichen.
  Ziel ist es, sicherzustellen, dass Urheberinnen und Urheber sowie Rechteinhaberinnen
  und Rechteinhaber angemessen vergütet werden für die kreativen Leistungen, aus denen
  sich KI ganz wesentlich speist. Staatsminister Weimer: „Kreative Vielfalt darf kein
  kostenloser Rohstoff für die KI-Industrie sein. Sie ist das Ergebnis von Arbeit,
  Talent und Leidenschaft. Wer diese Leistungen nutzt, muss sie respektieren und somit
  auch angemessen vergüten. Wir haben gesehen, dass KI Kreativität unterstützen kann
  und neue Möglichkeiten eröffnet. Sie darf aber keinesfalls dazu führen, dass diejenigen,
  die die Inhalte schaffen, leer ausgehen. KI-Innovationen müssen möglich sein, aber
  auf einer fairen Grundlage. Dazu benötigen wir vor allem Transparenz, ein starkes
  Urheberrecht und faire Wettbewerbsbedingungen. Vor diesem Hintergrund setzt sich
  Deutschland heute dafür ein, dass auf europäischer Ebene Kreativität auch im Zeitalter
  künstlicher Intelligenz eine eigenständige wirtschaftliche und gesellschaftliche
  Grundlage behält.“ Der Beauftragte der Bundesregierung für Kultur und Medien (BKM)
  setzt sich für eine stärkere Transparenz der KI-Trainingsdaten und eine Verbesserung
  der rechtlichen Rahmenbedingungen zur effektiven Durchsetzung von Urheber- und Leistungsschutzrechten
  ein, sowie für die Schaffung eines echten Level Playing Fields für die Europäische
  KI-Industrie. Ein wichtiges Thema war auch der Fortschrittsbericht zur aktuell verhandelten
  „EU KIDS ACT“-Verordnung und eine anschließende Aussprache der Kultur- und Medienminister
  aus allen Mitgliedstaaten. Der Vorschlag der Europäischen Kommission sieht einen
  besseren Schutz von Kindern und Jugendlichen im digitalen Raum vor. Dazu gehören
  klare Altersgrenzen für die Nutzung sozialer Medien, altersgerechte Angebote und
  wirksame Schutzmaßnahmen gegen süchtig machende Funktionen und unerwünschte Kontakte.
  Des Weiteren wurde im Rat der neue EU-Arbeitsplan für Kultur 2027-2030 beschlossen.
  Dieser dient als politischer Fahrplan für die europäische Kulturpolitik und legt
  Prioritäten und Arbeitsmethoden in der europäischen Zusammenarbeit der Mitgliedstaaten
  für die kommenden vier Jahre fest. Auf deutsche Initiative hin enthält der Entwurfstext
  insbesondere eine intensivere Befassung mit den Herausforderungen und Chancen der
  KI für den Kultur- und Mediensektor. Deutschland schloss sich zudem der französischen
  Initiative zur Stärkung der europäischen Medienlandschaft an und sprach sich erneut
  für eine ambitionierte Revision der Richtlinie über audiovisuelle Mediendienste
  aus. Auch forderte Deutschland, die Refinanzierungsmöglichkeiten journalistisch-redaktioneller
  Angebote nicht unverhältnismäßig einzuschränken. Am Rande der Sitzung betonte Staatsminister
  Weimer hierzu seine Sorge mit Blick auf den Digitalomnibus und den Kommissionsvorschlag
  für einen Digital Fairness Act. Am Rande des Rates machte sich Weimer erneut für
  eine europäische Eigentümerstruktur für die Betätigung von TikTok in Europa stark.
  „Nur so behalten wir die Kontrolle über unsere Algorithmen und unsere Daten“, sagte
  Weimer. „Das wäre ein großer Schritt hin zu einer wirklichen europäischen Souveränität.“'
