title: Bundesregierung aktuell
text: 'wie viel Staat verträgt der Staat? Wie viel Freiheit braucht die Gesellschaft,
  um sich entfalten zu können? Und wo eigentlich steckt die größte Kraft einer Gesellschaft?
  Das sind grundlegende Fragen für ein Land im Umbruch, Fragen, die im politischen
  Tagesgeschäft eigentlich kaum diskutiert werden. Dass der Bundeskanzler sie dennoch
  stellt (und aus seiner Sicht beantwortet), hat mit einer tiefen Überzeugung zu tun,
  die Friedrich Merz zu seiner Reformpolitik antreibt. Immer wieder wird der Bundeskanzler
  gefragt, warum das alles eigentlich nötig sei? Manchmal antwortet er mit Details
  aus den einzelnen Reformprogrammen, manchmal mit Blick auf die nächste Generation,
  den Wohlstand im Land oder mit Überlegungen zur Gerechtigkeit. Diesmal aber, aus
  Anlass der Verleihung der Hayek-Medaille an den Wikipedia-Gründer Jimmy Wales, nimmt
  Merz Anleihe bei den volkswirtschaftlichen Grundsätzen, die der Ökonom Friedrich
  August von Hayek mit profundem soziologischem und philosophischem Wissen angereichert
  hat. Die von Merz auf das eigene Land übertragene, zentrale Botschaft: Freiheit
  ist Deutschlands strategischer Wettbewerbsvorteil. Schon in den 30er-Jahren des
  letzten Jahrhunderts argumentierte Hayek, dass kein Staat das Wissen und die Kreativität
  einer ganzen Gesellschaft ersetzen kann. Fortschritt entsteht dort, wo Menschen
  frei handeln, Unternehmen im Wettbewerb stehen und sich neue Ideen entfalten und
  dezentral die besten Lösungen entwickelt werden können. Hayek vertraute auf die
  Selbstorganisation einer freien Gesellschaft und lieferte damit den Gegenentwurf
  zu Planwirtschaft und Kollektivismus – in einer Zeit, als autoritäre und totalitäre
  Systeme an Popularität gewannen. Freiheit in einem demokratischen System ist deshalb
  nicht Risiko, sondern eine Ressource. Das heißt nicht, dass der Staat untätig bleiben
  soll. Der Bundeskanzler: Die eigentliche Kraft kommt aus der Gesellschaft, aber
  der Staat muss Rahmen dafür schaffen, dass sich die produktive Dynamik der Freiheit
  entfalten kann. Kurz: Es gibt keine Freiheit ohne Regeln. Es braucht verlässliche
  Eigentumsrechte, Wettbewerbsregeln, eine gute Infrastruktur und Sicherheit. Freiheit
  bedeutet auch offene Märkte und fairer Wettbewerb statt Abschottung. Wo aber steckt
  die größte Kraft einer Gesellschaft? Die Antwort auf diese Frage ist nicht simpel
  – und vor allem erfordert sie eine Gesellschaft, die den Gedanken der Freiheit mitträgt
  und darin einen Gewinn sieht. Erst eine offene Gesellschaft, in der jede und jeder
  nach Zielen streben kann und für Bestleistungen belohnt wird – erst diese Gesellschaft
  honoriert die Vielfalt und besiegt die Dumpfheit der Gleichmacherei. Politik, das
  ist die Überzeugung des Kanzlers, sollte der Gesellschaft die Freude an dieser Freiheit
  vermitteln. Dies geht nur in einer politischen und wirtschaftlichen Ordnung, die
  bejaht, wertschätzt und dabei solidarisch ist. Bedauerlicherweise finden solche
  sehr prinzipiellen Überlegungen kaum noch Widerhall in den Medien, aber es lohnt,
  sich damit zu beschäftigen. Sie finden die Rede hier. Wie eng Freiheit, Innovation
  und wirtschaftliche Stärke zusammenhängen, zeigte in dieser Woche der Digitalgipfel
  in Berlin. Das Ziel ist inzwischen bekannt: Deutschland soll KI-Nation werden. Das
  ist eine geradezu verpflichtende Aufgabe, weil in dieser nächsten technologischen
  Revolution nur Exzellenz zu Souveränität und Wettbewerbsfähigkeit führt. Darum also
  geht es: souverän zu werden, Abhängigkeiten abzubauen. Denn nur eine souveräne KI-Nation
  kann Chancen und Risiken selbst kalibrieren und gesellschaftlichen Verwerfungen,
  Missbrauch und Technologie-Übermacht zuvorkommen. Damit diese Themen nicht Theorie
  bleiben, sondern in konkreter Politik münden, hat eine KI-Taskforce unter der Federführung
  des Digitalministeriums einen Fahrplan bis 2030 erarbeitet. Die Bundesregierung
  setzt darin messbare Ziele. Mindestens 55 Prozent der kleinen und mittleren Unternehmen
  sollen KI einsetzen. Mindestens 90 Prozent der Bundesbehörden sollen wenigstens
  eine KI-Anwendung produktiv nutzen. Die Rechenleistung soll sich vervierfachen und
  mindestens eine europäische KI-Gigafabrik in Deutschland ihren Betrieb aufnehmen.
  So wurde es auf dem Digitalgipfel in dieser Woche diskutiert. Freiheit und Wettbewerb
  erhalten einen ganz anderen Klang, wenn der ukrainische Präsident Wolodymyr Selenskyj
  zu Gast ist. Diese Besuche in Berlin gehören fast schon zur Routine, was angesichts
  der engen Beziehungen nicht verwundert. Aber Freiheit und Sicherheit sind eben bedrohte
  Güter in Europa. Russland setzt seine Angriffe auf die Ukraine mit vielen Toten
  und Verletzten unvermindert fort. Mehr als 50 000 Soldaten standen allein im vergangenen
  Monat auf der russischen Opferliste. Eine atemberaubend hohe Zahl. Die Botschaft
  des Bundeskanzlers an Russland bleibt deshalb eindeutig: „Es ist Zeit für ein Ende
  dieses Krieges“. In der kommenden Woche gehen die Verhandlungen weiter, diesmal
  in Abu Dhabi. Denn ohne Freiheit ist alles nichts. „Der Staat muss Voraussetzungen
  schaffen, damit Freiheit und Wettbewerb entstehen: Eigentumsrechte sichern, Infrastruktur
  bereitstellen, Finanzierung ermöglichen und klare Regeln durchsetzen. Die Aufgabe
  des Staates ist es, den Rahmen zu schaffen, nicht den Markt zu ersetzen.“ Wir freuen
  uns über Ihr Feedback: Nutzen Sie bitte dafür das Kontaktformular (nicht die Antwortfunktion
  auf diese E-Mail).'
