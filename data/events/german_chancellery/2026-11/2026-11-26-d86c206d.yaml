title: „Europa muss die Systemfrage zu TikTok stellen“ – Staatsminister Weimer und
  Staatssekretär Pröll treiben Allianz für europäische Lösung weiter voran
text: 'Kultur- und Medienstaatsminister, Wolfram Weimer, und Österreichs Staatssekretär
  für Digitalisierung, Alexander Pröll, haben heute bei einem gemeinsamen Treffen
  im Bundeskanzleramt in Wien ihre Initiative „TikTok europäisch denken“ bekräftigt.
  Ziel ist eine europäische Eigentümerstruktur für das Europageschäft von TikTok und
  europäische Verantwortung für die zentrale technologische Infrastruktur – vom Empfehlungsalgorithmus
  bis zum Datenzugriff. TikTok erreicht in Europa rund 200 Millionen Menschen, etwa
  ein Drittel der Bevölkerung in Deutschland und Österreich nutzt die Plattform. Damit
  ist TikTok ein zentraler Ort der öffentlichen Meinungsbildung – vor allem für junge
  Menschen. Staatsminister Wolfram Weimer: „Jetzt ist Europa am Zug. Unser Ziel ist
  es, gemeinsam mit weiteren europäischen Partnern die Systemfrage zu TikTok zu stellen.
  Wir haben es bei TikTok mit grundlegenden sicherheitspolitischen Risiken für Europa
  zu tun, die wir viel zu lange unterschätzt haben und es teilweise immer noch tun.
  Das alles betrifft unmittelbar die Unabhängigkeit unserer demokratischen Öffentlichkeit.“
  Staatssekretär Alexander Pröll: „Wer die Plattform kontrolliert, kontrolliert, was
  Millionen Europäerinnen und Europäer sehen, denken und teilen. TikTok ist längst
  kein Spielzeug mehr, sondern Infrastruktur unserer Demokratie. Diese Infrastruktur
  darf nicht in der Hand eines geopolitischen Systemkonkurrenten bleiben.“ Regulierung
  allein reicht nicht Die Europäische Kommission führt gegen TikTok Verfahren nach
  dem Digital Services Act, zuletzt mit vorläufigen Feststellungen vom 6. November
  2026 zur algorithmischen Verstärkung potenziell schädlicher Inhalte. Für Weimer
  und Pröll beantworten diese jedoch nicht die Grundfrage, wer die Plattform tatsächlich
  steuert. „Europa darf nicht länger zuschauen, wie seine digitale Öffentlichkeit
  von außen gesteuert wird. Wir brauchen eine europäische Lösung, die Datenschutz,
  Medienvielfalt und Jugendschutz wirksam durchsetzt“, so Weimer. „Regulierung ohne
  Kontrolle ist wie ein Schloss ohne Schlüssel. Entscheidend ist nicht nur, wem die
  Anteile gehören, sondern wer den Algorithmus betreibt, wer Updates freigibt und
  wer auf die Daten zugreift. Das muss in Europa passieren“, betont Pröll. Aus zwei
  Ländern soll eine europäische Allianz werden Staatsminister Weimer hat die Initiative
  bereits beim Rat der EU-Kulturministerinnen und -minister am 20. November in Brüssel
  vorgestellt. Staatssekretär Pröll wird am 2. Dezember beim Rat für Telekommunikation
  (TTE) in Brüssel aktiv um weitere Mitgliedstaaten werben. „Aus zwei Ländern sollen
  viele werden. Österreich hat bereits die Erklärung zur europäischen digitalen Souveränität
  initiiert, die alle 27 Mitgliedstaaten mittragen. Jetzt geht es um die Umsetzung.
  Europas Daten, Europas Regeln, Europas Verantwortung: Die Tür für weitere Partner
  steht weit offen. Je mehr Staaten mitmachen, desto stärker ist Europas Stimme gegenüber
  ByteDance“, so die beiden abschließend.'
