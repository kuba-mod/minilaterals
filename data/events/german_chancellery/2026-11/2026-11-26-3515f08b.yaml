title: Aktuelle Gesetze und Regelungen Was ist neu im Dezember 2026?
text: 'Das Produkthaftungsrecht wird im Dezember modernisiert. Es gilt künftig auch
  für digitale Produkte. Software und Künstliche Intelligenz (KI) werden ab dem 9.
  Dezember 2026 in die Produkthaftung einbezogen. Das heißt, dass Hersteller auch
  bei digitalen Produkten für Schäden haften, die durch fehlerhafte Ware verursacht
  werden. Neben Herstellern können unter bestimmten Voraussetzungen weitere Wirtschaftsakteure
  in Anspruch genommen werden – wie etwa Importeure oder Lieferanten. In Zeiten zunehmender
  Digitalisierung und globaler Wertschöpfungsketten wird damit das Schutzniveau für
  Verbraucherinnen und Verbraucher erhöht und die Rechtssicherheit für Unternehmen
  sichergestellt. Weiter Informationen zur Modernisierung des Produkthaftungsrechts
  Alle Neuregelungen auf einen Blick : Welche neuen Gesetze treten in Kraft? Was ändert
  sich im neuen Monat? Hier finden Sie einen Überblick , Monat für Monat.'
