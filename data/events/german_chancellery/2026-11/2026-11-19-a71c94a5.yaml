title: Newsletter Verbraucherschutz aktuell / Ausgabe 13
text: 'Das Bundeskabinett hat die Finanzbildungsstrategie beschlossen. Wer Chancen
  und Risiken von Geldanlagen am Kapitalmarkt kennt, kann fundierter für das Alter
  vorsorgen. Mit der Frühstartrente und dem privaten Altersvorsorgedepot hat die Bundesregierung
  bereits zwei Vorhaben auf den Weg gebracht. Geplant ist, die gesetzliche Rentenversicherung
  noch um ein kapitalgedecktes Element zu ergänzen. Was die Frühstartrente und das
  Altersvorsorgedepot konkret bedeuten, erfahren Sie hier. Flexibilität für Unternehmen
  verbessern, Rechte für Arbeitnehmer stärken: Das Kabinett hat einen Gesetzentwurf
  beschlossen, der eine Reihe von Änderungen im Arbeitsrecht vorsieht. Ziel ist, das
  Wachstumspotenzial der Wirtschaft weiter zu stärken. Die Regierungskoalition plant
  zum 1. Januar 2027, die Stromsteuer auf das europäische Mindestniveau zu senken
  und einen Spritpreisdeckel einzuführen. Die Entlastungen beim Strompreis sollen
  insbesondere kleinen Betrieben und Familien zu Gute kommen. Eine gute Kinderbetreuung
  und eine frühe Förderung aller Kinder gehören zu den wichtigsten Zukunftsaufgaben
  in Deutschland. Die Bundesregierung will deshalb die Startchancen von Kindern verbessern
  und die Qualität der frühkindlichen Bildung stärken. Bundesfamilienministerin Karin
  Prien und Kerstin Claus, die Missbrauchsbeauftragte der Bundesregierung, haben die
  neuen Inhalte der Kampagne "Schieb deine Verantwortung nicht weg!" vorgestellt.
  Die Kampagne macht auf die Gefahren in der digitalen Welt aufmerksam und richtet
  sich insbesondere an Eltern und andere Erwachsene: Sie sollen Risiken erkennen,
  Verantwortung übernehmen und Kinder und Jugendliche im digitalen Raum schützen und
  begleiten. Ab 20. November gilt die EU-Verbraucherkreditrichtlinie. Verbraucherinnen
  und Verbraucher sollen besser vor Überschuldung geschützt werden - durch größere
  Transparenz und durch mehr Informationen. Die Gefahr einer Schuldenfalle droht vor
  allem bei der übermäßigen Nutzung von Buy now, pay later -Bezahlmodellen. Zudem
  gibt es künftig leichter Hilfe bei Schuldnerberatungsdiensten. KI ist inzwischen
  ein ständiger Begleiter im Alltag und hilft in vielen Lebenslagen. Die Bundesregierung
  möchte diese Entwicklung gezielt fördern - durch mehr KI-Kompetenzen in der Bevölkerung,
  eine innovationsfreundliche Umsetzung der EU-KI-Verordnung und eine neu etablierte
  KI-Aufsicht. Hier finden Sie Fragen und Antworten zu den Zielen der Bundesregierung
  bei dieser wichtigen Zukunftstechnologie. Abo-Fallen, Fake-Shops, versteckte In-App-Käufe
  oder manipulative Werbung in den sozialen Medien – junge Verbraucherinnen und Verbraucher
  sind im Alltag mit vielfältigen irreführenden Geschäftspraktiken konfrontiert. Gleichzeitig
  finden sie oft nur schwer verlässliche und unabhängige Informationen. Hier setzt
  das bundesweite Projekt „Verbraucherrecht easy“ mit verschiedenen Online-Angeboten
  unter dem Namen „verbraucherschutz2go“ an. Der Bundespreis Verbraucherschutz der
  Deutsche Stiftung Verbraucherschutz geht an „Was hab'' ich?“. Die gemeinnützige
  Organisation übersetzt medizinische Fachsprache in verständliche Sprache und setzt
  sich für eine bessere Kommunikation zwischen Ärzten und Patienten ein. In diesem
  Jahr dreht sich alles um das Motto: „Ressourcen wertschätzen. Bewusst entscheiden!“
  Im Mittelpunkt steht ein zentraler Gedanke: Der beste Abfall ist der, der gar nicht
  erst entsteht. Durch die Vermeidung von Abfällen an der Quelle lassen sich Ressourcen
  schützen und Emissionen verhindern – und so die planetaren Grenzen respektieren.
  Machen Sie mit! Mit welchen Herausforderungen sind Verbraucherinnen und Verbraucher
  sowie Reparaturbetriebe konfrontiert, wenn sie Produkte reparieren wollen, und welche
  Verbesserungen schlagen sie vor? Zu dieser Frage hat die EU-Kommission eine öffentliche
  Konsultation und eine Sondierung gestartet, an der sich Bürgerinnen und Bürger,
  Unternehmen, Nichtregierungsorganisationen, Behörden und Forschende beteiligen können.'
