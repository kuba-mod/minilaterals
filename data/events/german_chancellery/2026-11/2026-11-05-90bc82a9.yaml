date: '2026-11-05'
type: press_release
source_name: german_chancellery
title: Bundeskanzler Merz bei der Hayek-Konferenz Freiheit ist kein Risiko, sondern
  wichtigstes Gut
text: 'Freiheit sei die wichtigste Ressource, um mit Unsicherheit umzugehen, sagte
  Bundeskanzler Merz in seiner Rede. Gerade angesichts radikaler Unsicherheit und
  struktureller Umbrüche ist Freiheit kein Risiko, das wir uns leisten. Das hat Bundeskanzler
  Merz in seiner Rede auf der Friedrich-August-von-Hayek-Konferenz in Berlin gesagt.
  „Sie ist unsere wichtigste Ressource, um mit Unsicherheit umzugehen.“ Dabei erinnerte
  er auch an den Ökonomen und Nobelpreisträger Friedrich August von Hayek. Der habe
  auf dem Höhepunkt der Weltwirtschaftskrise 1932 die Prämisse vertreten, dass wirtschaftliche
  Anpassungsprozesse dauernd notwendig seien und sich im freien Wettbewerb ohne bevormundende
  staatliche Eingriffe vollziehen müssten. „Wir müssen neu lernen, uns gemeinsam zu
  freuen über die Leistungskraft unserer freien und offenen Gesellschaft, in der jeder
  seine Ziele verfolgen kann und die genau deshalb die besten Ergebnisse für alle
  hervorbringt", sagte der Kanzler. Er appellierte an mehr Großzügigkeit im Miteinander,
  ohne die eine freiheitliche Demokratie nicht überleben könne. Denn kein Staat könne
  zentral die richtigen Lösungen vorgeben, sondern diese müssten sich frei und dezentral
  entwickeln. Der Staat habe eine Wirtschaftspolitik der Freiheit und des Wettbewerbs
  zu sichern, mit der Sozialen Marktwirtschaft als Leitplanke, so Merz. herzlichen
  Dank für die Einladung und für die Gelegenheit, die Sie mir geben, mich seit längerer
  Zeit einmal wieder mit August von Hayek zu befassen. Es ist eine große Freude gewesen
  – schon die Vorbereitung auf die Begegnung mit Ihnen. Ich will mit einer dieser
  wunderbaren Formulierungen beginnen, der Bestimmungen der Freiheit und der menschlichen
  Grenzen, wie wir sie überall im Werk von Friedrich August von Hayek finden. Er hat
  gesagt: „Freiheit ist wesentlich, um Raum für das Unvorhersehbare und Unvoraussagbare
  zu lassen; wir wollen sie,“ „weil wir gelernt haben, von ihr die Gelegenheit zur
  Verwirklichung vieler unserer Ziele zu erwarten.“ Dann ist er schon bei unseren
  Grenzen. Jeder Einzelne wisse so wenig, und selten wüssten wir, wer etwas am besten
  wisse. Aber wir könnten darauf vertrauen – ich zitiere ihn wieder –, „dass die unabhängigen
  und wettbewerblichen Bemühungen vieler die Dinge hervorbringen, die wir wünschen
  werden, wenn wir sie sehen.“ Meine Damen und Herren, ich will die Dinge so beschreiben,
  wie sie mich beschäftigen, insbesondere mit Blick auf die Wirtschaftspolitik, und
  ich will sie in den Zusammenhang einiger Gedanken stellen, die Friedrich August
  von Hayek geäußert hat. Das Schöne dabei ist: Ich muss das für mich gar nicht erst
  herbeizwingen. Es ist Hayek, und es ist der Liberalismus gegen dieses totalitäre
  20. Jahrhundert, die meine politischen Anschauungen neben – das gebe ich zu – sozial-katholischen
  und konservativen Intuitionen geprägt haben. Friedrich August von Hayek schwamm
  zeitlebens gegen den Strom. Er hat Freiheit, Wettbewerb als Entdeckungsverfahren,
  freie Preisbildung mit ihrer Signalwirkung, Vertrauen in die Leistungsfähigkeit
  spontaner Ordnung aus dem freien Miteinanderhandeln von Millionen Menschen, er hat
  dies alles seit den 30er-Jahren vertreten und verteidigt, seit 1933 in London, wie
  wir alle wissen, in Jahrzehnten also, in denen Planwirtschaft, Kollektivismus und
  Sozialismus, autoritäre und totalitäre Systeme überall auf dem Vormarsch waren.
  Er hat all dies verstanden und vertreten, nachdem er selbst, als junger Mann zurückgekehrt
  aus dem Ersten Weltkrieg, wie viele seiner Generation von sozialistischen Ideen
  eine Besserung der Verhältnisse erhoffte. Er war interessanterweise begeistert von
  sozialistischen und planwirtschaftlichen Überlegungen, bis hin zu Walter Rathenau.
  Wie so oft: Die Klügsten sind oft die, die früher einmal selbst den Vorstellungen
  der späteren Gegner angehangen haben, oder etwas drastisch formuliert aus der Neuen
  Frankfurter Schule des Humors: „Die schärfsten Kritiker der Elche waren früher selber
  welche.“ Meine Damen und Herren, 1899 ist Hayek in Wien zur Welt gekommen, im Vielvölkerstaat
  voller ideologischer und sozialer Spannungen, einem schroffen Nebeneinander von
  Alt und Neu, Ordnungszerfall und vielfachen Unsicherheiten, in eine damals akademische
  Familie hinein, deren Vorfahren im 18. Jahrhundert in den Adelsstand erhoben worden
  waren. Er kam zur Nationalökonomie – heute würden wir sagen: zur Volkswirtschaftslehre ‑
  über vorherige rechtswissenschaftliche, philosophische und psychologische, über
  sozialwissenschaftliche Studien. Man merkt es seinem wirtschaftlichen Denken überall
  an. Die Grenzen menschlicher Steuerungsfähigkeit, im Grunde ein „Ich weiß, dass
  ich nichts weiß“, das ist immer Hayeks Grundimpuls gewesen. Aus diesem Impuls heraus
  trat er in der Weltwirtschaftskrise und auf ihrem Höhepunkt 1932 eben nicht für
  Stimulierungen der Nachfrage ein, sondern er plädierte dafür, dass sich notwendige
  Anpassungsprozesse vollziehen können müssen. Das war mutig. Wir wissen: Sein Antipode
  damals war Keynes. Wir finden uns heute in einer Weltlage wieder, in der es wieder
  mutig ist und unzeitgemäß scheint, auf diese Ideen zu setzen. Aber wir müssen es
  tun. Ich kämpfe dafür, dass wir diesen Geist der Freiheit auch heute wieder aufrufen.
  Um diesen Kampf schien es schon einmal besser zu stehen. Nach 1989 dachten viele,
  er sei gewonnen. Aber heute wissen wir alle, dass wir neu ringen müssen. Philosophische
  und ökonomische Erkenntnisse nützen nur dann, wenn die Mehrheit der Gesellschaft
  die eigenen Interessen und Lebenshoffnungen mit dieser offenen, freiheitlichen Welt
  verbinden kann. Das ist für jeden einzelnen keineswegs einfach. Meine Damen und
  Herren, wirtschaftliche Anpassungsprozesse sind dauernd notwendig, schon um den
  erreichten Wohlstand nur zu erhalten. Sie müssen sich vollziehen können. Sie dürfen
  nicht durch gut gemeinte Interventionen unterdrückt werden. Alles andere wäre letztlich
  krisenverschärfend, wie Hayek wusste. Aber das ist das, was so schwer auszuhalten
  ist: Nicht jeder wird in diesen Prozessen immer nur gute Zeiten durchmachen. Da
  liegt die Verantwortung des Sozialstaats. Ich werde darauf noch zurückkommen. Für
  Hayek hatte der Weg zu den Totalitarismen des 20. Jahrhunderts ideengeschichtlich
  auch über den Sozialismus geführt, über den anmaßenden Glauben, Gesellschaft rational
  steuern zu können. Viele von Ihnen werden sich möglicherweise daran erinnern: Die
  CDU hat im Bundestagswahlkampf 1976 die Parole „Freiheit statt Sozialismus“ zu einem
  erfolgreichen Instrument der gedanklichen Klarheit gemacht. Ich will nicht in dieses
  Jahr und in diesen Ton zurück, aber wenn ich gerade in diesen Tagen in die Stadt
  Berlin hinein höre, dann kann ich gar nicht anders als zu sagen: „Freiheit statt
  Sozialismus“, das ist noch immer die zentrale Fragestellung. Meine Damen und Herren,
  ich will in diesem Sinne einige heute entscheidenden Arbeitsgebiete für uns in der
  Politik durchgehen. Ganz allgemein: In einer Zeit radikaler Unsicherheit, großer
  geopolitischer Herausforderungen, eines Systemwettbewerbs, nicht zuletzt mit China,
  und struktureller Umbrüche in der deutschen Wirtschaft ist Freiheit unser zentraler
  strategischer Wettbewerbsvorteil. In diesen Zeiten ist Freiheit kein Risiko, das
  wir uns mal so leisten. Freiheit ist unsere wichtigste Ressource, um mit Unsicherheiten
  umzugehen. Nun ist es immer so, aber es wird in diesen Zeiten eines epochalen Wandels
  besonders fassbar: Kein Staat kann das notwendige Wissen zentral sammeln und die
  richtigen Lösungen im Voraus ermitteln. Deshalb braucht es offene Märkte, deshalb
  braucht es unternehmerische Freiheit und eben Wettbewerb, damit sich die besten
  Lösungen nicht zentral, sondern dezentral entwickeln können. Hayek wusste – und
  wir könnten es heute alle zusammen mit ihm wissen –: Der Staat soll wirtschaftliche
  Entscheidungen nicht selbst treffen – weil er es nicht kann. Wissen ist verteilt.
  Der Wettbewerb, so sagen wir es als überzeugte Marktwirtschaftler, ist ein Entdeckungsverfahren.
  Preise vermitteln Informationen, die kein zentraler Planer vollständig besitzen
  kann. Der Staat wiederum soll sich nach unserem Verständnis auf den Ordnungsrahmen
  konzentrieren, in dem sich Freiheit überhaupt erst entfalten kann: Eigentumsrechte
  sichern, Wettbewerb ermöglichen, Infrastruktur und leistungsfähige Finanzierungsinstrumente
  bereitstellen und vor allem Regeln nicht nur aufstellen, sondern auch durchsetzen.
  Staatliche Strategie kann Impulse setzen, aber staatliche Strategie kann niemals
  den Entdeckungsprozess offener Märkte ersetzen. Lassen Sie mich auf ein Thema zu
  sprechen kommen, das wir in der Bundesregierung als eine besonders wichtige staatliche
  Strategie entwickelt haben. Es ist die Hightech Agenda oder auch unsere Start-up-
  und Scale-up-Strategie. Wir setzen damit wichtige Impulse, etwa ‑ Sie haben heute
  darüber gesprochen – bei der Entwicklung von künstlicher Intelligenz, wo wir uns
  auf das Design offener Innovationsökosysteme, den Zugang zu Kapital, Daten- und
  Rechenleistung und eben den Wettbewerbern zwischen den Anbietern konzentrieren.
  Es gibt in dieser neuen geopolitischen Welt allerdings auch – das sei hinzugefügt –
  neue Aufgaben für den Staat. Wir lernen etwa in diesen Zeiten, dass der technologische
  Fortschritt, den wir ja alle, hoffentlich jedenfalls, wollen, von Voraussetzungen
  abhängt, die wir selbst besser garantieren müssen. Ich rede etwa von kritischen
  Rohstoffen – ohne kritische Rohstoffe keine Batterien, keine leistungsfähigen Elektromotoren,
  keine modernen Halbleiter und keine der anderen zahlreichen Technologien, auf die
  unsere Volkswirtschaften künftig angewiesen sein werden, auf die wir eigentlich
  heute schon angewiesen sind. Wir gehen heute erhebliche Risiken ein, weil sich Rohstoffgewinnung
  und Rohstoffverarbeitung auf sehr wenige Länder konzentrieren. Diese Risiken abzubauen,
  dabei muss, wie ich finde, der Staat helfen. Er muss helfen, Bezugsquellen zu diversifizieren,
  Recycling und Kreislaufwirtschaft, so wie wir es in Deutschland nennen und praktizieren,
  zu stärken und ‑ das schlage ich gerade sehr konkret vor – in Brüssel auf europäischer
  Ebene Vorräte aufzubauen. Meine Damen und Herren, ich bin damit an einem zweiten
  wichtigen Punkt: Der freie Handel steht, wie wir alle wissen, massiv unter Druck.
  Er steht unter Druck wie lange nicht mehr. Das muss ich hier in diesem Kreis vermutlich
  nicht ausführen. Aber auch hier wächst, wie meist in der Gefahr, auch das Rettende,
  wie wir alle von Hölderlin wissen. Auf EU -Ebene und auch bilateral haben wir in
  den vergangenen Monaten unsere Handelsbeziehungen weltweit – Jens Weidmann wird
  das aus seiner Zeit im Bundeskanzleramt bestätigen – in einem Maß ausgebaut, das
  wirklich spektakulär ist, und wir setzen das fort. Wir setzen mit vielen alten und
  vielen neuen Partnern dem neuen Geist, dem Zeitgeist der Abschottung, Freiheit und
  Offenheit gegenüber. Wir haben den Glauben an die große Idee offener und freier
  Märkte nicht aufgegeben. Im Gegenteil: Wir werden nicht nachlassen, weil wir eben
  mit Hayek wissen, dass nur dies Chancen für Wohlstand für möglichst viele ermöglicht.
  Wo wir gegen unfaire Handelspraktiken vorgehen müssen, da gehen wir gegen unfaire
  Handelspraktiken auf europäischer Ebene vor. Wir entwickeln neue Schutzinstrumente.
  Aber auch das, damit kein Missverständnis entsteht, ist kein Schutz vor Wettbewerb.
  Wir brauchen Wettbewerb, denn ohne Wettbewerb gibt es keine Innovation; und Wettbewerb
  brauchen wir in Deutschland, auch in Europa, allemal nicht zu fürchten. Unsere – so
  verstehen wir es – präventiven Schutzinstrumente dienen vielmehr der Verteidigung
  fairer Regeln auf den globalen Märkten. Meine Damen und Herren, auch dies sei deutlich
  gesagt: Wo die europäische Diskussion in der Gefahr steht, in die Richtung von zu
  viel Abschirmung zu gehen – wie schon bei solchen Regeln, die wir jetzt „Made in
  Europe“ nennen und wie sie etwa unser großer westlicher Nachbar immer wieder befürwortet
  hat –, da bremse ich ganz im Geiste Hayeks. Lassen Sie mich ein zweites Beispiel
  nennen: Es hat in der Energiepolitik viel zu lange eine Abschirmung vom Wettbewerb
  gegeben. Deshalb fahren wir diese Abschirmung jetzt zurück. Entsprechend heftig
  ist hier auch der Widerstand. Es besteht immer die Gefahr, dass eine irgendwann
  am Beginn einer technologischen Entwicklung eingeführte Unterstützung ‑ wir nennen
  es Subvention – einfach nicht mehr wegzukriegen ist. Aber, meine Damen und Herren,
  wir gehen das jetzt an, auch gegen zahlreiche Widerstände. Und auch hier gilt es
  ein Missverständnis zu vermeiden: Das ist nicht das Ende der sogenannten Energiewende,
  wie manche uns vorwerfen. Es ist vielmehr die einzige Möglichkeit, die ökonomischen
  und die ökologischen Ziele zu erreichen, bevor eine demokratische Mehrheit die Ziele
  wegen Unbezahlbarkeit einfach hinwegfegt. Deshalb haben wir mit der Novelle des
  Erneuerbare-Energien-Gesetzes und dem dazugehörigen Netzpaket eine längst erfolgreiche
  Branche mehr Wettbewerb ausgesetzt. Dann ist es nicht mehr risikofrei, in erneuerbare
  Energien zu investieren. Das soll es auch gar nicht sein; denn erst wenn diese Risikofreiheit
  endet, wird dort investiert werden, wo der Strom auch wirklich gebraucht wird. Oder
  es wird so investiert werden, dass der Strom zu wirtschaftlichen Bedingungen genutzt
  werden kann. Neue Wind- und Solaranlagen beteiligen wir in besonders überlasteten
  Netzgebieten eben an dem Risiko, dass ihr Strom, dass ihr Produkt zu bestimmten
  Zeiten nicht vollständig gebraucht wird. Im Übrigen: Auch die Dachsolarförderung
  ändern wir so, dass sich Investitionen in Zukunft stärker an Marktpreisen, den Möglichkeiten
  des Eigenverbrauchs, der Speicherung und der flexiblen Einspeisung orientieren.
  Um es einmal ganz einfach zu sagen: Wir wollen als Verbraucherinnen und Verbraucher
  in Zukunft nur noch den Strom bezahlen, den wir auch tatsächlich verbrauchen. All
  das ist unverzichtbar, meine Damen und Herren, damit uns der Wettbewerb als Entdeckungsverfahren
  auch hier und gerade in diesem technologischen Sektor voranbringen kann. Ich komme
  noch einmal jedenfalls gedanklich mit Ihnen zusammen auf Berlin zurück: Hayek hat
  uns im Übrigen auch sehr gute Argumente gegen Enteignungen und Preisinterventionen
  an die Hand gegeben. Er hat die unerwünschten Nebenwirkungen scheinbar sozialer
  Interventionen gerade anhand des Wohnungsmarkts aufgezeigt ‑ und das vor genau 100 Jahren
  gegen die Mietpreisinterventionen im damals „Roten Wien“. Ich muss die Parallele
  hier nicht noch einmal aussprechen ‑ Geschichte wiederholt sich eben leider doch
  hin und wieder. Meine Damen und Herren, die Argumente für eine freiheitliche Marktordnung
  mit ihren Chancen und eben Risiken müssen immer wieder neu vorgetragen werden. Zu
  viele haben Zweifel daran, dass von Eigentum und auch von Reichtum in unserer freien
  und offenen Gesellschaft wirklich alle profitieren. Aber es bleibt eben trotzdem
  richtig. Mit dem, was manche übrighaben, und auf der Grundlage dessen, was viele
  besitzen, werden auch Dinge finanziert, die andere nicht finanzieren, werden Wege
  eingeschlagen, die andere nicht einschlagen. Diese Dinge und Wege kann nicht einfach
  der Staat finanzieren und einschlagen, weil der Staat es eben nicht besser weiß
  als die vielen da draußen in ihrem spontanen und ununterbrochen aufeinander reagierenden
  Handeln ‑ einem Handeln, das eben nicht auf planerische Begriffe zu bringen ist.
  Hayek hat einmal geschrieben – und das ist ein interessantes Zitat ‑: „Ich für meinen
  Teil würde sicherlich lieber ohne Eigentum in einem Land leben, in dem viele andere
  etwas besitzen, als dort leben zu müssen, wo alles Eigentum ‚Kollektiveigentum‘
  ist – und von der Staatsgewalt bestimmten Verwendungen zugewiesen wird.“ Was man
  in unserer Gesellschaft allerdings braucht, um diese Einsichten auch auszuhalten,
  das ist eine gewisse Großzügigkeit im Miteinander von Bürgerinnen und Bürgern, die
  ihre politische und wirtschaftliche Ordnung grundsätzlich bejahen und schätzen.
  In unserem Land scheint eine solche Großzügigkeit, meine Damen und Herren, langsam
  doch verloren zu gehen. Ohne dieses Grundwohlwollen kann aber die liberale Demokratie
  nicht überleben. Die Zweifel an Gerechtigkeit und Zukunftschancen, die in dieser
  Ordnung entstanden sind, gerade auch – wir erleben es in diesen Tagen – in der jungen
  Generation, müssen wir ernst nehmen. Und um diese Zweifel auszuräumen, gehen wir
  den politisch mühsamen Weg von Reformen. Zugleich bleibt aber wahr: Es gibt den
  Taschenrechner nicht, der uns absolute Gerechtigkeit vorrechnen könnte. Wir sind
  als Bürgerinnen und Bürger nicht Konkurrenten im Nutzen von Vorteilen oder im eifersüchtigen
  Vermeiden von Nachteilen, auch wenn es einige so zu sehen scheinen. Wir müssen neu
  lernen, uns gemeinsam zu freuen über die Leistungskraft unserer freien und offenen
  Gesellschaft, in der jeder seine Ziele verfolgen kann und die genau deshalb die
  besten Ergebnisse für alle hervorbringt, wenn auch nicht für jeden Einzelnen zu
  jeder Zeit. Weil es so schwer ist, meine Damen und Herren, Letzteres auszuhalten,
  verfallen Gesellschaften eben immer wieder in die Hybris des Planens und Steuerns.
  Aber genau das ist eben die Anmaßung von Wissen – „Pretence of Knowledge“. Sie alle
  hier wissen es: Das war der Titel von Hayeks berühmter Rede zur Verleihung des Nobelpreises
  für Wirtschaftswissenschaften im Jahr 1974 in Stockholm. Ich arbeite dafür, dass
  wir gerade diese Einsicht in der deutschen und in der europäischen Wirtschaftspolitik
  wieder beherzigen. Meine Damen und Herren, das wichtigste Beispiel in diesem Zusammenhang
  ist ein Wort, das eher als politische Sprachhülse verhöhnt wurde, das ich aber in
  diesem Zusammenhang besonders ernst nehme. Das ist das Wort der Technologieoffenheit.
  Gerade in der Energie- und Klimapolitik sind uns Hayeks Orientierungen und Einsichten
  wegweisend, von den Technologien der Energieerzeugung bis hin zur Abkehr vom Verbrenner-Aus.
  Wir setzen mit Hayek auf Preissignale und in diesem Zusammenhang auf die Preissignale
  des europäischen Emissionshandels statt auf Verbote. Sozialismus kann das nicht.
  Ein Sozialismus des Planens und Steuerns muss scheitern, weil zentral eben nicht
  so viel gewusst werden kann wie von allen Einzelnen, verstreut im ganzen Land und
  dezentral. Eine freiheitliche Ordnung ist einer zentral gelenkten Wirtschaft eben
  immer und auf Dauer überlegen. Hayek hat dieses notwendige Scheitern aller planwirtschaftlichen
  Systeme lange vorhergesagt, und er hat den Moment des Jahres 1989 noch erlebt. Hayek,
  meine Damen und Herren, steht sozusagen auch in unserer Agenda zum Rückbau der Bürokratie.
  Schnellere Genehmigungen, digitale Verwaltung und innovationsfreundliche Regulierung,
  da geschieht unter der Federführung ‑ ich erlaube mir das zu sagen ‑ des sehr erfolgreichen
  Kabinettskollegen Karsten Wildberger in Deutschland so viel wie seit Jahrzehnten
  nicht. Wir wollen eben Möglichkeitsräume für freies Handeln weiten, wieder im Hayek’schen
  Vertrauen auf die innovative Kraft des verteilten Wissens und des freien Aufeinandertreffens.
  Kein Einzelner könnte all die Informationen über Tatsachen und Umstände sammeln,
  die es bräuchte, um einen vergleichbaren Fortschritt zu erreichen. Deshalb ist das
  natürlich eine sehr glückliche Entscheidung, lieber Jimmy Wales, den Publizistikpreis
  der Hayek-Stiftung heute Ihnen zuzuerkennen. Sie haben mit Wikipedia ein sehr gutes
  Beispiel dafür gegeben, wie aus den freien Beiträgen vieler Menschen, Millionen
  von Menschen, eine spontane Ordnung entsteht, die niemand zentral entwerfen könnte.
  Meine Damen und Herren, mich inspiriert bis heute der Mut von Friedrich August von
  Hayek, der Mut, die Freiheit der miteinander im Wechselspiel Handelnden sehr weitgehend
  einfach wirken zu lassen, bevor man sozial abfedert und stützt. Dass der Staat sozial
  abfedert und stützt, das gehörte im Übrigen auch für Hayek dazu und ist mir in seinem
  Denken auch deshalb wertvoll. Und noch mehr: Hayek fordert eine Politik, die jedem
  Chancen gibt, seine Ziele zu verfolgen. Denn genau so hat Hayek Freiheit definiert,
  als einen „Zustand, in dem jeder sein Wissen für seine Zwecke gebrauchen kann“.
  Jene Chancen also erhöhen sich durch Bildung ‑ bei uns, wie Sie alle wissen, Ländersache ‑
  und durch eine Politik für Arbeitschancen. Deshalb gibt es die arbeitsmarktpolitischen
  Reformen, die schon in Kraft sind und die wir darüber hinaus verabredet haben. Sie
  sollen Arbeit attraktiver machen. Die Stichworte kennen Sie: Aktivrente, Arbeitsanreize
  in der neuen Grundsicherung, Stabilisierung der Lohnnebenkosten, steuerliche Entlastung,
  Flexibilisierung des Arbeitsmarktes für eine Erleichterung von Einstellungen. Lassen
  Sie mich in diesem Zusammenhang noch einmal Hayek zitieren: „Das Wichtigste unter
  den öffentlichen Gütern, für die eine Regierung erforderlich ist, ist [...] nicht
  die direkte Befriedigung irgendwelcher besonderer Bedürfnisse, sondern die Sicherung
  der Bedingungen, unter denen die Individuen und kleineren Gruppen günstige Gelegenheiten
  finden, wechselseitig für die Befriedigung ihrer jeweiligen Bedürfnisse zu sorgen.“
  Meine Damen und Herren, wir haben – ein letzter Gedanke von mir ‑ mit unserer sozialen
  Marktwirtschaft seit Ludwig Erhard eine Wirtschaftsordnung, in der der Staat vielleicht
  immer in der Gefahr ist, mehr zu intervenieren, als Hayek das für richtig gehalten
  hat. Das einzuräumen, gehört zur politischen und intellektuellen Redlichkeit natürlich
  dazu, gerade für mich, der eine durchaus nicht ganz einfache Koalition aus Union
  und SPD zusammenhalten muss. Aber, meine Damen und Herren, Hayek hat sich selbst
  ja auch keine Illusionen über die politischen Widerstände gemacht, die seinen Auffassungen
  gerade in krisenhaften Zeiten begegnen mussten und bis heute begegnen müssen. Aber
  ich hoffe, Sie sehen in mir das Bestreben, auch von mir ganz persönlich, unser Land
  auf diesem grundsätzlich richtigen Kurs zu halten. Ich will einen Staat, der eine
  Wirtschaftsverfassung der Freiheit und des Wettbewerbs sichert. Diesem Ziel dient
  eine Ordnungspolitik, eben im Respekt vor den Kräften des Marktes, vor den Kräften
  vieler Tausender, vieler Millionen Verbraucherinnen und Verbraucher. Sie alle kennen
  das Zitat; Ludwig Erhard hat es oft gesagt: Marktwirtschaft ist das, was den Verbrauchern
  dient. Meine Damen und Herren, in diesem Sinne verdanken wir Hayek bis heute sehr
  viel. Wir verdanken ihm vor allen Dingen den Gedanken der gelebten Freiheit, die
  uns Menschen innewohnt. Denken mit Hayek, meine Damen und Herren, ist und bleibt
  eben auch heute, in Zeiten großer geopolitischer Herausforderungen und mancher innenpolitischer
  Spannungen, geradezu ein intellektuelles Vergnügen. Aber lassen wir es nicht bei
  dem Vergnügen. Unternehmen wir möglichst viel, damit sich der Gedanke der Freiheit
  in unserer Gesellschaft nicht verflüchtigt.'
