title: Im Kabinett beschlossen Regeln zum Kindschaftsrecht werden modernisiert
text: 'Kinder sollen zukünftig stärker in Entscheidungen über Sorge- und Umgangsrecht
  einbezogen werden. Foto: ullstein bild - Westend61 / Kniel Synnatzschke Das Kabinett
  hat einen Entwurf zur Reform des Kindschaftsrechts beschlossen, der eine systematische
  Neustrukturierung der gesetzlichen Regelungen vorsieht. Das Kindeswohl soll an den
  Anfang der Vorschriften zum Sorgerecht gestellt und klarer ausgestaltet werden.
  Es ist der entscheidende Maßstab für die Eltern und die Ausübung der Elternverantwortung.
  Bei h ä uslicher Gewalt gegen den anderen Elternteil soll der Umgang mit dem Kind
  ausgeschlossen werden k ö nnen. Der Gesetzentwurf stellt klar, dass das Kindeswohl
  nicht nur den Schutz vor direkter Gewalt gegen das Kind umfasst, sondern auch den
  Schutz vor miterlebter Gewalt. Denn häusliche Gewalt betrifft nicht nur die unmittelbar
  angegriffene Person, sondern kann auch für die Kinder eine erhebliche Belastung
  darstellen. In diesen Fällen soll nicht die gesetzliche Vermutung greifen, wonach
  der Umgang des Kindes mit beiden Elternteilen in der Regel dem Wohl des Kindes dient.
  Ein zweites wesentliches Anliegen des Regierungsentwurfs ist es, die Rechtsposition
  von Kindern zu stärken. Kinder sollen ihrem Alter und ihrer Entwicklung entsprechend
  stärker in Entscheidungen einbezogen werden, die ihr Leben betreffen. So sollen
  zum Beispiel Kinder ab 14 Jahren ü ber Sorgeerkl ä rungen mitbestimmen können. Die
  verschiedenen Aspekte des Kindeswohls sollen zukünftig ausdrücklich benannt werden.
  Damit erhalten Eltern, Gerichte und andere Beteiligte eine klarere Orientierung
  bei Entscheidungen über Sorge und Umgang. Dazu gehören insbesondere die körperliche
  und seelische Unversehrtheit eines Kindes, seine angemessene Versorgung und die
  Wertschätzung seiner individuellen Persönlichkeit. Weitere Änderungen betreffen
  unter anderem das Sorgerecht für Eltern, die nicht miteinander verheiratet sind.
  Nach bisheriger Rechtslage erhält in solchen Fällen grundsätzlich zunächst die Mutter
  das alleinige Sorgerecht. Für ein gemeinsames Sorgerecht müssen in der Regel beide
  Elternteile übereinstimmende Sorgeerklärungen abgeben, die öffentlich beurkundet
  werden. Künftig soll die übereinstimmende Anerkennung der Vaterschaft auch zum gemeinsamen
  Sorgerecht für Mutter und Vater führen, sofern kein Elternteil widerspricht.'
