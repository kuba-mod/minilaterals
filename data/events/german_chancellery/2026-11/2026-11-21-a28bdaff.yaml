title: Erklärung von Bundeskanzler Friedrich Merz zum Mehrjährigen Finanzrahmen 2028-2034
text: 'Seit Beginn der Verhandlungen vor mehr als einem Jahr setzt sich Deutschland
  für einen modernisierten, realistischen und bezahlbaren Haushalt für die Europäische
  Union ein. Es liegt in unserer gemeinsamen Verantwortung, hierfür jetzt die Weichen
  zu stellen. Für ein handlungsfähiges Europa, nach innen wie nach außen. Der nächste
  Mehrjährige Finanzrahmen wird das Fundament sein, auf dem die EU als souveräner
  globaler Akteur handlungsfähig in einer zunehmend unsicheren und komplexen Welt
  steht. Der neue Mehrjährige Finanzrahmen muss unsere Prioritäten spiegeln: Wir wollen
  die Wettbewerbsfähigkeit und die Sicherheits- und Verteidigungsfähigkeit stärken.
  Grundlage dieser Stärke ist die Rechtsstaatlichkeit, an der sich alles bemisst.
  Mein Dank gilt dem Präsidenten des Europäischen Rates, dass er diese komplexen und
  herausfordernden Verhandlungen mit Pragmatismus und Engagement auf einen Abschluss
  noch in 2026 zusteuert. Der jetzt vorliegende Vorschlag ist ein erster Schritt,
  das Volumen ist aber weiterhin zu hoch. Praktisch alle Mitgliedstaaten stehen vor
  der Herausforderung, ihre Haushalte zu konsolidieren. Ein EU-Haushalt, der gleichzeitig
  über 40 Prozent wächst, passt nicht in diese Zeit. Die Ungleichgewichte im EU-Haushalt
  drohen sich gleichzeitig noch zu verschärfen. Eine gerechte und faire Lastenteilung
  ist auch nur durch Korrekturen auf der Einnahmeseite zu erreichen. Die Verantwortung
  für die Sicherheit in Europa obliegt den Europäern gemeinsam und ist eine solidarische
  Aufgabe, die wir zusammen tragen müssen. Der MFR muss eine robuste und nachhaltige
  mehrjährige Unterstützung der Ukraine sicherstellen unter Beteiligung aller 27 Mitgliedstaaten.
  Ich bin bereit, an einem realistischen und bezahlbaren EU-Haushalt mitzuwirken.
  Ein Abschluss in 2026 ist im Interesse von uns allen in Europa. Statement by Chancellor
  Friedrich Merz on the Multiannual Financial Framework 2028–2034 Since the beginning
  of the negotiations more than a year ago, Germany has been advocating a modernised,
  realistic and affordable budget for the European Union. It is our shared responsibility
  to make the right choices now. To ensure that Europe is capable of taking effective
  action, both at home and internationally. The next Multiannual Financial Framework
  will provide the foundation for the EU to act as a sovereign global player in an
  increasingly uncertain and complex world. The new Multiannual Financial Framework
  must reflect our priorities: We want to strengthen competitiveness as well as our
  security and defence capabilities. The foundation of this strength is the rule of
  law, which must remain the benchmark for everything we do. I would like to thank
  the President of the European Council for his pragmatism and commitment in steering
  these complex and challenging negotiations towards a conclusion before the end of
  2026. The proposal now on the table is a first step, but its overall size remains
  too high. Virtually all Member States face the challenge of consolidating their
  public finances. An EU budget that grows by more than 40% at the same time is simply
  out of step with today''s realities. At the same time, existing imbalances within
  the EU budget risk becoming even more pronounced. A just and fair burden-sharing
  arrangement can only be achieved through corrections on the revenue side. Responsibility
  for Europe''s security rests with Europeans collectively. It is a matter of solidarity,
  and a responsibility we must shoulder together. The MFF must ensure robust, sustainable
  and multiannual support for Ukraine, with all 27 Member States contributing. I stand
  ready to work towards a realistic and affordable EU budget. Reaching an agreement
  in 2026 is in the interest of all of us in Europe.'
