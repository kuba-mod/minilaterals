title: 'Verschollenes Le Brun-Meisterwerk kehrt nach über 80 Jahren nach Sanssouci
  zurück – Staatsminister Weimer: „Diese Rückkehr ist eine kulturhistorische Sensation“'
text: 'Ein verloren geglaubtes Meisterwerk ist zurück in Potsdam. Charles Le Bruns
  Gemälde „Heilige Familie“ ist nach mehr als 80 Jahren an seinen historischen Platz
  im Neuen Palais zurückgekehrt. Das Werk des französischen Barockmalers und Hofmalers
  Ludwigs XIV. war nach dem Zweiten Weltkrieg aus den preußischen Sammlungen verschwunden
  und befand sich zuletzt in Kanada. Am heutigen Mittwoch wurde das Gemälde in Anwesenheit
  von Kulturstaatsminister Dr. Wolfram Weimer von der Stiftung Preußische Schlösser
  und Gärten Berlin-Brandenburg (SPSG) in Empfang genommen. Unterstützt wurde die
  Rückkehr des Gemäldes von der Ernst von Siemens Kunststiftung und der Freunde der
  Preußischen Schlösser und Gärten. Dazu Staatsminister Weimer: „Es ist eine kulturhistorische
  Sensation, dass ein verloren geglaubtes Meisterwerk nach Potsdam zurückkehrt. Charles
  Le Bruns ,Heilige Familie‘ ist nach 80 Jahren wieder an ihrem historischen Ort im
  Neuen Palais und kann von Besucherinnen und Besuchern bestaunt werden. Das Gemälde
  ist nicht nur ein bedeutendes Zeugnis französischer Barockmalerei, sondern auch
  eng mit der Geschichte der königlich preußischen Sammlungen verbunden. Diese außergewöhnliche
  Rückkehr ist ein großer Gewinn für unser kulturelles Erbe. Mein Dank gilt insbesondere
  der Ernst von Siemens Kunststiftung und den Freunden der Preußischen Schlösser und
  Gärten, die das möglich gemacht haben.“ Das Gemälde gehörte zu den wichtigsten Ankäufen
  des preußischen Königs Friedrichs des Großen für das neu erbaute Neue Palais in
  Potsdam. Während des Zweiten Weltkriegs wurde es 1942 in das Schloss Rheinsberg
  ausgelagert, wo es sich bis zum 30. Juli 1945 nachweisen lässt. Danach verlor sich
  seine Spur. Erst Jahrzehnte später tauchte das Werk wieder auf, als sich 2021 der
  damalige kanadische Besitzer an die SPSG wandte. Die Rückkehr der „Heiligen Familie“
  steht zugleich für das Engagement des Bundes bei der Bewahrung und Rückführung von
  Kulturgut. Der Bund ist größter Zuwendungsgeber der SPSG und hat die Stiftung wiederholt
  bei der Rückführung insbesondere kriegsbedingt abhandengekommener Sammlungsobjekte
  unterstützt. I Im Jahr 2026 erhält die SPSG vom Bund eine institutionelle Förderung
  von bis zu 21,6 Millionen Euro. Hinzu kommen im Rahmen des Sonderinvestitionsprogramms
  2 (SIP 2) Mittel von bis zu rund 17,74 Millionen Euro. Weitere Zuwendungsgeber der
  SPSG sind die Länder Berlin und Brandenburg.'
