title: Rede von Bundeskanzler Merz anlässlich der Übergabe des Weihnachtsbaumes der
  Arbeitsgemeinschaft Deutscher Waldbesitzerverbände e. V.
text: 'Zu allererst: Liebe Kinder, herzlich willkommen im Ehrenhof des Bundeskanzleramts!
  Schön, dass ihr heute dabei seid. Ich habe euch eben schon gehört. Ich habe dort
  oben in der Ecke mein Büro. Da habe ich euch eben schon gehört, als ihr euch eingesungen
  habt. Herzlichen Dank, dass ihr da seid, und einen Beifall von allen, die uns heute
  Abend hier begleiten! Aber auch alle anderen Mitwirkenden der Musikschule City West
  vielen Dank für den musikalischen Auftritt und die Einstimmung! Herr Professor Bitter
  als Präsident der Arbeitsgemeinschaft Deutscher Waldbesitzerverbände, wie schon
  im vergangenen Jahr, Frau Heinen-Esser für die Schutzgemeinschaft Deutscher Wald,
  Herr Cellerar Pater Lukas vom Kloster Scheyern, Graf von der Schulenburg-Wolfsburg
  als Vorstand der Familienbetriebe Land und Forst, Kollege Christian Haase aus dem
  Deutschen Bundestag für den Deutschen Forstwirtschaftsrat, Herr Breitsameter als
  Präsident des Bayerischen Waldbesitzerverbands, Kollege Christian Moser für den
  Wahlkreis Freising, meine Damen und Herren, herzlich willkommen von meiner Seite
  Ihnen allen im Bundeskanzleramt! Liebe Kinder, ihr habt gerade gesungen: „Dicke
  rote Kerzen, Tannenzweigenduft, und ein Hauch von Heimlichkeiten liegt jetzt in
  der Luft. Und das Herz wird weit, macht euch jetzt bereit, bis Weihnachten, bis
  Weihnachten ist nicht mehr weit.“ So habt ihr es zu unserer Einstimmung gerade gesungen.
  Ganz herzlichen Dank dafür, dass ihr das gesungen habt! Es ist in der Tat „bis Weihnachten
  ist nicht mehr weit.“ Wenn ich euch, liebe Kinder, bei eurem Lied zuhöre und diese
  wirklich prächtige Tanne in unserem Hintergrund sehe, die Weißtanne, dann habe ich
  auch das Gefühl, bis Weihnachten ist es in der Tat nicht mehr weit. m Sonntag ist
  der erste Advent. Dann sind es nur noch vier Wochen bis zum Heiligen Abend. Diese
  Zeit wird für uns alle im Flug vergehen. Die Vorweihnachtszeit ist ab jetzt im Bundeskanzleramt
  hier im Regierungsviertel auch sichtbar. Es ist gute Tradition, dass dieser Baum
  hier steht und ab jetzt mitten im Regierungsviertel ein bisschen Weihnachtsstimmung
  verbreitet. Die Kanzlertanne, im vergangenen Jahr aus meiner Heimat, aus Südwestfalen,
  stammt in diesem Jahr aus Bayern, aus dem Forst des Klosters Scheyern, das gerade
  ein atemberaubendes Jubiläum in diesem Jahr feiert. Das Kloster Scheyern wurde vor
  950 Jahren gegründet. Herzlichen Glückwunsch zu diesem großartigen Jubiläum, und
  herzlichen Dank, Pater Lukas, dass Sie uns diese schöne und hochgewachsene Tanne
  in diesem Jahr zur Verfügung stellen. Herzlichen Dank dafür. Ich möchte auch allen
  denjenigen danken, die es ermöglicht haben, dass die Kanzlertanne bei uns die Weihnachtszeit
  einläutet. Das sind insbesondere die Arbeitsgemeinschaft Deutscher Waldbesitzerverbände,
  der Bayerische Waldbesitzerverband und die Firma Dominik Transporte, die den Baum
  auf langer Fahrt wohlbehalten hierhergebracht hat. Herzlichen Dank dafür! Diese
  weit gereiste Kanzlertanne ist in Begleitung von zwei ganz besonderen Gästen zu
  uns gekommen. Liebe Kinder, ihr habt die beiden Waldhoheiten mit den Kronen schon
  entdeckt. Wir haben heute die bayerische Waldkönigin und die bayerische Waldprinzessin
  unter uns. Herzlichen Dank, dass Sie dabei sind und dass Sie diese Tradition heute
  auch nach Berlin tragen! Sie sind Botschafterinnen des Waldes an einem ganz besonderen
  Ort. Für euch Kinder ist der Wald ein Ort zum Toben und zum Entdecken. Für die Erwachsenen,
  auch für mich, ist der Wald ein Ort, um sich zu erholen, um Sport zu treiben, um
  durchzuatmen. Für Kinder und Erwachsene ist der Wald der Ort, in dem viele unserer
  Geschichten und auch viele unserer Märchen spielen, die wir gern lesen und die wir
  als Kinder, auch wenn wir heute erwachsen sind, gern vorgelesen bekommen haben.
  Natürlich ist der Wald Lebensraum für zahlreiche Tiere und Pflanzen. Wald ist unverzichtbar
  für unsere Umwelt. Er liefert uns wertvolle, nachwachsende Rohstoffe. Das alles
  wissen die Vertreterinnen und Vertreter der Forst- und Waldwirtschaft. Das wissen
  auch die Waldhoheiten. Aber, meine Damen und Herren, viele wissen es nicht: Für
  Waldbesitzerfamilien ist der Wald tägliche, harte Arbeit. Denn dazu gehören rund
  eine Million Menschen in Deutschland, die in der Holzwirtschaft und in der Forstwirtschaft
  tätig sind. Auch dafür ein herzliches Wort des Dankes, denn Sie alle tragen dazu
  bei, dass der Wald so ist, wie er ist, und dass er auch als Erholungsort für uns
  in Deutschland nach wie vor so wertvoll ist. Viele werden es nicht wissen ‑ Sie
  wissen es natürlich; ich weiß es auch ‑ , aber ein Drittel unserer Landesfläche
  in Deutschland ist mit Wald bedeckt. Es gibt kein zweites Land in der Europäischen
  Union, das das von sich sagen kann. Ein Drittel unserer Fläche, das ist mehr als
  in allen anderen Ländern der Europäischen Union. Deswegen sollten wir den Wald schützen.
  Wir sollten ihn behüten. Wir sollten ihn schätzen als das, was er ist: Lebensraum
  für Tiere und Pflanzen, Wirtschaftsraum für viele Familien, aber eben auch Erholungsraum
  für viele Menschen in Deutschland, die den Wald jedes Wochenende so wie ich zu schätzen
  wissen und sich auch im Wald gern erholen. Noch einmal herzlichen Dank, dass Sie
  alle da sind. Herzlichen Dank, dass diese prächtige Tanne den Weg in das Kanzleramt
  gefunden hat. Herzlichen Dank an euch alle, dass ihr uns heute Abend musikalisch
  so schön begleitet. Ich wünsche euch, dass ihr das in den nächsten vier Wochen bei
  anderen Gelegenheiten auch tun könnt, ganz sicher in der Schule, aber auch in der
  Nachbarschaft bei anderen Gelegenheiten. Euch Kindern wünsche ich wie uns allen
  eine schöne Adventszeit, eine gute Weihnachtszeit. Danke für euer Kommen. Bleibt
  gesund und geht fröhlich in das neue Jahr 2027. Wenn ihr mögt, dann seid ihr schon
  jetzt eingeladen, im nächsten Jahr wieder hier zu sein. Herzlichen Dank euch allen.
  Danke, dass ihr da seid. Ihnen auch herzlichen Dank für die Leitung des Chores.
  Ganz herzlichen Dank!'
