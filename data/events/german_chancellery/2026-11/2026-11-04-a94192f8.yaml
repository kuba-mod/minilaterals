title: Im Kabinett beschlossen Wohnungsanmeldung künftig überall per Klick
text: 'Ab Ende des Jahres soll der Online-Dienst zum Wohnungsan- und ummelden bundesweit
  angeboten werden. Die Wohnung an- und ummelden geht bald bequem online vom Sofa
  aus: Das Kabinett hat im Rahmen der Umsetzung der föderalen Modernisierungsagenda
  ein bundesweites Online-Angebot zur Wohnsitzanmeldung beschlossen. Die IT -Komponentenverordnung
  sieht vor, dass zukünftig bundesweit alle Meldebehörden die elektronische Wohnsitzanmeldung
  anbieten. Damit schafft die Bundesregierung die Grundlage, den bereits vielfach
  verfügbaren Onlinedienst flächendeckend zur Verfügung zu stellen. Inhaltlich geht
  es um die am häufigsten genutzte Verwaltungsleistung: Mit Hilfe des Onlinedienstes
  kann die An- und Ummeldung einer Haupt- oder alleinigen Wohnung unter wohnsitzanmeldung.gov.de
  vollständig digital von zu Hause erledigt werden. Ziel ist den Aufwand für Bürgerinnen
  und Bürger sowie die Verwaltung erheblich zu verringern. Die IT -Komponentenverordnung
  s oll voraussichtlich am 1. Dezember 2026 in Kraft treten. „Mit der IT -Komponentenverordnung
  machen wir die elektronische Wohnsitzanmeldung zum verbindlichen Standard in ganz
  Deutschland. Damit verabschieden wir uns vom Flickenteppich. Egal ob in der Großstadt
  oder auf dem Land – künftig kann sich jeder Bürger seinen Wohnsitz online anmelden,
  ohne das Haus zu verlassen. Das ist ein echter Durchbruch für die digitale Verwaltung,
  die den Menschen dient“, sagte Bundesminister für Digitales und Staatsmodernisierung,
  Karsten Wildberger, zum Beschluss im Kabinett. Die Neuregelung leistet damit einen
  wichtigen Beitrag zur Staatsmodernisierung. Bund und Länder haben sich das Ziel
  gesetzt, sämtliche Verwaltungsleistungen für alle Bürgerinnen und Bürger digital
  anzubieten und arbeiten dafür gemeinsam an digitalen Lösungen. Ziel ist eine bundesweite
  funktionierende digitale Verwaltung in Deutschland. Der Onlinedienst für die elektronische
  Wohnungsanmeldung (kurz: eWA) wurde von der Freien und Hansestadt Hamburg nach dem
  Grundsatz „Einer für Alle“ entwickelt und allen Ländern zur Verfügung gestellt.
  Föderale Modernisierungsagenda: Deutschland soll schneller, digitaler und handlungsfähiger
  werden, zum Wohle von Bürgerinnen und Bürgern, Wirtschaft und Verwaltung. Um dieses
  Ziel zu erreichen, haben der Bundeskanzler sowie die Regierungschefinnen und -chefs
  der Länder im Dezember 2025 die Föderale Modernisierungsagenda verabschiedet. Die
  eingeleiteten Modernisierungsmaßnahmen wirken bereits: alle 60 vereinbarten, kurzfristigen
  Maßnahmen befinden sich bereits in der Umsetzung, 15 konnten bereits vollständig
  umgesetzt werden. Mehr dazu lesen Sie hier.'
