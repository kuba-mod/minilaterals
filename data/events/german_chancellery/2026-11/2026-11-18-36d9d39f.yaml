title: Im Kabinett beschlossen Für mehr Finanzwissen in Deutschland
text: 'Mit der Finanzbildungsstrategie will die Bundesregierung den Zugang zu Finanzwissen
  und entsprechende Kompetenzen stärken. Überschuldung, Umgang mit digitalen Finanzdienstleistungen
  oder Investieren in Aktien und ETFs . Diese und weitere wichtige Finanzthemen nimmt
  die neue Finanzbildungsstrategie der Bundesregierung in den Blick. Damit will die
  Bundesregierung die Finanzkompetenz von allen Bürgerinnen und Bürgern in Deutschland
  stärken sowie den Zugang zu Finanzwissen verbessern. Bereits 2023 wurde die Initiative
  Finanzielle Bildung ins Leben gerufen, mit dem Ziel, eine nationale Finanzbildungsstrategie
  zu entwickeln. Sie wurde am 18. November 2026 vom Kabinett beschlossen. Die Strategie
  umfasst insgesamt sieben Handlungsfelder, darunter die Themen: Dazu reihen sich
  derzeit 39 Maßnahmen ein, die im Fokus der Finanzbildungsstrategie stehen, darunter
  beispielsweise die digitale Rentenübersicht , Ratgeber „Schuldenfrei im Alter" oder
  Schulbesuche der Deutschen Bundesbank. Hier finden Sie die Finanzbildungsstrategie
  der Bundesregierung mit allen Maßnahmen und Handlungsfeldern. Bei der Finanzbildung
  spielt vor allem auch das Thema Altersvorsorge und Kapitalmarktbeteiligung ein wichtige
  Rolle – also das langfristige Sparen. Deshalb ist es auch ein Handlungsfeld der
  Finanzbildungsstrategie. Zwei konkrete Maßnahmen dafür sind die beiden Altersvorsorgesysteme
  – die Frühstartrente und das Altersvorsorgedepot, die von der Bundesregierung auf
  den Weg gebracht wurden. An einem weiteren Vorhaben arbeitet die Bundesregierung
  derzeit mit Hochdruck: Der Umsetzung der Empfehlungen der Alterssicherungskommission
  und dabei insbesondere die Einführung eines kapitalgedeckten Elements in der gesetzlichen
  Rentenversicherung. Das Bundesfinanzministerium hat zum Thema private Altersvorsorge
  eine Informationskampagne gestartet, unter anderem mit Altersvorsorgerechnern und
  zielgruppenspezifischen Angeboten. Für die Finanzbildungsstrategie soll ab 2027
  eine „Task Force Finanzbildung“ als Steuerungs- und Koordinierungsgremium eingerichtet
  werden. Das Bundesfinanzministerium und die Deutsche Bundesbank werden die gemeinsame
  Leitung übernehmen. Ziel ist, die Strategie gemeinsam mit Bund und Länder umzusetzen
  und fortzuentwickeln. Auf Bundesebene nehmen außerdem das BMBFSFJ , BMJV , BMAS
  , BMWE , Bundesanstalt für Finanzdienstleistungsaufsicht und Deutsche Rentenversicherung
  Bund teil. Auf Länderebene nehmen Vertreterinnen und Vertreter der Finanzministerkonferenz,
  der Kultusministerkonferenz und der Verbraucherschutzministerkonferenz teil.'
