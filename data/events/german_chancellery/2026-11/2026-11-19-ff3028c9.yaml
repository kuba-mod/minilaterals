title: Treffen der „Koalition der Willigen“ in Berlin „Gemeinsam für Frieden in der
  Ukraine und europäische Sicherheit“
text: 'Knapp 40 Delegationen kommen zum Treffen der „Koalition der Willigen“ im Bundeskanzleramt
  zusammen. Wege zu einem gerechten und dauerhaften Frieden für die Ukraine – darum
  soll es bei dem Treffen von Bundeskanzler Friedrich Merz mit hochrangigen Vertreterinnen
  und Vertretern zahlreicher Partnerländer sowie von EU und NATO im Bundeskanzleramt
  gehen. Die Ukraine muss sich weiter auf die gemeinsame Unterstützung verlassen können
  – p olitisch, finanziell und militärisch. Das Gipfeltreffen der sogenannten „Koalition
  der Willigen“ auf Einladung des Bundeskanzlers steht daher unter dem Motto „Gemeinsam
  für Frieden in der Ukraine und europäische Sicherheit“. Erwartet werden dazu Vertreterinnen
  und Vertreter auf Ebene der Staats- und Regierungschefs aus insgesamt 37 Ländern,
  ergänzt um die Spitzen von EU und NATO . Das Treffen reiht sich ein in die fortgesetzten,
  intensiven diplomatischen Bemühungen Deutschlands und seiner Partner der vergangenen
  Wochen und Monate. Es wird erneut gemeinsam mit Frankreich und Großbritannien (E3-Format)
  ausgerichtet – die Ukraine nimmt ebenfalls in herausgehobener Rolle teil. Die Koalition
  der Willigen vereint – unter dem Ko-Vorsitz von Frankreich, Großbritannien und Deutschland
  – fast 40 mehrheitlich europäische Staaten (Albanien, Australien, Belgien, Bulgarien,
  Dänemark, Estland, Griechenland, Finnland, Irland, Island, Italien, Japan, Kanada,
  Kroatien, Lettland, Litauen, Luxemburg, Moldau, Montenegro, Neuseeland, Niederlande,
  Nordmazedonien, Norwegen, Österreich, Polen, Portugal, Rumänien, Schweden, Slowenien,
  Spanien, Tschechien, Türkei, Ukraine, Ungarn und Zypern). Außerdem nehmen an den
  Treffen der Präsident des Europäischen Rates, António Costa , EU -Kommissionspräsidentin
  Ursula von der Leyen, die Hohe Vertreterin der Union für Außen- und Sicherheitspolitik,
  Kaja Kallas, und NATO -Generalsekretär Mark Rutte teil. Das Format besteht seit
  Frühjahr 2025. Die Bundesregierung und ihre Partner halten unverändert Kurs auf
  einen gerechten und dauerhaften Frieden für die Ukraine. Das Treffen dient der engen
  Abstimmung und Unterstützung der Partner für weitere direkte Gespräche zwischen
  Russland und der Ukraine mit aktiver Beteiligung der USA und der Europäer im sogenannten
  „ Team Europa“. Nach dem jüngsten Verhandlungstreffen in Abu Dhabi wird es um die
  Koordinierung der nächsten Schritte gehen. Team Europa: Die Staats- und Regierungschefinnen
  und -chefs der Europäischen Union haben sich am 13. November 2026 in Dublin darauf
  verständigt, dass das europäische Verhandlungsteam für den Frieden in der Ukraine
  aus Vertreterinnen und Vertretern der europäischen Institutionen sowie den E5 –
  Frankreich, Deutschland, Italien, Polen und dem Vereinigten Königreich – besteht.
  Das Team wird in voller Einigkeit und in enger Abstimmung mit allen EU -Mitgliedstaaten
  handeln. Auch im nunmehr fünften Kriegsjahr gibt Russland in seinen Angriffen auf
  die zivile Infrastruktur nicht nach. Angesichts des bevorstehenden Winters muss
  daher insbesondere die Resilienz der Ukraine gestärkt werden. Dies betrifft allen
  voran die Unterstützung im Bereich der militärischen Luftverteidigung, aber auch
  die zivile Unterstützung wie die Energie- und Winterhilfe. Deutschland nimmt als
  größter Unterstützer der Ukraine seine Verantwortung wahr. Die Sicherheit der Ukraine
  ist untrennbar mit der Sicherheit des euroatlantischen Raums verbunden, denn der
  Ausgang des russischen Angriffskrieges wird die europäische Sicherheitsarchitektur
  für lange Zeit maßgeblich prägen. Bei dem Treffen wird es daher auch um die Bekräftigung
  der gemeinsamen Bereitschaft zu robusten und rechtlich bindenden Sicherheitsgarantien
  gehen, die nach einem Waffenstillstand in Kraft treten sollen. Hierzu zählt auch
  eine „ Multinational Force Ukraine “, unter anderem zur Unterstützung der Regeneration
  der ukrainischen Streitkräfte. Diese Sicherheitsgarantien sollen eng mit den USA
  koordiniert werden. Am Freitag, dem Folgetag des Gipfels der „Koalition der Willigen“,
  findet im Haus der Wirtschaft in Berlin das 9. Deutsch-Ukrainische Wirtschaftsforum
  statt. Die Konferenz wird vom Ost-Ausschuss der Deutschen Wirtschaft (OA), der Deutschen
  Industrie- und Handelskammer (DIHK) und der Deutsch-Ukrainischen Industrie- und
  Handelskammer (AHK Ukraine) organisiert. Bundeskanzler Merz wird zur Eröffnung eine
  Rede halten. Das Forum dient dazu, das wirtschaftliche Engagement und bilaterale
  Kooperationen privater Unternehmen strategisch zu vertiefen und steht in diesem
  Jahr unter dem Motto „ Key Sectors. Shared Future “. Im Zentrum stehen wirtschaftliche
  Resilienz, Partnerschaften im Bereich von Hoch- und Zukunftstechnologien, gemeinsame
  Rüstungskooperationen (zum Beispiel bei der Drohnenproduktion) sowie konkrete, privatwirtschaftliche
  Initiativen zum langfristigen und nachhaltigen Wiederaufbau der Ukraine.'
