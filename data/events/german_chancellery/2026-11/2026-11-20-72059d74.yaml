title: 'Bundeskanzler Merz empfängt den Emir von Katar: 15 Milliarden Euro Investitionen
  in Deutschland'
text: Bundeskanzler Friedrich Merz hat heute den Emir von Katar, Scheich Tamim bin
  Hamad Al Thani, anlässlich seines Staatsbesuchs in Deutschland im Bundeskanzleramt
  empfangen. Zentrales Ergebnis des Treffens ist eine gemeinsame Erklärung, in der
  Katar Investitionen in Höhe von 15 Milliarden Euro in Deutschland in den nächsten
  fünf Jahren ankündigt. Mit den Investitionen sollen das Wachstum deutscher Unternehmen
  gefördert und ihre Wettbewerbsfähigkeit auf den globalen Märkten gestärkt werden
  – insbesondere in Schlüsselindustrien und im Rüstungsbereich. Darüber hinaus vereinbarten
  der Bundeskanzler und der Emir weitere Absichtserklärungen und Kooperationen. Deutschland
  und Katar werden bei Sicherheit und Verteidigung enger zusammenarbeiten – mit Kooperationen
  in der Verteidigungsindustrie sowie einem besseren Austausch der Sicherheitsbehörden
  zur Gefahrenabwehr, beispielsweise im Cyberraum. Der Bundeskanzler und der Emir
  betonten die guten Verbindungen beider Länder und den strategischen Wert ihrer Partnerschaft.
  Deutschland und Katar sind fest geeint in der gemeinsamen Überzeugung, die regelbasierte
  internationale Ordnung gegen wachsende Herausforderungen und globale Risiken zu
  verteidigen. Beide bekräftigten ihr Bekenntnis zu Frieden, Sicherheit und wirtschaftlichem
  Wohlstand sowie zur Entwicklung und Nutzung von Zukunftstechnologien. Die gemeinsame
  Erklärung finden Sie hier sowohl in deutscher als auch englischer Sprache. PDF,
  211 KB, barrierefrei
