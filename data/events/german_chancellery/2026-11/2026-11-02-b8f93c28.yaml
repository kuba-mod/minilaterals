date: '2026-11-02'
type: press_release
source_name: german_chancellery
title: FAQ KI als Treiber für Wachstum und Innovationen
text: 'Die Bundesregierung hat das Ziel, Deutschland bis zum Jahr 2030 zu einer starken
  und souveränen KI-Nation zu machen. Unter dem Motto „ Shaping AI: safe, sovereign,
  competitive “ greift der Digital-Gipfel 2026 Schlüsselaspekte der Künstlichen Intelligenz
  auf – von politisch-strategischen Fragen über KI -Anwendung und KI -Sicherheit bis
  hin zur Bildung eines vitalen KI -Ökosystems. Hintergründe zum Bereich der Künstlichen
  Intelligenz finden Sie hier: KI ist mittlerweile aus dem Alltag nicht mehr wegzudenken
  – sei es beim Einsatz von Sprachmodellen und KI -Assistenten, Navigationssystemen
  oder Streaming-Empfehlungen. KI ist ein selbstverständlicher Bestandteil der Wirtschaft,
  der Gesellschaft, der Wissenschaft und der Forschung. Die Bundesregierung hat sich
  das Ziel gesetzt, Deutschland bis 2030 als KI -Nation zu etablieren. Sie setzt daher
  mit Nachdruck auf die umfassenden Möglichkeiten des Einsatzes von Künstlicher Intelligenz
  in allen Lebensbereichen. Zugleich ist klar: Die Fähigkeiten von KI -Modellen nehmen
  massiv zu. Damit sind auch steigende Risiken verbunden. Daher unterstützt die Bundesregierung
  Bemühungen für eine internationale Regulierung. Ziel ist, Deutschland bis 2030 zu
  einer starken und souveränen KI -Nation zu machen. Dieses Zielbild hat die Bundesregierung
  bei dem Digitalgipfel 2026 vorgelegt: Grundlage dafür ist ein Ergebnisbericht PDF,
  971 KB, barrierefrei der KI -Taskforce, der unter der Federführung des Bundesdigitalministeriums
  erstellt wurde. Dieser Bericht zeigt den Weg bis 2030 auf, setzt dafür messbare
  Ziele und bündelt 18 ressortübergreifende Schlüsselmaßnahmen. So will die Bundesregierung
  den Einsatz von Künstlicher Intelligenz in Wirtschaft und Verwaltung voranbringen,
  eigene technologische Fähigkeiten stärken und in der ganzen Gesellschaft eine sichere,
  selbstbestimmte Nutzung ermöglichen. Wichtiges Anliegen ist es vor allem, auf dem
  Weg zur KI -Nation nicht nur einzelne KI -Leuchtturmprojekte, sondern ein leistungsfähiges
  KI -Ökosystem zu schaffen. Voraussetzung dafür ist, gesellschaftliche Resilienz
  und Teilhabe zu stärken, sichere und beherrschbare KI zu gewährleisten, KI in die
  breite Anwendung zu bringen, eine souveräne und skalierbare Infrastruktur zu schaffen,
  Zugang zu Frontier AI zu sichern sowie die besten KI -Talente zu qualifizieren,
  zu gewinnen und zu binden. Lesen Sie hier den Ergebnisbericht der KI -Taskforce
  : Deutschland als KI-Nation 2030 PDF, 971 KB, barrierefrei KI ist inzwischen ständiger
  Begleiter bei alltäglichen Fragen und in allen Lebenslagen. Bürgerinnen und Bürger
  profitieren von dieser Technologie; durch bessere Dienstleistungen, schnellere Verfahren,
  mehr Lebensqualität und gesellschaftliche Teilhabe. So verbinden sich Vertrauen,
  Innovationskraft und gesellschaftliche Akzeptanz von Künstlicher Intelligenz. Die
  Bundesregierung setzt sich dafür ein, die Schlüsseltechnologie KI im Interesse der
  Menschen in Deutschland zu fördern. Dafür gilt es, insbesondere die KI -Kompetenz
  der Bevölkerung in allen Lebensphasen, von Schule und Ausbildung über Studium und
  Erwerbsleben bis zur nachberuflichen Phase zu stärken. Alle Bürgerinnen und Bürger,
  Beschäftigte, Unternehmen und öffentliche Einrichtungen sollen einen niedrigschwelligen
  Zugang zu hochwertigen Qualifizierungsangeboten erhalten Darüber hinaus wird die
  europäische KI -Verordnung so innovationsfreundlich wie möglich umgesetzt und die
  neu etablierte KI -Aufsicht als zentrale Anlaufstelle genutzt, um Innovationen zu
  fördern und Unternehmen und Forschungseinrichtungen zu beraten. Auch der Staat soll
  Vorreiter beim Einsatz der KI werden. Bereits jetzt werden KI -Anwendungen eingesetzt,
  um Verwaltungsverfahren effizienter zu gestalten und so die Staatsmodernisierung
  voranzubringen. Die Entwicklung zeigt: KI verändert alle Lebensbereiche, schafft
  neue Möglichkeiten, stellt uns als Gesellschaft aber auch vor neue Herausforderungen.
  Bei der gemeinwohlorientierten Entwicklung und dem Einsatz der KI stehen Sicherheit
  und ökonomische wie soziale Nachhaltigkeit daher stets im Fokus. Die Bundesregierung
  setzt sich dafür ein, dass sich die Entwicklung der KI an europäischen Grundwerten
  orientiert und unabhängig von globalen Monopolen verläuft. „ KI made in Germany“
  steht für die Entwicklung und Nutzung vertrauenswürdiger, souveräner und wettbewerbsfähiger
  KI -Modelle. Die Stärke unseres Landes liegt in einer leistungsfähigen Industrieproduktion
  und technologischen Exzellenz, die die Nutzung umfassender Industriedaten und die
  Umsetzung anspruchsvoller Anwendungsfälle erlauben. Daraus erwächst ein internationaler
  Wettbewerbsvorteil bei der Entwicklung und Skalierung leistungsfähiger industrieller
  KI . Deutschland zählt zu den weltweit führenden Standorten für Entwicklung, Einsatz
  und Investitionen in fortschrittliche und ressourcenschonende KI -Systeme. Die Rahmenbedingungen
  für Investitionen, auch in KI -Startups und Scaleups, haben sich messbar verbessert.
  Industrie, Digitalwirtschaft und Investoren investieren in erheblichem Umfang privates
  Kapital. Deutschland prägt die internationale Frontier AI Governance entscheidend
  mit, insbesondere über die Einbindung des KI -Sicherheitsinstituts in das internationale
  Netzwerk von AI Safety Instituten, die Zusammenarbeit im Rahmen von G7 und über
  die Arbeit in internationalen Normierungsgremien. Transparente Trainingsprozesse,
  dokumentierte Datenherkunft und überprüfbare Sicherheit schaffen Vertrauen in die
  Modelle. Ihre Ergebnisse stehen im Einklang mit geltendem Recht und europäischen
  Werten; nationale Bewertungen genießen internationales Vertrauen. Künstliche Intelligenz
  und ihre industrielle Nutzung sind eines der Kernthemen. Ziel ist es, industrielle
  KI systematisch in die breite Anwendung zu bringen und ein hochmodernes industrielles
  KI -Ökosystem in Europa zu etablieren – mit starken deutschen Unternehmen und Forschungseinrichtungen.
  Die Investitionszusagen zahlreicher Unternehmen in Höhe von 230 Milliarden Euro
  sind ein wichtiges Signal: Deutschland will nicht nur Nutzer von KI , sondern Vorreiter
  bei der industriellen KI und der Physical KI werden. Zudem haben im Rahmen des „
  Invest in Germany Summit “ das Bundeswirtschaftsministerium und das Bundesforschungsministerium
  eine Absichtserklärung ( Joint Declaration of Intent ) mit NVIDIA unterzeichnet.
  Mit der Erklärung vereinbaren die Partner, eine Initiative zur Entwicklung modernster
  KI -Modelle für Physical AI voranzutreiben. Die Initiative baut auf Deutschlands
  herausragenden Industriedaten, seiner Fertigungskompetenz und seiner Expertise im
  Ingenieurswesen auf und ist in die KI -Roadmap der Bundesregierung sowie die Plattform
  Industrie 4.0 eingebettet. Es handelt sich um ein Netzwerk aus Politik, Industrie,
  Forschung und Verbänden. Die Plattform wird aktuell vollständig auf das Thema Industrielle
  KI ausgerichtet. Das Netzwerk soll somit zum zentralen Strategienetzwerk für Industrielle
  KI von der Infrastruktur bis zur Anwendung werden. Mit diesem Schritt unterstreicht
  die Bundesregierung ihr Ziel, die traditionelle deutsche Ingenieurskunst und Fertigungsexpertise
  mit Spitzenforschung und modernster KI -Technologie zu verschmelzen, um die Produktivität,
  Wettbewerbsfähigkeit und technologische Souveränität Deutschlands zu sichern. Hightech
  Agenda: Im Rahmen der Hightech Agenda Deutschland hat die Bundesregierung KI zu
  einer der Schlüsseltechnologien erklärt. So sollen KI-Technologien speziell gefördert
  werden, um mehr Wertschöpfung, Wettbewerbsfähigkeit und Souveränität zu erreichen.
  Ziel ist es, das wirtschaftliche Potenzial der KI weiter auszuschöpfen, die Verfügbarkeit
  und Nutzbarkeit von KI -Kapazitäten zu verbessern und Deutschland als zentralen
  Player für die nächste KI -Generation zu etablieren. Ausbau von Rechenzentren: Bundesdigitalminister
  Wildberger betont: „Wir haben geliefert, was unser Land braucht: einen klaren Fahrplan
  für den Rechenzentrumsstandort Deutschland“. Am 18. März 2026 hat die Bundesregierung
  die Nationale Rechenzentrumsstrategie beschlossen. Ziel ist, die allgemeine Rechenzentrumskapazität
  in Deutschland bis 2030 zu verdoppeln und die Rechenkapazitäten für KI zu vervierfachen.
  Die Strategie umfasst 28 Maßnahmen aus verschiedenen Handlungsfeldern und soll auch
  der Förderung moderner Technologien wie KI dienen, die auf große Rechenleistungen
  angewiesen sind. Durch den Ausbau wird ein weiterer Beitrag zum nachhaltigen Wachstum
  und zur digitalen Souveränität des Wirtschaftsstandortes Deutschland geleistet.
  Sechs Monate nach dem Beschluss sind 25 der 28 Maßnahmen gestartet und vier Maßnahmen
  bereits abgeschlossen. Hierzu gehört die Bereitstellung einer souveränen KI - Cloud
  , die für die Bundesverwaltung abrufbar ist. KI -Investitionen: Der zügige Ausbau
  der Infrastruktur wird zudem durch massive Investitionen des Bundes flankiert: Für
  europäische Leuchtturmprojekte ( IPCEI ) im Bereich Cloud , KI und Dateninfrastruktur
  stehen rund drei Milliarden Euro bereit. Weitere 30,7 Millionen Euro fließen bis
  2030 in neue KI -Rechenkapazitäten für das Nationale Hochleistungsrechenzentrum
  AI Gigafactory . Zusätzlich ist es ein wichtiges Ziel der Bundesregierung, dass
  Deutschland Standort einer der AI Gigafactories wird, die aktuell von der EU geplant
  werden. Bei diesen Gigafactories handelt es sich um leistungsstarke Rechenzentren
  mit über 100.000 KI -Prozessoren, welche die drei- bis vierfache Leistungsfähigkeit
  der aktuell schnellsten Supercomputer in Europa erreichen. Die EU plant, bis zu
  sieben solcher KI -Fabriken zu bauen und hierfür private Gelder in Höhe von 20 Milliarden
  Euro zu mobilisieren. Die Bundesregierung setzt sich dafür ein, dass sich deutsche
  und europäische Unternehmen für einen Standort in Deutschland bewerben, um beim
  Ausbau der europäischen KI -Infrastruktur eine führende Rolle zu übernehmen. Um
  einen nachhaltigen und energieeffizienten Betrieb zu ermöglichen, sollen gesonderte
  Förderungsmittel durch das Bundesforschungsministerium bereitgestellt werden und
  die Forschung zu nachhaltigen Rechenzentren gefördert werden. KI in der Gesundheitsversorgung:
  Um das Potenzial von KI im Gesundheitswesen zu nutzen, errichtet die Bundesregierung
  Infrastrukturen, die es Entwickelnden und Gesundheitseinrichtungen ermöglichen,
  gemeinsam KI -Lösungen rechtssicher und datenschutzkonform zu entwickeln und unter
  Begleitung der Aufsichtsbehörden zu erproben und zu skalieren. Durch sichere Datenzugänge,
  technische Infrastruktur und regulatorische Hilfestellungen beseitigen wir Hürden
  und beschleunigen den Markteintritt innovativer Systeme. Das führt dazu, die medizinische
  Versorgung zu verbessern, Bürokratie zurückzubauen und mehr digitale Souveränität
  zu erreichen. Die europäische Frontier AI Initiative („Initiative für führende KI
  “) soll Europas Fähigkeiten bei der Entwicklung und verantwortungsvollen Steuerung
  fortgeschrittener KI stärken, Forschung und Recheninfrastruktur vernetzen und einseitige
  Abhängigkeiten verringern. Die Bundesregierung will  gemeinsam mit ihren europäischen
  Partnern auch im KI -Bereich digitale Souveränität sowie europäische Lösungen erreichen.
  Ziel ist, dass Europa hier an die Spitze der technologischen Entwicklung gelangt.
  Mit der Initiative bündeln Deutschland und Frankreich sowie andere europäische Partner
  die gemeinsamen Kräfte. D ie Initiative wurde kürzlich in European Future of AI
  Initiative (EFAI) umbenannt , um deutlich zu machen, dass es um die nächste KI -Generation
  geht. Deutschland verfügt über einen souveränen Zugang zu den weltweit leistungsfähigsten
  KI -Modellen (sogenannte Frontier AI Modelle). Dieser wird durch strategische Partnerschaften
  mit internationalen Partnern und Modellanbietern und einen europäischen Ansatz gemeinsamer
  Beschaffungsmechanismen erreicht und durch technische Wechsel- und Kontrollfähigkeit
  und souveräne Modelle zur Absicherung ergänzt. Im Verbund mit der EU und anderen
  Wertepartnern treibt Deutschland Forschung und Entwicklung von möglichst leistungsfähigen
  KI -Modellen voran, die nah an Frontier AI Modelle heranreichen, souverän entwickelt
  und betrieben, sowie aktiv genutzt werden und auch zur Absicherung dienen. Die agentische
  KI ist ein System der KI , das mit begrenzter Aufsicht ein bestimmtes Ziel erreichen
  kann. Dadurch kann die KI zunehmend selbstständig handeln, Entscheidungen vorbereiten
  und komplexe Aufgaben übernehmen. Diese Technologie kann nicht nur in Unternehmen,
  sondern auch in der Verwaltung gewinnbringend eingesetzt werden. Im Rahmen des SPARK--Schnellere
  Planung und Realisierung durch KI - Projekts werden bereits KI -Module in der Verwaltung
  eingesetzt, um Planungs- und Genehmigungsverfahren zu beschleunigen. Die Module
  bilden ein Assistenzsystem, bei dem KI -Agenten konkrete Teilaufgaben innerhalb
  eines Gesamtprozesses übernehmen und so die Beschäftigten aktiv bei der Arbeit unterstützen.
  Um den Einsatz agentischer KI weiter zu erproben, bringt das Bundesdigitalministerium
  innerhalb der Agentic AI Hubs außerdem gezielt Kommunen mit KI -Unternehmen zusammen.
  Gemeinsam werden Anwendungen entwickelt und getestet, die die Arbeitsabläufe in
  der Verwaltung beschleunigen können. Erste Pilotprojekte im Frühjahr 2026 konnten
  bereits Erfolge verzeichnen. Durch den Einsatz agentischer KI -Anwendungen konnten
  beispielsweise Pflegeanträge fast doppelt so schnell bearbeitet werden, bei Anträgen
  im Zusammenhang mit der Datenschutzgrundverordnung waren es sogar 90 Prozent.  Diese
  Ergebnisse veranschaulichen, dass die agentische KI einen gewichtigen Beitrag zur
  Staatsmodernisierung leisten kann. Aufgrund dieser positiven Entwicklung und der
  hohen Nachfrage aus den Kommunen geht das Projekt nun mit 38 Kommunen und 17 Start-ups
  und Scale-ups aus der KI -Branche in die nächste Runde. Die Bundesregierung hat
  dafür gesorgt, dass der Standort Deutschland die Chancen Künstlicher Intelligenz
  voll ausschöpfen kann. Ein entsprechendes Gesetz zur Durchführung der europäischen
  KI -Verordnung ist  bereits 2024 teilweise in Kraft getreten, weitere Maßnahmen
  im Sommer 2026. Das Gesetz legt fest, welche nationalen Behörden des Bundes und
  der Länder für die Marktüberwachung und Notifizierung von KI -Systemen zuständig
  sind. Er regelt deren Zusammenarbeit und schafft klare Ansprechpartner für Unternehmen.
  Dabei wird auf bestehende Strukturen und behördliche Expertise zurückgegriffen,
  um Doppelarbeit zu vermeiden und bewährte Fachkompetenz zu nutzen. Kernelement der
  Regelung ist die zentrale Rolle der Bundesnetzagentur, die im Wesentlichen als Marktüberwachungsbehörde
  für die Einhaltung der KI -Verordnung zuständig ist. Die aktuellen geopolitischen
  Entwicklungen zeigen: Technologische Abhängigkeiten sind ein strategisches Risiko.
  Aus diesem Grund verfolgt die Bundesregierung das klare Ziel, mehr Eigenständigkeit
  und Sicherheit durch europäische Kooperation und Investitionen von Schlüsseltechnologien
  zu erreichen. Das Bundesdigitalministerium setzt auf den Ausbau einer leistungsfähigen
  deutschen Cloud-Infrastruktur. Dabei stehen offene Schnittstellen, europaweite Standards
  und der verstärkte Einsatz von Open Source-Technologien im Fokus. Mit gebündelten
  IT -Aufträgen soll der Staat gezielt zum sogenannten Ankerkunden der heimischen
  Digitalwirtschaft werden. Diese Nachfrageorientierung beschleunigt die Entwicklung
  und Marktreife von Innovationen – ein entscheidender Hebel für digitale Souveränität
  „Made in Germany“. Für die Förderung der digitalen Souveränität setzt Deutschland
  außerdem auf die Zusammenarbeit mit unseren europäischen Partnern. Eine gemeinsame
  deutsch-französische „Taskforce für die Digitale Souveränität Europas“ wurde beim
  Gipfel zur Europäischen Digitalen Souveränität am 18. November 2025 in Berlin beschlossen.
  Sie erarbeitet derzeit eine verbindliche Definition digitaler Souveränität. Diese
  soll künftig die Grundlage für deutsche und europäische Gesetzgebung sowie für Förder-
  und Beschaffungsprozesse bilden. Beide Länder haben sich dieses Jahr bereits auf
  eine gemeinsame Definition für eine Taskforce verständigt. Ohne eigene, tiefgehende
  Analysefähigkeit verliert der Staat bei der Risikobewertung hochkomplexer KI -Systeme
  die Kontrolle. Das will die Bundesregierung verhindern. Mit dem nationalen KI -Sicherheitsinstitut
  ( AISI Deutschland) hat die Bundesregierung eine zentral verankerte Kompetenz- und
  Evaluierungsinstitution zur Stärkung der digitalen Souveränität und Sicherheit in
  Deutschland geschaffen. Das AISI Deutschland ist keine Regulierungsbehörde, sondern
  ein analytisch-operatives Kompetenzzentrum („ Think- & Do-Tank “) an der Schnittstelle
  von Sicherheit, Technologieanalyse, Innovation und strategischer Beratung. Durch
  das Erstellen aktueller Lagebilder mit Frühwarnindikationen wird ein vorausschauendes
  informiertes Handeln ermöglicht, um Gesellschaft, Wirtschaft und nationale Sicherheit
  sowie außen- und sicherheitspolitische Interessen vor Risiken zu schützen. Das schafft
  verlässliche Sicherheitsstandards für kritische Anwendungen und festgelegte Regulierungsanforderungen
  sowie Vertrauen in den Staat. Die Fachaufsicht, Steuerung und politische Kontrolle
  der Arbeit des Instituts liegen in der gemeinsamen Verantwortung des Bundesinnen-
  und des Bundesdigitalministeriums. KI und Cybersicherheit sollten in engem Zusammenhang
  gesehen werden. KI verbessert die Cybersicherheit, indem sie große Datenmengen analysiert,
  Bedrohungen erkennt und Reaktionen automatisiert. Zugleich schafft sie aber auch
  neue Risiken wie Manipulation, Verwundbarkeiten und Datenschutzprobleme. Grundsätzlich
  ist die Cybersicherheit auf jeder politischen Ebene ein Thema und seit den neuen
  globalen Herausforderungen noch einmal mehr in den Fokus gerückt. Deswegen stimmt
  sich Deutschland auch eng auf europäischer Ebene zum Thema Cybersicherheit ab. Die
  Bundesregierung hat bereits zahlreiche wirkungsvolle Maßnahmen zur Cybersicherheit
  ergriffen: Zur Stärkung des Schutzsystems für Cybersicherheit kritischer Infrastrukturen
  hat die Bundesregierung ein Umsetzungs- und Cybersicherheitsstärkungsgesetz (NIS-2) b
  eschlossen. Ziel ist es, die Cybersicherheit kritischer Infrastrukturen in der Europäischen
  Union weiterhin auf einem gemeinsamen hohen Niveau sicherzustellen; verbindliche
  Maßnahmen für Wirtschaft und Verwaltung. Wichtige Einrichtungen sollen sich so besser
  vor Schäden durch Cyberangriffe schützen und hierdurch das Funktionieren des europäischen
  Binnenmarktes verbessert werden. Mit dem Gesetz zur Stärkung der Cybersicherheit
  wurden zur Erkennung und Abwehr von Cyberangriffen angemessene und rechtssichere
  gesetzliche Grundlagen geschaffen. Ziel ist es, die Cybersicherheit weiter zu stärken
  und unsere Sicherheitsbehörden in die Lage zu versetzen, bei schwerwiegenden Gefahren
  Cyberangriffe auch aktiv verhindern, stoppen oder zumindest abmildern zu können.
  Darüber hinaus hat die Bundesregierung Eckpunkte für mehr Cybersicherheit beschlossen.
  Um die Cybersicherheit zu erhöhen, hat die Bundesregierung beschlossen, einen Cyberdome
  als Schutzschirm für den digitalen Raum in Deutschland einzusetzen. Dieser soll
  als zentral koordiniertes Frühwarn- und Schutzsystem Cyberangriffe auf staatliche
  Institutionen, Kritische Infrastrukturen, Unternehmen sowie die Gesellschaft schneller
  erkennen, auswerten und die Auswirkungen und Schäden der Angriffe minimieren. Der
  Cyberdome wird als mehrjähriges Vorhaben konzipiert, das bestehende Systeme vernetzt
  oder Sensorik gezielt ergänzt. Bis Ende des Jahres 2026 wird ein Realisierungskonzept
  durch das Bundesinnenministerium und das Bundesamt für Sicherheit in der Informationstechnik
  ausgearbeitet. Mit dem Gesetz zur Durchführung der Cyberresilienz-Verordnung setzt
  die Bundesregierung die von der europäischen Verordnung vorgegebenen einheitlichen
  Regeln zur Cybersicherheit von Produkten mit digitalen Elementen um. Cybersicherheit
  gilt fortan als grundlegende Produkteigenschaft und damit als zwingende Voraussetzung
  für den Marktzugang für Produkte mit digitalen Elementen, wie etwa Smart-TVs oder
  Smartphone -Geräte. Ferner hat die Bundesregierung ei n Programm zur Steigerung
  der Cybersicherheit in der Bundesverwaltung, kurz: CyberGovSecure , eine Bündelung
  von Sofortmaßnahmen beschlossen. Das Programm steigert die Cybersicherheit und Cyber
  -Resilienz der obersten Bundesbehörden. BSI hat neun Handlun gsfelder identifiziert
  und erste Maßnahmen festgelegt, unter anderem das Erkennen und Beseitigen von Schwachstellen,
  Detektion und System-Protokol lierung, Sichere Konfiguration, Netzwerksicherheit
  und Systemhärtung. Das Nationale Cyber-Abwehrzentrum unter Federführung des Bundesamtes
  für Sicherheit in der Informationstechnik (BSI) ist die Kooperations-, Kommunikation
  s- und Koordinationsplattform der zuständigen (Sicherheits-) Behörden unterschiedlicher
  Ressorts, die insbesondere durch ein gemeinsames, aktuelles und umfassendes Cybersicherheitslagebild
  für Deutschland, strategische Berichterstattungen sowie durch die koordinierende
  operative und interdisziplinäre Fallbearbeitung unverzichtbare Beiträge zur gesamtstaatlichen
  Cybersicherheit und somit – auch im Krisenfall – zur Handlungsfähigkeit der Bundesregierung
  leistet.'
