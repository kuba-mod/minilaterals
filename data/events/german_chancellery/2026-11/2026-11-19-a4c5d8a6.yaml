title: 'Erstes Treffen mit neuer französischer Amtskollegin Catherine Pégard in Paris
  – Staatsminister Weimer: „Deutsch-französische Kulturbeziehungen sind das pulsierende
  Herz Europas“'
text: 'Kulturstaatsminister Wolfram Weimer traf heute die neue französische Kulturministerin,
  Catherine Pégard, zu einem ersten gemeinsamen Gespräch in Paris. Im Mittelpunkt
  standen die deutsch-französische Zusammenarbeit zu Kultur und Medien sowie gemeinsame
  europäische Vorhaben. Beide tauschten sich über die Europäisierung von ARTE aus
  und betonten die wichtige Bedeutung des Projekts für beide Seiten. „Die Beziehungen
  zwischen Frankreich und Deutschland sind eng und gut. Das zeigt sich exemplarisch
  an dem gemeinsamen Sender ARTE. Hier haben wir bereits wichtige Unterstützung insbesondere
  aus Spanien bekommen. Wir werden uns weiter gemeinsam intensiv für die Europäisierung
  von ARTE einsetzen und bei weiteren Mitgliedstaaten für das Projekt werben“, so
  Staatsminister Wolfram Weimer. Ein weiteres Thema war die Zusammenarbeit zwischen
  der Deutschen Welle und France Médias Monde. Beide Sender verbinden bereits gemeinsame
  Projekte. Staatsminister Weimer und Kulturministerin Pégard tauschten sich darüber
  aus, wie diese Kooperationen auch in struktureller Hinsicht intensiviert werden
  können. Beide Seiten verabredeten außerdem einen engeren Austausch zwischen Museen
  beider Länder. Gerade im Zeitalter von KI sei es wichtig, dass Deutschland und Frankreich
  gemeinsam als Avantgarde Impulse im neuen Genre der KI-Kunst setzen, so Kulturstaatsminister
  Weimer. Nach dem Treffen erklärte Staatsminister Weimer: „Die deutsch-französischen
  Kulturbeziehungen sind das pulsierende Herz Europas. Diese Zusammenarbeit ist für
  die Kultur in Europa von besonderer Bedeutung: Die gemeinsamen Projekte zwischen
  unseren Ländern zeigen, was wir zusammen bereits erreicht haben und noch erreichen
  können. Mit Catherine Pégard knüpfe ich daran an und möchte die deutsch-französischen
  Kulturbeziehungen im europäischen Kontext intensivieren. Gerade angesichts des digitalen
  Wandels brauchen wir einen engen Austausch zwischen unseren beiden Ländern, um kulturelle
  Vielfalt und unabhängige Medien zu stärken und die Rechte von Künstlerinnen und
  Künstlern zu schützen. Denn grenzüberschreitende Kultur lebt von gemeinsamen Institutionen
  ebenso von den Begegnungen zwischen Künstlerinnen und Künstlern, Kulturschaffenden
  und ihrem Publikum.“ Das Treffen fand im französischen Kulturministerium statt.
  Es diente dem persönlichen Kennenlernen und dem Austausch über die kultur- und medienpolitischen
  Prioritäten beider Länder. Das Treffen ging dem Kultur- und Medienministerrat der
  EU voraus, der am 20. November in Brüssel stattfindet.'
