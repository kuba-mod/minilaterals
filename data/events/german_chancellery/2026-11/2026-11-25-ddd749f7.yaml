title: 'Österreich und Deutschland verleihen erstmals gemeinsamen Lyrikpreis: Esther
  Kinsky und Ann Cotten ausgezeichnet'
text: 'Anlässlich des 100. Geburtstags von Ingeborg Bachmann haben Österreich und
  Deutschland den Österreichisch-Deutschen Lyrikpreis ins Leben gerufen. Die beiden
  Preisträgerinnen Esther Kinsky und Ann Cotten wurden heute im Rahmen der Buch Wien
  ausgezeichnet. Der gemeinsam vom österreichischen Staatssekretär für Auslandskultur,
  Sepp Schellhorn, und dem deutschen Staatsminister für Kultur und Medien, Wolfram
  Weimer, initiierte Preis ist mit jeweils 15.000 Euro dotiert und würdigt herausragende
  deutschsprachige Gegenwartslyrik. Ausgezeichnet werden Esther Kinsky für ihren Gedichtband
  „Heim.Statt“ (2025) und Ann Cotten für „Poller. Idyllen“ (2026). Beide Autorinnen
  bewegen sich in ihren Werken zwischen unterschiedlichen Sprachen, poetischen Traditionen
  und Kulturräumen – wie Ingeborg Bachmann, deren literarisches Schaffen von der Auseinandersetzung
  mit Sprache und ihren Grenzen geprägt war. Staatssekretär Schellhorn: „Künstliche
  Intelligenz hat uns die Verantwortung für das Geschriebene nicht abgenommen. Im
  Gegenteil: Je leichter es wird, Sprache zu erzeugen, desto wichtiger wird es, etwas
  zu sagen zu haben. Gerade deshalb brauchen wir die Literatur und die Lyrik. Sie
  eröffnen Räume, in denen nicht alles sofort verständlich, verwertbar oder erfolgreich
  sein muss. Mit diesem gemeinsamen Preis wollen wir Ingeborg Bachmann nicht nur mit
  wohlgesetzten Worten würdigen, sondern etwas ermöglichen: Begegnungen, Übersetzungen
  und neue literarische Perspektiven. Eine gemeinsame Sprache muss schließlich keine
  einheitliche Sprache sein. Ich hoffe, dass dieser Preis der Anfang einer noch engeren
  kulturellen Zusammenarbeit zwischen Österreich und Deutschland ist.“ Staatsminister
  Weimer: „Ich freue mich, dass wir den Österreichisch-Deutschen Lyrikpreis gemeinsam
  ins Leben rufen konnten. Gerade im Jubiläumsjahr Ingeborg Bachmanns würdigen wir
  damit die Bedeutung und die Schönheit zeitgenössischer Lyrik und setzen zugleich
  ein Zeichen für den engen literarischen Austausch zwischen Österreich und Deutschland.
  Es ist schön, dass die heutige feierliche Preisverleihung nicht den Abschluss dieses
  grenzüberschreitenden Projekts bildet, sondern der Dialog in Übersetzungswerkstätten
  in Berlin und Wien fortgesetzt wird. Den beiden Preisträgerinnen Esther Kinsky und
  Ann Cotten gratuliere ich ganz herzlich zu dieser Auszeichnung.“ Der einmalig anlässlich
  des Bachmann-Jubiläums vergebene Preis wird durch Übersetzungswerkstätten in Wien
  und Berlin ergänzt. Dort setzen sich die beiden Preisträgerinnen gemeinsam mit Literaturübersetzerinnen
  und -übersetzern insbesondere mit Sprachen und literarischen Werken auseinander,
  die für Ingeborg Bachmann von besonderer Bedeutung waren. Die Auswahl der Preisträgerinnen
  erfolgte durch eine unabhängige, österreichisch-deutsch besetzte Fachjury. Ihr gehören
  Jan Bürger, Bernhard Fetz, Daniela Strigl, Beate Tröger, Aurélie Maurin, Ursula
  Ebel und Manfred Müller an. Die Projektträger sind auf deutscher Seite das Literarische
  Colloquium Berlin in Kooperation mit dem TOLEDO-Programm des Deutschen Übersetzerfonds
  und auf österreichischer Seite die Österreichische Gesellschaft für Literatur. Mit
  dem Österreichisch-Deutschen Lyrikpreis setzen beide Länder ein gemeinsames Zeichen
  für die Gegenwartslyrik, den literarischen Austausch und die Vielfalt der deutschsprachigen
  Literatur.'
