title: Europäische Woche der Abfallvermeidung Der beste Abfall entsteht gar nicht
  erst
text: 'Reparieren statt wegwerfen: Noch bis Sonntag, 29. November 2026, läuft die
  Europäische Woche der Abfallvermeidung. Ob Repair -Café, Kleider-Tausch oder Koch-
  Workshop mit Lebensmittelresten: Vom 21. bis zum 29. November 2026 finden im Rahmen
  der Europäischen Woche der Abfallvermeidung zahlreiche Mitmachaktionen statt. Das
  Motto lautet „Ressourcen wertschätzen. Bewusst entscheiden!“. Dahinter steht der
  Gedanke: Der beste Abfall ist der, der gar nicht erst entsteht. Kommunen, Unternehmen,
  Bildungseinrichtungen, Vereine sowie Bürgerinnen und Bürger beteiligen sich an der
  Aktionswoche. Ihre Angebote zeigen, wie bewusster Konsum, Reparaturen und Wiederverwendung
  dazu beitragen können, Abfälle zu vermeiden. Interessierte finden Veranstaltungen
  in ihrer Nähe auf der interaktiven Aktionskarte der Europäischen Woche der Abfallvermeidung.
  Die Politik der Bundesregierung zur Vermeidung von Abfällen hat Bundesumweltminister
  Carsten Schneider zum Auftakt der Aktionswoche in zwei Aspekten zusammengefasst:
  „ Erstens: Unsere Verantwortung reicht über das reine Recycling von Abfällen und
  Materialien hinaus. Oberstes Ziel bleibt, Abfälle erst gar nicht entstehen zu lassen.
  Wir müssen früh ansetzen – in der Produktentwicklung, beim Design .“ Hierfür gelte
  es, gute Rahmenbedingungen zu schaffen. Dafür „treibt die Bundesregierung die Kreislaufwirtschaft voran:
  mit dem Aktionsprogramm zur Kreislaufwirtschaftsstrategie, mit Ökodesign-Regelungen
  für langlebige, reparierbare Produkte, mit dem Vernichtungsverbot für unverkaufte
  Schuhe und Kleidung und vielem mehr.“ Zweitens sind die Konsumentinnen und Konsumenten
  gefragt, ihre Einkäufe nachhaltig zu gestalten. Hier ergeben sich Fragen nach den
  Möglichkeiten, Produkte zu leihen, ihrer Reparierbarkeit oder auch Secondhand -Angeboten.
  Auf Grundlage der 2024 beschlossenen Nationalen Kreislaufwirtschaftsstrategie hat
  das Bundeskabinett am 3. Juni 2026 ein Aktionsprogramm verabschiedet. Bis Ende 2027
  will die Bundesregierung damit zwölf Maßnahmen vorantreiben, um die Kreislaufwirtschaft
  auszubauen und zugleich die Wettbewerbsfähigkeit der deutschen Wirtschaft zu stärken.
  Zum Programm gehören eine Umsetzungsplattform für Innovationen und neue Projekte
  sowie das Förderprogramm „Zukunft Kreislaufwirtschaft“. Vorgesehen sind außerdem
  eine Digitalisierungsinitiative, die stärkere Berücksichtigung von Recyclingprodukten
  in der öffentlichen Beschaffung und die Weiterentwicklung des Kreislaufwirtschaftsrechts.
  Weitere Vorhaben enthält der am 30. September 2026 beschlossene Aktionsplan „Nachhaltigkeit
  für ein modernes und zukunftsfähiges Deutschland“ . Seine 20 Missionen betreffen
  unter anderem biobasierte Verpackungsmaterialien, nachhaltige öffentliche Beschaffung
  und die Förderung von Reparaturen. Geprüft werden beispielsweise ein leichterer
  Zugang zu Ersatzteilen und Reparaturinformationen sowie ein bundesweiter Reparaturbonus.
  Im Juli 2026 ist das Gesetz zur Förderung der Reparatur von Waren in Kraft getreten.
  Schadhafte Produkte sollen vermehrt repariert werden. Ziel ist es, einen nachhaltigen
  Konsum und eine Kultur des Reparierens zu fördern. Mit dem neuen Gesetz wird ein
  Recht auf Reparatur geschaffen. Dieses kann gegenüber dem Hersteller für die übliche
  Lebensdauer geltend gemacht werden. Wie lange das genau der Fall ist, bestimmt das
  Gesetz. Verbraucherinnen und Verbraucher haben bei einer mangelhaften Sache bereits
  das Recht auf Gewährleistung. Das bedeutet: Ein Händler muss zwei Jahre für die
  Mangelfreiheit eines Produktes einstehen. Geht das gekaufte Produkt innerhalb dieser
  Zeit kaputt, haben Verbraucherinnen und Verbraucher gegenüber dem Händler verschiedene
  Rechte. Bei der Entscheidung für eine Reparatur verlängert sich nach dem neuen Recht
  die Gewährleistung von zwei auf drei Jahre. Zudem stellen die neuen Regeln klar:
  Lässt sich eine Ware nicht reparieren, obwohl das bei dieser Art von Produkt üblicherweise
  erwartet werden kann, begründet dies einen Sachmangel. Verbraucherinnen und Verbraucher
  können dann Gewährleistungsrechte geltend machen. Außerdem besteht durch das Gesetz
  die Möglichkeit, Ersatzteile und Werkzeug für die Reparatur zu einem angemessenen
  Preis vom Hersteller zu erhalten. Damit kann man die Reparatur selbst in die Hand
  nehmen. Seit dem 19. Juli 2026 dürfen große Unternehmen unverkaufte Kleidung, Schuhe
  und bestimmte Bekleidungsaccessoires grundsätzlich nicht mehr vernichten. Das Verbot
  beruht auf der europäische Ökodesign-Verordnung und betrifft beispielsweise unverkaufte
  Retouren oder Überbestände. Die Waren sollen stattdessen möglichst weiterverkauft,
  gespendet, wiederverwendet oder aufgearbeitet werden. Seit dem 1. November 2026
  gelten in Deutschland außerdem neue gesetzliche Regelungen zum Ökodesign und zur
  Energieverbrauchskennzeichnung . Während Ökodesign-Anforderungen bei der Produktgestaltung
  ansetzen und so Mindestanforderungen für den Zugang zum EU -Binnenmarkt formulieren,
  macht das EU -Energielabel die Energieeffizienz und den Ressourcenverbrauch der
  entsprechenden Produkte für Käufer auf einen Blick vergleichbar. Die europäische
  Verpackungsverordnung gilt grundsätzlich seit dem 12. August 2026. Das deutsche
  Verpackungsrecht-Durchführungsgesetz ergänzt die unmittelbar geltende EU -Verordnung.
  Viele neue Anforderungen werden erst nach Übergangsfristen verbindlich. Die neuen
  Regelungen sollen Verpackungsabfälle verringern, die Wiederverwendung fördern und
  das Recycling verbessern. Das erfolgt zum Beispiel durch: Verbraucherinnen und Verbraucher
  profitieren unter anderem durch die Beschränkung gesundheitsschädlicher PFAS (per-
  und polyflourierte Alkylsubstanzen) in Verpackungen, die mit Lebensmitteln in Berührung
  kommen. Zudem wird voraussichtlich ab 2028 eine neue Kennzeichnung von Verpackungen
  und Abfallsammelbehältern die Mülltrennung erleichtern. Nichts ändert sich für Verbraucher
  an der bewährten Sammlung von Verpackungsabfällen in Altglas-Containern, Altpapiertonne
  und -containern sowie in gelben Tonnen und Säcken. Ebenso bleiben die Pfandsysteme
  für Getränkeverpackungen und im To-Go -Bereich erhalten. Auch bei Lebensmitteln
  setzt die Bundesregierung auf Abfallvermeidung. Mit der Fortführung der Nationalen
  Strategie zur Reduzierung der Lebensmittelverschwendung und der Informationsinitiative
  „Zu gut für die Tonne!“ setzt sich das Bundeslandwirtschaftsministerium gegen das
  Wegwerfen von Lebensmitteln ein. Zudem wird der 2023 geschlossene Pakt gegen Lebensmittelverschwendung
  mit dem Lebensmittelgroß- und Einzelhandel fortgesetzt. Derzeit beteiligen sich
  13 Unternehmen an dem Pakt. Sie haben sich verpflichtet, ihre Lebensmittelabfälle
  bis 2030 zu halbieren. Der Pakt enthält eine Kooperationsverpflichtung, die vorrangig
  mit gemeinnützigen Unternehmen, wie den Tafeln ausgestaltet, werden soll. Das Ministerium
  setzt sich zudem dafür ein, Lebensmittelspenden zu erleichtern.'
