date: '2026-11-02'
type: press_release
source_name: german_chancellery
title: Digital-Gipfel 2026 Sicherheit, Souveränität und Wettbewerbsfähigkeit
text: 'Bundeskanzler Merz hat auf dem Digital-Gipfel auch einen Roboter der Firma
  NEURA Robotics in Augenschein genommen. Auch in diesem Jahr findet der vom Bundesdigitalministerium
  ausgerichtete Digital-Gipfel in Berlin statt. Anknüpfend an den letztjährigen Gipfel
  mit dem Schwerpunkt digitale Souveränität befasst er sich mit dem Themengebiet Künstliche
  Intelligenz. Unter dem Motto „ Shaping AI: safe, sovereign, competitive “ werden
  Fragen der konkreten KI -Anwendung, die KI -Sicherheit, Chancen und Risiken, neue
  Entwicklungen für die Zukunft und politisch-strategische Fragen rund um Künstliche
  Intelligenz erörtert. Ziel der Bundesregierung ist es, KI aktiv, sicher und vertrauenswürdig
  zu gestalten, sodass KI unsere Wirtschaft leistungsfähiger und unseren Staat handlungsfähiger
  macht sowie Bürgerinnen und Bürgern den Alltag erleichtert. Deutschland soll als
  KI -Nation Wirtschaftswachstum, Arbeitsplätze, eine leistungsfähige und schnelle
  Verwaltung sowie vertrauensvolle und sichere Alltagsanwendungen bieten. Ein wichtiges
  Anliegen der Bundesregierung ist es, Deutschland im internationalen Wettbewerb um
  KI deutlich nach vorne zu bringen. Besonders in der Industrie: Wenn die deutsche
  Industrie ihr einzigartiges Know-how und ihre innovativen Ideen nutzt, könne das
  Land bei der industriellen KI zur Weltspitze aufsteigen, ist sich Bundeskanzler
  Merz sicher. Bundesdigitalminister Dr. Karsten Wildberger betonte: „Der Digital-Gipfel
  2026 steht für unseren Anspruch, KI sicher und vertrauenswürdig zu gestalten, Chancen
  zu nutzen und Deutschland und Europa im internationalen Wettbewerb weiter nach vorne
  zu bringen. Dafür schaffen wir verlässliche Rahmenbedingungen für mehr digitale
  Souveränität und Wettbewerbsfähigkeit. Ich freue mich auf zwei spannende Tage, an
  denen wir sichtbar machen, wie stark wir mit KI bereits aufgestellt sind und wo
  wir gemeinsam mit unseren Partnern neue Innovationskräfte freisetzen können.“ Lesen
  Sie hier den Ergebnisbericht der KI -Taskforce : Deutschland als KI-Nation 2030
  PDF, 971 KB, barrierefrei Der Digital-Gipfel ist ein jährlicher Kongress als zentrale
  Plattform zur Gestaltung der digitalen Transformation von Wirtschaft, Staat und
  Gesellschaft in Deutschland. Ursprünglich wurde der Gipfel aufgrund der größer werdenden
  Bedeutung der IT -Branche für die deutsche Wirtschaft 2006 ins Leben gerufen und
  trug bis 2016 den Namen "Nationaler IT -Gipfel". Seit dem letzten Jahr wird das
  Treffen vom Bundesministerium für Digitales und Staatsmodernisierung ausgerichtet.
  Eröffnet wurde der Digital-Gipfel am 02. November von Bundesdigitalminister Karsten
  Wildberger. Sprecherinnen und Sprecher aus Wirtschaft, Wissenschaft, Gesellschaft
  und Politik beleuchten die vielfältigen Dimensionen von KI . Digitalministerinnen
  und Digitalminister aus Europa und Kanada, die EU-Kommission , Mitglieder des Deutschen
  Bundestages, hochrangige Vertreterinnen und Vertreter der Bundesländer sowie aus
  Wirtschaft, Wissenschaft und Gesellschaft werden vor Ort erwartet. Am Eröffnungstag
  sprach auch Bundeskanzler Friedrich Merz auf dem Gipfel. Er warb im internationalen
  KI -Wettbewerb für mehr Tempo in Deutschland und Europa. Es gelte, schneller und
  besser darin zu werden, „digitale Technologien zu entwickeln und die auch wirklich
  zu nutzen“. Zudem gehe es darum, den Wandel im Sinne hiesiger Werte zu gestalten.
  Im Zentrum stehe der Mensch, nicht die Technologie. Neben zahlreichen Panels finden
  rund um den Digital-Gipfel sogenannte Side-Events statt, die von Bundesministerien,
  der Zivilgesellschaft, Unternehmen, Verbänden und der Wissenschaft organisiert werden.
  Die Side-Events greifen Schwerpunktthemen des Digital-Gipfels auf und beleuchten
  verschiedene Perspektiven. Künstliche Intelligenz gewinnt immer mehr an Bedeutung
  für zukünftiges Wachstum, Innovation und Wohlstand. Unser Land hat den Anspruch,
  führender KI -Standort in Europa zu werden und so die künftige Wettbewerbsfähigkeit
  in Europa und in der Welt zu sichern. Der Digital- Gipfel soll verdeutlichen, wie
  stark unser Land bereits aufgestellt ist und wo noch weitere Innovationen erfolgen
  müssen. Die Bundesregierung hat eine ressortübergreifende KI -Taskforce eingesetzt.
  Unter der Federführung des Bundesdigitalministerium hat sie die übergreifende Vision
  von Deutschlands Weg zur KI -Nation bis 2030 erarbeitet. Der am 02. November veröffentlichte
  Ergebnisbericht PDF, 971 KB, barrierefrei setzt dafür messbare Ziele und bündelt
  18 ressortübergreifende Schlüsselmaßnahmen. Die vorgeschlagenen Maßnahmen reichen
  von einer strategischen Analyse- und Monitoringstruktur über KI -Kompetenz, Sicherheits-
  und Infrastrukturinitiativen bis hin zu Technologie-, Innovations-, Anwendungs-
  und Talentprogrammen. Gemeinsam adressieren sie die zentralen Voraussetzungen für
  eine leistungsfähige, souveräne und verantwortungsvoll gestaltete KI -Nation. Konkret
  sollen beispielsweise bis 2030 mindestens 80 Prozent der Großunternehmen und 55
  Prozent der kleinen und mittleren Unternehmen KI einsetzen. Der Anteil der Wirtschaftsleistung,
  der KI -basiert erwirtschaftet wird, soll mehr als zehn Prozent betragen. Und 90
  Prozent der Bundesbehörden sollen bis 2030 mindestens eine KI -Anwendung zur Bearbeitung
  von Kernaufgaben nutzen. Aufgrund der hochdynamischen technologischen Entwicklung
  im Bereich der Künstlichen Intelligenz ist eine kontinuierliche Überprüfung und
  Anpassung der Ziele und Maßnahmen zwingend erforderlich. Der Ergebnisbericht bildet
  die strategische Basis; die kontinuierliche Überprüfung und Anpassung stellen sicher,
  dass Deutschland auf neue Herausforderungen und technologische Durchbrüche zeitnah
  und agil reagieren kann. 2025 fand der Digital-Gipfel in Zusammenarbeit mit der
  französischen Regierung als Gipfel zur europäischen digitalen Souveränität statt
  („Summit on European Digital Sovereignty“). Ziel des europäischen Digital-Gipfels
  auf dem EUREF-Campus Berlin war es, zentrale Aspekte für eine unabhängige, sichere
  und innovationsfreundliche digitale Zukunft Europas weiterzuentwickeln. Beide Länder
  haben seitdem gute Fortschritte in den Bereichen der Datenschutzregeln, der Datensouveränität,
  der digitalen Gemeingüter, der KI -Taskforce im Hinblick auf digitale Souveränität
  sowie der Förderung von KI -Innovation erzielt. Bundesminister Wildberger dazu:
  „Ich glaube, es ist im letzten Jahr schon einiges passiert, aber wir müssen das
  noch weiter beschleunigen. In Fragen der Regulierung brauchen wir noch mehr Freiraum
  für Innovation.“'
