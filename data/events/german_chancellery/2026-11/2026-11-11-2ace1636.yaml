title: Übergabe des Jahresgutachtens 2026/2027 des Sachverständigenrates Wirtschaft
  Verlässliches Wachstum und solide Staatsfinanzen für die junge Generation
text: 'Bundeskanzler Merz dankte dem Sachverständigenrat bei der Übergabe des Jahresgutachtens
  für „den Rat und auch für Ihre mahnende Stimme“. Die Vorsitzende des Sachverständigenrates
  zur Begutachtung der gesamtwirtschaftlichen Entwicklung (SVR), Monika Schnitzer,
  hat Bundeskanzler Friedrich Merz das Jahresgutachten 2026/27 zur wirtschaftlichen
  Entwicklung übergeben. Verlässliches, dynamisches Wachstum und solide Finanzen hätten
  für die Bundesregierung Priorität, bekräftigte der Bundeskanzler bei der Übergabe.
  „Wir sind es insbesondere der jungen Generation schuldig, dass wir auf einen Konsolidierungskurs
  gehen, der auch den europäischen Vorgaben entspricht, über die wir schon mehrfach
  gesprochen haben“, sagte Merz. Finden Sie hier das gesamte Jahresgutachten 2026/27
  des Sachverständigenrates zur Begutachtung der gesamtwirtschaftlichen Entwicklung.
  Vielen Dank, Frau Professorin Schnitzer, Ihnen und auch den weiteren Mitgliedern
  des Sachverständigenrates! Auch einen besonderen Dank an die Mitarbeiterinnen und
  Mitarbeiter in ihren Stäben für die Arbeit, die sie mit dem Gutachten geleistet
  haben! Herzlichen Dank für die gute Botschaft, die Sie mitbringen! Mit der Wirtschaft
  in Deutschland geht es langsam wieder aufwärts. Sie haben auch Ihre eigenen Erwartungen
  noch einmal nach oben korrigiert, auf rund ein Prozent. Angesichts der vielen Krisen
  in Deutschland war nicht unbedingt zu erwarten, dass wir das hinbekommen. Im kommenden
  Jahr soll sich der Aufschwung nach Ihrer Einschätzung fortsetzen. Das sind ermutigende
  Signal für die Unternehmen, aber auch für die privaten Haushalte in ganz Deutschland.
  Sie beschäftigen sich – Sie haben es gerade gesagt – schwerpunktmäßig mit der Finanzpolitik.
  Wir begrüßen sehr, dass Sie das tun. Sie fordern von der Bundesregierung eine solide
  Haushaltspolitik und einen Fokus auf stabile Staatsfinanzen. Wir teilen diese Einschätzung.
  Wir in der Bundesregierung verfolgen einen Kurs, der dem entspricht, wissend, dass
  wir im Augenblick eine ganze Reihe von Herausforderungen zu bestehen haben, die
  wir auch finanzieren müssen. Deutschland ist das einzige Land unter den G7 -Staaten,
  das noch über ein AAA-Rating verfügt. Ich will, dass das so bleibt, und ich bin
  mir mit den Kolleginnen und Kollegen in der Bundesregierung einig darin, dass wir
  alles dafür tun müssen, dass das so bleibt. Wir nehmen jährliche Einsparungen beim
  Personal vor. Dazu gehören auch Kürzungen bei Subventionen und Finanzhilfen, und
  dazu gehören auch die Strukturreformen in den sozialen Sicherungssystemen, die ich
  kurz ansprechen will. Denn wir wollen insbesondere in der Rentenversicherung auf
  ein neues Konzept umstellen. Wir wollen das noch in diesem Jahr im Kabinett beschließen.
  Wir wissen gleichzeitig, dass wir die Funktionsfähigkeit unseres Staates auf allen
  Ebenen und in all seinen Facetten auch zukünftig sicherstellen müssen. Wir brauchen
  dafür ein verlässliches, tragfähiges und dauerhaftes Wachstum unserer Volkswirtschaft.
  Gleichwohl bleibt richtig, dass wir diese Wachstumsraten allein nicht bekommen werden,
  um die Defizite auszugleichen, die wir haben. Wir sind es insbesondere der jungen
  Generation schuldig, dass wir auf einen Konsolidierungskurs gehen, der auch den
  europäischen Vorgaben entspricht, über die wir schon mehrfach gesprochen haben.
  Wir haben Wettbewerbsfähigkeit und Wachstum unserer Volkswirtschaft zur Priorität
  gemacht. Deswegen haben wir das Sondervermögen Infrastruktur und Klimaneutralität
  aufgesetzt. Deswegen haben wir auch so viel in der Bundeswehr zu finanzieren. Deswegen
  haben wir auch so viel für die Modernisierung unserer Infrastruktur zu tun. Wir
  wissen das, und wir werden uns deswegen sehr genau mit Ihrem Gutachten beschäftigen.
  Wir haben ja schon eine Vorabversion bekommen und sind auf die wesentlichen Punkte
  Ihres Gutachtens vorbereitet gewesen. Aber ich will es noch einmal ausdrücklich
  sagen: Wir haben für diese Legislaturperiode eine Modernisierungsagenda für den
  Bund, aber auch für die Länder aufgesetzt. Wir stehen im Augenblick ‑ das sind nicht
  meine Worte, sondern die Worte einer Expertenkommission ‑ in der weitreichendsten
  Modernisierung unseres Staates auch im Hinblick auf die Digitalisierung. Ich bin
  dankbar dafür, dass Sie in Ihrem Gutachten eine etwas optimistischere Wachstumsprognose
  zugrunde legen. Das bestärkt uns auf diesem Weg. Ich bin mir sicher, dass wir auch
  noch zahlreiche weitere Hinweise aus dem Gutachten bekommen. Wir werden darüber
  sprechen. Abschließend will ich aber noch einmal sagen: Herzlichen Dank für die
  Arbeit, die Sie im Sachverständigenrat leisten! Herzlichen Dank auch für die zahlreichen
  Gespräche, die wir immer wieder führen! Herzlichen Dank für den Rat und auch für
  Ihre mahnende Stimme, die wir brauchen! Denn das Thema der Staatsfinanzen wird uns
  beschäftigen. Es wird uns im Übrigen nicht nur in Deutschland beschäftigen, sondern
  es wird uns auch in der Europäischen Union beschäftigen. Deswegen stehen wir in
  den nächsten Wochen und Monaten vor sehr weitreichenden finanzpolitischen Entscheidungen
  in Deutschland und in Europa. Sie wissen von mir, dass ich auf beiden Ebenen, sowohl
  in Deutschland als auch auf der europäischen Eben, Wert darauf lege, dass wir solide
  Staatsfinanzen haben und dass wir auf den Weg zurückkehren, der uns überhaupt erst
  Wachstum und Beschäftigung in diesem Umfang ermöglicht hat. Das waren einmal solide
  Staatsfinanzen. Insofern ist Ihre Botschaft angekommen. Herzlichen Dank dafür! Ich
  freue mich auf die weitere Diskussion.'
