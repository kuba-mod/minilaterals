title: Im Kabinett beschlossen Neue Gasreserve zur Krisenvorsorge
text: Die Bundesregierung schafft gesetzliche Voraussetzungen für eine strategische
  Gasreserve. Aktuell ist die Gasversorgung für Unternehmen und Haushalte in Deutschland
  sicher. Die Auswirkungen des Iran-Nahost-Konflikts bereiten vielen Menschen Sorgen,
  zunächst vor allem wegen der hohen Energiepreise. Die aktuelle Versorgung mit Gas
  ist gewährleistet und die Bundesregierung sorgt dafür, dass sie auch über den Winter
  sicher bleibt. Doch auch die breiter aufgestellte Energieversorgung kann Deutschland
  nicht vor künftigen außergewöhnlichen Ereignissen wappnen, wie Sabotage oder gezielten
  Angriffen auf die Infrastruktur. Die Gasreserve soll „zur Verfügung stehen, wenn
  Lieferausfälle an der Tagesordnung sind“, um zu „verhindern, dass aus einer Unterversorgung
  eine tatsächliche Krise wird. Dann brauchen wir Gasmengen, die sicher sind“, erklärte
  Bundeswirtschaftsministerin Reiche zum Kabinettsbeschluss. Die strategische Gasreserve
  versichere nicht gegen hohe Preise, sondern gegen Krisensituationen, so die Ministerin.
  Die f ü r den deutschen Gasmarkt verantwortliche Trading Hub Europe (THE) soll die
  neue Gasreserve ab 2027 schnellstmöglich aufbauen. Die Bundesregierung schafft nun
  die gesetzlichen Voraussetzungen, um für den Winter 2027/28 vorbereitet zu sein,
  so die Bundeswirtschaftsministerin. Voraussetzung ist, dass die Bundesnetzagentur
  als Netzverteiler einen Notfall wegen einer drohenden Gasmangellage ausruft. Sie
  soll dann die Gasreserve einsetzen, um zu vermeiden, dass Industrieanlagen abgeschaltet,
  der Zugriff auf private Gasbestände oder Temperaturvorgaben für öffentliche und
  private Gebäude angeordnet werden müssen. Das sei ein wesentlicher Fortschritt bei
  der Krisenvorsorge, betonte Reiche. Die Gasreserve soll 24 Terawattstunden zusätzliches
  physisches Gas umfassen. Das entspricht etwa zehn Prozent der Kapazität der deutschen
  Gasspeicher. Damit kann eine landesweite Gasversorgung bei Ausfall der wichtigsten
  Importinfrastruktur für 30 Tage gesichert werden. Die zusätzliche Krisenvorsorge
  hat einen Preis, aber sie darf die Bürger finanziell so wenig wie möglich belasten.
  Daher soll die THE den Aufbau der vollständigen Reservemenge möglichst markt- und
  preisschonend über drei Jahre strecken. Die Umlage der jährlichen Kosten auf die
  Gasversorger und letztlich auf deren Kunden wird die Kilowattstunde (kWh) Gas um
  schätzungsweise 0,03 Cent bis 0,05 Cent verteuern. Der Gaspreis für einen Privathaushalt
  liegt derzeit bei durchschnittlich 11 bis 12 Cent pro kWh . Durch die Einführung
  der Umlage erhöhen sich die Gasbezugskosten für Haushaltskunden um 0,3 bis 0,5 Prozent.
  Individuell abhängig vom Jahresverbrauch wird die Umlage für private Haushalte voraussichtlich
  jährlich zwischen etwa vier und sieben Euro betragen. Die gesetzlichen Vorgaben
  für die Befüllung der deutschen Gasspeicher waren bei ihrer Einf ü hrung im Jahr
  2022 wichtig und richtig. Sie haben damals dazu beigetragen, die Versorgung aufgrund
  der weggefallenen Liefermengen aus Russland kurzfristig sicherzustellen. Diese F
  ü llstandsvorgaben laufen zum 31. M ä rz 2027 aus. Speicherfüllstände allein sind
  inzwischen nicht mehr entscheidend für die Versorgungssicherheit. Mit der strategischen
  Gasreserve schafft die Bundesregierung eine neue Grundlage, um auf k ü nftige Krisenereignisse
  rasch reagieren zu können. Die neue Gasreserve wird strikt vom Markt und der Wintervorsorge
  durch die Gasunternehmen getrennt. Derzeit ist die Gasversorgung trotz des Nahost-Konflikts
  gesichert, weil sie auf einer breiteren und flexibleren Grundlage als in der Vergangenheit
  steht. So kann kurzfristig durch Pipeline gas sowie nunmehr auch durch LNG (Flüssigerdgas)
  an die neuen Terminals in Deutschland sichergestellt werden, dass ausreichend Gas
  in Deutschland vorhanden ist. Die Gasunternehmen werden mit der neuen Gasreserve
  nicht aus ihrer Verantwortung für die Wintervorsorge entlassen. Sie sind weiter
  für die Erfüllung ihrer Lieferverpflichtungen und Verbrauchsmengen verantwortlich.
  Das gilt weiter auch für sehr kalte Winter. Die Bundesregierung will zudem ergänzende
  Maßnahmen ergreifen, um die Sicherheit der Erdgasversorgung zu erhöhen, auch wenn
  keine Gasmangellage droht. Dafür hat das Kabinett Eckpunkte beschlossen. Dazu gehört
  auch die Vorbereitung einer Lieferantenverpflichtung zur Absicherung der Wintervorsorge
  auf Basis einer künftigen EU -weiten Regelung.
