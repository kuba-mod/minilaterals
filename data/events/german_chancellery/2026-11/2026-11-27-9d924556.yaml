title: Bundesregierung aktuell
text: 'ein Haushalt ist das Schicksalsbuch der Nation, heißt es so abgedroschen wie
  korrekt. Man muss ergänzen: nicht nur der Nation, sondern auch des europäischen
  Kontinents. Wenn also in einer Woche das deutsche wie das europäische Zahlenwerk
  im Zentrum des politischen Betriebs stehen, dann ist Politik in all ihrer Intensität
  und Relevanz zu spüren. Denn schicksalhaft sollen sich die Haushaltsentscheidungen
  nicht auswirken. Die Budgets müssen fair, bezahlbar und mehrheitsfähig sein. Das
  Schicksal muss mit einem klugen Plan gesteuert werden. Schauen wir zunächst nach
  Deutschland: Der Weg zu einem Haushalt ist in der Regel mühsam und mit Kontroversen
  gepflastert. Dass Meinungsverschiedenheiten öffentlich ausgetragen werden, gehört
  zum Wesen einer Demokratie. Der Bundeskanzler hat am Mittwoch in seiner Rede im
  Bundestag dafür geworben, sich in diesen politischen Konflikten mit mehr „Grundwohlwollen“
  zu begegnen, im Vertrauen darauf, dass alle das Beste für das Land wollen. Die Struktur
  eines Bundeshaushalts hat sich in den vergangenen Jahren grundlegend verändert,
  weil sich die Anforderungen an den Staat verschoben haben. Deutschland muss mehr
  für seine Sicherheit tun, seine Infrastruktur modernisieren und sich in einem zunehmend
  schärferen Wettbewerb behaupten. Gleichzeitig stellt die Demographie die sozialen
  Sicherungssysteme vor erhebliche Herausforderungen. Was über viele Jahre vernachlässigt
  wurde, lässt sich nicht mit einem Fingerschnipsen korrigieren. Aber die Bundesregierung
  steuert um. Wir sehen erste positive Entwicklungen bei der Konjunkturprognose und
  den Exportzahlen, dem Anstieg der Unternehmensgründungen und der Innovationskraft
  der Wirtschaft. Der Bundeskanzler hat in seiner Rede im Deutschen Bundestag aber
  auch deutlich gemacht, dass der finanzielle Spielraum in den kommenden Jahren enger
  sein wird. Wir werden uns nicht mehr alles leisten können, was uns über viele Jahre
  selbstverständlich erschien. Deshalb müssen bestehende staatliche Ausgaben und Leistungen
  überprüft werden. Ein Jahresbudget zeichnet sich auch dadurch aus, dass es über
  die Jahresfrist hinaus angelegt ist, dass es also die Wirkung auf die nächsten Generationen
  nie aus den Augen verliert. Welche Ausgaben künftig Vorrang haben sollen, ist auch
  in Europa Gegenstand intensiver Verhandlungen. Parallel zum Bundeshaushalt wurde
  in Brüssel das EU-Budget verhandelt – eine nicht minder komplexe Aufgabe, weil das
  Budget für gleich sieben Jahre beschlossen wird. Das macht es nicht einfacher. Nachdem
  Kommission und Ratspräsidentschaft ihre Vorstellungen unterbreitet hatten, musste
  sich der Bundeskanzler aus deutscher Perspektive für eine deutliche Begrenzung der
  Ausgaben einsetzen. Deutschland ist ein Geberland, es zahlt also mehr in den Haushalt
  ein, als es auf den ersten Blick zurückerhält. Wichtig ist dabei aber auch die Einschränkung
  “auf den ersten Blick”: Deutschland profitiert von der europäischen Wirtschaftskraft,
  weil die wichtigsten Export- und Handelspartner nunmal die Nachbarn sind, und die
  Bundesregierung ein Interesse an einer stabilen und prosperierenden Nachbarschaft
  hat. In einem mehrjährigen Finanzrahmen will jedes EU-Mitglied seine nationalen
  Interessen berücksichtigt sehen. Das macht die Verhandlungen so komplex. Einige
  Länder wollen höhere EU-Gemeinschaftsschulden aufnehmen. Das lehnt die Bundesregierung
  ab. Andere wollen am liebsten alles beim Alten belassen und Subventionen wie Strukturmittel
  verlässlich erhalten. Deutschland geht einen anderen Weg: Die Bundesregierung will
  den Finanzrahmen unbürokratischer und flexibler gestalten, neue Finanzierungen etwa
  im Sinne der Wettbewerbsfähigkeit und der Verteidigung eröffnen, alte Zöpfe abschneiden
  oder zumindest kürzen. Diskutiert wird auch eine Digitalsteuer. Deutschland unterstützt
  grundsätzlich eine faire und international abgestimmte Lösung zur Besteuerung der
  digitalisierten Wirtschaft. Eine EU-weite Digitalsteuer erfordert allerdings eine
  gemeinsame Rechtsgrundlage, der alle Mitgliedstaaten zustimmen müssten. Deutschland
  finanziert fast ein Viertel des gesamten EU-Haushalts – eine Tatsache, die beim
  ersten Verhandlungsgipfel am Donnerstag in Brüssel manchmal aus den Augen zu geraten
  schien. Aber das ist nicht weiter verwunderlich. Eine altbekannte Brüsseler Weisheit
  sagt: Mindestens ein Gipfel muss scheitern, wenn dieser Haushalt gelingen soll.
  Fortsetzung also Mitte Dezember. Die Reallöhne waren im 3. Quartal 2026 um 1,3 Prozent
  höher als im Vorjahresquartal. Wir freuen uns über Ihr Feedback: Nutzen Sie bitte
  dafür das Kontaktformular (nicht die Antwortfunktion auf diese E-Mail).'
