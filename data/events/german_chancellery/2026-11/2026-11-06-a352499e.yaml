title: 'Staatsminister Weimer zum Gedenken an die Novemberpogrome: „Kein Platz für
  Antisemitismus -jüdisches Leben muss selbstverständlich und sicher sein“'
text: 'Staatsminister für Kultur und Medien, Wolfram Weimer, mahnt zum Jahrestag der
  Reichspogromnacht, das Erinnern an den 9. November 1938 sei kein Blick in die Vergangenheit,
  sondern Verpflichtung für Gegenwart und Zukunft. Antisemitismus und Hass dürften
  keinen Platz in unserer Gesellschaft haben. Staatsminister Weimer erklärte: „Die
  Novemberpogrome waren kein spontaner Ausbruch von Gewalt. Sie waren ein staatlich
  organisierter und gelenkter Terror, initiiert von einem Regime, das jüdische Menschen
  systematisch entrechtete, ausgrenzte und schließlich vernichten wollte. Zugleich
  offenbarten sie das Versagen einer Gesellschaft, in der zu viele schwiegen, wegschauten
  oder die Verbrechen unterstützten. Das Gedenken an den 9. November 1938 ist deshalb
  weit mehr als ein Blick in die Vergangenheit. Es verpflichtet uns für unsere Gegenwart
  und Zukunft. Gerade angesichts des zunehmenden Antisemitismus dürfen wir nicht vergessen,
  wohin Ausgrenzung, Menschenfeindlichkeit und Gleichgültigkeit führen können. Vielmehr
  müssen wir engagiert für eine Gesellschaft eintreten, in der jüdisches Leben selbstverständlich
  und sicher ist, in der die Menschenwürde unantastbar bleibt und in der Antisemitismus
  und Hass keinen Platz haben.“ In der Nacht vom 9. auf den 10. November 1938 wurden
  in ganz Deutschland mehr als 1.400 Synagogen in Brand gesetzt, tausende jüdische
  Geschäfte und Wohnungen zerstört, Friedhöfe geschändet, Menschen gedemütigt, misshandelt
  und ermordet. Zehntausende jüdische Männer wurden verhaftet und in Konzentrationslager
  verschleppt. Die Novemberpogrome markierten den Übergang von der seit 1933 betriebenen
  Diskriminierung und Ausgrenzung der jüdischen Bevölkerung zu ihrer systematischen
  Verfolgung.'
