title: Im Kabinett Rohstoffe für deutsche Wirtschaft sichern
text: 'Deutschlands Industrie benötigt viele Rohstoffe – im Mittelpunkt der strategischen
  Neuaufstellung steht daher die Priorisierung starker bilateraler Rohstoffpartnerschaften.
  Bundeswirtschaftsministerium, Auswärtiges Amt und das Bundesministerium für wirtschaftliche
  Entwicklung und Zusammenarbeit stellen gemeinsam die deutsche Rohstoffaußenpolitik
  strategischer auf. Ziel ist es, die Rohstoffversorgung der deutschen Wirtschaft
  zu sichern. Dafür setzt die Regierung auf bilaterale Rohstoffpartnerschaften, eine
  stärkere Verzahnung der Instrumente und Akteure und eine engere Einbindung der deutschen
  Wirtschaft. Die deutsche Wirtschaft benötigt zahlreiche Rohstoffe. Bei der Vorstellung
  der neuen Rohstoffaußenpolitik sagte Bundeswirtschaftsministerin Katherina Reiche:
  „Deutschlands industrielle Stärke hängt auch davon ab, dass unsere Unternehmen jederzeit
  Zugang zu den Rohstoffen haben, die sie für ihre Produktion brauchen.“ Die Wirtschaft
  wird weniger abhängig von einzelnen Lieferanten, wenn es mehr unterschiedliche Lieferwege
  und Lieferanten gibt, die Versorgung also diversifiziert wird. Das führt zu einer
  stabileren und damit resilienteren Aufstellung in der Rohstoffversorgung. Reiche
  stellte aber auch heraus: „Deshalb müssen wir heimische Rohstoffpotenziale besser
  nutzen und mehr Rohstoffe durch Recycling zurückgewinnen.“ Im Mittelpunkt der strategischen
  Neuaufstellung steht die Priorisierung starker bilateraler Rohstoffpartnerschaften
  sowie eine noch bessere Verzahnung vorhandener Instrumente und eine engere Einbindung
  der Wirtschaft. Das klare Ziel ist, gemeinsam Wertschöpfung zu schaffen und Zugang
  zu verlässlichen Lieferketten aufzubauen. Deutschland verfügt bereits über ein weltweites
  Netzwerk für die Zusammenarbeit im Rohstoffbereich. Es setzt sich zusammen aus den
  deutschen Auslandsvertretungen, aus den Auslandshandelskammern und Rohstoffkompetenzzentren,
  der Germany Trade & Invest (GTAI), der Kreditanstalt für Wiederaufbau (KfW) sowie
  der Bundesanstalt für Geowissenschaften und Rohstoffe (BGR) und der Deutsche Gesellschaft
  für Internationale Zusammenarbeit (GIZ) und weiteren Akteuren der Entwicklungszusammenarbeit.
  Für eine engere Zusammenarbeit dieser Akteure werden im Ausland zentrale Anlaufstellen
  für Rohstofffragen eingerichtet – für eine Koordination deutscher Aktivitäten vor
  Ort. Zudem bieten sie Partnerländern und deutschen Unternehmen einen zentralen Ansprechpartner,
  sollen Rohstoffprojekte bekannter machen, politisch einfacher flankieren und der
  deutschen Wirtschaft helfen, Geschäftskontakte auf- und auszubauen. Die Bundesregierung
  priorisiert ihre Zusammenarbeit mit rohstoffreichen Ländern künftig noch gezielter
  anhand der konkreten Bedarfe der deutschen Wirtschaft. Bestehende Partnerschaften
  mit Australien, Brasilien, Chile, Kanada und Südafrika sind dabei besonders wichtig
  und sollen gezielt vertieft werden. Bundesaußenminister Johann Wadephul betonte:
  „Seit dem ersten Tag arbeitet diese Bundesregierung daran, dass wir globale Partnerschaften
  ausbauen, um gerade bei der Rohstoffversorgung ein breiteres Fundament zu schaffen.
  Wir dürfen in einer so volatilen Weltlage, in der Rohstoffe und Seewege als Druckmittel
  eingesetzt werden, nicht von Einzelnen abhängig sein. Deshalb stelle ich das Thema
  der Rohstoffsicherheit auf vielen meiner Reisen rund um den Globus ins Zentrum.“
  Die Strategie nimmt darüber hinaus Länder in den Blick, deren Potenzial für die
  Rohstoffversorgung mittel- oder längerfristig erschlossen werden soll. Das unterstrich
  auch Bundesentwicklungsministerin Reem Alabali Radovan: „Eine sichere Rohstoffversorgung
  braucht verlässliche Partnerschaften. Partnerschaften, von denen beide Seiten profitieren.“
  Sie betonte, die Entwicklungszusammenarbeit helfe, dafür die Voraussetzungen zu
  schaffen und so nachhaltige, vielfältige Lieferketten zu stärken.'
