date: '2026-11-26'
type: press_release
source_name: german_chancellery
title: Pressekonferenz von Bundeskanzler Merz zur Sondersitzung des Europäischen Rates
  Solide Finanzen und klare Prioritäten
text: 'Europa müsse wirtschaftlich stark und verteidigungsfähig gemacht werden, forderte
  Kanzler Merz zum Ende der Sondertagung des Europäischen Rates. Die Staats- und Regierungschefs
  haben bei der außerordentlichen Tagung des Europäischen Rates in Brüssel intensiv
  über den Mehrjährigen Finanzrahmen der EU für die Jahre 2028 bis 2034 beraten. Eine
  Einigung konnte zum jetzigen Zeitpunkt noch nicht erzielt werden. Bundeskanzler
  Friedrich Merz verwies in der abschließenden Pressekonferenz auf weiterhin bestehende
  Differenzen zwischen den Mitgliedstaaten und bekräftigte die deutsche Position:
  Der EU -Haushalt dürfe „nicht übermäßig wachsen“, Lasten müssten fair verteilt werden.
  Trotz schwieriger Verhandlungen zeigte sich der Kanzler hoffnungsvoll, noch in diesem
  Jahr einen Kompromiss erreichen zu können. Zu Beginn der Pressekonferenz hatte Bundeskanzler
  Merz die scheidende Präsidentin der Europäischen Zentralbank, Christine Lagarde,
  für ihre fast siebenjährige Amtszeit gewürdigt. Lagarde habe die EZB „in nicht ganz
  einfachen Zeiten erfolgreich geführt“ und entscheidend dazu beigetragen, Preisstabilität
  und Vertrauen in den Euro zu sichern. Besonders hob Merz hervor, dass die Europäische
  Zentralbank ihr zentrales Mandat erfüllt habe: „Wir haben eine stabile europäische
  Währung, und dafür hat Christine Lagarde in den letzten sieben Jahren die Verantwortung
  erfolgreich getragen.“ Für ihren Einsatz und die enge Zusammenarbeit sprach er ihr
  den ausdrücklichen Dank der Bundesregierung aus. Meine Damen und Herren, herzlich
  willkommen! Wie beim regulären Europäischen Rat im Oktober verabredet, haben wir
  heute begonnen, über die zukünftigen Finanzen der Europäischen Union und den Mehrjährigen
  Finanzrahmen ab 2028 zu beraten. Bevor wir das heute Morgen getan haben, haben wir
  zum letzten Mal die Präsidentin der Europäischen Zentralbank zu Besuch gehabt. Sie
  hat noch einmal aus ihrer Sicht die Lage der Eurozone beschrieben. Wir haben uns
  bei ihr sehr herzlich für ihre Arbeit bedankt – fast sieben Jahre als Präsidentin
  der Europäischen Zentralbank. Ich will diesen Dank, den ich heute Morgen ausgedrückt
  habe, auch hier wiederholen. Christine Lagarde hat die Europäische Zentralbank in
  nicht ganz einfachen Zeiten erfolgreich geführt. Vor allem hat sie das erreicht,
  was das Mandat der Europäischen Zentralbank ist, nämlich die Inflationsrate im Euroraum
  niedrig zu halten. Das ist ihr besser gelungen als manch anderer Zentralbank in
  der Welt. Insofern haben wir uns sehr herzlich bei ihr bedankt. Ich will das noch
  um einen sehr persönlichen Dank ergänzen: Wir haben sehr, sehr gut und eng zusammengearbeitet,
  wann immer dies notwendig war, auch mit Rat und Tat, bei natürlich voller Wahrung
  der Unabhängigkeit des Mandates. Aber ich muss sagen: Ich habe die Begegnungen und
  die Gespräche mit ihr immer als sehr angenehm empfunden. Ich darf auch im Namen
  der ganzen Bundesregierung sagen – auch wenn ihr Mandat erst am 7. Februar endet;
  heute war aber die letzte Gelegenheit, sie im Europäischen Rat zu treffen –: Wir
  sind ihr alle sehr dankbar, und ich bin es persönlich auch. Es war eine sehr gute
  Präsidentschaft der Europäischen Zentralbank. Und da diese Bank in Deutschland,
  in Frankfurt, ihren Sitz hat, wie Sie alle wissen, darf ich auch sagen: Christine
  Lagarde hat mit der Europäischen Zentralbank auch das Vertrauen der Bevölkerung
  in den Euro gestärkt. Wir haben eine stabile europäische Währung, und dafür hat
  Christine Lagarde in den letzten sieben Jahren die Verantwortung erfolgreich getragen.
  Dafür haben wir alle ihr – wie ich finde, zu Recht – heute Morgen gedankt. Wir haben
  dann intensiv und nicht weniger lange als erwartet über den nächsten Finanzrahmen
  beraten. Wir müssen feststellen, dass die Vorstellungen darüber, wie wir ihn gestalten
  sollen, noch weit auseinanderliegen. Das ist für diesen Verhandlungsstand nicht
  weiter überraschend. Wir alle wissen, dass es Zeit und viel guten Willen braucht,
  um die weit auseinanderliegenden Vorstellungen zusammenzubringen. Von meiner bzw.
  von unserer Seite aus leiten uns bei den Verhandlungen zwei grundsätzliche Überlegungen.
  Zum einen: Um die öffentlichen Finanzen ist es in allen Mitgliedstaaten nicht zum
  Besten bestellt. Wir müssen alle darauf achten, dass unsere Haushalte abgeschlossen
  werden können. Deswegen dürfen wir auch auf der europäischen Ebene keine Versprechungen
  machen, die wir nicht bezahlen können. Das hat schließlich auch etwas mit dem Verschuldungsstand
  in Europa zu tun. Wir müssen und wir werden auf die Stabilität unserer Währung achten.
  Das ist der Auftrag von Christine Lagarde , auf den sie uns heute Morgen auch noch
  einmal hingewiesen hat; denn übermäßige Verschuldung gefährdet nicht nur den Euro,
  sondern sie gefährdet auch die europäische Souveränität. Wir verhandeln zweitens
  über einen Haushalt in völlig neuen Zeiten. Wir müssen Europa wirtschaftlich stark
  machen, und wir müssen es auch verteidigungsfähig machen – vor allen Dingen im Schatten
  der größten äußeren Bedrohung, der Europa ausgesetzt ist, nämlich dem Krieg in der
  Ukraine und der Gefährdung unserer gesamten öffentlichen Sicherheit. Wir sind deswegen
  heute noch nicht zu einem Abschluss gekommen. Noch einmal: Das ist nicht überraschend.
  Das habe ich nicht anders erwartet. Aber vielleicht gebe ich Ihnen noch einmal die
  wesentlichen Punkte, die für mich bei den weiteren Beratungen entscheidend sind.
  Zum Ersten sollte das Gesamtvolumen nicht übermäßig wachsen. Europa braucht auch
  bei der Gestaltung des eigenen Haushaltes Augenmaß. Der Haushalt kann deswegen nicht
  unbegrenzt wachsen. Die Lasten dieses Haushaltes müssen auch fair verteilt sein.
  An der Stelle sind wir noch nicht. Zum Zweiten sind Korrekturen der Beiträge zwingend.
  Das ist eine Frage der Fairness. Deutschland bezahlt ja rund ein Viertel des europäischen
  Budgets. Aber wir bekommen nur rund acht Prozent der Mittel auch unmittelbar zurück.
  Bei den sogenannten Kohäsionsmitteln ist es sogar noch weniger. Deswegen müssen
  die Beitragskorrekturen beibehalten werden. Zum Dritten müssen die Prioritäten stimmen.
  Das habe ich schon kurz angesprochen. Europa muss eben seine Wirtschaft stärken
  und die Sicherheit gewährleisten. Dazu braucht es auch eine Reserve, zum Beispiel
  um die Ukraine langfristig finanzieren zu können. Daran müssen sich auch alle beteiligen.
  Die Entscheidungen müssen dann später mit qualifizierter Mehrheit getroffen werden
  können. Neue Eigenmittel – das ist vielleicht der vierte Punkt; über ihn haben wir
  intensiv gesprochen – lösen das Problem nicht wirklich, denn sie schaffen eben nicht
  ausreichend neues Geld für die Europäische Union. Diesbezüglich dürfen wir keine
  Illusionen haben. Wir diskutieren über neue Eigenmittel. Aber es wird nur einen
  sehr kleinen Teil des zukünftigen europäischen Haushaltes ausmachen. Schließlich
  noch einmal: Auch Europa braucht solide Finanzen und keine neuen Schulden. Wir haben
  uns bereits mit NextGenerationEU und der Ukrainehilfe massiv verschuldet. Ich will
  hier einfach nur einmal die Zahlen sagen: Auf dem nächsten Mehrjährigen Finanzrahmen
  werden in diesen sieben Jahren Zinsen von über 150 Milliarden Euro lasten. Das ist
  sehr viel. Deswegen dürfen wir uns auch nicht weiter verschulden. Wir verlieren
  sonst unsere Handlungsfähigkeit. Wenn wir uns auf Grundlage dieser eigentlich sehr
  einfachen Prinzipien annähern, dann bin ich zuversichtlich, dass uns eine Einigung
  noch in diesem Jahr gelingen wird. Ich werde jedenfalls von meiner Seite aus alles
  tun, um das auch zu erreichen. Im nächsten Jahr sind in einer ganzen Reihe von großen
  und mittleren europäischen Ländern Wahlen. Es wird also für die Kolleginnen und
  Kollegen im Europäischen Rat nicht einfacher, zu einem späteren Zeitpunkt einen
  neuen Mehrjährigen Finanzrahmen zu verabschieden. Deswegen sollten wir alle darum
  bemüht sein und sind wir alle auch darum bemüht, bis zum Ende des Jahres den Abschluss
  zu finden. Wir richten uns also auf eine relativ intensive Ratssitzung vom 17. Dezember
  an ein. Dann müssen wir schauen, dass es uns gelingt. Ich bin mir nicht sicher,
  aber ich gebe die Hoffnung nicht auf, dass wir es hinbekommen. Frage: Herr Merz,
  ich bin ein bisschen darüber verwirrt, wie es hier heute Abend vom Prozedere her
  abläuft. Es gibt noch Gespräche von Herrn Costa. Das heißt, es gibt noch eine Plenarrunde.
  Dann gehen erst Herr Stocker, dann Herr Macron und jetzt Sie heraus und erklären
  das Scheitern. Untergraben Sie damit nicht in gewisser Weise die Verhandlungsführung
  von Costa? Bundeskanzler Merz: Nein, gut, dass Sie das noch einmal ansprechen. Das
  kann ich vielleicht schnell aufklären: Wir haben schon am frühen Abend verabredet,
  dass wir morgen nicht fortsetzen werden, sondern dass wir heute Abend gegen 12 Uhr
  noch einmal, zu einer abschließenden Runde, zusammenkommen werden. Aber wir wissen,
  dass wir heute Abend nicht zu einem Ergebnis kommen werden, weil für ein Ergebnis
  einfach noch viel zu viele Vorarbeiten geleistet werden müssten. Deswegen war es
  auch mit mein Vorschlag, dass wir heute Abend bis spät in den Abend hinein die Einzelgespräche
  führen, die António Costa gern führen wollte. Ich habe auch an zweien dieser Runden
  teilgenommen. Aber wir haben gesagt, dass wir gegen Mitternacht die letzte Runde
  machen werden. Dann werden wir den Tag damit auch abschließen, werden morgen nicht
  fortsetzen, sondern werden am 17. Dezember fortsetzen. Es war auch der Wunsch von
  António Costa, so vorzugehen, mit diesen Einzelgesprächen in kleinen Gruppen. Die
  Gespräche finden im Augenblick statt. Deswegen ist es ein Verfahren, das wir genauso
  verabredet haben. Zusatzfrage: Aber es ist doch normalerweise eigentlich das Prä
  des Präsidenten, dann darüber zu informieren, wie die Verhandlungen gelaufen sind.
  Ich frage mich schon, ob nicht seine Verhandlungsposition untergraben wird, durch
  die ganzen ‑ ‑ ‑ Bundeskanzler Merz: Nein, noch einmal: Wir haben verabredet, dass
  wir heute Abend noch einmal über Eckpunkte reden, über Landezonen, wie es so schön
  heißt. Aber diese sind auch noch nicht verabredet. Wir wissen, dass wir heute nicht
  zu einem Abschluss kommen werden. Deswegen ist es richtig, dass wir jetzt auch sagen:
  Wir tauschen die Positionen aus. Wir sehen, dass sie noch ziemlich weit auseinander
  liegen. Aber wir werden heute Abend gegen Mitternacht abschließen. – Ich wollte
  Sie bis dahin nicht warten lassen. Es wird auch bis Mitternacht keine weiteren,
  neuen Ergebnisse geben, sondern es wird von seiner Seite aus noch einmal eine Zusammenfassung
  der Gespräche geben. Dann werden wir gegen Mitternacht auseinandergehen. Vielleicht
  wird es ein Uhr, aber viel später dann hoffentlich nicht. Morgen werden wir nicht
  weitermachen, sondern wir werden uns am 17. Dezember wieder treffen. So ist das
  Verfahren verabredet. Frage: Herr Bundeskanzler, Sie haben heute Morgen gesagt,
  dass man beim MFR noch ganz am Anfang stehe. Ist das jetzt nach zwölf Stunden der
  Verhandlungen immer noch so, oder sehen Sie irgendeine Stelle, an der es spürbare
  Fortschritte gegeben hat? Zum weiteren Verfahren: Präsident Macron hat eben noch
  einmal gesagt, dass er es zwingend für nötig hält, dass man noch in diesem Jahr
  zu einem Abschluss kommt, weil man ansonsten erst nach den französischen Präsidentschaftswahlen
  weiter verhandeln könnte. Sehen Sie das auch so? Bundeskanzler Merz: Herr Kollege,
  das sehe ich auch so. Das habe ich auch mit EmmanuelMacron in den letzten Tagen
  noch einmal besprochen. Es ist so: Wir sollten versuchen, in der Tat in diesem Jahr
  zu einem Abschluss zu kommen. Wir haben ja vom 17. Dezember an dann auch zunächst
  einmal zwei Tage eingeplant. Das kann auch länger werden. Weihnachten wollen wir
  alle zu Hause sein. Aber wir haben dann auch Zeit, hier die notwendigen Gespräche
  zu führen. Ich denke, es wäre gut für Europa, wenn wir es hinbekommen, und ich teile
  die Einschätzung, dass wir alles versuchen sollten, es auch zu schaffen. Sind wir
  in Stück weiter? Ja und nein. Wir versuchen, einmal zu definieren, in welche Richtung
  es geht. Ich glaube, ich darf das sagen: Es gibt durchaus Bewegung in Richtung einer
  weiteren Reduzierung dieser sogenannten Verhandlungsbox. Es war ja ein Vorschlag
  von Costa, 204 Milliarden Euro weniger gegenüber dem Kommissionsvorschlag vorzuschlagen.
  Das wird nicht bei 204 Milliarden Euro bleiben. Das wird noch weniger werden. Wie
  viel es dann wird, ist offen. Aber ich habe meine Position ja immer genannt: Es
  müssen mehrere Hundert Milliarden Euro weniger gegenüber dem Kommissionsvorschlag
  erreicht werden, jetzt einmal rein nominal betrachtet. Mit 200 Milliarden Euro liegt
  man schon an der untersten Grenze der mehreren Hundert Milliarden, aber dabei wird
  es nicht bleiben. Frage: Herr Bundeskanzler, der französische Präsident hat sich
  vor einer halben Stunde als Brückenbauer in diesen Verhandlungen beschrieben. Haben
  Sie ihn an diesem Abend auch so wahrgenommen? Bundeskanzler Merz: Der französische
  Präsident nimmt wie auch alle anderen Staats- und Regierungschefs die Interessen
  seines Landes wahr. Ich tue das auch. Insofern sind wir 27 Brückenbauer, die wir
  gemeinsam eine Lösung für Europa wollen, und darin sind wir uns einig. Frage: Zur
  Ukrainehilfe: Sind Sie zuversichtlich, dass es eine Lösung dafür geben kann, dass
  diese Staaten eben noch zustimmen können, möglicherweise, indem sie durch diesen
  Kredit nur zivile Hilfen mitfinanzieren? Ist das ein Brückenweg? Hinsichtlich des
  Themas der Ukraine wird ja in diesen Tagen auch sehr viel über den Artikel 5 gesprochen.
  Nun ist auch von amerikanischer Seite zu hören – das war heute Abend vielleicht
  nicht direkt ein Thema, aber trotzdem hängt es ja damit zusammen –, dass amerikanische
  Truppen wohl nicht in der Ukraine stationiert werden oder dort mithelfen sollen.
  Das sorgt ja für viel Friktion. Auch Jared Kushner hat gesagt, Artikel 5 könne man
  nur ganz lose definieren. Das scheint Selenskyj ja nicht zu befriedigen. Glauben
  Sie also, dass es diese amerikanischen Truppen in der Ukraine braucht, damit das
  eine wirksame Sicherheitsgarantie ist? Bundeskanzler Merz: Ich will zunächst einmal
  sagen, dass ich mit großer Freude gesehen bzw. gelesen habe, dass sich Präsident
  Trump heute an Russland gewandt hat und Putin aufgefordert hat, die Kampfhandlungen
  zu beenden. Es ist gut, dass er das tut. Damit nimmt er eine klare Position ein,
  die wir alle teilen. Wir haben schon seit langer Zeit mit den Amerikanern und mit
  den Europäern ein Einvernehmen darüber erzielt, dass die Ukraine nach einem Waffenstillstand,
  während der Friedensverhandlungen und vor allem nach einem Friedensabkommen dauerhafte
  Sicherheitsgarantien braucht. Wir haben das in der letzten Woche – am Donnerstag,
  als ich die Koalition der Willigen nach Berlin eingeladen habe – ja auch so formuliert,
  nämlich als Artikel-5-ähnliche Sicherheitsgarantien, und darüber sind wir uns in
  der Koalition der Willigen auch mit den Amerikanern einig. Darüber zu sprechen,
  wie das dann im Einzelnen konkret aussieht, dafür ist es heute viel zu früh. Zusatzfrage:
  ( ohne Mikrofon; akustisch unverständlich ) Bundeskanzler Merz: Ja, wir haben in
  der Tat auch darüber gesprochen. Es gibt nach wie vor keine Einigung. Es gibt aber
  Hinweise darauf, dass der eine oder andere von denen, die bis jetzt etwas zögerlich
  sind, die Ukrainehilfe aus dem EU -Budget zu finanzieren, Ideen hat, wie man das
  auch verteilen kann, wie man da möglicherweise auch den innenpolitischen Notwendigkeiten
  entsprechen kann. Ich bleibe bei meiner Position, dass die Hilfe für die Ukraine
  von der gesamten Europäischen Union getragen werden muss. Aber darüber müssen wir
  dann auch heute Abend noch sprechen – ich werde darüber auch jetzt noch mit dem
  einen oder anderen sprechen –, und darüber werden wir dann sicherlich auch im Dezember
  noch einmal sprechen müssen.'
