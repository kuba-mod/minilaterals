title: Bundeskanzler Merz bei der informellen Tagung des Europäischen Rates in Dublin
  Künstliche Intelligenz, EU-Haushalt und Ukraine
text: „Die Unterstützung der Ukraine ist und bleibt im Interesse aller Europäer“,
  so Bundeskanzler Merz in Dublin. Aktuelle Entwicklungen im russischen Angriffskrieg
  gegen die Ukraine bestimmten die Gespräche in Dublin. Man habe bei den Friedensverhandlungen
  „gewisse Fortschritte“ gemacht, sagte der Kanzler in seinem Statement. Europa sitze
  künftig mit am Tisch. Über eine geeinte EU -Position im Rahmen der Verhandlungen
  wolle man, ebenso wie über die Ukraine-Finanzierung, in der kommenden Woche weiter
  beraten. Dann trifft sich die Koalition der Willigen in Berlin. Am Rande der Treffen
  nutzte der Bundeskanzler auch die Gelegenheit, mit EU -Partnern über den nächsten
  MFR zu sprechen. Für seine Verknüpfung des EU -Haushaltes mit der kollektiven Ukraine-Finanzierung
  bekam Kanzler Merz viel Zuspruch. Die europäische Sicherheit ist für die Bundesregierung
  eng mit der Verteidigung der Ukraine verbunden. Als eine der Prioritäten im nächsten
  MFR sollte europäische Sicherheitspolitik auch von allen EU -Mitgliedern „solidarisch“
  getragen werden, so der Kanzler. Für die Finanzierung der Ukraine als gemeinsame
  Aufgabe aller Mitgliedsstaaten machte sich der Kanzler daher auch beim Treffen in
  Dublin stark. Am Donnerstag, dem 12. November, nahm der Kanzler in Dublin bereits
  am Treffen der Europäischen Politischen Gemeinschaft teil. Finden Sie hier weitere
  Informationen. Zu Beginn der Sitzung berieten die EU -Mitgliedsstaaten zudem über
  Chancen und Risiken von KI . Der Kanzler setzt sich dafür ein, technologische Entwicklungen
  in Europa wieder schneller, besser, souveräner und resilienter zu gestalten. Dazu
  gehört einerseits, die Potenziale von KI im Sinne der europäischen Wettbewerbsfähigkeit
  zu nutzen. Andererseits muss ihr verantwortungsvoller und sicherer Einsatz gewährleistet
  sein. Eine starke EU -weite Zusammenarbeit ist entscheidend für die Erreichung beider
  Ziele. Die regulären Treffen des Europäischen Rates , dem Gremium der Staats- und
  Regierungschefs der Europäischen Union, werden ergänzt durch „informelle“ Tagungen.
  Bei den Treffen wird in der Regel auf offizielle Schlussfolgerungen verzichtet.
  Sie bieten aber eine weitere Möglichkeit für die Mitgliedsstaaten, aktuell drängende
  Themen zu erörtern, die zusätzliche Beratungszeit erfordern.
