title: Europa verstehen Was ist die Europäische Politische Gemeinschaft?
text: 'Das Gründungstreffen der Europäischen Politischen Gemeinschaft fand am 6. Oktober
  2022 in Prag statt. Die Europäische Politische Gemeinschaft ( EPG ) ist eine Plattform
  für die politische Koordination zwischen den europäischen Ländern. Das Forum steht
  allen Ländern in Europa offen, die die Werte der EU teilen. Die Europäische Politische
  Gemeinschaft hängt nicht mit der Europäischen Union und nicht mit dem Europarat
  zusammen, sondern ist ein informelles Format. Eingeladen sind zu dem Treffen am
  13. November in Dublin die 27 EU-Länder sowie die Staaten des Westlichen Balkans
  (Bosnien und Herzegowina, Kosovo, Montenegro Nordmazedonien, Serbien, Albanien),
  Ukraine, Moldau, Georgien, die Staaten der Europäischen Freihandelsassoziation (Island,
  Liechtenstein, Norwegen, Schweiz), Großbritannien, Armenien, Aserbaidschan, Türkei,
  Andorra, Monaco und San Marino. Außerdem werden die Spitzen von Europäischem Rat
  (als Ko-Gastgeber), Europäischer Kommission , Europäischem Parlament und die Hohe
  Vertreterin sowie die Generalsekretärinnen und -sekretäre des Europarats , der NATO
  und der OSZE teilnehmen. Auch der kanadische Premierminister Mark Carney wird dabei
  sein. Russland und Belarus sind nicht eingeladen. Der französische Präsident Emmanuel
  Macron hatte den Vorschlag einer Europäischen Politischen Gemeinschaft bei seiner
  Rede zur Abschlussveranstaltung der Zukunftskonferenz am 9. Mai 2022 im Europäischen
  Parlament präsentiert. Das erste Treffen der EPG fand am 6. Oktober 2022 in Prag
  statt. Der weiterhin andauernde russische Angriffskrieg gegen die Ukraine zeigt:
  Eine wertebasierte, gut koordinierte Außenpolitik ist die Voraussetzung für ein
  geopolitisches Europa. Dafür muss sich die EU breiter aufstellen. Das tut sie mit
  regelmäßigen Treffen der Staats- und Regierungschefinnen und -chefs aller europäischen
  Länder im Forum der Europäischen Politischen Gemeinschaft: im Austausch zwischen
  EU -Mitgliedsstaaten und Ländern, die nicht Mitglied der Europäischen Union sind.
  Die EPG will den politischen Dialog und die Zusammenarbeit im gesamteuropäischen
  Interesse fördern. Ziel ist es dabei, Sicherheit, Stabilität und Wohlstand auf dem
  europäischen Kontinent zu stärken. Die EPG ersetzt keine bestehenden Organisationen,
  Strukturen oder Prozesse und soll zu diesem Zeitpunkt auch keine neuen schaffen.
  Sie ist insbesondere kein Ersatz für den EU -Beitrittsprozess. Das Forum trifft
  sich ein- bis zweimal pro Jahr. Irland wird am 13. November 2026 Gastgeber des neunten
  Treffens der EPG sein. Die Tagungen der EPG werden abwechselnd von jedem teilnehmenden
  Land organisiert, wobei der Gastgeber abwechselnd ein EU - und ein Nicht- EU -Mitgliedsstaat
  sein soll.'
