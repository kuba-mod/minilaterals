title: Sitzung des Nationalen Sicherheitsrates im November 2026
text: Der Nationale Sicherheitsrat ist heute unter dem Vorsitz des Bundeskanzlers
  zusammengetreten. Der Nationale Sicherheitsrat tauschte sich über die Verteidigungsplanungen
  der NATO und den deutschen Beitrag im Rahmen der Gesamtverteidigung aus. Er befasste
  sich mit dem materiellen Aufwuchs der Bundeswehr. Dabei betonte er die Notwendigkeit
  eines weiteren Aufwuchses unbemannter Systeme in allen Dimensionen, der Drohnenabwehrfähigkeit
  und Luftverteidigung sowie weitreichender Waffensysteme. Dies schließt die verantwortungsvolle
  militärische Nutzung von KI-Systemen ein. Ferner unterstrich er die Bedeutung einer
  skalierbaren, international wettbewerbsfähigen, technologisch innovativen und kooperationsfähigen
  nationalen und europäischen rüstungsindustriellen Basis. Der Nationale Sicherheitsrat
  befasste sich mit der veränderten Sicherheitslage im Weltraum und den sicherheitspolitischen
  Prioritäten deutscher Weltraumpolitik. Er zog Bilanz zum Umsetzungsstand der Weltraumsicherheitsstrategie
  und beschloss, die Weltraumsicherheitsarchitektur durch Raumfahrtforschung und ­-entwicklung
  weiter zu stärken. Daneben setzte der Nationale Sicherheitsrat den Ausbau der Krisenreaktionsfähigkeit
  der Bundesregierung – auch unter Berücksichtigung aktueller Entwicklungen in der
  KI-Sicherheit – fort. Er indossierte den Bericht der KI- Taskforce der Bundesregierung,
  der anlässlich des Digitalgipfels am 2./3. November 2026 veröffentlicht wurde. Außerdem
  befasste er sich mit dem rechtlichen Rahmen nachrichtendienstlicher Tätigkeit. Er
  verständigte sich auf eine Prüfung der Regeln für die Nebentätigkeiten im Beamten-
  und Soldatenverhältnis sowie die Tätigkeiten nach Eintritt in den Ruhestand oder
  für die Zeit nach dem Ausscheiden aus einem Beamten- und Soldatenverhältnis. Schließlich
  hat sich der Nationale Sicherheitsrat mit den gewaltsamen Ausschreitungen vom vergangenen
  Wochenende befasst und den Einsatzkräften für ihre Arbeit gedankt.
