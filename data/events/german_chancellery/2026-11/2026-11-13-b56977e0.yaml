title: Bundeskanzler Merz lädt zu Treffen der „Koalition der Willigen“ am 19. November
  in Berlin ein
text: Bundeskanzler Friedrich Merz lädt gemeinsam mit Frankreichs Präsident Emmanuel
  Macron und dem britischen Premierminister Andy Burnham für Donnerstag, 19. November
  2026, zu einem Treffen der „Koalition der Willigen“ nach Berlin ein. Das Gipfeltreffen
  im Bundeskanzleramt steht unter dem Motto „United for Peace in Ukraine and European
  Security“. Im Mittelpunkt des Treffens werden die Abstimmung zu laufenden diplomatischen
  Bemühungen, Sicherheitsgarantien für die Ukraine nach dem Krieg und die weitere
  Unterstützung der Ukraine stehen. Deutschland nimmt als größter Unterstützer der
  Ukraine seine Verantwortung wahr. Unsere Unterstützung ist im deutschen und im europäischen
  Interesse, denn der Ausgang dieses Krieges wird die Sicherheit Europas auf lange
  Sicht prägen. Gemeinsames Ziel der „Koalition der Willigen“ bleibt ein gerechter
  und dauerhafter Frieden für die Ukraine.
