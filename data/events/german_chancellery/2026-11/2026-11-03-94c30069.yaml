date: '2026-11-03'
type: press_release
source_name: german_chancellery
title: Pressekonferenz von Bundeskanzler Merz und dem Präsidenten der Ukraine, Wolodymyr
  Selenskyj „Es ist Zeit für ein Ende dieses Krieges“
text: 'Bundeskanzler Merz erklärte die Absicht, weitere Winterhilfen für die Ukraine
  bereitstellen zu wollen. Bei einer gemeinsamen Pressekonferenz mit dem ukrainischen
  Präsidenten Wolodymyr Selenskyj in Berlin hat Bundeskanzler Friedrich Merz die weitere
  Unterstützung Deutschlands bekräftigt. Selenskyjs Besuch falle in einem sehr wichtigen
  Augenblick: In den kommenden Tagen stehen direkte Gespräche zwischen der Ukraine
  und Russland an, während Russland seine Angriffe unvermindert fortsetze. Als größter
  Unterstützer der Ukraine trage Deutschland Verantwortung, denn der Ausgang des Krieges
  werde auch die Sicherheit Europas prägen. „Unsere Botschaft an Russland lautet deshalb:
  Es ist Zeit für ein Ende dieses Krieges“, so Merz. (Die Protokollierung des fremdsprachlichen
  Teils erfolgte anhand der Simultandolmetschung.) Sehr geehrter Präsident, lieber
  Wolodymyr, herzlich willkommen in Berlin! Wir haben uns genau vor einem Monat in
  Kyjiw getroffen, heute sehen wir uns hier. Dieser Besuch erfolgt zu einem sehr wichtigen
  Augenblick. Denn Russland setzt seine Angriffe mit unverminderter Härte und Rücksichtslosigkeit
  fort. Zugleich stehen in den nächsten Tagen wichtige Gespräche, direkte Gespräche
  zwischen der Ukraine und Russland, an. In dieser fordernden Zeit kann sich die Ukraine
  weiter und unvermindert auf Deutschland verlassen. Wir setzen unsere Unterstützung
  unvermindert fort. Vor dem kommenden Winter sind zwei Dinge wichtig: die Luftverteidigung
  und der Energiesektor. Wir haben für beides in Kyjiw weitere Hilfen auf den Weg
  gebracht, die wir nun umsetzen. Wir wollen konkret noch in diesem Jahr weitere Winterhilfe
  und Unterstützung bei der Energieversorgung möglich machen. Auch die deutsche Wirtschaft
  steht bereit. Diese Zusammenarbeit werden wir am 20. November beim neunten deutsch-ukrainischen
  Wirtschaftsforum in Berlin weiter vertiefen. Das liegt im Interesse beider Seiten.
  Ich will auch hier einmal ausdrücklich mit großem Dank sagen: Es gibt eine große
  Zahl von deutschen Unternehmen, die sich in der Ukraine engagieren. Es hat nicht
  ein einziges Unternehmen aus Deutschland die Ukraine nach dem Beginn des Krieges
  im Februar 2022 verlassen. Im Gegenteil: Es sind viele neue hinzugekommen. Ich bin
  ausgesprochen dankbar, dass sich die deutsche Wirtschaft ebenso engagiert und bereit
  zeigt, der Ukraine zu helfen. Lieber Wolodymyr, Deutschland übernimmt als größter
  Unterstützer der Ukraine genau diese Verantwortung. Wir tun dies, weil uns dieser
  Krieg direkt betrifft. Der Ausgang dieses Krieges wird die europäische Sicherheit
  für lange Zeit prägen. Unsere Unterstützung der Ukraine ist deshalb im deutschen
  und im europäischen Interesse. Klar ist aber auch: Alle Europäer tragen Verantwortung,
  nicht nur die Deutschen. Wir haben uns in der NATO auf eine militärische Unterstützung
  der Ukraine für das Jahr 2026 in Höhe von 70 Milliarden Euro verständigt. Wir müssen
  auch dafür sorgen, dass alle Partner dieser Verpflichtung nachkommen. Wir werden
  deshalb in der übernächsten Woche mit Frankreich und Großbritannien einen Gipfel
  der Koalition der Willigen hier in Berlin ausrichten. Dabei stehen drei Ziele im
  Vordergrund: Erstens werden wir weitere Hilfe für die Ukraine koordinieren. Zweitens
  werden wir unsere Bereitschaft bekräftigen, nach einem Waffenstillstand Sicherheitsgarantien
  für die Ukraine zu leisten. Eine entsprechende Militärübung beginnt in diesen Tagen.
  Das wird ein entscheidender Baustein einer Friedenslösung sein. Drittens werden
  wir uns weiter zu den diplomatischen Bemühungen abstimmen, die ja praktisch jeden
  Tag laufen. Unsere Botschaft an Russland lautet deshalb: Es ist Zeit für ein Ende
  dieses Krieges. Der regionale Waffenstillstand in Oleschky kann Vorbild sein für
  einen Waffenstillstand zu Energie und im Schwarzen Meer. Russland hat dies bis jetzt
  hartnäckig verweigert. Russland riskiert mit seinen Angriffen im Schwarzen Meer
  eine weitere Eskalation. Russland beschwört eine weltweite Nahrungsmittelkrise herauf
  zu Lasten der ärmsten Staaten und Länder der Welt. Eine neue Runde von Friedensgesprächen
  ist deshalb der richtige Schritt. Europa muss und will in diesem Prozess eine Rolle
  spielen. Zentrale Elemente einer Friedenslösung, sei es zu Sanktionen oder zur Sicherheitsarchitektur,
  können nur mit uns Europäern gelöst werden; das wissen alle Beteiligten sehr genau.
  Es ist jetzt an Russland zu zeigen, dass Russland zu ernsthaften Verhandlungen bereit
  ist. Wir werden bis dahin den Druck auf Moskau erhöhen und die Ukraine weiter mit
  aller Kraft unterstützen. Wir halten Kurs auf Frieden für die Ukraine und Sicherheit
  in ganz Europa, und – lassen Sie mich dies noch einmal ausdrücklich sagen – wir
  unterstützen die Ukraine aus unserem Interesse. Wir tun es, weil es für unsere Sicherheit,
  für die politische Stabilität und die Friedensordnung in ganz Europa wichtig ist.
  Ich werbe auch dafür, dass die Mehrheit der Deutschen versteht, dass wir dieses
  tun. Wir tun es aber auch aus der tiefen Überzeugung, dass militärische Gewalt in
  Europa nicht zu einer Veränderung der Grenzen führen darf. Lieber Wolodymyr, du
  hast Deutschland und die deutsche Bundesregierung unvermindert an deiner Seite.
  Wir tun alles, um diesen Krieg zum möglichst frühen Zeitpunkt zu einem Ende zu bringen.
  Herzlichen Dank für deinen Besuch in Berlin. Vielen Dank, Friedrich. Sehr geehrter
  Herr Bundeskanzler, sehr geehrte Anwesenden, sehr geehrte Journalistinnen und Journalisten,
  zunächst möchte ich Deutschland, dem Herrn Bundeskanzler persönlich und der gesamten
  Regierung Deutschlands sowie allen Deutschen für die sehr spürbare, sehr wichtige
  Unterstützung der Ukraine und der Ukrainerinnen und Ukrainer danken. Seit den ersten
  Tagen des vollumfänglichen Krieges kann die Ukraine damit rechnen, dass die Deutschen
  nicht gleichgültig bleiben und die Ukraine tatsächlich unterstützen. Die Unterstützung
  bei der Luftabwehr, die Unterstützung unserer Resilienz, unserer Energiewirtschaft
  und unseres Staates insgesamt zeigen, dass die europäischen Positionen ohne Deutschland
  nicht so stark wären. Obwohl heute viele auf der Welt die Ereignisse in den USA
  verfolgen werden: Die Rolle Europas, die Rolle Deutschlands, die Bedeutung unserer
  Zusammenarbeit mit Deutschland, bleiben wichtig; der Bundeskanzler und ich werden
  sicherlich nicht unbeachtet bleiben. Ich sehe, wie viele Menschen die Ukraine unterstützen,
  wie viele Menschen starke Beziehungen zwischen unseren Staaten, zwischen der Ukraine
  und Europa möchten. Ich habe Friedrich über die Situation in der Ukraine, vor allem
  an der Front, unterrichtet. Jeden Tag tätigt Russland Angriffe gegen unsere Energiewirtschaft,
  gegen unsere Städte und Dörfer. Heute hat ein nächster massiver Angriff mit Marschflugkörpern,
  mit ballistischen Raketen stattgefunden. Mehr als ein Tag dauert der Einsatz in
  Komyschuwacha im Gebiet Saporischschja an. Gestern fanden dort mehrere Angriffe
  mit Fliegerbomben statt. Fünf Menschen konnten gerettet werden. Über 50 Personen
  sind immer noch nicht aufgefunden worden. Es sind schreckliche Angriffe in diesem
  Krieg. Das passierte sofort nach dem humanitären Einsatz in Oleschky. Wir hatten
  Russland angeboten, den Waffenstillstand, die Feuerpause in Oleschky, weiterzuführen.
  Das war die Antwort ‑ neue Angriffe, neue Schläge, neue Morde an unseren Menschen.
  Es ist wichtig, dass Deutschland in dieser Zeit an unserer Seite ist. Wir danken
  dafür. Wir sind bereit, auch weiter darüber zu sprechen. Wir haben mit Friedrich
  Hilfspakete und Lösungen besprochen, die wir brauchen. Ich bin sehr dankbar dafür,
  dass es, wie Friedrich gesagt hat, eine Winterunterstützung, eine Winterhilfe geben
  wird. Wir haben auch über weitere Unterstützung gesprochen, über das, was relevant
  und wichtig ist, über einen großen Mangel in der Luftabwehr, über die Versorgung
  mit PAC-2- und PAC-3-Raketen sowie mit IRIS-T. Wir sind sehr dankbar für diese Unterstützung
  und auch für die Unterstützung unserer Flotte mit F-16. Wir danken dafür. Das brauchen
  wir. Das benötigen wir vor allem für die Verteidigung gegen den russischen Terror,
  gegen die Shahed-Drohnen. Wir haben ein neues Unterstützungspaket für unsere F-16
  besprochen. Vielen Dank dafür. Der andere Aspekt ist die Diplomatie. Wir erwarten
  die Wiederaufnahme des trilateralen Formats. Am 10. und 11. November werden sich
  unsere Arbeitsteams treffen. Wir rechnen damit, dass dieses und weitere solcher
  Treffen den Weg für ein trilaterales Format auf Ebene der Staats- und Regierungschefs
  eröffnen werden. Dieses Format kann Schlüssellösungen für einen lang anhaltenden,
  stabilen Frieden und für lang anhaltende, stabile Sicherheit bereitstellen. Wir
  koordinieren und stimmen uns über die wichtigsten Aspekte der Verhandlungen ab.
  Europa gehört zu diesem Prozess dazu, zum Prozess für den Weg zum Frieden. Es ist
  wichtig, dass wir eine gemeinsame Sicht auf alle Sicherheitsherausforderungen haben,
  darauf, wie dieser Krieg zu Ende gehen muss. Der Friede muss würdevoll sein. Nur
  dann kann er stabil sein. Morgen werden in Brüssel mehrere Gespräche mit den USA
  stattfinden. Europa, NATO , die Ukraine werden dort auf Ebene der Arbeitsteams Erneuerungs-
  und Wiederaufbaupakete sowie Sicherheitsgarantien besprechen. Der dritte Punkt sind
  unsere gemeinsamen Projekte, die gemeinsame Produktion, die Integration in die EU
  . Wir wollen in diesem Jahr sechs Verhandlungscluster für den Beitritt zur EU eröffnen.
  Das ist für uns sehr wichtig, sowohl als Garantie der Zukunft der Ukraine in Europa
  als auch für die moralische Unterstützung unserer Menschen jetzt. Die Eurointegration
  ist eine Motivation für uns. Sehr dynamisch entwickelt sich unsere Zusammenarbeit
  im Bereich der Drohnenproduktion und in anderen Rüstungsbereichen. Wir arbeiten
  am Antiballistikprogramm Freyja. Europa braucht dieses Programm der Abwehr ballistischer
  Raketen. Dieses Programm wird sicher aufgebaut. Wir haben über die Unterstützung
  der Ukraine im kommenden Jahr gesprochen. Auch für Europa ist das eine Priorität.
  Das wissen wir zu schätzen. Wir sind dankbar dafür, dass der Ukraine die nötige
  finanzielle Unterstützung bereitgestellt wird. Ich will auch für die Einladung zum
  19. November danken. Es wird ein Gipfeltreffen der Koalition der Willigen in Deutschland
  stattfinden. Friedrich hat auch von der Wirtschaft gesprochen. Wir wissen, dass
  die deutsche Wirtschaft während dieses Krieges an unserer Seite geblieben ist. Kein
  Unternehmen hat die Ukraine verlassen. Wir sind der deutschen Wirtschaft dafür dankbar.
  Wir sind den Deutschen, den Menschen in Deutschland, dafür dankbar. Ich bin mir
  sicher, dass ihr während des Krieges an unserer Seite bleibt. Auch im Frieden werdet
  ihr an unserer Seite bleiben. Wir sind für die Unterstützung dankbar und rechnen
  damit, dass unsere Unternehmen zusammen für den Wiederaufbau der Ukraine arbeiten
  werden. Frage: Eine Frage an Sie, Herr Präsident, zum Treffen in Abu Dhabi nächste
  Woche: Was erwarten Sie? Sind bestimmte Fortschritte bei den Themen der Energie
  und eines Waffenstillstands zu erwarten? Die deutsche Unterstützung ist sehr wichtig.
  Was könnte Berlin noch weiter tun, um die ukrainischen Positionen auf dem Gefechtsfeld
  und am Verhandlungstisch zu stärken? Herr Bundeskanzler, was erwarten Sie von dem
  Treffen in Abu Dhabi kommende Woche? Denken Sie, dass Putin wirklich an Frieden
  interessiert ist? Was die Unterstützung der Ukraine anbetrifft, unterstützt Deutschland
  sehr stark. Aber Russland greift die Energieinfrastruktur massiv an. Was könnte
  Deutschland aus Ihrer Sicht noch mehr tun, um der Ukraine zu helfen, sich gegen
  diese Angriffe zu schützen, um aber auch die russischen Angriffsmöglichkeiten zu
  schwächen? Präsident Selenskyj: Vielen Dank für diese Frage. Die amerikanische Seite
  hat schon ein Signal gegeben, dass Sicherheitsgarantien für die Ukraine und ein
  „ prosperity package “, also ein Paket für den Wiederaufbau unseres Landes, besprochen
  werden sollen. Mit unserem Team werden auch Fragen besprochen, die wir beim Treffen
  am 10. und 11. November in Abu Dhabi besprechen wollen. Das alles sind für uns Prioritäten.
  Ich denke, für alle normalen Menschen sollten das Prioritäten sein. Die Energiewirtschaft,
  das heißt eine Feuerpause auf beiden Seiten, und auch die kritische Infrastruktur.
  Zweitens das Getreide, das heißt die Entsperrung des Schwarzen Meeres. Daran sind
  nicht nur die Ukrainer interessiert, sondern auch Russland hat ein Interesse daran,
  auch andere Länder in Afrika, in Asien und unsere Partnerstaaten. Der dritte Aspekt
  sind Menschen. In welchem Format können wir einen Gefangenenaustausch stärken? Alle
  gegen alle, das ist das, was wir wünschen, oder zumindest irgendeine Form von Gefangenenaustausch,
  damit die Menschen schneller nach Hause zurückkommen. Und die Staats- und Regierungschefs,
  also eine Vorbereitung eines Treffens im trilateralen Format auf der Ebene der Staats-
  und Regierungschefs mit einer unbedingten Teilnahme Europas. Ich gebe Friedrich
  völlig recht. Wir haben diesbezüglich die gleiche Position. Es kann nicht zu einem
  stabilen Frieden kommen, wenn Europa nicht am Verhandlungstisch sitzt. Bundeskanzler
  Merz: Ich teile die Einschätzung von Wolodymyr Selenskyj, was die Erwartungen an
  das Treffen in Abu Dhabi betrifft. Ich will dem Gastgeber dafür danken, dass er
  diese Einladung ausspricht und den Ort für dieses Treffen zur Verfügung stellt.
  Ich will aber auch sagen: Es ist wichtig, dass Russland wirklich ernsthaft und endlich
  Verhandlungen über einen Waffenstillstand und über ein nachkommendes Friedensabkommen
  führt. Ich sehe das bisher nicht. Aber Sie sehen an diesem Treffen wie auch an vielen
  anderen, dass wir auf jeder Ebene darum bemüht sind, diesen Krieg zu einem Ende
  zu bringen. Wir lassen es auch an keiner diplomatischen Bemühung fehlen. Sie wissen,
  dass auch die Bundesregierung auf mehreren Ebenen beteiligt ist, bis hin auch zu
  meinem außenpolitischen Berater, der mittlerweile wirklich einen Großteil seiner
  Arbeitskraft darauf verwendet, diplomatische Bemühungen zu unternehmen, um diesen
  Krieg zu beenden. Da wird sich das Treffen in Abu Dhabi in eine ganze Reihe von
  Treffen einreihen, die schon stattgefunden haben und möglicherweise auch weiter
  stattfinden werden, so lange, bis wir zu einem Waffenstillstand kommen. Was kann
  Deutschland mehr tun? Ich glaube, wir tun schon sehr viel. Wir sind mittlerweile
  das Land mit dem mit Abstand größten Beitrag für die Ukraine. Wichtig ist aber auch,
  dass wir immer wieder das Signal geben, sowohl an die Ukraine als auch an Moskau:
  Wir werden unsere Hilfe fortsetzen, bis dieser Krieg zu Ende ist. Ich gebe dieses
  Signal auch nach innen, auch in die deutsche Bevölkerung hinein. Wir tun das in
  unserem eigenen Interesse und im europäischen Interesse und im Interesse einer stabilen
  politischen Ordnung in Europa, und deswegen werden wir in unserem Engagement auch
  nicht nachlassen. Frage: Herr Präsident, Sie haben gesagt, es könne keinen Frieden
  geben, wenn Europa nicht mit am Tisch sitze. Wie kommt es dann, dass Europa in Abu
  Dhabi wahrscheinlich vor der Tür sitzen wird? Verlangen Sie, dass Deutschland an
  den Verhandlungen mitbeteiligt wird? Die Frage geht auch an den Bundeskanzler. Damit
  verbunden habe ich die Frage, Herr Präsident, ob Sie zu einem Telefonat mit dem
  russischen Machthaber bereit wären oder ihn vielleicht sogar zu Verhandlungen nach
  Kyjiw einladen würden. Herr Bundeskanzler, wäre es für Sie akzeptabel, wenn nach
  Miami zum G20 -Gipfel nur der russische Machthaber eingeladen werden würde und nicht
  der ukrainische Präsident? Was wäre die Konsequenz? Präsident Selenskyj: So viele
  Fragen! Ich weiß nicht, wo ich beginnen soll. – Wenn wir darüber sprechen, dass
  es ohne Europa keinen stabilen und nachhaltigen Frieden geben kann, so stimmt das.
  Denn ohne eine Stabilität, ohne Glauben, mit einer Million Kompromisslösungen und
  ohne die Sicherheit, dass morgen kein neuer Krieg beginnt, wird so ein Frieden unsicher
  sein. Der Frieden, aber vor allem die Sicherheit hat Priorität. Frieden ist nicht
  nur ein Wort, sondern es geht um ganz konkrete Sicherheitsgarantien, starke Streitkräfte,
  eine ganz konkrete und starke Finanzierung, eine konkrete Wirtschaft, die sich selbst
  erneuert. Die deutsche, die europäische Wirtschaft macht damit Geld, aber auch unser
  Land wird damit aufgebaut, von der Logistik bis hin zu einzelnen Unternehmen, Schulen
  und Universitäten. Das ist eine ganze Arbeitsfront. Deswegen rechnen wir damit,
  dass wir in der Zukunft ein Teil der Europäischen Union sein werden und somit ein
  Teil der Sicherheitsinfrastruktur dieser europäischen Familie. Deswegen sage ich:
  Einen nachhaltigen, stabilen Frieden kann es ohne diese Sicherheit nicht geben.
  Die USA und Russland – bei allem Respekt den USA gegenüber ‑ können nicht darüber
  entscheiden, ob die Ukraine ein Mitgliedstaat der Europäischen Union werden wird.
  Dafür brauchen wir die Unterstützung anderer Staaten, und all diese Staaten befinden
  sich in Europa. Die USA brauchen wir für gemeinsame Sicherheitsgarantien von Europäern
  und von Amerikanern. Wenn wir von der Koalition der Willigen sprechen, so ist das
  auch ein Sicherheitsgarant mit einem Backstop aus den USA . So sprechen wir von
  der europäischen Teilhabe. Ohne Europäer können wir das nicht lösen. Aber wir brauchen
  erste Schritte für die Deeskalation, und der Vermittler dieser ersten Schritte sind
  die USA . Dabei geht es um eine Feuerpause. Eine Feuerpause kann sogar ohne Treffen,
  ohne Gespräche stattfinden, wenn es auf russischer Seite diesen Wunsch gibt. Wir
  sehen das nicht. Sie wollen einen Dialog in dem einen oder anderen Format. Sie schlagen
  dieses trilaterale Format vor. Wenn es um die Deeskalation gehen soll, so können
  wir so ein trilaterales Treffen auch organisieren. Aber ich möchte Folgendes sagen:
  Wir betreiben nicht nur „ advocacy “ für Europa und für die Teilhabe Europas, sondern
  selbst in einem trilateralen Format ist Europa anwesend, entweder über die MSC oder
  die nationalen Sicherheitsberater, die die Möglichkeit haben, auch Gespräche zu
  führen, und die auch von uns gebrieft werden oder auch am Verhandlungstisch sitzen.
  Es gab schon trilaterale Formate, an denen sich später auch Europa beteiligt hat.
  Deswegen geht es nicht ohne Europa. Wir sind sicher, dass am Ende der Krieg zu Ende
  gehen wird und es einen Frieden geben wird, in dem Europa eine aktive Rolle spielt.
  Was die Einladung zu einem Telefonat angeht: Wir laden Putin nicht nach Kyjiw ein.
  2022 sind die Russen ohne Einladung zu uns gekommen. Es hat keinen Sinn, Putin nach
  Kyjiw einzuladen, denn er wird nicht kommen, und eine Einladung auszusprechen, die
  nicht angenommen wird, ist destruktiv. Genauso ist es destruktiv, wenn ich nach
  Moskau eingeladen werde. Das macht Moskau ja. Damit spuckt man der ganzen Welt,
  die ein Ende des Krieges herbeiwünscht, ins Gesicht. Deswegen möchte niemand nach
  Moskau reisen; das habe ich schon gesagt. Ein Telefonat wird Russland zweifelsohne
  als eine Möglichkeit ausnutzen, keine Treffen mehr durchzuführen, sich also nicht
  mehr für Gespräche zu treffen. Wir verstehen dieses Spiel. Dieses Spiel ist aussichtslos.
  Es würde ein ganz offizielles, trockenes Telefonat sein, in dem ich mir noch einmal
  eine historische Vorlesung vom Staatschef der Russischen Föderation anhören müsste.
  Konkrete Schritte dafür, wie man den Krieg beendet, muss man nicht einfach lehren
  oder darüber schwatzen, sondern man muss sich wirklich an den Verhandlungstisch
  setzen und zeigen, dass dieser Staat Unrecht hat, weil er ein Aggressor ist. Wenn
  wir dem Krieg ein Ende setzen wollen, müssen wir uns treffen und den ersten Schritt
  eingehen, eine Feuerpause. Bundeskanzler Merz: Ich schließe mich dem an, was Präsident
  Selenskyj gerade gesagt hat. Vielleicht noch eine abschließende Bemerkung zum G20
  -Treffen in Miami in sechs Wochen: Jedem Gastgeber steht es frei, weitere Gäste
  einzuladen. Wenn Präsident Trump sich entscheiden sollte, den russischen Staatspräsidenten
  einzuladen, dann muss zuallererst über die Ukraine gesprochen werden, und wenn über
  die Ukraine gesprochen wird, dann muss der Präsident der Ukraine mit am Tisch sitzen.
  Es ist jedenfalls aus meiner Sicht völlig inakzeptabel, dass Drittstaaten über das
  Schicksal der Ukraine sprechen, ohne die Ukraine daran zu beteiligen. Wenn die Ukraine
  am Tisch sitzt, dann sitzt Europa mit am Tisch. Insofern befinden wir uns in den
  Gesprächen für die Vorbereitung dieses Treffens. Ich will jedenfalls für meine Person
  sagen: Wir sollten keine Möglichkeit auslassen, Gespräche zu führen, und keine Möglichkeit
  auslassen, weiterhin diplomatische Anstrengungen zu unternehmen. Sie müssen aber
  auch wirklich zu einem Ende der Kampfhandlungen führen, sie müssen zu einem Waffenstillstand
  führen und sie müssen zu einem Friedensabkommen in der Ukraine führen. Alles andere
  ist nicht akzeptabel. Insofern sehe ich der Vorbereitung und der Durchführung dieses
  G20 -Treffens in Miami mit Interesse entgegen. Frage: Herr Präsident, die Zahl der
  russischen Verluste belief sich im Oktober auf über 54 000. Können Sie eine Einschätzung
  der Lage an der Front geben? Wir wissen, dass es drei parallele Offensiven gibt.
  In welcher Lage werden wir bis zum Beginn der Verhandlungen in Abu Dhabi sein? Herr
  Bundeskanzler, welche Mechanismen für die Suche nach zusätzlicher Luftabfuhr sehen
  Sie? Die Mengen, die jetzt geliefert werden, sind sehr klein. Sie haben vielleicht
  nicht genug Produktionskapazitäten. Vielleicht machen Sie das mit London zusammen?
  Noch ein Follow-up : Im Juni 2025 haben Sie gesagt, dass es nicht konstruktiv sei,
  Putin anzurufen, weil er nach diesen Anrufen die ukrainischen Städte noch stärker
  angreife, und das stimmt auch. Haben Sie diesen Standpunkt geändert? Sehen Sie für
  sich eine Möglichkeit, ihn anzurufen? Präsident Selenskyj: Vielen Dank für die Frage. –
  Die Situation an der Front ist natürlich nicht einfach. Es gibt Verluste, aber wir
  sind unseren Streitkräften und unseren Soldaten dankbar dafür, dass die Situation
  kontrolliert wird. Wir sehen jetzt keine Übermacht Russlands, wir sehen keine Überraschungen.
  Zweifelsohne hat Russland oder hat Putin nach unseren gelungenen Operationen in
  diesem Jahr beschlossen, mit einem Sprung Schritte zu unternehmen, und Russland
  hat sprunghaft seine Truppen vergrößert. Obwohl die Russen in bestimmten Bereichen
  die Oberhand haben, etwa was die Zahlen der Soldaten und die Ausstattung mit Drohnen
  angeht, haben sie große Verluste erlitten, weil sie keine Rücksicht auf Menschenleben
  nehmen. Sie schicken Mörder in die Ukraine; diese 54 000, das sind russische Mörder.
  Deswegen sollten wir kein Mitleid mit ihnen haben. Sie gehen in die Ukraine, um
  uns zu töten, und wenn unsere Soldaten es geschafft haben, sie vorher zu töten,
  dann haben sie das sehr gut gemacht; sie sind einfach toll. Was unsere Luftabwehr
  und den Schutz unserer zivilen Bevölkerung angeht, ist die Situation nicht so positiv.
  Russland hat es an der Front nicht geschafft und hat deshalb beschlossen, uns in
  diesem Bereich massiv anzugreifen, also unsere Menschen zu töten und die Energie-
  und Eisenbahninfrastruktur anzugreifen. Hier müssen wir unsere Kräfte sammeln und
  uns verteidigen, so gut es geht. Natürlich müssen wir hierzu mit Partnern zusammenarbeiten.
  Ich bin Deutschland dankbar für die Stärkung des Energiesektors und der Luftabwehr.
  Wir danken also, aber das ist nicht genug. Hier gebe ich Friedrich recht: Auf dem
  Gipfeltreffen der NATO in der Türkei sind starke Vereinbarungen getroffen worden,
  und alle müssen sich das wieder in Erinnerung rufen und die Hilfe für die Ukraine
  stärken und beschleunigen. Wir sind dankbar für Ihre Fragen. Wir betreten den Verhandlungsprozess
  in einer guten Lage auf dem Gefechtsfeld und mit großen Schwierigkeiten im Bereich
  der Luftabwehr. Wir sind aber bereit zu diplomatischen Schritten, wir sind bereit
  für den Frieden, für Verhandlungen, für einen fairen Frieden. Wir brauchen aber
  Sicherheit; das möchte ich noch einmal wiederholen. Sicherheitsgarantieren sind
  ein paralleler Prozess, der sehr wichtig ist. Bundeskanzler Merz: Die russischen
  Verluste im Oktober 2026 sind offensichtlich die höchsten Verluste, die Russland
  in diesem Krieg jemals in einem Monat erlitten hat. 52 000 Soldaten, von denen rund
  die Hälfte ihr Leben verloren haben und die andere Hälfte so schwer verletzt worden
  sind, dass sie nicht mehr einsatzfähig sind: Das zeigt die ganze Dramatik dieses
  Krieges auch auf der russischen Seite. Deswegen noch einmal: Es wird Zeit, dass
  dieser Krieg aufhört. Aber solange Putin ihn führt, werden wir der Ukraine in jeder
  Hinsicht weiterhelfen. Auch das ist ein Grund dafür, dass ich für den 19. November
  zu einem Treffen der Koalition der Willigen in Person nach Berlin eingeladen habe.
  Es werden eine große Zahl von Staats- und Regierungschefs nach Berlin kommen, und
  wir werden für das Jahr 2027 Verabredungen treffen, in welchem Umfang wir weiterhin
  helfen. Da wird es vor allem, wenn auch nicht ausschließlich, um die weitere militärische
  Unterstützung gehen. Vielleicht darf ich auch so viel sagen: Präsident Selenskyj
  und ich haben sowohl in unserem Vier-Augen-Gespräch heute als auch in dem Delegationsgespräch
  über einige Details gesprochen ‑ auch darüber, was wir zurzeit liefern können und
  was wir tatsächlich liefern. Ich habe den Gesprächen entnommen, dass es zurzeit
  bei allen Schwächen in der Luftverteidigung immerhin doch eine ganze Reihe von Lieferungen
  gibt, die der ukrainischen Armee im Augenblick sehr helfen. Das betrifft insbesondere
  Munition für die F16, das betrifft aber auch Luftabwehr und weitere Munition. Wir
  sind also wirklich auf dem Weg, immer weiter zu helfen, auch wenn es hin und wieder
  einmal Nachschubschwierigkeiten gegeben hat. Ich will aber versuchen, sie mit diesem
  Treffen der Koalition der Willigen am 19. November auszuräumen. Frage: Haben Sie
  heute auch über das Thema russische Schattenflotte gesprochen? Deutschland hatte
  Anfang September ja angekündigt, viel stärker dagegen vorzugehen. Zumindest nach
  dem, was man weiß, ist bisher nichts passiert. Warum? Bundeskanzler Merz: Darüber
  haben wir heute nicht gesprochen. Das wird Gegenstand von Erörterungen an anderer
  Stelle sein, aber das war kein Gegenstand der Gespräche heute.'
