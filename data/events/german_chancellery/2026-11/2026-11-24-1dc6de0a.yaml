title: '25 Jahre deutsch-französisches Filmabkommen – Staatsminister Weimer: „Minitraité
  verleiht europäischer Filmkultur eigene Stimme auf internationaler Festivalbühne“'
text: 'Ein ‚kleines Abkommen‘ feiert große Erfolgsgeschichte: Mit einem Festakt im
  Roten Rathaus von Berlin würdigen Vertreterinnen und Vertreter der Bundesregierung,
  der Berliner Senatskanzlei und der Filmbranche aus Frankreich und Deutschland heute
  Abend das 25. Jubiläum des deutsch-französischen Filmabkommens Minitraité. Die gemeinsame
  Koproduktionsförderung ist seit 2001 einer der Grundpfeiler der Kulturbeziehungen
  zwischen Deutschland und Frankreich. Viele der geförderten Filme feiern ihre Premiere
  auf den bedeutendsten Filmfestivals der Welt und konkurrieren dort regelmäßig um
  höchste Auszeichnungen. Im Jubiläumsjahr 2026 waren Minitraité-Filme besonders erfolgreich:
  Valeska Grisebachs multilateral produzierter Film „Das geträumte Abenteuer“ erhielt
  bei den 79. Internationalen Filmfestspielen von Cannes den Preis der Jury, Andrei
  Zvyagintsevs „Minotaurus“ den Grand Prix. Beide Filme sind zudem für einen Oscar
  in der Kategorie ‚Bester Internationaler Film‘ nominiert. Kulturstaatsminister Wolfram
  Weimer: „25 Jahre deutsch-französisches Filmabkommen stehen für die Überzeugung,
  dass das Kino Menschen über alle Grenzen hinweg verbindet. Hinter jedem geförderten
  Film steht eine Geschichte, die ohne das Minitraité vielleicht nie erzählt worden
  wäre. Gemeinsam sichern Frankreich und Deutschland damit die Vielfalt der europäischen
  Filmkultur und verleihen ihr eine eigene Stimme auf der internationalen Festivalbühne.
  Deshalb feiern wir das Minitraité heute vor allem auch als ein lebendiges Symbol
  der tiefen kulturellen Verbundenheit unserer beiden Länder und blicken voller Vorfreude
  auf viele weitere gemeinsame Meisterwerke.“ Rund 250 internationale Koproduktionen
  wurden durch das Minitraité bis heute ermöglicht, darunter zahlreiche preisgekrönte
  Filme wie „Das Weiße Band von Michael Haneke oder „Die andere Heimat“ von Edgar
  Reitz. Das gemeinsame Fördervolumen lag bei insgesamt rund 70 Millionen Euro. Das
  jährliche Budget von 3,2 Millionen Euro für die Koproduktionsförderung wird jeweils
  hälftig von Deutschland und Frankreich aufgebracht.'
