title: FAQ Fragen und Antworten zum EU-Haushalt
text: 'Die EU wird finanziert über die sogenannten Eigenmittel, das heißt Einnahmen
  aus den Mitgliedstaaten, die je nach Wirtschaftskraft des jeweiligen Landes berechnet
  werden. Die Finanzen und der Haushalt der Europäischen Union ( EU ) für die Jahre
  2028 bis 2024 werden gerade neu verhandelt. Zur genaueren Ausgestaltung des sogenannten
  Mehrjährigen Finanzrahmens (MFR) treffen sich die Staats- und Regierungschefs am
  26. und 27. November zu einer Sondertagung in Brüssel. Bundeskanzler Friedrich Merz
  hat die Position der Bundesregierung in seiner Rede in der Generaldebatte zum Bundeshaushalt
  deutlich formuliert: Man brauche eine Begrenzung und Fokussierung der Ausgaben auf
  die Bereiche Sicherheit und Wettbewerbsfähigkeit. Wirklich fokussierte Ausgaben
  seien „ die beste Zusatzversicherung für unser Land. Eine Versicherung, dass wir
  in dieser Welt eben nicht zum Spielball werden, sondern sie mitgestalten können.“
  Finden Sie im folgenden Text Antworten auf Fragen rund um den Mehrjährigen Finanzrahmen
  der Europäischen Union: Der geltende Finanzrahmen wurde im Dezember 2020 beschlossen
  und gilt für den Zeitraum 2021 bis 2027. Momentan wird der MFR für den Zeitraum
  2028 bis 2034 verhandelt. Mit dem Mehrjährigen Finanzrahmen plant und begrenzt die
  EU ihrer Ausgaben mittelfristig, das heißt darin werden Obergrenzen und Verwendungszwecke
  der EU -Gelder für die nächsten sieben Jahre festgelegt. Die Aufteilung der Gesamtausgaben
  auf die verschiedenen Aufgabenbereichen der EU erfolgt nach gewissen politischen
  Prioritäten. Der gegenwärtige MFR ist auf sieben Politikbereiche aufgeteilt, der
  kommende wird voraussichtlich nur noch vier beinhalten: Wirtschaftlicher, sozialer
  und territorialer Zusammenhalt, Landwirtschaft und ländlicher Raum, Meere Wettbewerbsfähigkeit,
  Wohlstand und Sicherheit Bei neuen und unerwarteten Herausforderungen können Rat
  und Europäisches Parlament den MFR anpassen, aufstocken oder neu priorisieren. Der
  Mehrjährige Finanzrahmen erhöht die Planbarkeit für alle Beteiligte und vermeidet
  Konflikte um die jährlichen Haushalte der EU . Der aktuelle Mehrjährige Finanzrahmen
  fokussiert sich auf Wettbewerbsfähigkeit, Forschung, Klimaschutz, Digitalisierung
  und vieles mehr. Die genaue Ausgestaltung des nächsten MFR für 2028 bis 2034 ist
  Gegenstand der laufenden Verhandlungen und noch nicht beschlossen. Die EU wird finanziert
  über die sogenannten Eigenmittel, das heißt Einnahmen aus den Mitgliedstaaten, die
  je nach Wirtschaftskraft des jeweiligen Landes berechnet werden. Bisher bestehen
  diese Eigenmittel aus Zöllen, Mehrwertsteuer und Kunststoffverpackungsmüll-Abgaben.
  Die Höhe der jeweiligen Eigenmittel wird über deren tatsächliches Aufkommen ermittelt.
  Für die Finanzierung des EU -Haushalts besteht eine Gesamtobergrenze, das heißt
  der Gesamtbetrag der Eigenmittel darf 1,4 Prozent des Bruttonationaleinkommens der
  Mitgliedstaaten nicht übersteigen. Der entsprechende Betrag wird von der Kommission
  jährlich ermittelt und fließt damit auch in die jährliche Haushaltsplanung ein.
  Die Ausgaben und Zahlungen des entsprechenden Jahres dürfen ihre jeweilige Gesamtobergrenze
  nicht überschreiten. Dementsprechend muss auch der Mehrjährige Finanzrahmen deutlich
  unterhalb dieser Grenze liegen, damit die Einhaltung des MFR stets sichergestellt
  ist. Die primärrechtlichen Grundlagen zum Haushalt, zu den Eigenmitteln, zum Mehrjährigen
  Finanzrahmen und zur Haushaltskontrolle sind in den Artikeln 310 bis 325 des Vertrags
  über die Arbeitsweise der Europäischen Union ( AEUV ) enthalten. Das heißt, der
  AEUV legt fest, wie die EU Gelder verdienen, planen und ausgeben darf. Dieser Vertrag
  legt auch das Vorgehen der MFR-Verhandlungen fest. Präsident António Costa hat im
  November dieses Jahres einen neuen Vorschlag für den MFR eingereicht und den Europäischen
  Rat zu einer Sondertagung am 26. und 27. November geladen. Dabei wird sowohl der
  neue Vorschlag für den MFR als auch die Finanzierung der Ukraine für 2027 diskutiert.'
