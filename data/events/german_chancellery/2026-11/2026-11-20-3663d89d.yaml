date: '2026-11-20'
type: press_release
source_name: german_chancellery
title: Pressekonferenz von Bundeskanzler Merz und NATO -Generalsekretär Rutte Aufbau
  stärkerer und europäischerer NATO
text: 'Bundeskanzler Merz und NATO -Generalsekretär Rutte betonten den Einsatz für
  Frieden in der Ukraine und somit für die Sicherheit Europas. Die wichtigste Lehre
  aus dem russischen Angriffskrieg gegen die Ukraine sei es, eine stärkere, europäischere
  NATO mit Tempo und großer Entschlossenheit aufzubauen, betonte Bundeskanzler Merz
  beim Empfang des NATO -Generalsekretärs Rutte im Kanzleramt. Denn das Ziel sei,
  „ unsere Freiheit, unsere Sicherheit und unseren Wohlstand auch in Zukunft zu verteidige
  n und zu schützen“. Und dazu leiste die NATO einen unverzichtbaren Beitrag. Höhere
  Verteidigungsausgaben: Die NATO ist Garant für unsere Sicherheit, Freiheit und unseren
  Wohlstand. Deutschland übernimmt bereits mehr Verantwortung in der NATO . Deutschland
  hat die Verteidigungsausgaben 2026 um 22 Milliarden Euro auf 108 Milliarden Euro
  erhöht – und damit mehr als verdoppelt. Jedoch muss die Verteidigungsfähigkeit weiter
  gestärkt werden, um die zunehmende Bedrohung durch Russland für das Bündnisgebiet
  abzuschrecken. (Die Protokollierung des fremdsprachlichen Teils erfolgte anhand
  der Simultandolmetschung.) Meine Damen und Herren, herzlich willkommen und ein besonders
  herzliches Willkommen dem Generalsekretär der NATO , Mark Rutte. Herzlich willkommen
  im Kanzleramt, erneut, nachdem wir uns in der vergangenen Woche Donnerstag schon
  gesehen haben. Wir haben heute zwei Anlässe, uns zu treffen. Zum einen tagt die
  Parlamentarische Versammlung der NATO in Berlin. Zum anderen müssen wir miteinander
  über die aktuelle Sicherheitslage sprechen. Ich will aber noch kurz auf die vergangene
  Woche zurückblicken. Ich bin sehr dankbar, dass wir, Europäer, Ukrainer und die
  Vereinigten Staaten von Amerika, uns einig waren: Wir wollen einen Frieden für die
  Ukraine, aber einen Frieden, der gerecht und dauerhaft ist, und wir wollen mehr
  und nicht weniger Sicherheit für Europa. – Das hat uns geeint. Solange es notwendig
  ist, werden wir Kyjiw unterstützen. Die NATO spielt hierbei eine zentrale Rolle.
  Wir haben uns beim Gipfel in Ankara gemeinsam verpflichtet, die Ukraine 2026 und
  2027 mit jeweils 70 Milliarden Euro zu unterstützen. Ich danke dem Generalsekretär
  dafür, dass er daran unermüdlich und hart arbeitet, und – ich will es gleichzeitig
  sagen – Europa ist bereit, mit Russland zu verhandeln. Es sollen auch demnächst
  wieder auf Beraterebene Friedensgespräche im Format mit der Ukraine, Russland, Europa
  und den Vereinigten Staaten von Amerika stattfinden. Das könnte zum Beispiel wieder
  in Abu Dhabi stattfinden. Wir hoffen, dass auch die russische Seite dazu bereit
  ist, an diesen mit den Vereinigten Staaten verabredeten Gesprächen teilzunehmen.
  Dir, lieber Mark, wenn ich es so sagen darf: Wir wissen, dass Frieden für die Ukraine
  und Sicherheit für Europa untrennbar miteinander verknüpft sind. Wir werden deshalb
  über die jüngsten Verletzungen des polnischen Luftraums durch Russland sprechen.
  Diese Verletzungen des Luftraums sind auch heute parallel Gegenstand der Beratungen
  im NATO -Rat. Ich will es sehr klar und sehr deutlich sagen: Russland muss diese
  Provokationen, diese gefährlichen Provokationen, sofort einstellen. Polen kann dabei
  auf unsere volle Solidarität zählen. Wäre es erforderlich, dann wird die NATO im
  Bündnisgebiet natürlich jeden Fuß Territorium verteidigen. Auch über die jüngsten
  Ereignisse in der Ostsee werden wir sprechen. Dazu stehen wir im engen Austausch
  mit den Partnern. Wir haben über das Wochenende intensiv miteinander kommuniziert.
  Finnland hat am Wochenende, wie wir alle finden, sehr besonnen und verantwortungsvoll
  gehandelt. Wir danken dafür, denn wir haben alle zusammen kein Interesse daran,
  dass es zu einer Eskalation im Ostseeraum kommt. Stabilität und Sicherheit dieses
  Raumes sind von größter Wichtigkeit. Vor allem die freie Schifffahrt darf nicht
  gefährdet werden. Lieber Mark, unsere vielleicht wichtigste Lehre aus dem Ukrainekrieg
  haben wir schon gemeinsam gezogen: Wir bauen mit Tempo die NATO aus, eine stärkere,
  eine europäischere NATO . Wir tun das nicht, um irgendjemanden zu bedrohen. Die
  NATO bedroht niemanden. Wir tun es, um unsere Freiheit, unsere Sicherheit und unseren
  Wohlstand auch in Zukunft zu verteidigen und zu schützen. Dazu leistet die NATO
  einen unverzichtbaren Beitrag und der NATO -Generalsekretär in seiner Person ebenfalls.
  Deswegen auch an dieser Stelle noch einmal sehr herzlichen Dank für dein großartiges
  Engagement und für deine Arbeit. Auf eine weiterhin gute Zusammenarbeit! Herr Bundeskanzler,
  lieber Friedrich, herzlichen Dank für die herzliche Begrüßung! Jetzt bin ich schon
  zum zweiten Mal innerhalb weniger Tage in Berlin. Es ist immer schön, zurück in
  Berlin zu sein. Sie haben hier vergangene Woche ein hervorragendes Treffen der Koalition
  der Willigen ausgerichtet. Jetzt richtet Deutschland auch die jährliche Sitzung
  der Parlamentarischen Versammlung der NATO aus. Innerhalb von fünf Tagen zwei so
  große Treffen, das zeigt sehr deutlich das deutsche Bekenntnis zur NATO , zu Europa
  und zur Ukraine. Deutschland tut viel, um ein stärkeres Europa in einer stärkeren
  NATO aufzubauen. Es übernimmt eine wichtige Führungsrolle bei der Unterstützung
  unserer kollektiven Sicherheit. Ihre Investitionen in die Verteidigung sind riesig
  und steigen. Ihre Industrie produziert immer mehr und immer schneller. Das ist auch
  sehr wichtig. Die deutsche Brigade in Litauen spielt eine Schlüsselrolle dabei,
  unsere Ostflanke sicher zu halten. Deutsche Flugzeuge helfen dabei, den NATO -Himmel
  zu verteidigen. Die Deutsche Marine hilft dabei, kritische Infrastruktur in der
  Ostsee zu schützen. Deutschland ist also wirklich führend. Es ist auch führend in
  der Frage der Ukraine. Gemeinsam arbeiten wir daran, sicherzustellen, dass die Ukraine
  das hat, was sie braucht, um sich gegen die russische Aggression zu verteidigen,
  und dass sie so stark wie möglich in Friedensverhandlungen gehen kann. Die Bedrohungen,
  denen wir uns gegenübersehen, sind bedeutend. Wir tun aber, was nötig ist, um sicherzustellen,
  dass wir fähig und in der Lage bleiben, Aggression abzuschrecken und unsere freien
  Gesellschaften zu verteidigen. Das ist auch das, was ich heute früh auf der Parlamentarischen
  Versammlung der NATO mit den Abgeordneten besprochen habe. Sie spielen eine essenzielle
  Rolle beim Thema der Ressourcen, die wir brauchen, um stark zu bleiben, aber sie
  haben auch die Verbundenheit mit der Bevölkerung. Sie können erklären, warum das
  so wichtig ist. Sie können diese Botschaft wirklich ins Land tragen. Um wahrhaft
  sicher zu sein, müssen die Regierungen und das Militär ihren und seinen Beitrag
  leisten, aber am Ende braucht man die gesamte Gesellschaft, um als Land resilient
  zu bleiben. Das ist absolut wichtig. Darüber haben wir uns heute früh auch sehr
  lange ausgetauscht. Die Zusammenarbeit, die gemeinsamen Investitionen, die gemeinsame
  Produktion und das Zusammenspiel, darum geht es bei der NATO . Ich bin – ich wiederhole
  es – sehr dankbar für Deutschlands kontinuierliche Unterstützung und für Ihren persönlichen
  Beitrag, dafür, dass Sie diese Treffen ausrichten. Wir freuen uns auf die weitere
  Zusammenarbeit. Frage : Herr Generalsekretär, Herr Bundeskanzler, zwei Fragen an
  Sie beide: Heute gab es Berichte, wonach Russland plane, noch in diesem Jahr Atomwaffen
  mit einem Satelliten ins All zu schießen. Wie besorgt sind Sie über diese Berichte?
  Was wäre Ihrer Ansicht nach die angemessene Reaktion auf die Luftraumverletzung
  über Polen? Wann ist eigentlich die Grenze zu Artikel 5 überschritten? Generalsekretär
  Rutte : Ich beginne mit der zweiten Frage in Bezug auf Polen: Natürlich ist das
  ein gefährlicher Zwischenfall, und der geht ganz klar von Russland aus. Das hat
  natürlich mit dem Krieg in der Ukraine zu tun, der enden muss. Die Behörden untersuchen
  jetzt im Detail, was dahinterstand. Wenn es um unsere Abschreckung geht, dann hat
  der oberste Befehlshaber der NATO die Rolle, ständig die Abschreckung zu überwachen
  und auch regelmäßig unsere Haltung anzupassen. Da pflegen wir eine enge Zusammenarbeit
  mit Polen. Ich war in Warschau. Das war sowieso schon für Samstag geplant, aber
  war dann eben auch eine Gelegenheit, diese ernsthafte Lage anzusprechen. Ich stand
  am Freitag in Kontakt mit Premierminister Donald Tusk und mit Karol Nawrocki, dem
  Präsidenten, aber auch mit dem NATO -Kommandeur, der sich mit dem Verteidigungsminister
  ausgetauscht hat, um sicherzustellen, dass wir das volle Lagebild haben. Das, was
  dort geschehen ist, ist natürlich völlig inakzeptabel. Zur ersten Frage: Das ist,
  noch einmal, Teil dessen, was wir als NATO tun, nämlich kontinuierlich – zu Land,
  zur See und in der Luft – unsere Verteidigungslage hinsichtlich der Frage zu bewerten,
  wo wir uns anpassen müssen, und das tun wir für das ganze NATO -Gebiet. Das gilt
  auch für Kanada und die USA . Gemeinsam beschützen wir bzw. verteidigen wir ja auch
  die Arktis gegen russische oder chinesische Einflüsse. Wenn wir über den Weltraum
  sprechen, dann ist das natürlich auch ein Thema. In den deutschen Medien wurde ja
  berichtet, was die Russen da vielleicht planen. Ich kann Ihnen versichern, dass
  wir immer sicherstellen, dass wir jeden Quadratzentimeter des NATO -Territoriums
  verteidigen werden, und das bedeutet natürlich auch, dass wir sicher sein müssen,
  wenn es um den Weltraum geht. Bundeskanzler Merz : Die Nachrichten darüber, dass
  Russland plant, auch eine atomare Bewaffnung des Weltraums vorzunehmen, sind nicht
  neu, aber sie sind deswegen nicht weniger schockierend. Das zeigt, zu welcher Eskalation
  Russland offensichtlich bereit ist. Das zeigen auch die Drohnenvorfälle an der Ostgrenze
  von Polen. Wir müssen auch die Verteidigung der Außengrenzen der Europäischen Union
  und der NATO noch einmal stärken. Das gilt jetzt auch für die Drohnenabwehr. Das
  gilt übrigens auch für die Schwarzmeerküste, für Bulgarien, für Rumänien, wo wir
  ähnliche Vorfälle in den Hoheitsgewässern dieser beiden Länder gesehen haben. Also
  wird die Drohnenabwehr, die Verteidigung, die Abschreckung gegenüber Drohnen, eine
  der wichtigsten Aufgaben an der NATO -Ostgrenze sein, und deswegen beraten wir auch
  so ausführlich in der NATO und beraten wir auch so ausführlich in der Europäischen
  Union darüber. Es war kein Versprecher, dass ich das gerade gesagt habe. Denn wir
  werden natürlich am Donnerstag und Freitag in Brüssel auch über die Verteidigung
  der NATO -Ostgrenze sprechen, und das betrifft nicht nur Polen und die südeuropäischen
  Länder, das betrifft auch eine 1300 Kilometer lange Grenze zwischen Finnland und
  Russland, die wir alle besser verteidigen müssen, als wir das in den vergangenen
  Jahren geglaubt haben. Frage : Eine Frage sowohl an den NATO -Generalsekretär als
  auch an den Bundeskanzler: Wie groß ist Ihre Sorge, dass sich der Konflikt flächenmäßig
  ausbreitet? Sie haben eben die Ostsee erwähnt, den Angriff auf ein russisches Cargoschiff.
  Es gibt einen Angriff der Ukrainer vor der Küste von Libyen, und im Schwarzen Meer
  greifen sich Russland und die Ukraine gegenseitig an. Wie groß ist also die Sorge,
  gerade wenn man sieht, dass Russland jetzt Estland als NATO -Land und EU -Land vorwirft,
  den Luftraum für die ukrainischen Angriffe zur Verfügung gestellt zu haben? Auch
  die zweite Frage an Sie beide: Der französische Präsident hat letzte Woche gesagt,
  dass jetzt der Zeitpunkt gekommen sei, über einen NATO -Beitritt der Ukraine zu
  reden. Teilen Sie diese Ansicht? Generalsekretär Rutte : Beginnen wir mit der ersten
  Frage: Darf ich darauf hinweisen, dass zu diesem Zeitpunkt, wo wir hier stehen,
  die Ukraine jeden Monat etwa 40.000 bis 50.000 russische Soldaten tötet oder sehr
  schwer verwundet? Im Vietnamkrieg haben die USA in Jahrzehnten 56 000 Soldaten verloren.
  Wir reden hier über Verluste von 40.000 bis 50.000 für Russland. Die Frontlinie
  verschiebt sich jetzt wieder in Richtung Russland. Man sieht auch in Russland die
  Auswirkungen des Krieges. Dass Putin akzeptiert, dass er so viele Soldatenleben
  verliert, sagt ja etwas über ihn und über das aus, was er zu opfern bereit ist.
  Das ist der Kontext, in dem wir uns befinden. Wenn man sich die hybride Bedrohung
  anschaut: Ja, das ist sehr ernsthaft. Wir haben gesehen, was in Leipzig geschehen
  oder glücklicherweise nicht geschehen ist. Das konnte verhindert werden. Das ist
  wirklich eine ernsthafte Situation. Wir haben das in Polen, in Estland usw. gesehen.
  Wenn es um den militärischen Bereich geht: Als NATO werden wir, wie ich schon gesagt
  habe, unsere Verteidigung und Abschreckung bewerten und anpassen, sofern das nötig
  ist. Allgemeiner gesprochen: Als Gesellschaften müssen wir resilient sein. Wir arbeiten
  eng in der NATO zusammen. Wir konsultieren uns sehr oft mit der EU . Wir haben verschiedene
  Möglichkeiten der Reaktion. Das kommunizieren wir nicht immer offen. Sie können
  das auch nicht immer sehen. Das ist auch nicht immer Auge um Auge, Zahn um Zahn.
  Manchmal geht man einen Schritt zurück und sagt: Ja, das ist ernsthaft, und wir
  nehmen das auch ernst. Aber mit unserer militärischen Unterstützung für die Ukraine
  – wir kämpfen dort ja nicht – gelingt es ihnen, der russischen Aggression entgegenzutreten,
  massiv entgegenzutreten. Dann muss man einfach weitermachen und die Ukraine weiterhin
  unterstützen. Das heißt also, für jeden Zwischenfall in Europa mehr Unterstützung
  für die Ukraine, nicht weniger. Das ist die beste Reaktion, die man zeigen kann.
  Zur zweiten Frage: Das hat natürlich etwas mit der Debatte über Sicherheitsbedenken
  in Europa zu tun. Das haben wir in der Vergangenheit gesehen, als Deutschland der
  NATO beigetreten ist. Als Deutschland am 3. Oktober 1990 wiedervereint wurde, hat
  die Sowjetunion das akzeptiert. Als Deutschland als ganzes Land der NATO beigetreten
  ist, gab es eine Diskussion über Sicherheitsfragen auf sowjetischer Seite, auf europäischer
  Seite. Das ist jetzt nichts Außergewöhnliches, das gibt es. Aber was nicht passieren
  darf, ist, dass wir gezwungen werden, die NATO wieder auf die Grenzen von 1997 zurückzufahren
  oder dass andere entscheiden, wie wir uns aufstellen sollen, und nicht die Bündnispartner
  selbst. Vor diesem Hintergrund kann eine solche Frage natürlich diskutiert werden.
  Erst einmal müssen aber echte Friedensverhandlungen beginnen. Ich freue mich über
  die US -Bemühungen. Die Europäer stimmen sich sehr eng mit den USA und mit der Ukraine
  ab, und wir haben eine geeinte Position. Jetzt geht es aber auch darum festzustellen,
  ob Putin wirklich bereit ist. Wenn diese Fragen dann wieder diskutiert werden, dann
  obliegt es einzig und allein den Mitgliedern der NATO zu entscheiden, wer Mitglied
  ist und wer nicht. Es ist schon lange NATO -Position, dass die Ukraine der NATO
  beitreten sollte. Das ist auch nicht neu, sondern das war bereits lange Jahre die
  Haltung der NATO . Bundeskanzler Merz : Ich denke, wir sehen heute alle – jedenfalls
  aus der Rückschau –, welcher Fehler es war, dem amerikanischen Vorschlag im Jahr
  2008 auf dem NATO -Gipfel in Bukarest nicht zu folgen, die Ukraine in die NATO aufzunehmen.
  Wenn sie Mitglied der NATO geworden wäre, wäre dieser Krieg wahrscheinlich zu verhindern
  gewesen. Insofern ist die Position, die heute vom französischen Staatspräsidenten
  eingenommen wird, sachlogisch. Sie entspricht im Übrigen auch den Sicherheitsgarantien,
  die die Ukraine braucht und die wir ihr nach dem Ende dieses Krieges auch geben
  wollen. Das sollen Artikel-5-ähnliche Sicherheitsgarantien sein, und insofern kommen
  schon diese Sicherheitsgarantien einem NATO -Beitritt sehr nahe. Ich kann mir die
  Zukunft der Ukraine ohne solche Sicherheitsgarantien, die sie dringend braucht,
  ehrlich gesagt nicht vorstellen. Es sind Sicherheitsgarantien nicht allein für die
  Ukraine, sondern es sind Sicherheitsgarantien für uns alle. Wir sehen, welchen Angriffen
  auch wir in Europa, in Deutschland, in Finnland, in Dänemark, in Polen ausgesetzt
  sind. Das heißt, wir alle sind im Augenblick Adressat der massiven militärischen
  Interventionen Russlands und auch der Cyber attacken, die wir auf unser Land sehen.
  Dagegen müssen wir uns besser schützen.'
