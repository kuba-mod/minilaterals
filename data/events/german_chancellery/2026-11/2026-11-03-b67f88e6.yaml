date: '2026-11-03'
type: press_release
source_name: german_chancellery
title: 'Rede von Bundeskanzler Merz anlässlich des Wirtschaftspolitischen Frühstücks
  der IHK Merz bei IHK Berlin: Es ist noch nicht genug, aber wir kommen voran'
text: 'Bundeskanzler Merz hebt die lebendige Start-up-Gründungen in Deutschland hervor.
  Beim wirtschaftspolitischen Frühstück der Industrie- und Handelskammer (IHK) in
  Berlin warb Bundeskanzler Merz für Investitionen und Reformen in Deutschland. In
  seiner Rede würdigte er die Berliner Wirtschaft als „eine traditionsreiche Mischung
  aus Industrieunternehmen, aus Mittelstand, aus Start-ups“, und gratulierte zum dynamischen
  Wachstum über dem Bundesdurchschnitt. Die Bundesregierung habe schon einiges auf
  den Weg gebracht, um das Wachstum und die Wettbewerbsfähigkeit Deutschlands voranzubringen.
  Dabei verwies der Kanzler auf die große Unternehmenssteuerreform, die Körperschaftssteuersenkung
  und der Fortschritt beim Bürokratieabbau. Sehr geehrter Herr Präsident, lieber Herr
  Stietzel, Frau Schreiner, meine sehr geehrten Damen und Herren, herzlichen Dank
  für die freundliche Begrüßung zum wirtschaftspolitischen Frühstück der IHK Berlin
  – ohne Frühstück. Ich freue mich, dass ich die Gelegenheit habe, heute Morgen bei
  Ihnen zu sein. Herzlichen Dank für das liebenswürdige Zitat aus dem Jahr 2005: Eine
  Gesellschaft, die nicht streitet, schläft ein. – Ja, ich kann mich daran erinnern,
  dass ich das gesagt habe, nicht ahnend, dass ich heute mal hier als Bundeskanzler
  stehe und sagen muss, in diesem Sinne ist die Koalition hellwach. Meine Damen und
  Herren, wir treffen uns zu einer nicht ganz einfachen Zeit. Lassen Sie mich zunächst
  einmal sagen: Ich bin immer wieder von diesem Haus beeindruckt. Es ist ja nun, wenn
  ich das richtig weiß, seit fast 30 Jahren Ihr Haus. Das Haus ist zu einem Wahrzeichen
  für die Berliner Wirtschaft geworden. Diese 15 Stahlbögen, wie ich mir habe sagen
  lassen, sind für Sie, für die Berliner Wirtschaft, eine tragende Struktur im doppelten
  Sinne des Wortes. Das verbindet sich mit dieser Weltoffenheit und dieser Zukunftsoffenheit,
  die Sie gerade auch noch einmal beschrieben haben, Herr Stietzel. Als Sie hier eingezogen
  sind, war Berlin noch eine andere Stadt. Helmut Kohl war im Amt, wenn auch nur noch
  für wenige Tage. Die Berliner Wirtschaft hat seitdem ein wirklich bemerkenswertes
  Wachstum hingelegt – Sie haben es gerade beschrieben –, sie macht wirklich etwas
  her. Es ist eine traditionsreiche Mischung aus Industrieunternehmen, aus Mittelstand,
  aus Start-ups. Sie alle haben dafür gesorgt, dass die Stagnation, die Deutschland
  für viele Jahre, wenn nicht Jahrzehnte erfasst hat, in Berlin tatsächlich nie existiert
  hat. In diesem Sinne noch einmal herzlichen Dank, herzlichen Glückwunsch auch für
  dieses dynamische Wachstum über dem Bundesdurchschnitt! Das ist nicht nur der Erfolg
  der Berliner Unternehmerinnen und Unternehmer, das ist auch der Erfolg Ihrer IHK
  . Sie vertreten, wie wir alle wissen, Unternehmen verschiedenster Größenordnung
  – Sie haben es gerade in dem Film auch noch einmal gezeigt –, und Sie vertreten
  die Berliner Wirtschaft in ihrer ganzen Vielfalt. Sie setzen sich dafür ein, dass
  die Rahmenbedingungen für die Unternehmen stimmen. Das tun sie ‑ die Rahmenbedingungen
  in Berlin sind gut, jedenfalls, soweit Sie sie beeinflussen können –, aber die Lage
  in Berlin ist insgesamt nicht einfach. Es wird Sie nicht überraschen, wenn ich sage:
  Wir in der Bundesregierung haben schon einiges auf den Weg gebracht, versuchen es
  jedenfalls, damit wir insgesamt in Deutschland vorankommen. Ich will nur wenige
  Stichworte nennen: Wir haben gleich zu Beginn der Wahlperiode – ich sehe hier auch
  Kollegen aus dem Deutschen Bundestag und dem Berliner Abgeordnetenhaus – eine relativ
  große Unternehmenssteuerreform auf den Weg gebracht. Wir haben Abschreibungsbedingungen
  geschaffen, wie wir sie in Deutschland selten hatten. Wir haben die Körperschaftssteuersenkung
  beschlossen – sie wird ab dem Jahr 2028 Schritt für Schritt in Kraft treten –, und
  wir kommen auch beim Bürokratieabbau voran. Wir haben jetzt insgesamt zwei große
  Entlastungskabinette gehabt mit einem Entlastungsvolumen beim Erfüllungsaufwand
  für die Bürokratie von ungefähr zehn Milliarden Euro für die gesamte Wirtschaft
  in Deutschland. Ich weiß, das ist alles noch nicht genug, aber wir sind auf dem
  Weg, weil wir gesehen haben, wo die Probleme gerade bei der hohen Bürokratiedichte
  in unserem Lande liegen. Ich kann Ihnen so viel sagen: Wir werden in den nächsten
  Monaten die ersten praktischen Ergebnisse sehen. Wir haben das Infrastruktur-Zukunftsgesetz
  verabschiedet. Es ist in Kraft. Es ist ein Gesetz, mit dem sich die Genehmigungsverfahren
  für große Infrastrukturvorhaben drastisch vereinfachen. Diejenigen, die die Autobahnen
  in Deutschland ein bisschen besser kennen, wissen, dass auf der sogenannten Sauerlandlinie
  – das ist die wichtigste Verkehrsverbindung zwischen dem Rhein-Ruhr-Gebiet und dem
  Rhein-Main-Gebiet – diese Brücke, die dort mal zusammengebrochen ist bzw. gesprengt
  werden musste, innerhalb von gut drei Jahren wieder aufgebaut worden ist; unter
  Verzicht auf alle möglichen Genehmigungsverfahren, unter Verzicht auf ein neues
  Planfeststellungsverfahren, alles mit Sondergenehmigungen. Das, was wir dort mit
  vielen, vielen Ausnahmen gemacht und Ende 2025 eingeweiht haben, wird in Zukunft
  der Regelfall für Genehmigungsverfahren in ganz Deutschland sein. Das heißt, wir
  werden in Zukunft schnell bauen, schnell umsetzen können. Das Geld ist da, und die
  Genehmigungsverfahren sind jetzt auch neu geordnet. Lassen Sie mich in diesem Zusammenhang
  auch sagen, meine Damen und Herren – der eine oder andere von Ihnen wird es mitbekommen
  haben –: Wir hatten gestern den zweiten großen Digitalgipfel hier in Berlin, im
  letzten Jahr zusammen mit Frankreich, bei dem wir eine enge Partnerschaft mit Frankreich
  bei der Digitalisierung beschlossen haben. Wir hatten gestern den Zweiten; das Thema
  KI stand im Vordergrund. Ich sage das mit großem Respekt auch vor der Berliner Start-up-Szene:
  Sie sind ein Start-up-Standort geworden wie kein zweiter in Deutschland. Jedes zweite
  Unternehmen, das neu gegründet wird, wird KI -basiert gegründet, insbesondere hier
  in Berlin. Wir schaffen die Rahmenbedingungen dafür, dass Deutschland ein modernes,
  das modernste europäische KI -Land bis zum Jahr 2030 wird. Das sind nicht Ankündigungen,
  sondern wir sind mittendrin in diesem Prozess. Mit Karsten Wildberger als dem zuständigen
  Digitalisierungs- und Staatsmodernisierungsminister ‑ das ist übrigens das erste
  Mal, dass es so etwas in der Geschichte der Bundesrepublik Deutschland gibt, mit
  vollen Querschnittkompetenzen durch die gesamte Bundesregierung – aben wir jemanden
  aus der Privatwirtschaft für die Bundesregierung gewonnen – ich will es hier einfach
  noch einmal sagen –, der einen super Job macht. Wir kommen bei dem Thema Staatsmodernisierung
  und Digitalisierung wirklich in großer Geschwindigkeit voran. Das bin nicht ich,
  der das sagt, sondern das ist zum Beispiel Julia Jäkel, die ja mit in der Kommission
  für einen modernen Staat war, die gesagt hat: Wir erleben zurzeit den größten Modernisierungsschub,
  den wir in Staat und Gesellschaft in den letzten Jahrzehnten jemals erlebt haben.
  Ja, wahr ist: Das ist alles noch nicht spürbar, das ist alles im Alltag noch nicht
  jeden Tag greifbar. Aber allein die Tatsache, dass wir im letzten Jahr 2025 3.500 Start-up-Gründungen
  in Deutschland hatten, allein die Tatsache, dass schon zur Mitte des Jahres 2026
  weitere 3.000 Start-up-Unternehmen in Deutschland gegründet worden sind – noch einmal
  sehr viele davon hier in Berlin –, zeigt, dass wir hier eine muntere Unternehmensgründungsszene
  haben. Neue Unternehmen würden nicht gegründet, von jungen Leuten und auch von Älteren
  nicht, wenn sich damit nicht die Hoffnung und die Zuversicht verbinden würde, dass
  es sich an einem solchen Standort wie Deutschland lohnt zu investieren. Das ist
  aus meiner Sicht ein wirklich ermutigendes Zeichen. Noch einmal: Wir wollen bis
  zum Jahr 2030 ein modernes, das moderne KI -Land in Europa werden. Den Weg gehen
  wir, und das Ziel werden wir auch erreichen. Ich will in diesem Zusammenhang auch
  darauf hinweisen: Wir suchen nicht nur in Europa, sondern auf der ganzen Welt Partner,
  die uns auf diesem Weg begleiten, die diesen Weg mit uns gehen. Wir hatten gestern
  Polen, Finnland und weitere europäische Länder bis hin zu Kanada dabei, die jetzt
  ganz fest mit uns verbunden sind, bis hin zu gemeinsamen Unternehmen, die sich zusammengeschlossen
  haben oder neu gegründet werden. Das heißt, hier entsteht ein Ökosystem, KI -basiert,
  das wirklich mit den großen Entwicklungen Schritt halten kann, zum Beispiel in den
  USA und auch in der Volksrepublik China. Was ich Ihnen hier sage, das hätte ich
  nicht gewagt, vor zwei Jahren von dieser Stelle aus zu sagen: Wir haben die Chance,
  das zu erreichen, was Präsident Macron schon im Jahr 2017 – damals etwas ungläubig
  bestaunt und beschwiegen, auch aus Deutschland – in seiner ersten berühmten Rede
  vor der Pariser Sorbonne Universität gesagt hat, dass wir europäische Souveränität
  erreichen wollen. Meine Damen und Herren, genau das können wir erreichen – europäische
  Souveränität. Das heißt nicht Autarkie. Wir sind damit nicht völlig unabhängig von
  allen anderen. Aber wir schaffen Souveränität in dem Sinne, dass auch andere von
  uns abhängig sind und wir anderen, insbesondere den USA , bei diesen Themen auf
  Augenhöhe begegnen können. Genau das ist das Ziel. Genau deshalb bin ich auch in
  der Europäischen Union so engagiert, damit wir mit europäischen Partnern zusammen
  diesen Weg gehen. Bitte lassen Sie uns nicht unterschätzen – bei aller Kritik, die
  im Detail auch immer wieder berechtigt ist –, welchen großen Vorteil wir haben,
  in einem großen europäischen Binnenmarkt mit 450 Millionen Verbrauchern zu leben,
  mit 27 Mitgliedstaaten, die in diesem Bereich, in dieser Hinsicht, alle dasselbe
  Ziel verfolgen, nämlich ein moderner Industriestandort in ganz Europa sein zu wollen.
  Davon wird kein Land so profitieren wie die Bundesrepublik Deutschland. Nun ist
  wahr, dass wir vor diesem Hintergrund noch eine ganze Reihe von Hausaufgaben im
  eigenen Lande zu erledigen haben. Insbesondere müssen wir unseren Sozialstaat bezahlbar
  und zukunftsfest gestalten. Wir müssen dafür sorgen, dass die Unternehmen nicht
  weiter mit Sozialversicherungsbeiträgen belastet werden, dass sie nicht durch steigende
  Lohnnebenkosten immer mehr stranguliert werden. Wir haben in allen drei Teilsystemen
  – Rente, Gesundheit und Pflege – die ersten Schritte umgesetzt. Die ersten Reformen
  sind bereits verabschiedet. Wir sind dabei, eine große Rentenreform vorzubereiten.
  Die Blaupause dafür haben wir durch die Alterssicherungskommission, die nicht nur
  aus Wissenschaftlern zusammengesetzt war, sondern auch aus Praktikern und drei Vertretern
  der Koalitionsfraktionen; drei Abgeordnete haben als stellvertretende Vorsitzende
  mit in dieser Kommission gesessen. Sie hat am 23. Juni einstimmig einen Bericht,
  einen umfassenden Vorschlag, vorgelegt, wie wir das deutsche Alterssicherungssystem
  neugestalten können. Wir nutzen in diesem Zusammenhang erstmals auch umfassend die
  Chancen des Kapitalmarktes innerhalb der gesetzlichen Rentenversicherung. Meine
  Damen und Herren, bitte lassen Sie uns auch nicht unterschätzen, was das bedeutet.
  Wir haben durch das bereits beschlossene, in Kraft getretene Altersvorsorgedepot,
  das ab dem 1. Januar 2027 vollumfänglich genutzt werden kann, und durch die auf
  den Weg gebrachte Frühstartrente jetzt einen wirklichen Paradigmenwechsel in Deutschland
  vollzogen, was die Alterssicherung angeht. Wir verlassen uns nicht mehr allein auf
  umlagefinanzierte Systeme, sondern wir werden in der Breite der Bevölkerung, in
  der ersten Säule der Alterssicherung, also in der Rentenversicherung, ein kapitalgedecktes
  Element einführen, das individualisiert ist und vom ersten Tag an eigentumsgeschützt
  jedem einzelnen Versicherten mit dem Aufbau einer kapitalgedeckten zusätzlichen
  Altersversorgung zugutekommt. Das, was wir hier in der Koalition miteinander verabredet
  haben, wäre – auch das will ich in diesem Zusammenhang einmal anerkennend sagen –
  mit der Sozialdemokratischen Partei Deutschlands vor Jahr und Tag noch nicht möglich
  gewesen. Wir haben das mit der SPD vereinbart, das ist auf dem Weg, und wenn wir
  die große Rentenreform in den wesentlichen Teilen jetzt noch vor Weihnachten im
  Kabinett verabschieden – im rentenrechtlichen Teil ausformuliert, im kapitalmarktrechtlichen
  Teil in den Eckpunkten festgelegt –, dann gehen wir mit dem Altersvorsorgedepot,
  mit der dann ab dem Schuljahr 2027/2028 beginnenden Frühstartrente und mit dieser
  Rentenreform wirklich mit einem – ich wiederhole das Wort – Paradigmenwechsel in
  der Altersvorsorge unseres Landes in das neue Jahr 2027. Perspektivisch werden die
  Beiträge sinken und die Leistungen aus diesem System steigen. Wir machen damit etwas,
  was andere Länder in Europa schon vor vielen Jahren gemacht haben. Wir haben uns
  ganz wesentlich am schwedischen Modell orientiert, und wir bekommen damit zweierlei:
  Wir bekommen damit eine sichere Altersversorgung, demografiefest, und wir bekommen
  gleichzeitig Geld in den eigenen Kapitalmarkt, das zur Verfügung steht, um Unternehmensfinanzierung
  in Deutschland nicht mehr nur über die Banken, sondern auch und vor allem über den
  Kapitalmarkt zu ermöglichen. Das ist immer eine Schwäche unseres Standortes gewesen.
  Das ist immer auch eine bei uns vernachlässigte Größe gewesen. Wir hatten zwischen
  Politik und Wirtschaft immer relativ große Abstände, nicht nur geografisch zwischen
  Bonn und Frankfurt – noch größer geworden zwischen Berlin und Frankfurt –, sondern
  wir hatten immer auch Hemmungen, dieses Thema so für Altersvorsorge, Vermögensaufbau
  und Unternehmensfinanzierung zu nutzen, wie andere Länder das längst gemacht haben.
  Wir haben das jetzt in der Koalition hinsichtlich der ersten großen Themen auf den
  Weg gebracht. Nun, meine Damen und Herren, das alles zeigt: Es hat Wirkung. Wir
  haben im Jahr 2026 ein Wirtschaftswachstum von etwa 1,3 Prozent zu erwarten. Die
  Prognosen sind im Laufe des Jahres glatt verdoppelt worden, zum Teil auch wider
  Erwarten. Ich gebe zu: Auch ich hätte das erst für das Jahr 2027 erwartet, nicht
  schon für das Jahr 2026. Wahr ist aber auch: Dieses Wachstum ist noch nicht selbst
  tragend und dauerhaft. Es ist ganz überwiegend, wenn auch nicht ausschließlich durch
  Kredite finanziert, durch kreditfinanzierte Infrastrukturvorhaben, durch kreditfinanzierte
  Nachfrage in der Verteidigungsindustrie. Aber auch gerade dazu will ich mich ausdrücklich
  bekennen, meine Damen und Herren. Wenn wir das im letzten Jahr nicht gemacht hätten
  – ich weiß, dass das für uns und auch für mich persönlich ein nicht ganz unerhebliches
  Glaubwürdigkeitsproblem mit sich bringt –, wenn wir nicht auf diese Art und Weise
  auch die Bundeswehr neu aufgestellt und neu finanziert hätten, dann hätten wir Anfang
  Juni letzten Jahres die NATO nicht zusammengehalten. Das war die Entscheidung, die
  wir treffen mussten, um auf die Herausforderung angemessen zu antworten, die wir
  durch den Krieg in der Ukraine nun seit fast fünf Jahren erleben. Das ist eine Herausforderung,
  die wir alle in dieser Dimension so nicht vorausgesehen haben. Für mich – auch das
  will ich hier offen sagen – haben den letzten Anstoß der Besuch von Selenskyj im
  Weißen Haus im Februar des letzten Jahres und die Szenen gegeben, die sich dort
  abgespielt haben. Er wird gleich über Mittag wieder bei mir sein. Dann wird das
  etwas anders ablaufen. Aber das, was wir im letzten Jahr erlebt haben, meine Damen
  und Herren, war der letzte Anstoß dafür, dass ich gesagt habe: Wir müssen jetzt
  selbst dafür sorgen, dass wir uns in Europa verteidigen können – nicht, um damit
  die NATO infrage zu stellen, sondern ich sage immer wieder zwei Sätze –, erstens:
  Wir müssen uns verteidigen können, wir wollen uns verteidigen können, damit wir
  uns nicht verteidigen müssen. Zweitens: Wir machen die NATO europäischer, damit
  sie transatlantisch bleiben kann. Das sind die beiden Leitlinien in der Außen- und
  Sicherheitspolitik, die wir in der Bundesregierung verfolgen. Nun will ich aus Gründen
  der Kürze und auch, um die Möglichkeit zu verschaffen, gleich noch in eine kurze
  Diskussion mit Ihnen einzusteigen, einen kurzen Blick auf die Berliner Landespolitik
  richten, denn das, was wir zurzeit in den Diskussionen und den Gesprächen um eine
  mögliche Koalition unter Führung der Linkspartei in Berlin erleben, meine Damen
  und Herren, macht uns große Sorgen, nicht nur wegen Berlin, sondern es macht uns
  auch große Sorgen wegen der Ausstrahlungswirkung für ganz Deutschland. Wenn in Deutschland,
  wenn in der Hauptstadt unseres Landes offen über Enteignungen geredet wird, dann
  hat das Auswirkungen bis hin zu den Kapitalmärkten in London, Paris und New York
  . Also bitte betrachte dies niemand hier als eine Privatangelegenheit von Berlin.
  Abgesehen davon weiß ich gar nicht, wie man so etwas eigentlich bezahlen will. Wir
  müssten eigentlich miteinander das Selbstverständnis aufbringen, dass der Schutz
  des Eigentums zu den Grundprinzipien unserer Wirtschaftsordnung gehört und dies
  auch so bleiben sollte. Ich jedenfalls möchte das nicht; denn, meine Damen und Herren,
  nur wer Eigentum verlässlich schützt, bewahrt Vertrauen, und ohne Vertrauen gibt
  es keine Investitionen. Das ist ein ganz einfacher Satz, im Grunde eine Banalität.
  Durch Vergesellschaftung entsteht nicht ein einziger neuer Arbeitsplatz, entsteht
  nicht eine einzige neue Wohnung. Und wenn Wohnungen verstaatlicht werden, werden
  nicht nur Immobilieninvestoren ihr Geld zurückverlangen, sondern es wird insgesamt
  dem Wirtschaftsstandort massiv schaden. Diese Diskussion schafft Verunsicherung,
  und sie wäre eigentlich überflüssig, wenn diejenigen, die zurzeit die Gespräche
  führen, den Berliner Appell, den offenen Brief von Gründerinnen und Gründern, Investorinnen
  und Investoren aus Berlin, respektieren würden. Weil ich weiß, dass auch einige
  der Autoren dieses offenen Briefs hier im Publikum sitzen, will ich ausdrücklich
  Danke sagen, dass Sie sich darin so offen und so klar zu diesem Thema positioniert
  haben; denn das, was hier gerade in Berlin diskutiert wird, ist für Sie und für
  uns alle in Deutschland existenziell. Meine Damen und Herren, in diesem Sinne noch
  einmal herzlichen Dank. Lassen Sie mich vielleicht abschließend noch eine Bemerkung
  zur geopolitischen Lage machen, damit wir es alle richtig einordnen. Wir sprechen
  viel über die Innenpolitik, die Wirtschaftspolitik und die Sozialpolitik, aber täuschen
  wir uns bitte alle zusammen nicht, was wir gegenwärtig auf der Welt erleben. Dies
  ist nicht eine lineare Fortsetzung dessen, was wir in den letzten 70 oder 75 Jahren
  der Geschichte der Bundesrepublik Deutschland, in den letzten 36 Jahren der Geschichte
  der Einheit Deutschlands erlebt haben. Das sind vielmehr so tiefgreifende Verwerfungen,
  dass wir wahrscheinlich erst mit einigen Jahren Abstand im Rückblick wirklich verstehen,
  was da im Augenblick passiert. Deswegen werde ich die Politik der Bundesregierung
  und auch meine persönlichen politischen Entscheidungen nicht danach ausrichten,
  was kurzfristig populär ist, sondern ich werde sie danach ausrichten, was langfristig
  aus meiner Sicht und aus unserer Sicht richtig und notwendig ist für unser Land.
  Denn es geht nicht darum, jetzt einzelne Diskussionen um eine Haltelinie in der
  Rentenversicherung zu führen, also darüber, ob sie nun bei 48, 47,5 oder 47 Prozent
  liegt. Das sind alles wichtige Diskussionen; aber am Ende des Tages geht es in dieser
  Welt, in der wir heute leben, in dieser Welt, in der autoritäre politische Führungen
  versuchen, die Welt unter sich aufzuteilen, wo sie regelbasierte Ordnungen grundsätzlich
  infrage stellen, wo alles infrage gestellt wird, was wir nach 1990 in Deutschland
  und in Europa gemeinsam auf den Weg gebracht haben. In dieser Welt geht es schlicht
  und ergreifend nur um eines: um unsere Selbstbehauptung in Freiheit und im Frieden.
  Das ist die oberste Maxime dessen, was mich leitet, auch jetzt in der Auseinandersetzung
  mit den politischen Wettbewerbern in Deutschland. Wir müssen dafür sorgen, dass
  wir ein Land bleiben – Sie hier in der Stadt Berlin haben dafür ein besseres Gefühl
  als viele andere in unserem Land –, in dem wir frei und friedlich miteinander leben
  können. Das ist nie so infrage gestellt worden wie gegenwärtig. Deswegen wird mein
  ganzes Bestreben darauf ausgerichtet sein, in genau einem solchen Land zu leben,
  das frei ist, das sicher ist, in dem die Menschen sich entfalten können und das
  den Namen einer freiheitlichen, liberalen, marktwirtschaftlich orientierten Gesellschaft
  verdient. Wenn Sie an dieser Arbeit und an dieser Aufgabe mitwirken wollen – und
  ich weiß, dass Sie das alle gemeinsam wollen, gerade hier in der IHK in Berlin –,
  dann sind Sie herzlich eingeladen, das zu tun. Lassen Sie uns nicht jeden kleinen
  parteipolitischen Streit sofort zum Grundsatzstreit werden lassen, sondern lassen
  Sie uns gemeinsam darum ringen, dass wir auch in den nächsten Jahren und Jahrzehnten
  in einem freien, offenen, liberalen, marktwirtschaftlich orientierten Land leben.
  Unsere Kinder und unsere Enkelkinder haben es verdient.'
