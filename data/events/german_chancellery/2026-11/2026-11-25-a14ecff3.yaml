date: '2026-11-25'
type: press_release
source_name: german_chancellery
title: Fragen und Antworten Entlastungen für Deutschland
text: 'Bürgerinnen und Bürger von steigenden Ausgaben im Alltag entlasten: Das ist
  ein wichtiges Ziel der Bundesregierung. Für die Bundesregierung hat es oberste Priorität,
  die Wirtschaft anzukurbeln, damit wieder wirtschaftliches Wachstum entstehen kann
  und Arbeitsplätze gesichert werden. Auch die Bürgerinnen und Bürger finanziell zu
  entlasten steht ganz oben auf der Agenda der Bundesregierung. Maßnahmen gegen hohe
  Energiepreise: Der Iran-Nahost-Konflikt sorgt für Unsicherheiten an den Märkten.
  Diese Entwicklung trägt zu den hohen Spritpreisen in Deutschland bei. Die Situation
  belastet nicht nur die Wirtschaft, sondern auch die Bürgerinnen und Bürger. Deshalb
  hat die Bundesregierung beschlossen, die Energiesteuer ein weiteres Mal um rund
  17 Cent pro Liter Kraftstoff zu senken. Der erneute Steuerrabatt beim Tanken gilt
  vom 1. Oktober 2026 bis Ende des Jahres. Zudem plant die Bundesregierung, zum 1.
  Januar 2027 einen vorübergehenden Spritpreisdeckel einzuführen. Die Entlastung der
  Bürgerinnen und Bürger ist ein zentrales Thema für die Bundesregierung: Sie hat
  direkte Auswirkungen auf das tägliche Leben, die wirtschaftliche Stabilität und
  das Vertrauen in den Staat. Folgende Maßnahmen wurden unter anderem beschlossen:
  Seit 1. Januar 2026 ist die Pendlerpauschale dauerhaft auf 38 Cent ab dem ersten
  Kilometer erhöht worden. Vorher galt dieser Satz erst ab dem 21. Kilometer. Die
  Bundesregierung entlastet damit Bürgerinnen und Bürger, vor allem diejenigen, die
  durch ihre Arbeit das Land am Laufen halten. Wer täglich pendelt, profitiert damit
  deutlich stärker als zuvor – das sorgt auch für mehr Gerechtigkeit zwischen Stadt
  und Land. Und es bedeutet eine spürbare Entlastung gerade für Leistungsträger im
  ländlichen Raum. Die Pendlerpauschale soll die Kosten für den Arbeitsweg steuerlich
  abfedern – unabhängig vom Verkehrsmittel (Auto, Fahrrad, Bahn oder zu Fuß). Bei
  einem Arbeitsweg von zehn Kilometern und einer Fünf-Tage-Woche ergeben sich jährlich
  bereits 176 Euro zusätzliche Werbungskosten – bei 20 Kilometern sind es sogar 352
  Euro. Wer lediglich fünf Kilometer vom Wohnort zum Arbeitsort zurücklegen muss,
  kann eine Pauschale von 418 Euro ansetzen – ein Plus von 88 Euro. Steuerpflichtige
  mit geringen Einkünften erhalten zudem auch weiterhin die Mobilitätsprämie . Die
  Entlastungen gelten also für alle – unabhängig vom Verkehrsmittel, die jeden Tag
  durch ihre Arbeit das Land am Laufen halten. Die Erhöhung der Pendlerpauschale ist
  zum 1. Januar 2026 in Kraft getreten. 2026 hat die Bundesregierung die Gasspeicherumlage
  abgeschafft und damit alle Verbraucherinnen und Verbraucher bei den Gaspreisen um
  mehr als drei Milliarden Euro entlastet. Bei den Stromkosten hat die Bundesregierung
  Haushalte und Unternehmen durch einen Bundeszuschuss zu den Netzentgelten in Höhe
  von 6,5 Milliarden Euro entlastet. Sie wird die Netzentgelte auch in den Jahren
  2027 bis 2029 mit jährlich gut 5,5 Milliarden Euro weiter bezuschussen. Zum 1. Januar
  2027 wird die Bundesregierung zudem die Stromsteuer für alle auf das europäische
  Mindestniveau senken. Das sind zusätzliche 5 Milliarden Euro Entlastung beim Strompreis,
  die vor allem kleine Betriebe und Familien spüren sollen. Für private Haushalte
  würde die Stromsteuer von derzeit 2,05 Cent je Kilowattstunde auf 0,1 Cent sinken.
  Für bislang nicht begünstigte Betriebe ebenfalls auf 0,1 Cent. Haushalte und Unternehmen
  werden zudem weiterhin durch die 2022 weggefallene EEG -Umlage bei den Stromkosten
  entlastet. Die Kosten trägt der Bundeshaushalt. 2027 sind es rund 12 Milliarden
  Euro. Mit der Mietpreisbremse soll es leichter gemacht werden, eine bezahlbare Wohnung
  im gewohnten Umfeld zu finden – insbesondere für Menschen mit kleinen und mittleren
  Einkommen. Deshalb hat die Bundesregierung die bis Ende 2025 befristete Mietpreisbremse
  bis Ende 2029 verlängert. Denn in vielen Städten sind die Wohnkosten stark gestiegen.
  Bezahlbares Wohnen ist eine der wichtigsten sozialen Fragen. Die Länder können nun
  weiter über den 31. Dezember 2025 hinaus „Gebiete mit angespanntem Wohnungsmarkt“
  bestimmen. In diesen Ballungsräumen darf die Miete zu Beginn des Mietverhältnisses
  die ortsübliche Vergleichsmiete höchstens um zehn Prozent übersteigen. Das Gesetz
  zur Verlängerung der Mietpreisbremse ist am 23. Juli 2025 in Kraft getreten – mit
  dem Ziel, den Mietenanstieg zu verlangsamen. Das Kindergeld – eine der wichtigsten
  Geldleistungen an Familien – soll ab Frühjahr 2027 ohne Antrag ausgezahlt werden.
  Ziel ist es, Eltern durch Bürokratierückbau gerade in der Zeit nach der Geburt zu
  entlasten. Die Umstellung auf das neue antragslose Kindergeld soll in zwei Stufen
  erfolgen. Die erste Stufe: Ab Frühjahr 2027 soll die Neuerung zunächst für Familien
  gelten, die bereits Kinder haben und Kindergeld beziehen. Grund dafür ist, dass
  die relevanten Daten der Familienkasse schon vorliegen. Die zweite Stufe: Ende 2027
  soll dann auch für erste Kinder das Kindergeld antragslos ausgezahlt werden. Voraussetzungen
  dafür sind aber, dass Mit den Maßnahmen der Modernisierungsagenda Bund und der föderalen
  Modernisierungsagenda soll der Staat schneller, digitaler, effizienter und bürgerfreundlicher
  werden. Bund und Länder verfolgen das Ziel, Bürokratie abzubauen, Verfahren zu beschleunigen
  und staatliche Strukturen so zu modernisieren, dass Bürgerinnen und Bürger, Unternehmen
  und Verwaltung entlastet werden. Um den Kauf von E-Fahrzeugen noch attraktiver zu
  machen, hat die Bundesregierung gezielte Maßnahmen beschlossen: Die Kfz - Steuerbefreiung
  für neue Elektroautos wurde bis zum Jahr 2035 verlängert. Außerdem werden insbesondere
  Familien sowie Bürgerinnen und Bürger mit kleinen und mittleren Einkommen beim Umstieg
  auf E-Mobilität mit einem Förderprogramm unterstützt. Familien und Menschen mit
  geringen und mittleren Einkommen sollen durch die Reduzierung der Einkommensteuer
  ab 2027 steuerlich entlastet werden. Der Steuertarif wird im Bereich zwischen 17.800
  und 70.600 Euro Einkommen abgeflacht. In dieser Zone steigt der Steuersatz weniger
  steil an als bisher. Daneben gibt es weitere Verbesserungen: Die Maßnahmen sollen
  ab 2027 greifen und ab 2028 ihre volle Wirkung entfalten. Das Gesetz befindet sich
  derzeit im parlamentarischen Verfahren und muss noch von Bundestag und Bundesrat
  beschlossen werden. Ab 2028 kann etwa eine berufstätige Familie mit zwei Kindern
  und einem zu versteuernden Gesamteinkommen von 60.000 Euro gegenüber heute um mehr
  als 600 Euro jährlich steuerlich entlastet werden. Das Entlastungsvolumen beträgt
  insgesamt circa zehn Milliarden Euro pro Jahr. Rund 3.400 Euro kostet der Führerschein
  im Durchschnitt. Für viele Menschen ist das eine große Hürde, um mobil zu sein.
  Der Weg zum Führerschein soll deshalb bezahlbarer, moderner und flexibler werden.
  Dabei müssen die Qualität der Ausbildung und das hohe Sicherheitsniveau erhalten
  bleiben. Die Bundesregierung hat dafür eine Reform der Fahrschulausbildung auf den
  Weg gebracht. Der erste Teil der Reform wurde bereits vom Bundesrat beschlossen,
  der zweite Teil – die Verordnung – soll Ende des Jahres beschlossen werden. Den
  Führerschein gibt es bald auch digital . Dafür hat die Bundesregierung die notwendigen
  Grundlagen geschaffen. Dies erleichtert künftig beispielsweise die Nutzung von Mobilitätsangeboten,
  wie etwa Carsharing . Ziel ist laut Bundesverkehrsministerium, den digitalen Führerschein
  bis Ende 2026 zur Verfügung zu stellen. Der Fahrzeugschein kann bereits digital
  genutzt werden. Mit gezielten Investitionsanreizen neues Wachstum schaffen: Das
  ist das Ziel der Bundesregierung. Ein steuerliches Investitionssofortprogramm, die
  Senkung der Energiepreise und Bürokratierückbau sollen die Wirtschaft ankurbeln
  und Arbeitsplätze sichern. Für Ausrüstungsinvestitionen nach dem 30. Juni 2025 und
  vor dem 1. Januar 2028 ist eine degressive Abschreibung von bis zu 30 Prozent möglich.
  Unternehmen können damit in den ersten Jahren nach der Anschaffung deutlich höhere
  Abschreibungsbeträge steuerlich geltend machen als bei der herkömmlichen linearen
  Abschreibungsmethode. Die Maßnahme dient der schnelleren Refinanzierung von Investitionen.
  Sie kommt allen Unternehmen gleichermaßen zugute und ist unkompliziert in der Umsetzung.
  Ausrüstungsinvestitionen beziehen sich auf bewegliche Wirtschaftsgüter, die ein
  Unternehmen anschafft, um seine Produktion oder Dienstleistungen zu verbessern.
  Dazu zählen etwa Maschinen und technische Geräte, Werkzeuge und Büroausstattung
  oder IT - Hardware wie Computer . Mit der schrittweisen Senkung der Körperschaftsteuer
  ab 2028 wird die Unternehmenssteuerbelastung deutlich reduziert. Die Körperschaftsteuer
  sinkt in fünf Schritten jedes Jahr um ein Prozent, und zwar von 15 auf zehn Prozent.
  Ab 2032 beträgt die Gesamtsteuerbelastung dann knapp 25 Prozent, statt aktuell knapp
  30 Prozent. Das ist international ein wichtiges Zeichen für den Standort Deutschland
  und die Wettbewerbsfähigkeit unseres Landes. Mit einem Investitions- Booster für
  E-Mobilität bei Unternehmen werden betrieblich genutzte Elektrofahrzeuge gefördert.
  Dafür hat die Bundesregierung eine stärkere Steuerbegünstigung von Dienstwagen sowie
  eine Sonderabschreibung für betriebliche E-Fahrzeuge eingeführt. Konkret heißt das:
  die beschleunigte Abschreibung von 75 Prozent der Anschaffungskosten für Elektrofahrzeuge
  bereits im Investitionsjahr. Die Regelung gilt für E-Autos, die nach dem 30. Juni
  dieses Jahres und vor dem 1. Januar 2028 neu angeschafft werden. Zudem hebt das
  Gesetz die Bruttolistenpreisgrenze für die besondere steuerliche Förderung elektrischer
  Dienstwagen von 70.000 Euro auf 100.000 Euro an. Die Bundesregierung hat außerdem
  eine Verlängerung der Kfz -Steuerbefreiung für reine Elektrofahrzeuge beschlossen.
  Diese ergänzt bereits umgesetzte Verbesserungen im Bereich der E-Mobilität , etwa
  bei Abschreibungsregeln und bei der Dienstwagenbesteuerung. Um Investitionen in
  Forschung zu fördern, wurde die Forschungszulage ausgebaut. Ab 2026 ist die Obergrenze
  zur Bemessung der steuerlichen Forschungszulage von zehn auf zwölf Millionen Euro
  gestiegen. Außerdem ist vorgesehen, förderfähige Anwendungen auszuweiten. Pauschale
  Abschläge machen Verfahren einfacher und bürokratieärmer. Die Forschungszulage ist
  eine steuerliche Förderung für Unternehmen, die in Forschung und Entwicklung investieren.
  Auch kleine Unternehmen und Start-ups können profitieren. Zur Entlastung energieintensiver
  Industrieunternehmen hat die Bundesregierung einen Industriestrompreis eingeführt
  . Das stärkt die Wirtschaft im internationalen Wettbewerb, vom Taschentuch- oder
  Schraubenhersteller bis zur Stahl- und Kupferindustrie. Der Industriestrompreis
  ergänzt die Strompreiskompensation , die nun zudem auf weitere Branchen ausgeweitet
  und dauerhaft fortgeführt werden kann. Besonders energieintensive Unternehmen können
  Industriestrompreis und Strompreiskompensation kombinieren. Beide Maßnahmen sollen
  die energieintensive Industrie im Jahr 2027 um rund 7,45 Milliarden Euro entlasten.
  Seit 2026 werden 600.000 produzierende Unternehmen, Land- und Forstwirtschaft dauerhaft
  bei der gewerblichen Stromsteuer entlastet. Sie wurde auf den gewerblichen EU -Mindeststeuersatz
  gesenkt. Davon profitieren viele mittelständische Betriebe – von der Fleischerei,
  der Bäckerei über energieintensive Industrieunternehmen bis hin zum Baugewerbe.
  2027 beträgt die Entlastung rund 3 Milliarden Euro. Die Wirtschaft profitiert –
  ebenso wie die privaten Haushalte – vom Bundeszuschuss zu den Netzentgelten und
  der Abschaffung der Gasspeicherumlage . Die Stromsteuersenkung für alle auf das
  europäische Mindestniveau wird viele weitere kleine und mittlere Betriebe spürbar
  entlasten. Die Bundesregierung setzt sich für den Abbau überflüssiger Regulierungen
  auf breiter Ebene ein. Mit den Maßnahmen der Modernisierungsagenda Bund und der
  föderalen Modernisierungsagenda soll der Staat schneller, digitaler, effizienter
  und bürgerfreundlicher werden. Bund und Länder verfolgen das Ziel, Bürokratie abzubauen,
  Verfahren zu beschleunigen und staatliche Strukturen so zu modernisieren, dass Bürgerinnen
  und Bürger, Wirtschaft und Verwaltung spürbar entlastet werden. Ziel ist es, die
  Bürokratiekosten allein für die Wirtschaft um etwa 16 Milliarden Euro zu reduzieren.
  Die Bundesregierung hat Verbesserungen im Rahmen der BAföG -Reform beschlossen.
  Ziel ist es, jungen Menschen in Ausbildung und Studium eine verlässliche, moderne
  und bestmögliche staatliche Unterstützung zu bieten. Die BAföG -Bedarfssätze für
  Studierende sollen schrittweise steigen: Ab dem Wintersemester 2027/28 von 475 Euro
  auf 503 Euro und im Sommersemester 2029 auf bis zu 563 Euro – das entspricht dem
  aktuellen Grundsicherungsniveau. Das soll helfen, Lebenshaltungskosten besser abzudecken.
  Bei Schülerinnen und Schülern beziehungsweise Azubis erfolgt auch eine entsprechende
  Anpassung. Zudem sind weitere Verbesserungen beim BAföG geplant: Erhöhung der Wohnkostenpauschale:
  Sie soll ab dem Sommersemester 2027 von 380 Euro auf 440 Euro monatlich steigen.
  Das soll Studierende angesichts hoher Mieten entlasten. Freibeträge steigen jährlich:
  Sie sollen ab dem Schuljahr beziehungsweise Wintersemester 2028 jährlich um 1,5
  Prozent steigen. Damit will die Bundesregierung den Kreis der Berechtigten erhalten.
  Kranken- und Pflegeversicherungszuschläge werden angepasst: Damit sollen die gestiegenen
  Versicherungskosten besser berücksichtigt und damit die BAföG -Förderung an die
  aktuellen Bedingungen angepasst werden. BAföG -Antrag digital: Künftig soll die
  Antragstellung bundesweit einheitlich und vollständig digital über das Portal „
  BAföG Digital “ laufen. Zudem sollen Regelungen, wie beispielsweise der Leistungsnachweis
  ab dem fünften Fachsemester oder Ausnahmetatbestände bei der Altersgrenze entfallen.
  Mehr Geld gibt es auch für berufliche Fortbildungen. Wer sich etwa zum Handwerks-
  oder Industriemeister, zur Technikerin, zum Betriebswirt oder zur staatlich geprüften
  Erzieherin weiterqualifizieren möchte, soll künftig noch stärker gefördert werden.
  Grundlage dafür ist die Reform des Aufstiegs- BAföG . Wer im Rentenalter freiwillig
  weiterarbeitet, kann bis zu 2.000 Euro steuerfrei hinzuverdienen. Möglich macht
  das die Aktivrente. Sie gilt für sozialversicherungspflichtige Arbeitnehmerinnen
  und Arbeitnehmer ab Erreichen der Regelaltersgrenze. Dabei erfolgt die Begünstigung
  unabhängig davon, ob die oder der Steuerpflichtige eine Rente bezieht oder den Rentenbezug
  aufschiebt. Die Aktivrente ist zum 1. Januar 2026 in Kraft getreten. Die gesetzliche
  Rente ist für die meisten Menschen in Deutschland das Haupteinkommen im Alter. Deshalb
  ist es wichtig, das Rentenniveau stabil zu halten und dafür zu sorgen, dass die
  gesetzliche Rentenversicherung weiterhin verlässlich bleibt. Die bis zur Rentenanpassung
  im Juli 2025 geltende Haltelinie für das Rentenniveau von 48 Prozent ist bis 2031
  verlängert worden. Mit der Mütterrente III sollen die Kindererziehungszeiten für
  vor 1992 geborene Kinder nun auch auf bis zu drei Jahre ausgeweitet werden. Die
  Bundesregierung will damit eine vollständige rentenrechtliche Gleichstellung für
  alle Mütter und Väter erreichen. Das Gesetz soll 2027 in Kraft treten. Mit der Mütterrente
  werden Kindererziehungszeiten angerechnet, die in die Berechnung der Rente einfließen.
  Bislang unterscheidet sich die Anerkennung von Erziehungsleistungen in der Rente
  nach dem Zeitpunkt der Geburt der Kinder: Für jedes Kind, das ab 1992 geboren wurde,
  können bis zu drei Jahre Kindererziehungszeit anerkannt werden. Für jedes Kind,
  das vor 1992 geboren wurde, können bislang lediglich bis zu zweieinhalb Jahre anerkannt
  werden. Diese Ungleichheit wird nun beseitigt. Die Bundesregierung will eine lebendige
  Gastronomiekultur in Deutschland erhalten. Sie ist ein wichtiger Teil der ländlichen
  Infrastruktur und Kulturlandschaft. Deshalb wurde folgende Maßnahme getroffen: Die
  Umsatzsteuer für Speisen in der Gastronomie – mit Ausnahme der Abgabe von Getränken
  – ist von 19 Prozent auf sieben Prozent reduziert worden. Das gilt seit dem 1. Januar
  2026. Von der Senkung der Umsatzsteuer profitieren neben klassischen Gastronomiebetrieben
  auch Bäckereien, Metzgereien, der Lebensmitteleinzelhandel, Catering -Anbieter sowie
  die Kita -, Schul- und Krankenhausverpflegung. Mit der Steuersenkung stärkt die
  Bundesregierung gezielt die Gastronomiebranche – auch als Arbeitgeber. Außerdem
  schafft die Maßnahme Wettbewerbsgleichheit mit Anbietern von Au ß er-Haus-Verpflegung,
  denn f ü r Essen zum Mitnehmen und Speisenlieferungen gilt bereits ein Umsatzsteuersatz
  von sieben Prozent. Die direkte Weitergabe der Umsatzsteuersenkung an Kunden ist
  aus Sicht der Bundesregierung w ü nschenswert, aber kein Automatismus. Entscheidungen
  obliegen den betroffenen Unternehmen abh ä ngig von Marktbedingungen. Die Gastronomiebranche
  wird mit der Maßnahme um 3,6 Milliarden Euro jährlich entlastet. Die Reduzierung
  der Umsatzsteuer für die Gastronomie ist zum 1. Januar 2026 in Kraft getreten. Die
  Bundesregierung schätzt die Arbeit, die die deutsche Landwirtschaft für uns alle
  leistet, sehr. Sie sichert unsere Ernährung, gestaltet unsere Landschaft und wirkt
  an dem gesellschaftlichen Miteinander mit. Folgende Entlastungsmaßnahmen wurden
  unter anderem getroffen: Die Bundesregierung hat ein zentrales Versprechen aus dem
  Koalitionsvertrag und dem „Sofortprogramm für Deutschland“ erfüllt: Die Agrardieselrückvergütung
  wurde vollständig wieder eingeführt. Seit 1. Januar 2026 erhalten land- und forstwirtschaftliche
  Betriebe erneut 21,48 Cent pro Liter Diesel zurück. Das entlastet die Branche dauerhaft
  um rund 430 Millionen Euro jährlich. Mit der Abschaffung der Stoffstrombilanzverordnung
  im Juli 2025 werden die Landwirtinnen und Landwirte bei Dokumentationspflichten
  spürbar entlastet. Durch den Wegfall gewinnen die Betriebe mehr Zeit für ihre wesentlichen
  Betriebsaufgaben. Jährlich können rund 18 Millionen Euro überflüssiger Bürokratieaufwand
  eingespart werden. Die Bundesregierung hat auch hier ein Versprechen aus dem Koalitionsvertrag
  zügig umgesetzt. Zudem hat die Bundesregierung im Juli 2026 ein ganzes Maßnahmenpaket
  für den Bürokratierückbau in der Landwirtschaft beschlossen. Unter anderem ist geplant:
  Damit soll für die Landwirtschaft eine Entlastung von zwölf Millionen Euro und für
  die Verwaltung von einer Million Euro einhergehen. In Deutschland engagieren sich
  Millionen Menschen ehrenamtlich. Bürgerschaftliches Engagement ist ein wichtiges
  Fundament unserer Gesellschaft und verdient große Anerkennung: Die Bundesregierung
  hat deshalb eine Reihe an Änderungen zum Gemeinnützigkeitsrecht umgesetzt. Damit
  will sie das Ehrenamt weiter stärken und Anreize schaffen, sich stärker bürgerschaftlich
  zu engagieren. Diese Entlastungen und Verbesserungen wurden unter anderem beschlossen:
  Zur Stärkung des ehrenamtlichen Engagements wird die Übungsleiter- und Ehrenamtspauschale
  von 3.000 Euro auf 3.300 Euro bzw. von 840 Euro auf 960 Euro angehoben. Da der ehrenamtliche
  Einsatz auch mit Kosten verbunden sein kann, nimmt das Steuerrecht auf die Belange
  ehrenamtlich Engagierter in besonderer Weise Rücksicht und erhebt auf deren Einnahmen
  bis zu einem Freibetrag keine Steuern. Zudem dient auch dies dem Bürokratieabbau
  und erleichtert es gemeinnützigen Vereinen, ehrenamtlich Tätige für sich zu gewinnen.
  Die Freigrenze für den steuerpflichtigen wirtschaftlichen Geschäftsbetrieb wird
  auf 50.000 Euro angehoben. Die Erhöhung der Freigrenze stärkt unter anderem die
  Mittelbeschaffung kleinerer Vereine, die ehrenamtlich geführt werden. Zudem wird
  die Pflicht zur zeitnahen Mittelverwendung für steuerbegünstigte Körperschaften,
  deren Einnahmen bis 100.000 Euro pro Jahr betragen, abgeschafft. Diese Erleichterung
  kommt insbesondere den kleinen und mittleren steuerbegünstigten Körperschaften zugute,
  die oftmals nicht steuerlich beraten werden und die insbesondere auf ehrenamtlich
  tätige Personen angewiesen sind. Ehrenamtliche Tätigkeiten in Vereinen werden in
  erweitertem Umfang von Haftungsrisiken freigestellt. Hierzu soll die Vergütungsgrenze
  für das vereinsrechtliche Haftungsprivileg angehoben werden. Wer sich in einem Verein
  engagiert, soll künftig von einem gesetzlichen Haftungsprivileg profitieren, wenn
  er oder sie für die Tätigkeit im Verein maximal 3.300 Euro jährlich erhält. Die
  Bundesregierung will die Rahmenbedingungen für die Luftverkehrsbranche deutlich
  verbessern, um den Standort Deutschland zu stärken. Deshalb hat sie die Luftverkehrsteuer
  zum 1. Juli 2026 gesenkt. Konkret bedeutet das: Auswirkungen auf Ticketpreise :
  Die Senkung der Luftverkehrsteuer kann Belastungen abfedern und weitere Preissteigerungen
  verhindern. Die Entscheidungen über die Weitergabe der Steuersenkung obliegen aber
  den Unternehmen. Die Bundesregierung hat zudem eine Luftfahrtstrategie beschlossen,
  um Deutschland zu einem führenden Standort für eine nachhaltige, sichere und wettbewerbsfähige
  Luftfahrt zu machen. Die Bundesregierung arbeitet weiter mit Hochdruck an der Umsetzung
  von Vorhaben und Reformen, damit die Wirtschaft wieder wächst, Arbeitsplätze sicher
  sind und der Wohlstand für alle erhalten bleibt – aus Verantwortung für Deutschland.'
