title: 'Der Orden Pour le mérite hat Bernhard Schölkopf, Anne L’Huillier und Christoph
  Ransmayr als neue Mitglieder gewählt – Staatsminister Weimer: „Ihre Arbeiten stehen
  für die Kraft menschlicher Erkenntnis, für Kreativität und freiheitliches Denken“'
text: 'Das Kapitel des Ordens hat in seiner Sitzung am 27. September 2026 in Hamburg
  den Informatiker Bernhard Schölkopf als inländisches Mitglied und die französisch-schwedische
  Physikerin und Nobelpreisträgerin Anne L’Huillier sowie den österreichischen Schriftsteller
  Christoph Ransmayr als ausländische Mitglieder in den Orden gewählt. Die neuen Mitglieder
  haben inzwischen ihre Wahl angenommen. Dem Orden gehören somit 35 inländische und
  39 ausländische Mitglieder, darunter 17 Nobelpreisträgerinnen und Nobelpreisträger
  an. Die Überreichung der großen Ordenszeichen an die insgesamt sieben in diesem
  Jahr neugewählten Mitglieder findet am 30. Mai 2027 in Anwesenheit des Bundespräsidenten
  im Konzerthaus Berlin statt. Dazu erklärt Staatsminister Weimer: „Ich gratuliere
  Bernhard Schölkopf, Anne L’Huillier und Christoph Ransmayr ganz herzlich zu ihrer
  Wahl in den Orden, der auf eine lange und ehrenvolle Geschichte zurückblickt. Ihre
  Arbeiten stehen für die Kraft menschlicher Erkenntnis, für Kreativität und freiheitliches
  Denken. Der Orden führt damit eine große Tradition fort: Er bringt Menschen zusammen,
  die mit ihrem Schaffen weit über ihre Fachgebiete hinaus wirken und unsere Gesellschaft
  bereichern.“ Die Zuwahl in den Orden zählt zu den höchsten Ehrungen, die einem Wissenschaftler
  oder Künstler in Deutschland zuteilwerden kann. Die Künstler- und Gelehrtenvereinigung
  wurde 1842 von Preußen-König Friedrich Wilhelm IV. gegründet und 1952 von Bundespräsident
  Theodor Heuss wiederbelebt. Sie steht unter dem Protektorat des Bundespräsidenten.
  Erster Kanzler des Ordens war der Naturforscher Alexander von Humboldt. Der Staatsminister
  für Kultur und Medien finanziert den Orden und betreut ihn organisatorisch. Weitere
  Informationen auf der Website des Orden Pour le mérite .'
