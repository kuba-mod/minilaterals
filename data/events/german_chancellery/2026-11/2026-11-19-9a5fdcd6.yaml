date: '2026-11-19'
type: press_release
source_name: german_chancellery
title: Pressekonferenz zum Treffen der Koalition der Willigen „Wir haben eine klare
  Idee vom Frieden“
text: 'Bundeskanzler Merz betonte in der Pressekonferenz nach dem Treffen der „Koalition
  der Willigen“, dass die Ukraine n ach einem Waffenstillstand starke Sicherheitsgarantien
  benötige. Bundeskanzler Merz hat gemeinsam mit den Ko-Vorsitzenden Präsident Macron
  und Premierminister Burnham zu einem Treffen der „Koalition der Willigen“ nach Berlin
  eingeladen. Der ukrainische Staatspräsident Selenskyj nahm ebenso wie die US-Gesandten
  Kushner und Witkoff teil. Bei einer gemeinsamen Pressekonferenz informierte der
  Bundeskanzler über die Gipfelergebnisse. „Es ist sehr lange her, dass für Europa
  so viel auf dem Spiel steht. Hier in Berlin, in der Mitte Europas, formulieren wir
  gemeinsam, wo wir stehen“, sagte der Kanzler. Meine Damen und Herren, herzlich willkommen
  zu unserer Pressekonferenz nach dem Treffen der Koalition der Willigen. Lieber Wolodymyr,
  lieber Emmanuel, lieber Andy, lieber Steve Witkoff, lieber Jared Kushner, noch einmal
  herzlich willkommen in Berlin! Frieden für die Ukraine, Sicherheit für Europa –
  unter dieses Motto haben wir dieses Berliner Treffen, diesen Berliner Gipfel der
  Koalition der Willigen gestellt. Fast 40 Delegationen haben teilgenommen und sind
  der Einladung von Emmanuel Macron, Andy Burnham und mir gefolgt, die meisten auf
  der Ebene der Staats- und Regierungschefs. Es ist sehr lange her, dass es im Kanzleramt
  in Deutschland einen so großen Gipfel gab, und es ist sehr lange her, dass für Europa
  so viel auf dem Spiel steht. Heute früh haben Präsident Trump und Präsident Putin
  in China über den Krieg in der Ukraine gesprochen. Das Treffen in Shenzhen war offenbar
  vor allem ein Bildtermin. Hier in Berlin, in der Mitte Europas, formulieren wir
  gemeinsam, wo wir stehen: Wir wollen einen Frieden für die Ukraine, der gerecht
  und dauerhaft ist. Wir wollen mehr und nicht weniger Sicherheit für Europa und die
  Welt. Dafür arbeiten wir, substanziell und mit sehr klarem Kompass. Solange es nötig
  ist, werden wir Kyjiw unterstützen. Kommt es zu Friedensverhandlungen, dann werden
  wir uns einbringen. Gelingen können Verhandlungen mit der Ukraine und Europa nur
  zusammen. Ein Jalta-Format wird den Frieden nicht bringen. Meine Damen und Herren,
  ich habe heute jedem Gast, der bei uns war, ein solches Stück aus der Berliner Mauer
  als Geschenk mit auf den Weg gegeben. Diese Berliner Mauer hat nur wenige Meter
  von hier gestanden und 28 Jahre lang unseren Kontinent, Deutschland und Berlin geteilt.
  Die Mauer hat Unterdrückung, Unsicherheit und Unfrieden gebracht. Genau dafür stand
  Jalta. Mit Berlin, mit dem Fall der Mauer, verbinden wir eine andere Botschaft und
  eine andere Welt. Freiheit und Frieden sind stärker als Unterdrückung und Teilung.
  1987 hat Präsident Reagan – Sie erinnern sich ‑ hier in Berlin gerufen: „Mr. Gorbachev,
  tear down this wall!“ Wir sagen heute Präsident Putin: Beenden Sie den Krieg in
  der Ukraine, und lassen Sie uns gemeinsam nach diplomatischen Lösungen suchen. Wir
  wollen nie wieder in einem geteilten Europa leben. Wir wollen in Freiheit und in
  Frieden leben, zusammen mit der Ukraine. Wir haben heute in der Sache in unserem
  Kreis dreierlei erreicht, was unsere Botschaft mit Nachdruck verbindet: Erstens.
  Wir können nach diesem Berliner Gipfel mit großer Zuversicht sagen: Gemeinsam werden
  wir die Ukraine auch im gesamten nächsten Jahr kraftvoll unterstützen. Denn hier
  geht es um unser aller Sicherheit; also müssen auch alle einen Beitrag dazu leisten.
  Die Europäische Kommission hat gestern einen Vorschlag vorgelegt, der für 2027 zusätzliche
  45 Milliarden Euro vorsieht. Diese Mittel sollen in der Europäischen Union alle
  gemeinsam mobilisieren. Dafür gab es heute breite europäische Unterstützung. Ich
  bin dafür sehr dankbar. National leisten die Mitglieder der Koalition Großes, auch
  die außerhalb der Europäischen Union. Ich will das ausdrücklich sagen ‑ Andy Burnham
  hat es gesagt ‑: Großbritannien allein hat gerade neue Hilfen in Höhe von über 11 Milliarden
  Euro angekündigt und zugesagt. Die Balten, die nordischen Staaten, die Niederlande
  und andere helfen vorbildlich. Diese starke Unterstützung leisten wir alle nicht,
  um den Krieg zu verlängern. Wir wollen diesen Krieg beenden. Wir leisten unseren
  Beitrag, damit sich die Ukraine wirkungsvoll verteidigt, solange sie es muss. Wir
  leisten diese Beiträge, um Friedensverhandlungen überhaupt erst zu ermöglichen und
  sie aus einer Position der Stärke herauszuführen. Dass die Ukraine die Brücke von
  Kertsch schwer beschädigt hat, in der letzten Nacht noch einmal, ist eine deutliche
  Warnung. Es ist auch ein deutliches Zeichen der Schwäche von Russland. Allein im
  Oktober hat Moskau über 50 000 Soldaten verloren. Das ist die Größenordnung, die
  die amerikanischen Truppen insgesamt in fast 20 Jahren Vietnamkrieg verloren haben.
  So viele Soldaten verliert Russland in einem Monat. Russland muss deshalb begreifen:
  Es ist Zeit, die Waffen niederzulegen. Wir haben – zweitens ‑ eine klare Idee vom
  Frieden. Heute haben wir uns auch auf mögliche Friedensgespräche vorbereitet. Diese
  Gespräche sollen die Ukraine, Russland, die Vereinigten Staaten und Europa umfassen.
  Kommen sie zustande, eröffnet das die bisher beste Chance für Frieden. Schließlich:
  Im Europäischen Rat in Dublin haben wir in der letzten Woche vereinbart, dass Deutschland,
  Frankreich, Großbritannien, Polen und Italien für Europa sprechen. Das werden wir
  gemeinsam mit den Brüsseler Institutionen tun. Wir werden uns an den klaren Prinzipien
  orientieren, über die auch heute Einigkeit bestand. Ziel ist und bleibt eine souveräne
  Ukraine in einem sicheren Europa. Ausgangspunkt einer territorialen Verständigung
  muss dabei die sogenannte Kontaktlinie sein. Die Ukraine muss ihren europäischen
  Weg gehen können. Sie muss auf Hilfe beim Wiederaufbau zählen dürfen. Im Gegenzug
  sind schrittweise, konditionierte Aufhebungen von Sanktionen gegen Russland denkbar.
  Schließlich und letztendlich: Nach einem Waffenstillstand muss Kyjiw starke Sicherheitsgarantien
  erhalten. Das wird Auswirkungen auf die euroatlantische Sicherheit haben. Darüber
  wird in den Verhandlungen zu sprechen sein. Meine Damen und Herren, hier braucht
  es jetzt die richtige Sequenz, die richtige Reihenfolge ‑ erst Frieden in der Ukraine,
  dann Verständigungen zur euroatlantischen Sicherheit. Moskau weiß: Seine Maximalforderungen
  vom Dezember 2021 sind nicht realistisch. Nach einem Frieden in der Ukraine muss
  Europa sicherer sein als vorher. Deshalb bauen wir auf eine stärkere europäischere
  NATO. Das dient letztendlich auch Russlands Sicherheit. Zu gegebener Zeit ist aber
  auch mit Moskau über militärische Gesprächskanäle, über Risikoverminderung und Transparenz
  zu sprechen. Das ist im Interesse beider Seiten. Wir sind bereit, über Sicherheitsgarantien
  für die Ukraine zu sprechen. In diesen Tagen läuft ‑ Sie wissen das vermutlich alle ‑
  unsere erste gemeinsame Militärübung Koalicja. Sie zeigt: Die Koalition der Willigen
  ist bereit, mit den Vereinigten Staaten zur Absicherung eines Friedens beizutragen.
  Ich will abschließend den Gesandten der Vereinigten Staaten, Steve Witkoff und Jared
  Kushner, danken, dass sie nach Berlin gekommen sind. In den letzten Monaten haben
  wir eng zusammengearbeitet, aufbauend auf den Ergebnissen des Berliner Gipfels im
  Dezember des letzten Jahres. Die USA wissen: Ohne uns gibt es keinen Frieden. Wir
  wissen: Mit den Vereinigten Staaten an unserer Seite steigen die Chancen auf Frieden.
  ‑ Als Koalition der Willigen haben wir das heute gemeinsam in diesem Sinne deutlich
  gemacht. Dass die Vereinigten Staaten neue Verhandlungen mit Russland in Gang setzen,
  begrüßen wir. In diese Verhandlungen wollen wir uns einbringen. Wir wollen es im
  Team mit Kyjiw und Washington tun. Die Vorbereitungen dazu laufen auf Hochtouren.
  Noch heute Abend kommen europäische, ukrainische und amerikanische Berater hier
  im Kanzleramt zur nächsten Runde zusammen. Auf dieses Teamwork können die Vereinigten
  Staaten, kann Präsident Trump zählen, solange wir dasselbe Ziel verfolgen. Dieses
  Ziel ist und bleibt ein gerechter, dauerhafter Frieden für die Ukraine und Sicherheit
  für Europa und die ganze Welt. Vielen Dank. ‑ Lieber Friedrich, Herr Bundeskanzler,
  lieber Emmanuel, Herr Präsident, Andy, Herr Premierminister, Steve und Jared, sehr
  geehrte Anwesende unserer Teams, sehr geehrte Journalistinnen und Journalisten,
  heute haben wir ein sehr wichtiges Treffen. Es war ein starkes Treffen. Unsere Koalition
  der Willigen hatte mehr als 40 Teilnehmer. Wir haben versucht, dieses Gespräch ganz
  konkret zu gestalten. Heute müssen wir uns alle konzentrieren und unserem Staat
  und unserer Diplomatie die nötige Unterstützung leisten. Ich möchte Friedrich für
  die Organisation dieses Treffens und für die Unterstützung danken. So ein Signal
  ‑ eine stärkere Unterstützung für die Ukraine, vor allem jetzt vor dem Winter –
  kann Russland dazu bringen, konstruktiver bei jedweden Verhandlungen zu sein. Wir
  bedanken uns bei allen Partnern, die bereit sind, sich zu engagieren, die eine Führungsrolle
  bei der Unterstützung zeigen und alles dafür tun, dass wir standhaft bleiben, dass
  wir diesen Krieg überstehen können, dass wir Frieden herbeibringen und danach eine
  garantierte Sicherheit für die Ukraine herbeiführen. Ich danke dem Bundeskanzler
  und Deutschland, ich danke Frankreich, Großbritannien, den USA und den Staats- und
  Regierungschefs aller Länder, die heute dabei waren und unser Volk unterstützen.
  Ich danke der Europäischen Union. Am Vortag wurde der Beschluss über zusätzliche
  45 Milliarden für das nächste Jahr gefasst. Das ist wesentlich. Die Europäische
  Kommission hat diese Arbeit angefangen. Es ist wichtig, dass die EU-Mitgliedstaaten
  damit weitermachen. Auch das Treffen der Ramstein-Gruppe war wichtig für unsere
  Verteidigung. Das 25. Paket der Sanktionen wird verabschiedet. Es werden neue Sanktionen
  kommen. Europa wird die Arbeit fortführen. Das ist wichtig. Die Prioritäten heute
  waren die Folgenden: Erstens, die Luftabwehr. Seit Mitte dieses Sommers steigert
  Putin seinen Angriff mit ballistischen Raketen, mit jetangetriebenen Shahed-Drohnen.
  Wir müssen hier für eine wirkliche Verteidigung zusammen handeln. Es sind keine
  leeren Worte. Russland weigert sich das ganze Jahr über, alle Vorschläge für eine
  Deeskalation anzunehmen. Diese Vorschläge wurden von unterschiedlichen Partnern
  unterbreitet; Putin hat immer Nein gesagt. Zu einer Deeskalation im Energiebereich,
  im Schwarzen Meer: Russland hat zu allen Vorschlägen nur Nein gesagt. Mit jedem
  Tag gibt es neue Angriffe auf die Ukraine. Es gibt Dutzende von Opfern. Ich möchte
  mein Beileid für alle Betroffenen aussprechen. Die Wladimirkathedrale in Kyjiw wurde
  beschädigt. Auch die Gebäude der Botschaften von Österreich und der Niederlande
  wurden beschädigt. Deswegen hat der Schutz unserer Gebäude, unserer Energiewirtschaft,
  unserer Logistik, unserer Brücken die größte Priorität. Alle Partner waren heute
  einig, dass unser Schutz, unsere Verteidigung gestärkt werden muss. Heute haben
  wir auch Vereinbarungen über die entsprechende Unterstützung getroffen. Der zweite
  Punkt sind F-16 und andere Fluggeräte. Wir benötigen Flugzeuge, die jetangetriebenen
  Shahed-Drohnen abschießen können. Wir verstehen, wann wir das brauchen. Unsere Teams
  werden sich damit beschäftigen. Drittens müssen wir die ausreichenden Elemente der
  Verteidigung in Europa haben. Wir haben das gemeinsame Programm Freyja. Es gibt
  auch andere Elemente, ohne die die Stärke und die Selbstständigkeit Europas nicht
  garantiert werden kann. Ich danke den Partnern, die mit uns in jedem dieser wichtigen
  Arbeitsbereiche zusammenarbeiten. Wir sehen, dass die ukrainischen Positionen an
  der Front jetzt stark sind. Wir müssen zusammenarbeiten. Alle unsere gemeinsamen
  Projekte sind das, was uns Kraft spendet und uns alle in Europa stärker macht. Das
  hat man heute sehr klar gespürt. Viertens wurden heute alle diplomatischen Anstrengungen,
  Bemühungen angesprochen. Wir haben mit unseren amerikanischen Partnern, mit Steve
  und Jared, darüber gesprochen. Es wurde darüber gesprochen, dass die Europäer an
  den Verhandlungen teilnehmen. Es ist sehr wichtig: Europa muss an allen Verhandlungen
  teilnehmen. ‑ Das wurde jetzt erreicht. Europa wird von fünf Ländern vertreten,
  auch von der Europäischen Union und der NATO. Die USA verstehen, warum die starke
  Beteiligung Europas an den Verhandlungen erforderlich ist. Wir werden noch ein separates
  Gespräch mit den US-Teilnehmern haben. Wir werden die Agenda, die Tagesordnung des
  nächsten Termins besprechen. Es wird ein Vierertreffen zwischen der Ukraine, Europa,
  USA und Russland sein. Wir rechnen damit. Die Tagesordnung muss von uns gemeinsam,
  von uns allen, durchgearbeitet und bewilligt sein. Wir werden zusammen alles machen,
  damit Russland die wichtige und konkrete Arbeit leistet und nicht einfach Zeit verliert.
  Das ist für uns sehr wichtig. Denn Menschen sterben; unsere Ukrainerinnen und Ukrainer
  sterben. Wir wollen nicht, dass Russland das alles über den Winter in die Länge
  zieht. Wir brauchen Druck. Europa ist zu neuen Sanktionen, zu neuen Schritten bereit,
  um die Ukraine, das ukrainische Volk zu unterstützen. Es ist wichtig, dass die USA
  auf Russland Einfluss ausüben. Damit rechnen wir. Fünftens haben wir die Sicherheitsgarantien
  für die Ukraine besprochen. Ich bin den E3-Ländern und allen Europäern dankbar.
  Wir haben darüber gesprochen, dass die Mitgliedschaft in der NATO die wichtigste
  Sicherheitsgarantie wäre. Die Mitgliedschaft in der NATO und der EU wäre eine Sicherheitsgarantie.
  Wir verstehen, dass mit ukrainischer Kraft, mit ukrainischen Erfahrungen und Technologien
  die EU und die NATO die europäische Lebensweise viel stärker verteidigen können.
  Die EU-Mitgliedschaft ist für uns alle eine Sicherheitsgarantie, genauso wie die
  Mitgliedschaft in der NATO. Das alles müssen wir anerkennen. Wir nähern uns diesem
  Aspekt. Wir müssen alles tun, damit es in Europa keinen Krieg gibt, jahrzehntelang.
  Die Ukraine muss vollständig in die Europäische Union integriert werden. Wir stellen
  mögliche Lösungsformate vor: Sicherheitsgarantien auf der Grundlage der NATO. Wir
  danken allen, die uns helfen. Wir danken allen Partnern, allen Freunden und allen
  Teilnehmenden dieses Treffens. ‑ Slawa Ukrajini! Vielen herzlichen Dank, Friedrich,
  für die Einladung und für die Ausrichtung dieses Gipfeltreffens. Präsident Selenskyj
  ist hier bei uns, und wir stehen ihm und seinem Volk zur Seite. Ich freue mich auch,
  dass Andy Burnham hier ist, und wir hatten auch das Glück, wie gesagt, die beiden
  Sondergesandten aus Amerika hier zu haben. Wir haben uns bei diesem Gipfeltreffen
  gut austauschen können. Das ist jetzt das 18. Treffen seit dem ersten Treffen, das
  in Paris stattfand. Seit eineinhalb Jahren ‑ der Bundeskanzler hat es ja vorhin
  gesagt ‑ haben wir Herausforderungen, denen wir gerecht werden müssen. Ich möchte
  das nicht noch einmal wiederholen. Aber wenn wir uns jetzt die heutige Lage genau
  ansehen, leistet die Ukraine Widerstand. Sie gewinnt sogar Staatsgebiet zurück.
  Aber Russland hat beschlossen, die Zivilbevölkerung und Kyjiw direkt anzugreifen.
  Mit Gewalt und vor dem Winter will es die Stadt teilen, will die Infrastruktur,
  die Energieinfrastruktur und die Verkehrsinfrastruktur zerstören. Es hat mehrere
  Diskussionen gegeben, und die haben auch gezeigt, dass Russland maximale Forderungen
  stellt. Das ist eine Tatsache. Das erste Ziel, das wir haben, also die erste Priorität:
  Wenn wir in den Friedensverhandlungen glaubwürdig sein wollen, dann ist es wichtig,
  dass die Ukraine standhält und mit einer guten Position in die Verhandlungen hineingehen
  kann, und das kann sie nur, wenn wir ihr zur Seite stehen, kurzfristig und langfristig.
  Das machen wir, indem wir neue Radargeräte, neue Flugzeuge, Freyja usw. liefern.
  Wir werden in den nächsten Wochen in Paris auch ein Gipfeltreffen zum Thema „Freyja,
  Antidrohnen und antiballistische Marschflugkörper“ organisieren. Das betrifft auch
  die neuen Abfangjäger. Alle Mitglieder der Koalition, alle, die heute hier sind,
  müssen alles tun, damit die Ukraine all diese Mittel hat, die sie braucht, um Russland
  Widerstand leisten zu können. Die, die können, müssen liefern! Die zusätzlichen
  Abfangjäger müssen sie liefern. Wenn sie Verteidigungsmittel zur Verteidigung der
  ukrainischen Zivilbevölkerung haben, dann müssen sie die jetzt liefern. Das ist
  wichtig. Das Zweite: Wir müssen auch den Schutz für Kyjiw verbessern. Wir brauchen
  auch neue Partner, und zwar in den nächsten Wochen. Die Ukraine hält stand, aber
  die Zivilbevölkerung leidet. Dies ist, wie gesagt, kein Angriff gegenüber Russland.
  Wir wollen einfach nur die Zivilbevölkerung schützen. Das nächste Element sind diese
  Sicherheitsgarantien. Das ist ein Schlüsselelement für unsere Verhandlungen, für
  langfristige Verhandlungen. Wir haben die ja im letzten Januar schon besprochen.
  Die Sondergesandten von Präsident Trump waren damals auch dabei. General Grynkewich
  war dabei. Wir haben damals ein Schema validiert, das uns der Generalstab vorgelegt
  hat. Wir hatten eine Planung dazu, einen Zeitplan. Die ukrainische Armee ist so
  einbezogen, dass die europäischen Streitkräfte dann auf dem ukrainischen Staatgebiet
  eingesetzt werden und dass sozusagen ein zweiter Vorhang entsteht. Dieses Schema
  bleibt aufrechterhalten, und das ist das Schema für unsere gemeinsame Sicherheit.
  Heute stehen wir wieder vor diesen maximalen Forderungen Russlands. Wir müssen überlegen,
  ob die Ukraine nicht der NATO beitreten sollte. Es ist der richtige Zeitpunkt, darüber
  zu sprechen. Der Vorschlag wurde fallengelassen, und zwar im zweiten Semester 2022.
  Die Frage stellt sich jetzt wieder, die Frage stellt sich für uns Europäer: Was
  wird denn am Tag danach sein? Die Ukraine wird ein gut ausgerüstetes Land mit einer
  gut ausgestatteten Armee sein, und ein Beitritt ist wirklich relevant. Zum heutigen
  Zeitpunkt, und diese Koalition der Willigen zeigt es ja auch: Am 13. Juli dieses
  Jahres hatten wir diese Übung Koalicja in Polen angekündigt. Wir haben gesagt, dass
  wir in der Lage sind, unsere Streitkräfte für den Tag danach zu trainieren, und
  das tun wir gerade. Mehr als 2500 Soldaten sind vor Ort. Ich danke Polen für die
  Ausrichtung dieser Übung. Wir haben dort Landstreitkräfte und sogar Seestreitkräfte.
  Zwölf Länder sind in der Koalition aktiv. Wir haben 1100 Soldaten trainiert. Wir
  sind glaubwürdig. Diese Koalition der Willigen ist glaubwürdig. In diesem Zusammenhang,
  weil wir eben glaubwürdig sind, was all diese anderen Punkten angeht ‑ die Unterstützung
  der Ukraine, die Sicherheitsgarantien, die ich gerade beschrieben habe ‑, haben
  wir den Willen, jetzt echte Friedensverhandlungen mit Russland zu führen. Seien
  wir ehrlich: Bisher hat Russland keine konkreten Elemente für einen Frieden vorgelegt.
  Aber was wir sehen, ist, dass wir das richtige Format haben. Wir wollen uns am Tisch
  zusammensetzen ‑ USA, Ukraine, Russland, Europa ‑, und das werden wir auch tun.
  Das ist das Format, das wir besprochen haben. Wir haben das Thema des Staatsgebiets.
  Das liegt in der Verantwortung von Präsident Selenskyj. Er ist der Einzige, der
  hierüber legitime Entscheidungen treffen kann. Sicherheit ist aber, wie gesagt,
  die Verantwortung der Europäer. Denn europäische Sicherheit ist ja das, wofür wir
  uns als Koalition der Willigen einsetzen, und wir brauchen hier langfristige Sicherheiten.
  Dafür brauchen wir Ukrainer, Amerikaner und Europäer. Das werden wir in den Friedensverhandlungen
  auch so zur Kenntnis geben. Ich danke jetzt noch einmal Herrn Präsident Selenskyj.
  Wir danken ihm. Wir wissen, dass die nächsten Wochen für sein Land ultrakritisch
  sind, für seine Bevölkerung und für ganz Europa. Die Koalition der Willigen ist
  jetzt zum richtigen Zeitpunkt am richtigen Ort zusammengekommen und hat hier etwas
  noch nie Dagewesenes geschafft. Dafür danke ich auch noch einmal dem Herrn Bundeskanzler.
  ( auf Deutsch ) Guten Abend, meine Damen und Herren! ( auf Englisch ) Guten Abend,
  meine Damen und Herren! Wir haben uns heute hier in Berlin zusammengefunden, um
  deutlich zu machen, wie stark wir einem dauerhaften, gerechten Frieden in der Ukraine
  verpflichtet sind, und ich habe dies heute Präsident Selenskyj mehr als einmal versichert.
  Es gibt drei positive Ergebnisse unseres heutigen Treffens. Erstens. Die Koalition
  der Willigen, zu der Friedrich heute eingeladen hat, hat ihre Unterstützung deutlich
  bekundet, so viele Menschen aus verschiedenen Ländern Europas. Ich glaube, noch
  niemals zuvor sind so viele Länder für die Koalition der Willigen zusammengekommen,
  und die haben ihre Unterstützung für die Ukraine zu einem kritischen Zeitpunkt deutlich
  gemacht, jetzt, zum Anbruch des Winters. Wir sind stärker und geschlossener. Noch
  nie zuvor waren wir so stark und einig, wie wir es heute sind, hinsichtlich der
  Unterstützung von Präsident Selenskyj und der Bevölkerung der Ukraine. Das ist eine
  der positiven Botschaften der heutigen Konferenz. Zweitens. Im Verlauf der heutigen
  Diskussion haben auch unsere Kollegen aus Amerika eine Rolle gespielt, und ich danke
  Steve und Jared dafür, dass sie hierhergekommen sind und bei dieser Konferenz anwesend
  sind. Das macht einen deutlichen Unterschied und bringt uns hinsichtlich der Möglichkeit
  ernstzunehmender Verhandlungen voran. Wie Bundeskanzler Merz vorhin sagte, ist es
  nicht nur so, dass wir eine starke Position, eine durchdachte Position vertreten.
  Wir sind auch bereit, uns in Verhandlungen zu begeben. Wir haben auch eine abgestimmte
  Verhandlungsposition. Es ist nicht die Sache des Aggressors, in diesem Konflikt
  unrealistische Sicherheitsforderungen zu stellen. Dahingehend sind wir uns alle
  mehr als einig. Wir sind aber bereit, uns in ernstzunehmende Diskussionen über das
  Thema der europäischen Sicherheit zu begeben, solange das Hand in Hand mit ernstzunehmenden
  Diskussionen geht, und dies natürlich nur unter der Voraussetzung, dass es einen
  Frieden zwischen der Ukraine und Russland gibt. Es gibt also viele positive Ergebnisse
  der heutigen Konferenz. Aber wie Präsident Selenskyj vorhin sagte: Heute ist in
  der Tat ein sehr schwieriger Tag in Kyjiw gewesen, angesichts des Schadens, der
  historischen Gebäuden zugefügt wurde, und des Schadens an den diplomatischen Vertretungen
  in Kyjiw. Wie Emmanuel gesagt hatte, wird dies ein schwieriger Winter werden. Der
  Schaden, der den Brücken zugefügt wurde, ist ein Schaden, der sich auf das Management
  der Stadt auswirken könnte, auf die Verwaltung, auf die Dienstleistungen. Wir müssen
  uns auf einen schweren Winter vorbereiten. Die Botschaft, die ich heute hierhergebracht
  habe, ist folgende: Wir müssen noch einmal mehr tun, und wir werden noch einmal
  mehr tun, Wolodymyr! Das versichere ich dir, und du kannst es deinem Volk so mitteilen.
  Das gilt nicht nur für Großbritannien und das Vereinigte Königreich, das gilt für
  all die anderen hier vertretenen Partner und Partnerinnen. Ich danke der Europäischen
  Union für das Paket, das sie vorgelegt hat ‑ eine weitere deutliche finanzielle
  Unterstützung ‑ und das die Position der Ukraine in diesem schwierigen politischen
  Moment unterstützen soll. Die Ukraine spielt ihren Teil. Sie haben etwas dafür getan,
  dass sich die Europäische Union auf dieses Paket wird einigen können. Es geht um
  Tausend weitreichende Drohnen, die aus der britischen Produktion stammen, zusammen
  mit Norwegen, und Schnellboote. Wir werden auch noch weitere Mittel der Unterstützung
  bereitstellen, ebenso wie unsere Kollegen und Kolleginnen in der Koalition der Willigen,
  solange das notwendig sein wird. Ich hoffe, dass diese Botschaft heute auch in Moskau
  sehr klar verstanden wurde. Wie gesagt: Solange es sich als nötig erweisen wird,
  werden wir an der Seite der Ukraine stehen, und wir werden in unserer Unterstützung
  nicht nachlassen. Das ist eine unerschütterliche Unterstützung. Sie wird unsere
  Solidarität haben, und das gilt für Europa insgesamt. Das haben wir heute mehr als
  deutlich bekundet, und das ist hoffentlich überall in der Welt auch so gesehen worden.
  Ein Punkt, den eine Reihe von Kollegen angesprochen haben, ist der, dass dies eine
  Situation ist, in der keiner gewinnen kann. Alle verlieren. Der größte Verlierer
  ist vielleicht Russland. Russland verliert in drei Monaten so viele Menschenleben
  wie in den ganzen neun Jahren des Konflikts zwischen Russland ‑ oder sollte ich
  Sowjetunion sagen? ‑ und Afghanistan vor vielen, vielen Jahren. Das war schon eine
  Katastrophe. Aber der Verlust an Menschenleben ist jetzt noch in viel größerem Ausmaße
  zu erkennen. 0,2 Prozent des ukrainischen Territoriums haben sie damit gewonnen.
  Das ist ein hoher Preis. Deshalb müssen wir klar und deutlich machen, dass Russland
  Menschenleben verliert, dass Russland an Boden verliert und dass Russland die Schlacht
  verliert, deren Ziel darin besteht, die Ukraine zu brechen. Das, was wir an Widerstandskraft
  des ukrainischen Präsidenten gesehen haben, an Widerstandsfähigkeit des ukrainischen
  Volkes, lässt mich sagen: Sie sind nicht zu brechen. Wir sind an ihrer Seite, und
  wir möchten sie dabei unterstützen, dass sie das auch weiterhin sein können. Aber
  dies muss ein Moment sein, an dem wir einen Schritt in Richtung des Friedens tun.
  Das ist heute auch deutlich geworden. Die Unterstützung, die hier bekundet wird
  und wurde, macht deutlich, dass Europa bereit ist, sich an Friedensverhandlungen
  zu beteiligen. Aber wir haben auch klar und deutlich gemacht, was wir zu akzeptieren
  bereit sind und wozu wir nicht bereit sind. Wir alle wissen, wo wir stehen: an der
  Seite der Ukraine, heute, morgen und solange das sich als notwendig erweisen wird,
  bis dieser ungerechte Krieg beendet ist. Vielen Dank! Auch im Namen von Steve und
  mir selbst möchte ich dem Bundeskanzler dafür danken, dass er uns heute so freundlich
  empfangen hat. Ich möchte dem Bundeskanzler, dem britischen Premierminister, Präsident
  Selenskyj und Herrn Macron für dieses sehr erfolgreiche Treffen heute hier in Berlin
  danken. Ich möchte auch einigen der anderen Staats- und Regierungschefs aus Europa
  danken. Sie leisten ihren Beitrag dabei, dass wir uns ein Bild von der Lage machen
  können und unsere Position entwickeln können. Dazu gehören die italienische Premierministerin
  Frau Meloni, der polnische Ministerpräsident, Ursula von der Leyen von der EU und
  natürlich auch der Generalsekretär der NATO Mark Rutte, der Präsident Finnlands
  Alexander Stubb und der Ministerpräsident von Norwegen. Sie alle haben sich regelmäßig
  mit uns ausgetauscht und sich sehr substanziell mit uns unterhalten, und sie haben
  das auch sehr gezielt getan. Wir nehmen heute mit, dass Europa tatsächlich sehr
  geschlossen, sehr deutlich und stark in seiner Unterstützung der Ukraine dasteht.
  Wir haben das auch Präsident Trump so übermittelt, als wir nach der Konferenz mit
  ihm gesprochen haben. Wir werden das auch der russischen Delegation so übermitteln.
  Wir sehen Stärke, Geschlossenheit und Engagement. Wir sehen aber auch einen echten
  Wunsch, dass Friede einkehren möge. Wir sehen, dass hier Anstrengungen unternommen
  werden, damit man uns allen die Chance darauf schaffen kann. Dieser Krieg hat schon
  so lange gedauert. Das ist eine emotionale, eine harte Zeit gewesen und hat gewaltige
  Kosten für beide Seiten mit sich gebracht. Es ist nicht einfach, diese Parteien
  wieder an einen Tisch zu bekommen, aber ich denke, dass wir wichtige Schritte in
  diese Richtung unternommen haben und unternehmen werden. Das kann man dadurch erreichen,
  dass alle an einem Strang ziehen. Jeder, der hier vertreten ist, leistet seinen
  Beitrag; das habe ich sehr klar so empfunden. Präsident Trump hat uns beide, Steve
  und mich, hierhergeschickt und lässt sich über unsere Verhandlungen informieren,
  ebenso wie er auch uns über seine in Shenzhen informiert hat. Wir haben die deutliche
  Botschaft an ihn adressiert, dass hier der Wunsch auf Frieden vorherrscht. Ich will
  die Details der Begegnungen und der Gespräche, die er dort geführt hat, hier nicht
  darlegen, aber ich denke, dass er von dort in dem Glauben abgereist ist, dass Friede
  machbar und erreichbar sei und dass wir alle darauf hinarbeiten sollten. Für Steve
  und mich ist das etwas sehr Persönliches. Wir haben mit so vielen Menschen gesprochen,
  die die Auswirkungen des Krieges ganz direkt gespürt haben. Ich habe auch mit einer
  Freundin von mir gesprochen, die gesagt hat, ihr Bruder kämpfe an der vordersten
  Front und wie hart es für sie sei. Das Gebiet, in dem sie aufgewachsen ist, ist
  zerstört worden. Ihre Freundinnen und Freunde sind in der Schlacht gefallen. Viele
  Menschen haben ein Gefühl der Hoffnungslosigkeit, so als ob sie überhaupt keine
  Chance gehabt hätten, etwas zu sagen oder Einfluss auf das zu nehmen, was geschieht.
  Solche Menschen sehen wir auf beiden Seiten. Steve und ich arbeiten sehr engagiert
  daran, etwas daran zu ändern und darauf hinzuwirken, dass dieser schreckliche Krieg
  enden und dass dieses schreckliche Töten ein Ende finden möge, all die negativen
  Folgen eines Krieges. Als wir, Steven und ich, vor einem Jahr mit diesem Thema konfrontiert
  wurden, haben wir gesagt, dass für uns ein erfolgreiches Ergebnis darin bestehen
  würde, am Ende dieses Krieges ein souveränes, sicheres, im Wohlstand lebendes ukrainisches
  Land und Volk zu sehen. In den Gesprächen, die wir geführt haben, war es wichtig,
  dass wir auch von Europa direkt gehört haben, wie sie es sehen. Wir glauben daran,
  dass man dieses Ziel erreichen kann, dass man einen Pfad aufzeigen kann, wie wir
  dorthin kommen können. Am Anfang hat man noch darüber gesprochen, dass die Ukraine
  Sicherheitsgarantien braucht, und sie wurden nicht angeboten. Dann sind Steve und
  ich zu Präsident Trump gegangen und haben gefragt, ob das nicht eine Möglichkeit
  sei. Er hat gesagt: Ja, schreibt doch ein paar auf einem Blatt Papier auf. Sie müssen
  im Einklang mit meinen Prinzipien und Werten sein. ‑ Auch Präsident Selenskyj hat
  das deutlich gemacht. Wir arbeiten mit ihm an solchen Grundlagen für mögliche Sicherheitsgarantien.
  Wir haben auch deutliche Fortschritte erzielt, was einen Wohlstandsplan für die
  Zeit nach dem Krieg betrifft. Dabei arbeiten wir mit den Leuten von Präsident Selenskyj
  zusammen. Ich denke, dass wir doch Fortschritte dabei erzielt haben, wie eine erfolgreiche,
  starke Ukraine aussehen kann. Im September, als Steve und ich zum ersten Mal Russland
  und die Ukraine besucht haben, hatten die Verhandlungen wirklich eine Sackgasse
  erreicht. Das alles sah nicht sehr hoffnungsfroh aus. Dann haben wir uns mit den
  europäischen Kollegen engagiert und versucht, das trilaterale Format wiederzubeleben.
  Es hat ein bisschen Zeit und Engagement erfordert, bis das wieder ins Laufen gekommen
  ist. Wir haben einige humanitäre Durchbrüche erzielt. Tausende Kriegsgefangene sind
  ausgetauscht und freigelassen worden. Nächste Woche werden weitere wieder mit ihren
  Familien zusammenkommen. Das ist ein Fortschritt. Aber noch wichtiger ist, dass
  sich Russland dazu bereit erklärt hat, sich an einem multilateralen Format mit den
  Europäern zu beteiligen. Wir haben zum Teil versucht, Russland zu erklären, dass
  es entscheidend sein wird, auch Europa einen Platz am Tisch zu verschaffen, wenn
  wir diesen Krieg dauerhaft beenden wollen. Die Russen sind dazu bereit, unsere instinktive
  Reaktion dahin gehend zu akzeptieren. Eine stärkere Bekräftigung ist unsererseits
  erfolgt, dass wir denken, dass das sehr wichtig sei. Die nächsten Schritte, so wie
  wir es sehen, sind eine Fortführung der engen Zusammenarbeit mit Ihnen nach dieser
  Pressekonferenz. Wir treffen alle nationalen Sicherheitsberater und die Verhandlungsteams
  der verschiedenen Seiten, und wir werden sehr viel Zeit investieren. Wir werden
  gemeinsame Vorschläge erarbeiten. Alles, was wir tun, wird abgestimmt erfolgen.
  Ich möchte noch einmal deutlich unterstreichen, dass Präsident Trump einen Deal
  mit Europa an seiner Seite wünscht. Er möchte nichts einseitig anderen aufzwingen.
  Eine Vereinbarung mit der Ukraine wird in enger Abstimmung mit der Ukraine und Europa
  erfolgen. Er hat uns, wie gesagt, hierhergeschickt, um Ihnen das so zuzusichern.
  Der Fortschritt, den wir heute beim Treffen erzielt haben, ist gut. Wir werden danach
  weitere Fortschritte erzielen. Ich denke, dass sich unsere Positionen einander annähern
  und dass wir uns auch abstimmen. Das wird von großer Bedeutung für die nächsten
  Gespräche sein. Das Thema der Sicherheit nach dem Ende des Krieges ist ein Thema,
  das Sie auch hier in der Koalition diskutiert haben. Sie haben darüber gesprochen,
  was das bedeutet und welche Elemente dafür notwendig sind. Ich bin sehr dankbar
  dafür, dass der Bundeskanzler die verschiedenen Mechanismen dargelegt hat: Transparenz,
  gegenseitige Deeskalation. Es gibt ein Maß an Infrastruktur hier in Europa, dass
  man vielleicht nutzen könnte, die NATO zum Beispiel. Aber zweifelsohne wird die
  NATO ohnehin ein wichtiger Pfeiler in diesen Bemühungen sein. Wir hoffen, dass die
  NATO stärker werden und dann tatsächlich zu einem Beschützer des Friedens werden
  wird, nicht zu einem Provokateur. Wir werden die glaubwürdigen Garantien sicherlich
  noch finalisieren müssen. Abschließend möchte ich deutlich machen, dass es tatsächlich
  unser Ziel ist, den Krieg zu beenden. Wir sind dafür sehr engagiert, Präsident Trump
  ebenfalls. Wir werden tun, was dafür notwendig ist. Er hat uns angewiesen, dass
  wir alles tun müssen, was dafür notwendig ist, und zwar in enger Abstimmung mit
  unseren europäischen Partnern. Frage: Herr Bundeskanzler, ich möchte nach den Äußerungen
  von Herrn Putin in China fragen, wie ernst Sie das Gesprächsangebot an die Europäer
  und die Einladung nach Moskau eigentlich nehmen, wenn gleichzeitig gesagt wird,
  dass er einen Waffenstillstand ablehne, und massive Vergeltungsschläge gegen die
  Ukraine für den Angriff auf die Brücke von Kertsch ankündigt. Eine Frage an Herrn
  Macron und den Premierminister: Der Kanzler hat eben Jalta erwähnt. Wie groß ist
  Ihre Sorge, dass die drei großen Atommächte untereinander eine Vereinbarung treffen,
  die eine Art von Jalta für Europa bedeuten könnte? Bundeskanzler Merz: Herr Kollege,
  selbstverständlich sind wir zu Gesprächen mit Russland bereit. Das haben wir immer
  gesagt. Diese Gespräche sollen nun auch bald stattfinden, und zwar im Format Ukraine,
  Russland, Europa und USA. Das kann zum Beispiel in den Vereinigten Arabischen Emiraten
  geschehen. Unsere gemeinsame europäische Position dazu habe ich eben umrissen. Wir
  hoffen nun, dass auch Russland zu diesen Gesprächen bereit ist, so wie mit den USA
  vereinbart. Das ist das Format, und auf dieser Ebene sind wir selbstverständlich
  dazu bereit, mit Russland zu reden. Wir wissen, dass dieser Krieg nur dann endet,
  wenn es eine diplomatische Lösung gibt. Aber dieser Krieg muss mit einer Ukraine
  enden, die ihre territoriale Integrität bewahrt, die starke Sicherheitsgarantien
  auf ihrer Seite hat und die vor allem in europäische Sicherheit eingebettet ist.
  Das ist der entscheidende Punkt. Über diese Themen mit Präsident Putin zu reden,
  dazu sind wir selbstverständlich bereit. … (ohne Mikrofon, akustisch unverständlich)
  B undeskanzler Merz: Wo diese Gespräche stattfinden, ist eine andere Frage. Dass
  wir nach Orten suchen, wo sie auf neutralem Boden stattfinden können, das dürfte
  offensichtlich sein. Emmanuel? Eine Frage für dich, Stichwort „Jalta“. Präsident
  Macron: Zu diesem Thema habe ich eigentlich nicht viel zu sagen. Natürlich ist klar,
  dass wir in diesem Format verschiedene Sitzungen und Besprechungen anberaumen. Ich
  habe den Text gesehen, den wir im Anschluss an die Sitzung verfasst haben, und ich
  glaube nicht, dass es hier um Jalta geht. Das sind Elemente, die man vielleicht
  teilen möchte oder auch nicht, aber ich denke nicht, dass wir die Welt umordnen
  und neugestalten werden, sondern ein kritisches Element sehe ich für die europäische
  Sicherheit, und genau das haben wir ja hier in Berlin besprochen. Wenn es einen
  Weg für eine neue Vitalität, für eine neue Weltordnung gibt, dann wird das zwischen
  den USA, Europa und China passieren. Das, was wir heute hier haben, ist ein Format,
  in dem es um unsere Interessen geht. Die Schlussfolgerungen hier entsprechen nicht
  dem, wie ich mir Jalta vorstelle. Ich denke, Sie haben es verstanden. Die Europäer
  haben beschlossen, ihr Schicksal selbst in die Hand zu nehmen und für sich selbst
  zu bestimmen. Europa ist kein Menü auf der Tagesordnung anderer Gipfeltreffen. Europa
  hat sein Schicksal selbst in der Hand. Das muss man verstehen. Frage : Hat man sich
  nach den Ergebnissen des Treffens hier in Berlin wirklich einen physischen Platz
  in den Verhandlungen mit Russland gesichert, und sind Sie bereit, Putins Vorschlag
  zu folgen, erst nach Moskau zu kommen und dort Gespräche zu führen? Eine Frage an
  Jared Kushner und Steven Witkoff: Es geht jetzt um die Garantien für die ukrainische
  Sicherheit nach Art des Artikels fünf. Wie könnten solche Garantien aussehen? Präsident
  Selenskyj, kennen wir irgendwelche Details aus den Verhandlungen in China? Kushner
  : There was no translation. Did you have one? Bundeskanzler Merz: Wir haben hier
  ausführlich über unsere Vorstellung berichtet, die wir im Hinblick auf Formate und
  im Hinblick auf das gemeinsame Vorgehen haben. Ich will noch einmal erläutern, warum
  ich den Begriff „Jalta“ verwendet habe. In Jalta ist Europa aufgeteilt worden. Wir
  lassen es nicht zu, dass Europa neu aufgeteilt wird, sondern wir nehmen, wie Präsident
  Macron es gerade gesagt hat, unser Schicksal selbst in die Hand. Wir wissen, dass
  wir dies zusammen mit den Vereinigten Staaten von Amerika tun wollen. Ich bin sehr
  dankbar dafür, dass die Vereinigten Staaten von Amerika, heute vertreten durch die
  beiden besonderen Beauftragten des amerikanischen Präsidenten, hier noch einmal
  betont haben, dass sie diesen Weg gemeinsam gehen wollen. Genau da ist die Zukunft
  der Ukraine, in einem Europa, das frei ist, das sich selbst verteidigen kann und
  das die territoriale Integrität der Staaten garantiert. Genau darüber haben wir
  gesprochen, und genau das wird das Ziel solcher Gespräche sein. Sie können anfangen;
  sie müssen anfangen, und wir werden dies sehr konstruktiv begleiten und dieses Angebot
  selbstverständlich annehmen, wenn es zu Bedingungen stattfindet, die für die Europäer,
  für die Ukraine und für die Amerikaner akzeptabel sind. Präsident Selenskyj: Können
  Sie Ihre Frage wiederholen? Die zweite Frage war doch eigentlich an die Kollegen
  aus Amerika gerichtet. Zusatzfrage: Gern. Meine Frage bezog sich auf Sicherheitsgarantien
  für die Ukraine nach Art des Artikels fünf der NATO. Wie könnte das aussehen? Wie
  sollen wir das verstehen? Kushner : Das ist nun eine Entwicklung, die wir bewirkt
  haben. Eine Sicherheitsgarantie für die Ukraine auf der Grundlage des Artikel 5 ‑
  zumindest sagen das die Russen ‑ ist ihre Absicht. Sie wollen keinen weiteren Krieg
  in Europa, wenn dieser Krieg beendet wurde. Da gibt es natürlich ein hohes Maß an
  Misstrauen gegenüber diesem Ansatz, aber deshalb befinden wir uns ja in diesem Dialog
  mit Russland und wollen auch Europa integrieren. Vor vier Jahren haben sie sich
  das letzte Mal mit Europa auseinandergesetzt. Seitdem ist viel geschehen, hat sich
  viel verändert. Die Menschen haben sich verändert. Vielleicht sollten wir hier nicht
  immer nur von Vertrauen und Absichten ausgehen und uns darauf verlassen, sondern
  sicherstellen, dass es unabhängig von der Vereinbarung, die wir erreichen werden,
  eine Art Überwachung gibt, dass es eine Abschreckung gibt und auch deutlich ist,
  dass es massive Auswirkungen haben wird, wenn es zu Verletzungen der Vereinbarung
  kommt. Aus der Perspektive Amerikas wäre eine Artikel-5-ähnliche Sicherheitsgarantie
  wirklich eine große Sache. Das ist sicherlich etwas, was Präsident Trump nicht ablehnen
  würde. Es muss aber natürlich auch im Interesse Amerikas sein, das so anzugehen,
  und es sollte Teil eines umfassenderen Sicherheitspakets sein. Das haben wir im
  letzten Jahr im Kreise der Koalition der Willigen diskutiert, und diese Arbeit werden
  wir natürlich weiterhin ausbauen und aktualisieren. Die Ukraine heute ist anders
  als die Ukraine, die vor einigen Jahren angegriffen wurde. Die Ukraine heute ist
  anders als die Ukraine, die vor einigen Jahren angegriffen wurde. Die Ukrainer haben
  bewiesen: Sie sind widerstandsfähig, sie sind einfallsreich, sie haben sich entwickelt,
  sie sind zu dem besten Militär in der Welt geworden. Das sind alles ganz entscheidende
  Elemente. Es gibt Sicherheitsgarantien, es gibt Abschreckung, es gibt dann auch
  eine Verteidigungsfähigkeit. Es muss aber auch Kommunikationskanäle und entsprechende
  Mechanismen geben, und vielleicht auch die eine oder andere Änderung, damit diese
  dann auch nutzbarer werden. Etwas hat ja nicht funktioniert, sonst wären wir nicht
  da, wo wir heute sind. Wir müssen also ein System schaffen, in dem es eine klare
  Verständigung auf beiden Seiten gibt, und auch eine Abstimmung darüber, wie man
  etwas verstanden hat ‑ Eckpfeiler. Das Ziel ist natürlich, es so dauerhaft und so
  stabil zu machen wie möglich ‑ nicht, damit man es nutzen muss, sondern es so gut
  zu gestalten, dass man es zum Glück nie einsetzen muss, weil die Abschreckung so
  groß ist. Frage : Herr Präsident Macron, eine Frage für die französische Presse:
  Der Gipfel in Shenzhen findet ohne die Europäer statt. Können Sie bestätigen, dass
  Sie sich mit Trump besprochen haben und dass Sie in Bezug auf die Ukraine auch so
  optimistisch sind wie Präsident Trump? Werden Sie als Präsident nach Moskau fahren?
  Es besteht ja die Möglichkeit, dass in verschiedenen europäischen Ländern Parteien
  an die Macht kommen, die die Ukraine nicht unterstützen. Wie werden Sie darauf reagieren,
  welche Vorkehrungen werden Sie da treffen? Präsident Macron: Vielen Dank. ‑ Wie
  gesagt, Herr Trump hatte Gespräche in Shenzhen, und das haben wir auch analysiert.
  Wichtig ist, dass wir hier handeln, dass wir das mit Respekt betrachten und dass
  wir auch das gegenseitige Engagement respektieren. Er hat sich mit uns ausgetauscht;
  wir haben uns telefonisch ausgetauscht und auch mit seinen Gesandten gesprochen.
  Ich war selbst aber nicht dabei. Wir haben den Kontakt mit Moskau ja nie abgebrochen.
  Es gab immer Kontakte mit den russischen Behörden. Die Frage ist jetzt nur: Worüber
  reden wir und was machen wir jetzt? Wir müssen die richtige Reihenfolge einhalten.
  Wir müssen zuerst einmal sagen: Die Ukraine leistet Widerstand in einem kritischen
  Moment, wir brauchen Sicherheitsgarantien, und dann müssen wir auch die Frage des
  Staatsgebiets verhandeln. Erst dann können wir über den Frieden sprechen. Das müssen
  wir in der richtigen Reihenfolge machen, und wir werden auch den richtigen Ort finden,
  um das zu verhandeln. Ich glaube, dass das französische Volk eine demokratische
  Entscheidung will. Die Sicherheit für Frankreich, die Sicherheit für Europa ist
  wichtig. Wir sind davon überzeugt, dass wir das unterstützen müssen. Ich habe das
  auch schon 2022 gesagt, nachdem der Angriffskrieg in die zweite Phase getreten ist.
  Das, was in der Ukraine passiert, beeinträchtigt unsere Sicherheit, gefährdet unsere
  Sicherheit; das müssen wir uns alle vor Augen führen. Deshalb brauchen wir jetzt
  Debatten mit der Öffentlichkeit, mit der Gesellschaft, damit die Menschen verstehen,
  was die einzelnen politischen Parteien wirklich wollen. Wir wollen auf jeden Fall
  Sicherheit für ganz Europa, und das nehmen wir nicht auf die leichte Schulter, das
  kann ich Ihnen garantieren. Frage : Ich stelle meine Frage auf Englisch; ich denke,
  das ist leichter. ‑ Ich habe eine Frage an die drei E3‑Chefs bezüglich des Telefonats
  mit dem US-Präsidenten: Der US-Präsident schien sehr gut gelaunt und in einer positiven
  Stimmung zu sein, und er schien auch zu sagen: Es ist eine Schande, dass die Europäer
  so viel Geld für Waffen ausgeben, weil Putin wirklich Frieden möchte. Sind Sie drei
  besorgt, dass der US-Präsident die Situation zu rosig betrachtet oder dass er der
  Charmeoffensive Putins zum Opfer gefallen ist? Der Kanzler hat ja gesagt, es sollte
  keine Überraschungen geben. Vielleicht darf ich auch Herrn Kushner eine Frage stellen:
  Wäre es nicht schädigend für US‑Geschäftsinteressen, wenn Europa aufhören würde,
  US-Waffen zu kaufen? Die USA verdienen ja ganz gut daran. Premierminister Burnham
  : Herzlichen Dank für Ihre Frage. ‑ Ein zu rosiges Bild der Situation? Nein, ganz
  gewiss nicht, das war nicht Teil des Telefonats mit dem US-Präsidenten. Ich würde
  tatsächlich sagen, dass das Gegenteil der Fall ist; denn er hat über die schrecklichen
  Verluste an Leben gesprochen, auch die Verluste an russischen Menschenleben, und
  er hat ganz leidenschaftlich über dieses Thema gesprochen. Niemand gewinnt also
  diesen Krieg, und ich füge hinzu: Russland verliert aufgrund des Scheiterns beim
  Herbeiführen einer Lösung wahrscheinlich am meisten. Jared hat auch über Fortschritte
  gesprochen und wir sind zu dem Punkt gekommen, dass es keine Entscheidung über die
  Ukraine gibt, ohne dass die Ukraine mit im Raum ist. Es gibt auch keine Entscheidung
  über europäische Sicherheit, ohne dass Europa mit am Tisch sitzt. Das ist ganz klar.
  Wie ich bereits vorher gesagt habe, denke ich, dass große Fortschritte erzielt worden
  sind. Zumindest seitdem ich im Amt bin, sehe ich, dass wir alle auf Linie kommen,
  und das ist sehr hilfreich. Niemand will eine weitere Eskalation ‑ dieser Punkt
  ist ganz wichtig. Wir stehen fest zu unserer Unterstützung für die Ukraine, aber
  niemand will eine Eskalation. Wir hoffen auf einen Waffenstillstand, auf Getreide,
  das durch das Schwarze Meer kommt, auf einen Gefangenaustausch. Das sind Dinge,
  die passieren könnten. Die Ukraine muss im Zentrum der Verhandlungen stehen, aber
  wir werden hinter Volodymyr stehen und ihn Schritt für Schritt begleiten und ihm
  die ganze Unterstützung angedeihen lassen, die er in diesem Prozess braucht. Ich
  möchte sagen: Zum ersten Mal in meiner Amtszeit als Premierminister des Vereinigten
  Königreiches sehe ich, dass wir zusammenkommen, dass wir auf einer Linie sind, dass
  die Menschen die gleichen Dinge sagen. Ich sehe viel Solidarität in ganz Europa,
  eine starke, geeinte europäische Position. Das birgt doch Grund und Anlass zur Hoffnung,
  dass es Fortschritte geben kann. Es gibt aber natürlich eine Person, die das noch
  viel besser zeigen könnte, und das ist Präsident Putin. Witkoff: Um Ihre Frage zu
  beantworten: Der Präsident war leidenschaftlich in der Unterstützung eines friedlichen
  Endes dieses Krieges. Er sagt weiterhin: Er hat Jared und mich hierher geschickt,
  um ganz speziell ein Teil dieser Koalition der Willigen zu sein, und er hat uns
  Instruktionen gegeben, dass wir alles tun sollten, um diesen Krieg zu beenden. Nach
  dem, was ich heute in dem Telefonat von ihm gehört habe, hat er die gleichen Prinzipien
  gegenüber den anderen beiden Staatschefs, die er getroffen hat, erwähnt. Er möchte
  ein friedliches Ende; das war ein wesentlicher Bestandteil dieses trilateralen Treffens,
  und wir schulden ihm Respekt dafür. Kushner : Zu Ihrer Frage zu den Waffen: Es handelt
  sich um eine kleine Branche im Vergleich zur Größe der US-Wirtschaft, und natürlich
  würde Präsident Trump nichts froher stimmen, als wenn diese Industrie, diese Branche
  leiden würde. Das, was geschehen ist, hat uns gezeigt: Der Krieg ist negativ, wir
  alle verlieren durch Krieg. Frieden ist etwas Positives. Wenn wir es schaffen, Ressourcen
  in eine andere Richtung zu steuern und nicht mehr Waffen zu kaufen, dann ist das
  großartig. Aber man sieht ja in Europa, was passiert, wenn man zu wenig in Waffen
  investiert. Insofern braucht es hier also ein Gleichgewicht. Ich denke, Präsident
  Trump möchte Frieden bringen. Es gibt eine große Friedensdividende, und er möchte
  das Leid, das durch Kriege entsteht, beenden. Die Frage, die Sie gestellt haben,
  spielt also keine Rolle in seinen Überlegungen. Er möchte für den Frieden sorgen
  und auf Frieden drängen mit allem, was in seiner Macht steht. Präsident Selenskyj:
  Man kann sagen, dass Russland 2026 auf dem Gefechtsfeld verloren hat. Russland versucht,
  mit ballistischen Raketen gegen die Zivilbevölkerung zu gewinnen. Die Frage ist
  hier nicht die Widerstandsfähigkeit der Menschen, sondern es sind unfaire Regeln ‑
  selbst im Krieg sind das ungerechte, unfaire Regeln. Wir können damit rechnen, dass
  Russland gegen die Einheit Europas kämpfen wird. Dieser Krieg war bisher vollkommen
  aussichtslos. Russland hat diesen Krieg verloren, und es ist Russland nicht gelungen,
  Europa zu spalten. Unsere heutige Sitzung war ein Beweis dafür, und dafür danke
  ich den Partnern. Ich bin mir sicher, dass Putin mit Präsident Trump bestimmte Fragen
  aufgeworfen oder besprochen hat ‑ wir wissen nicht, was sie besprochen haben. Präsident
  Trump hat heute eine Ansprache gehalten, und seine Botschaft war, dass er den Krieg
  beenden möchte. Ich möchte aber allen sagen ‑ unseren Kollegen, Ihnen und auch den
  Vertretern des US-Präsidenten ‑, dass ein starkes Europa nicht nur für die Ukraine
  zu Kriegszeiten wichtig ist, sondern auch für Europa selbst. An den Journalisten,
  der diese Frage gestellt hat, hätte ich auch persönlich eine Frage: Wo haben Sie
  Charme bei Putin gesehen?'
