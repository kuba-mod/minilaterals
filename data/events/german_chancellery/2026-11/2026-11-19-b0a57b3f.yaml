title: Treffen der „Koalition der Willigen“ in Berlin Gemeinsam für Frieden in der
  Ukraine und europäische Sicherheit
text: 'Bundeskanzler Merz begrüßte den ukrainischen Präsidenten Selenskyj zum Treffen
  der Koalition der Willigen in Berlin. Frieden für die Ukraine, Sicherheit für Europa –
  darum ging es am Donnerstag bei einem Treffen der sogenannten „Koalition der Willigen“
  in Berlin auf Einladung von Bundeskanzler Friedrich Merz. Die Ukraine kann sich
  weiter auf die gemeinsame Unterstützung verlassen – politisch, finanziell und militärisch
  – und zwar so lange wie nötig. „Wir leisten diese Beiträge, um Friedensverhandlungen
  überhaupt erst zu ermöglichen", betonte der Kanzler in einer Pressekonferenz im
  Anschluss an das Treffen. Mit Blick auf das weitere Vorgehen arbeite man mit sehr
  klarem Kompass, bekräftigte der Kanzler. „Wir lassen es nicht zu, dass Europa neu
  aufgeteilt wird, sondern wir nehmen unser Schicksal selbst in die Hand.“ Ein Jalta-Format
  werde den Frieden nicht bringen. Der Bundeskanzler begrüßte insbesondere auch das
  Engagement der USA , diesen Weg gemeinsam gehen zu wollen und unterstrich: „Und
  genau da ist die Zukunft der Ukraine. In einem Europa, das frei ist, das sich selbst
  verteidigen kann und das die territoriale Integrität der Staaten garantiert.“ An
  den russischen Präsidenten adressierte der Kanzler den klaren Appell, die Waffen
  niederzulegen: „Präsident Putin, beenden Sie den Krieg in der Ukraine und lassen
  Sie uns gemeinsam nach diplomatischen Lösungen suchen.“ Die Koalition der Willigen
  vereint – unter dem Ko-Vorsitz von Frankreich, Großbritannien und Deutschland –
  fast 40 Partnerstaaten. Außerdem nehmen an den Treffen der Präsident des Europäischen
  Rates, António Costa , EU -Kommissionspräsidentin Ursula von der Leyen, die Hohe
  Vertreterin der Union für Außen- und Sicherheitspolitik, Kaja Kallas, und NATO -Generalsekretär
  Mark Rutte teil. Das Format besteht seit Frühjahr 2025. Knapp 40 Delegationen kamen
  zum Treffen der „Koalition der Willigen“ im Bundeskanzleramt zusammen. Die Koalition
  der Willigen ist in Berlin übereingekommen, die Ukraine um der Sicherheit aller
  Beteiligten willen auch im nächsten Jahr weiter gemeinsam kraftvoll zu unterstützen.
  Die Europäische Kommission hat Vorschläge vorgelegt, die für 2027 zusätzliche 45
  Milliarden Euro vorsehen. Diese Mittel sollen in der Europäischen Union alle Beteiligten
  gemeinsam mobilisieren. „Dafür gab es heute breite europäische Unterstützung“, so
  Merz. Vorschlag der Europäischen Kommission zur Ukraine-Finanzierung: Die Ukraine
  benötigt internationale Unterstützung, um 2027 eine offene Finanzierungslücke von
  geschätzt 70 Milliarden Euro zu schließen. Zur Deckung dieses Bedarfs hat die Europäische
  Kommission am 18. November 2026 Vorschläge für weitere Finanzhilfen von bis zu 45
  Milliarden Euro vorgelegt. Sie sollen das bereits bestehende Unterstützungsdarlehen
  über 90 Milliarden Euro für 2026 und 2027 ergänzen. Die Koalition der Willigen hat
  in Berlin ihre klare Idee vom Frieden bekräftigt. Gespräche zum Frieden sollen die
  Ukraine, Russland, die Vereinigten Staaten und das „ Team Europa“ umfassen. Diese
  Gespräche sollen nun bald stattfinden. Ziel ist und bleibt eine souveräne Ukraine
  in einem sicheren Europa. Ausgangspunkt einer territorialen Verständigung muss dabei
  die sogenannte Kontaktlinie sein. Die Ukraine muss ihren europäischen Weg gehen
  können. Sie muss auf Hilfe beim Wiederaufbau zählen dürfen. Im Gegenzug sind schrittweise
  konditionierte Aufhebungen von Sanktionen gegen Russland denkbar. Team Europa: Die
  Staats- und Regierungschefinnen und -chefs der Europäischen Union haben sich am
  13. November 2026 in Dublin darauf verständigt, dass das europäische Verhandlungsteam
  für den Frieden in der Ukraine aus Vertreterinnen und Vertretern der europäischen
  Institutionen sowie den E5 – Frankreich, Deutschland, Italien, Polen und dem Vereinigten
  Königreich – besteht. Das Team wird in voller Einigkeit und in enger Abstimmung
  mit allen EU -Mitgliedstaaten handeln. Nach einem Frieden in der Ukraine muss Europa
  sicherer sein als vorher. Deshalb bauen wir auf eine stärkere, europäischere NATO.
  Die Koalition der Willigen ist handlungsfähig, was Sicherheitsgarantien für die
  Ukraine nach Beendigung des Krieges betrifft. Diese sollen zudem eng mit den USA
  koordiniert werden. Die derzeit laufende, erste gemeinsame Militärübung, „Koalicja“
  zeigt, dass die Koalition der Willigen bereit ist, gemeinsam mit den USA zur Absicherung
  eines Friedens beizutragen. Militärübung „Koalicja“: Vom 9. bis 22. November 2026
  führt die Koalition der Willigen die erste militärische Übung mit dem Namen „Koalicja“
  (Koalition) durch, an der sich auch Deutschland beteiligt. Es handelt sich um eine
  Verlegeübung, die rein defensiv angelegt ist und auf dem Territorium von Koalitionsmitgliedern
  stattfindet. Die Multinationale Truppe für die Ukraine soll nach einem Waffenstillstand
  dazu beitragen, den Frieden in der Ukraine absichern. Das bisher größte Gipfeltreffen
  der insgesamt 44 Delegationen, unter ihnen 26 Staats- und Regierungschefs sowie
  die Spitzen von EU und NATO, stand unter dem Motto „Gemeinsam für Frieden in der
  Ukraine und europäische Sicherheit“. Es reihte sich ein in die fortgesetzten, intensiven
  diplomatischen Bemühungen Deutschlands und seiner Partner der vergangenen Wochen
  und Monate. Ausgerichtet wurde es erneut gemeinsam mit Frankreich und Großbritannien
  – die Ukraine nahm in herausgehobener Rolle teil. Auch Vertreter der USA waren in
  Berlin anwesend . Am Freitag, dem Folgetag des Gipfels der „Koalition der Willigen“,
  findet im Haus der Wirtschaft in Berlin das 9. Deutsch-Ukrainische Wirtschaftsforum
  statt. Die Konferenz wird vom Ost-Ausschuss der Deutschen Wirtschaft (OA), der Deutschen
  Industrie- und Handelskammer (DIHK) und der Deutsch-Ukrainischen Industrie- und
  Handelskammer (AHK Ukraine) organisiert. Bundeskanzler Merz wird zur Eröffnung eine
  Rede halten. Das Forum dient dazu, das wirtschaftliche Engagement und bilaterale
  Kooperationen privater Unternehmen strategisch zu vertiefen und steht in diesem
  Jahr unter dem Motto „ Key Sectors. Shared Future “. Im Zentrum stehen wirtschaftliche
  Resilienz, Partnerschaften im Bereich von Hoch- und Zukunftstechnologien, gemeinsame
  Rüstungskooperationen (zum Beispiel bei der Drohnenproduktion) sowie konkrete, privatwirtschaftliche
  Initiativen zum langfristigen und nachhaltigen Wiederaufbau der Ukraine. Berlin,
  19. November 2026: Auf Einladung von Großbritannien, Frankreich und Deutschland
  fand in Berlin ein Gipfeltreffen der „Koalition der Willigen“ zur Unterstützung
  der Ukraine statt. Die Initiative wurde Anfang 2025 mit dem Ziel gegründet, der
  Ukraine Waffen für ihren Abwehrkampf gegen Russland zu liefern, aber auch humanitär
  und finanziell zu helfen. Heute gehören ihr fast 40 Länder an. Zu dem Gipfeltreffen
  im Kanzleramt kamen auch die US -Sondergesandten Steve Witkoff und Jared Kushner.
  37 Vertreterinnen und Vertreter, größtenteils auf Ebene der Staats- und Regierungschefs,
  ergänzt um die Spitzen von EU und NATO , kamen nach Berlin. Die Bundesregierung
  und ihre Partner halten unverändert Kurs auf einen gerechten und dauerhaften Frieden
  für die Ukraine. Das Treffen diente der engen Abstimmung und Unterstützung der Partner
  für weitere direkte Gespräche zwischen Russland und der Ukraine mit aktiver Beteiligung
  der USA und der Europäer. Die Sicherheit der Ukraine ist untrennbar mit der Sicherheit
  des euroatlantischen Raums verbunden, denn der Ausgang des russischen Angriffskrieges
  wird die europäische Sicherheitsarchitektur für lange Zeit maßgeblich prägen. Nach
  den Beratungen traten Vertreter verschiedener Staaten vor die Presse. Bundeskanzler
  Friedrich Merz unterstrich den Einsatz für die Ukraine: „So lange es nötig ist,
  werden wir Kyjiw unterstützen“, sagte er bei der Pressekonferenz. An Putin gerichtet,
  mit einem Stück der Berliner Mauer, appellierte er: „Präsident Putin, beenden Sie
  den Krieg in der Ukraine und lassen Sie uns gemeinsam nach diplomatischen Lösungen
  suchen. Wir wollen nie wieder in einem geteilten Europa leben.“ Berlin, 19. November
  2026: Auf Einladung von Großbritannien, Frankreich und Deutschland fand in Berlin
  ein Gipfeltreffen der „Koalition der Willigen“ zur Unterstützung der Ukraine statt.
  Die Initiative wurde Anfang 2025 mit dem Ziel gegründet, der Ukraine Waffen für
  ihren Abwehrkampf gegen Russland zu liefern, aber auch humanitär und finanziell
  zu helfen. Heute gehören ihr fast 40 Länder an. Zu dem Gipfeltreffen im Kanzleramt
  kamen auch die US -Sondergesandten Steve Witkoff und Jared Kushner. 37 Vertreterinnen
  und Vertreter, größtenteils auf Ebene der Staats- und Regierungschefs, ergänzt um
  die Spitzen von EU und NATO , kamen nach Berlin. Die Bundesregierung und ihre Partner
  halten unverändert Kurs auf einen gerechten und dauerhaften Frieden für die Ukraine.
  Das Treffen diente der engen Abstimmung und Unterstützung der Partner für weitere
  direkte Gespräche zwischen Russland und der Ukraine mit aktiver Beteiligung der
  USA und der Europäer. Die Sicherheit der Ukraine ist untrennbar mit der Sicherheit
  des euroatlantischen Raums verbunden, denn der Ausgang des russischen Angriffskrieges
  wird die europäische Sicherheitsarchitektur für lange Zeit maßgeblich prägen. Nach
  den Beratungen traten Vertreter verschiedener Staaten vor die Presse. Bundeskanzler
  Friedrich Merz unterstrich den Einsatz für die Ukraine: „So lange es nötig ist,
  werden wir Kyjiw unterstützen“, sagte er bei der Pressekonferenz. An Putin gerichtet,
  mit einem Stück der Berliner Mauer, appellierte er: „Präsident Putin, beenden Sie
  den Krieg in der Ukraine und lassen Sie uns gemeinsam nach diplomatischen Lösungen
  suchen. Wir wollen nie wieder in einem geteilten Europa leben.“'
