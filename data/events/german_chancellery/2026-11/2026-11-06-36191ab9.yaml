title: Rede von Bundeskanzler Merz anlässlich der Ehrung der Medaillengewinnerinnen
  und Medaillengewinner der Maccabiah 2026 in Israel am 6. November 2026 in Berlin
text: 'Liebe Medaillengewinnerinnen und Medaillengewinner der diesjährigen Maccabiah,
  liebe Trainerinnen und Trainer, liebe Mitglieder des Vorstandes von Makkabi Deutschland,
  sehr geehrter Herr Präsident, lieber Herr Meyer, sehr geehrter Staatsminister für
  Sport und Ehrenamt hier im Kanzleramt, liebe Kolleginnen und Kollegen aus dem Deutschen
  Bundestag, herzlich willkommen im Kanzleramt! Ich freue mich sehr, dass ich Sie
  und euch alle heute hier herzlich begrüßen darf, um die Medaillengewinner und -gewinnerinnen
  der diesjährigen Maccabiah in Israel zu ehren. Ihr habt Deutschland bei den Spielen
  erfolgreich vertreten, mehr als erfolgreich vertreten ‑ wir haben es schon gehört,
  128 Medaillen ‑, und damit war das deutsche Team das erfolgreichste europäische
  Team im Wettbewerb. Herzlichen Glückwunsch, ein toller Erfolg! Sie alle, ihr alle
  könnt stolz sein auf diese wahre Meisterleistung, die ihr da auf internationaler
  Bühne gezeigt habt, und wir sind als Deutsche stolz auf Sie und auf euch. Sie haben
  hart dafür gearbeitet. Sie haben im Training viel dafür gearbeitet. Sie haben viel
  Unterstützung von den Familien, den Trainern, den Ehrenamtlichen in den Vereinen
  gehabt. Dieser Erfolg ist deshalb ein Erfolg für alle, nicht nur für die Sportlerinnen
  und Sportler, sondern auch für diejenigen, die ihn begleitet haben, die Verbände,
  die Vereine, die Trainer, die Familien. So hoffe ich, und ich bin mir eigentlich
  sicher ‑ der Film hat es ja auch gezeigt ‑: Es ist und bleibt eine unvergessliche
  Zeit in Israel, die Sie gehabt haben. Sie haben neue Freundschaften geknüpft, Sie
  haben unbeschwerte Stunden erlebt, und Sie haben das alles trotz der politischen
  und auch der geopolitischen Lage erlebt, in der die Spiele in diesem Jahr stattfanden.
  Genau das macht Ihre Leistung ja auch so besonders wertvoll und besonders bemerkenswert,
  dass Sie es eben in diesem Umfeld getan haben, in dem Sie diese Höchstleistungen
  erbracht haben, eben trotz widriger Umstände. Sie haben 2025 erlebt, dass die Spiele
  aufgrund der Sicherheitslage kurzfristig verschoben werden mussten, und auch in
  diesem Jahr war die Sicherheitslage nicht so, wie wir es uns, wie wir es Israel,
  wie wir es uns allen, wie wir es Ihnen gewünscht hätten. Sie haben es mir eben bei
  unserem kurzen Vorgespräch gesagt: Auch die Zahl der Teilnehmerinnen und Teilnehmer
  in diesem Jahr war deutlich geringer als beim letzten Mal. Trotzdem sage ich es:
  Sie haben sich nicht unterkriegen lassen. Sie haben „More Than Ever“ gesagt, Sie
  sind zu den Spielen gereist und „the rest is history“, wie man so schön sagt. -
  Herzlichen Dank dafür! So ist das Ganze nicht nur Sportgeschichte, sondern es ist
  jüdische Geschichte, denn Sie haben auch die Geschichte des jüdischen Widerstands
  und seiner Widerstandskraft fortgeschrieben. Zusammenhalten, weitermachen trotz
  widriger Umstände - das ist ein ganz zentraler Bestandteil, ja, auch jüdischen Lebens
  in Deutschland. Dass die Maccabiah in diesem Geist gegründet worden ist und dass
  sie auch in diesem Jahr unter widrigen Umständen stattfinde musste, erinnert uns
  daran: Jüdinnen und Juden sind eben immer noch und sind weiterhin einer Vielfalt
  von Bedrohungen ausgesetzt. Sie sind von Ausgrenzungen und Antisemitismus betroffen.
  Aber andererseits zeigen uns die Spiele, wie vielfältig jüdisches Leben eben nicht
  nur in Deutschland, sondern auf der ganzen Welt ist, und das muss uns wohl gerade
  hier in Deutschland auch bisweilen so vor Augen geführt werden. Danke, dass Sie
  da waren. Danke, dass Sie mit so großer Fröhlichkeit und so großem Erfolg da waren.
  Danke auch, dass Sie heute diesen Film noch einmal gezeigt haben. Ich fand, wir
  waren alle sehr beeindruckt. Das darf ich jedenfalls für mich sagen und ‑ ich bin
  mir ganz sicher ‑ für Sie und für euch alle. Nun berichten viele Jüdinnen und Juden
  in unserem Land davon, dass der deutsche Blick auf das Jüdische in der sogenannten
  Mehrheitsgesellschaft doch manchmal sehr eindimensional ist. Wir sehen hierzulande
  vor allem die Geschichte von Katastrophen. Es ist ja auch Teil der deutschen Identität
  und sollte es zumindest sein: Die Erinnerung an das ungeheuerliche Verbrechen am
  jüdischen Leben müssen wir lebendig halten. Wir müssen immer wieder daran erinnern,
  was auf deutschem Boden geschehen ist. Aber schwierig und ungerecht wird es dann,
  wenn es uns davon abhält, die vielen Aspekte jüdischen Lebens, jüdischen Sports,
  jüdischer Kultur zu sehen, die unsere Gesellschaft eben auch heute bereichert und
  die uns alle stolz macht. Die vielen Einzelleistungen in der Musik, in der Kultur
  und eben bei Ihnen, bei euch im Sport, das alles ist auch Teil unseres gemeinsamen
  Lebens, auch Teil jüdischen Lebens in Deutschland. Ihr Verband Makkabi Deutschland
  ist auch darum von unschätzbarem Wert. In den 40 Ortsverbänden von Makkabi trainieren
  nicht nur jüdische Sportlerinnen und Sportler, sondern Menschen ganz unabhängig
  von ihrem Glauben und von ihrer Herkunft. Sie haben es mir eben gesagt: 90 Prozent,
  wenn ich es richtig in Erinnerung habe, der Mitglieder der Vereine sind nicht jüdischen
  Glaubens. Dies zeigt also auch, welche ungeheure Integrationsleistung Sie mit dieser
  Arbeit in den Verbänden, in den Vereinen vollbringen. Sport kann eben Begegnung
  auf Augenhöhe ermöglichen. Er kann im Kleinen das miteinander schaffen, was wir
  im Großen in unserem Land gemeinsam anstreben. Dass dieses Miteinander im Großen
  immer wieder bedroht ist, und zwar insbesondere durch das Gift des Antisemitismus,
  das wissen wir, das wissen Sie alle, das erleben Sie, das erleben wir, das erleben
  Ihre Familien, und ich muss befürchten, wir erleben es alle im Alltag. Meine Damen
  und Herren, ich will Ihnen deshalb an dieser Stelle noch einmal sagen, wie ich es
  an vielen anderen Stellen tue und am kommenden Montag erneut in einer Synagoge in
  München tun werde: Diese Zeit nimmt uns in die Pflicht, dass wir von historischer
  Verantwortung nicht bloß sprechen, sondern dass wir unsere Verantwortung, Antisemitismus
  zu bekämpfen, wo immer er sich zeigt, mit Leben erfüllen und in unserem Land als
  eine beständige Aufgabe annehmen. Wir tun das in der Bundesrepublik. Wir wollen
  mit der Unterstützung der Maccabiah und Ihrer Vereine auch die Sichtbarkeit und
  Selbstverständlichkeit jüdischen Lebens in Deutschland unterstützen. Wir wollen
  das fördern, und deswegen fördert der Bund ja zum Beispiel auch den Wiederaufbau
  von Synagogen, zahlreiche Institutionen, Projekte, Verbände sowie auch Sie. Wir
  haben deshalb die Entsendung der deutschen Mannschaft zur Maccabiah 2026 hier aus
  dem Bundeskanzleramt heraus auch mit einem nennenswerten Betrag unterstützt. Die
  Summen, die Zahlen schaffen natürlich nur eine Infrastruktur, schaffen nur den Rahmen
  für jüdische Sicherheit und für jüdisches Leben. Sie sind es, die das alles mit
  Leben erfüllen müssen, die Sportlerinnen und Sportler sowie die Menschen in vielen
  anderen Bereichen. Herzlichen Dank dafür, dass Sie das tun. Ich danke Ihnen nicht
  nur im Namen der Bundesregierung, ich danke Ihnen im Namen der Bundesrepublik Deutschland,
  dass Sie das tun. Dass Sie den Wert des Sports im Allgemeinen und des Ehrenamts
  auch gut aufgehoben wissen, das war die Begründung dafür, dass ich mich im letzten
  Jahr mit der Amtsübernahme der Bundesregierung hier im deutschen Bundeskanzleramt
  entschieden habe ‑ übrigens heute auf den Tag genau vor 18 Monaten ‑, die Verantwortung
  nicht nur für Kultur und Medien, sondern auch die Verantwortung für Sport und Ehrenamt
  im Bundeskanzleramt aufzuwerten und dies mit einem Staatsminister beim Bundeskanzler
  auch zu zeigen. Das war die Entscheidung, die ich im letzten Jahr getroffen habe,
  und ich will es auch an dieser Stelle sagen: Lieber Herr Rauhe, herzlichen Dank,
  dass Sie das tun, aus dem Sport kommend und jetzt sozusagen im Zentrum der deutschen
  Politik angekommen, dass Sie die Aufgabe übernehmen. Ich habe eben schon gehört
  und gesehen, wie gut Sie beide sich auch kennen. Vielen Dank, dass Sie diese Aufgabe
  hier übernehmen. Wenden Sie sich jederzeit an ihn, und wenn Sie sich an ihn wenden,
  dann haben Sie unmittelbar auch mich an Ihrer Seite. Die vorgesehenen Urkunden wird
  Ihnen Herr Rauhe gleich überreichen. Aber, Frau Reitz, wir haben vorgesehen, dass
  wir hier noch eine kurze Fragerunde mit den Teilnehmerinnen und Teilnehmern machen.
  Aber bevor wir einsteigen, noch einmal ganz, ganz herzlichen Dank, dass Sie hier
  sind. Ich freue mich wirklich, dass Sie das alles gemacht haben, dass Sie diese
  Arbeit tun, dass Sie diesen Sport leisten. Herzlichen Dank und vor allem noch einmal
  herzlichen Glückwunsch zu diesem großen Erfolg, den Sie in Israel in diesem Jahr
  erzielt haben!'
