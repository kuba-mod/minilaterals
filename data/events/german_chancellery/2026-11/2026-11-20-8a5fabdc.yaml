title: Bundeskanzler Friedrich Merz zur Erklärung der dänischen Ministerpräsidentin
  Mette Frederiksen
text: 'Unsere dänischen Freunde haben heute einen versuchten Anschlag auf einen US-amerikanisch-ukrainischen
  Staatsangehörigen in Dänemark den russischen Sicherheitsbehörden zugeordnet. Wir
  stehen solidarisch an der Seite Dänemarks. Wir werden jeden Versuch Russlands unterbinden,
  Europa durch Attentate, Anschläge oder Sabotageakte einzuschüchtern. Unsere Unterstützung
  der Ukraine ist unerschütterlich. Höflichkeitsübersetzung : Federal Chancellor Friedrich
  Merz on the statement by Danish Prime Minister Mette Frederiksen Today, our Danish
  friends attributed an attempted attack on a U.S.-Ukrainian citizen in Denmark to
  the Russian security authorities. We stand in solidarity with Denmark. We will prevent
  any Russian attempt to intimidate Europe through assassinations, attacks, or acts
  of sabotage. Our support for Ukraine is unwavering.'
