title: Bundeskanzler Merz empfängt den ungarischen Ministerpräsidenten Magyar
text: Bundeskanzler Friedrich Merz wird am 10. November 2026 den Ministerpräsidenten
  Ungarns, Péter Magyar, in Berlin empfangen. Nach der Begrüßung um 11 Uhr am Bundeskanzleramt
  ist ein Vier-Augengespräch der beiden Regierungschefs geplant. Anschließend wird
  es in einem Delegationsgespräch sowie einem Arbeitsmittagessen unter Beteiligung
  ausgewählter Ministerinnen und Minister um die Themenbereiche Europa, Verteidigung,
  wirtschaftliche Zusammenarbeit sowie die weitere Unterstützung der Ukraine gehen.
  Für 13:30 Uhr ist eine gemeinsame Pressekonferenz von Bundeskanzler Friedrich Merz
  und Ministerpräsident Péter Magyar geplant.
