date: '2026-11-25'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 25. November 2026
text: '(Vorsitzende Buschow eröffnet die Pressekonferenz und begrüßt StS Kornelius
  sowie die Sprecherinnen und Sprecher der Ministerien.) Ich habe eine Frage an das
  BMI zu dem für gestern geplanten, aber abgesagten Abschiebeflug nach Afghanistan
  . Stimmt es, dass es einen Zusammenhang mit Forderungen von afghanischer Seite nach
  weiteren Einreisen von Konsularbeamten gibt? Ich kann Ihnen leider keine Informationen
  darüber geben. Ich verstehe das Interesse, aber wir sagen zu operativen Maßnahmen
  ‑ dazu gehören auch Rückführungsflüge ‑ grundsätzlich nichts, bevor sie stattgefunden
  haben. Aber Sie haben ja mitbekommen, dass dieser Abschiebeflug von dort sozusagen
  nicht zugelassen wurde. Gab es von afghanischer Seite irgendwelche Gegenforderungen?
  Dazu kann ich Ihnen leider keine Informationen geben. Sie liegen mir nicht vor.
  Frau Singer, könnten Sie den Stand hinsichtlich der Einreise von Konsularbeamten
  des Talibanregimes für die Vertretung in Deutschland beschreiben? Wie viele Genehmigungen
  wurden bisher erteilt? Wie viele Menschen kamen? Meines Wissens haben wir diesbezüglich
  keinen neuen Stand. Eventuell möchte der Kollege aus dem Auswärtigen Amt etwas dazu
  sagen. Ich kann gern ergänzen. Sie wissen, dass im vergangenen Jahr zwei Konsularbeamte
  eingereist sind. Das haben wir hier wiederholt diskutiert. Mein Kollege äußerte
  sich im Sommer dahingehend, dass grundsätzlich vier weitere Konsularbeamte einreisen
  könnten. So weit sind wir noch nicht. Diese Schritte sind noch nicht unternommen
  bzw. abgeschlossen worden. Aber hier in Deutschland besteht natürlich nach wie vor
  ein Bedarf an der konsularischen Betreuung der vielen Afghaninnen und Afghanen,
  die hier in Deutschland leben. Dabei geht es um 450 000, fast 500 000 Menschen.
  Das ist eine Notwendigkeit. Ebenso geht es um die Rückführung. Dazu stehen wir im
  engen Austausch mit dem BMI. Sie erwähnten die konsularische Betreuung. Nun sind
  die Konsularbeamten ja Abgesandte des Talibanregimes und werden vermutlich in dessen
  Interesse und nach dessen Maßstäben agieren. Gibt es irgendwelche Sorgen oder Beobachtungen,
  wonach das den Interessen der hier lebenden Afghanen zuwiderläuft oder für sie schädlich
  ist? Wie können Sie sicherstellen, dass das nicht passiert? Auch darüber haben wir
  hier, denke ich, wiederholt gesprochen und gesagt, dass natürlich eine Sicherheitsüberprüfung
  aller dann hier akkreditierten Diplomatinnen und Diplomanten bzw. Abgesandten stattfinde,
  die infrage kämen. Das ist im Jahr 2026, wie gesagt, noch in keinem Fall erfolgt,
  aber die grundsätzliche Bereitschaft für vier weitere Personen besteht. Meine Frage
  zielte nicht auf eine Sicherheitsüberprüfung der zu Akkreditierenden, sondern auf
  die konkrete Tätigkeit, die diese Personen ‑ zwei sind es ja wohl schon ‑ ausüben.
  Haben Sie einen Überblick darüber, in welcher Form sie diese Tätigkeit der konsularischen
  Betreuung ausüben, möglicherweise zum Schaden hier lebender afghanischer Bürger?
  Die hier Tätigen sind, wie gesagt, sicherheitsüberprüft. Es gibt eine Diplomatenliste,
  für die man sich akkreditiert. Entsprechend dieser Diplomatenliste werden diese
  Personen an den Auslandsvertretungen Afghanistans eingesetzt. Es geht um eine Person
  in Berlin und eine Person in Bonn, allerdings beide nicht in leitender Funktion.
  An das BMBFSFJ zu dem Bericht zum Prostituiertenschutzgesetz , der heute vorgelegt
  wird: Dazu steht ja auch etwas im Koalitionsvertrag, nämlich dass da nachgebessert
  werden soll. Wie geht das jetzt weiter? Werden alle Vorschläge umgesetzt? Wer entscheidet
  das? Vielen Dank für die Frage. ‑ Es ist völlig richtig, die Ministerin hat vor
  ziemlich genau einem Jahr die Expertenkommission eingesetzt. Die haben jetzt ein
  Jahr lang gearbeitet und werden heute ihre Vorschläge für einen verbesserten Schutz
  von Frauen in der Prostitution vorlegen. Die Kommission wird heute erst einmal ihre
  Empfehlungen zu gesetzlichen Maßnahmen vorlegen, und das werden wir uns dann natürlich
  im Nachgang sehr genau anschauen. Um 14 Uhr findet dazu eine Pressekonferenz statt,
  zu der Sie natürlich sehr herzlich eingeladen sind. Dieser Pressekonferenz würde
  ich jetzt ungern vorgreifen. Können Sie etwas zum Zeitplan, zum Zeithorizont sagen?
  Zu welchem Zeitpunkt wird angestrebt, da wirklich eine Änderung zu erreichen? Es
  sind sehr konkrete Empfehlungen, die wir da heute entgegennehmen werden, und es
  geht natürlich darum, diese auch möglichst schnell umzusetzen; denn es geht hier
  um einen ganz wichtigen Bereich und den Schutz von Frauen, die in diesem Bereich
  arbeiten. Eine Organisation in Berlin hat Strafanzeige gegen den früheren Mossad-Chef
  Barnea erstattet und hat einen Haftbefehl und die Festnahme gefordert, unter anderem
  wegen Beteiligung an der Planung und Durchführung von Angriffen mit Pagern im Libanon,
  die damals auch viele Zivilisten getroffen haben. An diesem Mittwoch ist Barnea
  hier in Berlin. Herr Kornelius, was ist die Position des Kanzlers in dieser Debatte:
  Müsste man Barnea in Berlin festnehmen? Wenn ich Sie richtig verstanden habe, ist
  das eine Forderung einer Organisation. Das ist kein Haftbefehl. Genau, aber es gibt
  ja eine Debatte, ob man die Einreise hätte verhindern müssen, und da wüsste ich
  gerne, was der Kanzler dazu sagt. Der Bundeskanzler beteiligt sich nicht an dieser
  Debatte. Zu Palästina: Die Israelis verhindern den Zugang humanitärer Hilfe nach
  Gaza , während die Siedler Palästinenser angreifen. Ist die Bundesregierung diesbezüglich
  gleichgültig geworden oder tut sie etwas? Ich kann gerne dazu Stellung nehmen; denn
  in der Tat verfolgen wir die Entwicklungen in und um Gaza mit großer Sorge. Auch
  die kürzlich gezogene Bilanz des Board of Peace zu diesen Entwicklungen in Gaza
  liegt uns vor, und wir teilen sie auch. Vor dem Hintergrund der Lage der Bevölkerung
  im Gazastreifen ‑ darauf stellen Sie ja auch ab ‑, die im Zentrum und im Fokus unserer
  Bemühungen steht, würde ich das gern noch einmal einordnen: Für die Bundesregierung
  ist die Umsetzung des 20-Punkte-Plans, auf den sich Israel und die Hamas verständigt
  haben, vordringlich; denn das bietet eine greifbare Chance, das Leiden im Gazastreifen
  endlich zu beenden. Dieser 20-Punkte-Plan sieht verschiedene Schritte vor, die von
  den beiden Parteien, die sich darauf verständigt haben, umzusetzen sind. Wir reden
  hier nicht über abstrakte politisch formulierte Ziele, sondern es geht jetzt ganz
  konkret um die Versorgung von über einer Million Menschen mit Nahrungsmitteln, Wasser,
  Medizin und grundlegender Infrastruktur ‑ all das, was fehlt und was in Phase eins
  dieses 20-Punkte-Plans vereinbart war ‑ umzusetzen. Aktuell besorgt uns unter anderem
  die Tatsache, dass dort vor allem infolge der Überschwemmungen, die es im Gazastreifen
  gab, vermehrt Atemwegs- und Infektionserkrankungen auftreten. Daher ist es aus unserer
  Sicht jetzt entscheidend, dass die Zivilbevölkerung ausreichend Zugang zu humanitären
  Hilfsgütern erhält und diese in den Gazastreifen gelangen. Dazu hatten wir hier
  in der Vergangenheit auch öfter gesprochen. Es geht dabei unter anderem um einen
  Scanner, der jetzt am Grenzübergang Erez eingesetzt wird. Zugleich hören wir von
  Hilfsorganisationen, dass das Ganze wenig effizient ist, wenn dieser Übergang nicht
  gleichzeitig geöffnet wird. Denn im nördlichen Gazastreifen ist ja die Unterversorgung
  mit humanitären Hilfsgütern besonders dramatisch. Das ist unser Ziel. Das benennt
  auch der Bericht des Board of Peace ganz deutlich. Es ist jetzt aus unserer Sicht
  an allen Seiten sicherzustellen, dass die Verpflichtungen dieses Friedensplans konsequent
  umgesetzt werden. Ich hatte den Scanner ja schon erwähnt. Dieser dient natürlich
  auch der Sicherheit Israels. Wir haben immer wieder die Diskussion über Güter, die
  eben auch einem anderen Zweck als humanitärer Versorgung dienen können. Gerade wenn
  Lkws gescannt werden, ist sichergestellt, dass diese Hilfsgüter auch entsprechend
  eingesetzt werden und sie der Bevölkerung und nicht der Hamas zugutekommen. Denn
  das ist der andere Teil der Medaille, dass sich die Hamas nach wie vor nicht entwaffnet
  hat. Aber wir betrachten diese beiden Dinge getrennt voneinander. Wir stehen selbstverständlich
  mit der israelischen Seite in Kontakt. Denn nicht nur wir teilen diese Einschätzungen
  des Berichts des Board of Peace, wir teilen sie in unseren Gesprächen mit der israelischen
  Seite natürlich auch mit. Herr Hinterseher, hat die Bundesregierung Kenntnis davon,
  dass Israel die gelbe Linie verschiebt, die den Lebensraum der Palästinenser in
  Gaza sozusagen weiter einengt ‑ und wenn ja, in welchem Ausmaß? Ich kann versuchen
  in Erfahrung zu bringen, ob es dazu eine neue Entwicklung gibt. Ich glaube, auch
  darüber haben wir oft gesprochen. Es ist eine temporäre Linie. Das ist auch das,
  was der 20-Punkte-Plan vorsieht. Es kann hier nur um eine temporäre Situation gehen.
  Grundsätzlich arbeiten wir in Umsetzung des 20-Punkte-Plans daran, dass der Gazastreifen
  wieder aufgebaut wird, und zwar für die Bevölkerung des Gazastreifens, für die Palästinenserinnen
  und Palästinenser, die dort leben. Wie beurteilt die Bundesregierung nach wie vor
  andauernde Angriffe der israelischen Armee, unter anderem auf das größte ‑ ich glaube,
  inzwischen einzige ‑ Krankenhaus in Gaza? Ich kann mich im Einzelfall nicht äußern.
  Ich kann jetzt keinen Rekurs auf Details nehmen. Wir kennen nicht die vollständigen
  Umstände. Aber ich möchte dazu sehr klar sagen, dass Israel natürlich weiterhin
  verpflichtet ist, in seinem Vorgehen das humanitäre Völkerrecht einzuhalten. Grundsätzlich
  gibt es einen Waffenstillstand, der, wie wir sehen, immer wieder brüchig ist. Es
  gilt, dass dieser Waffenstillstand auch durchgesetzt oder eingehalten wird. Wir
  fordern grundsätzlich ein, dass beide Seiten konsequent ihren Verpflichtungen aus
  dem geschlossenen 20-Punkte-Plan nachkommen. Wenn es um Pflichten geht, dann geht
  es vor allem um die Pflicht, die Zivilbevölkerung zu schützen und die zivile Infrastruktur
  entsprechend den Vorgaben des Völkerrechts zu schonen. Weil wir ja gerade über den
  Zugang zu humanitären Hilfsgütern und die Schwierigkeit sprachen, den Wiederaufbau
  voranzubringen: Es ist besonders wichtig, die noch vorhandene und funktionsfähige
  Infrastruktur ‑ dazu gehören gerade Krankenhäuser ‑ auch entsprechend den Vorgaben
  des Völkerrechts zu schonen. Das Prinzip der Verhältnismäßigkeit ‑ das haben wir
  hier auch schon oft diskutiert ‑ greift hier. Gerade weil es eben in dem von Ihnen
  angesprochenen Fall um ein Krankenhaus geht, das einen sehr großen Teil der palästinensischen
  Bevölkerung noch mit einer Basisgesundheitsversorgung versorgt, müssen solche Angriffe
  besonders sorgfältig abgewogen und die zivile Infrastruktur geschützt werden. Das
  sind die Vorgaben, und das ist unsere Haltung zu dem Thema. Es geht um das Urteil
  des EGMR zu Pushbacks . Dazu eine Frage ans AA oder ans BMI: Wie bewerten Sie das
  Urteil? Welche Auswirkungen hat das für die Überlegungen der Bundesregierung? Wir
  haben das Urteil zur Kenntnis genommen und sehen aktuell noch keine konkreten Auswirkungen
  auf das Grenzregime bei uns. Ich weiß nicht, ob das AA dazu ergänzen möchte. Interessant
  ist ja auch, dass der EGMR auch besonders schutzbedürftige Gruppen definiert hat.
  Ändert das irgendetwas an der bisherigen Lage? Nein, das ist ja auch gängiges Recht.
  Besonders schutzbedürftige, vulnerable Gruppen werden anders behandelt. Das ist
  keine Neuigkeit. Meine Frage geht an das BMAS. Es gibt aus dem politischen Raum
  Kritik an Weiterbildungsangeboten der Bundesagentur für Arbeit , insbesondere dass
  diese nicht effizient seien. Insbesondere wird angemerkt oder kritisiert, dass eine
  Monitoringvereinbarung über die Effizienz dieser Angebote, die im Koalitionsvertrag
  festgelegt worden sei, seitens Ihres Ministeriums noch nicht umgesetzt sei. Ist
  es so? Wenn ja, warum ist es so, und wann ist mit einer Umsetzung, einem Monitoring
  zu rechnen? Tatsächlich ging es die Tage durch die Medien. Wir haben es natürlich
  auch verfolgt. CDU-Haushälter Herr Bury hat sich heute auch dazu geäußert. Auch
  da hat es Gespräche gegeben, aber auch vor dem Hintergrund, dass wir tatsächlich
  konkret dran sind, die Beschlüsse vom 1. Juli gerade vorzubereiten bzw. umzusetzen.
  Wir befinden uns in Gesprächen. Wie am 1. Juli oder sogar schon im Koalitionsvertrag
  beschlossen, starten wir im neuen Jahr damit, uns sämtliche Maßnahmen anzuschauen.
  Wenn sämtliche Maßnahmen angeschaut und bewertet werden, was ist das Ziel eines
  Reports, der dann auch öffentlich nachvollziehbar ist, zeitlich? Meines Wissens
  wurde der Prozess gestartet. Ob jetzt Eckpunkte gesetzt wurden ‑ ‑ ‑ So tief bin
  ich im Gespräch nicht drin gewesen. Dazu habe ich leider hier an der Stelle keine
  Antwort. Bekommen wir von der Bundesregierung noch einen Kommentar dazu, dass der
  NVIDIA-Chef wieder zurück ist? Herr Kornelius vielleicht? NVIDIA ist ja ein Vertragspartner
  der Bundesregierung. Aber die Bundesregierung kommentiert die Vorgänge in den USA
  nicht. Aber trotzdem, wie gesagt, wurde vor ein paar Wochen diese Vereinbarung unterzeichnet.
  Hat der Bundeskanzler dem NVIDIA-Chef jetzt schon gratuliert? Der Bundeskanzler
  hat sich um andere Angelegenheiten gekümmert. Die Bundesregierung geht davon aus,
  dass die Firma NVIDIA vertragstreu ist. An das BMI: Es wurden ja heute sehr junge
  Menschen von der Bundesanwaltschaft festgenommen . Sie hat gegen einen 14- und einen
  15-Jährigen wegen des Vorwurfs der Mitgliedschaft in einer terroristischen Vereinigungen
  Festnahmen ergehen lassen. Dabei geht es um die Internetgruppe Terror 18 . Vielleicht
  können Sie uns einmal eine Einschätzung geben, wie das BMI die Gefährdung durch
  diese Gruppe einstuft. Das ist ja schon vor ein paar Wochen aufgedeckt worden. Wir
  haben das natürlich auch beobachtet. Ich muss Sie dazu leider an die Ermittlungen
  des Generalbundesanwalts verweisen. Er hat heute dazu auch eine Pressemitteilung
  veröffentlicht. Das ist das, worauf ich Sie hinweisen möchte.'
