title: Bundeskanzler Merz reist vom 29. bis 30. November nach Rom
text: Am Morgen des 30. November empfängt Papst Leo XIV. den Bundeskanzler zu einer
  Privataudienz im Vatikan. Im Anschluss ist ein kurzes Pressestatement des Bundeskanzlers
  geplant. Am Mittag wird er von der italienischen Ministerpräsidentin Georgia Meloni
  am Regierungssitz im Palazzo Chigi mit militärischen Ehren empfangen. Bei dem anschließenden
  Gespräch werden bilaterale, außen- und europapolitische Themen im Vordergrund stehen.
  Gegen 14 Uhr ist eine gemeinsame Pressekonferenz vorgesehen.
