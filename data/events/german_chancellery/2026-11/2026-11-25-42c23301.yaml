title: Rede des Bundeskanzlers bei der Generaldebatte zum Bundeshaushalt Wir können
  „e in freies, ein gerechtes und ein soziales Land “ bleiben
text: '„Deutschland hat sich die nötigen Ausgaben für eine der Kernaufgaben des Staates
  lange gespart, nämlich die Gewährleistung der äußeren Sicherheit“ , so Bundeskanzler
  Merz. „Wir sind als Land geopolitisch, technologisch und demografisch in einer schwierigen
  Lage“, sagte der Bundeskanzler zu Beginn seiner Rede zum Bundeshaushalt im Deutschen
  Bundestag. Dennoch sei es gelungen, einen Haushalt aufzustellen, der die Sorgen
  berücksichtige, „ die viele Menschen in unserem Land haben“ . Der Kanzler verwies
  aber auch darauf, dass in den kommenden Jahren die finanziellen Spielräume eingeschränkter
  sein werden. Daher sei es für ihn zentral, künftige Haushalte so aufzustellen, dass
  „ auch die nächsten Generationen die finanziellen Möglichkeiten und Freiheiten haben,
  ihre Zukunft zu gestalten “. Der Bundeskanzler benannte vor allem vier Bereiche
  – Verteidigung, Infrastruktur, demografischer Wandel und Wirtschaft – bei denen
  „allzu lang Fundamentales vernachlässigt“ worden sei. Um Versäumtes nachzuholen,
  hätten Einnahmen und erlaubte Schulden nicht gereicht. Daher mussten Sonderschulden
  aufgenommen werden. „Deutschland hat sich die nötigen Ausgaben für eine der Kernaufgaben
  des Staates lange gespart, nämlich die Gewährleistung der äußeren Sicherheit“, so
  Merz. Angesichts konkreter Bedrohungen habe diese Bundesregierung dafür gesorgt,
  dass Deutschland heute wehrhafter sei als es jemals in den letzten Jahrzehnten war.
  Mit der Unterstützung der Ukraine – so die feste Überzeugung des Bundeskanzlers
  – „unterstützen und schützen wir uns auch selbst“. Denn es gehe auch um unsere Freiheit.
  Europa müsse Russland Grenzen aufzeigen. Dazu sei man gemeinsam entschlossen, wie
  das Treffen der „Koalition der Willigen“ in der vergangenen Woche erneut gezeigt
  hat. Mit dem Sondervermögen für Infrastruktur und Klimaneutralität steht jetzt Geld
  zur Verfügung. „Und die gesetzgeberische Begleitung, das schnell investiert und
  gebaut werden kann, haben wir geschaffen“, sagte der Bundeskanzler. Als Beispiel
  verwies er auf den Bau-Turbo und das Infrastruktur-Zukunftsgesetz . Allzu lange
  habe man sich geweigert, die notwendigen Schlussfolgerungen aus der demografischen
  Entwicklung zu ziehen. Auch hier habe die Bundesregierung umgesteuert. Das Ziel:
  Eine Reform der sozialen Sicherungssysteme , „und zwar so, dass sie verlässlich
  und zugleich bezahlbar bleiben“. Zur Rente verwies Bundeskanzler Merz darauf, dass
  mit Anreizen für längeres Arbeiten im Alter, durch eine Korrektur bei der abschlagsfreien
  Frühverrentung und die Nutzung des Kapitalmarkts das Rentenniveau mittelfristig
  steigen und die Beiträge sinken könnten. Unternehmerisches Tun sei zu teuer geworden,
  Innovationspotenziale seien liegengeblieben. Das ändere diese Bundesregierung durch
  Steuersenkungen , Senkung der Energiekosten, Senkung der Bürokratiekosten und Senkung
  der Arbeitskosten durch die Stabilisierung der sozialen Sicherungssysteme. Zudem
  fördere die Bundesregierung mit einer klugen Technologiepolitik den Strukturwandel
  in der Wirtschaft. Es tue sich viel bei den neuen Technologien, auf dem Weg zur
  industriellen KI , in der Verteidigungs- und in der Medizintechnik, im Weltraum,
  in klimaneutraler Produktion und Mobilität, auf vielen Feldern der Forschung und
  der Innovation und auch bei der Umsetzung von Geschäftsideen und Gründungen. All
  das sei zu sehen und „ ist für mich einer der vielen Gründe für Zuversicht in diesen
  Monaten“ , so Merz. Probleme, die über Jahrzehnte angewachsen seien, ließen sich
  „auch nicht mit ein oder zwei Haushalten lösen", so Merz. „Aber wir haben begonnen,
  umzusteuern.“ Er verweist auf die positive Entwicklung der Konjunkturprognosen und
  der Exportzahlen, den Anstieg der Unternehmensgründungen und die Innovationskraft
  unserer Wirtschaft.'
