title: 'Kabinett beschließt Sonntagsöffnung von Bibliotheken – Staatsminister Weimer:
  „Wir schaffen mehr Zeit für Bildung, Begegnung und kulturelle Teilhabe“'
text: 'Das Kabinett hat heute ein Arbeitsrechtspaket beschlossen, das den öffentlichen
  Bibliotheken künftig die Öffnung an Sonn- und Feiertagen ermöglichen soll. Damit
  werden die Beschlüsse des Koalitionsausschusses vom 1. Juli 2026 umgesetzt, die
  die Sonntagsöffnung öffentlicher Bibliotheken vorsehen. Bibliotheken werden damit
  anderen Kulturorten wie Museen und Theatern gleichgestellt. Familien, Berufstätige
  sowie Schülerinnen und Schüler können künftig auch sonntags in öffentlichen Bibliotheken
  lesen, lernen und sich treffen. Öffentliche Bibliotheken sind heute weit mehr als
  eine bloße Ausleihe von Büchern. Sie sind Orte der Bildung und der Kultur, sie bieten
  Raum für Austausch, gemeinsames Lernen und gesellschaftliches Miteinander. Dazu
  erklärt Staatsminister Weimer: „Kultur muss dann zugänglich sein, wenn Menschen
  auch Zeit dafür haben. Genau deshalb ist die Sonntagsöffnung öffentlicher Bibliotheken
  ein wichtiger Schritt. Sie schafft mehr Möglichkeiten für alle, die unter der Woche
  Kultur und Bildung schwer in Anspruch nehmen können. In die Bibliothek zu gehen,
  Zeit zum Lesen, Lernen oder zum Austausch wird einfacher, wenn die Türen auch am
  Sonntag offenstehen. Wir verbessern mit diesem Schritt ganz konkret den Alltag der
  Menschen. Und wir stärken Bibliotheken als Orte, an denen Wissen, Kultur und Gemeinschaft
  für alle zugänglich sind.“ Der Beauftragte der Bundesregierung für Kultur und Medien
  hat sich intensiv für diese weitgehende Gleichstellung mit anderen Kulturguteinrichtungen
  eingesetzt. Die geplante Neuregelung setzt gleichzeitig eine Vereinbarung des Koalitionsvertrages
  von 2025 um. Öffentliche Bibliotheken als sogenannte „Dritte Orte“ werden gestärkt
  und können so ihrer gewandelten Rolle noch besser und zum Nutzen der Öffentlichkeit
  gerecht werden. Bibliotheken können künftig entsprechend den konkreten Gegebenheiten
  vor Ort darüber entscheiden, wie sie die neuen Möglichkeiten und Spielräume nutzen.'
