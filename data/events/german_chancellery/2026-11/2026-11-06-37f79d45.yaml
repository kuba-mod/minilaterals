title: Bundeskanzler Merz nimmt am Treffen der Europäischen Politischen Gemeinschaft
  (EPG) in Dublin teil
text: Bundeskanzler Friedrich Merz wird am 12. November am Treffen der Europäischen
  Politischen Gemeinschaft (EPG) in Dublin teilnehmen. Der irische Taoiseach Martin
  und der Präsident des Europäischen Rats, Costa, haben die Staats- und Regierungschefs
  der 47 teilnehmenden europäischen Staaten eingeladen. Auch der kanadische Premier
  Carney wird wieder an den Beratungen teilnehmen. Eingeladen sind außerdem die Spitzen
  von Europäischer Kommission, Europäischem Parlament und die Hohe Vertreterin sowie
  die Generalsekretäre des Europarats, der NATO und der OSZE. Ziel ist es, durch den
  regelmäßigen informellen Austausch den politischen Dialog und die politische Zusammenarbeit
  zu fördern, um Sicherheit und Wohlstand in Europa zu stärken.
