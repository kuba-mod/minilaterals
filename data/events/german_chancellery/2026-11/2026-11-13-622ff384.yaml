title: Bundeskanzler Merz empfängt den Emir von Katar, Scheich Tamim bin Hamad Al
  Thani
text: Bundeskanzler Friedrich Merz wird am Freitag, den 20. November 2026 um 14 Uhr
  den Emir von Katar, Scheich Tamim bin Hamad Al Thani, im Kanzleramt empfangen. Im
  Mittelpunkt der Gespräche zwischen Bundeskanzler Merz und dem Emir von Katar werden
  voraussichtlich die bilateralen Beziehungen, das gemeinsame Engagement für nachhaltige
  Stabilität im Mittleren Osten und wirtschaftliche Aspekte stehen.
