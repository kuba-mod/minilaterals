date: '2026-11-04'
type: press_release
source_name: german_chancellery
title: Rede des Bundeskanzlers bei der Wirtschaftskonferenz des Wirtschaftsforums
  der SPD Wirtschaft wächst, trotz Herausforderungen
text: 'Kanzler Merz betonte, dass der Bürokratierückbau besser vorankomme, als es
  wahrgenommen werde. Bundeskanzler Friedrich Merz hat bei der Wirtschaftskonferenz
  des Wirtschaftsforums der SPD eine Rede gehalten und über die wirtschaftliche Entwicklung
  Deutschlands gesprochen: Die Wachstumsprognosen für 2026 und 2027 hätten sich zuletzt
  verbessert. Für 2026 werde inzwischen ein Wirtschaftswachstum von 1,3 Prozent erwartet.
  Einen selbst tragenden Aufschwung habe es damit jedoch noch nicht ausgelöst, betonte
  der Kanzler. „Mit diesem Investitionssofortprogramm, mit Investitionen in Infrastruktur,
  Klimaneutralität und Verteidigung, mit Entlastungen auch bei den Energiepreisen,
  mit dem Bürokratierückbau und mit der Staatsmodernisierung, die wir begonnen haben,
  haben wir eben dazu beigetragen, dass das eintritt, was wir im Jahr 2026 bisher
  sehen“, sagte der Kanzler. Auf der Wirtschaftskonferenz des Wirtschaftsforums der
  SPD sind Teilnehmerinnen und Teilnehmer aus Politik und Wirtschaft in Berlin zusammengekommen.
  Zu den Rednern gehörten neben dem Bundeskanzler unter anderem auch Vizekanzler und
  Bundesfinanzminister Lars Klingbeil und die Bundesministerin für wirtschaftliche
  Zusammenarbeit und Entwicklung Reem Alabali Radovan. Vielen Dank für die nette Begrüßung!
  Herzlichen Dank, dass ich hier sein darf! Vielen Dank, liebe Frau Zenke, für die
  Einladung, die Sie mir beim parlamentarischen Abend der Netzwerker mitgegeben haben.
  – Nein, es waren nicht die Netzwerker, es waren die Seeheimer. Ich weiß, Sie legen
  viel Wert auf diese Unterscheidung. – Ich freue mich, dass ich den einen oder anderen
  Kollegen bzw. die eine oder andere Kollegin hier sehe. Herzlichen Dank, Herr Wieprecht,
  für die freundliche Begrüßung. Ich freue mich, dass wir die Gelegenheit haben, heute
  miteinander über ein Thema zu sprechen, das bei der Wirtschaftskonferenz des Wirtschaftsforums
  der SPD heute schon den ganzen Tag Thema war. Ich möchte damit beginnen, meine Damen
  und Herren, dass ich ein Lob für die Zusammenarbeit mit der SPD in der Koalition
  ausspreche. Wir haben in dieser Koalition in den fast auf den Tag genau 18 Monaten,
  die wir jetzt zusammenarbeiten, mehr erreicht, als mancher in der Bevölkerung draußen
  wahrnimmt oder wahrnehmen will. Deswegen danke an die Kolleginnen und Kollegen der
  SPD für die Zusammenarbeit in der Bundesregierung. Wir haben ein gemeinsames Ziel,
  das wir im Koalitionsvertrag so aufgeschrieben haben, nämlich Verantwortung für
  Deutschland in außergewöhnlich herausfordernden, schwierigen Zeiten wahrzunehmen.
  Meine Damen und Herren, wir wollen zeigen, dass wir in dieser Koalition aus der
  Mitte der Gesellschaft heraus Politik für die Bürgerinnen und Bürger unseres Landes
  machen können, dass wir Probleme lösen können, dass wir gute Wege finden können,
  auch wenn kein Einzelner vollständig mit allem einverstanden sein wird. Das ist
  aber normal in einer Koalition; das gilt für die sozialdemokratischen Kolleginnen
  und Kollegen, und das gilt auch für mich. Wir sind Koalitionspartner mit unterschiedlichen
  Vorstellungen, aber doch mit einer gemeinsamen Verantwortung. Wir wollen, indem
  wir ernsthaft an der Sache arbeiten, unser Land voranbringen und vor allem dafür
  sorgen, dass die Unzufriedenheit im Land gemildert wird, die den politischen Rändern
  im Augenblick so viel Auftrieb gibt. Das ist unsere gemeinsame Verantwortung. Wo
  stehen wir heute? Die deutsche Wirtschaft ist zuletzt – das haben Sie heute im Laufe
  des Tages vermutlich schon das ein oder andere Mal gehört ‑ den gewaltigen Herausforderungen
  zum Trotz merklich gewachsen. Zu Beginn sollten die Wachstumsraten im Jahr 2026
  noch bei rund einem Prozent liegen; jetzt liegen wir bei 1,3 Prozent. Für das Jahr
  2027 sind die Wachstumsprognosen ebenfalls nach oben korrigiert worden, auch wenn
  sie leicht unter denen des Jahres 2026 liegen. Wir werden in diesem Jahr also wahrscheinlich
  ein höheres Wirtschaftswachstum erreichen als im Jahr 2027. Das hängt ganz einfach
  damit zusammen, dass wir uns durch die hohen Investitionen, die wir mit Krediten
  finanzieren, ein Wachstum kaufen. Allein damit haben wir noch keinen selbsttragenden
  Aufschwung ausgelöst. Das müssen wir also noch leisten. Das alles kommt aber nicht
  aus dem Nichts. Mit diesem Investitionssofortprogramm, mit Investitionen in Infrastruktur,
  Klimaneutralität und Verteidigung, mit Entlastungen auch bei den Energiepreisen,
  mit dem Bürokratierückbau und mit der Staatsmodernisierung, die wir begonnen haben,
  haben wir eben dazu beigetragen, dass das eintritt, was wir im Jahr 2026 bisher
  sehen. Die langfristigen Wachstumsaussichten – ich habe es gesagt – sind allerdings
  auch heute noch nicht so gut, wie sie sein müssten. Das sehen wir, das müssen wir
  sehen, und daraus müssen wir die richtigen Schlussfolgerungen ziehen. Das Wachstumspotenzial
  in unserer Gesellschaft – und es ist eine alternde Gesellschaft – bleibt hinter
  den Möglichkeiten zurück. Die Produktivitätsentwicklung in Deutschland ist nicht
  so, wie sie sein sollte. „Wir werden als Gesellschaft insgesamt mehr arbeiten müssen.
  […] Die Probleme auf dem Arbeitsmarkt sind offensichtlich: hohe Teilzeitquoten,
  Anreize für frühes Ausscheiden aus dem Arbeitsmarkt, Transfersysteme, die Mehrarbeit
  teilweise sogar entwerten. Ich will, dass wir ein System schaffen, in dem sich Leistungsbereitschaft
  auszahlt. In dem es sich lohnt, mehr zu arbeiten.“ – Vielen Dank für die Zustimmung. –
  Und ich füge hinzu: Ende des Zitats. Denn das waren nicht meine Worte, sondern das
  waren die Worte, die viele von Ihnen vor einigen Wochen schon einmal gehört haben:
  Es war der Vizekanzler Lars Klingbeil, der im Frühjahr dieses Jahres in seiner Bertelsmann-Rede
  genau so gesprochen hat. Meine Damen und Herren, Ihr Beifall bestätigt mich darin
  zu sagen: Ich stimme dem ausdrücklich zu, und ich erlaube mir hinzuzufügen: Deshalb
  passen wir in der Koalition auch viel besser zusammen, als es dem einen oder anderen
  hin und wieder erscheint. Bei der Leistungs- und Generationengerechtigkeit wieder
  auf den richtigen Kurs zu kommen, sind wir, wie ich finde, gerade den heute jungen
  Generationen schuldig. Sie sollen, wie wir Älteren, in einem Land leben, in dem
  man sich durch Leistung etwas aufbauen kann, in einem Land, in dem man sich entfalten
  kann, gern eine Familie gründet und eine gute Zukunft für sich sieht. Das sind die
  Gerechtigkeitsfragen, die ich sehe, und das sind die Fragen, die uns alle etwas
  angehen. Meine Damen und Herren, wir gehen diese Fragen und diese Herausforderungen
  mit Blick auf die sozialen Sicherungssysteme an. Die Umfragen zeigen: Junge Menschen,
  aber nicht nur junge Menschen sorgen sich um die Zukunft genau dieser Systeme. Sie
  glauben nicht daran, dass das Sicherheitsversprechen auch für sie noch gilt. wenn
  sie eines Tages im Alter, bei Krankheit oder bei Pflegebedürftigkeit Hilfe brauchen.
  Wir wollen und wir müssen hier für neues Vertrauen sorgen. Denn nur ein Sozialstaat,
  der verlässlich schützt und der nachhaltig finanziert ist, wird auch von der jungen
  Generation auf Dauer mitgetragen und akzeptiert. Genau deshalb gibt es die Reformen
  in Gesundheit, Pflege und Rente. Wir wissen es genau: Unser umlagefinanziertes Rentensystem
  kommt allein aufgrund der demografischen Entwicklung massiv unter Druck. Es ist
  bereits massiv unter Druck. Die jüngere Generation sieht vor allem steigende Beitragssätze
  und ein sinkendes Rentenniveau. Auf einen Rentner kommen eben immer weniger Beitragszahler.
  Das kann diese Generation nicht als tragfähig und auch nicht als gerecht wahrnehmen.
  Die Alterssicherungskommission hat, wie Sie wissen, einen sehr guten Bericht vorgelegt,
  der uns genau den Lösungsweg aufzeichnet, den wir gehen sollten. Ich füge hinzu:
  Wir sollten die Vorschläge insgesamt in Gesetzesform bringen. Dann können wir den
  Trend von steigenden Beitragssätzen und sinkendem Rentenniveau mittelfristig sogar
  umkehren. Dann können sinkende Beiträge und ein steigendes Rentenniveau die Folge
  sein. Meine Damen und Herren, wahr ist auch: Zunächst werden höhere Beiträge für
  den Aufbau dieser Kapitalrente notwendig werden, aber mittelfristig werden sie eben
  sinken. Ich bleibe bei dem, was ich mit Bärbel Bas nach Veröffentlichung der Vorschläge
  gesagt habe – erst sie, dann ich –: Das Ganze ist ein ausgewogenes und gut durchdachtes
  Gesamtkonzept, und wir sollten es so auch umsetzen. Aber auch das ist klar: Im Gerüst
  der Vorschläge der Kommission gibt es genug Spielraum, um Details, Übergangsfristen
  und Härtefallregelungen nicht nur zu diskutieren, sondern auch zu implementieren.
  Zentrale Elemente wie das Ende Frühverrentung müssen aber Teil des Gesamtpakets
  bleiben. Schließlich: Die Kapitalrente macht die Rente nicht nur stabiler, sie macht
  sie auch gerechter. Wir wollen, dass alle von den Renditechancen des Kapitalmarkts
  profitieren können, also auch die Arbeitnehmerinnen und Arbeitnehmer innerhalb der
  gesetzlichen Rentenversicherung. Genau das ist doch eigentlich die geniale Idee
  der Kommission: Eben nicht in der zweiten oder in der dritten Säule, sondern in
  der ersten Säule der Alterssicherung ein individualisiertes Kapitalelement einzufügen,
  das dort dafür sorgt, dass mit wenig Bürokratie alle sozialversicherungspflichtigen
  Arbeitnehmerinnen und Arbeitnehmer in Deutschland eine eigenständige kapitalbasierte
  Altersversorgung aufbauen können. Es bleibt weiter notwendig, auch privat für das
  Alter vorzusorgen. Deshalb verbessern wir gemeinsam auch die private Altersvorsorge
  und führen für die Jungen als Starthilfe die Frühstartrente ein – in erster Lesung
  im Deutschen Bundestag bereits beraten. Beides wird, wie Sie wissen, ab dem Jahr
  2027 zur Verfügung stehen – das eine bereits ab dem 1. Januar, das andere mit dem
  Schuljahrsbeginn zur Mitte des Jahres. Meine Damen und Herren, zusammen mit dem,
  was wir bereits beschlossen haben ‑ ich nenne noch einmal die Stichworte: Aktivrente,
  Frühstartrente und Altersvorsorgedepot –, leiten wir einen Paradigmenwechsel in
  der Vermögensbildung in Deutschland ein. Ich will an dieser Stelle ausdrücklich
  noch einmal sagen: Herzlichen Dank an die Kolleginnen und Kollegen der SPD -Bundestagsfraktion
  und der Sozialdemokratischen Partei Deutschlands. Es war immer meine Überzeugung,
  dass das richtig ist. Es war immer meine Überzeugung – ich sage es aus der Sicht
  meiner Partei und der christlichen Soziallehre –, dass eine ausreichende Beteiligung
  von Arbeitnehmerinnen und Arbeitnehmern am Produktivkapital unserer Volkswirtschaft
  das letzte nicht eingelöste Versprechen der marktwirtschaftlichen Ordnung war. Wir
  lösen dieses Versprechen mit den Elementen, die ich beschrieben habe, jetzt ein.
  Wir können damit auch einen Beitrag zur Steigerung der Produktivität leisten. Wir
  können damit in Deutschland einen breiten und tiefen Kapitalmarkt schaffen, der
  es jüngeren Unternehmen – Start-ups, Scale-ups – in der Wachstumsphase ermöglicht,
  den Kapitalmarkt in Deutschland und in Europa so in Anspruch zu nehmen, dass sie
  nicht mehr nach Amerika ausweichen müssen, sondern in Europa bleiben können. Das
  sind zwei Seiten derselben Medaille. Danke, dass wir diesen Weg gemeinsam gehen!
  Meine Damen und Herren, wir haben aus gutem Grund verabredet, dass wir auch Möglichkeiten
  im Arbeitsrecht und im Arbeitsmarkt schaffen, um die Produktivität zu erhöhen. Ich
  nenne nur die Ausweitung der sachgrundlosen Befristung und auch die Änderung des
  Kündigungsschutzrechtes für obere Einkommen. Beides ist bereits im Gesetzgebungsverfahren
  in der Frühkoordinierung und wird demnächst auch im Kabinett beschlossen und dann
  auf den parlamentarischen Weg gehen. Ich will es in diesem Zusammenhang noch einmal
  sagen: Wir kommen auch beim Bürokratierückbau besser voran, als es oft wahrgenommen
  wird. Wir haben mit den Ländern eine föderale Modernisierungs- und Digitalisierungsagenda
  beschlossen, die alles in den Schatten stellt, was wir zwischen Bund und Ländern
  in diesem Bereich jemals verabredet haben. Wir sind in der Umsetzung, und wir haben
  mit der Digitalisierungs- und Modernisierungsagenda des Bundes auch hier wirklich
  große Fortschritte erzielt. Ich zitiere nur Julia Jäkel, die vor wenigen Wochen
  gesagt hat: Wir erleben zurzeit die größte Modernisierungsagenda in Deutschland,
  die wir jemals gesehen haben. Ich glaube, es gibt Grund zur Zuversicht; denn wir
  haben nicht nur Mittel zur Verfügung gestellt, sondern wir haben mit dem Infrastrukturzukunftsgesetz
  auch Genehmigungen von Prozessen beschleunigt, bis hin zu den Umsetzungsprozessen.
  Wir werden ein Berichtsentlastungsgesetz hinzufügen, das Unternehmen noch einmal
  spürbar von Bürokratie entlasten wird. Das alles wird einzahlen auf mehr wirtschaftliche
  Dynamik und damit auf mehr soziale Sicherheit in unserem Land. Abschließend – damit
  wir noch genügend Zeit haben für die Diskussion –: Meine Damen und Herren, unser
  Land befindet sich in einer Umbruchphase; wir befinden uns in einer tiefgreifenden
  Transformation. Unser Land wird aber von außen auch als eines der Länder auf der
  Welt angesehen, in denen es sich am meisten zu investieren lohnt. Wir haben vor
  zwei Wochen hier in Berlin zum ersten Mal überhaupt in der Geschichte unseres Landes
  einen Investitionsgipfel durchgeführt, auf dem über 200 Teilnehmer aus der ganzen
  Welt mit uns darüber diskutiert haben, wie und wo man in Deutschland gut investieren
  kann. Wir haben uns bei dieser Gelegenheit als Bundesregierung gut präsentiert.
  Wir standen alle zusammen auf der Bühne – die verantwortlichen Ressorts aus der
  gesamten Bundesregierung, A und B. Eine Woche später habe ich auf meiner anschließenden
  Reise sowohl in Singapur als auch in Tokyo und in Seoul gehört, wie gut das hier
  in Deutschland gelaufen sei. Nehmen wir also ein bisschen von dem Bild mit, das
  andere von uns haben. Seien wir selbst mit unserem Land wenigstens halb so zuversichtlich,
  wie es andere sind, die nach Deutschland kommen, um hier zu investieren. Wenn wir
  diesen Weg gemeinsam gehen, dann wird es nicht nur aus der Verantwortung für Deutschland
  der richtige Weg sein. Es wird dann auch der Weg sein, der uns auf einen stabilen,
  sich selbst tragenden Wachstumspfad zurückführt, und es wird auch der richtige Weg
  sein, um zu zeigen, dass aus der politischen Mitte heraus in unserem Land Probleme
  nicht nur wortreich beschrieben, sondern auch gemeinsam gelöst werden können. Dann
  werden wir den radikalen Rändern in unserem Lande zeigen, dass es sich lohnt, auch
  in der Mitte für unsere Demokratie zu kämpfen – um den Wirtschaftsstandort, aber
  vor allem auch um unsere Demokratie.'
