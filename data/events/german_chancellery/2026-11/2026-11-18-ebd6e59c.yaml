title: Im Kabinett beschlossen Arbeitsmarkt fit für die Zukunft machen
text: 'Das beschlossene Arbeitsrechtspaket soll unter anderem Unternehmen mehr Flexibilität
  ermöglichen und die Mitbestimmung der Beschäftigten schützen. Das Kabinett hat ein
  Gesetz zur Änderung bestimmter arbeitsrechtlicher Vorschriften und zum Schutz der
  Unternehmensmitbestimmung beschlossen. Mit dem Gesetz setzt die Bundesregierung
  Beschlüsse des Koalitionsausschusses vom 1. Juli 2026 um. Die Anpassungen sollen
  es Unternehmen ermöglichen, flexibler auf dem Arbeitsmarkt zu agieren und damit
  den aktuellen wirtschaftlichen Herausforderungen begegnen zu können. „Unser Ziel
  dabei ist, Arbeitsplätze in Deutschland zu halten, Neueinstellungen zu ermöglichen
  und die Weichen für zukunftsorientierte Jobs zu stellen“, erläuterte Bundesarbeitsminister
  Alexander Schweitzer das Arbeitsrechtspaket. Unter anderem sollen die Anpassungen
  es den Unternehmen erleichtern, neues Personal einzustellen. Der Kündigungsschutz
  für Menschen, die sehr gut verdienen, soll gelockert werden. Das heißt: Für Jahreseinkommen
  oberhalb der 1,75-fachen Beitragsbemessungsgrenze der gesetzlichen Rentenversicherung
  – das sind zurzeit rund 180.000 Euro – soll die gerichtliche Auflösung des Arbeitsverhältnisses
  gegen Zahlung einer Abfindung erleichtert werden. Die sachgrundlose Befristung von
  Arbeitsverträgen soll für bis zu vier Jahre statt bislang zwei Jahre möglich sein.
  In diesem Zeitraum wäre es bis zu sechsmal zulässig, den Vertrag zu verlängern –
  aktuell ist dies dreimal möglich. Die Änderungen sollen für Einstellungen bis zum
  31. Dezember 2030 gelten. Außerdem ist eine Vereinfachung der formalen Anforderungen
  an Befristungsvereinbarungen vorgesehen. Diese sollen künftig in Textform vereinbart
  werden können. Zudem soll durch verschiedene Rechtsänderungen die Mitbestimmung der
  Beschäftigten auf Unternehmensebene , insbesondere mit Blick auf die Europäischen
  Aktiengesellschaft ( SE ), besser geschützt werden. Für das Bäcker- und Konditorhandwerk
  sowie für öffentliche Bibliotheken sollen die Möglichkeiten der Sonn- und Feiertagsbeschäftigung
  erweitert werden.'
