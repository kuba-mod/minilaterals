title: 'Deutscher Kurzfilmpreis feiert 70. Jubiläum – Staatsminister Weimer: „Kurzfilm
  trendet gerade beim jungen Publikum“'
text: 'Seit 70 Jahren würdigt der Bund herausragende Leistungen bei der Produktion
  von Kurzfilmen mit der Goldenen Lola – so auch heute bei der Verleihung des Deutschen
  Kurzfilmpreises auf Kampnagel in Hamburg. Dort wurde die bedeutendste und höchstdotierte
  Auszeichnung für die kurze filmische Form in Deutschland vergeben, verbunden mit
  Prämien von insgesamt 275.000 Euro. Kulturstaatsminister Wolfram Weimer: „Die Gewinner
  des 70. Deutschen Kurzfilmpreises zeigen den Kurzfilm künstlerisch von seiner besten
  Seite. Ungewöhnliche Stoffe, Schnitte und Erzählweisen lösen in wenigen Minuten
  tiefe Emotionen aus. Genau damit macht sich der Kurzfilm in Zeiten von Streaming
  und Social Media immer beliebter. Befeuert von neuen Formaten und veränderten Sehgewohnheiten
  trendet er dort gerade vor allem beim jungen Publikum. Auch deshalb bleibt der Kurzfilm
  für die Bundesregierung ein unverzichtbarer Teil der deutschen Filmlandschaft.“
  Von 239 eingereichten Vorschlägen waren zwölf Filme für den Preis nominiert. Die
  Auszeichnung für den besten Spielfilm bis 15 Minuten Laufzeit ging an Viv Li, Julian
  Schwandner, Marc Goyens und Carlotta Cornehl für den Film YOU JIAN CHUI YAN - A
  SOIL A CULTURE A RIVER A PEOPLE. Die Auszeichnung für den besten Spielfilm von mehr
  als 15 Minuten bis 30 Minuten Laufzeit ging an Hans Broich, Emma Hütt, Tina Muffler
  und Felix Leitner für den Film BLEIFREI 95 . Für den besten Animationsfilm bis 30
  Minuten Laufzeit erhielt Yi Chen Huang den Deutschen Kurzfilmpreis für den Film
  LIQUOR . In der Kategorie Experimentalfilm bis 30 Minuten Laufzeit konnte Vika Kirchenbauer
  mit dem Film THIS SUFFOCATING NOW die Goldene Lola gewinnen. In der Kategorie Dokumentarfilm
  bis 30 Minuten Laufzeit wurde Yulia Lokshina für HOW DO YOU SPELL THIS WORD? ausgezeichnet.
  Den Preis für den besten mittellangen Film erhielt Jinhyun Kim für NO MOTHER TONGUE
  FOR EVERYONE . Die Gewinnerinnen und Gewinner der Kurzfilmpreise erhalten je eine
  Prämie von 30.000 Euro. Eine Nominierung ist mit 15.000 Euro Prämie verbunden, die
  auf die Auszeichnungsprämie angerechnet wird. Die Prämie für den mittellangen Film
  beträgt 20.000 Euro. Die Prämien sind zweckgebunden zu verwenden für die Herstellung,
  Projektentwicklung oder Projektvorbereitung eines neuen Films mit künstlerischer
  Qualität. Die Gewinnerfilme in den Kategorien Spielfilm bis 15 Minuten Laufzeit,
  Spielfilm von mehr als 15 Minuten bis 30 Minuten Laufzeit, Animationsfilm bis 30
  Minuten Laufzeit und Dokumentarfilm bis 30 Minuten Laufzeit sind zudem automatisch
  für das Auswahlverfahren zu den Oscars qualifiziert. Darüber hinaus erhalten alle
  nominierten und ausgezeichneten Filme Punkte für das Referenzfördersystem der Filmförderungsanstalt
  (FFA). Die Preisgala in der Internationalen Kulturfabrik Kampnagel wurde moderiert
  von Patrick Wellinski und in Zusammenarbeit mit der Kurzfilm Agentur Hamburg ausgerichtet.
  Auf der „KURZ.FILM.TOUR - Der Deutsche Kurzfilmpreis. Im Kino.“ werden die nominierten
  und ausgezeichneten Filme im kommenden Jahr deutschlandweit in kommunalen Kinos
  zu sehen sein. Eine Übersicht aller Auszeichnungen und Nominierungen sowie weitere
  Informationen zum Deutschen Kurzfilmpreis 2026 finden Sie hier.'
