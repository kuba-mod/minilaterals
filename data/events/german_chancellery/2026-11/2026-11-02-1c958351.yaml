date: '2026-11-02'
type: press_release
source_name: german_chancellery
title: Rede von Bundeskanzler Merz beim Digital-Gipfel 2026 „Wir müssen, wir wollen
  Spitzenreiter werden“
text: 'Merz plädierte dafür, den Weg in das Zeitalter der künstlichen Intelligenz
  „auch zum Nutzen für unsere ganze Gesellschaft“ zu gehen. Für Bundeskanzler Friedrich
  Merz ist es von großer Bedeutung, dass die Regeln und Agenda zu Künstlicher Intelligenz
  von Menschen gesetzt werden, „und das im Einklang mit genau unseren Werten“. In
  seiner Rede beim Digital-Gipfel 2026 in Berlin hob er hervor, dass im „Zentrum unserer
  Bemühungen nicht eine Technologie steht, sondern der Mensch“. Die hohe Geschwindigkeit
  der technologischen Entwicklung stelle die Politik vor enorme Herausforderungen.
  Wenn Institutionen oft behäbig wirkten, sei dies kein Zeichen von Handlungsunfähigkeit,
  sondern Ausdruck eines bewussten Prozesses, bei dem menschliche Bedürfnisse und
  gesellschaftliche Grundkonstanten den Takt vorgäben. Zugleich sei es wichtig, mit
  Blick auf KI in Deutschland und Europa schneller, besser und wettbewerbsfähiger
  zu werden. (Die Protokollierung des fremdsprachlichen Teils erfolgte anhand der
  Simultandolmetschung.) Liebe Kolleginnen und Kollegen aus unseren europäischen Nachbarstaaten
  und von der Europäischen Kommission! ( auf Englisch ) Sehr geehrter Minister Solomon
  aus Kanada, willkommen in Berlin. Sie sind den ganzen Weg aus Kanada gekommen. Vielen
  Dank für Ihre enge Zusammenarbeit und meine Grüße an Ihren Premierminister! Er ist
  ein großer Freund von mir. Es ist eine große Freude, dass Sie hier sind, und eine
  große Freude, mit Ihrem Land zusammenzuarbeiten. Ganz herzlichen Dank dafür. ( auf
  Deutsch ) Liebe Kolleginnen und Kollegen aus der Bundesregierung, aus dem Deutschen
  Bundestag und aus den Ländern! Vor allem aber natürlich lieber Karsten Wildberger,
  ganz herzlichen Dank für deine freundliche Begrüßung und auch für die erneute Vorbereitung
  dieses Digitalgipfels. Herzlichen Dank für deine Arbeit und herzlichen Dank für
  die gute Zusammenarbeit in der Bundesregierung. Es macht große Freude, mit dir zu
  arbeiten. Herzlichen Dank für deine Arbeit. Sehr geehrte Vertreterinnen und Vertreter
  aus der Wirtschaft, der Wissenschaft, aus der Gesellschaft! Erneut herzlich willkommen
  zum diesjährigen Digital-Gipfel der Bundesregierung. Dieses Jahr steht der Digital-Gipfel
  ganz im Zeichen von KI . Ich weiß nicht, wie es Ihnen geht, aber ein Jahr im digitalen
  Raum wirkt auf mich zunehmend wie eine sehr lange Zeit. Sie alle verfolgen die Nachrichten,
  wie ich das auch tue, und Sie sind vermutlich alle genau wie ich regelmäßig ganz
  ungläubig angesichts dessen, was man da liest: In den USA entstehen Rechenzentren
  mit den Ausmaßen von ganzen Städten und mit vergleichbarem Energieverbrauch, Netzwerke
  von KI -Agenten haben unerkannt und offenbar unkontrolliert Unternehmens- und Regierungswebseiten
  gehackt, führende KI -Unternehmen, die erst wenige Jahre alt sind und auf den Börsengang
  hinarbeiten, werden mit mehr als einer Billion Euro bewertet, und zuletzt wurden
  auf einen Schlag Dutzende Probleme gelöst, die den besten Mathematikern der Welt
  jahrzehnte- und jahrhundertelang Rätsel aufgegeben haben. Ich könnte diese Reihe
  der Beispiele – der guten wie der schlechten – beliebig fortsetzen. Das vergangene
  Jahr fühlt sich in digitalpolitischer, in digitalwirtschaftlicher Hinsicht jedenfalls
  erneut an wie ein Lichtjahr, und folgen wir der Logik des exponentiellen Wachstums,
  die hier bestimmend zu sein scheint, ist auch das erst der Anfang. Die Jahre werden
  immer länger oder – vor lauter Energie und Ereignisreichtum – immer kürzer, je nachdem,
  wie man darauf schaut. Das Tempo der Entwicklung ist jedenfalls so rasant und die
  damit einhergehende – ja, wie soll ich das sagen? – Macht- und Ressourcenverteilung
  bzw. Macht- und Ressourcenverschiebung nimmt so gewaltige Ausmaße an, dass sich
  das alles für diejenigen, die nicht Teil Ihrer Branche sind, die nicht Teil der
  KI -Szene sind, kaum mehr nachvollziehen lässt. Inzwischen allerdings gilt das offenbar
  zunehmend auch für Menschen aus der KI -Branche selbst. Viele ihrer Vertreter und
  Beobachter äußern jedenfalls Sorgen vor einer Blasenbildung und vor unkontrollierbaren
  Risiken, und die entsprechenden Debatten werden immer lauter. Nun, meine Damen und
  Herren, es ist aus meiner Sicht daher wichtig, dass wir uns heute hier diesem Thema
  unter dem Titel „ Shaping AI: safe, sovereign, competitive “ mit der Frage stellen,
  wie wir diesen Wandel denn im Sinne unserer Werte gestalten können, unserer Werte
  in Deutschland, ganz sicherlich in Europa und vielleicht sogar auf der ganzen Welt.
  Ich will deshalb gleich zu Beginn einer verbreiteten Skepsis, einem verbreiteten
  Pessimismus mit Blick auf diese Frage begegnen. Sind wir nicht zu langsam, um diese
  Entwicklung zu gestalten? Ja, die Welt verändert sich in atemloser Geschwindigkeit,
  und die Politik agiert in alten Mustern, in alten Institutionen, mit den alten Mechanismen,
  im selben Abstimmungstempo, wie, sagen wir, vor 30 Jahren. Gesetze werden verhandelt
  und verabschiedet in einer Zeitspanne, in der drei Generationen von neuen KI -Modellen
  entwickelt werden. Wie soll das funktionieren? Ist das Gefühl vielleicht sogar berechtigt,
  dass die Politik im Sturm der technologischen Transformation gar nicht mehr mitkommt
  und dabei ist, ihre Handlungsfähigkeit zu verlieren? Meine Antwort darauf, meine
  Damen und Herren, ist ein doppeltes und entschiedenes Ja und Nein. Erstens: Ja,
  unsere Institutionen wirken oft behäbig und ihre Mühlen mahlen langsam. Aber einer
  der Gründe dafür ist, und das ist ein sehr guter Grund, dass im Zentrum unserer
  Bemühungen nicht eine Technologie steht, sondern der Mensch. Menschliche Meinungsverschiedenheiten,
  menschliches Wirtschaften, menschliche Bildung und Entwicklung, menschliche Bedürfnisse,
  Wahrheitssuche, Tag und Nacht, Sonn- und Feiertage, Krankheit und Tod, alles dies
  sind Grundkonstanten unserer Existenz, und sie spielen eine Rolle, ja, die bestimmende
  Rolle für uns in der Politik. Der Takt unserer Institution ist deshalb auch der
  Takt des menschlichen Lebens, des Lebens in unserem Land. Deshalb, zweitens: Nein,
  dieser Kontrast zwischen der Geschwindigkeit der Technik und der Geschwindigkeit
  unserer Institution spricht nicht grundsätzlich gegen die Institutionen. Vielmehr
  gilt auch hier für die technologische Entwicklung: Wir wollen die neue Technik in
  die Grundstrukturen unseres Miteinanders einfügen. Das ist der Anspruch, den wir
  auch an uns selbst stellen. Dreh- und Angelpunkt unserer Institutionen, ihres Arbeitens
  und ihres Wirkens ist und bleibt eben der Mensch. In seiner unantastbaren Würde
  bleibt unser aller Miteinander im eigenen menschlichen Takt. Drittens noch einmal
  ein Ja: Wir können und ich finde wir müssen in Deutschland und in Europa viel schneller
  und besser darin werden, digitale Technologien zu entwickeln und sie auch wirklich
  zu nutzen. Wir müssen wettbewerbsfähiger werden. Wir müssen, wir wollen Spitzenreiter
  werden. Nur dann können wir unseren Gestaltungsanspruch auch souverän geltend machen.
  Nur dann können wir dafür sorgen, dass der digitale Wandel ebendie Konturen annimmt,
  die wir uns in Deutschland und in Europa gemeinsam wünschen. Das, meine Damen und
  Herren, erfordert eine enorme technologische und organisatorische Anstrengung, eine
  tiefgreifende Modernisierung unseres Staates und unserer Wirtschaft. Schließlich
  viertens noch einmal ein Nein: Wir sind angesichts dieser Aufgabe keineswegs handlungsunfähig.
  Meine Damen und Herren, genau darum ging es beim Souveränitätsgipfel vergangenes
  Jahr, und genau darum geht es auch in diesem Jahr beim Digitalgipfel hier: Wo stehen
  wir und was tun wir, um unsere strategische Handlungsfähigkeit und damit unsere
  Gestaltungsmöglichkeiten im rasanten technologischen Wandel zu erhöhen? Unser Ziel
  ist dabei sehr klar, gerade angesichts zunehmender geopolitischer Spannungen: Wir
  wollen in der Entwicklung und Nutzung digitaler Technologien selbstbestimmt Entscheidungen
  im Einklang mit unseren Werten und Sicherheitsinteressen treffen und sie auch durchsetzen.
  Das ist für mich das Wesen digitaler Souveränität. Meine Damen und Herren, es steht
  außer Frage: Dafür müssen wir zuallererst den Aus- und Aufbau unserer eigenen digitalen
  Fähigkeiten energisch strategisch vorantreiben. Denn es geht darum, Technologien
  entlang der gesamten Wertschöpfungskette, von der Hardware bis zur Software, unabhängig,
  sicher und selbstbestimmt produzieren und auch steuern zu können. Um diesen Prozess
  aus einer Hand zu betreuen und zu beschleunigen, haben wir in der Bundesregierung
  gleich zu Beginn unserer Amtszeit im letzten Jahr dieses Ministerium von Karsten
  Wildberger, das Ministerium für Digitales und Staatsmodernisierung – eine Querschnittsaufgabe
  in der gesamten Bundesregierung ‑, gegründet, und zwar mit allen Zuständigkeiten
  und Kompetenzen, die der zuständige Minister dafür benötigt. Unsere Überzeugung
  war von Anfang an: Das Streben nach digitaler Souveränität in einer global vernetzten
  Welt kann nicht bedeuten, dass wir nach Autarkie streben. Im Gegenteil, neben dem
  Aufbau eigener Kapazitäten brauchen wir zwingend eine Intensivierung der technologischen
  Zusammenarbeit mit unseren Verbündeten und „ like-minded “ Partnern weltweit, zum
  Beispiel Kanada und anderen Ländern. Wir müssen und wir wollen Wissen teilen. Wir
  wollen Lieferketten diversifizieren und gemeinsam mit Verbündeten auf internationalem
  Parkett digitalpolitisch Einfluss nehmen. Deshalb haben wir vergangenes Jahr gemeinsam
  mit Frankreich zum Gipfel für europäische digitale Souveränität eingeladen, und
  deshalb bin ich mit Emmanuel Macron übereingekommen, dass wir die Stärkung unserer
  digitalen Souveränität zum gemeinsamen Projekt, zur gemeinsamen Priorität machen.
  Wir haben hier in Berlin im November des letzten Jahres ein klares Signal gesendet:
  Es liegt in unserer strategischen Verantwortung, dass Europa im globalen technologischen
  Wandel eine führende Rolle ‑ ich sage: eine gestaltende Rolle ‑ einnimmt. Wir haben
  dies auf den Weg gebracht. Meine Damen und Herren, Deutschland und Frankreich haben
  eine gemeinsame Definition von digitaler Souveränität erarbeitet, mit der wir uns
  auf der Ebene der Europäischen Union gemeinsam in laufende Gesetzgebungsverfahren
  eingebracht haben. Das bedeutet auch zwölf Milliarden Euro an Investitionszusagen
  der privaten Wirtschaft in Schlüsseltechnologien, die wir ausgelöst haben. Wir haben
  den Weg für die „ european“ Frontier AI Initiative geebnet, um Europa an der Spitze
  der KI -Entwicklung zu positionieren. Ich freue mich deshalb, dass wir inzwischen
  mit Italien, mit Finnland und mit Polen weitere Partner und auch viele Unterstützer
  aus dem Privatsektor gewinnen konnten, so wie Sie alle heute hier Ihr Interesse
  zeigen. Meine Damen und Herren, das alles ist nicht mehr nur reine Technologiepolitik.
  Das alles ist in existenziellem Sinne Gesellschaftspolitik. KI -Systeme sind viel
  mehr als Produkte oder technologische Werkzeuge entlang digitaler Wertschöpfungsketten.
  Ich möchte KI als automatisierte Problemlösungskompetenz verstehen. KI -Systeme
  sind eine Allzwecktechnologie, die es uns ermöglicht, Probleme auf allen Wertschöpfungsebenen,
  auf allen Forschungsfeldern, ja, in allen gesellschaftlichen Bereichen zunehmend
  automatisiert zu lösen. Umgekehrt können KI -Systeme in all diesen Bereichen – Sie
  wissen es – auch massive Schäden verursachen, wenn sie fehlerhaft oder für niedere
  Zwecke eingesetzt werden. Deshalb müssen wir unter allen Umständen vermeiden, dass
  wir bei der Entwicklung und Nutzung dieser Technologie vollständig von Dritten abhängig
  werden. Denn Souveränität und letztendlich Freiheit basieren auf der Fähigkeit,
  die eigenen Probleme auch selbst lösen zu können. Je mehr KI also zur Basistechnologie
  wird, je mehr KI -Systeme zu einer ganzen und neuen Infrastruktur für Wirtschaft,
  Staat und Gesellschaft werden, desto grundlegender werden wir als Individuen, als
  Unternehmen, als Gesellschaft in unserer Problemlösungskompetenz von diesen Systemen
  abhängig. Deswegen wird die Frage der digitalen Souveränität im Kontext von KI zur
  tatsächlich existenziellen Frage: Wer verfügt in Zukunft eigentlich über die Fähigkeit,
  die technologischen Grundlagen seiner eigenen Freiheit zu gestalten? Meine Damen
  und Herren, jenseits dieser Fragen, die wir beantworten müssen: Die Chancen, die
  KI gerade für unseren Wirtschafts- und Industriestandort birgt, sind enorm. Ich
  hatte beim Investitionsgipfel vor zwei Wochen hier in Berlin Gelegenheit, über diese
  Chancen unter anderem mit dem CEO von NVIDIA zu sprechen, mit Jen-Hsun Huang. Der
  eine oder andere von Ihnen hat es miterlebt. Er hat so positiv über Deutschland
  gesprochen, und er hat das riesige Potenzial gesehen, das wir bei den nächsten Entwicklungssprüngen
  in den Bereichen von „ physical AI “ und industrieller KI für Deutschland haben,
  wo wir Vorreiter sein können. Unsere Elektronikindustrie und unser Maschinenbau
  profitieren jetzt schon massiv von den globalen Investitionen in die KI -Infrastruktur
  und dem einsetzenden Robotikboom. Die Auftragsbücher der Industrie sind in dieser
  Hinsicht gut gefüllt. Auch für Gründerinnen und Gründer öffnen sich neue Chancen
  und ganz neue Möglichkeitsräume durch KI . Es gab jedenfalls in der ersten Hälfte
  dieses Jahres 2026 mehr Gründungen als jemals zuvor im selben Zeitraum, mehr als
  3000 Unternehmen, die in Deutschland neu gegründet worden sind. Zum halben Jahr
  schon fast so viel wie im Rekordjahr 2025! Meine Damen und Herren, über ein Drittel
  dieser neu gegründeten Unternehmen arbeitet bereits heute mit KI als Kern ihres
  Geschäftsmodells. Wo Firmen früher ganze Teams brauchten, bevor sie zum Beispiel
  forschen und entwickeln konnten, können sich nun einzelne ausprobieren. Man sieht
  sozusagen im Liveformat, wie immer mehr Menschen in unserem Land die Chancen von
  KI ergreifen und beginnen, die sich öffnenden Möglichkeitsräume zu erkunden. Hier
  entstehen unsere Technologien der Zukunft: Fusionsenergie, wiederverwertbare Batterien,
  „ Carbon Capture “-Technologien, Drohnen, um nur einige wenige zu nennen. Meine
  Damen und Herren, all das sehen wir täglich, und all das ist wirklich großartig.
  Das sind Dinge, die wir brauchen und die uns helfen. All das unterstützen und stützen
  wir politisch. Wir investieren intensiv in den Ausbau unseres öffentlichen Verbundes
  von Supercomputern und haben sie auch für die Nutzung durch Start-ups und junge
  Unternehmen und für die gesamte Industrie geöffnet. Wir setzen die Nationale Rechenzentrumsstrategie
  konsequent um, mit dem Ziel, unsere KI -Rechenkapazitäten bis 2030 mindestens zu
  vervierfachen. Meine Damen und Herren, ich habe mich auf europäischer Ebene persönlich
  dafür eingesetzt, dass Maschinen- und Industriedaten keiner Doppelregulierung unterliegen.
  Wir vereinfachen auch das Teilen von Daten, zum Beispiel durch die Förderung von
  Datenräumen und die Aufnahme ausdrücklicher Erlaubnistatbestände in unserem Datenschutzrecht.
  Deutschland hat also bereits Teil an den Wertschöpfungsketten und ‑prozessen der
  Zukunft. Wir als Bundesregierung unterstützen das so, wie wir es können. Wichtig
  ist und bleibt allerdings, dass all das auf Basis einer Infrastruktur passiert,
  über die wir in ausreichendem Maße auch Kontrolle haben. Meine Damen und Herren,
  das muss auf Ebene der Modelle beginnen. Deutschland steht heute vor einer doppelten
  Herausforderung: Wir müssen die Abhängigkeit von einzelnen Anbietern drastisch reduzieren
  und gleichzeitig die technologische Führung bei den Systemen von morgen gemeinsam
  sichern. Deshalb verfolgen wir eine Doppelstrategie: Wir fördern kurzfristig die
  Entwicklung und den Einsatz industriell nutzbarer Frontier-Modelle, um die Wettbewerbsfähigkeit
  unserer Unternehmen zu sichern. Parallel dazu treiben wir im Rahmen der Hightech
  Agenda Deutschland die Forschung an KI -Modellen von morgen voran, wie Weltmodellen
  und physischer KI . Um die Koordination der KI -Politik der Bundesregierung entlang
  dieser Linien kümmert sich die KI -Taskforce, die unser Nationaler Sicherheitsrat
  im Juli dieses Jahres eingesetzt hat. Ich freue mich, dass sie nun, gleichzeitig
  mit diesem Gipfel, rechtzeitig ihren ersten Bericht dazu vorlegt. Denn es geht um
  ein Zielbild für Deutschland als KI -Nation 2030 und um eine stringente Verzahnung
  und Weiterentwicklung unserer Maßnahmen im Sinne genau dieses Zielbildes. Meine
  Damen und Herren, es gibt Momente in der Geschichte, in denen sich politische und
  wirtschaftliche Machtverhältnisse durch das Aufkommen neuer Technologien radikal
  verändern, Momente, in denen sich die Rahmenbedingungen staatlichen Handelns und
  unseres gesellschaftlichen Miteinanders so drastisch verändern, dass man tatsächlich
  von einem epochalen Wandel sprechen muss. Wir stehen heute nicht an der Schwelle
  eines solchen Wandels; wir sind mittendrin. Die zentrale Frage der globalen Wirtschaftsordnung
  ist also nicht mehr „ make or buy “, wie im 20. Jahrhundert, sondern: Wer setzt
  die Regeln? Wer entscheidet durch KI , wie gemacht wird, wie gekauft wird, wie geforscht
  wird usw.? Deshalb diskutieren wir, diskutieren Sie bei diesem Gipfel genau das
  Thema, das weit über Fragen der Wirtschaftsordnung hinausgeht. Papst Leo XIV. spricht
  in seiner Enzyklika davon, dass KI -Systeme zunehmend die Grenzen menschlicher Möglichkeiten
  definieren. Er warnt davor, dass ihnen diese Verantwortung unkritisch und in zu
  großem Umfang übertragen wird. Ich will dem Heiligen Vater ausdrücklich zustimmen.
  Als Wesen, als Menschen, die zur Selbstbestimmung befähigt und aufgerufen sind,
  wollen und sollten wir über unsere Möglichkeiten und ihre Grenzen, soweit es geht,
  selbst entscheiden. KI kann uns dabei erheblich unterstützen. Sie kann unseren Möglichkeitsraum,
  um dieses Wort noch einmal zu verwenden, in geradezu unvorstellbarem Umfang erweitern.
  Das sollten wir auch beherzt nutzen. Aber die Regeln und die Agenda müssen und wollen
  wir selbst setzen, und das im Einklang mit genau unseren Werten. Die Bedingungen
  für das, was ich hier gesagt habe, zu schaffen, das ist unser aller Aufgabe, nicht
  nur der Politik, auch nicht allein der Wirtschaft, sondern es ist eine gesellschaftliche
  Aufgabe. Meine Damen und Herren, dafür haben wir unsere manchmal langsamen und oft
  mühsamen demokratischen Institutionen und Prozesse. Um darüber zu sprechen, wie
  wir das gemeinsam hinbekommen, dafür sind wir heute alle hier. In diesem Sinne heiße
  ich Sie noch einmal in Berlin sehr herzlich willkommen. Ich freue mich darüber,
  dass Sie in so großer Zahl der Einladung der Bundesregierung gefolgt sind. Ich freue
  mich, dass Sie mit so großem Engagement diese Themen diskutieren – technologisch,
  perspektivisch, aber eben auch gesellschaftlich. Lassen Sie uns diesen Anspruch
  gemeinsam formulieren, wir Europäer zusammen mit „ like-minded “ Partnern. Ich nenne
  noch einmal beispielhaft Kanada. Aber es sind auch andere, die sehr stark auf uns
  schauen. In der letzten Woche ‑ ich sehe hier den einen oder anderen Mitreisenden ‑
  gab es in Singapur, Tokio und Seoul ein hohes Interesse an dem, was wir hier gemeinsam
  auf den Weg bringen. Lassen Sie uns den Anspruch an uns selbst stellen, als Deutsche
  und als Europäer, dass wir diesen Weg in das Zeitalter der künstlichen Intelligenz
  gemeinsam gestaltend gehen, zum Nutzen für unsere Wirtschaft, aber bitte auch zum
  Nutzen für unsere ganze Gesellschaft.'
