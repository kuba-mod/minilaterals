title: Entlastungen beschlossen Stromsteuer sinkt – Spritpreisdeckel kommt
text: 'Die Stromsteuer soll von derzeit 2,05 Cent je Kilowattstunde auf 0,1 Cent sinken.
  Foto: Getty Image/Europa Press/sAlberto Ortega Das Bundeskabinett hat beschlossen,
  Bürgerinnen und Bürger sowie Unternehmen bei den Energiekosten weiter zu entlasten:
  Die Stromsteuer soll ab dem 1. Januar 2027 auch für private Haushalte sinken und
  für viele Unternehmen, die bislang noch nicht von der Steuersenkung profitieren.
  Für Stromkundinnen und -kunden in Deutschland bedeute das eine Entlastung von zusätzlichen
  fünf Milliarden Euro, sagte Bundeskanzler Friedrich Merz. Zudem soll der gestiegene
  Spritpreis gedeckelt werden. Ein entsprechender Kabinettsbeschluss wird zeitnah
  erfolgen. „Wir machen, was wir versprochen haben, die Stromsteuer wird abgesenkt
  und die Haushalte in Deutschland werden entlastet“, so der Kanzler. Das Bundeskabinett
  hat am 23. November im Umlaufverfahren eine Formulierungshilfe für die Regierungsfraktionen
  im Deutschen Bundestag beschlossen. Auf dieser Grundlage stimmte der Deutsche Bundestag
  am 27. November einer Änderung des Haushaltsbegleitgesetzes zu. Die Stromsteuer
  kann so im Jahr 2027 für alle Verbraucherinnen und Verbraucher auf den europäischen
  Mindestsatz sinken. Für private Haushalte und bislang nicht begünstigte Betriebe
  soll die Stromsteuer von derzeit 2,05 Cent je Kilowattstunde auf 0,1 Cent fallen.
  So sind bei einem beispielhaften Bruttostrompreis von 37 Cent je Kilowattstunde
  insgesamt steuerliche Einsparungen bei den Stromkosten von bis zu 6,2 Prozent möglich.
  Ein typischer Friseursalon spart mehrere hundert Euro pro Jahr bei der Stromrechnung,
  ein Supermarkt wird sogar um mehrere tausend Euro jährlich entlastet. In Zeiten
  hoher Energiepreise soll die Steuersenkung die Stromkosten für Bürgerinnen und Bürger
  sowie die Wirtschaft schnell und unbürokratisch verringern. Zur Finanzierung der
  Senkung der Stromsteuer im kommenden Jahr sollen nicht benötigte Mittel bei der
  EEG -Förderung dienen. Die Senkung soll zunächst bis zum 31. Dezember 2027 gelten
  . Ziel ist, sie weiter fortzusetzen. Die dafür notwendige Finanzierung muss entsprechend
  im Haushalt 2028 ausgeglichen werden. Umlaufverfahren: Das Bundeskabinett hat im
  Umlaufverfahren eine Formulierungshilfe beschlossen. Ein sogenanntes Umlaufverfahren
  kann beispielsweise eingeleitet werden, wenn ein Gesetzesvorhaben beschleunigt werden
  soll oder eine mündliche Beratung der Kabinettsmitglieder nicht erforderlich ist.
  Sie können dann in einem schriftlichen Verfahren zustimmen. Für das Umlaufverfahren
  ist die Chefin des Bundeskanzleramtes zuständig. Eine Formulierungshilfe der Bundesregierung
  für die Koalitionsfraktionen ist gängige Praxis. Die wegen der Lage am Persischen
  Golf gestiegenen Spritpreise sollen gedeckelt werden, um missbräuchliche Preisaufschläge
  zu verhindern. Die zulässigen Höchstpreise werden anhand einer transparenten, an
  den internationalen Marktpreisen orientierten Berechnungsformel ermittelt. Die Verordnung
  soll drei Monate gelten und ist nicht als dauerhafte Maßnahme vorgesehen. Die Versorgungssicherheit
  darf nicht gefährdet sein. Regionale Ausnahmen sind möglich. Das Gesetz wird in
  enger Abstimmung mit der Mineralölwirtschaft und den Ländern umgesetzt.'
