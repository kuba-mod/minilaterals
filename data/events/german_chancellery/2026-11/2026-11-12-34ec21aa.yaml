title: Im Wortlaut Pressestatement Bundeskanzler Merz zum 9. Treffen der Europäischen
  Politischen Gemeinschaft am 12. November 2026 in Dublin
text: Guten Morgen allerseits! Meine Damen und Herren, ich freue mich sehr, dass wir
  heute Morgen in Dublin eintreffen, zunächst für die Europäische Politische Gemeinschaft
  und morgen für den Europäischen Rat. Ich will mich beim Taoiseach, dem Premierminister
  hier in Irland, für die wirklich sehr große Gastfreundschaft ausdrücklich bedanken.
  Wir werden über einige Themen zu sprechen haben, unter anderem über die Finanzierung
  unserer Unterstützung für die Ukraine. Es ist für mich selbstverständlich, dass
  das eine gemeinsame europäische Aufgabe ist. Wir müssen zunächst die Finanzierungslücke
  für das Jahr 2027 schließen. Anschließend müssen wir über den gemeinsamen Rahmen
  ab dem Jahr 2028 sprechen. Das werden schwierige Verhandlungen, aber ich denke,
  dass wir eine gute Chance haben, das noch bis zum Jahresende abzuschließen. Für
  mich stehen ein solides Budget und eine gemeinsame weitere Hilfe aus der Europäischen
  Union für die Ukraine im Vordergrund. Es ist aus meiner Sicht selbstverständlich,
  dass es eine gemeinsame Aufgabe aller Mitgliedstaaten der Europäischen Union ist,
  diesem Land weiterhin zu helfen. Denn es liegt in unserem eigenen Interesse. Das
  sind jetzt die entscheidenden Monate. Es wird ein sehr schwerer Winter für das Land.
  Es kommt darauf an, dass die Europäer zusammenstehen. Ich höre einige positive Signale
  aus den Gesprächen in Abu Dhabi gestern und vorgestern, sodass wir eine Chance haben,
  auch zusammen mit den Amerikanern zu einer wirklichen Friedensordnung in Europa
  zu kommen. Aber das ist noch ein langer Weg, und diesen langen Weg müssen wir gemeinsam
  gehen. Herr Bundeskanzler, was erwarten Sie sich von den Gesprächen heute Abend
  mit Kushner, wenn er direkt aus Moskau kommt? Wenn er sagt, dass Putin zustimmt,
  dass Europa am Tisch sitzt, wer soll dann für Europa sprechen? Ich erwarte zunächst
  einmal, dass die russische Regierung, dass der russische Präsident jetzt endlich
  zustimmt, dass es gemeinsame Gespräche gibt. Am Tisch sitzen müssen die Ukraine,
  die Europäer, die Amerikaner und natürlich Russland. Dann gibt es eine Möglichkeit,
  zu sprechen. Wir haben innerhalb der Europäischen Union bewährte Formate. Wir werden
  auch darüber sprechen, wer dann gegebenenfalls die Europäische Union vertritt, aber
  diese Frage besprechen wir hinter verschlossenen Türen und tragen sie nicht offen
  miteinander aus. Warum ist es für Europa eigentlich so schwierig, sich auf einen
  Namen zu einigen? Es kursieren ja viele Namen. Zunächst einmal haben wir mit dem
  Format der E3 ein bewährtes Format. Wir sind zum Teil auch mit fünf Vertretern ‑ Deutschland,
  Großbritannien, Frankreich, Italien und Polen ‑ gemeinsam in dieser Aufgabe unterwegs.
  Ich sehe überhaupt kein Problem darin, dass das so bleibt. Wichtig ist, dass Russland
  an den Tisch kommt und dass Russland zu Gesprächen bereit ist. Alles Weitere wird
  sich dann gut fügen. Herr Bundeskanzler, soll es eine Person sein, oder können es
  auch mehrere sein? Es kommt jetzt nicht auf Personen an, sondern es kommt darauf
  an, dass Putin bereit ist, Gespräche zu führen. Ich nehme mit einiger Befriedigung
  zur Kenntnis, dass es auf der russischen Seite offensichtlich mehr und mehr Bereitschaft
  gibt, anzuerkennen, dass über Europa nicht ohne Europa gesprochen werden kann. Das
  ist zunächst einmal eine gute Nachricht. Ob es dabei bleibt, wird man sehen. Es
  kommt jetzt sehr auf die Gespräche in den nächsten Tagen an.
