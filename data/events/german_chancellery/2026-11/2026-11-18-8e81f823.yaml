title: 'TikTok europäisch denken: Start für eine europäische Initiative aus Deutschland
  und Österreich'
text: 'Medienstaatsminister Wolfram Weimer und der österreichische Staatssekretär
  für Digitalisierung, Alexander Pröll, haben heute eine gemeinsame Erklärung zur
  europäischen Debatte über TikTok und die Souveränität unserer digitalen Öffentlichkeit
  veröffentlicht. Im Mittelpunkt steht die Frage, wie Europa mehr Kontrolle über Daten,
  algorithmische Systeme und zentrale Zugänge zur öffentlichen Kommunikation erreichen
  kann. Weimer und Pröll in ihrer Erklärung: „Zu lange haben wir zugeschaut, wie Europa
  immer stärker durchdrungen wurde von digitalen Diensten, die nicht den demokratischen
  Grundwerten Europas verpflichtet sind, sondern ökonomischen und geopolitischen Interessen
  Dritter.“ TikTok, die App chinesischer Herkunft, wird von etwa einem Drittel der
  deutschen und der österreichischen Bevölkerung genutzt. Weiter heißt es in der Erklärung:
  „Bei TikTok bündeln sich Daten-, Plattform- und Drittstaatenrisiken in besonderem
  Maße. Gravierende Verstöße gegen europäisches Datenschutzrecht aufgrund der rechtswidrigen
  Datenübermittlungen an China, die von der EU-Kommission geführten Verfahren aufgrund
  des Verdachts des mehrfachen Verstoßes gegen den Digital Services Act im Kontext
  von Wahlen, Jugendschutz und Plattformdesign unterstreichen die Dringlichkeit des
  Handelns.“ Weimer und Pröll kommen zu dem Schluss: „Wenn wir eine europäische Eigentümerstruktur
  für die Betätigung von TikTok in Europa schaffen und damit zugleich auch die wesentliche
  technologische Infrastruktur in europäische Verantwortung legen, würden wir einen
  wichtigen Schritt hin zu einer wirklichen europäischen digitalen Souveränität ermöglichen.“
  Beim Ende der Woche bevorstehenden Kultur- und Medienministerrat der Europäischen
  Union in Brüssel wird Staatsminister Weimer dafür werben, sich der Initiative anzuschließen.
  Die gemeinsame Erklärung im Wortlaut auf der Website des Kulturministeriums .'
