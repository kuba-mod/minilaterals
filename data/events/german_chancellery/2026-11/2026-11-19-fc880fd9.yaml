title: Bundeskanzler Merz gratuliert dem Ministerpräsidenten der Republik Lettland,
  Andris Kulbergs
text: Sehr geehrter Herr Ministerpräsident, zu Ihrer Wiederwahl gratuliere ich Ihnen
  sehr herzlich. Ich schätze unsere enge und vertrauensvolle Zusammenarbeit als Partner
  in der Europäischen Union und Verbündete in der NATO und freue mich darauf, diesen
  Weg gemeinsam mit Ihnen fortzusetzen. Ich wünsche Ihnen für Ihre weitere Amtszeit
  viel Erfolg, Kraft und alles Gute für die Zukunft Ihres Landes. Mit freundlichen
  Grüßen Friedrich Merz Bundeskanzler der Bundesrepublik Deutschland
