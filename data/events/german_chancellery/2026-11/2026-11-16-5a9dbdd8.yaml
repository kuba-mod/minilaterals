title: Rede des Bundeskanzlers zur Eröffnung des Entwicklungszentrums der MTU Aero
  Engines AG Der neue Traum vom Fliegen
text: 'Der neue Traum vom Fliegen sei es, eines Tages emissionsfrei abzuheben, so
  der Kanzler. Bundeskanzler Friedrich Merz hat das neue Entwicklungs- und Technologiezentrum
  des Luftfahrtunternehmens MTU Aero Engines in München eröffnet, wo unter anderem
  Triebwerke für den Eurofighter produziert werden. Diese Investition sei ein starkes
  Signal für den gesamten Wirtschaftsstandort Deutschland, so Merz. Gleichzeitig betonte
  der Bundeskanzler, wie die Bundesregierung die Wettbewerbsfähigkeit der Branche
  stärken will. Im neuen Entwicklungs- und Technologiezentrum am Hauptsitz München
  sollen künftig bis zu 1.000 Beschäftigte unter einem Dach an der Entwicklung neuer
  Triebwerke unter anderem für den Eurofighter arbeiten. Am Standort Deutschland investiert
  das Unternehmen damit langfristig in Forschung und Entwicklung. Weltweit beschäftigt
  die MTU Aero Engines AG rund 14.000 Mitarbeitende als führender Hersteller von Triebwerkskomponenten
  und -systemen für die zivile und militärische Luftfahrt. Sehr geehrter Herr Dr. Bussmann,
  Vorstandskolleginnen und -kollegen, herzlichen Dank für die freundliche Einladung,
  heute zu diesem großartigen Tag nach München zu kommen! Herr Oberbürgermeister,
  Mitglieder der Bayerischen Staatsregierung, Herr Staatsminister, liebe Kolleginnen
  und Kollegen aus dem Deutschen Bundestag und aus dem Bayerischen Landtag, meine
  Damen und Herren, erlauben Sie mir, dass ich zu Beginn und nach dem intensiven bayerischen
  Werbeblock eine kleine, bescheidene nordrhein-westfälische Bemerkung hinzufüge:
  Der Vorstandsvorsitzende dieses Unternehmens, Dr. Johannes Bussmann, stammt aus
  dem Münsterland, Herr Ministerpräsident, aus Nordrhein-Westfalen, und er hat die
  Fähigkeiten, um hier überhaupt arbeiten zu können, an der Rheinisch-Westfälischen
  Technischen Hochschule Aachen erworben. Herr Ministerpräsident, auch das liegt in
  Nordrhein-Westfalen! Insofern gehen Nordrhein-Westfalen und Bayern geistig und standortbezogen
  Hand in Hand. Meine Damen und Herren, ich freue mich sehr, dass ich heute zu diesem
  großartigen Anlass bei Ihnen sein darf und mit Ihnen die Eröffnung dieses Entwicklungs-
  und Technologiezentrums der MTU AG feiern kann. „Fliegen neu denken“, das ist das
  Motto Ihres Unternehmens, der MTU Aero Engines . Das ist der Anspruch, den Sie an
  die Entwicklung von Flugturbinen stellen. Neu denken, das ist nun keineswegs eine
  Übertreibung. Seit mehr als 100 Jahren sind die Ingenieurinnen und Ingenieure der
  MTU und ihrer Vorgängerunternehmen dabei, Flugzeugen zu verhelfen, abzuheben. So
  sehr mich das auch persönlich immer wieder fasziniert, meine Damen und Herren, für
  Sie alle ist das hier längst kein Kunststück mehr. Es geht heute darum, dass wir
  diese Zukunft, die mehr als 100 Jahre alt ist, nun gemeinsam neu gestalten: mit
  weniger Energie fliegen, emissionsarm, eines Tages emissionsfrei. Genau das ist
  die große technologische Herausforderung für die Zukunft der Luftfahrt, für den
  neuen Traum vom Fliegen. Dafür ‑ wir sehen es hier auf der Bühne und am Rande –
  sind neue Konzepte, sind neue und effiziente Flugzeugturbinen die maßgebliche Voraussetzung.
  Sie arbeiten daran, und es ist eine äußerst anspruchsvolle Arbeit, für die viel
  Energie, viel Einfallsreichtum, viel Erfahrung notwendig sind. Dazu braucht es mehr
  Voraussetzungen als nur einen einzelnen klugen Kopf wie damals bei der Erfindung
  der Flugzeugturbine. Dafür braucht es eine große Zahl von weltweit führenden Entwicklerinnen
  und Entwicklern, von Ingenieurinnen und Ingenieuren, von Forscherinnen und Forschern,
  und rund 350 von Ihnen, meine Damen und Herren, sind heute hier. Für Sie wurde dieses
  neue Forschungs- und Entwicklungszentrum gebaut. Sie finden hier eine neue Heimat,
  einen neuen Arbeitsplatz, und Sie finden hier die besten Arbeitsbedingungen, die
  denkbar sind, um diesen Auftrag zu erfüllen. Sie werden diesen Raum nutzen, um Neues
  zu schaffen, zum Beispiel, indem Sie hier neue Technologien für die Triebwerke des
  „ Next Generation Single Aisle “ entwickeln, also eines Flugzeuges mit einem Gang,
  aber eben mit zwei Turbinen; Technologien, die neue Maßstäbe setzen bei Leistung,
  Effizienz und Nachhaltigkeit bis hin zu hybridelektrischen Antriebselementen. Sie
  haben es eben gesagt, Herr Bussmann: Es ist schon faszinierend, einmal selbst zu
  erleben, welche ungeheure Kraft in einer solchen Turbine steckt. Wenn man das selbst
  einmal erlebt hat, dann hat man noch mehr Respekt vor dieser großartigen Ingenieurkunst,
  die dahintersteckt. Meine Damen und Herren, in diesem Gebäude wird an genau diesen
  faszinierenden Innovationen gearbeitet, die für die Luftfahrt von morgen und übermorgen
  von so großer Bedeutung sind. Sie haben die Zahlen genannt: 100 Millionen Euro für
  350 Mitarbeiterinnen und Mitarbeiter, für 1.000 Mitarbeiterinnen und Mitarbeiter
  im ganzen Unternehmen. Sie haben es eben genau verstanden: Forschung und Entwicklung
  sind die Grundlagen eines jeden zukünftigen Unternehmenserfolgs. Und Forschung und
  Entwicklung sind die Grundlagen für den Erfolg unserer deutschen Wirtschaft insgesamt.
  Diese Investition hier an diesem Standort ist in der Tat ein starkes Signal für
  den Standort München, für den Standort Bayern, Herr Ministerpräsident, aber selbstverständlich
  für den ganzen Wirtschaftsstandort Deutschland und für die Zukunft der europäischen
  Luftfahrtindustrie. Ich will Ihnen hierfür ausdrücklich danken, stellvertretend
  für Ihre Kolleginnen und Kollegen, Ihnen, Herr Bussmann, aber auch Ihnen, liebe
  Frau Maurer. Ich will es ausdrücklich sagen: Dass eine Frau im Vorstand dieses Unternehmens
  für Technik zuständig ist, muss ein ermutigendes Beispiel für junge Frauen in ganz
  Deutschland sein, was man erreichen kann, wenn man sich als Frau auch einmal technischen
  Berufen zuwendet. Herzlichen Dank, dass Sie auch dafür so werben. Nun erlauben Sie
  mir, dass ich noch ein paar ergänzende Worte zur Wertschöpfung in dieser Industrie
  sage. Meine Damen und Herren, die Luft- und Raumfahrtindustrie ist eine strategische
  Schlüsselindustrie für unser Land und für ganz Europa. Sie sichert Wertschöpfung
  durch hochqualifizierte Arbeitsplätze, allein im Kernbereich des Luftfahrtsektors,
  allein in unserem Land 380.000 Arbeitsplätze. Sie stärkt damit unsere technologische
  Kompetenz und unsere internationale Wettbewerbsfähigkeit. Sie haben es bereits angesprochen,
  Herr Bussmann, und auch du, lieber Markus Söder: Sie leistet einen wichtigen Beitrag
  zur Sicherheit und zur Souveränität Europas. Damit ist die Luftfahrtbranche eine
  Branche mit einer enormen Wachstumsperspektive, aber auch mit einer enormen Verantwortung.
  Auch das haben Sie hier bereits erwähnt: Die Industrie geht davon aus, dass wir
  in den nächsten 25 Jahren auf der Welt noch einmal zusätzlich 40.000 neue Flugzeuge
  brauchen, 40.000 neue Flugzeuge in den nächsten 25 Jahren bis zum Jahr 2050. Ich
  rufe uns alle auf, meine Damen und Herren: Lassen Sie uns gemeinsam, Wirtschaft
  und Politik, diese Wachstumschancen nutzen, Chancen für neue Arbeitsplätze, Chancen
  für gesteigerte Wertschöpfung auch und gerade in Deutschland. Wir sind aufgerufen,
  politisch die Voraussetzungen dafür zu verbessern, wo immer es nur geht. Viele dieser
  Voraussetzungen betreffen die Wettbewerbsfähigkeit unserer Wirtschaft insgesamt,
  und dazu müssen wir – ja, auch das ist richtig – vor allem die Kosten für Unternehmen
  senken. Das erreichen wir nur mit Reformen, mit Veränderungen, um die wir in der
  Bundesregierung und um die wir im Land jeden Tag ringen, Reformen in der Energiepolitik,
  der Steuerpolitik, der Sozialpolitik, der Arbeitsmarktpolitik. Aber, meine Damen
  und Herren, auch die Rahmenbedingungen für die Luftfahrtbranche selbst müssen wir
  weiter verbessern. Wir haben ein umfassendes Paket geschnürt. Wir haben die Luftfahrtbranche
  in diesem Jahr um rund 500 Millionen Euro bei Steuern und Abgaben entlastet, und
  wir fördern entsprechende Schlüsseltechnologien nicht nur über die Hightech -Agenda
  Bayern, sondern auch über die Hightech -Agenda des Bundes und durch das Luftfahrtforschungsprogramm
  unseres Landes. Wir haben in der Luftfahrtstrategie Prioritäten festgelegt und konkrete
  Maßnahmen für die kommenden Jahre benannt. Die müssen wir nun aber auch umsetzen,
  gemeinsam mit der Industrie. Wichtig ist dabei, dass wir die Synergien zwischen
  ziviler Luftfahrt und militärischer Luftfahrt besser nutzen. Meine Damen und Herren,
  gerade in dieser Industrie brauchen wir Unternehmen, die ihre Kompetenzen international
  und im Sinne unserer Kooperationsbemühungen mit Freunden und Partnern einbringen –
  und zwar auch im militärischen Bereich. MTU hat in der Vergangenheit gezeigt, dass
  es das kann, und dafür möchte ich Ihnen allen sehr, sehr herzlich danken. Darauf
  bauen wir auch in der Zukunft. Herr Bussmann, die aktuellen Umsatzzahlen von MTU
  unterstreichen genau das. Diese Zahlen sind beeindruckend. Ihr Unternehmen ist damit
  mehr als nur ein Zulieferer einzelner Systemkomponenten. MTU ist, wie viele andere
  Unternehmen der Branche auch, ein Innovationstreiber in der gesamten Branche. Über
  Technologie gestalten Sie die wichtigsten Eigenschaften eines Flugzeuges mit: seine
  Effizienz, seine Sicherheit, seine Nachhaltigkeit. Damit tragen Sie eine besondere
  Verantwortung für die Zukunft der Luftfahrt. Mit großer Neugier werde ich deshalb
  auch persönlich verfolgen – nicht zuletzt aus eigener Leidenschaft –, was Sie alle,
  meine Damen und Herren, von diesem Standort aus in den nächsten Jahren möglich machen
  werden, wenn Sie den Traum vom Fliegen erneut Wirklichkeit werden lassen. Lassen
  Sie mich mit der Fliegersprache sagen: „The sky is the limit“ . Also machen Sie
  etwas daraus. Die Bundesregierung wird jedenfalls ihren Beitrag zu diesem gemeinsamen
  Ziel, nämlich einem starken und zukunftsfähigen Luftfahrtstandort, leisten. In diesem
  Sinne wünsche ich Ihnen viel Erfolg. Lassen Sie mich vielleicht ein Wort eines der
  Pioniere der Luftfahrt aus den frühesten Anfangsjahren zitieren, das ich bei solchen
  Gelegenheiten gern wiederhole. Es stammt von Leonardo da Vinci , der einmal gesagt
  hat: Wenn du das Fliegen einmal erlebt hast, dann wirst du fortan auf Erden wandeln
  und dein Blick ist stets himmelwärts gerichtet. Denn da bist du einmal gewesen,
  und da willst du immer wieder hin. Alles Gute für Sie!'
