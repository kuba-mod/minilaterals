date: '2026-11-06'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 6. November 2026
text: 'Sprecherinnen und Sprecher •    Staatssekretär Kornelius •    Giese (AA) •    Haufe
  (BMUKN) •    Bowinkelmann (BMI) •    Reck (BMV) •    Harmsen (BMF) •    Swistek
  (BMVg) (Vorsitzende Wefers eröffnet die Pressekonferenz und begrüßt StS Kornelius
  sowie die Sprecherinnen und Sprecher der Ministerien.) Heute gibt es einen Ausblick
  auf die kommende Woche. Ich kann sagen, dass die kommende Woche stattfindet, und
  es gibt auch Termine . Bundeskanzler Merz wird am Montag, den 9. November, an einem
  Festakt zum 20-jährigen Bestehen der Hauptsynagoge Ohel Jakob in München teilnehmen.
  Das Datum des Festaktes erinnert natürlich an die dunkelsten Kapitel der deutschen
  Geschichte. In der sogenannten Reichspogromnacht brannten 1938 Synagogen. Es wurden
  jüdische Geschäfte geplündert und Wohnungen zerstört. Jüdinnen und Juden, auch in
  München, wurden angegriffen, verschleppt und ermordet. Die ursprüngliche Hauptsynagoge
  Münchens wurde als eine der ersten Synagogen Deutschlands bereits Monate zuvor von
  den Nationalsozialisten zerstört. Der Neubau setzte 2006 ein sichtbares Zeichen
  für die heutige Präsenz des jüdischen Lebens in Deutschland und in München. Der
  Bundeskanzler will durch seine Anwesenheit beim Festakt und mit seiner Ansprache
  an die große Bedeutung eines lebendigen jüdischen Lebens erinnern. Er will diesen
  Punkt unterstreichen, und er will an diesem symbolträchtigen Tag natürlich auch
  ein Zeichen setzen. Ein Hinweis für alle, die nicht in München dabei sein können:
  Der Bayerische Rundfunk überträgt die Veranstaltung live ab 16.30 Uhr. Am Dienstag,
  den 10. November, wird der Bundeskanzler den Ministerpräsidenten von Ungarn Péter
  Magyar um elf Uhr im Bundeskanzleramt empfangen. Das Treffen beinhaltet zwei Teile,
  erstens ein bilaterales Gespräch über die aktuellen europapolitischen und bilateralen
  Themen und zweitens ein anschließendes Mittagessen im Kreis mehrerer Fachminister.
  Auch dort wird es dann um bilaterale Themen gehen. Gegen 13.30 Uhr wird eine gemeinsame
  Pressekonferenz stattfinden, zu der Sie herzlich eingeladen sind. Am Mittwoch tagt,
  wie gewohnt, um zehn Uhr das Kabinett unter der Leitung des Bundeskanzlers. Anschließend
  nimmt der Bundeskanzler das Jahresgutachten des Sachverständigenrates zur Begutachtung
  der gesamtwirtschaftlichen Entwicklung entgegen. Sie wissen, dass das Gutachten
  eine Prognose der wirtschaftlichen Entwicklung und Analysen zur Wirtschaftspolitik
  enthält. Es sind Statements des Bundeskanzlers sowie der Vorsitzenden des Sachverständigenrats,
  Monika Schnitzer, vorgesehen. Am Donnerstag wird der Bundeskanzler nach Dublin reisen.
  Die Reise wird bis Freitagabend stattfinden. Dort ist zunächst das Treffen der Europäischen
  Politischen Gemeinschaft vorgesehen, an dem der Bundeskanzler teilnehmen wird. Am
  Freitag folgt das informelle Treffen des Europäischen Rates . Der irische Taoiseach
  Martin und der Präsident des Europäischen Rates, António Costa, haben zum neunten
  Treffen der Europäischen Politischen Gemeinschaft eingeladen. Es werden 47 Staats-
  und Regierungschefs aus Europa sowie die Spitzen der EU-Institutionen teilnehmen.
  Auch der kanadische Premierminister Carney wird an den Beratungen teilnehmen. Das
  Motto dieses Gipfels lautet „Europe – strong, secure, connected“. Das Treffen soll
  zeigen, dass die europäische Zusammenarbeit auch über die EU hinaus in einem sehr
  konstruktiven Rahmen und sehr produktiv stattfindet. Es wird einen informellen Austausch
  über die großen europapolitischen und globalen Themen geben, vor allem über die
  Sicherheits- und Wettbewerbspolitik. Wie immer bietet dieses Treffen auch Gelegenheit
  für viele Gespräche bilateraler Art am Rande. Das ist das Besondere beim EPG-Treffen,
  da es sehr viele Teilnehmerinnen und Teilnehmer zusammenbringt. Der Europäische
  Rat am Freitag, den 13. November, wird ebenfalls in Dublin stattfinden. Es ist ein
  informeller Rat. Das Treffen befasst sich vorrangig mit dem Thema künstlicher Intelligenz
  und daneben noch mit den Themen der EU-Wettbewerbsfähigkeit und der Kontrolle. Als
  Gastredner sind Arthur Mensch, der CEO von Mistral, und der Nobelpreisträger Professor
  Geoffrey Hinden eingeladen. Daneben werden die EU-Staats- und Regierungschefs natürlich
  Gelegenheit haben, tagesaktuelle Themen zu diskutieren. Sie wissen, dass der Präsident
  des Europäischen Rates, Costa, am 19. November seine neue Verhandlungsbox für den
  MFR vorstellen will. Das wird sicherlich ein Thema sein. Auch aktuelle Personalfragen
  und andere Dinge werden dort im Mittelpunkt stehen. Außenminister Wadephul reist
  am Montag nach Paris . Er wird sich dort mit den Außenministern der G7 sowie den
  Außenministern der Ukraine, Brasiliens, Saudi-Arabiens, Ägyptens und Südkoreas treffen.
  Ebenfalls eingeladen zu diesem Treffen ist der Direktor des World Food Programme.
  In den Gesprächen wird es vor allem um gemeinsame Lösungen und Ansätze für globale
  Herausforderungen und Krisen gehen. Dazu gehört natürlich der russische Angriffskrieg
  gegen die Ukraine und die Stärkung unserer Unterstützung für die Ukraine, sowie
  die Erhöhung des Sanktionsdrucks gegen Russland und die Aktivitäten der russischen
  Schattenflotte. Auch die Krisen im Mittleren Osten werden im Vordergrund stehen.
  Die Außenminister werden sich mit der Situation in Israel und den palästinensischen
  Gebieten, in Iran, Jemen, Libanon und Syrien sowie mit der Lage am Horn von Afrika
  und in Sudan befassen. Ebenfalls auf der Agenda ist die Sicherheit wichtiger Handelswege
  und internationaler Seewege. Dabei wird die Lage in der Straße von Hormus auch Teil
  der Beratung sein. Außerdem werden die Außenministerinnen und Außenminister über
  die Auswirkungen künstlicher Intelligenz auf Frieden und Sicherheit beraten. Am
  kommenden Montag, den 9. November, beginnt im türkischen Antalya die 31. Weltklimakonferenz
  . Sie läuft bis zum 20. November. Bundesumweltminister Carsten Schneider wird in
  der zweiten Konferenzwoche vor Ort teilnehmen. Gemeinsam mit seinem indischen Amtskollegen
  Bhupender Yadav unterstützt er die Präsidentschaft der COP31 bei den politischen
  Konsultationen zur Minderung von Treibhausgasen. Die Türkei richtet die Konferenz
  aus und übernimmt die COP-Präsidentschaft. Der türkische Umweltminister Murat Kurum
  ist für den Vorsitz vorgesehen. Der australische Klimaminister Chris Bowen leitet
  nach der Vereinbarung beider Länder die formellen Verhandlungen. Es ist eine Neuerung,
  dass zwei Länder den Vorsitz übernehmen. Zur Präsidentschaftsaufgabe Australiens
  gehört es, die Erarbeitung der Entwürfe und Beschlüsse für die Vertragsstaaten vorzubereiten.
  Für Deutschland und die Europäische Union soll Antalya eine Konferenz der Umsetzung
  werden. Das Pariser Klimaabkommen und sein 1,5-Grad-Ziel geben dafür die Richtung
  vor. Der Umweltrat der Europäischen Union hat im Oktober die gemeinsame Verhandlungsposition
  beschlossen. Wir setzen uns dafür ein, dass die Staaten ihre nationalen Klimapläne
  umsetzen und ausstehende Pläne vorlegen. Dazu gehört es, den Übergang weg von Kohle,
  Öl und Gas zu beschleunigen, erneuerbare Energien auszubauen und den Umbau sozial
  und gerecht zu gestalten. Ein Schwerpunkt für Deutschland ist die weltweite Elektrifizierung.
  Die türkische Präsidentschaft hat dafür ein gemeinsames Ziel vorgeschlagen. Bis
  2035 soll Strom 35 Prozent der weltweit verbrauchten Endenergie ausmachten. Wir
  liegen derzeit bei gut 20 Prozent. Es geht also eine um ein sehr konkretes Umsetzungsziel.
  Dafür brauchen wir mehr erneuerbaren Strom, leistungsfähige Netze und Speicher.
  Letzter Punkt: Mehr Gewicht soll in Antalya auch die Klimaanpassung bekommen. Hitze,
  Dürren und Überschwemmungen verursachen schon heute weltweit erhebliche Schäden.
  Wir wollen, dass das globale Anpassungsziel in konkrete Vorsorge übersetzt wird,
  etwa in Frühwarnsysteme, Hitzeschutz und eine sichere Wasserversorgung. Dazu gehört
  auch, dass besonders gefährdete Länder leichter an Klimafinanzierung herankommen.
  Ich habe eine Frage ans BPA. Ihr Kollege hat am Mittwoch schon gesagt, dass der
  Kanzler nicht zur COP reisen werde. Im Nachgang dazu gab es relativ heftige Kritik
  daran. Unter anderem wurde kritisiert, der Kanzler lasse damit demonstrativ die
  jungen Menschen in einer eskalierenden Klimakrise im Stich. Wie reagieren Sie auf
  diese Kritik? Der Bundeskanzler ‑ das haben wir auch kommuniziert ‑ kann in diesem
  Jahr deswegen nicht an der COP teilnehmen, weil, wie Sie dem Wochenplan entnehmen
  konnten, parallel auch andere Treffen stattfinden: Am Donnerstag und am Freitag
  sind es die Treffen in Irland; für Mittwoch ist eine sehr wichtige Kabinettssitzung
  terminiert. Wir sind in der Woche der Haushaltsbereinigung, die auch innenpolitisch
  volle Aufmerksamkeit verlangt. Der Terminkalender ist sehr voll. Die Bundesregierung
  wird durch den Bundesumweltminister vertreten. Der Bundeskanzler hat sich zuletzt
  beim Petersberger Klimadialog am 22. April und bei anderen großen klimapolitischen
  Veranstaltungen zu Wort gemeldet. Die Klimapolitik der Bundesregierung ist sichergestellt.
  Sie ist in der Koalition abgestimmt, und ihr wurde tatsächlich auch in Belém, wo
  der Bundeskanzler teilgenommen hat, weiterhin eine bedeutende Rolle attestiert.
  Die Bundesregierung ist in ihrer Klimapolitik unerschüttert. Sie wird trotz anderen
  terminlichen Verpflichtungen sehr gut vertreten sein. Herr Kornelius, ist Herr Schneider
  der einzige Minister, der zur COP in die Türkei reist, oder werden noch andere Minister
  erwartet? Mir ist nicht bekannt, dass andere reisen. Aber traditionell ist der Umweltminister
  natürlich das zentrale Kabinettsmitglied für die COP. Die deutsche Delegation wird
  ab Montag von der neu ernannten Staatssekretärin Heike Henn geleitet werden. Der
  Parlamentarische Staatssekretär aus dem BMZ, Herr Saathoff, ist ebenfalls dabei.
  Also Staatssekretärsebene in der kommenden Woche, und in der zweiten Woche, der
  klassischen Ministerwoche, dann mit dem Bundesumweltminister, der, wie schon angesprochen,
  das volle Mandat des Bundeskanzlers hat. Herr Haufe, es gibt Berichterstattung von
  vor Ort, wonach der geplante Klimamarsch, der traditionell am Rande der COP stattfindet,
  stark gefährdet sei. Es gibt Repressionen gerade gegenüber türkischen Menschen.
  Es gibt Raids der türkischen Behörden. Was wissen Sie, und wie setzt sich die Bundesregierung
  dafür ein, dass demonstriert werden kann? Zivilgesellschaftliches Engagement ist
  enorm wichtig, gerade bei den Weltklimakonferenzen. Das gehört zu unserem Selbstverständnis
  dazu. Deswegen finden bei Weltklimakonferenzen in der Regel auf dem Gelände der
  Konferenzen Demonstrationen statt. Um das Gelände der Konferenzen finden Demonstrationen
  statt. Wir erwarten, dass das auch gewährleistet wird. Aber haben Sie Erkenntnisse
  darüber, dass die türkischen Behörden den großen Marsch, der umherzieht, einschränken
  bzw. verhindern wollen? Ich habe keine konkreten Erkenntnisse. Aber ich will unterstreichen,
  was ich gerade gesagt habe: Wir erwarten, dass das notwendige, wichtige zivilgesellschaftliche
  Engagement, das bei Weltklimakonferenzen immer mit dazugehört, entsprechend abgesichert
  ist. Das ist ja eine Konferenz nicht nur der Politik, sondern vieler engagierter
  Akteure von Wirtschaft bis Zivilgesellschaft. Zur Reise des Außenministers : Herr
  Giese, ist angesichts der Vorgänge in den USA nach den Midterms sicher, dass Herr
  Rubio kommen wird? Können Sie sagen, warum der Veranstaltungsort von Marseille nach
  Paris verlegt worden ist? Mit beiden Themen fragen Sie in Kreise hinein, über die
  ich keine Kontrolle habe. In Bezug auf den Veranstaltungsort müssten Sie die französischen
  Organisatoren fragen. Ich meine, sie hätten logistische und organisatorische Gründe
  dafür genannt. Das ist allerdings nur ein Hinweis. Vielleicht fragen Sie einmal
  bei der Französischen Botschaft hier in Berlin nach. In Bezug auf Herrn Rubio: Ich
  denke, er kennt seine Reisepläne selbst. Wir haben keinen Hinweis darauf, dass er
  nicht kommen würde. Er hat seine Teilnahme zugesagt. Die Entscheidung wird er allerdings
  selbst treffen und nicht wir. (zum russischen Angriffskrieg gegen die Ukraine )
  Welche Erkenntnisse hat die Bundesregierung über die Gespräche zwischen USA und
  Russland, die vor Kurzem gelaufen sein sollen? Es wird wahrscheinlich um die Ukraine
  gegangen sein. Ich weiß nicht, was Sie mit „vor Kurzem“ meinen. Es gibt Berichterstattungen,
  wonach US-Vertreter Kreml-Vertreter getroffen haben sollen. Weiß die Bundesregierung
  irgendetwas darüber? Die Bundesregierung ist über die Gespräche der amerikanischen
  Regierung informiert. Der Bundeskanzler hat in der vergangenen Nacht mit dem amerikanischen
  Präsidenten telefoniert. Der Bundeskanzler ist in die Überlegungen des amerikanischen
  Präsidenten eingebunden. Sie wissen, dass diese konkreten Gespräche vor dem Hintergrund
  langer, anhaltender Vorbereitungen zu Verhandlungsformaten in Abu Dhabi oder zu
  späteren Zeitpunkten auch an anderen Orten laufen. Wir sind in diese Abstimmungen
  gemeinsam mit der E3-Gruppe und den anderen europäischen Partnern eng eingebunden.
  Die Bundesregierung ist sich mit der amerikanischen Regierung in vier Grundpunkten
  einig. Erstens muss zunächst der Krieg in der Ukraine beendet werden, und dann wird
  über eine europäische Sicherheitsordnung gesprochen werden. Zweitens kann eine Vereinbarung
  nur im geschlossenen Kontext getroffen werden. Es ist also nur das vereinbart, wenn
  alles vereinbart ist. Drittens muss es einen Konsens der NATO-Partner geben. Die
  NATO-Partner müssen an Bord sein. Das wichtige Argument der Bundesregierung ist,
  viertens, dass Gespräche über Europas Sicherheit und den Frieden in der Ukraine
  Europa in seinem Kern betreffen und deswegen Gespräche ohne die europäische Beteiligung
  aus unserer Sicht nicht zielführend sind. Sie haben gesagt, das Gespräch habe diese
  Nacht stattgefunden. Heißt das, dass die Initiative dazu von US-Seite kam, dass
  also sozusagen angerufen wurde, dass man die Bundesregierung informieren wolle?
  Darf ich noch fragen, um wie viel Uhr das stattfand? Ich kann Ihnen keine Uhrzeit
  geben. Ich gebe Ihnen auch keine Details zu Initiatoren. Es gibt ständig Austausch
  des Bundeskanzlers mit dem amerikanischen Präsidenten. In diesem konkreten Fall
  hat der amerikanische Präsident angerufen und einen Anrufversuch des Bundeskanzlers,
  der nicht zustande kam, erwidert. Aber das sind Kleinigkeiten. Sie sehen daraus:
  Es herrscht ein enger Austausch. Es ist irrelevant, wer wen anruft oder nicht. Es
  gibt auf beiden Seiten ein Bedürfnis, sich über die Themen auszutauschen. Herr Kornelius,
  Herr Trump hat gestern den Putin-Gesandten Dmitrijew getroffen. Darum geht es, denke
  ich. Fand das Gespräch mit dem Kanzler nach diesem Treffen statt? Wir haben entsprechende
  Meldungen zur Kenntnis genommen. Ich habe keine Bestätigung, die ich hier liefern
  könnte. Herr Trump hat danach ein umfassendes Friedensabkommen in Aussicht gestellt.
  Welche Erwartung hat die Bundesregierung aktuell an die Gespräche in Abu Dhabi nächste
  Woche? Ich habe Ihnen gerade sehr ausführlich in vier Punkten die Erwartungen der
  Bundesregierung geschildert. Diese Erwartungen stehen. Ich denke, dass die Äußerungen
  der letzten Tage vor dem doppelten Hintergrund zu verstehen sind, dass, erstens,
  nach den Midterms natürlich ein neues Gefühl der Dringlichkeit entstanden ist und
  dass, zweitens, auch der Verhandlungsprozess der ja schon seit vielen Monaten läuft
  und von europäischer Seite eng begleitet wird, jetzt an Dynamik gewinnt. Die Bundesregierung
  ist an diesem Prozess beteiligt. Sie ist mit ihren Partnern beteiligt, deswegen
  auch die wichtigen Abstimmungen kommende Woche am Rande des Europäischen Rates und
  der EPG, deswegen auch die kontinuierlichen Kommunikationen zwischen den EU-Mitgliedern
  und der Bundesregierung, den E3 und auch den Partnern, die nicht Mitglied der Europäischen
  Union sind. Wir verweisen darauf, dass auch große Fragen der Finanzierung der Ukraine
  in den vergangenen Tagen und auch beim Besuch des ukrainischen Präsidenten hier
  in Deutschland eine wichtige Rolle gespielt haben. Auch sie sind im Kontext der
  nächsten Wochen zu klären. Insofern verdichtet sich das Verhandlungsmandat jetzt
  enorm. Wurde der Kanzler für das Gespräch geweckt? Ich kann Ihnen über den Zeitpunkt
  des Gesprächs keine Auskunft geben. Der Kanzler ist, wie Sie wissen, immer im Dienst.
  Weil sich Herr Kornelius gerade auf die Midterms bezogen hatte: Wir bekommen jetzt
  zwar andere Parlamentsmehrheitsverhältnisse, aber die Außenpolitik wird ja immer
  noch aus dem Weißen Haus gemacht. Es gibt ja jetzt konkrete Berichterstattung, wonach
  Herr Rubio zurücktritt. Geht die Bundesregierung davon aus, dass sich die Außenpolitik
  der Amerikaner ändern wird, nicht nur hinsichtlich der Ukraine, sondern auch bezüglich
  Angriffspläne auf Iran? Hat der Kanzler diesbezügliche Hinweise von Herrn Trump
  bekommen? Die Bundesregierung kommentiert die Wahlergebnisse in anderen Ländern
  nicht. Die Analysen, die sie anstellen, entnehme ich den Zeitungen. Auch zu Herrn
  Rubio nehme ich andere Meldungen in den Zeitungen wahr. Insofern steht es mir nicht
  zu, das zu kommentieren. Was die außenpolitischen Erwartungen der Bundesregierung
  angeht, haben wir unseren Kurs und haben wir unsere Ziele. Diese habe ich definiert.
  Wir sprechen mit unseren Partnern und mit den Akteuren in der jeweiligen Regierung,
  aber auch mit den parlamentarischen Teilnehmern. Das heißt, die Bundesregierung
  hat ein inhaltliches Ziel. Das inhaltliche Ziel ist es, den Frieden in der Ukraine
  schnellstmöglich herbeizuführen, und zwar unter Bedingungen, die anschließend Stabilität
  und Sicherheit in Europa gewährleisten. Zu diesen Zielen haben sich der Bundeskanzler
  und die Mitglieder der Bundesregierung, der Außenminister und andere, vielfältigst
  geäußert. Jedes Ereignis, das Dynamik in diese Verhandlungsführung mit Blick auf
  diese Zielsetzung bringt, wird von uns begrüßt. Die Ukraine muss befriedet werden.
  Was ist mit dem Krieg in Iran ? Soll er auch beendet werden? Ich habe jetzt über
  die Ukraine gesprochen. Ja. Ich frage jetzt nach Iran. Das ist der andere große
  Krieg. Natürlich. Die Bundesregierung hat ein hohes Interesse an Frieden und Stabilität
  im Iran. Aber wir haben eine höhere Einflussmöglichkeit in der Ukraine. Die Bundesregierung
  ist inzwischen der größte Unterstützer der Ukraine in diesem Konflikt. Wir appellieren
  an alle Beteiligten und vor allem an Russland, diesen Angriffskrieg einzustellen,
  dieses sinnlose Morden einzustellen. Sie haben gehört, dass die Opferzahlen allein
  im letzten Monat auf über 50 000 geklettert sind. Das sind unvorstellbare Zahlen,
  und es ist höchste Zeit, nun zu einem vermittelten Waffenstillstand, also zu einem
  Friedensprozess zu kommen. Ich möchte, ergänzend zu dem Kollegen, auch zum Iran
  nachfragen. Das gehört ja zu dem Gespräch zwischen dem Kanzler und dem US-Präsidenten.
  Aber der Iran ist ja auch abgedeckt. Ich habe keine Fragen mehr zur Ukraine, aber
  ich rufe das gern noch einmal auf. Aber das deckt sich sozusagen mit meiner Faktenlage.
  Insofern sind wir jetzt beim Iran. Auch das ist ja durch die Reise des Außenministers
  abgedeckt. Vor allem aber auch durch das Telefonat des Kanzlers mit dem US-Präsidenten.
  Darin wird ja auch der Iran eine Rolle gespielt haben. Erstens: Haben Sie entweder
  durch das Gespräch oder durch nachrichtendienstliche Erkenntnisse Hinweise darauf,
  dass ein neuer Angriff der Amerikaner zusammen mit den Israelis auf den Iran kurz
  bevorsteht, auch nach den Midterms? Zweitens: Hat das im Gespräch des Bundeskanzlers
  mit dem US-Präsidenten eine Rolle gespielt, und hat er erneut, wie es ja schon vorher
  von der Bundesregierung kam, vor einem solchen Angriff gewarnt und zu einer diplomatischen
  Lösung gemahnt? Ich kann Ihnen zu weiteren Inhalten des Gesprächs leider keine Auskunft
  geben. Erstens ist es natürlich vertraulich. Die beiden haben vereinbart, sich zum
  Thema der Ukraine zu äußern. Alles Weitere bleibt dem Gespräch überlassen. Die Position
  der Bundesregierung zu Iran hat sich nicht verändert. Wir müssen den Konflikt durch
  Gespräche lösen. Wir unterstützen die Bemühungen für diplomatische Lösungen. Wir
  nutzen dazu die Beziehungen, die wir am Golf und natürlich auch zu Israel haben.
  Iran muss auch endlich verhandeln. Er muss aufhören, über Proxys die Region zu destabilisieren,
  und er muss die Straße von Hormus dauerhaft und ohne Einschränkungen öffnen. Die
  letzte Forderung ist Ihnen auch bekannt: Das Nuklearprogramm muss glaubwürdig eingestellt
  sein. Dann wiederhole ich die Frage: Gibt es über dieses Gespräch hinaus Erkenntnisse
  der Bundesregierung oder Informationen durch Partner, dass ein solcher Angriff kurz
  bevorsteht, möglicherweise in den nächsten Tagen? Ich kann Ihnen zu diesen Informationen
  keine Substanz liefern. Vielleicht kann das Außenministerium das tun? Ich würde
  mich Herrn Kornelius gern anschließen. Ich möchte aber einen Hinweis geben, der
  davon losgelöst ist, den wir aber in solchen Situationen immer geben: Dass es dort
  eine Zuspitzung der Lage gibt, ist Ihnen allen klar. Darüber gibt es ausreichend
  Berichterstattung und Äußerungen. Deswegen der Hinweis an alle Bürgerinnen und Bürger
  Deutschlands ‑ ich habe es in der vergangenen Woche gesagt; ich würde es aber gern
  wiederholen ‑: Bitte informieren Sie sich über die Lage! Informieren Sie sich auf
  der Webseite des Auswärtigen Amts! Laden Sie sich die App Sicher Reisen herunter,
  oder besuchen Sie sie im Netz! Informieren Sie sich über die Reise- und Sicherheitshinweise!
  Tragen Sie sich in die ELEFAND-Liste ein, und wenn Sie aus anderen Orten fliegen,
  dann schauen Sie, ob Sie einen Transit am Golf in einer Region haben, die einer
  Gefährdung ausgesetzt ist, und schauen Sie, ob Sie Ihre Reisepläne entsprechend
  überdenken wollen! Diese Äußerung habe ich schon in der vergangenen Woche gemacht.
  Das ist eine generelle Aufforderung, die seit geraumer Zeit besteht, aber ich würde
  sie anlässlich Ihrer Frage gern noch einmal bekräftigen. Herr Kornelius, dürfen
  die Amerikaner bei einem weiteren Angriff wieder die US-Basen in Deutschland benutzen?
  Die Nutzungsbedingungen für die amerikanischen Streitkräfte sind vertraglich klar
  geregelt, und es gibt keinen Grund, nach einer Veränderung zu trachten. Ich glaube,
  im Bundestag wurde schon klargemacht, dass vertraglich nicht geregelt ist, dass
  das für illegale Angriffskriege benutzt werden darf. Darum frage ich. Ich habe meinen
  Äußerungen nichts hinzuzufügen. Die Vertragslage ist klar, und die Bundesregierung
  hält sich an die Vertragslage. Zu den Bombendrohungen gegen die zivile Luftfahrt
  in dieser Woche hat der Außenminister heute indirekt Stellung genommen. Er hat im
  Zuge der hybriden russischen Bedrohungen auch diese Bombendrohungen erwähnt. Herr
  Giese, gibt es Hinweise darauf, dass konkret Russland hinter diesen Drohungen steckt?
  Ich habe Ihnen dazu nichts weiter mitzuteilen. Wenn Sie sich die Gesamtäußerung
  des Außenministers anschauen ‑ das war vor dem Abflug zu seiner Reise nach Warschau
  am heutigen Tag ‑, dann stellen Sie fest, dass sich das auch auf Fragen der Resilienz
  bezog. Deutschland und Europa müssen in Bezug auf hybride Bedrohungen resilienter
  werden. Dass dieses Vorgehen in irgendeiner Art und Weise koordiniert war, zeigt
