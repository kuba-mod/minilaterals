  Wir werden die Entscheidung dazu mitten im Beratungsstadium sicherlich nicht hier
  verkünden. Wir reichen es gerne nach bzw. teilen es gerne mit, wenn die Beratungen
  abgeschlossen sind. Wenn die Frist heute um 17 Uhr abläuft, wird das dann heute
  sein? Die Beratungen enden nicht mit dem Fristende. Das heißt, dir Frist für Einreichungsmöglichkeiten
  kann auch verlängert werden. Sie wissen, dass es im Zuge der europäischen Beratungen
  der nächsten Wochen und Monate viele Gelegenheiten geben wird, ein Tableau aufzusetzen,
  und daran wird sich die Bundesregierung beteiligen. Es gibt ein Urteil zur Mietpreisbremse
  in Hessen ‑ wahrscheinlich richtet sich die Frage an das Justizministerium ‑, in
  dem die Verlängerung der Mietpreisbremse für nichtig erklärt wurde. Zieht die Bundesregierung
  daraus irgendeine Konsequenz? Das betrifft ja einen sehr konkreten hessischen Sachverhalt.
  Das Bundesgesetz zur Verlängerung der Mietpreisbremse ist wirksam und gibt den Kommunen
  auch die Möglichkeit, die entsprechenden Rechtsverordnungen zu erlassen. Wenn da
  in Hessen etwas schiefgelaufen ist, dann haben wir das jetzt von hier aus nicht
  zu kommentieren. Die Bundesregierung sieht also im Moment überhaupt keinen Handlungsbedarf,
  was die Mietpreisbremse angeht? Die Bundesjustizministerin hat ja mehrfach betont,
  dass es, um der Mietpreisbremse noch mehr Durchsetzungskraft zu verleihen, auch
  weitere Änderungen am sozialen Mietrecht geben soll. Ein entsprechender Gesetzentwurf
  befindet sich ja bereits im parlamentarischen Verfahren. Dabei geht es unter anderem
  um das für die Mietpreisbremse sehr relevante Thema möblierter Wohnungen und gleichzeitig
  der Kurzzeitvermietungen. Beides kann der Bundestag noch in diesem Jahr beschließen,
  und das würde auch der Mietpreisbremse zu stärkerer Durchsetzungskraft verhelfen.
  Aber dieser konkrete hessische Sachverhalt löst jetzt keinen gesetzgeberischen Handlungsbedarf
  auf Bundesebene aus. Eine Frage an das Wirtschaftsministerium im Zusammenhang mit
  KNDS : Wie weit sind da die Verhandlungen gediehen? Ist sich der Bund mit den Eigentümerfamilien
  einig, was eine Übernahme von 50 Prozent der Anteile angeht? Genau, wir wollen auf
  Augenhöhe mit Frankreich agieren. Daher planen wir eine Beteiligung in gleicher
  Höhe wie Frankreich, nämlich von 50 Prozent. Wir befinden uns hierüber in guten
  Gesprächen mit der Familie. Eine Einigung steht derzeit ‑ ‑ ‑ Zu näheren Details
  kann ich noch nichts sagen, weil die Verhandlungen ‑ ‑ ‑ Es gab so einen leichten
  Abfall in der Lautstärke. Eine Einigung steht derzeit nicht? Mit mehr Kraft in der
  Stimme sage ich es jetzt noch einmal. Weil es die letzte Frage war, war es vielleicht
  ein bisschen lau. Wir wollen uns mit Frankreich einigen, und dabei geht es um 50 Prozent.
  Wir befinden uns derzeit in sehr guten Gesprächen mit der Regierung, und eine Einigung
  steht an. Zu mehr Details kann ich mich jetzt nicht äußern, weil die Verhandlungen
  derzeit noch laufen, und für Vertragsdetails gilt das genauso. Dürfte ich dann gleich
  eine zweite Frage stellen, auch an das Wirtschaftsministerium? Dann ist auch Ende
  Gelände. – Stimmt es, dass Yvonne Schreiber die neue Präsidentin des Bundeskartellamts
  werden soll? Medienberichte kommentieren wir nicht, und zu Personalentscheidungen
  äußern wir uns grundsätzlich dann, wenn sie anstehen, und spekulieren vorher nicht.'
