date: '2026-11-11'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 11. November 2026
text: '(Vorsitzende Wolf eröffnet die Pressekonferenz und begrüßt StS Kornelius sowie
  die Sprecherinnen und Sprecher der Ministerien.) Erstens hat das Kabinett heute
  den Integrationsbericht der Beauftragten der Bundesregierung für Migration, Flüchtlinge
  und Integration entgegengenommen. Der Bericht gibt alle zwei Jahre einen umfassenden
  Überblick über die Entwicklungen der Integration in Deutschland und zeigt, wo Integration
  gelingt und wo man noch mehr tun muss. Staatsministerin Pawlik hat den Bericht hier
  gerade vorgestellt; deswegen halte ich es jetzt kurz. Aus den aktuellen Daten geht
  hervor, dass Integration heute in vielen Bereichen besser als je zuvor gelingt.
  Das Schwerpunktkapitel des Berichts befasst sich mit Bildungsverläufen und den damit
  verbundenen Arbeitsmarktchancen insbesondere der Nachkommen von Eingewanderten.
  Für sie zeigen sich strukturelle Verbesserungen. Sie erreichen im Vergleich zu ihren
  Eltern deutlich höhere Bildungsabschlüsse und haben damit verbunden bessere Chancen
  auf dem Arbeitsmarkt. Für Eingewanderte selbst, insbesondere für eingewanderte Frauen,
  sieht der Integrationsbericht jedoch nach wie vor Hürden und Ungleichheiten in der
  Bildung, auf dem Arbeitsmarkt und bei der gesellschaftlichen Teilhabe. Insgesamt
  betrachtet der Bericht 14 Themenfelder, darunter die Themenfelder von Gesundheit,
  Wohnen und Rassismus, und liefert damit eine wichtige Orientierungshilfe für die
  integrationspolitische Debatte in Deutschland. Zweitens hat das Kabinett heute den
  Gesetzentwurf zur Einführung einer Gasreserve zur Krisenvorsorge sowie Eckpunkte
  für zusätzliche Maßnahmen zur Erhöhung der Versorgungssicherheit mit Erdgas beschlossen.
  Die neue Gasreserve soll die Gasversorgung in der Bundesrepublik in einer außergewöhnlichen
  Krisensituation absichern. Über die für den deutschen Gasmarkt verantwortliche Trading
  Hub Europe soll diese neue Gasreserve schnellstmöglich markt- und preisschonend
  aufgebaut werden. Die Gasreserve soll die landesweite Gasversorgung im Notfall für
  zusätzlich 30 Tage sicherstellen und so eine Gasmangellage abwenden und Nachfragebeschränkungen
  wie beispielsweise Abschaltungen der Anschlüsse von Industriekunden oder Temperaturvorgaben
  vermeiden. Zugleich ist klar, dass die Gasunternehmen mit der neuen Gasreserve nicht
  aus ihrer Verantwortung für die übliche Wintervorsorge entlassen werden. Sie sind
  weiterhin für die vollumfängliche Erfüllung ihrer Lieferverpflichtungen und Verbrauchsmengen
  verantwortlich. Das gilt weiterhin auch für sehr kalte Winter. Die neue Gasreserve
  wird strikt vom Markt und der marktlichen Wintervorsorge getrennt. Noch einmal:
  Es ist eine Notreserve. ‑ Mit der neuen Reserve für die Krisenvorsorge werden die
  Ende März 2027 geltenden bisherigen Gasspeicherfüllstandsvorgaben abgelöst. Die
  Bundesregierung hat sich darüber hinaus auf weitere Maßnahmen zur Erhöhung der Versorgungssicherheit
  verständigt. Dazu gehören eine Stärkung der Marktaufsicht der Bundesnetzagentur,
  der weitergeführte Einsatz von „long-term options“ sowie die Vorbereitung einer
  Lieferantenverpflichtung zur Absicherung der Wintervorsorge. Schließlich noch eine
  Botschaft zur Neuaufstellung der Rohstoffaußenpolitik: Das Bundeskabinett hat heute
  eine Strategie des Bundeswirtschaftsministeriums entgegengenommen, die gemeinsam
  mit dem Auswärtigen Amt und dem BMZ geschrieben und erstellt wurde. Diese Strategie
  zur Stärkung und Fokussierung der Rohstoffaußenpolitik beinhaltet neben den bilateralen
  Rohstoffpartnerschaften eine engere Einbindung der Wirtschaft, die stärkere Verzahnung
  bestehender Instrumente und der Akteure im In- und Ausland. Die Versorgung der deutschen
  Industrie mit Rohstoffen soll so besser sichergestellt werden. Die Strategie ergänzt
  bestehende Instrumente wie den Rohstofffonds und trägt damit dazu bei, die Versorgung
  durch die Diversifizierung der Rohstofflieferketten und die Unterstützung neuer
  Rohstoffprojekte zu unterstützen. Die Neuaufstellung hat drei Kernelemente: Erstens
  werden starke bilaterale Rohstoffpartnerschaften nun priorisiert. Damit kann eine
  schnellere Diversifizierung herbeigeführt werden. Zweitens wird es eine noch bessere
  Verzahnung der Akteure und der Instrumente vor allem im Ausland geben. Drittens
  wird die Wirtschaft sehr eng eingebunden, damit man das Ziel erreicht, schnell gemeinsam
  Zugänge zu verlässlichen Lieferketten aufzubauen und abzusichern. Frau Lorenzat,
  ab wann soll die Gasreserve aufgebaut werden, und wann soll sie voll einsatzbereit
  sein? Heute wurde im Kabinett der entsprechende Gesetzentwurf beschlossen. Naturgemäß
  geht er jetzt ins Parlament und hat das Parlament dann die Hand darauf, wie der
  Zeitplan ist. Grundsätzlich ist aber vorgesehen, dass schon ab dem Winter 2027/2028
  zusätzliche Versorgungssicherheit gewährleistet werden kann. Die Ministerin hatte
  ja eine Mischfinanzierung ins Spiel gebracht, Haushalt und Umlage. Wieso ist eine
  Haushaltsfinanzierung jetzt ausgeschieden? In der Wirtschaft gibt es ja Kritik an
  einer Umlage. Zu den Entscheidungen, die innerhalb der Bundesregierung dazu getroffen
  wurden, verhalte ich mich wie üblich nicht. Tatsächlich soll die Vorsorge umlagefinanziert
  sein. Es ist mir aber auch wichtig, zu betonen, dass diese relativ moderat ausfällt.
  Um Zahlen zu nennen: Der Gaspreis für einen Privathaushalt liegt derzeit durchschnittlich
  bei 11 bis 12 Cent pro Kilowattstunde. Die Umlage wird nach jetzigen Schätzungen
  wahrscheinlich bei 0,03 Cent bis 0,05 Cent liegen. Das heißt, für einen Durchschnittshaushalt
  sind es weniger als zehn Euro im Jahr. Ist Bestandteil dieses Konzeptes, dass das
  Gas im Ausland gekauft wird, oder ist auch vorstellbar, dass Gas von anderen Betreibern
  im Inland für den Aufbau der Reserve übernommen wird? Das ist eine zusätzliche Vorsorgemaßnahme,
  für die die THE entsprechend Vorsorge treffen und die Einkäufe so gestalten wird,
  dass sie markt- und preisschonend sind. Das hat Herr Kornelius schon dargelegt.
  Zu näheren Details kann ich mich nicht äußern. Eine Nachfrage zur Umlage: Das bedeutet
  ja, dass die Gaskunden dieses Gas dann eigentlich schon bezahlt haben. Bedeutet
  das, dass es dann, wenn es irgendwann abgegeben wird, kostenlos ist, weil es über
  die Umlage schon bezahlt wurde? Ich habe dargelegt, wie die Finanzierung der Bereitstellung
  der Gasreserve stattfinden wird. Ich verstehe nicht ganz, warum gleichzeitig die
  Mindestfüllstandsvorgaben abgeschafft werden. Denn wenn der neue Speicher sozusagen
  zehn Prozent der Kapazität abdeckt, dann würde sich das mit der bisherigen 70‑Prozent-Vorgabe
  überhaupt nicht ins Gehege kommen. Warum braucht man sie aus Ihrer Sicht jetzt nicht
  mehr? Diese zehn Prozent sind ja kein Ersatz für die bisherigen 70 Prozent. Mir
  ist wichtig, noch einmal zu betonen, dass es bei der strategischen Gasreserve gerade
  nicht um die Wintervorsorge geht ‑ darauf beziehen Sie sich ja, wenn Sie von Füllstandvorgaben
  sprechen ‑, sondern es geht um eine separate Vorsorge für außergewöhnliche Großereignisse,
  für die der Markt keine Vorsorge treffen kann. Die Abschaffung der Füllstandsvorgaben
  ist auf EU-Ebene beschlossen worden, weil sich herausgestellt hat, dass sie für
  die marktliche Befüllung nicht unbedingt geeignet sind. Können Sie etwas dazu sagen,
  wer dann über die Freigabe entscheidet und welche Situationen das sind? Wie leer
  müssen die Speicher sein, bevor auf die Reserve zugegriffen werden darf? Wer entscheidet
  über die Freigabe dieses Gases? Über eine Freigabe des Gases aus der strategischen
  Gasreserve wird der Bundeslastverteiler, also namentlich die BNetzA, in einem Moment
  entscheiden, in der die Notfallstufe Gas vorliegt. (zur Strategie zur Stärkung und
  Fokussierung der Rohstoffaußenpolitik ) Herr Kornelius, Frau Lorenzat, auf eine
  engere Einbindung der Wirtschaft wurde jetzt mehrfach abgehoben. Mir fehlt die Fantasie,
  mir vorzustellen, wie die Wirtschaft noch enger eingebunden werden kann. Es reisen
  immer Delegationen mit. Wir haben die Außenhandelskammern. Wir haben Germany Trade
  and Invest. Können Sie vielleicht ein Beispiel dafür nennen, woran dabei gedacht
  ist? Beim BMWE soll eine zentrale Anlaufstelle für Unternehmen geschaffen werden,
  die mit den Akteuren der Rohstoffaußenpolitik verknüpft wird. Es wird dann eine
  verbesserte Koordinierung auch der internationalen Partnerschaften geben, das heißt,
  eine Vernetzung auch mit den Lieferländern. Durch die Priorisierung auch der Partnerländer
  werden wir sehr klare Ansprechpartner schaffen. Das geht dann auch über die Außenhandelskammern
  oder andere Institutionen, die wir im Ausland unterhalten. Besonders wichtig sind
  in diesem Kontext die Partnerschaften mit Australien, Brasilien, Chile, Kanada und
  Südafrika. Herr Kornelius, die deutsche Industrie arbeitet gerade an einem Zukunftsmodell
  Rohstoff, also einem eigenen Modell, und begründet dies mit der mangelnden Handlungsfähigkeit
  Deutschlands. Glaubt die Bundesregierung, die Sorgen der Industrie vor der fehlenden
  Handlungsfähigkeit der Regierungsseite mit diesem neuen Entwurf beruhigt zu haben?
  Sie können versichert sein, dass die Industrie und die Bundesregierung in sehr engem
  Austausch zu diesem Thema stehen. Es gibt auch bestehende Verbindungen, die seit
  Wochen und Monaten an diesem Konzept arbeiten. Sie wissen, dass diese Rohstoffaußenpolitik
  auf einen Beschluss des Nationalen Sicherheitsrats zurückgeht. Das ist jetzt in
  kürzester Zeit aufgestellt worden, auch im Zusammenspiel mit der Industrie. Insofern
  denke ich, dass sich da Synergien ergeben und ein sehr gutes Ergebnis zu erwarten
  ist. Teilt der Kanzler die von der Industrie geäußerte Kritik der mangelnden Handlungsfähigkeit
  in diesem Bereich der Rohstoffstrategie? Was für eine Antwort erwarten Sie auf diese
  Frage? Der Kanzler gibt sich ja manchmal selbstkritisch. Ich muss hier nicht auf
  ironische Fragen antworten. Ich bemühe mich um eine sachliche Information. … (ohne
  Mikrofon, akustisch unverständlich) Ich habe die ganze Zeit über vermisst, dass
  Sie uns ein paar Beispiele nennen. Um welche Rohstoffe geht es? Das sind natürlich
  seltene Erden. Es ist vor allem die Beschaffung von seltenen Erden. Die Abhängigkeit
  von wenigen Bezugsquellen für seltene Erden ist ein strategisches Problem in der
  Rohstoffpolitik. Der Bundeskanzler hat zum Beispiel in Japan gesehen, wie sich Japan,
  ausgehend von einer Rohstoffabhängigkeit zum Beispiel gegenüber China, deutlich
  diversifiziert hat und größere Bezugsquellen erschließen konnte. Unsere Rohstoffpolitik
  hat ähnliche Ziele. Heißt das, dass es ausschließlich um seltene Erden geht, oder
  geht es auch noch um andere Rohstoffe, Herr Kornelius? Ich weiß nicht, ob wir das
  im Detail schon ausführen können. Ich gehe davon aus, dass es dabei im Kern um seltene
  Erden geht. Können die beteiligten Ressorts das konkretisieren? Ich habe an der
  Stelle nichts hinzuzufügen. Herr Kornelius hat ja die Länder aufgezählt. Geht es
  da um die genannten Rohstoffe? Es wäre mir neu, wenn es in allen genannten Ländern
  um seltene Erden ginge. Es geht um eine Breite von Rohstoffen, nicht nur um seltene
  Erden. Aber ins Detail kann ich hier nicht gehen. Ich habe gesagt, dass ich hier
  nicht ins Detail gehen kann. Es geht um Lithium, Nickel, Kobalt, Graphit, Platin,
  Mangan, Chrom usw. Der Rohstoffbedarf ist also breit gefächert. War der heutige
  Kanzlergeburtstag in irgendeiner Form Thema in der Kabinettssitzung? Der Vizekanzler
  und Finanzminister hat dem Bundeskanzler im Namen des Kabinetts gratuliert und ihm
  Blumen überreicht. Auch der Bundesinnenminister hat das getan. Damit war der Geburtstag
  hinreichend gefeiert. Die Redaktion hat Interesse, unter Umständen den angekündigten
  Italiener vom Kanzler zu testen. Können Sie uns verraten, in welches italienische
  Restaurant es anlässlich der Geburtstagsfeier heute geht? Es gibt ein privates Abendessen
  des Bundeskanzlers, dessen Ort wir nicht mitteilen. Ich kann Ihnen in dem Zusammenhang
  aber wirklich noch einmal zusichern, dass der Bundeskanzler bis etwa 20 Uhr Termine
  hat. Alle Vorstellungen, dass er den Tag beim Italiener verbrächte, sind also etwas
  albern. (zur Beratung des Haushaltsentwurfs für 2027 im Deutschen Bundestag ) Herr
  Kornelius, ich weiß, dass die Verhandlungen im Parlament liegen. Aber die Bundesregierung
  ist ja involviert. Inwiefern sind heute Ergebnisse in den Themen der Stromsteuersenkung,
  der kalten Progressionen und anderer Steuern wie der Zuckersteuer etc. zu erwarten?
  Ich weiß, dass Sie alle ungeduldig warten. Die Bereinigungssitzung beginnt morgen
  früh. Üblicherweise wird bis zum letzten Moment an den Feinheiten des Haushalts
  gearbeitet. Das ist auch diesmal der Fall. Ich kann Ihnen sagen, dass in sehr weiten
  Teilen schon ein guter Konsens erzielt wurde. Ich kann aber dem Gesetzgeber nicht
  vorgreifen. Diese Verhandlungen liegen jetzt in den Fraktionen und im Deutschen
  Bundestag. Deswegen warten wir auch mit Spannung auf die Bereinigungssitzung. Der
  Regierungsentwurf wurde bereits in erster Lesung beraten; jetzt kommt eben die Bereinigung.
  Sie kennen die Schwerpunkte des Bundeshaushalts. Sie kennen die Maßnahmen, die bereits
  öffentlich kommuniziert wurden. Für alles Weitere muss ich sie leider auf den späteren
  Verlauf des Tages bzw. den morgigen Tag vertrösten. Noch einmal zur Stromsteuer:
  Der Kanzler hat sehr stark auf eine Senkung der Stromsteuer gepocht. Können wir
  davon ausgehen, dass eine Stromsteuersenkung in irgendeiner Form Teil des Ergebnisses
  sein wird, da der Kanzler ja so sehr darauf gepocht hat? Der Bundeskanzler hält
  es für wünschenswert, dass die Stromsteuer für alle gesenkt wird, so wie es im Koalitionsvertrag
  verabredet wurde. Die Voraussetzung dafür ist, dass entsprechende Spielräume im
  Haushalt vorhanden sind. Die Verhandlungen ‑ jetzt wiederhole ich mich ‑ befinden
  sich im parlamentarischen Verfahren. Deswegen kann ich Ihnen keine finale Antwort
  dazu geben. Der Kanzler sprach im Zusammenhang mit der Stromsteuer von einer Glaubwürdigkeitslücke.
  Was ist die Konsequenz daraus, wenn diese Lücke jetzt nicht geschlossen werden kann?
  Ich sage es noch einmal: Das Verfahren befindet sich momentan im laufenden Prozess.
  Das heißt, wir können jetzt keine Beurteilung abgeben. Die Bundesregierung strebt
  an, diese Zusage aus dem Koalitionsvertrag umzusetzen. Voraussetzung dafür ist es,
  dass im Haushalt die nötigen Spielräume dafür geschaffen werden. Außerdem gibt es
  jede Menge anderer steuerlicher und gesetzgeberischer Vorhaben im Zusammenhang mit
  einem sehr ambitionierten Haushalt. Noch einmal: Wir sollten den Beginn der Bereinigungssitzung
  abwarten, die letzte Bereinigungsvorlage. Einige frühe Versionen sind ja bereits
  im Umlauf, aber die abschließende ist es noch nicht. Steht die Ansage hinsichtlich
  der Glaubwürdigkeitslücke noch? Es steht mir jetzt nicht an, diese Aussage zu beurteilen,
  weil der Gesamthaushalt betrachtet werden muss und weil die Stromsteuer im Koalitionsvertrag
  verabredet wurde. Der Bundeskanzler hat die Hoffnung geäußert, dass diese Zusage
  umgesetzt wird. Es gibt andere Zusagen. Übrigens muss ich hier jetzt nicht noch
  einmal wiederholen, dass die Bundesregierung bereits vor geraumer Zeit die Strompreise
  gesenkt hat, auch für die Industrie. Das heißt, wir reden jetzt über den letzten
  Schritt einer Erleichterung bezüglich der Energiepreise. Ich bitte noch einmal darum,
  den Verhandlungsverlauf abzuwarten. Herr Kornelius, neben der Stromsteuer gab es
  den Wunsch anderer Koalitionäre und auch aus der Unionsfraktion, dass man die kalte
  Progression ausgleichen möge. Würde der Bundeskanzler das bei der Entlastung von
  Bürgern bevorzugen? Das ist jetzt wieder eine hypothetische Frage. Der Bundeskanzler
  bzw. seine Mitarbeiterinnen und Mitarbeiter aus dem Bundeskanzleramt sind jetzt
  Teil dieses Verhandlungsprozesses. Das geschieht im engen Einvernehmen mit den Koalitionsfraktionen,
  die den Bundeshaushalt bis zum Wochenende auch im parlamentarischen Verfahren durchbringen
  wollen. Deswegen stelle ich jetzt keine Spekulationen an, was prioritär ist oder
  nicht. Es obliegt jetzt den Verhandlern, das zu entscheiden. Das war eigentlich
  nicht hypothetisch. Ich frage ja nur, ob der Kanzler, nachdem jetzt auch der Vorschlag
  der kalten Progression auf dem Tisch liegt, dies möglicherweise gegenüber der Stromsteuer
  als Entlastung bevorzugt. Der Bundeskanzler verrechnet jetzt nicht unterschiedliche
  Steuerelemente aus dem Bundeshaushalt. Er hat seine Position immer wieder deutlich
  gemacht, auch zur kalten Progression. Sie wissen, dass der Bundeshaushalt unter
  Finanzierungsvorbehalt steht und dass er auch unter enormen Zwängen zusammenhalten
  muss. Noch einmal: Ich kann den Behandlungen da nicht vorgreifen. Eine kurze Frage
  zum weiteren Ablauf: Die Bereinigungsvorlage, die gestern verschickt worden ist,
  hat nur den halben Umfang gehabt, und alle entscheidenden Fragen blieben darin offen.
  Es ist jetzt angekündigt, dass die zweite Hälfte nachgeliefert werde. Bis wann soll
  das denn geschehen? Herr Kornelius, ich habe Sie so verstanden, dass es langen würde,
  wenn sie zur Bereinigungssitzung vorliegt. Ich dachte immer, sie muss auch schon
  zur heutigen Haushaltsausschusssitzung vorliegen. Ein bisschen Zeit braucht man
  als Abgeordneter ja vielleicht auch, um die 2000 Seiten durchzuarbeiten. Wann genau
  wird das vom Finanzministerium also verschickt werden? Sie können versichert sein,
  dass die Abgeordneten über den Verhandlungsstand auch informiert sind, weil sie
  mitverhandeln. Die Opposition wird das dann auch zeitig zugestellt bekommen. Über
  einen genauen Zeitablauf kann ich Ihnen leider keine Auskunft geben. Können Sie
  etwas dazu sagen, Frau Ernoult? Die Vorlage kommt ja aus dem Finanzministerium.
  Wie weit sind Sie? Vielleicht ganz grundsätzlich: Ich kann bestätigen, dass am Montag
  regulär die Bereinigungsvorlage an den Haushaltsausschuss übersandt wurde. Es ist
  aber auch nicht unüblich, dass hierzu nun beraten wird und entsprechende Deckblätter
  zu einzelnen weiteren Punkten dann noch im laufenden Prozess nachgereicht werden.
  Und wann diese Nachlieferung kommt, ob das noch heute oder erst morgen passiert,
  können Sie noch nicht sagen? Wie Sie wissen, kann ich im laufenden Prozess nichts
  dazu sagen. Die Bereinigungssitzung findet am Donnerstag statt. Zu einzelnen Punkten
  kann ich mich jetzt nicht explizit äußern. Eine Verständnisfrage an Frau Ernoult:
  In der Diskussion über eine Stromsteuersenkung ist ja auch im Gespräch, dafür Gelder
  vom EEG-Konto einzusetzen. Es wird ja erwartet, dass es quasi einen Überschuss von
  vier Milliarden Euro auf EEG-Konto gibt. Wäre es aus Sicht des BMF ein gangbarer
  Weg, diese Gelder für andere Zwecke einzusetzen? Dazu habe ich mich hier am Montag
  schon geäußert, und meinen Äußerungen habe ich jetzt nichts hinzuzufügen. Meine
  Frage bezieht sich auf ein Statement des Bundesverteidigungsministeriums, wonach
  chinesische Drohnen bei der Bundeswehr oder bestimmten Stellen in der Bundeswehr
  verbannt werden sollen. Die Frage richtet sich aber eigentlich auch an das Bundeskanzleramt
  und andere Ministerien: Gibt es eine einheitliche Diskussion Linie oder Regelung
  innerhalb der Bundesregierung, was die Nutzung chinesischer Technologie betrifft?
  Ist die Nutzung chinesischer Technologie zum Beispiel auch in der Überwachung oder
  der Instandhaltung von kritischer Infrastruktur unzulässig? Ich würde vorschlagen,
  ich beginne erst einmal, weil auch Aspekte der Bundeswehr direkt betroffen sind.
  Es ist nicht so, dass aktuell ein Bann oder ein pauschales Verbot für Technik aus
  bestimmten Ländern oder Technik von bestimmten Herstellern existiert. Wir schauen
  uns aber ganz genau an, wo welche Technik eingesetzt wird. Vor ca. drei Jahren,
  als die Drohnenthematik durch den russischen Angriffskrieg mehr und mehr zum Thema
  wurde, hatten wir die Herausforderung, dass auf dem Markt zur damaligen Zeit nur
  geringfügige Möglichkeiten bestanden, die Truppe breit auszustatten. Unser Anspruch,
  aber auch der Anspruch der Öffentlichkeit war, dass sich die Bundeswehr mehr mit
  diesem Thema befasst. Deshalb wurde entschieden, dass die Kommandeure vor Ort in
  der Lage sind, für ganz spezielle Aufgaben, für einen ganz limitierten Einsatzzweck,
  mit einer Art Handgeld direkt marktverfügbare Systeme zu kaufen. Es gibt eine zweite
  Liste mit Systemen aus zum Beispiel europäischer Produktion, die Sie nicht im Baumarkt
  oder im Elektronikmarkt bekommen, die weitaus höhere Sicherheitsstandards erfüllen.
  Diese Systeme wiederum sind dann für Einsatzzwecke vorgesehen gewesen, bei denen
  sicherheitsrelevante Aspekte betroffen sind. Ein kleines Beispiel: Wenn Sie jungen
  Rekruten, die gerade die Basisausbildung beginnen, auf dem Übungsplatz zeigen wollen,
  wie schwer sich eine Drohne in 200 Meter Entfernung erkennen lässt oder dass man
  sie in dieser Entfernung gar nicht hört, sie einen aber wiederum sehr gut sieht,
  dann können Sie dafür eine Drohne aus dem Elektronikmarkt nehmen, weil diese Drohne
  auch nichts abgreifen kann. Auch dann wird aber natürlich geschaut, dass keine Maßnahmen
  des Datenabflusses existieren ‑ zum Beispiel durch eine Abstrahlprüfung, sodass
  man dann weiß, ob SIM-Karten verbaut oder versteckt sein könnten. Das kann man heutzutage
  alles sehr gut ermitteln. Zusammengefasst: Es gibt diese Systeme, die in einem stark
  eingegrenzten Aufgaben- oder Einsatzspektrum verwendet werden. Für alle anderen
  Aufgaben ‑ taktische Ausbildung, Einsatz, größtenteils Aufklärung ‑ werden andere
  Systeme mit viel höheren Sicherheitsstandards eingesetzt. Aktuell haben wir den
  Stand, dass wir in Europa und auch in Deutschland eine viel dynamischere, lebendigere
  Drohnenindustrie haben und in den nächsten Monaten und Jahren auch viel breiter
  Drohnen aus Europa und aus Deutschland einkaufen können. Die Systeme mit geringeren
  Sicherheitsstandards werden also nicht mehr nachbeschafft, wir werden zukünftig
  keine chinesischen Drohnen mehr beschaffen, und diese werden jetzt nach und nach
  aus der Nutzung gehen. Künftig ‑ nicht sofort, aber künftig ‑ werden wir für alle
  Einsatzzwecke nur noch Systeme von Herstellern beziehen, die besondere Sicherheitsauflagen
  erfüllen. Vielleicht noch zur allgemeinen Frage nach Absicherungstechnik, IT usw.:
  Grundsätzlich haben wir natürlich eigene IT-Spezialisten, die sich immer anschauen,
  was für welche Zwecke eingesetzt werden darf. Im Bereich Absicherung, Schutz, militärische
  Sicherheit nutzen wir natürlich nur dafür zugelassene Systeme, die hohe Sicherheitsanforderungen
  erfüllen müssen. Auch was das Thema Handynutzung und so etwas betrifft, gibt es
  ja Produkte aus den Ländern, die Sie jetzt angesprochen haben. Da haben wir sehr
  hohe Standards, und in sicherheitsrelevante Bereiche dürfen solche Geräte gar nicht
  eingebracht werden, sodass überhaupt keine Möglichkeiten des Datenabflusses bestehen.
  Wenn Sie diesbezüglich auch noch Fragen zum Thema Kfz haben, können wir das im Anschluss
  gerne noch besprechen. Fühlen sich auch das Bundeskanzleramt oder andere Ministerien
  bei diesem Thema angesprochen? Gibt es zum Beispiel beim Verkehrsministerium ähnliche
