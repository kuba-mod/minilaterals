  ein Gespräch über die europäische und transatlantische Sicherheitsordnung stattfinden.
  Es gibt viele Themen, die dort inklusiv und im Kontext gelöst werden müssen. Das
  ist das zweite Prinzip. Kontext bedeutet: Die euroatlantische Sicherheit ist auch
  die ukrainische Sicherheit. Herr Kornelius, nur, um es nicht falsch zu verstehen:
  Diese vier Prinzipien sind aber keine, die mit Russland vereinbart wurden, sondern
  zwischen den Europäern, den Amerikanern und den Ukrainern. Ist das richtig? Das
  ist richtig. Damit haben diese Prinzipien natürlich Einfluss auf die Gespräche,
  die jetzt im Anschluss an Abu Dhabi stattfinden. Eine Nachfrage, auch anknüpfend
  an die Frage des Kollegen: Aus dem Kreml verlautet, dass Herr Putin zu einem Treffen
  und Gespräch mit dem Kanzler und den Europäern bereit wäre. Noch einmal anknüpfend
  an die Bemerkung des Kanzlers vom letzten Freitag: Wäre der Kanzler jetzt zu einem
  Gespräch mit Herrn Putin bereit? Diese Haltung Russlands ist seit Kriegsbeginn bekannt.
  Das ist keine Neuigkeit. Das wurde schon häufig geäußert. Wir haben jetzt in Abu
  Dhabi eine Verständigung über die Grundzüge erreicht. Diese Verständigung wird jetzt
  auch mit dem russischen Präsidenten geteilt. Auf der Basis können sich Gespräche
  entwickeln. Die US-Verhandler Kushner und Witkoff fliegen ja heute weiter nach Moskau.
  Tun sie das auch im Auftrag der Europäer? Ich hatte mich dazu eben geäußert; ich
  wiederhole es gerne. Es gibt ein Verständnis über vier Prinzipien, die in Abu Dhabi
  erzielt wurden. Es gibt das Verständnis, dass die Verhandlungen um die Europäer
  erweitert werden. Mit diesem Paket werden die Verhandler nun nach Moskau reisen.
  Aber die Europäer sind ja jetzt in Moskau nicht dabei. Wird dann diese Vereinbarung
  schon direkt von den US-Verhandlern gebrochen? Wir warten jetzt auf die russische
  Reaktion. Der russische Chefunterhändler Wladimir Medinski hat erklärt, der Konflikt
  zeige, dass die europäische Sicherheitsarchitektur nicht funktioniere, die Welt
  brauche ein neues System. Hat die Bundesregierung eine Vorstellung davon, was damit
  gemeint sein kann? Weiter hat Herr Medinski erklärt, mit EU-Staaten habe es seitens
  Russlands in Abu Dhabi keinen direkten Kontakt gegeben, weil diese eine Kriegspartei
  mit Waffen und Geld unterstütze. Bedeutet das nicht logisch, dass eigentlich auch
  die Amerikaner nicht hätten teilnehmen können? Die unterstützen doch auch eine Kriegspartei.
  Ich kenne die Aussage nicht. Dann müssten Sie die Quelle fragen. Ich kann das nicht
  beurteilen. Herr Kornelius, zu diesem vierten Prinzip, der „no-surprise-policy“:
  Das soll mit Herrn Trump gelingen? Ich kann nur wiedergeben, was in Abu Dhabi verabredet
  wurde. Ich glaube, die amerikanische Seite hat ein genauso großes Interesse an einer
  Friedenslösung, wie wir es in Europa haben. Insofern halten wir uns an diese Prinzipien
  und werden sie auch umsetzen. Sie sind zuversichtlich, dass ‑ ich meine, wir sind
  ja seit zehn Jahren in Sachen Donald Trump in dieser Welt unterwegs ‑ es da zu keinen
  Überraschungen mit ihm kommen kann? Wenn man in den Gesprächen jetzt tatsächlich
  vorankommt, dann stellt sich natürlich wieder die Frage, wer für die Europäer spricht.
  Wir hatten das Thema schon einmal. Frau Meloni hat jetzt gefordert, dass diese Frage
  möglichst auf dem informellen EU-Gipfel am Freitag geklärt wird. Deswegen hätte
  ich ganz gerne gewusst, ob der Bundeskanzler es auch so sieht, dass am Freitag eine
  Übereinkunft zwischen den 27 EU-Staaten getroffen werden soll, und was seine Position
  ist, wer dann für die EU verhandeln sollte. Sie wissen ja, dass wir im ständigen
  Austausch mit unseren Partnern stehen. Deswegen wird es auch in Dublin sowohl morgen
  als auch übermorgen Gespräche darüber geben. Wir stimmen uns in diesen Fragen eng
  ab, im Rahmen der EPG, aber auch auf dem Europäischen Rat. Die Vertreter der E3
  hatten zuletzt auf ausdrückliche Bitte sowohl der Ukraine als auch der USA an den
  diversen Treffen zur Ukraine teilgenommen. Diese Einbindung begrüßen wir. Der europäische
  Beitrag oder der Beitrag der E3 war auch immer sichtbar. Er ist auch jetzt, nach
  der Verhandlung in Abu Dhabi, sichtbar. Insofern glaube ich, dass wir mit unseren
  europäischen Partnern auch weiterhin zu einem Konsens darüber kommen werden, wie
  wir sozusagen auch mit hoher Wirkkraft in den Verhandlungen auftreten können. Fährt
  denn die Bundesregierung mit der Vorstellung einer Person nach Dublin ‑ es gibt
  ja diverse Ideen dazu ‑, die dann vielleicht für Europa sprechen könnte? Sie sagten,
  die Bundesregierung bespreche das im Kreis der Partner. Gibt es denn seitens der
  Bundesregierung die Vorstellung, dass eine Person das am besten machen könnte? Wir
  haben immer wieder gesagt, dass der Kern der Verhandlungen zwischen der Ukraine
  und Russland stattfinden muss. Wir unterstützen die Ukraine als Europäer. Europa
  ist ein Zusammenschluss vieler Staaten und einiger Institutionen, die alle ihr eigenes
  Gewicht mit in diese Verhandlungen bringen. Deswegen wäre es geradezu eine eigene
  Schwächung, wenn wir diese Vielfalt, diese Kraft, die wir als Europa für unsere
  eigenen sicherheitspolitischen Interessen aufbringen, mutwillig verkürzen würden.
  Also, glaube ich, ist das Prinzip, das die Verhandlungen bisher geleitet hat, doch
  sehr sinnvoll, nämlich dass man sehr konzentriert an der Arbeit ist, aber auch sehr
  inklusiv. Das heißt, dass die Verhandlungsgruppen sozusagen atmend sind, dass eine
  Inklusivität stattfindet, eine Teilhabe, eine enge Unterrichtung und hohe Transparenz.
  Das wird nun auch in Dublin gelebt werden. Frau Singer, es geht um Befragungen von
  russischen Staatsbürgern im Rahmen der Einreise über den Flughafen Berlin-Brandenburg
  durch deutsche Behörden . Dabei sollen unter anderem Fragen zu politischen Themen
  gestellt worden sein, zum Beispiel: Wie stehen Sie zu den aktuellen Ereignissen
  in Ihrem Land? - Ich wüsste gerne, welches konkrete Ziel Sie bzw. die Behörden mit
  diesen Gesprächen verfolgen. Ich meine, dass Sie oder ein Kollege von Ihnen uns
  dazu auch schriftlich eine Anfrage gestellt haben, die wir bzw. die Bundespolizei
  beantwortet haben. Ich müsste das auf jeden Fall nachreichen, weil ich das aktuell
  nicht dabei habe. Ich habe sie nicht vorliegen. Aber Sie könnten die Frage jetzt
  nicht so beantworten? Das ist im Prinzip noch einmal eine Frage zum Haushalt, aber
  an Herrn Zimmermann vom Umweltministerium. Es geht um das Thema der Elektroautoförderung
  . Jetzt steht ja in der Bereinigungsvorlage des Finanzministeriums drin, dass die
  Haushaltsmittel für 2027 auf, glaube ich, 1,7 Milliarden Euro erhöht werden sollen.
  Der Förderdeckel liegt ja bei drei Milliarden, meine ich. Konkrete Frage: Warum
  werden die Haushaltsmittel für das folgende Jahr jetzt mehr als verdoppelt? Wie
  ist der Stand der Anträge? Haben Sie denn eine Hochrechnung, bis wann der Fördertopf
  dann erschöpft sein wird? Das waren jetzt mehrere gute Aspekte. Ich versuche, die
  einmal nacheinander abzuarbeiten. Zum einen, vor die Klammer gezogen: Die Haushaltsberatungen
  ‑ die waren ja auch schon ein Thema ‑ sind noch nicht abgeschlossen. Die Bereinigungssitzung
  wird erst morgen stattfinden. Aus Respekt vor diesen Beratungen ist unsere eiserne
  Regel, dass wir uns im Einzelnen nicht diesbezüglich einlassen. Insofern werde ich
  dann gerne am Freitag in der Regierungspressekonferenz noch einmal etwas besser
  für die Frage zur Verfügung stehen. Aber das heißt nicht, dass ich jetzt einfach
  nur abmeiere. Es ist richtig: Es ist sehr erfreulich, dass die Nachfrage nach der
  E-Auto-Förderung tatsächlich alle Erwartungen übertroffen hat. Insofern ist es gut,
  wenn jetzt die für den Bundeshaushalt zuständigen Abgeordneten beraten und an einer
  Lösung arbeiten, damit es dann im nächsten Jahr nicht zu Engpässen bei der Förderung
  kommt; so viel kann ich sagen. Ein Grund oder ein Aspekt dieser Nachfrage ist auch,
  dass wir sehen, dass tatsächlich auch die soziale Staffelung sehr, sehr gut funktioniert,
  was dann auch heißt, dass der einzelne Förderbescheid im Schnitt auch höher als
  in der ursprünglichen Konzeption erwartet ausfällt. Jetzt hätten Sie nach den konkreten
  Zahlen gefragt. Es ist ja vielleicht bekannt, dass es vom BAFA monatlich Statistiken
  gibt. Die stehen jetzt auch wieder ganz kurz bevor. Auch da bitte ich noch um ein
  ganz bisschen Geduld; dann haben Sie die neuesten Zahlen für den Vormonat. Was das
  Weitere betrifft, also Abschätzungen: Das ist ein dynamischer Prozess, der dann
  eben auch tatsächlich von den Faktoren abhängt, wie sich die Anträge jeden Monat
  entwickeln ‑ nicht nur von der Anzahl her, sondern eben auch qualitativ ‑ und wie
  hoch oder wie niedrig dann insofern der beantragte Förderbescheid ist. Sie haben
  recht: Das Programm ist von Anfang an mit einem klaren Gesamtvolumen aufgelegt worden,
  was also ein absehbares Ende und durch die hohe Nachfolge vielleicht auch früheres
  Ende betrifft. Dazu kann ich zum jetzigen Zeitpunkt nur sagen: Wir haben es selbstverständlich
  sehr genau im Blick, zu gegebener Zeit dann möglichst frühzeitig zu informieren,
  aber damit greife ich jetzt wirklich schon deutlich vor, damit Personen, die diese
  Anträge stellen, möglichst frühzeitige Planungssicherheit haben. So viel kann ich
  jetzt sagen. Ansonsten gilt, noch einmal: Sorry, am Freitag geht ein bisschen mehr.'
