title: 'Bundeskanzler Friedrich Merz zur Lage in Ceuta:'
text: '"Der Schutz der Außengrenzen der Europäischen Union ist entscheidend für die
  Bekämpfung illegaler Migration. Ich habe die klare Erwartung an alle EU-Mitgliedstaaten,
  dass sie dieser Pflicht nachkommen. Wir stehen dazu in Kontakt mit der spanischen
  Regierung. Spanien will und muss die Situation in Ceuta schnellstmöglich wieder
  in den Griff bekommen. Ich begrüße daher die spanische Absicht, die illegalen Migranten
  nicht auf den europäischen Kontinent zu lassen. Von Marokko erwarten wir, dass sie
  die illegalen Migranten unverzüglich wieder zurücknehmen. Es ist gut, dass die Europäische
  Kommission und Kommissar Magnus Brunner ihre Unterstützung hierfür zugesagt haben.
  Die im Juni verabschiedete Rückkehrverordnung muss nun unverzüglich und umfassend
  umgesetzt werden."'
