date: '2026-07-29'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 29. Juli 2026
text: 'Sprecherinnen und Sprecher •    stellvertretender Regierungssprecher Meyer
  •    Singer (BMI) •    Lenz (BMBFSFJ) •    Dr. Hosemann (BMJV) •    Lorenzat (BMWE)
  •    Köppl (BMUKN) •    Deschauer (AA) •    Harmsen (BMF) (Vorsitzende Buschow eröffnet
  die Pressekonferenz und begrüßt SRS Meyer sowie die Sprecherinnen und Sprecher der
  Ministerien.) Das Kabinett hat heute eine Sitzung gehabt, gearbeitet und einige
  Beschlüsse gefasst, über die ich Sie kurz informieren möchte. In der heutigen Sitzung
  hat die Bundesregierung den Entwurf eines Gesetzes zum Einsatz künstlicher Intelligenz
  in der Migrationsverwaltung beschlossen. Ziel des Gesetzes ist, asyl- und aufenthaltsrechtliche
  Verwaltungsverfahren effizienter, einheitlicher, qualitativ hochwertiger und sicherer
  zu gestalten. Der Entwurf beruht auf den im ersten Entlastungskabinett im November 2025
  von BMI und AA erarbeiteten Eckpunkten zum Einsatz künstlicher Intelligenz im Visumverfahren
  und in der Migrationsverwaltung. Mit dem Gesetz werden rechtliche Grundlagen für
  einen rechtssicheren und datenschutzkonformen Einsatz von KI-Technologien in der
  Anwendung zur automatisierten Datenverarbeitung in der Migrationsverwaltung geschaffen.
  Damit setzen wir ein weiteres Koalitionsvorhaben um und modernisieren die Verwaltungsprozesse.
  Dann kommen wir zum großen Thema der erneuerbaren Energien und des Netzpakets. Wir
  wollen bis 2030 80 Prozent des Stroms aus erneuerbaren Energien gewinnen. Das ist
  auch für die Unabhängigkeit von fossilen Energien zentral, wie wir in der derzeitigen
  Energiekrise der letzten Wochen erneut sehen. Mit dem Beschluss über einen Gesetzentwurf
  zum Erneuerbare-Energien-Gesetz zusammen mit dem Netzanschlusspaket gehen wir einen
  wichtigen Schritt hin zu diesem erklärten Ziel. Zunächst in aller Kürze zur EEG-Novelle:
  Die Ministerin hat sich meinen Infos zufolge auch heute schon zu beiden Gesetzesvorhaben
  geäußert. Die heute beschlossene Neufassung ist ein Meilenstein und bildet einen
  Systemwechsel bei der Förderung der erneuerbaren Energien, denn die erneuerbaren
  Energien sind im Zentrum unserer Stromversorgung angekommen. Jetzt geht es darum,
  den Ausbau kosteneffizienter und ökonomisch robuster zu machen, Überforderungen
  abzuschaffen und das Gesamtsystem in den Fokus zu rücken. Mit diesem Ziel wird das
  EEG konsequent weiterentwickelt, von einem umfassenden staatlichen Fördersystem
  hin zu einem marktbasierten, system- und netzdienlichen Investitionsrahmen. Der
  Ausbau soll in Zukunft stärker am Markt und durch effizienteste Anlagen erfolgen
  und damit kostengünstiger werden. In Zukunft werden alle neuen Energieanlagen ihren
  Strom direkt am Markt veräußern. Das ist ein Paradigmenwechsel, weil es dazu führt,
  dass Strom dann produziert wird, wenn er besonders gebraucht wird. Damit zusammenhängend
  hat das Kabinett heute das Netzanschlusspaket des BMWE beschlossen. Mit dem Gesetzentwurf
  will die Bundesregierung den Ausbau von erneuerbaren Energien besser mit dem Ausbau
  der Stromnetze synchronisieren. Die Investitionsbedingungen für Investoren in erneuerbare
  Energien bleiben verlässlich. Sie werden in Zukunft aber Anreize erhalten, bei der
  Standortwahl die Netzsituation und die Entwicklung des Netzausbaus zu berücksichtigen.
  Damit wird erstmals eine räumliche Steuerung des Zubaus eingeführt, die den Ausbau
  der erneuerbaren Energien in Regionen lenkt, in denen diese auch aufgenommen werden
  können. Das senkt die Kosten für das sogenannte Engpassmanagement und damit den
  Anstieg der Netzentgelte. Davon profitieren letztlich dann auch alle Stromverbraucherinnen
  und ‑verbraucher. Mit dem Netzanschlusspaket soll zudem das Netzanschlussverfahren
  insgesamt neu aufgestellt werden. Der Entwurf beschränkt sich daher nicht auf die
  Priorisierung von Netzanschlüssen, sondern fordert gleichermaßen Prozessverbesserungen
  von den Netzbetreibern ein. Dabei setzen wir auf mehr Transparenz, mehr Digitalisierung
  und mehr Verbindlichkeit. Die beiden heute beschlossenen Gesetze bilden, wie schon
  gesagt, einen Systemwechsel bei der Ausgestaltung der Energiewende und richten sie
  wieder konsequent auf Bezahlbarkeit, Kosteneffizienz und Versorgungssicherheit aus.
  Wir wollen damit die Klimaziele Deutschlands verlässlich erreichen und den Wirtschaftsstandort
  zukunftssicher machen. Weiterhin wurde heute eine Novelle des Elektromobilitätsgesetzes
  beschlossen. Das Elektromobilitätsgesetz besteht seit 2025. Es schafft bestimmte
  Privilegien für E-Fahrzeuge. Kommunen können für sie beispielsweise eigene, gebührenfreie
  Parkplätze bereitstellen oder die Nutzung von Busspuren für E-Fahrzeuge ermöglichen.
  Die Bundesregierung erhöht so die Attraktivität von E-Fahrzeugen und unterstützt
  den Umstieg auf klimafreundliche Mobilität. Das trägt dazu bei, die Klimaziele zu
  erreichen und die Luftqualität in den Kommunen zu verbessern. Die Bundesregierung
  will darüber hinaus die Arbeitsbedingungen für Wissenschaftlerinnen und Wissenschaftler
  verbessern. Dafür hat sie Änderungen des Gesetzes zur Modernisierung des Befristungsrechts
  für die Wissenschaft im Kabinett beschlossen, mit dem Ziel, mehr Verlässlichkeit,
  Planbarkeit und Transparenz für Wissenschaftlerinnen und Wissenschaftler in frühen
  Karrierephasen und auch für Studierende zu schaffen, angemessene Vertragslaufzeiten
  zu gewährleisten und die Vereinbarkeit von Beruf und Familie zu verbessern. Ich
  nenne hier ein paar Beispiele: Erstmals werden Mindestvertragslaufzeiten für Erstverträge
  eingeführt. Diese sollen künftig vor der Promotion drei Jahre und in der Phase nach
  der Promotion zwei Jahre betragen. Außerdem werden Schutzmechanismen auf bestimmte
  Beschäftigte ausgeweitet, deren Stelle sich aus Drittmitteln finanziert. So sind
  Vertragsverlängerungen insbesondere bei Mutterschutz und Elternzeit künftig möglich.
  Das gilt für Beschäftigungen nach dem Wissenschaftszeitvertragsgesetz. Für Wissenschaftlerinnen
  und Wissenschaftler, die Angehörige pflegen, soll die maximale Befristung während
  der wissenschaftlichen Qualifizierung um jeweils zwei Jahre vor und nach der Promotion
  erhöht werden. Damit wird der wachsenden gesamtgesellschaftlichen Bedeutung der
  Pflege Rechnung getragen. Für studentische Hilfskräfte soll außerdem die Höchstbefristungsdauer
  von sechs auf acht Jahre erhöht werden. Das bedeutet mehr Planungssicherheit, vor
  allem für die Prüfungsphase. ‑ Die Bundesregierung setzt damit ein wichtiges Anliegen
  aus dem Koalitionsvertrag um, damit der Innovationsstandort Deutschland attraktiv,
  stark und wettbewerbsfähig bleibt. So weit waren dies die entscheidenden Beschlüsse
  aus der heutigen Kabinettssitzung. (zum Entwurf eines Gesetzes zum Einsatz künstlicher
  Intelligenz in der Migrationsverwaltung) Ich weiß nicht, welches das federführende
  Ministerium ist. Welches KI-Modell oder welche KI-Modelle werden vom BAMF dann verwendet?
  Ich kann Ihnen nicht sagen, welches genau dafür verwendet wird. Soviel ich weiß,
  sind es eigens entwickelte KI-Modelle. Vielleicht können Sie uns dann noch sagen,
  welche es sind. Sind sie aus Deutschland? Sind es deutsche KI-Modelle? Ich gehe
  davon aus. Ich kann es aber natürlich noch nachreichen, wenn Sie es genau wissen
  wollen. (zum Entwurf eines Gesetzes zur Änderung der Bevorrechtigung der Verwendung
  elektrisch betriebener Fahrzeuge) Was genau ist bei der E-Mobilitäts-Geschichte
  neu? Das, was Sie aufzählten, existiert schon, wenn ich es richtig verstanden habe.
  Es geht hierbei insbesondere um die Verlängerung beziehungsweise Teilentfristung
  und in manchen Bereichen auch komplette Entfristung von Vorgaben. Das heißt, dafür
  gab es bisher sozusagen ein Enddatum. So nenne ich es jetzt einmal. An verschiedenen
  Stellen wurden die Dinge jetzt entfristet. Das hat sich in der Vergangenheit gut
  bewährt. Das kann ich dazu sagen. Vielleicht mag das BMV aber auch noch ergänzen.
  Gut, dann noch einmal: Es geht vor allen Dingen darum, bestimmte Vorgaben zu entfristen
  und zu verlängern. Es war eine besondere Kabinettssitzung. Was können Sie uns über
  den atmosphärischen Verlauf schildern? Einerseits kann ich sagen, dass die Kabinettssitzung
  natürlich auch noch sehr stark im Zeichen des schrecklichen Anschlags auf den Christopher
  Street Day am Wochenende stand. Minister Dobrindt hat dort auch länger zum Stand
  der Ermittlungen berichtet und Überlegungen zu weiteren Schritten geteilt. Das war
  auch für das Kabinett noch einmal ein wirklich sehr emotionaler Moment. Auch der
  Bundeskanzler hat noch einmal von Sonntag berichtet, auch vom Gedenkgottesdienst,
  der stattgefunden hat. Es war also ein wichtiges Thema in der Kabinettssitzung.
  Darüber hinaus wurden natürlich auch einige Mitglieder des Kabinetts verabschiedet.
  Das hat der Bundeskanzler dann auch entsprechend getan. Er hat den Ministerinnen
  und Ministern, die das Kabinett verlassen, und auch den Staatsministerinnen und
  ‑ministern sehr für ihre geleistete Arbeit in der vergangenen Zeit von etwas mehr
  als einem Jahr gedankt. Er hat gleichzeitig unter anderem auch Frau Warken, die
  jetzt ja vom Gesundheitsministerium auf den Chefposten des Bundeskanzleramts wechselt,
  mitgeteilt, dass er sich auf eine gute Zusammenarbeit freue, und insbesondere auch
  Herrn Frei für die sehr intensive Arbeit im vergangenen Jahr gedankt. Herr Lenz,
  die Ministerin hat sich in einem Interview mit der dpa zu einem Schwerpunkt geäußert,
  den sie als Reaktion auf den Anschlag auf den CSD in Berlin setzen will. Sie hat
  von fünf Millionen Euro zusätzlich für Deradikalisierungsmaßnahmen gesprochen. Mir
  ist nicht ganz klar, woher genau das Geld kommt beziehungsweise wo es weggenommen
  werden könnte. Hat sie dabei konkretere Vorstellungen? Das Geld wird nirgendwo weggenommen,
  sondern es handelt sich hierbei um Geld, das einfach noch nicht abgerufen wurde.
  Es ist auch eine normale Sache, dass Mittel aus unterschiedlichen Gründen auch mal
  nicht in Anspruch genommen werden: weil Projekte nicht umgesetzt wurden oder weil
  Mittel nicht abgerufen wurden. Es ist Geld aus dem Topf „Demokratie leben!“, das
  im Moment aber noch nicht gebunden ist. Es kommt also sozusagen aus der Förderperiode 2026?
  Genau, es handelt sich jetzt erst einmal um die Förderperiode 2026. Das heißt, es
  ist Geld, das sonst zum Ende des Jahres verfallen würde. Dafür hat die Ministerin
  jetzt die Idee ins Spiel gebracht, es für Deradikalisierungsprogramme zu nutzen.
  Dazu hat sie sich ja auch bei der dpa geäußert. Diese Programme sind ‑ das wissen
  wir ‑ sehr wirksam, können sehr wirksam sein. Es gibt auch schon verschiedene Programme
  im Bereich „Demokratie leben!“, des Bundesprogramms. Gerade im Strafvollzug, gibt
  es sehr erfolgreiche Programme. Die Idee ist, diese Programme jetzt noch weiter
  zu stützen. Es werden viele Queerprojekte gekürzt. Können Sie uns sagen, wie viel
  dabei jetzt gekürzt wird? Ich weiß nicht, welche Projekte Sie meinen. Im Rahmen
  von „Demokratie leben!“, Lambda usw. Lambda läuft nicht über „Demokratie leben!“.
  Aber was richtig ist, ist, dass wir das Programm umstrukturieren. Es sind Innovationsprojekte,
  die zum Ende des Jahres auslaufen. Aber daran wird bislang nichts gekürzt, sondern
  alle können sich auch anhand der neuen Förderrichtlinie neu bewerben. Die Förderrichtlinie
  liegt inzwischen vor, beziehungsweise sie ist noch nicht veröffentlicht, wohl aber
  die Förderaufrufe, in denen eben auch alles dazu steht, welche Förderkriterien man
  ab 2027 erfüllen muss. Darauf können sich im Moment alle bewerben. Aber dass es
  jetzt eine neue Förderung von Queerprojekten gibt, ist angesichts der Bedrohung
  der Queercommunity und auch der queerfeindlichen Politik der Ministerin nicht in
  Aussicht? Ich habe diese Unterstellung auch am Montag schon einmal zurückgewiesen.
  Ich glaube, die Ministerin hat es auch bei der dpa deutlich gemacht: Der Bereich
  gruppenbezogener Menschenfeindlichkeit ist ein ganz wesentlicher, gerade auch im
  Bereich von „Demokratie leben!“. Dazu gehört natürlich auch die queere Community. ‑
  Aber dazu habe ich mich am Montag ja breit geäußert. Es gibt, wie gesagt, Geld,
  das im Moment noch nicht abgerufen wurde, und es gibt Überlegungen dazu, was mit
  diesem Geld passieren kann. Ich habe eine Frage zur FIFA an Herrn Meyer. Es gibt
  ja Berichte darüber, dass die FIFA einen Teil der künftigen Fußball-Weltmeisterschaften
  versteigern und verkaufen will. Dagegen gibt es jetzt Protest. Ich wüsste ganz gern,
  wie die Position der Bundesregierung dazu ist. Wir haben die Berichte dazu in der
  Tat zur Kenntnis genommen. Die Entscheidungen über die Organisation und Vermarktung
  sportlicher Wettbewerbe liegen natürlich in der Verantwortung der Sportverbände.
  Dabei respektiert die Bundesregierung selbstverständlich auch die Autonomie des
  Sports und die Unabhängigkeit der Sportverbände, die wirklich ein hohes Gut sind.
  Unabhängig davon gilt, dass Sport eine herausragende gesellschaftliche Bedeutung
  hat. Bei allen wirtschaftlichen Interessen sollte deshalb auch künftig gewährleistet
  bleiben, dass große Sportereignisse für die Fans zugänglich und ihre besondere gesellschaftliche
  und verbindende Wirkung erhalten bleiben. Das ist uns in der Betrachtung dieser
  Entwicklung besonders wichtig. Ansonsten noch einmal: Die Sportverbände handeln
  dabei natürlich autonom. Offenbar ist ja der Einstieg von Investoren aus der Trump-Kushner-Familie
  geplant. Würden Sie sagen, dass das aus Sicht der Bundesregierung akzeptabel ist?
  Wie gesagt, ist es nicht an uns, Entscheidungen der FIFA hier als akzeptabel oder
  nicht akzeptabel zu qualifizieren. Ich glaube, was uns generell wichtig ist, mit
  Blick auf die Bedeutung des Sports, auch die Breitenwirkung des Sports, auch auf
  die Zugänglichkeit des Sports ‑ ‑ ‑ Das ist für uns entscheidend. So blicken wir
  auch auf mögliche oder etwaige Entscheidungen, die anstehen. Herr Meyer, wer kümmert
  sich denn seit heute, 12 Uhr, und künftig um den Bereich des Sports und des Ehrenamts
  im Bundeskanzleramt? Ich weiß natürlich, worauf Sie anspielen. Der Bundeskanzler
  hat ja auch angekündigt, über die Nachfolge von Frau Schenderlein zeitnah Entscheidungen
  zu treffen. Sie können sich aber sicher sein ‑ das kann auch der deutsche Sport
  und auch der internationale Sport ‑, dass wir in dem Bereich, der dann auch ins
  Kanzleramt gegangen ist, natürlich bestehende Strukturen mit Ansprechpartnern in
  der Verwaltung haben. Insofern sind die Ansprechpartner dafür völlig klar. (zu Überlegungen
  zum Verkauf von Anteilen an Weltmeisterschaften der FIFA) Noch einmal zu dem Investoreneinstieg:
  In der Vergangenheit, bei der letzten WM zum Beispiel, gab es ja auch Steuerbefreiungen,
  also dass die FIFA dann weniger oder gar keine Steuern zahlen musste. Wie hätte
  solch ein Investoreneinstieg denn vor dem Hintergrund, dass sich der DFB 2038 oder
  2042, glaube ich, auch wieder für eine WM bewerben will, darauf Auswirkungen? Wir
  haben Medienberichte gesehen. Nach unserem Verständnis stehen Entscheidungen dazu
  noch aus; es gibt bisher nur Berichte. Ich habe dazu gerade ein bisschen gesagt,
  wie wir darauf blicken. Aber jetzt sozusagen Wenn-dann-Konstruktionen zu bauen,
  das würde ich an dieser Stelle nicht tun. Wir müssen jetzt erst einmal abwarten,
  ob es dabei überhaupt zu Entscheidungen kommt. Ich frage noch einmal zu dem nach,
  was Sie vorhin gesagt haben: Solange der Zugang für die breite Öffentlichkeit gewährt
  ist, ist das okay. Habe ich Sie richtig verstanden? Noch einmal: Es gibt eine Autonomie
  des Sports. ‑ Es hat auch gute Gründe, dass sich die Politik nicht in Entscheidungen
  von Sportverbänden einmischt. Es hat wirklich gute Gründe. Das halten wir auch hoch.
  Wir wollen es auch schützen. Deshalb liegen die Entscheidungen über Investoren,
  über die Vergabe von Fernsehverträgen oder über das, was sonst ansteht, ein bisschen
  aber auch zu Sportgerichtsbarkeitsentscheidungen, in der Autonomie des Sports. Deshalb
  halten wir uns dabei grundsätzlich heraus. Natürlich haben wir trotzdem Erwartungen.
  Wir formulieren diese natürlich auch. Das habe ich gerade getan, indem ich gesagt
  habe: Es geht um Zugang. Es geht um Breitenwirkung. Es geht auch um Bezahlbarkeit. ‑
  Das sind Dinge, die uns natürlich wichtig sind. Ich habe nicht ganz verstanden,
  wie die Autonomie des Sports mit dem potenziellen Verkauf von Anteilen an private
  Investoren zusammenpassen soll. Dabei wird Autonomie ja quasi anteilig verkauft.
  Das ist genau die Diskussion, der sich auch die FIFA dann sicherlich stellen muss.
  Wie gesagt, habe ich das, was wir als Bundesregierung dazu sagen wollen, gerade
  gesagt. Bleiben Sie angesichts der massiven Korruption innerhalb von IOC und FIFA
  dabei, dass die Autonomie des Sports außerhalb der sogenannten Politik beibehalten
  werden soll? Sie können sich ja offenbar nicht selbst kontrollieren. Wir halten
  die Autonomie des Sports aus nachvollziehbaren Gründen für richtig. Die Wortwahl
  von Ihnen kann ich mir auch nicht zu eigen machen. Aber noch einmal: Ich glaube,
  dafür gibt es gute Gründe, und das wollen wir auch schützen. Trotzdem haben wir
  natürlich eine Haltung zu bestimmten Fragen, weil Sport auch gesellschaftlich eine
  wichtige Rolle spielt. Frau Singer, noch einmal zu den erfolgten Abschiebungen nach
  Afghanistan: Es ist ja zum ersten Mal auch eine nicht straffällig gewordene Person
  dabei. Was ist das für eine Person? Was heißt es, wenn über diese Person von amtlicher
  Seite gesagt wird, es gebe deutliche Auffälligkeiten? Ich möchte noch einmal ganz
  grundsätzlich sagen, dass die Bundesregierung im Koalitionsvertrag festgehalten
  hat, dass Rückführungen nach Syrien und Afghanistan wieder möglich sein werden,
  beginnend mit Straftätern und Gefährdern. An dieser Priorisierung hat sich jetzt
  auch erst einmal nichts geändert. Die Bundesregierung schafft die Rahmenbedingungen
  für die Rückführungen, auch für die Rückführung nach Afghanistan. Für die Rückführungen
  selbst sind aber, wie Sie wissen, die Länder zuständig. Die Länder können entscheiden,
  dass auch Nichtstraftäter auf diesen Abschiebeflügen sind. Das war gestern bei dem
  Charterflug der Fall. Dort war eine solche Person dabei. Zu dem Einzelfall kann
  ich mich leider nicht äußern. Was heißt das alles denn, wenn noch einmal nach Afghanistan
  abgeschoben wird? Können Sie den Stand der Beziehungen zu den Taliban beschreiben?
  Ist innerhalb der EU abgestimmt, welchen Kurs Deutschland dabei fährt? Gibt es von
  deutscher Seite irgendwelche Gegenleistungen dafür, dass Afghanistan in erster Linie
  straffällig Gewordene zurücknimmt? Das Thema hatten wir hier schon öfter, aber ich
  kann es gern noch einmal sagen. Es gab Gespräche auf technischer Ebene zwischen
  den De-facto-Behörden der Afghanen und den deutschen Behörden. Das sind Vereinbarungen
  auf technischer Ebene, also zum operativen Rückführungsgeschehen. Dabei geht es
  etwa darum, wie viele Flüge möglich sind und wo die Flugzeuge landen. Um solche
  operativen Fragen geht es. Es ist auch aktuell der Stand, dass es diese Gespräche
  auf technischer Ebene gab. Es gibt dazu keine weiteren Vereinbarungen. Nur eine
  Verständnisfrage: Wie passt denn der Kampf des Ministers gegen Islamismus mit der
  De-facto-Zusammenarbeit mit Islamisten in Kabul zusammen? Der Minister arbeitet
  ja nicht mit Terroristen oder Islamisten zusammen. Das ist keine Zusammenarbeit
  mit den Taliban. Es ist auf behördlicher Seite eine Vereinbarung, die getroffen
  wurde, um Rückführungen möglich zu machen. Das ist eine Umsetzung dessen, was im
  Koalitionsvertrag steht. Aber in Kabul regieren die Taliban. Mit ihnen führt man
  technische Gespräche, damit Menschen nach Afghanistan zurückgeführt werden. Das
  ist eine De-facto-Kooperation. Gleichzeitig versucht man hier, Islamisten zu bekämpfen.
  Wie passt das zusammen? Das sind erst einmal Gespräche auf einer technischen Ebene.
  Ich habe es gerade schon erklärt. Dabei werden operative Maßnahmen besprochen. Es
  geht darum, den Auftrag aus dem Koalitionsvertrag umzusetzen und Rückführungen nach
  Afghanistan zu ermöglichen. Die Bundesregierung arbeitet mit Repräsentanten des
  Talibanregimes zusammen, die in Bonn und Berlin sitzen und, von Kabul aus gesehen,
  offizielle Vertreter dieses Regimes sind. Anknüpfend an die Frage des Kollegen:
  Wie ist das erklärlich? Die Gespräche zu den operativen Rückführungsmaßnahmen, die
  auf technischer Ebene stattgefunden haben, haben mit Vertretern der De-facto-Behörden
  aus Afghanistan stattgefunden. Ich vermute, Ihre Frage zielt auf die Konsularbeamten
  ab, die sich in Deutschland befinden. Dazu kann ich Ihnen von Seiten des BMI aus
  keine Auskunft geben. Aber Sie erkennen an, dass das Abgesandte des Talibanregimes
  in Kabul sind, oder? Die Anerkennung findet nicht über das BMI statt. Ich wüsste
  gern, ob diese Ausweitung der Rückführung innerhalb der Bundesregierung umstritten
  ist oder nicht. Ist die Justizministerin damit einverstanden, dass jetzt auch Personen
  zurückgeführt werden, die nicht Straftäter waren? Ich würde hier ganz generell keine
  Exekutivmaßnahmen anderer Ressorts kommentieren. Das soll aber auch nicht so klingen,
  als ob ich sozusagen ‑ ‑ ‑ Ich möchte mich dazu gar nicht verhalten. Ich kann vielleicht
  noch etwas ergänzen. Es geht dabei darum, das geltende Recht umzusetzen. Wenn eine
  Person vollziehbar ausreisepflichtig ist und einer Abschiebung nichts entgegensteht,
  dann wird sie durchgeführt. Dadurch, dass es möglich ist, jetzt Personen auch nach
  Afghanistan zurückzuführen, geht es wirklich schlicht um die Durchsetzung geltenden
  Rechts. Frau Singer, Sie haben am Anfang gesagt, dass es bei der Priorität „erst
  Straftäter, dann andere“ bleiben soll. So zumindest habe ich Sie verstanden. Können
  Sie uns eine Größenordnung geben? Neigt sich die Zahl der rückzuführenden Straftäter
  dem Ende zu, sodass man jetzt auf die wesentlich größere Gruppe umsteigt? Vielleicht
  haben Sie dazu Zahlen? Dazu kann ich Ihnen leider keine Informationen geben, weil
  die Rückführungen, wie Sie wissen, in der Hand der Länder liegen. Das heißt, die
  einzelnen Länder suchen die Personen aus und stellen sie zur Verfügung, und der
  Bund unterstützt bei den Rückführungen. Sie haben gerade darauf hingewiesen, dass
  es rechtlich möglich ist abzuschieben. Nur weil es möglich ist, muss man das ja
  nicht machen. Angesichts der Gefahren des Islamismus hierzulande könnte doch ein
  Überdenken stattfinden. Das ist für den Minister, der einerseits Islamismus bekämpfen
  will, aber gleichzeitig mit Islamisten kooperiert, keine Option, richtig? Sie fragen
  danach, ob das möglich ist. Ja, es ist möglich. Im Asylsystem funktioniert es so,
  dass jeder Einzelfall angeschaut und dass dann geprüft wird, ob es möglich ist,
  die Person zurückzuführen, ob sie einen Schutzgrund hat, ob es ein Abschiebungsverbot
  gibt usw. Erst dann wird festgestellt, ob diese Person vollziehbar ausreisepflichtig
  ist. Wenn sie das ist, dann kann sie zurückgeführt werden. Es war ja nicht die Frage
  nach den einzelnen Personen, sondern nach der Kooperation der Bundesregierung im
  Namen der Länder mit den Taliban in Kabul. Ich denke, dazu habe ich mich gerade
  ausführlich geäußert. Herr Meyer, könnten Sie das für die Bundesregierung noch einmal
  erklären? Der Kanzler steht also dahinter, einerseits islamistischen Terror in Deutschland
  zu verurteilen und andererseits gleichzeitig mit islamistischen Taliban in Kabul
  zu kooperieren. Steht der Kanzler dahinter? Diese Art der Interpretation mache ich
  mir einfach nicht zu eigen. In der Sache, über die wir gerade gesprochen haben,
  habe ich den Ausführungen des Innenministeriums nichts hinzuzufügen. Ich habe eine
  Frage an das Wirtschaftsministerium zum Thema der Ölpreise, die heute wieder gestiegen
  sind. Die Frage wurde schon einmal gestellt, muss aber angesichts der Veränderungen
  immer wieder gestellt werden. Gibt es bei Ihnen Überlegungen, möglicherweise doch
  wieder eine Entlastung für Bürger hinsichtlich der Benzinpreise zu planen? Wichtig
  zu betonen ist mir in dem Zusammenhang, dass es keine physischen Energieknappheiten
  gibt. Die Versorgungslage mit Rohöl und Rohölprodukten ist in Europa und Deutschland
  derzeit sichergestellt und gibt keinen Anlass zur Sorge. Wir beobachten das natürlich
  engmaschig. Mit Blick auf die Entwicklung der Kraftstoffpreise ist zu berücksichtigen,
  dass die Entwicklung des Rohölpreises auf dem Weltmarkt, aber natürlich auch wettbewerbliche
  Strukturen darauf Einfluss haben. In der Tat sind seit Mitte Juli im Zusammenhang
  mit weiteren Kampfhandlungen im Nahen Osten Preissteigerungen, aber auch wieder
  temporäre Rückgänge wie vor, glaube ich, zwei Tagen zu beobachten. Die Lage entwickelt
  sich stetig. Wir beobachten das engmaschig und haben ja auch Maßnahmen wie beispielsweise
  die Zwölfuhrregelung über das Bundeskartellamt, die weiterhin läuft und zu mehr
  Transparenz und Verlässlichkeit für die Verbraucher führt. Herr Meyer, es gibt Forderungen,
  und zwar, wenn ich es richtig sehe, auch des Finanzministeriums und der Grünen,
  eine Übergewinnsteuer für die Mineralölkonzerne einzuführen. Gibt es in der Bundesregierung
  insgesamt Gespräche darüber, diesen Schritt zu gehen, auch angesichts des neuerlichen
  Anstiegs der Benzinpreise? Erst einmal möchte ich noch einmal darauf hinweisen,
  dass die Marktentwicklungen und auch die Ölpreisentwicklungen aufgrund der Entwicklung
  insbesondere im Iran, aber auch aufgrund anderer geopolitischer Entwicklung teilweise
  gerade sehr sprunghaft sind. Zur konkreten Frage nach einer Übergewinnsteuer: Der
  Bundeskanzler hat sich mehrfach dazu geäußert. Er ist grundsätzlich offen für die
  Diskussion, sieht aber auch steuerrechtliche und verfassungsrechtliche Risiken.
  Zum Beispiel kann das von betroffenen Unternehmen durchgängig vor Gericht angefochten
  werden und ist auch angefochten worden. Derzeit laufen Gerichtsverfahren zum EU-Energiekrisenbeitrag,
  der damals erhoben wurde. Insofern prüfen wir alle Möglichkeiten, wie wir kartellrechtlich
  und steuerrechtlich abgesichert gegenüber den Mineralölwirtschaftsunternehmen Maßnahmen
  treffen können. Noch einmal: Es gibt eine grundsätzliche Offenheit dafür, aber eben
  auch eine Reihe von offenen Fragen, die zunächst geklärt werden müssen. Wenn Sie
  alle Optionen prüfen ‑ so habe ich es gerade verstanden ‑, prüfen Sie dann auch
  die Möglichkeit von Preiskontrollen? Grundsätzlich prüfen wir fortlaufend, wie wir
  auf die aktuelle Lage reagieren. Das tut das Wirtschaftsministerium; das tun wir
  aber auch in unterschiedlichen Kontexten innerhalb der Regierung. Für uns hat die
  Energiesicherheit und auch die Verfügbarkeit von Energie allerhöchste Priorität.
  Dafür haben wir ein sehr enges Monitoring aufgesetzt, über das wir zu jeder Zeit
  sehen können, ob es zu Knappheiten kommen kann, ja oder nein. Dementsprechend beobachten
  wir die Lage weiterhin und sind grundsätzlich natürlich auch jederzeit handlungsfähig,
  wenn es notwendig ist. Es wäre etwas Neues, wenn jetzt die Einführung von Preiskontrollen
  vom BMWE zumindest geprüft würde. Sie wären legal, korrekt? Sie meinen sozusagen
  das Luxemburger Modell? … (ohne Mikrofon, akustisch unverständlich) Es gab eine
  Initiative im Bundesrat. Sie hat aber auch im Bundesrat keine Mehrheit gefunden.
  Der Vorschlag hatte sich am Luxemburger Modell orientiert. Dort gibt es staatliche
  Maximalpreise. Man muss dabei aber beachten, dass Luxemburg anders als Deutschland
  keine eigenen Raffinerien hat, sondern seine Kraftstoffe weit überwiegend aus dem
  Raum Antwerpen, Rotterdam, Amsterdam bezieht und auch ein sehr kleines Land ist.
  Das ist kein Modell, das sich so ohne Weiteres übertragen ließe. Gibt es weitere
  Fragen zu dem Thema? ‑ Das sehe ich nicht. Herr Kollege, ich fürchte, es hilft Ihnen
  keiner. Die Regel ist die Regel. Dann würde ich gern ‑ ‑ ‑ Ich mache jetzt trotzdem
  mit dem nächsten Thema weiter. Ich will noch einmal auf den CSD zurückkommen. Wir
  beobachten ein bisschen, was auch online passiert. Da häufen sich ziemlich unschöne
  Kommentare. Ich möchte kurz zwei vorlesen ‑ es sind nicht meine Worte ‑: Kein großer
  Verlust, waren eh nur psychisch Kranke. Ich scheiße auf Mitgefühl. AfD wählen und
  nicht rumweinen. ‑ Es gibt auch noch Schlimmeres. An den Regierungssprecher: Was
  halten Sie von derartigen Äußerungen? An das BMI: Inwieweit muss man auch damit
  umgehen und vielleicht noch einmal nachschärfen? Ich werde die Kommentare, die Sie
  vorgelesen haben, nicht kommentieren. Solche Kommentare möchte ich nicht mit einem
  Kommentar seitens der Bundesregierung adeln. Aber ich will schon noch einmal in
  aller Deutlichkeit sagen: Der feige islamistische Anschlag auf friedlich feiernde
  Menschen beim Berliner CSD vergangenen Samstag war gezielt gegen die queere Gemeinschaft
  gerichtet. Er zielt auf eine Community, ein Lebensgefühl und auf alles, was dieser
  Attentäter offensichtlich verabscheut hat. Es war eine Tat des Hasses. Wir haben
  als Bundesregierung unser Mitgefühl mit den Opfern, mit der Verstorbenen, auch mit
  vielen Betroffenen, aber auch mit der gesamten queeren Community, die natürlich
  in Angst ist und die auch verunsichert ist, sehr deutlich gemacht. Das werden wir
  auch an jeder Stelle tun. Das kann ich seitens des BMI nur unterstreichen. Ich habe
  noch eine Frage ans Innenministerium dazu. Das Instrument der Fußfessel wird immer
  öfter gefordert, auch vom Minister. Die Überwachungsstelle sitzt in Hessen. Die
  letzte Information war, dass sie kolossal überfordert sei und es dort an Personal
  fehle. Meine Frage ist: Wenn die Fußfessel für terroristische Gefährder käme, würde
  sie dann auch von Hessen aus überwacht werden? Wie wäre das Prozedere an der Stelle?
  Der Bundesinnenminister hat sich dazu ausführlich geäußert. Gestern hat er dazu
  Stellung genommen und alle drei Maßnahmen, die er vorgeschlagen hat, unter anderem
  die Fußfessel, kommentiert. Zu all diesen Vorschlägen laufen Gespräche mit den Kabinettskolleginnen
  und ‑kollegen. Wir schauen jetzt auf die nächsten Schritte, was die gesetzgeberischen
  Maßnahmen betrifft. Ich habe gestern gelernt, dass es zum Beispiel in Berlin schon
  eine entsprechende Regelung auf Landesebene gibt. Haben Sie zufällig einen Überblick,
  ob es das in anderen Ländern auch schon gibt und ob es da vielleicht sogar schon
  Rechtslagen gibt, die man anwenden könnte, die aber bis jetzt nicht angewendet worden
  sind? Haben Sie konkret den Fall Berlin prüfen können? Es ist korrekt, dass das
  grundsätzlich in der Zuständigkeit der Länder liegt. Weitere Informationen kann
  ich Ihnen dazu zum aktuellen Zeitpunkt nicht geben. Ich würde nur gern die Aussage,
  dass die gemeinsame Überwachungsstelle der Länder kolossal überfordert sei, nicht
  so stehen lassen. Das ist natürlich keine Einrichtung der Bundesregierung, sondern
  eine Einrichtung der Länder, die auf einem Staatsvertrag beruht. Sie soll weiter
  ausgebaut werden. Aber ich denke, der Befund sollte nicht so stehenbleiben, ganz
  unabhängig von der aktuellen Diskussion. Die gemeinsame Überwachungsstelle ist zum
  Beispiel auch für die Überwachung der Fußfesseln im Kontext von Partnerschaftsgewalt
  vorgesehen, die vom Deutschen Bundestag beschlossen wurde. Die Stelle ist aus Sicht
  der Bundesregierung sehr gut geeignet, um Fußfesseln zu überwachen, und wird deswegen
  auch weiter ausgebaut. Die Auskunft von vor Ort ist: Es gibt 30 Stellen; sie brauchen
  400 Stellen. ‑ Das Inkrafttreten des Gesetzes ist extra deswegen auf den 1. Januar
  2027 verschoben worden. Das war also keine aus der Luft gegriffene Behauptung, sondern
  eine Auskunft des Ministeriums. Im Augenblick gibt es 30 Stellen, aber es kommt
  eine erhebliche Anzahl Stellen hinzu. Das ist bereits fix. Herr Meyer, nach der
  Kabinettsumbildung soll die Vereidigung der Minister vor dem Bundestag nun in der
  ersten Sitzung nach der Sommerpause stattfinden. Der Kanzler hat sich aber vorher
  dahin gehend geäußert, dass auch die Kostenfrage ein Punkt sei, der für diesen Termin
  spreche, um nicht extra eine Sondersitzung einzuberufen. Mit welchen Kosten hat
  die Bundesregierung für solch eine Sondersitzung gerechnet? Die möglichen Kosten
  kann ich nicht genau beziffern. Es gab, denke ich, einen vergleichbaren Fall vor
  einigen Jahren, in dem es um die Vereidigung von Frau Kramp-Karrenbauer ging. Damals
  gab es, denke ich, eine Antwort auf eine parlamentarische Anfrage, in der die Kosten
  beziffert wurden. Das ist zwar schon einige Zeit her, kann aber vielleicht als Größenordnung
  gelten. Ich will auch noch darauf hinweisen, dass wir uns bei dieser Entscheidung
  auf eine Rechtseinschätzung berufen. Das Argument der Kosten hat der Bundeskanzler
  als eines von mehreren Argumenten für diese Vorgehensweise genannt. Herr Meyer,
  der Kanzler hat auch gesagt, es sei geprüft worden, dass es rechtens sei, dass ein
  relativ großer Zeitraum zwischen Ernennung und Vereidigung liege. Wer hat das geprüft?
  Waren es die Juristen im Kanzleramt? Waren auch die Verfassungsressorts beteiligt?
  Ist das also eine gemeinsame, innerhalb der Bundesregierung abgestimmte Prüfung?
  Ich würde dazu, ehrlich gesagt, auf die Regierungspressekonferenz hier am Montag
  verweisen. Da war das schon sehr ausführlich Thema. Herr Kornelius hat dazu hier,
  denke ich, in allen Facetten Stellung genommen. Dem habe ich hier gar nichts hinzuzufügen.
  Der Bundesumweltminister hat angekündigt, dass das Naturinfrastrukturgesetz bis
  Ende Juli komme. Jetzt ist die letzte Kabinettssitzung im Juli quasi vergangen,
  ohne dass das Gesetz durch das Kabinett verabschiedet wurde. Wann kommt es, und
  woran liegt es, dass es noch nicht durch das Kabinett gekommen ist? Ich würde gern
  vorwegschicken: Bei dem Gesetz zur Stärkung der natürlichen Infrastruktur geht es
  darum, besonders bedeutsame Naturflächen zu erhalten oder wiederherzustellen. Auch
  mit Blick auf aktuelle Extremwetterereignisse, Trockenheit usw. kann das dazu dienen,
  unsere Natur zu schützen und Eingriffe in Natur und Landschaft auszugleichen. Ein
  Gesetzentwurf wurde vorgestellt und ist in die Länder- und Verbändeanhörung gegangen.
  Aktuell wird das Gesetz innerhalb der Bundesregierung noch abgestimmt. Nachdem es
  fertig abgestimmt worden sein wird, wird es in das Kabinett kommen. Aber welche
  Punkte zum Beispiel sind noch nicht in der finalen Abstimmung? Es ist gute Tradition,
  dass wir keine Einblicke in laufende Verhandlungen innerhalb der Bundesregierung
  geben. Insofern muss ich Sie bitten, sich zu gedulden, bis die Abstimmung erfolgt
  ist. Frau Deschauer und Herr Meyer, nach dem Auslaufen des Flugverbots gab es jetzt
  den ersten Direktflug nach Syrien. War die Bundesregierung in irgendeiner Form eingebunden?
  Welche Perspektiven gibt es aus Sicht der Bundesregierung? Ich würde das Thema des
  Flugverkehrs normalerweise ans Verkehrsministerium abgeben. Es ist heute hier nicht
  vertreten, aber ich kann gern den Rahmen setzen. Der Rahmen ist die Unterzeichnung
  eines deutsch-syrischen Luftverkehrsabkommens am 16. Juli durch die Bundesregierung.
  Damit besteht die Grundlage für den direkten Flugverkehr zwischen Deutschland und
  Syrien. Das gibt kommerziellen Airlines die Möglichkeit, Direktflüge anzubieten
  bzw. wieder aufzunehmen. Das ist durchaus als ein Baustein in der Umsetzung des
  deutsch-syrischen Aktionsplans zu sehen. Sie erinnern sich, dass al-Scharaa im März
  hier in Berlin war und auch vom Bundeskanzler empfangen wurde. Im Rahmen dieses
  Besuchs wurden auch entsprechende Vereinbarungen für einen Aktionsplan getroffen.
  Das ist ein Umsetzungsschritt. Nähere Details müssten Sie dann noch einmal beim
  BMV erfragen. Weil Sie gerade gesagt haben, das sei ein Umsetzungsschritt: Was sind
  denn perspektivisch weitere Schritte? Es gab entsprechende Gespräche hier in Berlin.
  Insgesamt ist doch klar, dass die Bundesregierung insofern eine enge Verwobenheit
  mit der syrischen Seite hat, als sehr viele Menschen aus Syrien im Zuge des Bürgerkriegs
  Zuflucht bei uns gefunden haben. Es gibt sehr viele Syrerinnen und Syrer, die hier
  vor Ort leben, aber sicherlich auch sehr viele, die eine Perspektive für sich und
  ihre Familien vor Ort suchen. Der Aktionsplan setzt insofern einen Rahmen der Bundesregierung
  mit der syrischen Seite, sodass bei verschiedenen Aspekten angeknüpft werden kann
  und die Beziehungen auf eine neue Grundlage für eine gute Zukunft für Syrien gesetzt
  werden können. Das ist, glaube ich, der konkreteste Output, wenn man so sagen will,
  der bisher besteht. Unterzeichnet wurde das, wie gesagt, im Juli. Für alles Weitere
  müssten Sie dann beim BMV nachfragen. Frau Lorenzat, ich hatte vorgestern nach dem
  sogenannten Connected Vehicle Security Act in den USA gefragt. Danke für die Nachlieferung,
  die mir hier vorliegt. Diese Nachlieferung ist interessant; denn Ihr Ministerium
  sagt darin, das BMWE stehe im Austausch mit Mercedes und den USA. Normalerweise ‑
  das schreiben Sie sogar ‑ kommentieren Sie Gesetze anderer Staaten nicht und mischen
  sich auch nicht in die Angelegenheiten von privaten Firmen ein. Warum sind Sie jetzt
  also im Austausch mit Mercedes und der US-Regierung? Ich habe im Hinblick auf dieses
  Gesetz ja geantwortet, dass wir dazu im Austausch sind. Sie haben aber sicherlich
  Verständnis dafür, dass wir uns nicht weiter zu äußern können, weil die Gespräche
  vertraulich sind. Können Sie sagen, inwiefern und mit welchen Stellen in den USA
  Sie in Verbindung sind? Dazu habe ich keine weiteren Informationen zu teilen. (zum
  Nahostkonflikt) Zum Thema Terrorismus in der Westbank und Siedlergewalt: Frau Deschauer,
  die Bundesregierung steht in Sachen Sanktionen auf der Bremse, insbesondere was
  Produkte aus der besetzten Westbank angeht. Können Sie uns einmal erklären, wie
  es zusammenpasst, dass man sich einerseits gegen die Siedlergewalt ausspricht, gleichzeitig
  aber die Produkte dieser Siedler aus der Westbank in die Europäische Union lässt
  und weiter lassen möchte? Ich glaube, der Bundeskanzler hat sich dazu gestern in
  Irland geäußert. Das Auswärtige Amt schließt sich den Aussagen des Bundeskanzlers
  an, weil es hier von mir und meinen Kollegen bereits ähnlich lautende Aussagen gab.
  Gibt es weitere Fragen zu diesem Thema? Dann machen wir bei Frau Kollegin mit dem
  nächsten Thema weiter. Herr Kollege, Sie hatten zwei Fragen. Ich lasse Sie jetzt
  noch eine Nachfrage stellen; aber wie Sie Ihre Nachfrage stellen, liegt ja nicht
  in meinem ‑ ‑ ‑ Das war ja keine bewusste Nachfrage, sondern die Reaktion darauf,
  dass das Auswärtige Amt die Antwort verweigern wollte und auf Herrn Merz verwiesen
  hat. Können Sie das noch einmal erklären: Produkte aus der besetzten Westsahara,
  die von Marokko exportiert werden, müssen gekennzeichnet werden, wenn sie nach Europa
  kommen. Warum gilt das gleiche Prinzip nicht für Produkte aus der besetzten Westbank?
  Erst einmal beantworten wir hier jede Frage, ‑ ‑ ‑ Herr Kollege, können Sie Frau
  Deschauer bitte ausreden lassen? ‑ wie Sie, glaube ich, merken. Wir werden hier
  außerdem keine Regionalkontexte miteinander vergleichen. Des Weiteren verweise ich
  darauf, dass es zu der Gesamtthematik eine Debatte in Brüssel auf europäischer Ebene
  gibt ‑ zuletzt bei der Tagung des Rats für Auswärtige Angelegenheiten im Juli. Es
  wird sicherlich weitere Befassungen und Aussprachen zu dieser Thematik geben. Ich
  glaube, wir mussten feststellen, dass es keine EU-einheitliche Positionierung in
  dieser Sache gibt. Insofern würde ich mich auch Ihrer einleitenden Bemerkung, was
  eine deutsche Positionierung angeht, nicht anschließen wollen. Das ist die Sachlage,
  und in dieser Sache haben wir uns hier schon mehrfach geäußert. Wir werden uns dazu
  im EU-Rahmen also sicherlich weiter konstruktiv austauschen. Ich stelle aber auch
  fest, dass zu diesem Thema in Brüssel gerade keine Sitzung stattfindet und ich Ihnen
  insofern keinen neuen Stand mitteilen kann. An das Wirtschaftsministerium: Aufgrund
  der niedrigen Wasserstände gibt es schon einige Einschränkungen auf den deutschen
  Wasserstraßen. Welche Maßnahmen planen Sie, um die wirtschaftlichen Auswirkungen
  zu begrenzen und vielleicht auch langfristig vorzubeugen? Wir beobachten die Entwicklung
  der Rheinpegel und ihre wirtschaftlichen Folgen natürlich genau. Niedrige Wasserstände
  sind gerade auf dem Rhein ja kein neues Phänomen; schon 2018 und 2022 gab es historische
  Tiefstände. Viele Unternehmen haben daraufhin ihre Lieferketten umgestellt; sie
  nutzen verschiedene Transportwege und haben zusätzliche Lagerstandorte, um ihre
  Lieferketten resilienter zu machen. Auch Schiffe mit geringerem Tiefgang werden
  bereits zum Transport eingesetzt. Daher dürften die negativen Effekte insgesamt
  auch weniger gravierend ausfallen als in den letzten Jahren. Es ist auch wichtig
  zu betonen: Um die Wettbewerbsfähigkeit der Unternehmen zu sichern, ist es auf Unternehmensseite
  auch notwendig, die Lieferketten widerstandsfähiger zu machen. Dafür müssen individuelle
  Risiken identifiziert und analysiert werden und auch Strategien zur Anpassung umgesetzt
  werden. Wie ich gerade schon gesagt habe, tun viele Unternehmen dies bereits. Ins
  Off hinein an das Verkehrsministerium, aber vielleicht auch an das Finanzministerium
  und an Herrn Meyer: Der Kanzler hat den Wunsch an den künftigen Verkehrsminister
  formuliert, er möge zusätzliches Kapital für Infrastrukturprojekte mobilisieren.
  Dazu wäre meine Frage an das Ministerium: Gab es in der Vergangenheit Beispiele
  dafür, dass Geld eingesammelt wurde? Vielleicht kann das Ministerium bis Montag
  eine Summe nennen oder zwei, drei Projekte benennen, bei denen Geld eingesammelt
  wurde, sofern dies stattgefunden hat. An Herrn Harmsen: Eigentlich dachte ich bis
  jetzt, für die Mobilisierung privaten Kapitals sei der Deutschlandfonds und somit
  unter anderem auch das Finanzministerium zuständig. Haben Sie vielleicht einen Überblick,
  was da passiert ist? Der Fonds ist mit 30 Milliarden Euro ausgestattet; der Hebel
  liegt, glaube ich, bei 130 Milliarden Euro. Kann man schon sagen, dass das in irgendeiner
  Form Erfolg gezeigt hat, sodass der Kanzler vielleicht zumindest damit schon zufrieden
  ist? Was eine erste Bilanz aus dem Deutschlandfonds angeht, würde ich Sie darauf
  verweisen, dass wir letzte Woche gemeinsam mit dem BMWE eine Pressemitteilung dazu
  herausgegeben haben. Die finden Sie auf unserer Webseite. Zur Mittelbewirtschaftung
  im BMV möchte ich mich von hier aus nicht äußern. An das Umweltministerium: Es gab
  mittlerweile zwei Todesfälle aufgrund von Vibrionen in der Ostsee. Welche Maßnahmen
  wurden da schon getroffen oder werden da noch getroffen? Wie gehen Sie damit um?'
