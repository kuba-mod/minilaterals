title: Reform des Befristungsrechts Arbeitsbedingungen in der Wissenschaft verbessern
text: 'Die Änderungen im Wissenschaftszeitvertragsgesetz sehen erstmals Mindestvertragslaufzeiten
  für Erstverträge vor. Verträge mit Laufzeiten von weniger als einem Jahr oder lange
  Befristungsphasen mit Kettenverträgen: Trotz einiger Verbesserungen sind solche
  Arbeitsbedingungen in der Wissenschaft weiterhin Realität. Um dem entgegenzuwirken
  hat die Bundesregierung die Modernisierung des Befristungsrechts für die Wissenschaft
  beschlossen. Die Bundesregierung will mit der Modernisierung einen ausgewogenen
  Befristungsrahmen schaffen, der die Arbeitsbedingungen für Wissenschaftlerinnen
  und Wissenschaftler sowie Studierende verbessert – gleichzeitig aber auch die mögliche
  Flexibilität für Forschungseinrichtungen erhält. Dafür wurden Änderungen im Wissenschaftszeitvertragsgesetz
  und im Gesetz über befristete Arbeitsverträge mit Ärzten in der Weiterbildung vorgenommen.
  Das ändert sich: „Damit schaffen wir nach vielen Jahren der Unsicherheit endlich
  einen ausgewogenen und transparenten Befristungsrahmen, innerhalb dessen die Hochschulen
  und Forschungseinrichtungen die Empfehlungen des Wissenschaftsrates zu modernen
  Personalstrukturen in der Wissenschaft umsetzen können“, so Bundesforschungsministerin
  Bär zum Kabinettbeschluss. Ziel der Modernisierung ist, mehr Verlässlichkeit, Planbarkeit
  und Transparenz bei Befristungsregelungen für Wissenschaftlerinnen und Wissenschaftler
  in frühen Karrierephasen und auch für Studierende zu schaffen, angemessene Vertragslaufzeiten
  zu gewährleisten und die Vereinbarkeit von Beruf und Familie zu verbessern. Zudem
  soll die Attraktivität der Arbeit in der Wissenschaft erhöht und die Leistungs-
  und Wettbewerbsfähigkeit des Wissenschaftssystems insgesamt gestärkt werden – damit
  der Innovationsstandort Deutschland attraktiv, stark und wettbewerbsfähig bleibt.
  Nein, das Wissenschaftszeitvertragsgesetz trägt den Besonderheiten des Wissenschaftsbetriebs
  Rechnung, indem es gegenüber dem allgemeinen Arbeitsrecht spezielle Befristungsmöglichkeiten
  vorsieht. Das Recht der Hochschulen und Forschungseinrichtungen, das wissenschaftliche
  und künstlerische Personal unbefristet anzustellen, bleibt vom Gesetz ausdrücklich
  unberührt. Insofern kann das Gesetz selbst keine unbefristeten Stellen schaffen.
  Das ist Aufgabe der Hochschulen und Forschungseinrichtungen in ihrer Funktion als
  Arbeitgeber. Ziel der Bundesregierung ist es, einen ausgewogenen Befristungsrahmen
  zu ermöglichen. Die Modernisierung schafft deutlich mehr Verlässlichkeit, Planbarkeit
  und Transparenz für alle Wissenschaftlerinnen und Wissenschaftler in frühen Karrierephasen.
  Gleichzeitig ist für die Bundesregierung aber auch relevant, den Hochschulen und
  Forschungseinrichtungen weiterhin die notwendige Flexibilität zu geben. Befristungen
  sollen ermöglichen, dass regelmäßig neue Wissenschaftlerinnen und Wissenschaftler
  Qualifikationsmöglichkeiten erhalten. Die Bundesregierung hat in den letzten Jahren
  gemeinsam mit den Ländern den Weg zu mehr Planbarkeit und Verbindlichkeit vorgezeichnet
  und Strukturveränderungen eingeleitet:'
