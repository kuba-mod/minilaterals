title: Bürokratierückbau in Immobilien- und anderen Gewerben Gewerbe sparen gut 55
  Millionen Euro
text: 'Bürokratierückbau in der Immobilienbranche: Für Immobilienmakler und Wohnimmobilienverwalter
  entfällt die Pflicht, sich regelmäßig weiterzubilden. Das Gesetz zum Bürokratierückbau
  in der Gewerbeordnung und im Energieverbrauchskennzeichnungsgesetz wurde am 23.
  Juli im Bundesgesetzblatt veröffentlicht. Die verschiedenen Regelungen des Gesetzes
  treten zu unterschiedlichen Zeitpunkten in Kraft. Damit schafft die Bundesregierung
  regelmäßige Weiterbildungen für Immobilienmakler und das Label für alte Heizungsanlagen ab.
  Neu im Gesetz ist zudem die Ausweitung der Genehmigungsfiktion nach der Gewerbeordnung
  auf alle erlaubnispflichtigen Gewerbe. Das hat der Bundestag am 11. Juni beschlossen.
  Die Genehmigungsfiktion sieht vor, dass ein Gewerbe als genehmigt gilt, wenn die
  zuständige Behörde nicht innerhalb von drei Monaten darüber entscheidet. Die Genehmigungsfiktion
  tritt ebenfalls am 24. Juli in Kraft. Ab dem 24 Juli 2026 müssen sich Immobilienmaklerinnen
  und -makler nicht mehr regelmäßig weiterbilden. Das spart der Branche voraussichtlich
  rund 44,9 Millionen Euro jährlich. Die Bundesregierung vertraut darauf, dass die
  meisten Gewerbetreibenden ihren Beruf verantwortungsbewusst ausüben mit eigenem
  Interesse daran, ihr Wissen auf dem aktuellen Stand zu halten. Eine gesetzlich vorgegebene
  Weiterbildung für Immobilienmakler, die auch Dokumentations- und Aufbewahrungspflichten
  zur Folge hat, wird daher als verzichtbar erachtet. Auch für in Deutschland tätige
  Makler aus anderen EU-Ländern existiert diese nicht. Geregelt wird das mit der Änderung
  der Makler- und Bauträgerverordnung. Sie ist ein Teil des Gesetzes zum Bürokratierückbau
  in der Gewerbeordnung und tritt am 24. Juli 2026 in Kraft. Die Weiterbildungspflicht
  für Wohnimmobilienverwalterinnen und -verwalter bleibt bestehen. Darauf bestand
  der Bundestag in seinem Beschluss am  11. Juni. Weitere zehn Millionen Euro spart
  die Änderung des Energieverbrauchskennzeichnungsgesetzes ( EnVKG ). Ab dem 30 Juli
  2026 müssen die Bezirksschornsteinfeger das „Nationale Heizungs label “ nicht mehr auf
  älteren Heizungsanlagen anbringen. Die Pflicht galt seit Januar 2017. Das Heizungs
  label stand im Nationalen Aktionsplan Energieeffizienz ( NAPE ) und sollte Energieeinsparungen
  und mehr Heizkesselaustausche bewirken. Eine Evaluation von 2020 zeigte hingegen,
  dass die Anzahl der Kesseltausche und die Energieeinsparungen deutlich hinter den
  Zielen des Aktionsplans zurückgeblieben sind. Der Austausch alter Heizungen kann
  sich lohnen – für den Geldbeutel und für den Klimaschutz. Mit dem neuen Gebäudeenergiegesetz
  entscheiden Eigentümerinnen und Eigentümer selbst, welche Heizung sie einbauen.
  Die Bundesregierung setzt die Förderung fort : Die neuen Förderbedingungen gelten
  bereits ab dem 21. Juli 2026. Bereits vor dem 20. Juli zugesagte Anträge sind von
  den Änderungen nicht betroffen. Ausführliche Informationen finden Sie bei der Kreditanstalt
  für Wiederaufbau (KfW). Fragen und Antworten zur neuen Bundesförderung für effiziente
  Gebäude (BEG) finden Sie auf energiewechsel.de .'
