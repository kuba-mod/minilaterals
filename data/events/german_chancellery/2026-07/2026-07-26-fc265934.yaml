title: Bundeskanzler Merz schlägt Steffen Bilger für das Amt des Bundesministers für
  Verkehr vor
text: Bundeskanzler Friedrich Merz wird den bisherigen Parlamentarischen Geschäftsführer
  der CDU/CSU-Bundestagsfraktion, Steffen Bilger, für das Amt des Bundesministers
  für Verkehr vorschlagen. Bereits vergangenen Donnerstag hatte Merz den bisherigen
  Amtsinhaber Patrick Schnieder informiert, dass er einen Wechsel im Ministeramt plane.
  In einem Telefongespräch am Sonntag dankte Merz Schnieder erneut für die geleistete
  Arbeit und drückte sein Bedauern aus, dass der Amtswechsel wegen unvorhergesehener
  Umstände nicht wie geplant kommuniziert werden konnte.
