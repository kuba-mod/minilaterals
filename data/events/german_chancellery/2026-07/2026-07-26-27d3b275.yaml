date: '2026-07-26'
type: press_release
source_name: german_chancellery
title: Rede von Bundeskanzler Merz anlässlich der Teilnahme am Liborimahl in Paderborn
  „Wir machen Europa stärker – und damit auch Deutschland“
text: 'Europa sei vor allem eine Gemeinschaft von Menschen, die gemeinsam „in Freiheit
  und in Frieden leben wollen“, sagte Bundeskanzler Friedrich Merz in seiner Rede
  zum Liborimahl. Bundeskanzler Friedrich Merz hat beim traditionellen Liborimahl
  in Paderborn eine Rede zur Zukunft Europas gehalten. Er betonte im Hinblick auf
  die europäische Politik: „Unsere Aufgabe ist es heute, weitere Einigungsschritte
  zu gehen. Wir machen Europa stärker – und damit auch Deutschland. Und wenn wir Deutschland
  stärker machen, machen wir Europa stärker – politisch und wirtschaftlich.“ Genau
  das sei notwendig für unsere Zukunft in Freiheit, in Frieden und in Wohlstand. Diese
  Stärkung Europas sei auch aufgrund äußerer Umstände notwendiger denn je, so der
  Kanzler. Man müsse deshalb nicht nur einen europäischen, sondern zugleich auch einen
  nationalen Reformkurs gehen, betonte der Bundeskanzler. „Wir sind inmitten eines
  solchen Reformprozesses für die Revitalisierung unseres Landes und unserer Wirtschaft.
  Wichtige Zwischenschritte haben wir getan“, sagte Merz. Gerade in den zurückliegenden
  Wochen kurz vor der Sommerpause sei vieles, was in Arbeit war, abgeschlossen und
  entschieden worden. Zu Beginn seiner Rede ging der Bundeskanzler auch auf den Anschlag
  während des Christopher Street Day s in Berlin ein: „Ich habe dieser queeren Community
  gesagt: Gewalt beginnt nicht erst mit einem Anschlag. Gewalt beginnt mit Intoleranz,
  mit Ausgrenzung, mit Diskriminierung, mit dummen Redensarten und mit schlechten
  Witzen“, so der Kanzler. Das Liborimahl ist Teil des Liborifestes . Mit dem Fest
  feiern Stadt und Erzbistum Paderborn jährlich ihren Patron, den heiligen Liborius.
  Es ist eines der größten und ältesten Volksfeste Deutschlands und zeichnet sich
  durch seine Mischung aus kirchlichen und weltlichen Feierlichkeiten aus. Beim Liborimahl
  spricht jedes Jahr eine bekannte Persönlichkeit aus dem In- oder Ausland vor geladenen
  Gästen zum Thema „Europa“. Sehr geehrter Herr Gildemeister, Herr Professor Beverungen,
  sehr geehrter Herr Erzbischof – wir kennen uns ganz gut und ich habe ihm eben die
  Grüße der Bundestagspräsidentin ausgerichtet, die ihn ungern aus Rheinland-Pfalz
  hat gehen lassen; wir sind froh, dass wir Sie haben; schön, dass Sie bei uns sind! –,
  sehr geehrte Kolleginnen und Kollegen aus den Parlamenten, sehr geehrte Mitglieder
  der Libori Gilde, herzlichen Dank für Ihre Einladung und für die sehr freundliche
  Begrüßung zu diesem traditionsreichen Fest! Erlauben Sie mir, dass ich zwei Vorbemerkungen
  mache. Ich habe heute Morgen nach den schrecklichen Ereignissen der letzten Nacht
  darüber nachgedacht, ob ich heute Abend wirklich zu Ihnen kommen soll und kann.
  Ich habe mich relativ schnell entschlossen, meine Zusage einzuhalten; denn, meine
  Damen und Herren, wir müssen diesem hässlichen Antlitz der Intoleranz und des islamistischen
  Terrors die Offenheit und auch die Fröhlichkeit unserer freiheitlichen Gesellschaft
  entgegensetzen. Deshalb bin ich heute Abend hier. Meine zweite Bemerkung ist sehr
  trivial: Danke, dass Sie etwas Geduld mit mir gehabt haben; denn mir war es wichtig,
  heute Nachmittag noch in Berlin zu sein und auch an der sehr beeindruckenden Gedenkstunde
  in der Marienkirche am Alexanderplatz in Berlin teilzunehmen. Ich habe dieser queeren
  Community gesagt: Gewalt beginnt nicht erst mit einem Anschlag. Gewalt beginnt mit
  Intoleranz, mit Ausgrenzung, mit Diskriminierung, mit dummen Redensarten und mit
  schlechten Witzen. Deswegen sollten wir gerade an einem solchen Tag wie heute unsere
  Gesellschaft in ihrer ganzen Vielfalt ‑ ‑ ‑ Und ich bin dankbar, dass wir das heute
  in einer voll besetzten Kirche so zum Ausdruck bringen konnten. Ich habe den Teilnehmern
  dieser Gedenkstunde gesagt: Feiert nach den Stunden und Tagen der Trauer wieder.
  Zeigen wir auch in dieser Hinsicht das frohe Gesicht unserer vielfältigen Gesellschaft.
  Wenn das die Botschaft des heutigen Tages ist, dann haben wir die richtigen Konsequenzen
  aus dem gezogen, was gestern Abend, gestern Nacht passiert ist. – Herzlichen Dank
  für Ihr Verständnis und dafür, dass Sie auf mich gewartet haben. Meine Damen und
  Herren, Sie feiern heute die Überführung der Reliquien des heiligen Liborius von
  Le Mans nach Paderborn im Jahr 836. Sie, wir feiern den heiligen Liborius als Brückenbauer,
  der für die grenzüberschreitende Verbindung von Deutschland und Frankreich und auch
  für die Einigung Europas steht. Paderborn und Le Mans – Sie wissen es – verbindet
  die längste gelebte Städtepartnerschaft Europas. Das wissen Sie alle besser als
  ich. Aber seit Jahrhunderten – seit zwölf Jahrhunderten, seit 1190 Jahren – besteht
  das Band zwischen diesen beiden Bistümern, und daraus ist eine tiefe Freundschaft
  zwischen den Städten geworden. Das ist beeindruckend, und es ist zugleich inspirierend.
  Denn hier aus der Mitte Deutschlands heraus waren Sie über diese lange Zeit Wegbereiter
  der engen Beziehungen zwischen Deutschland und Frankreich, und Sie füllen diese
  Freundschaft bis heute mit Leben. Ich will Ihnen und Ihrer Stadt dafür einfach herzlich
  Danke sagen. Man muss es insbesondere in diesen Wochen und Monaten sagen: Die deutsch-französischen
  Beziehungen sind für die Bundesrepublik Deutschland und für die gesamte europäische
  Integration konstitutiv. Ohne eine feste, vertrauensvolle, belastbare Freundschaft
  zwischen Deutschland und Frankreich wird das europäische Projekt keine Zukunft haben.
  Deshalb war ich sehr dankbar, dass der französische Präsident, der im vergangenen
  Jahr beim Tag der Deutschen Einheit in Saarbrücken gesprochen hat, mich in der vergangenen
  Woche eingeladen hat, bei den Feierlichkeiten zum 14. Juli, dem französischen Nationalfeiertag,
  auf den Champs-Élysées in Paris dabei zu sein. Ebenfalls in der vergangenen Woche,
  wenige Tage später, sind wir zum Deutsch-Französischen Sicherheits- und Verteidigungsrat
  auf dem Flughafen in Nörvenich zusammengekommen. Meine Damen und Herren, wir haben
  bei dieser Gelegenheit die weitreichendste deutsch-französische Kooperation nicht
  allein in der Beschaffungspolitik, sondern in der Verteidigungs- und Sicherheitspolitik
  für unsere beiden Länder vereinbart, die jemals zwischen Deutschland und Frankreich
  vereinbart wurde, bis hin zur geplanten und jetzt in die Umsetzung gehenden deutsch-französischen
  Partnerschaft in der nuklearen Verteidigung. Das ist nicht ein Ersatz für das, was
  wir an nuklearer Verteidigung und Sicherheitsgarantien durch die Vereinigten Staaten
  von Amerika haben; es ist vielmehr ergänzend, es ist komplementär. Wir haben uns
  dann wenige Autominuten entfernt in Brühl auf Schloss Augustusburg – diesem traditionsreichen
  Ort, an dem Präsident Charles de Gaulle im Jahr 1952 dem deutschen Bundeskanzler
  Konrad Adenauer den Abschluss eines Freundschaftsvertrages angeboten hat, der dann
  wenige Jahre später der Élysée-Vertrag wurde – beim deutsch-französischen Ministerrat
  über Wirtschafts- und Wettbewerbsfähigkeit ausgetauscht, und darüber, wie wir gemeinsam
  auf europäischer Ebene Impulse für die weitere Entwicklung Europas setzen können.
  Denn, meine Damen und Herren, unsere Wettbewerbsfähigkeit entscheidet sich nicht
  allein in Brüssel, aber sie entscheidet sich auch und immer mehr in Brüssel. Sie
  entscheidet sich natürlich auch in den Betrieben, in den Werkstätten, in den Unternehmen
  unseres Landes. In dieser Runde darf ich vielleicht sagen: Sie entscheidet sich
  auch in Ihren Unternehmen. Sie entscheidet sich dort, wo investiert wird, wo ausgebildet
  wird, wo Wertschöpfung entsteht. Sie alle spüren seit Jahren, wie anspruchsvoll
  die wirtschaftspolitischen und wirtschaftlichen Rahmenbedingungen geworden sind.
  Sie, Herr Professor Beverungen, haben es ja gerade auch gesagt. Diese Sorgen nehmen
  wir sehr ernst, und wir stellen uns diesen Herausforderungen in Deutschland und
  in Europa. Meine Damen und Herren, ich wurde gebeten, über die Zukunft Europas zu
  sprechen, und dazu möchte ich gerne zunächst einen kurzen Blick zurückwerfen; denn
  die Zukunft versteht man einfach besser bzw. vielleicht versteht man sie nur, wenn
  man auch die Vergangenheit kennt. Nach dem Ende des Zweiten Weltkrieges haben die
  Europäerinnen und Europäer mit Mut und viel Zuversicht ein großartiges Aufbauwerk
  geleistet. Sie haben etwas aufgebaut, das Helmut Kohl das „Haus Europa“ nannte.
  Das Ziel dieses Aufbauwerks war nicht etwa die Integration verschiedener Industriezweige,
  etwa der traditionellen Kohle- und Stahlindustrie. Das Ziel dieses Aufbauwerks war
  Freiheit, Frieden, und Wohlstand für ganz Europa – mit allem, was dazugehört und
  unverzichtbarer Bestandteil ist, nämlich Demokratie, Menschenrechte, Rechtsstaatlichkeit
  und soziale Gerechtigkeit. Dieses „Haus Europa“ wurde nach Bauplänen erschaffen,
  die auf gesamteuropäischen Traditionen und Ideen beruhen: dem jüdisch-christlichen
  Erbe mit seinem Begriff der Menschenwürde, der Aufklärung sowie den demokratischen
  und republikanischen Aufbrüchen des 19. und 20. Jahrhunderts. Um im Bild zu bleiben:
  In diesen Bauplänen der europäischen Gründer finden sich keine grundlegenden Konstruktionsfehler.
  Das Fundament dieses Hauses ist stabil und es steht. Doch das Haus auf diesem Fundament
  wurde nicht so stabil, nicht so wetterfest gebaut, um den heftigen Stürmen des 21. Jahrhunderts
  auf Dauer standzuhalten. Es wird zwar nicht von den Stürmen hinweggefegt, aber wir
  müssen jetzt dringend nachbessern, und ja, wir müssen den Bau auch wirklich vollenden.
  Das ist jetzt unsere gemeinsame Aufgabe als Europäerinnen und Europäer. Das ist
  jetzt unsere gemeinsame Aufgabe für unsere gemeinsame europäische Zukunft. Es klingt
  hier an, meine Damen und Herren, und das ist gewollt: Mein Bild von einer erfolgreichen
  europäischen Politik ist geprägt vom europapolitischen Vermächtnis von Konrad Adenauer
  und Helmut Kohl, und auch von meiner Zeit als Abgeordneter im Europäischen Parlament
  von 1989 bis 1994. Ich hatte das große Glück, in diesen fünf Jahren dem Europäischen
  Parlament anzugehören – zu einer Zeit, in der wir die Deutsche Einheit vollenden
  konnten und in der ich auch gelernt habe, Deutschland aus dem Blick meiner europäischen
  Kolleginnen und Kollegen aus der Nachbarschaft zu sehen – einem zum Teil durchaus
  kritischen Blick. Ich hatte aber auch das große Glück, die Vollendung des europäischen
  Binnenmarktes auf der Basis des Delors-Berichtes in wenigen Jahren so voranzubringen,
  dass er am 1. Januar 1993 in Kraft treten konnte. Meine Damen und Herren, unsere
  Aufgabe ist es heute, weitere Einigungsschritte zu gehen. Wir machen Europa stärker –
  und damit auch Deutschland. Und wenn wir Deutschland stärker machen, machen wir
  Europa stärker – politisch und wirtschaftlich. Genau das ist notwendig für unsere
  Zukunft in Freiheit, in Frieden und in Wohlstand. Diese Stärkung Europas ist auch
  aufgrund äußerer Umstände notwendiger denn je; denn die Prinzipien der liberalen
  regelbasierten Ordnung erodieren immer weiter. Schon heute – das muss ich leider
  in dieser Deutlichkeit sagen – ist diese Ordnung, die wir in Europa lange Zeit als
  völlig selbstverständlich erachtet haben und auf die wir auch unser Wirtschaftsmodell
  aufgebaut haben, faktisch so nicht mehr vorhanden. Wir sind in eine neue Ära der
  Großmächte eingetreten, des Kampfes um Einflusssphären, der neuen Vermachtung auch
  in der Weltwirtschaft. In dieser neuen Ära sind die Staaten Europas, ist unser freiheitliches
  Europa als Ganzes bedroht. Wenn wir es bewahren wollen, wenn wir die neue Weltordnung
  im Sinne unserer Werte und Interessen mitgestalten wollen, dann müssen wir jetzt
  handeln. Europa braucht politische Stärke, aber auch wirtschaftliche Stärke und
  militärische Stärke. Denn nur Stärke bewahrt auf Dauer den Frieden. Schwäche bringt
  den Frieden ins Wanken. Das ist eine der historischen Lehren, die wir, die Europa
  aus seiner eigenen Geschichte gezogen hat. Diese Lehre verpflichtet uns heute dazu,
  entschlossen an unserer Stärke zu arbeiten. Wir brauchen eine neue Entschlossenheit
  in Europa. Wenn ich auf das vergangene Jahr zurückblicke, dann stelle ich fest:
  Ja, Europa hat zu dieser Entschlossenheit gefunden. Ich kann es Ihnen von dem Treffen
  der europäischen Staats- und Regierungschefs berichten. Das Bewusstsein der Dringlichkeit
  ist überall vorhanden. Der Handlungswille ist groß. Meine Damen und Herren, wir
  sind gerade dabei, unsere Erfolgsgeschichte als Friedensmacht fortzuschreiben. Deshalb
  bauen wir unsere Verteidigungsfähigkeit im Rahmen der NATO zügig aus. Deshalb haben
  die europäischen Mitglieder der NATO im vergangenen Jahr ihre Verteidigungsausgaben
  allein in diesem einen Jahr um mehr als 100 Milliarden Euro erhöht. Wir lösen uns
  aus der einseitigen Abhängigkeit von anderen, und wir investieren diese Mittel in
  Verteidigungsfähigkeit und Abschreckung. Die NATO ist heute europäischer denn je.
  Gerade deshalb bleibt sie das Fundament unserer euroatlantischen Sicherheit, oder
  anders ausgedrückt: Die NATO muss europäischer werden, damit sie transatlantisch
  bleiben kann. Wir in Deutschland gehen mit gutem Beispiel voran. Wir stärken unsere
  Streitkräfte mit klarem Fokus auf die Landes- und Bündnisverteidigung. Unsere Bundeswehr
  wächst mit einem ehrgeizigen Zeitplan. Das betrifft das Personal und das Material.
  Dabei gilt der ganz einfache Grundsatz, den ich schon vielfach genannt habe: Wir
  wollen uns verteidigen können, damit wir uns nicht verteidigen müssen. Meine Damen
  und Herren, dass dies notwendig ist, dass wir uns verteidigen können müssen, das
  zeigt uns seit fast viereinhalb Jahren der Blick in die Ukraine und auf den völkerrechtswidrigen
  Angriffskrieg, den Russland dort führt, immer und immer brutaler auch gegen die
  Zivilbevölkerung. Die Ukraine kämpft für ihre Freiheit, ja, das ist wahr. Sie kämpft
  für Frieden im Land. Europa steht der Ukraine bei. Aber, meine Damen und Herren,
  wir stehen der Ukraine nicht nur deshalb bei, weil es um die Freiheit der Ukraine
  geht, sondern wir stehen ihr bei, weil es um unsere Freiheit in ganz Europa geht.
  Wir wollen Frieden in ganz Europa, und das wird nicht ohne Frieden in der Ukraine
  möglich sein. Meine Damen und Herren, wir sind gerade dabei, auch unsere Erfolgsgeschichte
  als Wirtschaftsmacht fortzuschreiben. Ja, ich gebe zu, es ist eine große Herausforderung.
  Herr Professor Beverungen, Sie haben darauf und auch auf die Erfolgsvoraussetzungen
  hingewiesen. Wir arbeiten deshalb gemeinsam dafür, unsere Wirtschaft in Deutschland
  und in Europa, unsere vielen Unternehmen wieder wettbewerbsfähig zu machen. Im Zentrum
  steht die weitere Vertiefung des europäischen Binnenmarktes. Unser heutiger Binnenmarkt
  ist nicht der Binnenmarkt, den wir vor 30 Jahren gewollt haben. Um es auf einen
  einfachen Nenner zu bringen: Aus dem europäischen Binnenmarkt der Freizügigkeit
  ist vielfach ein europäischer Binnenmarkt der Überregulierung geworden. – So war
  es vor 30 Jahren nicht gemeint. Wir müssen das ändern. Deshalb bauen wir jetzt die
  Bürokratie in der Europäischen Union konsequent zurück, auch mit sogenannten Omnibuspaketen
  zur Vereinfachung. Wir entlasten Unternehmen zum Beispiel bei den Berichtspflichten.
  Wir haben uns erfolgreich dafür eingesetzt, dass die europäische KI -Regulierung
  nicht für Industrieunternehmen des Maschinenbaus und anderer Branchen gilt. Mit
  dem Fahrplan – so haben wir es genannt – „ein Europa, ein Markt“ haben wir eine
  neue Wettbewerbsagenda mit sehr konkreten Initiativen und klaren Zielvorgaben, auch
  im Sinne der wegweisenden Berichte von Mario Draghi und Enrico Letta. Meine Damen
  und Herren, diese beiden Berichte stehen in ihrer Qualität und in ihrer Kühnheit
  dem Bericht, den Jaques Delors 1985 zur Vollendung des europäischen Binnenmarktes
  vorgelegt hat, in nichts nach. Jetzt ist es an uns, aus diesen Berichten ähnlich
  wie damals in Europa die richtigen Schlussfolgerungen zu ziehen, wettbewerbsfähig
  zu werden und den Binnenmarkt wirklich zu vollenden, so wie wir es immer schon wollten.
  Lassen Sie mich ein sehr konkretes Beispiel nennen. Mit dem sogenannten 28. Regime
  wollen wir erstmalig eine einheitliche europäische Gesellschaftsrechtsordnung, eine
  Rechtsform schaffen. Gerade für junge Unternehmen, für Startups , die in Europa
  an 27 unterschiedlichen Rechtsordnungen verzweifeln, ist dies eine große Chance
  für mutiges Unternehmertum, für Innovationen, für Investitionen in Europa. Auch
  damit werden wir endlich das große Potenzial ausschöpfen können, das in unserem
  Markt mit 450 Millionen Verbrauchern liegt. Meine Damen und Herren, diese Europäische
  Union ist um 100 Millionen Einwohner und um 100 Millionen Verbraucherinnen und Verbraucher
  größer als die Vereinigten Staaten von Amerika. Wenn wir es richtig machen, dann
  haben wir ein mindestens ebenso großes Potenzial für Innovationen, für Investitionen
  und für Wohlstand in Europa. Deshalb bauen wir die Handelspartnerschaften der Europäischen
  Union aus, mit Lateinamerika ebenso wie mit dem indopazifischen Raum. Nach 25 Jahren
  endloser Diskussion ist nun endlich, wenigstens vorläufig, das MERCOSUR -Abkommen
  mit den vier südamerikanischen Staaten in Kraft getreten. Wir schaffen damit, vorläufig
  jedenfalls, den größten zusammenhängenden Binnenmarkt der Welt, mit über 700 Millionen
  Konsumenten in Europa und in Südamerika. Das Freihandelsabkommen mit Indien, das
  im Januar abgeschlossen worden ist und das wir innerhalb von Jahresfrist ratifizieren
  wollen, würde dann den allergrößten zusammenhängenden Wirtschaftsraum der Welt schaffen,
  mit 1,4 Milliarden Konsumenten in Indien und noch einmal 450 Millionen in Europa.
  Meine Damen und Herren, warum machen wir das? – Ein diversifizierter und regelbasierter
  Handel wird eben auf beiden Seiten neue Wachstumsdynamiken anstoßen, in Europa und
  damit auch bei uns in Deutschland. Einerseits stärken wir so gezielt unsere Beziehungen
  zu anderen Mittelmächten und damit unsere Position. Andererseits signalisieren wir
  auch: Europa bleibt offen für fairen und regelbasierten Handel. Wir sehen aber auch
  nicht tatenlos zu, wenn andere gemeinsame Regeln nicht einhalten. Die Europäische
  Union ist in der Lage, ihre Interessen und unsere Wirtschaft gegen wettbewerbsverzerrende
  Handelspraktiken anderer Staaten zu verteidigen. Wir bleiben offen für Dialog, aber
  wir werden uns weder durch hohe Subventionen noch durch künstlich abgewertete Währungen
  von diesem Kurs abbringen lassen. Meine Damen und Herren, für die richtigen Rahmenbedingungen
  müssen wir auch die notwendigen finanziellen Mittel bereitstellen. Wir werden einen
  neuen Mehrjährigen Finanzrahmen der Europäischen Union, wenn es möglich ist, noch
  in diesem Jahr verabschieden, den wir gerade verhandeln. So wie der Bundeshaushalt
  ein Regierungsprogramm in Zahlen ist, so ist der Mehrjährige Finanzrahmen ein strategisches
  Zukunftsprogramm der Europäischen Union in Zahlen. Mit diesem sogenannten Mehrjährigen
  Finanzrahmen müssen wir die Weichen richtig stellen. Wir müssen die Weichen grundlegend
  neu stellen. Der EU -Haushalt hat sich in den vergangenen Jahrzehnten weder im Inhalt
  noch in der Struktur verändert. Wir werden damit den aktuellen Herausforderungen,
  den Herausforderungen des 21. Jahrhunderts, nicht gerecht. Ich sage auch das: Die
  Mittel sind begrenzt. Wir müssen Prioritäten setzen. Diese Prioritäten dürfen nicht
  mehr allein auf Umverteilung und Subventionen liegen, sondern sie müssen auch auf
  Investitionen in Wettbewerbsfähigkeit und Investitionen in Sicherheit und Verteidigung
  liegen; damit auf Investitionen die Zukunft Europas folgt. Das ist der europäische
  Rahmen und der europäische Reformkurs. Aber, meine Damen und Herren, wir müssen
  zugleich auch einen nationalen Reformkurs gehen. Deutschland braucht Europa, aber
  Europa braucht auch ein wirtschaftlich starkes Deutschland. Ich weiß, viele der
  hier Anwesenden tragen Verantwortung in der regionalen Wirtschaft. Sie haben ein
  besonderes Interesse an der Frage, wie unsere deutsche Wirtschaft wieder ihre alte
  Stärke erlangt. Sie haben vielleicht auch die berechtigte Ungeduld, dass die hausgemachten
  und seit Jahrzehnten ungelösten Probleme unseres Landes, die uns und Ihnen wie Mühlsteine
  um den Hals hängen, wodurch die vielen Wachstumspotenziale unseres Landes nicht
  ausgeschöpft werden, jetzt endlich politisch angegangen und aufgelöst werden. Ja,
  meine Damen und Herren, ich kann Ihnen versichern: Die Bundesregierung sieht diese
  Herausforderungen, vor denen viele Unternehmerinnen und Unternehmer in unserem Land
  stehen. Wir sehen sie in aller Deutlichkeit und in aller Dringlichkeit. Wir wissen
  um die Belastungen durch Bürokratie und langwierige Genehmigungsverfahren. Wir kennen
  die Herausforderungen hoher Energiekosten, zu hoher Steuern und Lohnnebenkosten,
  des Fachkräftemangels. Die Probleme bei der Wettbewerbsfähigkeit unserer Volkswirtschaft
  sind im Wesentlichen – nicht ausschließlich, aber im Wesentlichen – Probleme der
  preislichen Wettbewerbsfähigkeit. Die Kosten in Deutschland sind einfach zu hoch.
  Das ist die zentrale Problemdiagnose, mit der die Bundesregierung ihre Arbeit aufgenommen
  hat. Wir wollen diese Probleme lösen. Wir wollen den Reformstau auflösen, der unser
  Land lähmt. Wir wollen, dass dieses Land wieder zum Land der freien und sozialen
  Marktwirtschaft wird, so wie Sie, Herr Professor Beverungen, es in Ihrem einführenden
  Vortrag gerade beschrieben haben, in dem sich Unternehmerinnen und Unternehmer beweisen
  und bewähren können und in dessen Mitte Innovationen für dieses Jahrhundert entstehen.
  Ludwig Erhard hat diese Programm einmal „Wohlstand für alle“ genannt. Ich sage für
  die Bundesregierung heute: Wir wollen Wohlstand für alle erhalten. Wir wollen aber
  vor allem Wohlstand für die junge Generation ermöglichen. Wir wollen Vermögens-
  und Wohlstandsaufbau in Deutschland ermöglichen. Der Weg dorthin geht nur über grundlegende,
  umfassende Reformen der wirtschaftspolitischen Rahmenbedingungen. Meine Damen und
  Herren, nach 15 Monaten: Wir sind dabei. – Unterschätzen Sie bitte nicht meine und
  unsere Entschlossenheit, diese Reformen durchzusetzen. Wir sind inmitten eines solchen
  Reformprozesses für die Revitalisierung unseres Landes und unserer Wirtschaft. Wichtige
  Zwischenschritte haben wir getan. Gerade in den zurückliegenden Wochen kurz vor
  der Sommerpause ist vieles, was in Arbeit war, abgeschlossen und entschieden worden.
  Ich nenne hier nur beispielhaft die Reform der Gesetzlichen Krankenversicherung.
  Aber ich nenne auch die sogenannte Aktivrente, die am 1. Januar 2026 in Kraft getreten
  ist. Ich will bei dieser Gelegenheit ein herzliches Wort an Ihren Bundestagsabgeordneten
  richten, an Carsten Linnemann, der nämlich genau dieses Konzept vorgeschlagen hat,
  eine Aktivrente. Auch das Wort stammt von ihm. Meine Damen und Herren, wir haben
  es in Kraft gesetzt, und wir wissen heute, ein gutes halbes Jahr später, dass bereits
  eine höhere fünfstellige Zahl von Arbeitnehmerinnen und Arbeitnehmern in Deutschland,
  die die Regelarbeitszeitgrenze erreicht haben, davon Gebrauch machen und länger
  arbeiten. Das ist unsere Grundüberzeugung – nicht mit Zwang, nicht mit Regulierung,
  nicht mit neuer Bürokratie, sondern mit den richtigen Anreizen, den Menschen ein
  Bild zu zeichnen, in dem sie selbst ihre eigenen Entscheidungen treffen und, wie
  in diesem Fall, auch länger arbeiten können. Wir haben im Koalitionsausschuss beschlossen,
  das Arbeitsrecht zu flexibilisieren, und wir haben beschlossen, die Vorschläge der
  Alterssicherungskommission anzunehmen. Wir haben erhebliche Fortschritte bei der
  Modernisierung unseres Staates gemacht. Erstmalig arbeiten jetzt Bund und Länder
  Hand in Hand bei einer über 200 Vorschläge umfassenden föderalen Modernisierungsagenda.
  Die Umbesetzung, die ich in meinem unmittelbaren eigenen Umfeld in der nächsten
  Woche vollziehen werde, hat auch genau diesen Zweck, nämlich im Kanzleramt die föderale
  Modernisierungsagenda zwischen Bund und Ländern so auf den Weg zu bringen, dass
  unser Staat endlich schneller, flexibler, digitaler, serviceorientierter wird. Wir
  haben angekündigt, mit dem Bürokratieabbau, mit dem Rückbau der Bürokratie, ernst
  zu machen, und wir machen ernst. Wir haben übrigens in dem Zusammenhang etwas Wegweisendes,
  um nicht zu sagen: Spektakuläres, entschieden. Wir werden grundsätzlich alle Berichtspflichten
  abschaffen und aufheben. Künftig muss umgekehrt der Staat begründen, warum eine
  Berichtspflicht überhaupt noch notwendig ist; Beweislastumkehr nennen wir das. Auch
  Genehmigungen werden deutlich schneller erteilt werden. So wie wir auf der Sauerlandautobahn,
  der A45, innerhalb von drei Jahren mit vielen Sondergenehmigungen in der Lage waren,
  die sogenannte Rahmedetalbrücke neu zu bauen, so werden wir in Zukunft alle Vorhaben
  ohne Sondergenehmigungen mit einer neuen rechtlichen Grundlage, nämlich dem überragenden
  öffentlichen Interesse an unserer Infrastruktur, bauen können. Das gilt für Straßen,
  das gilt für Schienen, das gilt für Wasserwege, das gilt für Flughäfen, das gilt
  für Bahnhöfe. Meine Damen und Herren, dieses – so haben wir es genannt – Investitionszukunftsgesetz
  ist ein Paradigmenwechsel. Nicht mehr das gegenseitige Misstrauen soll das Verhältnis
  zwischen Staat und Bürger bestimmen, sondern Vertrauen. Wir wollen den Unternehmerinnen
  und Unternehmern, wir wollen den Menschen in unserem Land wieder mehr Freiräume
  geben, das zu tun, was sie gut können, was sie tun wollen, womit sie unser Land
  voranbringen. Denn das ist der größte Vorteil, den wir auch in dieser neuen geopolitischen
  Lage, in diesem neuen Systemwettbewerb auf der Welt haben – die Bereitschaft der
  Menschen, in einem freiheitlichen Land mitzudenken, mitzugestalten, mitanzupacken.
  Genau das ist unsere Innovationskraft, die wir noch viel besser nutzen können, wenn
  wir aufhören, sie mit Regulierungen zu hemmen, wenn wir die Bereitschaft für unternehmerisches
  Risiko wieder anerkennen, statt ihr mit Misstrauen zu begegnen. Wenn Sie als Unternehmerinnen
  und Unternehmer darum heute fragen, ob sich Risiko und Investitionen in Deutschland
  überhaupt noch lohnen, dann lassen Sie mich Ihnen sagen: Ja, sie lohnen sich heute,
  und sie werden sich auch wieder lohnen. Nicht jede politische Entscheidung, nicht
  jede Reform, die wir in der Bundesregierung in den letzten Monaten auf den Weg gebracht
  haben, entfaltet ihre Wirkung von heute auf morgen. Auch das ist die Realität von
  Politik in einem modernen und komplexen Staat. Aber die Weichen sind gestellt, und
  sie sind richtig gestellt. Wir werden jetzt im zweiten Regierungsjahr noch eine
  ganze Reihe weiterer Maßnahmen über die Ziellinie bringen, mit unverminderter Kraft
  und auch mit einer Reihe neuer Kräfte. Wie Sie wissen, meine Damen und Herren, gehört
  auch ein Anwesender dazu. Sie haben es gesagt, Herr Professor Beverungen, Carsten
  Linnemann übernimmt am kommenden Mittwoch in der Bundesregierung das Amt des Gesundheitsministers.
  Sie haben dann einen Paderborner im Kabinett, und zwar einen, der tief in den Themen
  steht und der vor allem immer wieder bewiesen hat, dass er im Gegenwind stehen bleibt,
  dass er mit Überzeugung und Leidenschaft Politik macht. – Lieber Carsten, solche
  Leute brauchen wir in der Bundesregierung. Herzlichen Dank für deine Bereitschaft!
  Ich weiß um seine Leidenschaft für die Arbeitsmarktpolitik und die Sozialpolitik,
  aber ich habe ihm hoffentlich erfolgreich vermittelt, dass die Gesundheitspolitik
  dem in nichts nachsteht – vielleicht sogar im Gegenteil. Denn, meine Damen und Herren,
  hier geht es nicht nur um Verteilung, sondern hier geht es auch um das Erwirtschaften.
  Der Gesundheitssektor, mit allem, was dazu gehört, ist der am schnellsten wachsende
  Sektor unserer Volkswirtschaft – und genau für diesen Sektor wird der Wirtschaftspolitiker
  und der leidenschaftliche Sozialpolitiker Carsten Linnemann ab nächster Woche Mittwoch
  die Verantwortung übernehmen. Ich erwarte viel von ihm, das weiß er. Aber ich bin
  sicher, dass er das auch schaffen kann. Meine Damen und Herren, ich weiß, was für
  Carsten Linnemann gilt, gilt für die ganze Regierungsmannschaft. Wir legen jetzt
  in der sogenannten parlamentarischen Sommerpause nicht die Hände in den Schoß, sondern
  wir arbeiten sozusagen im Maschinenraum der Bundesregierung weiter daran, dass wir
  umsetzen, wofür wir vor über einem Jahr angetreten sind. Deutschland soll wieder
  ein Land sein, in dem sich Leistung lohnt, in dem investiert wird, in dem Innovationen
  entstehen. Dafür arbeitet die Bundesregierung, und dafür arbeite auch ich ganz persönlich
  - auf nationaler und auf europäischer Ebene. Ich lasse mich dann auch gern als Außenkanzler
  bezeichnen. Freundlich gemeint ist das in den seltensten Fällen; aber ich empfinde
  es als Kompliment und Auszeichnung. Denn Außenpolitik, Außenwirtschaftspolitik und
  Wirtschaftspolitik, lassen sich eben heute nicht mehr voneinander trennen. Wer glaubt,
  es noch wie früher machen zu können, der wird in Deutschland keinen Erfolg haben.
  Ich sage deshalb mit aller Zuversicht und mit allem Vertrauen in unser Land, in
  unsere Wirtschaft, in unsere Demokratie und in Europa: Wir sind den Herausforderungen
  dieser ersten Hälfte des 21. Jahrhunderts nicht schutzlos ausgesetzt, so wie ich
  es auch in Davos gesagt habe. Wir sind diesen Herausforderungen sehr gut gewachsen,
  wenn wir auf unsere Stärken setzen, auf unsere freiheitliche Ordnung, auf die Prinzipien
  der sozialen Marktwirtschaft, auf pragmatisches Regieren, und wenn wir dann in allen
  Teilen der Gesellschaft, in Deutschland und in Europa, vielleicht auch wieder ein
  bisschen mehr Freude an der Gestaltung unserer Zukunft finden. Meine Damen und Herren,
  das Glas ist nicht halb leer, es ist halb voll. Lassen Sie uns diesen Optimismus
  mit in die zweite Hälfte des Jahres nehmen. Ich sehe von dieser Zuversicht und von
  diesem Optimismus auch viel heute Abend hier im Raum, im Rathaus in Paderborn. Denn
  wir haben sie, die innovativen Familienunternehmen, die innovativen Startups in
  allen Sektoren in den Zukunftstechnologien. Haben Sie die Zahlen gelesen? Im Jahr
  2025 gab es die höchste jemals gemessene Zahl an gegründeten Startup -Unternehmen
  in Deutschland, über 3500; von vielen Medien weitgehend ignoriert. Bereits in der
  ersten Hälfte des Jahres 2026 hatten wir 3000 weitere Unternehmensgründungen mit
  Startups ; auch das von den meisten Medien leider weitgehend ignoriert. Meine Damen
  und Herren, es sind meistens, nicht immer, aber meistens, junge Menschen, die diese
  Unternehmen gründen. Im ersten Halbjahr 2026 waren es fast so viele wie im ganzen
  Jahr 2025, und das war bereits ein Rekordjahr. Junge Menschen gründen doch keine
  Unternehmen in Deutschland, wenn sie mit Verzagtheit und Pessimismus in die Zukunft
  schauen. Sie gründen diese Unternehmen, weil sie die Stärken unseres Landes schätzen,
  die Schwächen kennen, aber gleichzeitig den Mut haben, diese Unternehmen in Deutschland
  auf den Weg zu bringen. Wenn ich mich hier im Saal umsehe, dann sehe ich auch eine
  ganze Menge von dieser Zuversicht und dieser Gestaltungsfreude. Meine Damen und
  Herren, ich sehe in unserem Land Menschen, die Deutschland brauchen und die Europa
  brauchen. Ich sehe Sie, die Libori Gilde, die dieses Mahl, diese jahrhundertealte
  Tradition, organisiert haben und die vielen freiwillig engagierten Menschen, die
  das Liborifest erst möglich machen. Das ist doch die Kraft einer freiheitlichen
  Gesellschaft, und das ist doch auch die Kraft von Europa. Europa besteht eben nicht
  zuallererst aus Institutionen, aus Verträgen, aus Mehrjährigen Finanzrahmen. Nein,
  Europa ist vor allem eine Gemeinschaft von Menschen, die gemeinsam auf diesem wunderschönen
  und doch lebenswerten Kontinent in Freiheit und in Frieden leben wollen, die die
  wunderbare Kultur unseres Kontinents schätzen und seine vielfältigen Traditionen
  bewahren wollen. Sie alle hier im Saal füllen diesen europäischen Gedanken mit Leben
  und machen unsere Gemeinschaft stärker. Noch einmal: Dafür danke ich Ihnen herzlich.
  Ich wünsche uns allen nicht nur einen schönen Abend heute hier anlässlich des Liborimahls.
  Ich wünsche uns auch hier in Paderborn und Ihnen in den nächsten Tagen ein frohes
  und gesegnetes Liborifest. Ich wünsche uns Zuversicht für Deutschland, nicht nur
  für uns, sondern vor allem unsere Kinder und Enkelkinder haben es verdient, dass
  wir die Chancen unseres Landes mit Zuversicht anpacken.'
