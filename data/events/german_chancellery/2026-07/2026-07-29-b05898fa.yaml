title: Im Kabinett beschlossen Vorteile für E-Autos werden ausgeweitet
text: Durch das Elektromobilitätsgesetz können E -Auto-Nutzerinnen und -Nutzer kostenfrei
  vor Ladesäulen parken. Mehr E -Autos auf den Straßen tragen dazu bei, dass weniger
  gesundheits-, klima- und umweltschädliche Abgase im Verkehr entstehen. Die Bundesregierung
  will die Nutzung von E -Fahrzeugen nun noch attraktiver machen und so den Umstieg
  auf klimafreundliche Mobilität unterstützen. Das bereits bestehende Elektromobilitätsgesetz
  gibt Kommunen die Möglichkeit, Vorteile für elektrisch betriebene Fahrzeuge im Straßenverkehr
  zu gewähren, um E -Mobilität vor Ort aktiv zu fördern. Die Bundesregierung geht
  diesen Weg weiter und hat nun im Kabinett die Novelle des Elektromobilitätsgesetzes
  beschlossen. Das Elektromobilitätsgesetz ist seit Juni 2015 in Kraft und zunächst
  bis Ende 2026 befristet. Die Bundesregierung will die Möglichkeiten für Regelungen
  zum Vorteil von E -Fahrzeugen verlängern und teilweise entfristen. Außerdem soll
  der Anwendungsbereich erweitert werden – auf Busse und schwere Nutzfahrzeuge. Insgesamt
  schafft die beschlossene Novelle des Elektromobilitätsgesetzes mehr Planungs- und
  Rechtssicherheit für Kommunen sowie weitere optionale Vorteile für Nutzerinnen und
  Nutzer von E -Fahrzeugen. Aufgrund des Gesetzes können Kommunen E -Auto-Nutzerinnen
  und -Nutzern im Straßenverkehr Vorteile gewähren, zum Beispiel durch eigene Parkplätze
  vor Ladesäulen oder die Erlaubnis, Busspuren zu nutzen. Als Ergänzung ist nun noch
  die Option für kostenfreies Anwohnerparken für E -Fahrzeuge vorgesehen. Damit wird
  den Kommunen eine weitere Möglichkeit zur Verfügung gestellt, den Umstieg auf Elektromobilität
  noch attraktiver zu machen. Der Ausbau der Elektromobilität ist wichtig, um die
  Klimaziele zu erreichen und für eine bessere Luftqualität zu sorgen. Für den Markthochlauf
  von E -Autos ist es entscheidend, dass optimale Voraussetzungen für die Nutzung
  von E -Fahrzeugen herrschen. Das Elektromobilitätsgesetz setzt hier den Rahmen für
  gezielte Anreize in Verantwortung der Kommunen. Mit der Novelle will die Bundesregierung
  diesen Rechtsrahmen verstetigen und weiterentwickeln. Sowohl rein batteriebetriebene
  Elektrofahrzeuge als auch Plug-in -Hybride und Fahrzeuge mit Range Extender – für
  verlängerten Einsatz – fallen in den Anwendungsbereich des Gesetzes. Auch mit Wasserstoff
  betriebene Brennstoffzellenfahrzeuge können profitieren. Mit dem Investitions- Booster
  für E -Mobilität in Unternehmen werden betrieblich genutzte Elektrofahrzeuge gefördert.
  Zusammen mit der Verlängerung der Kfz -Steuerbefreiung für reine Elektrofahrzeuge
  und dem Förderprogramm für E -Autos bringt das die E -Mobilität weiter voran und
  stärkt die wichtige Automobilbranche. Laut Kraftfahrt-Bundesamt ist in diesem Jahr
  bereits ein deutlicher Anstieg der Zulassungen von Elektro- Pkw zu verzeichnen.
  Im ersten Halbjahr waren es 48 Prozent mehr E -Auto-Zulassungen als in der ersten
  Hälfte 2025.
