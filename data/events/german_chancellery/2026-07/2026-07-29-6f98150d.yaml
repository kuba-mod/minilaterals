title: Kabinettsumbildung Bundespräsident Steinmeier ernennt neue Ministerin und Minister
text: 'Als Staatsoberhaupt der Bundesrepublik Deutschland ernennt der Bundespräsident
  die neue Ministerin und die neuen Minister und entlässt ihre Vorgänger. Bundespräsident
  Frank-Walter Steinmeier hat die neuen Kabinettsmitglieder ernannt. Bereits in der
  vergangenen Woche hatte Bundeskanzler Merz bei der Vorstellung der von ihm vorgeschlagenen
  neuen Ministerin und Minister gesagt: „Wir wollen eine Regierung, die inhaltlich
  mit größtem Elan und mit Freude arbeitet und dabei die personelle Vielfalt unserer
  Gesellschaft und der Politik repräsentiert. Wir sind eine Reformregierung, und wir
  wollen das auch weiter zeigen.“ Als Bundesministerin für besondere Aufgaben leitet
  die ehemalige Bundesgesundheitsministerin Nina Warken die Regierungszentrale, das
  Kanzleramt. Die Juristin ist 47 Jahre alt und war seit Mai 2025 Bundesgesundheitsministerin.
  In ihrem neuen Amt als Chefin des Bundeskanzleramtes ist enge Beraterin des Bundeskanzlers.
  Sie koordiniert das Zusammenwirken der Ministerien und ist eine wichtige Verbindungsstelle
  zum Parlament, zu den Bundesländern und zu gesellschaftlichen Gruppen. Dr. Carsten
  Linnemann ist neuer Bundesgesundheitsminister. Der 48-jährige Diplom-Volkswirt bekleidete
  seit 2023 das Amt des Generalsekretärs der CDU . Zentrale Aufgaben seines Ministeriums
  ist es, die Leistungsfähigkeit und Finanzierbarkeit der Gesetzlichen Krankenversicherung
  sowie der Pflegeversicherung sicherzustellen und fortzuentwickeln. Ein weiterer
  Schwerpunkt ist die Gesundheitsförderung und Prävention. Steffen Bilger leitet das
  Bundesverkehrsministerium. Der 47-jährige Jurist war zuletzt Erster Parlamentarischer
  Geschäftsführer der CDU / CSU -Bundestagsfraktion. Als Minister verantwortet er
  jetzt die nationale Verkehrspolitik – dazu gehört der Bau und die Instandhaltung
  von Autobahnen, Bundesstraßen und Brücken, der Schieneninfrastruktur und des Zugverkehrs.
  Warum der Bundespräsident? Der Bundespräsident ernennt, als Staatsoberhaupt der
  Bundesrepublik Deutschland, die Minister und Ministerinnen. Diese werden ihm aber
  vom Bundeskanzler vorgeschlagen. So sieht es das Grundgesetz Art. 64 vor. Nach der
  Ernennung müssen die neuen Ministerinnen und Minister noch vor dem Bundestag den
  Eid nach Artikel 56 Grundgesetz leisten. Um das Parlament nicht – mit hohen Kosten
  verbunden – aus der Sommerpause nach Berlin zu holen, wird die Vereidigung nach
  Ende der Parlamentspause erfolgen.'
