title: Nach Anschlag beim Christopher Street Day in Berlin Hier finden Betroffene
  Hilfsangebote
text: Das Land Berlin und der Bund bieten Unterstützung und Hilfsangebote für Betroffene
  und Angehörige nach dem Anschlag beim Berliner Christopher Street Day an. Der Anschlag
  beim Berliner Christopher Street Day hat bei zahlreichen Menschen in ganz Deutschland
  und darüber hinaus große Bestürzung ausgelöst. Bundeskanzler Friedrich Merz sprach
  in einem Statement von einer abscheulichen und verachtenswerten Tat. Die gesamte
  Bundesregierung sei mit den Gedanken bei den Opfern, ihren Angehörigen, bei den
  Verletzten und allen, die diese schreckliche Tat miterleben mussten, erklärte er.
  Wer unmittelbar betroffen ist, benötigt möglicherweise nicht nur medizinische Hilfe.
  Auch Menschen, deren Angehörige oder Freunde verletzt wurden oder zu Schaden kamen,
  brauchen möglicherweise Unterstützung. Hilfsangebote gibt es auch für Menschen,
  die sich in Zusammenhang mit dem Anschlag um Mitmenschen sorgen und sich darüber
  austauschen möchten.
