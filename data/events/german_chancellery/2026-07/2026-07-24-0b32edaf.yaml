title: Pressestatement von Bundeskanzler Merz zu personellen Veränderungen im Kabinett
  Warken wird Kanzleramtschefin, Linnemann Bundesgesundheitsminister
text: 'Bundeskanzler Merz stellte Nina Warken, Carsten Linnemann und Philipp Amthor
  in ihren neuen Ämtern vor. Bundeskanzler Merz stellte in einer Pressekonferenz die
  künftigen neuen Mitglieder seines Kabinetts vor. So soll die bisherige Bundesgesundheitsministerin
  Nina Warken als Bundesministerin für besondere Aufgaben in Zukunft das Kanzleramt
  leiten und Carsten Linnemann wird das Amt des Bundesgesundheitsministers übernehmen.
  Außerdem wird Philipp Amthor neuer Staatsminister für die Bund-Länder-Beziehungen
  im Kanzleramt. Der Bundeskanzler dankte den jeweiligen Amtsvorgängern für ihre geleistete
  Arbeit und kündigte außerdem weitere personelle Veränderungen an. „Die Personalveränderungen
  folgen einer klaren Vorgabe“, sagte der Bundekanzler. „W ir wollen eine Regierung,
  die inhaltlich mit größtem Elan und mit Freude arbeitet und dabei die personelle
  Vielfalt unserer Gesellschaft und der Politik repräsentiert. Wir sind eine Reformregierung,
  und wir wollen das auch weiter zeigen .“ Meine Damen und Herren, schönen guten Morgen!
  Ich freue mich sehr, dass Sie zu einer für Sie frühen Morgenstunde zu uns kommen –
  herzlichen Dank. Ich möchte Sie heute über einige Personalentscheidungen informieren,
  die ich in den letzten Tagen getroffen habe. Diese Entscheidungen betreffen ausschließlich
  das Bundeskabinett. Über weitere Entscheidungen in der Partei werden wir in den
  nächsten Tagen beraten. Wenn die Gremien der CDU getagt haben, werde ich sie bekanntgeben.
  Ich will an dieser Stelle aber zunächst ganz herzlich Thorsten Frei danken. Er hat
  als Bundesminister für besondere Aufgaben und als Chef des Bundeskanzleramtes wirklich
  sehr gute Arbeit geleistet. Er begleitet mich in diesem Amt seit dem Beginn der
  Wahlperiode, hat mich aber auch schon in der letzten Wahlperiode des Deutschen Bundestages
  als erster parlamentarischer Geschäftsführer der Bundestagsfraktion begleitet. Ich
  bin ihm dankbar für die Arbeit, die er in der Fraktion, hier im Haus und in der
  Regierung geleistet hat. Thorsten Frei hat einen ganz maßgeblichen Anteil am bisherigen
  Erfolg der Regierungsarbeit und an der Stabilität der Koalition. Die Reformerfolge,
  die wir insbesondere in den letzten Wochen erzielt haben, sind auch sein Verdienst.
  Ich will es ausdrücklich sagen: Ich freue mich, dass Markus Söder und ich uns sehr
  schnell verständigen konnten, ihn als den neuen Vorsitzenden der CDU / CSU -Bundestagsfraktion
  vorzuschlagen. Wir werden ihn am nächsten Mittwoch in der Sondersitzung der Fraktion
  wählen. Ich freue mich, dass ich Nina Warken als Nachfolgerin gewinnen kann. Sie
  wird diese Aufgabe als Chefin des Bundeskanzleramtes und als Bundesministerin für
  besondere Aufgaben übernehmen. Mit ihr wird erstmals in der Geschichte unseres Landes
  eine Frau als Chefin in das Bundeskanzleramt einziehen. Ich freue mich sehr darüber,
  dass sie bereit ist, diese Aufgabe zu übernehmen. Nina Warken hat in den vergangenen
  Monaten in der Bundesregierung als Gesundheitsministerin gezeigt, dass sie ein Ministerium
  führen und Reformen auch gegen Widerstände durchsetzen kann und dass sie auch vielfältige
  Themen in ihrer ganzen Komplexität beherrscht. Nina Warken ist zudem eine harte
  Verhandlerin; das haben alle gemerkt, die in den letzten Monaten mit ihr zu tun
  hatten. Sie ist durchsetzungsstark und auch in den sicherheitspolitischen Themen
  zu Hause, die hier im Haus koordiniert werden. Sie wird damit in der täglichen Regierungsarbeit
  eine der wichtigsten, wenn nicht die wichtigste Stütze und Ansprechpartnerin für
  mich sein. Ich freue mich auf die Zusammenarbeit. Wir beide kennen uns seit vielen
  Jahren, und wir arbeiten nicht nur in der Regierung, sondern auch in der Partei
  zusammen. Als gewähltes Mitglied des Präsidiums der CDU Deutschlands, als Vorsitzende
  der Frauenunion und als langjährige Parlamentarierin kennt sie die politischen Abläufe
  und die Themen bestens. Nina, noch einmal: Ich freue mich wirklich sehr, dass wir
  diese Zusammenarbeit jetzt in neuer Zusammensetzung fortsetzen können. Es freut
  mich, dass Carsten Linnemann meiner Bitte gefolgt ist und das Amt des Bundesgesundheitsministers
  übernehmen wird. Das Ministerium ist zu einem zentralen Ressort in den Reformbemühungen
  meiner Regierung geworden – notwendigerweise. Ich will allerdings auch hinzufügen:
  Carsten Linnemann übernimmt ein Ministerium, das für den am schnellsten wachsenden
  Sektor unserer Volkswirtschaft steht. Der gesamte Gesundheitssektor, den wir leider
  viel zu häufig als reinen Kostenfaktor betrachten, ist ein ganz wesentlicher Teil
  unseres gesellschaftlichen Lebens. Gesundheit, Pflege, Vorsorge für das Alter sind
  das eine. Aber eine gut funktionierende Industrie – angefangen bei der pharmazeutischen
  Industrie über die Medizintechnik bis hin zu vielen anderen Bereichen wie Einrichtungen
  und Krankenhäusern – ist ein großer und, ich sage es noch einmal, der am schnellsten
  wachsende Teil unserer Volkswirtschaft. Auch dafür wird Carsten Linnemann die Verantwortung
  übernehmen. Mit der Pflegereform und weiteren strukturellen Reformen in der Gesundheitspolitik
  werden nun wirklich große Reformvorhaben dieser Wahlperiode umgesetzt. Wir müssen
  den Reformkurs beibehalten, und dafür braucht es einen Minister, der standfest und
  reformwillig zugleich ist, auch im Gegenwind. Carsten Linnemann hat im Übrigen bereits
  in den Koalitionsverhandlungen den Gesundheitsbereich verantwortet. Er hat im Koalitionsausschuss
  alle Themen mitverhandelt. Er weiß also, wovon er spricht. Schließlich: Die Beziehungen
  zwischen Bund und Ländern sind in einem föderalen Staat von größter Bedeutung. Unser
  föderaler Staat funktioniert nur, wenn Bund und Länder gut zusammenarbeiten. Sie
  wissen, dass ich mich von Anfang an darum bemüht habe und unverändert darum bemühe,
  mit den Ländern im föderalen Staat ein gutes Auskommen zu haben und eine gute gemeinsame
  Politik zu machen. Ich werde deshalb Philipp Amthor zum neuen Staatsminister für
  die Bund-Länder-Beziehungen im Kanzleramt ernennen. Er wird seine Erfahrungen aus
  der Modernisierungs- und Digitalisierungsagenda des Ministeriums, dem er bisher
  als Parlamentarischer Staatssekretär angehört hat, und aus der Koordinierung in
  der gesamten föderalen Modernisierungsagenda in das Bundeskanzleramt mitbringen.
  Zur Erinnerung: Wir haben im Dezember des letzten Jahres in einer Ministerpräsidentenkonferenz
  die umfassendste föderale Digitalisierungs- und Modernisierungsagenda, die es jemals
  gab, einvernehmlich mit den Ministerpräsidenten aller Länder beschlossen. Vieles
  davon ist bereits auf dem Weg. Philipp Amthor wird es verantworten, die Koordinierung
  hier im Haus weiter voranzubringen. Er ist im Übrigen mit den Chefs der Staatskanzleien
  in allen 16 Bundesländern gut vernetzt. Er ist ein guter Politiker und Parlamentarier,
  ist aber auch ein hervorragender Jurist. Genau das braucht es an dieser Stelle bei
  diesen Themen. Auch dir, lieber Philipp, genauso wie Carsten Linnemann, euch beiden
  herzlichen Dank! Ich will die Gelegenheit nutzen, auch dem Kollegen Michael Meister
  für die geleistete Arbeit zu danken. Michael Meister ist ein über Jahrzehnte erfahrener
  Parlamentarier. Er war mehrfach auch Staatssekretär und ist ein guter Kenner unseres
  föderalen Systems. Er wird auch im Parlament weiter seine Arbeit leisten. Meine
  Damen und Herren, ich will heute auch gleich hinzufügen: Es wird weitere Veränderungen
  im Bundeskabinett geben. Darüber werde ich Sie zu gegebener Zeit informieren. Aber
  diese Entscheidungen brauchen nicht zuletzt angesichts der Sommerpause noch ein
  paar Tage und vielleicht auch länger Zeit. Das entscheide ich aber ohne Zeitdruck
  und mit der gebotenen Sorgfalt sowie den Gesprächen, die dazu notwendig sind. Abschließend:
  Uns ist in den letzten 15 Monaten in der Bundesregierung sehr viel gelungen. Ich
  will allen Kabinettsmitgliedern, die dazu beigetragen haben ‑ und es waren alle
  im Kabinett –, allen in der Bundestagsfraktion und auch in den Parteien sehr herzlich
  danken. Alle Personalentscheidungen, die ich Ihnen heute mitteilen kann, ordnen
  sich der Prämisse unter, weiterhin das Beste für unser Land zu wollen und zu erreichen.
  Die Personalveränderungen folgen einer klaren Vorgabe. Wir wollen eine Regierung,
  die inhaltlich mit größtem Elan und mit Freude arbeitet und dabei die personelle
  Vielfalt unserer Gesellschaft und der Politik repräsentiert. Wir sind eine Reformregierung,
  und wir wollen das auch weiter zeigen. In diesem Sinne will ich noch einmal den
  Kolleginnen und Kollegen sagen: Herzlichen Dank für die Bereitschaft, neue Aufgaben
  zu übernehmen! Wir werden die Aufgaben jetzt in der Sommerpause sorgfältig vorbereiten,
  und wir werden nach den parlamentarischen Sommerferien mit neuem Schwung starten
  und die großen Reformprojekte umsetzen, die wir uns vorgenommen haben. Wir haben
  viel erreicht, aber es ist auch noch viel zu tun. Ich freue mich, in dem Team der
  Regierungsmannschaft, die jetzt in Teilen neu zusammengesetzt wird, diese Arbeit
  weiter zu leisten. Herr Bundeskanzler, meine Damen und Herren, herzlichen Dank dem
  Bundeskanzler für das Vertrauen, mir die neue Aufgabe zu übertragen! Ich werde sie
  mit voller Kraft, aber auch mit der nötigen Demut angehen. Ich freue mich, den Reformkurs
  der Bundesregierung, den wir begonnen und gut auf den Weg gebracht haben, weiter
  voranzutreiben, mitzugestalten und noch enger mit den Kolleginnen und Kollegen Bundesministern
  und ihren Ressorts, aber auch mit den Ländern und den Fraktionen zusammenarbeiten
  zu können, damit unser Land weiter vorankommt. Ich freue mich auch auf die Zusammenarbeit
  mit Philipp Amthor. Ich darf an der Stelle aber auch sagen: Ich war die letzten
  14 Monate sehr gern Bundesgesundheitsministerin. Danke auch allen meinen Mitarbeiterinnen
  und Mitarbeitern dort für das, was wir gemeinsam auf den Weg gebracht haben! Ich
  wünsche Carsten Linnemann für die Aufgabe alles erdenklich Gute, freue mich in diesem
  Sinne auch auf die weitere Zusammenarbeit jetzt im Bundeskabinett und danke für
  das Vertrauen. Wir werden die Sommerpause sicherlich gut nutzen, um die Dinge entsprechend
  vorzubereiten. Der Bundeskanzler hat mich gestern gebeten, das Amt des Bundesgesundheitsministers
  zu übernehmen. Ich bedanke mich bei ihm für das entgegengebrachte Vertrauen. Ich
  bedanke mich auch bei Nina Wacken, die das richtig gut gemacht hat. Ich möchte diesen
  Job möglichst erfolgreich fortführen. Mir ist bewusst, dass das eine große Aufgabe
  ist. Deshalb gehe ich diese Aufgabe mit Demut an, aber auch mit großem Respekt,
  weil die Themen von Gesundheit und Familie uns doch alle betreffen, in den Familien,
  überall. Sie berühren, sie gehen nahe, und deshalb ist dieses Thema so wichtig.
  Ich freue mich auf die Aufgabe. Herr Bundeskanzler, meine sehr geehrten Damen und
  Herren, ich möchte mich dem Dank an den Bundeskanzler anschließen. Danke für das
  Vertrauen, mich als Staatsminister beim Bundeskanzler für die Bund-Länder-Beziehungen
  vorzuschlagen! Das ist eine große Aufgabe, eine Aufgabe, die aber auch eine weitere
  Gelingensbedingung für den Erfolg unseres Reformkurses ist, den wir uns vorgenommen
  haben. Diese Bundesregierung hat die Staatsmodernisierung, aber auch alle Reformvorhaben,
  die sie selbst sich auf die Agenda geschrieben hat, immer auch als eine gesamtstaatliche
  Aufgabe verstanden. Deswegen bin ich dankbar dafür, gemeinsam mit Nina Warken daran
  arbeiten zu können, auch an der Regierungskoordinierung. Ein herzliches Wort des
  Dankes gilt aber auch Bundesminister Dr. Karsten Wildberger und dem gesamten Team
  des Bundesministeriums für Digitales und Staatsmodernisierung. Es war für mich ein
  echtes Privileg, in den vergangenen Monaten an der größten Neukonstituierung eines
  Ministeriums seit 1949 mitgewirkt zu haben. Diese Aufgabe ist noch nicht beendet,
  und ich bin froh, dass ich in der neuen Rolle weiterhin auch mit dem gesamten Bundesministerium
  an den Aufgaben der Staatsmodernisierung zusammenarbeiten kann. Meine eigene Aufgabe
  ist, wenn Sie so wollen, ein Beleg dafür, dass die Regierung Effizienzen heben kann.
  Es gab zu Beginn der Bundesrepublik Deutschland in der Bundesregierung ein eigenes
  Bundesministerium für die Angelegenheiten des Bundesrates und der Länder. Vor über
  50 Jahren hat man sich entschieden, dass das effizienterweise besser in der Regierungszentrale,
  im Bundeskanzleramt aufgehoben ist. Seitdem hat sich dieses Amt weiterentwickelt.
  Die Zusammenarbeit mit den Ländern und die Zusammenarbeit mit dem Parlament wird
  dabei einen Schwerpunkt bilden. Ich bin dankbar dafür, dass ich das im Leitungsteam
  des Bundeskanzleramtes voranbringen darf und freue mich auf die neue Aufgabe.'
