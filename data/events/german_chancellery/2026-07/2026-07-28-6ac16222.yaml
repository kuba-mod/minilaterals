date: '2026-07-28'
type: press_release
source_name: german_chancellery
title: Pressekonferenz von Bundeskanzler Merz und Irlands Premierminister Martin „Wichtige
  Weichen für Europa stellen“
text: 'Kanzler Merz wird von Irlands Premierminister Martin empfangen. Die Zusammenarbeit
  mit Irland sei hervorragend, betonte Bundeskanzler Friedrich Merz in der Pressekonferenz
  mit dem irischen Premierminister (Taoiseach) Micheál Martin. Das sei umso wichtiger
  „in einem Halbjahr, in dem wir sehr wichtige Weichen stellen wollen für Europa“.
  Irland hat seit 1. Juli und noch bis zum 31. Dezember 2026 den Vorsitz im Rat der
  Europäischen Union inne. Während der aktuellen Präsidentschaft stehen einige wegweisende
  EU -politische Themen auf der Agenda. „Das ‚ window of opportunity ‘ ist jetzt“,
  so der Kanzler. „Und ihr habt unsere volle Unterstützung.“ Neben der Wettbewerbsfähigkeit
  und der EU -Erweiterung geht es im zweiten Halbjahr 2026 vor allem um den EU -Haushalt.
  Sowohl Deutschland als auch Irland ist an einer raschen Einigung über den sogenannten
  Mehrjährigen Finanzrahmen (MFR) gelegen. Die Ratspräsidentschaft der EU wechselt
  alle sechs Monate zwischen den Mitgliedsstaaten der Union. Während dieser Zeit leitet
  das jeweilige Land die Sitzungen des Rates, organisiert die Arbeit und vertritt
  den Rat gegenüber den anderen EU-Institutionen . Dazu kann die Ratspräsidentschaft
  auch eigene politische Schwerpunkte setzen. Weitere Informationen finden Sie auf
  der Themenseite zur EU -Ratspräsidentschaft. (Die Protokollierung des fremdsprachlichen
  Teils erfolgte anhand der Simultandolmetschung.) Kanzler Merz, ganz herzlich willkommen
  hier in Dublin! Deutschland und Irland sind enge Freunde und Partner. Daher möchte
  ich Ihnen meine tief empfundene Anteilnahme für die Getötete und die Verletzten
  des entsetzlichen Anschlags auf den CSD am Wochenende in Berlin aussprechen. CSDs
  und Pride-Paraden feiern wichtige europäische Werte, Inklusion, Gleichberechtigung,
  gegenseitige Achtung und Schutz der Minderheiten. Ein Angriff auf diese Werte ‑ ganz
  gleich, wo in der Union ‑ ist ein Angriff auf diese Werte überall in der Union.
  Das können und dürfen wir niemals hinnehmen oder akzeptieren. Friedrich, Kanzler
  Merz, Irland erklärt sich voll solidarisch mit Deutschland. Es war mir eine große
  Freude, Berlin im April zu besuchen, in Vorbereitung unseres Vorsitzes des Europäischen
  Rates. Ebenso freut es mich, Sie heute zu unseren Diskussionen über einige der wichtigsten
  Themen auf unserer gemeinsamen Agenda für die kommende Periode zu begrüßen. Es ist
  wichtig, dass wir so bald wie möglich eine Einigung bezüglich des nächsten EU -Haushalts,
  des Mehrjährigen Finanzrahmens, erzielen. Europa braucht einen Haushalt, der den
  Anforderungen und Ambitionen entspricht und gleichzeitig die derzeitige wirtschaftliche
  Lage reflektiert. Die Aufgabe des irischen Vorsitzes ist es, sich sorgfältig die
  Prioritäten sämtlicher Mitgliedstaaten anzuhören und im Oktober einen neuen Vorschlag
  zu unterbreiten, der hoffentlich sämtliche Positionen näher zusammenbringt. Ich
  werde mir genau anhören, was für den Kanzler und für Deutschland wichtig ist und
  werde mit ihm darüber diskutieren, wo möglicherweise Spielraum für Kompromisse besteht.
  Ich glaube, wenn wir die Aufgabe mit der richtigen Einstellung in Angriff nehmen,
  könnte eine Einigung bis Ende des Jahres möglich sein. Irland hat die Verbesserung
  der europäischen Wettbewerbsfähigkeit zu einer unserer Prioritäten erklärt. Die
  EU-Institutionen haben sich der „ One Europe, One Market “-Roadmap verschrieben.
  Hier werden die Schritte definiert, die wir gemeinsam unternehmen müssen, um dieses
  Ziel zu erreichen. Dies ist unser Leitstern für den Ratsvorsitz. Diese Roadmap formuliert
  Schritte zur Vereinfachung der Vorschriften, zur Vertiefung des Binnenmarkts und
  der Erweiterung der Handelsbeziehungen, geht die Energiekosten an, und stellt sicher,
  dass Europa entsprechend positioniert ist, den digitalen Wandel, den Klimawandel
  zu nutzen. Ich weiß, der Kanzler teilt dabei meinen Dringlichkeitssinn. Wir werden
  gemeinsam erörtern, wie wir diesen Prozess wirklich vorantreiben können. Irland
  arbeitet auch an der Erweiterung der Union. Wir werden unser Möglichstes tun, um
  sicherzustellen, dass die Länder, die der EU beitreten möchten, das Ganze schnell
  vorantreiben können ‑ im Gleichschritt mit ihren Bemühungen, die nötigen Reformen
  auf den Weg zu bringen. Der Kanzler hatte klar gesagt, dass er sich bei diesem Prozess
  mehr Dynamik wünscht. Ich sehe das genauso. Wir werden auch über internationale
  Themen sprechen, einschließlich der Lage in der Ukraine, die ich letzte Woche besucht
  habe. Wir dürfen nie vergessen, was unsere europäischen Mitbürger jeden Tag erleiden
  müssen, solange Russland diesen brutalen, illegalen Angriffskrieg fortsetzt. Sie
  verdienen unsere unerschütterliche Unterstützung sowie unser Engagement, ihnen zu
  helfen, einen gerechten Frieden zu erreichen. Kanzler Merz, Friedrich, noch einmal:
  Herzlichen Dank für Ihren Besuch. Ich freue mich auf die Diskussion. (auf Englisch)
  Vielen herzlichen Dank, Taoiseach. Lieber Micheál, ganz herzlichen Dank für diese
  herzlichen Begrüßungsworte. (auf Deutsch) Vielen Dank für deine mitfühlenden Worte
  zu dem schrecklichen Terroranschlag, den wir am letzten Wochenende in Deutschland
  erlebt haben. Ich habe von einer ganzen Reihe von Kolleginnen und Kollegen aus dem
  Europäischen Rat Nachrichten bekommen und heute auch von dir. Herzlichen Dank! Ich
  werde das gern an die Familien und auch an die Community weitergeben, dass das Mitgefühl
  weit über unser Land hinaus geteilt wird. Ich bedanke mich sehr herzlich für deine
  Worte. Wir haben uns im April auf meine Einladung hin in Berlin getroffen, und ich
  bin heute hier in Dublin, um einen Besuch bei der Europäischen Ratspräsidentschaft
  zu machen. Wir haben eine enge Abstimmung begonnen, und wir wollen sie fortsetzen.
  Irland hat zu Beginn des Monats Juli die Ratspräsidentschaft in Europa übernommen
  und das in einem Halbjahr, in dem wir sehr wichtige Weichen für Europa stellen wollen.
  Deswegen bin ich heute hier. Es gilt zuerst, den Mehrjährigen Finanzrahmen zu besprechen.
  Hinter diesem Begriff verbirgt sich nicht weniger als die Frage, wofür bis weit
  in das nächste Jahrzehnt hinein unser gemeinsames europäisches Budget ausgegeben
  wird. Wir wollen diese überaus schwierigen und komplexen Verhandlungen nach Möglichkeit
  bis Jahresende 2026 abschließen. Nur dann werden die Programme der Europäischen
  Union ab Januar 2028 auch weiter anlaufen können. Ich danke dir, Micheál, sehr herzlich
  für dein persönliches Engagement in dieser sehr schwierigen Angelegenheit, denn
  wir müssen hier sehr viele Interessen in der Europäischen Union zusammenbringen.
  Ich will für Deutschland sagen: Wir sind mit den aktuellen Vorschlägen der Europäischen
  Kommission nicht einverstanden. Eine so weite und große Ausdehnung des europäischen
  Budgets ist für uns nicht tragbar. Die Zahlen sind nicht ausgewogen. Wir unternehmen
  in der gesamten Europäischen Union im Augenblick auf nationaler Ebene größte Anstrengungen
  zur Haushaltskonsolidierung. Da können wir uns exorbitante Steigerungen der Ausgaben
  in der Europäischen Union einfach nicht leisten. Ich will ein Beispiel sagen: Die
  Bundesregierung spart über die nächsten vier Jahre acht Prozent der Stellen in der
  Bundesverwaltung ein. Deswegen möchte ich auch der Europäischen Kommission sagen:
  Es ist nicht akzeptabel, dass für die europäischen Institutionen jetzt 2500 neue
  Stellen geschaffen werden sollen. Das werden wir nicht akzeptieren. Wir brauchen
  deswegen einen Budgetentwurf mit Kürzungen in allen Bereichen, und zwar insgesamt
  um mehrere 100 Milliarden Euro. Diese Kürzungen sind zwingend, unabhängig davon,
  wie weit wir bei den neuen Eigenmitteln kommen. Wir müssen zudem unsere politischen
  Prioritäten im neuen Haushalt abbilden. Ich vertraue darauf, dass Ihr, lieber Micheál,
  einen realistischen Vorschlag vorlegen werdet. Darüber diskutieren wir. Wir haben
  aber immer auch gesagt: Wo es künftig nicht mehr Geld geben kann, muss es einen
  durchgreifenden Rückbau der Bürokratie, Erleichterungen und Flexibilität auch im
  europäischen Haushalt geben. Dies gilt zum Beispiel auch in der Agrarpolitik bei
  der vorgeschlagenen Kappung der Direktzahlungen. Die Mitgliedstaaten brauchen hier
  Flexibilität bei der Ausgestaltung, um auf nationale Besonderheiten einzugehen.
  Die Kappungsgrenze von 100 000 Euro pro Betrieb, die gegenwärtig diskutiert wird,
  wollen wir nicht. Wir wollen sie vor allem nicht mit dem Blick auf Besonderheiten
  in Norddeutschland und in Ostdeutschland. Ich bin bereit, über neue Eigenmittel
  zu diskutieren, aber sie müssen alle auch im Lichte der Wettbewerbsfähigkeit unserer
  Industrie geprüft werden. Deswegen kommt aus unserer Sicht eine zusätzliche Unternehmensbesteuerung
  auf europäischer Ebene nicht in Betracht. Auch beim Thema Wettbewerbsfähigkeit wird
  es in den nächsten Monaten ganz entscheidend auf die irische Ratspräsidentschaft
  ankommen. Ich bin etwas besorgt, dass der Eifer und das Ambitionsniveau in der Europäischen
  Union seit etwa Mitte des Jahres doch spürbar nachlassen. Dabei ist das Thema heute
  wichtiger denn je. Wir sind uns darüber in den letzten Monaten, auch im Europäischen
  Rat, immer wieder einig gewesen. Wir müssen hier mehr tun. Dass wir mehr tun müssen,
  das führen uns der russische Angriffskrieg, aber auch die Handelspolitik der Vereinigten
  Staaten von Amerika, der Nahe Osten und nicht zuletzt die Energiekrise vor Augen.
  Europa wird sich in dieser Welt nur aus eigener wirtschaftlicher Stärke behaupten
  können. Daher wollen wir, dass wir unsere Agenda zur Wettbewerbsfähigkeit schnell
  umsetzen, wenn möglich noch im Jahr 2026. Ich will ein Beispiel nennen: Die Investitionen
  in der Europäischen Union dauern immer noch zu lange. Die Genehmigungsverfahren
  dauern zu lange. Wir müssen jetzt wirklich die notwendigen Digitalisierungsprojekte,
  Energieprojekte, Dekarbonisierungsprojekte schnell umsetzen. Im Interesse unserer
  Wettbewerbsfähigkeit und des Klimaschutzes zugleich ‑ beides gehört zusammen ‑ sollten
  wir solche Projekte jetzt priorisieren. Ich könnte mir zum Beispiel vorstellen darüber
  nachzudenken, vorübergehend auch Vorrang vor neuen Umweltschutzprojekten zu geben.
  Wie gesagt, Wettbewerbsfähigkeit und Dekarbonisierung gehören jetzt prioritär auf
  die Tagesordnung. Ich begrüße daher sehr, mit welchem Ehrgeiz Irland das Thema vorantreibt.
  Dieses „ window of opportunity “ ist jetzt offen, und wir haben gemeinsam das Ziel,
  es auch zu nutzen. Irland, Ihr habt dabei unsere volle Unterstützung. Daneben haben
  der Taoiseach und ich bereits über das Thema EU -Erweiterung gesprochen. Wir haben
  hier ein positives Momentum geschaffen. Wir brauchen jetzt konkrete Fortschritte.
  Wir wollen der Ukraine rasch auch Möglichkeiten geben, an die Europäische Union
  heranzukommen. Ich habe ja einen Vorschlag dazu gemacht: eine assoziierte Mitgliedschaft
  als einen realistischen ersten Zwischenschritt auf dem Weg zur Mitgliedschaft. Auch
  Moldau ‑ das erlaube ich mir zu erwähnen ‑ hat erhebliche Reformfortschritte gemacht
  und sollte daher im Beitrittsprozess weiter voranschreiten, ganz unabhängig vom
  Fortschritt anderer Staaten. Und schließlich: Den Beitritt der Westbalkanstaaten
  müssen wir vorantreiben. Auch dafür habe ich diesmal zusammen mit Emmanuel Macron
  Vorschläge gemacht. Am weitesten vorangeschritten ist Montenegro. Wir sollten Montenegro
  daher nicht in die Warteschleife schicken, indem wir es im Paket mit anderen behandeln.
  Montenegro sollte bis zum Ende des Jahrzehnts Mitglied der Europäischen Union werden.
  Last, but not least : Es ist gut, dass wir beim Europäischen Rat im Oktober eine
  strategische Diskussion zu den nächsten Schritten führen werden. Ich spüre in Dublin,
  hier in der Hauptstadt der Ratspräsidentschaft, den großen Willen, Fortschritte
  zu machen. Lieber Micheál, bei allem Fokus unserer Gespräche heute auf europäische
  Themen ist klar: Auch die bilaterale Zusammenarbeit zwischen Deutschland und Irland
  als Partner, Seite an Seite, ist hervorragend. In den vergangenen Jahren haben wir
  unsere Zusammenarbeit deutlich intensiviert. Wir haben einen deutsch-irischen Aktionsplan
  geschaffen, den wir weiter ausbauen wollen. Im Bereich der maritimen Sicherheit
  sind wir uns einig, dass wir unsere kritische Infrastruktur, die ja nun gerade auch
  hier in der Nordsee besonders gefährdet ist, gemeinsam besser schützen. Ich danke
  dir nochmals sehr herzlich für den freundlichen Empfang in Dublin. Es ist eine Freude,
  einen Partner wie Irland an der Seite zu haben und beruhigend, dass Ihr das Geschehen
  in der Europäischen Union im Augenblick als Präsident entscheidend steuert. Ihr
  habt Deutschland dabei an eurer Seite. Frage : Herr Bundeskanzler, ich würde Sie
  zuerst gerne fragen: Diese mehrere hundert Milliarden Euro Einsparungen, von denen
  Sie gerade gesprochen haben, das ist ja ein recht großer Spielraum. Nun gibt es
  ja auch so ein Arbeitspapier, das schon mal zirkulierte, das von 400 Milliarden
  als Forderung sprach. Ist das immer noch der Rahmen, auf den Sie zugehen wollen?
  Oder was wäre in dieser recht weiten Spanne wirklich das untere Limit, ab dem Sie
  dann einem Deal in Brüssel nicht mehr zustimmen würden? Ich würde Sie auch beide
  gerne zu dem Vorschlag des französischen Präsidenten zu einer Digitalsteuer fragen.
  Wenn jetzt, wie gerade eben, wieder eine Unternehmensabgabe allgemein abgelehnt
  wird, dann braucht es ja andere Mittel. Könnte diese Digitalsteuer da ein Mittel
  sein? Oder sind Sie zu besorgt entweder um Arbeitsplätze hier in Irland oder auch
  um mögliche Vergeltungszölle des amerikanischen Präsidenten? Sie werden Verständnis
  dafür haben, dass ich jetzt keine konkreten Zahlen nenne, was die Einsparungen im
  Budgetentwurf der Kommission betrifft. Ich habe gesagt: mehrere hundert Milliarden
  Euro niedriger. In welchem Umfang, darüber müssen wir diskutieren. Das sind aber
  Fragen, die wir in den nächsten Monaten im Europäischen Rat besprechen müssen, über
  die wir beide miteinander sprechen. Wir müssen zu einem guten Ergebnis kommen, zu
  einem Ergebnis, das für den deutschen Bundeshaushalt tragfähig ist, das aber auch
  die Prioritäten abbildet, die wir in der Europäischen Union etwa im Bereich der
  Wettbewerbsfähigkeit und der Verteidigungsfähigkeit brauchen. Was die Steuern betrifft:
  Das ist sicherlich ein weiteres, nicht einfaches Thema, über das wir sprechen müssen.
  Es gibt einige Mitgliedstaaten, die bereits Digitalsteuern haben. Es gibt andere,
  die darüber diskutieren. Ob wir sie auf der europäischen Ebene gemeinsam beschließen,
  ist sicherlich eine weitere, zusätzliche, schwierige Frage. Dies ist nicht Gegenstand
  öffentlicher Diskussionen. Wir sind am Anfang eines solchen Diskussionsprozesses.
  Mein Empfänger funktionierte nicht durchgängig. War das auch eine Frage an mich?
  Die Frage war zur Digitalsteuer, vorgeschlagen vom französischen Präsidenten Macron.
  Könnten Sie sich das vorstellen? Man braucht ja weitere Ressourcen. Wäre die Digitalsteuer
  da eine Möglichkeit? Oder machen Sie sich Sorgen um Arbeitsplätze in der digitalen
  Branche in Irland? Insgesamt ja, und wir haben darüber gesprochen ‑ und werden das
  während des Mittagessens auch im Detail weiter besprechen ‑, wie es mit dem Mehrjährigen
  Finanzrahmen weitergeht. Da werden wir auch über eigene Ressourcen sprechen. Der
  Kommissar hat über potenzielle eigene Ressourcen von 60 Milliarden Euro gesprochen.
  Das ist, ganz ehrlich gesagt, eine große Herausforderung. Es gibt da fünf, sechs
  verschiedene potenzielle Einnahmenströme, und da ist man sich unterschiedlich einig
  oder uneinig. Ich glaube, eine Digitalsteuer wäre angesichts unserer Handelsabkommen
  mit den Vereinigten Staaten eine Herausforderung. Was das Potenzial angeht, so gehen
  die Schätzungen darüber, wie viel damit eingenommen werden könnte, weit auseinander.
  Angesichts der Tatsache, dass wir eine Vereinbarung haben mit den Vereinigten Staaten,
  was Handelsbeziehungen angeht, und es allgemeine Diskussionen zu diesem Sektor gibt,
  müssen wir hier vorsichtig voranschreiten. Herzlich willkommen in Dublin, Herr Bundeskanzler. ‑
  Wir beherbergen hier in Irland die größte Aluminaraffinerie Europas, und 52 Prozent
  der Exporte dieser Raffinerie gehen bekanntlich nach Russland. Würden Sie sich als
  Bundeskanzler dafür einsetzen, dass es im nächsten Sanktionspaket der Europäischen
  Union ein entsprechendes Exportverbot sowie auch ein Importverbot für Uran aus Russland,
  das vor allem nach Deutschland und Frankreich importiert wird, gibt? Zweite Frage:
  Dem irischen Staatsbürger Daniel Tatlow-Devally wird gerade mit vier anderen Leuten
  in Stammheim wegen eines mutmaßlichen Sabotageaktes gegen die deutsche Niederlassung
  einer israelischen Rüstungsfirma in Ulm der Prozess gemacht. Ein Mitglied Ihrer
  europäischen Partei, der irische Regierungsabgeordnete Barry Ward, hat den Prozess
  letzte Woche nach einem Besuch als Schauprozess bezeichnet, vor allem weil kein
  Protokoll vom Prozess aufgenommen wird. Was ist Ihr Kommentar dazu? Ich will das
  gerne kommentieren, und zwar sehr einfach: Wir haben in Deutschland rechtsstaatliche
  Verfahren. Eine konsularische Betreuung ist sichergestellt und den Beschuldigten
  stehen auch Strafverteidiger zur Seite. Ich habe überhaupt keinen Zweifel daran,
  dass in Deutschland ganz unabhängig von der Nationalität rechtsstaatliche Verfahren
  nach international gültigen Maßstäben durchgeführt werden. Daran gibt es keinen
  Zweifel. Die deutsche Justiz ist unabhängig. Sie ist aber auch rechtsstaatlichen
  Gesetzmäßigkeiten verpflichtet, und es gibt keinen Zweifel daran, dass es solche
  Verfahren in Deutschland dann auch ganz unabhängig von der Nationalität von Beschuldigten
  gibt. Was die Raffinerie betrifft, so ist das Gegenstand der Gespräche, die wir
  miteinander führen. Hier gilt es auch die eigenen europäischen und nationalen Interessen
  zu wahren. Darüber sprechen wir, aber dies ist nicht Gegenstand öffentlicher Erörterungen.
  Ich werde die gleiche Frage auf Englisch und Gälisch stellen. Möglicherweise wird
  die Schweizer Firma SGS ein Auge auf die Exporte nach Russland halten. Was ist diesbezüglich
  die Position der Regierung? Wir dürfen nicht das grundlegende Prinzip aus den Augen
  verlieren, wenn wir uns das anschauen. Die Vorschläge der Europäischen Kommission
  zielen potenziell auf Sanktionen ab, aber Alumina ist bis jetzt noch nie sanktioniert
  worden. Das ist ein wichtiges, ein kritisches Material, und Aughinish ist ein wichtiger
  Standort in der europäischen Lieferkette. Die Regierung hat nach den Berichten in
  der „Irish Times“ eine Untersuchung begonnen. Wenn diese Untersuchung abgeschlossen
  ist, legen wir das Ergebnis der Kommission vor. Meiner Meinung nach liegt es dann
  an der Kommission, eine unabhängige Beurteilung in Auftrag zu geben. Eine solche
  Beurteilung wäre ein zusätzlicher Faktor. Wir werden das mit der Kommission im Kontext
  der Anlage in Dunkerque besprechen; denn diese bezieht ihre Rohstoffe zu einem beträchtlichen
  Anteil vom Standort Aughinish. Was die Sanktionen angeht, so lautet eines der Grundprinzipen,
  dass wir Europa nicht mehr Schaden zufügen dürfen als dem Aggressor. Das sind zu
  jeder Zeit problematische und schwierige Fragen. Wir handeln hier also in gutem
  Glauben und werden uns mit der Kommission abstimmen. Zum Fall Daniel Tatlow-Devally:
  Wir treffen keine Aussagen über Fälle, die derzeit noch anhängig sind. Es gab gestern
  weitere Meldungen. Wir haben über das Konsulat Hilfe angeboten. Es gab sechs Besuche.
  Im Konsulat in München ist jemand der Familie zugeteilt worden, und das Konsulat
  hat auch der parlamentarischen Delegation geholfen, die einen Besuch durchgeführt
  hat und in dieser Sache tätig ist. Eine Frage an Sie beide zum Thema Erweiterung:
  Herr Bundeskanzler, Sie haben schon gesagt, dass es keine Paketlösung gebe. Es gibt
  aber vernehmbare Stimmen, die zum Beispiel den Beitritt von Montenegro an andere
  Beitritte auf dem Balkan knüpfen wollen. Wie wollen Sie solche Pakete verhindern ‑
  Stichwort Einstimmigkeit? Herr Bundeskanzler, ich kann Ihnen eine Frage zur Innenpolitik
  nicht ersparen: Die Debatte über Ihre Personalentscheidungen geht heute weiter.
  Sie haben gestern gesagt, dass Sie glauben, das werde sich beruhigen. Was werden
  Sie in den nächsten Tagen tun, damit es sich beruhigt? Frau Hasenkamp, ich beantworte
  die zweite Frage gern zuerst. ‑ Wir werden morgen, wie Sie wissen, eine Fraktionssitzung
  der Bundestagsfraktion in Berlin haben, in der wir einen neuen Vorsitzenden wählen,
  und wir werden zuvor eine Kabinettssitzung haben. Zwischendurch wird es auf meinen
  Vorschlag hin Entlassungen und neue Ernennungen beim Herrn Bundespräsidenten geben.
  Ich gehe fest davon aus, dass nach der Fraktionssitzung am morgigen Tag dann auch
  alle Entscheidungen nicht nur getroffen sind, sondern auch akzeptiert werden. Was
  das Erweiterungspaket betrifft: Wir haben vor einigen Wochen ein sehr gutes Treffen
  der Europäischen Politischen Gemeinschaft in Montenegro gehabt. Montenegro ist so
  weit, dass es beitreten kann; es hat alle Voraussetzungen weitestgehend erfüllt.
  Wir haben jetzt seit 13 Jahren keine neuen Mitglieder mehr in der Europäischen Union
  aufgenommen. Wir haben immer gesagt, dass die Europäische Union offen ist für europäische
  Staaten, die die Bedingungen, die Kopenhagen-Kriterien, erfüllen. Montenegro tut
  das, und dann muss diese Europäische Union auch zu ihrem Wort stehen. Ich habe es
  eben gesagt: Wir können das Land nicht in eine Warteschleife schicken, nur weil
  andere Länder noch nicht so weit sind. Wir werden darüber in der Europäischen Union,
  im Europäischen Rat zu diskutieren haben. Ja, es erfordert Einstimmigkeit. Ich denke
  aber, ich werde die Kolleginnen und Kollegen davon überzeugen können, dass wir diesen
  Erweiterungsprozess jetzt weiter voranbringen müssen. Deswegen haben Emmanuel Macron
  und ich gemeinsame Vorschläge gemacht. Auf der Basis dieser Vorschläge werden wir
  die Diskussion im Europäischen Rat führen. Ich stimme dem, was der Kanzler gerade
  in Bezug auf die Erweiterung und insbesondere im Hinblick auf Montenegro ausgeführt
  hat, voll und ganz zu. Während unseres Vorsitzes möchte Irland sämtliche Kapitel,
  die noch ausstehen, bis Ende des Jahres schließen. Wir hatten einen guten Beginn
  des Vorsitzes im Hinblick auf die Erweiterung, mit einer ganzen Reihe von IGCs im
  Juli. Ich glaube, es ist wichtig, dass wir das insbesondere mit Montenegro erreichen;
  denn das wäre ein klares Signal für alle anderen, dass man tatsächlich Mitglied
  der Europäischen Union werden kann, wenn man sich an die kriterienbasierte Methodik
  hält. Das wäre auch ein guter Anreiz für andere, denselben Weg einzuschlagen, den
  Montenegro genommen hat. Parallel zu Montenegro werden wir auch mit den anderen
  Westbalkanstaaten zusammenarbeiten. Wir arbeiten in dieser Hinsicht mit Serbien
  und anderen zusammen, und auch mit der Ukraine und mit der Republik Moldau wollen
  wir sämtliche Cluster öffnen; auch das ist wichtig. Unsere Agenda besteht also darin,
  dass wir so effektiv wie möglich vorankommen. Wir halten die regelbasierten Kriterien
  aber für wichtig, und wenn die Länder sich an diese halten, dann gibt es auch eine
  entsprechende Belohnung. das ist dann auch ein konkreter Anreiz an andere, weil
  es zeigt, dass eine Mitgliedschaft in der EU möglich ist. Herr Bundeskanzler, gestern
  hat Irland ein neues Gesetz eingebracht, das Importe aus illegalen israelischen
  Siedlungen verbieten soll. Deutschland hat sich auf EU -Ebene gegen eine solche
  Maßnahme gestellt. Warum stellt sich Deutschland gegen eine solche Maßnahme? Was
  sagen Sie zum Versuch Irlands, dieses Thema während der Ratspräsidentschaft voranzutreiben?
  Taoiseach, die Haltung zu einem europaweiten Einfuhrverbot für Produkte aus illegalen
  israelischen Siedlungen ist bislang noch nicht geklärt. Welche Botschaft möchten
  Sie heute an den Bundeskanzler richten, damit zu diesem Thema zumindest eine Beschlussfassung
  mit qualifizierter Mehrheit angestrebt wird? Ich möchte zunächst einmal sagen: Die
  Produkte, die Waren aus den besetzten Gebieten im Westjordanland ‑ das werden Sie
  vermutlich wissen ‑, fallen zu Recht nicht unter die Handelspräferenzen für Israel.
  Ich unterstütze die Kommission darin, diese Regel konsequent umzusetzen, und darauf
  muss jetzt unser Augenmerk liegen. Wir beobachten ansonsten mit großer Sorge die
  Aktivitäten der israelischen Regierung in den Siedlungsgebieten im Westjordanland.
  Ich habe diese Sorge mehrfach auch in persönlichen Gesprächen mit Ministerpräsident
  Netanjahu zum Ausdruck gebracht. Generelle Sanktionen gegen Israel halten wir aber
  nicht für richtig; da gibt es unterschiedliche Auffassungen zwischen unseren beiden
  Ländern. Ich werbe im Kreis der europäischen Staats- und Regierungschefs aber auch
  immer dafür, dass Deutschland hier in einer besonderen Verantwortung gegenüber dem
  Staat Israel steht und wir uns deswegen Sanktionsregimen gegen Israel im Allgemeinen
  nicht anschließen können und wollen. Dabei wird es jedenfalls für die gegebene Zeit
  bleiben. Was die Möglichkeit angeht, für den Rahmen, der im Hinblick auf den Handel
  mit den Siedlungsgebieten angewendet wird, Einstimmigkeit zu erzielen, so stellt
  das eine Herausforderung dar; denn wie gesagt gibt es in der EU und den 27 Mitgliedstaaten
  zum Teil aus historischen Gründen unterschiedliche Perspektiven, was den Nahen Osten
  und die israelisch-palästinensische Frage angeht. Nichtsdestotrotz denke ich nach
  meiner Erfahrung und nach meinen Gesprächen mit dem Bundeskanzler, dass es eine
  allgemeine Einigkeit darüber gibt, dass wir die Gewalt und die Siedlungsprojekte
  unterbinden müssen. Letzte Woche haben wir gelesen, dass es noch mehr Gewalt, noch
  mehr Aggressionen gegen Palästinenser in den Siedlungsgebieten im Westjordanland
  gibt. Wenn das nicht unterbunden wird, wird eine Zweistaatenlösung nicht möglich
  sind. Es muss daher verstärkten Druck auf Israel und die israelische Regierung geben,
  sodass diese wieder Druck auf die Siedler macht, dies zu unterbinden und damit aufzuhören.
  Das, was dort passiert, was die gewalttätigen Angriffe auf Landwirte im Westjordanland,
  auf Schulen usw. angeht, ist einfach nicht vertretbar, und man verzweifelt angesichts
  des Grads der Gewalt, der dort herrscht. Wir wollen ja eine Zweistaatenlösung. Die
  Europäische Union ist weiterhin der größte Geldgeber, was Palästina angeht, und
  das müssen wir, glaube ich, auch fortsetzen. Außerdem halte ich es für unerlässlich,
  dass die israelische Regierung die Einnahmen an die Palästinensische Autonomiebehörde
  freigibt, die ihr rechtmäßig zustehen. Das würde einen enormen Beitrag dazu leisten,
  dass die Palästinensische Autonomiebehörde sowohl im Gazastreifen als auch im Westjordanland
  im Bereich der Gesundheitsversorgung und auch im Bildungswesen effektiver und wirkungsvoller
  agieren kann.'
