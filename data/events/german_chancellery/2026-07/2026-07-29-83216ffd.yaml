title: 'Bundesregierung beschließt Sondermünzen zu „Tamara Danz“ und „Metropolis“
  – Staatsminister Weimer: „Echte Kunstwerke für die Hosentasche“'
text: 'Das Bundeskabinett hat heute die Prägung zweier Silber-Sondermünzen im Jahr
  2027 beschlossen. Damit wird des 75. Geburtstags der Sängerin Tamara Danz und der
  Uraufführung des Films „Metropolis“ vor 100 Jahren gedacht. Staatsminister Wolfram
  Weimer erklärt: „Sondermünzen sind weit mehr als Zahlungsmittel. Sie erzählen Geschichten
  über unser Land, veranschaulichen seine kulturelle Identität. Sie sind echte Kunstwerke
  für die Hosentasche. Mit Tamara Danz und Metropolis würdigen wir zwei herausragende
  kulturelle Leistungen, die das Selbstverständnis unseres Landes bis heute – im wahrsten
  Sinne – mitprägen.“ Mit einer 35€-Sondermünze erinnert die Bundesrepublik an Tamara
  Danz. Sie war die weibliche Stimme der Rockmusik in der DDR. Mit ihrer Band Silly
  schuf sie Songs, deren poetische und zugleich unerschrockene Texte von den Hoffnungen,
  Widersprüchen und Erfahrungen eines Lebens im SED-Staat erzählten. Bis heute gilt
  sie als eine der bedeutendsten deutschen Rockmusikerinnen der 1980er- und 1990er-Jahre.
  Ihr künstlerisches Vermächtnis reicht weit über ihren frühen Tod im Jahr 1996 hinaus.
  Eine weitere 35€-Sondermünze erinnert an den monumentalen Film „Metropolis“ von
  Fritz Lang, der als einflussreichster Science-Fiction-Film der Geschichte gilt.
  Neue Spezialeffekte, die filmische Sprache und nicht zuletzt die Erfindung des „Maschinenmenschen“
  prägte das ganze Genre und erinnert an die heutige Entwicklung der KI. Deutschland
  greift mit seinen Sondermünzen regelmäßig bedeutende Persönlichkeiten und kulturelle
  Meilensteine auf. In den vergangenen Jahren wurden unter anderem Immanuel Kant,
  Annette von Droste-Hülshoff und Loriot sowie die Berlinale und die Bayreuther Festspiele
  gewürdigt. Mit Tamara Danz und Metropolis setzt die Bundesregierung diese Tradition
  im Jahr 2027 fort.'
