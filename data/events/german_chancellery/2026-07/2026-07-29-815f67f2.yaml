title: Im Kabinett beschlossen KI für effizientere Asylverfahren einsetzen
text: 'Deutschlands Verwaltung wird moderner, digitaler und effizienter – durch den
  Gesetzentwurf zum Einsatz künstlicher Intelligenz auch die Migrationsverwaltung.
  Deutschlands Verwaltung und Verwaltungsprozesse moderner, digitaler und effizienter
  zu gestalten, hat für die Bundesregierung hohe Priorität und ist zugleich Koalitionsvorhaben.
  Nun hat das Kabinett den Gesetzentwurf zum Einsatz künstlicher Intelligenz in der
  Migrationsverwaltung beschlossen. Es ist ein weiterer wichtiger Baustein, Deutschland
  moderner und digitaler aufzustellen. Der Entwurf des KI -Migrationsverwaltungsgesetzes
  beruht dabei auf den im November 2025 beschlossenen Eckpunkten zum Einsatz künstlicher
  Intelligenz in Visumverfahren und der Migrationsverwaltung. Ziel des KI -Migrationsverwaltungsgesetzes
  ist es, asyl- und aufenthaltsrechtliche Verwaltungsverfahren effizienter, einheitlicher,
  qualitativ hochwertiger und sicherer zu gestalten. Die Digitalisierung beschleunigt
  die Verfahren, ermöglicht systematische Auswertungen und einen zielgerichteten Ressourceneinsatz.
  Mit dem Gesetz werden rechtliche Grundlagen für einen rechtssicheren und datenschutzkonformen
  Einsatz von KI -Technologien geschaffen. Künftig sollen die zuständigen Behörden
  personenbezogene Daten aus Asyl- und Aufenthaltsverfahren nutzen dürfen, um Systeme
  mit Künstlicher Intelligenz und andere automatisierte Programme zu entwickeln. Diese
  Programme können Verfahrensabläufe und Entscheidungsmuster analysieren und die Verarbeitung
  von Anträgen und die Entscheidungsfindung optimieren und beschleunigen. Heißt: Dadurch
  sollen Anträge schneller bearbeitet und Entscheidungen einfacher getroffen werden.
  Außerdem kann KI in bestimmten Fällen Angaben aus einem Antrag mit öffentlich zugänglichen
  Informationen im Internet vergleichen. Das ist nur erlaubt, wenn es begründete Zweifel
  gibt, dass die Angaben richtig sind. Der Einsatz von KI in der Migrationsverwaltung
  soll Verfahrensabläufe optimieren und vereinfachen. Individuelle Prüfungen und Entscheidungen
  bleiben vollständig in der Verantwortung der zuständigen Mitarbeiterinnen und Mitarbeiter.'
