title: Aktuelle Gesetze und Regelungen Was ist neu im August 2026?
text: 'Hier finden Sie die Neuregelungen für den August 2026 und weitere Regelungen,
  die im Verlauf des Julis in Kraft getreten sind. Ab dem 1. August 2026 haben Erstklässlerinnen
  und Erstklässler einen Anspruch auf Ganztagsbetreuung, der stufenweise auch für
  Grundschulkinder höherer Klassenstufen eingeführt wird. Das unterstützt die Vereinbarkeit
  von Familie und Beruf. In den Schulferien können nun auch Angebote der Jugendarbeit
  von öffentlichen oder anerkannten Trägern den Rechtsanspruch auf Ganztagsbetreuung
  erfüllen. Weitere Informationen zum Anspruch auf Ganztagsbetreuung Ab dem 2. August
  müssen Unternehmen KI -generierte Inhalte als solche kennzeichnen. Das soll Verbraucherinnen
  und Verbrauchern ermöglichen, klar zu erkennen, ob Video, Audio, Bild oder Text
  maßgeblich mithilfe Künstlicher Intelligenz erstellt wurde oder nicht. Machen Unternehmen
  dies nicht, müssen sie mit erheblichen Geldstrafen rechnen. Gleichzeitig tritt am
  29. Juli die europäische KI -Verordnung in Deutschland über ein nationales Durchführungsgesetz
  in Kraft. Ziel ist, einen innovationsfreundlichen und verlässlichen Rechtsrahmen
  für KI in Deutschland zu schaffen. Die Bundesnetzagentur wird dabei zentrale Koordinierungsstelle.
  Ob Brötchentüte oder To-go-Becher: Wer Verpackungen auf den Markt bringt, muss dazu
  beitragen, Verpackungsabfälle zu vermeiden. Zudem dürfen Verpackungen künftig deutlich
  weniger schwer recycelbare Kunststoffe oder auch gefährliche Stoffe enthalten. Das
  sieht eine EU-Verpackungsverordnung vor, die in weiten Teilen ab dem 12. August
  2026 gilt. Weitere Informationen zur Verpackungsverordnung Defekte Waschmaschinen,
  Kühlschränke und Smartphones werden oft nicht repariert, sondern durch neue Produkte
  ersetzt. Das soll sich jetzt ändern. Für alle Kaufverträge ab dem 31. Juli 2027
  gilt das neue Recht auf Reparatur. Das Gesetz verpflichtet Hersteller auch nach
  Ablauf der zweijährigen Garantie, bestimmte Elektrogeräte zu reparieren. Ziel ist
  es, Elektroschrott zu reduzieren und Ressourcen zu sparen. Weitere Informationen
  zum Recht auf Reparatur So viel wie noch nie investiert die Bundesregierung in die
  Sanierung kaputter Straßen, überlasteter Schienenwege, maroder Brücken und sanierungsbedürftiger
  Wasserstraßen. Damit die dafür vorgesehenen Gelder schnell wirksam werden, ermöglicht
  das Infrastruktur-Zukunftsgesetz langwierige Verfahren zu verkürzen. Wichtige Bauvorhaben
  werden künftig prioritär behandelt. Das Gesetz tritt zu Teilen am 29. Juli 2026
  in Kraft. Weitere Informationen zum Infrastruktur-Zukunftsgesetz Wer möchte, kann
  seit Juli in Apotheken mehr pharmazeutische Dienstleistungen in Anspruch nehmen.
  So darf beispielsweise in Apotheken mehr geimpft werden, Blut für diagnostische
  Zwecke entnommen und Schnelltests gegen bestimmte Erreger durchgeführt werden. Das
  stärkt die Prävention und verbessert die Gesundheitsversorgung. Weitere Informationen
  zur Gesundheitsberatung Die Abfertigung für Fluggäste an deutschen Flughäfen wird
  auf freiwilliger Basis einfacher und schneller. Fluggäste können künftig dank eines
  biometrischen Abgleichs verschiedene Kontrollpunkte am Flughafen kontaktlos passieren.
  Wartezeiten werden so reduziert und der Weg zum Boarding komfortabler. Das entsprechende
  Gesetz ist am 23. Juli 2026 in Kraft getreten. Weitere Informationen zur Fluggastabfertigung
  Ab dem 24. Juli entfällt die Weiterbildungspflicht für Makler. Die Genehmigungsfiktion
  gilt für alle erlaubnispflichtigen Gewerbe. Schornsteinfeger müssen ab Ende Juli
  keine Heizungslabel mehr anbringen. Das Gesetz zum Bürokratierückbau in der Gewerbeordnung
  und im Energieverbrauchskennzeichnungsgesetz wurde am 23. Juli im Bundesgesetzblatt
  veröffentlicht. Die verschiedenen Regelungen des Gesetzes treten zu unterschiedlichen
  Zeitpunkten in Kraft. Weitere Informationen Bürokratierückbau in Immobilien- und
  anderen Gewerben Das Stromnetz in Deutschland ist seit vielen Jahren eines der zuverlässigsten
  in Europa. Das soll auch in Zukunft so bleiben. Das „Strom-Versorgungssicherheits-
  und Kapazitätengesetz“ soll sicherstellen, dass auch in Zukunft ausreichend flexible
  Kapazitäten auf dem Strommarkt verfügbar sind. Dieses Gesetz ist seit dem 21. Juli
  2026 in Kraft. Weitere Informationen zur Stromversorgung'
