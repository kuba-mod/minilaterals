date: '2026-07-27'
type: press_release
source_name: german_chancellery
title: Im Wortlaut Regierungspressekonferenz vom 27. Juli 2026
text: '(Vorsitzende Buschow eröffnet die Pressekonferenz und begrüßt StS Kornelius
  sowie die Sprecherinnen und Sprecher der Ministerien.) Einen schönen guten Tag auch
  von mir. Ich habe zwei Dinge, die ich Ihnen aktiv mitteile. Die verheerenden Waldbrände
  in Frankreich und Spanien erfüllen die Bundesregierung mit großer Betroffenheit.
  Sie drückt ihren Respekt für die Feuerwehr- und Rettungskräfte in den betroffenen
  Orten und Gebieten aus, die unter extremen Bedingungen und mit unermüdlichem Einsatz
  gegen die Flammen kämpfen. Die Gedanken sind natürlich auch bei den betroffenen
  Bürgerinnen und Bürgern, die um ihre Existenz bangen und die evakuiert werden müssen.
  Der Bundeskanzler steht mit dem französischen Präsidenten Macron und dem spanischen
  Ministerpräsidenten Sánchez in Kontakt. Beiden hat er die Solidarität und die Anteilnahme
  der Bundesregierung und der Menschen in Deutschland übermittelt. Europa rückt enger
  zusammen. Wir lassen unsere Nachbarn und Freunde nicht allein. Deswegen leistet
  Deutschland konkret personelle und technisch-materielle Hilfe vor Ort. Zwei Hubschrauber
  CH-53 der Bundeswehr, ein Transportflugzeug und Soldaten sind auf dem Weg ins Katastrophengebiet
  und werden nach Auskunft der französischen Regierung umgehend eingesetzt. Außerdem
  noch zwei Sätze zum Terroranschlag in Berlin: Der Bundeskanzler hat sich gestern
  wie sehr viele Mitglieder der Bundesregierung geäußert. Ich möchte hier im Namen
  der Bundesregierung noch einmal das Wort ergreifen. Die Tat vom Wochenende hat Deutschland
  erschüttert und fassungslos gemacht. Der Bundeskanzler ist ebenso wie wir alle über
  diese verachtenswerte Tat, den Anschlag am Rande des Christopher Street Days in
  Berlin bestürzt. Er hat gestern bereits ausgedrückt, dass die Gedanken bei den Betroffenen
  und ihren Angehörigen sind. Den Verletzten wünscht er eine schnelle und vollständige
  Genesung. Der Dank gilt natürlich auch den Rettungskräften der Polizei und allen,
  die in dieser sehr unübersichtlichen und für sehr viele Menschen auch irritierenden
  Situation unterstützend, helfend, sortierend und stabilisierend dabei waren. Der
  Bundeskanzler möchte auch die Aussage noch einmal unterstreichen, die er gestern
  an die queere Gemeinschaft gerichtet hat: „Wir werden die Freiheit, die Offenheit,
  die Liberalität unseres Lebens und unserer Gesellschaft mit allem, was wir tun können,
  verteidigen, und wir werden es gemeinsam machen.“ Der Bundeskanzler hat gestern
  hervorgehoben, dass wir es nicht zulassen werden, dieses Gift des Terrorismus und
  das Gift gegen unsere Freiheit in unsere Gesellschaft weiter eindringen zu lassen.
  Extremisten haben in der Mitte dieser Gesellschaft keinen Platz. Wir werden nun
  die Hintergründe der Tat sorgfältig aufklären. Das ist Gegenstand der laufenden
  Ermittlungen. Die Behörden, die dafür zuständig sind, arbeiten mit Hochdruck. Sie
  werden von den einen oder anderen Stellen sicherlich fortlaufend dazu informiert
  werden. Ich habe eine Frage ans Justizministerium. Sehen Sie mit Blick auf den Anschlag
  vom Wochenende Strafrechtsverschärfung als nötig an? Es gibt auch Forderungen, sich
  das Jugendstrafrecht noch einmal anzugucken bzw. dessen Anwendung zu überprüfen.
  Wie stehen Sie dazu? Zunächst möchte ich bekräftigen, dass Bundesjustizministerin
  Stefanie Hubig von dem gestrigen Anschlag ebenso erschüttert war wie die anderen
  Mitglieder der Bundesregierung. Sie hat gestern ihren Urlaub unterbrochen, um hier
  in Berlin an der Gedenkveranstaltung teilzunehmen. Das Justizministerium wird selbstverständlich
  sehr sorgfältig prüfen, welche rechtspolitischen Schlussfolgerungen aus der Tat
  zu ziehen sind. Die Tat selbst liegt noch nicht einmal 48 Stunden zurück, und die
  Ermittlungen des Generalbundesanwalts laufen noch. Das heißt, für eine abschließende
  Bewertung gesetzgeberischen Handlungsbedarfs im Bereich des Strafrechts wäre es
  an dieser Stelle sicherlich zu früh. Ich kann aber auf einzelne Aspekte, die Sie
  implizit angesprochen haben, etwas näher eingehen. Was das materielle Strafrecht
  anbelangt, ist bereits im April eine Verschärfung des Terrorismusstrafrechts in
  Kraft getreten, mit dem Strafen im Bereich des Terrorismus verschärft und Straflücken
  geschlossen wurden. Dabei ging es zum Beispiel um die Vorbereitung von Anschlägen
  mit Alltagsgegenständen. Es ging auch um das Phänomen der „foreign terrorist fighters“,
  also von Personen, die aus dem Ausland nach Deutschland einreisen, um terroristische
  Straftaten zu begehen. Zu dem Konkreten der strafrechtlichen Vorgeschichte des Täters
  vom Wochenende kann ich mich für das Justizministerium nicht äußern. Allerdings
  ist aufgrund einer ausführlichen Pressemitteilung der Staatsanwaltschaft Berlin
  bekannt, dass der Täter bereits nach dem alten Terrorismusstrafrecht verurteilt
  wurde, dass er also nach § 89a StGB zu einer Freiheitsstrafe verurteilt wurde. Insofern
  zeigt seine Vorgeschichte keine Lücken im materiellen Strafrecht auf. Wir befinden
  uns bei diesen Taten, wenn es zum Beispiel um das Reisen ins Ausland geht, um sich
  dort einer terroristischen Vereinigung anzuschließen, weit im Vorfeld konkreter
  Straftaten. Trotzdem ist dafür schon heute nach dem Terrorismusstrafrecht ein erheblicher
  Strafrahmen möglich. Es versteht sich von selbst, dass die vorsätzliche Tötung von
  Menschen im Rahmen von terroristischen Anschlägen schon heute mit den schwersten
  Strafen nach deutschem Strafrecht bestraft wird, die wir kennen. Insofern gibt es
  im materiellen Strafrecht keine konkreten Lücken. Aber auch insofern gilt natürlich,
  dass sich das Justizministerium sehr genau ansehen wird, welche weiteren Erkenntnisse
  sich im Zuge der Ermittlungen ergeben. Die andere Debatte betrifft das Jugendstrafrecht.
  Es gibt jetzt schon verschiedene Forderungen im politischen Raum, die ich an dieser
  Stelle wie üblich nicht kommentieren werde. Ich kann aber darauf hinweisen, dass
  das Bundesjustizministerium, so wie es auch die Koalitionsparteien vereinbart haben,
  eine große Studie ausgeschrieben hat, die ganz grundlegend und systematisch Änderungsbedarf
  im Bereich des Strafrechts, das für Jugendliche und Heranwachsende gilt, prüfen
  wird. Ausdrücklich wird sich diese Studie auch mit der Anwendung des Jugendstrafrechts
  auf Heranwachsende beschäftigen, also auf Personen wie den Täter vom Wochenende.
  Auch insofern werden wir also genau hinsehen. Drittens und abschließend gibt es
  neben dem materiellen Strafrecht und dem Jugendstrafrecht auch immer die Frage der
  Erkenntnismöglichkeiten von Ermittlungsbehörden. Diesbezüglich hat die Bundesregierung
  schon Erhebliches auf den Weg gebracht. Mit der IP-Adressenspeicherung wurde ein
  jahrzehntelanger Konflikt im Bereich der Ermittlungsbefugnisse der Ermittlungsbehörden
  beigelegt. Ein entsprechender Gesetzentwurf befindet sich im parlamentarischen Verfahren.
  Außerdem sei außerhalb unserer Zuständigkeit die geplante Reform des Rechts der
  Nachrichtendienste erwähnt. Auch im Bereich der Gefahrenabwehr ist viel unterwegs.
  Das möchte ich nur erwähnen, um zu unterstreichen, dass die Bundesregierung schon
  lange vor der schrecklichen Tat vom Wochenende umfassende Maßnahmen auf den Weg
  gebracht hat, um die innere Sicherheit in Deutschland durch ganz verschiedene Maßnahmen
  zu stärken. An das Innenministerium: Soll die Überwachung von Gefährdern jetzt verschärft
  werden? Ich muss Sie darauf hinweisen, dass die Gefährderüberwachung Ländersache
  ist. Ich kann Ihnen, wenn Sie mögen, gern ein paar andere Maßnahmen zum Thema, was
  wir seitens des Bundesinnenministeriums bereits tun, nennen. Mit Blick auf den islamistischen
  Terrorismus kann ich Sie außerdem auf den Koalitionsvertrag verweisen. Darin steht
  ganz deutlich, dass Islamismusbekämpfung einen Fokus bekommen soll. Es gibt dazu
  den Beraterkreis Islamismusprävention und Islamismusbekämpfung. Ich kann Sie des
  Weiteren darauf hinweisen, dass unsere Sicherheitsbehörden in den letzten zehn Jahren
  fast 30 islamistische Anschläge erfolgreich verhindert haben. Das heißt, die Sicherheitsbehörden
  sind diesbezüglich durchaus aktiv. Wären überhaupt Mittel vorhanden, um die Überwachung
  dichter zu gestalten? Da sich die Frage auf die Gefährder bezieht, für die die Länder
  zuständig sind, muss ich da passen. Herr Hosemann, ich habe eine Nachfrage zu der
  Studie, von der Sie gerade gesprochen haben. Aus welchem Anlass ist diese Studie
  in Auftrag gegeben worden, und für wann genau ist damit zu rechnen, dass die Ergebnisse
  vorliegen? Dann habe ich noch eine Frage ans BMI: Der Minister hat vor ein paar
  Tagen die Gefahr sozusagen hochgestuft und von einer erhöhten Gefahr gesprochen.
  Rückblickend wirkt das nahezu prophetisch. Gab es vor diesem Hintergrund Hinweise
  oder Erkenntnisse, dass so etwas wie am Wochenende passieren könnte, oder ist das
  in dem Fall Zufall gewesen? Noch einmal zum Verfahren: Die Studie ist jetzt ausgeschrieben.
  Ein Zuschlag ist noch nicht erteilt worden. Für wann der Abschluss der Studie zu
  erwarten ist, werden wir im weiteren Ausschreibungsverfahren, wenn wir den Zuschlag
  erteilt haben, mitteilen können. Zum Hintergrund: Anlass d es Vorhabens, sich das
  Jugendstrafrecht noch einmal systematisch und genau anzusehen, ist nicht ein erschütternder
  Einzelfall, sondern die generelle Beobachtung, dass es in Bezug auf Straftaten von
  Kindern und Jugendlichen beunruhigende Entwicklungen, eine Zunahme von Fallzahlen
  gibt. Darauf soll eine Antwort gefunden werden, aber eben auf einer fundierten wissenschaftlichen
  Grundlage und nicht in Form von schnellen Pauschalmaßnahmen, die den Grundgedanken
  des Strafrechts in Bezug auf Jugendliche und Heranwachsende infrage stellen. Zu
  Ihrer zweiten Frage: Wir befinden uns aufgrund der hybriden Bedrohungen in einer
  Lage, die wir sehr ernst nehmen. Das war die Grundlage, auf der der Innenminister
  die Gefahr hochgestuft hat. Wir beobachten zunehmend Angriffe. Das hatte ich vergangene
  Woche schon ausgeführt. Daher kam es zu dieser Hochstufung. Auf Ihre Anschlussfrage
  möchte ich sagen, dass wir noch auf das Ergebnis der laufenden Ermittlungen warten.
  Darf ich noch kurz in einem Punkt ergänzen? Mir ist noch zugerufen worden, dass
  erste Zwischenergebnisse der Studie Ende nächsten Jahres vorliegen sollen, Ende
  2027. Ich probiere es erstmal bei Herrn Kornelius und brauche danach noch das Bildungsministerium.
  Zum Thema der Solidarität mit der CSD-Gemeinde, queer Community: Herr Kornelius,
  es gab ja Hinweise aus der Community, dass die Bundesregierung bisher für eher queerfeindliche
  Politik steht und gestanden hat. Der Bundeskanzler hat das Nein zur Regenbogenbeflaggung
  der Bundestagspräsidentin Klöckner vergangenes Jahr unterstützt. Die Bundesregierung
  hat den Aktionsplan „Queer leben“ beendet. Es gibt einen Kahlschlag bei „Demokratie
  leben!“, was viele LGBTQ-Projekte betrifft. Die Bildungsministerin hat Queerpolitik
  aus dem Referatsnamen gestrichen und gegen die Queerbeauftragte geschossen. Wie
  ist die Solidarität damit vereinbar? Ich kann Sie auf die Worte verweisen, die der
  Kanzler gestern in der Kirche gesagt hat. Ich kann sie Ihnen auch gern vorlesen:
  „Ich möchte aber auch ein sehr persönliches Wort an die queere Community richten“,
  „Meine Damen und Herren, nicht erst ein solcher Anschlag wie gestern Abend gefährdet
  unsere Freiheit. Intoleranz, Ausgrenzung, Diskriminierung, dumme Redensarten, schlechte
  Witze sind bereits Teil einer solchen Gewalt ‑ nicht erst das, was wir gestern Abend
  erlebt haben, und das, was Sie erleben mussten.“ „Wir … werden alles tun, um die
  Freiheit … zu schützen“. Er hat sich mit diesen Worten und auch mit dem, was er
  vor der Kirche gesagt hat, selbstverständlich mit der Community solidarisch gezeigt,
  sie unterstützt und sie ermuntert, jetzt nicht zu verzagen und sich durch den Terror
  nicht einschüchtern zu lassen. Ich darf Sie daran erinnern, dass die Debatte um
  die Regenbogenbeflaggung des Bundestages etwas differenzierter war. Der Bundestag
  wird ja beflaggt, an einem Tag. Es ging nur um die Frage, ob es zum CSD eine zusätzliche
  Beflaggung geben würde. Auch ansonsten ist die Bundesregierung, denke ich, offen
  und tolerant. Ich habe ja die bisherigen tatsächlichen Handlungen dieser Bundesregierung
  zum Thema der Queerpolitik genannt. War das also aus Ihrer Sicht kein Fehler? Ans
  Bildungsministerium: Wie steht denn die Bildungsministerin zu ihrer queerfeindlichen
  Politik? Ist das im Nachhinein ein Fehler gewesen? Die Unterstellung in Ihrer Frage
  möchte ich ganz deutlich zurückweisen. Vorangestellt: Die Ministerin hat sich gestern
  zutiefst erschüttert gezeigt, ist umgehend nach Berlin gereist und hat gemeinsam
  mit der Beauftragten Sophie Koch am Nachmittag auch Blumen am Tatort niedergelegt.
  Ich denke, das war ein ganz deutliches gemeinsames Zeichen. Grundsätzlich möchte
  ich sagen, dass die Förderung queerer Netzwerke, insbesondere auch von Jugendlichennetzwerken
  der queeren Community, der Bundesregierung und auch der Bundesministerin ein ganz
  wichtiges Anliegen ist. Wir wissen, dass gerade queere, auch insbesondere junge
  Menschen in vielen Bereichen gerade auch im ländlichen Raum zu einer besonders vulnerablen,
  auch gefährdeten Gruppe gehören. Deshalb werden ihre Bedarfe auch künftig und ausdrücklich
  berücksichtigt, beispielsweise in dem von Ihnen genannten Bundesprogramm „Demokratie
  leben!“ und auch im Kinder- und Jugendplan. Richtig ist, dass es in beiden Bereichen
  Umstrukturierungen gibt. Ich greife einmal den Kinder- und Jugendplan heraus. Darin
  gibt es strategische Neuausrichtungen. Wir priorisieren dabei genauso wie bei „Demokratie
  leben!“ die besondere Zusammenarbeit mit den Regelstrukturen. Auch dabei sind die
  besonderen Bedarfe gerade queerer Menschen ein Schwerpunkt. Ich verweise auf die
  Strategie der Bundesregierung für die mentale Gesundheit oder die Allianz gegen
  Einsamkeit. Dabei werden gerade queere Jugendliche ausdrücklich als vulnerable Gruppe
  berücksichtigt. Ich habe es schon gesagt: Das gilt insbesondere für die ländlichen
  Räume. Das heißt, diese Bundesregierung sieht bisher die gemachten Taten zum Thema
  Queerpolitik, die ich jetzt genannt habe, nicht als Fehler? Das Fachministerium
  hat ja bereits geantwortet. Die Bundesregierung betreibt keine Politik gegen die
  queere Community. Das ist eine falsche Unterstellung. Sie wissen, dass die Bundesregierung
  geschlossen für Vielfalt, für Toleranz und auch für die Rechte queerer Menschen
  eintritt. Ich glaube, dass die Tat insgesamt sich gegen unseren Gedanken von Freiheit
  und Toleranz richtet. Es ist selbstverständlich eine Tat, die die Bundesregierung
  empören muss und gegen die sie angehen muss. Ich glaube auch nicht, dass es richtig
  ist, dass wir uns von solchen Taten einschüchtern lassen. Wir müssen Gruppen schützen,
  die sich in ihrer Identität suchen, finden, bestärken und das auch öffentlich darstellen.
  Wir müssen sie schützen, wir wollen sie schützen, und die Bundesregierung steht
  zu diesem Schutz, der weit über die queere Bewegung hinausgeht. Wir haben es zu
  tun mit einer Radikalisierung, mit einem Extremismus, sowohl in politisch-ideologischen
  Milieus als auch in religiös-ideologischen Milieus, die sich gegen die Vielfalt
  und die Toleranz in diesem Land wenden, ob es nun um queere Vielfalt oder um andere
  Formen des Zusammenlebens geht. Deutschland steht für diese Vielfalt, Deutschland
  erträgt diese Vielfalt, und die Bundesregierung wird diese Vielfalt verteidigen.
  Die Ermittlungen im Kontext dieses mutmaßlichen Terrorangriffs obliegen ja der Begrenzung,
  dass der mutmaßliche Täter getötet wurde. Da würde mich interessieren: Liegen denn
  dem BMI oder anderen Vertretern der Bundesregierung Informationen vor, wie unausweichlich
  es war, diesen mutmaßlichen Täter zu töten und ihn nicht nur sozusagen bewegungsunfähig
  zu machen? Ich weiß nicht, ob Sie die Äußerungen der Landespolizei gestern verfolgt
  haben. Die haben sich ja dazu auch geäußert. Das war ja ein Zugriff vom SEK, also
  der Landespolizei. Der SEK-Beamte hat dort in Notwehr gehandelt. Ich muss Sie zur
  Frage nach dem genauen Tathergang an die Landespolizei verweisen. Aber was Sie hier
  als Frage formuliert haben, kann ich so nicht bestätigen. Sie schließen sich sozusagen
  der Darlegung an, dass es sich um einen Notfall des SEK gehandelt hat? Ich kann
  hier nur das wiedergeben, was wir selbst von der Landespolizei wissen. Also ich
  bin hier eigentlich nicht die richtige Adresse. Aber das ist das, was wir wissen.
  Im Prinzip hat Herr Kornelius ja vieles schon gesagt. Nur noch eine Nachfrage: Sie
  haben genannt, was auf dem Weg nach Frankreich ist. Gibt es auch entsprechende Hilfegesuche
  aus Spanien, oder wie hilft Deutschland mit Blick auf spanische Waldbrände? Ich
  weiß nicht, ob Sie zu Spanien Kenntnis haben. Im Rahmen der europäischen Nothilfe
  wurden sicherlich die Hilfspläne aktiviert. Da befinden sich auch Rettungskräfte
  aus anderen europäischen Ländern im Einsatz. Deutschland ist ja auch im Rahmen dieses
  europäischen Hilfeverbundes beteiligt. Konkret zu Spanien: Direkte deutsche Abordnungen
  sind mir momentan nicht bekannt. Das ist, wie gesagt, das Kontingent für Frankreich.
  Aber vielleicht bin ich da nur nicht ausreichend informiert. Das ist völlig richtig.
  Das läuft so ab, dass im Rahmen dieses europäischen Krisenmechanismus Bedarfe angemeldet
  werden und dann geguckt werden muss, ob man da sozusagen ein „matchmaking“ machen
  kann, ob entsprechende Kapazitäten auf der Seite der europäischen Partner vorhanden
  sind. Das ist ‑ mit Blick auf Frankreich kann sicher der Kollege des BMVg noch ergänzen ‑
  bereits abgerufen und meiner Kenntnis auf dem Wege. Bei Spanien wird weiter geschaut.
  Ich kann nur noch mal unterstreichen, dass der Außenminister gestern mit allen drei
  betroffenen Amtskollegen ‑ in geringerem Maße betrifft das natürlich auch Italien,
  aber an vorderster Front Frankreich und Spanien ‑ in Kontakt war und angeboten hat,
  dass wir, sollte es Bedarfe geben und sollten wir als Bundesregierung an verschiedener
  Stelle Möglichkeiten haben, zur Unterstützung bereit sind. Das findet sich auch
  auf X entsprechend wieder. Es ist ja auch eine A400M nach Frankreich geschickt worden.
  Habe ich das richtig verstanden? Ist das dann auch eine Maschine, aus der möglicherweise
  Löschmittel abgeworfen werden könnten, so wie das in Frankreich möglich ist? Oder
  geht es hier in erster Linie um Transportkapazitäten, um logistische Kapazitäten?
  Genau. Wie wir in unserer Pressemitteilung, die wir vor circa einer Stunde herausgegeben
  haben, ja bekanntgegeben haben, haben wir zwei Hubschrauber CH-53 und einen A400M
  auf den Weg geschickt. Der A400M dient vorrangig dem Personal- und Materialtransport.
  Für den Einsatz als Feuerlöschflugzeug bedürfte es weiterer technischer Ausstattung,
  die wir bisher nicht als Fähigkeiten in unseren Streitkräften vorhalten. Herr Kornelius,
  die Waldbrände in Spanien sind ja mindestens so dramatisch wie in Frankreich. Da
  würde mich schon interessieren, wieso Sie sich in Ihrer Einführung ausschließlich
  auf Frankreich konzentriert haben. Könnten Sie das noch kurz darlegen? Nein, ich
  habe in meiner Ausführung Frankreich und Spanien genannt, beides zusammen. Da gibt
  es keine Unterscheidung. Es wäre absurd, wenn wir eine Hierarchisierung der Betroffenheit
  machen oder so. Die Brände sind überall gravierend. Wenn Sie die Kommunikation des
  Bundeskanzlers auf X und auch auf anderen Kanälen betrachten, werden Sie feststellen:
  Er hat sich natürlich auch zu Spanien geäußert, längst bevor in Frankreich die Feuer
  in dieser Dimension zu erkennen waren. Gut, vielleicht haben dann die neuen Räumlichkeiten
  meine Aufmerksamkeitskapazität eingeschränkt. Eine weitere Nachfrage hätte ich noch:
  Zumindest in Spanien wird ja innenpolitisch relativ heiß diskutiert, dass aufgrund
  der Russlandsanktionen eine spezielle Flotte von Löschhubschraubern Ka-32 nicht
  mehr zur Verfügung steht. Gibt es denn da Gespräche auf EU-Ebene, zumindest in diesem
  sehr spezifischen Fall, die Sanktionen zu lockern, um Wartung und auch Ersatzteile
  für diese Ka-32 zur Verfügung zu stellen? Da ist mir kein Sachzusammenhang bekannt.
  Wie groß ist denn, Stand heute, die Gefahr in Deutschland für Brände? Im Südwesten
  gab es ja auch schon einzelne Waldbrände. Grundlegend muss ich sagen, dass die Gefahrenbeurteilung
  Ländersache ist. An der Stelle muss ich Sie also an die Länder verweisen. Der Bundesumweltminister
  und unser Haus haben natürlich darauf hingewiesen, dass jetzt Extremwetterlagen
  aufgrund des fortschreitenden Klimawandels zunehmen können und wir deshalb Anpassungsmaßnahmen
  vornehmen müssen. Mehr Wasser in der Fläche zu halten oder der Waldumbau sind Maßnahmen,
  die wir natürlich auch vom Haus unterstützen, die dann dieses Risiko senken. Ich
  will noch einmal darauf hinweisen, dass sich der Bundesumweltminister zu den Waldbränden
  in Frankreich und in Spanien geäußert hat. Darin hat er sein Mitgefühl für die Betroffenen
  und für die Einsatzkräfte geäußert und noch einmal darauf hingewiesen, dass wir
  eben beide Sachen brauchen, einerseits den fortschreitenden Kampf, um den Klimawandel
  zu reduzieren, aber eben auch die Fortsetzung von Klimaanpassungsmaßnahmen. Die
  Forstkammer Baden-Württemberg fordert mehr Geld für den Schutz vor Waldbränden.
  Ist denn die Bundesregierung dazu bereit? Dazu kann ich aktuell keine Aussagen treffen.
  Wie gesagt, für die Gefahrenabwehr sind die Themen beim BMI, soweit ich das sehe.
  Für Umbaumaßnahmen, also Waldumbauten usw., gibt es umfassende Förderung aus unserem
  Haus. Nur eine Lernfrage ans BMVg: Auf wie vielen Truppenübungsplätzen brennt es
  gerade? Da habe ich jetzt aktuell keinen Sachstand. Ich bin mir auch nicht sicher,
  ob wir den Sachstand derzeit wirklich so zusammen haben. Mir ist jetzt kein größerer
  Brand auf einem aktiven Truppenübungsplatz bekannt. Wenn ich etwas dazu habe, reiche
  ich das noch im Verlauf dieser Regierungspressekonferenz nach. Grundlage war jetzt
  vor zwei Tagen gerade Jüterbog, wo es brennt. Es würde mich also interessieren,
  was Ihre Übersicht ist. Zweitens. Finden gerade Übungen auf Truppenübungsplätzen
  statt? Hintergrund ist, dass es ja immer wieder auch Waldbrände durch Übungen gab.
  Sie wissen, dass wir als Streitkräfte das ganze Jahr unser Personal ausbilden und
  beüben müssen. Das hängt natürlich mit den Einstellungen zusammen, also wann Einstellungstermine
  sind. Dann finden Grundausbildungen statt; da werden Übungen durchgeführt. Es werden
  größere Übungen dann später auch mit technischem Gerät durchgeführt. Das findet
  also kontinuierlich statt. Solche Übungen werden natürlich ‑ das liegt auch in der
  Verantwortung unserer Einheiten vor Ort ‑ immer in Abwägung der äußeren Umstände
  angesetzt und werden unter Beachtung aller relevanten Sicherheitsmaßnahmen durchgeführt,
  um so etwas zu vermeiden. Herr Kornelius, vielleicht können Sie einmal sagen, warum
  der Kanzler den Posten des Verkehrsministers neu besetzen will. Der Bundeskanzler
  wird nach den Gremiensitzungen der Partei noch einmal zu den Kabinettsumbildungen
  sprechen und die finalen Entscheidungen bekanntgeben. Dem kann ich jetzt hier nicht
  vorweggreifen. Ich glaube auch, dass die Gespräche zwischen dem Bundeskanzler und
  dem noch amtierenden Verkehrsminister so verlaufen sind, dass diese Situation intern
  geklärt ist. Herr Kornelius, ist denn der Tausch weiterer Minister geplant oder
  bleibt es bei den bisher angekündigten? Wir haben das ja kommuniziert. Der Bundeskanzler
  hat letzte Woche bereits Nina Warken als Chefin des Bundeskanzleramtes vorgeschlagen.
  Vorgeschlagen heißt, der Bundespräsident wird dann um die Ernennung gebeten. Stefan
  Bilger ‑ das hatte ich gestern Abend kommuniziert ‑ soll neuer Bundesminister für
  Verkehr werden, Carsten Linnemann Bundesminister für Gesundheit, und Philipp Amthor
  wird zum Staatsminister beim Bundeskanzler für die Bund-Länder-Koordination berufen.
  Sie wissen, dass der Bundespräsident Minister entlässt und ernennt. Die Entlassung
  und Ernennung ist für kommenden Mittwoch geplant, um die Mittagszeit. Die genaue
  Uhrzeit wird Ihnen noch kommuniziert. Die erforderliche Vereidigung wird dann zeitnah
  in der nächsten Sitzung des Bundestags erfolgen. Stimmt es, dass auch Christiane
  Schenderlein ihren Posten verlieren wird? Ich verweise noch einmal auf die parallel
  stattfindende Pressekonferenz des Bundeskanzlers und kann Ihnen nur sagen, dass
  Sie hier in der falschen Show sind. Herr Kornelius, könnten Sie noch einmal darstellen,
  was nach Ansicht des Bundeskanzlers die Hauptaufgaben und ‑themenbereiche sind,
  die der neue Verkehrsminister anzupacken hat? Das Verkehrsministerium verfügt über
  große Mittel, die mit dem Sondervermögen, das diese Koalition aufgenommen hat, in
  Verbindung stehen. Die Mobilisierung zusätzlichen Kapitals ist notwendig, um die
  enormen Finanzierungsbedürfnisse für die Infrastrukturprojekte ‑ nicht nur Schiene,
  sondern vor allem auch Straße, Schifffahrtswege, Luftverkehr usw. ‑ zu finanzieren.
  Es geht um die Frage, ob sich innovative neue Finanzierungsmöglichkeiten ergeben;
  es geht um die Frage, ob mit Blick auf den wirklich zwingenden Infrastrukturbedarf
  nicht das Tempo erhöht werden muss bzw. der Umsetzung mehr Nachdruck verliehen werden
  muss. Der Bundeskanzler hat diese Forderungen in letzter Zeit häufig genannt. Er
  wird sie auch dem neuen Minister als Erwartung, die seine Arbeit begleitet, mit
  auf den Weg geben. Es gibt bei einigen Fachverbänden die Befürchtung ‑ so kann man
  zwischen den Zeilen lesen ‑, dass durch diesen Wechsel jetzt Zeit verlorengeht.
  Ist das eine berechtigte Sorge? Ich halte diese Sorge nicht für berechtigt. Der
  designierte Verkehrsminister Steffen Bilger ist ein anerkannter Verkehrsexperte,
  der auch keine große Einarbeitungszeit benötigen wird. Er ist facherfahren, wie
  Sie wissen, und wird die Lücke sehr schnell schließen. Herr Kornelius, Sie haben
  schon angekündigt, dass wir hier ein bisschen auf der falschen Veranstaltung sind,
  um ausführlich über die Kabinettsumbildung zu sprechen. Warum macht man das jetzt
  nach dem Rücktritt von Herrn Spahn? Viele haben gemutmaßt, dass eine Kabinettsumbildung
  eigentlich erst nach den Landtagswahlen im Osten sinnvoll wäre. Warum hat der Kanzler
  diesen Zeitpunkt gewählt? Können Sie vielleicht auch ein bisschen auf die Metaebene
  gehen und erläutern, was der Grundgedanke des Kanzlers bei dieser Umbildung war?
  Sehr gerne. ‑ Der Auslöser der Kabinettsumbildung war, wie Sie hier zu Recht sagen,
  der Rücktritt von Herrn Spahn. Ich habe hin und wieder gelesen, dass es doch möglich
  gewesen wäre, Herrn Spahn einfach zu ersetzen und damit die Sache zu beschließen.
  Die Funktion des Fraktionschefs ist aber von so elementarer Bedeutung, dass es fast
  schon zwangsläufig war, dass eine Nachbesetzung weitere Folgeentscheidungen nach
  sich ziehen würde. Des Weiteren ist Thorsten Frei als nun designierter Fraktionsvorsitzender
  auch in der Bundesregierung in einer herausgehobenen Position gewesen. So entstand
  eine ganze Kette von Folgeentscheidungen, die der Bundeskanzler auf das kleinstmögliche
  Maß reduziert hat. Die Nachbesetzung im Bundeskanzleramt und die Nachbesetzung im
  Gesundheitsministerium sind Teil dieser Kette. Die Überlegung, nach einem guten
  Jahr Regierungszeit Nachjustierungen im Kabinett vorzunehmen, war beim Bundeskanzler
  schon länger entstanden. Der Zeitpunkt dafür ist nicht festgelegt gewesen. Es ist
  aber geradezu ein logischer Schluss, dass man die durch den Rücktritt von Jens Spahn
  ausgelöste Besetzungskette jetzt nutzt, um diese Entscheidungen gleich mit voranzutreiben.
  Das ist innerhalb kürzester Zeit gelungen. Es gab, wie Sie wissen, einen Vorschlag
  für die Nachbesetzung im Verkehrsministerium, die aus Gründen, die der Bundeskanzler
  nicht steuern kann, kurz vor der Verkündung nicht zustande kam. Der Bundeskanzler
  hat gestern sein Bedauern über diese Situation ausgedrückt und hat dieses Bedauern
  auch noch einmal Patrick Schnieder mitgeteilt. Der Abschluss der Umbesetzung erfolgt
  heute mit der Bekanntgabe weiterer Positionen, die infolge dieser Kabinettsumbildung
  auch auf Staatssekretärsebene notwendig sind. Die Fraktion wird dann am Mittwoch
  darüber entscheiden, ob sie dem Vorschlag des Bundeskanzlers und des Parteivorsitzenden
  der CSU folgt, Thorsten Frei als Fraktionsvorsitzenden zu wählen. Die Partei wird
  dann ebenfalls die Vorschläge des Bundeskanzlers für die Gremien zur Kenntnis nehmen
  und auf den entsprechenden Parteitagen oder in den jeweiligen Beschlussgremien darüber
  befinden. Insofern ist diese Personalrochade jetzt nach einer guten Woche abgeschlossen.
  Sie ist in einem Umfang geschehen, der wegen der Kettenversetzungen notwendig war,
  aber gleichzeitig nicht ausufert. Sie ist außerdem logisch, sie ist schlüssig in
  der Begründung, die der Bundeskanzler geliefert hat, und bis auf das Ärgernis am
  letzten Donnerstag auch sehr zufriedenstellend abgelaufen. Wenn die Umbildung schon
  länger geplant war, wäre es dann nicht möglich gewesen, eventuelle Nachfolger ‑
  etwa Herrn Güntzler, der so kurzfristig zurückgezogen hat ‑ länger vorab zu briefen?
  Über die genauen Zeitfolgen, Gesprächsfolgen und Planungszeiträume werde ich jetzt
  keine Auskünfte geben. Es gibt auch einen internen Bereich der Bundesregierung,
  in dem der Bundeskanzler handeln und arbeiten muss. Die Dynamik der letzten Woche
  und Ihre innerhalb von 36 Stunden nicht nachlassende Sehnsucht nach Personalfragen
  gibt Anlass zu der Beobachtung, dass solche Dinge in der Regel sehr schnell entschieden
  werden müssen. Herr Kornelius, ich habe eine Verständnisfrage zur Amtsübernahme
  und dem Amtseid. Ich gehe davon aus, dass der Bundeskanzler das Grundgesetz kennt,
  in dem ja eindeutig steht, dass die Bundesminister ihren Amtseid vor dem Bundestag
  bei der Amtsübernahme leisten und nicht sechs Wochen später. Was hat der Bundeskanzler
  daran nicht verstanden? Sie unterstellen wieder ein Fehlverhalten, das nicht vorliegt.
  Es gibt eine Rechtslage, und da Sie das Grundgesetz auch kennen, will ich hier noch
  einmal das Rechtsverständnis teilen. Der konstituierende Akt für die Ernennung eines
  Ministers oder einer Ministerin ist die Aushändigung der Ernennungsurkunde. Bundesministerinnen
  und Bundesminister sind mit der Aushändigung der Ernennungsurkunde voll amtsfähig.
  Die Amtshandlungen, die ein Bundesminister nach dem Erhalt der Urkunde ausführt,
  sind rechtsgültig, selbst wenn sie vor der Eidesleistung stattfinden. Das Grundgesetz
  sieht in Artikel 64 Absatz 2 ‑ darauf nehmen Sie Bezug ‑ vor, dass die Mitglieder
  der Bundesregierung bei der Übernahme ihres Amtes den vorgesehenen Eid leisten.
  Das bedeutet in der Interpretation: Ein enger zeitlicher Zusammenhang zwischen Amtsbezug
  und Eidesleistung ist zu wahren. Es bedeutet nicht, dass der Eid zwingend zum Zeitpunkt
  der Ernennung zu leisten ist. Es gibt einen politischen Ermessensspielraum der Bundesregierung,
  und der wurde in diesem Fall auch angewandt. Das heißt, die Handlungsfähigkeit der
  Bundesregierung ist mit den Mitgliedern als Spitze der Exekutive sichergestellt,
  und der Amtseid wird dann in der nächstliegenden Sitzung des Deutschen Bundestages
  abgelegt. In Artikel 64 Absatz 2 heißt es: „bei der Amtsübernahme vor dem Bundestage“.
  Genau, bei der Übernahme Ihres Amtes. „Bei der Übernahme“ heißt nicht „am Tag der
  Übernahme“. Ich wollte noch eine Frage hinterherschieben. ‑ Man könnte da aber warten,
  bis der Bundestag Anfang September wieder zusammenkommt, um dann die Bundesminister
  zu vereidigen und ins Amt einzuführen, und bis dahin werden die Ministerien geschäftsführend
  vertreten. Das, was hier jetzt gemacht werden soll, gab es seit 1949, also seit
  Gründung dieser Bundesrepublik, nicht. Insofern scheint das ja nicht so normal zu
  sein, wie Sie es gerade verkaufen wollen. Es gibt eine Amtspraxis und es gibt natürlich
  ein Rechtsverständnis. Das Rechtsverständnis und die Interpretation des Grundgesetzes
  lassen diesen Spielraum zu. Die Bundesregierung nutzt diesen Spielraum aus, auch
  aus Rücksicht auf die Umstände, die mit einer Sondersitzung des Parlaments einhergehen.
  Die Minister sind voll amtsfähig, sie sind geschäftsfähig; die Arbeit der Bundesregierung
  ist sichergestellt. Insofern ist die Aushändigung der Ernennungsurkunde der eigentliche
  konstituierende Akt, der die Amtsfähigkeit herstellt. Herr Kornelius, was spricht
  denn gegen eine Sondersitzung des Bundestages? Die Praxis, die jetzt gewählt wurde,
  ist ausreichend. Diese Praxis stellt die Handlungsfähigkeit der Bundesregierung
  und der neuen Bundesminister sicher. Deswegen gibt es daran auch nichts zu beanstanden.
  Es gibt ja durchaus verfassungsrechtliche Bedenken hinsichtlich der Verfahrensweise.
  Darum noch einmal: Was spricht gegen eine Sondersitzung? Die Bundesregierung hat
  die verfassungsrechtliche Lage geprüft. Sie kam zu dem Entschluss, dass es so funktioniert.
  Ein Argument, das natürlich auch für dieses Verfahren spricht, ist, dass der Aufwand
  einer Sondersitzung zur Vereidigung von zwei neuen Bundesministern unverhältnismäßig
  ist, wenn die Amtsfähigkeit auch sonst gewährleistet ist. Nur ganz kurz: Aus Ihrer
  Sicht liegt aber keine außergewöhnliche Notlage vor, die so ein Verhalten jetzt
  rechtfertigen würde? Meiner Meinung nach ist keine außergewöhnliche Notlage zwingend.
  Ihrer Meinung nach oder der Meinung des Bundeskanzlers nach? Ich weiß nicht, wo
  Sie jetzt den Begriff der außergewöhnlichen Notlage herzaubern. Ich zitiere hier
  die Grundgesetzkenner, und die sagen, nur in einer außergewöhnliche Notlage würde
  es Sinn ergeben, die Amtsübernahme und den Amtseid zeitlich zu trennen? Ich glaube
  nicht, dass das eine grundgesetzliche Interpretation ist. Mir sind die ein, zwei
  Kritikpunkte auch von Verfassungsrechtsprofessoren bekannt, aber es gibt eine Rechtsmeinung,
  die die Bundesregierung erarbeitet hat. Auch dort sitzen Verfassungsfachleute. Wie
  Sie wissen, ist die Verfassung in diesem Punkt so ausgestaltet, dass die Aushändigung
  der Ernennungsurkunde der konstitutive Akt ist, der einen Minister ins Amt beruft
  und ihn amtsfähig macht. Der Eid wird dann zum nächstmöglichen Zeitpunkt geleistet.
  Herr Kornelius, leider geht meine Frage auch an Sie. Ich hätte Ihnen gerne eine
  Verschnaufpause gegönnt. ‑ Das Kanzleramt verweigert aktuell Bundestagsabgeordneten
  jede Auskunft zu möglichen Vorwarnungen vor dem Nord-Stream-Anschlag, und zwar nicht
  nur öffentlich, sondern sogar auch in der Geheimschutzstelle des Bundestages. Da
  würde mich interessieren: Wie rechtfertigt der Kanzler, dass er Vertretern der Legislative
  mit grundgesetzlich verankertem Fragerecht selbst im höchsten Geheimschutzrahmen
  jede Form der Antwort in dieser Nord-Stream-Causa verwehrt? Mir ist keine Anfrage
  zu Nord Stream bekannt; deswegen kann ich den Sachverhalt in dieser Pauschalität
  jetzt nicht beurteilen. Der inzwischen ehemalige Chef des Bundeskanzleramts, der
  in dieser Funktion auch für die Nachrichtendienste verantwortlich war, hat auf eine
  Anfrage der Opposition hin gesagt, dazu würde man in keiner Form Auskunft geben,
  auch nicht in der schon genannten Geheimschutzstelle. Das ist Hintergrund der Frage.
  Wie Sie wissen, ist in dieser Sache ein Strafverfahren anhängig. Die Bundesregierung
  mischt sich nicht in die Arbeiten der Strafverfolgungsbehörden ein und wartet dieses
  Strafverfahren ab. An das Wirtschaftsministerium: Eine Gruppe von US-Senatoren will
  Beschränkungen gegen Hersteller von vernetzten Autos, die chinesische Anteilseigner
  haben, auf den Weg bringen. Davon könnte auch Mercedes-Benz betroffen sein; denn
  die Mercedes-Benz AG gehört zu 20 Prozent chinesischen staatlichen bzw. staatsnahen
  Anteilseignern. Der entsprechende Gesetzentwurf hat im US-Senat eine erste Hürde
  genommen und könnte zu einem Verkaufsverbot für Mercedes-Autos in Amerika führen.
  Ist man sich in Ihrem Hause der Thematik bewusst? Dazu liegen mir derzeit keine
  Informationen vor. Das kann ich aber gegebenenfalls nachreichen. Ist man zu diesem
  Thema im Austausch mit der US-Politik? Wir sind mit den USA wir selbstverständlich
  ständig im Austausch, auch mit der Automobilbranche. In der konkreten Sache kann
  ich Ihnen gerade aber nichts mitteilen. Wenn Sie es nachreichen könnten, wäre das
  super. Frau Singer, der Gesetzentwurf zur Neuordnung der Nachrichtendienste sieht
  vor, dass der Verfassungsschutz künftig auch Minderjährige ab 16 Jahren als V-Leute
  anwerben darf. Gleichzeitig hält die Bundesregierung dieselbe Altersgruppe für unmündig,
  eigenständig Social-Media-Plattformen zu nutzen, und geschäftsfähig ist man in diesem
  Alter auch nicht. Da würde mich interessieren, wie das Innenministerium diesen Wertungswiderspruch
  auflöst, dass man 16-Jährigen einerseits nicht den eigenen Instagram-Account ohne
  Einschränkungen zugesteht, sie aber gleichzeitig als bezahlte Spitzel in potenziell
  lebensbedrohlichen Milieus einsetzen will. Könnten Sie das für uns noch herunterbrechen?
  Den Zusammenhang mit den Social-Media-Regelungen sehe ich nicht. Mir ist auch nicht
  bekannt, dass es in diesem Land eine Regelung gibt. Soviel ich weiß, gibt es kein
  Verbot, das unter 16-Jährige betreffen würde. Es ist tatsächlich so, dass in der
  Reform der Nachrichtendienste eine gewisse Öffnung ab dem Alter von 16 Jahren ermöglicht
  wird. Das heißt, dass bei gesetzlich definierten Bedrohungen von besonders hohem
  Gefährdungspotenzial wie zum Beispiel Terrorismus ausnahmsweise ein Einsatz ab dem
  Alter von 16 Jahren zulässig ist. Bei diesen Ausnahmen muss die Hausleitung zustimmen.
  Angesichts dieser hohen Voraussetzungen bleibt der gesetzliche Rahmen auch angemessen.
  Ob von der gesetzlichen Anwerbemöglichkeit im Einzelfall Gebrauch gemacht wird,
  bleibt in jedem Einzelfall zu prüfen. Ebenso unterliegt jeder Einsatz einer Vertrauensperson
  auch einer besonderen Fürsorgepflicht des BfV. Aus der jüngsten Vergangenheit, Stichwort
  NSU-Komplex, ist ja hinlänglich bekannt, dass der Verfassungsschutz selbst bei erwachsenen
  V-Leuten nicht immer seiner Aufsichts- und Fürsorgepflicht nachgekommen ist. Zu
  entsprechendem Kontrollversagen ist es ja auch gekommen. Dazu würde mich interessieren
  ‑ das hatten Sie noch nicht ganz angeführt ‑, welche konkreten Schutzmechanismen
  vorgesehen sind, außer dass die Hausleitung dem Ganzen zustimmen muss. Ist irgendeine
  unabhängige Instanz geplant, die diese Einsetzung von minderjährigen V-Leuten überprüft?
  Die ganzen Prämissen in Ihrer Vorfrage würde ich zurückweisen. Ich kann Ihnen dazu
  nur sagen, dass das im Einzelfall ganz genau angeschaut wird und habe dem, was ich
  gerade ausgeführt habe, nichts hinzuzufügen. Frau Deschauer, Herr Wadephul hat gegenüber
  dem ZDF Verstöße gegen das humanitäre Völkerrecht wie die gewalttätige Entführung
  von Herrn Maduro mit über 100 Toten mit Verstößen gegen die deutsche Straßenverkehrsordnung,
  etwa die leichte Übertretung der innerorts geltenden 50 Kilometer pro Stunde, gleichgesetzt.
  Wortwörtlich hat er gesagt: Im Grunde ist das das Gleiche. ‑ Dazu würde mich interessieren:
  Meint der Außenminister diese Gleichsetzung, diese Analogie in dieser Form tatsächlich
  ernst? Sie sehen es mir, glaube ich, nach, dass ich jetzt nicht anfange, Satiresendungen
  zu kommentieren. So satirisch war diese Sendung nicht. Aber gut. Das ist auch eine
  Aussage. Waren es satirische Aussagen des Außenministers, Frau Deschauer? Ich habe
  gesagt, dass es eine Satiresendung war. Aber ich kann Ihnen natürlich gern noch
  erläutern, wenn Sie bei dem Konzept der Satire Nachhilfe benötigen, dass es dabei
  im Ton durchaus auch locker zugehen kann und es entsprechend so zu betrachten ist,
  dass der Minister in der Sache ein Bild gewählt hat, das natürlich das Dilemma aufzeigt,
  das bei der Durchsetzung entsprechender Rechtsnormen bestehen kann. Dieses Dilemma
  kann auf verschiedenen Ebenen bestehen, bei nationalem Recht, aber auch bei internationalem
  Recht. Hintergrund ist ‑ wir hatten ja vorhin über den Amtseid gesprochen ‑, dass
  der Bundesaußenminister dem Grundgesetz verpflichtet ist. Nach dem Grundgesetz ist
  man dem Völkerrecht verpflichtet. Davon gibt es gar keine Ausnahme, anders als beim
  Bundesverkehrsrecht oder der StVO. Waren es also satirische Aussagen? Ich wollte
  es jetzt nur einmal klar hören. Ich kann Ihnen noch einmal sagen: Wir haben uns
  hier und auch der Minister hat sich an verschiedensten Stellen zum Thema des Völkerrechts
  außerhalb eines satirischen Kontextes mehrfach umfänglich geäußert. Natürlich steht
  die Bundesregierung in Gänze und auch das Außenministerium und der Außenminister
  zur Einhaltung des internationalen Rechts ein. Das haben sie mehrfach und immer
  wieder betont. ‑ Satiresendungen müssen Sie, glaube ich, einfach selbst schauen
  und entsprechend betrachten, so wie ich das einleitend getan habe. Dazu kann ich
  Ihnen leider keine weitere Nachhilfe geben. Stimmt es, dass der Kanzler ab Mittwoch
  im Urlaub ist? Wie lange wird er im Urlaub sein? Der Bundeskanzler ist, wie Sie
  wissen, stets im Dienst. Werden die Kabinettssitzungen trotzdem stattfinden? Werden
  sie eventuell von Herrn Klingbeil geleitet? Am Mittwoch wird noch die Kabinettssitzung
  stattfinden, am Mittwoch wird die außerplanmäßige Fraktionssitzung der CDU/CSU-Bundestagsfraktion
  stattfinden, und am Mittwoch werden die Ministerernennungen stattfinden. Das heißt,
  dass der Bundeskanzler am Mittwoch noch hier sein wird. Er wird anschließend ein
  paar freie Tage haben und von dort aus die Amtsgeschäfte führen. Es gibt einen Kabinettszeitplan
  für die Sommerpause, den Sie dann bitte den jeweiligen Ankündigungen der Vorwoche
  entnehmen. Diese Kabinettssitzungen wird der Bundeskanzler oder sein Stellvertreter
  leiten. (zu Waldbränden in Frankreich und Spanien) Ich hätte eine Nachreichung zu
  der Frage von dem Kollegen zu aktuellen Waldbränden auf Bundeswehrliegenschaften
  und insbesondere Truppenübungsplätzen. Ihre Frage hat natürlich noch einmal eine
  aktuelle Überprüfung stimuliert. Ich kann Ihnen mitteilen, dass die Bundeswehr nur
  dann Kenntnis über Brände hat, wenn es sich um bundeswehreigene Liegenschaften handelt.
  Aktuell haben wir keine Kenntnisse über bestehende Waldbrände auf Truppenübungsplätzen.
  Ich habe eine Ergänzung für den Kollegen. Sie hatten ja nach der Kostenverteilung
  zwischen Bund und Ländern gefragt, auch mit Blick auf Klimaanpassung . Es ist ja
  so, dass die Länder aktuell die Kosten dafür tragen. Aber ich wollte noch darauf
  hinweisen ‑ es ist auch an dieser Stelle schon mehrfach zur Sprache gekommen ‑,
  dass wir die Einführung einer Gemeinschaftsaufgabe zur Klimaanpassung von Bund und
  Ländern anstreben, in der wir dann die weitere Zusammenarbeit finanziell und organisatorisch
  klären, und dass wir auch die Idee haben, dass wir das vonseiten des Bundes noch
  ausbauen wollen.'
