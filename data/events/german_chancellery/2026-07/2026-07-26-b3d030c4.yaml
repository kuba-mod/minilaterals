title: Pressestatement von Bundeskanzler Merz zum Anschlag beim Berliner Christopher
  Street Day „ Wir sind mehr, wir sind stärker, und wir halten in unserem Land zusammen
  “
text: '„Lassen Sie sich, lassen wir uns nicht einschüchtern“, betonte Kanzler Merz
  nach dem Anschlag beim Berliner Christopher Street Day . „ Diese Taten haben nur
  einen Zweck: Sie wollen unsere Gesellschaft spalten. Sie wollen uns das Wichtigste
  nehmen, das wir haben, nämlich unsere Offenheit und unsere Freiheit “, betonte Bundeskanzler
  Friedrich Merz am Sonntag in seinem Pressestatement zum Anschlag in der vergangenen
  Nacht beim Berliner Christopher Street Day . Er appellierte: „ Lassen Sie sich,
  lassen wir uns nicht einschüchtern! “ Die Bundesregierung werde „jenseits aller
  parteipolitischen Meinungsverschiedenheiten nicht zulassen, dass dieses Gift des
  Terrorismus und dieses Gift gegen unsere Freiheit in unserer Gesellschaft weiter
  um sich greift“ , so Merz weiter. „ Wir werden die Freiheit unserer Gesellschaft
  verteidigen. Darauf können sich alle verlassen.“ Er sprach den Opfern und Angehörigen
  seine Anteilnahme aus und dankte außerdem den Einsatzkräften für ihr „ vorbildlich
  schnelles Eingreifen, das gestern Nacht möglicherweise Schlimmeres verhindert hat
  “. Uns bringt ein trauriger Anlass und zugleich eine verachtenswerte Tat zusammen.
  Meine Gedanken, unsere Gedanken sind in diesen Stunden bei den Opfern dieses terroristischen
  islamistischen Anschlags der letzten Nacht, bei den Familien, bei den Freunden.
  Ich wünsche vor allem den Verletzten, dass sie schnell genesen. Ich möchte den Einsatzkräften
  danken für ihr geradezu vorbildlich schnelles Eingreifen, das gestern Nacht möglicherweise
  Schlimmeres verhindert hat. Ich möchte den Teilnehmerinnen und Teilnehmern des Christopher
  Street Days hier in Berlin, aber auch in ganz Deutschland, zurufen: Lassen Sie sich,
  lassen wir uns nicht einschüchtern! Diese Taten haben nur einen Zweck: Sie wollen
  unsere Gesellschaft spalten. Sie wollen uns das Wichtigste nehmen, das wir haben,
  nämlich unsere Offenheit und unsere Freiheit. Ich will für die Bundesregierung sagen:
  Wir werden alles tun, um den oder die Täter so schnell wie möglich zu fassen. Wir
  werden über Konsequenzen nachdenken und mit Besonnenheit, aber auch mit Entschlossenheit
  entscheiden. Diese Straftäter, diese Extremisten, haben in der Mitte unserer Gesellschaft
  keinen Platz. Wir werden jenseits aller parteipolitischen Meinungsverschiedenheiten
  nicht zulassen, dass dieses Gift des Terrorismus und dieses Gift gegen unsere Freiheit
  in unserer Gesellschaft weiter um sich greift. Wir werden die Freiheit unserer Gesellschaft
  verteidigen. Darauf können sich alle verlassen. Wir sind mehr, wir sind stärker,
  und wir halten in unserem Land zusammen. Das ist das Wichtigste in einer so schweren
  Stunde. Lassen Sie es mich noch einmal sagen: Wir werden die Freiheit, die Offenheit,
  die Liberalität unseres Lebens und unserer Gesellschaft mit allem, was wir tun können,
  verteidigen, und wir werden es gemeinsam machen. Herzlichen Dank für Ihre Aufmerksamkeit.'
