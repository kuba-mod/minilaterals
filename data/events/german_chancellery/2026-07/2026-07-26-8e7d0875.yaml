title: Rede von Bundeskanzler Merz anlässlich des Gedenkgottesdienstes am 26. Juli
  2026 in Berlin nach dem Anschlag beim Berliner Christopher Street Day
text: 'Der Anschlag der letzten Nacht erschüttert uns und bewegt uns. Lassen Sie mich
  zu Beginn ein Wort des Dankes an die Vertreterinnen und Vertreter der Kirchen und
  der Glaubensgemeinschaften richten: Herzlichen Dank für Ihre Worte. Herzlichen Dank,
  dass Sie es uns etwas leichter machen, dieses Schicksal zu tragen. Meine Gedanken
  sind bei den Opfern des gestrigen Abends, bei der Frau, die ihr Leben gelassen hat,
  und ihrer Familie, bei den Verletzten, die in Berliner Kliniken noch behandelt werden
  und über die wir dankenswerterweise hören, dass sich wohl niemand mehr in Lebensgefahr
  befindet. Ich danke den Rettungskräften, der Polizei, der Feuerwehr, den Ärzten,
  den Kliniken, die gestern gezeigt haben, wozu sie schnell und entschlossen in der
  Lage sind. Ich möchte aber auch ein sehr persönliches Wort an die queere Community
  richten. Meine Damen und Herren, nicht erst ein solcher Anschlag wie gestern Abend
  gefährdet unsere Freiheit. Intoleranz, Ausgrenzung, Diskriminierung, dumme Redensarten,
  schlechte Witze sind bereits Teil einer solchen Gewalt ‑ nicht erst das, was wir
  gestern Abend erlebt haben, und das, was Sie erleben mussten. Deswegen möchte ich
  Ihnen etwas zurufen: Wir, die Vertreter der staatlichen Institutionen, werden alles
  tun, um die Freiheit unseres Landes und unserer Gesellschaft zu schützen ‑ alles.
  Und allen denjenigen, die meinen, mit ihren Bezeugungen und ihrem Tun unser Land
  zu spalten, Hass und Zwietracht zu säen, denen will ich sagen: Wir werden mit Bedacht,
  aber auch mit sehr großer Entschlossenheit alles tun, um genau das zu verhindern.
  Unsere staatlichen Organe werden den oder die Täter fassen. Sie werden zur Verantwortung
  gezogen. Wir werden auch darüber nachzudenken haben, ob es Lücken im Schutzkonzept
  gab. Diejenigen, die die Freiheit unserer Gesellschaft, unseres Landes, unseres
  Rechtsstaates missbrauchen, müssen wissen, dass wir alles tun werden, um ihre Handlungsfreiheit
  und auch ihre Bewegungsfreiheit in unserem Land auf das Minimum zu begrenzen, das
  uns der Rechtsstaat zulässt. Ich möchte Ihnen zum Abschluss sagen, nach diesen Stunden
  und Tagen der Trauer: Wir stehen nicht nur zu Ihnen, wir stehen nicht nur zusammen.
  Feiern Sie wieder! Zeigen Sie den Gegnern unserer Gesellschaft das fröhliche und
  das einvernehmliche Gesicht einer offenen, freiheitlichen und liberalen Gesellschaft.
  Dafür stehen wir, dafür steht die Bundesregierung, dafür stehe ich ganz persönlich ‑
  mehr als je zuvor an einem solchen Tag, an dem uns in einer so schweren Stunde auch
  die Kirchen in beeindruckender Weise begleiten.'
