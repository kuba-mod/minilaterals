title: 'Kulturbauten-Initiative: Staatsminister Weimer besucht Kloster Ettal in Bayern:
  „Ein außergewöhnlicher Ort unserer Kulturgeschichte“'
text: 'Die Kulturbautenreise von Staatsminister Wolfram Weimer geht weiter: Am 24.
  Juli besuchte er gemeinsam mit Alexander Dobrindt, MdB, Bundesminister des Innern
  und Wahlkreisabgeordneter für Ettal, das dortige Benediktinerkloster. Kulturstaatsminister
  Weimer übergab einen symbolischen Förderbescheid in Höhe von 375.000 Euro. Die Mittel
  stammen aus dem Programm „Investitionen in national bedeutsame Kultureinrichtungen
  in Deutschland“. Sie kommen der Sanierung und barrierefreien Gestaltung des Ritterakademie-Trakts
  zur Einrichtung eines Museums zugute. Die Gesamtbaukosten belaufen sich auf 1,5
  Millionen Euro. Weitere 431.000 Euro hat der Bund aus dem Denkmalschutz-Sonderprogramm
  für die denkmalgerechte Sanierung der Klostermauer in Aussicht gestellt. Das Kloster
  Ettal wurde im Jahr 1330 gegründet und ist bis heute von Benediktinermönchen bewohnt
  Staatsminister Weimer sagte im Vorfeld: „Das Benediktinerkloster Ettal ist nicht
  nur ein außergewöhnlicher Ort unserer Glaubens- und Kulturgeschichte, sondern vor
  allem auch ein beeindruckendes Baudenkmal. Ich freue mich, dass wir mit der Förderung
  einen Beitrag dazu leisten, dieses bedeutende Kulturerbe zu bewahren, seine Geschichte
  zeitgemäß zu vermitteln und den Zugang für alle Besucherinnen und Besucher zu verbessern.
  Hierfür danke ich auch dem Haushaltsausschuss des Deutschen Bundestages, der regelmäßig
  Mittel für Investitionen in bedeutende Kulturbauten bereitstellt.“ Mit seiner Reise
  möchte Staatsminister Weimer die herausragende Bedeutung für die kulturelle Identität
  Deutschlands sichtbar machen und zugleich ein Zeichen für die Vielfalt der Kulturlandschaft
  setzen, die weit über die großen Städte hinausreicht. Viele dieser Orte prägen seit
  Jahrhunderten das Erscheinungsbild ihrer Regionen und sind zugleich wichtige Anziehungspunkte
  für Bildung und Tourismus. Informationen zum Programm „Investitionen in national
  bedeutsame Kultureinrichtungen in Deutschland“ finden Sie unter https://kulturstaatsminister.de/kunst-und-kulturfoerderung/kultureinrichtungen/national-bedeutsame-kultureinrichtungen#
  Zu den Denkmalschutz-Sonderprogrammen erfahren Sie hier mehr: https://kulturstaatsminister.de/denkmal-und-kulturgutschutz/denkmalschutz/denkmalschutz-sonderprogramme'
