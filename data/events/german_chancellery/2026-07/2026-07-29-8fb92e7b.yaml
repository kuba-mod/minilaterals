title: 'Im Kabinett beschlossen Energiepolitik: Planbar, effizient und sicher'
text: 'Mit der EEG -Novelle setzt die Bundesregierung bei der Solarenergie stärker
  auf kostengünstigere Freiflächenanlagen. Die heute im Kabinett beschlossene EEG
  -Novelle 2027 und das Netzanschlusspaket sollen die Energiepolitik wieder konsequent
  auf Planbarkeit, Kosteneffizienz und Versorgungssicherheit ausrichten. Ministerin
  Katharina Reiche sprach von einem „Paradigmenwechsel bei den Erneuerbaren“. Erstmals
  seit Einführung der Förderung werde auch systematisch berücksichtigt, wo neue Anlagen
  für das Stromnetz sinnvoll sind. Das sei „ein großer Schritt hin zu einem effizienteren
  Energiesystem“. Gleichzeitig hält die Bundesregierung weiterhin an den Ausbauzielen
  bei den Erneuerbaren Energien und an den Klimazielen fest. So sollen weiter bis
  2030 80 Prozent Strom aus Erneuerbaren Energien gewonnen werden. Das ist auch für
  die Unabhängigkeit von fossilen Energien zentral. Mit dem heutigen Meilenstein geht
  die Bundesregierung einen wichtigen Schritt hin zu diesem erklärten Ziel und macht
  Deutschlands Energieversorgung und damit den Wirtschaftsstandort zukunftssicherer.
  Mit der EEG -Novelle will die Bundesregierung die Energiekosten dauerhaft senken,
  die Versorgungssicherheit gewährleisten und die Energiewende transparent, planbar
  und pragmatisch zum Erfolg bringen. Das EEG soll von einem umfassenden staatlichen
  Fördersystem hin zu einem marktbasierten, system- und netzdienlichen Investitionsrahmen
  fortentwickelt werden. Das heißt: Der Ausbau der Erneuerbaren soll sich in Zukunft
  stärker am Markt und am tatsächlichen Bedarf im Stromnetz ausrichten. Das Erneuerbare-Energien-Gesetz
  (EEG) ist das zentrale Instrument, um eine treibhausgasneutrale Stromversorgung
  zu erreichen. Das soll vor allem durch mehr Strom aus Erneuerbaren Energien geschehen
  – also vor allem aus Wind und Sonne . Es werden zusätzliche 12 GW Wind an Land ausgeschrieben.
  Dieser zusätzliche Ausbau soll dort stattfinden, wo er gebraucht wird. Die Bedingungen
  für Windenergie im Süden werden damit deutlich verbessert. Bioenergie – also Energie
  aus natürlichen Rohstoffen wie Holz, Pflanzen oder biogenen Abfällen – soll Wind-
  und Sonnenenergie flexibel und planbar ergänzen. Durch die Fortschreibung der Ausschreibungsmengen
  bis 2032 und ein neues Ausbauziel bis 2035 gibt das neue EEG der Bioenergie eine
  Zukunft im Stromsektor. Bei der Solarenergie setzt die Bundesregierung stärker auf
  kostengünstigere Freiflächenanlagen und vereinheitlicht die Förderung. Die Einspeiseleistung
  kleiner und mittlerer PV -Dachanlagen wird auf 50 Prozent begrenzt, um Mittagsspitzen
  im Einspeiseprofil zu vermeiden, die Eigenverantwortung der Anlagenbetreiber zu
  stärken und den Zubau von Speichern anzureizen. Die Direktvermarktung von Solarenergie
  wird gestärkt. Künftig werden neue Anlagen grundsätzlich mit Hilfe von intelligenten
  Messsystemen und Steuerungseinrichtungen über die Direktvermarktung in den Markt
  integriert und orientieren sich an Preissignalen. Um dies zu ermöglichen, wird ein
  schrittweiser Übergang weg von einer festen Einspeisevergütung angeregt. Kleine
  Anlagen unter 25 Kilowatt sind schon heute oft ohne Förderung wirtschaftlich. Aus
  diesem Grund sollten sie grundsätzlich nicht dauerhaft auf Kosten der Steuerzahler
  gefördert werden. Solche Anlagen entlassen wir in den Markt, wobei wir eine Starthilfe
  für die eigenverantwortliche Vermarktung des Stroms in Form eines vierjährigen Direktvermarktungsbonus
  vorsehen. Zudem wurde vom Kabinett ein Gesetzentwurf zur „Änderung des Energiewirtschaftsrechts
  zur Synchronisierung des Anlagenzubaus mit dem Netzausbau sowie zur Verbesserung
  des Netzanschlussverfahrens“ auf den Weg gebracht. Ziel dieses Netzanschlusspaketes
  ist es, den Netzausbau kostengünstiger zu machen und die Netze zu stabilisieren.
  Davon profitieren alle Stromverbraucherinnen und -verbraucher, denn die ungleiche
  Verteilung der Stromkapazitäten erzeugt hohe Kosten. Die Netzanschlusskapazität
  entwickelt sich zu einem zunehmend knappen Gut, um das verschiedene Nutzergruppen
  konkurrieren. Ob Batteriespeicher, Rechenzentren oder Industriebetrieb, sie alle
  wollen an das Stromnetz angeschlossen werden – möglichst kurzfristig und kostengünstig.
  Konkret sollen daher nun Anreize gesetzt werden, damit Großspeicher und große Erneuerbaren-Energien-Anlagen
  dort ausgebaut werden, wo im Netz Bedarf ist - und nicht dort, wo bereits ausreichend
  Anlagen vorhanden sind. Das Ziel ist dabei ausdrücklich nicht, den Erneuerbaren-Ausbau
  zu hemmen, sondern ihn netzverträglicher zu gestalten – also regional besser zu
  verteilen. Das soll erreicht werden, indem im Falle von Abregelungen im sogenannten
  Redispatch an den entsprechenden Standorten für Neuanschlüsse von Erneuerbaren Energien
  dann teilweise die Entschädigungszahlungen an die Anlagenbetreiber entfallen. Als
  Redispatch bezeichnet man die Drosselung von Kraftwerken, um Leitungsabschnitte
  vor einer Überlastung zu schützen. Diese Redispatch -Maßnahmen erzeugen derzeit
  hohe Kosten – im Jahr 2025 mehr als drei Milliarden Euro. Diese Kosten müssen alle
  Stromverbraucherinnen und -verbraucher tragen. Die Entlastung privater Haushalte
  und der Wirtschaft bei den Energiepreisen ist ein zentrales Ziel der Bundesregierung.
  Dafür hat sie früh umfassende Beschlüsse gefasst. Für weniger Kosten in der Energieversorgung
  ist neben einer besseren Verteilung der zusätzlichen Anlagen ein schneller, effizienter
  Ausbau der Übertragungsnetze zentral. Dafür hat die Bundesregierung im April das
  Bundesbedarfsplangesetz beschlossen.'
