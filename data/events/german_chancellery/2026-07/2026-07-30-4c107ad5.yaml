title: 'Kulturbauten-Initiative: Staatsminister Weimer fördert Kampnagel-Umbau mit
  bis zu 60 Millionen Euro: „Kampnagel als Leuchtturm internationaler Kulturarbeit
  stärken“'
text: 'Kulturstaatsminister Wolfram Weimer hat heute im Rahmen der Kulturbauten-Initiative
  bis zu 60 Millionen Euro für die Erweiterung und Sanierung des Internationalen Produktionshauses
  Kampnagel in Hamburg zugesagt. In Zusammenarbeit mit dem Pariser Architekturbüro
  Lacaton & Vassal sollen die Maschinenfabrikhallen umfangreich modernisiert, erweitert
  und an steigende Bedarfe angepasst werden. Der offizielle Spatenstich ist für den
  30. Oktober unter Teilnahme des Staatsministers geplant. Kulturstaatsminister Weimer:
  „Kampnagel ist ein Leuchtturm der freien Kulturszene. Seine internationale Kulturarbeit
  strahlt weit über Hamburg und Deutschland hinaus. Mit den Mitteln trägt der Bund
  erheblich dazu bei, auf dem historischen Gelände zeitgemäße Produktionsbedingungen
  zu schaffen. So kann sich Kampnagel auf dem gewohnt hohen künstlerischen Niveau
  als Spiel- und Produktionsstätte für die freie Szene und als Labor für spartenübergreifende
  Gegenwartskunst weiterentwickeln. Damit stärken wir gerade in diesen haushaltspolitisch
  schwierigen Zeiten auch die freie Szene.“ Die Baumaßnahmen sollen bei laufendem
  Spielbetrieb umgesetzt werden. Geplant ist der Umbau als künstlerisch begleitete
  „performative Baustelle“. Die Gesamtkosten der Sanierung und Erweiterung betragen
  rund 168 Millionen Euro, finanziert vom Bund gemeinsam mit der Freien und Hansestadt
  Hamburg. Die Kulturfabrik Kampnagel ist ein weltweit bekanntes internationales Produktionshaus.
  Neben zeitgenössischen darstellenden Künsten präsentiert es Konzerte, Konferenzen
  und eine Vielzahl unterschiedlicher Festivals. Das Programm bildet ein breites Spektrum
  an wegweisenden Tendenzen in Theater, Tanz und Performance sowie Musik, Bildender
  Kunst und Architektur ab. Die Stärkung der kulturellen Infrastruktur zählt zu den
  zentralen Anliegen der Bundesregierung. Mit nachhaltigen Investitionen unterstützt
  der Bund kulturelle Einrichtungen und Kulturdenkmäler von nationaler Bedeutung.
  Viele dieser Orte prägen seit Jahrhunderten das Erscheinungsbild ihrer Regionen
  und sind zugleich wichtige Anziehungspunkte für Bildung und Tourismus. Weitere Informationen
  finden Sie hier.'
