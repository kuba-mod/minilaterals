title: Rede von Bundeskanzler Merz anlässlich des 150. Jubiläums der Bayreuther Festspiele
  am 25. Juli 2026 in Bayreuth
text: 'Liebe Katharina Wagner, liebe Nike Wagner, sehr geehrter Ministerpräsident,
  lieber Markus Söder, sehr geehrter Herr Oberbürgermeister, lieber Andreas Zippel,
  meine sehr verehrten Damen und Herren, „Was ich [Richard Wagner] als Genießender
  und Lernender verdanke, kann ich nie vergessen, nie die Stunden tiefen, einsamen
  Glückes inmitten der Theatermenge, Stunden voll von Schauern und Wonnen der Nerven
  und des Intellekts, von Einblicken in rührende und große Bedeutsamkeiten, wie eben
  nur diese Kunst sie gewährt.“ Meine Damen und Herren, so bekannte es Thomas Mann
  im Februar 1933, nur zehn Tage nach der Machtübernahme durch die Nationalsozialisten.
  Er bekannte es in seinem großen Vortrag zum 50. Todestag Richard Wagners im Audimax
  der Münchner Universität. Diese Hingabe geschah jedoch ‑ auch das gab er hier schon
  zu Protokoll ‑ nicht ohne Misstrauen. Sieben Jahre später, 1940 in den USA, zur
  Flucht gezwungen aus seinem Vaterland, sprach Thomas Mann sie offen aus, die „verzwickten
  und peinlichen Verhältnisse, die Beziehungen, welche unbestreitbar zwischen der
  Wagner‘schen Sphäre und dem national-sozialistischen Unheil bestehen“. Meine Damen
  und Herren, Richard Wagners Person und Werk stehen beispielhaft für Größe und Abgründigkeit
  der deutschen Verhältnisse in Kunst und Geschichte. Sie stehen für die sehr deutsche
  Kombination von höchst Bewunderungswürdigem und höchst Fragwürdigem in unserer Vergangenheit.
  Nun ist Geschichte immer ambivalent, aber besonders unsere Geschichte ist es. Und
  ganz und gar nicht ohne Misstrauen begegnen wir ihr nach den Erfahrungen und Verbrechen
  dieses deutschen 20. Jahrhunderts. Es ist gut, dass wir zu Beginn der 150. Bayreuther
  Festspiele sagen können: Diesen Beziehungen, die unbestreitbar zwischen der Wagner‘schen
  Sphäre und dem nationalsozialistischen Unrechtsregime bestanden, haben sich die
  Festspiele und ihre Verantwortlichen in den verschiedensten Formaten und Formen,
  auch in den Werkinszenierungen selbst, seit Jahren gestellt ‑ spät, aber es ist
  geschehen und es geschieht. Die Gedenkveranstaltung mit der Rede von Michel Friedman
  findet morgen statt. Wir sind dankbar, dass die zwischenzeitlich entstandenen Irritationen
  in dieser Sache ausgeräumt sind. Die Bayreuther Festspiele sind damit selbst ein
  Beispiel für die Bereitschaft unseres Landes geworden, sich der eigenen Vergangenheit
  ernsthaft zu stellen und dauerhafte Schlussfolgerungen aus ihr zu ziehen. Auch das
  darf heute Teil unseres nationalen Bewusstseins sein. Beschäftigen wir uns mit Richard
  Wagner, dann beschäftigen wir uns mit unserem problematischen Selbst, aber auch
  mit unserem vielfältigen Selbst in der Geschichte. Die mittelalterlichen Stoffe
  der deutschen Dichtung hat er für uns aufbewahrt, in seiner ganz eigenen, persönlich-politischen
  Durchformung. In seinem Werk, einem Werk zugleich der Musik und der Dichtung, aus
  dem deutschen 19. Jahrhundert heraus, ist eine Fülle von Einflüssen und Anregungen
  Kunst geworden. Eine ganz eigene, eben Wagner‘sche Mischung von christlicher Romantik
  und sozialistischer Revolution, von Ideen einer klassenlosen und vom Fluch des Geldes ‑
  so sah er es jedenfalls ‑ befreiten, auf Liebe gegründeten Gesellschaft. Wir haben,
  wenn wir uns mit Wagner beschäftigen, also die Chance, in einem Werk sehr vieles
  von uns selbst durch die Jahrhunderte vor Augen und Ohren zu haben. Wir haben diese
  Chance gerade hier in Bayreuth, wo es seit Langem der Ehrgeiz ist, dieses Werk für
  ein immer neues Heute immer neu einzurichten und für uns fruchtbar zu machen ‑ durch
  deutsche wie durch weltweit gefeierte Künstler und Regisseure, und auch für ein
  nachwachsendes Publikum durch das Education-Programm oder durch eine Einrichtung
  wie die jährliche Kinderoper oder die Gruppe der Jungen Freunde von Bayreuth. Herzlichen
  Dank für dieses Engagement an die Bayreuther Festspiele! Meine Damen und Herren,
  exemplarisch für diese Vielfalt und für diese vielen Künstlerinnen und Künstler
  darf ich vielleicht die Inszenierung der Meistersinger von Barrie Kosky im Jahr
  2017 nennen. Kosky hat selbst damals seine Gefühle geschildert, als Katharina Wagner
  ihn dazu einlud: „[…] ich bin fertig mit dem Mann. Und dann soll ich als australischer
  Jude in Bayreuth das problematischste aller Wagner-Stücke machen ‑ nein!“ Doch. ‑
  Er hat es großartig getan und hat vorgeführt, dass das Werk vom Antisemitismus seines
  Schöpfers nicht zu trennen ist und dass wir uns dieser Kunst doch aussetzen dürfen
  und sollen. Canceln ist jedenfalls auch hier keine Lösung. Eher wieder mit Thomas
  Mann: Genießen, aber „nicht ohne Misstrauen“. Meine Damen und Herren, wir können
  uns Jahr für Jahr hier in Bayreuth versammeln. Auch diese Festspiele sind doch eines
  der vielen ‑ darf ich das so sagen? ‑ nationalen Lagerfeuer, die wir heute manchmal
  vermissen, aber die wir doch noch haben, über das Land und über das Jahr verteilt.
  Ich zähle in dieser Gattung nur auf: das Bachfest in Leipzig, die Händel-Festspiele
  in Halle, Göttingen und Karlsruhe, das Bonner Beethovenfest, das Rheingau Musik
  Festival, das Schleswig-Holstein Musik Festival, die Tage Alter Musik in Regensburg
  und in Herne ‑ und damit habe ich noch lange nicht alle genannt. Nutzen wir sie,
  unsere auch in dieser Hinsicht weltweit einzigartige Kulturlandschaft. Gehen wir
  hin ‑ gehen wir vielleicht sogar öfter hin. Wir können uns an so vielen Orten in
  unserem Land um die Kunst versammeln. Es bleibt ja auch wahr ‑ auch wenn diese Feststellung
  heute vielleicht ihre Selbstgefälligkeit verloren hat ‑: Wir waren eine Kulturnation,
  lange bevor wir eine politische Nation wurden. Man spürt das bis heute in unseren
  Opernhäusern, in unseren Theatern, in unseren Museen. Und man spürt es auch an der
  Ernsthaftigkeit, mit der wir uns diesen Dingen zuwenden. Richard Wagner sah in der
  Kunst ein Heilmittel gegen die Schäden der Gesellschaft, so wie er sie wahrnahm.
  Wir nehmen heute etwas Abstand von diesem vielleicht religiösen Verständnis. Aber
  in diesen Momenten des Kunstgenusses und des Staunens vor Werken wie diesen, die
  Jahrhunderte überdauern, fühlen wir doch auch, dass wir aufgerufen sind, zu gestalten,
  Dinge in die Welt zu setzen, nicht den bequemsten Weg zu gehen, uns auseinanderzusetzen.
  Hörend und sehend haben wir neue Gedanken und starke Gefühle, die uns wiederum zu
  denken geben. Und wir fühlen: Wenn dies möglich ist, dann muss eigentlich auch das
  meiste andere in unserem Land gut leistbar sein. „Freudig begrüßen wir die edle
  Halle“, so werden wir es gleich im zweiten Akt des Tannhäusers hören. Ich sage:
  Freudig beglückwünschen wir die Bayreuther Festspiele zu ihrem 150. Jubiläum. Herzlichen
  Dank.'
