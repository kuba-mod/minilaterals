title: Déplacement en Gironde.
text: Le Président de la République s'est rendu en Gironde le lundi 27 juillet 2026.
  À son arrivée au centre opérationnel départemental d’incendie et de secours de Bordeaux
  , le chef de l’État a assisté à un point de situation. Le Président Emmanuel Macron
  est ensuite allé à la rencontre des forces mobilisées afin de leur adresser le soutien
  de la Nation. Le chef de l'État a aussi échangé avec plusieurs élus du département
  pour les remercier de leur engagement de chaque instant. Il a réaffirmé le plein
  engagement de l’État pour faire face à la saison exceptionnellement intense de feux
  de forêt sur le territoire national.
