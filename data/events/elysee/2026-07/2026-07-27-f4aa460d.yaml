date: '2026-07-27'
type: press_release
source_name: elysee
title: Compte rendu du Conseil des ministres du lundi 27 juillet 2026.
text: 'Retrouvez le compte rendu du conseil des ministres du lundi 27 juillet 2026.
  Le ministre de l’Europe et des affaires étrangères a présenté un projet de loi autorisant
  la ratification de l’accord de protection des investissements entre l''Union européenne
  et ses États membres, d''une part, et la République socialiste du Vietnam, d''autre
  part. Signé à Hanoï le 30 juin 2019, cet accord a pour objectif de renforcer les
  relations économiques entre l’Union européenne et le Vietnam et de mieux protéger
  les investissements croisés. Il s’inscrit dans le contexte du renforcement de l’engagement
  de l’Union européenne et de la France dans la région indopacifique et du rapprochement
  stratégique entre l’Union européenne et le Vietnam. Il complète l’accord de libre-échange
  UE-Vietnam, également signé en juin 2019 et entré en vigueur en août 2020 Il renforce
  d’ailleurs le partenariat stratégique global établi en octobre 2024 entre la France
  et le Vietnam. L’accord de protection des investissements établit un cadre juridique
  modernisé et harmonisé pour la protection des investissements entre les États membres
  de l’Union européenne et le Vietnam. Cet accord prévoit des garanties juridiques
  pour les investisseurs et vise à réformer les mécanismes traditionnels d’arbitrage
  en instaurant un système juridictionnel de règlement des différends entre investisseurs
  et États. Il remplacera le traité bilatéral d’investissement conclu entre la France
  et le Vietnam en 1992. Dans un environnement en forte croissance et marqué par une
  importante concurrence internationale, cet accord soutiendra la présence économique
  française au Vietnam, où plus de 250 entreprises françaises sont implantées et emploient
  environ 26 000 personnes dans tous les secteurs. Le ministre de l’Europe et des
  affaires étrangères a présenté un projet de loi autorisant l’approbation de l’accord
  multilatéral entre autorités compétentes concernant l’échange automatique de renseignements
  relatifs au cadre de déclaration applicable aux crypto-actifs et l’approbation de
  l’addendum à l’accord multilatéral entre autorités compétentes concernant l’échange
  automatique de renseignements relatifs aux comptes financiers. L’accord, négocié
  dans le cadre de l’Organisation de coopération et de développement économiques (OCDE)
  en réponse à une demande du G20 et signé le 26 novembre 2024, définit un nouveau
  cadre juridique multilatéral visant à encadrer les échanges de renseignements entre
  administrations fiscales s’agissant précisément des crypto-actifs. Cet accord permet,
  à une échelle mondiale, d’accroître ces échanges afin de lutter plus efficacement
  contre la fraude et l’évasion fiscales, dans un contexte d’essor du marché des crypto-actifs
  et de ses détenteurs. L’addendum, signé à la même date, complète un accord multilatéral
  déjà approuvé et mis en œuvre par la France s’agissant de l’échange automatique
  de renseignements portant sur les comptes financiers. Il intègre les dernières normes
  et standards développés dans le cadre de l’OCDE qui étendent les échanges de renseignements
  à des monnaies numériques et crypto-monnaies. Complémentaires, ces deux accords
  multilatéraux fournissent ainsi un cadre juridique international adapté aux nouveaux
  enjeux liés au développement des crypto-actifs. Ils s’inscrivent dans la politique
  de lutte contre l’évasion et la fraude fiscales que mène la France à l’échelle internationale.
  Le ministre de l’économie, des finances et de la souveraineté industrielle, énergétique
  et numérique et le ministre de l’action et des comptes publics ont présenté une
  ordonnance portant divers ajustements du code des impositions sur les biens et services
  (CIBS). Cette ordonnance prolonge le chantier de modernisation et de simplification
  du droit fiscal engagé par le Gouvernement en 2019. Ce travail a conduit à la création
  du CIBS au 1er janvier 2022, puis à son enrichissement progressif, notamment avec
  l’intégration de plusieurs taxes au 1er janvier 2023 et, par une ordonnance du 17
  décembre 2025, avec le transfert des dispositions relatives à la taxe sur la valeur
  ajoutée (TVA). Une entrée en vigueur du nouveau régime de TVA reportée au 1er janvier
  2027 À la suite de la consultation publique menée sur la recodification de la TVA
  dans le CIBS, le Gouvernement a pris en compte les attentes exprimées par les entreprises
  et les praticiens du droit. L’entrée en vigueur du transfert des dispositions relatives
  à la TVA dans le CIBS est ainsi reportée au 1er janvier 2027, afin de permettre
  aux acteurs concernés de préparer plus sereinement la transition vers ce nouveau
  cadre juridique, notamment dans le contexte de la mise en œuvre de la réforme de
  la facturation électronique à compter du 1er septembre prochain. L’ordonnance répond
  également à une demande importante de simplification : elle regroupe désormais,
  au sein d’une subdivision unique du livre II du CIBS consacré à la TVA, l’ensemble
  des dispositions relatives au droit à déduction de la TVA pour améliorer la lisibilité
  du droit applicable. L’ordonnance intègre par ailleurs les mesures relatives à la
  TVA adoptées depuis l’ordonnance du 17 décembre 2025, notamment celles issues de
  la loi de finances pour 2026. Elle prend ainsi en compte plusieurs évolutions récentes
  du droit fiscal, comme l’harmonisation à 5,5 % du taux de TVA applicable aux services
  liés à la gestion des déchets. L’ordonnance met également à jour les références
  rendues nécessaires par l’entrée en vigueur de la partie législative du nouveau
  code des douanes au 1er mai 2026. Elle poursuit aussi l’harmonisation des catégories
  fiscales utilisées pour identifier les régimes de contrôle, de recouvrement et de
  contentieux : les « taxes sur le chiffre d’affaires » deviennent par exemple les
  « taxes sur les biens et services ». Une sécurité juridique renforcée pour les opérateurs
  L’ordonnance confirme explicitement que la doctrine administrative opposable aux
  redevables demeure inchangée lors de l’entrée en vigueur du CIBS. Cette garantie,
  déjà prévue par l’ordonnance du 17 décembre 2025 et précisée dans un rescrit publié
  le 18 février 2026 au Bulletin officiel des finances publiques – Impôts, est ainsi
  réaffirmée. L’ordonnance prend également en compte plusieurs demandes de clarification
  formulées lors de la consultation publique, notamment afin de rapprocher certaines
  formulations de la jurisprudence et procède enfin à diverses corrections d’erreurs
  matérielles identifiées dans l’ordonnance du 17 décembre 2025. Le travail de recodification
  se poursuit : dans les prochains mois, le livre du CIBS consacré à la TVA sera progressivement
  complété par son volet réglementaire. La ministre de l’agriculture, de l’agro-alimentaire
  et de la souveraineté alimentaire a présenté un décret portant sur la délégation
  d’actes vétérinaires à des salariés non vétérinaires qualifiés au sein des établissements
  de soins vétérinaires. Il s’agit d’un décret d’application de la loi d’orientation
  pour la souveraineté alimentaire et le renouvellement des générations en agriculture
  (LOSARGA), promulguée en mars 2025. Dans un contexte de croissance du marché des
  soins aux animaux et de tensions fortes sur le maillage vétérinaire, optimiser l’organisation
  du travail dans les établissements de soins vétérinaires, en faisant en sorte que
  les vétérinaires puissent se recentrer sur les actes médicaux et chirurgicaux où
  ils ont la plus forte valeur ajoutée, est essentiel. La LOSARGA introduit la possibilité
  pour les vétérinaires de déléguer à des salariés – les auxiliaires spécialisés vétérinaires
  (ASV) et les élèves vétérinaires – certains actes de médecine et de chirurgie des
  animaux. Ce décret répond à plusieurs objectifs d’intérêt général : la santé publique
  vétérinaire, la santé animale et le bien-être animal. Pour atteindre ces objectifs,
  le dispositif prévu par le décret s’articule autour de quatre axes : - la délégation
  d’actes par des vétérinaires à des délégataires certifiés ou des élèves vétérinaires
  salariés d’un établissement de soins vétérinaires en présence d’au moins un des
  vétérinaires exerçant dans l’établissement ; - la qualification des ASV, en tant
  que délégataires certifiés, à travers l’obtention d’un certificat complémentaire
  de compétences, après avoir suivi une formation obligatoire dans un centre habilité
  ; - la tenue par le Conseil national de l''Ordre des vétérinaires (CNOV) de la liste
  des délégataires certifiés ; - l’habilitation des centres de formation par le ministère
  chargé de l’agriculture, après instruction des dossiers par la commission des actes
  vétérinaires délégués. Compte tenu des objectifs d’intérêt général poursuivis et
  du circuit d’habilitation des centres de formation, il est nécessaire de prévoir
  un délai de prise de décision de six mois et de déroger à la règle générale en prévoyant
  que le silence de l’administration à l’issue de ces six mois vaut rejet de la demande
  d’habilitation. La LOSARGA et le décret d’application soumis viennent légaliser
  et encadrer une évolution des pratiques déjà engagée. La profession d’ASV a en effet
  évolué dans le temps : aux tâches administratives et d’entretien des locaux confiées
  initialement se sont ajoutées des tâches plus techniques (contention des animaux,
  etc.) jusqu’à la réalisation d’actes de médecine et de chirurgie simples. Le décret
  intègre ainsi une clause d’antériorité permettant aux ASV réalisant des actes vétérinaires
  délégués d’obtenir le certificat complémentaire de compétences sans suivre la formation
  obligatoire, en validant leurs compétences en passant un examen théorique organisé
  par le CNOV. Le ministre de l’intérieur, la ministre de la transition écologique,
  de la biodiversité et des négociations internationales sur le climat et la nature
  et la ministre de l’agriculture, de l’agro-alimentaire et de la souveraineté alimentaire
  ont présenté une communication sur les feux de forêt et la sécheresse. La France
  fait face cette année à une situation historique pour les feux de forêt. Depuis
  le début de la saison, 13 550 feux de végétation ont été recensés. La superficie
  totale parcourue par les flammes s’élève désormais à près de 116 000 hectares. C’est
  un niveau sans précédent. A titre de comparaison, en 2022, année qualifiée d’exceptionnelle,
  le bilan de la saison a comptabilisé un peu plus de 70 000 hectares de forêt et
  végétation brûlés pour plus de 22 700 feux. Les moyens aériens sont fortement engagés
  avec 5355 largages effectués par les avions bombardiers d’eau et 6468 largages par
  les hélicoptères bombardiers d’eau. Une mobilisation exceptionnelle sur plusieurs
  feux majeurs Les moyens nationaux restent pleinement mobilisés face à plusieurs
  incendies d’ampleur, notamment dans le Var, la Corse, les Landes et la Gironde.
  Les conditions météorologiques continuent de compliquer les opérations sur plusieurs
  secteurs, avec des feux toujours actifs et des interventions qui s’inscrivent dans
  la durée À Pontevès, dans le Var, la situation demeure défavorable. Depuis le déclenchement
  de ce feu, le 21 juillet, la superficie parcourue atteint 5 400 hectares. Les évacuations
  ont concerné et concernent encore 3000 personnes sur tout ou partie des communes
  de Correns, Châteauvert, Barjols et Brue-Auriac. Les forces de sécurité civile mobilisées
  sont de 1 100 sapeurs-pompiers appuyés par quatre sections militaires, deux détachements
  retardant, 120 gendarmes et 60 militaires. À Corte, en Corse, le feu a parcouru
  1 000 hectares. Il n’est pas fixé. La situation est défavorable. Les forces de sécurité
  civile mobilisées sont de 241 sapeurs-pompiers dont un détachement héliporté et
  de deux sections militaires. À Biscarrosse, dans les Landes, la situation demeure
  défavorable. La superficie parcourue atteint 3 600 hectares. Au plus fort, 36 000
  personnes ont dû être évacuées. Une partie des habitants de Biscarrosse ont été
  autorisés néanmoins à revenir hier dans les zones désormais à l’abri du feu et sécurisées.
  Les forces de sécurité civile mobilisées sont de 550 sapeurs-pompiers appuyés par
  420 gendarmes. À Saumos / secteur du Cap-Ferret en Gironde, la situation est défavorable.
  Il s’agit d’un feu d’une ampleur exceptionnelle. Depuis le 22 juillet, le feu a
  parcouru 42 000 hectares. Les évacuations ont concerné et concernent encore 220
  000 personnes dont 50 000 évacuées dans la nuit de samedi à dimanche. Un premier
  bilan matériel fait état de 277 bâtiments détruits impactés ou brûlés. Ce feu mobilise
  des moyens terrestres et aériens exceptionnels coordonnés par le SDIS de la Gironde.
  Au sol, plus de 2 500 sapeurs-pompiers dont 14 colonnes extra-zonales et un groupe
  suisse sont à l’œuvre. Ils bénéficient de l’appui de 1 500 militaires, de 1 200
  policiers et gendarmes et de 450 bénévoles des associations agrées de sécurité civile.
  18 moyens aériens sont engagés. Depuis le 25 juillet, l’A400 M effectue des largages
  de retardement en appui des opérations au sol. Dans le cadre du mécanisme de protection
  civile de l’UE (MPCU), la France bénéficie du renfort de deux bombardiers d’eau
  Black Hawk slovaque et tchèque engagés sur le feu de Saumos, un canadair croate
  et quatre avions Air Tractor, deux portugais engagés à Biscarrosse, deux suédois.
  D’autres moyens sont à venir. Depuis le 6 juillet, 162 personnes ont été interpellées
  dans le cadre d’enquêtes liées aux incendies. À ce stade, 5 condamnations à de la
  prison ferme ont été prononcées et 15 personnes sont placées en détention provisoire
  dans l’attente de leur jugement. Les enquêtes se poursuivent afin d’identifier les
  auteurs des départs de feu. Les conditions météorologiques restent propices aux
  départs et à la propagation rapide des feux. Les autorités appellent chacun à faire
  preuve de la plus grande vigilance, à respecter les interdictions en vigueur et
  à signaler immédiatement tout départ de feu. Plus que jamais, les sapeurs-pompiers,
  les forces de l’ordre, les militaires, les élus locaux et les services de l’Etat
  sont en première ligne pour protéger, accompagner et préparer l’après. À moyen terme,
  une poursuite des investissements Face à ces situations exceptionnelles qui se multiplient,
  l’action des Gouvernements depuis 10 ans est très forte et le Président de la République
  a fait de la forêt un enjeu de premier plan : effort de renouvellement sans précédent
  des forêts confrontées au changement climatique, avec un objectif du milliard d’arbres
  d’ici 2032, sécurisation de l’opérateur public, loi incendie de 2023 après les feux
  de 2022, et lutte contre la déforestation portée au niveau européen. Avec les crédits
  publics, notamment le plan de relance, France 2030 et ceux de la planification écologique,
  mais avec également l’appui du privé, près de 300 millions d’arbres ont ainsi été
  plantés depuis 2021. L’Etat a lancé le vaste chantier de l’adaptation de la forêt
  française et accompagne les sylviculteurs dans leurs investissements. Ces travaux
  devront se poursuivre dans les prochaines semaines et mois à venir. L’été 2026 se
  démarque déjà par une sécheresse généralisée sur l’ensemble du territoire métropolitain,
  particulièrement précoce et intense. Malgré des précipitations dans les normales
  en hiver et au printemps, le temps particulièrement sec depuis le mois d’avril et
  les épisodes caniculaires, qui ont accru la consommation d’eau durant plusieurs
  semaines, conduisent à un état critique de la ressource en eau et à un assèchement
  de la végétation sur l’essentiel du territoire national. Si la dégradation de la
  situation ralentit, les prochaines semaines s''annoncent toujours sèches. Les mesures
  de sobriété et les restrictions d''usage demeurent indispensables pour préserver
  les usages prioritaires, au premier rang desquels l''alimentation en eau potable.
  Point de situation sur la ressource en eau La sécheresse des sols est généralisée,
  les assecs (c’est-à-dire l’état d''une rivière ou d''un étang qui se retrouve sans
  eau) des petits cours d’eau de tête de bassin se multiplient. Au 15 juillet 2026,
  60 % des points d’observation des nappes présentaient un niveau inférieur aux normales
  saisonnières et 10 % des stations de mesure de débits atteignent des niveaux en
  dessous du niveau minimum depuis 50 ans. A ce stade de la saison, les barrages ont
  des niveaux significativement plus bas que la normale. Si leurs réserves restent
  encore importantes ; des arbitrages devront être faits afin de tenir jusqu’à l’automne
  tout en préservant les usages prioritaires des grands fleuves d’ici là. Cette situation
  a des conséquences importantes pour l’eau potable. Au 21 juillet près de 250 000
  personnes étaient concernées par des tensions sur l’eau potable, et près de 30 000
  personnes sont concernées par une alimentation en eau potable par camion-citerne,
  bouteilles d’eau, ou par des coupures d’eau prolongées. La raréfaction de la ressource
  en eau pendant cette période a des conséquences importantes pour différents secteurs
  économiques. En premier lieu pour l’agriculture et l’élevage, avec des tensions
  remontées pour l’accès à l’eau pour l’irrigation des cultures et des situations
  de tension pour l’abreuvement des animaux d’élevage dans certains territoires. La
  situation de sécheresse généralisée, ainsi que les canicules, ont par ailleurs eu
  des effets importants sur les rendements des différentes cultures avec des impacts
  économiques déjà constatés pour le maraîchage, le maïs et le tournesol, mais également
  sur la production de fourrage pour l’hiver prochain. L’activité de certaines industries
  est également dépendante de la ressource en eau. Les prochaines semaines s’annoncent
  toujours sèches, la situation devrait donc se dégrader. Des mesures adaptées pour
  préserver les usages prioritaires Face à cette situation, l’Etat se mobilise depuis
  plusieurs années dans le cadre du dispositif national de gestion de la sécheresse,
  renforcé à la suite de la crise de l''été 2022. Les préfets disposent ainsi d''un
  cadre harmonisé leur permettant de mettre en œuvre, de manière anticipée et proportionnée,
  des mesures adaptées à l''évolution de la ressource en eau. La circulaire du 3 juillet
  2026 a rappelé les principes et demandé d’accélérer la mise en place des mesures
  lorsque les prévisions sont défavorables. Quand la ressource est limitée, des restrictions
  d’eau sont mises en œuvre en fonction de la situation afin de préserver les usages
  essentiels, notamment l’eau potable. Plusieurs seuils sont définis : à partir du
  niveau d’alerte, des restrictions s’appliquent sur l’arrosage, les piscines, le
  lavage de véhicule et l’irrigation des cultures. En crise sécheresse, des interdictions
  totales ou partielles sur l’ensemble de ces usages s’appliquent, ainsi que d’autres
  usages domestiques ou concernant les espaces publics. Ces mesures ayant pour objectif
  premier de sécuriser l’approvisionnement en eau aux usages prioritaires d’alimentation
  en eau potable, aux usages de santé, sécurité civile, salubrité, l’abreuvement des
  animaux et les besoins des milieux naturels. Au 24 juillet, 91 départements sont
  concernés par des restrictions, et 8 autres sont en vigilance sécheresse. Au total,
  83 % du territoire national est au moins en niveau vigilance. Pour que ces mesures
  soient effectives, elles ont besoin d’être comprises et adaptés à la situation du
  territoire. Un effort de pédagogie est ainsi engagé par les préfets, afin de mobiliser
  l’ensemble des acteurs, professionnels comme particuliers. Dans une période de tension
  sur la ressource, chaque goutte compte et chacun peut agir : couper l’eau du robinet
  et vérifier les fuites, optimiser le remplissage des appareils de lavage (machine
  à laver, lave-vaisselle), réduire les arrosages domestiques et privilégier un arrosage
  en soirée pour limiter l’évaporation. L''action de l''Etat s''inscrit également
  dans la durée afin de renforcer la résilience des territoires face à la multiplication
  des épisodes de sécheresse. Le Plan Eau, présenté en mars 2023, mobilise 53 mesures
  visant notamment à réduire de 10 % les prélèvements d''eau d''ici 2030, grâce à
  la lutte contre les fuites, à l''accompagnement des industriels les plus consommateurs
  et au développement de la réutilisation des eaux non conventionnelles. Trois ans
  après son lancement, 100 % des 53 mesures sont engagées, 77 % des mesures sont mises
  en œuvre ou finalisées. Derrière ce bilan chiffré, le plan a permis des avancées
  concrètes sur la sobriété, la sécurisation de la ressource et la qualité de l''eau,
  en lien avec tous les acteurs et notamment les filières industrielles et les sites
  majeurs mais également les collectivités concernées. En parallèle, les travaux se
  poursuivent pour améliorer la connaissance de la ressource, renforcer les outils
  de suivi et de prévision et développer, dans les territoires les plus exposés, des
  stratégies concertées de partage de l''eau conciliant sobriété, efficience, préservation
  des milieux et adaptation au changement climatique. La protection durable de la
  qualité des ressources en eau constitue également une priorité afin de préserver
  les captages d''eau potable, particulièrement essentiels lors des épisodes de sécheresse.
  La sécheresse est un facteur de risque supplémentaire pour les départs et la propagation
  des feux de végétation et des feux de forêts. Le conseil des ministres a adopté
  les mesures individuelles suivantes : - Mme Gwénaëlle SUC , conseillère référendaire
  à la Cour des comptes, est nommée conseillère maître à la Cour des comptes (2ème
  tour) ; - M. Wadid BENAABOU , conseiller référendaire à la Cour des comptes, est
  nommé conseiller maître à la Cour des comptes (3ème tour) ; - M. Simon BERTOUX ,
  conseiller référendaire à la Cour des comptes, est nommé conseiller maître à la
  Cour des comptes (4ème tour) ; - M. François BOLARD , administrateur de l’Etat,
  est nommé conseiller maître à la Cour des comptes (tour extérieur), à compter du
  1er septembre 2026. Sur proposition du ministre de l’intérieur : - Mme Isabelle
  EPAILLARD , administratrice de l’Etat, est nommée préfète de l’Aisne, à compter
  du 31 août 2026 ; - M. Guillaume QUENET , administrateur de l’Etat, est nommé préfet
  délégué pour l’égalité des chances auprès du préfet de la région Provence-Alpes-Côte
  d’Azur, préfet de la zone de défense et de sécurité Sud, préfet des Bouchesdu-Rhône,
  à compter du 31 août 2026 ; - M. Xavier PELLETIER , administrateur de l’Etat, est
  nommé préfet d’Eureet-Loir, à compter du 31 août 2026 ; - M. Paul-Hugo VERDIN est
  nommé préfet, secrétaire général de la zone de défense et de sécurité de Paris,
  à compter du 7 septembre 2026 ; - M. Christophe MARX , administrateur de l’Etat,
  est nommé préfet délégué chargé d''une mission territoriale temporaire, à compter
  du 31 août 2026. Sur proposition de la ministre des armées et des anciens combattants
  : - M. le général de division aérienne du corps des officiers de l’air Sébastien
  VALLETTE est nommé directeur général adjoint des relations internationales et de
  la stratégie et est élevé aux rang et appellation de général de corps aérien, à
  compter du 1er septembre 2026. En outre, a été adoptée une mesure d’ordre individuel
  concernant un officier général du service de santé des armées. Sur proposition du
  ministre du travail et des solidarités et de la ministre de la santé, des familles,
  de l’autonomie et des personnes handicapées : - M. Paul BAZIN , inspecteur des finances
  de 1ère classe, est nommé directeur de la Caisse nationale d’assurance vieillesse,
  à compter du 28 août 2026. Sur proposition de la ministre de la transition écologique,
  de la biodiversité et des négociations internationales sur le climat et la nature
  : - Mme Agnès DOITRAND-LAPLACE est nommée directrice de la communication au secrétariat
  général du ministère de la transition écologique, de la biodiversité et des négociations
  internationales sur le climat et la nature par intérim, à compter du 17 août 2026.
  Sur la proposition de la ministre de l''agriculture, de l''agro-alimentaire et de
  la souveraineté alimentaire : - M. Luc MAURER , ingénieur général des ponts, des
  eaux et des forêts, est nommé directeur général de l’enseignement et de la recherche
  par intérim. Sur proposition du ministre de l’éducation nationale et du ministre
  de l’enseignement supérieur, de la recherche et de l’espace : - Mme Nathalie MONS
  , professeure des universités, est nommée rectrice de la région académique de Corse,
  rectrice de l’académie de Corse, à compter du 3 août 2026 ; - Mme Cécile LALOUX
  , inspectrice d’académie, inspectrice pédagogique régionale, est nommée rectrice
  de la région académique de la Martinique, rectrice de l’académie de la Martinique,
  à compter du 3 août 2026 ; - Mme Natacha CHICOT , maîtresse des requêtes au Conseil
  d’Etat, est nommée rectrice de la région académique Normandie, rectrice de l’académie
  de Normandie, à compter du 3 août 2026 ; - M. Emmanuel ROUX , professeur des universités,
  est nommé recteur de l’académie de Nice, à compter du 3 août 2026 ; - Mme Michelle
  BUBENICEK , professeure des universités de classe exceptionnelle, est nommée rectrice
  déléguée pour l''enseignement supérieur, la recherche et l’innovation de la région
  académique Nouvelle-Aquitaine, à compter du 3 août 2026 ; - Mme Clarisse BERTHEZÈNE
  , professeure des universités, est nommée rectrice déléguée pour l’enseignement
  supérieur, la recherche et l''innovation de la région académique Hautsde-France,
  à compter du 3 août 2026 ; - Mme Nathalie ALBERT-MORETTI , professeure des universités,
  est nommée rectrice de la région académique Bretagne, rectrice de l’académie de
  Rennes, à compter du 3 août 2026 ; - M. Pierre MOYA , inspecteur général de l’éducation,
  du sport et de la recherche, est nommé recteur de la région académique Bourgogne-Franche-Comté,
  recteur de l’académie de Besançon, à compter du 3 août 2026 ; - M. Benoît BONAIMÉ
  , ingénieur des ponts, des eaux et des forêts, est nommé recteur de l’académie d''Amiens,
  à compter du 3 août 2026 ; - M. Nicolas CASTOLDI est nommé recteur de l’académie
  de Poitiers, à compter du 3 août 2026. Sur proposition du ministre de l’Europe et
  des affaires étrangères : - il est mis fin aux fonctions d’ambassadrice pour le
  numérique et l’intelligence artificielle exercées par Mme Clara CHAPPAZ . Le ministre
  de l’Europe et des affaires étrangères a présenté un projet de loi autorisant la
  ratification de l’accord de protection des investissements entre l''Union européenne
  et ses États membres, d''une part, et la République socialiste du Vietnam, d''autre
  part. Signé à Hanoï le 30 juin 2019, cet accord a pour objectif de renforcer les
  relations économiques entre l’Union européenne et le Vietnam et de mieux protéger
  les investissements croisés. Il s’inscrit dans le contexte du renforcement de l’engagement
  de l’Union européenne et de la France dans la région indopacifique et du rapprochement
  stratégique entre l’Union européenne et le Vietnam. Il complète l’accord de libre-échange
  UE-Vietnam, également signé en juin 2019 et entré en vigueur en août 2020 Il renforce
  d’ailleurs le partenariat stratégique global établi en octobre 2024 entre la France
  et le Vietnam. L’accord de protection des investissements établit un cadre juridique
  modernisé et harmonisé pour la protection des investissements entre les États membres
  de l’Union européenne et le Vietnam. Cet accord prévoit des garanties juridiques
  pour les investisseurs et vise à réformer les mécanismes traditionnels d’arbitrage
  en instaurant un système juridictionnel de règlement des différends entre investisseurs
  et États. Il remplacera le traité bilatéral d’investissement conclu entre la France
  et le Vietnam en 1992. Dans un environnement en forte croissance et marqué par une
  importante concurrence internationale, cet accord soutiendra la présence économique
  française au Vietnam, où plus de 250 entreprises françaises sont implantées et emploient
  environ 26 000 personnes dans tous les secteurs. Le ministre de l’Europe et des
  affaires étrangères a présenté un projet de loi autorisant l’approbation de l’accord
  multilatéral entre autorités compétentes concernant l’échange automatique de renseignements
  relatifs au cadre de déclaration applicable aux crypto-actifs et l’approbation de
  l’addendum à l’accord multilatéral entre autorités compétentes concernant l’échange
  automatique de renseignements relatifs aux comptes financiers. L’accord, négocié
  dans le cadre de l’Organisation de coopération et de développement économiques (OCDE)
  en réponse à une demande du G20 et signé le 26 novembre 2024, définit un nouveau
  cadre juridique multilatéral visant à encadrer les échanges de renseignements entre
  administrations fiscales s’agissant précisément des crypto-actifs. Cet accord permet,
  à une échelle mondiale, d’accroître ces échanges afin de lutter plus efficacement
  contre la fraude et l’évasion fiscales, dans un contexte d’essor du marché des crypto-actifs
  et de ses détenteurs. L’addendum, signé à la même date, complète un accord multilatéral
  déjà approuvé et mis en œuvre par la France s’agissant de l’échange automatique
  de renseignements portant sur les comptes financiers. Il intègre les dernières normes
  et standards développés dans le cadre de l’OCDE qui étendent les échanges de renseignements
  à des monnaies numériques et crypto-monnaies. Complémentaires, ces deux accords
  multilatéraux fournissent ainsi un cadre juridique international adapté aux nouveaux
  enjeux liés au développement des crypto-actifs. Ils s’inscrivent dans la politique
  de lutte contre l’évasion et la fraude fiscales que mène la France à l’échelle internationale.
  Le ministre de l’économie, des finances et de la souveraineté industrielle, énergétique
  et numérique et le ministre de l’action et des comptes publics ont présenté une
  ordonnance portant divers ajustements du code des impositions sur les biens et services
  (CIBS). Cette ordonnance prolonge le chantier de modernisation et de simplification
  du droit fiscal engagé par le Gouvernement en 2019. Ce travail a conduit à la création
  du CIBS au 1er janvier 2022, puis à son enrichissement progressif, notamment avec
  l’intégration de plusieurs taxes au 1er janvier 2023 et, par une ordonnance du 17
  décembre 2025, avec le transfert des dispositions relatives à la taxe sur la valeur
  ajoutée (TVA). Une entrée en vigueur du nouveau régime de TVA reportée au 1er janvier
  2027 À la suite de la consultation publique menée sur la recodification de la TVA
  dans le CIBS, le Gouvernement a pris en compte les attentes exprimées par les entreprises
  et les praticiens du droit. L’entrée en vigueur du transfert des dispositions relatives
  à la TVA dans le CIBS est ainsi reportée au 1er janvier 2027, afin de permettre
  aux acteurs concernés de préparer plus sereinement la transition vers ce nouveau
  cadre juridique, notamment dans le contexte de la mise en œuvre de la réforme de
  la facturation électronique à compter du 1er septembre prochain. L’ordonnance répond
  également à une demande importante de simplification : elle regroupe désormais,
  au sein d’une subdivision unique du livre II du CIBS consacré à la TVA, l’ensemble
  des dispositions relatives au droit à déduction de la TVA pour améliorer la lisibilité
  du droit applicable. L’ordonnance intègre par ailleurs les mesures relatives à la
  TVA adoptées depuis l’ordonnance du 17 décembre 2025, notamment celles issues de
  la loi de finances pour 2026. Elle prend ainsi en compte plusieurs évolutions récentes
  du droit fiscal, comme l’harmonisation à 5,5 % du taux de TVA applicable aux services
  liés à la gestion des déchets. L’ordonnance met également à jour les références
  rendues nécessaires par l’entrée en vigueur de la partie législative du nouveau
  code des douanes au 1er mai 2026. Elle poursuit aussi l’harmonisation des catégories
  fiscales utilisées pour identifier les régimes de contrôle, de recouvrement et de
  contentieux : les « taxes sur le chiffre d’affaires » deviennent par exemple les
  « taxes sur les biens et services ». Une sécurité juridique renforcée pour les opérateurs
  L’ordonnance confirme explicitement que la doctrine administrative opposable aux
  redevables demeure inchangée lors de l’entrée en vigueur du CIBS. Cette garantie,
  déjà prévue par l’ordonnance du 17 décembre 2025 et précisée dans un rescrit publié
  le 18 février 2026 au Bulletin officiel des finances publiques – Impôts, est ainsi
  réaffirmée. L’ordonnance prend également en compte plusieurs demandes de clarification
  formulées lors de la consultation publique, notamment afin de rapprocher certaines
  formulations de la jurisprudence et procède enfin à diverses corrections d’erreurs
  matérielles identifiées dans l’ordonnance du 17 décembre 2025. Le travail de recodification
  se poursuit : dans les prochains mois, le livre du CIBS consacré à la TVA sera progressivement
  complété par son volet réglementaire. La ministre de l’agriculture, de l’agro-alimentaire
  et de la souveraineté alimentaire a présenté un décret portant sur la délégation
  d’actes vétérinaires à des salariés non vétérinaires qualifiés au sein des établissements
  de soins vétérinaires. Il s’agit d’un décret d’application de la loi d’orientation
  pour la souveraineté alimentaire et le renouvellement des générations en agriculture
  (LOSARGA), promulguée en mars 2025. Dans un contexte de croissance du marché des
  soins aux animaux et de tensions fortes sur le maillage vétérinaire, optimiser l’organisation
  du travail dans les établissements de soins vétérinaires, en faisant en sorte que
  les vétérinaires puissent se recentrer sur les actes médicaux et chirurgicaux où
  ils ont la plus forte valeur ajoutée, est essentiel. La LOSARGA introduit la possibilité
  pour les vétérinaires de déléguer à des salariés – les auxiliaires spécialisés vétérinaires
  (ASV) et les élèves vétérinaires – certains actes de médecine et de chirurgie des
  animaux. Ce décret répond à plusieurs objectifs d’intérêt général : la santé publique
  vétérinaire, la santé animale et le bien-être animal. Pour atteindre ces objectifs,
  le dispositif prévu par le décret s’articule autour de quatre axes : - la délégation
  d’actes par des vétérinaires à des délégataires certifiés ou des élèves vétérinaires
  salariés d’un établissement de soins vétérinaires en présence d’au moins un des
  vétérinaires exerçant dans l’établissement ; - la qualification des ASV, en tant
  que délégataires certifiés, à travers l’obtention d’un certificat complémentaire
  de compétences, après avoir suivi une formation obligatoire dans un centre habilité
  ; - la tenue par le Conseil national de l''Ordre des vétérinaires (CNOV) de la liste
  des délégataires certifiés ; - l’habilitation des centres de formation par le ministère
  chargé de l’agriculture, après instruction des dossiers par la commission des actes
  vétérinaires délégués. Compte tenu des objectifs d’intérêt général poursuivis et
  du circuit d’habilitation des centres de formation, il est nécessaire de prévoir
  un délai de prise de décision de six mois et de déroger à la règle générale en prévoyant
  que le silence de l’administration à l’issue de ces six mois vaut rejet de la demande
  d’habilitation. La LOSARGA et le décret d’application soumis viennent légaliser
  et encadrer une évolution des pratiques déjà engagée. La profession d’ASV a en effet
  évolué dans le temps : aux tâches administratives et d’entretien des locaux confiées
  initialement se sont ajoutées des tâches plus techniques (contention des animaux,
  etc.) jusqu’à la réalisation d’actes de médecine et de chirurgie simples. Le décret
  intègre ainsi une clause d’antériorité permettant aux ASV réalisant des actes vétérinaires
  délégués d’obtenir le certificat complémentaire de compétences sans suivre la formation
  obligatoire, en validant leurs compétences en passant un examen théorique organisé
  par le CNOV. Le ministre de l’intérieur, la ministre de la transition écologique,
  de la biodiversité et des négociations internationales sur le climat et la nature
  et la ministre de l’agriculture, de l’agro-alimentaire et de la souveraineté alimentaire
  ont présenté une communication sur les feux de forêt et la sécheresse. La France
  fait face cette année à une situation historique pour les feux de forêt. Depuis
  le début de la saison, 13 550 feux de végétation ont été recensés. La superficie
  totale parcourue par les flammes s’élève désormais à près de 116 000 hectares. C’est
  un niveau sans précédent. A titre de comparaison, en 2022, année qualifiée d’exceptionnelle,
  le bilan de la saison a comptabilisé un peu plus de 70 000 hectares de forêt et
  végétation brûlés pour plus de 22 700 feux. Les moyens aériens sont fortement engagés
  avec 5355 largages effectués par les avions bombardiers d’eau et 6468 largages par
  les hélicoptères bombardiers d’eau. Une mobilisation exceptionnelle sur plusieurs
  feux majeurs Les moyens nationaux restent pleinement mobilisés face à plusieurs
  incendies d’ampleur, notamment dans le Var, la Corse, les Landes et la Gironde.
  Les conditions météorologiques continuent de compliquer les opérations sur plusieurs
  secteurs, avec des feux toujours actifs et des interventions qui s’inscrivent dans
  la durée À Pontevès, dans le Var, la situation demeure défavorable. Depuis le déclenchement
  de ce feu, le 21 juillet, la superficie parcourue atteint 5 400 hectares. Les évacuations
  ont concerné et concernent encore 3000 personnes sur tout ou partie des communes
  de Correns, Châteauvert, Barjols et Brue-Auriac. Les forces de sécurité civile mobilisées
  sont de 1 100 sapeurs-pompiers appuyés par quatre sections militaires, deux détachements
  retardant, 120 gendarmes et 60 militaires. À Corte, en Corse, le feu a parcouru
  1 000 hectares. Il n’est pas fixé. La situation est défavorable. Les forces de sécurité
  civile mobilisées sont de 241 sapeurs-pompiers dont un détachement héliporté et
  de deux sections militaires. À Biscarrosse, dans les Landes, la situation demeure
  défavorable. La superficie parcourue atteint 3 600 hectares. Au plus fort, 36 000
  personnes ont dû être évacuées. Une partie des habitants de Biscarrosse ont été
  autorisés néanmoins à revenir hier dans les zones désormais à l’abri du feu et sécurisées.
  Les forces de sécurité civile mobilisées sont de 550 sapeurs-pompiers appuyés par
  420 gendarmes. À Saumos / secteur du Cap-Ferret en Gironde, la situation est défavorable.
  Il s’agit d’un feu d’une ampleur exceptionnelle. Depuis le 22 juillet, le feu a
  parcouru 42 000 hectares. Les évacuations ont concerné et concernent encore 220
  000 personnes dont 50 000 évacuées dans la nuit de samedi à dimanche. Un premier
  bilan matériel fait état de 277 bâtiments détruits impactés ou brûlés. Ce feu mobilise
  des moyens terrestres et aériens exceptionnels coordonnés par le SDIS de la Gironde.
  Au sol, plus de 2 500 sapeurs-pompiers dont 14 colonnes extra-zonales et un groupe
  suisse sont à l’œuvre. Ils bénéficient de l’appui de 1 500 militaires, de 1 200
  policiers et gendarmes et de 450 bénévoles des associations agrées de sécurité civile.
  18 moyens aériens sont engagés. Depuis le 25 juillet, l’A400 M effectue des largages
  de retardement en appui des opérations au sol. Dans le cadre du mécanisme de protection
  civile de l’UE (MPCU), la France bénéficie du renfort de deux bombardiers d’eau
  Black Hawk slovaque et tchèque engagés sur le feu de Saumos, un canadair croate
  et quatre avions Air Tractor, deux portugais engagés à Biscarrosse, deux suédois.
  D’autres moyens sont à venir. Depuis le 6 juillet, 162 personnes ont été interpellées
  dans le cadre d’enquêtes liées aux incendies. À ce stade, 5 condamnations à de la
  prison ferme ont été prononcées et 15 personnes sont placées en détention provisoire
  dans l’attente de leur jugement. Les enquêtes se poursuivent afin d’identifier les
  auteurs des départs de feu. Les conditions météorologiques restent propices aux
  départs et à la propagation rapide des feux. Les autorités appellent chacun à faire
  preuve de la plus grande vigilance, à respecter les interdictions en vigueur et
  à signaler immédiatement tout départ de feu. Plus que jamais, les sapeurs-pompiers,
  les forces de l’ordre, les militaires, les élus locaux et les services de l’Etat
  sont en première ligne pour protéger, accompagner et préparer l’après. À moyen terme,
  une poursuite des investissements Face à ces situations exceptionnelles qui se multiplient,
  l’action des Gouvernements depuis 10 ans est très forte et le Président de la République
  a fait de la forêt un enjeu de premier plan : effort de renouvellement sans précédent
  des forêts confrontées au changement climatique, avec un objectif du milliard d’arbres
  d’ici 2032, sécurisation de l’opérateur public, loi incendie de 2023 après les feux
  de 2022, et lutte contre la déforestation portée au niveau européen. Avec les crédits
  publics, notamment le plan de relance, France 2030 et ceux de la planification écologique,
  mais avec également l’appui du privé, près de 300 millions d’arbres ont ainsi été
  plantés depuis 2021. L’Etat a lancé le vaste chantier de l’adaptation de la forêt
  française et accompagne les sylviculteurs dans leurs investissements. Ces travaux
  devront se poursuivre dans les prochaines semaines et mois à venir. L’été 2026 se
  démarque déjà par une sécheresse généralisée sur l’ensemble du territoire métropolitain,
  particulièrement précoce et intense. Malgré des précipitations dans les normales
  en hiver et au printemps, le temps particulièrement sec depuis le mois d’avril et
  les épisodes caniculaires, qui ont accru la consommation d’eau durant plusieurs
  semaines, conduisent à un état critique de la ressource en eau et à un assèchement
  de la végétation sur l’essentiel du territoire national. Si la dégradation de la
  situation ralentit, les prochaines semaines s''annoncent toujours sèches. Les mesures
  de sobriété et les restrictions d''usage demeurent indispensables pour préserver
  les usages prioritaires, au premier rang desquels l''alimentation en eau potable.
  Point de situation sur la ressource en eau La sécheresse des sols est généralisée,
  les assecs (c’est-à-dire l’état d''une rivière ou d''un étang qui se retrouve sans
  eau) des petits cours d’eau de tête de bassin se multiplient. Au 15 juillet 2026,
  60 % des points d’observation des nappes présentaient un niveau inférieur aux normales
  saisonnières et 10 % des stations de mesure de débits atteignent des niveaux en
  dessous du niveau minimum depuis 50 ans. A ce stade de la saison, les barrages ont
  des niveaux significativement plus bas que la normale. Si leurs réserves restent
  encore importantes ; des arbitrages devront être faits afin de tenir jusqu’à l’automne
  tout en préservant les usages prioritaires des grands fleuves d’ici là. Cette situation
  a des conséquences importantes pour l’eau potable. Au 21 juillet près de 250 000
  personnes étaient concernées par des tensions sur l’eau potable, et près de 30 000
  personnes sont concernées par une alimentation en eau potable par camion-citerne,
  bouteilles d’eau, ou par des coupures d’eau prolongées. La raréfaction de la ressource
  en eau pendant cette période a des conséquences importantes pour différents secteurs
  économiques. En premier lieu pour l’agriculture et l’élevage, avec des tensions
  remontées pour l’accès à l’eau pour l’irrigation des cultures et des situations
  de tension pour l’abreuvement des animaux d’élevage dans certains territoires. La
  situation de sécheresse généralisée, ainsi que les canicules, ont par ailleurs eu
  des effets importants sur les rendements des différentes cultures avec des impacts
  économiques déjà constatés pour le maraîchage, le maïs et le tournesol, mais également
  sur la production de fourrage pour l’hiver prochain. L’activité de certaines industries
  est également dépendante de la ressource en eau. Les prochaines semaines s’annoncent
  toujours sèches, la situation devrait donc se dégrader. Des mesures adaptées pour
  préserver les usages prioritaires Face à cette situation, l’Etat se mobilise depuis
  plusieurs années dans le cadre du dispositif national de gestion de la sécheresse,
  renforcé à la suite de la crise de l''été 2022. Les préfets disposent ainsi d''un
  cadre harmonisé leur permettant de mettre en œuvre, de manière anticipée et proportionnée,
  des mesures adaptées à l''évolution de la ressource en eau. La circulaire du 3 juillet
  2026 a rappelé les principes et demandé d’accélérer la mise en place des mesures
  lorsque les prévisions sont défavorables. Quand la ressource est limitée, des restrictions
  d’eau sont mises en œuvre en fonction de la situation afin de préserver les usages
  essentiels, notamment l’eau potable. Plusieurs seuils sont définis : à partir du
  niveau d’alerte, des restrictions s’appliquent sur l’arrosage, les piscines, le
  lavage de véhicule et l’irrigation des cultures. En crise sécheresse, des interdictions
  totales ou partielles sur l’ensemble de ces usages s’appliquent, ainsi que d’autres
  usages domestiques ou concernant les espaces publics. Ces mesures ayant pour objectif
  premier de sécuriser l’approvisionnement en eau aux usages prioritaires d’alimentation
  en eau potable, aux usages de santé, sécurité civile, salubrité, l’abreuvement des
  animaux et les besoins des milieux naturels. Au 24 juillet, 91 départements sont
  concernés par des restrictions, et 8 autres sont en vigilance sécheresse. Au total,
  83 % du territoire national est au moins en niveau vigilance. Pour que ces mesures
  soient effectives, elles ont besoin d’être comprises et adaptés à la situation du
  territoire. Un effort de pédagogie est ainsi engagé par les préfets, afin de mobiliser
  l’ensemble des acteurs, professionnels comme particuliers. Dans une période de tension
  sur la ressource, chaque goutte compte et chacun peut agir : couper l’eau du robinet
  et vérifier les fuites, optimiser le remplissage des appareils de lavage (machine
  à laver, lave-vaisselle), réduire les arrosages domestiques et privilégier un arrosage
  en soirée pour limiter l’évaporation. L''action de l''Etat s''inscrit également
  dans la durée afin de renforcer la résilience des territoires face à la multiplication
  des épisodes de sécheresse. Le Plan Eau, présenté en mars 2023, mobilise 53 mesures
  visant notamment à réduire de 10 % les prélèvements d''eau d''ici 2030, grâce à
  la lutte contre les fuites, à l''accompagnement des industriels les plus consommateurs
  et au développement de la réutilisation des eaux non conventionnelles. Trois ans
  après son lancement, 100 % des 53 mesures sont engagées, 77 % des mesures sont mises
  en œuvre ou finalisées. Derrière ce bilan chiffré, le plan a permis des avancées
  concrètes sur la sobriété, la sécurisation de la ressource et la qualité de l''eau,
  en lien avec tous les acteurs et notamment les filières industrielles et les sites
  majeurs mais également les collectivités concernées. En parallèle, les travaux se
  poursuivent pour améliorer la connaissance de la ressource, renforcer les outils
  de suivi et de prévision et développer, dans les territoires les plus exposés, des
  stratégies concertées de partage de l''eau conciliant sobriété, efficience, préservation
  des milieux et adaptation au changement climatique. La protection durable de la
  qualité des ressources en eau constitue également une priorité afin de préserver
  les captages d''eau potable, particulièrement essentiels lors des épisodes de sécheresse.
  La sécheresse est un facteur de risque supplémentaire pour les départs et la propagation
  des feux de végétation et des feux de forêts. Le conseil des ministres a adopté
  les mesures individuelles suivantes : - Mme Gwénaëlle SUC , conseillère référendaire
  à la Cour des comptes, est nommée conseillère maître à la Cour des comptes (2ème
  tour) ; - M. Wadid BENAABOU , conseiller référendaire à la Cour des comptes, est
  nommé conseiller maître à la Cour des comptes (3ème tour) ; - M. Simon BERTOUX ,
  conseiller référendaire à la Cour des comptes, est nommé conseiller maître à la
  Cour des comptes (4ème tour) ; - M. François BOLARD , administrateur de l’Etat,
  est nommé conseiller maître à la Cour des comptes (tour extérieur), à compter du
  1er septembre 2026. Sur proposition du ministre de l’intérieur : - Mme Isabelle
  EPAILLARD , administratrice de l’Etat, est nommée préfète de l’Aisne, à compter
  du 31 août 2026 ; - M. Guillaume QUENET , administrateur de l’Etat, est nommé préfet
  délégué pour l’égalité des chances auprès du préfet de la région Provence-Alpes-Côte
  d’Azur, préfet de la zone de défense et de sécurité Sud, préfet des Bouchesdu-Rhône,
  à compter du 31 août 2026 ; - M. Xavier PELLETIER , administrateur de l’Etat, est
  nommé préfet d’Eureet-Loir, à compter du 31 août 2026 ; - M. Paul-Hugo VERDIN est
  nommé préfet, secrétaire général de la zone de défense et de sécurité de Paris,
  à compter du 7 septembre 2026 ; - M. Christophe MARX , administrateur de l’Etat,
  est nommé préfet délégué chargé d''une mission territoriale temporaire, à compter
  du 31 août 2026. Sur proposition de la ministre des armées et des anciens combattants
  : - M. le général de division aérienne du corps des officiers de l’air Sébastien
  VALLETTE est nommé directeur général adjoint des relations internationales et de
  la stratégie et est élevé aux rang et appellation de général de corps aérien, à
  compter du 1er septembre 2026. En outre, a été adoptée une mesure d’ordre individuel
  concernant un officier général du service de santé des armées. Sur proposition du
  ministre du travail et des solidarités et de la ministre de la santé, des familles,
  de l’autonomie et des personnes handicapées : - M. Paul BAZIN , inspecteur des finances
  de 1ère classe, est nommé directeur de la Caisse nationale d’assurance vieillesse,
  à compter du 28 août 2026. Sur proposition de la ministre de la transition écologique,
  de la biodiversité et des négociations internationales sur le climat et la nature
  : - Mme Agnès DOITRAND-LAPLACE est nommée directrice de la communication au secrétariat
  général du ministère de la transition écologique, de la biodiversité et des négociations
  internationales sur le climat et la nature par intérim, à compter du 17 août 2026.
  Sur la proposition de la ministre de l''agriculture, de l''agro-alimentaire et de
  la souveraineté alimentaire : - M. Luc MAURER , ingénieur général des ponts, des
  eaux et des forêts, est nommé directeur général de l’enseignement et de la recherche
  par intérim. Sur proposition du ministre de l’éducation nationale et du ministre
  de l’enseignement supérieur, de la recherche et de l’espace : - Mme Nathalie MONS
  , professeure des universités, est nommée rectrice de la région académique de Corse,
  rectrice de l’académie de Corse, à compter du 3 août 2026 ; - Mme Cécile LALOUX
  , inspectrice d’académie, inspectrice pédagogique régionale, est nommée rectrice
  de la région académique de la Martinique, rectrice de l’académie de la Martinique,
  à compter du 3 août 2026 ; - Mme Natacha CHICOT , maîtresse des requêtes au Conseil
  d’Etat, est nommée rectrice de la région académique Normandie, rectrice de l’académie
  de Normandie, à compter du 3 août 2026 ; - M. Emmanuel ROUX , professeur des universités,
  est nommé recteur de l’académie de Nice, à compter du 3 août 2026 ; - Mme Michelle
  BUBENICEK , professeure des universités de classe exceptionnelle, est nommée rectrice
  déléguée pour l''enseignement supérieur, la recherche et l’innovation de la région
  académique Nouvelle-Aquitaine, à compter du 3 août 2026 ; - Mme Clarisse BERTHEZÈNE
  , professeure des universités, est nommée rectrice déléguée pour l’enseignement
  supérieur, la recherche et l''innovation de la région académique Hautsde-France,
  à compter du 3 août 2026 ; - Mme Nathalie ALBERT-MORETTI , professeure des universités,
  est nommée rectrice de la région académique Bretagne, rectrice de l’académie de
  Rennes, à compter du 3 août 2026 ; - M. Pierre MOYA , inspecteur général de l’éducation,
  du sport et de la recherche, est nommé recteur de la région académique Bourgogne-Franche-Comté,
  recteur de l’académie de Besançon, à compter du 3 août 2026 ; - M. Benoît BONAIMÉ
  , ingénieur des ponts, des eaux et des forêts, est nommé recteur de l’académie d''Amiens,
  à compter du 3 août 2026 ; - M. Nicolas CASTOLDI est nommé recteur de l’académie
  de Poitiers, à compter du 3 août 2026. Sur proposition du ministre de l’Europe et
  des affaires étrangères : - il est mis fin aux fonctions d’ambassadrice pour le
  numérique et l’intelligence artificielle exercées par Mme Clara CHAPPAZ .'
