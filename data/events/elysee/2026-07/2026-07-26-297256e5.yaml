title: Disparition de Marie-Paule Belle.
text: 'Elle n’était pas parisienne et s’en trouvait gênée. Par son esprit pourtant,
  son élégance, son indépendance et cette manière unique de faire pétiller les mots
  au rythme du piano, elle l’était devenue plus que personne. Chanteuse, compositrice
  et pianiste, Marie-Paule Belle, s’est éteinte le 25 juillet 2026, à Neuilly-sur-Seine,
  à l’âge de 80 ans, laissant derrière elle plus d’un demi-siècle de chansons, de
  malice et de liberté. Née le 25 janvier 1946 à Pont-Sainte-Maxence, dans l’Oise,
  Marie-Paule Belle grandit à Nice. Sa mère, musicienne, lui enseigna le piano et
  la guitare dès l’âge de trois ans. À neuf ans, elle écrivait ses premiers textes,
  tendres et loufoques. Après une maîtrise de psychologie, elle gagna Paris en 1969,
  à la disparition de sa mère, avec le projet de poursuivre à la Sorbonne une recherche
  consacrée à « l’angoisse et l’expression ». Elle choisit finalement d’exprimer l’une
  et de conjurer l’autre par la chanson. Sa carrière débuta presque par hasard, lorsqu’un
  pari passé avec des amis de faculté l’avait conduite à participer au radio-crochet
  Chapeau, sur Radio Monte-Carlo. Elle le remporta et enregistra son premier disque.
  À Paris, elle fit ses débuts dans les cabarets de la rive gauche, de L’Échelle de
  Jacob à L’Écluse, sur les traces de Barbara. Sur ces scènes intimes, Marie-Paule
  Belle imposa sa silhouette, son piano et son univers : celui d’une artiste capable
  de passer de la gravité au rire, de la mélancolie à l’irrévérence, d’une mélodie
  de Chopin à une chanson saugrenue. Son premier album lui valut le prix de l’Académie
  Charles-Cros, celui de l’Académie du disque et le Grand Prix de la chanson française.
  Sa rencontre avec Françoise Mallet-Joris fut artistique autant que romantique. L’une
  écrivit les mots et l’autre leur donna une musique. Ensemble, elles inventèrent
  des chansons où la délicatesse des sentiments rencontrait l’audace d’une parole
  libre. En 1975, Serge Lama, son « frère de spectacle » et son pygmalion, l’emmena
  sur les routes de France. Puis vint, en 1976, La Parisienne. Une chanson vive, drôle,
  irrésistible, dont les premières notes suffisaient à faire naître un sourire et
  qui devint aussitôt l’un des airs familiers de notre pays. Elle lui valut un disque
  d’or l’année suivante. Avec Wolfgang et moi, Nosferatu, La Petite Écriture grise,
  Les Petits Patelins, L’Amour dans les volubilis ou Quand nous serons amis, Marie-Paule
  Belle déploya un répertoire immense, tendre et fantasque. Elle savait rire des conventions,
  contester les rôles assignés et célébrer une liberté féminine. L’Olympia, le Théâtre
  des Variétés, les Francofolies de La Rochelle et de Montréal accueillirent cette
  artiste dont la carrière connut les sommets, les silences, les départs et les retours.
  Elle joua aussi la comédie au Festival d’Avignon et conçut avec Françoise Mallet-Joris
  un opéra-bouffe consacré à Lucrèce Borgia. Fidèle interprète de Barbara, elle fit
  dialoguer leurs deux répertoires dans le spectacle De Belle à Barbara, unissant
  leurs voix libres et leur même exigence des mots. En mai dernier, au Théâtre de
  Passy, elle voulut faire de ses adieux une fête. Seule devant son piano noir, entourée
  de ses amis et d’un public conquis, elle interpréta une dernière fois Pays natal,
  Loin, Nosferatu, J’ai la clef et, bien sûr, une Parisienne. De ses premiers cabarets
  jusqu’à son ultime récital, Marie-Paule Belle aura composé une œuvre immense : vingt-cinq
  albums et plus de quatre cents chansons, dans lesquelles plusieurs générations de
  Français ont trouvé de quoi sourire, aimer, pleurer. Le Président de la République
  et son épouse saluent la mémoire d’une artiste singulière et généreuse, d’une femme
  libre qui avait fait de l’élégance une espièglerie, de la mélancolie une force et
  de la chanson un art de vivre. Ils adressent à sa famille, à ses proches, à ses
  amis de scène ainsi qu’à son fidèle public leurs condoléances attristées.'
