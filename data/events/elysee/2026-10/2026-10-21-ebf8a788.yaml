date: '2026-10-21'
type: press_release
source_name: elysee
title: Déplacement au Proche et Moyen-Orient.
text: Le Président de la République s'est rendu au Koweït, aux Émirats arabes unis,
  à Bahreïn et au Qatar du 19 au 21 octobre 2026. Face à la crise que traverse le
  Moyen-Orient, le Président de la République a poursuivi sa mobilisation auprès des
  dirigeants de la région en faveur du retour à la stabilité et à la libre navigation
  dans le détroit d’Ormuz . Les échanges ont porté sur la sécurisation et la diversification
  de nos approvisionnements énergétiques et de leurs voies d’acheminement dans l’objectif
  de limiter les conséquences de la crise énergétique sur le quotidien des Français
  . Le chef de l’État a par ailleurs œuvré pour renforcer les partenariats stratégiques
  et économiques que la France entretient avec les pays du Golfe. Ce déplacement a
  visé notamment à consolider la présence de nos entreprises dans la région et les
  investissements en France , mais aussi à renforcer nos coopérations en matière d’énergie,
  d’enjeux globaux, de défense et de sécurité. 21 octobre 2026 - Seul le prononcé
  fait foi Je souhaitais faire un point rapide avec vous toutes et vous tous. D'abord,
  je veux ici exprimer les condoléances de la Nation après l'accident de Mirage 2000-D
  que nous avons eu en France hier soir tard. Nous avons retrouvé malheureusement
  le pilote qui est décédé. Je veux ici adresser à sa famille, à ses proches et à
  l'ensemble de ses frères d'armes les condoléances de la Nation. Et le navigateur
  est aujourd'hui recherché. Je voulais ensuite dire quelques mots de ce déplacement
  de travail que nous venons d'effectuer et que nous sommes en train de terminer dans
  la région. Évidemment, la région où nous sommes, celle du Golfe, a été particulièrement
  déstabilisée ces derniers mois par la guerre qui a commencé dès le 28 février dernier
  et qui a conduit à des répliques de l'Iran, à la fermeture du détroit d'Ormuz et
  à la déstabilisation de toute la région, de la sécurité des pays et de nos économies,
  avec un impact que nous connaissons et qui touche directement nos compatriotes depuis
  plusieurs mois et qui s'est détérioré à la fin de l'été avec des conditions encore
  plus dures sur le plan sécuritaire. L'objectif de cette visite, qui était programmée
  depuis plusieurs semaines, était multiple, mais dans un contexte où la France, depuis
  le premier jour, d'abord a été une puissance de paix et de stabilité. Nous avons
  dit dès le premier jour que ça n'était pas notre guerre, que nous n'avions pas pris
  cette décision et que nous considérions que la paix et la stabilité de la région
  étaient prioritaires, même si nous avons toujours été clairs aussi en disant que
  nous sommes résolument contre toute forme d'activité nucléaire en Iran. Et la deuxième
  chose, c'est que nous avons été aux côtés de ces pays pour, dès le premier jour,
  contribuer à leur sécurité. Le premier objectif, c'était de poursuivre le travail
  que nous conduisons avec nos équipes sur les négociations qui sont en cours avec
  l'Iran. Il y a différents canaux de négociations qui existent, entre l'Iran et les
  États-Unis, avec aussi d'autres pays, pour apaiser la situation. C'est le premier
  objectif diplomatique. La deuxième chose, c'est qu'évidemment, personne ne sait
  comment tout ça va évoluer dans les semaines et les mois qui viennent. Et donc,
  compte tenu du rôle que la France a joué, de la confiance qui s'est établie, c'est
  aussi de pouvoir garantir des volumes sur des catégories d'hydrocarbures où nous
  sommes dépendants et on sait que les prochains mois, il y avait un risque. La priorité,
  c'est le diesel et l'autre, c'est le gaz. Et c'est ce qui a été fait, principalement
  auprès de l'Arabie saoudite, comme vous le savez, ces dernières semaines, mais là,
  à Bahreïn et aux Émirats arabes unis pour ce qui est du diesel, et ici, au Qatar,
  pour ce qui est du gaz liquéfié. Et les engagements que nous avons obtenus sont
  importants pour nous, à la fois pour éviter, justement, toute difficulté que nous
  pourrions avoir avec un impact direct sur nos compatriotes et sur notre économie,
  mais aussi pour continuer de mettre en œuvre la politique aussi qu'on a depuis plusieurs
  semaines, qui permet de faire baisser la tension sur les prix. Je rappelle que la
  France a été à l'initiative de la réunion du G7, qui a conduit à libérer des stocks
  stratégiques et qui, par la mise en œuvre nationale, va permettre, à partir de début
  novembre, de faire baisser les prix, toutes choses égales, par ailleurs. Troisième
  élément, c'est qu'on a enclenché des discussions aussi pour aider à la sécurisation
  de certains de ces bateaux les plus sensibles. Quatrièmement, la grande difficulté
  du moment, c'est le coût de transport. Ils ont été multipliés par dix. Et donc,
  on a proposé de structurer un mécanisme de garantie aux grands fonds de la région.
  C'est ce que nous allons travailler dans les prochains jours et prochaines semaines
  pour baisser ces coûts de transport qui sont liés au fait qu'il manque de bateaux
  pour venir, parce que trop peu sont assurés. Il y a aujourd'hui quelques bateaux
  qui sont spécialisés dans les allers-retours jusqu'au détroit d'Ormuz, puis des
  transbordements. Et donc, la chaîne logistique est complètement détruite par ce
  coût du transport et l'absence de garantie et d'assurance. Et donc, c'est le mécanisme
  que nous avons lancé dans le droit fil de l'initiative que nous avions prise dès
  le mois d'avril dernier par cette coalition internationale. Le dernier aspect sur
  lequel nous travaillons avec les pays de la région, c'est la diversification des
  infrastructures. C'est aussi le sens de ce que j'avais fait il y a quelques semaines
  en Irak ou en Syrie, enfin, avec le Premier ministre irakien se rendant à Paris
  et en Syrie, c'est de pouvoir réduire nos dépendances à Ormuz. Au total, pour moi,
  les objectifs sont atteints, puisqu'on a obtenu des garanties sur les volumes où
  il y avait des incertitudes qui pouvaient préexister, ce qui me permet de dire ici
  que tout ça nous conforte pour les mois à venir et va permettre d'avoir des conditions
  bien meilleures pour nos compatriotes et en tout cas, d'éviter les manques qui étaient
  envisagés par certains opérateurs. Mon dernier point, c'est de dire qu'au-delà de
  ces discussions, nous avions évidemment des intérêts en matière de défense et que
  nous avons pu, par ce déplacement, consolider la relation de défense avec les Émirats
  arabes unis, où un accord important a été signé, un accord intergouvernemental et
  un ensemble d'accords pour avoir une stratégie commune sur la cinquième génération
  de Rafale. Et ici, une série d'accords au Qatar ont été conclus aussi sur la montée
  en gamme des Rafale qui sont ici existants et, ce matin, sur les véhicules blindés
  du véhicule blindé de combat d'infanterie, qui est aussi un prospect important.
  Il y en a d'autres, mais je ne détaillerai pas par souci de temps. Je vais maintenant
  répondre à vos questions. Vous êtes venu ici pour, notamment, récupérer des hydrocarbures
  pour les Français. Quelque part, en échange du soutien militaire de la France, est-ce
  qu'on peut parler d'une sorte de renvoi d'ascenseur par ces pays ici ? Et est-ce
  que vous pensez que ces annonces sur la fourniture en hydrocarbures sont de nature
  à calmer la colère sociale en France ? D'abord, je pense que c'était important.
  Et en effet, quand la confiance est établie, quand on a montré qu'on était là en
  temps difficile, il est plus simple d'avoir de la visibilité. Et donc, j'ai eu des
  partenaires qui ont compris qu'en tant que clients que nous sommes, que consommateurs,
  on en a besoin. Je veux insister ici pour dire que cette stratégie, elle s'articule
  avec aussi celle que nous avons à la maison et depuis plusieurs années, qui est
  une stratégie de réduction de ces dépendances. C'est tout ce qu'on a lancé ces dernières
  années, le plan d'électrification, ce qu'on a fait sur le véhicule automobile. En
  2017, il y avait moins de 5 % des véhicules automobiles vendus qui étaient électriques.
  En septembre, il y avait plus de 40 %. Donc cette stratégie aussi, progressivement,
  on réduit nos dépendances, mais nous en avons encore. Et donc, c'est utile, dans
  cette période, d'avoir été des partenaires de confiance qui ont aidé à la sécurité
  et la stabilité. Et en effet, je crois que nos compatriotes vont en avoir le juste
  retour, et c'est normal, par les choix qui ont été faits par les pays de la région.
  Je pense que c'est un des aspects de la crise. Après, je suis très humble et très
  prudent, parce que nul ne sait dire comment, dans les jours, les semaines qui viennent,
  les choses vont évoluer. Je dirais que si les conditions ne changent pas, ça va
  améliorer les choses, mais s'il y a à nouveau un conflit qui repart, s'il y a à
  nouveau de la tension, donc il faut rester extrêmement prudent. On a aussi pris
  des décisions nationales qui, à partir de début novembre, vont avoir un impact sur
  les prix à la pompe. Je pense que c'est tout ça est de nature à aider. On fait tout
  ce qu'on peut. On a libéré les stocks stratégiques, on a organisé la libération
  de ces stocks stratégiques entre TotalEnergies et nos distributeurs pour qu'il y
  ait des baisses des prix à la pompe. On vient chercher les volumes qui sont disponibles,
  on les sécurise, on fait tout ce qu'on peut et on aide à faire accoucher la paix.
  Néanmoins, il y a beaucoup de contingences et d'incertitudes qui demeurent, et il
  faut avoir l'humilité de les regarder. Donc tout ça va dans le bon sens. C'est une
  partie des angoisses. J'entends aussi l'inquiétude de nos lycéens, nos étudiants,
  elle a d'autres ressorts. Mais en tout cas, je pense que ça va dans la bonne direction
  avec cet outil. Craignez-vous une reprise imminente de la guerre entre les États-Unis
  et l'Iran ? Est-ce que vous êtes venu au Qatar avec une proposition française concrète
  pour la médiation qatarie pour empêcher cette reprise ? Alors, je pense que... Je
  ne prendrai pas ici de pari, parce qu'il y a eu beaucoup d'incertitudes et des choix
  qui ont été pris par les uns et les autres que je ne commenterai pas. Nous n'avons
  jamais cessé le contact, et avec, évidemment, les États-Unis d'Amérique, qui sont
  nos alliés, et avec le président Pezeshkian. On a essayé de multiplier les canaux
  de discussion, d'appeler au calme et à la désescalade. On a fait des propositions
  aussi, vous le savez, pour rouvrir le détroit d'Ormuz dans les eaux internationales
  et les eaux omanaises. Cette proposition reste valable et valide, et on en a longuement
  parlé. Il y a eu une médiation, en effet, qui a été faite par le Qatar. Je pense
  qu'elle est très importante et elle va dans la bonne direction. On a parlé très
  longuement des détails et des évolutions, et je pense que les prochaines heures,
  les prochains jours vont nous permettre d'avoir le retour, en particulier de l'Iran.
  Et c'est en fonction de ce retour qu'on pourra voir. Je pense qu'on est dans une
  période, nul ne l'ignore, qui, malgré tout, peut conduire à des tensions, des élections
  en Israël, des élections de midterms aux États-Unis. Et donc, dans cette période,
  il faut redoubler d'initiatives et d'efforts pour éviter que ces tensions ne deviennent
  une reprise des conflits. Avec le Qatar, le Premier ministre a annoncé récemment
  leur volonté de créer un hub régional de production d'armements. Est-ce que vous
  pouvez nous en dire un peu plus ? Comment est-ce que la France pourrait s'intégrer
  dans ce processus-là ? Est-ce que, sur le gaz naturel liquéfié aussi, vous avez
  obtenu différentes choses ? Ou sur la sécurisation en matière de défense aérienne,
  est-ce qu'on peut en savoir un peu plus ? Alors, nous sommes des partenaires de
  défense du Qatar, comme vous le savez, et nous avons plusieurs coopérations et contributions
  qui sont importantes, qui sont solides, qui ont montré leur solidité durant cette
  période, où nous avons d'ailleurs transféré, dès le début du conflit, des capacités
  de défense sol-air qui ont été efficaces et qui ont été utilisées par nos partenaires
  au Qatar. Et ça a été reconnu par l'Émir hier. Donc là-dessus, on continue cette
  relation. Elle se consolide. Elle va se consolider par une montée en gamme des capacités
  aériennes du Qatar que nous allons accompagner, avec une nouvelle génération de
  Rafale. Elle va s'accompagner par ce que nous avons enclenché en matière d'armement
  terrestre, avec les véhicules blindés. Elle va aussi se poursuivre par des discussions
  qu'on a entamées sur d'autres capacités de défense sol-air. Donc là-dessus, entre
  autres, exactement, des radars et des systèmes de défense. Donc ça, on va continuer
  d'avancer. Tous les pays de la région cherchent à avoir plus d'autonomie et à développer
  leur propre capacité de défense. Nous sommes des partenaires depuis plusieurs années.
  Cette relation, y compris avant le mois de février dernier, s'était déjà beaucoup
  renforcée. Elle va se consolider. Sur la partie gazière, oui, nous avons sécurisé,
  durant la période hivernale, l'équivalent de 2 térawattheures par mois de gaz naturel
  liquéfié, ce qui était important pour nous et ce qui va nous permettre, là-dessus,
  d'avancer. Concernant les attaques des houthis contre l'Arabie saoudite, quelle
  forme de soutien la France apporte-t-elle à Riyad ? Comment voyez-vous la situation
  sécuritaire en mer Rouge et dans le détroit d’Ormuz ? L'Angleterre envoie des avions
  de combat pour défendre l'Arabie saoudite, et je me demandais si vous pouviez détailler
  concrètement l'aide française apportée en ce moment. Oui. D'abord, je pense qu'il
  est important aussi qu'il y ait des discussions qui reprennent avec les Houthis
  et qu'évidemment, la tension baisse, parce que ça va dans le même sens. Nous, ce
  que nous avons dit, c'est qu'évidemment, nous sommes aux côtés de la sécurité et
  de la défense de l'Arabie saoudite. Ça rejoint aussi ce que j'expliquais tout à
  l'heure. L'Arabie saoudite a un pipeline qui est très important, qui va du golfe
  Persique à la mer Rouge et qui débouche à Yanbu. Il y a plusieurs capacités qui
  ont été détruites par les tirs Houthis. Nous avons proposé de participer à la réhabilitation.
  Et surtout, à la sécurisation de ce site. Donc, depuis huit jours maintenant, on
  a des effectifs qui sont déployés, des capacités qui sont déployées. On avance avec
  l'Arabie saoudite en ce sens. Donc, nous avons une participation défensive. Monsieur
  le Président, avez-vous évoqué la situation au Liban avec l’émir du Qatar, surtout
  que le Qatar a fait une médiation au Liban ? Et est-ce que vous allez envoyer des
  forces après le départ de la FINUL avec l'Italie pour ce Liban ? Merci de cette
  question. Le Liban est pour nous, comme vous le savez, toujours très important.
  Il y a quelques semaines, le Président Aoun était là. On a eu une réunion de travail
  avec le président Aoun et le roi de Jordanie. Il y a en effet eu une visite du Premier
  ministre au Liban il y a quelques jours. Je crois que tout le monde constate aujourd'hui
  la situation intenable dans laquelle se trouve le Liban, avec une tension très forte
  qui se poursuit, le sud du Litani qui est occupé par l'armée israélienne, des demandes
  qui sont faites, une pression qui est faite sur le Liban et en fait une souveraineté
  qui est mise à mal, ce qui est, je dirais, la moins bonne manière de traiter de
  la question du Hezbollah. Notre stratégie est simple et nous la partageons. Notre
  objectif, c'est la souveraineté, la stabilité du Liban et le désarmement du Hezbollah.
  Pour arriver à cet objectif, il faut d'une part obtenir un retrait des troupes israéliennes,
  desquelles s'accompagnent de mécanismes de confiance et donc de la restauration
  d'un mécanisme de coordination pour organiser ce retrait, comme nous avions su le
  faire en 2024 et 2025. La France est prête à y contribuer, le Qatar aussi, et un
  renforcement des forces armées libanaises qui auront en premier regard la responsabilité,
  la restauration de cette souveraineté et à organiser en bon ordre, par aussi des
  discussions qui sont sous la responsabilité du Président et du Premier ministre,
  le désarmement du Hezbollah. Et c'est pourquoi nous allons nous coordonner aussi
  pour mener ce travail de soutien aux forces armées libanaises et une conférence
  sera mise en place dans les prochaines semaines par la France, en lien très étroit.
  Je pense qu'il est inutile de le faire avant les élections israéliennes, mais nous
  allons organiser une telle conférence parce que c'est un préalable. À côté de ça,
  il y a l'avenir parce que ces forces armées libanaises, on le sait, sont soutenues
  par une force internationale depuis des décennies. Nous regrettons la décision qui
  a été prise de mettre fin au mandat. Je pense qu'une des attentes fortes qu'avait
  le Président Aoun en allant à Washington, c'était d'obtenir une garantie américaine
  qu’il y ait une poursuite. Je regrette que son souhait n'ait pas été exaucé. Je
  pense que c'est une erreur. Nous travaillons avec l'Italie et d'autres partenaires
  à d'autres forces multinationales dont nous espérons qu'elles pourront avoir un
  mandat des Nations unies et un soutien clair. Elles viendront, et la France sera
  prête à y contribuer, en soutien aux forces armées libanaises dans un cadre qui
  doit être clair et qui est celui d'un retrait ordonné des forces israéliennes du
  Sud-Liban. Monsieur le Président, 24 heures après votre allocution aux Français
  qui a été vivement critiquée, il y a eu un nouvel appel à mobilisation sociale.
  Ce samedi 24 octobre, une semaine après les violences, les dégradations, les pillages,
  la mairie de Limoges a été incendiée. Est-ce que vous craignez le même scénario
  de violences ? Est-ce que vous craignez de perdre une nouvelle fois le contrôle
  dans le maintien de l'ordre ? Vous avez dit beaucoup de mots peut-être auxquels
  je ne souscris sans doute pas, qui sont des qualificatifs qui vous appartiennent,
  mais je vais revenir aux faits et je vais essayer de revenir sur la méthode et le
  calme. Il s'est passé samedi dernier des choses inacceptables dans plusieurs villes
  du pays, qui nous ont tous choqués et fait mal. Je me suis exprimé dimanche soir,
  c'était mon rôle. J'ai constaté ce qui s'était passé et j'ai demandé des clarifications
  et j'ai donné une feuille de route. C'est cette feuille de route qui est appliquée.
  La première chose, c'est la transparence sur ce qui s'est passé le 17 octobre. Le
  ministre de l'Intérieur a commencé à le faire. Demain matin, je tiendrai une réunion
  avec l'ensemble des services de renseignement, le Premier ministre et les ministres
  concernés pour avoir un compte-rendu détaillé de tout ce qui s'est passé exactement.
  La deuxième chose, c'est de prendre toutes mesures dès lundi matin pour pouvoir
  empêcher que dans les centres-villes qui ont été touchés en particulier, on ait
  un retour de ces scènes inacceptables. C'est ce qui est fait de manière méthodique
  à la suite de mes instructions. Des mesures de couvre-feu ont été prises, des interdictions
  de rassemblement et de regroupement, et pour ce qui est de samedi prochain, c'est
  ce qui sera fait. Et donc, fermeté, et nous utilisons ce qui est dans notre droit
  pour éviter qu'il y ait de nouveaux événements de ce type. Et donc, dans plusieurs
  villes, des couvre-feux ont été mis en œuvre, ces couvre-feux sont respectés, ils
  sont tenus, et des regroupements et des mobilisations sont interdits. Et les gens
  qui veulent faire le désordre dans les centres-villes samedi prochain, ils seront
  empêchés de faire le désordre. Et donc, demain, nous aurons aussi un point très
  précis sur la mise en œuvre des dispositifs, à la fois d'anticipation de renseignement
  et de sécurisation, pas simplement sur samedi, mais les prochaines semaines. Et
  donc, c'est avec méthode ce que fait le gouvernement, conformément à ce que j'ai
  demandé dimanche soir. Le troisième élément, c'est d'engager une discussion avec
  les organisations syndicales, ce que fait en ce moment le Premier ministre, les
  forces politiques, ce qu'il fera demain après-midi, pour responsabiliser tout le
  monde dans ce contexte. Parce qu'on a eu trop de gens ambigus. Trop de gens pour
  expliquer qu'il y avait des violences légitimes. Non, il n'y a aucune violence légitime.
  Aucune. Vous les avez interviewés, vous les avez dans vos antennes. Donc, aucune
  violence n'est légitime. Ni verbale, ni physique. Ni contre les biens, ni contre
  les personnes. Le début de la violence, c'est la justification du reste. En démocratie,
  il n'y a rien qui justifie la violence. Et à côté de ça, il y a évidemment le travail
  qui est fait, lui, pour traiter les demandes légitimes. Et en particulier, pour
  notre jeunesse, et donc avec les organisations lycéennes, avec les organisations
  étudiantes, l'ensemble des partenaires sociaux, des formations patronales, des collectivités
  territoriales aussi, qui ont leurs responsabilités. Elles ont, pour certaines, des
  responsabilités dans le bâtiment, pour ce qui est des lycées, par exemple, de mettre
  tout le monde autour de la table pour avoir un plan de travail, des décisions claires
  et pouvoir avancer. L'objectif, c'est d'entendre, de respecter les inquiétudes,
  les désaccords, parfois les colères qui sont là, d'en traiter les causes profondes,
  de le faire de manière ordonnée, mais de les séparer de la violence qui s'est exercée,
  à laquelle nous ne céderons rien. Donc voilà. Cette feuille de route, elle est appliquée
  avec méthode par le gouvernement. Les réunions de ce matin, la réunion qui se tiendra,
  je le disais, demain après-midi. Moi, demain matin, je tiendrai une réunion de sécurité.
  J'aurai l'occasion aussi d'aller aux côtés de nos forces de sécurité dès demain
  après-midi. Le Premier ministre verra aussi les maires. Donc nous organisons les
  choses conformément à ce que j'ai dit dimanche soir, avec méthode, avec calme, mais
  avec détermination. Est-ce que vous avez des indices d'ingérence étrangère ? Je
  vais être prudent, parce que demain, j'aurai le compte-rendu le plus explicite.
  Je vais vous dire à date ce que j'ai. Pour moi, il n'y a pas d'ingérence étrangère
  visible dans les événements qui se sont passés. Par contre, il y a une manipulation
  étrangère de l'information, à la suite, ça, oui, qui a donné lieu à des commentaires
  inacceptables autant que stupides de la part de beaucoup, y compris de dirigeants
  étrangers. C'est-à-dire qu'on a vu des images d'intelligence artificielle qui ont
  montré des scènes qui ne se sont jamais passées en France. On a des gens qui ont
  expliqué qu'on avait été envahis par des hordes de migrants et d'islamistes, ce
  qui est totalement faux. Entre autres, mais il en fait partie. Vous savez, dans
  ces moments-là, on voit qui aime la France et qui ne l'aime pas. Force est de le
  constater. Tous les gens qui parlent mal de notre pays en ce moment, ce sont des
  gens qui n'aiment pas notre pays. Donc ces gens m'indisposent. Moi, j'aime mon pays.
  Donc on va corriger ce qui s'est passé. Il y a des gens qui font campagne sur le
  dos de la France. Quand je vois des dirigeants qui sont dans des situations de campagne
  dans la région ou de l'autre côté de l'Atlantique, qui, parfois avec crédulité,
  reprennent ce qu'il y a dans l'intelligence artificielle ou qui relaient ce qu'évidemment
  des sphères veulent faire croire de ce qui s'est passé en France, ils font campagne
  sur notre dos. Donc on n'a pas besoin de ça. On a déjà des difficultés. On les gère
  avec méthode, avec respect, mais aussi avec détermination et fermeté. Et on ira
  jusqu'au bout. On veut l'ordre, le respect et faire avancer notre pays. Mais il
  ne faut pas raconter n'importe quoi. Monsieur le Président, justement sur la méthode.
  Est-ce que vous avez hésité avant de maintenir ce déplacement ici au Moyen-Orient ?
  Votre ancien Premier ministre, Édouard Philippe, par exemple, considère que ce n'était
  pas opportun, que ça n'a pas été compris par les Français. Votre prédécesseur, François
  Hollande, dit ce matin qu'il y a une crise d'autorité. Qu'est-ce que vous répondez
  à ceux qui estiment que vous vous êtes dérobé à vos obligations ? Écoutez, il y
  a beaucoup de gens pour commenter, surtout dans ces périodes. Je les laisse commenter,
