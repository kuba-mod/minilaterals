title: Conseil de sécurité.
text: Le chef de l’État a présidé un conseil de sécurité avec le Premier ministre,
  les ministres concernés et l'ensemble des services de renseignement, ce jeudi 22
  octobre 2026, au palais de l’Élysée. Ce conseil a permis de faire un point sur la
  mise en œuvre des dispositifs de renseignement, d’anticipation et de sécurisation
  des prochaines semaines, tout en revenant sur les dysfonctionnements qui ont conduit
  aux événements du week-end passé.
