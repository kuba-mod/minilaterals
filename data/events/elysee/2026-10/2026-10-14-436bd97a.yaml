title: Proposition de nomination de Pierre Coppey, en qualité de contrôleur général
  des lieux de privation de liberté.
text: Le Président de la République envisage, sur proposition du Premier ministre,
  de nommer M. Pierre Coppey, président de l’association « Aurore », en qualité de contrôleur
  général des lieux de privation de liberté. La Présidente de l’Assemblée nationale
  et le Président du Sénat sont saisis de ce projet de nomination, afin que la commission
  intéressée de chacune des assemblées se prononce dans les conditions prévues par
  le cinquième alinéa de l’article 13 de la Constitution.
