date: '2026-10-26'
type: press_release
source_name: elysee
title: Déplacement à Marseille.
text: Le Président de la République s'est rendu à Marseille ce lundi 26 octobre 2026.
  Le chef de l’État est allé à la mairie de Marseille qui a été touchée par les violences
  du 17 octobre dernier. 26 octobre 2026 - Seul le prononcé fait foi Bonjour à toutes
  et à tous. Écoutez, j'ai tenu à venir à Marseille ce matin pour être aux côtés de
  Monsieur le Maire et de l'ensemble de ses équipes dont la mairie, comme vous le
  savez, a été attaquée et durement touchée le 17 octobre. Aux côtés aussi du préfet
  de région, de la préfète, de l'ensemble des forces de sécurité intérieure qui ont
  tenu et conduit un très bon travail ce samedi dernier. Donc, nous allons continuer.
  Samedi, les manifestations se sont tenues dans tout le pays, et l'ordre aussi a
  été tenu. Les commerces ont été protégés, les bâtiments publics ont été protégés,
  on a encore près de 80 commerces qui ont été impactés, France entière. C'est toujours
  trop, donc on va continuer de s'améliorer. Mais l'organisation et l'anticipation
  ont été là, et avec le Premier ministre, le ministre de l'Intérieur, l'ensemble
  du gouvernement et l'organisation qui a été mise en place pour le 24 octobre, nous
  avons pu tenir et protéger, et c'était la mission première. Ensuite, des manifestations
  ont pu s'organiser, le droit de manifester a été préservé, et c'est une bonne chose,
  mais avec des tracés qui ont été repensés et hors des centres-villes. Je dis tout
  ça avec d'abord ma gratitude à l'égard des forces de sécurité intérieure et du travail
  qui a été fait samedi dernier. Ensuite, il faut maintenant préparer la suite, et
  on reste à la fois humbles et concentrés. On sait que samedi prochain est encore
  un samedi à risque. On sait qu'il y a le 5 novembre une journée de mobilisation
  nationale, qui mobilise tous les syndicats, et il y a encore les autres samedis.
  Pour autant, il n'est pas écrit qu'il y ait une chronique de chaque samedi qui doivent
  reprendre. Donc, qu'est-ce que nous allons faire ? Continuer d'être organisés, d'être
  présents, de protéger les biens, les personnes, nos centres-villes, nos commerces,
  nos bâtiments publics. Ça, c'est la règle absolue, et c'est la mobilisation de tous.
  La deuxième chose, on continuera d'avoir des tracés de mobilisation déclarée, donc
  les tracés qui sont demandés par les syndicats représentatifs, qui se feront en
  dehors des centres-villes pour que les manifestations se fassent dans le calme et
  sans mettre nos commerces à risque. Troisièmement, on va continuer d'accompagner
  nos commerçants, nos artisans, toutes les forces économiques qui ont été touchées.
  On va les retrouver dans un instant à la préfecture. Ici, un fonds a été mis en
  place par l'État, abondé par les collectivités territoriales, par le privé aussi,
  et on va continuer, en allant chercher évidemment les assureurs, en mettant ce fonds
  en place, en accompagnant, et on va évidemment accompagner aussi les collectivités
  les plus touchées, je pense à la mairie de Marseille. Une dernière chose, évidemment,
  j'ai demandé au gouvernement aussi de répondre aux demandes légitimes qui sont à
  la racine de ce mouvement social. Le Premier ministre va recevoir les représentants
  du monde lycéen, et le CNVL, cet après-midi, avec des annonces fortes et des avancées
  pour justement, à la fois aujourd'hui, changer les choses et pouvoir aussi enclencher
  des chantiers à très court terme. Nous allons faire de même avec les forces syndicales
  et patronales. Tout ça doit rentrer progressivement dans l'ordre et dans le respect.
  Monsieur le Président, Monsieur le Maire avait critiqué un manque d'effectifs et
  le maintien de l'ordre lors du 17 octobre. Est-ce que vous êtes revenu ensemble
  sur ce qui n'a pas marché ce jour-là et sur les failles de renseignement et de maintien
  de l'ordre ? Oui, Monsieur le Maire va le dire, mais je peux vous dire, moi, les
  choses, c'est tout à fait vrai qu'à Marseille, comme ailleurs, il n'y avait pas
  assez de forces le 17 octobre, on le sait très bien, parce qu'on n'avait pas du
  tout anticipé ce qui s'est passé. C'est-à-dire que le 17 octobre n'avait pas été
  anticipé le fait qu'on aurait autant de forces d'ultra-gauche qui se mobiliseraient
  dès très tôt le matin, de manière très atypique, c'est-à-dire pas en opportunisme
  à la fin des cortèges, mais très tôt le matin, ce qui s'est d'ailleurs passé ici.
  On n'avait pas anticipé qu'on aurait, au-delà de cette mobilisation de l'ultra-gauche,
  aussi de la délinquance qui viendrait dessus. Et donc, les forces de police n'étaient
  pas dûment proportionnées, donc, c'est tout à fait vrai, ce n'est pas ce qui s'est
  repassé le 24. Monsieur le Président, vous avez contesté le chiffre de 30 000. Vous
  dites, monsieur le Président, que l'ordre a été tenu. Vous avez évoqué le retour
  de l'ordre républicain. Pourquoi, dans ce cas, poursuivre les couvre-feux, comme
  l'annonçait votre ministre de l'Intérieur ce matin sur BFMTV ? Parce que l'ordre
  a été tenu, parce qu'on a pris toutes les dispositions. Je rappelle que beaucoup
  m'ont critiqué le 18 octobre au soir, quand j'ai dit, justement, que nous allions
  prendre, les préfets avec les maires, toutes les dispositions utiles. Le ministre
  de l'Intérieur a confirmé qu'on était encore dans cette période. L'ordre a été tenu
  parce qu'en effet, dans des territoires où on sent encore des tensions, où il y
  a des risques, les préfets, en lien avec les maires, décident des couvre-feux. Ça
  a fonctionné, ça a été respecté. L'ordre a été tenu le 24 octobre, parce qu'on a
  anticipé, parce qu'on a mis beaucoup de forces de sécurité sur le terrain, et je
  remercie le ministre de l'Intérieur et les forces de sécurité. Beaucoup ont été
  rappelés, les congés annulés. Il faut mesurer ce que c'est aussi pour beaucoup de
  familles. Et donc, ça s'est bien tenu, les manifestations ont pu se tenir dans le
  calme, et les casseurs ont été bloqués et interpellés. C'est ça qui perdurera. Comme
  vous le voyez, puisque beaucoup m'ont reproché le 18 octobre, de ne pas avoir annoncé
  l'état d'urgence, on tient la République et l'ordre public aujourd'hui sans l'état
  d'urgence. Ça ne veut pas dire que si les choses devaient se dégrader, c'est un
  interdit ou un tabou. Ça veut dire qu'on est rigoureux, qu'on est ferme, mais qu'on
  est républicain. Monsieur le Président, lors des émeutes qui avaient suivi la mort
  du jeune Nahel, vous aviez évoqué deux choses. Un, l'oisiveté. Deux, le rôle des
  réseaux sociaux. Est-ce que vous reprenez ces deux explications pour justifier,
  ou en tout cas expliquer à tout le monde, le mouvement de violence urbaine auquel
  on assiste en ce moment ? Et puis, question sur les lycéens que le Premier ministre
  recevra cet après-midi, vous avez parlé d'annonces fortes. Je crois que vous avez
  évoqué devant eux une refonte profonde de Parcoursup parce que ça fait partie de
  ce que vous appelez des annonces fortes. Ce que nous vivons aujourd'hui n'est pas
  comparable avec ce que nous avions vécu à l'été 2023. Il y avait un fait déclencheur.
  C'était essentiellement des très jeunes dans les quartiers. Ce que nous vivons aujourd'hui,
  et ça a été parfaitement décrit, c'est d'abord une mobilisation sociale, sociale
  et politique, qui a des racines dans la mobilisation lycéenne, d'une part, et dans
  la vie chère, d'autre part. Et donc ça, ça se traite par la discussion. Il y a une
  réponse politique et sociale. C'est le travail du gouvernement pour les jours à
  venir. Ensuite, il y a des forces d'ultra-gauche qui sont venues s'ajouter massivement
  dans beaucoup de villes, en mobilisant. Là, la réponse ne peut être que sécuritaire,
  et c'est pour ça qu'on doit séparer l'un de l'autre. Et enfin, il y a une délinquance
  pour samedi 17 qui est venue s'ajouter à cela. Est-ce que les réseaux sociaux jouent
  un rôle dans cette affaire ? À coup sûr. Mais les réseaux sociaux abîment nos démocraties,
  parce qu'ils polarisent, parce qu'ils créent une espèce de sidération devant les
  scènes de violence, parce qu'ils sont pour certains des instruments de mobilisation
  du pire. Ils ont été utilisés, en particulier le 17 octobre, pour faire venir des
  jeunes ou des moins jeunes sur les lieux de délinquance, d'attaques, de pillages,
  et parce qu'il y a une forme de déréalisation de la violence qui se passe sur ces
  réseaux sociaux. Il y a aujourd'hui, vous le voyez bien, une grande confusion, une
  forme d'excitation permanente qui est en train de se faire, une fascination pour
  la violence. On doit casser ce cycle. Ce n'est pas ça, vivre ensemble dans une société.
  Ce n'est pas ça, vivre ensemble dans la République, qui est notre commun. C'est
  de préserver nos institutions, c'est de respecter l'autre, c'est de pouvoir exprimer
  des désaccords, c'est de trouver des compromis politiques et sociaux, et c'est de
  se dire, comme je le rappelais il y a huit jours, nous sommes à six mois d'une élection
  présidentielle. C'est le moment du débat, normalement. Ce n'est pas le moment de
  la violence, c'est précisément le moment où on peut exprimer ces accords et ces
  désaccords pour faire émerger des propositions politiques qui permettront de décider
  pour notre avenir. Notre pays, qui est une grande démocratie, mérite un beau et
  grand débat démocratique pour ses élections présidentielles. Il ne faut pas se laisser
  voler par des professionnels du désordre, des casseurs, des pilleurs et les forces
  du chaos. Vous l'avez rappelé, il y a eu un dispositif sécuritaire très important
  le week-end dernier. Combien de temps l'État pourra mobiliser autant de policiers
  et de gendarmes en France ? L'État sera là et l'ordre sera tenu. En même temps que
  l'ordre sera tenu, avec des mesures en semaine et avec des décisions pour les samedis
  ou les journées de mobilisation, il y aura les discussions. Donc si tout le monde
  est sincère et si tout le monde a le même sens de l'intérêt général et de la République,
  normalement, à mesure que les compromis sont trouvés, à six mois d'une présidentielle
  une fois encore, les choses devraient progressivement se calmer. Est-ce que c'est
  de nature pour vous de calmer la colère des lycéens ? Ici, je ne vais pas vous dire
  ce que le Premier ministre va annoncer dans quelques heures. C'est le Premier ministre
  et les ministres. J'ai passé près de trois heures avec les représentants d'associations
  syndicales lycéennes et des conseils académiques de la vie lycéenne. On a eu une
  discussion, à mes yeux, très bonne, très en profondeur. J'ai pu identifier à la
  fois leurs demandes légitimes, les inquiétudes d'une part, mais les demandes de
  changement d'autre part. J'ai pris des engagements vis-à-vis d'eux. J'en ai fait
  part au Premier ministre et aux ministres. Elles ont été travaillées durant les
  deux derniers jours, au-delà du travail qui avait été fait ces dernières semaines,
  et le Premier ministre, avec les ministres, annonceront cet après-midi plusieurs
  décisions concrètes et massives. Justement, les réponses politiques aux revendications
  des lycéens interviennent aujourd'hui, plus d'un mois après le début de leur mouvement.
  Est-ce qu'il n'y a pas un problème de tempo dans la réponse du gouvernement, sachant
  qu'entre-temps, le mouvement a fait tache d'huile et que le risque est d’être débordé ?
  À coup sûr. Mais maintenant, je regarde devant. Donc, on avance. Monsieur le Président,
  vous avez dit que le 17 octobre n'avait pas été assez anticipé au niveau des forces
  de l'ordre, que le dispositif n'était pas à la hauteur. Qui en est le responsable ?
  Écoutez, je viens de le dire, on regarde devant, on avance. Donc, ce qui m'importe,
  c'est que ça se soit bien passé le 24 et que les jours à venir se passent bien.
  Si vous pouvez avoir un goût pour le passé, moi, j'ai plutôt un goût pour l'avenir
  et pour notre pays. Je vous remercie. 26 octobre 2026 - Seul le prononcé fait foi
