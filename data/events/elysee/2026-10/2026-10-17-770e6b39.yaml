title: Commémoration des 65 ans du 17 octobre 1961.
text: Soixante-cinq ans après le 17 octobre 1961, la France se souvient des Algériens
  victimes de la répression sanglante organisée sous l’autorité du préfet de police
  Maurice Papon. Cette mémoire meurtrie appartient à notre histoire commune et la
  République la regarde avec lucidité. Elle se transmet grâce au travail des historiens,
  des enseignants, des associations et des familles, pour que chacun puisse connaître
  ce passé, reconnaître et faire perdurer la mémoire des victimes, et se projeter
  dans un avenir commun plus serein.
