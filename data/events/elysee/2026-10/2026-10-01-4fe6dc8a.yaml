title: Compte rendu du Conseil des ministres du 1 octobre 2026.
text: 'Retrouvez le compte rendu du Conseil des ministres du jeudi 1 octobre 2026.
  Le ministre du travail et des solidarités, le ministre de l’économie, des finances
  et de la souveraineté industrielle, énergétique et numérique, la ministre de la
  santé, des familles, de l’autonomie et des personnes handicapées, et le ministre
  de l’action et des comptes publics ont présenté le projet de loi de financement
  de la sécurité sociale pour 2027 et le projet de loi de finances pour 2027. Le dépôt
  de ces textes sur le bureau de l’Assemblée nationale dans les délais prévus par
  les textes organiques, soit avant le premier mardi d’octobre, permet de préserver
  le temps de discussion parlementaire fixé par la Constitution. Les efforts d’aujourd’hui
  permettent d’éviter d’avoir à faire des sacrifices demain. C’est la philosophie
  de ce budget que le Gouvernement présente devant le Parlement et les Français. La
  situation budgétaire de la France ne permet pas d’attendre. Le budget 2027 s’inscrit
  en effet dans un contexte marqué par d’importants aléas géopolitiques, énergétiques,
  économiques et climatiques. En 2026, la croissance serait de 0,5 %, affectée notamment
  par le conflit au Proche et Moyen Orient, l’épisode sévère de sécheresse estivale
  et un climat persistant d’incertitude qui affecte les comportements des ménages
  et des acteurs économiques. Pour 2027, la croissance est prévue à 1,0 %, et restera
  dépendante de l’évolution de la situation internationale. Alors que la dette publique
  devrait atteindre 119,3 % du PIB en 2026, la charge d’intérêts progresserait de
  79,2 milliards d’euros en 2026 à 91,2 milliards d’euros en 2027. Cette progression
  de plus de 0,3 point de PIB, qui érode de manière croissante nos marges de manœuvre,
  fait plus que jamais de la réduction de notre déficit public un impératif. La cible
  de déficit public est fixée à 5,0 % du PIB en 2027, contre une prévision révisée
  à 5,4 % en 2026. Pour y parvenir, le projet de loi de finances (PLF) et le projet
  de loi de financement de la sécurité sociale (PLFSS) pour 2027 reposent sur 43 milliards
  d’euros de mesures de redressement. En incluant les mesures mises en œuvre antérieurement
  et qui monteront en puissance, l’effort atteindrait 54 milliards d’euros au total.
  En 2027, l’amélioration du solde public de 0,4 point de PIB traduirait un ajustement
  structurel de 0,5 point. L’ajustement structurel primaire serait de 0,8 point et
  l’effort structurel primaire de 1,2 point. Cet effort repose majoritairement sur
  une maîtrise renforcée de nos dépenses. Le poids de la dépense publique rapporté
  au PIB diminuerait ainsi en 2027, pour la première fois depuis 2023. En volume,
  la dépense publique primaire, c''est-à dire hors charge de la dette, sera stable,
  tandis que la dépense hors charge de la dette et hors dépenses de défense, diminuera.
  L’effort en dépenses concernera en particulier l’Etat et ses opérateurs, qui porteront
  un effort équivalent à celui demandé aux administrations de sécurité sociale alors
  même que sa part dans la dépense publique est plus faible. Des réformes ciblées,
  en particulier dans le champ du travail et de la formation professionnelle, permettront
  de financer des priorités clairement identifiées : protéger nos concitoyens et continuer
  à investir dans l’avenir. Les collectivités territoriales participeront de manière
  juste à l’effort national. Alors qu’elles représentent 20 % de la dépense publique
  totale, elles porteront environ 10 % de l’effort en 2027. Leurs recettes progresseront
  mais cette hausse sera contenue à 5 milliards d’euros, soit le niveau de l’inflation.
  Cet effort reposera sur une contribution progressive à l’effort budgétaire (CPEB),
  qui ne concernera toutefois pas les petites communes et les collectivités fragiles
  financièrement. Les communes d’outre-mer sont préservées. En matière fiscale, le
  Gouvernement fait un choix fort : pas de hausse générale des impôts, ce qui reviendrait
  à casser notre croissance. Concrètement, cette stabilité signifie que le barème
  de l’impôt sur le revenu sera revalorisé et la surtaxe d’impôt sur les sociétés
  pour les grandes entreprises, réduite d’un tiers. Cela s’accompagne d’une lutte
  renforcée contre les rentes, d’un effort de mise en cohérence des assiettes sociales
  et fiscales, notamment à travers une évolution des allègements généraux de cotisations
  sociales. Cela va de pair avec une ambition réaffirmée en matière de lutte contre
  les fraudes, dans le sillage de la loi du 25 juin 2026. Sur le champ du PLFSS, les
  dépenses continueront d’augmenter de 13 milliards d’euros, soit bien au-delà de
  l’inflation sous l’effet, en particulier, du vieillissement de la population. L’effort
  proposé par le Gouvernement, qui intègre l’effet des réformes structurelles mises
  en œuvre dès cette année, vise à ramener le déficit de la sécurité sociale à 12,7
  milliards d’euros en 2027. La progression de l’Ondam sera contenue à + 2,0 %. Elle
  tiendra notamment compte de la montée en charge des mesures de partage de la dépense
  et de régulation mises en œuvre en cours d’année 2026, de la poursuite des actions
  d’efficience engagées avec les professionnels de santé et les établissements de
  santé. Elle intègrera également des mesures sur les arrêts maladie. L’accès aux
  soins sera amélioré, et l’hôpital préservé avec une hausse de 3 % de l’enveloppe
  pour les établissements de santé et la poursuite du déploiement du réseau France
  Santé et le virage préventif sera accéléré. En matière de famille et d’autonomie,
  les allocations seront mieux ciblées. En parallèle, l’investissement dans les solutions
  de garde sera conforté, avec la montée en puissance d’un plan de soutien aux crèches,
  et un nouveau prêt à taux zéro sera proposé aux parents de jeunes enfants. Enfin,
  la progression des dépenses de retraite et des autres prestations sera également
  freinée, sans diminuer aucune pension et en garantissant la revalorisation intégrale
  des petites retraites, jusqu’à 1 260 € par mois. Le plafonnement de l’abattement
  fiscal de 10 %, applicable aux pensions des foyers imposables contribuera également
  à cet effort. Les dispositions du budget déposé par le Gouvernement au Parlement
  s’inscrivent dans une logique de réversibilité assumée, permettant de faire évoluer
  les orientations retenues par voie réglementaire lors du début de la prochaine mandature
  le cas échéant. Le garde des sceaux, ministre de la justice, a présenté un décret
  portant dispositions applicables aux personnes mineures pour la généralisation du
  travail d’intérêt général (TIG) dans les entreprises de l’économie sociale et solidaire
  (ESS). Le présent projet de décret est élaboré en application de l’article 24 de
  la loi n° 2023-1059 du 20 novembre 2023 d''orientation et de programmation du ministère
  de la justice 2023 2027 (LOPJ). Ce texte généralise, sur l’ensemble du territoire
  national, la possibilité pour les entreprises de droit privé relevant du secteur
  de l’ESS d’accueillir des personnes placées sous main de justice faisant l’objet
  d’une peine de travail d’intérêt général (TIG). Ces dispositions, modifiant l’article
  131-8 du code pénal, font suite aux résultats favorables, issu d’un rapport d’évaluation
  de l’expérimentation législative remis au Parlement en juillet 2022, d’une expérimentation
  initiée par l’article 71 de la loi n° 2019-222 du 23 mars 2019 et conduite entre
  décembre 2019 et décembre 2022. Elle vise à étendre le champ des entreprises susceptibles
  d’accueillir des personnes condamnées à effectuer un TIG, comme cela était déjà
  le cas pour les personnes morales de droit privé chargées d’une mission de service
  public, tout en restreignant ce champ à des structures qui ne définissent pas exclusivement
  par un but lucratif. Dans ce sillage, un premier texte réglementaire, le décret
  n° 2024-1226 du 30 décembre 2024 relatif à la généralisation du travail d''intérêt
  général dans les entreprises de l''ESS et à la prolongation de son expérimentation
  dans les sociétés à mission, est venu formaliser, pour les majeurs, le dispositif
  juridique de l’accueil de TIG au sein des structures de l’ESS, en précisant les
  conditions dans lesquelles les services déconcentrés de l’Etat doivent procéder
  aux démarches d’habilitation, d’inscription de postes et d’affectations des condamnés
  pour cette nouvelle catégorie d’organismes d’accueil. S’agissant des mineurs, l''article
  R.* 122-1 du code de la justice pénale des mineurs, qui a été créé par le décret
  n° 2021 1743 du 22 décembre 2021, commande que soit pris un texte distinct pour
  l’application au public mineur du dispositif d’habilitation des structures relevant
  du champ de l’ESS. Le présent projet de décret répond à cette exigence et confie
  par principe aux directeurs territoriaux de la Protection judiciaire de la jeunesse
  (PJJ) l’habilitation des structures de l’ESS souhaitant accueillir des personnes
  mineures condamnées à effectuer un TIG. A l’instar de ce qui est prévu pour les
  majeurs, il prévoit par dérogation un mécanisme d’habilitation nationale des structures
  d’accueil. Ce dispositif permettra de prévoir, pour les partenaires d’envergure
  du ministère de la justice, la possibilité de délivrer, par arrêté du garde des
  sceaux, ministre de la justice, une habilitation nationale unique pour l’accueil
  de mineurs devant réaliser un TIG, couvrant l’ensemble des organismes locaux relevant
  d’un acteur national. Le conseil des ministres a adopté les mesures individuelles
  suivantes : Sur proposition de la ministre des armées et des anciens combattants
  : Ont été adoptées diverses mesures d’ordre individuel concernant des officiers
  généraux de l’armée de terre, de l’armée de l’air et de l’espace et du contrôle
  général des armées. Sur proposition de la ministre de la culture : Le ministre du
  travail et des solidarités, le ministre de l’économie, des finances et de la souveraineté
  industrielle, énergétique et numérique, la ministre de la santé, des familles, de
  l’autonomie et des personnes handicapées, et le ministre de l’action et des comptes
