title: Visite d'État de Frank-Walter Steinmeier, Président de la République fédérale
  d'Allemagne.
text: Le Président de la République a accueilli Frank-Walter Steinmeier, Président
  de la République fédérale d’Allemagne, et son épouse, Elke Büdenbender , à l’occasion
  d’une visite d’État en France les 8 et 9 octobre 2026. Après une cérémonie d'accueil
  officielle à l'Arc de Triomphe, les deux chefs d'État se sont entretenus afin d'échanger
  sur les principaux enjeux de la relation franco-allemande et sur les grands dossiers
  européens et internationaux. Dans le prolongement du 26ᵉ Conseil des ministres franco-allemand,
  qui s’est tenu les 16 et 17 juillet 2026 à Brühl, cette visite témoigne de notre
  détermination à poursuivre nos engagements stratégiques communs au service de la
  sécurité de l’Europe et des Européens. Elle souligne également le rôle essentiel
  des liens entre nos sociétés pour soutenir notre ambition européenne commune .
