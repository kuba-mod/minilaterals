title: Compte rendu du Conseil des ministres du 28 octobre 2026.
text: 'Retrouvez le compte rendu du Conseil des ministres du mercredi 28 octobre 2026 :
  Le conseil des ministres a adopté les mesures individuelles suivantes : - M. le
  général de division Patrick HENRY est nommé commandant de la région de gendarmerie
  des Hauts-de-France, commandant la gendarmerie pour la zone de défense et de sécurité
  Nord, et est élevé aux rang et appellation de général de corps d''armée, à compter
  du 16 novembre 2026 ; - M. le général de division Charles BOURILLON , est nommé
  chef adjoint de l''inspection générale de la gendarmerie nationale, et est élevé
  aux rang et appellation de général de corps d''armée, à compter du 1er décembre
  2026 ; - M. le général de division Jean-Christophe SINTIVE , est nommé commandant
  de la gendarmerie d''outre-mer, et est élevé aux rang et appellation de général
  de corps d''armée, à compter du 1er décembre 2026. Sur proposition du ministre de
  l’Europe et des affaires étrangères : - M. François PENGUILLY , administrateur de
  l’Etat, est nommé directeur des Français à l’étranger et de l’administration consulaire
  à l’administration centrale du ministère de l’Europe et des affaires étrangères.
  Sur proposition de la ministre de la culture : - M. Stéphane RICHARD est nommé président
  du conseil d’administration du Théâtre national de l’Opéra-Comique ; - M. Olivier
  MANTÉI est nommé directeur général de l’Établissement public de la Cité de la musique
  – Philharmonie de Paris, à compter du 1er novembre 2026 ; - M. Louis LANGRÉE est
  nommé directeur du Théâtre national de l’Opéra-Comique, à compter du 1er novembre
  2026.'
