title: La Grande exposition du Fabriqué en France revient en 2026 !
text: Forte du succès de ses précédentes éditions, la Grande Exposition du Fabriqué
  en France revient pour sa sixième édition, au Palais de l’Elysée, les  21 et 22 novembre
  prochains. Initié par le président de la République en 2020, et ouvert au public,
  cet événement met à l’honneur les entreprises, les artisans, les producteurs, les
  industriels et les associations engagés dans une démarche de fabrication française
  . Un siège conducteur de l'Alpine A390 GT, un stylo artisanal en fragment de fusée
  Ariane 5, une caméra sous-marine Orphie… Ce sont quelques-uns des 104 produits fabriqués
  en France que vous découvrirez lors de votre visite à la Grande Exposition du Fabriqué
  en France. De toutes tailles et issus de tous les secteurs de l'économie française,
  ils illustrent la grande richesse des savoir-faire français venus de tous les départements
  et territoires de métropole et d’Outre-mer . Tout au long du parcours, vous croiserez
  également le chemin de démonstrations de métiers, de maquettes de produits innovants,
  les dernières réalisations des manufactures nationales ainsi qu’un espace conférences
  . Vous pourrez poursuivre votre visite en vous rendant à La Maison Élysée et retrouver
  l’incontournable Boutique officielle . Les inscritions ouvriront dans les prochains
  jours et seront annoncées au préalable sur les réseaux sociaux de la Présidence
  de la République ainsi que sur le site internet. Pour cette sixième édition, les
  dossiers déposés témoignent de l’excellence qu’incarne la production française dans
  toute sa diversité , du produit alimentaire à l’objet d’art, des savoir-faire centenaires
  à l’innovation de rupture. Un jury national composé d’acteurs institutionnels, économiques
  et de la vie publique française, experts dans leur domaine, s'est réuni le 22 septembre
  2026 pour désigner les 104 lauréats de cette sixième éditions.  Ensemble, ils ont
  départagé les produits issus de la pré-sélection régionale. • Eric BAUDRY , directeur
  des affaires publiques, In Tuis • Bastien BONNEFOY , directeur de site, Les Petites
  Maries • Jean-François CHANUT , vice-président et directeur général de la division
  Propeller Systems, Collins Aerospace • Anne GUEZOU , responsable marketing et communication,
  Groupe Lambert • Sophie GLEMET , manager des affaires gouvernementales et industrielles,
  Toyota France • Quentin GODINOT , directeur général, Emerwall • Yacine KABECHE ,
  fondateur et CEO, Circul’Egg • Marion LEBLON , directrice générale, Ecotrain • Hervé
  DE MALLIARD , président, MGA Technologie • Jean-Baptiste O’NEIL , président, Le
  Soulor • Guillaume RODELET , directeur général, Fédération Nationale Familles Rurales
  • Marie-Amandine STEVENIN , présidente, Que Choisir Ensemble • Olivier URRUTIA ,
  délégué général, Fédération du Commerce Coopératif et Associé • Sébastien GILABERT
  , fondateur et CEO, Missia Care • Charles YVON , président et directeur général,
  Les parapluie de Cherbourg
