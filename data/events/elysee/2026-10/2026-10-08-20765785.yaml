  ans, si nous sommes ce pays qui a réussi, de la décarbonation à l''IA, au spatial,
  au quantique, à nos domaines les plus traditionnels, à recréer ou à créer et inventer,
  c''est parce que vous êtes là, c''est parce que nous sommes là. C''est parce que
  depuis 10 ans, on a fait des choix audacieux, on a cru en nous et surtout parce
  que depuis 10 ans, on a assumé d''être ce que nous sommes, nous Français. Et ça,
  ne l''oubliez jamais. Je l''ai dit, il y a 10 ans et je l''ai répété plusieurs fois.
  On a voulu nous faire croire que le mot d''entrepreneur était un mot d''Anglo-Saxon.
  C''est un mot français que nous ont pris les Anglo-Saxons. Et ce que vous avez imposé
  dans le paysage du pays en 10 ans, c''est le goût du risque et c''est le goût de
  l''avenir. Une entrepreneuse ou un entrepreneur, qu''il soit dans la deep tech,
  qu''il soit dans le textile, dans le ciment, dans le nucléaire, qu''il habite Laval,
  Montpellier, Paris ou qu''il serve la France depuis l''autre bout du monde, il y
  a une chose qu''il ou qu''elle a en lui : la prise de risque, la prise de risque.
  C''est qu''à un moment donné, vous avez fait un choix qui est de croire dans une
  idée et que cette idée devienne une réalité. Et qu''elle allait devenir votre vie
  et qu''avec vous, elle allait entraîner la vie des autres et qu''elle allait devenir
  une petite entreprise, puis une plus grande et peut-être un champion. Et qu''avec
  ça, vous avez eu le goût de l''avenir. C''est ça investir. Ce n''est pas un gros
  mot investir. C''est de dire : « je crois plus dans demain que dans aujourd''hui,
  je vais mettre mon argent, je vais convaincre des gens de mettre leur argent dans
  mon idée, ou dans nous 3, nous 4, nous 10, parce que je crois plus dans demain que
  dans aujourd''hui. » Ce goût du risque et ce goût de l''avenir, c''est le plus beau
  des trésors et c''est ce qui fait qu''un pays avance ou qu''il recule. Au moment
  où des élites politiques, économiques, où des grands groupes, des start-up, des
  ETI se mettent à se dire : « demain est terrible et je n''y crois plus », elles
  ont déjà perdu. Au moment où vous commencez à avoir cette idée en vous où vous cédez
  au défaitisme, en fait, vous avez déjà perdu parce que les gens se disent : « il
  y a un doute », alors ils arrêtent de mettre leur argent, parce que les gens se
  disent : « il y a un doute », alors ils arrêtent d''acheter vos produits. L''économie,
  c''est de la psychologie. La vie de vos entreprises comme la vie d''une nation,
  c''est une chose. La confiance en nous, le goût du risque et le goût de l''avenir.
  Et donc, je vous demande une chose, c''est de ne pas céder au manichéisme ambiant
  qui est en train de revenir, qui est l''esprit de défaite que notre pays a déjà
  connu plein de fois dans son histoire. C''est l''esprit de 1870, de 1940, de tant
  de fois dans notre histoire économique où les gens disent : « on est foutus, on
  regarde les autres, on est foutus pour telle ou telle raison. » Chaque matin, dans
  vos entreprises, vous avez des raisons de dire : « je suis moins bon que mon compétiteur.
  » À la seconde où vous croyez à cette idée et vous lâchez le reste, vous avez déjà
  perdu face à votre compétiteur. C''est pareil pour notre pays. Oui, on a des faiblesses,
  nos finances publiques, un modèle social qui n''est pas assez financé. Est-ce qu''on
  n''a pas essayé de se battre ces dernières années là-dessus ? Oui. Est-ce qu''on
  a gagné toutes les batailles ? Non. Mais il faut y repartir, il faut convaincre,
  il faut montrer qu''il faut le moderniser, qu''un pays qui vieillit, c''est aussi
  une chance. Et donc, il faut passer des transformations qui permettront de rendre
  ce pays qui vieillit avec un modèle social soutenable. Ça ne veut pas dire pour
  autant qu''il faut rester couché et qu''on est fichu. Il faut se battre, il faut
  repartir avec de l''énergie. Mais je vous le dis, l''esprit de défaite ambiant que
  je vois n''y cédez rien. Rien ! Croyez en vous, croyez en l''avenir. Si vous n''y
  croyez pas, vous avez déjà perdu. Et puis, l''autre chose qu''il ne faut pas laisser,
  c''est l''égalité à laquelle je crois comme vous, l''égalité des possibles, celle
  qui permet de recréer l''égalité des chances qui est nécessaire dans la République
  et qui fait que je veux que chaque jeune de quelque famille, de quelque région que
  ce soit puisse créer son entreprise ou avoir accès au meilleur. Cet esprit français,
  cet amour de l''égalité, de l''égalité des chances et des possibles, n''a rien à
  voir avec la jalousie et la haine de la réussite. Et on voit revenir cette haine
  de la réussite, mais qui est au fond quoi ? La confusion entre la rente et la réussite
  qui accompagne la prise de risque. Vous, ici, vous n''êtes pas des rentiers, vous
  êtes des femmes et des hommes qui avez pris vos risques, qui avez investi et qui,
  pour certains d''entre eux, et j''espère de plus en plus, avez réussi et allez réussir
  encore. Mais cette réussite, c''est le fruit de votre travail, de votre engagement,
  de votre investissement, de celui souvent de la nation à vos côtés. Ce sur quoi
  il faut revenir, c''est l''esprit de se rendre partout où ça dysfonctionne. C''est
  d''essayer de tendre la main aux autres pour que chacun soit dans cette aventure.
  C''est de ne pas laisser certains autres au bord de cette aventure. Mais la réussite
  qui accompagne l''entrepreneuriat, ça n''est pas la rente injustifiée et l''argent
  indûment gagné. On ne doit pas laisser cette idée se réinstaller dans le pays. Et
  donc, au fond, ce que je suis venu vous dire aujourd''hui, c''est : regardez tout
  ce qui a été fait ces dernières années, ces 10 dernières années, depuis que BIG
  existe. C''est une métamorphose de la France, une vraie métamorphose où on a recréé
  de l''emploi industriel, où on a remis de l''emploi, où on a résisté ensemble aux
