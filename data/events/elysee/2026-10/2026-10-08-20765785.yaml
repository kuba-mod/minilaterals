date: '2026-10-08'
type: press_release
source_name: elysee
title: Evénement Bpifrance Inno Génération (BIG).
text: 'Le Président de la République a participé à l’évènement Bpifrance Inno Génération
  (BIG) ce jeudi 8 octobre 2026. Cet événement est l’un des plus grands rassemblements
  européens dédié aux entrepreneurs . Le chef de l''État a salué la diversité et la
  vitalité des entrepreneurs français , des créateurs aux dirigeants de start-up,
  de PME et d''ETI. Il a rappelé l''engagement de l''État à leurs côtés pour l''innovation,
  l''industrie et la croissance , en particulier à travers le plan France 2030 , lancé
  il y a cinq ans pour faire émerger les leaders technologiques et industriels de
  demain, ainsi que l''action de Bpifrance et de la French Tech. 8 octobre 2026 -
  Seul le prononcé fait foi Je suis très heureux d''être parmi vous aujourd''hui et
  fidèle à cet événement. Je crois que si on suit tous la même actualité, il est difficile
  de se dire qu''on vit dans un monde enthousiasmant où les gens sont pleins de confiance
  en eux. Et pourtant, vous êtes là. Ça fait 12 ans que vous êtes là. Et pour ma part,
  c''est la 10ème fois comme Président que je suis là à vos côtés. Alors, je sais
  que le thème de ce BIG c''est le culot. Ce n''est pas aujourd''hui la démonstration
  que je suis venu vous faire. Je suis au fond venu essayer de vous dire comment je
  vois les choses avec vous. Et pour aller droit au but, je suis venu vous passer
  un message très simple : merci et soyez extrêmement fiers de ce que vous êtes et
  de ce que vous faites. Et quand je vous dis merci, c''est parce que quand je regarde
  tout ce qui a été fait depuis 10 ans tous ensemble, rien n''était écrit. En 10 ans,
  on a créé des millions d''emplois, on a recréé de l''emploi industriel. Il y a 10
  ans, on levait péniblement 1 milliard d''euros de fonds par an, on en lève 10 fois
  plus aujourd''hui. En 10 ans, on a complètement transformé le paysage entrepreneurial
  français. En nombre de deep techs créées par an, en nombre d''argent créé par an,
  en transformation de nos entreprises. En 10 ans, vous avez changé le paysage. Et
  ça, c''est irréversible. Et on vit pourtant dans ce monde fait de crises multiples
  qu''on a traversées durant ces 10 années. On a vécu ensemble les crises sociales,
  on a vécu ensemble la pandémie et le Covid, on a vécu ensemble le retour des guerres
  en Europe, la crise énergétique de 2022, celle qu''on vit aujourd''hui. Et malgré
  tout ça, les résultats sont là. En 2025, on a battu l''année record de création
  du nombre d''entreprises dans notre pays. On n''en avait jamais créé autant, 1 160
  000. Et donc tout ça, c''est ce que vous avez su faire, tout ce qu''on a fait durant
  cette décennie. Alors, ça ne s''est pas fait tout seul. Il y a eu les mobilisations
  de la French Tech et des French Tech partout à travers le monde, ce réseau qu''on
  a créé il y a plus de 10 ans, qui s''est développé, qui a constitué cet écosystème.
  C''est tout le travail qui a été fait par BPI, ses financements, ses programmes,
  son développement et les BIG. C''est ce qui a été fait par Business France pour
  emmener tout le monde à l''international. C''est ce qui a ensuite été fait depuis
  5 ans par France 2030, qui a permis justement d''investir dans l''innovation de
  rupture dans tous les secteurs et d''engager ces 50 milliards d''euros qui ont permis
  de transformer les choses. Les évaluations ont été rendues il y a quelques jours,
  elles sont positives pour l''économie française. C''est ce que les équipes des ministères,
  depuis des années, ont su faire à vos côtés pour justement dynamiser notre entrepreneuriat
  et avoir ces résultats. Et en même temps, durant cette décennie, on a su créer plus
  d''entreprises, lever des tickets plus gros, consolider dans la deep tech, par exemple,
  le nombre de créations d''entreprises. On a davantage décarboné le pays. Là où il
  y a 10 ans on nous disait, il faut faire un choix simple, vous voulez décarboner,
  il va falloir fermer de l''industrie. Vous avez montré collectivement qu''au moment
  où on crée des emplois, où on crée des emplois industriels, on pouvait décarboner.
  On a multiplié par 4 par an le taux de réduction de notre CO2. Là où on était à
  1 % il y a 10 ans, on était à 4,5 en 2025. Et ça, parce qu''on a fait le choix de
  la décarbonation dans de nombreux secteurs industriels. On a accompagné nos entrepreneurs
  dans l''acier, dans le ciment pour pouvoir décarboner. Et quand je vous regarde
  aujourd''hui, je ne peux pas ne pas voir qu''on a réussi ces transformations dans
  des secteurs très industriels où on a décarboné et, dans le même temps, on a sécurisé
  des créations de data centers, 10 gigawatts pour 2030. Aucun autre pays européen
  n''est à notre rythme. Et ça, on l''a appuyé sur une force historique, mais qu''on
  a démultipliée. Il y a 10 ans, on nous expliquait, il va falloir sortir du nucléaire.
  Je me rappelle, je venais d''être élu. On nous disait, le nucléaire, il va falloir
  réduire, technologie du passé. On ne créait plus un emploi dans le secteur. On visait
  50 % à horizon 2035. On a commencé à pivoter ça un an plus tard. On a réinvesti
  dans la filière. En 2022, à Belfort, on a dit nouvelle stratégie. Au moment où on
  se parle, on a 75 % de notre électricité sécurisée dans le nucléaire et le plus
  grand programme de création d''énergie nucléaire depuis des décennies dans notre
  pays aujourd''hui. Mais en faisant ça et en relançant cette filière du nucléaire,
  les métiers qui vont avec, avec les technologies les plus disruptives, on sécurise
  nos capacités à produire de l''électricité pilotable décarbonée et donc à attirer
  des data centers. Et au moment où, aux États-Unis d''Amérique, vous avez des révoltes
  parce que les gens doivent choisir entre la facture de l''énergie pour les ménages
  ou pour leurs entreprises, ou se dire, on pourra brancher notre data center dans
  5 ans, dans 10 ans, nous, on a plus de 90 TWh ces deux dernières années disponibles
  grâce à notre nucléaire. Et donc c''est l''électricité et la production du modèle
  français qui permet d''être dans la compétition de demain. Et donc oui, on est dans
  la compétition des data centers, à la tête du peloton européen avec nos 10 gigawatts
  sécurisés d''ici 2030. Oui, on est dans la compétition des modèles frontières d''IA.
  Mistral vient de sortir son nouveau modèle, son dernier. Ils sont dans la compétition.
  J''entendais beaucoup de gens qui doutaient encore ces derniers mois. Ils sont là.
  Quels autres pays dans le monde sont dans la compétition des modèles frontières ?
  États-Unis, Chine, et entre les deux, les Canadiens et nous, c''est tout. Soyez
  fiers de ça, c''est le fruit de notre recherche, de jeunes étudiants qui ont créé
  leur entreprise ces dernières années, qui l''ont développée, qui ont investi, qui
  ont levé de l''argent et qui le font depuis la France. Et au moment où vous avez
  Mistral AI, vous avez aussi AMI Labs, avec un Yann LeCun qui a réussi à l''autre
  bout du monde, qui a été reconnu par ses pairs et qui dit : « Moi, je vais réinvestir
  sur un modèle concurrent, les World Models, et je vais le faire en France. Je vais
  revenir le faire entre la France et les États-Unis parce que je crois dans mon pays.
  » Et il ne l''a pas fait il y a 5 ans, il y a 6 ans, il l''a fait là, il y a 18
  mois, dans notre France, dans la même France que celle qu''on voit tous les jours
  quand on allume le poste de télé, où on a plein de gens qui nous expliquent qu''elle
  serait foutue. Ça n''est pas vrai parce que vous êtes là, parce que tout ce que
  je décris, c''est cette France d''aujourd''hui. C''est celle aussi des The Exploration
  Company, des Maiaspace, des Loft Orbital, etc., de toute cette famille justement
  du NewSpace qui a su créer des entreprises qui, aux côtés des géants, sont en train
  de transformer les choses. Et regardez notre pays tel qu''il est. On a un modèle
  énergétique qui est fort, le plus décarboné d''Europe, le plus à notre main, le
  plus souverain. On a recréé plus de 2,5 millions d''emplois ces 10 dernières années.
  On a créé un nombre record d''entreprises, comme je le disais. On a notre CAC 40
  que beaucoup décrient, mais qui est une énorme force. Il n''y a pas un pays en Europe
  qui a autant de grandes boîtes. En 10 ans, on est passé de 5 000 à 7 300 ETI, ce
  qui était un peu notre faiblesse, le Mittelstand à l''allemande. On a commencé à
  rattraper. On est le pays d''Europe qui crée le plus de start-up, qui a les plus
  gros tickets pour le scale-up et qui avance. Et dans l''IA, on est là avec le modèle
  frontière, on crée des data centers. Dans le quantique, on est les seuls à avoir
  des champions mondiaux dans toutes les catégories d''innovation du quantique. Dans
  le NewSpace, on est là dans la compétition avec des entreprises qui ont levé des
  centaines de millions d''euros aux côtés de nos groupes du spatial européen qui
  sont des champions historiques. Regardons-nous tels que nous sommes. Nous avons
  pris le virage de la décarbonation de notre économie et dans nos secteurs traditionnels
  parce qu''on a investi avec France 2030, on est en train de pivoter. Regardez-nous
  tels que nous sommes. Il y a 10 ans, on avait une crise terrible de la voiture.
  Non pas qu''on en soit totalement sortis, mais il y a 10 ans, quand je demandais,
  et dans quelques jours on recevra le Mondial de l''Automobile, juste avant le salon,
  je réunissais tous les constructeurs, ils me disaient, « malheureux, n''allez pas
  faire plus de véhicules électriques, il est impossible en Europe de produire des
  batteries électriques. On dépend complètement des Chinois et des Coréens du Sud ».
  C''était vrai. Au moment où je vous parle, on a 4 Gigafactories en France qui tournent
  à plein. 4 ! On produit des centaines de milliers de véhicules électriques en France.
  La R4, la R5, elle est produite en France avec des batteries faites en France. C''est
  ce qu''on a fait ces 10 dernières années. Ce ne sont pas des mots, c’est des réalisations.
  Et tout ça, on l''a fait avec quoi ? Avec vous, avec votre énergie, avec votre envie
  de faire. Tout ce que je viens de décrire, ce n''est pas des promesses. Vous savez,
  je ne suis plus au temps des promesses. J''ai vécu cette époque avec vous. Tout
  ça, c''est ce que nous avons fait tous ensemble. Alors oui, vous avez le droit d''avoir
  beaucoup de culot et d''avoir beaucoup d''audace. Ne vous laissez pas prendre ça.
  On l''a fait grâce à quoi ? Certes, des programmes que j''ai cités depuis tout à
  l''heure, des choix fiscaux clairs dès le début, la flat tax qu''on a faite sur
  les impôts de production, ce qu''on a fait pour baisser l''impôt sur les sociétés,
  les ordonnances travail, la modernisation de beaucoup de secteurs, l''invention
  d''un apprentissage à la française où on est passé de 250 000 apprentis par an à
  1 million, la simplification du régime des entrepreneurs, des simplifications dans
  beaucoup de domaines, l''accélération des choses. Alors, à côté, oui, de beaucoup
  de choses qui vont mal, d''un monde déréglé, de lourdeurs qui existent encore, tout
  ça, on l''a fait. Et si nous sommes le pays le plus attractif d''Europe depuis 7
  ans, si nous sommes ce pays qui a réussi, de la décarbonation à l''IA, au spatial,
  au quantique, à nos domaines les plus traditionnels, à recréer ou à créer et inventer,
  c''est parce que vous êtes là, c''est parce que nous sommes là. C''est parce que
  depuis 10 ans, on a fait des choix audacieux, on a cru en nous et surtout parce
  que depuis 10 ans, on a assumé d''être ce que nous sommes, nous Français. Et ça,
  ne l''oubliez jamais. Je l''ai dit, il y a 10 ans et je l''ai répété plusieurs fois.
  On a voulu nous faire croire que le mot d''entrepreneur était un mot d''Anglo-Saxon.
  C''est un mot français que nous ont pris les Anglo-Saxons. Et ce que vous avez imposé
  dans le paysage du pays en 10 ans, c''est le goût du risque et c''est le goût de
  l''avenir. Une entrepreneuse ou un entrepreneur, qu''il soit dans la deep tech,
  qu''il soit dans le textile, dans le ciment, dans le nucléaire, qu''il habite Laval,
  Montpellier, Paris ou qu''il serve la France depuis l''autre bout du monde, il y
  a une chose qu''il ou qu''elle a en lui : la prise de risque, la prise de risque.
  C''est qu''à un moment donné, vous avez fait un choix qui est de croire dans une
  idée et que cette idée devienne une réalité. Et qu''elle allait devenir votre vie
  et qu''avec vous, elle allait entraîner la vie des autres et qu''elle allait devenir
  une petite entreprise, puis une plus grande et peut-être un champion. Et qu''avec
  ça, vous avez eu le goût de l''avenir. C''est ça investir. Ce n''est pas un gros
  mot investir. C''est de dire : « je crois plus dans demain que dans aujourd''hui,
  je vais mettre mon argent, je vais convaincre des gens de mettre leur argent dans
  mon idée, ou dans nous 3, nous 4, nous 10, parce que je crois plus dans demain que
  dans aujourd''hui. » Ce goût du risque et ce goût de l''avenir, c''est le plus beau
  des trésors et c''est ce qui fait qu''un pays avance ou qu''il recule. Au moment
  où des élites politiques, économiques, où des grands groupes, des start-up, des
  ETI se mettent à se dire : « demain est terrible et je n''y crois plus », elles
  ont déjà perdu. Au moment où vous commencez à avoir cette idée en vous où vous cédez
  au défaitisme, en fait, vous avez déjà perdu parce que les gens se disent : « il
  y a un doute », alors ils arrêtent de mettre leur argent, parce que les gens se
  disent : « il y a un doute », alors ils arrêtent d''acheter vos produits. L''économie,
  c''est de la psychologie. La vie de vos entreprises comme la vie d''une nation,
  c''est une chose. La confiance en nous, le goût du risque et le goût de l''avenir.
  Et donc, je vous demande une chose, c''est de ne pas céder au manichéisme ambiant
  qui est en train de revenir, qui est l''esprit de défaite que notre pays a déjà
  connu plein de fois dans son histoire. C''est l''esprit de 1870, de 1940, de tant
  de fois dans notre histoire économique où les gens disent : « on est foutus, on
  regarde les autres, on est foutus pour telle ou telle raison. » Chaque matin, dans
  vos entreprises, vous avez des raisons de dire : « je suis moins bon que mon compétiteur.
  » À la seconde où vous croyez à cette idée et vous lâchez le reste, vous avez déjà
  perdu face à votre compétiteur. C''est pareil pour notre pays. Oui, on a des faiblesses,
  nos finances publiques, un modèle social qui n''est pas assez financé. Est-ce qu''on
  n''a pas essayé de se battre ces dernières années là-dessus ? Oui. Est-ce qu''on
  a gagné toutes les batailles ? Non. Mais il faut y repartir, il faut convaincre,
  il faut montrer qu''il faut le moderniser, qu''un pays qui vieillit, c''est aussi
  une chance. Et donc, il faut passer des transformations qui permettront de rendre
  ce pays qui vieillit avec un modèle social soutenable. Ça ne veut pas dire pour
  autant qu''il faut rester couché et qu''on est fichu. Il faut se battre, il faut
  repartir avec de l''énergie. Mais je vous le dis, l''esprit de défaite ambiant que
  je vois n''y cédez rien. Rien ! Croyez en vous, croyez en l''avenir. Si vous n''y
  croyez pas, vous avez déjà perdu. Et puis, l''autre chose qu''il ne faut pas laisser,
  c''est l''égalité à laquelle je crois comme vous, l''égalité des possibles, celle
  qui permet de recréer l''égalité des chances qui est nécessaire dans la République
  et qui fait que je veux que chaque jeune de quelque famille, de quelque région que
  ce soit puisse créer son entreprise ou avoir accès au meilleur. Cet esprit français,
  cet amour de l''égalité, de l''égalité des chances et des possibles, n''a rien à
  voir avec la jalousie et la haine de la réussite. Et on voit revenir cette haine
  de la réussite, mais qui est au fond quoi ? La confusion entre la rente et la réussite
  qui accompagne la prise de risque. Vous, ici, vous n''êtes pas des rentiers, vous
  êtes des femmes et des hommes qui avez pris vos risques, qui avez investi et qui,
  pour certains d''entre eux, et j''espère de plus en plus, avez réussi et allez réussir
  encore. Mais cette réussite, c''est le fruit de votre travail, de votre engagement,
  de votre investissement, de celui souvent de la nation à vos côtés. Ce sur quoi
  il faut revenir, c''est l''esprit de se rendre partout où ça dysfonctionne. C''est
  d''essayer de tendre la main aux autres pour que chacun soit dans cette aventure.
  C''est de ne pas laisser certains autres au bord de cette aventure. Mais la réussite
  qui accompagne l''entrepreneuriat, ça n''est pas la rente injustifiée et l''argent
  indûment gagné. On ne doit pas laisser cette idée se réinstaller dans le pays. Et
  donc, au fond, ce que je suis venu vous dire aujourd''hui, c''est : regardez tout
  ce qui a été fait ces dernières années, ces 10 dernières années, depuis que BIG
  existe. C''est une métamorphose de la France, une vraie métamorphose où on a recréé
  de l''emploi industriel, où on a remis de l''emploi, où on a résisté ensemble aux
  crises, où on a pris le tournant de la deep tech, de la transformation de notre
  industrie, des transformations technologiques, de l''IA, du quantique, de la décarbonation
  et on l''a fait malgré les crises, malgré les chocs. Et de ça, vous devez être fiers.
  Et personne ne peut ni ne doit nous le prendre, vous le prendre. Et donc, soyez
  infiniment fiers de tout ce qui a été fait ces dernières années, mais surtout croyez
  en vous. Parce que si nous en sommes là aujourd''hui, c''est qu''il y a des femmes
  et des hommes dans leurs entreprises ou avec leurs idées qui ont cru en eux à un
  moment donné. Vous, quand vous l''avez lancée, vous, quand vous l''avez reprise,
  vous, quand vous étiez face à telle ou telle crise pour la relancer. Voilà ce que
  je suis venu vous dire aujourd''hui. Ne cédez rien à l''esprit de défaite, ne cédez
  rien à l''esprit de jalousie. Continuez d''être des femmes et des hommes qui croient
  en vous, en vos collaboratrices, en vos collaborateurs et en notre nation. Parce
  que ce qu''elle a fait ces dernières années, ce qu''elle a su faire ces derniers
  siècles est extraordinaire. Nous sommes une grande nation d''esprit de conquête,
  d''esprit d''entreprise et de créativité. Et donc, continuez de l''avoir chevillé
  au corps. Et oui, on va avoir devant nous beaucoup de défis dans les mois, les années
  qui viennent. Il faut les aborder avec humilité, mais il faut les aborder aussi
  en ayant à l''esprit ce que nous sommes, ce que je viens de décrire, ce que vous
  êtes. Soyez fiers de ce goût du risque, soyez fiers de ce goût de l''avenir et de
  l''investissement, soyez fiers de ce que vous êtes, de ce que nous sommes. Vive
  BIG, vive la République et vive la France ! Merci beaucoup. J''étais très fier et
  très heureux d''être parmi vous. Vous allez continuer, Tony va prendre la parole
  à l''instant. C''était la dernière fois pour moi que je pouvais m''exprimer devant
  vous et donc j''espère vous avoir donné toute mon énergie et tout mon cœur et je
  veux ici vraiment dire un immense merci à mon ami Nicolas Dufourcq qui, avec beaucoup
  d''énergie durant toutes ces années, a mené cette aventure et à lui et à toutes
  ses équipes, je veux dire un immense merci. Parce qu''il incarne magnifiquement
  ce goût du risque et cet esprit d''entrepreneur mis au service de la chose publique.
  Merci à Nicolas et à toutes les équipes de BIG et de Business et de Bpifrance et
  de France 2030 et de Bercy et de la French Tech et à vous toutes et tous. 8 octobre
