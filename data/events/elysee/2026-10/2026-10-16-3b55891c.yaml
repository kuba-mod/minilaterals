title: Déclaration de presse conjointe franco-allemande sur l’avenir de l’industrie
  automobile européenne.
text: 'La France et l’Allemagne sont parvenues à un accord sur une approche commune
  visant à assurer l’avenir de l’industrie automobile européenne. Notre ambition commune
  est claire : réussir la transformation de notre industrie automobile, tout en maintenant
  notre ambition climatique et en veillant à ce que les voitures de demain soient
  produites en Europe. Notre cap reste inchangé : réduire significativement les émissions
  de CO₂ tout en renforçant la capacité de l’Europe à développer et à produire la
  prochaine génération de véhicules électriques. C’est cela, la préférence européenne
  dans la pratique : veiller à ce que la transition vers une mobilité propre aille
  de pair avec l’investissement, l’innovation et la production en France, en Allemagne
  et dans toute l’Europe. À cette fin, la France et l’Allemagne proposent un ensemble
  global de mesures qui associe une trajectoire européenne ambitieuse de décarbonation
  à la flexibilité réglementaire nécessaire pour tenir compte des différentes réalités
  du marché et des conditions technologiques. Cet ensemble prévoit également des incitations
  concrètes en faveur de l’investissement, de la recherche et du développement, de
  la production en Europe et de chaînes d’approvisionnement résilientes. Cette approche
  équilibrée permettra à l’Union européenne de poursuivre ses objectifs climatiques
  tout en renforçant la souveraineté technologique, la base industrielle et la compétitivité
  internationale de son industrie automobile. L’Europe doit être un continent qui
  innove, investit et produit, tout en protégeant le climat et en préservant les emplois.
  C’est le sens de notre engagement et le principe directeur de notre approche commune.
  La France et l’Allemagne sont déterminées à s’appuyer sur cette dynamique et à œuvrer
  rapidement avec leurs partenaires européens en vue de parvenir à un accord. Nous
  avons une responsabilité envers nos travailleurs, nos industries et nos citoyens :
  faire en sorte que l’Europe demeure un acteur de premier plan de la transformation
  mondiale de l’industrie automobile. Notre objectif est clair : une industrie automobile
  européenne compétitive, innovante et décarbonée, qui produit en Europe et crée les
  emplois de demain.'
