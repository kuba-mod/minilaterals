title: Compte rendu du Conseil des ministres du 22 octobre 2026.
text: Retrouvez le compte rendu du Conseil des ministres du jeudi 22 octobre 2026.
  Le ministre de l’Europe et des affaires étrangères a présenté un projet de loi autorisant
  l’approbation de l’accord entre le Gouvernement de la République française et le
  Gouvernement de la République des Fidji concernant la coopération en matière de
  défense et le statut des forces. Cet accord, signé à Nouméa le 6 décembre 2023 par
  le ministre des armées de la République française et le ministre des affaires intérieures
  et de l’immigration de la République des Fidji, instaure entre les deux pays une
  coopération structurée dans le domaine de la défense et régit le statut des forces
  françaises aux Fidji et inversement celui des forces fidjiennes en France en cas
  de séjour ou de transit. Cet accord fixe un cadre juridique solide et pérenne à
  la coopération entre les deux pays en matière de défense dans des domaines tels
  que l’armement, la formation et la fourniture d’aide humanitaire. Cet accord s’inscrit
  ainsi dans la stratégie française dans l’Indopacifique et participe au renforcement
  de notre relation bilatérale avec la République des Fidji, pays avec lequel la France
  entretient notamment une coopération en matière de maintien de la paix et de réponse
  aux catastrophes naturelles à travers les forces françaises déployées dans le Pacifique.
  Le ministre de l’Europe et des affaires étrangères a présenté un projet de loi autorisant
  l’approbation de la convention de partenariat entre le Gouvernement de la République
  française et l’Organisation internationale de police criminelle – INTERPOL (OIPC-INTERPOL)
  relative aux modalités de réalisation du Programme Immobilier Global du siège d’INTERPOL
  à Lyon et aux engagements et responsabilités du Gouvernement de la République française
  et d’INTERPOL, signée à Marrakech le 27 novembre 2025 et à Lyon le 15 décembre 2025.
  INTERPOL a établi son siège à la cité internationale à Lyon en 1989. A la suite
  d’une croissance continue des effectifs et des activités d’INTERPOL, le siège existant
  nécessite une opération immobilière d’envergure. La convention de partenariat définit
  ainsi le cadre juridique, opérationnel et financier d’un programme immobilier global,
  répondant aux besoins fonctionnels et opérationnels d’INTERPOL, et des engagements
  et responsabilités respectifs des Parties. Ce programme comprend des travaux de
  rénovation du siège existant, financés par INTERPOL, et des travaux d’extension
  et de restructuration, financés par la France à hauteur de 61,2 millions d’euros,
  dont 43,2 millions d’euros de l’Etat. La convention de partenariat permettra de
  pérenniser l’implantation du siège d’INTERPOL à Lyon en créant des conditions de
  travail modernisées et adaptées à l’ensemble des agents d’INTERPOL, avec une ouverture
  des nouveaux locaux prévue en 2031. Elle renforce l’attractivité du territoire national
  pour l’installation d’organisations internationales. Le ministre de l’Europe et
