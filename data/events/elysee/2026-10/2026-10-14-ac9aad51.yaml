title: Compte rendu du Conseil des ministres du 14 octobre 2026.
text: 'Retrouvez le compte rendu du Conseil des ministres du mercredi 14 octobre 2026 :
  La ministre déléguée auprès du ministre de l’économie, des finances et de la souveraineté
  industrielle, énergétique et numérique, chargée de l’énergie, a présenté un projet
  de loi visant à accompagner la relance du nucléaire français. Complémentaire de
  la loi adoptée en 2023, ce texte va faciliter la réalisation des grands projets
  de la filière, notamment le renouvellement des installations de traitement et de
  recyclage des combustibles nucléaires, tout en préservant les plus hauts standards
  de sûreté. Le 10 février 2022, dans son discours à Belfort, le Président de la République
  fixait un cap ambitieux : faire de la France la première grande nation à sortir
  de sa dépendance aux énergies fossiles, en réduisant sa consommation d''énergie
  tout en accroissant sa production d''électricité décarbonée. Au cœur de cette stratégie
  figure la relance du nucléaire français, avec la prolongation des réacteurs existants
  lorsque les exigences de sûreté le permettent, la construction de nouveaux réacteurs
  EPR2 et le renforcement de l''ensemble de la chaîne industrielle. Cette orientation
  a été confirmée et confortée par la troisième programmation pluriannuelle de l''énergie
  (PPE3) présentée par le Premier ministre le 12 février dernier. La loi d''accélération
  du nucléaire du 22 juin 2023 a permis de simplifier et d''accélérer les procédures
  nécessaires à la construction de nouveaux réacteurs EPR2, notamment sur les sites
  existants. Un peu plus de trois ans après son adoption, l''avancement des projets
  et les premiers retours d''expérience ont mis en évidence la nécessité de compléter
  ce cadre législatif. À l''approche du lancement formel du programme de nouveau nucléaire
  français, le Gouvernement s’engage pour lever les derniers obstacles identifiés
  et donner à la filière les moyens de concrétiser ses projets. Le projet de loi présenté
  en conseil des ministres a été construit autour de quatre objectifs : - Accélérer
  la modernisation des installations du cycle du combustible nucléaire. Les mesures
  de simplification prévues par la loi de 2023 seront étendues aux installations de
  l''aval du cycle, notamment au projet « Aval du futur » porté par Orano. Ce programme
  vise à renouveler les installations industrielles de La Hague, essentielles au traitement
  et au recyclage des combustibles nucléaires. - Clarifier les règles applicables
  aux installations nucléaires pour garantir la priorité à la sûreté. Le texte vise
  également à assurer la primauté des exigences de sûreté nucléaire et de radioprotection
  lorsque l’application de certaines dispositions du code de la construction et de
  l''habitation aggraverait des risques en matière de sûreté ou de radioprotection
  ou s’avèrerait techniquement impraticable. - Faciliter l''organisation des grands
  chantiers industriels, sans réduire les exigences de contrôle. Sous réserve d''une
  autorisation préalable de l’Autorité de sûreté nucléaire et de radioprotection (ASNR),
  les exploitants pourront confier la surveillance d''intervenants extérieurs à certaines
  sociétés de leur groupe. Cette organisation resterait placée sous la responsabilité,
  la direction et le contrôle de l''exploitant nucléaire. - Faire de la relance du
  nucléaire une réalité industrielle et économique. Avec ce nouveau texte, le Gouvernement
  donne les moyens à la France de passer des orientations stratégiques à la réalisation
  concrète des projets, en donnant aux industriels un cadre adapté à l''ampleur des
  investissements et des chantiers à venir. Le ministre de l’économie, des finances
  et de la souveraineté industrielle, énergétique et numérique et le ministre de l’action
  et des comptes publics ont présenté un projet de loi ratifiant l’ordonnance n° 2026-671
  du 27 juillet 2026 portant divers ajustements du code des impositions sur les biens
  et services (CIBS). Cette ordonnance prolonge le chantier de modernisation et de
  simplification du droit fiscal engagé par le Gouvernement en 2019. Ce travail a
  conduit à la création du CIBS au 1er janvier 2022, puis à son enrichissement progressif,
  notamment avec l’intégration de plusieurs taxes au 1er janvier 2023 et, par une
  ordonnance du 17 décembre 2025, avec le transfert des dispositions relatives à la
  taxe sur la valeur ajoutée (TVA). Une entrée en vigueur du nouveau régime de TVA
  reportée au 1er janvier 2027 À la suite de la consultation publique menée sur la
  recodification de la TVA dans le CIBS, le Gouvernement a pris en compte les attentes
  exprimées par les entreprises et les praticiens du droit. L’entrée en vigueur du
  transfert des dispositions relatives à la TVA dans le CIBS est ainsi reportée au
  1er janvier 2027, afin de permettre aux acteurs concernés de préparer plus sereinement
  la transition vers ce nouveau cadre juridique, notamment dans le contexte de la
  mise en œuvre de la réforme de la facturation électronique à compter du 1er septembre
  prochain. L’ordonnance répond également à une demande importante de simplification
  : elle regroupe désormais, au sein d’une subdivision unique du livre II du CIBS
  consacré à la TVA, l’ensemble des dispositions relatives au droit à déduction de
  la TVA pour améliorer la lisibilité du droit applicable. L’ordonnance intègre par
  ailleurs les mesures relatives à la TVA adoptées depuis l’ordonnance du 17 décembre
  2025, notamment celles issues de la loi de finances pour 2026. Elle prend ainsi
  en compte plusieurs évolutions récentes du droit fiscal, comme l’harmonisation à
  5,5 % du taux de TVA applicable aux services liés à la gestion des déchets. L’ordonnance
  met également à jour les références rendues nécessaires par l’entrée en vigueur
  de la partie législative du nouveau code des douanes au 1er mai 2026. Elle poursuit
  aussi l’harmonisation des catégories fiscales utilisées pour identifier les régimes
  de contrôle, de recouvrement et de contentieux : les « taxes sur le chiffre d’affaires
  » deviennent par exemple les « taxes sur les biens et services ». Une sécurité juridique
  renforcée pour les opérateurs L’ordonnance confirme explicitement que la doctrine
  administrative opposable aux redevables demeure inchangée lors de l’entrée en vigueur
  du CIBS. Cette garantie, déjà prévue par l’ordonnance du 17 décembre 2025 et précisée
  dans un rescrit publié le 18 février 2026 au Bulletin officiel des finances publiques
  – Impôts, est ainsi réaffirmée. L’ordonnance prend également en compte plusieurs
  demandes de clarification formulées lors de la consultation publique, notamment
  afin de rapprocher certaines formulations de la jurisprudence et procède enfin à
  diverses corrections d’erreurs  matérielles  identifiées  dans  l’ordonnance  du
  17 décembre 2025. Le ministre de la ville et du logement a présenté un décret relatif
  à la détermination des modalités d’application de l’autorisation d’urbanisme spéciale
  pour les constructions, installations ou aménagements temporaires nécessaires au
  logement, à l’hébergement ou aux déplacements des personnes participant aux travaux
  de construction d’un nouveau réacteur électronucléaire ou à la logistique et aux
  activités de préfabrication du chantier de ce même réacteur. Il est pris pour l’application
  de l’article 9-1 de la loi n° 2023-491 du 22 juin 2023, créé par la loi n° 2025-1129
  du 26 novembre 2025 de simplification  du  droit  de  l’urbanisme  et  du  logement
  (« Huwart »). Ce décret vient préciser ce régime spécifique des autorisations d’urbanisme
  qui permet, compte tenu du caractère temporaire des constructions, installations
  ou aménagements concernés, de les autoriser à déroger aux règles d’urbanisme, tout
  en les soumettant à une autorisation délivrée par le préfet après accord du maire
  de la commune concernée. L’autorisation fixe le délai, qui ne peut excéder vingt
  ans, à l’expiration duquel le terrain doit être remis en son état initial. Le décret
  détaille la liste des pièces supplémentaires à fournir dans les dossiers de demande
  d’autorisation et les modalités particulières d’instruction de ces demandes. En
  outre, il fixe les modalités relatives aux garanties financières qui peuvent être
  exigées lorsque les caractéristiques du terrain d’assiette ou l’importance du projet
  le justifient. Il précise les critères permettant au préfet d’en fixer le montant,
  ainsi que les conditions de consignation et de déconsignation. Sont également précisées
  les conditions de remise en état des terrains à respecter, ainsi que les mesures
  permettant d’en assurer le respect. Enfin, le décret prévoit que lorsque l’autorité
  compétente pour délivrer l’autorisation ne répond pas à la demande dans les délais
  qui lui sont impartis, son silence vaut décision implicite de rejet. En effet, compte
  tenu de l’objet de l’autorisation, qui doit notamment mentionner la durée d’implantation
  temporaire et, lorsque cela se justifie, le montant des sommes à consigner, le décret
  prévoit qu’une décision expresse de l’administration doit intervenir. Ces mesures,
  particulièrement attendues par les acteurs du secteur nucléaire et ciblant des projets
  déjà identifiés, notamment sur le chantier EPR2 de Penly (76), seront applicables
  aux demandes d’autorisations d’urbanisme déposées à compter du lendemain de la publication
  du texte au Journal officiel. Le conseil des ministres a adopté les mesures individuelles
  suivantes : Sur proposition du garde des sceaux, ministre de la justice : - Mme
  Marie FONTANEL , administratrice de l’Etat, est nommée conseillère d’Etat en service
  ordinaire ; - M. Grégoire DULIN , magistrat, est nommé directeur, secrétaire général
  adjoint, au ministère de la justice, à compter du 19 octobre 2026. Sur proposition
  du ministre des transports : - M. Alexis VUILLEMIN , ingénieur des ponts, des eaux
  et des forêts, secrétaire général du ministère de la transition écologique, de la
  biodiversité et des négociations internationales sur le climat et la nature, haut
  fonctionnaire de défense et de sécurité, est nommé commissaire aux transports et
  aux travaux publics et de bâtiment. Sur proposition de la ministre des armées et
  des anciens combattants : Ont été adoptées diverses mesures d’ordre individuel concernant
  des officiers généraux de la marine nationale et du contrôle général des armées.
