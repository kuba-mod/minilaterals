title: La France et la Belgique ont tenu leur première réunion du Groupe de pilotage
  nucléaire à Paris.
text: La France et la Belgique ont tenu leur première réunion du Groupe de pilotage
  nucléaire à Paris, le vendredi 25 septembre. Dans son discours de l’Île Longue sur
  la dissuasion nucléaire française, le président de la République a annoncé la mise
  en place de dialogues stratégiques bilatéraux avec les partenaires européens concernés,
  afin d’établir le concept de dissuasion avancée. La France et la Belgique ont tenu
  leur première réunion du groupe de pilotage nucléaire à Paris le vendredi 25 septembre,
  en présence de représentants de l’Élysée et du cabinet du Premier ministre belge,
  ainsi que de responsables des ministères de la Défense et des Affaires étrangères.
  Ils ont échangé sur les moyens de renforcer leur coopération bilatérale et la convergence
  stratégique entre les deux pays. La France et la Belgique réaffirment leur ambition
  pour une Europe plus forte, plus sûre et mieux défendue.
