title: Conseil européen à Bruxelles.
text: Le Président de la République s'est rendu à Bruxelles les 15 et 16 octobre 2026
  afin de participer au Conseil européen. Deux ans après le rapport de Mario Draghi,
  les chefs d’État et de gouvernement ont échangé sur la mise en œuvre de l’agenda
  de compétitivité de l’Union européenne . Les discussions ont porté sur les progrès
  de l’union de l’épargne et de l’investissement, la préférence européenne, ainsi
  que les réponses de l’Europe aux chocs externes, en particulier la hausse des prix
  de l’énergie, les déséquilibres macroéconomiques mondiaux et l’urgence de rétablir
  des conditions de concurrence loyale pour les entreprises européennes. Les dirigeants
  ont abordé le prochain cadre financier pluriannuel de l’Union européenne , en particulier
  la nécessité de ressources propres substantielles qui sont la condition indispensable
  de tout accord. Cet élément est essentiel pour assurer le financement des politiques
  traditionnelles comme la PAC et la pêche, investir dans nos dépenses d’avenir, et
  stabiliser les contributions nationales. Ils ont ensuite fait le point sur le processus
  d’élargissement de l’Union européenne. La deuxième journée a été consacré aux enjeux
  internationaux , ainsi qu’à la sécurité et la défense européennes . Les chefs d’État
  et de gouvernement ont réaffirmé leur soutien à l’Ukraine , confrontée à une escalade
  des attaques russes contre ses infrastructures civiles et énergétiques. Ils ont
  abordé la situation au Proche et au Moyen-Orient , notamment la stabilisation régionale
  et les enjeux liés au détroit d’Ormuz. S’agissant de la sécurité et de la défense
  européennes, les dirigeants ont évoqué la réponse européenne aux menaces hybrides
  russes et fait le point sur les progrès accomplis pour accélérer la capacité de
  l’UE à produire davantage dans les domaines capacitaires clés. Enfin, les échanges
  ont porté sur les migrations , notamment la pleine mise en œuvre du Pacte européen
  sur la migration et l’asile , dans son équilibre entre solidarité et responsabilité,
  et la nécessité d’une réponse européenne unie et coordonnée pour répondre aux situations
  d’urgence pour protéger les frontières extérieures de l’espace Schengen. Déclaration
  de presse conjointe franco-allemande sur l’avenir de l’industrie automobile européenne.
