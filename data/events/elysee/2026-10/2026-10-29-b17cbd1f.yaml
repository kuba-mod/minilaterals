title: La France et la Finlande ont tenu leur première réunion du groupe de pilotage
  nucléaire à Paris le mardi 27 octobre.
text: La France et la Finlande ont tenu leur première réunion du groupe de pilotage
  nucléaire à Paris, le mardi 27 octobre. Dans son discours prononcé à l’Île Longue
  sur la dissuasion nucléaire, le président de la République française a annoncé la
  mise en place de dialogues stratégiques bilatéraux avec les partenaires européens
  concernés, afin d’établir le concept de dissuasion avancée. La Finlande a rejoint
  le programme français de dissuasion avancée le 14 septembre, marquant une étape
  importante pour la sécurité européenne et la coopération bilatérale. La France et
  la Finlande ont tenu leur première réunion du groupe de pilotage nucléaire à Paris
  le mardi 27 octobre, en présence de représentants de l’Élysée et des cabinets du
  Président et du Premier ministre finlandais, de responsables des ministères de la
  Défense et des Affaires étrangères, ainsi que de hauts responsables militaires.
  Ils ont partagé leur vision en faveur du renforcement de la convergence stratégique
  entre les deux pays. La France et la Finlande réaffirment leur ambition pour une
  Europe plus forte, plus sûre et mieux défendue.
