title: Déplacement à Trappes.
text: Le Président de la République s'est rendu à Trappes pour exprimer sa solidarité
  à l’ensemble des personnes mobilisées à la suite de l’attentat terroriste raciste
  survenu ce vendredi 23 octobre 2026. 23 octobre 2026 - Seul le prononcé fait foi
  Je voulais dire quelques mots et je suis aujourd'hui à Trappes aux côtés de nos
  élus et des populations parce que ce qui s'est passé aujourd'hui est un tournant
  dans la vie de notre République et de notre Nation. Ce qui s'est passé aujourd'hui,
  c'est un attentat terroriste raciste, ainsi qualifié par le parquet national antiterroriste,
  qui a fait six victimes. Un homme a été tué ce matin par un de nos compatriotes
  sur la base d'une idéologie raciste. On a cinq victimes par ailleurs, dont une petite
  fille de 12 ans qui est en train de se battre à l'hôpital au moment où on se parle.
  Ces personnes ont été visées à raison de leur couleur ou de la religion supposée
  et pour rien d'autre. C'est ça ce qui s'est passé aujourd'hui. Je remercie l'ensemble
  des forces de sécurité et en particulier la BAC ici dans le département. La BAC
  est tout de suite intervenue et a pu neutraliser l'assaillant et éviter d'autres
  victimes. Merci à notre police pour ce qu'elle a fait. Je veux évidemment avant
  toute chose avoir une pensée pour les familles des victimes. Certaines sont en train
  d'être prévenues et donc les noms seront dits en temps voulu. Je veux dire combien
  on soutient évidemment les victimes et leurs familles qui sont en train de se battre,
  entre la vie et la mort. Et apporter plus largement le soutien, le réconfort de
  la nation à l'ensemble des populations. Et dire ici aux élus qui sont à mes côtés,
  maire de Trappes, maire de La Verrière et le député, dire à monsieur le préfet,
  combien la France tout entière est à leurs côtés, aux côtés de leurs équipes, de
  leurs habitants, pour dire notre soutien. Mais je vais vous dire aussi que nous
  ne céderons rien et nous n'avons rien à céder. Ce qui s'est passé aujourd'hui, je
  le dis, c'est un tournant parce que c'est la première fois qu'il y a un acte terroriste
  planifié pour tuer nos compatriotes, nos enfants, à raison de leur couleur de peau
  ou de la religion qu'on leur donne. On a vu une maman à l'instant qui était avec
  sa fille de 12 ans dont la voiture a été criblée de balles par ce terroriste aussi.
  Et donc le message très clair, au-delà évidemment du soutien, en remerciant les
  forces de sécurité intérieure, en remerciant les magistrats qui se sont tout de
  suite mobilisés, le parquet national antiterroriste qui s'est tout de suite saisi
  aux côtés du procureur. Merci aussi à nos magistrats tout de suite et qui vont faire
  le travail pour élucider la totalité de cet attentat terroriste et qui reviendront
  et qui donneront les détails. Moi, j'ai une chose à vous dire, cela n'a pas sa place
  dans la République, ça n'a pas sa place en France. Et donc nous devons tous combattre,
  pas simplement cet acte qui s'est tenu aujourd'hui, mais comprendre ce qui est en
  train de se passer. Nous n'avons rien à céder aux idées qui s'installent dans la
  République et qui peuvent justifier ce genre de comportement ou qui créent une atmosphère
  qui pourrait les justifier. La République, elle est une et indivisible. La République,
  elle n'a que des citoyennes et des citoyens. Elle ne les discrimine jamais, ni à
  raison de leur couleur de peau, ni à raison de leur religion, ni à raison de leurs
  opinions politiques. Et je le dis en particulier aux habitants des communes qui
  ont été touchées, mais plus largement dans tout notre pays. Ne baissez pas la tête,
  vous êtes françaises et français. Et cette jeunesse de France, c'est notre chance.
  Ne baissez pas la tête, parce que la République tiendra. Et n'ayez pas peur, parce
  que la République tiendra. Et il n'y a pas un camp contre l'autre dans cette République.
  Elle est une et indivisible. Et je veux remercier les élus de la République, les
  associations, nos enseignants, toutes celles et ceux qui forgent cette unité. Plus
  que jamais, c'est notre trésor. Ne laissons rien nous diviser. Rien. Voilà ce que
  je voulais vous dire aujourd'hui, en disant le soutien et l'affection de la Nation,
  évidemment aux victimes, à leurs familles, toutes celles et tous ceux qui ont été
  confrontés à cet attentat terroriste, raciste, aujourd'hui. Et vous dire que la
  République tiendra, parce que nous venons tous de bien plus loin et de valeurs qui
  nous portent et qui nous tiennent. Je vais répondre à vos questions, si vous en
  avez. Est-ce que vous voyez un lien entre les tensions qui s'accumulent dans la
  société, une violence aussi du week-end dernier, et plus généralement la montée
  des extrêmes ? C'est ce que je voudrais comprendre de votre déclaration ? Écoutez,
  d'abord, il y a un attentat terroriste raciste, il a été ainsi qualifié par les
  services de justice, qui s'est produit. Je le disais, c'est une première dans notre
  pays. Donc ce qui a trait à cet attentat, c'est évidemment les investigations qui
  permettront de l'élucider. C'est au procureur national antiterroriste de vous le
  dire. Ce que je sais, c'est que tout ça s'appuie sur, d'abord, une préméditation
  de sa part, des propos qu'il a tenus et qui ont été très clairement consignés dans
  les premières heures. Il a épargné des gens en raison de leur peau, ou en tout cas
  ce qu'il croyait être, et il a assumé son acte. Et ensuite, je dis juste que le
  discours ambiant qui parfois s'installe crée une atmosphère. Dans ces moments-là,
  on ne doit faire qu'une chose, être unis. Dans ces moments-là, on ne doit faire
  qu'une chose, nous rappeler qui nous sommes. Monsieur le Président, ce n'est pas
  un peu trop tard ? Quand vous dites que la République ne cédera rien, justement,
  quand on voit des élus, parfois des membres du gouvernement, tenir certains propos,
  vous ne pensez pas que c'est déjà un peu tard ? Vous m'avez toujours entendu tenir
  les mêmes propos. Vous m'avez toujours entendu mener les mêmes combats depuis le
  premier jour. Donc je pense que ça n'est jamais trop tard. Je pense qu'on a malheureusement
  des discours, mais encore une fois, je distingue les choses et il faut avoir cet
  esprit de distinction. Parce que je ne veux pas tout réduire ou donner un sens qu’auront
  à donner les services enquêteurs à ce qui s'est passé aujourd'hui. Enfin, il est
  raciste, cet acte terroriste. Donc qu'un racisme se soit installé dans le discours
  public ambiant, c'est un fait. Je l'ai toujours combattu avec la plus grande force.
  Ce n'est jamais trop tard. Ce n'est jamais trop tard. Donc il y a aujourd'hui une
  montée des tensions. Vous avez raison. Il s'est installé ces dernières années pour
  des tas de raisons. Parce qu'on a importé, monté les tensions, parce qu'il y a beaucoup
  de choses qui ont bousculé notre République ces dernières années. D'autres attentats
  qui ont conduit à stigmatiser des religions. Donc je pense qu'aujourd'hui, la clé,
  c'est de ne pas tout confondre. Surtout, c'est de ne pas tomber dans le piège d'un
  camp contre l'autre. Et donc il n'est jamais trop tard. Mais je veux rappeler ici
  que la République, c'est l'unité et la concorde. Monsieur le Président, au soir
  de votre réélection, vous avez dit « ce vote m'oblige ». On a entendu qu'une partie
  des Français avait voté pour vous pour faire barrage au Front national, au Rassemblement
  national. On voit que cinq ans plus tard, le barrage est... Ils sont à deux doigts
  d’arriver à l’Elysée. Je l'ai même dit il y a neuf ans. Mais d'abord, je ne ferai
  pas de commentaire politique ici et je ne ferai pas de raccourci en parlant de ce
  pour quoi nous sommes aujourd'hui et du débat politique. Donc ça, sachant raison
  garder, je dis que, et je mets en dehors même des partis politiques, il y a des
  discours racistes. Il y a une tension qui s'installe dans la société. Cela depuis
  plusieurs années. Elle avait commencé à s'installer. Le terrorisme qu'on a vécu
  certainement l'a accéléré. Les conflits internationaux et l'importation de la géopolitique
  dans le débat au sein de la nation, j'ai toujours essayé de faire très attention
  à ça, mais l’a accéléré. Et ça, nous en sommes tous les co-dépositaires. Moi, j'ai
  ma responsabilité. Là aussi, j'essaie de faire le maximum. Peut-être que je fais
  des erreurs. Peut-être que d'autres jours, je fais mieux. Je pense qu'il n'est en
  tout cas jamais trop tard. Mais ce que je suis venu au-delà du soutien de la nation
  et du message très clair que je viens de passer, je vous dis simplement un message
  de concorde et d’unité. Ni la peur, ni la colère. Ni la peur, ni la colère. Monsieur
  le Président, est-ce que vous craignez des réactions de colère dans le secteur ?
  On a vu notamment que la CRS 8 avait été déployée. Non, je pense que ça, c'est pour
  qu'il n'y ait pas de trouble à l'ordre public. Je pense que tout le monde est traumatisé.
  Tout le monde est bouleversé, touché. À Trappes, la Verrière, le département. Et
  je pense que la France entière est touchée par ce qui vient de se passer. Donc,
  c'est aussi pour ça qu'on doit tous, d'abord, mettre les bons mots sur ce qui s'est
  passé. Il faut ensuite élucider la totalité et comprendre, et ça, ça sera dans les
  mains des magistrats. Mais nous, il faut aussi que derrière ça, il y ait un sursaut.
  Il y ait un sursaut collectif. Ce sursaut, c'est un sursaut d'unité. Et pour reprendre
  une formule, il n'est jamais trop tard. Jamais trop tard. Donc, ce à quoi j'appelle
  chacune et chacun, c'est au respect. C'est à l'unité. C'est aussi que beaucoup de
  nos compatriotes, je le sais, vont avoir peur demain en se disant, « ça peut m'arriver
  à moi ». Et ça, c'est non. La police, elle sera là aussi pour les protéger. Je le
  dis aussi pour beaucoup de jeunes parfois qui pensent que... On a entendu des discours
  sur la police. C'est aussi pour ça que chacun doit aussi réfléchir après ce qui
  s'est passé aujourd'hui. C'est nos fonctionnaires de la BAC qui ont arrêté, qui
  ont protégé, qui ont sauvé des vies. C'est des policières et des policiers municipaux
  qui, dans les deux communes, sont allés au contact, ont sauvé d'autres vies. C'est
  ça ce qui s'est passé aussi. C’est ce fil républicain qu'il faut tirer. Mais ne
  laissons pas cet attentat terroriste nous diviser. Unité et concorde. Mais aussi,
  regardons-nous les yeux dans les yeux. Tels que nous sommes tous Français. Compatriotes,
  concitoyens, enfants de cette République. Et notre responsabilité, c'est de la rendre
  plus belle, plus grande. Je le disais à cette maman qui pleurait tout à l'heure,
  qui nous a bouleversés en disant... Moi, chaque jour, on me demande si je suis Française.
  En raison de ma peau, j'aurais pu mourir parce que ma peau est noire. Ça, ce n'est
  pas la République et ça, ce n'est pas la France. Parce qu'elle est Française, cette
  maman. Et qu'elle a sa place ici. Et qu'elle est dans la France, dans la République.
  Qu'elle n'a pas à se justifier. Mais qu'elle a à pouvoir vivre en paix et élever
  ses enfants. C'est ça la France et rien d'autre. Je vous remercie. 23 octobre 2026
