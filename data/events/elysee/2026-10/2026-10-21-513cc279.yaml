title: Déclaration conjointe entre la République française et l’État du Qatar à l’occasion
  de la visite à Doha de Son Excellence Monsieur Emmanuel Macron, président de la
  République française.
text: 1.  Compte tenu des liens historiques profonds et de la coopération sans cesse
  renouvelée entre la République française et l’État du Qatar, Son Excellence Monsieur
  Emmanuel Macron, président de la République française, a effectué une visite d’État
  à Doha les 20 et 21 octobre 2026. 2.  Les discussions approfondies entre Son Excellence
  Monsieur Emmanuel Macron, président de la République française, et Son Altesse Cheikh
  Tamim bin Hamad Al Thani, Émir de l’État du Qatar, ont témoigné de la solidité et
  de la pérennité des relations bilatérales ainsi que de la confiance mutuelle qui
  les caractérise. Les deux chefs d’État ont réaffirmé leur détermination à renforcer
  leur partenariat historique et à intensifier leur coopération dans les domaines
  de la défense, de la sécurité, de l’énergie, des affaires économiques et des échanges
  universitaires et culturels, tout en poursuivant une étroite concertation politique
  et diplomatique. Ils se sont félicités de la tenue de la quatrième édition du dialogue
  stratégique bilatéral, qui s’est tenue en marge de la visite d’État et a été coprésidée
  par Son Excellence M. Jean-Noël Barrot, ministre de l’Europe et des Affaires étrangères
  de la République française, et Son Excellence Cheikh Mohammed bin Abdulrahman bin
  Jassim Al Thani, Premier ministre et ministre des Affaires étrangères de l’État
  du Qatar. 3.  Les deux chefs d’État ont échangé sur les dernières évolutions concernant
  plusieurs problématiques régionales et internationales, en particulier l’escalade
  des tensions dans la région, et sur les moyens d’apaiser ces tensions, de garantir
  la liberté de navigation et la sécurité énergétique, et, à terme, de parvenir à
  une paix durable par le dialogue, la diplomatie et des moyens pacifiques. 4.  Dans
  un contexte marqué par une situation particulièrement sensible en matière de sécurité
  et de géopolitique dans la région, le président de la République française a rappelé
  la pleine solidarité de la France avec l’État du Qatar. Les deux chefs d’État ont
  condamné les attaques militaires iraniennes contre des pays de la région, qui constituent
  une grave violation du droit international. Ils ont réaffirmé leur soutien de longue
  date à tous les efforts visant à parvenir à une solution diplomatique pour répondre
  durablement aux menaces iraniennes, notamment pour garantir de manière vérifiable
  le caractère exclusivement pacifique du programme nucléaire iranien. Le président
  de la République française a salué les efforts de médiation déployés par l’État
  du Qatar à cette fin. Les deux chefs d’État ont réaffirmé la nécessité de rétablir
  la liberté de navigation dans le détroit d’Ormuz, sans restriction ni taxe, et ont
  exprimé leur soutien aux initiatives visant à atteindre cet objectif. Ils ont également
  réaffirmé la poursuite de leurs travaux avec leurs partenaires internationaux pour
  promouvoir la sécurité et la stabilité régionales et internationales, et ils sont
  convenus d’intensifier leurs consultations et de coordonner leurs efforts diplomatiques
  conjoints afin de contenir les tensions et de favoriser la désescalade, notamment
  au regard des problématiques auxquelles la région est confrontée. Dans ce contexte,
  l’État du Qatar a réaffirmé sa détermination à jouer son rôle de partenaire fiable
  au service de la sécurité énergétique mondiale et de la stabilité des approvisionnements
  énergétiques. 5.  Les deux chefs d’État ont salué leur remarquable coopération sur
  les problématiques régionales et mondiales et ont réaffirmé leur volonté de parvenir
  à la paix et à une stabilité durable au Moyen-Orient. Ils ont réaffirmé leur soutien
  à la solution des deux États, avec un État palestinien indépendant vivant côte à
  côte avec Israël dans la paix et la sécurité, conformément à la Déclaration de New
  York. La France et le Qatar ont réitéré leur opposition à toute annexion de la Cisjordanie
  et ont appelé à la fin des politiques de colonisation israéliennes et des violences
  commises par les colons. Les deux chefs d’État ont exprimé leur soutien à la résolution
  2803 du Conseil de sécurité des Nations Unies et au Plan d’ensemble présenté par
  Son Excellence Monsieur Donald Trump, président des États-Unis d’Amérique, visant
  à mettre fin au conflit à Gaza, et ont souligné qu’il est nécessaire que toutes
  les parties respectent l’ensemble de leurs obligations au titre des accords et cadres
  pertinents, notamment la mise en œuvre du cessez-le-feu, le retrait des forces israéliennes
  conformément aux dispositions convenues ainsi que l’acheminement urgent, sûr et
  sans entrave de l’aide humanitaire à la population de Gaza, sans conditions ni restrictions.
  Ils ont également exprimé leur soutien à la tenue d’élections palestiniennes. 6.
   S’agissant du Liban, la France et le Qatar ont réaffirmé leur détermination à soutenir
  la stabilité et la souveraineté de ce pays, comme ils l’ont constamment fait en
  tant que membres du comité du Quintette. À cet égard, les deux pays ont déclaré
  que la fin prochaine du mandat de la Force intérimaire des Nations Unies au Liban
  ne devait pas créer un vide en matière de sécurité susceptible de déstabiliser le
  pays et la région tout entière. Ils ont souligné la nécessité de maintenir une présence
  internationale et de soutenir les autorités et les forces armées libanaises afin
  de mettre en œuvre la résolution 1701 du Conseil de sécurité des Nations Unies,
  sur laquelle toute solution durable doit se fonder. Les deux pays ont réaffirmé
  leur soutien à l’Accord-cadre trilatéral et à sa pleine mise en œuvre par l’ensemble
  des parties afin de progresser vers le rétablissement de la souveraineté des autorités
  libanaises sur l’ensemble du territoire, le désarmement du Hezbollah et le retrait
  complet des forces israéliennes du Liban. La France et le Qatar ont aussi souligné
  l’importance de mener des réformes, notamment sur le plan économique et financier,
  et ont réaffirmé leur intention de continuer à fournir de l’aide humanitaire à la
  population civile qui a été gravement touchée. 7.  La France et le Qatar ont affirmé
  la poursuite de leur coopération en soutien à la stabilité en Libye, en Syrie, au
  Soudan, dans la Corne de l’Afrique, la région des Grands lacs et le Yémen, ainsi
  que leur soutien aux processus politiques menés par les Nations Unies et leurs efforts
  pour parvenir à une paix juste et durable en Ukraine. Concernant la Syrie, ils ont
  réitéré leur disposition à travailler ensemble pour soutenir des projets contribuant
  à la stabilisation et à la reprise économique de la Syrie, en étroite coopération
  avec les autorités syriennes. 8.  Ils ont souligné l’importance de renforcer les
  partenariats équitables et stratégiques avec les pays africains contribuant au développement
  durable du continent africain et de coopérer dans divers domaines d'intérêt mutuel
  en partenariat avec les pays africains. 9.  Les deux chefs d’État ont réaffirmé
  leur détermination à approfondir le partenariat entre l’Union européenne et le Conseil
  de coopération des États arabes du Golfe en renforçant leur coopération structurée.
  10.  La France et le Qatar ont réaffirmé que la lutte contre le terrorisme demeure
  un pilier central de la coopération bilatérale et ont souligné qu’il est important
  de poursuivre la collaboration pour prévenir et combattre le terrorisme, protéger
  leurs populations et faire face à l’évolution des menaces qui dépassent les frontières
  nationales. Les deux pays sont également convenus de renforcer la coopération en
  matière de cybersécurité et de lutte contre le terrorisme, l’extrémisme violent
  et les flux financiers illicites, en reconnaissant la nécessité d’adopter une approche
  globale et concertée pour faire face aux problématiques de sécurité communes. 11.
   Les deux pays sont convenus de renforcer leurs capacités de défense grâce à l’intensification
  de leur coopération militaire, notamment entre leurs forces terrestres, ce qui marque
  l’ouverture d’un nouveau chapitre du partenariat militaire franco-qatarien. Une
  lettre d’intention a été signée pour confier à KNDS France et John Cockerill Defense
  la modernisation des Forces armées terrestres qatariennes. Les deux pays entendent
  conclure les négociations en cours sans tarder. Le Qatar a exprimé sa reconnaissance
  pour le déploiement des capacités de défense aérienne et son intérêt à renforcer
  la coopération dans ce domaine.  Le Rafale, utilisé par les deux pays, demeure un
  pilier fondamental de la coopération et de l’interopérabilité entre les forces aériennes,
  pilier qui sera encore consolidé en renforçant les capacités des Forces armées aériennes
  qatariennes pour leur permettre de faire face aux menaces croissantes. Les deux
  pays ont souligné que leur coopération en matière de défense avait abouti à la signature
  d’une lettre d’intention relative aux garanties de sécurité et de défense et à la
  stabilité au Moyen-Orient, à la suite des travaux du haut comité militaire franco-qatarien,
  dont la dernière session s’est tenue en janvier 2026. Cela contribue à renforcer
  la coordination des efforts, à faire face aux problématiques régionales, à soutenir
  la stabilité, à préserver la sûreté et la sécurité de la navigation maritime et
  à intensifier la coopération dans le domaine de la formation conjointe. 12.  La
  France et le Qatar ont réaffirmé l’importance de leur coopération opérationnelle
  en matière de sécurité et de défense. Ils ont salué les progrès réalisés ces dernières
  années dans le cadre de leur coopération, notamment grâce à la signature de contrats
  concernant les systèmes radars et les satellites de télécommunication. Les deux
  pays ont également affirmé le souhait d’envisager de nouvelles formes de coopération
  et d’étudier les moyens d’approfondir la coopération dans les domaines de la planification,
  de la formation et des exercices au service des opérations militaires conjointes.
  13.  Les deux pays sont convenus de renforcer leurs capacités de défense respectives
  grâce à l’intensification de leur coopération militaire, notamment entre leurs forces
  terrestres, ce qui marque l’ouverture d’un nouveau chapitre du partenariat militaire
  franco-qatarien. Cette coopération comprendra un renforcement des capacités et une
  intégration accrus entre l’Armée française et les Forces armées terrestres qatariennes.
  14.  Les deux pays ont salué la vigueur de leur coopération conjointe dans le domaine
  de la sécurité intérieure, illustrée par la participation de la France, en qualité
  d’invité d’honneur, à l’exercice Watan et la tenue de Milipol à Doha. La France
  et le Qatar ont également salué le renforcement de leur partenariat dans le domaine
  de la protection civile, notamment grâce à leur soutien conjoint à la Défense civile
  syrienne.  Ils se sont félicités de la signature d’un nouveau plan d’action triennal
  plus large entre le ministère de l’Intérieur de la France et le ministre de l’Intérieur
  et des Forces de sécurité intérieure du Qatar, qui fournira à ce partenariat un
  cadre durable tant en matière de sécurité intérieure qu’en matière de protection
  civile. 15.  La France et le Qatar ont affirmé leur détermination à donner la priorité
  aux investissements directs dans les deux pays, en mettant l’accent sur les secteurs
  stratégiques comme l’énergie, les technologies de communication, la transformation
  numérique et l’intelligence artificielle, les technologies quantiques, la défense
  et la sécurité, notamment la cybersécurité, et les projets de l’industrie de la
  défense ainsi que la culture, les infrastructures urbaines et de transport, l’immobilier,
  le tourisme, l’éducation et la santé, tout en favorisant les possibilités d’investissement
  positives dans les deux pays. 16.  Les deux pays ont réaffirmé leur volonté d’élargir
  le champ de leur coopération dans le domaine de la sécurité énergétique compte tenu
  de l’escalade dans la région. Cela passera notamment par la coopération industrielle,
  la recherche et développement, la diversification des sources ainsi que la coopération
  en matière de gestion de l’eau, et la participation au dialogue en cours avec les
  acteurs clés des secteurs public et privé dans les deux pays. La France et le Qatar
  ont souligné l’importance du « One Planet Summit » et des résultats de ses réunions,
  et ils ont réaffirmé leur détermination à mettre en œuvre l’Accord de Paris et à
  assurer le suivi des progrès réalisés pour tenir leurs engagements en vertu de cet
  accord. 17.  Les deux pays ont pris note des investissements qatariens réalisés
  en France dans plusieurs secteurs, notamment les biens de consommation et de luxe,
  les télécommunications, l’immobilier, l’industrie, la santé et les services financiers.
  Depuis 2025, la Qatar Investment Authority a également investi au moyen d’investissements
  directs et par l’intermédiaire du « French Future Champions Fund », un fonds d’investissement
  conjoint de Bpifrance et de la Qatar Investment Authority. Tous ces investissements
  ont contribué à soutenir le développement économique, à créer des emplois et à promouvoir
  l’innovation dans les deux pays. À cet égard, la France et le Qatar ont réaffirmé
  leur volonté de continuer à étudier de nouvelles possibilités d’investissement en
  France, notamment dans des secteurs prometteurs tournés vers l’avenir comme les
  technologies quantiques et l’intelligence artificielle. 18.  La France et le Qatar
  ont réaffirmé leur volonté d’étendre leur coopération dans les domaines de la construction,
  du transport, du tourisme et des villes intelligentes et d’étudier de nouvelles
  possibilités pour les entreprises françaises au Qatar, notamment en matière d’infrastructures.
  Les deux pays ont également affirmé le rôle important de la recherche scientifique
  et de l’enseignement supérieur dans le développement durable et la transformation
  économique et sociale, et ils ont souligné la nécessité de renforcer la coopération
  bilatérale dans ces domaines. 19.  Les deux pays ont émis le souhait d’accroître
  la coopération dans les domaines des arts, de l’éducation, de la culture et du patrimoine,
  d’approfondir et d’élargir les partenariats entre établissements culturels et d’enseignement
  et de soutenir les investissements dans les industries créatives en France et au
  Qatar. Ils ont réaffirmé conjointement leur soutien de longue date à l’Institut
  du monde arabe et ils ont souligné sa précieuse contribution au dialogue culturel
  et à la compréhension mutuelle entre la France et les États membres de la Ligue
  des États arabes. 20.  S’agissant des arts, de la culture et des industries créatives,
  les deux pays se sont engagés à mettre en œuvre les accords de 2025 et ont salué
  les évolutions positives en découlant dans les domaines du cinéma, des musées, des
  arts et de l’artisanat ainsi que des bibliothèques. 21.  Les deux pays travailleront
  de concert pour renforcer les liens entre établissements linguistiques, universitaires,
  d’enseignement et de recherche, accroître la coopération dans les domaines du sport
  et de l’engagement des jeunes et faciliter le tourisme entre la France et le Qatar
  grâce à des initiatives coordonnées visant à promouvoir les destinations touristiques
  et à attirer les visiteurs. 22.  Les deux pays ont souligné la solidité de leur
  partenariat de longue date et l’importance de coordonner leurs efforts pour faire
  face aux problématiques régionales et mondiales qui nécessitent une action collective,
  afin de contribuer à la paix et à la stabilité internationales. 23.  Ils ont souligné
  que le partenariat entre la France et le Qatar se distingue et puise sa force dans
  sa capacité à porter une vision qui dépasse la simple relation bilatérale et sert
  des causes dans le monde entier, les deux pays travaillant côte à côte dans les
  pays et régions tiers. 24.  Cette approche se manifeste dans les consultations étroites
  entre la France et le Qatar sur les grandes crises internationales et dans le partenariat
  sur les questions humanitaires et le développement durable que l’Agence française
  de développement, le Centre de crise et de soutien et le Fonds du Qatar pour le
  développement ont bâti patiemment au fil des années en appui aux populations dans
  le besoin des pays en développement. Cette approche prend aussi de plus en plus
  la forme d’un soutien militaire, de projets économiques et d’actions culturelles.
  Elle est en outre de plus en plus mise au service des biens public mondiaux et de
  la réalisation des objectifs de développement durable, comme en témoigne l’accueil
  et la présidence par la « Qatar Investment Authority » du Sommet du réseau des fonds
  souverains « One Planet ». La France et le Qatar entendent faire ensemble de cet
  engagement partagé une force durable pour assurer la stabilité, le développement
  et le dialogue.
