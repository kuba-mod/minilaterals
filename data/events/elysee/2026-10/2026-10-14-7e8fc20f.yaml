title: Proposition de nomination de Camille Tubiana en qualité de directrice générale
  de l’Agence nationale pour la rénovation urbaine (ANRU).
text: Le Président de la République envisage, sur proposition du Premier ministre,
  de nommer Mme Camille Tubiana en qualité de directrice générale de l’Agence nationale
  pour la rénovation urbaine (ANRU). La Présidente de l’Assemblée nationale et le
  Président du Sénat sont saisis de ce projet de nomination, afin que la commission
  intéressée de chacune des assemblées se prononce dans les conditions prévues par
  le cinquième alinéa de l’article 13 de la Constitution.
