date: '2026-10-18'
type: press_release
source_name: elysee
title: Adresse aux Français.
text: Le Président de la République s'est adressé aux Français ce dimanche 18 octobre
  2026 à 20h. Le chef de l’État est revenu sur les violences débridées qui se sont
  produites le samedi 17 octobre. Il a exprimé le soutien de la Nation aux forces
  de l’ordre et forces de sécurité intérieure qui ont tenu, et a adressé sa pensée
  aux blessés ainsi qu’à leurs familles. Il a témoigné de son soutien aux maires et
  aux élus ainsi qu’à tous les commerçants , qui se trouvent aujourd’hui dans le désarroi.
  Le chef de l’État a annoncé que le gouvernement leur apportera des réponses concrètes
  . Il a également souligné que chaque infraction commise doit donner lieu à des suites
  judiciaires appropriées . Le Président de la République a opéré une distinction
  très claire entre ceux qui ont cassé et les manifestants, dont les revendications
  et les inquiétudes sont légitimes. Il a annncé que le Premier ministre réunira dans
  les prochains jours élèves, étudiants, enseignants, représentants des organisations
  syndicales et patronales, collectivités territoriales et parlementaires pour travailler
  dès cette semaine avec le gouvernement à des solutions concrètes . 18 octobre 2026
  - Seul le prononcé fait foi Mes chers compatriotes, je m'adresse à vous ce soir
  dans un moment d'une extrême gravité, après ce que nous avons vécu hier dans de
  nombreuses villes de France, en hexagone comme dans nos Outre-mer. Hier, samedi
  17 octobre, des factieux, issus de groupuscules d'ultra-gauche, rejoints par de
  nombreux délinquants, se sont livrés à une violence débridée dans nos villes. Des
  commerces ont été pillés, des bâtiments publics, des magasins, des mairies ont été
  attaqués et pour certains détruits. Plusieurs centaines de policiers et de gendarmes
  ont été blessés. En regardant ces images, nous nous sommes tous demandé, qu'ont-ils
  dans la tête ? Comment des Français peuvent faire cela à la France ? Pourquoi brûler
  la mairie de Limoges, l'office de tourisme à Lyon, envahir la mairie à Marseille
  ou attaquer la résidence du préfet à Bordeaux ? Comment peuvent-ils en arriver là ?
  Rien ne le justifie, rien ne l'explique, rien ne l'excuse. Nous ressentons tous
  ce soir de la colère, de la honte. V oir les rues de nos villes ainsi saccagées
  est insupportable. En votre nom, j'exprime le soutien de la nation à nos forces
  de l'ordre et à nos forces de sécurité intérieure. Elles ont tenu et ont fait de
  leur mieux. Nous pensons aux nombreux blessés ainsi qu'à leurs familles. J'exprime
  aussi notre soutien à tous nos maires et tous nos élus. Je veux dire aussi notre
  soutien aux nombreux commerçants, artisans, acteurs économiques qui ont subi les
  conséquences de ces violences et qui sont aujourd'hui dans le désarroi. Certains
  ont défendu eux-mêmes leurs magasins et leurs vitrines face aux délinquants. Je
  veux leur dire qu'ils ne seront pas laissés seuls face à ces difficultés. Le gouvernement
  leur apportera des réponses. Dès demain, le Premier ministre présidera une cellule
  de crise pour mobiliser les aides les plus rapides possibles et accompagner celles
  et ceux qui traversent ces heures si difficiles. Il faut être lucide. Hier, nos
  forces de l'ordre, malgré leur professionnalisme, ont eu à subir une violence inouïe
  dans de nombreuses villes à plusieurs reprises. J'ai demandé au gouvernement d'en
  tirer toutes les leçons en matière de renseignement et d'anticipation et faire en
  sorte que cela ne puisse pas se reproduire. J'attends des réponses claires et toute
  la transparence sera faite. C'est ce que j'ai demandé au ministre de l'Intérieur.
  Les enquêtes seront conduites avec toute la diligence nécessaire le plus rapidement
  possible et la plus grande fermeté a été demandée au procureur par le garde des
  Sceaux. Le suivi judiciaire doit être exemplaire. Nos juges rendent la justice en
  votre nom et ils savent ce que vous attendez. Chaque fois que des infractions sont
  commises, elles doivent donner lieu à des suites judiciaires appropriées. Ceux qui
  ont détruit doivent payer. Ceux qui ont pillé doivent rembourser. Ceux qui ont cherché
  à faire tomber la République auront à en répondre. Il faut aussi regarder lucidement
  ce qui s'exprime dans le pays. Hier, plusieurs centaines de milliers de nos compatriotes
  ont manifesté avec la volonté de porter des revendications légitimes. Jamais nous
  ne devons confondre ces derniers avec ceux qui ont détruit, cassé, pillé. Ces manifestants
  ont fait part d'une inquiétude sur le coût de la vie, sur le prix des carburants,
  qui trouvent leur source dans le conflit lancé dans le golfe Persique, auquel la
  France n'a pas pris part et dont nous subissons les conséquences. Je comprends parfaitement
  leur inquiétude. Elle s'exprime d'ailleurs aussi dans plusieurs autres capitales
  en Europe. A ce titre, j'ai pris plusieurs initiatives au niveau international pour
  garantir notre carburant, notre gaz et agir sur les marchés de l'énergie. Je poursuivrai
  ces actions dès demain matin, en allant dans les pays du Golfe pour sécuriser nos
  approvisionnements. Le Premier ministre et le gouvernement ont également pris des
  décisions en lien avec les distributeurs de carburant pour que ces efforts se répercutent
  concrètement sur les prix. Le gouvernement fait le maximum pour que cette question
  essentielle du pouvoir d'achat soit traitée. Je sais que les Français attendent
  des résultats concrets et nous continuerons à agir. Depuis plusieurs semaines aussi,
  notre jeunesse exprime une angoisse profonde dans les lycées comme dans les universités.
  Une inquiétude sur l'avenir, sur les conditions de vie et d'études, sur la capacité
  à s'orienter, à se projeter, à trouver sa place dans la société. L'idée qu'il n'y
  aurait pas de futur désirable en quelque sorte. Je comprends nos lycéens et nos
  étudiants. Ils sont au cœur de mon engagement politique depuis plus de dix ans.
  Leur parole doit être entendue, sans a priori et sans minimiser les difficultés.
  Le travail est déjà engagé par le gouvernement. Le ministre de l'Education nationale
  s’est mobilisé et a mis en place une plateforme qui a recueilli plus de 100 000
  contributions qui s'ajoutent aux réunions tenues au niveau des académies et des
  lycées. Cela nous permettra de construire avec notre jeunesse des réponses adaptées.
  Notre responsabilité est donc double. Entendre la colère et agir sur ses causes
  et faire respecter fermement l'ordre républicain. Nous ne devons ni confondre les
  revendications légitimes avec les violences, ni laisser les violences empêcher que
  ces revendications soient entendues. C'est pourquoi je veux ce soir donner une méthode
  claire. Premièrement, dans le contexte actuel, les préfets prendront les décisions
  en lien avec les maires pour protéger nos villes, nos bâtiments publics et nos commerces,
  y compris en allant jusqu'à interdire quand il le faut certains rassemblements et
  en prenant toute action nécessaire. Deuxièmement, j'appelle l'ensemble des partis
  politiques, des organisations professionnelles et syndicales à condamner sans ambiguïté
  toutes les violences et à appeler au calme. Chacun doit prendre ses responsabilités.
  Le pays a besoin d'ordre, d'apaisement et pas d'une escalade. Le Premier ministre
  réunira dans les prochains jours ces formations afin d'obtenir des positions claires
  et publiques. Troisièmement, Nous ne pouvons pas demander à notre jeunesse de croire
  en l'avenir sans lui donner la possibilité de construire les réponses et d'être
  autour de la table. Oui, il nous faut nous asseoir autour de la table et construire
  ensemble des solutions. Élèves, étudiants, enseignants, représentants des organisations
  patronales et syndicales, collectivités territoriales, parlementaires travailleront
  dès cette semaine avec le gouvernement à des propositions concrètes. Le Premier
  ministre les réunira dans les prochains jours à cet effet. Je veux être ici très
  clair, À l'égard des casseurs et de tous ceux qui se livrent à des violences, nous
  serons intraitables. L'écoute et le dialogue ne signifient ni la faiblesse, ni l'impunité.
  Mes chers compatriotes, nous sommes à six mois de notre élection présidentielle.
  À six mois. Et donc tous ceux qui aujourd'hui vous expliquent que l'urgence est
  d'aller dans la rue, de manifester, de créer le désordre, n'ont qu'un but. Abîmer
  la République et voler le débat. Les choix d'avenir que vous aurez, que nous aurons
  à faire dans six mois, ils sont essentiels. La France est une grande force démocratique.
  Elle mérite ces débats. Ils doivent se faire dans les réunions publiques. Ils doivent
  se faire avec les partis, et non pas dans la rue par la violence. Ils doivent se
  faire dans les journaux, sur les plateaux de télévision, dans les rassemblements
  pacifiques, où l'on parle et l'on s'explique dans le respect, jamais dans le désordre
  et dans la casse. Notre pays mérite une belle élection présidentielle dans six mois.
  C'est aussi maintenant qu'elle se joue, par l'esprit de responsabilité. Oui au dialogue,
  oui à la réponse concrète de court terme et à la préparation des décisions futures.
  Mais non toujours à la violence quelle qu'elle soit. Nous avons besoin d'unité,
