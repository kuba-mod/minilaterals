title: Déplacement au Mondial de l'Auto.
text: 'Le Président de la République s''est rendu le lundi 12 octobre 2026 au Mondial
  de l''Auto, à Paris Expo Porte de Versailles, pour inaugurer cette nouvelle édition.
  Cette visite a été précédée, le dimanche 11 octobre, d''un dîner au palais de l''Élysée
  réunissant une soixantaine d''acteurs de la filière automobile européenne : constructeurs,
  équipementiers, industriels des batteries et des matériaux stratégiques. À l''occasion
  de ce déplacement, le chef de l''État a fixé le cap pour la filière autour de trois
  priorités : Le Président de la République est allé à la rencontre des acteurs de
  la filière sur les stands de Valeo, Renault, Stellantis et de la Fabrique de l''Innovation
  . Il a ensuite présidé une table ronde consacrée au véhicule autonome. Depuis 2017,
  le Président de la République a engagé la transformation de la filière automobile
  : accélération de l''électrification et de la production de véhicules électriques,
  émergence d''une filière française de batteries, modernisation des sites de production.
  Cette stratégie, appuyée par un soutien à l''investissement, à la réindustrialisation
  et à l''accès des ménages aux véhicules électriques, porte ses fruits : la production
  française repart, tirée par l''électrique, et le Made in France progresse. L''enjeu
  est désormais de consolider ces acquis à l''échelle européenne.'
