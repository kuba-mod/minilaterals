title: La France et les Pays-Bas ont tenu leur première réunion du Groupe de pilotage
  nucléaire à Paris.
text: La France et les Pays-Bas ont tenu leur première réunion du Groupe de pilotage
  nucléaire à Paris, le 14 octobre. Lors de son discours à l’Île Longue sur la dissuasion
  nucléaire française, le président de la République a annoncé la mise en place de
  dialogues stratégiques bilatéraux avec les partenaires européens concernés, afin
  d’établir le concept de dissuasion avancée. La France et les Pays-Bas ont tenu leur
  première réunion du groupe de pilotage nucléaire à Paris le 14 octobre. Cette réunion
  a réuni des représentants de l’Élysée et du cabinet du Premier ministre des Pays-Bas,
  accompagnés de responsables des ministères de la Défense et des Affaires étrangères.
  Ils ont échangé sur le renforcement de la coopération bilatérale et de la convergence
  stratégique entre les deux pays. Ils se sont accordés sur les prochaines étapes
  et ont réaffirmé leur ambition pour une Europe plus forte et plus sûre.
