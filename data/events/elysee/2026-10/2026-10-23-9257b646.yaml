title: Disparition de Jean-Paul Huchon.
text: Toute sa vie Jean-Paul Huchon est resté fidèle à l’idée qu’il se faisait du
  socialisme. Inséparable compagnon de route de Michel Rocard, haut fonctionnaire
  devenu maire de Conflans-Sainte-Honorine et président de la Région Île-de-France,
  Jean-Paul Huchon s’est éteint à l’âge de 80 ans. Né à Paris en 1946, diplômé de
  Sciences Po et de l’ENA, il choisit d’embrasser une vie au service de l’État. À
  la direction du Budget d’abord, il rejoint ensuite l’action politique. À l’arrivée
  de la gauche au pouvoir en 1981, c’est auprès de son mentor, Michel Rocard qu’il
  entame un compagnonnage fidèle comme directeur de cabinet au Plan, au ministère
  de l’Agriculture puis à Matignon de 1988 à 1991. Une fidélité politique et d’esprit
  qu’il revendiquera toujours. C’est pourtant la politique locale qu’il affectionna
  le plus. Ancien adjoint de Michel Rocard à la mairie de Conflans-Sainte-Honorine,
  c’est dans cet esprit de fidèle camaraderie qu’il brigua et remporta la mairie en
  1994. Quatre ans plus tard, il se lança à la conquête de la Région Île-de-France.
  Réélu à deux reprises, il en demeurera le Président dix-sept années durant. Jean-Paul
  Huchon en fit un combat pour l’égalité. Un combat et une ambition, pour le logement,
  les lycées, les transports, pour l’équilibre des territoires, pour faire vivre ensemble,
  relier la ruralité, les villes moyennes, la couronne et le Grand Paris. Il affirma
  ainsi la région comme un pôle de rayonnement et d’attractivité. Une région de culture
  aussi. Culture qu’il affectionnait, lui, le passionné invétéré de rock depuis ses
  plus jeunes années. Il fut à l’origine de la création du festival Rock en Seine
  en 2003 et Solidays, deux festivals qui ont trouvé leur place dans la scène culturelle
  francilienne. Jean-Paul Huchon était cet homme de culture, de partage et d’horizons
  heureux. Sa vie fut une histoire de fidélités et de compagnonnages. À Michel Rocard
  bien sûr, à sa ville et à sa région. De Matignon à Conflans-Sainte-Honorine en passant
  par la région, il aura traversé quatre décennies de vie publique française. Le Président
  de la République et son épouse saluent la mémoire d’un grand serviteur de l’État,
  d’un homme généreux qui offrit à ses administrés son ambition de la réforme. Ils
  adressent à son épouse Laurence, à sa famille, à ses proches et à tous ceux qui
  l’aimaient, leurs condoléances les plus émues.
