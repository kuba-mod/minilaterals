title: Déclaration des chefs d’État et de gouvernement du G7 sur la sécurité énergétique
  mondiale et la stabilité des marchés.
text: Nous, chefs d’État et de gouvernement du G7, nous sommes réunis en visioconférence
  pour aborder les risques croissants qui pèsent sur notre sécurité énergétique. Face
  à la volatilité sans précédent des marchés pétroliers, avec une hausse marquée des
  prix qui menace la stabilité économique ainsi que le bien-être de nos populations,
  nous sommes convenus de mesures fermes et coordonnées pour stabiliser l’approvisionnement
  énergétique actuel, protéger les particuliers et les entreprises contre les chocs
  de prix et renforcer la résilience à long terme des systèmes énergétiques mondiaux.
  Nous coordonnerons les programmes de maintenance des raffineries des pays du G7
  pour éviter les arrêts simultanés et, lorsque cela est possible, augmenter temporairement
  le taux d’utilisation des installations. Nous encourageons également la coopération
  avec des pays détenant d’importantes capacités de raffinage afin d’augmenter la
  production mondiale de produits pétroliers raffinés, notamment de diesel, face aux
  pressions que subissent actuellement les marchés dans ce secteur. Le G7 demande
  à l’AIE de suivre la mise en œuvre complète et immédiate des engagements pris en
  mars 2026. À cet égard, en tenant compte des engagements qui ont déjà été remplis,
  nous veillerons à cette mise en œuvre par une libération coordonnée, par l’AIE,
  de 100 millions de barils, qui commencera immédiatement, s’étalera sur une période
  de 4 mois et comprendra un une libération significative dans les 20 premiers jours
  de diesel par les États membres et les pays partenaires du G7. Nous nous réunirons
  dans les jours à venir dans le cadre de l’AIE pour discuter de la possibilité de
  déblocages supplémentaires de diesel en fonction des besoins. Nous réaffirmons notre
  engagement de nous abstenir de restreindre les exportations d’énergie et de produits
  énergétiques entre les pays du G7 et appelons tous les producteurs à s’abstenir
  d’imposer des interdictions qui pourraient exacerber les tensions sur les marchés.
  Nous invitons l’AIE à surveiller les effets de ces mesures sur la sécurité énergétique
  et la stabilité des marchés et à suivre la mise en œuvre des engagements. Un rapport
  de suivi doit être publié sous 20 jours et inclure des recommandations concrètes
  pour améliorer les mesures à prendre à l’avenir, notamment la reconstitution des
  stocks. Nous condamnons les attaques incessantes de l’Iran contre ses voisins et
  sa perturbation du commerce international, de la sécurité énergétique et de l’économie
  mondiale. Nous demandons le rétablissement complet et immédiat des droits et des
  principes de navigation dans le détroit d’Ormuz et nous exprimons notre détermination
  à intensifier nos efforts collectifs dans ce but. Nous saluons les efforts entrepris
  par les États-Unis pour garantir la libre circulation des navires marchands dans
  le détroit d’Ormuz. Nous maintiendrons les sanctions contre la Russie tout en travaillant
  avec l’AIE et nos partenaires internationaux pour éviter de nouvelles répercussions
  sur les marchés des carburants, du gaz et d’autres matières premières. Les inquiétudes
  de nos populations face aux prix de l’énergie restent une préoccupation majeure.
  Nous suivrons attentivement l’évolution de la situation et nous tenons prêts à adapter
  les mesures prises en tant que de besoin. Les accords conclus aujourd’hui marquent
  une étape clé vers un avenir de l’énergie plus sûr, plus transparent et plus résilient.
