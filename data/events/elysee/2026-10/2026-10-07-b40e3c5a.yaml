title: Sommet MED9 en Croatie.
text: 'Le Président de la République s''est rendu au 13e Sommet des pays du Sud de
  l’Union européenne (MED9) le mercredi 7 octobre 2026 à Split, en Croatie. Le sommet
  a réuni les neuf États membres du MED9, la Croatie, Chypre, l’Espagne, la France,
  la Grèce, l’Italie, Malte, le Portugal et la Slovénie , en présence de la Présidente
  de la Commission européenne et du Président du Conseil européen. Les chefs d’État
  et de gouvernement ont échangé sur les grandes priorités de l’agenda européen et
  du Conseil européen d’octobre : Ils ont également abordé les principaux enjeux auxquels
  fait face la région méditerranéenne , notamment en matière de sécurité, de protection
  civile, de préservation des océans et de la biodiversité, de décarbonation et d’énergie.
  Enfin, ils ont évoqué les relations entre l’Union européenne et son voisinage méditerranéen
  , dans un contexte marqué par les tensions au Proche et au Moyen-Orient.'
