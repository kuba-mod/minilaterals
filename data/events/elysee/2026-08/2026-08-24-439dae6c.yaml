title: Compte rendu du Conseil des ministres du 24 août 2026.
text: 'Retrouvez le compte rendu du Conseil des ministres du lundi 24 août 2026. Le
  ministre de l’intérieur a présenté un décret relatif aux compétences du préfet de
  police et du préfet de Corse. Ce texte permet de rénover le cadre d’action des préfets
  concernés et de renforcer la cohérence territoriale de l’action des services de
  l’Etat sur plusieurs départements. Ainsi, le décret permet d’actualiser le cadre
  d’exercice des compétences du préfet de police en matière de sécurité des personnes
  et d’ordre public sur les départements de petite couronne (départements des Hauts-de-Seine,
  Seine-Saint-Denis et Val-de-Marne), ainsi que sur les emprises des aérodromes de
  la plaque parisienne (départements du Val-d''Oise, Seine-et-Marne, Essonne). Il
  prend ainsi en compte plusieurs évolutions législatives récentes relevant tant de
  la loi du 13 juin 2025 relative à la lutte contre le narcotrafic, que de la logique
  des blocs de compétences en matière de polices administratives exercées par la police
  d’agglomération depuis 2010 sur la petite couronne parisienne que du retour d’expériences
  des jeux Olympiques et Paralympiques de Paris 2024. Par ailleurs, le texte modifie
  les articles 79 et 80 du même décret de 2004 afin, de confier au préfet de Corse
  la coordination de l’action des services de l’Etat en Corse en matière de lutte
  contre la criminalité organisée. Par ailleurs, depuis 2023, et plus particulièrement
  depuis la loi contre le narcotrafic, la coordination pour la sécurité en Corse s’est
  recentrée sur la lutte contre la criminalité organisée, exerçant au niveau régional
  un rôle de coordination et de centralisation des informations destinées à organiser
  la réponse de l’Etat. Dès lors, les écritures du décret de 2004 sont adaptées pour
  mieux correspondre à ses nouvelles missions. La ministre de la transition écologique,
  de la biodiversité et des négociations internationales sur le climat et la nature
  et la ministre de l’agriculture, de l’agro-alimentaire et de la souveraineté alimentaire
  ont présenté un projet de décret visant à modifier un décret n° 2018-786 du 12 septembre
  2018 relatif à certaines attributions du préfet coordonnateur du plan national d''actions
  sur le loup. Le loup a fait l’objet d’un déclassement au sein de la Convention de
  Berne le 6 décembre 2024 et au sein de la Directive Habitat Faune Flore le 17 juin
  2025, ce qui permet d’assouplir le cadre de gestion applicable. L’arrêté du 23 février
  2026 en a tiré les premières conséquences et facilite les opérations d’effarouchement,
  les tirs pour défendre les troupeaux et les tirs de prélèvements. Le décret complète
  le cadre applicable afin de garantir la protection des troupeaux et le maintien
  dans un état de conservation favorable du loup. Le décret permet notamment au préfet
  coordonnateur de suspendre par arrêté, sans contrainte calendaire, pour une période
  pouvant aller jusqu’à la fin de l’année, sur les territoires qu''il détermine, les
  décisions des préfets de département relatives à la mise en œuvre des tirs de défense.
  Le projet de décret prévoit également que les décisions des préfets de département
  concernant les opérations de tir menées par les lieutenants de louveterie et les
  agents de l’Office français de la biodiversité puissent être soumises à l’accord
  préalable du préfet coordonnateur. Le conseil des ministres a adopté les mesures
  individuelles suivantes : -    M. Jean-Marc OLERON, administrateur de l’Etat, est
  nommé conseiller maître à la Cour des comptes (hors tour), à compter du 1er octobre
  2026 ; -    M. Jérôme REBOUL, ingénieur des ponts, des eaux et des forêts, est nommé
  conseiller maître à la Cour des comptes (hors tour), à compter du 1er octobre 2026
  ; -    Mme Karine BERGER, ingénieure de la statistique, de l’économie et de la donnée,
  est nommée conseillère maître à la Cour des comptes (hors tour), à compter du 1er
  octobre 2026. Sur proposition du ministre de l’Europe et des affaires étrangères
  : -    Mme    Nathalie    ESTIVAL-BROADHURST, administratrice de l’Etat, est nommée
  directrice générale de l’administration et de la modernisation à l’administration
  centrale du ministère de l’Europe et des affaires étrangères, à compter du 1er septembre
  2026 ; -    M. Adrien ABECASSIS, secrétaire des affaires étrangères, est nommé ambassadeur
  pour le numérique et l’intelligence artificielle. Sur proposition de la ministre
  de la santé, des familles, de l’autonomie et des personnes handicapées : -    M.
  Vincent GAILLOT, administrateur de l’Etat, est nommé délégué interministériel à
  la stratégie nationale pour les troubles du neuro-développement, par intérim. Le
  ministre de l’intérieur a présenté un décret relatif aux compétences du préfet de
