title: Disparition de Yvette Roudy.
text: 'Femme de conviction et de conquête, Yvette Roudy s’est éteinte après une vie
  passée à faire de l’égalité entre les femmes et les hommes un droit effectif. Née
  à Pessac dans une famille modeste, entrée dans la vie active à dix-sept ans comme
  dactylographe, elle reprit ensuite ses études et sut transformer son expérience
  en conscience et sa conscience en combat. En traduisant, en 1964, La Femme mystifiée
  de Betty Friedan, elle contribua à donner aux Françaises des mots pour nommer une
  condition trop longtemps tue. Au sein du Mouvement démocratique féminin, puis dans
  les pages de La Femme du XXe siècle, elle lia dès lors indissociablement la cause
  des femmes et l’action publique. Yvette Roudy avait compris que les consciences
  devaient s’éveiller, mais que les lois devaient suivre. Engagée aux côtés de François
  Mitterrand, elle fut élue au Parlement européen en 1979. Deux ans plus tard, le
  Président de la République lui confia le nouveau ministère des Droits de la femme.
  Ce titre disait déjà la rupture : « la condition féminine » devenait une question
  de droits. De 1981 à 1986, elle fit entrer l’égalité au cœur de l’action gouvernementale.
  Sous son impulsion, la France reconnut officiellement le 8 mars comme Journée internationale
  des droits des femmes et relança l’information sur la contraception. Elle fit prendre
  en charge l’interruption volontaire de grossesse par la Sécurité sociale, afin que
  la liberté conquise par la loi Veil ne demeure réservée à celles qui pouvaient en
  acquitter le prix. Avec la loi du 13 juillet 1983, éponyme, elle donna ensuite une
  force nouvelle au principe d’égalité professionnelle. Accès à l’emploi, formation,
  promotion, rémunération : les discriminations devaient être combattues dans chaque
  dimension de la vie au travail. Elle ne cessa jamais de rappeler la République à
  l’application de ses propres principes. Après le Gouvernement, elle poursuivit ce
  combat dans les mandats que lui confièrent les Français. Députée du Calvados, maire
  de Lisieux de 1989 à 2001, elle porta avec la même énergie l’exigence de justice.
  Dans l’hémicycle comme dans sa ville, elle demeura une élue de conviction, au parler
  franc, que les résistances n’impressionnaient pas. La parité fut l’autre grand chantier
  de sa vie. En fondant l’Assemblée des femmes, puis en réunissant autour du « Manifeste
  des dix » des responsables venues de sensibilités différentes, elle contribua à
  préparer les conquêtes constitutionnelles et législatives qui ouvrirent davantage
  la vie publique aux femmes. Jusqu’à ses dernières années, par ses livres, ses prises
  de parole et la Fondation Yvette Roudy, elle continua de soutenir celles qui prolongeaient
  son œuvre. Le titre qu’elle donna à son dernier ouvrage résumait sa fidélité : Lutter
  toujours. Son inlassable faculté d’indignation continuera d’inspirer celles et ceux
  qui refusent que l’égalité demeure inachevée. Son courage, lui, nous oblige. Le
  Président de la République et son épouse saluent la mémoire d’une pionnière, d’une
  grande figure du féminisme et adressent leurs condoléances émues à sa famille, à
  ses proches, à celles et ceux qui luttèrent à ses côtés, ainsi qu’aux habitants
  de Lisieux et du Calvados qu’elle servit.'
