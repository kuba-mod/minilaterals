title: Réunion de la Coalition des Volontaires en visioconférence.
text: Le Président de la République a co-présidé ce lundi, avec le Premier ministre
  britannique et le Chancelier allemand, une réunion en format hybride de la Coalition
  des Volontaires. Dans la continuité du Sommet de la Coalition des Volontaires et
  de la première réunion de la Coalition antibalistique qui se sont tenus à Paris
  le 13 juillet dernier, les dirigeants ont réitéré leur détermination à renforcer
  leur soutien à l'Ukraine pour qu'elle puisse se défendre face à l'agression de la
  Russie . Les dirigeants ont également réaffirmé leur détermination à renforcer la
  pression exercée sur la Russie , alors que celle-ci continue de refuser la paix
  et fait le choix de poursuivre ses frappes contre les civils. Cette réunion enfin
  permis de poursuivre les travaux relatifs aux garanties de sécurité afin de contribuer
  à l'établissement d'une paix juste, robuste et durable en Ukraine, dans la continuité
  de la Déclaration de Paris du 6 janvier 2026. Cette réunion, qui s'est tenue symboliquement
  le jour du 35e anniversaire de la célébration de l’indépendance de l’Ukraine , sera
  l’occasion de réaffirmer notre soutien résolu au peuple ukrainien et à son combat
  pour préserver la souveraineté et l'indépendance de leur pays. Déclaration des Co-Présidents
  de la Coalition des volontaires.
