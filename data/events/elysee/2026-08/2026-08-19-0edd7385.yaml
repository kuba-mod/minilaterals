title: Disparition de François Patriat.
text: Président du groupe RDPI au Sénat, ancien ministre, président de région, élu
  de terrain, François Patriat s’est éteint. Avec lui, la Nation perd une grande figure
  de sa vie politique et parlementaire, passionnément attachée à ses idéaux de progrès,
  de liberté et de conciliation. Il vit le jour en 1943 dans une famille d’agriculteurs,
  à Semur-en-Auxois, en Côte-d’Or. Très tôt, il cultiva un attachement indéfectible
  à cette terre. Après des études en philosophie puis à l’École nationale vétérinaire
  d’Alfort, il devint vétérinaire – métier qu’il exerça jusqu’en 1981. Il aimait parcourir
  les communes bourguignonnes, aller auprès des habitants et de leurs animaux, donner
  un soin. François Patriat était un homme de terrain autant qu’un homme de conviction.
  Mendésiste, rocardien, soixante-huitard, il rêvait d’une France qui réforme, qui
  concilie et qui a le courage de la vérité. En 1976, il conquit alors son premier
  mandat comme conseiller général de la Côte-d’Or, dans le canton de Pouilly-en-Auxois.
  En 1981, il fut élu comme député de la Côte-d’Or, puis réélu en 1986, 1988 et 1997.
  Fort de son expérience professionnelle et de sa connaissance intime du monde rural,
  il défendit notamment la loi d’orientation agricole du gouvernement Jospin, attaché
  à ce que l’agriculture ait un rôle social et environnemental. Son sens de la nuance
  et du compromis lui permirent aussi de mettre au point un rapport pour une chasse
  responsable et apaisée, dans un contexte de fortes tensions entre chasseurs et écologistes.
  Entré au gouvernement en 2000, comme secrétaire d’État aux Petites et Moyennes Entreprises,
  au Commerce, à l’Artisanat et à la Consommation, il devint en 2002 ministre de l’Agriculture
  et de la Pêche, retrouvant ce monde rural dont il connaissait les inquiétudes comme
  les exigences. Il n’avait jamais cessé de porter la Bourgogne dans son cœur et savait
  en défendre les intérêts. Alors il présida le conseil régional de Bourgogne de 2004
  à 2015. Il accompagna la région dans ses mutations, toujours fidèle à sa méthode
  – pragmatique et directe. Il était de ces artisans du dépassement des clivages,
  favorable à l’esprit d’entreprendre, attaché à la liberté, à la protection autant
  qu’à l’unité. Il s’engagea dès 2016 et sans relâche pour En Marche. Il fut à tout
  instant un compagnon de route loyal de cette aventure, dans les victoires comme
  dans les épreuves. En 2017, il devint président du groupe LREM puis RDPI au Sénat.
  Là, il défendit inlassablement une certaine idée de la France, bâtit un à un les
  compromis, et tissa des liens de travail, d’amitié et de fidélité dans l’hémicycle.
  Après avoir annoncé qu’il ne briguerait pas un quatrième mandat, il avait fait ses
  adieux émus aux sénateurs en juillet. Ceux qui le connaissaient regretteront son
  franc-parler, sa perspicacité et son humour. Le Président de la République et son
  épouse s’inclinent devant la mémoire de François Patriat, qui servit pendant un
  demi-siècle la France, son Parlement et ses territoires, avec détermination et dévouement.
  Ils adressent leurs condoléances à sa famille, à ses proches, ainsi qu’à tous ceux
  qui, au Parlement comme ailleurs, ont cheminé à ses côtés.
