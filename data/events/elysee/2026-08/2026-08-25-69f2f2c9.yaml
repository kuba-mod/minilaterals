title: Déclaration commune de la France et de l'Arabie saoudite à l'occasion de la
  visite de Son Altesse Royale le Prince Mohammed ben Salmane ben Abdelaziz Al Saoud,
  Prince héritier et Premier ministre du Royaume d'Arabie saoudite, en République
  française.
text: 1.    M. Emmanuel Macron, président de la République française, et Son Altesse
  Royale Mohammed ben Salmane ben Abdelaziz Al Saoud, Prince héritier et Premier ministre
  du Royaume d’Arabie saoudite, ont réaffirmé, lors de leur rencontre du 24 août 2026,
  leur ambition concernant le « partenariat stratégique » qui lie désormais la République
  française et le Royaume d’Arabie saoudite. Ils ont tout particulièrement souligné
  la profondeur historique des relations entre la France et l’Arabie saoudite à l’occasion
  du centenaire de l’établissement des relations politiques entre les deux pays. 2.  
   Ils ont réaffirmé leur ambition commune de voir le partenariat stratégique entre
  la France et l’Arabie saoudite, annoncé lors de la visite d’État du président de
  la République française au Royaume d’Arabie saoudite du 2 au 4 décembre 2024, donner
  un nouvel élan à l’amitié, à la confiance et au respect mutuel entre les deux pays,
  et répondre à leurs intérêts communs ainsi qu’aux défis auxquels sont confrontés
  le monde et la région du Moyen-Orient. 3.    Dans cet esprit, les deux dirigeants
  ont présidé la première réunion du Conseil de partenariat stratégique franco-saoudien.
  À cette occasion, ils ont lancé de nouvelles initiatives, dont les détails figurent
  dans le procès-verbal du Conseil, visant à renforcer les liens dans tous les domaines
  de coopération. 4.    Les deux dirigeants ont exprimé leur vision commune pour la
  stabilité au Moyen-Orient, fondée sur la souveraineté des États, le respect du droit
  international et la recherche de solutions politiques et diplomatiques aux conflits
  et aux menaces pour la sécurité. En ce qui concerne l’Iran, ils ont souligné la
  nécessité d’une solution négociée pour éviter toute nouvelle escalade et garantir
  la sécurité régionale. Ils ont réaffirmé leur engagement de longue date en faveur
  d’une solution diplomatique garantissant le caractère pacifique du programme nucléaire
  iranien. Ils ont appelé l’Iran à reprendre une pleine coopération avec l’Agence
  internationale de l’énergie atomique. Les deux parties ont condamné les attaques
  contre des navires dans le détroit d’Ormuz et les menaces sur la sécurité des voies
  navigables et ont souligné l’importance de rétablir la navigation dans le détroit
  d’Ormuz dans son état normal tel qu’il était avant le 28 février 2026, en termes
  de liberté de navigation, de trafic maritime régulier et d’absence de tout péage
  direct ou indirect, ainsi que de restrictions de passage, conformément au droit
  international. La France et l’Arabie saoudite ont salué l’annonce d’un accord sur
  le désarmement du Hamas et ont appelé à sa mise en œuvre. Les deux parties ont souligné
  la nécessité de créer les conditions d’un cessez-le-feu durable, en garantissant
  l’acheminement urgent, sûr et sans entrave de l’aide humanitaire aux civils de Gaza.
  Elles ont également insisté sur l’importance de préserver l’unité des territoires
  palestiniens et ont rejeté toute tentative visant à porter atteinte au droit du
  peuple palestinien à établir son État indépendant à l’intérieur des frontières de
  1967. La France et l’Arabie saoudite ont appelé à la fin de la politique de colonisation
  israélienne et des violences commises par les colons, qui menacent la solution à
  deux États, et ont réitéré leur engagement en faveur de la mise en œuvre intégrale
  de la Déclaration de New York. Les deux parties ont réaffirmé leur soutien à l’agenda
  de réformes de l’Autorité palestinienne et se sont félicitées de l’annonce d’élections
  législatives et présidentielles en Palestine. La France et l’Arabie saoudite sont
  convenues d’intensifier leurs efforts en vue d’un règlement définitif du conflit
  au Liban, qui doit passer par le renforcement de l’État libanais et de ses institutions,
  ainsi que par la préservation de la souveraineté et de l’intégrité territoriale
  du Liban. Elles ont salué les mesures prises par Son Excellence le président de
  la République libanaise, Joseph Aoun, et par le gouvernement libanais, dirigé par
  le Premier ministre Nawaf Salam, pour reconstruire les institutions de l’État et
  étendre l’autorité de celui-ci. Elles ont également réaffirmé leur engagement à
  soutenir les Forces armées libanaises et les forces de sécurité, afin de leur permettre
  d’assumer pleinement leurs responsabilités nationales. Elles ont souligné l’importance
  de la mise en œuvre intégrale de la résolution 1701 du Conseil de sécurité des Nations
  unies et la nécessité de mener à bien le désarmement de tous les groupes armés non
  étatiques. Elles ont également insisté sur la nécessité pour Israël de se retirer
  de l’ensemble du territoire libanais. Elles ont réaffirmé leur soutien au Conseil
  présidentiel du Yémen et aux efforts des Nations unies pour parvenir à une solution
  inclusive et globale à la crise. Elles ont condamné les attaques menées par les
  Houthis contre des infrastructures civiles et des installations vitales du Royaume,
  ainsi que leurs attaques contre des navires. Elles ont affirmé leur détermination
  à préserver la liberté de navigation. Elles ont également souligné que les provocations
  des Houthis aggravaient les souffrances du peuple yéménite. La partie française
  a affirmé sa solidarité et son soutien total au Royaume d’Arabie saoudite, et a
  souligné son rejet de toute attaque contre le territoire du Royaume. Concernant
  le Soudan, les deux parties ont souligné l’importance d’intensifier les efforts
  visant à mettre fin à la crise et à faire cesser toute ingérence étrangère au Soudan,
  garantissant ainsi sa sécurité et sa stabilité, préservant sa souveraineté et son
  indépendance, et sauvegardant son intégrité territoriale et l’intégrité de ses institutions.
  Les deux parties ont réaffirmé leur engagement en faveur de l'unité, de la stabilité
  et de la reprise économique de la Syrie. Elles ont souligné l'importance d'un cadre
  institutionnel solide, propice à l'intensification des investissements économiques,
  ainsi que l'opportunité de repositionner la Syrie comme un pont entre l'Europe,
  le Golfe et l'Asie grâce à la mise en place de corridors alternatifs. Elles se sont
  tout particulièrement félicitées de la création d'un conseil d'affaires saoudo-syrien-français.
  5.    Dans le prolongement de leur coopération historique en matière de défense,
  elles ont adopté une déclaration renforçant leur coopération de défense, notamment
  dans les domaines de l’armement et de la formation. Elles se sont engagées à intensifier
  leur coordination afin de servir leurs intérêts communs et de contribuer à la sécurité
  et à la stabilité mondiales. 6.    Les deux parties ont salué la solidité des liens
  économiques et commerciaux entre leurs deux pays, soulignant la croissance des échanges
  bilatéraux, qui se sont élevés à environ 11,8 milliards de dollars en 2025. 7.  
   Dans le secteur de l’énergie, les deux parties ont souligné l’importance de la
  stabilité des marchés énergétiques mondiaux, de la sécurité d’approvisionnement
  et de la protection des voies maritimes, tout en saluant le rôle et les efforts
  du Royaume visant à renforcer la résilience des chaînes d’approvisionnement et la
  durabilité des sources d’énergie. Elles ont également souligné la nécessité de renforcer
  la coopération stratégique dans les domaines du pétrole et de la pétrochimie, de
  la production d’électricité durable, de l’efficacité énergétique, des énergies renouvelables,
  du stockage de l’énergie, de l’énergie nucléaire à des fins pacifiques, de l’hydrogène
  propre et des technologies de réduction et d’élimination des émissions, ainsi que
  du renforcement des capacités dans ces domaines. Les deux parties ont également
  souligné l’importance de la coopération sur les questions climatiques et les solutions
  technologiques associées. Elles ont par ailleurs salué les relations commerciales
  existantes et les projets communs entre les deux pays, ainsi que la nécessité de
  les renforcer. 8.    La France étant devenue un investisseur de premier plan en
  Arabie saoudite, notamment dans des secteurs tels que l’énergie, la gestion de l’eau,
  les transports et la logistique, les deux pays sont convenus de renforcer leurs
  liens économiques et leurs investissements réciproques. Ils ont souligné l’importance
  de renforcer la coopération entre les institutions financières et les organismes
  d’assurance et de financement des deux pays. À cet égard, les deux pays saluent
  l’ambition de la société d’investissement Qiddiya de développer à Cergy-Pontoise,
  en Île-de-France, un grand complexe à usage mixte comprenant plusieurs parcs, qui
  réunira divertissement, loisirs, hôtellerie, culture et sport au sein d’une nouvelle
  destination intégrée. Les ambitions actuelles prévoient jusqu’à trois grandes attractions
  phares, des hôtels et des expériences de loisirs complémentaires, pour un montant
  total d’environ 6 milliards d’euros sur l’ensemble du cycle de développement. Les
  deux parties conviennent également de mettre en place un cadre financier dédié et
  efficace pour soutenir les projets menés par des entreprises françaises en Arabie
  saoudite. Les deux parties sont convenues d’approfondir leur coopération dans les
  domaines de l’intelligence artificielle, de l’informatique quantique, des technologies
  émergentes et du renforcement des capacités. 9.    Symbole de la solidité de ce
  partenariat, l’Arabie saoudite et la France ont réaffirmé l’importance de leur coopération
  exceptionnelle autour du projet d’Al Ula, dans le cadre de la Vision 2030 du Royaume,
  notamment dans les domaines de l’archéologie, du patrimoine et de la culture. À
  cet égard, elles ont décidé de prolonger le partenariat franco-saoudien sur Al Ula
  jusqu’en 2035 et d’élaborer un cadre évolué qui reflète la maturité de la coopération
  entre les deux pays et s’appuie sur les opportunités qu’offre Al Ula en tant que
  destination culturelle et patrimoniale majeure du XXIe siècle. La France et l’Arabie
  saoudite, satisfaites du succès de la troisième Coupe du monde d’E-Sport qui s’est
  tenue à Paris durant l’été 2026, ont réaffirmé leur engagement à renforcer encore
  leur coopération et leur partenariat dans les domaines de la culture, de la jeunesse
  et du sport, tout en développant des programmes et des activités conjoints entre
  les deux pays. 10.    Dans le cadre de l’Exposition Riyad 2030 organisée par l’Arabie
  saoudite, le président de la République et Son Altesse Royale le Prince héritier
  se sont félicités de la participation de la France à cet événement historique pour
  l’Arabie saoudite. Ils sont convenus d’en faire un temps fort des relations franco-saoudiennes,
  notamment en associant les acteurs concernés des deux côtés. 11.    Au cours de
  cette visite, plusieurs accords et protocoles d’accord ont été signés dans les domaines
  de la défense, de la santé, de l’intelligence artificielle, des technologies émergentes
  et du divertissement. 12.    Les deux parties se sont félicitées des résultats de
  la Table ronde franco-saoudienne sur l’investissement, qui s’est achevée en présence
  de Son Altesse Royale le Prince héritier et Premier ministre, et de Son Excellence
  Emmanuel Macron, président de la République française. Cette table ronde a réuni
  plusieurs grands dirigeants d’entreprise et représentants des secteurs privés saoudien
  et français afin de discuter de projets communs et des perspectives futures de coopération
  entre les deux pays. Elle a également examiné les opportunités de coopération et
  d’investissement dans un certain nombre de secteurs clés, notamment l’énergie, l’industrie,
  les services financiers, les transports et la logistique, la santé, la culture,
  le tourisme et l’intelligence artificielle. Les deux parties se sont en outre félicitées
  de l’annonce de plus de 22 accords et protocoles d’accord, qui reflètent le partenariat
  économique croissant entre les deux pays et ouvrent de nouvelles voies de coopération
  et d’investissement conjoint.
