title: Disparition de Jean-François Leroy.
text: 'Défenseur acharné du photojournalisme et infatigable avocat du réel, Jean-François
  Leroy s’est éteint après une vie passée à faire des images une manière de voir le
  monde et de témoigner de ses blessures. Enfant, il s’était passionné pour la prestidigitation.
  Il découvrit par la suite une autre chambre noire, celle du laboratoire photographique
  de La Vie catholique, où travaillait sa tante. Après quelques études de médecine,
  il choisit le journalisme, passa par Photo-Reporter, Photo-Revue et Photo Magazine,
  dont il devint rédacteur en chef, et réalisa ses premiers reportages pour Sipa Press.
  Jugeant sans indulgence ses propres photographies, il décida bientôt de consacrer
  sa vie à celles des autres. En 1989, avec le soutien de Roger Thérond, légendaire
  directeur de Paris Match, il lança à Perpignan un pari auquel peu croyaient encore :
  consacrer un festival entier à la photographie d’information. Visa pour l’Image
  était né. D’une première édition réunissant quelques dizaines de professionnels,
  il fit, en près de quarante ans, le grand rendez-vous mondial du photojournalisme.
  Mais Visa était plus qu’un festival. Jean-François Leroy en avait fait une maison,
  une place publique, parfois un refuge pour une profession qu’il vit se fragiliser.
  Il dénonça sans relâche tout ce qui menaçait la possibilité même de témoigner. À
  Perpignan, des générations de photographes trouvèrent un éditeur, une commande,
  une reconnaissance et, souvent, un défenseur. Jean-François Leroy avait ses colères,
  ses enthousiasmes, ses fidélités et ses partis pris. Entier, rétif aux modes comme
  aux prudences, il assumait ses choix au nom d’un humanisme revendiqué. Il choisissait
  le camp de celles et ceux que les guerres, les dictatures, la misère ou l’exil condamnent
  trop souvent à disparaître deux fois : du monde, puis de nos regards. Il savait
  qu’une photo n’a jamais arrêté une guerre. Il savait aussi qu’elle peut empêcher
  de prétendre que l’on ne savait pas. C’est pourquoi, année après année, Visa montra
  les conflits, les révolutions, les catastrophes, mais aussi les solidarités et les
  vies ordinaires ; et rendit hommage à ceux qui risquaient, parfois perdaient, leur
  vie pour témoigner sur les théâtres de guerre. Derrière son franc-parler, ses coups
  de gueule et son allure reconnaissable entre toutes, Jean-François Leroy portait
  une conviction profondément démocratique : une société libre a besoin de journalistes
  qui aillent voir pour elle. Ce combat était devenu plus urgent encore à l’heure
  des réseaux sociaux et de l’intelligence artificielle. Pour cette trente-huitième
  édition de Visa, il mettait en garde contre les images fabriquées et les « fossoyeurs
  du réel ». Face à eux, il défendait inlassablement les faits vérifiés, les journalistes
  professionnels et la présence sur le terrain. Son dernier livre portait un titre
  qui résumait son existence : Le devoir de regarder. Jean-François Leroy nous quitte
  alors que s’ouvrait à Perpignan la semaine professionnelle de ce festival qu’il
  appelait son « bébé ». Trop malade, il n’avait pu le rejoindre une dernière fois.
  Mais son combat demeure sur ses cimaises, dans ses projections et dans le regard
  de tous ceux auxquels il apprit à ne jamais détourner les yeux. Le Président de
  la République et son épouse saluent la mémoire d’un journaliste passionné, d’un
  infatigable défenseur du photojournalisme et adressent leurs condoléances émues
  à sa famille, à ses proches, aux équipes de Visa pour l’Image ainsi qu’à tous les
  photographes dont il fut l’ami et l’avocat.'
