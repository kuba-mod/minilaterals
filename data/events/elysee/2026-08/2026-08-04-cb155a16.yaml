title: Disparition de Kavinsky.
text: 'Grande figure de la musique électronique et de la French touch, voix singulière
  qui avait fait danser et rêver, Kavinsky s’est éteint. Né Vincent Belorgey, il grandit
  en Seine-Saint-Denis dans une famille modeste. Son enfance fut bercée par la culture
  japonaise, les jeux vidéo et la musique – des imaginaires qui résonnaient déjà de
  concert. À la maison des jeunes et de la culture de son quartier, il s’initia au
  piano. Après avoir obtenu un brevet de technicien dessinateur-maquettiste, il connut
  plusieurs emplois. Il travailla au service courrier de Manpower, comme peintre de
  figurines de baby-foot ou manutentionnaire dans un centre commercial. C’est pendant
  son service militaire qu’il découvrit la musique électronique, cette pulsation qui
  allait rythmer son existence. Il était de ces artistes qui font de chaque rencontre
  une possibilité artistique. Celle avec Quentin Dupieux fut décisive : elle le conduisit
  à faire ses débuts d’acteur dans « Nonfilm », premier moyen-métrage de son ami,
  aux côtés de Sébastien Tellier. Après plusieurs apparitions à l’écran, il commença,
  en 2005, à produire ses propres morceaux. Naquit alors un univers musical, mais
  aussi un personnage : Kavinsky, alter ego auquel il donna bientôt une histoire.
  Celle d’un jeune conducteur mort au volant de sa Ferrari Testarossa en 1986, puis
  revenu d’entre les morts vingt ans plus tard. Le premier morceau de l’artiste, «
  Testarossa Autodrive », contribua à créer la légende. En 2006, son premier EP, «
  Teddy Boy », puis, l’année suivante, « 1986 », imposèrent une signature : un son
  rétrofuturiste, nourri des bandes originales de films et de jeux vidéo des années
  1980. En 2007, cette musique nocturne passa sous les projecteurs lorsque Daft Punk
  l’invita à ouvrir sa tournée mondiale, aux côtés notamment de SebastiAn. Kavinsky
  créa ensuite « Nightcall » – single magnétique, au succès immense, choisi pour figurer
  dans le film « Drive ». Propulsé sur le devant de la scène électronique, le DJ sortit
  en 2013 son premier album studio, « OutRun », nommé en hommage au jeu vidéo éponyme
  des années 1980. Après une décennie de silence, Kavinsky revint en 2022 avec son
  deuxième album studio, « Reborn ». Invité à la Fête de la musique à l’Élysée en
  2018, il porta en 2024 son titre emblématique « Nightcall » jusqu’à la cérémonie
  de clôture des Jeux olympiques de Paris, aux côtés d’Angèle et du groupe Phoenix.
  Ce soir-là, la musique électronique française résonna devant le monde entier. Le
  Président de la République et son épouse saluent la mémoire d’un artiste français
  à la présence, au style et aux sonorités reconnaissables entre tous. Ils adressent
  à sa famille, à ses proches et à tous ceux que sa musique aura accompagnés leurs
  condoléances émues.'
