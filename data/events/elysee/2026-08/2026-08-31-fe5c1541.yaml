date: '2026-08-31'
type: press_release
source_name: elysee
title: Déplacement en Suède.
text: Le Président Emmanuel Macron s'est rendu à Stockholm ce lundi pour participer
  à la cérémonie de signature du contrat d’acquisition par la Suède de quatre frégates
  de défense et d’intervention produites par Naval Group. D’un montant de 4,3 milliards
  d’euros , cet accord prévoit la livraison d’une première frégate en 2030. Un accord-cadre
  destiné à renforcer la coopération franco-suédoise dans les domaines opérationnel,
  capacitaire et industriel a également été signé à cette occasion. Cette visite a
  marqué une nouvelle étape dans l’approfondissement du partenariat stratégique entre
  la France et la Suède et de la coopération en matière de sécurité et de défense
  entre nos deux pays, qui contribuera au renforcement de la défense européenne comme
  à celui de l’Alliance atlantique. Merci beaucoup, Monsieur le Premier ministre,
  cher Ulf. Mesdames, Messieurs les ministres, Mesdames, Messieurs en vos grades et
  qualités. Je veux avant toute chose remercier Monsieur le Premier ministre de m'avoir
  invité à Stockholm aujourd'hui, à cette cérémonie si importante pour nos deux pays,
  et par laquelle nous scellons une coopération stratégique majeure dans le domaine
  de la défense. Vous venez de le rappeler, et merci, commandant, de nous accueillir
  sur cette frégate. En effet, nous scellons une coopération majeure et réciproque,
  respectueuse et ambitieuse, après la décision et le choix fait par la France en
  décembre dernier d'acquérir l'avion de surveillance et de commandement suédois GlobalEye
  produit par Saab, la Suède a fait le choix en mai dernier d'acquérir quatre frégates
  de défense et d'intervention françaises produites par Naval Group et équipées de
  missiles Aster pour donner à la marine suédoise des capacités de premier plan d'ici
  2030. Ceci montre à quel point ce que nous signons aujourd'hui, ce sont évidemment
  des équipements avec la meilleure technologie. Ce sont des systèmes de défense et
  de combat pleinement intégrés, avec les senseurs et avec les capacités les plus
  modernes, mais c'est aussi une coopération stratégique entre nos deux pays. Je dois
  dire qu'après la visite d'État réalisée en 2024 en Suède, je suis heureux de revenir
  à Stockholm et de mesurer le saut exceptionnel que le renouvellement de notre partenariat
  stratégique a produit. Je veux ici remercier très chaleureusement le gouvernement
  suédois et vous-même, Monsieur le Premier ministre, pour la confiance et votre vision
  claire. Ce choix va bien au-delà d'un contrat commercial. C'est un acte de confiance
  politique qui marque une étape historique dans la coopération entre nos deux pays
  et que tous ceux qui y ont contribué en soient grandement remerciés aujourd'hui.
  L'accord-cadre de gouvernement à gouvernement signé par nos ministres à l'instant
  traduit cet engagement et recouvre l'ensemble de nos domaines de coopération de
  défense, opérationnels, capacitaires, industriels, et ouvre la voie à un accord
  de défense structurant entre nos deux pays. Ce signal réciproque franco-suédois
  est aussi un choix de souveraineté européenne en matière de capacité de défense.
  Parce qu'en effet, vous venez de le rappeler en soulignant l'importance pour vos
  propres chantiers, nous venons ainsi renforcer la base industrielle et technologique
  de défense européenne au moment où les Européens doivent prendre davantage la responsabilité
  de leur propre sécurité, consolider le pilier européen de l'OTAN. Par cet achat
  croisé, par aussi tous les autres projets que nous avons, dont nous avons commencé
  à discuter et que nous allons continuer ensemble, nous voyons bien que nous avons
  la capacité de mieux intégrer nos bases industrielles, de créer un écosystème de
  défense européen qui soit plus résistant dans la durée, plus indépendant, plus compétitif,
  et qui permette à l'Europe d'être pleinement souveraine pour aujourd'hui et pour
  demain. La Suède et la France, dans l'Union européenne et dans l'OTAN, prouvent
  ainsi que la souveraineté européenne se construit ensemble. La réussite de ce partenariat
  avec la Suède nous encourage à ce que d'autres alliés nous rejoignent, en particulier
  pour consolider sur la signature du jour, afin de vraiment bâtir une flotte de frégates
  européennes interopérables. C'est l'objectif si nous voulons définir un standard
  européen plus efficace sur le plan industriel, plus efficace sur le plan opérationnel.
  La Grèce a rejoint ce club et nous souhaitons que d'autres pays européens nous suivent
  sur cette voie. La signature des accords d'aujourd'hui et les échanges, tout ce
  que nous avons construit ces dernières années, marquent aussi notre volonté ensemble
  de nous engager pour la sécurité Baltique, Nordique et Arctique. Nous le manifestons
  par les déploiements engagés dans les pays de la région. En Arctique, nous participons
  ensemble, aux côtés de nos amis danois, aux opérations Arctic Sentry pour justement
  réduire la tension dans la zone arctique, sujet ô combien important pour nous tous
  Européens et pour la souveraineté de nos amis danois. Et nous participons, aux côtés
  de nos amis finlandais, au FLF, pour laquelle la Suède est nation cadre. Les armées
  françaises sont très fières de contribuer à cet effort sous commandement suédois.
  Et puis, en équipant les frégates suédoises de missiles Aster et possiblement de
  missiles de croisière naval, la France ne livre pas seulement des navires, elle
  apporte aussi une capacité de protection des territoires de nos alliés. L'ensemble
  de ces opérations conjointes, de ces capacités conjointes vient donner corps aussi
  à ce qu'on appelle l'épaulement de la dissuasion nucléaire avancée, sur laquelle
  nous agissons aussi ensemble. En effet, cette défense antimissile que je viens d'évoquer,
  dans laquelle nous faisons œuvre commune à travers cet accord, contribue directement
  à l'épaulement de la dissuasion avancée. Nous l'avons proposé il y a quelques mois.
  La Suède a souhaité être associée à cette dissuasion avancée. Et nous travaillons
  ensemble sur ce sujet qui est une contribution importante à la stabilité stratégique
  de notre Europe. Au fond, nous sommes en train de bâtir un cadre stratégique inédit.
  Nous nous donnons les moyens d'agir ensemble. Nous avons des exercices et des déploiements
  communs. Nous avons du capacitaire en commun et nous avons de l'industriel en franco-suédois.
  Ceci montre la force et l'importance de ce pilier européen de la défense et combien
  la coopération franco-suédoise est en train de devenir, eh bien, un élément essentiel
  de ce pilier européen. À l'occasion de cette visite, nous allons également aborder
  avec Monsieur le Premier ministre les autres enjeux bilatéraux qui lient la Suède
  et la France, de l'énergie à l'espace, de l'innovation à l'éducation. Je remercie
  les élèves qui étaient à nos côtés à l'instant, ainsi que nos enjeux européens et
  internationaux pour renforcer toujours cette souveraineté européenne. C'est ce que
  nous faisons en renforçant notre action commune en soutien à l'Ukraine, notamment
  dans le cadre de la coalition des volontaires, mais également dans le cadre des
  opérations que nous menons contre la flotte fantôme. Je veux dire à cet égard que
  la Suède et la France sont parmi les nations qui ont le plus contribué à cet effort
  – par le renforcement de notre compétitivité et de notre unité face aux chocs économiques,
  commerciaux, industriels et technologiques auxquels nous devons faire face, avec
  des concurrents de plus en plus agressifs, et puis avec le renforcement de nos actions
  pour protéger nos démocraties et notre jeunesse, afin d'affirmer une régulation
  européenne du numérique qui assure le respect de nos valeurs, la santé et l'épanouissement
  de nos jeunes et l'intégrité de nos processus électoraux. En 2027, nous célébrerons
  le dixième anniversaire du partenariat stratégique franco-suédois. Je veux ici vous
  dire combien je suis déterminé à continuer à développer notre relation de confiance
  et de proximité dans tous les domaines, et en particulier la défense. Mon épouse
  et moi-même avions été honorés d'être invités en 2024 en visite d'État en Suède,
  aussi pour marquer l'ambition que nous portons d'aller encore plus loin avec votre
  pays, nous serons très heureux d'inviter les souverains suédois en visite d'État
  en France au début de l'année prochaine pour poursuivre cette œuvre commune. Monsieur
  le Premier ministre Ulf, merci infiniment pour la confiance et le partenariat décidé.
  Nous l'avons éminemment renforcé durant les huit derniers mois à travers ces décisions
  réciproques. Les signatures d'aujourd'hui sont une étape importante pour la Suède,
  pour la France et pour notre Europe. Merci à vous. Merci beaucoup, Monsieur le Premier
