title: Le Conseil constitutionnel a rendu plusieurs décisions importantes.
text: 'Le Conseil constitutionnel a rendu aujourd’hui et ces derniers jours plusieurs
  décisions importantes. La loi d’urgence pour la protection et la souveraineté agricole
  et la loi dite « RIPOST », visant à offrir des réponses immédiates aux phénomènes
  troublant l’ordre public, la sécurité et la tranquillité de nos concitoyens, ont
  été largement validées. Elles répondent à des priorités fortes portées par le Gouvernement
  et aux attentes des Français. La loi de programmation militaire pour les années
  2024 à 2030, la loi relative au droit à l’aide à mourir et la loi visant à protéger
  les mineurs des risques auxquels les expose l’utilisation des réseaux sociaux, qui
  avaient fait l’objet d’engagements pris par le Président de la République devant
  les Français, ont, elles aussi, donné lieu à des décisions détaillées. S’agissant
  de la loi de programmation militaire, le Conseil constitutionnel a validé le texte
  dans son ensemble, y compris les dispositions relatives au service national. Dans
  un contexte géopolitique toujours plus violent et incertain, où la capacité des
  nations à assurer pleinement leur défense est plus cruciale que jamais, cette loi,
  qui concrétise le doublement en dix ans du budget des armées, permettra à la France
  de continuer à disposer de l’armée la plus efficace d’Europe, au bénéfice de la
  sécurité de ses concitoyens comme de celle du continent. La décision relative à
  la loi sur le droit à l’aide à mourir parachève un débat démocratique exemplaire,
  commencé avec l’avis du Comité consultatif national d’éthique et celui de la Convention
  citoyenne sur la fin de vie, poursuivi lors des différentes lectures à l’Assemblée
  nationale et au Sénat et conclu par la saisine du Conseil constitutionnel. En validant
  les dispositions essentielles de la loi tout en formulant les précisions qui relèvent
  de son office, le Conseil consolide l’équilibre du texte adopté par le Parlement.
  En reconnaissant la conformité de cette loi aux principes et aux valeurs de la Constitution,
  le Conseil constitutionnel apporte une garantie essentielle à nos concitoyens. Il
  est désormais possible de se tourner vers la mise en œuvre de cette réforme avec
  la certitude qu’elle repose sur des fondements démocratiques, éthiques et constitutionnels
  pleinement établis. Parallèlement, la loi du 26 mai 2026 visant à garantir l’égal
  accès de tous à l’accompagnement et aux soins palliatifs permettra le développement
  des soins palliatifs et la mise en œuvre de la stratégie nationale des soins d’accompagnement.
  Enfin, la loi visant à protéger les mineurs des risques auxquels les expose l’utilisation
  des réseaux sociaux a fait l’objet de critiques de la part du Conseil. Alors que,
  sous l’impulsion de la France, plus d’une trentaine d’États dans le monde entier
  s’orientent vers l’interdiction des réseaux sociaux aux plus jeunes dans les mois
  à venir et que la Commission européenne travaille sur une harmonisation de ces dispositions
  pour l’Union, l’objectif poursuivi depuis 2017 par le chef de l’État sur la protection
  des mineurs en ligne demeure inchangé : protéger l’intérêt supérieur et la santé
  de nos enfants alors que les effets néfastes des réseaux sociaux sur eux sont scientifiquement
  documentés. Dans ce contexte, le Président de la République a chargé le Premier
  ministre de travailler, dans les meilleurs délais, à une rédaction juridiquement
  robuste tenant compte de la décision du Conseil constitutionnel ainsi que du cadre
  européen. Sur cette base, il appartiendra au Président de la République, au Gouvernement
  et au Parlement de déterminer les voies et moyens permettant, d’ici la fin de la
  mandature, de protéger nos enfants des réseaux sociaux. La détermination du Président
  de la République à faire aboutir cette réforme d’ici au printemps 2027 demeure totale.'
