title: Déclaration conjointe sur le projet de colonie E1 en Cisjordanie.
text: 'Déclaration conjointe des dirigeants de l’Allemagne, de la Belgique, du Canada,
  de la France, de l’Italie, de la Norvège, des Pays-Bas et du Royaume Uni sur le
  projet de colonie E1 en Cisjordanie. La décision du gouvernement israélien de publier
  des appels d’offres pour des projets de construction dans le cadre du projet de
  colonie E1 est inacceptable. La communauté internationale s’oppose depuis longtemps
  à cette expansion des colonies et a fait part de ses graves préoccupations, tant
  en privé que publiquement. La colonie E1 compromettra les perspectives d’une solution
  à deux États en créant une division à travers la Cisjordanie et en portant atteinte
  à la continuité territoriale des Territoires palestiniens. Le droit international
  est clair : les colonies israéliennes en Cisjordanie sont illégales. Il s’agit de
  la position de la communauté internationale, réaffirmée par le Conseil de sécurité
  des Nations unies. À un moment où la Cisjordanie connaît une instabilité grave,
  avec des niveaux sans précédent de violences commises par des colons contre des
  civils et de sérieuses restrictions imposées à l’économie palestinienne, cette décision
  est d’autant plus préoccupante. Nous exhortons le gouvernement israélien à retirer
  immédiatement ces projets et à mettre fin à l’expansion des colonies en Cisjordanie.
  Non seulement ces mesures nous éloigneront davantage de la paix, mais elles continueront
  également à affaiblir la position d’Israël sur la scène internationale. Les entreprises
  ne doivent pas envisager de soumissionner aux appels d’offres pour ces projets de
  construction. Elles doivent être conscientes des conséquences juridiques et réputationnelles,
  notamment du risque de se rendre complices de graves violations du droit international.
  Nous réaffirmons notre engagement en faveur d’une paix globale, juste et durable,
  fondée sur la solution à deux États. Nous continuerons à agir en ce sens.'
