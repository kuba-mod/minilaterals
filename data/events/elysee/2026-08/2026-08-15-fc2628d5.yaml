title: Disparition d’Olivier Lebas.
text: Le vice-amiral d’escadre (2S) Olivier Lebas nous a quittés à l’âge de 62 ans.
  Sa disparition est celle d’un grand officier de marine et d’un commandant hors pair,
  qui servit avec détermination, humilité et bienveillance. Né en 1964 à Boulogne-sur-Mer,
  il grandit dans une famille profondément attachée à ces paysages maritimes. La mer,
  cette école de rigueur et de liberté, allait rester son horizon. Après son diplôme
  d’ingénieur de l’ICAM, à Lille, il effectua son service militaire, puis choisit
  de s’engager dans la Marine nationale. Il y entrait avec le goût de l’action, l’envie
  de servir et l’exigence du dépassement de soi. Il servit d’abord dans les airs.
  Pilote de chasse embarqué, il rejoignit une flottille de chasse et fut engagé, des
  années 1990 au début des années 2000, sur plusieurs théâtres d’opérations sensibles
  – dans les Balkans, en Irak, puis en Afghanistan. Après l’École de guerre, il servit
  sur la Jeanne d’Arc, comme commandant adjoint opérations et participa notamment
  à la mission humanitaire conduite après le tsunami de 2004 en Indonésie. La Marine
  lui confia ses plus grands bâtiments. Après la frégate Aconit, il rejoignit le porte-avions
  Charles de Gaulle, dont il devint commandant en second, puis commandant en 2011.
  Il fut le « pacha » de cet instrument militaire d’une complexité exceptionnelle,
  symbole de la puissance aéronavale française. Déployé dans le contexte de l’opération
  Harmattan en Libye, il savait garder l’équipage en éveil, décider dans l’incertitude
  et faire vivre à bord une fraternité exigeante. Son parcours continua de le porter
  vers les plus hautes responsabilités opérationnelles. Au sein de la force aéromaritime
  de réaction rapide, il commanda le groupe aéronaval engagé dans la lutte contre
  Daech au Levant et prit la tête de la force multinationale CTF 150 contre les trafics
  illicites dans l’océan Indien. En 2019, il devint adjoint au commandement de la
  zone maritime Méditerranée. L’année suivante, il fut nommé préfet maritime de l’Atlantique,
  commandant de la zone maritime Atlantique et de l’arrondissement maritime Atlantique.
  Depuis Brest, il était la vigie d’une façade maritime essentielle au pays. Olivier
  Lebas poursuivit enfin son engagement au service de la souveraineté française et
  européenne auprès d’Airbus, comme conseiller défense au sein des affaires publiques
  France à partir de 2023. Le Président de la République et son épouse saluent la
  mémoire d’un grand serviteur de la France, de ses armées et de ses intérêts maritimes.
  Ils adressent leurs condoléances émues à sa famille, à ses proches, ainsi qu’à tous
  ceux qui l’aimaient.
