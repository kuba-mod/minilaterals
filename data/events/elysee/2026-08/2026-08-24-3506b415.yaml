title: Visite officielle de Mohammed ben Salman, Prince héritier d'Arabie saoudite.
text: Le Président Emmanuel Macron a reçu Mohammed ben Salman, Prince héritier et
  Premier ministre d’Arabie saoudite, le dimanche 23 et lundi 24 août 2026 dans le
  cadre d’une visite officielle. Cette visite s’est inscrite dans la continuité du
  déplacement du chef de l’Etat en Arabie saoudite en décembre 2024. Elle traduit
  la vitalité du dialogue entre le Royaume d’Arabie saoudite et la France, et a permis
  de renforcer le partenariat stratégique qui lie nos deux pays . A cette fin, le
  Président de la République et le prince héritier ont tenu pour la première fois
  une réunion du Conseil de partenariat stratégique franco-saoudien . L'annonce de
  3 futurs parcs à thème ont notamment été annoncé avec un investissement de 6 milliards
  d’euros pour 22 000 emplois créés. Le Président de la République et le Prince héritier
  ont également assisté à la cérémonie de clôture de l’Esports World Cup , le dimanche
  23 août. Organisé pour la première fois hors d’Arabie saoudite depuis sa création,
  la tenue de ce championnat d’envergure mondiale à Paris témoigne de l’attractivité
  renouvelée de la France pour l’accueil de grands événements sportifs internationaux.
  Les deux dirigeants ont également abordé les grands sujets économiques et stratégiques
  qui structurent le partenariat franco-saoudien. Ils ont enfin échangé enfin les
  principaux enjeux régionaux, dans un contexte qui appelle à une coordination étroite
  entre la France et ses partenaires du Golfe en faveur de la stabilité et de la paix
  au Proche et Moyen-Orient.
