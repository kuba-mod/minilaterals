title: Disparition de Dominique Libault.
text: Haut fonctionnaire rigoureux et dévoué, Dominique Libault s’est éteint après
  une vie consacrée à notre modèle de protection sociale, à son exigence de solidarité
  et à sa promesse d’universalité. Il avait suivi une formation qui disait déjà une
  certaine idée de la chose publique. Étudiant sur les bancs de Sciences Po puis de
  l’ENA, il y affermit son sens de l’intérêt général. En 1987, il choisit d’intégrer
  la direction de la Sécurité sociale, à laquelle il consacra l’essentiel de son parcours.
  Son engagement humaniste et social le conduisit aussi en 1993 au cabinet de Simone
  Veil, alors ministre des Affaires sociales, de la Santé et de la Ville. De retour
  à la direction de la Sécurité sociale, il en gravit un à un les échelons, jusqu’à
  en devenir directeur – fonction qu’il occupa pendant une décennie, de 2002 à 2012.
  Après avoir accompagné les grandes évolutions et réformes de notre système de protection
  sociale, il entreprit d’en former les futurs cadres. Directeur de l’EN3S, il sut
  transmettre et perpétuer ce modèle républicain essentiel. Il ne reculait devant
  aucun sujet et n’hésitait pas à sortir de sa discrétion naturelle pour défendre
  avec force la cause du social. Alors le Gouvernement lui confia la conduite de la
  concertation Grand âge et autonomie. Il sut fédérer les acteurs de la protection
  des plus vulnérables et remit un rapport précurseur, qui nourrit la création, en
  2020, de la cinquième branche de la Sécurité sociale consacrée à l’autonomie. Au
  même titre que la maladie ou la vieillesse, la dépendance fut ainsi consacrée comme
  un risque social à part entière. Expert passionné, Dominique Libault continua de
  porter une réflexion nécessaire sur l’avenir de notre modèle social, comme président
  du Haut Conseil du financement de la protection sociale et au sein de l’EN3S. En
  2025 encore, il présidait le comité de pilotage des 80 ans de la Sécurité sociale
  après avoir passé tant d’années à en faire vivre les valeurs. Son exigence intellectuelle,
  son esprit de dialogue et son aptitude à faire converger les volontés manqueront
  à cette institution comme à la Nation. Le Président de la République et son épouse
  s’inclinent devant la mémoire de ce grand serviteur de l’État et adressent leurs
  condoléances émues à ses proches, à ceux qui l’aimèrent, ainsi qu’à l’ensemble des
  équipes de l’EN3S et des acteurs de la Sécurité sociale.
