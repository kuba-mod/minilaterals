date: '2026-08-31'
type: press_release
source_name: elysee
title: Compte rendu du Conseil des ministres du 31 août 2026.
text: 'Retrouvez le compte rendu du Conseil des ministres du lundi 31 août 2026. Le
  ministre de l’éducation nationale a présenté une communication sur la rentrée scolaire
  2026. La rentrée concerne cette année 11,6 millions d''élèves et 1,2 million de
  personnels de l’éducation nationale, dans plus de 55 000 implantations sur toute
  la France. Cette rentrée est marquée par l’accélération de la chute démographique,
  avec 161 000 élèves de moins dans notre système éducatif. Une évolution qui devrait
  se poursuivre, avec une baisse attendue de 1,7 million d’élèves entre 2025 et 2035.
  Cette rentrée est caractérisée par l’entrée en vigueur de nouvelles mesures, dédiées
  à la fois à améliorer la qualité de notre service public et à renforcer la protection
  des élèves, mais aussi de chantiers de long terme, car ce que la France sera dans
  vingt ans – ses innovations, sa cohésion, sa capacité à s''adapter – se décide aujourd''hui,
  dans chaque salle de classe. En conséquence, quatre priorités guident l''action
  du ministère pour répondre à ces enjeux : - Instruire avec une exigence renforcée,
  pour élever le niveau des élèves et former de futurs citoyens. Les mesures déjà
  engagées portent leurs fruits : dédoublement des classes en éducation prioritaire,
  plafonnement à 24 élèves en grande section, évaluations nationales des élèves du
  CP à la seconde, refonte totale des programmes de la petite section à la troisième
  avec des objectifs annuels. Pour poursuivre cet élan, l''accent est mis sur deux
  priorités absolues : la maîtrise du langage d’une part, avec un effort centré sur
  le vocabulaire (objectif de 2 500 mots acquis en fin de maternelle), sur l’apprentissage
  par cœur, et sur la lecture et l’écriture ; le raisonnement scientifique et les
  mathématiques d’autre part, en replaçant les automatismes et la résolution de problèmes
  au cœur des apprentissages, et avec la création dès cette rentrée de plus de 300
  classes à horaires aménagés en mathématiques et sciences. Cette ambition s''étend
  à tous les établissements, avec une attention particulière portée à la lutte contre
  la grande difficulté scolaire, notamment au collège, ainsi qu''à la valorisation
  de l''excellence. En lien avec la ministre déléguée chargée de l''enseignement et
  de la formation professionnels et de l’apprentissage, la carte des formations continue
  d''être adaptée et le dispositif AvenirPro sera déployé dans l''ensemble des lycées
  professionnels afin d''améliorer l''insertion des futurs diplômés. Le conseil national
  de la refondation consacré à l''attractivité de cette voie sera lancé en octobre
  2026. Enfin, la réforme du recrutement et de la formation des enseignants, permettant
  désormais de recruter et former les professeurs dès la licence, s’est traduite par
  l’amélioration de l’attractivité des concours, avec une hausse de 50 % du nombre
  d’admis pour 40 % de postes ouverts en plus. Pour mémoire, les lauréats des concours
  en fin de L3 débutent en ce mois de septembre leur formation rémunérée en master.
  - Protéger : la protection des élèves et de l''institution constitue une priorité
  absolue. Il s’agit d’abord de protéger les élèves contre les violences sexuelles.
  Alors que près de 10 % des mineurs seraient victimes de viols ou d’agressions sexuelles,
  dans plus de 80 % des cas dans le cercle familial, tous les élèves de la grande
  section à la terminale pourront faire part de leur situation, grâce à un questionnaire
  adapté à l''âge des enfants distribué dès novembre, avec la possibilité pour chaque
  élève de solliciter un entretien avec un adulte de confiance s’il le souhaite. Il
  s’agit ensuite de protéger les élèves contre la surexposition aux écrans, dont les
  effets sur l''attention, le sommeil, la santé mentale et les facultés intellectuelles
  des élèves sont désormais scientifiquement établis. C’est le sens de l''interdiction
  du téléphone portable au lycée, prévue par la loi promulguée la semaine dernière
  par le Président de la République. Pour la première fois, les élèves français auront
  une scolarité complète sans téléphone. Des alternatives sportives, éducatives et
  culturelles seront proposées pour offrir de nouveaux espaces de sociabilité aux
  élèves. En outre, 300 emplois d’infirmiers, assistants sociaux et psychologues de
  l’éducation nationale sont créés en cette rentrée. Enfin, la protection des personnels
  est renforcée par un décret permettant de changer d''affectation un élève dont les
  parents menaceraient gravement un membre du personnel éducatif, tout en garantissant
  un suivi scolaire renforcé. - Unir : car l''École est la fabrique de l''unité républicaine
  et de la citoyenneté. Cela implique de garantir une Ecole inclusive, laïque, luttant
  contre toutes les formes de discriminations et capable de rassembler autour de valeurs
  communes. Depuis 2017, l''École inclusive a été profondément renforcée : 70 % d''AESH
  supplémentaires ont été recrutés et près de 2 800 ULIS ont été créées dans le premier
  et le second degré. Aujourd''hui, nos écoles accueillent 200 000 élèves en situation
  de handicap de plus qu’en 2017. Cette politique d’inclusion se poursuit en renforçant
  notamment l’attention portée à l’accessibilité, afin de permettre une scolarisation
  réussie et de faciliter les adaptations pédagogiques. Dans le cadre d’un travail
  conjoint avec plusieurs ministères, le plan de formation à la laïcité, le plan de
  lutte contre le racisme et l''antisémitisme et le plan de lutte contre les haines
  et les LGBTphobies ont été mis en place. Enfin, le 11 novembre, journée nationale
  de la Victoire et de la Paix et d’hommage aux « morts pour la France », sera désormais
  commémoré dans toutes les écoles élémentaires et établissements scolaires. La cohésion
  nationale implique en effet de faire mémoire de celles et ceux qui ont risqué leur
  vie pour défendre les principes de liberté, d’égalité et de fraternité qui nous
  fondent. - Prévoir : les changements majeurs qui bouleversent notre société – baisse
  des naissances, changement climatique, intelligence artificielle – emportent des
  conséquences profondes sur l’organisation et le fonctionnement de l’Ecole. Le ministère
  se dote donc d’une capacité à prévoir ces évolutions et à mener les adaptations
  nécessaires. La baisse démographique impose de sortir d’une logique strictement
  annuelle pour renouer avec une politique d’aménagement du territoire par et autour
  de l’Ecole. L''expérimentation en cours dans 18 départements pilotes permettra de
  construire, en étroite collaboration avec les élus locaux, une carte de l’offre
  scolaire pluriannuelle. Afin d’appuyer cette nouvelle méthode qui a vocation à s’appliquer
  à l’ensemble des départements dès 2027, le ministère procèdera à la création d’une
  direction de la politique territoriale de l''École et de l''anticipation avant le
  1er novembre. Le changement climatique exige également une réponse concrète et planifiée,
  en appui aux collectivités territoriales, qui sont propriétaires du bâti scolaire
  : un plan accéléré d''adaptation sera mis en œuvre pour 2 500 écoles vulnérables
  identifiées pendant l’été, tandis que le plan de gestion des vagues de chaleur sera
  renforcé d’ici au printemps prochain. Toutes les épreuves des examens de 2027, à
  l''exception des quelques épreuves qui durent toute la journée en voie professionnelle,
  se tiendront uniquement le matin. Enfin face à l''intelligence artificielle, une
  approche pragmatique a été adoptée. En lien avec le Premier ministre, un enseignement
  obligatoire de l''IA en classe de seconde sera mis en place dès 2027, afin que les
  élèves en gardent l’entière maîtrise. Le programme de cet enseignement et la formation
  des professeurs seront mis en place cette année. S’agissant enfin des conditions
  techniques de la rentrée, le ministère de l’éducation nationale a fait face à une
  série de cyberattaques pendant l’été qui l’ont conduit à prendre des mesures de
  protection. A titre de précaution, l’accès aux applications informatiques a ainsi
  été fermé ou très fortement réduit dans les académies de Toulouse et de Nantes pour
  les jours à venir. Cette situation, complexe pour les équipes, n’empêche pas l’accueil
  des élèves dès la rentrée et le début des cours dans des conditions ordinaires.
  Le conseil des ministres a adopté les mesures individuelles suivantes : - M. Vianney
  BOURQUARD , conseiller référendaire à la Cour des comptes, est nommé conseiller
  maître à la cour des comptes (1er tour), à compter du 1er septembre 2026 ; - M.
  Paul TEBOUL , conseiller référendaire à la Cour des comptes, est nommé conseiller
  maître à la cour des comptes (2ème tour), à compter du 1er septembre 2026 ; - M.
  Pierre ROLLAND , conseiller référendaire à la Cour des comptes, est nommé conseiller
  maître à la cour des comptes (3ème tour), à compter du 1er septembre 2026 ; - M.
  Christian CHAPARD , conseiller référendaire à la Cour des comptes, est nommé conseiller
  maître à la cour des comptes (4ème intérieur), à compter du 1er septembre 2026.
  Sur proposition de la ministre des armées et des anciens combattants : - M. le contrôleur général des armées
  Sylvain MATTIUCCI est nommé chef du contrôle général des armées, à compter du 1er
  septembre 2026 ; - M. l''ingénieur général de 1ère classe de l’armement, ingénieur
  du grade transitoire des ingénieurs de l''armement Bruno BELLIER est nommé directeur
  général de l’Ecole Polytechnique, à compter du 1er septembre 2026 ; - Il est mis
  fin aux fonctions de directeur stratégie de défense, prospective et contreprolifération
  de la direction générale des relations internationales et de la stratégie exercées
  par M. l’ingénieur général hors classe de l’armement, ingénieur du grade transitoire
  des ingénieurs de l’armement Bertrand LE MEUR , à compter du 1er septembre 2026.
  En outre, ont été adoptées diverses mesures d’ordre individuel concernant des officiers
  généraux de l’armée de terre et de la direction générale de l’armement. Sur proposition
  de la ministre de la transition écologique, de la biodiversité et des négociations
  internationales sur le climat et la nature : - M. Alexis VUILLEMIN , ingénieur des
  ponts, des eaux et des forêts du grade transitoire, est nommé secrétaire général,
  à compter du 1er septembre 2026. Sur proposition de la ministre de l''agriculture,
  de l''agro-alimentaire et de la souveraineté alimentaire : - Mme Marion ZALAY ,
  ingénieure des ponts, des eaux et des forêts du grade transitoire, est nommée directrice
  générale de l’Établissement national des produits de l’agriculture et de la mer
  (FranceAgriMer), à compter du 1er septembre 2026 ; - Mme Maud FAIPOUX , ingénieure
  des ponts, des eaux et des forêts du grade transitoire, est nommée directrice générale
  de l’enseignement et de la recherche. Le ministre de l’éducation nationale a présenté
