title: Déclaration des Co-Présidents de la Coalition des volontaires.
text: Les dirigeants de la Coalition des volontaires se sont réunis aujourd’hui à
  Kiev et par vidéoconférence pour commémorer le 35e anniversaire du rétablissement
  de l’Indépendance de l’Ukraine. Ils ont montré leur unité s’agissant de leur soutien
  sans faille au combat de l’Ukraine pour défendre sa souveraineté, sa liberté et
  son intégrité territoriale. Le Premier ministre Andy Burnham, le Président Emmanuel
  Macron et le Chancelier Friedrich Merz ont présidé la réunion aux côtés du président
  Zelensky. Les dirigeants ont condamné les frappes systématiques et de plus en plus
  intenses menées par la Russie contre les villes, les infrastructures essentielles
  et les civils ukrainiens, qui ont causé le plus grand nombre de victimes civiles
  depuis le début de l’invasion à grande échelle en 2022 et endommagé un hôpital pour
  enfants à Kiev la semaine précédente. Ils ont également condamné les attaques russes
  contre les sites du patrimoine culturel ukrainien, qui font partie intégrante de
  l’identité nationale de l’Ukraine, notamment la Laure de Kiev-Petchersk. Les dirigeants
  ont réaffirmé le droit clair et inhérent de l’Ukraine à se défendre contre la guerre
  d’agression russe, dans le plein respect du droit international et de l’article
  51 de la Charte des Nations unies, et ont confirmé que les menaces irresponsables
  de la Russie ne les dissuaderaient pas de soutenir l’Ukraine. Ils ont exprimé leur
  détermination à accroître le soutien militaire apporté à l’Ukraine, à renforcer
  sa défense aérienne en priorité absolue, à intensifier la coopération avec son industrie
  de défense et à partager les technologies pertinentes, notamment par le biais de
  la Coalition antibalistique. Ils se sont également engagés à intensifier les sanctions
  sur le complexe militaro-industriel de la Russie et ceux qui le soutiennent. Les
  dirigeants sont également convenus de l’urgence d’apporter une aide immédiate au
  secteur énergétique ukrainien à l’approche de l’hiver prochain, notamment par le
  biais du Fonds de soutien énergétique à l’Ukraine et de la fourniture d’équipements
  spécialisés. Ils ont insisté sur la nécessité de continuer à soutenir la résilience
  économique de l’Ukraine face à l’intensification des tentatives de la Russie à rétablir
  son blocus maritime sur les ports ukrainiens. Les dirigeants sont convenus de poursuivre
  leurs efforts pour contraindre les ressources financières russes destinées à la
  guerre, par le biais de sanctions, de mesures économiques plus larges et d’une répression
  accrue du contournement des sanctions et de la « flotte fantôme » russe. À ce jour,
  cette action conjointe a privé l’effort de guerre de la Russie d’au moins 495 milliards
  de dollars depuis février 2022. Les dirigeants ont salué les efforts du Sénat américain
  visant à exercer une pression économique supplémentaire sur la Russie et se sont
  engagés à travailler étroitement avec les États-Unis au cours des prochains mois
  sur une action coordonnée visant à assécher les moyens de la Russie de poursuivre
  sa guerre illégale. Les dirigeants ont salué la disposition constante du Président
  Zelensky à s’engager dans des négociations de paix constructives, afin d’instaurer
  une paix globale, juste et durable, et ont réitéré leur appel à la Russie pour qu’elle
  accepte un cessez-le-feu total, immédiat et inconditionnel à partir de la ligne
  de contact. La Coalition continuerait à préparer la Force multinationale Ukraine
  en vue de son déploiement dès lors qu'un cessez-le-feu crédible serait en place,
  dans le cadre d'un ensemble plus large de garanties de sécurité robustes, politiquement
  et juridiquement contraignantes, visant à assurer la sécurité et la prospérité futures
  de l'Ukraine une fois un cessez-le-feu entré en vigueur. En conclusion, les dirigeants
  ont réaffirmé une nouvelle fois leur engagement à soutenir l’indépendance de l’Ukraine,
  contribuant à la paix et de la sécurité en Europe plus largement. Ils ont exprimé
  au Président Zelensky et au peuple ukrainien leur solidarité indéfectible, aujourd’hui
  à l’occasion du 35ème anniversaire du rétablissement de l’Indépendance, et chaque
  jour, aussi longtemps qu’il le faudra.
