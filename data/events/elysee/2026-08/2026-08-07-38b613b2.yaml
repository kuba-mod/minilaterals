title: Disparition de Didier Decoin.
text: 'Didier Decoin savait que derrière chaque existence se cachait un roman. Fils
  d’un grand réalisateur, le sien fut une vie de mots pour s’émanciper des images
  qui avaient bercé son enfance. Prix Goncourt, scénariste, journaliste, président
  de l’Académie Goncourt, il s’est éteint le 5 août 2026, à l’âge de 81 ans. Né le
  13 mars 1945 à Boulogne-Billancourt, Didier Decoin grandit auprès de son père, Henri
  Decoin, figure majeure du cinéma français d’après-guerre. Longtemps, cette filiation
  fut pour lui une fierté autant qu’une ombre. Il lui consacrerait, bien des années
  plus tard, Henri ou Henry. Le roman de mon père. Mais entre-temps, il s’était fait
  un prénom. Il avait commencé tôt. À 21 ans à peine, tandis qu’il faisait ses premières
  armes dans le journalisme, paraissait Le Procès à l’amour. À France-Soir, au Figaro,
  aux Nouvelles littéraires, à Europe 1 puis à VSD, il apprit à saisir les vies dans
  ce qu’elles avaient de plus immédiat, de plus fragile, parfois de plus tragique.
  Les faits divers ne cesseraient dès lors de le poursuivre. Ou plutôt leurs personnages.
  Car ce n’était pas le crime qui fascinait Didier Decoin, mais les êtres qu’il révélait :
  victimes et coupables, innocents et damnés, vies ordinaires soudain précipitées
  dans l’extraordinaire. Chez chacun, jusque dans les destinées les plus sombres,
  il cherchait encore une part d’humanité, une lumière. En 1971, Abraham de Brooklyn obtint
  le prix des Libraires. Six ans plus tard, John l’Enfer, vertigineuse traversée de
  New York dans les pas d’un Cheyenne laveur de carreaux, lui valut le prix Goncourt.
  Didier Decoin avait 32 ans. Il parlerait de ce jour comme d’une seconde naissance :
  enfin, on ne l’interrogeait plus sur son père. Le fils du cinéaste était devenu
  l’écrivain, concrétisant ainsi son rêve d’enfant. Pendant près de soixante ans,
  il ne cessa plus d’écrire. Il embarqua ses lecteurs sur le Titanic, les conduisit
  dans le Japon médiéval du Bureau des jardins et des étangs, puis jusqu’à Bizerte
  et dans les faubourgs charbonneux du Londres d’après-guerre avec La pendue de Londres. Et
  quelques mois avant sa mort encore, avec Maypops, il redonnait un visage et une
  voix à George Stinney, adolescent noir de quatorze ans exécuté en 1944 dans l’Amérique
  ségrégationniste après une condamnation sans preuves. Jusqu’à son dernier livre,
  Didier Decoin, croyant, resta ainsi fidèle à ceux que l’Histoire avait maltraités
  ou oubliés. Il n’avait pourtant jamais vraiment quitté le cinéma. Scénariste et
  dialoguiste, il travailla avec Marcel Carné, Henri Verneuil et Josée Dayan, adapta Le
  Comte de Monte-Cristo et Les Misérables, et contribua à faire de la grande littérature
  de grands rendez-vous populaires. Il disait ne pouvoir écrire une scène sans d’abord
  la voir. Les mots, chez lui, avaient conservé la puissance des images. Élu à l’Académie
  Goncourt en 1995 au couvert de Jean Cayrol, il en fut longtemps secrétaire général
  avant de devenir président de 2020 à 2024, il défendit une littérature qui ne s’enferme
  jamais. Il officia chez Drouant jusqu’à la fin, se réunissant une dernière fois
  en juin à la table des 12, avec ses compères. Sa vie fut cette une histoire de compagnonnages
  avec Edmonde Charles-Roux, Philippe Claudel  à qui il passa le flambeau du Goncourt,
  Manuel Carcassonne, son dernier éditeur et tant d’autres. Une vie donnée à la littérature,
  aux belles lettres, au soutien des jeunes romanciers, au Goncourt. Sous sa présidence
  fut notamment créé le Goncourt des détenus : parce qu’à ses yeux les livres devaient
  aller partout, et surtout là où les horizons sont les plus étroits. À La Hague,
  face au raz Blanchard, dans cette maison de pêcheur acquise grâce à son prix Goncourt,
  Didier Decoin avait trouvé son paysage, son refuge, son port. Il avait écrit qu’il
  ne l’habitait pas : c’était elle qui l’habitait. Il reposera face à cette mer qu’il
  aimait tant. Le Président de la République et son épouse saluent la mémoire d’un
  grand conteur français, qui fit de la littérature un art de regarder les êtres et
  le monde. Ils adressent à Chantal son épouse, à ses enfants, à ses proches, aux
  membres de l’Académie Goncourt et à tous ses lecteurs leurs condoléances attristées.'
