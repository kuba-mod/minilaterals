title: Disparition de Philippe Bouvard.
text: 'Les médias français sont en deuil. L’un de leurs plus fertiles chroniqueurs,
  le journaliste Philippe Bouvard, s’est éteint après avoir animé nos pages, nos ondes
  et nos écrans durant plus de soixante-dix ans. Sa culture, sa plume au vitriol,
  son œil affûté, n’étaient le fruit d’aucune école – presque toutes l’avaient renvoyé,
  pour désinvolture ou insubordination. Ses seules leçons furent celles de la vie,
  avec leurs ombres et leurs lumières : l’angoisse de l’enfant juif qui passa l’Occupation
  à se cacher avec sa mère, les trois échecs au baccalauréat, les années à vendre
  des chemises, des lunettes ou des encyclopédies, mais aussi les succès et les boulevards
  que sa hardiesse finit par lui ouvrir. Il possédait une énergie chevillée au corps
  et un ethos inné de gazetier qui lui firent gravir toutes les marches. À 23 ans,
  il s’immisça au Figaro comme garçon de courses, accapara une ligne, puis deux, décrocha
  sa carte de presse, avant de se faire attribuer la rubrique parisienne et mondaine.
  Vingt ans après ses débuts de commis, ses chroniques, ses billets et ses blocs-notes
  étaient partout à la fois, dans les pages de Paris Match, du Point, du Figaro, de
  Nice-Matin et de France-Soir. Observateur inlassable des travers humains, à commencer
  par les siens, il devint l’un des pères fondateurs du journalisme people, et le
  grand confesseur cathodique des célébrités. À l’étage du restaurant Maxim’s, boiseries
  feutrées et questions incisives, il interviewait chaque samedi soir en direct les
  personnalités en vue du moment, des sportifs aux politiques, et se permettait tout.
  Le poulbot de Montmartre se révéla un arbitre des élégances et des ridicules du
  Tout-Paris, qui se spécialisa dans le bon mot, le proverbe mondain, le concentré
  d’esprit, la pique assassine dont on redoutait le dard. Son ironie voltairienne
  brillait aussi bien à l’oral qu’à l’écrit, au micro qu’à la caméra. Pour RTL, il
  s''essaya aux journaux d’actualité. Car c’était cet humour pince-sans-rire qui séduisait
  chez lui les spectateurs, ses grivoiseries élégantes, son cynisme optimiste, son
  art consommé d’élever le rire en catharsis. Lorsqu’il était maître du jeu, les émissions
  dites de divertissement prenaient une envergure nouvelle, abolissaient les cloisons
  entre comique et culture, en brassant l’art et l’actualité critique. Il fut l’inoubliable
  animateur des joutes verbales des « Grosses Têtes » sur RTL tandis que son émission
  « Le Théâtre de Bouvard » révéla une vingtaine de comiques, des Inconnus à Mimie
  Mathy en passant par Muriel Robin. Il rendit ainsi la société doublement plus drôle,
  par son talent propre, et par ceux qu’il fit germer autour de lui. Dans une boulimie
  d’écriture, ce cumulard qui se vantait d’avoir trouvé son équilibre dans le surmenage
  écrivit une pièce de théâtre, des dialogues de films et plus de quarante ouvrages
  humoristiques. L’un des derniers, qu’il voulait un témoignage posthume écrit de
  son vivant, s’intitulait Je suis mort, et alors ?. Alors la France vient de perdre
  un chroniqueur qui fut le sel et le poivre de l’écume de ses jours. Le Président
  de la République et son épouse saluent la mémoire d’un rhéteur et bretteur du verbe
  qui incarnait une forme de liberté de ton à la française. Ils adressent à ses proches,
  au monde de la presse, à l’ensemble des sociétaires et des auditeurs des Grosses
  Têtes, leurs condoléances émues.'
