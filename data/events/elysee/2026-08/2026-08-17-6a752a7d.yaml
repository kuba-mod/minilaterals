  ensuite de remonter, pas simplement vers Paris, mais la campagne la plus sanglante,
  celle de l'Est, de l'Alsace, où ils allaient connaître, pour certains, le pire.
  Mais oui, fidèles au serment de Koufra, fidèles à l'engagement qui venait de si
  loin, ils ont pris tous les risques. Je me souviens encore d'Hubert Germain me racontant
  ce débarquement, cette terre qu'il a pris dans ses mains, ce sable et cette terre
  qu'il a porté à son visage pour les sentir. Ou Michel Brousse, ce jeune Français
  de 20 ans, quand il débarquait, qui disait, malgré les barbelés, malgré les villes
  détruites et les routes défoncées, il y avait les vignes, l'odeur de la résine sous
  les pins. C'était la France. Ces jeunes gens qui n'avaient pu fouler leur propre
  sol depuis des années, redécouvraient leur pays. C'était la France. Ce que nous
  ne devons pas oublier, ce qui nous lie en ce jour, c'est évidemment la grande fragilité
  de notre liberté et de notre indépendance. C'est aussi cet esprit de résistance
  qui a tenu la France, la République et ce qu'elle était durant ces années. C'est
  l'héroïsme de ceux qui nous ont libérés. C'est l'unité dans laquelle ils ont agi,
  venant d'Afrique, résistant de l'intérieur ou partant de Londres. Quelles que soient
  leurs religions, quelles que soient leurs appartenances politiques, c'est une France
  qui aspire à plus grand qu'elle-même et qui a ainsi rallié autour d'elle tant de
  puissances alliées à qui nous devons aussi notre liberté. Oui, n'oublions jamais
  la fragilité de ce que nous sommes, mais aussi la force, la force d'âme, l'engagement
  et l'héroïsme de ceux qui nous ont permis, depuis 82 ans, à nouveau d'être libres,
  à nouveau d'être une nation et une République libre et fière. Mais ceci continue
  de nous inspirer et ce souvenir, c'est aussi tirer l'exemple de ces femmes et de
  ces hommes qui ont agi et savoir aussi reconnaître dans ce qui est aujourd'hui la
  France contemporaine la même qualité d'âme parce qu'elle existe. Je ne suis pas
  de ces nostalgiques qui pensent que la France d'aujourd'hui ne saurait avoir la
  même force d'âme d'hier. Non, et depuis 10 ans, je peux vous dire que j'ai vu ce
  visage d'une France courageuse. Il est là, il ne demande qu'à être davantage révélé,
  reconnu et à en inspirer encore davantage. La France continue d'être une grande
  puissance de liberté. Elle l'est pour le continent européen en ayant pris la tête
  de cette coalition des volontaires pour l'Ukraine. Elle l'est aussi en étant puissance
  de paix et d'équilibre au Proche et Moyen-Orient, c'est aussi pour cela qu'en cette
  journée, je veux m'incliner avec beaucoup de respect une fois encore devant nos
  morts pour la France et j'ai une pensée particulière pour l'adjudant-chef Arnaud
  Frion, mort pour la France en Irak en mars dernier, au sergent-chef Florian Montorio
  et au caporal-chef Anicet Girardin, morts pour la France au Liban en avril dernier.
  Ils se battaient pour la liberté des autres. Ils se battaient pour la paix dans
  cette région. Ils se battaient au nom des engagements de la France. Je veux ici
  avoir une pensée reconnaissante pour tous nos morts des derniers mois, pour leurs
  familles, pour leurs frères d'armes et pour tous nos blessés. Cette France forte,
  puissance d'équilibre et de paix, indépendante, c'est en effet celle qui est portée
  par nos forces armées sur tous les continents et sur notre sol, à travers tous nos
  territoires, et c'est celle qui a conduit notre nation à se réengager depuis dix
  ans, à doubler le budget de nos armées. Je me tiens devant vous aujourd'hui, après
  avoir promulgué hier la loi de programmation militaire que le Parlement a votée
  il y a quelques semaines et que le Conseil constitutionnel a validée il y a quelques
  jours, et au Journal officiel de demain paraîtra cette loi de programmation militaire.
  C'est elle qui permettra, dès 2027, d'avoir doublé le budget de nos armées, qui
  permettra 36 milliards d'euros d'investissements nouveaux pour nos armées sur la
  période 2026-2030, qui permettra, vous pouvez applaudir nos forces armées. Qui permettra,
  dans le cyber, en matière de drones, en matière d'innovation, dans toutes les capacités
  différentes, de faire davantage et d'agir dans les tirs dans la profondeur, comme
  dans la défense antibalistique, tirant aussi tous les enseignements des changements
  de la guerre, à la France de se protéger, d'être une nation aussi qui consolide
  l'engagement des autres. Et puis, c'est cette loi de programmation militaire qui
  permettra, dans quelques semaines, d'organiser le service national et qui donnera
  un cadre à l'engagement de notre jeunesse. C'est une bonne chose. Et notre jeunesse
  a ce sens de l'engagement. Je veux ici redire ma confiance en elle. Elle a ce sens
  de l'engagement. Je le vois parmi celles et ceux qui rejoignent nos armées, comme
  d'ailleurs nos forces de sécurité intérieure, nos sapeurs-pompiers, nos soignants,
  et toute forme d'engagement. Mais oui, elle aura, à partir de septembre prochain,
  ce cadre, elle l'a dès demain, ce cadre du service national. En tout cas, voilà,
  nos armées auront, à travers cette loi de programmation militaire, cet engagement
  nouveau de la nation qui permettra à nouveau de rester fidèles à nos valeurs et
  de les défendre. Mais en parlant d'héroïsme contemporain, d'engagement contemporain,
  comment aussi ne pas voir ce qui s'est passé ces derniers jours dans notre beau
  département du Var, comme ce qui s'est passé en Gironde et dans les Landes ces derniers
  temps, ou à Fontainebleau avant, la France qui résiste au feu. Je veux ici saluer
  à nouveau l'engagement de nos sapeurs-pompiers. Vous pouvez être fiers, Monsieur
  le contrôleur général. Je sais que les colonels, l'ensemble des officiers ici présents
  et tous les sapeurs-pompiers le sont aussi. Je veux vous remercier, M. le Préfet,
  avec l'ensemble des services de l'État pour l'action déterminée que vous avez conduite
  durant ces semaines si difficiles. Le feu est arrivé tôt, plus tôt que prévu. Il
  a été terrible. C'est le feu le plus long que le Var ait eu à connaître. Je veux
  remercier nos maires ici présents. C'est pour ça que j'ai voulu les voir avant,
  aux côtés de nos pompiers, de nos gendarmes, parce que vous avez été, aux côtés
  de monsieur le Préfet, tous les services exemplaires. Certains d'entre vous ont
  été durement touchés, monsieur le maire avec beaucoup d'habitations complètement
  détruites. Mais vous avez tenu. Oui, ce fut le feu le plus long de l'histoire du
  Var. Onze mille pompiers mobilisés, des milliers venant de la France entière. Je
  n'oublie pas, évidemment, nos militaires dans cette affaire. Je n'oublie pas aussi
  nos gendarmes qui ont été là, à vos côtés, pour sécuriser, déplacer les populations
  et mener les enquêtes dès le premier jour avec d'ores et déjà des enquêtes ouvertes,
  car malheureusement, comme à chaque fois, il y a aussi des actions criminelles.
  Vous avez toutes et tous ensemble tenu, c’est aussi ce visage d'une France courageuse,
  qui tient, qui montre sa solidarité, qui sait organiser les choses pour déplacer
  les femmes et les hommes qu'il faut d'un seul coup loger, car le pire pourrait advenir,
  qui sait se retrousser les manches pour nourrir ces soldats du feu qui vont aller
  prendre tous les risques en votre nom et pour vous. Je veux remercier aussi nos
  soignants et nos associations qui ont été comme à chaque fois mobilisés pour venir
  en aide aux plus vulnérables et aux plus fragiles. Oui, c'est aussi cela, le visage
  d'une France qui a ces valeurs de l'héroïsme, de l'entraide et cette capacité à
  s'engager. Je veux, en saluant leur engagement collectif, avoir une pensée là aussi
  particulière pour les quatre sapeurs-pompiers décédés depuis le début de la saison,
  pour la centaine de blessés ou intoxiqués parmi nos sapeurs-pompiers qui ont été
  touchés depuis le début de la saison. Beaucoup continuent encore à lutter. Nous
  sommes à leurs côtés, nous n'oublions personne. C'est avec beaucoup de respect que
  je m'incline devant eux, leurs frères d'armes, leur famille et leur mémoire. Il
  y aura un lendemain. J'espère que dans les jours à venir, on pourra déclarer le
  feu éteint. Le vent qui souffle est une bonne nouvelle pour vous ce soir, pas la
  meilleure nouvelle pour nos pompiers. Donc, il faut rester vigilant. Nous savons
  que la saison n'est pas terminée. Mais je veux d'ores et déjà vous dire ici, après
  avoir échangé avec le Premier ministre, que ce qui a été annoncé par lui en Gironde
  il y a quelques heures, pour les communes qui sont dans la même situation que celles
  qui ont été frappées, à la fois sinistrées et évacuées, les mêmes dispositifs seront
  mis en place et que les mêmes mécanismes d'accompagnement pour les communes, pour
  les forces économiques, pour nos compatriotes, seront évidemment déployés pour venir
  en aide à ceux qui ont été touchés. Nous savons aussi que nous aurons à penser l'avenir,
  à reboiser, peut-être à inventer d'autres formes d'activités pour mieux protéger
  nos villes et nos villages, à le faire aussi en tirant toutes les leçons de ce que
  nous avons appris. Être plus durs encore sur le débroussaillage, permettre à nos
  forestiers de faire leur travail dans de meilleures conditions et d'aider nos pompiers
  à intervenir encore plus vite, comme nos gendarmes, et savoir couper le feu aux
  bons endroits. Donc, sachons tirer vite les leçons que nous avons apprises à l'épreuve
  du feu. Mais nous serons là, avec la même solidarité, et je veux vous dire qu'au-delà
  du feu du Gros Bessillon et de ce qui s'est passé, la solidarité de la Nation continuera
  d'être à vos côtés. Mais merci pour tout ce que vous avez fait. Merci. En tout cas,
  en vous parlant en ce jour et en écho à la mémoire d'il y a 82 ans de nos forces
  armées, de nos pompiers, de nos forces de sécurité intérieure, de nos soignants,
  de nos élus, je vous parle d'une France qui est la nôtre, qui a ce sens de l'engagement,
  qui a ce courage d'agir, de prendre des décisions, des responsabilités, et qui a
  cette volonté de regarder devant et de savoir aussi faire face à ce qui peut advenir.
  Alors, je voudrais conclure mon propos au fond, en vous disant d'avoir confiance
  en vous. Ce qui s'est passé ici il y a 82 ans doit continuer de nous inspirer. Mais
  ce qui continue de se passer et ce que font tant de femmes et d'hommes au nom de
  la France, en dehors de notre sol ou sur notre sol chaque jour, doit nous rendre
  fiers. Rien n'est jamais écrit et beaucoup tient à la volonté, à la détermination,
  à l'engagement. C'est cela la France, celle dont Brousse parlait en revenant sur
  notre sol, en la reconnaissant malgré les balafres. C'est ça la France, c'est ce
  que vous êtes, c'est ce que vous venez de faire ici, c'est ce qui a été fait en
  Gironde il y a quelques jours et qui continue d'être fait. C'est ce que font ceux
  qui protègent, qui soignent, qui défendent, la liberté et la paix. Alors ne cédez
  pas à l'esprit du temps. Ces journées ne doivent pas être des parenthèses, où l’on
  se souviendrait qu'il y a eu une France glorieuse mais qu'aujourd'hui tout irait
  mal. Ne cédez pas à ce défaitisme parce que ce défaitisme a été cliniquement décrit
  par Marc Bloch dans L'étrange défaite. C'est ce même esprit de défaite des soi-disant
  élites ou intellectuels ou dirigeants politiques et économiques qui expliquaient
  en 1940, face à la débâcle comme ils l'avaient fait en 1870, que tout était fichu,
  que la France finalement valait moins que ceux qui arrivaient en face, qu'elle ne
  se tenait plus, ce faisant contribuant à le faire, qui l'ont conduite au désastre.
  Ne cédez pas à l'esprit ambiant qui est celui du doute excessif, de l'absence d'estime
  de soi et de ce qui en découle, c'est-à-dire l'aquoibonisme, c'est-à-dire au fond
  la fin de la détermination. Ne cédez pas à cet esprit rampant du défaitisme. La
  France est belle, notre jeunesse est grande et il y a énormément de choses qui se
  font chaque jour dans notre pays. Nous devons être fiers. Alors oui, nous devons
  continuer d'être intraitables face à ceux qui resquillent et il y en a toujours
  eu. Nous devons être durs et avec la main ferme face à ceux qui veulent détruire
  ce que nous sommes. Mais pour autant, ne baissons pas l’échine. Alors oui, au moment
  où je vous parle dans cette capacité, pour ces années, pour la dernière fois, ayez
  confiance en vous, ayez confiance en notre jeunesse qui s'engage, qui a le goût
  de l'avenir. Il faut la protéger, l'éduquer, lui permettre de s'engager et d'embrasser
  l'avenir. Ayez confiance dans la France comme nation et comme République. Elle doit
  continuer d'inventer, de créer encore davantage, de produire encore davantage pour
  être plus indépendante et protégée, car son modèle est généreux. Il suppose cela
  et les droits n'existent et n'existeront qu'aussi longtemps que les devoirs seront
  tenus. Ayez confiance dans l'Europe qui est aussi la source de notre indépendance
  et qui nous permettra ensemble de tenir dans ce monde disloqué où le droit international
  est chaque jour bafoué, où la logique de bloc revient, de tenir là aussi notre indépendance
  et notre liberté. Voilà ce que je voulais vous dire pour conclure mon propos. Ceux
  qui nous ont libérés il y a 82 ans étaient si jeunes, ils avaient confiance en eux.
  Qui voudrait croire que notre jeunesse d'aujourd'hui ne serait pas capable de la
  même chose ? Elle le serait, confrontée à l'adversité. Donnons-lui, il y a possibilité
  de l'être. C'est ça la France. C'est ça la France. Alors soyez fiers de votre pays.
  Ne cédez pas à l'esprit de défaite. Ne vous habituez à rien. Ne vous habituez pas
  à la liberté ou à ce qui semble acquis. Les droits que nous avons aujourd'hui ont
  été conquis. Ils sont le fruit de devoirs, de bâtisseurs. Ne vous habituez à rien.
  Battez-vous pour tout. Et ayez confiance, en vous, en notre pays, en nos jeunes.
  C'est la plus belle leçon qui a été donnée il y a 82 ans et c'est celle qui doit
  continuer de nous inspirer.
