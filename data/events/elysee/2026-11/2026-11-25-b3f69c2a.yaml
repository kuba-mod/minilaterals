  service de l’excellence académique et scientifique. Comme annoncé par le Premier
  ministre lors de la conférence sociale du 9 novembre dernier, le ministre du travail
  et des solidarités a présenté un décret portant relèvement du salaire minimum de
  croissance (SMIC) de manière anticipée au 1er décembre 2026. Face aux enjeux très
  forts de pouvoir d’achat des Français, le Gouvernement en effet a décidé d’augmenter
  le SMIC dès le 1er décembre à hauteur de 1,6 % en anticipant la revalorisation du
  SMIC au 1er janvier au vu de l’inflation estimée en fin d’année et également en
  appliquant un coup de pouce. Le SMIC s’établira alors à 1 897,35 euros brut mensuel
  (au lieu de 1 867,02 euros actuellement, soit une augmentation de 30,33 euros brut
  par mois) et à 12,51 euros brut de l’heure (au lieu de 12,31 euros actuellement).
  Le SMIC net mensuel s’élèvera donc à 1 501,94 euros, contre 1 477,93 euros précédemment,
  soit une hausse de 24,01 euros net par mois. Au total, le SMIC aura été revalorisé
  sur l’année 2026 de 5,3 % soit environ 75 euros nets par mois sur un an. Par ailleurs,
  le montant du minimum garanti, qui sert notamment au calcul des avantages en nature
  dans certains secteurs, et qui est revalorisé sur la base de l’inflation anticipée,
  est porté de 4,35 euros à 4,39 euros. En parallèle de cette revalorisation du SMIC,
  le Gouvernement tient à rappeler le rôle essentiel des branches professionnelles
  et des entreprises, via leurs négociations sur les salaires et sur les classifications,
  afin de garantir une revalorisation de l’ensemble des salaires. Le ministre du travail
  et des solidarités procède en lien avec les organisations syndicales et patronales
  représentatives au niveau national interprofessionnel et multiprofessionnel à un
  examen attentif de la situation des branches professionnelles à l’occasion de comités
  de suivi des salaires réguliers et a appelé les partenaires sociaux de toutes les
  branches à se réunir sans délai pour négocier sur les salaires. Le Premier ministre
  et la ministre déléguée auprès du Premier ministre, chargée de l’égalité entre les
  femmes et les hommes et de la lutte contre les discriminations, ont présenté une
  communication sur le bilan de l’action du Gouvernement s’agissant de la lutte contre
  les violences faites aux femmes. Depuis 2017, la lutte contre les violences faites
  aux femmes s’inscrit dans un profond mouvement de société. Une parole longtemps
  tue, minimisée ou tenue à distance a émergé avec une force nouvelle. Des femmes
  ont témoigné, des victimes ont brisé le silence et notre société a commencé à regarder
  en face des violences trop longtemps ignorées. Sous l’impulsion du Président de
  la République, qui a fait de l’égalité entre les femmes et les hommes la Grande
  cause de ses deux quinquennats, l’ensemble du Gouvernement s’est mobilisé pour transformer
  cette prise de conscience en protections concrètes. Le Grenelle des violences conjugales
  de 2019 et le plan interministériel 2023-2027 Toutes et Tous égaux ont structuré
  une politique publique associant justice, sécurité, santé, éducation et solidarités.
  Cette transformation s’est accompagnée d’un changement d’échelle budgétaire : les
  crédits du programme 137 consacrés à la lutte contre les violences sont passés de
  23 millions d’euros en 2017 à 99 millions d’euros prévus au PLF 2027, soit plus
  de 4 fois leur montant initial. Dans le même temps, les crédits d’intervention destinés
  au soutien aux associations nationales et locales ont progressé de 23 à 62 millions
  d’euros pour accompagner les besoins au plus près dans les territoires. En près
  de 10 ans, le droit et les outils de protection ont été profondément transformés.
  Depuis 2018, les réformes ont renforcé la répression des violences sexuelles et
  sexistes, les ordonnances de protection et la protection des enfants victimes et
  covictimes. De nouveaux dispositifs ont été créés : bracelets anti-rapprochement,
  ordonnance provisoire de protection immédiate et pôles judiciaires spécialisés dans
  les violences intrafamiliales. La loi du 6 novembre 2025 intégrant le consentement
  à la définition pénale du viol marque une nouvelle étape. L’accueil et l’accompagnement
  des victimes ont changé de dimension. Les intervenants sociaux en commissariat et
  gendarmerie sont passés de 261 en 2018 à 673 en 2026. Depuis 2019, 100 Maisons de
  protection des familles ont été créées et sont aujourd’hui en activité. Les places
  d’hébergement dédiées ont plus que doublé, de 5 000 en 2017 à 11 500 fin 2025. Les
  Maisons de santé des femmes sont passées de 70 structures financées en 2023 à 111
  ouvertes en novembre 2026. Pour aller au devant des victimes, notamment dans les
  quartiers prioritaires, en milieu rural et en outre-mer, 75 dispositifs d’« aller-vers
  », comprenant 50 vans itinérants et 25 points d’information, permettent de toucher
  près de 30 000 personnes chaque année. Ce maillage territorial est complété par
  1 700 permanences associatives d’accès aux droits et d’accompagnement des femmes
  victimes de violences, qui accueillent également près de 30 000 personnes par an.
  Depuis 2017, le 3919 a enregistré plus d’un million d’appels, dont plus de 127 000
  en 2025. Désormais accessible 24 heures sur 24 et 7 jours sur 7, il est adapté aux
  personnes en situation de handicap et propose un accueil dans certaines langues
  régionales, notamment en outre-mer. Créée en 2023, l’aide universelle d’urgence
  a bénéficié à près de 100 000 femmes victimes, grâce à l’engagement des caisses
  d’allocations familiales et de la mutualité sociale agricole. Depuis son lancement
  dans le Val-d’Oise en septembre 2023, le Pack Nouveau Départ, un dispositif conçu
  pour coordonner les acteurs locaux et accompagner les victimes vers une sortie durable
  du cycle de violences, a déjà accompagné 3 471 victimes dans 20 départements. La
  protection effective des victimes a été considérablement renforcée. Les téléphones
  grave danger sont passés de 976 en 2020 à 7 766 en juillet 2026. Depuis 2020, 3
  544 bracelets anti-rapprochement ont été attribués. Le nombre d’ordonnances de protection
  délivrées a triplé, de 1 397 en 2017 à 4 261 en 2024. La prévention et la lutte
  contre toutes les formes de violences mobilisent l’ensemble des services publics,
  dès le plus jeune âge et dans tous les secteurs de la société. Déployés depuis la
  rentrée 2025, les programmes d’éducation à la vie affective, relationnelle et à
  la sexualité (EVARS) permettent de prévenir les violences et de sensibiliser les
  élèves au respect de soi et d’autrui : 91,4 % des élèves du premier degré et 62
  % de ceux du second degré ont bénéficié d’au moins une séance. Dans le sport, la
  plateforme Signal-Sports a permis de traiter 2 607 signalements depuis sa création,
  conduisant à 1 135 mesures administratives. La formation des professionnels a également
  changé d’échelle : depuis 2019, 211 000 policiers et gendarmes ont été formés aux
  violences intrafamiliales, tandis que la convention avec l’École nationale de la
  magistrature renforce la formation des magistrats au repérage et au traitement de
  ces violences. 30 centres de prise en charge des auteurs de violences conjugales
  ont accompagné plus de 77 000 personnes depuis 2022. Enfin, depuis 2017, 2 547 personnes
  ont suivi ou suivent un parcours de sortie de prostitution, dont 921 au 31 décembre
  2025, soit un nombre de victimes accompagnées multiplié par 8 entre 2017 et 2025.
  Le Gouvernement demeure pleinement mobilisé pour poursuivre et amplifier la déclinaison
  locale de ces politiques. D’ici la fin de l’année 2026, 2 engagements majeurs auront
  été tenus : des Maisons des femmes présentes dans tous les départements et la possibilité,
  partout en France, de déposer plainte à l’hôpital ou d’y faire recueillir des preuves
  sans plainte. Le Pack Nouveau Départ sera généralisé d’ici fin 2027. La proposition
  de loi dite « intégrale », coconstruite avec les associations et les parlementaires
  et dont l’examen au Sénat est prévu dans quelques semaines porte une ambition :
  opposer au continuum des violences un continuum de protection et faire système contre
  ce qui, depuis trop longtemps, fait système. En articulant plus étroitement prévention,
  formation, éducation, justice, santé, sécurité et protection de l’enfance, elle
  vise à garantir une réponse globale et cohérente, à chaque étape du parcours des
  victimes. Elle prévoit notamment la reconnaissance de l’inceste comme infraction
  autonome et s’articule avec le projet de loi relatif à la protection des enfants,
  adopté par le Sénat en novembre 2026, qui comprend l’imprescriptibilité des crimes
  sexuels commis sur les mineurs. Après près de 10 années de transformation de l’action
  publique, cette mobilisation doit se poursuivre sans relâche : chaque avancée législative
  doit se traduire par une protection supplémentaire et effective pour les victimes
  pour que chaque victime puisse accéder à la vérité et à la justice. Le conseil des
  ministres a adopté les mesures individuelles suivantes : - M. Pascal MAILHOS , administrateur
  de l’Etat, coordonnateur national du renseignement et de la lutte contre le terrorisme,
  est maintenu dans ses fonctions jusqu’au 13 mai 2027 ; - Mme Claire CHAUFFOUR-ROUILLARD
  , administratrice de l’Etat, est nommée déléguée interministérielle au développement
  de la vallée de la Seine, à compter du 14 décembre 2026. Sur proposition du ministre
  de l’intérieur : - M. Pierre ORY , administrateur de l’Etat, est nommé préfet de
  la région Centre-Val de Loire, préfet du Loiret, à compter du 30 novembre 2026 ;
  - Mme Muriel NGUYEN , administratrice de l’Etat, est nommée préfète de la Seine-et-Marne,
  à compter du 14 décembre 2026 ; - M. Guillaume DOUHERET , administrateur de l’Etat,
  est nommé préfet de l''Aveyron ; - M. Olivier DE MAZIÈRES , administrateur de l’Etat,
  est nommé préfet de Vaucluse ; - Mme Corinne SIMON , administratrice de l’Etat,
  est nommée préfète du Gers ; - Mme Virginie BRUNNER , directrice des services actifs
  de la police nationale, est nommée préfète de police déléguée auprès du préfet des
  Bouches du Rhône ; - M. Olivier MARMION , administrateur de l’Etat, est nommé préfet
  pour l’égalité des chances auprès de la préfète de l’Essonne.'
