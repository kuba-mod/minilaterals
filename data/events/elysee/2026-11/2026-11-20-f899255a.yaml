date: '2026-11-20'
type: press_release
source_name: elysee
title: Inauguration de la Grande Exposition du Fabriqué en France 2026.
text: 'Le Président de la République a inauguré, vendredi 20 novembre 2026, la sixième
  édition de la Grande Exposition du Fabriqué en France, organisée au Palais de l’Elysée
  et ouverte au public durant le week-end des 21 et 22 novembre 2026. Initié par le
  chef de l’État en janvier 2020, ce rendez-vous annuel met à l’honneur les entreprises,
  les artisans, les producteurs, les start-ups et les industriels qui s’engagent pleinement
  dans la fabrication française . Ouvert au public et gratuit, concluant la Semaine
  de l’industrie , l’événement a pour but d’inciter chacun – collectivités, distributeurs,
  entreprises et citoyens – à prendre sa part dans la dynamique engagée en faveur
  de notre souveraineté économique. 104 produits fabriqués en France et issus de tous
  les départements de métropole et d’Outre-mer feront ainsi leur entrée au Palais
  de l’Élysée, dans les jardins, les salons et la cour d’honneur. Leur variété illustre
  la grande richesse des savoir-faire français . Objets du quotidien, spécialités
  locales, outils industriels ou innovations emblématiques, ils proviennent d’entreprises
  de toutes tailles et de tous les secteurs d’activité. En parallèle des sélections
  habituelles, 9 produits lauréats des éditions précédentes feront leur retour en
  cour d’honneur. Cette nouvelle édition regroupe également des entreprises du programme
  « ETIncelles » lancé fin 2023 par le Président de la République avec pour objectif
  de faire grandir 300 PME vers le statut d’ETI d’ici 2027 . 20 novembre 2026 - Seul
  le prononcé fait foi Bonjour Mesdames et Messieurs, bienvenue dans cette maison.
  Plus que jamais la formule qui consiste à dire que cette maison est la vôtre, n''a
  été vraie parce que vous avez envahi les lieux, à proprement parler, puisqu''il
  y a aujourd''hui du fabriqué en France partout. Mesdames, Messieurs les ministres,
  Mesdames, Messieurs les parlementaires, Mesdames, Messieurs les présidentes et présidents
  de régions, de départements, Mesdames et Messieurs les préfets, Mesdames et Messieurs
  les membres du jury, anciens lauréats, ambassadeurs de leur région, représentantes
  et représentants aussi des associations de consommateurs, chefs d''entreprises,
  artisans, producteurs, collaboratrices, collaborateurs, Mesdames, Messieurs en vos
  grades et qualités comme on dit, chers tous. Je suis très heureux de vous recevoir
  aujourd''hui. On était avec les membres du jury qui ont passé du temps pour sélectionner
  les projets aujourd''hui retenus et vous recevoir, c''est aussi une manière de lancer
  en quelque sorte les prochains jours et vous dire la joie, l''honneur de pouvoir
  ouvrir cette maison aux Français pour le Fabriqué en France. Chacun des lauréats
  ici s''est surpassé, vous allez le voir, plusieurs d''entre vous sont concernés,
  mais vous allez le voir en passant à travers évidemment les différents stands et
  chacun d''entre vous est un peu un concentré du savoir-faire français et de ce qu''on
  sait faire dans tous les domaines d''activité partout à travers le pays. C''est
  une grande fierté pour nous d''avoir cette sixième édition du Fabriqué en France.
  C''est la sixième fois et d''avoir ici des nouveaux arrivants et des nouveaux lauréats,
  des gens qui confirment et qui vont encore plus loin, qu''on voit grandir année
  après année, de voir aussi celles et ceux qui avaient gagné ces dernières années
  passer de leur temps pour en aider d''autres. C''est une cordée, comme je l''ai
  parfois dit, ça a été quelquefois déformé, mais j''assume cette formule, même quand
  c''est pour défendre les chaussures de montagne produites à Nay dans les Pyrénées.
  Donc vous êtes là avec au fond cette vocation de tirer l''emploi partout dans le
  pays, de montrer qu''en France on a la capacité à produire, qu''on a la capacité
  à innover, qu''on a la capacité parfois à relocaliser des savoirs qui étaient partis,
  à développer et à exporter. La part de valeur ajoutée réalisée en France, les savoir-faire
  mobilisés, les engagements sociaux et environnementaux, les efforts de relocalisation,
  tout ça a été examiné par le jury auquel je redis mes remerciements avec beaucoup
  d''attention. Ce sont autant d''étapes et de mises à l''épreuve qui font de la grande
  exposition qu''on va avoir à partir de ce soir et durant tout le week-end un grand
  moment de fierté tricolore. Donc, avant toute chose, je veux évidemment remercier
  le jury qui s''est mobilisé, qui a été renouvelé cette année avec des lauréats,
  remercier et féliciter évidemment les 104 lauréats et toutes celles et ceux qui
  ont contribué à leur sélection. Vous pouvez applaudir tout le monde. Je veux ici
  vraiment dire ma gratitude aux préfets de région et à tous les préfets de département
  qui, à leurs côtés, ont identifié tout cela avec leurs relais économiques locaux,
  qui ont préparé les candidatures, évidemment, nos membres du jury, anciens lauréats
  représentants des consommateurs, qui sont aussi des ambassadeurs du Fabriqué en
  France. Je veux remercier la Direction générale des entreprises, la DGCCRF, les
  douanes, Business France, les équipes des ministères et les équipes de l''Élysée
  qui ont préparé ces décisions. Vraiment, merci à tous pour le temps passé. Pour
  moi, c''est une très grande fierté parce que, chaque année, on découvre, en parcourant
  les allées, vous allez retrouver le siège de conducteur de l''Alpine. Il était là
  ce matin, je ne sais pas s''il est encore là ou il a bougé, mais je l''ai vu ce
  matin-là, donc il a dû être ici. Il y a le siège conducteur de l''Alpine A390 GT,
  la caméra sous-marine, le robot médical venu du Loir-et-Cher, du sucre de Guadeloupe,
  un abat-jour bourbonnais, des briques de Mayotte, etc. Je ne vais pas faire de jaloux,
  donc je vais arrêter ici de citer, mais il y a du numérique, des produits industriels,
  de l''artisanat, des produits agroalimentaires. Donc, il y a une variété qui correspond
  à tous les savoir-faire français et qui montre la force de ce fabriqué en France
  et de la fierté qu''on peut avoir, et qui, de l''agriculture à l''industrie agroalimentaire,
  en passant par l''industrie classique, la deep tech, tous les secteurs, est représentée.
  Tout ça, c''est le fruit de votre travail, de votre mobilisation, de savoir-faire
  qui viennent de technologies de rupture ou de savoir-faire ancestraux, et de la
  mobilisation de vos collaboratrices et de vos collaborateurs. Pour moi, de vous
  réunir ce soir, aujourd''hui, pour la sixième fois, aux côtés de nos ministres,
  des jurys, avec vous tous, évidemment, ça a un caractère un peu particulier. D''abord,
  parce que c''est la sixième édition, donc on vient consolider une initiative prise
  ensemble il y a quelques années. Ça s''inscrit dans la poursuite aussi d''un travail
  fait depuis plusieurs années autour du Made in France , de tout ce qui a été fait
  par des femmes et des hommes qui ont cru très tôt à cela. Et puis, c''est la dernière
  fois que je vous reçois ici, après ces deux mandats, à l''issue de ces deux mandats,
  pour pousser ça. Ce que je veux ici vous dire et le message que je veux porter avec
  vous, c''est d''abord qu''il n''y a pas de fatalité dans notre pays. J''entends
  ce discours qui est un discours de défaite chaque jour, en ce moment. L''impression
  que le pays va s''effondrer, que tout va mal, que c''est terrible. Vous êtes, au
  fond, la France pour qui ce n''est pas plus facile que les copains, mais qui a le
  goût de l''avenir et qui a le sens des responsabilités. Qui dit, oui, c''est très
  dur. Pour vous, le prix du carburant n''est pas moins cher qu''ailleurs. Pour vous,
  les difficultés sont les mêmes qu''ailleurs. Mais on aime notre pays et on a envie
  de redresser, au fond, on a envie de se dire qu''il y a le choix entre rester assis
  et déplorer ou continuer d''avancer. Et on a besoin de ça. Je veux dire ici que
  notre pays n''est pas ce qu''on décrit chaque jour. Nous en avons changé tous ensemble
  la trajectoire parce qu''il n''y a pas de fatalité. Nous l''avons fait grâce à vous,
  parce que vous vous êtes mobilisés, parce que parfois vous avez repris une entreprise
  qui était en déclin, parce que vous avez décidé de prendre vos risques avec des
  collaboratrices et des collaborateurs, parce que vous avez décidé que rien n''était
  écrit et qu''on pouvait y aller, que vous l''avez fait et que vous êtes en train
  de le faire. C''est vous qui avez raison. Parce que c''est comme ça qu''on construit
  un grand pays et c''est comme ça qu''à chaque étape de la vie de notre nation, on
  la construit. Une nation, c''est ça. Ceux qui se demandent ce que c''est que l''identité
  de la France, c''est ça. Nous sommes un pays qui a vécu ensemble des grandes histoires
  et qui est prêt à en écrire d''autres. C''est ce que ce fabriqué en France montre.
  Donc ce soir, c''est vous dire que vous êtes ce visage d''une France qui a envie,
  qui fait, qui avance, qui transforme. Elle est là, cette France. Elle veut juste
  qu''on continue de lui enlever des difficultés, qu''on l''aide encore davantage
  à avancer plus vite. Et qu''on avance. Et pour ça, rien n''était écrit. Je voulais
  ici vous dire merci pour ça, vous dire que ce combat de chaque jour que vous menez,
  c''est le bon, c''est le véritable combat, c''est celui qui crée des emplois, c''est
  celui qui permet à des familles de vivre, c''est celui qui permet à des territoires
  d''avoir de l''espoir et de se reprojeter, c''est celui qui permet à des jeunes
  d''aller vers un emploi ou à d''autres, un peu plus tard dans leur vie, de retrouver
  un emploi. Donc ne lâchez rien. Vous n''avez rien lâché ces dernières années, ne
  lâchez rien aujourd''hui et ne lâchez rien demain. C''est ça notre pays. Alors,
  en vous disant merci, tout ça, ce n''était pas écrit. C''est le fruit de votre travail,
  c''est vous les premiers qui l''avez fait. Mais depuis 2017, ensemble, on a fait
  beaucoup de choses. On a d''abord arrêté la désindustrialisation qui avait eu lieu
  dans le pays pendant 12 ans. Pendant 12 ans, chaque année, on a détruit de l''emploi
  industriel et fermé plus d''usines qu''on n''en ouvrait. On a 300 ouvertures d''usines
  sur notre territoire en net. Donc on n''a pas simplement stoppé la désindustrialisation.
  Malgré les difficultés qu''on a depuis deux ans, avec le prix de l''énergie, les
  chocs géopolitiques, la concurrence déloyale qu''on subit, on continue de tenir
  cette réindustrialisation. 300 ouvertures d''usines sur notre territoire, dont 150
  en cours de création sur la seule année 2026. On ne l''avait pas connu depuis bien
  longtemps. On a créé 2,5 millions d''emplois depuis mi-2017, dont 1,8 million d''emplois
  salariés. C''est un rythme près de quatre fois supérieur à celui de la décennie
  précédente. Quatre fois supérieur. Ce sont près de 100 000 emplois industriels supplémentaires
  parmi ces 2,6 millions d''emplois. Cette dynamique, on la doit aussi à une capacité
  collective à réinventer notre industrie. C''est-à-dire que, quand je parle de cette
  réindustrialisation, c''est une réindustrialisation plus décarbonée par la transformation
  de notre industrie classique, des cimenteries à la sidérurgie, et par la création
  aussi d''une industrie nouvelle, décarbonée, avec des jeunes pousses technologiques.
  Au fond, depuis 2017, on a montré qu''on pouvait réconcilier trois objectifs. La
  création d''emplois, en particulier industriels. La compétitivité pour notre pays,
  avec. La souveraineté, deuxième grand objectif, c''est-à-dire avoir la maîtrise
  d''éléments de la chaîne de valeur, qui sont essentiels pour être indépendants,
  et nos objectifs climatiques. Ceux qui les ont très longtemps opposés n''ont pas
  compris que, justement, en les réconciliant, on avait une trajectoire, et que c''est
  en décarbonant qu''on a réussi à relocaliser de l''emploi. Je vais prendre un exemple
  très simple. On est sans doute l''un des pays qui avait le plus désindustrialisé
  dans l''automobile. Le choc du Covid, d''ailleurs, nous en a encore mis un coup.
  C''était une réalité. On était plus compétitifs sur le véhicule thermique parce
  que les habitudes avaient changé, les gens étaient allés sur des catégories de véhicules,
  dans leurs demandes. On était moins compétitifs et on n''avait pas réussi à suivre
  la montée en gamme dans d''autres segments. La décarbonation du véhicule a fait
  qu''on a créé littéralement de bout en bout une filière française, de l''hybride
  pour certains, je pense à Toyota, mais du véhicule électrique, pour la France entière,
  qui n''existait pas. Il y a dix ans, on me disait : « n''allez pas trop vite sur
  le véhicule électrique, les batteries sont toutes faites en Asie. Vous n''y arriverez
  pas. » Au moment où je vous parle, et tous ceux qui le savent, qui sont entre autres,
  dans la vallée des batteries électriques, dans nos Hauts-de-France le savent, on
  a créé quatre gigafactories de batteries. Elles tournent. On a recréé des sites
  de production de véhicules électriques dans notre pays. Vous allez entre Douai et
  Maubeuge, vous avez l''illustration de ce qu''on dit. On fabrique des batteries
  électriques. On a refabriqué la R5 électrique et même la R4 dans la même région.
  On recrée de l''emploi industriel en décarbonant et on remaîtrise des parties de
  la chaîne de valeur en faisant ça. Donc, il n''y a pas de fatalité. Il y a une volonté,
  des investissements, de la rigueur, une cohérence pendant 10 ans dans les choix
  qui ont été faits. Et preuve que cela fonctionne, on a pu rouvrir des usines, comme
  je le disais, plus 300 dans l''industrie, et dans le même temps accélérer la décarbonation
  parce qu''on a fait moins 93 millions de tonnes. C''est-à-dire qu''on a plus baissé
  nos émissions en 10 ans qu''on ne l''avait fait depuis le début 90. On a multiplié
  par 4 la baisse d''émissions annuelles de CO2 dans notre pays. Donc, il n''y a pas
  de fatalité et il y a des résultats qui sont là. Et les résultats, ce sont les vôtres.
  Ces réussites, on les a soutenues sans relâche. Et je voulais revenir, en remerciant,
  sur quelques dispositifs, mais rappeler ce qui a été fait par les gouvernements
  successifs, par les parlementaires, beaucoup sont là aussi, par les filières, beaucoup
  sont là aussi, par nos territoires, parce que tout ça, ce n’est pas venu tout seul.
  C''est votre engagement, c''est une mobilisation au niveau européen pour créer cette
  stratégie, et puis ce sont des changements qu''on a faits dans notre politique et
  qu''il faut défendre et qu''il faudra défendre dans les débats à venir, parce qu''ils
  ne sont pas tombés tout seuls. On avait, on le sait, un enjeu de compétitivité,
  notamment pour nos PME et nos ETI, il y a 10 ans. Je ne vais pas dire tout ce qui
  a été fait, mais quelques axes. On a consenti un effort financier inédit pour baisser
  les impôts, et plus particulièrement les impôts de production. Ils ont baissé de
  10 milliards d''euros, moins 10 milliards d''euros. Ce n''est pas assez, mais c''est
  un chemin qu''on a commencé. Je ne souhaitais qu''une chose, c''est aller plus vite.
  L''impôt sur les sociétés, quand j''ai été élu, il était de 33 1/3, et il y avait
  même la surtaxe. Il est aujourd''hui, pour les PME et les ETI, de 25 %. On s''est
  remis dans la moyenne européenne. La flat tax, très importante pour beaucoup d''entre
  vous et de vos investisseurs, revenue à la moyenne européenne. C''est également
  aussi le sens du crédit d''impôt au titre des investissements dans l''industrie
  verte, qui a été la réponse française à ce qui se passait dans d''autres territoires.
  La loi de finances pour 2026 l''a prorogée jusqu''à fin 2028, et le PLF 2027, qu''il
  est important de finir et de voter, l''étend notamment aux réseaux électriques et
  aux aimants permanents des moteurs électriques. Et enfin, le Gouvernement porte
  un suramortissement pour la robotique dans le PLF 2027. Je cite là que quelques-uns
  des axes, mais vous voyez qu''il y a des choix forts qui ont été faits, en particulier
  en matière de fiscalité pour nos PME et nos ETI. Et c''est toujours pareil, gâteau
  avalé n''a plus de saveur, tout le monde a oublié, c''est normal, c''était de tout
  temps. Non, ce n''était pas de tout temps, c''est des choix qui ont été faits. Ils
  ont été assumés, ils ont été portés avec cohérence, ils vous ont aidés dans les
  résultats. Ainsi, depuis 2017, l''investissement privé est reparti en France et
  est devenu un levier central. On crée des emplois parce qu''il y a des femmes et
  des hommes qui prennent des risques. Ils prennent des risques quand ils ont un retour
  sur ces risques et quand ils décident d''investir. C''est pour ça qu''il faut une
  fiscalité attractive, il faut de la stabilité dans les règles et il faut un cadre,
  comme on l''a fait avec les ordonnances de 2017, attractif pour le travail. Tous
  ceux qui racontent chaque jour qu''on devrait mettre « cul par-dessus tête » le
  pays, qu''il faudrait aller taxer ceux qui réussissent et qui me remettent un discours
  de jalousie et de haine de la réussite dans le pays, ce sont ceux qui empêcheront
  le Fabriqué en France. Et ça, je peux vous le dire, il y a un en même temps qui
  ne marche pas, c''est d''expliquer qu''on va défendre les territoires, l''industrie
  dans les territoires et qu''en même temps on va taxer plus ou qu''on va être contre
  ceux qui réussissent dans le pays. Ça, ça ne marchera pas. Ensuite, il y avait un
  autre chantier, c''était la simplification. Là aussi, on n''a pas tout fait, comme
  il m''a dit sur les impôts de production, je l''ai entendu, il m''a dit : « Ce n''est
  pas assez. » C''est vrai, mais sur la simplification, je veux quand même dire tout
  ce qui a été fait, et il y en a eu beaucoup. La loi ASAP, la loi Industrie verte
  de 2023, le projet de loi simplification, des délais qui ont été réduits dans beaucoup
  de secteurs de 17 mois à 10 mois. Il y a eu loi après loi. Il n''y a rien de plus
  compliqué que de simplifier, je vous le dis. C''est vrai, c''est terrible, parce
  que derrière chaque règle qui a été créée, il y avait des intérêts. Donc, il y avait
  des bouts de chaque secteur qui disait : « Il faut mettre des règles pour éviter
  que chaque concurrent vienne nous emmerder », pardon de le dire comme ça, « pour
  qu''on ne soit pas embêtés par la concurrence étrangère et autres. » Donc simplifier,
  c''est toujours très dur. Et puis, il y a des réglementations légitimes pour protéger.
  Donc, on a simplifié dans beaucoup de secteurs, on a réduit des procédures, on a
  créé des procédures unifiées, on a essayé aussi de le faire, et c''est ce qu''on
  est en train de faire au niveau européen. Simplifier, accélérer, c''est aussi ce
  qu''on a lancé, il y a un an avec la méthode dite Notre-Dame. Et je retrouverai
  certains d''entre vous lundi pour le Choose France en France qui se tiendra ici,
  où je présenterai le résultat de ce qui a été annoncé, il y a un an avec ces fameux
  projets Notre-Dame. Pourquoi Notre-Dame ? Parce que j''ai un peu interpellé nos
  ministères et nos administrations en disant : « On est le pays qui s''enorgueillit,
  pour des bonnes raisons, d''avoir restauré, réinventé, rebâti Notre-Dame en 5 ans
  », ce que tout le monde croyait impossible quand on l''a déclaré. Et en même temps,
  on nous dit, il faut 6 ans, 7 ans pour étendre un poulailler ou pour créer un site
  industriel lambda. Ce n''est pas normal. Donc, ce qu''on a su faire pour Notre-Dame,
  qui est logique projet, équipe unifiée, on écrase les délais, on fait tout en parallèle
  et pas une procédure à la file de l''autre, on doit pouvoir le faire pour les projets
  importants pour le pays. C''est ce qui a été fait ces derniers mois avec une mobilisation
  de nos préfets, de nos administrations, et ça, c''est une grande simplification,
  c''est le gain de temps. Donc ça, on le présentera lundi avec aussi, vous verrez,
  des annonces fortes sur les délais de débats publics et autres. Mais donc la simplification,
  ça a été un des axes d''efforts des dernières années. Il faut faire beaucoup plus,
  il faut encore accélérer, il y a encore trop de lourdeurs, mais cet effort était
  important, il a contribué au réinvestissement. Et vous savez, quand j''ai fait ces
  Choose France avec les investisseurs internationaux, un des arguments qui marchait
  le mieux, c''était aussi ça, c''est qu''on a quand même, ces dernières années, su
  aller parfois beaucoup plus vite que certains voisins européens. Et à chaque fois,
  moi, je regardais les écarts. Quand on ralentissait, parce que c''est une compétition,
  il fallait remettre de l''énergie. Et c''est ce qu''on fait en ce moment sur les
  data centers et autres, c''est continuer d''accélérer pour aller plus vite que les
  compétiteurs. Troisième axe d''efforts sur lequel je voulais revenir, c''est les
  entreprises de technologies d''avenir, toutes celles qui réduisent nos dépendances
  stratégiques, que nous avons épaulées avec des investissements ciblés et conséquents.
  Toutes ces dernières années, on a eu une obsession, c''est rendre le pays plus indépendant,
  à la pointe de la technologie. Et c''est ce qui fait quand même qu''on a relocalisé
  beaucoup de compétences, qu''on est le pays qui a été le plus attractif d''Europe
  pendant 7 ans de manière consécutive, et qu''on a réussi à avoir, quand on regarde,
  je ne m''échappe pas, là, de tous les débats qu''on a en ce moment, et parfois les
  gens ne nous sortent que les 6 derniers mois de croissance ou de relocalisation,
  ils prennent des périodes... Moi, je regarde la période 2017-2025. Je suis rigoureux
  comme vous quand vous faites les termes sur les chiffres de vos entreprises, c''est
  mon bilan. Je regarde ce qui a été fait en termes de croissance par rapport aux
  voisins européens, on est meilleurs, contrairement à ce que beaucoup écrivent en
  prenant d''autres périodes de référence. Et donc on a mis en place des dispositifs
  dont vous vous êtes saisis, mais je veux les rappeler. France Relance, en 2020,
  en sortant du covid, c''est 100 milliards d''euros, dont 40 milliards d''euros financés
  par l''Union européenne, pour toujours rappeler que l''Europe est importante, 60
  milliards sur notre budget. Mais on a fait le plan… on a arrosé partout sur les
  territoires les projets qui auraient pu tomber en sortant du covid. Il ne faut pas
  l''oublier, ce qui a été fait avec France Relance. Juste après, on a fait France
  2030, 54 milliards d''euros prévus sur ce plan, 44 milliards avaient déjà été engagés
  fin 2025 au bénéfice de près de 9 000 projets, et des projets qui changent la donne
  chacun dans leur secteur, de l''agriculture au spatial en passant par le numérique,
  la deeptech, etc, et des projets qui renforcent notre pays : le nucléaire, l''hydrogène
  vert, les véhicules électriques, les avions décarbonés, la santé, l''alimentation,
  la culture, l''espace, les fonds marins. Ça, ça a été clé, et parce que la réussite
  de ces entreprises repose avant tout sur les talents et les compétences de celles
  et ceux qui les portent, on a formé avec France 2030 plus de 200 000 personnes aux
  métiers de demain sur la seule année 2025. Donc ça a été aussi une transformation
  de cet instrument. Donc on a commencé à préparer l''avenir. Et plusieurs d''entre
  vous ici présents, je le sais, ont pu bénéficier de ces accompagnements, que ce
  soit France Relance ou France 2030, et c''était important. Et on a beaucoup de produits
  exposés ici qui le rappellent, parce que vous êtes en train de pousser les limites,
  et on a beaucoup de produits exposés ici dans ce Fabriqué en France qui poussent
