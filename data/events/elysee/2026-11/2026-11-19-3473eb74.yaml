title: 9e édition du DuoDay.
text: La 9e édition du DuoDay a eu lieu le jeudi 19 novembre 2026, dans le cadre de
  la 30e Semaine européenne pour l’emploi des personnes handicapées (SEEPH), qui se
  tient du 16 au 22 novembre 2026. Partout en France, cette opération a permis de
  former des duos entre des personnes en situation de handicap et des professionnels
  volontaires, au sein d’entreprises, de collectivités ou d’associations. L’objectif
  est de favoriser la découverte d’un métier, de faire évoluer les regards sur le
  handicap et d’ouvrir des perspectives d’insertion professionnelle. À l’Élysée, 16
  personnes en situation de handicap ont pu passer la journée dans les différents
  services de la Présidence de la République. Parmi elles, Pierre a accompagné le
  président Emmanuel Macron lors de son déplacement à Berlin, où il participait à
  la réunion de la Coalition des volontaires.
