title: Entretien avec Sophie Adenot.
text: Le Président de la République a reçu l'astronaute française Sophie Adenot, ce
  lundi 2 novembre 2026 au Palais de l'Élysée. Le chef de l’État a salué le travail
  de l'astronaute de l’ESA et des équipes impliquées après un séjour de 235 jours
  à bord de la Station spatiale internationale (ISS) , plus longue mission d’un astronaute
  européen, et trois sorties extravéhiculaires , faisant d’elle la première femme
  française à réaliser une sortie dans le vide spatial. Il l'a remerciée chaleureusement
  d'avoir incarné la France comme puissance spatiale, au service du progrès scientifique,
  du multilatéralisme et des coopérations internationales.
