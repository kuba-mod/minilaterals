date: '2026-11-25'
type: press_release
source_name: elysee
title: Journée internationale pour l'élimination de la violence à l'égard des femmes.
text: Message du Président de la République à l'occasion de la journée internationale
  pour l'élimination de la violence à l'égard des femmes. Aucune femme ne doit vivre
  dans la peur. Ne nous résignons jamais face aux violences. Continuons à nous mobiliser
  pour y mettre fin. Du Grenelle des violences conjugales en 2019 aux travaux sur
  la proposition de loi intégrale contre les violences sexistes et sexuelles, les
  associations, les professionnels et les parlementaires n’ont cessé de s’engager.
  Je continuerai d’agir à leurs côtés pour que les femmes victimes de violences soient
  mieux protégées et accompagnées dans la durée. 25 novembre 2026 - Seul le prononcé
  fait foi Le 25 novembre, partout dans le monde, nous nous mobilisons pour que cessent
  les violences faites aux femmes. Cette journée est essentielle pour que toutes celles
  qui vivent encore ces violences, et parfois depuis longtemps, soient entendues et
  que nous continuions d'agir. Je sais combien parfois il est difficile de sortir
  d'une emprise, je sais combien parfois il est difficile de parler, de dénoncer.
  Et nous avons toutes ces dernières années fait le maximum pour que justement la
  parole retrouve sa place et que l'action pour protéger toutes ces femmes voit le
  jour. Ces dernières années, des femmes ont pris la parole. Elles ont raconté ce
  qu'elles avaient subi, parfois devant la France entière, avec beaucoup de courage.
  Certaines affaires nous ont profondément touchés. Et derrière chacune d'elles, il
  y a une femme dont la vie a été bouleversée ou brisée, et je ne me suis jamais résigné
  à ce que cela continue. Je ne me suis jamais résigné non plus à ce que nous continuions
  d'égrener le nombre des féminicides, qui sont à chaque fois un échec pour la société
  tout entière. Et donc en m'adressant à vous aujourd'hui, je veux ici rappeler et
  défendre tout ce qui a été fait, ce que nous continuons de faire, associations,
  pouvoirs publics, mais dire que jusqu'au bout, nous devons continuer d'agir pour
  protéger chaque vie. Les associations ont beaucoup fait pour que cette parole soit
  entendue, celles qui portent ce combat au niveau national et celles qui, partout
  en France, partout dans le monde, accueillent et accompagnent les femmes. Elles
  nous ont dit ce qui se passait quand une femme cherchait de l'aide et ce qui lui
  manquait pour être protégée. Et je veux remercier l'ensemble des associations, l'ensemble
  des bénévoles pour leur travail vital. Comme vous le savez, j'ai fait de l'égalité
  entre les femmes et les hommes la grande cause de chacun de mes deux quinquennats.
  Avec le Grenelle des violences conjugales, dès 2019, nous avons voulu que l'État
  prenne toute sa part. Des femmes ont pris la parole, des groupes de travail ont
  été lancés, des décisions ont été prises, des lois ont été votées puis promulguées,
  et les choses ont profondément changé. Pour qu'une femme puisse être entendue au
  moment où elle est prête à parler, nous avons rendu le 3919 accessible à toute heure.
  Nous avons renforcé la formation des policiers et des gendarmes qui accueillent
  les victimes. Nous avons aussi renforcé la formation des magistrats et réorganisé
  les choses. Parce que sous l'emprise d'un conjoint, on peut avoir du mal à raconter
  ce qu'on vit. Il faut aussi savoir écouter cette parole, reconnaître le danger même
  quand il est difficile à exprimer. C'est pourquoi nous avons multiplié les points
  de contact, rappelez-vous, dans les pharmacies, prendre la parole à l'hôpital, etc.,
  etc. Pour protéger, nous avons aussi changé la loi. Nous avons créé le bracelet
  anti-rapprochement, renforcé les ordonnances de protection pour que le juge puisse
  agir dans les situations les plus urgentes. Nous avons déployé davantage de téléphones
  grave danger. Nous avons ouvert davantage de places d'hébergement pour qu'une femme
  puisse être mise à l'abri immédiatement avec ses enfants si elle en a. Et puis il
  y a tout ce qui vient après, le reste de la vie qui, parfois, empêche de parler
  ou d'agir. Quand une femme quitte son conjoint devenu violent ou qui a toujours
  été violent, elle doit souvent quitter son logement du jour au lendemain. Parfois,
  elle n'a pas accès à l'argent du ménage. Il faut ainsi pouvoir payer le trajet,
  les premières dépenses. C'est pour cela que nous avons créé l'aide universelle d'urgence.
  Dans les semaines qui suivent, il faut retrouver un logement, pouvoir faire valoir
  ses droits. Nos institutions ont dû s'adapter à cette réalité. C'est tout le sens
  du pack Nouveau Départ que nous allons généraliser à l'ensemble du pays. Une femme
  qui quitte un conjoint violent doit pouvoir compter sur un interlocuteur qui connaît
  sa situation, qui l'aide à faire avancer ses démarches auprès des différents services.
  Elle doit pouvoir encore compter sur lui plusieurs semaines ou plusieurs mois après
  son départ. Nous avons multiplié les moyens pour rendre cet accompagnement possible.
  L'État et les collectivités doivent continuer à s'engager aux côtés des associations
  pour que chaque femme puisse être accompagnée aussi longtemps qu'elle en a besoin
  afin de retrouver son autonomie. Nous avons aussi inscrit le consentement dans la
  définition du viol et des agressions sexuelles. Et je veux remercier en particulier
  tous les parlementaires qui se sont mobilisés sur ce sujet. Et si nous voulons casser
  le cycle des violences, il faut en parler bien plus tôt avec des mots adaptés à
  l'âge des enfants, leur apprendre qu'ils peuvent dire non, qu'ils doivent entendre
  le non de l'autre. Et cela se joue à l'école, cela se joue dans les familles, dans
  ce que les enfants nous voient accepter ou refuser au quotidien. À vous qui vivez
  ces violences, je veux dire que, où que vous viviez, vous devez pouvoir compter
  sur l'État pour vous protéger et vous accompagner. Beaucoup de choses ont été faites
  et je veux remercier l'ensemble de celles et de ceux qui y ont contribué sans relâche.
  Mais ce combat continue et je continuerai à le mener avec vous toutes et vous tous,
  chaque jour, jusqu'à la dernière seconde. 25 novembre 2026 - Seul le prononcé fait
