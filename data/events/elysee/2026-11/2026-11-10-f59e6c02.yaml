title: Compte rendu du Conseil des ministres du 10 novembre 2026.
text: 'Retrouvez le compte rendu du Conseil des ministres du mardi 10 novembre 2026.
  Le Premier ministre et le ministre délégué auprès du Premier ministre, chargé des
  relations avec le Parlement, ont présenté un projet de loi portant diverses dispositions
  relatives à l’intégrité publique, ainsi qu’un projet de loi organique ayant le même
  objet. Le projet de loi met en œuvre plusieurs préconisations du rapport « La HATVP
  : douze ans au service de l’intégrité publique », remis au Premier ministre en mai
  2026 par le président de la Haute Autorité, M. Jean MAÏA, à l’issue d’une concertation
  avec plus de quarante institutions et personnalités. Ce rapport conclut à la solidité
  du dispositif construit depuis la loi du 11 octobre 2013 relative à la transparence
  de la vie publique, tout en appelant à le rationaliser et à le simplifier. Le projet
  de loi procède ainsi par ajustements ciblés, sans bouleverser l’architecture existante
  ni la vocation essentiellement préventive de la Haute Autorité. Il vise d’abord
  à consolider la prévention. Le défaut de communication des déclarations d’intérêts
  et de situation patrimoniale est dépénalisé, et la Haute Autorité pourra assortir
  d’une astreinte le non-respect d’une injonction, afin de contraindre les responsables
  publics à se soumettre à leurs obligations déclaratives. Elle pourra aussi assortir
  de réserves ses avis sur les projets de reconversion professionnelle exposant la
  personne concernée à un risque d’influence étrangère. Ses demandes de déport seront
  transmises à certains employeurs publics, et ses avis au référent déontologue de
  l’administration à l’origine de la saisine. Il actualise, rationalise et simplifie
  ensuite les contrôles. Les actifs numériques sont intégrés au dispositif de gestion
  sans droit de regard. La période de référence des déclarations d’intérêts est ramenée
  de cinq à trois ans. Sont supprimées la déclaration d’intérêts de fin de mandat
  des membres du Gouvernement et l’obligation de déclaration de situation patrimoniale
  modificative. La structure des déclarations de situation patrimoniale est simplifiée,
  avec la fusion de plusieurs rubriques et l’instauration de seuils déclaratifs. Enfin,
  les acteurs de l’influence étrangère déclareront leurs activités chaque semestre
  et non plus chaque trimestre. Il clarifie enfin le droit applicable aux responsables
  et agents publics. Le délit de prise illégale d’intérêts après la cessation des
  fonctions est précisé : le critère du « capital commun » fixé à 30 % est remplacé
  par un critère centré sur l’objectif d’empêcher le contournement de l’interdiction.
  L’assimilation à une entreprise privée de toute entreprise publique exerçant son
  activité dans un secteur concurrentiel et conformément aux règles du droit privé
  ainsi que les mobilités au sein du groupe Caisse des dépôts et consignations sont
  également exclues du champ de l’infraction. Le projet de loi tire les conséquences
  de la décision n° 2024-1120 QPC du Conseil constitutionnel du 24 janvier 2025 :
  une interdiction d’occuper un emploi dans l’administration, d’une durée maximale
  de trois ans, pourra désormais être prononcée par le ministre chargé de la fonction
  publique. Il harmonise par ailleurs la définition du conflit d’intérêts dans les
  textes relatifs aux agents publics et aux militaires, en cohérence avec la loi du
  22 décembre 2025 portant création d’un statut de l’élu local. La Haute Autorité
  pour la transparence de la vie publique deviendra enfin la Haute Autorité pour l’intégrité
  publique. Le projet de loi organique met en œuvre ces mesures pour les catégories
  de responsables relevant de la loi organique. Pour les parlementaires, il ramène
  de cinq à trois ans la période de référence des déclarations d’intérêts, supprime
  la déclaration de situation patrimoniale modificative et simplifie la structure
  des déclarations de situation patrimoniale. Il transpose aux membres du Conseil
  économique, social et environnemental la nouvelle définition du conflit d’intérêts
  et réduit également à trois ans la période de référence de leurs déclarations d’intérêts.
  Pour les magistrats et les membres du Conseil supérieur de la magistrature, il réduit
  la période de référence des déclarations, simplifie les déclarations de situation
  patrimoniale, supprime la déclaration modificative, dépénalise le défaut de communication
  des déclarations et permet à la Haute Autorité d’assortir ses injonctions d’une
  astreinte. Il procède enfin au changement de dénomination de la Haute Autorité dans
  les dispositions de nature organique. Le projet de loi a notamment reçu les avis
  favorables du Conseil commun de la fonction publique (CCFP), qui réunit les organisations
  syndicales représentatives des agents publics au niveau national et les employeurs
  des trois versants de la fonction publique, du Conseil national d’évaluation des
  normes (CNEN) et du Conseil supérieur de la fonction militaire (CSFM). La ministre
  de la culture a présenté un projet de loi visant à renforcer l’investissement publicitaire
  dans les services de presse en ligne d’information politique et générale. Essentiels
  à la vie démocratique, notamment dans les territoires, les médias historiques (presse,
  télévision, radio) traversent une crise économique importante. Notamment, les ressources
  publicitaires de tous ces secteurs baissent de manière continue depuis plus d’une
  décennie. La valeur du marché publicitaire est captée de manière croissante par
  les plateformes numériques, qui diffusent l’information sans contribuer suffisamment
  à son financement. En particulier, la presse d’information politique et générale
  tend, selon la loi, « à éclairer le jugement des citoyens ». Sa fragilisation affecterait
  donc le débat démocratique, tant national que local, en le privant d’informations
  fiables, en accentuant le rejet des faits et en l’exposant aux ingérences et manipulations
  étrangères. Depuis 2017, l’Etat intervient à son soutien, par des mécanismes fiscaux,
  budgétaires ou de régulation, notamment en matière de propriété intellectuelle.
  Il soutient également sa modernisation, au service de sa transition numérique. Pour
  autant, la situation continue à se dégrader et malgré les efforts publics et privés,
  les médias historiques sont tous confrontés à des situations économiques difficiles.
  Face à l’accélération des tendances observées ces derniers années, une mobilisation
  renforcée est donc nécessaire afin de permettre à ces médias historiques de disposer
  des moyens nécessaires pour investir et s’adapter rapidement à la numérisation de
  leur activité. Ainsi, le Gouvernement présente aujourd’hui un ensemble de mesures
  déployées par l’Etat pour accompagner la presse mais également la radio et la télévision
  et les accompagner dans leur transformation. Parmi ces mesures, est notamment présenté
  un projet de loi visant à renforcer l’investissement publicitaire dans les services
  de presse d’information politique et générale en ligne. Le projet de loi instaure
  une obligation, pesant sur les principaux annonceurs, et tendant à orienter une
  fraction limitée de leurs budgets publicitaires en ligne vers la presse numérique
  d’information politique et générale. Sont concernés les annonceurs publics comme
  privés dont les dépenses publicitaires annuelles dépassent 1 million d’euros. Ceux-ci
  sont tenus d’affecter une proportion – fixée par décret et dans le respect d’un
  plafond fixé à 10 % par le projet de loi – de leurs investissements publicitaires
  numériques vers les sites en ligne de la presse d’information politique et générale.
  Ces moyens additionnels accordés à la presse doivent permettre à ces acteurs d’investir
  dans leur transformation numérique et de mieux se positionner pour capter les revenus
  publicitaires sur ces marchés. Afin de s’assurer de l’effectivité de l’ensemble
  de ces mesures et dans un contexte mouvant sur ces enjeux, le Gouvernement s’engage
  également à mettre en place un suivi rapproché de ces mesures, de leur efficacité
  et de l’évolution des pratiques pour accompagner ce dispositif. Le conseil des ministres
  a adopté les mesures individuelles suivantes : Sur proposition de la ministre des
  armées et des anciens combattants : - M. Pierre COTTE est nommé au conseil d’administration
  de l’Institution nationale des invalides, en qualité de personnalité qualifiée représentant
  le monde combattant. Sur proposition du garde des sceaux, ministre de la justice
  : - M. Pierre COPPEY est nommé contrôleur général des lieux de privation de liberté
  ; - Mme Marie GROSSET , maîtresse des requêtes, est nommée directrice des victimes
  et des usagers au sein du ministère de la justice. Le Premier ministre et le ministre
