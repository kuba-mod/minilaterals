title: Déclaration sur les principes clés de la sécurité européenne.
text: 'Attachés à la paix et au respect du droit international, et face à l’agression
  à grande échelle de la Russie contre l’Ukraine, qui ne fait suite à aucune provocation,
  ainsi qu’aux menaces croissantes pesant sur la stabilité européenne, les États signataires,
  réunis à l’occasion du 9e sommet de la Communauté politique européenne à Dublin
  le 12 novembre 2026, considèrent que le renforcement de la sécurité européenne et
  la défense de leurs intérêts en matière de sécurité constituent leur objectif commun.
  Les États signataires réaffirment leur soutien indéfectible à l’indépendance, à
  la souveraineté et à l’intégrité territoriale de l’Ukraine dans ses frontières internationalement
  reconnues. Ils soulignent la nécessité d’apporter à l’Ukraine des garanties de sécurité
  solides et crédibles et réaffirment, pour ceux concernés, leur intention de le faire,
  afin d’empêcher qu’une telle agression ne se reproduise à l’avenir en Europe. Ils
  soulignent que les campagnes hybrides menées par la Russie et ses tentatives visant
  à saper le soutien apporté à l’Ukraine ne feront que renforcer leur engagement envers
  l’Ukraine et leur détermination. Les États signataires rappellent que la voie pour
  la paix en Ukraine doit être décidée avec l’Ukraine et que toute question concernant
  la sécurité européenne doit être décidée avec les Européens. Ils estiment que les
  principes clés suivants de la sécurité européenne peuvent contribuer à ouvrir la
  voie à une paix juste et durable pour l’Ukraine, ce qui revêtira une importance
  capitale pour la stabilité en Europe. Ils soulignent que la sécurité de l’Ukraine
  fait partie intégrante de la sécurité euro-atlantique et que l’évolution future
  de la stabilité stratégique européenne sera subordonnée à l’issue de la guerre en
  Ukraine. Dans l’objectif de renforcer la sécurité en Europe, les États signataires
  soutiennent les objectifs communs suivants, dans le respect de leurs engagements
  internationaux et de leurs lois constitutionnelles respectives. Les dispositions
  ci-dessus s’appliquent sans préjudice du caractère spécifique des politiques et
  des intérêts des États signataires en matière de sécurité et de défense et de leurs
  lois constitutionnelles et engagements internationaux respectifs. Les États signataires
  réaffirment les principes généraux suivants relatifs à la sécurité européenne :
  Les Etats signataires : La République d’Albanie, La Principauté d’Andorre, La République
  d’Autriche, Le Royaume de Belgique, Bosnie-Herzégovine, La République de Bulgarie,
  La République de Croatie, La République de Chypre, La République tchèque, Le Royaume
  de Danemark, La République d’Estonie, La République de Finlande, La République française,
  La Géorgie, La République fédérale d’Allemagne, La République hellénique, La Hongrie,
  La République d’Islande, L’Irlande, La République italienne, La République de Lettonie,
  La Principauté du Liechtenstein, La République de Lituanie, Le Grand Duché de Luxembourg,
  La République de Malte, La République de Moldavie, La Principauté de Monaco, Le
  Monténégro, Le Royaume des Pays-Bas, La République de Macédoine du Nord, Le Royaume
  de Norvège, La République de Pologne, La République portugaise, La Roumanie, La
  République de Saint-Marin , La République slovaque, La République de Slovénie, Le
  Royaume d’Espagne, Le Royaume de Suède, L’Ukraine, Le Royaume-Uni de Grande Bretagne
  et d’Irlande du Nord.'
