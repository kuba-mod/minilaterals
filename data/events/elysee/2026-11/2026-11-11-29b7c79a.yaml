date: '2026-11-11'
type: press_release
source_name: elysee
title: Cérémonie de commémoration du 108e anniversaire de l’Armistice du 11 novembre
  1918.
text: 'Le Chef de l’État a présidé ce mercredi la cérémonie de commémoration du 108e
  anniversaire de l’Armistice du 11 novembre 1918, à l’Arc de Triomphe. Le Président
  de la République a rendu hommage à tous ceux qui ont combattu et sont tombés pour
  la France , réaffirmant ainsi l’attachement de la Nation au devoir de mémoire et
  à la transmission de notre histoire aux jeunes générations. A l''issue de la cérémonie,
  le chef de l’État a reçu des porte-drapeaux, des membres des associations patriotiques,
  des membres du comité de la Flamme, des pensionnaires de l’Institution nationale
  des Invalides et des représentants du monde combattant pour un déjeuner au Palais
  de l''Élysée. 11 novembre 2026 - Seul le prononcé fait foi Mesdames les ministres,
  Monsieur le chef d''état-major des armées, Monsieur le délégué national de l''Ordre
  de la Libération, Monsieur le délégué général pour l''armement, Monsieur le secrétaire
  général pour l''administration, Messieurs les chefs d''état-major de l''armée de
  Terre, de la Marine, de l''armée de l''Air et de l''Espace, Monsieur le gouverneur
  militaire de Paris, Monsieur le directeur général de la gendarmerie nationale, Messieurs
  les officiers généraux, Mesdames et Messieurs les directrices et directeurs, Mesdames
  et Messieurs les présidents d''associations, Mesdames, Messieurs les porte-drapeaux
  et membres d''associations, Mesdames, Messieurs, en vos grades et qualités, Chers
  amis, permettez-moi de vous dire que c''est d''abord un grand honneur pour mon épouse
  et moi-même de vous accueillir aujourd''hui à l''Élysée en ce 11 novembre. Nous
  en avons pris l''habitude, et ce pli, en effet, a été pris il y a quelques années
  et il y a un goût un peu particulier en cette journée pour nous, mais il est important
  à mes yeux. Le 11 novembre 1918, les cloches des villages et les tambours des gardes
  champêtres annoncèrent l''armistice, la fin de la guerre, de cette guerre qui avait
  prélevé tant de vies chacune de nos communes, qui a touché tant de nos familles,
  la victoire de ceux que l''on nommait les Poilus, morts et vivants. Clemenceau dira
  d''eux : « Ils ont des droits sur nous. ». Et s''ouvrit alors le long et douloureux
  combat pour la reconnaissance ; reconnaissance des morts avec l''édification dans
  chaque ville et village de France de ces milliers de monuments aux morts, sur lesquels
  sont gravés pour l''éternité le nom de ceux qui sont tombés. Reconnaissance des
  vivants revenus des combats menés dans les plaines, forêts et tranchées, et qui
  avaient laissé là-bas les corps de leurs frères d''armes ainsi qu''une part d''eux-mêmes,
  à jamais enfouis dans les trous d''obus de la Marne ou dans la boue séchée de Douaumont.
  Oui, morts et vivants de la Grande Guerre avaient des droits sur nous et une dette
  éternelle. Des associations se sont alors constituées, des générations de bénévoles
  se sont engagées, des familles ont refusé que le sacrifice du sang tombe dans l''oubli.
  Et de la loi Lugol à aujourd''hui, le monde combattant est demeuré le visage de
  la fidélité à la mémoire de ceux qui servent la patrie en danger. Dépositaire du
  cœur de la tradition née en ce jour de commémoration qu''est le 11 novembre, la
  nation renouvelle sa reconnaissance envers ceux qui l''ont servi les armes à la
  main, car le 11 novembre est le jour dédié à la mémoire de celles et ceux qui tombent
  pour la France. C''est pourquoi le 11 novembre est un repère. C''est pourquoi le
  11 novembre est une nécessité. C''est pourquoi le 11 novembre convoque cette force
  d''âme qui a tenu nos poilus, cette force d''âme qui ensuite a irrigué le cœur de
  ces jeunes Français qui, le 11 novembre 1940, défièrent l''occupant nazi sous les
  voûtes de l''Arc de Triomphe. Comme cette force d''âme habitait les pêcheurs de
  l''île de Sein, ces garçons sans attaches, les Français juifs qui rejoignirent de
  Gaulle à Londres dès l''été 40, tous au fond choisirent la France libre parce qu''ils
  étaient les héritiers des Poilus de 14-18. L''esprit du 11 novembre est le plus
  puissant des antidotes contre l''esprit de défaite. C''est pourquoi en ce jour,
  en vous réunissant aujourd''hui, c''est évidemment toutes ces mémoires que je convoque
  avec une pensée particulière. Et merci, mon général, de l''avoir honorée ce matin
  pour Hubert Germain, dont nous conduisions il y a 5 ans la dépouille tous ensemble
  à la crypte du Mont-Valérien. Voilà pourquoi ce jour, la France rend hommage à celles
  et ceux qui, dans l''ombre, au péril de leur vie, ont puisé au plus profond d''eux-mêmes
  la force de refuser l''inéluctable soumission à l''occupant. Ils s''appellent Michèle
  Agniel, Marie-Jo Chombart De Lawe, Lise Graf, Andrée Grau, Marie Vaurette, Paul
  Bequart, Maurice Clerc, Jean-Louis Coquard, Pierre Mauger, Achille Muller, Henri
  Peyrelongue, Jean Samuel et Jean Toutant. Ces médaillés de la Résistance française
  ont bien mérité de la nation. Et je salue la présence parmi nous du colonel Achille
  Muller qui nous fait l''honneur de se joindre à ce moment. Ce sont avec lui aussi
  ces héros français de notre libération qui sont là. SAS pour toujours. Nous devions
  aussi accueillir ici Solange Alexandre, héroïne de la Résistance et qui, sa vie
  durant, n''a cessé ce combat indispensable de transmission de l''esprit de Résistance
  aux jeunes générations. Elle nous a quittés dimanche à l''âge de 104 ans, mais restera
  dans notre mémoire comme le plus parfait des exemples de ces destins de ceux qui
  font la grandeur de notre pays. Son nom, vos noms s''ajoutent à ceux de plus de
  65 000 résistants décorés depuis 1943. La République est fidèle à celles et ceux
  qui ont des droits sur elle. C''est en ce sens que je veux ici remercier la ministre
  déléguée, Madame Alice Rufo, d''avoir lancé et porté les Assises du monde combattant
  en avril dernier aux côtés du général Thierry Burkhard, délégué national de l''Ordre
  de la Libération. Je veux ici également saluer et remercier les associations, leurs
  responsables, l''ensemble des parties prenantes qui ont apporté leur expérience,
  leurs exigences, leurs propositions. Je veux évidemment remercier en effet toutes
  ces associations, l''ensemble des services du ministère, notre direction en charge
  de la mémoire, l''ONACVG, à laquelle nous tenons beaucoup, et pour tordre le cou
  à des idées que j''ai pu entendre, nous tenons aussi beaucoup à sa départementalisation.
  Alors, comme je l''ai voulu, vous avez mené la juste et nécessaire réflexion touchant
  à la refondation de la communauté du droit à réparation, l''accompagnement des associations
  combattantes, la transformation de la mémoire en principes d''action et la réforme
  du monde combattant face aux enjeux contemporains. Et je veux saluer ici la fécondité
  de ce travail qui est le vôtre et vous dire en ce jour qu''il sera repris. Travail
  d''autant plus fécond au moment de bascule de l''histoire que nous vivons. Retour
  de la guerre de haute intensité sur le sol européen, multiplication des crises,
  intensification des menaces, remise en cause des équilibres stratégiques, autant
  de bouleversements qui nous rappellent que la paix n''est jamais acquise. Ces dernières
  décennies, certains crurent juste de proclamer la fin de l''histoire et donc de
  la guerre. C''était une illusion. Et dans ce monde incertain, la résilience de la
  nation repose sur la puissance de ses armées dont le budget a été doublé depuis
  2017, Madame la ministre, sur la force de son unité, sur la solidité de ses institutions,
  sur la vitalité de ses associations et sur la capacité de chaque citoyen à prendre
  part à l''effort. Et c''est le cœur de ce que nous avons conduit durant ces 10 dernières
  années, de tout ce qui a été fait pour le monde combattant, au Service national
  remis en place, de tout ce qui a été conduit avec vos associations en plus des efforts
  capacitaires et aussi stratégiques pour nos armées. Le monde combattant lui aussi
  se transforme en cette période. Les générations se succèdent, les formes de l''engagement
  évoluent, les attentes changent et il nous appartient d''en tirer toutes les conséquences
  sans jamais rien perdre de ce qui fonde le lien entre la nation et ceux qui la servent.
  Ces assises ont permis d''identifier 4 chantiers auxquels je souscris pleinement.
  Et qui seront repris. Le premier est impératif : donner au monde combattant toute
  sa place dans le dialogue national d''élaboration de notre architecture de résilience
  collective. Les associations combattantes sont gardiennes de notre mémoire, mais
  aussi forces vives de la société civile. Elles participent du renforcement de ce
  lien armée-nation. Voilà pourquoi le G12, dont les représentants sont réunis aujourd''hui,
  évoluera en janvier prochain en un Conseil du monde combattant, instance de trilogue
  direct entre les associations, le gouvernement et le Parlement. Parallèlement, l''État
  se dotera en janvier prochain, en remplacement de la Direction de la mémoire, de
  la culture et des archives, d''une délégation au monde combattant à la mémoire et
  à la culture, chargée de porter cette ambition au sein du ministère des Armées et
  des Anciens combattants. Et parce que le monde combattant doit compter parmi les
  corps intermédiaires de la nation, une réflexion sera ouverte avec le Conseil économique,
  social et environnemental, sur sa place et sa représentativité au sein de la société
  civile. Le monde combattant est dévoué à la nation, il sera désormais reconnu comme
  tel. Le deuxième chantier concerne la garantie du droit à réparation. Parce qu''il
  ne saurait y avoir de reconnaissance véritable sans réparation effective, notre
  devoir est de le garantir pleinement, rendre les démarches plus accessibles, simplifier
  ce qui peut l''être, mieux accompagner, continuer de mieux accompagner les blessés
  et leurs familles, même si je veux ici redire mes remerciements à nos armées pour
  le travail exceptionnel qui est fait auprès de chaque famille et de tous nos blessés.
  Je vous commande aussi de tenir compte des nouvelles formes d''engagement et des
  nouvelles blessures. Vous mettrez donc en place une mission d''étude sur la simplification
  des régimes de réparation et préparer un nouveau plan en faveur des blessés et de
  leurs familles en tirant les enseignements des exercices majeurs du retour d''expérience
  d''Orient. La réparation s''exprime aussi par la solidarité nationale et je salue
  à cet égard la création à venir de la Fondation du Bleuet de France. Elle renforcera
  le rayonnement et l''efficacité au service des blessés et de la mémoire. Troisième
  chantier : faire de la mémoire un principe d''action au service de la cohésion nationale
  et des nouvelles générations. Oui, une force vivante, une force qui éclaire notre
  présent et prépare notre avenir. La mémoire se transmet ou elle s''éteint. Elle
  est un travail permanent. Ainsi s''impose notre devoir : préserver nos lieux de
  mémoire, soutenir le travail des associations, collecter les témoignages, expliquer
  notre histoire, voilà notre plus belle responsabilité. Malraux écrivait : « Le tombeau
  des héros est le cœur des vivants. » C''est de cela dont il s''agit. Aucune mémoire
  singulière ne doit être oubliée ou effacée. Un groupe de travail sur la pratique
  commémorative en France sera créé afin de faire évoluer sa forme et de renforcer
  la mobilisation de la société civile. Et dans le même esprit, la mémoire des Harkis
  aussi sera soutenue dans le cadre de la future délégation que j''évoquais à l''instant.
  Nous devons adapter nos modes de transmission à toute la jeunesse, lui permettre
  de lire des textes, de porter des drapeaux, de rencontrer nos anciens combattants,
  de préparer et de prendre part à nos cérémonies. Et je me félicite que beaucoup
  de jeunes soient là avec nous à nos tables. Nous devons donner à nos jeunes la possibilité
  de faire leur cette histoire nationale. Oui, la mémoire est un principe d''action
  et voilà pourquoi je tiens à affirmer ici que la mémoire du 11 novembre a sa place
  dans toutes les écoles de la République. C''est précisément le sens du quatrième
  chantier des Assises du monde combattant qui vise à inscrire la jeunesse au cœur
  de la transmission mémorielle et de l''engagement citoyen, une jeunesse passeuse
  de mémoire. C''est pourquoi le lien entre les associations du monde combattant et
  l''Éducation nationale se renforce encore, notamment à travers le dispositif des
  Classes de défense et cohésion nationale. Et je veux vous remercier pour le rôle
  actif que vous y jouez et remercier aussi notre ministre de l''Éducation nationale
  qui a beaucoup porté ce sujet nécessaire. À cet égard et pour poursuivre ce travail,
  seront mis en place des binômes mémoire entre acteurs du monde combattant d''hier
  et jeunes d''aujourd''hui et de demain, renforçant ainsi l''intégration d''acteurs
  issus de la société civile, des arts, du cinéma, des réseaux sociaux, des sportifs,
  de toutes celles et de tous ceux qui veulent être ces passeurs de mémoire. Ces 4
  chantiers visent à renforcer le pacte entre nos armées et la nation et à faire vivre
  la flamme du monde combattant dans un esprit d''unité. C''est le fruit de vos travaux,
  il sera donc repris, porté et mis en œuvre. Mesdames et Messieurs, chers amis, 110
  ans après Verdun, 108 ans après l''armistice, le 11 novembre est un maillon essentiel
  de cette chaîne des temps qui lie le soldat de l''an II au grognard de la Garde,
  le fantassin de Bazeilles tirant sa dernière cartouche au poilu de 14, le Compagnon
  de la Libération aux soldats de la bataille de Crèvecœur et à tous ceux qui aujourd''hui
  portent encore et toujours l''uniforme au service de la nation. Continuons d''entretenir
  ces braises ardentes de notre mémoire collective avec nos enfants, avec les anciens
  combattants, avec les associations qui œuvrent à la solidarité et au souvenir, avec
  les militaires engagés aujourd''hui en opération, avec les blessés et leurs familles.
  Plus que jamais, notre responsabilité est immense. Ne jamais laisser s''interrompre
  cette chaîne entre les générations, ne jamais laisser s''affaiblir ce lien entre
  les armées et la nation, ne jamais laisser penser que le sacrifice de ceux qui ont
  servi pourrait être oublié ou tenu pour acquis. Je veux ici exprimer, au nom de
  la nation, notre gratitude à ceux qui ont combattu, notre respect pour ceux qui
  sont tombés, et notre reconnaissance infinie envers tous ceux qui font vivre leur
  mémoire. Mes chers amis, c''est la dernière fois que sous cette forme je vous vois.
  Et je veux ici dire mon immense gratitude, évidemment à l''égard de tous ceux qui
  se sont engagés ou s''engagent dans nos armées. C''est une immense fierté pour moi
  depuis près de 10 ans, d''être là où je suis par vous, de dire ma gratitude et cette
  dette à l''égard de tous nos blessés et de toutes les familles. C''est la plus grande
  dette, la plus belle, la plus importante, la plus difficile. Et dire ma gratitude
  à l''égard du monde combattant, de toutes les présidentes et présidents d''associations
  que vous êtes, de nos porte-drapeaux, compagnons de cérémonies quel que soit le
  temps et partout à travers le pays, de nos gardiens de la flamme et de tous ces
  visages qui, depuis 10 ans, m''accompagnent pour que ce combat continue d''être
  le nôtre, parce que c''est celui qui tient une nation. C''est pourquoi le 11 novembre
  est si important. Et c''est pourquoi je veux ici vous redire mon immense gratitude,
  ma très grande reconnaissance et ma fidélité. 11 novembre 2026 - Seul le prononcé
  fait foi Mesdames les ministres, Monsieur le chef d''état-major des armées, Monsieur
  le délégué national de l''Ordre de la Libération, Monsieur le délégué général pour
  l''armement, Monsieur le secrétaire général pour l''administration, Messieurs les
  chefs d''état-major de l''armée de Terre, de la Marine, de l''armée de l''Air et
  de l''Espace, Monsieur le gouverneur militaire de Paris, Monsieur le directeur général
  de la gendarmerie nationale, Messieurs les officiers généraux, Mesdames et Messieurs
  les directrices et directeurs, Mesdames et Messieurs les présidents d''associations,
  Mesdames, Messieurs les porte-drapeaux et membres d''associations, Mesdames, Messieurs,
  en vos grades et qualités, Chers amis, permettez-moi de vous dire que c''est d''abord
