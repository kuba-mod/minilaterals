title: Déclaration relative à la réunion entre les États-Unis, l'Ukraine et les partenaires
  européens.
text: En vue des prochaines discussions trilatérales avec la Russie, des représentants
  des partenaires européens, de l'Ukraine et des États-Unis se sont réunis pour poursuivre
  leur étroite coordination quant aux efforts visant à mettre fin à la guerre en Ukraine
  et à créer les conditions d'une paix durable, y compris en soutenant la mise en
  place de garanties de sécurité solides dans le cadre de tout accord. Des discussions
  ont eu lieu dans un esprit de coopération entre les partenaires européens, l’Ukraine
  et les États-Unis, reflétant leurs objectifs communs, leurs consultations en cours
  et leur engagement pour la sécurité euro-atlantique. Les participants ont souligné
  que tout accord futur doit respecter la souveraineté, l’intégrité territoriale,
  la possibilité pour chacun de prendre des décisions en toute indépendance, et fournir
  des garanties de sécurité crédibles à l’Ukraine. L'objectif commun est de développer
  un cadre de sécurité concret qui renforce la sécurité mutuelle, qui accroît la sécurité
  de long terme de l'Ukraine et bâtisse la confiance nécessaire pour atteindre un
  règlement négocié. Outre l’accent principal mis sur une paix durable, les discussions
  ont porté sur la manière de s’appuyer sur les institutions et accords européens
  de sécurité existants après la fin de la guerre en Ukraine. Les participants ont
  en outre reconnu qu’il était essentiel de répondre aux préoccupations de sécurité
  au sortir de la guerre et de réduire le risque de conflit. Ils ont échangé sur les
  moyens de garantir des mécanismes solides pour gérer les risques et éviter toute
  escalade dangereuse. Les participants ont réaffirmé leur engagement commun en faveur
  d’une architecture et d’arrangements de sécurité européens solides pour l’après-guerre,
  et ont clairement indiqué qu’une OTAN forte resterait centrale pour la défense collective
  euro-atlantique. Les partenaires européens, l'Ukraine et les États-Unis continueront
  à travailler en partenariat étroit tout au long du processus de négociation, avec
  l’objectif commun de s'orienter vers des discussions multilatérales plus larges
  associant les partenaires européens et de parvenir à une paix globale et durable.
