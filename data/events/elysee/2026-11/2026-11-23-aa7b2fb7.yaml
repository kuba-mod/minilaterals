title: Déplacement à Toulouse.
text: 'Le Président de la République s''est rendu à Toulouse le 22 et 23 novembre
  2026, dans le prolongement de la Semaine de l’industrie, afin de mettre à l’honneur
  l’excellence de l’industrie française et européenne. Le dimanche 22 novembre, le
  chef de l’État a participé à un dîner avec les dirigeants de grands groupes industriels
  européens, membres de l’European Round Table for Industry (ERT) . Cette rencontre
  a permis d’ échanger sur les grands enjeux de compétitivité de l’industrie européenne
  , notamment le renforcement du marché unique, la préférence européenne et la protection
  de nos intérêts économiques dans un contexte de concurrence internationale accrue.
  Le lundi 23 novembre, le Président de la République s''est rendu sur le site d’
  Airbus , où lui a été présenté l’A350F, futur avion-cargo du groupe actuellement
  en phase de développement , puis il a visté la ligne d’assemblage de l’A321 . Cette
  visite a permis de valoriser le dynamisme de la filière aéronautique française ,
  sa capacité d’innovation et son rôle majeur dans nos exportations. Le chef de l’État
  a réaffirmé le soutien à cette filière stratégique pour notre souveraineté industrielle
  et notre économie avec France 2030 . Il est notamment revenu sur les investissements
  engagés pour accompagner son développement et a échangé sur les défis auxquels elle
  est confrontée , en particulier la sécurisation des approvisionnements en matières
  premières critiques. Ces deux journées s’inscrivent dans près de trois semaines
  consacrées aux grandes priorités économiques et industrielles du pays . De la Grande
  Exposition du Fabriqué en France à Choose France édition France, les cinq ans du
  plan France 2030 et les rendez-vous consacrés à l’intelligence artificielle, le
  Président de la République est revenu sur les résultats de la politique de réindustrialisation
  menée depuis 2017 et les perspectives pour les prochaines années, avec une même
  ambition : renforcer la capacité de la France et de l’Europe à produire, investir,
  innover et exporter.'
