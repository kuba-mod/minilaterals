title: Disparition de Solange Alexandre.
text: Toute sa vie durant, Solange Alexandre s’est fait une certaine idée de l’honneur.
  Résistante du premier jour sous le nom de « Corlay », fondatrice et cheffe d’un
  Maquis en Sarthe, elle s’est éteinte à l’âge de 104 ans, offrant à la France libre
  le devoir de poursuivre son combat de liberté. Née Solange Dubuisson en 1922 à Mamers,
  dans une famille où la patrie et l’honneur coulaient dans les veines, elle n’a pas
  dix-huit ans lorsqu’elle entend le 18 juin 1940 l’appel du Général de Gaulle sur
  une radio bricolée. Elle ne connaît alors ni le nom, ni la voix de celui qui appelle
  les Français à poursuivre le combat. Elle en fit sa plus belle mission. Étudiante
  à l’école normale des instituteurs du Mans, elle entre en Résistance en 1941. Agente
  de liaison, c’est sur sa bicyclette qu’elle arpente le département pour transporter
  les messages et recueillir le renseignement. En 1942, elle rejoint l’Organisation
  civile et militaire et met sous le nom de « Corlay » sa force d’âme au service de
  la France libre. Vint avril 1944 où, avec ses compagnons Michel Gadois et Guy Deliot,
  elle constitua le maquis de Pas-de-Bœuf, rassemblant résistants, anciens du STO,
  aviateurs alliés, ceux qui réussirent à s’évader, trente hommes placés sous son
  commandement qui savaient qu’elle était l’incarnation absolue du courage. Promue
  sous-lieutenante des Forces françaises de l’Intérieur le 6 juin 1944, elle organisa
  les sabotages essentiels à la protection des aviateurs alliés et eut à ce titre
  un rôle crucial dans la Libération de la Touraine. À un moment de l’Histoire où
  le commandement des armes revenait très largement aux hommes, Solange Alexandre
  fut un modèle de bravoure et d’honneur. A la Libération, elle reçut la médaille
  de la Résistance Française puis reprit le chemin de l’école normale. Fille de la
  République, devenue institutrice, elle troqua le maquis pour les salles de classe,
  consciente et habitée par la mission de faire vivre la flamme de la Résistance par
  la formation d’esprits et de consciences libres. Avec Solange Alexandre disparait
  une figure exemplaire de ce que fut la Résistance Française. Elle n’attendit aucune
  récompense, ne calcula aucun risque et ne demanda à la France d’autre honneur que
  de pouvoir la servir. Son histoire nous rappelle que la Résistance fut aussi celle
  de jeunes femmes qui, dans la clandestinité comme au combat, prirent une place décisive
  dans ce combat pour l’honneur. Son devoir fut notre liberté. Nous ne l’oublierons
  jamais. Le Président de la République et son épouse s’inclinent devant la mémoire
  d’une figure exemplaire de la Résistance, d’une femme qui dédia fidèlement sa vie
  à la France. Ils adressent à sa famille, à ses proches, à tous ceux qui partagèrent
  ses combats et à ceux qui aujourd’hui et demain honoreront sa mémoire, leurs condoléances
  les plus émues.
