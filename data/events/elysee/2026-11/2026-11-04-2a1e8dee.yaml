title: Compte rendu du Conseil des ministres du 4 novembre 2026.
text: 'Retrouvez le compte rendu du Conseil des ministres du mercredi 4 novembre 2027.
  Le ministre de l’économie, des finances et de la souveraineté industrielle, énergétique
  et numérique et le ministre de l’action et des comptes publics ont présenté le projet
  de loi de finances de fin de gestion (PLFG) pour 2026. Le PLFG 2026 procède aux
  ajustements de crédits indispensables à la fin de la gestion, tout en confirmant
  l’effort de maîtrise de la dépense publique réalisé tout au long de l’année. Le
  déficit public pour 2026 est maintenu à -5,4 % du produit intérieur brut, conformément
  au cadrage présenté dans le projet de loi de finances pour 2027. Ce texte traduit
  les efforts du Gouvernement au cours de l’année 2026 pour maitriser la dépense de
  l’Etat, en dépit d’une succession de crises pour lesquelles des financements nouveaux
  ont dû être mobilisés. Les décisions prises au cours de la gestion devraient conduire
  à une exécution inférieure de 1 milliard d’euros au niveau inscrit en loi de finances
  initiale 2026 sur le périmètre des dépenses de l’Etat. Le solde budgétaire s’établirait
  à - 135,5 milliards d’euros contre -134,6 milliards d’euros en loi de finances initiale,
  soit une dégradation de -0,9 milliard d’euros, principalement en raison d’une hausse
  des dépenses de la charge de la dette de 3,5 milliards d’euros et d’une baisse des
  recettes de 0,6 milliard d’euros. Les ouvertures de crédits proposées dans le PLFG
  2026 visent à financer les besoins ciblés et inévitables d’ici à la fin d’année.
  Les ouvertures de crédits doivent permettre de renforcer le budget des Armées pour
  tirer les conséquences de la crise au Proche et Moyen-Orient et assurer le financement
  des aides face à la crise énergétique, en faveur des transporteurs routiers et pêcheurs
  en particulier. Par ailleurs, le PLFG doit permettre de conforter le versement de
  certaines prestations sociales (aides personnalisées au logement, allocation aux
  adultes handicapés) et le financement du parc d’hébergement d’urgence. Tirant les
  conséquences des épisodes de sécheresse et de feux de forêt de l’été 2026, ce texte
  doit permettre de faire monter en puissance le plan de soutien au secteur agricole
  et renforcer sans attendre les moyens de la sécurité civile. Ces ouvertures sont
  gagées par des annulations de crédits sur d’autres programmes. Ces annulations procèdent
  des règles prudentielles appliquées dès le début de l’année, en application desquelles
  les crédits gelés n’ont pas vocation à être programmés et dépensés. Par ailleurs,
  le contexte de hausse des prix de l’énergie abaisse mécaniquement les soutiens de
  l’Etat aux producteurs d’énergie renouvelable. Ainsi, le PLFG 2026 s’inscrit dans
  la continuité des efforts engagés depuis le début de l’année, avec deux comités
  d’alerte des finances publiques tenus le 21 avril et le 7 juillet visant à garantir
  la transparence, la sincérité budgétaire et la bonne gestion des comptes publics.
  Le conseil des ministres a adopté les mesures individuelles suivantes : Sur proposition
  de la ministre des armées et des anciens combattants : - M . le contrôleur général
  des armées Samuel HEUZÉ est nommé adjoint au chef du contrôle général des armées,
  à compter du 1er décembre 2026. Sur proposition du garde des sceaux, ministre de
  la justice : - M. Charles TOUBOUL MORACCHINI , conseiller d’Etat, est nommé directeur
  des affaires civiles et du sceau ; - Mme Valérie DELNAUD , magistrate, est nommée
  directrice de l’Ecole nationale de la magistrature. Sur proposition de la ministre
  de la culture : - M. Guillaume CERUTTI est nommé président de l’Etablissement public
  du château, du musée et du domaine national de Versailles. Le ministre de l’économie,
  des finances et de la souveraineté industrielle, énergétique et numérique et le
  ministre de l’action et des comptes publics ont présenté le projet de loi de finances
  de fin de gestion (PLFG) pour 2026. Le PLFG 2026 procède aux ajustements de crédits
