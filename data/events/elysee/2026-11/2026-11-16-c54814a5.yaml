title: Disparition de Michel Destot.
text: Michel Destot, c’était une vie d’engagement, au service du progrès et des autres.
  Ingénieur, entrepreneur, député de l’Isère puis maire de Grenoble, il consacra son
  existence à Grenoble, sa ville de toujours, et à une certaine idée de la gauche
  réformiste. Né en 1946 à Malo-les-Bains, Michel Destot choisit la science comme
  horizon. Diplômé des Arts et Métiers, docteur en physique nucléaire, il rejoignit
  le Commissariat à l’énergie atomique. À 30 ans, il s’installa à Grenoble, ville
  dont il allait faire son terrain de d’élection et de transformation pour changer
  la vie des Grenobloises et des Grenoblois. Grande voix de la gauche réformiste,
  la « deuxième gauche » de Michel Rocard, il fut, toute sa vie durant, l’ardent défenseur
  du dialogue et de la décentralisation. Élu Conseiller général de l’Isère en 1985
  puis député du même département en 1988, il défendit durant six mandats avec constance
  la recherche scientifique française et une ambition pour une grande politique industrielle
  au service de l’emploi et de la prospérité. C’est en 1995 qu’il conquit la mairie
  de Grenoble. Dix-neuf années durant, il suscita les transformations de sa ville
  dont il voulait conforter le dynamisme et le rayonnement scientifique, universitaire
  et économique. Il y bâtit les infrastructures essentielles pour faire de Grenoble
  ce pôle d’innovation et de sciences, cette vitrine du progrès aux portes des Alpes
  à laquelle il croyait profondément et pour laquelle il fit tant. Il était un maire
  ingénieux qui, avant de se consacrer pleinement à ses mandats, fonda une entreprise
  spécialisée dans la simulation de systèmes complexes. Cette expérience avait nourri
  sa conviction du nécessaire soutien de l’État à ses forces d’innovation pour préparer
  les mutations et bâtir l’avance technologique française. Président des maires des
  grandes villes de France de 2007 à 2014, il porta la voix des collectivités territoriales.
  Michel Destot demeura toujours fidèle à ses convictions sociales-démocrates. En
  2022, il participa à la création d’un groupe de réflexion au service de ses idéaux
  européens et réformistes, encourageant les nouvelles générations à reprendre le
  flambeau de l’engagement. Avec lui, disparaît une figure de l’histoire de Grenoble
  et de la gauche. Il laisse le souvenir d’un homme convaincu au plus profond de lui-même
  que la politique devait offrir à la science et à l’innovation leur place de forces
  de progrès. Le Président de la République et son épouse saluent la mémoire d’un
  homme qui dédia quatre décennies de sa vie au service de ses concitoyens et de son
  pays. Ils adressent à sa famille, à ses proches, aux Grenobloises, aux Grenoblois
  et à tous ceux qui partagèrent ses combats, leurs condoléances émues.
