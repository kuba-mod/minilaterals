title: Déclaration conjointe relative au partenariat stratégique entre la République
  française et la Malaisie.
text: '1. Le Président de la République française, M. Emmanuel Macron, et le Premier
  ministre de Malaisie, M. Anwar Ibrahim, ont tenu des discussions bilatérales le
  17 novembre 2026 à Kuala Lumpur, à l’occasion de la visite officielle en Malaisie
  du Président de la République française. 2. À cette occasion, le Président de la
  République française et le Premier ministre malaisien ont annoncé le rehaussement
  des relations bilatérales au rang de partenariat stratégique. Ce rehaussement constitue
  une avancée historique dans les relations franco-malaisiennes, qui reposent sur
  de solides échanges diplomatiques depuis l’indépendance de la Malaisie en 1957.
  Ce partenariat stratégique témoigne de l’ancienneté et de la richesse de la coopération
  entre les deux pays dans des domaines stratégiques, notamment le commerce et les
  investissements, la défense et la sécurité, la culture, les sciences, les technologies
  et l’innovation, l’éducation et la recherche. Les initiatives menées par les deux
  pays dans ces secteurs clés contribuent à la résilience et à la souveraineté de
  la France et de la Malaisie. 3. Les deux chefs d’État et de gouvernement ont affirmé
  que les consultations bilatérales nourries entre leurs deux pays fournissaient une
  impulsion nécessaire à la convergence des intérêts stratégiques de la France et
  de la Malaisie dans un contexte géopolitique de plus en plus complexe. Ils sont
  convenus que ce mécanisme constitue un élément clé pour examiner les progrès réalisés
  dans le cadre des relations bilatérales, planifier les coopérations futures et veiller
  à la bonne mise en œuvre du partenariat stratégique afin de faire face aux défis
  régionaux et mondiaux communs. 4. Le Président de la République française et le
  Premier ministre malaisien ont reconnu l’importance de partenariats économiques
  durables pour le développement futur des deux pays. À cette fin, les deux chefs
  d’État et de gouvernement ont salué le lancement du premier Haut Conseil d''affaires entre
  la France et la Malaisie, qui vise à renforcer les liens directs entre les acteurs
  du secteur privé des deux pays. Ils sont convenus de renforcer la collaboration
  dans les domaines des technologies émergentes reposant sur les minerais critiques
  et la transition énergétique, notamment l’intelligence artificielle (IA), les semi-conducteurs,
  l’innovation numérique, les câbles sous-marins, les systèmes de fabrication avancés,
  les énergies renouvelables et le nucléaire civil. 5. Les deux chefs d’État et de
  gouvernement ont salué la signature du Mémorandum d’entente relatif à la coopération
  dans le domaine des minerais critiques, qui favorisera le transfert de technologies
  et l’échange d’expertise et assurera un accès aux minerais critiques pour les projets
  mutuellement bénéfiques pour la France et la Malaisie, ouvrant ainsi la voie à un
  partenariat durable et à des synergies entre les deux pays en matière de recherche
  et développement. Ils ont également salué la signature du Protocole d’entente relatif
  à la coopération dans le domaine de la transition énergétique, qui porte sur les
  énergies renouvelables et l’efficacité énergétique, l’utilisation de l’énergie nucléaire
  à des fins de production d’électricité, l’amélioration de l’infrastructure des réseaux
  électriques en faveur de l’intégration énergétique régionale, ainsi que sur les
  investissements et les mécanismes de financement dans le domaine de l’énergie. 6.
  Les deux chefs d’État et de gouvernement ont également salué la dynamique positive
  des négociations en cours concernant l’accord de libre-échange entre l’Union européenne
  et la Malaisie, qui vise à améliorer l’accès au marché, à faciliter les flux commerciaux
  et d’investissement, à renforcer les liens entre les industries et les chaînes d’approvisionnement,
  à soutenir le développement durable et à ouvrir de nouvelles perspectives pour les
  entreprises dans l’Union européenne et en Malaisie. Le Président de la République
  française et le Premier ministre malaisien sont convenus que cet instrument constitue
  une porte d’entrée pour les entreprises malaisiennes cherchant à étendre leur présence
  sur le marché européen, tout en réaffirmant le rôle de la Malaisie en tant que pôle
  régional pour les entreprises françaises et européennes cherchant à renforcer leurs
  activités en Malaisie et dans l’ensemble du marché de l’ASEAN. Par ailleurs, la
  France et la Malaisie collaboreront pour contribuer à la décarbonation et à la sécurité
  énergétique des pays membres de l’ASEAN et renforcer l’interconnectivité régionale,
  en soutien à la concrétisation de l’ASEAN Power Grid. Le Président de la République
  française et le Premier ministre malaisien ont salué l’ouverture prochaine en Malaisie
  d’une école régionale de l’ASEAN sur la régulation de l’énergie, avec le soutien
  du groupe Agence française de développement. 7. Le Président de la République française
  et le Premier ministre malaisien ont reconnu les liens anciens et importants entre
  les deux pays dans le domaine de la défense, notamment grâce aux échanges réguliers
  et à la coopération dans le cadre du Haut Comité Stratégique Conjoint de Défense
  (HCSCD). Ils ont réaffirmé leur volonté de renforcer les relations franco-malaisiennes
  en matière de défense et de sécurité au travers du renforcement des capacités et
  en nouant des partenariats industriels plus étroits dans le domaine de la défense,
  notamment grâce au développement des technologies de défense et à la collaboration
  industrielle dans ce domaine en appui à la modernisation du secteur de la défense
  malaisien. 8. La signature de la Feuille de route franco-malaisienne sur les capacités
  et partenariats industriels en matière de défense permettra d’accroître et de renforcer
  les écosystèmes français et malaisien dans le domaine de la défense. Les deux pays
  saluent le début de la mise en œuvre de cette feuille de route à travers deux projets
  concrets : le choix de la Malaisie en faveur des hélicoptères de recherche et sauvetage
  au combat H225M ainsi que des canons 105LG. 9. Les deux chefs d’État et de gouvernement
  ont encouragé la poursuite d’escales, de visites et d’exercices conjoints menés
  par les dispositifs militaires français et malaisiens ainsi que la formation de
  personnel. La France et la Malaisie souhaitent la conclusion des négociations relatives
  à l’accord sur le statut des forces (SOFA) et à sa signature dans un avenir proche.
  10. Les deux chefs d’État et de gouvernement ont par ailleurs salué la signature
  d’un amendement à l’Accord de sécurité relatif à l’échange et à la protection des
  informations classifiées dans le domaine de la défense (ASDD), qui facilite l’approfondissement
  des échanges entre la France et la Malaisie et offre de nouvelles possibilités en
  matière de coopération de défense. 11. En outre, la mise en place du Centre régional
  de sécurité contre les ingérences hybrides (RC-Shield) permettra de renforcer la
  préparation et la résilience des deux pays face aux menaces hybrides et aux activités
  des zones grises. 12. La Malaisie accueillant le Secrétariat de l’ASEANAPOL et du
  Centre de coordination de l’aide humanitaire de l’ASEAN pour la gestion des catastrophes
  (AHA Center), le Premier ministre malaisien a remercié le Président de la République
  française pour l’action précieuse de la France aux côtés de l’ASEAN au travers des
  partages d’expérience et du développement du savoir-faire technique dans la lutte
  contre la criminalité transnationale et la gestion des crises à l’échelle régionale.
  Cette coopération illustre la détermination commune des deux pays à soutenir le
  rôle central de l’ASEAN et le respect des principes de la Charte des Nations unies
  dans leur réponse aux enjeux sécuritaires. 13. Le Président de la République française
  et le Premier ministre malaisien ont reconnu le rôle stratégique de l’éducation
  et du développement du capital humain pour mieux s’adapter aux évolutions de notre
  écosystème des connaissances et de nos économies fondées sur les nouvelles technologies.
  Ils ont salué la signature du Mémorandum d’entente relatif à la coopération dans
  le domaine de l’enseignement supérieur, qui constitue une étape importante pour
  consolider les liens bilatéraux en matière d’éducation et soutenir l’innovation.
  14. Les deux chefs d’État et de gouvernement ont encouragé l’approfondissement de
  la coopération entre les institutions d’enseignement supérieur grâce à des échanges
  académiques et universitaires, à des activités de recherche conjointes et à des
  partenariats dans des domaines émergents et stratégiques, notamment les sciences,
  technologies, ingénierie et mathématiques (STIM), l’IA, les technologies numériques
  et le développement durable. Ils ont salué les initiatives visant à renforcer les
  partenariats public-privé afin de financer et d’accélérer la recherche et développement
  dans le domaine des technologies de pointe. Ils ont également encouragé les synergies
  entre gouvernements, industries, universités et instituts de recherche afin de mobiliser
  des ressources, de traduire les résultats de la recherche scientifique en applications
  concrètes et de promouvoir l’innovation, en accroissant les capacités technologies
  et la compétitivité à l’échelle mondiale des deux pays. Les deux chefs d’État et
  de gouvernement ont aussi réaffirmé leur volonté d’accroître la coopération au moyen
  de programmes conjoints pour les enseignants et les étudiants dans le domaine de
  l’enseignement et de la formation techniques et professionnels, dont l’importance
  est croissante pour faire vivre les domaines émergents et stratégiques précités.
  15. Les deux chefs d’État et de gouvernement ont souligné le succès du programme
  phare de bourse d’études de la Malaisie mis en œuvre sous l’égide d’institutions
  stratégiques telles que le ministère de l’Éducation, le Département de la fonction
  publique et le Conseil de confiance pour le peuple (Majlis Amanah Rakyat – MARA),
  et sont convenus de renforcer leur coopération par le biais de bourses conjointes
  pour favoriser la mobilité étudiante. Les deux chefs d’État et de gouvernement ont
  salué la perspective de la relance du programme Hubert Curien, qui facilite la réalisation
  de projets de recherche conjoints. 16. Les deux chefs d’État et de gouvernement
  ont souligné l’importance cruciale de renforcer les liens entre les personnes, les
  échanges culturels et la coopération dans le domaine du tourisme afin de favoriser
  la compréhension mutuelle et de consolider les liens d’amitié durables entre les
  deux pays. Ils sont convenus d’élargir leurs partenariats dans les domaines des
  arts, de la conservation du patrimoine et de la coopération muséale au moyen de
  liens institutionnels, de mécanismes intergouvernementaux et de plateformes multilatérales
  telles que l’UNESCO. À cet égard, les deux chefs d’État et de gouvernement ont salué
  le renforcement de la coopération entre les institutions culturelles et les sites
  patrimoniaux de premier plan, notamment dans les domaines des échanges entre conservateurs,
  des expositions conjointes, de la conservation et du renforcement des capacités
  professionnelles. 17. Le Président de la République française et le Premier ministre
  malaisien ont rappelé que les échanges entre les personnes constituent un trait
  d’union naturel entre les populations et ont réaffirmé leur détermination à promouvoir
  les flux touristiques croisés et la diplomatie culturelle. Ils se sont dits convaincus
  que ces efforts conjoints mettront en valeur la richesse et la diversité du patrimoine
  des deux pays, renforçant ainsi les liens entre les populations. 18. La France et
  la Malaisie sont déterminées à œuvrer à l’établissement d’un nouveau partenariat
  entre les pays indépendants et souverains de l’Union Européenne et de l’Asie du
  Sud-Est pour préserver la paix, la sécurité et la prospérité. Les deux pays partagent
  un profond attachement au multilatéralisme et œuvreront ensemble à la défense des
  principes fondamentaux de la Charte des Nations unies, notamment l’intégrité territoriale,
  le droit international et l’ordre international fondé sur des règles. Ils ont également
  exprimé leur détermination à renforcer les échanges entre la France et la Malaisie
  au sein des enceintes multilatérales et à coopérer avec la communauté internationale
  pour faire progresser les intérêts communs et apporter des solutions concrètes aux
  défis mondiaux. 19. Les deux chefs d’État et de gouvernement ont souligné le rôle
  essentiel des Nations unies dans l’architecture internationale tout en reconnaissant
  la nécessité d’une réforme institutionnelle, en particulier du Conseil de sécurité
  des Nations unies. Le Premier ministre malaisien considère que la France, en tant
  que membre permanent du Conseil de sécurité, a un rôle déterminant à jouer pour
  faire avancer cette réforme. Les deux chefs d’Etat et de gouvernement ont apporté
  leur soutien à l’initiative ONU80 lancée par le Secrétaire général des Nations unies.
  La Malaisie soutient l’initiative conjointe de la France et du Mexique visant à
  encadrer le droit de véto au sein du Conseil de sécurité des Nations unies en cas
  d’atrocités de masse. 20. Les deux chefs d’État et de gouvernement ont exprimé leur
  vive préoccupation face à la gravité de la situation au Moyen-Orient, et ont appelé
  l’ensemble des parties à apaiser les tensions, à faire preuve de retenue et à parvenir
  à un règlement diplomatique des conflits en cours, en particulier s’agissant de
  la situation à Gaza, à Jérusalem et en Cisjordanie, notamment face à la recrudescence
  des violences commises par les colons et à l’expansion des colonies illégales dans
  les territoires palestiniens occupés. Ils ont réaffirmé leur attachement à la solution
  à deux États et ont appelé à garantir un accès humanitaire complet et sans entrave
  à Gaza et dans les territoires palestiniens occupés. Ils ont également réaffirmé
  leur soutien à la Déclaration de New York et à la résolution 2803 (2025) du Conseil
  de sécurité des Nations unies. 21. Le Premier ministre malaisien a salué la décision
  de la France, conjointement avec le Royaume-Uni, le Canada et d’autres pays, concernant
  l’interdiction de l’importation de biens provenant des colonies israéliennes illégales,
  ainsi que d’autres mesures prises contre Israël. Les deux chefs d’État et de gouvernement
  ont également appelé à la mise en œuvre complète et effective de l’accord-cadre
  de cessez-le-feu du 26 juin 2026 afin de permettre l’instauration d’une paix et
  d’une sécurité solides et durables au Liban, dont la souveraineté et l’intégrité
  territoriale doivent être préservées. 22. Les deux chefs d’État et de gouvernement
  ont appelé les parties concernées à conclure rapidement un cessez-le-feu total et
  immédiat, en vue de négocier une paix globale, juste et durable entre l’Ukraine
  et la Fédération de Russie, dans le respect du droit international et sur la base
  des principes fondamentaux de la Charte des Nations unies. 23. Ils ont également
  réaffirmé le rôle central de l’UE et de l’ASEAN dans la promotion de la stabilité
  et de la prospérité mondiales. Ils ont affirmé leur détermination à renforcer la
  coopération dans l’ensemble des domaines couverts par les relations entre l’UE et
  l’ASEAN en tant que partenaires de dialogue. Ils ont marqué leur soutien au projet
  européen de création d’un partenariat stratégique global entre l’UE et l’ASEAN,
  dans la perspective du sommet commémoratif UE-ASEAN qui se tiendra en 2027. Le Premier
  ministre malaisien s’est félicité du dialogue régulier que la France entretient
  avec l’ASEAN dans le cadre de la réunion des ministres de la Défense de l’ASEAN
  Plus (ADMM+) et il a salué la candidature de la France au statut de Partenaire de
  dialogue sectoriel de l’ASEAN. Le Premier ministre malaisien s’est déclaré prêt
  à examiner favorablement la candidature de la France, selon les modalités et procédures
  établis de l’ASEAN. 24. Les deux chefs d’État et de gouvernement ont reconnu le
  rôle de l’ASEAN pour parvenir à une paix globale et durable en Birmanie grâce à
  un dialogue inclusif incluant l’ensemble des parties prenantes, en prenant le Consensus
  en Cinq Points comme référence principale. Ils ont rappelé l’urgence de mettre un
  terme à toutes les violences immédiatement et sans conditions, et ils ont appelé
  à mettre en place un environnement sûr et propice à l’acheminement de l’aide humanitaire
  pour qu’elle parvienne aux personnes qui en ont besoin. 25. Les deux chefs d’État
  et de gouvernement ont souligné la nécessité d’une architecture du commerce ouverte
  et solidaire, soulignant l’importance du rôle de l’Organisation mondiale du commerce
  (OMC) pour renforcer le système commercial fondé sur des règles et lutter contre
  le protectionnisme. Ils ont également soutenu le renforcement des relations entre
  l’UE et les parties à l’Accord de partenariat transpacifique global et progressiste
  (CPTPP). 26. Le Président de la République française et le Premier ministre malaisien
  ont réaffirmé l’importance du maintien et de la promotion de la paix, de la stabilité,
  de la sûreté maritime et de la liberté de navigation, conformément à la Convention
  des Nations unies sur le droit de la mer de 1982, notamment en mer de Chine méridionale.
  Ils ont rappelé leur attachement au principe de règlement pacifique des différends
  dans le respect du droit international, notamment la Convention des Nations unies
  sur le droit de la mer de 1982. 27. Les deux chefs d’État et de gouvernement ont
  à nouveau affirmé l’importance du maintien d’une navigation sûre et sans entrave
  dans le détroit d’Ormuz, conformément au droit international, et ont souligné l’importance
  de limiter toute perturbation des flux commerciaux internationaux et des chaînes
  de valeur mondiales. Le Président de la République française a souligné l’importance
  de l’initiative franco-britannique relative à la liberté de navigation dans le détroit
  d’Ormuz. Il a également salué le rôle et la contribution essentiels de la Malaisie,
  ainsi que des autres États côtiers, pour promouvoir une navigation et un commerce
  sans entrave dans le détroit de Malacca, dans le respect du droit international
  ainsi que de la souveraineté et de la compétence de chaque État côtier. 28. Soulignant
  l’importance de l’économie bleue durable et de la sécurité maritime pour assurer
  le développement et la stabilité, les deux chefs d’État et de gouvernement sont
  convenus d’étudier la mise en place d’une feuille de route conjointe pour renforcer
  la coopération dans ces domaines. 29. Afin de faire face à la triple crise planétaire,
  les deux chefs d’État et de gouvernement ont réaffirmé les engagements pris en faveur
  de l’objectif de l’Accord de Paris de limitation de l’élévation de la température
  à 1,5 °C ainsi que du cadre mondial de la biodiversité de Kunming-Montréal, et ont
  salué l’entrée en vigueur de l’Accord se rapportant à la Convention des Nations
  unies sur le droit de la mer et portant sur la conservation et l’utilisation durable
  de la diversité biologique marine des zones ne relevant pas de la juridiction nationale
  (dit Accord BBNJ). Ils se sont engagés à œuvrer pour la conservation marine, à mettre
  un terme à la pollution plastique, à accélérer la transition mondiale vers des sources
  d’énergie autres que le charbon et à promouvoir des marchés du carbone de haute
  intégrité afin de garantir une gestion environnementale durable pour les générations
  futures. 30. La visite officielle du Président de la République française en Malaisie
  a consolidé la détermination commune des deux pays à renforcer la sécurité et la
  prospérité économiques et à approfondir leurs liens stratégiques. Cette visite réhausse
  officiellement les relations bilatérales entre la France et la Malaisie au rang
  de Partenariat Stratégique.'
