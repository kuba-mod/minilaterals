title: Réunion avec les représentants du monde agricole.
text: Le Président de la République a réunit ce mercredi 25 novembre 2026 les représentants
  du monde agricole au Palais de l'Élysée. Cette réunion avait pour objectif de faire
  le point sur les grands défis du secteur agricole et les négociations sur le prochain
  budget pluriannuel européen , notamment celui de la PAC, en amont du Conseil européen
  extraordinaire des 26 et 27 novembre prochains.
