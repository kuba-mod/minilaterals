title: Octobre 2026 - Déplacements et rendez-vous de Madame Brigitte Macron.
text: 'Accueil et entretien avec Javier Milei, Président de la Nation argentine, et
  Karina Milei, secrétaire générale de la Présidence de la Nation argentine Remise
  de décoration à Nicolas Ghesquière, directeur artistique Remise de décoration à
  Philippe Besson, écrivain Réunion de travail à la Fondation des Hôpitaux Défilé
  Printemps-Été 2027 de « Louis Vuitton », Cour Carrée du Louvre (Paris Centre) Visite
  de la Maison des Adolescents (MDA) du 92 dans le cadre de la journée nationale portes
  ouvertes des MDA, Issy-les-Moulineaux (92) Visite d’Etat de Frank-Walter Steinmeier,
  Président de la République fédérale d’Allemagne, et de Elke Büdenbender, son épouse :
  Réunion du bureau de la Fondation des Hôpitaux Conseil d’administration de la Fondation
  des Hôpitaux Concert de Céline Dion, Plenitude Arena, Nanterre (92) Déjeuner en
  l’honneur des Femmes Ambassadeurs en poste en France Visite du chantier IDEAL, d’une
  chambre de la maternité équipée d’un lit accompagnant favorisant la co-parentalité
  et du service d’onco-hématologie, Hôpital Armand-Trousseau (Paris 12e) Visite du
  service de Néonatologie de l’Hôpital Hôpital Cochin-Port-Royal (Paris 14e) Visite
  de l''association E-enfance en présence de Elke BÜDENBENDER, Première dame d''Allemagne.
  Visite de l''association E-enfance en présence de Elke BÜDENBENDER, Première dame
  d''Allemagne. Rencontre avec les bénévoles de l’association "Solidarité Défense".
  Rencontre avec les pensionnaires de l’Institution Nationale des Invalides. Visite
  du musée du Louvre en présence de Elke BÜDENBENDER, Première dame d''Allemagne.
