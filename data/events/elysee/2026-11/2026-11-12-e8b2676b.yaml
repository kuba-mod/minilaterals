title: Déclaration à l'issue de la réunion des dirigeants du Core Group de soutien
  à l'Arménie.
text: 'Les dirigeants et représentants de la France, de la Lettonie, de la Lituanie,
  de l''Estonie, de la Pologne et du Royaume-Uni, ainsi que le président du Conseil
  européen, la présidente de la Commission européenne et la Haute Représentante de
  l''Union pour les affaires étrangères et la politique de sécurité, ont rencontré
  aujourd''hui le Premier ministre Nikol Pashinyan en marge du sommet de la Communauté
  politique européenne à Dublin. Rejoints par l’Allemagne, de la Norvège, de la Pologne,
  des Pays-Bas, du président du Conseil européen et de la présidente de la Commission
  européenne, ils ont fait la déclaration suivante : Nous réaffirmons notre soutien
  à la souveraineté, à l’intégrité territoriale, à la stabilité, à l’indépendance
  et à la résilience de la République d’Arménie. Il y a cinq mois, des élections législatives
  se sont tenues en Arménie. Elles ont permis au peuple arménien de faire un choix
  clair en faveur de la paix, de la démocratie et de liens rapprochés avec l’Europe,
  malgré les ingérences multiformes de la Russie. Depuis lors, les pressions politiques
  et économiques directes exercées par la Russie sur l’Arménie n’ont cessé de s’accroître.
  La Russie a imposé des restrictions sans précédent sur les exportations arméniennes
  et menace désormais d’utiliser les approvisionnements énergétiques comme moyen d’intimidation.
  En réponse, nous prenons des mesures pour permettre à l’Arménie de protéger sa souveraineté
  et de choisir librement son propre destin. Nous continuerons de soutenir l’Arménie
  dans la diversification de ses partenariats économiques, notamment dans les domaines
  du commerce et de l’énergie, en nous appuyant sur la décision de l’Union européenne
  de suspendre les droits de douane sur 80 % des exportations arméniennes vers l’UE.
  Nous reconnaissons les aspirations européennes du peuple arménien et continuerons
  de soutenir les efforts de l’Arménie pour bâtir une démocratie dynamique et résiliente
  ainsi qu’une économie prospère, pleinement intégrée aux réseaux de connectivité
  régionaux et aux flux commerciaux internationaux. Nous soutenons également le processus
  de paix entre l’Arménie et l’Azerbaïdjan et les progrès significatifs accomplis
  depuis la réunion de Washington en août 2025, ainsi que le processus de normalisation
  entre l’Arménie et la Turquie. Nous encourageons la poursuite des efforts dans cette
  direction, au bénéfice des peuples arménien et azerbaïdjanais et de l’ensemble de
  la région.'
