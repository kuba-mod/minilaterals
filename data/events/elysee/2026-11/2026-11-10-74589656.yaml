date: '2026-11-10'
type: press_release
source_name: elysee
title: 9ème édition du Forum de Paris sur la Paix.
text: 'Le Président Emmanuel Macron a participé à la 9e édition du Forum de Paris
  sur la Paix, les lundi 9 et mardi 10 novembre 2026 au Palais de Chaillot à Paris.
  Cette édition intitulée « De la souveraineté à la coopération », a abordé les principaux
  enjeux de coopération internationale et de développement, en particulier l’enfance
  et les défis liés au développement de l’intelligence artificielle. Ce lundi 9 novembre,
  le Président de la République a réuni une cinquantaine de participants en visioconférence,
  pour une session de travail dédiée à la sécurité de l’intelligence artificielle.
  Depuis 2017 , le Président de la République a fait de la coopération internationale
  et du développement humain une priorité de son action internationale. Dans ce cadre,
  il a participé ce mardi 10 novembre au Sommet sur l''Enfance , consacré aux enjeux
  de protection, de santé et d''éducation des enfants à l''ère de l''IA, ainsi qu''à
  une réunion de travail sur leur protection face aux risques du numérique. Des engagements
  concrets, fondés sur la science, ont été pris pour garantir que les outils d''intelligence
  artificielle destinés aux enfants soient préalablement testés et évalués. 10 novembre
  2026 - Seul le prononcé fait foi Animatrice Merci beaucoup pour cette introduction.
  Aujourd''hui, nous avons entendu une proposition très urgente, à savoir que les
  enfants ne peuvent pas être considérés comme une litanie de problèmes isolés. Bien
  au contraire, ils constituent le fondement de toute société, de sa prospérité et
  de sa stabilité. Première question à vous, Monsieur le Président : la France a fait
  des enfants une priorité de sa présidence du G7. Pouvez-vous nous expliquer pourquoi
  l''enfance doit figurer en tête des priorités et ce que nous, en tant que dirigeants
  politiques, devons aux générations futures ? Et en particulier comment nous pouvons
  les protéger des risques liés aux technologies numériques et à l''IA, tout en mettant
  ces outils au service de la santé, de leur apprentissage et de leur développement ?
  Merci beaucoup. Emmanuel MACRON Merci beaucoup Mesdames et Messieurs d’être là.
  Et je salue les chefs d''État et de gouvernement, les ministres, directrices et
  directeurs généraux d''organisations internationales et les ambassadeurs, les chefs
  d''entreprise, les académiques. C''est une grande fierté pour nous de vous avoir
  à nouveau pour ce forum de Paris sur la paix et de pouvoir répondre à cette mobilisation.
  Donc merci de prendre de votre temps, de votre engagement. C''est très frustrant
  d''avoir si peu de temps pour parler des enfants. Je vais essayer d''aller droit
  au but, comme on dit dans les grandes maisons. Vous avez parlé de 4 priorités :
  protection, investissement, prévention et une technologie qui est faite pour nos
  enfants. Et je voulais au fond revenir là-dessus et dire qu''on a fait en France
  depuis maintenant près de 10 ans, des enfants une priorité, avec une stratégie en
  particulier qui s''est organisée autour des 1 000 premiers jours, reposant sur une
  approche scientifique et sur la recommandation de scientifiques. On a construit
  ensuite toute une stratégie nationale, avec encore beaucoup de travail pour aider
  justement les enfants sur ces différents chantiers. Moi, je voudrais dire que quand
  on parle aujourd''hui, en effet, de notre situation internationale, faire des enfants
  une priorité, c''est non seulement un devoir moral, mais c''est un investissement
  pertinent, vous l''avez rappelé. Et je veux vraiment saluer à la fois le travail
  que fait l''UNICEF, mais avec elle l''ensemble des agences de nos Nations unies,
  tous les gouvernements qui suivent cette approche, ce qu''ont fait aussi beaucoup
  de fondations, de la Rockefeller à la Gates, qui ont justement poussé cet agenda
  de priorisation des enfants. Et alors, beaucoup d''experts ont rendu des chiffres
  montrant que quand on investissait 1 euro dans l''enfance, le retour sur investissement
  était de 7 euros. Tout ça est assez solidement établi. Je dirais qu''en plus, le
  coût de ne pas investir sur nos enfants est colossal. Et investir sur nos enfants,
  c''est d''abord les préserver dans les situations de guerre, vous l''avez dit. Ça
  c''est vraiment le travail remarquable que fait le HCR, qu''on doit continuer de
  faire. Et je voudrais ici redire combien, au moment où on se réunit, la situation
  à Gaza, au Soudan, sans oublier aucun des autres conflits, mais la situation à coup
  sûr dans vraiment ces deux zones pour les enfants est absolument insoutenable. C’est
  une priorité humanitaire : rouvrir la voie pour les humanitaires, permettre l’accès,
  sécuriser les enfants, recréer les conditions d’une stabilisation et d’une meilleure
  protection possible est une priorité fondamentale. La deuxième chose, c’est évidemment
  la santé. Et je salue le docteur Tedros qui est là avec nous. On a fait beaucoup
  d’initiatives ces dernières années et je remercie Tedros et les gouvernements qui
  aussi, ont fait ça avec nous. C’est ce qu’on a fait aussi avec le Gavi, l’alliance
  mondiale pour les vaccins qui a permis d’éviter 23 millions de décès d’enfants depuis
  2000. Le Fonds mondial pour la prévention du VIH, dont nous sommes le deuxième contributeur,
  mais aussi la santé maternelle, néonatale, infantile et adolescente, notamment à
  travers le Fonds Muskoka, qui a contribué à baisser de 16 % la mortalité des enfants
  de moins de 5 ans en Afrique de l''Ouest et l''Afrique centrale. Je cite quelques-unes
  de ces initiatives, mais pour dire qu''en matière de santé, continuer à mobiliser
  nos instruments, que ce soit nos fonds verticaux, l''Organisation mondiale de la
  santé, pour les enfants avec les gouvernements, pour renforcer leurs systèmes de
  soins primaires, pour améliorer leurs systèmes de vaccination, comme on l''a fait
  d''ailleurs avec le Sénégal et avec Pasteur pour justement aller encore plus loin,
  est clé, parce qu''on sauve des vies et les résultats sont mesurables et très tangibles.
  Troisième sujet qui est indissociable, c''est évidemment l''alimentation. Et là-dessus,
  je voudrais insister sur tout ce qui est fait avec justement la coalition mondiale
  pour l''alimentation scolaire, que nous avons lancé en 2021 en partenariat avec
  la Finlande et le Programme alimentaire mondial, complété par la suite par son accélérateur
  de la Rockefeller, pour que d''ici 2030, chaque enfant dans le monde ait accès à
  un repas scolaire de qualité par jour. Et là aussi, les résultats sont là. 466 millions
  d''enfants bénéficient aujourd''hui de repas scolaires grâce à ces programmes locaux.
  Et donc cet agenda sur l''alimentation est clé. Et pour moi, avoir nos grandes entreprises
  qui sont pleinement engagées sur l''alimentation de nos enfants, est absolument
  fondamental, et je les en remercie aussi. Et puis enfin, il y a l''éducation. On
  s''est beaucoup battus avec le Partenariat mondial pour l''éducation. On avait coprésidé
  il y a quelques années avec le Sénégal la conférence, justement, de financement.
  On a pu avancer avec justement ce que fait le Partenariat mondial pour l''éducation,
  ce que fait l''UNICEF et ce que fait l''UNESCO en la matière, qui est absolument
  fondamental avec les pays, pour aider à soutenir les programmes d''éducation des
  pays les plus fragiles et les plus pauvres, et pour accélérer les programmes d''éducation,
  en particulier des jeunes filles, avec des vrais résultats tangibles que nous avons
  eus dans plusieurs régions. Il faut absolument, là aussi, soutenir cet effort. Et
  c''est dans ce cadre que je voudrais dire quelques mots pour conclure sur, en effet,
  la protection de nos enfants dans cet environnement numérique. Parce que quand on
  parle de, au fond, l''accès humanitaire, l''alimentation, la santé et l''éducation,
  tout ça est, je dirais, encore redoublé, où la situation se détériore pour beaucoup
  de nos enfants dans cette ère du numérique. Et je veux dire qu''on a une immense
  responsabilité parce que durant la décennie qui vient de s''écouler, nous avons
  eu accès à des technologies complètement nouvelles qui ont amélioré la productivité
  dans certains secteurs, complètement changé notre manière de nous informer, de communiquer,
  de gouverner aussi, qui parfois, oserais-je le dire, les ont déréglées également.
  Mais on a laissé ces instruments à la portée de nos enfants sans nous poser une
  seconde réellement, dès le début, la question de savoir si c''était bon ou mauvais
  pour eux. Et les résultats sont tangibles. On a été plusieurs à mettre en place
  des commissions indépendantes d''experts. En 2024, une commission nous a rendu les
  travaux en France, qui a clairement montré que les écrans et les réseaux sociaux
  étaient très mauvais pour nos enfants et nos adolescents. C''est pour ça aussi qu''on
  a, en France, poussé un changement de règles en interdisant les écrans en dessous
  de 6 ans, en interdisant les portables jusqu''au lycée, en poussant une loi qu''on
  va reprendre pour protéger nos enfants et nos adolescents des réseaux sociaux, et
  qu''on a réussi à établir un agenda européen qui va permettre, avec le Kids Act,
  de complètement protéger nos enfants et adolescents en dessous de 13 ans des réseaux
  sociaux, et d''avoir un accès très réduit et très régulé entre 13 et 15 ans. Et
  ça, c''est absolument nécessaire pour le bon développement cognitif, affectif de
  nos enfants et de nos adolescents dans le monde où on vit. C''est basé sur la science.
  Et c''est ça qu''on va poursuivre avec la charte qui sera signée tout à l''heure,
  sur l''intelligence artificielle, parce que de la même manière, nos enfants et nos
  adolescents sont déjà plongés dans le monde de l''intelligence artificielle. Ceux
  qui ont accès à certaines messageries, je ne vais citer aucune marque, aucune plateforme,
  mais beaucoup ont déjà ce qu''on appelle des chatbox d''IA et échangent avec cette
  IA. Et les chiffres sont édifiants. C''est-à-dire qu''on a vraiment une proportion
  considérable de nos enfants et de nos adolescents qui construisent leur vie affective,
  leur représentation du monde en échangeant avec ces partenaires qui ressemblent
  à une personnalité humaine et auxquels ils livrent tout et bien souvent pour le
  pire. Et on leur a mis dans les mains sans regarder si c''était bon ou mauvais pour
  eux. Aucun d''entre nous ne penserait une seule seconde que vous allez donner à
  votre enfant un jouet que vous n''avez pas testé. On a même construit dans nos pays
  des règles absolument colossales pour tester ces jouets. Et on a dit, quand il s''agit
  du numérique, on ne va pas du tout le tester, on ne va pas se demander si c''est
  bon ou mauvais pour eux, on leur a donné. C''est très mauvais pour eux. Et les conséquences
  sur la santé mentale sont d''ores et déjà établies. Et donc nous, maintenant, on
  va pousser pour qu''il y ait une pré-certification de toutes les solutions d''intelligence
  artificielle, un pré-audit, et qu''on dise : c''est autorisé ou pas pour les enfants.
  Cet agenda de protection des enfants à l''heure du numérique, est absolument fondamental
  parce qu''on est en train de, au fond, dérégler nos enfants et nos civilisations
  qui ont passé des siècles à bâtir toute une stratégie éducative, et de dire : quel
  est le bon développement pour que nos enfants soient bien élevés, puissent s''orienter
  comme des êtres libres dans ce monde quand ils deviendront adultes, puissent avoir
  le meilleur développement affectif, cognitif possible ? On les dérègle nous-mêmes
  à l''heure du numérique en leur disant : là, c''est la jungle, et en les y plongeant.
  Donc ça, c''est un agenda extrêmement important sur lequel on a moins d''instruments
  aujourd''hui. Et donc il faut qu''on, avec l''ensemble des collègues qui sont là,
  les gouvernements, les acteurs du numérique, les ONG, je veux vraiment saluer le
  travail de beaucoup d''académiques, d''ONG, qui sont d''ailleurs présents dans cette
  salle et qui, sur chacun de ces domaines, quand on parle de l''enfance, sont très
  actifs à vos côtés, à nos côtés, on va devoir se réengager pour aller plus loin.
  Je ne veux pas être plus long, je l''ai déjà été trop. Mais je voulais vous dire
  combien pour moi cette discussion est essentielle et combien cette bataille pour
  justement protéger, investir, prévenir et avoir une technologie pour nos enfants
  est essentielle. 10 novembre 2026 - Seul le prononcé fait foi Animatrice Merci beaucoup
