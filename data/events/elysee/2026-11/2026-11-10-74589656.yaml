  », mandatée par le Gouvernement pour évaluer les effets de l’intelligence artificielle
  sur la société et les individus, notamment les enfants, a remis son rapport au Président
  de la République, au Palais de l’Élysée. Intitulé Protéger sans empêcher : nos vulnérabilités
  à l’ère de l’IA générative, ce rapport prolonge les réflexions engagées sur les
  conséquences du numérique et de l’intelligence artificielle sur nos sociétés. Protéger
  sans empêcher : nos vulnérabilités à l''ère de l''IA générative.'
