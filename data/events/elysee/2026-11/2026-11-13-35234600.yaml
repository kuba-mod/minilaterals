title: Conseil européen informel consacré à l’intelligence artificielle.
text: Le Président Emmanuel Macron a participé, ce vendredi à Dublin, à un Conseil
  européen informel consacré à l’intelligence artificielle. Une première séquence
  a été consacrée à l’attractivité et à la souveraineté européennes dans ce domaine,
  avant d’aborder la gouvernance internationale de l’intelligence artificielle et
  la maîtrise de ses risques. Les échanges ont notamment porté sur l’accès des Européens
  aux modèles d’IA les plus avancés et sur la pleine mise en œuvre du cadre européen,
  en particulier de l’AI Act.
