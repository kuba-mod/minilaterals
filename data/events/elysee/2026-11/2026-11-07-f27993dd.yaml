title: Pour la durée de son congé maternité, Maud Bregeon est remplacée au porte-parolat
  du gouvernement par Mathieu Lefèvre.
text: Pour la durée de son congé maternité, Mme Maud Bregeon est remplacée au porte-parolat
  du gouvernement par M. Mathieu Lefèvre, ministre délégué auprès de la ministre de
  la Transition écologique, de la Biodiversité et des Négociations internationales
  sur le climat et la nature, chargé de la Transition écologique. Durant cette période,
  M. Roland Lescure, ministre de l'Économie, des Finances et de la Souveraineté industrielle,
  énergétique et numérique exercera les attributions de ministre de l’Énergie. M.
  Arnaud Viala est nommé ministre délégué auprès de la ministre de l’Aménagement du
  territoire et de la Décentralisation, chargé de la Ruralité.
