date: '2026-11-12'
type: press_release
source_name: elysee
title: 9ème sommet de la Communauté politique européenne à Dublin.
text: 'Le Président Emmanuel Macron s’est rendu à Dublin, ce jeudi afin de participer
  au 9ᵉ sommet de la Communauté politique européenne. Réunissant les chefs d’État
  et de gouvernement de la Grande Europe, ce sommet a été l’occasion d’échanger sur
  les enjeux de stabilité régionale, de sécurité et de coopération concrète à l’échelle
  du continent. 12 novembre 2026 - Seul le prononcé fait foi Écoutez, je voulais dire
  d''abord combien j''étais heureux d''être en Irlande à nouveau, de revenir après
  la visite effectuée en 2021. Et je veux remercier vraiment le Taoiseach et l''ensemble
  du gouvernement et du peuple irlandais pour leur accueil pour ce sommet de la Communauté
  politique européenne. Pour moi, ce qui est très important, c''est justement la déclaration
  et la charte que nous allons adopter. Il y a une quarantaine de pays européens qui
  ont agréé des principes communs de sécurité futurs pour l''Europe. C''est un document
  qui vient cristalliser ce que nous avons fait ces dernières années, c''est-à-dire
  qui reconnaît l''importance d''un pilier européen de la défense. Il y a l''Union
  européenne, il y a l''OTAN, mais il y a besoin de cette coordination au sein d''une
  Europe large, qui acte la nécessité de s''équiper ensemble, de travailler ensemble,
  de planifier ensemble, qui acte aussi la nécessité de gérer nos risques comme une
  Europe large. Et à l''heure où beaucoup voudraient voir l''Europe hors des discussions
  qui concernent sa sécurité et sa stabilité, cette déclaration est extrêmement importante
  parce qu''elle s''appuie sur tout ce qu''on a fait durant la dernière décennie,
  mais elle acte justement la nécessité d''un sursaut, au fond, de cette Europe large,
  tous ensemble. Le 2ᵉ élément très important de cette déclaration à mes yeux, c''est
  que nous cristallisons là aussi des initiatives communes pour notre sécurité. Au-delà
  des sujets de défense et de sécurité, l''Europe est confrontée à des risques, des
  risques démocratiques : les attaques informationnelles, les manipulations de l''information,
  les interférences. Nous avons bâti une initiative au sein de la Communauté politique
  européenne qui, avec des pays comme la Moldavie, l''Ukraine, l''Arménie, évidemment
  nos amis britanniques ou norvégiens, nous permet d''agir ensemble avec des coopérations
  de sécurité communes. Et de la même manière, la lutte contre les trafiquants, la
  drogue, le narcotrafic a donné lieu à une coalition qu''on a appelée l''ECAD, qui
  s''est d''ailleurs réunie pour une réunion technique il y a quelques mois en Italie,
  où là aussi on a bâti des coopérations nouvelles entre nos ports, entre nos services
  de lutte contre les réseaux de trafiquants, parce que ça ne s''arrête pas aux frontières
  de l''Union européenne et c''est là où l''Europe large prend tout son sens. Et donc,
  cet élément de sécurité est absolument clé. Cette déclaration, pour moi, est très
  importante et sera un des axes ici de ce sommet de la Communauté politique européenne.
  Nous aurons l''occasion aussi d''avoir un groupe de soutien pour l''Arménie, un
  groupe de soutien de la Moldavie, de nous réunir en soutien à l''Ukraine et de pouvoir
  avancer sur plusieurs des initiatives que je viens d''évoquer. Est-ce qu''il y a
  une fenêtre d''opportunité là pour un cessez-le-feu en Ukraine ? Écoutez, je pense
  qu''à chaque fois qu''il y a une possibilité d''avoir un cessez-le-feu et de construire
  une paix durable sur cette base, il faut essayer de la saisir. On aura l''occasion
  tout à l''heure de parler avec le président Zelensky. Je reviendrai vers vous. Est-ce
  que vous avez une date pour la nomination d’un émissaire de l''Europe sur l''Ukraine,
  comme il y a cette discussion, pour avoir un représentant qui parle à Poutine ?
  Je pense qu''aujourd''hui, on a surtout une nécessité qui est que l''Europe ait
  une vision claire et unie de ce qu''elle veut pour l''Ukraine et pour elle-même.
  Et je pense que le contenu détermine le format. Quand on a voulu soutenir l''Ukraine
  en février 2025 et qu''il y avait un doute sur le soutien, on a dit : « On soutiendra,
  on a un objectif qui est de soutenir en capacités, en financements et de bâtir des
  solutions. » On a créé la coalition des volontaires. Et donc le format, il est déterminé
  par le contenu. Il faut donc qu''on reprenne l''initiative de discussions avec la
  Russie, en Européens, et c''est à ce moment-là que le format sera défini. Aujourd''hui,
  il y avait des représentants de plusieurs pays et d''institutions européennes qui
  étaient à Abu Dhabi, mais c''était de la coordination en amont d''un dialogue, en
  fait, entre des émissaires américains et russes. Donc l''Europe doit d''abord savoir
  ce qu''elle veut clairement. Aujourd''hui, l''Europe est très claire sur son soutien
  à l''Ukraine. On doit maintenant clarifier une copie de ce qu''est notre projet
  de paix, et de ce qu''est un projet d''architecture de sécurité future. À ce titre,
  la déclaration d''aujourd''hui les détermine. Je serai toujours au service de ce
  sujet. Are you optimistic that the USA will bring back a positive message ? I don''t
  know. I don''t know. I have no inside information. Qu’est-ce que vous pensez de
  Giorgia Meloni, est-ce que vous l''avez lue ? Qu''est-ce que vous en pensez ? Je
  pense que le sujet n''est pas de savoir pour nous si l''un ou l''autre n''y est
  pas. Il y a le E3 qui s''est imposé comme un format qui est pertinent en termes
  de sécurité. Il y avait un format Normandie avec l''Allemagne et la France. Ce qui
  importe, c''est pourquoi. Je le redis, quand on a créé la Coalition des volontaires,
  initiative française puis franco-britannique, on a associé nos amis allemands, on
  en a la coprésidence ensemble, c''est parce qu''on avait un projet. Donc je pense
  qu''il faut plutôt dire aujourd''hui quelles sont les propositions concrètes, et
  c''est celles qui déterminent les formats. Après, sinon, chacun dira qu''il veut
  un format où il est. Ce n''est pas le sujet le plus important. Monsieur le Président,
  comptez-vous rencontrer le Premier ministre du Québec au Cambodge ? Et comment vous
  entrevoyez la relation entre Québec, Ottawa et Paris dans l''éventualité d''un gouvernement,
  justement, un gouvernement indépendantiste à Québec ? Je suis très content, en tout
  cas, j''ai eu l''occasion d''avoir le Premier ministre au téléphone. On a eu un
  échange, on va se voir au Cambodge. J''ai eu aussi hier le Premier ministre Carney.
  Je suis très heureux d''abord qu''ici, à la CPE, on ait la présence à nouveau du
  Canada comme on l''avait eu à Erevan, parce que ça montre l''importance de cet axe
  Europe-Canada qui partage les mêmes valeurs. Ensuite, au moment de la Francophonie,
  je verrai l''ensemble des représentants. Il ne m''appartient pas de m''ingérer dans
  les affaires canadiennes, mais de continuer à soutenir en tout cas nos affinités,
  y compris nos affinités culturelles et linguistiques. Il y a eu plusieurs alertes
  à la bombe qui ont été signalées dans plusieurs pays européens, dans des écoles,
  des médias, sur des avions aussi. Est-ce que la responsabilité de ces fausses alertes
  a été établie ? Est-ce que les regards se tournent vers la Russie ? Alors, vous
  avez raison, et je veux ici dire notre très grande préoccupation face à cette épidémie
  d''alertes à la bombe et de menaces. Donc, on est évidemment très vigilants. J''aurai
  l''occasion de réunir un Conseil de défense et de sécurité sur ce sujet dans quelques
  jours. Au moment où je vous parle, nous n''avons pas d''éléments suffisamment établis
  pour pouvoir faire une attribution. Et donc la réponse est qu''à ce stade, on ne
  peut pas dire qu''il y aurait des puissances extérieures qui sont derrière ces appels.
  Why should we be able to trust Putin in peace talks now ? I''m not saying you should.
  I''m saying it''s important today what we do with Ukraine, and to clearly keep supporting
  them. I think it''s very important as well to endorse very clear principles and
  commitments as Europeans in this wider Europe, which is this European political
  community, in order to make sure that we design ourselves our own security principles
  and our own architecture of security. This is my main objective. Does Europe lack
  credibility and confidence at the moment, not speaking with one voice, not having
  a seat in the middle of negotiations ? I think what''s important is what we do.
  Without Europeans, I mean, there is no support for Ukraine. Let''s be honest. Today
  you have Canada, Europeans. I want to commend as well our Australian and Japanese
  friends. But look at the Coalition of the Willing. You have here today in Ireland
  probably 80, 90 % of the contribution of this Coalition of the Willing. It''s 100
  % of the support to Ukraine. We are those who support Ukraine. We are those who
  help them in this resistance war. There is no more U.S. support. So there is some
  mediations, fine. But at the end of the day, we will be the ones to define and decide
  for our future security as Europeans. I have no doubt about that. 12 novembre 2026
