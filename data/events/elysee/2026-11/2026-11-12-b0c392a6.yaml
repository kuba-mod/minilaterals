  for our future security as Europeans. I have no doubt about that. Dans le cadre
  de ce format de la Communauté politique européenne, qu’il a initié en 2022, le Président
  de la République a porté une initiative visant à énoncer collectivement des principes
  clés pour la sécurité européenne , ainsi qu’à se fixer des objectifs communs couvrant
  aussi bien les enjeux stratégiques et industriels que les menaces hybrides, la lutte
  contre les manipulations informationnelles et la sécurité alimentaire. Une déclaration
  a été adoptée par 40 États pour s''accorder sur ces principes. Parce qu’aucune décision
  concernant la sécurité de l’Europe ne peut se prendre sans les Européens . Declaration
  on key principles of European security. En marge du sommet, le Président a également
  participé à une table ronde sur la sécurité et la défense de la démocratie en Europe
  , ainsi qu’à des réunions en soutien à l’Ukraine, à l’Arménie et à la Moldavie .
  Il a également coprésidé, avec la présidente du Conseil des ministres italien, Giorgia
  Meloni , la troisième réunion de la Coalition européenne contre les drogues , initiative
  franco-italienne.'
