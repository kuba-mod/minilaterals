date: '2026-11-19'
type: press_release
source_name: elysee
title: Réunion de la Coalition des volontaires à Berlin.
text: 'Le Président de la République a coprésidé, avec le Chancelier allemand et le
  Premier ministre britannique, une réunion de la Coalition des volontaires, le jeudi
  19 novembre 2026 à Berlin. Cette dix-huitième réunion des chefs d’État et de gouvernement
  depuis la création de la Coalition, le 17 février 2025 à Paris, était consacrée
  à trois grandes priorités : Les dirigeants ont également fait le point sur le premier
  exercice de la Force multinationale pour l’Ukraine (MNF-U), baptisé « Koalicja »
  , lancé le 9 novembre. Cet exercice rassemble les membres de la Coalition des volontaires
  qui participent à cette initiative, avec un rôle central joué par la France. Il
  vise à démontrer la capacité de la Coalition à agir concrètement et à déployer rapidement
  cette force multinationale lorsqu’un cessez-le-feu aura été conclu , afin d’apporter
  des garanties de sécurité à l’Ukraine. 19 novembre 2026 - Seul le prononcé fait
  foi Merci beaucoup, Monsieur le Chancelier, cher Friedrich, pour l''invitation et
  l''organisation de ce sommet. Je remercie évidemment le Président Zelensky d''être
  à nos côtés, comme nous sommes surtout aux côtés de son peuple et de lui-même. C''était
  un plaisir de retrouver le Premier ministre Andy Burnham. Nous avons eu la chance
  d''avoir, en effet, les deux envoyés spéciaux, Monsieur Kushner et Witkoff, et le
  Président Trump, qui a pu échanger avec nous durant ce sommet. C''est le 18ème sommet
  de la Coalition des volontaires que nous tenons à ce niveau depuis sa création à
  Paris, il y a un peu plus d''un an et demi. Le Chancelier a parfaitement rappelé
  ici les enjeux et décrit en détail les choses. Je ne veux pas ici répéter ce qui
  a été dit. Mais, au fond, si nous caractérisons la situation aujourd''hui, l''Ukraine
  résiste sur la ligne de front, elle reprend même du terrain. Mais la Russie a décidé,
  depuis la fin de l''été, d''attaquer massivement Kiev et les civils. Avec des actions
  d''une violence et d''une cruauté inédites, avec, avant l''hiver, la volonté de
  couper la ville en deux, de casser les infrastructures de transport, de casser les
  infrastructures énergétiques. À côté de ça, il y a eu plusieurs discussions qui
  se sont faites, qui ont montré les positions très maximalistes de la Russie. Voilà
  la situation où nous en sommes. Donc, le premier objectif qui a été affirmé ici,
  et notre priorité à tous. Si on veut être crédible, même dans les négociations de
  paix, c''est que l''Ukraine tienne et soit dans les meilleures situations possibles
  pour négocier. Donc, la priorité des priorités, c''est le soutien à court terme
  à l''Ukraine. C''est ce que nous faisons en livrant de nouveaux radars, des autodirecteurs,
  en accélérant les travaux sur Freya, et nous organiserons dans quelques semaines,
  à Paris, un nouveau sommet de la Coalition Freya pour, justement, l''antidrone et
  l''antiballistique. C''est de déployer des nouveaux systèmes antimissiles et des
  intercepteurs nouveaux, et il faut que tous les membres de cette Coalition, tous
  les membres présents dans cette salle aujourd''hui, fassent le maximum pour livrer
  les capacités à l''Ukraine dont elle a besoin pour résister. Tous ceux qui ont des
  intercepteurs disponibles doivent les livrer. Tous ceux qui ont la capacité de livrer
  des images supplémentaires doivent les donner. Tous ceux qui ont la capacité de
  donner des moyens qui sont des moyens de défense et de protection des citoyens ukrainiens
  doivent le faire maintenant. C''est la priorité des priorités. Deuxième chose, c''est
  que nous devons aussi améliorer notre protection de Kiev et la Coalition des volontaires
  doit pouvoir trouver aussi de nouvelles voies et moyens pour protéger Kiev dans
  les semaines qui viennent. C''est l''élément clé. L''Ukraine tient sur le front.
  Elle est attaquée dans sa population civile. Nous devons être là. Et ce n''est pas
  confrontationnel, c''est aider l''Ukraine à résister. Mais c''est notre devoir maintenant.
  Le deuxième élément, c''est les garanties de sécurité. C''est clé pour négocier
  la paix, c''est clé dans la durée. Ces garanties de sécurité, nous les avons finalisées
  dans leur contenu en janvier dernier. Les émissaires du président Trump étaient
  déjà avec nous, accompagnés du général Grynkewich, et nous avons validé le schéma
  présenté par nos chefs d''État-major en janvier dernier. Nous avons donc une planification.
  Le soutien à l''armée ukrainienne et le format de l''armée ukrainienne sur les années
  qui viennent, les pays membres de la Coalition qui sont prêts à déployer, après
  la paix, loin de la ligne de front sur le sol ukrainien, les pays qui sont prêts
  à faire un deuxième rideau, et les solidarités en dernier office. Ce schéma reste
  valide. C''est celui qui assure notre sécurité. Dans le moment où nous sommes, face
  au maximalisme des positions russes, je pense qu’il faut rouvrir la question, en
  effet, de l''adhésion de l''Ukraine à l''OTAN, c''est ce que j''ai proposé il y
  a quelques jours, c''est le bon moment, elle a été écartée au premier semestre 2022,
  dans un contexte qui était totalement différent. Je pense qu''aujourd''hui, la question
  se pose, y compris pour nous Européens le jour d''après, parce que l''Ukraine sera
  un pays très fortement équipé, avec une armée nombreuse, et pour notre sécurité
  dans la durée, sa présence dans l''OTAN est pertinente. Dans ce contexte aussi,
  je veux dire qu''au moment où nous nous parlons, et pour montrer que la Coalition
  des volontaires est quelque chose de très concret, l''opération qui a été annoncée
  à Paris le 13 juillet dernier, l''opération dite Koalicja , décidée en Pologne,
  qui permet de déployer nos capacités, d''entraîner nos forces pour le jour d''après,
  est en cours. On a plus de 2 500 soldats qui sont déployés, et je remercie la Pologne
  pour son accueil. On a des opérations terrestres, aériennes, mais également maritimes.
  Une douzaine de pays qui sont actifs dans cette Coalition. La France fournit 1 100
  soldats qui sont déployés dans cet exercice, mais qui montrent la crédibilité de
  cette Coalition des volontaires. Mon dernier point est pour dire que, dans ce contexte,
  parce que nous serons crédibles sur les autres éléments, c''est-à-dire le soutien
  de court terme de l''Ukraine et les garanties de sécurité dans les termes que je
  viens d''évoquer, nous avons la volonté d''engager évidemment les discussions de
  paix avec la Russie. Soyons honnêtes, la Russie jusqu''alors n''a pas manifesté
  d''éléments concrets de paix. Néanmoins, ce qui a été acté, c''est que le bon format
  pour parler de la paix, c''est d''avoir autour de la table Ukraine, Russie, Etats-Unis,
  Europe. C''est donc le format qui sera suivi, dans les détails qui ont été évoqués,
  et qui doit permettre de traiter des sujets de territoire qui sont la responsabilité
  du président Zelensky, qui a la légitimité seule pour le faire, des questions de
  sécurité qui sont la responsabilité des Européens. Parce que c''est la sécurité
  de l''Europe et parce que nous sommes engagés dans cette Coalition des volontaires,
  et la question de la reconstruction des éléments de long terme et des réassurances
  où il faut avoir Ukrainiens, Européens, Américains pour le faire. C''est tout ça
  qui doit être acté dans des discussions de paix que nous organiserons selon ces
  termes. Je vous remercie beaucoup et je veux ici dire au président Zelensky combien
  nous sommes conscients que les semaines à venir sont des semaines critiques pour
  son pays, pour sa population et pour notre Europe toute entière. Je pense que cette
  Coalition des volontaires était au bon moment, au bon niveau et qu''elle a mobilisé
  de manière inédite, en effet, 40 représentants. Et je remercie le chancelier . Merci.
  Alors, Monsieur le Président, le chancelier, après les affirmations de Poutine en
  Chine, comment voyez-vous cette offre de négociation et l''invitation à Moscou tendue
  aux Européens ? En même temps, il refuse l''armistice et, en plus, ils attaquent
  massivement l''Ukraine, la bande de Kertch, etc. Donc, comme le Premier ministre
  et le chancelier tout à l''heure ont parlé de Yalta, comment voyez-vous ces trois
  puissances qui disposent de la force nucléaire, qu’est-ce que ça représente pour
  nous ? Sur ce sujet, je n''ai pas tellement de commentaires à faire. Une chose c''est
  normal que dans des formats comme celui-ci, il y ait des réunions qui permettent
  de définir, entre puissances dotées, les choses. J''ai vu, en tout cas, le texte
  qui sortait de la réunion. Il me semble que l''agenda n''était pas un Yalta. C''était
  des éléments qu''on peut partager ou ne pas partager, mais ça ne conduit pas à une
  réorganisation du monde. Je pense qu''aujourd''hui, s''il y a un élément critique
  pour la réorganisation de l''Europe, sa sécurité, c''est exactement la réunion qui
  s''est tenue à Berlin. Je pense que s''il y a un chemin pour redonner une vigueur
  et une vitalité au multilatéralisme et à l''ordre mondial, c''est ce qui peut se
  tenir entre les Etats-Unis, l''Europe et la Chine. Ce qui s''est passé aujourd''hui
  était un format. Il avait sa pertinence à coup sûr pour les intéressés. Et les conclusions
  avaient leurs intérêts pour les intéressés, mais ce n''est pas l''idée que je me
  fais d''un Yalta, sans pouvoir vous dire pour autant que je serais heureux d''avoir
  un Yalta aujourd''hui. Là où les choses ont changé, c''est que, comme vous l''avez
  compris, les Européens ont décidé, justement, ce sursaut, et entendent bien décider
  pour eux-mêmes. L''Europe n''est pas un sujet au menu des discussions, mais c''est
  un ensemble de puissances qui veulent construire leur propre avenir. Et c''est ainsi
  qu''il faut l''entendre. J''ai une question pour la presse française à propos du
  sommet qui s''est tenu ce matin à Shenzhen sans les Européens. Est-ce que vous confirmez
  avoir échangé avec Donald Trump et est-ce que vous partagez l''optimisme du président
  américain sur l''Ukraine ? Est-ce que vous pourriez, vous Monsieur le Président,
  vous rendre à Moscou ? J''ai une deuxième question. Il y a une possibilité que des
  partis qui ne soutiennent pas l''Ukraine arrivent au pouvoir dans plusieurs pays
  européens. Est-ce que vous avez profité de cette réunion pour cranter certaines
  choses en vue de cette éventualité ? Merci. Merci beaucoup. Il appartient au président
  Trump de révéler les discussions qu''il a eues à Shenzhen et de pouvoir en donner
  sa complète analyse. Je pense que ce qui était important et qui a été aussi un geste
  fort de respect et de volonté d''engagement mutuel, c''est qu''il a échangé avec
  nous ses premières impressions et qu''il a tenu par le truchement de ses représentants
  d''être là et d''avoir cet échange téléphonique. Après, je ne vais pas, moi, commenter
  une réunion à laquelle je n''étais pas. Sur les discussions, nous n''avons jamais
  coupé le contact avec Moscou. Il y a toujours eu, à différents niveaux, des contacts
  avec les autorités russes. Maintenant, la question, elle est dans la définition
  du quoi. C''est la priorité du moment. Mais si on met les choses dans le bon ordre,
  la priorité des priorités, c''est aider l''Ukraine à résister, à se défendre dans
  ce moment critique. C''est de finaliser ce qu''on a fait, les garanties de sécurité,
  c''est clarifier l''intégralité de ce que nous demandons sur la question des territoires
  et des garanties de sécurité pour réengager utilement cette discussion. Ça doit
  venir dans les meilleurs délais. Et nous trouverons l''endroit qui convient pour
  cela. Pour la suite, je ne vais pas préempter les choix démocratiques que fera le
  peuple français. Je pense que mon rôle, c''est jusqu''au dernier quart d''heure,
  d’œuvrer pour que la sécurité de la France et des Européens soit établie, la conviction,
  ce que nous portons, et ce que j''ai porté d''ailleurs dans ma réélection de 2022,
  qui s''est tenue après la guerre d''agression russe en Ukraine, dans sa deuxième
  phase, donc après février 2022, c''est que ce qui se joue en Ukraine, c''est notre
  sécurité. Nul ne peut l''ignorer. Donc, dans le même temps, le débat doit être démocratiquement
  organisé, pour que nos compatriotes puissent mesurer les impacts de telle ou telle
  décision proposée par telle ou telle partie. Il en va de la sécurité de la France
  et de l''Europe, ni plus ni moins. Donc, ce n''est pas quelque chose qu''on peut
  prendre à la légère. Voilà ce que je peux vous dire. 19 novembre 2026 - Seul le
