title: Declaration on key principles of European security.
text: 'Committed to peace and upholding international law, and in the face of unprovoked
  full-scale Russian aggression against Ukraine and growing threats to Europe stability,
  the signatory states, gathered for the 9th Summit of the European Political Community
  in Dublin on the 12th of November 2026, consider strengthening European security
  and defending their security interests as their common objective. The signatory
  states reiterate their firm support for the independence, sovereignty, and territorial
  integrity of Ukraine within its internationally recognised borders They underline
  the necessity to provide robust and credible security guarantees to Ukraine and
  reiterate, for those concerned, their intention to do so, in order to prevent the
  recurrence of aggression in Europe in the future. They underline that Russia’s hybrid
  campaigns and attempts to undermine support to Ukraine will only strengthen their
  commitment to Ukraine and their resolve. The signatory states recall that the path
  to peace in Ukraine should be decided with Ukraine and that any matter affecting
  European security should be decided with the Europeans. They consider that the following
  key principles of European security can contribute to provide a path to a just and
  lasting peace for Ukraine, which will be of utmost importance for stability in Europe
  They emphasize that Ukraine’s security is an integral part of Euro-Atlantic security
  and that future developments in European strategic stability will be conditional
  upon the conclusion of the war in Ukraine. The signatory states reaffirm the following
  general principles related to European security : With the aim of strengthening
  security in Europe, the signatory states support the following common objectives
  in accordance with their respective international commitments and constitutional
  laws : The above is without prejudice to the specific character of the security
  and defence policy and interests of the signatory states, and their respective constitutional
  laws and international commitments. Republic of Albania, Principality of Andorra,
  Republic of Austria, Kingdom of Belgium, Republic of Bulgaria, Republic of Croatia,
  Republic of Cyprus, Czech Republic, Kingdom of Denmark, Republic of Estonia, Republic
  of Finland, French Republic, Georgia, Federal Republic of Germany, Hellenic Republic,
  Hungary, Republic of Iceland, Ireland, Italian Republic, Republic of Latvia, Principality
  of Liechtenstein, Republic of Lithuania, Grand Duchy of Luxembourg, Republic of
  Malta, Republic of Moldova, Principality of Monaco, Montenegro, Kingdom of the Netherlands,
  Republic of North Macedonia, Kingdom of Norway, Republic of Poland, Portuguese Republic,
  Romania, Republic of San Marino, Slovak Republic, Republic of Slovenia, Kingdom
  of Spain, Kingdom of Sweden, Ukraine, United Kingdom of Great Britain and Northern
  Ireland.'
