date: '2026-11-16'
type: press_release
source_name: elysee
title: Visite d'État au Cambodge et Sommet de la Francophonie.
text: 'Le Président de la République et Madame Brigitte Macron se rendent au Royaume
  du Cambodge du 14 au 16 novembre 2026 pour une visite d''État et le 20e Sommet de
  la Francophonie. Cette visite est l''occasion de renouveler et d''approfondir la
  relation entre le Cambodge et la France , notamment dans les secteurs de l’énergie,
  de l’IA, de la santé, de la culture et du patrimoine. À son arrivée à Phnom Penh,
  le chef de l''État s''est entretenu avec le Premier ministre du Cambodge, Hun Manet
  , avant de participer à un dîner avec des personnalités culturelles. Dans la matinée
  du 15 novembre, le Président Emmanuel Macron a participé à l''ouverture du 20e Sommet
  de la Francophonie qui réunit les chefs d’État et de gouvernement des pays ayant
  le français en partage. Poursuivant l''élan insufflé lors de la dernière édition
  à Villers-Cotterêts en 2024, qui a marqué le début de la présidence française du
  Sommet de la francophonie pour deux ans, le chef de l''État a réaffirmé la Francophonie
  comme communauté de valeurs au service du dialogue, des échanges économiques et
  de la coopération . Le thème retenu pour cette édition est : « réinvestir dans la
  paix pour une prospérité partagée et une stabilité durable » . 15 novembre 2026
  - Seul le prononcé fait foi Majesté, Monsieur le Premier ministre du royaume du
  Cambodge, Madame la secrétaire générale de la francophonie, Mesdames, Messieurs
  les chefs d''État et de gouvernement, Mesdames, Messieurs les ministres, Mesdames,
  Messieurs les ambassadrices et ambassadeurs, Chers amis francophones, C''est avec
  une grande joie que nous nous retrouvons aujourd''hui à Phnom Penh et je veux remercier
  chaleureusement Sa Majesté le Roi Norodom Sihamoni pour son accueil et remercier
  Monsieur le Premier ministre Hun Manet et le Cambodge pour votre accueil et à tous
  et à toutes. Bientôt 30 ans après le sommet d''Hanoï, la francophonie revient en
  Asie, preuve que notre communauté n''est l''apanage d''aucun pays, d''aucun continent,
  mais bien le lieu d''un universel. C''est une fidélité à ce rendez-vous que vous
  avez rappelé à l''instant, Monsieur le Premier ministre. Notre premier sommet, celui
  du 20 mars 1970 à Niamey, où la francophonie était fondée, inventée par quatre dirigeants
  dont je veux ici convoquer la mémoire, Léopold Sédar Senghor, Habib Bourguiba, Amani
  Diori et Norodom Sihanouk, voulant que le français demeure après les indépendances,
  signifiant ainsi que celles-ci n''étaient pas des ruptures. Senghor aura cette formule :
  « Dans les décombres du colonialisme, nous avons trouvé cet outil merveilleux, la
  langue française. » Et la francophonie est donc, oui, cet espace décentré réconciliant
  le sud et le nord, un espace d''émancipation, de liberté, un instrument du multilatéralisme
  qui regroupe et réunit aujourd''hui 90 États et gouvernements, plus de 400 millions
  de personnes particulièrement jeunes, avec justement une dynamique pour les années
  à venir. Et nous sommes ici réunis parce que nos différences ne nous empêchent pas
  de porter ensemble certaines convictions. Une langue en commun c''est porter et
  partager un héritage et être capable de s''accorder sur l''avenir. C''est pour ça
  qu''il y a deux ans, à Villers-Cotterêts, là où en 1539 une ordonnance royale fit
  du français la langue du droit et de l''administration, nous avions choisi un thème
  tourné vers l''avenir, créer, innover et entreprendre en français. Nous avions alors
  voulu porter une conviction simple. La francophonie doit être à la hauteur des transformations
  du monde, répondre aux attentes des peuples et tout particulièrement à celles de
  notre jeunesse. Nous avions voulu une francophonie plus politique, plus économique,
  plus innovante, plus concrète, une francophonie qui agit pleinement et deux ans
  plus tard, je veux dire ici toute la fierté pour le chemin parcouru ensemble. Lors
  du Sommet de Villers-Cotterêts, 16 engagements avaient été pris autour de plusieurs
  axes d''action. Une francophonie espace d''échange. Je pense au Collège international
  de Villers-Cotterêts pour renforcer le dialogue francophone sur les enjeux communs
  de nos systèmes éducatifs, au programme international mobilité employabilité francophone
  ou au programme volontaire francophonie. C''était aussi le français comme langue
  d''affaires et de création dont l''organisation du salon Francothèque témoigne.
  C''était le français comme vecteur d''innovation pour la diversité dans l''espace
  numérique incarné par l''appel de Villers-Cotterêts pour un espace numérique libre
  et sûr et le français comme force de transformation de la société avec le lancement
  de l''alliance féministe francophone et la création du réseau francophone pour l''égalité
  des droits des femmes. Depuis le sommet de Villers-Cotterêts, nous n''avons cessé
  de défendre une francophonie plurielle et plurilingue qui encourage la création,
  l''innovation et l''entreprenariat en français tout en protégeant et en valorisant
  les autres langues. C''est parce que le français est un trait d''union entre nous
  tous ici que nous avons en effet créé le Collège international de Villers-Cotterêts.
  Il forme des traducteurs, des interprètes, autant de passeurs entre les cultures,
  autant de garants du plurilinguisme. Sa première promotion a réuni 20 enseignants
  et 17 pays dont le Cambodge et a permis de construire des outils pédagogiques nouveaux
  accessibles à tous. Cette maison est votre maison. Il nous appartient encore d''en
  ouvrir les portes plus grandes pour que les mots et les idées voyagent davantage.
  Il nous appartient aussi de fédérer les lieux qui portent haut la diversité linguistique.
  C''est tout le sens du réseau Cités associées que nous sommes fiers de lancer avec
  la Cité internationale de la langue française. Il favorisera les projets culturels
  communs, la circulation des artistes, les chercheurs des savoirs, les échanges entre
  nos jeunesses. C''est précieux et d''autant plus nécessaire à l''heure où notre
  monde connaît de profonds bouleversements technologiques. L''intelligence artificielle,
  en particulier, ouvre des perspectives immenses, mais elle soulève aussi des questions
  fondamentales de souveraineté, d''accès aux technologies, de diversité linguistique,
  de maîtrise de données. Nous ne pouvons accepter que les technologies de demain
  soient conçues pour quelques langues seulement et laissent à l''écart une partie
  de l''humanité. Nous devons tous, ici, en être les garants vigilants. L''appel de
  Villers-Cotterêts est devenu une référence pour nos régulateurs face aux grandes
  plateformes dans la lutte contre la désinformation, contre les discours de haine,
  mais nous devons faire de la langue française l''une des langues de référence d''entraînement
  des modèles d''intelligence artificielle contemporains. Nous ne devons jamais céder
  pour autant à la méfiance excessive envers l''innovation qui fait aussi vivre les
  langues. Le français, ne l''oublions pas, est également une langue pour entreprendre,
  commercer, investir, innover et créer ensemble. Et sur beaucoup de continents, je
  pense en particulier au continent africain, c''est la langue qui lit et relit tant
  d''autres langues. Je me réjouis à cet égard que le Cambodge organise cette année
  la deuxième édition de Francothèque et je veux saluer l''engagement de l''Alliance
  des patronats francophones qui en assure l''organisation. Soyez-en remerciés. Cette
  ambition économique est une promesse de prospérité, une promesse pour l''avenir.
  Et je pense en disant cela aussi à notre jeunesse pour qui la francophonie peut
  beaucoup. C''est la raison même d''être de ce programme international mobilité,
  employabilité francophone que je mentionnais précédemment, cet Erasmus francophone
  que nous avons voulu faire naître il y a deux ans et volontaire francophonie qui
  permettent à nos jeunesses d''étudier, de travailler, de s''engager, de se rencontrer
  par-delà les frontières. Mais n''ayons pas peur d''aller plus loin, de renforcer
  les coopérations éducatives et universitaires, de soutenir la formation des enseignants,
  de développer les mobilités. Je veux ici saluer tous ceux qui prennent part à cette
  vaste tâche de l''Agence universitaire de la francophonie à l''Université Senghor,
  sans oublier l''Association internationale des Maires francophones et TV5Monde.
  Je suis très heureux d''avoir pu inaugurer en mai dernier le nouveau campus de l''Université
  Senghor à Alexandrie, aux côtés du président Sissi et de Madame la Secrétaire générale.
  Nous voilà aujourd''hui réunis à Phnom Penh pour réinvestir dans la paix, pour une
  prospérité partagée et une stabilité durable. Telle est l''ambition difficile et
  actuelle de ce sommet de la francophonie, et à l''heure où le monde n''est pas épargné
  par les crises, cette langue en partage nous offre un outil et un espace unique
  de conciliation. Notre francophonie, unie dans sa diversité et résolue face aux
  défis de notre siècle, s''appuie sur une organisation forte et sur l''engagement
  indéfectible de chacun. Je veux à cet égard saluer le travail de Madame la Secrétaire
  générale, de ses équipes et de l''ensemble des opérateurs de la francophonie. Je
  veux aussi remercier les États et les gouvernements membres pour leur engagement
  et pour leur confiance. Notre espace francophone rassemble des pays aux histoires,
  aux géographies, aux traditions et aux sensibilités singulières. La francophonie
  n''est pas épargnée par les crises qui secouent notre monde à coup sûr. Nombre d''entre
  elles traversent directement notre espace commun et affectent les populations qui
  les composent. Mais la francophonie n''est pas seulement exposée à ces crises, elle
  y fait face. Notre langue en commun nous enjoint au dialogue et à la médiation.
  Elle renforce notre capacité à rapprocher les peuples et à faire émerger des solutions
  concertées. Elle nous donne les mots et les outils pour faire prévaloir le droit
  sur la force. Ce sommet doit être l''occasion de réaffirmer pleinement cette vocation
  politique et de traduire notre solidarité en engagement concret, en respect du droit
  international et de la Charte des Nations Unies. La francophonie que nous voulons
  n''est pas une francophonie du repli ou des fractures internes. C''est une francophonie
  de l''ouverture, qui protège le français tout en respectant et en valorisant les
  autres langues. Et cet engagement est primordial au sein des organisations internationales,
  car le multilinguisme n''est pas une simple question de traduction ou de procédure,
  il touche directement à l''égalité entre les États, à la qualité de la négociation,
  à l''accès à l''information et, finalement, à la légitimité même du multilatéralisme.
  Lors de ce Sommet, nous adopterons plusieurs déclarations ambitieuses et nous nous
  prononcerons à la fois sur la gouvernance de notre organisation et sur l''accueil
  de nouveaux membres. Ce n''est pas anodin, c''est ce qui fait de notre institution
  une structure vivante et en mouvement. Mes chers amis, la France continuera naturellement
  de prendre toute sa part au sein de la francophonie. Son engagement se mesure à
  la vitalité de nos coopérations, à l''action de nos établissements, à nos réseaux
  culturels, à nos partenariats universitaires et à l''engagement de tous ceux qui
  font vivre quotidiennement notre langue commune. Nous devons aussi veiller à préserver
  ce qui fait sa force, à savoir son unité. Notre famille francophone s''est élargie
  au fil des décennies et continue de le faire. Cette ouverture est une chance. Elle
  enrichit la francophonie, la renforce, la fait rayonner. Elle renforce aussi la
  nécessité d''instaurer le dialogue franc, sain et exigeant qui s''appuie sur nos
  points communs plutôt qu''il n''exacerbe nos différences et qui, à chaque fois,
  nous impose de bâtir le consensus pour préserver l''unité. Ce sera à nouveau toute
  notre ambition pour ce Sommet. Majesté, Monsieur le Premier ministre du Royaume
  du Cambodge, c''est à vous que je veux maintenant m''adresser, au moment où nous
  nous apprêtons à vous passer le témoin. Vous prenez aujourd''hui le relais avec
  votre histoire, votre voix singulière de cette ambition de dialogue, d''action et
  de paix que vous avez voulu donner à notre Sommet. C''est ainsi que notre francophonie
  vit et continue d''avancer. Le français est une langue monde et le monde recommence
  ici, à Phnom Penh. Et ce sommet nous rappelle que ce n''est pas seulement l''histoire
  qui nous relie, mais l''avenir lui-même. Vous l''avez rappelé à l''instant, Monsieur
  le Premier ministre, un avenir francophone optimiste, optimiste parce que tout nous
  y encourage. Et le passage de témoin de la présidence française à la présidence
  cambodgienne n''est pas une simple transition institutionnelle. Il incarne la continuité
  de notre ambition et la vitalité d''une organisation qui sait se renouveler. Vous
  nous faites l''honneur d''accueillir la francophonie à un Sommet où le monde a besoin
  de dialogue et de rapprochement. Comme une main tendue à chacun d''entre nous, votre
  présidence se place sous les auspices de l''engagement et du courage, face aux mots
  qui agitent notre monde et menacent notre espace commun. Vous nous rappelez que
  la francophonie porte une idée dont notre époque a besoin. Nous pouvons être différents
  sans être divisés. Nous pouvons défendre nos identités sans nous opposer. Nous pouvons
  partager une langue sans renoncer à la richesse de toutes les autres. C''est un
  message de paix, de confiance, d''ouverture et d''espérance. La France est heureuse
  et fière de vous transmettre aujourd''hui la présidence du Sommet de la francophonie.
  Nous la transmettons avec gratitude pour le travail accompli ensemble, avec confiance
  dans votre engagement et avec la volonté de continuer à vous accompagner dans les
  projets qui nous unissent. Nous la transmettons à un pays qui portera haut nos ambitions
  communes et fera vivre la francophonie avec toutes ses facettes. Nous la transmettons
  enfin à un ami, comme en témoigne la visite d''État que j''effectue à l''occasion
  de ma présence au Cambodge à votre invitation, votre majesté. 15 novembre 2026 -
  Seul le prononcé fait foi Majesté, Monsieur le Premier ministre du royaume du Cambodge,
