title: Déclaration conjointe des chefs d’État et de gouvernement de l’Allemagne, de
  la France, du Royaume-Uni et de l’Ukraine.
text: 'Les membres de la Coalition des volontaires, l’Ukraine et les États-Unis, se
  sont réunis aujourd’hui à Berlin. Les chefs d’État et de gouvernement demeurent
  déterminés à œuvrer ensemble en vue d’une paix globale, juste et durable pour l’Ukraine,
  essentielle à la sécurité de l’Europe. Les chefs d’État et de gouvernement ont condamné
  l’escalade systématique des attaques délibérées et aveugles de la Russie conduites
  à l’aide de missiles et de drones contre les populations et les infrastructures
  civiles ukrainiennes. Ils ont adressé leurs condoléances aux familles des victimes.
  Les chefs d’État et de gouvernement ont réaffirmé leur solidarité inébranlable avec
  l’Ukraine et le droit fondamental de l’Ukraine de se défendre contre la guerre d’agression
  de la Russie. Ils ont noté que la Russie payait un prix toujours plus élevé et intenable
  pour la guerre qu’elle mène. En dépit de pertes colossales, la Russie n’a obtenu
  que des avancées minimes sur le territoire ukrainien et elle n’a pu s’emparer d’aucune
  ville revêtant une importance stratégique. Les attaques croissantes conduites par
  la Russie contre les populations civiles ukrainiennes ne sauraient compenser ses
  échecs sur le plan militaire. Les chefs d’État et de gouvernement ont également
  condamné les récentes attaques hybrides menées par la Russie en Europe, notamment
  des activités de sabotage, des campagnes d’informations et des cyberattaques, qui
  visent à saper le soutien apporté à l’Ukraine. Ils ont clairement affirmé qu’aucune
  forme d’intimidation ne saurait ébranler leur soutien à l’Ukraine. Cela ne ferait
  qu’accroître leur détermination à renforcer la défense de l’Ukraine, de l’Europe
  et de l’Organisation du Traité de l’Atlantique Nord (OTAN). Les membres de la Coalition
  des volontaires et l’Ukraine sont parvenus à un large consensus sur les points suivants :
  Les chefs d’État et de gouvernement ont réaffirmé leur engagement d’apporter un
  soutien global à long terme à l’Ukraine, notamment une aide politique, diplomatique,
  militaire, financière et civile. Le temps ne joue pas pour la Russie, compte tenu
  du soutien indéfectible accordé par les membres de la Coalition à l’Ukraine et à
  la résilience ukrainienne. Les chefs d’État et de gouvernement ont réaffirmé qu’il
  était prioritaire de renforcer les capacités de défense aérienne de l’Ukraine, notamment
  en ce qui concerne l’interception de missiles balistiques, afin de protéger les
  populations civiles et les infrastructures critiques. Avant l’hiver, ils déploieront
  de nouveaux efforts, de concert avec des pays tiers, pour fournir à l’Ukraine des
  capacités de défense antimissile supplémentaires. Ils ont réaffirmé leur détermination
  à honorer pleinement l’engagement pris par les Alliés de l’OTAN de fournir à l’Ukraine
  70 milliards d’euros en équipements, assistance et formation militaires en 2026
  puis, à nouveau en 2027, pour un montant au moins équivalent. Dans le cadre du prêt
  de soutien à l’Ukraine de l’Union européenne (UE), 90 milliards d’euros seront accordés
  pour l’assistance militaire et financière d’ici à fin 2027, ce qui couvrira les
  besoins financiers de l’Ukraine jusque courant 2027. Les chefs d’État et de gouvernement
  ont souligné leur volonté de répondre aux besoins financiers de l’Ukraine sur la
  base d’informations claires et détaillées pour l’année à venir et au-delà, grâce
  à un effort conjoint de l’UE et des partenaires internationaux, notamment au sein
  du G7, ainsi que de collaborer avec l’Ukraine pour élaborer et mettre en œuvre les
  réformes agréées, notamment s’agissant de l’Etat de droit et de la lutte contre
  la corruption. Ils se sont engagés à intensifier les pressions économiques exercées
  sur l’effort de guerre de la Russie en mettant en œuvre des sanctions et des mesures
  économiques plus grandes et en réprimant le contournement des sanctions. Ils sont
  notamment convenus d’envisager de nouvelles mesures pour accroître les pressions
  sur les revenus des secteurs du pétrole et du gaz russes, de sanctionner les cybermonnaies
  et les flux financiers illicites russes et d’entraver le complexe militaro-industriel
  russe. Ils poursuivront leurs efforts visant à perturber la flotte fantôme russe,
  qui permet à la Russie de contourner les sanctions, ainsi que ceux visant à préserver
  la sûreté maritime en faisant respecter les règles et normes internationales en
  vigueur établies dans le cadre de l’Organisation maritime internationale. Les chefs
  d’État et de gouvernement ont réaffirmé le lien indissociable entre la sécurité
  de l’Ukraine et la stabilité et la sécurité de l’ensemble de la zone euro-atlantique
  et ils ont réitéré leur soutien aux aspirations européennes et euro-atlantiques
  de l’Ukraine. Conformément aux engagements pris à Berlin en décembre 2025 et à Paris
  en janvier 2026, ils ont souligné que l’Ukraine, une fois entré en vigueur un cessez-le-feu,
  devait disposer de garanties de sécurité solides et juridiquement contraignantes.
  Ces garanties seraient de nature défensive et mises en place en étroite concertation
  avec les États-Unis. Elles pourraient notamment comprendre : la poursuite et l’intensification
  à long terme de la fourniture d’un soutien militaire, financier et technique durable
  et important à l’Ukraine pour garantir dans le temps les capacités de ses forces
  armées ; la participation à un mécanisme de suivi et de vérification du cessez-le-feu
  proposé et conduit par les États-Unis ; une Force multinationale pour l’Ukraine
  dirigée par l’Europe, composée de personnel et matériel des États volontaires et
  soutenue par les États-Unis, qui prendrait des mesures de réassurance dans l’espace
  aérien, maritime et terrestre et œuvrerait à la rénovation des forces armées ukrainiennes ;
  un engagement juridiquement contraignant, dans le respect des procédures nationales,
  de prendre des mesures pour rétablir la paix et la sécurité en cas de nouvelle attaque
  de la Russie. Les chefs d’État et de gouvernement ont salué l’exercice « Koalicja-2026 »
  que mène actuellement la Force multinationale pour l’Ukraine, principalement en
  Pologne, qui démontre que cette force est crédible, très bien préparée et prête
  à être déployée et à remplir efficacement son rôle. Les chefs d’État et de gouvernement
  ont à nouveau souligné leur détermination à parvenir à une paix globale, juste et
  durable en Ukraine, en s’appuyant notamment sur les efforts diplomatiques actuellement
  menés par les États-Unis. Ils ont déclaré que la sécurité, la prospérité et la souveraineté
  de l’Ukraine demeuraient essentielles pour assurer la sécurité euro-atlantique.
  Ils ont réitéré leur soutien indéfectible à l’Ukraine dans la défense de sa liberté,
  de sa souveraineté et de son intégrité territoriale. Ils ont salué la volonté constante
  du Président ukrainien de conclure un cessez-le-feu immédiat et de participer à
  des négociations sérieuses. Ils se sont également prononcés en faveur d’un dialogue
  direct entre l’Ukraine et la Russie, avec la participation des États-Unis et de
  l’Europe. Ils ont échangé des points de vue convergents s’agissant des positions
  et principes généraux sur la participation de l’Europe à des négociations de paix.
  La priorité absolue des négociations demeure la fin des hostilités en Ukraine. Ils
  ont réaffirmé que les frontières internationales ne sauraient être modifiées par
  la force et qu’il convenait de respecter pleinement le droit souverain de l’Ukraine
  de choisir ses propres accords et alliances en matière de sécurité. Ils ont rappelé
  que les avoirs souverains de la Russie demeureront immobilisés tant que la Russie
  n’aura pas mis un terme à sa guerre d’agression et indemnisé l’Ukraine pour les
  dommages causés par cette guerre. Les chefs d’État et de gouvernement ont souligné
  que des accords relatifs aux questions plus larges liées à la sécurité européenne
  ne sauraient être conclus tant que la Russie poursuivrait sa guerre d’agression
  contre l’Ukraine en violation des normes internationales les plus fondamentales
  comme la Charte des Nations Unies, l’Acte final d’Helsinki et la Charte de Paris.
  Tout élément d’une négociation se rapportant à l’UE ou à l’OTAN devrait être agréé
  respectivement par l’UE et ses États membres et par les Alliés de l’OTAN. Les chefs
  d’État et de gouvernement demandent à la Russie de consentir à un cessez-le-feu
  concernant l’énergie pour toute la durée de l’hiver, qui constituerait une première
  étape vers l’arrêt des hostilités. Compte tenu de l’importance de la liberté de
  navigation et du passage sûr en mer Noire pour la sécurité alimentaire mondiale,
  les chefs d’État et de gouvernement ont souligné la nécessité de conclure également
  un cessez-le-feu permettant l’exportation des produits alimentaires de la région.'
