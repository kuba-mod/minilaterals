date: '2026-11-16'
type: press_release
source_name: elysee
title: Déclaration conjointe entre la France et le Cambodge à l’occasion de la visite
  d’État du Président Emmanuel Macron au Cambodge.
text: '1. À l’invitation de Preah Bat Samdech Preah Boromneath NORODOM Sihamoni, Roi
  du Cambodge, le Président de la République française, M. Emmanuel Macron, s’est
  rendu au Cambodge pour une visite d’État du 15 au 16 novembre 2026 et a participé
  au 20ème Sommet de la Francophonie à Phnom Penh. Cette visite met en lumière la
  relation privilégiée entre les deux pays, héritée d’une histoire commune et du rôle
  joué par la France en faveur du retour de la paix et de la reconstruction du pays
  dans le contexte des Accords de paix de Paris de 1991. Trente-cinq ans après la
  signature de ces Accords et soixante ans après le discours de Phnom Penh prononcé
  par le général de Gaulle, les deux dirigeants ont réaffirmé ensemble l’objectif
  d’un Cambodge en paix, leur attachement commun aux principes de souveraineté et
  de défense des valeurs que les deux pays ont en partage, dans un cadre respectueux
  des droits de l’Homme et de l’État de droit. 2. À cette occasion, le Président de
  la République française et le Premier ministre du Cambodge ont engagé les relations
  entre la France et le Cambodge dans un partenariat renouvelé qui servira de cadre
  à la coopération bilatérale pour les prochaines décennies. Ce partenariat reflète
  leur volonté commune de faire progresser la relation franco-cambodgienne dans les
  domaines des échanges humains, du développement économique, de la sécurité ainsi
  que des enjeux globaux, au service de leurs peuples et du bien commun, pour œuvrer
  collectivement à la paix dans un environnement mondial de plus en plus incertain.
  3. Les dirigeants ont rappelé le cadre politique solide sur lequel s’appuyait la
  relation bilatérale, dont la profondeur historique a permis de nourrir une proximité
  culturelle, institutionnelle et linguistique exceptionnelle entre la France et le
  Cambodge. Depuis l’indépendance du Cambodge, le respect de la souveraineté en a
  été le principe directeur, qui s’incarne encore aujourd’hui sur la scène internationale
  par un attachement à la Charte des Nations unies, au soutien au maintien de la paix
  et à l’exigence d’un multilatéralisme efficace, illustré par l’adhésion du Cambodge
  à l’initiative franco-mexicaine d’encadrement du veto au Conseil de sécurité. Les
  dirigeants ont salué l’esprit de la « Coalition des indépendants » appelée de ses
  vœux par le Président de la République française lors du Dialogue du Shangri-La
  en mai 2025, en faveur du renforcement de la résilience et de la souveraineté des
  pays d’Europe et d’Asie attachés au multilatéralisme, dans un contexte marqué par
  le retour des logiques de puissance et les attaques envers le droit international.
  Ils se sont engagés à approfondir leur coopération dans les instances internationales
  et au travers des mécanismes bilatéraux dédiés, à commencer par les consultations
  politiques annuelles entre les deux ministères des Affaires étrangères. 4. En tenant
  compte de l’évolution rapide de l’économie cambodgienne, de la fin prochaine de
  sa période transitoire de sortie du statut de PMA et des liens tissés avec les acteurs
  économiques et financiers français, les deux dirigeants ont affirmé leur souhait
  de poursuivre l’accompagnement du Cambodge sur la voie d’un développement durable
  en limitant ses dépendances extérieures, en luttant contre le changement climatique,
  la perte de biodiversité, les pollutions ; et au service des besoins essentiels
  de sa population. 5. À cet égard, les deux chefs d’État et de gouvernement ont salué
  la troisième édition du Forum d’Affaires France-Cambodge et présidé à la signature
  de plusieurs contrats et engagements pour des infrastructures durables et de qualité,
  notamment dans le domaine de l’énergie, de la santé, du transport et de l’agroalimentaire.
  6. Afin d’améliorer le cadre des relations économiques bilatérales, des lettres
  d’intention ont été signées entre les Douanes françaises et cambodgiennes, entre
  l’Institut national de la propriété industrielle (INPI) et le ministère du Commerce,
  ainsi qu’entre les administrations de l’aviation civile des deux pays. Un accord
  intergouvernemental pour l’élimination de la double imposition en matière d’impôts
  sur le revenu et pour la prévention de la fraude et de l’évasion fiscales a également
  été conclu. 7. La France a renouvelé son engagement à accompagner le Cambodge dans
  la mise en œuvre de ses politiques de développement structurantes à travers l’octroi
  de nouveaux prêts du Groupe Agence française de développement (AFD) et la mobilisation
  de l’expertise française pour soutenir, au Cambodge, le développement du secteur
  énergétique, d’un Centre national de recherche en intelligence artificielle ainsi
  que la gestion de l’eau potable à Siem Reap et des eaux usées à Phnom Penh. 8. Les
  deux dirigeants se sont félicités des coopérations établies en vue de contribuer
  au développement et la promotion de ressources humaines dans le domaine juridique,
  ainsi qu’au renforcement de la modernisation, la transparence et l’accessibilité
  de l’information juridique au bénéfice des citoyens, des entreprises et des administrations
  publiques. Ils ont salué la signature d’une déclaration d’intention sur la coopération
  archivistique signée lors de la visite d’Etat. 9. Alors que 2026 marque les 80 ans
  de la coopération militaire franco-cambodgienne, les deux dirigeants ont souhaité
  approfondir ce partenariat et le mettre au service des besoins d’adaptation des
  forces armées, à travers la signature de trois documents complémentaires : le renouvellement
  et la modernisation de l’accord intergouvernemental relatif à la coopération en
  matière de défense et au statut des forces ; l’arrangement administratif triennal
  (2027-2030) relatif à l’appui de la modernisation des forces armées royales khmères,
  à la formation des officiers et à la préparation aux opérations de maintien de la
  paix qui décline les modalités de la coopération française en appui à la restructuration
  des forces armées royales cambodgiennes ; et un arrangement technique cadre entre
  les ministères de la Défense relatif à l’échange de personnel militaire pour la
  formation académique portant sur le binômage entre l''École des officiers d''active
  de Thmat Paung et l''École spéciale militaire de Saint-Cyr. Les deux dirigeants
  ont également souligné l’impératif d’une réponse coordonnée face aux menaces transnationales
  contemporaines. 10. Convaincus que les relations entre États ne sont durablement
  ancrées dans la paix et la prospérité que si elles portent en leur cœur les liens
  entre les peuples, le Président de la République française et le Premier ministre
  HUN Manet ont salué le rôle essentiel de la communauté franco-cambodgienne, véritable
  pont entre les deux cultures, et l’implication de la diaspora cambodgienne de France
  dans les transformations du Cambodge. Ils se sont aussi félicités de la vigueur
  des échanges de volontaires internationaux, autre incarnation du lien de solidarité
  indéfectible qui unit les peuples français et cambodgien. 11. S’agissant de la langue
  française, le Président de la République française a félicité le Premier ministre
  HUN Manet pour le succès du XXème Sommet de la Francophonie de Phnom Penh, qui confirme
  la vigueur de la Francophonie dans la région Asie-Pacifique. La France et le Cambodge
  ont à cette occasion réaffirmé leur attachement aux valeurs et aux missions de la
  Francophonie, notamment à la promotion de la langue française comme langue d’opportunités
  et d’employabilité, de mobilité, de coopération et d’accès aux savoirs. La France
  et le Cambodge entendent contribuer à la structuration et au développement de la
  Francophonie économique, conformément aux orientations du Sommet, et porter conjointement
  cette ambition au sein de l’OIF. À cet égard, ils ont inauguré ensemble la deuxième
  édition de FrancoTech, le salon des innovations en français. Les deux dirigeants
  se sont réjouis que le Sommet ait été l’occasion de témoigner de la valeur ajoutée
  de la langue française pour le renforcement de la paix, de la stabilité et de la
  prospérité, notamment à travers la contribution cambodgienne au maintien de la paix
  dans les environnements francophones. La France et le Cambodge ont également réaffirmé
  leurs engagements en faveur de l’égalité entre les femmes et les hommes et de la
  promotion des droits des femmes, dans la continuité de la déclaration adoptée lors
  du 19e Sommet de la Francophonie et de l’Appel de Kigali « Pour accélérer les progrès
  vers l’égalité entre les femmes et les hommes dans l’espace francophone », adopté
  lors de la 46ème Conférence ministérielle de la Francophonie. 12. En matière culturelle
  et patrimoniale, la visite d’État du Président de la République française a été
  marquée par la cérémonie de clôture du chantier de restauration du temple du Mebon
  occidental à Angkor, en présence de Sa Majesté le Roi NORODOM Sihamoni. Cet investissement
  de 14 ans et de 7 millions d’euros dans la valorisation du patrimoine khmer s’inscrit
  dans l’esprit de l’engagement français avec le Cambodge au sein du Comité international
  de coordination pour la sauvegarde et le développement du site historique d’Angkor.
  13. Les gouvernements français et cambodgien ont parallèlement ouvert une nouvelle
  page en matière de coopération culturelle et patrimoniale à travers la signature
  de plusieurs accords, dont l’un vise à soutenir la valorisation du patrimoine cambodgien
  sur son sol et à l’international à travers le développement d’un partenariat structurant
  pour un projet de modernisation du musée national à Phnom Penh, dans le prolongement
  de l’étude de faisabilité conduite par la France en 2026. Ils ont également conclu
  une déclaration d’intention sur le développement des échanges et la professionnalisation
  du secteur des industries créatives et culturelles, en particulier dans les domaines
  du cinéma et de l’audiovisuel, des arts visuels, du livre, des arts de la scène
  et des résidences et de formations artistiques. 14. Soulignant le rôle majeur des
  partenariats universitaires et des mobilités étudiantes pour contribuer au développement
  des savoirs et des compétences, les deux dirigeants ont rendu hommage à l’ancrage
  durable d’une francophonie universitaire d’excellence, notamment dans les domaines
  du droit, des sciences de la santé ainsi que des sciences, des technologies et de
  l’ingénierie, grâce à une politique volontariste des établissements universitaires
  cambodgiens de référence et de leurs homologues français. Le Président de la République
  s’est aussi félicité de l’attractivité de la France dans les secteurs innovants
  et de pointe comme le spatial, le numérique et l’intelligence artificielle, et a
  salué à ce titre l’accord conclu entre l’université de Grenoble-Alpes et la Cambodian
  Academy of Digital Technology dans ces domaines. Il a également souligné l’engagement
  de la France à accompagner le développement de la recherche cambodgienne à travers
  la création d’écoles doctorales dans les secteurs d’intérêt partagé. Les deux parties
  encourageront également les partenariats entre établissements d’enseignement supérieur,
  organismes de recherche et acteurs économiques, afin de soutenir la recherche appliquée
  et la mobilité des chercheurs et des étudiants. 15. Les deux dirigeants ont souligné
  le caractère ancien, dense et dynamique de la coopération décentralisée, qui contribue
  depuis plusieurs décennies à l’ancrage durable de la relation bilatérale. Ils ont
  salué l’engagement des collectivités territoriales françaises et cambodgiennes dans
  la mise en œuvre de partenariats fondés sur l’échange d’expertise, le renforcement
  des capacités locales et la réalisation de projets concrets dans des domaines d’intérêt
  commun, notamment l’accès aux services essentiels, la santé, l’éducation, la gestion
  urbaine, l’environnement et la valorisation du patrimoine. Ils ont réaffirmé leur
  volonté de soutenir le renouvellement et l’élargissement de ces partenariats au
  service d’un développement durable, inclusif et équilibré des territoires. 16. Le
  Président de la République française et le Premier ministre HUN Manet, reconnaissant
  qu’il est primordial de faire progresser les connaissances scientifiques, la recherche
  et l’innovation au service des personnes, de l’intérêt public, de la planète et
  du progrès pour les peuples, se sont félicités de la convergence de vues de leurs
  deux pays sur les responsabilités à assumer ensemble pour relever les défis globaux.
  Ils ont souligné l’importance de renforcer la coopération scientifique et technologique
  dans des domaines d’intérêt partagé, notamment l’agriculture durable, la sécurité
  alimentaire, l’énergie, la santé, la gestion de l’eau et l’adaptation au changement
  climatique, en favorisant le partage des connaissances et le développement de solutions
  adaptées aux contextes locaux. 17. A cet égard, les deux dirigeants ont affirmé
  la nécessité d’accélérer l’action collective contre la triple crise planétaire –
  le changement climatique, la perte de la biodiversité et les pollutions. Afin de
  limiter le réchauffement à 1,5°C, les deux parties ont confirmé leur détermination
  à atteindre pleinement les objectifs de l’Accord de Paris, à travers des contributions
  déterminées au niveau national ambitieuses, et à mettre en œuvre l''engagement de
  sortie progressive des énergies fossiles en accélérant l''électrification bas carbone.
  La France continuera à soutenir l’objectif du Cambodge d’atteindre la neutralité
  carbone d’ici 2050, ainsi que son engagement à ne pas développer de nouvelles centrales
  à charbon. Ils ont insisté sur leur détermination à défendre le rôle de la science
  comme fondement de l’action climatique et reconnu l''importance des rapports du
  GIEC comme une contribution essentielle au deuxième Bilan mondial. Les deux dirigeants
  ont également souhaité continuer à travailler ensemble, en vue notamment d’une pleine
  mise en œuvre du cadre mondial de la biodiversité de Kunming-Montréal et de l’accord
  BBNJ qui sera déterminant pour assurer une meilleure protection de la biodiversité
  et de l’Océan. Les deux parties ont en outre réaffirmé leur engagement dans la lutte
  contre la déforestation ainsi qu’afin de favoriser l’économie circulaire et conclure
  les négociations d’un instrument international juridiquement contraignant pour mettre
  fin à la pollution plastique. 18. Ils se sont par ailleurs réjouis de l’adhésion
  du Cambodge au Partenariat mondial sur l’Intelligence artificielle (PMIA). Le Président
  de la République française et le Premier ministre du Cambodge se sont déclarés attachés
  à une intelligence artificielle éthique, inclusive, sûre et digne de confiance,
  ainsi qu’à la promotion d’une gouvernance démocratique et transparente des ressources
  qu’elle offre, et à la réduction de la fracture mondiale en la matière. Le projet
  de Centre national de recherche en intelligence artificielle, que la France va cofinancer
  au travers de l’Agence française de développement, s’inscrit dans le cadre de cette
  vision partagée. 19. Rappelant les engagements pris dans le cadre du Sommet One
  Health (Lyon, 5-7 avril 2026) en faveur de la mise en œuvre de l’approche « Une
  seule Santé » pour lutter contre les maladies infectieuses et non transmissibles,
  ils ont également réaffirmé leur volonté de maintenir leur coopération au bénéfice
  de l''excellence de la formation médicale francophone au Cambodge (Diplômes de Formation
  Médicale Spécialisée et Diplômes de Formation Médicale Spécialisée Approfondie,
  enseignements de spécialités) et confirmé la pertinence du modèle de coopération
  hospitalo-universitaire (hôpital Calmette, projet de CHU France-Cambodge). Ils ont
  également décidé d’approfondir ce partenariat et d’en élargir le champ à travers
  l’opérationnalisation de  l’approche « Une seule santé », notamment pour lutter
  contre les épidémies, en soutenant le développement de capacités cambodgiennes de
  recherche dans deux directions en particulier : la création d’une plateforme de
  recherche internationale en santé mondiale (PRISME) franco-cambodgienne, qui créera
  une dynamique transdisciplinaire en partenariat avec l’Académie nationale de médecine,
  cinq instituts de recherche et l’université d’Aix-Marseille ; et le renforcement
  de la recherche agricole et environnementale, notamment dans les domaines de la
  prévention et de la réduction de la pollution de l’environnement. Cette coopération
  pourra également favoriser la recherche sur les liens entre pollution environnementale,
  contamination des écosystèmes et santé humaine et animale, ainsi que sur les solutions
  innovantes de réduction des déchets plastiques et de promotion de l’économie circulaire.
  À cet égard, ils ont salué la conclusion d’un accord sur la coopération agricole
  et environnementale sur les volets technique, scientifique et commercial.'
