title: Disparition de David Habib.
text: Député depuis près de vingt-cinq ans, ancien maire de Mourenx, David Habib représentait
  avec passion les Pyrénées-Atlantiques. Avec lui, la France perd un grand artisan
  de sa vie politique et parlementaire. Il vit le jour en 1961 à Paris. Alors qu’il
  n’avait que quelques mois, sa famille s’installa à Pau – dans ce Béarn dont il allait
  devenir l’un des plus ardents défenseurs. Diplômé de l’Institut d’études politiques
  de Bordeaux en 1983, il choisit rapidement la voie de l’engagement public. En 1989,
  il embrassa la politique par l’élection. Il devint conseiller municipal de Mourenx
  et adjoint au maire communiste André Cazetien, avant de lui succéder en 1995. Le
  cœur à gauche, il était fier de porter l’écharpe tricolore de cette ville qu’il
  aimait tant. Il se consacra sans relâche à la reconversion industrielle du bassin
  gazier de Lacq et contribua à donner un nouveau souffle à son territoire. Homme
  de terrain et de conviction, il devint en 2002 député de la troisième circonscription
  des Pyrénées-Atlantiques, succédant à André Labarrère, grande figure du socialisme
  béarnais qui l’avait tant inspiré. Il fut réélu cinq fois, témoignage de la confiance
  que lui accordaient les habitants de ce territoire qu’il connaissait si bien. Au
  fil des années, il était devenu une figure familière de l’Assemblée nationale, un
  parlementaire dont la voix et le franc-parler résonnaient sur les bancs de l’hémicycle
  comme au perchoir, où il siégea par deux fois comme vice-président de l’Assemblée
  nationale. David Habib avait cet humour et cette sympathie qui ne l’empêchaient
  pas de porter les combats de son Béarn avec ardeur. Il défendait ses habitants –
  soucieux de l’industrie, de l’agriculture et du désenclavement des territoires.
  Ceux qui le connaissaient gardent à l’esprit sa liberté de jugement. Il portait
  un regard lucide et exigeant sur l’efficacité de nos politiques publiques et sur
  la nécessité de défendre les libertés. Aussi avait-il choisi de quitter le Parti
  socialiste, fidèle à son idée de la gauche, avant de rejoindre en 2024 le groupe
  Libertés, Indépendants, Outre-mer et Territoires, où il continua à s’engager avec
  la même détermination. Il manquera aux Pyrénées-Atlantiques, comme il manquera à
  notre Nation. Le Président de la République et son épouse saluent la mémoire de
  cet élu passionnément attaché à son Béarn et à la République. Ils adressent leurs
  condoléances émues à sa famille, à ses proches et à tous les habitants des territoires
  auxquels il consacra sa vie.
