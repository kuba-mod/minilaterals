title: Disparition de Raphaël Gérard.
text: 'Maire de Lonzac, ancien député de Charente-Maritime, Raphaël Gérard s’est éteint.
  Avec lui disparaît un homme de culture et d’engagement, qui consacra sa vie à défendre
  le patrimoine, son territoire et les solidarités. Il vit le jour en 1968 et grandit
  à Lorquin, en Moselle, élevé par un père mécanicien dans l’armée et une mère assistante
  de direction. Très tôt, il se passionna pour l’histoire de l’art, qui le conduisit
  sur les bancs de l’École du Louvre. Il y fit également ses premiers pas professionnels,
  au service de la scolarité. Profondément humaniste, par refus de la précarité et
  de l’exclusion, il s’engagea dans les années 1990 auprès de l’association Solidarité
  Enfants Sida. En 1996, il rejoignit la fonction publique territoriale et prit la
  responsabilité du musée Robert-Dubois-Corneau de Brunoy, dans l’Essonne. Il aimait
  l’art, alors il passa des années à le donner en partage. Cette passion le conduisit
  aussi à prendre la direction du musée de Montmartre, à Paris, puis à rejoindre en
  2006 le groupe LVMH, où il fut chargé des expositions patrimoniales internationales
  de Louis Vuitton. En 2012, il s’installa à Lonzac pour rejoindre la maison Jas Hennessy
  & Co. Il fit rayonner cette maison emblématique du cognac, mais ces années furent
  surtout celles de la rencontre avec un territoire auquel il resterait lié : la Charente-Maritime.
  Il voulait en porter la voix, et il le fit en se présentant aux élections législatives.
  Homme issu de la société civile, engagé associatif, il voulait dépasser les clivages
  et se reconnaissait dans le projet porté par La République en Marche. Élu en 2017,
  puis réélu en 2022, il agit résolument pour sa terre d’adoption à l’Assemblée nationale.
  Membre de la commission des Affaires culturelles et de l’Éducation, il défendit
  le patrimoine historique des petites communes et prit part, également, au suivi
  parlementaire de la restauration de Notre-Dame de Paris. Par esprit de justice et
  de solidarité, il cosigna un rapport contre les discriminations visant les personnes
  LGBT dans les outre-mer, participa aux débats sur la fin de vie et fit entendre
  une voix nécessaire sur le Covid long. En 2026, il avait été élu maire de Lonzac,
  cette commune de Charente-Maritime qu’il aimait tant et qu’il voulait continuer
  à servir. Le Président de la République et son épouse saluent la mémoire de cet
  infatigable engagé de la chose publique et adressent leurs condoléances émues à
  sa famille, à ses proches, aux habitants de Lonzac et de Charente-Maritime.'
