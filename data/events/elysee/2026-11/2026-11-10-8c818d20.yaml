title: Le groupe de pilotage franco-britannique sur le nucléaire fait avancer les
  travaux dans le cadre de la Déclaration de Northwood.
text: Des hauts responsables et des personnels militaires français et britanniques
  se sont réunis à Londres afin de faire progresser la coopération nucléaire issue
  de la Déclaration de Northwood. Le Groupe de pilotage nucléaire (GPN) – coprésidé
  par la présidence de la République française et le Cabinet Office britannique –
  a apprécié les progrès significatifs accomplis pour approfondir la coordination
  des forces de dissuasion indépendantes de la France et du Royaume-Uni. Le GPN a
  souligné l’intérêt que tout Etat envisageant de menacer les intérêts vitaux de la
  France ou du Royaume-Uni sache qu’il serait alors confronté à la puissance combinée
  de nos deux forces. Le GPN a salué la participation récente du Royaume-Uni à l’exercice
  nucléaire aéroporté français Rummy, signe de l’alignement opérationnel croissant
  entre nos deux nations. Ils ont également échangé sur l'initiative française de
  « dissuasion avancée ». Le GPN a souligné l’apport significatif de la « dissuasion
  avancée » à la sécurité de l’Europe et à la dissuasion euro-atlantique, ainsi que
  le fait qu’elle contribue à compliquer les calculs des adversaires potentiels, en
  complémentarité de l'OTAN. S'appuyant sur le succès du Traité Teutates de 2010 et
  sur la mise en place du centre d'essais conjoint franco-britannique EPURE, le GPN
  a également convenu d'étendre la coopération à divers domaines techniques et d’initier
  l’utilisation croisée d’installations d'essais souveraines. Le GPN a réaffirmé l'engagement
  commun de la France et du Royaume-Uni à préserver et à renforcer l'architecture
  internationale de non-prolifération, ainsi qu'à poursuivre un dialogue de fond avec
  les autres États dotés d'armes nucléaires, en particulier dans le cadre du cycle
  d'examen du Traité de non-prolifération et du processus P5, au sein duquel la France
  a pris la relève du Royaume-Uni en septembre 2026.
