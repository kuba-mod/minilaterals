title: Conseil européen extraordinaire à Bruxelles.
text: 'Le Président de la République s''est rendu à Bruxelles le 26 novembre 2026
  afin de participer au Conseil européen extraordinaire. Cette réunion a débuté par
  un sommet de la zone euro qui était consacré à la situation économique de l’Union
  européenne et aux déséquilibres macroéconomiques mondiaux. Les dirigeants ont également
  fait le point sur le dialogue de politique de change et sur les moyens de renforcer
  le rôle international de l’euro. Le Conseil européen était quant à lui consacré
  au prochain cadre financier pluriannuel (CFP) pour la période 2028-2034 . À la suite
  de la présentation, samedi dernier par le président du Conseil européen, d’une nouvelle
  boîte de négociation, une série de réunions thématiques a permis aux chefs d’État
  et de gouvernement de poursuivre les discussions sur les grands équilibres du futur
  budget européen : son volume global, l’organisation des dépenses, les ressources
  propres et la répartition des financements. Dans ce contexte, la France a continué
  de défendre un équilibre permettant de répondre à trois objectifs : La France va
  travailler avec ses partenaires pour aboutir rapidement à un accord avant la fin
  de l''année.'
