title: Disparition de Bertrand Méheut.
text: Bertrand Méheut était un homme de rigueur et de vision. Un grand dirigeant français
  qui consacra sa vie à l’entreprise et à la conquête de nouveaux horizons. Toute
  sa vie durant, il marqua de son empreinte le paysage économique et audiovisuel de
  notre pays. Il s’est éteint ce jour à l’âge de 75 ans. Il était breton. Rennais
  de naissance, Dinannais d’adolescence, cet étudiant brillant intégra le corps des
  Mines de Nancy. Il débuta sa carrière en faisant ses armes dans les télécommunications
  puis dans l’industrie chez Rhône-Poulenc et Aventis. Il y acquit une culture profonde
  du monde de l’entreprise, nourrie par son regard d’ingénieur qui voulait transformer
  les organisations. En 2002, il prit les rênes de Canal + en pleine tempête et alors
  que le doute dominait. En capitaine d’industrie, il redressa la barre treize années
  durant en transformant en profondeur la chaine cryptée en lui redonnant l’ambition
  de faire vivre ensemble ce bouillon de culture, ce rendez-vous télévisé fait d’irrévérence
  et de panache auquel les téléspectateurs étaient si attachés. Sous son impulsion,
  Canal + renoua avec l’ambition de conquérir le cœur du public français, renforça
  son rayonnement international et affirma sa place si singulière dans la création
  et le cinéma français de Cannes au plateau du Grand Journal. Après les années Canal+,
  il poursuivit son action au service des entreprises françaises, à la tête du PMU
  et au sein de conseils d’administration. Jusqu’au bout, il conserva ce goût de l’action
  au service de l’intérêt commun. Ainsi, était-il engagé dans la préparation des Jeux
  Olympiques et paralympiques que notre pays accueillera dans les Alpes françaises
  en 2030, comme pour raviver la flamme qui l’animait toujours. Il nous laisse le
  souvenir d’un homme exigeant, attentif aux autres, et qui donna leur chance à celles
  et ceux dont il repéra le talent. Il était un homme de transmission. Le Président
  de la République et son épouse saluent la mémoire d’un capitaine d’industrie qui
  servit les intérêts de la France. Ils adressent à sa famille, à ses proches et à
  tous ceux qui eurent le privilège de travailler avec lui, leurs condoléances les
  plus émues.
