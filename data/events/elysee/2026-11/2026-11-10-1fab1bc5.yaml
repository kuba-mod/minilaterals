title: Remise du rapport du Conseil consultatif pour l'égalité de genre.
text: 'En marge du Forum de Paris pour la Paix, les expertes et experts indépendants
  du Conseil consultatif pour l''égalité de genre (Gender Equality Advisory Council
  – GEAC) ont remis au Président leur rapport intitulé « Repenser les enjeux démographiques
  sous un angle féministe », dans le cadre de la Présidence française du G7, ce mardi
  10 novembre 2026. A l’issue de plusieurs mois de travail, le rapport du GEAC propose
  i) une analyse des enjeux démographiques fondée sur les preuves ; et ii) des recommandations
  de politiques publiques concrètes, fondées sur l’égalité de genre, l’autonomie corporelle
  et la liberté de choix . Il est fondé sur un message clef : l’égalité de genre n’est
  pas un paramètre d’ajustement face aux évolutions démographiques, elle est au fondement
  même de la résilience démographique . Le rapport s’articule autour de trois idées
  fortes et formule 12 recommandations opérationnelles, adressées aux chefs d’Etat
  et de gouvernement du G7, pour : Le renouvellement du Conseil consultatif pour l’égalité
  de genre est un engagement fort de la présidence française du G7 Le GEAC réunit
  depuis 2018 des expertes et experts indépendants de haut niveau chargés de conseiller
  les chefs d''État et de gouvernement du G7 en matière d''égalité de genre. Il est
  composé à la fois de membres désignés par les pays du G7 et de membres désignés
  par la Présidence tournante du G7. Dans le cadre de la PFG7, la Présidence de la
  République a souhaité renouveler le mandat du GEAC afin qu’il puisse livrer une
  analyse des défis économiques, sociaux et politiques posés par les évolutions démographiques
  , dans un contexte international marqué par la remise en cause des acquis en matière
  d’égalité de genre et par l’instrumentalisation des concepts de natalité et de famille
  dans le débat public. Cela traduit la volonté de la France de réaffirmer un engagement
  indéfectible en faveur de la défense les droits des femmes et des filles. C’est
  dans ce contexte d’offensive globale contre les droits des femmes que la diplomatie
  féministe est née et que la France la porte aujourd’hui aux avant-postes. La diplomatie
  féministe de la France est ainsi un axe structurant de notre politique étrangère.
  Le 8 mars 2024, la France est devenue le premier pays au monde à reconnaître dans
  sa Constitution la liberté de recourir à l''avortement. La France a été le quatrième
  pays du monde à adopter une diplomatie féministe en 2019 et continue de porter la
  plus haute ambition dans les instances internationales dédiées. Avec sa Stratégie
  internationale pour une diplomatie féministe (2025-2030), la France réaffirme son
  ambition et définit une orientation claire pour les cinq prochaines années. Cet
  engagement prolonge l’action menée en France depuis 2017, où l’égalité entre les
  femmes et les hommes a été érigée par le Président de la République, à deux reprises,
  en grande cause du quinquennat. Les moyens budgétaires consacrés à cette politique
  ont plus que triplé entre 2020 et 2025. Ainsi, la protection des victimes de violences
  a été renforcée avec le déploiement des téléphones « grave danger », des bracelets
  « anti-rapprochement » et la création d’une aide universelle d’urgence. L’Index
  de l’égalité professionnelle et la loi Rixain ont renforcé les obligations des entreprises
  en matière d’égalité salariale et d’accès des femmes aux responsabilités. Enfin,
  le doublement du congé de paternité en 2021 contribue à mieux partager les responsabilités
  parentales et à faciliter la conciliation entre vie familiale et vie professionnelle.
  Le travail du GEAC constitue l’un des principaux livrables de la PFG7 sur les enjeux
  de genre , avec le tableau de bord du G7 sur les écarts de genre développé par l’OCDE
  à la demande du Groupe de travail du G7 sur l’égalité de genre et l’autonomisation
  des femmes (Gender Equality and Women’s Empowerment Working Group, GEWE). Lancé
  en 2022 pour suivre notamment les recommandations du GEAC 2019 sous Présidence française,
  ce tableau de bord annuel donne un aperçu des politiques et des résultats en matière
  d''égalité entre les genres dans les pays de l''OCDE dans cinq domaines d’action.
  Rapport « Repenser les enjeux démographiques sous un angle féministe ».'
