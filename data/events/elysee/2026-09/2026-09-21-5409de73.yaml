  a traumatisé Saint-Pierre-et-Miquelon. Vous n’étiez pas aux responsabilités. Je
  n’étais pas aux responsabilités. Le cours du monde contemporain et votre présence
  aujourd’hui nous imposent d’en ouvrir une nouvelle. C’est celle que nous allons
  écrire. C’est celle aussi que nous voulons écrire à travers les grands projets d’avenir.
  Par les connexions et les câbles sous-marins, pour lesquels le partenariat entre
  la France et le Canada a du sens, ici en particulier. En matière de spatiale, où
  le partenariat est essentiel et où nous voulons aussi, évidemment, le déployer ici.
  Et en matière de climat, qui sera un axe fort de notre partenariat. En effet, dans
  l’Atlantique Nord, les bouleversements sont déjà là. Les océans se réchauffent,
  les écosystèmes évoluent, les activités de pêche et les populations sont contraintes
  de s’adapter. Ces changements sont visibles. C’est pourquoi aussi nous renforcerons
  la coopération entre nos services météorologiques, pour mieux anticiper les événements
  extrêmes et prévenir les risques. Nous approfondirons également notre action en
  matière de systèmes d’alerte précoce, dans le cadre de l’initiative CREWS. Et enfin,
  nous annonçons aujourd’hui la création du Forum de recherche polaire Canada-France,
  qui sera organisé alternativement dans nos deux pays et dont la première édition
  se tiendra ici, à Saint-Pierre-et-Miquelon. Le Premier ministre et moi-même avons
  également parlé de nos économies, de nos liens bilatéraux, de tout ce en quoi nous
  croyons et de tout ce que nous voulons faire avancer : en matière de défense, de
  ressources critiques, de minerais critiques, de terres rares, d’énergie, de quantique,
  d’intelligence artificielle et de technologies maritimes. Et à nous de transformer
  tout cela en projets, en investissements et en emplois. Je me félicite, à cet égard,
  du contrat signé vendredi entre Aldoria et le ministère canadien des Travaux publics
  et des Services gouvernementaux, pour la fourniture de données de surveillance de
  l’espace au bénéfice de la division spatiale des Forces armées canadiennes. Je salue
  également le protocole d’entente adopté à l’occasion de cette visite entre CCI France
  et la Chambre de commerce du Canada. Et puis, je l’évoquais, nous devons aussi œuvrer
  ensemble pour sécuriser nos approvisionnements énergétiques et maîtriser les prix
  du carburant, sujet ô combien sensible aujourd’hui pour la France. C’est la situation
  au Proche et au Moyen-Orient, évidemment, qui crée cette tension. Les projets canadiens
  de gaz naturel liquéfié peuvent contribuer — et sont importants pour notre Europe
  — et contribueront à ouvrir de nouvelles perspectives entre nos deux pays. Nous
  avons, là aussi, entamé une discussion bilatérale avec Monsieur le Premier ministre
  sur des projets très concrets. Je veux le remercier d’avoir si vite répondu à notre
  demande concernant les produits les plus sensibles, afin de pouvoir bâtir des solutions
  ensemble, le Canada étant un grand pays producteur. Nous continuerons cette discussion
  dans le cadre bilatéral, ainsi que dans le cadre d’un G7 consacré au sujet énergétique,
  qui sera très prochainement organisé. Cher Mark, à Saint-Pierre-et-Miquelon, la
  mer est une réalité quotidienne pour celles et ceux qui font vivre ce territoire.
  Elle est aussi ce qui nous relie. Elle est aussi ce qui fait du Canada non seulement
  cette puissance qui veut aujourd’hui se rapprocher de l’Europe, mais ce pays si
  voisin de nous, Français. C’est pourquoi vous avez réparé, au fond, une aberration
  de l’histoire : qu’il n’y ait jamais eu auparavant de Premier ministre canadien
  foulant ce sol. C’est une immense fierté pour nous d’être là. C’est une immense
  fierté que les projets concrets que nous avons décidé d’accompagner et, surtout,
  d’avoir décidé ensemble d’ouvrir ce nouveau chapitre, ce nouvel élan pour la relation
  bilatérale et pour Saint-Pierre-et-Miquelon. Votre présence ici nous engage et nous
  poursuivrons. À l’issue de cette visite de trois jours, le chef de l''État a répondu aux
  questions de Saint-Pierre-et Miquelon la 1re . Il est revenu sur les attentes des
  habitants et a détaillé ses engagements pour l’archipel.'
