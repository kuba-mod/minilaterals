date: '2026-09-21'
type: press_release
source_name: elysee
title: Déplacement à Saint-Pierre et Miquelon.
text: 'Le Président de la République s''est rendu à Saint-Pierre-et-Miquelon du samedi
  19 au lundi 21 septembre 2026. Le chef de l’État est allé à la rencontre de la population,
  des élus et des acteurs du territoire pour aborder les perspectives de développement
  de l’archipel , ainsi que les moyens de soutenir l’activité économique et de renforcer
  son attractivité . 26 septembre 2026 - Seul le prononcé fait foi Voilà, très heureux
  d’arriver, de rejoindre la ministre qui est là depuis quelques jours, et de pouvoir
  être à vos côtés à Saint-Pierre-et-Miquelon pour ce déplacement qui va me permettre
  d’abord de travailler avec la ministre, Monsieur le préfet et nos élus qui sont
  là, pour un peu faire le tour des enjeux. Et puis, on aura l’occasion, tout au long
  de cette visite, d’abord de parler des sujets économiques, à la fois des sujets
  d’aménagement, de développement économique, de diversification, de pêche, d’avoir
  aussi plusieurs entreprises qui vont confirmer ici des investissements qui sont
  importants et qui montrent d’ailleurs le caractère stratégique de Saint-Pierre-et-Miquelon.
  Des câbles au spatial, c’est très clairement un sujet d’avenir. Pour la première
  fois de notre histoire, on aura la visite officielle d’un Premier ministre canadien
  demain midi. Et c’est un moment important aussi qu’on a conçu avec le Premier ministre
  Carney, qui va ainsi d’abord nous permettre d’améliorer les perspectives de coopération
  entre le Canada et Saint-Pierre-et-Miquelon. Et puis, plus largement, travailler
  et consolider nos relations économiques bilatérales, comme nos relations aussi de
  défense, et donner un contenu encore plus fort à cette autonomie stratégique que
  nous partageons. Vous savez combien le Canada se rapproche de l’Europe. Eh bien,
  si je puis dire, cette alliance prend un tour boréal en étant ici sur ce sol et
  en pouvant la concrétiser. Puis, j’aurai évidemment l’occasion de revenir sur plusieurs
  sujets aussi d’adaptation au changement climatique. On le fera dès demain matin.
  Et puis, évidemment, de parler de notre stratégie polaire, car, de la recherche
  à notre stratégie militaire, très clairement, nous avons à Saint-Pierre-et-Miquelon
  une stratégie ici qui se consolide, en lien très étroit d’ailleurs avec le Canada
  et avec le Danemark. Donc, très heureux d’arriver ici, de pouvoir passer ces deux
  jours de travail et de recevoir pour la première fois un Premier ministre canadien.
  Est-ce que vous allez répondre à Donald Trump, qui a récemment dit sur une carte
  que Saint-Pierre-et-Miquelon était un territoire américain ? C’est une évidence
  pour nous que c’est un territoire français, un territoire attaché à la France et
  fier d’être français, comme nous le sommes, et un territoire libéré par la France
  libre. Et n’oublions pas ce jour de Noël. Donc, nous y sommes attachés. Il n’y a
  pas de débat, il n’y a pas de discussion. Pourquoi attendre maintenant pour le réaffirmer ?
  Nous n’avons jamais attendu parce que, vous savez, la question ne s’est jamais posée.
  Donc, on ne va pas l’affirmer tous les matins parce que des gens ont des idées étranges
  ou disent des choses étranges. C’est une évidence. Le fait d’accueillir le Premier
  ministre canadien, c’est aussi un message qui est adressé à Donald Trump ? Non,
  il ne faut pas être aussi obsédé que ça par adresser des messages. C’est d’abord
  une affirmation pour nous-mêmes. Et donc, c’est très important. Je viens dans cette
  partie du monde où nous avons des amis proches, dont le Canada. Je lui ai fait cette
  invitation et le Premier ministre y a répondu. Et je trouve que c’est un geste d’amitié
  très fort, quelques jours après qu’il a affirmé sa volonté de travailler davantage
  avec l’Union européenne. Et donc, ça lui donne justement un tour extrêmement concret.
  Donc nous, nous sommes ici. La France est présente grâce à Saint-Pierre-et-Miquelon,
  par Saint-Pierre-et-Miquelon, ici au cœur des enjeux du globe dans cette région.
  Et ceci nous lie aussi avec le Canada. Et donc, ce sera une manière de parler d’avenir
  ensemble et de consolider nos relations dans beaucoup de domaines. Saint-Pierre-et-Miquelon,
  votre dernier quart d’heure M. Macron ? Le dernier quart d’heure, ce sera le dernier
  quart d’heure. On n’y est pas encore. Est-ce que vous savez l’accord prétendument
  trouvé par Donald Trump avec le Groenland. Quelle est votre réaction par rapport
  à cela ? On a eu plusieurs échanges avec la Première ministre du Danemark sur ce
  sujet. Elle m’avait prévenu de la finalisation de ces discussions il y a quelques
  semaines. Il y a eu une communication américaine, une communication aussi du gouvernement
  danois. Tout ça permet d’apaiser les choses, de réaffirmer la souveraineté danoise,
  de réaffirmer les choses conformément au droit international, de renforcer des coopérations
  qui peuvent être utiles aux Groenlandais. Donc, je m’en félicite pour eux. J’y étais
  il y a quelques mois et c’est une très bonne chose. Et puis nous, on va continuer
  aussi nos coopérations dans le cadre de l’OTAN, par des exercices conjoints, pour
  justement renforcer et consolider la souveraineté danoise au Groenland et aussi
  la sécurité de ce territoire. À travers l’Union européenne, de consolider nos stratégies
  économiques, en particulier sur les terres rares et minerais critiques, comme elles
  ont été relancées, et puis nos relations bilatérales, qui sont à la fois stratégiques
  et économiques. Et je parlais à l’instant de notre stratégie polaire. Pour toute
  la sécurité de cette région, on a des exercices conjoints. Et donc, France, Danemark,
  Canada, d’ailleurs États-Unis dans ces cadres-là, on coopère pour des opérations
  justement de défense très stratégiques. Et c’est là aussi où Saint-Pierre-et-Miquelon
  est si important. Dans votre conférence de presse à Paris, il y a quelques heures,
  vous disiez que vous alliez rencontrer le Premier ministre canadien aussi pour diversifier
  les approvisionnements de ressources en énergie. C’est quoi l’idée concrètement
  avec le Canada sur ce thème précis de l’énergie, du pétrole et gaz ? Le Canada est
  un pays qui a beaucoup de ressources, minerais critiques et terres rares. Donc ça,
  c’est des choses qu’on veut contractualiser avec la France comme l’Union européenne,
  et qui est aussi, comme vous le savez, un grand producteur d’hydrocarbures fossiles.
  Et qui produit du gaz, qui d’ailleurs, par sa production, par aussi ce qu’ils font
  du côté du raffinage, permet d’équilibrer le marché mondial. Et donc, il y a eu
  des accords de... Pardon de rentrer là-dedans, mais ce qu’on appelle des accords
  de swap, d’échange, qui ont pu être faits par plusieurs pays en Europe. Et donc
  nous, ce qu’on veut faire, c’est regarder comment... Pas regarder, mais consolider
  et conclure des accords pour très clairement avoir plus de gaz liquéfié qui puisse
  aller vers la façade atlantique. Parce qu’aujourd’hui, il y en a beaucoup, mais
  qui vont vers la façade pacifique. Donc leur permettre une diversification. Mais
  ce qu’on fait, nous, ce qu’on a fait ces derniers jours et ces dernières semaines,
  c’est très concret. C’est-à-dire qu’on se bat pour sécuriser, par des accords d’approvisionnement,
  dans les mois qui viennent, parce qu’on veut se préparer à tout et qu’on veut protéger
  les Françaises et les Français, eh bien, se préparer pour, en gaz, en diesel, en
  jet fuel, être sûr de ne pas manquer. Et donc, c’est ce que je vais discuter demain
  midi avec le Premier ministre Mark Carney. C’est ce que j’ai discuté il y a quelques
  jours, on a d’ailleurs signé un accord en ce sens avec le Premier ministre d’Irak.
  C’est ce qu’on a discuté et signé aussi avec plusieurs pays du Golfe. Et ça a été
  tout le travail des dernières semaines qu’on a patiemment conçu pour justement sécuriser
  ce qu’on appelle nos approvisionnements. Et on va continuer de le faire, et c’est
  aussi tout l’objet de ce qu’on fait dans la région d’Ormuz. Vous parlez potentiellement
  de risque de pénuries ? Il y a évidemment aujourd’hui un marché mondial qui est
  très sous tension. Et vous le voyez bien, il est sous tension parce qu’Ormuz, c’est
  à peu près 20 % des productions et des sorties. Donc, on a réussi ces derniers mois
  à trouver des voies de passage, à réduire la tension, à trouver des voies de contournement
  avec ce pipeline qui va d’est en ouest en Arabie saoudite, qui a été frappé ces
  derniers jours. Et donc, on a aujourd’hui un niveau très bas et moins de la moitié
  de ce qui est produit qui sort. L’hiver arrive et il y a des pays qui sont en train
  d’acheter beaucoup plus, là où, au printemps dernier, ces mêmes pays avaient réduit
  leur consommation pour s’adapter. Donc, il faut être très vigilant et nous, nous
  ne voulons pas manquer. Donc, on a reconstitué nos stocks de gaz, on sécurise nos
  approvisionnements et on sécurise nos approvisionnements. Par exemple, en diesel,
  on consomme à peu près 600 000 barils par jour, on en importe la moitié, on sécurise
  cela. Et donc, on n’a pas à craindre ou à faire peur aux gens. On a à leur dire
  la vérité sur l’instabilité géopolitique et ce qu’elle crée dans notre pays, et
  on a à s’y préparer. C’est exactement ce que fait la France et ce qu’elle a accéléré
  ces dernières semaines. Depuis 1994, la France et le Canada cogèrent les ressources
  halieutiques de leur zone économique exclusive, respectée jusqu’aux 200 milles nautiques.
  C’est un dossier que vous connaissez. Est-ce que vous êtes prêt à étendre cette
  gestion commune à d’autres espèces présentes sur le plateau continental, par exemple ?
  On va regarder ça et en discuter ensemble. On y est prêt. Je souhaite surtout qu’on
  puisse développer beaucoup plus fortement nos activités de pêche et de transformation,
  parce que c’est ce qui permettra de créer de la richesse et de créer des emplois.
  Et on va là-dessus y travailler. On est prêt à investir et à co-investir aussi avec
  les Canadiens. Je pense que l’objectif aussi de cette visite et ce qu’elle marque,
  c’est d’ouvrir une nouvelle page. Tout le monde sait que 1992 a été une date très
  dure et a été vécue comme un moment... Enfin, a été un moment très dur pour Saint-Pierre-et-Miquelon,
  pour la pêche. Il y a eu beaucoup d’emplois qui ont disparu pendant cette période.
  Il y a eu ensuite toute une phase nouvelle qui a égrené les dernières décennies.
  Je pense qu’aujourd’hui, c’est une page nouvelle qui s’ouvre et notre volonté d’investir
  dans ces secteurs, de diversifier aussi l’économie et de réengager différemment
  avec le Canada doit nous y conduire. Donc, ça fait partie des choses. Monsieur le
  Président, il faut se réjouir de l’accord annoncé par Trump sur le Groenland ? J’ai
  pas dit se réjouir. J’ai dit je l’ai constaté, ça apaise. S’agit-il d’une reculade
  de la part du président américain, qui, il y a quelque temps, parlait de le saisir
  par la force, le Groenland. Et comment expliquer cet apaisement ? Je ne fais pas
  de commentaire. C’est vous qui qualifiez et pas moi. Moi, je constate simplement
  que la souveraineté danoise est respectée, que le droit international est respecté
  et que c’est ce que nous demandions. Donc, c’est une bonne chose et c’est ce que,
  à la fois, les Danois et les Groenlandais demandaient. Donc, c’est très bien. Donc,
  à cet égard, on peut tous être contents, on avance. Et je pense qu’il y a suffisamment
  de sujets aujourd’hui qui perturbent nos vies, la guerre d’agression russe en Ukraine
  et ses conséquences, à la fois d’ailleurs sur l’énergie et son prix pour nous et
  sur notre sécurité, la guerre au Proche et Moyen-Orient avec ses conséquences sur
  l’énergie chère qui touche tant de nos compatriotes, pour ne pas créer d’autres
  sujets. Donc, je pense que tout ce qui va vers l’apaisement est une bonne chose.
  En un mot, Monsieur le Président, dans la suite de la réunion avec les chefs de
  partis, les commentaires qui ont pointé du doigt le fait que Marine Le Pen, par
  exemple, n’était pas présente, comme Jean-Luc Mélanchon, votre réaction à l’absence
  de ces deux candidats à la présidentielle ? Je n’ai pas de commentaire à faire.
  C’est factuel, mais après, leur parti était représenté et donc j’ai pu les informer
  et j’ai informé les membres de leur parti. Je ne vais pas après commenter. J’ai
  dit des choses importantes, j’ai surtout permis aux responsables qui étaient là
  d’exposer les choses et de répondre aux questions des forces politiques. Je pense
  que c’est nécessaire et je pense que c’est important que tout le monde dans notre
  pays sache quelle est la réalité, à la fois de la menace, mais aussi la complexité
  des crises géopolitiques qui viennent peser sur nos vies, qu’il s’agisse de la sécurité
  ou qu’il s’agisse du coût de la vie et en particulier du prix des carburants. Voilà.
  Est-ce que vous avez parlé au président Trump avant de venir ? On a pu échanger
  par messagerie, mais je lui reparle demain. Est-ce que vous avez le sentiment qu’il
  y a un apaisement aussi de sa part à l’égard de Monsieur Carney ? Il était furieux
  de cet accord d’association... Je ne sais pas ce qu’il en est et j’ai toujours tout
  fait pour que les choses soient le plus apaisées possible en général. Ça a été le
  sens de la présidence française du G7, qui a permis d’ailleurs d’avoir des textes
  ambitieux qui ont été signés, y compris endossé par les États-Unis d’Amérique et
  le président Trump, du Proche-Orient à l’Ukraine pour la première fois, ce qui était
  une bonne chose, ou sur les minerais critiques. Et donc, moi, je continuerai à œuvrer
  pour qu’on fasse œuvre utile et pour que notre diplomatie permette d’apaiser les
  choses et d’avoir des résultats concrets pour nos compatriotes. C’est ça qui m’importe.
  Mais quel message pensez-vous que ça envoie au Canada, ici, à Monsieur Trump, que
  vous accueillez le Premier ministre canadien, Monsieur Carney, après son discours
  à Strasbourg ? Ça envoie quand même un message fort. Ça envoie un message fort d’amitié,
  de volonté d’aller de l’avant et de conviction que les pays que nous sommes, qui,
  au fond, croyons dans la démocratie et l’État de droit, croyons dans le respect
  du droit international, dans le commerce libre et équitable, dans la science pour
  fonder nos décisions, ce sont des pays qui veulent avancer, faire des choses ensemble,
  dans le respect. Et donc nous, nous respectons le Canada, son indépendance, sa volonté
  d’être autonome. Le Canada respecte la France et la même chose pour elle. Et donc,
  ça permet de faire des choses ensemble. C’est très bien. Donc, c’est le message,
  voilà, de respect, d’estime et d’ambition commune. Pourquoi ne pas avoir invité
  Monsieur Trump ? C’est quand même un voisin ici aussi. Alors, c’est un voisin, mais
  c’est un peu plus loin. Mais donc, l’invitation est toujours faite. Il était il
  y a quelques semaines avec nous à Évian. Non, on fait déjà une première avec le
  Premier ministre Carney. On verra après pour un président américain. Je ne sais
  pas encore parce que je crois que sa présence à New York est écourtée par d’autres
  rendez-vous à Washington. Mais en tout cas, j’y vais principalement pour, d’abord,
  évidemment, m’exprimer à la tribune des Nations unies. Ensuite, pour pouvoir avoir
  l’entretien que je fais à chaque fois avec le secrétaire général sur l’ensemble
  des crises. J’aurai une longue session de travail avec le président Zelensky. J’aurai
  l’occasion de voir plusieurs dirigeants du continent africain, latino-américain
  ou du Proche et Moyen-Orient. Et j’aurai deux séances en particulier qui sont importantes
  pour nous. Enfin, trois séances. L’une pour poursuivre le travail que nous avons
  fait sur les océans, et c’est important ici au combien. La France a fait avancer
  cet agenda avec la ratification de l’accord qui protège la haute mer. Et donc, on
  va réunir en particulier beaucoup d’États insulaires du Pacifique autour de ce sujet
  pour continuer la mobilisation et préparer la première COP sur les océans de janvier
  prochain. La deuxième chose, c’est qu’on réunira aux côtés d’ailleurs de Mark Carney
  et de plusieurs autres dirigeants tous ceux qui constituent cette alliance pour
  protéger nos enfants face aux réseaux sociaux et à l’intelligence artificielle.
  Et donc, cette initiative que la France a portée, vraie victoire parce qu’elle est
  maintenant européanisée avec l’acte qui a été annoncé par la présidente de la Commission
  il y a quelques jours, on veut le consolider au niveau international. Et puis, la
  troisième chose, c’est que nous réunirons tous les États affinitaires sur la reconnaissance
  des deux États pour justement consolider cet agenda un an après la déclaration de
  New York et ce moment. 26 septembre 2026 - Seul le prononcé fait foi Voilà, très
