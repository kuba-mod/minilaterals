title: Sommet international sur l'Espace à Paris.
text: 'Le Président de la République s''est rendu au Sommet international sur l’Espace,
  qui se tient au Grand Palais les 9 et 10 septembre 2026. Annoncé par le chef de
  l’État en octobre 2025 lors de la présentation de la stratégie spatiale nationale,
  ce sommet réunit à Paris des chefs d’État et de gouvernement, des ministres, des
  astronautes, des agences spatiales nationales et internationales, ainsi que les
  grands acteurs économiques du spatial et les startups du New Space. 90 pays et organisations
  internationales sont représentés , dont une soixantaine au niveau chefs d’État et
  de gouvernement ou ministres. Près de 1 100 entreprises du secteur spatial sont
  également présentes au Grand Palais, témoignant de la mobilisation exceptionnelle
  de l’écosystème spatial mondial autour de ce rendez-vous. Le Sommet aborde l''ensemble
  des enjeux liés au développement et à l''innovation du secteur spatial autour de
  trois thématiques clefs : Le 9 septembre, le Président Emmanuel Macron a participé
  à la conclusion d''une table ronde avec des astronautes . Annonces du Sommet international
  sur l''Espace.'
