date: '2026-09-25'
type: press_release
source_name: elysee
title: Voyage apostolique du Pape Léon XIV en France.
text: Le Président de la République a accueilli Sa Sainteté le Pape Léon XIV au Palais
  de l'Élysée ce vendredi 25 septembre 2026, dans le cadre de son voyage apostolique
  en France. Cette visite fait suite à la première rencontre entre le chef de l’État
  et le Pape Léon XIV au Vatican en avril dernier. Elle s'inscrit dans le cadre des
  relations traditionnelles entre la France et le Saint-Siège, et témoigne de la profondeur
  d'un dialogue fondé sur des valeurs et des engagements partagés. Le Président de
  la République et Madame Brigitte Macron ont ensuite accueilli le Saint-Père au Palais
  de l'Élysée. Les échanges entre le Président de la République et le Saint-Père ont
  permis d’aborder les aspects clés de la relation bilatérale, ainsi que les principaux
  défis globaux qui mobilisent conjointement la France et le Saint-Siège, au premier
  rang desquels le climat et l'intelligence artificielle . À cette occasion ont également
  été abordés les grands enjeux internationaux , la guerre en Ukraine, la paix et
  la stabilité au Proche-Orient, les partenariats avec l’Afrique, sur la base d’une
  volonté conjointe d’œuvrer pour la paix et le dialogue. 25 septembre 2026 - Seul
  le prononcé fait foi Très Saint-Père, Mesdames et Messieurs en vos grades et qualités,
  C'est pour la République française un grand honneur et aussi une grande joie que
  de vous accueillir aujourd'hui sur notre sol. Un grand honneur et une grande joie
  en ce que, confrontés souvent au spectacle des misères du monde, beaucoup de nos
  compatriotes ressentent, avec votre visite en France, une espérance. Oui, comme
  il est dit dans l'Ecclésiaste, il ne faut pas s'attrister comme ceux qui n'ont pas
  d'espérance, et c'est un sentiment, je le sais, que vous partagez. Vous voici, 18
  mois après le commencement de votre pontificat. Et vous voici pour un temps long
  que vous nous offrez et qui nous touche. C'est ici que débute ce chemin de foi,
  si j'ose dire, qui va vous mener du cœur de Paris à Notre-Dame, de l'Elysée à l'UNESCO,
  de la place de la Concorde à Saint-Denis, du Stade de France à la Maison Bakhita,
  de Lourdes, ville de Bernadette Soubirous, à Metz, carrefour des mémoires chrétiennes
  de notre Europe. Autant d'étapes qui disent votre lien personnel avec notre pays.
  Très Saint-Père, nous sommes fiers de vos racines normandes. Et vous verrez que
  nous avons même trouvé des racines béarnaises et bigourdanes. Autant d'étapes comme
  autant d'épisodes qui racontent aussi cette histoire si particulière qui lie le
  christianisme à notre pays. Histoire deux fois millénaire, dont témoignent ces paysages
  de France, parsemés de cathédrales, basiliques, églises, monuments venus du fond
  des âges, inestimables dons de ceux qui nous ont précédés et qui se faisaient de
  notre pays une certaine idée. Il fut long. Ce temps où la religion chrétienne, ambitieuse
  d'être l'architecte de l'universel, guidait nos ancêtres à tailler la pierre, afin
  de laisser inscrite dans la chaîne des temps la trace visible de leur idéal. Croire,
  c'est créer. Et c'est au nom de cet héritage que nous avons œuvré, après le terrible
  incendie de Notre-Dame de Paris, pour qu'elle puisse être rebâtie en cinq ans et
  rendue non seulement aux catholiques, mais à tous les Français et au-delà encore
  au monde entier, et tant de talents, d'artisans, d'apprentis, de bénévoles, s'y
  sont donnés avec cette espérance chevillée au cœur. Car Notre-Dame est une part
  de nous, un emblème de cette volonté si française d'offrir au monde toutes les beautés
  que peut engendrer l'esprit humain dès lors qu'il est mu par un idéal de fraternité
  universelle. Oui, cette histoire deux fois millénaire a créé un lien singulier entre
  la France et l'Église catholique. Et lorsque la République décida, il y a un peu
  plus de 120 ans, de la séparation entre l'Église et l'État, elle donna forme à une
  laïcité française qui n'est nullement la négation de la religion. La République
  se fait un devoir de permettre à chacune et à chacun en conscience de penser et
  d'exprimer son point de vue dans toutes les sphères de son existence, de croire
  ou de ne pas croire, dans l'intimité comme dans la sphère publique, à condition
  d'en respecter les lois. C'est dans ce cadre, très Saint-Père, que vous solliciterez
  la conscience de tous les Français qui s'associent en pensée et en action à ce que
  vous représentez, à eux, à tous ceux qui, en France comme ailleurs, sont attentifs
  à ce que vous avez à dire au monde, et je m'en réjouis. La République veille aussi.
  Depuis 15 ans, les actes commis à l'encontre de personnes ou de biens en raison
  de leur religion ont malheureusement connu une recrudescence. Et ces insupportables
  démonstrations d'intolérance frappent la religion chrétienne au cœur. Les communautés
  juives et musulmanes en sont aussi victimes. Et c'est un combat essentiel que nous
  menons et mènerons pour protéger les lieux de culte, continuer de former les esprits
  à la tolérance, en même temps que nous encourageons le dialogue interreligieux si
  vivant dans notre pays. La quête de la paix sur tous les fronts est une nécessité
  existentielle. Et il n'est pas un catholique qui ne puisse être sensible à ce combat
  pour le bien commun. Et j'ajouterai, pas un juif, pas un musulman, pas un protestant,
  ni un orthodoxe ou un bouddhiste. Il n'est personne en France, croyant ou non, qui
  puisse refuser de faire sienne cette quête. La paix est aussi cet horizon pour lequel
  nous œuvrons ensemble. Vous avez placé les premiers mois de votre pontificat sous
  le signe d'une paix désarmée et désarmante. Exigence qui prend une force particulière
  alors que la guerre meurtrit notre continent et que partout tensions et conflits
  ressurgissent. Exigence qui rappelle aussi que la paix est davantage que le silence
  des armes et qu'elle suppose justice, sécurité, respect des droits de l'homme, souveraineté
  des nations, et droit des peuples à disposer d'eux-mêmes. Et plus fondamentalement
  la capacité à reconnaître l'autre pour ce qu'il entend être. La France se tient
  du côté de la paix, du multilatéralisme d'action, du respect du droit international
  et de la charte des Nations Unies. Et nous nous y tenons partout, sans double standard,
  avec cohérence et constance, car une vie vaut une vie et tous les peuples sont à
  défendre. Ce combat pour la paix est inséparable de celui pour la dignité humaine
  et la lutte contre les injustices. Partout, ce sont toujours les plus fragiles qui
  paient le prix des crises et des conflits, qui contraignent tant de femmes et d'hommes
  à fuir leur pays. A la maison Bakhita, vous rencontrerez celles et ceux qui accueillent
  les exilés, les plus pauvres, les plus isolés. Là encore, la République et l'Église
  croisent souvent les mêmes visages. Le visage de ceux qu'il nous faut voir en face,
  le visage de ceux dont la voix peine à porter, de ceux qui nous rappellent l'exigence
  de fraternité, celle-là même qui fait de l'autre son frère en République, cette
  attention que nous devons aux plus fragiles. Et je veux saluer ici l'engagement
  quotidien de tant de Français, de bénévoles, d'associations et notamment chrétiennes
  qui servent quotidiennement leurs prochains. Leur dévouement, leur solidarité disent
  un formidable élan d'espoir. Comme je veux saluer l'engagement de tous ceux qui
  contribuent à l'éducation de nos enfants, qu'il s'agisse de l'enseignement public
  ou de l'enseignement privé dans notre pays. Tous sont aussi au service de la défense
  du bien commun que nous partageons par-delà les frontières, notre planète et le
  vivant. C'est pour cela que la France a porté l'Accord de Paris il y a 11 ans et
  s'est battue pour obtenir l'Accord sur les océans l'année dernière. C'est pour cela
  aussi que nous continuons de défendre le pacte de Paris pour les peuples et la planète,
  afin que nul pays n'ait à retarder sa transition faute de moyens, ni à choisir entre
  son développement et la préservation de la planète et du vivant. Climat et biodiversité
  irriguent les choix de notre siècle. L'Église catholique, avec le pape François,
  puis avec vous-même, l'a toujours rappelé sans ambiguïté. Nous vous en rendons grâce.
  Ce n'est pas seulement affaire de technologie ou d'ajustement. Cela révèle notre
  manière d'habiter le monde, d'y produire, de consommer, de concevoir ensemble la
  voie du progrès humain. Telle est notre responsabilité commune. Et elle ne s'arrête
  pas là. Les ruptures technologiques de notre époque risquent d'engendrer des ruptures
  anthropologiques inédites. L'être humain ne doit pas être lié par le numérique,
  mais libéré. Question vertigineuse pour notre génération, parce qu'elle touche non
  seulement à ce que nous faisons, mais plus encore à l'essentiel, à ce que nous sommes.
  L'intelligence artificielle bouleverse déjà le travail, la création, la recherche,
  l'éducation, l'information, le lien social. Elle décuple nos capacités mais substitue
  la prédiction au jugement, la performance à la conscience et nous conduit à déléguer
  une part de notre liberté. Dès les premiers mois de votre pontificat, vous lui avez
  consacré l’encyclique Magnifica Humanitas. Et ce message est essentiel. Face à la
  puissance de la machinerie numérique, l'être humain doit garder la place qui est
  la sienne. L'intelligence artificielle doit être un serviteur et non un maître.
  La révolution numérique doit entraîner et non enchaîner. La responsabilité nous
  revient donc de ne pas permettre que les modèles les plus performants ne se retrouvent
  entre quelques mains qui auraient à décider pour toute l'humanité, ni que ces avancées
  les plus exponentielles ne nous conduisent à perdre le contrôle. C'est pour cela
  que nous devons trouver la voie d'une organisation internationale réconciliant progrès
  technologique, justice et humanisme. De la même manière, comme nous sommes en train
  de le faire pour les réseaux sociaux, il nous faut protéger nos enfants et accompagner
  nos adolescents. Leur développement affectif et cognitif suppose en effet de les
  protéger pour pouvoir transmettre et les préparer à la vie. La lecture, l'apprentissage,
  les arts et la culture, le sport et le temps avec les autres sont des trésors à
  leur donner et à protéger des écrans, des algorithmes, comme des chat-box. Protéger
  nos enfants, accompagner notre jeunesse dans ses interrogations et accueillir son
  besoin de sens et son engagement sont nos plus beaux devoirs. La veillée des jeunes
  que vous présiderez au Stade de France aura une force toute particulière. Des milliers
  de jeunes y seront en demande d'une parole de responsabilité et de lucide espérance.
  Leur soif d'engagement dit toute leur vitalité. Ils ne demandent pas qu'on leur
  promette un monde facile, ils demandent à pouvoir bâtir un monde meilleur. Très
  Saint-Père, lors de votre visite, vous allez rencontrer la France, pays de la diversité,
  comme le disait l'un de nos plus grands historiens, Fernand Braudel. Et c'est précisément
  parce qu'elle est patrie de liberté et d'esprit que la France est diverse, Nation
  qui nourrit une passion particulière pour le débat permanent. Ainsi faut-il la considérer
  pour bien l'aimer. Les grands débats sociaux et sociétaux de ces dernières années
  en attestent. L'éthique est l'un de nos grands sujets français. Où est la frontière
  entre le bien et le mal ? Comment concilier les progrès technologiques, notre conscience,
  notre attachement à la dignité humaine ? Ainsi sommes-nous attentifs toujours à
  toutes les réponses qui peuvent être apportées à ces questions fondamentales. Et
  soyez assuré, très Saint-Père, que tous les Français, moi le premier, vous écouteront
  avec le plus grand intérêt. Je veux vous redire mon attachement à cette écoute qui
  a pour vocation de nourrir un dialogue exigeant avec l'Eglise catholique, comme
  avec tous les autres cultes, avec les croyants, comme avec les non-croyants, avec
  toutes les traditions philosophiques et humanistes qui font notre pays. Parce que
  la République ne craint pas les consciences libres, parce que notre Nation est forte
  du dialogue nécessaire entre toutes les opinions, en demeurant fidèle à notre humanisme,
  notre attachement à la dignité humaine, en fondant nos décisions sur la science,
  tout en veillant aux plus fragiles. Très Saint-Père, je forme le vœu que ces quelques
  jours vous permettent de rencontrer la France dans toute sa vérité, ses forces,
  sa diversité, ses débats. Une France empreinte de spiritualité et cherchant toujours
  l'universel. Une France émancipée, attachée à son projet de liberté, d'égalité et
  de fraternité, diverse et unie. Une France engagée, sensible à votre présence et
  dont vous sentirez la ferveur. Très Saint-Père, c'est cette France qui vous reçoit
  aujourd'hui avec beaucoup d'humilité, avec beaucoup d'honneur et une très grande
  joie. Soyez le bienvenu. 25 septembre 2026 - Seul le prononcé fait foi Très Saint-Père,
