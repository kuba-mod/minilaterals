title: Visite officielle de  Ali Falih al-Zaidi, Premier ministre d’Irak.
text: Le Président de la République a reçu Ali Falih al-Zaidi, Premier ministre de
  la République d’Irak, le lundi 14 septembre 2026 au Palais de l’Élysée. Pour son
  premier déplacement en Europe depuis sa prise de fonction, le Premier ministre irakien
  a été reçu en France pour renforcer encore davantage le partenariat entre nos deux
  pays . Les deux dirigeants ont abordé la coopération dans des secteurs prioritaires
  comme l’énergie, les transports, les infrastructures, l’eau et la santé. La France
  et l’Irak ont renforcé également leur coopération en matière de sécurité et de défense
  . Alors que la présence de la coalition internationale contre Daech est appelée
  à évoluer, ils ont réaffirmé leur engagement mutuel et leur détermination commune
  à lutter sans relâche contre le terrorisme et à prévenir la résurgence de Daech
  , dans le plein respect de la souveraineté de chacun. Le Président de la République
  a rappelé que la stabilité au Moyen-Orient doit aussi produire des résultats concrets
  pour les Françaises et les Français . Les deux dirigeants ont échangé donc sur les
  conséquences de l’instabilité régionale sur les échanges et les approvisionnements
  énergétiques, notamment sur les exportations de pétrole irakien. Ils ont travaillé
  à leur reprise et à la diversification des voies d’acheminement afin de contribuer
  à réduire les tensions sur les marchés de l’énergie, soutenir notre économie et
  protéger durablement le pouvoir d’achat des Français.
