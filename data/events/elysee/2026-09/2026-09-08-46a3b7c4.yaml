title: Déclaration conjointe du Premier ministre britannique, du Président de la république
  française et du Premier ministre canadien sur la solution à deux États.
text: La solution à deux États au conflit israélo-palestinien est essentielle pour
  la paix, la stabilité et la sécurité au Moyen-Orient et au-delà. Il s’agit d’un
  intérêt national fondamental pour le Royaume-Uni, la France et le Canada que de
  protéger et de garantir cette issue L’expansion systématique des colonies en Cisjordanie,
  y compris la dernière décision du Gouvernement d’Israël de faire avancer la colonie
  E1, ainsi que la hausse considérable de la violence des colons, représentent une
  menace directe et urgente pour cette vision de paix. Il y a un an, nous avons reconnu
  l’État de Palestine. Le moment est venu de prendre des mesures supplémentaires pour
  honorer notre engagement à protéger la solution à deux États, nos intérêts et pour
  défendre nos valeurs, avant qu’il ne soit trop tard. Les colonies sont illégales
  au regard du droit international. Le Royaume-Uni, la France et le Canada prendront
  par conséquent des mesures pour interdire l’importation de produits en provenance
  des colonies et appliquer des sanctions ciblées contre les colonies et contre ceux
  qui les facilitent ou en tirent profit. En agissant ainsi de manière coordonnée,
  nous réaffirmons notre volonté de maintenir un partenariat étroit et productif avec
  Israël, notre soutien indéfectible au peuple israélien et notre engagement inébranlable
  pour la sécurité d’Israël. Nous soutenons un Israël sûr et en sécurité, vivant aux
  côtés d’une Palestine sûre et en sécurité. Ce jour marque un nouveau tournant dans
  notre approche pour protéger la solution à deux États. Nous co-présiderons une réunion
  à l’Assemblée générale des Nations Unies ce mois-ci pour faire avancer nos efforts
  et rechercher la paix.
