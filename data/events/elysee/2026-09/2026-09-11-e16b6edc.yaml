title: Déclaration conjointe sur l’accélération de la mise en œuvre du Partenariat
  Stratégique Global entre la France et le Vietnam.
text: 'A l’invitation du Président de la République française, M. Emmanuel Macron,
  le Secrétaire général du Parti communiste vietnamien et Président de la République
  socialiste du Vietnam, M. Tô Lâm, s’est rendu en France en visite officielle les
  10 et 11 septembre 2026. A cette occasion, il a notamment pris part au Sommet international
  sur l’Espace organisé à Paris. Cette troisième rencontre entre les deux dirigeants
  en moins de deux ans illustre le dynamisme de la relation bilatérale et l’importance
  que la France et le Vietnam attachent à la pleine mise en œuvre du Partenariat stratégique
  global qui les lie depuis la visite du Secrétaire général, Président Tô Lam à Paris
  en octobre 2024. Les échanges entre les deux dirigeants ont confirmé le haut niveau
  de confiance et les nombreuses convergences de vues et d’intérêts entre nos deux
  pays dans les domaines de la souveraineté, du développement économique durable et
  de la défense du multilatéralisme. Dans l’esprit des discours prononcés au Dialogue
  de Shangri-La en mai 2025 par le Président de la République Emmanuel Macron et en
  mai 2026 par le Secrétaire général, Président Tô Lâm, la France et le Vietnam souhaitent
  travailler avec leurs partenaires de l’Union européenne et de l’ASEAN, ainsi qu’avec
  les autres partenaires affinitaires d’Europe et d’Asie, afin de défendre les principes
  d’un commerce ouvert et d’un environnement international fondé sur des règles, en
  rejetant les logiques de puissance et toute menace de recours à la force ou d’usage
  de la force contraire au droit international. Afin de renforcer les résiliences
  de leurs sociétés, les deux dirigeants ont appelé à cultiver à la fois un esprit
  d’indépendance et une volonté de coopération. C’est la logique qui sous-tend le
  nouveau plan d’action bilatéral 2026-2028 mettant en œuvre le partenariat stratégique
  global entre la France et le Vietnam, dont les deux dirigeants se sont félicités
  de l’adoption. Dans un monde profondément déstabilisé, marqué par la multiplication
  des crises et la remise en cause des principes fondamentaux du droit international,
  la France et le Vietnam réitèrent leur volonté d’œuvrer ensemble à la restauration
  d’un ordre mondial stable et prospère, dans le plein respect de la Charte des Nations
  Unies et de ses principes, indispensable pour permettre à nos sociétés de faire
  face à la triple crise planétaire à laquelle elle est confrontée : le changement
  climatique, la perte de biodiversité et la lutte contre les pollutions ; tout en
  assurant la préservation de la santé au niveau mondial et en relevant les défis
  du développement durable. Ils réitèrent également l’importance, pour le développement
  de chaque pays, de la promotion et de la protection des droits de l’Homme et des
  libertés fondamentales. La France et le Vietnam soulignent le rôle essentiel des
  Nations Unies dans l’architecture internationale, tout en reconnaissant la nécessité
  de réforme de ses institutions. Les deux dirigeants ont ainsi apporté leur soutien
  à l’initiative ONU 80 du Secrétaire Général des Nations unies. Le Vietnam soutient
  l''initiative de la France et du Mexique visant à encadrer le droit de veto au Conseil
  de sécurité des Nations Unies en cas d’atrocités de masse. Les deux pays s’engagent
  également à renforcer leur concertation et leur coordination dans les enceintes
  régionales, notamment l’ASEAN et l’Union européenne dont elles soutiennent le rapprochement.
  A cet égard, la France a salué l’établissement d’un partenariat stratégique global
  entre l’Union européenne et le Vietnam en janvier 2026. Le Vietnam soutient la France
  dans le renforcement de ses relations avec l''ASEAN, apprécie les progrès accomplis
  dans le cadre du partenariat de développement ASEAN-France et soutient la candidature
  de la France au statut de partenaire de dialogue sectoriel de l’ASEAN.  La France
  et le Vietnam soutiennent également le rapprochement entre l’Union européenne et
  le Partenariat Transpacifique (CPTPP), dont le Vietnam assure la présidence en 2026.
  Les deux dirigeants ont également affirmé leur souhait de renforcer leur coopération
  dans le cadre de l’Organisation internationale de la Francophonie, au regard de
  leur attachement partagé à la langue française et dans la perspective du XXe Sommet
  de la Francophonie, organisé à Phnom Penh en novembre 2026. Ils ont salué l’accueil
  de cet évènement majeur en Asie pour la seconde fois après le Sommet de Hanoï en
  1997, et formé le vœu que celui-ci permettra de faire rayonner dans la région la
  4e langue la plus parlée au monde, porteuse de nombreuses opportunités culturelles
  et économiques. Les deux pays se sont engagés à promouvoir la coopération au sein
  de la Communauté francophone, notamment dans les domaines de l''éducation et de
  la formation, ainsi que des sciences et des technologies. La France et le Vietnam
  réitèrent leur attachement à la préservation de la paix, de la sécurité et de la
  stabilité en mer de Chine méridionale ainsi qu’au plein respect de la Convention
  des Nations Unies de 1982 sur le droit de la mer (CNUDM). Les deux pays soulignent
  que la CNUDM établit un cadre juridique complet pour toutes les activités menées
  dans les mers et les océans ; soutiennent le principe du règlement pacifique des
  différends ; s’opposent résolument à toute menace de recours à la force ou usage
  de la force contraire au droit international et réaffirment l’importance du maintien
  de la paix, de la stabilité, de la sécurité, de la sureté et de la liberté de navigation,
  de survol et de commerce sans entrave, ainsi que du droit de passage inoffensif,
  en mer de Chine méridionale et partout dans le monde. Elles soutiennent les efforts
  régionaux pour aboutir à un Code de Conduite efficace, substantiel et conforme au
  droit international, en particulier à la Convention des Nations Unies sur le droit
  de la mer. La France et le Vietnam appellent les parties concernées à entamer rapidement
  des négociations pour mettre fin aux hostilités et parvenir à une paix globale,
  juste et durable en Ukraine, dans le respect du droit international et des principes
  fondamentaux de la Charte des Nations Unies. La France et le Vietnam réitèrent leur
  disposition à participer aux efforts internationaux et à travailler étroitement
  avec les parties concernées afin de promouvoir le dialogue, de rechercher des solutions
  pacifiques pour mettre fin au conflit actuel au plus vite et pour la reconstruction
  de l’Ukraine. La France et le Vietnam réitèrent le caractère essentiel du respect
  de l’indépendance politique, de l’intégrité territoriale et de la souveraineté de
  tous les États. Les dirigeants ont exprimé leur vive inquiétude quant à la situation
  extrêmement préoccupante au Proche et Moyen-Orient. Ils appellent à toutes les parties
  à la désescalade, à la retenue et à travailler à une solution diplomatique aux conflits
  en cours. Les deux dirigeants ont réaffirmé leur attachement à la liberté de navigation
  dans les détroits internationaux partout dans le monde, appelant au rétablissement
  d''un passage sûr, continu et sans entrave des navires et des aéronefs à travers
  le détroit d''Ormuz, conformément au droit international tel qu''il est énoncé dans
  la CNUDM. La France a rappelé l''initiative franco-britannique pour la liberté de
  navigation dans le détroit d’Ormuz (M3SOH), à laquelle le Vietnam avait participé
  lors de la réunion de lancement. La France et le Vietnam marquent leur préoccupation
  à l’égard de la situation à Gaza, à Jérusalem et en Cisjordanie et dans les autres
  foyers de tension au Moyen-Orient, et rappellent leur engagement envers la solution
  à deux États, la seule à même de répondre aux aspirations légitimes de paix et de
  sécurité des Palestiniens comme des Israéliens. Les deux dirigeants appellent toutes
  les parties à cesser immédiatement toute escalade des tensions, à appliquer strictement
  les accords de cessez-le-feu conclus, et à instaurer des cessez-le-feu durables
  afin de permettre l''émergence d''une solution diplomatique à Gaza, au Liban et
  dans les autres foyers de tension au Moyen-Orient ; ainsi qu''à respecter le droit
  international et la Charte des Nations Unies, y compris le principe de respect de
  la souveraineté et de l''intégrité territoriale des États, en faveur de la paix
  et de la stabilité de la région et du monde. Dans un contexte de recomposition de
  l’économie mondiale, les deux dirigeants réaffirment leur volonté de développer
  des partenariats économiques fiables et mutuellement bénéfiques, de renforcer la
  résilience de leurs chaînes d’approvisionnement et de promouvoir des investissements
  durables dans les secteurs stratégiques, contribuant ainsi à la stabilité et la
  sécurité économiques mondiales. Les deux dirigeants se félicitent de l''organisation
  d’un Haut-Conseil d’Affaires Vietnam-France, qu''ils ont clôturé conjointement,
  et soulignent les priorités suivantes : 1. La France et le Vietnam renforceront
  la coopération dans le domaine de la défense, en accordant la priorité à la coopération
  industrielle et technologique en matière de défense, conformément aux besoins et
  aux intérêts de chaque pays. Pour permettre au Vietnam d''atteindre son autonomie
  dans ce domaine, les deux dirigeants ont encouragé leurs administrations et les
  entreprises des deux pays à accélérer leurs travaux. La France et le Vietnam se
  félicitent du renforcement de la coopération dans le domaine des opérations de maintien
  de la paix ou encore dans le domaine mémoriel. 2. La France et le Vietnam soutiennent
  la promotion, en matière de sécurité intérieure, de la coopération et de la formation
  dans les domaines de la prévention et de la lutte contre la criminalité organisée
  et transnationale, de la prévention de l''immigration clandestine, de la traite
  des êtres humains, ainsi que dans la mise en œuvre de la Convention des Nations
  unies contre la cybercriminalité signée à Hanoï en octobre 2025. La France et le
  Vietnam se félicitent de la coopération dans le secteur des industries de la sécurité
  civile, notamment en coordonnant les efforts visant à renforcer les capacités opérationnelles
  aériennes. Les deux pays s’engagent à renforcer les échanges d’information dans
  la lutte contre la criminalité, et à développer la coopération en matière de protection
  civile notamment dans le cadre du projet européen « Global Ports Safety ». 3. Les
  deux pays saluent le renforcement de la coopération dans le domaine du droit et
  de la justice, notamment entre le Conseil d’Etat français et le ministère de la
  Justice vietnamien. 4. La France et le Vietnam soutiennent la promotion, dans le
  domaine commercial, d''un environnement international favorable à la prospérité
  commune. Les deux pays s’engagent à poursuivre la mise en œuvre intégrale de l''Accord
  de libre-échange entre le Vietnam et l''Union européenne (EVFTA), y compris en matière
  d''accès au marché et de protection des droits de propriété intellectuelle au service
  d’échanges commerciaux équilibrés. Le Vietnam salue les progrès accomplis par la
  France dans le processus de ratification de l’accord de protection des investissements,
  qui doit aboutir d’ici la fin de l’année. La France et le Vietnam continuent de
  coopérer étroitement dans le domaine de la pêche, notamment en ce qui concerne le
  soutien technique continu de la France au Vietnam dans la lutte contre la pêche
  illicite, non déclarée et non réglementée (INN) et le développement d''une pêche
  durable. 5. La France et le Vietnam renforceront la coopération scientifique et
  technologique pour constituer un pilier de la coopération entre les deux pays dans
  le cadre de la mise en œuvre du plan d''action du Partenariat stratégique global,
  notamment à travers la formation, le développement de programmes de recherche conjoints,
  l''investissement dans le développement des infrastructures de recherche et l''encouragement
  de la coopération avec le secteur privé dans les domaines d''intérêt commun identifiés
  dans ce plan d''action, à commencer par l''intelligence artificielle, les semi-conducteurs,
  la technologie quantique, la technologie numérique, la biotechnologie, les technologies
  énergétiques et marines, ainsi que les transports intelligents. 6. La France et
  le Vietnam saluent le succès du Sommet sur l’Espace qui s’est tenu à Paris les 9
  et 10 septembre. Les deux pays expriment leur intention de coopérer concernant le
  projet de fourniture et de lancement du satellite d''observation VNREDSat-2, projet
  soutenu par la France à travers la mobilisation des instruments financiers français.
  7. La France et le Vietnam saluent la signature d’une Lettre d''intention sur les
  minerais critiques, ainsi que la mise en œuvre de cette coopération matérialisée
  par l''accord tripartite pour la gestion durable des ressources minérales et l’amélioration
  des connaissances géologiques au Vietnam entre le BRGM, l’AFD et le Département
  de la géologie et des minéraux du Vietnam 8. L’intensification des échanges entre
  administrations et entreprises des deux pays pour accompagner le Vietnam dans le
  développement de ses infrastructures stratégiques dans les domaines de l’énergie,
  des réseaux de transports et notamment ferroviaires ainsi que de mobilité urbaine.
  Les deux dirigeants se sont félicités notamment de la signature d’un mémorandum
  entre le ministère de la construction du Vietnam et l’entreprise Systra en vue de
  la rénovation de la ligne Hanoi-Haiphong, dont la France soutiendra la réalisation.
  Les deux dirigeants se réjouissent du renforcement du dialogue entre les entreprises
  françaises et vietnamiennes dans le domaine du transport ferroviaire, ainsi que
  de la signature du mémorandum entre le Comité populaire de la ville de Hanoï, l''AFD
  et l''Université des Technologies des Transports portant sur la création de l''École
  des technologies ferroviaires. 9. Les deux pays saluent la poursuite du partenariat
  stratégique dans le domaine de l’aéronautique civile, avec la signature et l’annonce
  de plusieurs accords majeurs entre les entreprises françaises et vietnamiennes.
  10. S’appuyant sur le partenariat stratégique global France-Vietnam, tirant parti
  de l’expérience et des atouts de la France dans le secteur de l’énergie et capitalisant
  sur les résultats positifs de la coopération passée, les deux pays poursuivront
  leur coopération dans ce domaine. Dans le domaine de l’énergie nucléaire à des fins
  pacifiques, cette coopération portera notamment sur l''évaluation des opportunités
  associées au développement de l''énergie nucléaire pour la production d''électricité,
  la recherche et l’application de technologies électronucléaires avancées, la garantie
  de la sûreté et la sécurité nucléaires, ainsi que la formation et le développement
  des ressources humaines. La France et le Vietnam intensifieront également la coopération
  dans le développement des infrastructures énergétiques, la coopération technique
  pour la modernisation des infrastructures opérationnelles du réseau électrique et
  du marché de l’électricité, ainsi que le renforcement de l’intégration des énergies
  renouvelables. 11. Les deux pays encouragent le renforcement de la coopération dans
  le domaine de la santé à travers, au niveau bilatéral avec la signature d’un nouvel
  accord intergouvernemental et, au niveau multilatéral, avec la poursuite de la coopération
  dans les instances multilatérales et au service de l’approche One Health. 12. Les
  deux dirigeants appellent à poursuivre les efforts pour faire face à trois crises :
  le changement climatique, la perte de biodiversité et la pollution, en particulier
  la pollution plastique. Les deux dirigeants réaffirment leur détermination à atteindre
  pleinement les objectifs de l’Accord de Paris, à travers la publication des Contributions
  déterminées au niveau national (NDC) ambitieuses et la réalisation des engagements
  visant à éliminer progressivement les combustibles fossiles, à promouvoir la fourniture
  d’électricité à faible émission de carbone, à développer des sources d''énergie
  à faibles émissions et à émissions nulles, afin d''atteindre progressivement la
  neutralité carbone d''ici 2050, tout en garantissant les objectifs nationaux de
  sécurité énergétique et de développement durable, en fonction des meilleures connaissances
  scientifiques dont dispose le Groupe d''experts intergouvernemental sur l''évolution
  du climat (GIEC). Les deux pays rappellent les conclusions du premier bilan mondial
  de l''Accord de Paris, adopté lors de la COP28, en particulier la sortie progressive
  des énergies fossiles, en fonction des conditions, du contexte, du niveau de développement
  et des exigences de sécurité énergétique de chaque pays. La France se félicite des
  objectifs ambitieux du Vietnam visant à atteindre la neutralité carbone et sortir
  du charbon pour la production d''électricité d''ici 2050. A cette fin, le Vietnam
  salue la poursuite par la France de la mise en œuvre de manière plus forte et résolue
  de ses engagements dans le cadre du Partenariat pour une transition énergétique
  juste (JETP). 13. En matière de protection de la biodiversité, les deux pays réaffirment
  leur engagement en faveur d’une mise en œuvre efficace des objectifs du Cadre mondial
  dit « de Kunming- Montréal ». Les deux pays reconnaissent l’importance de la conservation
  et de la gestion durable de l’Océan pour atteindre les objectifs de développement
  durable. Les deux pays se félicitent de l’entrée en vigueur de l’accord BBNJ et
  reconnaissent que la première Conférence des Parties à cet accord (COP1), prévue
  en janvier 2027, constituera une base importante pour la mise en œuvre de cet Accord.
  Par ailleurs, la France et le Vietnam se félicitent de l’organisation du Sommet
  sur les Deltas en marge de la Conférence de l’ONU sur l’Océan, et affirment leur
  souhait de poursuivre la promotion de la coopération transfrontalière sur le fleuve
  Mékong. La France se tient prête à appuyer le Vietnam dans la ratification de la
  Convention sur l’eau, portant sur la coopération dans les bassins transfrontaliers.
  14. La France et le Vietnam promeuvent les échanges humains, en favorisant les coopérations
  dans le domaine culturel, notamment la préservation et la promotion du patrimoine,
  les échanges artistiques et les industries culturelles, ainsi que dans les domaines
  sportif, scientifique et de l’innovation, notamment à travers les programmes d''échanges
  d''étudiants et de jeunes chercheurs, incluant les chercheurs doctorants et les
  postdoctoraux favorisés par le nouveau Partenariat Hubert Curien (PHC Hoa Sen Lotus).
  Les deux pays s’engagent à poursuivre la mise en œuvre effective des accords de
  coopération signés en matière d''éducation et de formation ; en particulier, à soutenir
  l''enseignement du français au Vietnam. Dans ce cadre, la France salue la perspective
  de l’installation de l’USTH sur le nouveau campus de Hoa Lac en 2028 qui permettra
  la poursuite de son développement rapide pour devenir un centre d''excellence académique
  dans la région. Les deux dirigeants saluent la remise par la France du tambour de
  bronze d’époque Dong Son aux autorités vietnamiennes, dans le cadre de leur engagement
  à lutter contre le trafic illégal de biens culturels.'
