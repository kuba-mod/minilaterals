date: '2026-09-30'
type: press_release
source_name: elysee
title: Visite d’État en Espagne.
text: 'À l’invitation du Roi Felipe VI, le Président de la République s''est rendu
  en Espagne les 29 et 30 septembre 2026. Cette première visite d’État d’un Président
  français en Espagne depuis 2009 illustre la profondeur des liens qui unissent nos
  deux pays ainsi que la densité de leurs coopérations. Pays voisin, ami, allié, l’Espagne
  constitue aussi un partenaire économique et d’investissement majeur pour les entreprises
  françaises et le développement de coopérations et d’innovations , notamment dans
  les secteurs du numérique et du spatial. Cette visite a mis aussi en lumière l’intensité
  des échanges humains entre nos deux pays, au travers notamment des nombreuses coopérations
  culturelles, universitaires et scientifiques et du réseau d’enseignement français
  en Espagne . Le Président Emmanuel Macron a notamment échangé avec des étudiants
  de l’Université Complutense sur les défis du numérique , à l''heure des réseaux
  sociaux et l’intelligence artificielle. 29 septembre 2026 - Seul le prononcé fait
  foi Je voulais peut-être vous dire combien j''étais heureux d''être là parmi vous
  et remercier Monsieur le recteur pour ses mots et vous remercier, l''ensemble des
  membres du corps professoral et des étudiants qui sont là, ainsi que de tous les
  invités. Donc merci beaucoup pour votre présence et pour cette invitation. Je suis
  très heureux d''être là et très honoré de pouvoir aussi échanger avec Monsieur Cercas,
  pour qui j''ai beaucoup d''admiration. Voilà. Donc merci à vous. Merci, Monsieur
  le Président, d''être ici avec nous. Merci de vouloir converser avec moi. Montaigne
  a écrit : « L''Homme est un être ondoyant. » C''est beau et c''est vrai. Mais je
  pense aussi que l''histoire, parfois, est ondoyante. Elle monte, elle descend. Aujourd''hui,
  Monsieur le Président, nous sommes dans une dépression démocratique. Toutes les
  études le montrent. Il y a de moins en moins de démocraties au monde. Au contraire,
  à la fin du XXe siècle, on était dans une période de montée démocratique. Après
  la chute du mur de Berlin, de la fin du communisme, de l''Union soviétique, on pensait
  que la démocratie était presque inévitable et on parlait de la fin de l''histoire,
  qui ne voulait pas dire que l''histoire était finie, mais que la démocratie était
  the only game in town , on disait, le seul jeu de la cité. Bon, ça, cet optimisme
  complètement excessif, c''est fini, ou a commencé à finir avec la crise de 2008,
  qui était énorme, qui était terrible, qui était un séisme énorme, a fait trembler
  l''Europe, un séisme seulement comparable à celui, je crois, de 1929. Et le séisme,
  la crise de 1929 a provoqué l''arrivée au pouvoir ou la consolidation du fascisme
  en Europe, un peu partout, et finalement, abouti à la Seconde Guerre mondiale qui
  a été la fin catastrophique de cette crise. La crise de 2008 n''a pas provoqué,
  je crois, le retour du fascisme, j''en suis sûr. Il y a des gens qui le pensent,
  comme vous le savez très bien, Madeleine Albright, beaucoup de gens. Je ne le pense
  pas, je crois qu''elle a provoqué une chose différente qu''on peut appeler, que
  j''appelle national-populisme, c''est différent, qui a des manifestations diverses,
  comme le fascisme avait des manifestations diverses. La plus claire, le symbole
  pour moi, c''est la présence de Monsieur Trump, de Donald Trump au pouvoir, mais
  il y en a d''autres. Et qui, Monsieur le Président, a des traits du fascisme, ça
  c''est clair, le retour du nationalisme, la vocation autoritaire, et qui peut être
  encore plus dangereux que le fascisme, dans le sens qu''on connaît le fascisme.
  Mais on n''a pas vu encore la vraie face du national-populisme, qui est très malin,
  parce qu''il dit qu''il défend le fascisme ouvertement contre la démocratie, même
  violemment contre la démocratie. Le national-populisme, il dit qu''il défend la
  démocratie. Mais quand il arrive au pouvoir, il vide la démocratie du dedans, les
  institutions démocratiques, ou encore pire, il va contre la démocratie au nom de
  la démocratie. Monsieur le Président, l''exemple le plus clair, c''est l''invasion
  du Capitole. Ces gens disaient qu''ils voulaient : « On veut nous voler la démocratie
  et nous voulons qu''on nous retourne la démocratie. » C''était une perversion totale.
  C''était une attaque à la démocratie au nom de la démocratie. Alors ça, c''est la
  vision, le dessin général. La première fois qu''on s''est trouvés à l''Élysée, Monsieur
  le Président, on a parlé malheureusement beaucoup de l''Ukraine. Aujourd''hui encore,
  la guerre est là. Je suis d''accord avec vous, la guerre d''Ukraine, c''est une
  chose un peu différente, c''est-à-dire une logique différente, l''Union soviétique,
  etc., mais fait partie de cette même dépression démocratique. Il faut seulement
  comparer, Monsieur le Président, le Monsieur Poutine du commencement de son mandat,
  à la fin du XXe siècle, avec le Monsieur Poutine d''aujourd''hui. Mais alors, ceci
  étant dit, j''ai une question très claire, très directe pour vous. Je crois que
  la réponse est compliquée. Mais comment sortir de cette dépression ? C''est-à-dire
  quelle fin prévoyez-vous ? Et surtout, qu''est-ce que l''Europe peut faire ? Parce
  que l''Europe reste encore une forteresse de la démocratie et de la vision du monde
  basée sur les règles, mais c''est une forteresse assiégée du dehors et du dedans.
  Qu''est-ce qu''on peut faire ? Qu''est-ce que l''Europe peut faire ? Qu''est-ce
  que nous pouvons faire ? Comment sortir de ça ? Merci beaucoup. Là, je ne sais pas
  combien de temps vous me laissez. Non, d''abord, je ne voudrais pas désespérer.
  Je vois beaucoup de jeunes visages, donc vraiment, ne pensez pas que vous entrez
  dans une période affreuse où tout est fichu. Mais je pense que ce que vous venez
  de dire est très juste. Alors, pour apporter la réponse, je pense qu''il faut essayer
  de caractériser peut-être plus précisément ce que vous appelez dépression démocratique.
  Quand on regarde ce qu''on peut qualifier, comment nos systèmes de démocratie libérale,
  au sens politique du terme, qui se sont bâtis à partir du XVIIIe siècle, dans notre
  Europe et ont émergé, se sont sophistiqués. Elles se sont construites sur quoi ?
  Parce qu''en fait, les formes politiques ne tombent pas sur les peuples comme venues
  de l''éther pour s''y figer. C''est qu''il y a quelque part des idées qui arrivent
  à se traduire en structures, en institutions politiques et qui correspondent à des
  organisations sociales. C''est ça qui fait que les choses durent et qu''on vit dans
  une société, qu''on vit depuis le XVIIIe siècle dans des démocraties. Donc ces démocraties,
  elles se sont construites sur un compromis entre les idées des Lumières qu''on a
  après consolidées, élaborées, qui ont été bousculées par les totalitarismes du XXe
  siècle, vous l''avez évoqué, mais qui se sont revivifiées au sortir de la Deuxième
  Guerre mondiale à travers en particulier sans doute la Convention européenne des
  droits de l''homme, et cette réinvention, cette revitalisation de nos principes,
  mais donc primat de la dignité humaine, principe de liberté, croyance dans l''individu
  libre rationnel, et donc c''est toute la philosophie politique à laquelle nous croyons
  depuis le XVIIIe siècle. C''est l''organisation de systèmes d''équilibre de pouvoirs.
  C''est le consensus avec les classes moyennes, c''est-à-dire ce qui a permis d''installer
  ça, c''est qu''on a expliqué aux classes moyennes qu''elles allaient vivre de mieux
  en mieux, donc il y a l''idée de progrès qui est attachée à nos démocraties et à
  cet équilibre. Il y a donc une structure productive qui les a accompagnées avec
  des hauts, des bas, des crises multiples, mais qui est qu''en quelque sorte, par
  l''innovation technologique et la capacité à la diffuser, on allait donner un meilleur
  futur à tout le monde. Et on a eu des soubresauts quand ces idées-là, d''ailleurs,
  ont été percutées. Ce qui a été dit par Monsieur Cercas à l''instant sur la crise
  de 29 et les conséquences qu''elle a eues, c''est exactement ça, c''est-à-dire qu''à
  un moment donné, des idées qui viennent fragiliser l''édification institutionnelle
  qui était en place avec, par exemple, la République de Weimar, mais surtout la crise
  de confiance qu''ont les classes moyennes européennes parce qu''elles n''ont plus
  leur part de richesse fait que le système se tord et le fascisme arrive à émerger
  dans plusieurs pays en Europe. Donc si on se dit que c''est à peu près ça, l''idée
  démocratique, cette espèce de fatigue, de crise que vous décrivez, elle s''installe
  sur quoi ? Elle s''installe, je crois, d''abord sur le fait qu''on n''a plus tenu
  la promesse économique. Ça, ça a commencé à partir de la désindustrialisation. Alors,
  il y a des histoires très différentes selon les pays européens. L''Espagne n''a
  pas la même que la France, etc. Mais il y a eu en tout cas une phase de la mondialisation
  à partir des années 90 qui vient déjà, quand même fragiliser ce consensus parce
  qu''elle crée les vagues de délocalisations, etc. Donc on voit des idées apparaître,
  enfin des vraies sensibilités politiques fortes, mais en gros, la promesse qu''on
  va continuellement dans une économie politique qui va vous permettre de vivre mieux
  n''est pas si validée. Donc cette idée se fragilise dans nos sociétés. Le grand
  coup de massue, ça a été dit, c''est à coup sûr la crise de 2008-2012, je dirais,
  parce qu''elle ne s''arrête pas en 2008 chez nous. Pourquoi ? Parce que cette crise,
  qui est une crise financière, qui vient des États-Unis d''Amérique, qui est d''acteurs
  de marché qui s''étaient déjà beaucoup enrichis, fait émerger en Europe une crise
  de certains opérateurs, puis des dettes souveraines. Qui a payé cette crise ? On
  a mis d''abord longtemps à la régler, mais si je devais schématiser les choses,
  on ne l''a pas vécue à la même intensité, elle a été asymétrique en Europe. Vous
  l''avez vécue beaucoup plus durement que nous, et vous avez fait des ajustements,
  comme on dit affreusement, budgétaires et économiques beaucoup plus durs, c''est-à-dire
  qu''il y a des vies qui ont été changées à ce moment-là, et il y a eu une régression
  économique et sociale mais ce sont les classes moyennes qui ont payé l''addition.
  Mais ça, c''est vrai partout en Europe. Ça, il ne faut pas sous-estimer ce qu''a
  été le choc de 2008-2012, parce que, quelque part, les classes moyennes partout
  en Europe ont dit : la promesse n''est pas tenue. On vit quand même encore tous
  avec ça. Quand on regarde les choses, même dans des pays qui ont été moins touchés,
  il y a certaines catégories qui n’ont pas totalement retrouvé le pouvoir d''achat,
  le niveau de vie qu''elles avaient avant cette crise. Dans certains autres pays,
  même si le pays va beaucoup mieux en termes macroéconomiques, il y a eu cette trahison.
  Premier point. La deuxième chose qu''il ne faut pas sous-estimer par rapport à ce
  que j''évoquais, c''est la crise démographique. Je pense qu''on sous-estime dans
  le débat public beaucoup ce point, mais nous avions toujours vécu depuis le XVIIIe
  dans des économies, et ça participe d''ailleurs de l''histoire de croissance et
  de progrès, où, je ne vais pas ici faire un cours de macroéconomie ou de modèle
  de croissance endogène, mais il y avait deux drivers qui étaient l''innovation et
  la démographie, qui sont deux éléments clés qui tirent les économies vers le haut.
  Nous sommes devenus vieux. Alors on ne veut pas le voir, on ne veut jamais le voir
  quand on vieillit, mais notre continent est devenu vieux et nous sommes entrés en
  phase accélérée dans la transition démographique, l''Espagne avant même la France.
  Mais ça veut dire qu''on est beaucoup de pays en Europe où le solde naturel, aux
  bornes de la nation est souvent négatif et, en fait, on n''a rééquilibré que par
  l''immigration. Et ça, on ne l''a pas véritablement pensé, mais c''est un deuxième
  choc très profond pour l''idée démocratique et les modèles qu''on avait construits,
  parce que ça les bouscule, là aussi, parce que ça veut dire que, d''abord, soit
  la croissance ne se fait pas de la même manière ; elle s''amoindrit parce qu''il
  y a moins de croissance démographique. Soit, elle ne peut se faire que si on sait
  aussi gérer la question migratoire parce qu''en vérité, vos modèles vieillissent
  et donc les modèles sociaux qu''on a construits sur des équilibres entre les générations
  d''après-guerre se transforment et sont de moins en moins valides, ça ne marche
  plus, soit ils peuvent se revivifier, mais si on se régénère avec de l''immigration.
  Il y a le consensus, on le voit bien dans nos sociétés, il est travaillé. La société
  espagnole comme la société française sont bousculées par ça. Donc deuxième crise
  quand même importante. Ce sont des grandes transitions qu''on a vécues. Troisième
  élément clé à mes yeux, c''est qu''il y a une crise que j''appellerais d''efficacité
  de nos démocraties. Elle est plus complexe, on pourra y revenir si vous avez des
  questions ou des interrogations, mais on a sophistiqué nos modèles, mais nous sommes
  devenus extrêmement complexes parce qu''on gère des problèmes très complexes, et
  donc on est devenus de moins en moins intelligibles et de plus en plus lents. C''est
  vrai partout, parce qu''on gère des mondes très compliqués, des sociétés très sophistiquées,
  et donc on a créé des systèmes de checks and balances partout, d''autorités indépendantes,
  avec de très bonnes raisons derrière ça, mais cela a ralenti la capacité d''agir
  de nos systèmes démocratiques. Et ça a créé une impatience dans des sociétés qui
  voudraient qu''on règle très vite les choses et, en quelque sorte, où la tolérance
  à la décision lente ou à la maïeutique de décision a faibli, a diminué, elle. Mais
  on a une crise d''efficacité démocratique qui rend moins acceptables les systèmes
  qu''on avait eus et qui crée une fascination pour les régimes autoritaires ou les
  systèmes autoritaires. Pourquoi ce que vous appelez le national-populisme peut émerger ?
  Parce que c''est des réponses très simples, c''est beaucoup plus rapide. Même si
  elles ne sont que des réponses que j''appellerais, moi, symptomatiques ou démagogiques,
  en vrai, parce que ce qu''on appelle populisme, je me méfie de ce mot, peut-être
  parce que moi, quand j''ai émergé il y a 10 ans, on disait que j''étais un populiste.
  Donc depuis, je me méfie. Mais populiste, il y a le mot peuple dedans. Il faut faire
  attention, il ne faut pas donner le sentiment que les peuples auraient tort ou seraient
  méprisables. C''est terrible. Moi, j''appelle ça de la démagogie, c''est-à-dire
  qu''on flatte plutôt les opinions publiques en leur disant : on a une solution beaucoup
  plus rapide, beaucoup plus simple. Donc troisième crise. La quatrième, je ne suis
  sans doute pas exhaustif et je reviendrai sur l''Europe, c’est une transition, un
  changement très profond, anthropologique, que sont les réseaux sociaux et maintenant
  l''intelligence artificielle ajoutée aux réseaux sociaux. Ça, je pense qu''on a
  réussi à l''installer ces quelques dernières années dans le débat public, mais ça
  a été totalement sous-estimé et ça commence en vérité à peu près après la crise
  financière, mais dans les mêmes années. Ça se développe 2008-2010, ça se démocratise
  vraiment entre 2010-2015, mais nous vivons depuis une décennie dans un système qui
  a totalement changé, totalement. Et c''est-à-dire que donc nous apprenons, nous
  débattons, nous échangeons, dans un système dont l''infrastructure informationnelle
  et démocratique s''est profondément transformée. D''ailleurs, votre génération,
  elle est arrivée bien souvent à la conscience et à l''apprentissage dans un système
  qui, en fait, n''a rien à voir avec la mienne. C''est une révolution qui est très
  profonde. Ça veut dire que notre truchement au monde, notre relation au monde, elle
  se construit beaucoup plus par ces réseaux. Notre rapport à l''information, notre
  rapport à la connaissance de tel ou tel pays, notre rapport parfois au savoir. Dans
  votre génération, quand on regarde les chiffres, on s''informe de plus en plus massivement
  à travers ces réseaux sociaux. On n''a pas du tout fait attention à quelle était
  la structure de ces réseaux, enfin, en fait, pourquoi ils étaient faits et comment
  ils étaient faits ? Ils ne sont pas faits pour vous informer ou que la démocratie
  marche bien. Ils sont faits, et là aussi on pourra y revenir, je ne veux pas être
  trop long, mais pour susciter le maximum d''excitation chez vous, créer des dépendances
  cognitives et affectives pour que vous restiez le plus longtemps possible devant
  l''écran, plutôt devant des contenus très courts. Il a un ordre de mérite qui est
  l''exact contraire de ce que depuis des siècles nous enseignons dans ces lieux comme
  celui qui nous accueillent, des universités, lieux de savoir, de transmission. C''est-à-dire
  que ce qui est le plus important dans les réseaux sociaux, c''est l''émotion négative.
  Elle est plus importante, en tout cas elle crée plus de viralité que l''émotion
  positive, laquelle crée plus de viralité que le raisonnement. Donc on est dans un
  ordre où, en fait, tout le système, il est plutôt mû par les gens qui savent bien
  exciter par les émotions négatives. Mais ça, ce sont des machines à diffracter les
  démocraties. Parce qu''en vrai, ce qui va marcher, ce à quoi on va être exposés
  pendant des heures par jour, c''est des choses qui nous séparent. C''est-à-dire
  l''inverse d''une université qui va nous apprendre un même savoir, qui nous permettra
  d''ailleurs de converser, de dialoguer, peut-être d''exprimer des désaccords respectueux,
  mais on a appris, on vous a appris, on nous a appris, on a évolué dans une société
  où le cœur de l''infrastructure, de conversations démocratiques sont devenus ces
  réseaux qui donnent une prime plutôt à l''émotion négative, plutôt au clash et donc
  plutôt à ce qui nous écarte et donc qui polarise nos sociétés. Donc au fond, on
  a à traiter ensemble d''une crise de modèle économique, d''une crise démographique
  de notre Europe, d''une crise d''efficacité démocratique, de notre capacité à aller
  plus vite et à être plus efficaces, et en même temps d''une crise un peu, que je
  dirais, anthropologique, c''est qu''on n''évolue plus dans le même espace, qu''aujourd''hui
  cet espace numérique, on lui a laissé manger beaucoup de choses et il nous a un
  peu ensevelis. On pourra y revenir dans les questions là-dessus. Donc face à ça,
  et je ne suis pas exhaustif parce qu''il y a en plus de ça évidemment la grande
  transformation géopolitique qu''on vit avec la réémergence d''empires, le retour
  de la guerre en Europe, évidemment, la Chine et les États-Unis qui, pour la première
  fois de leur histoire, sont deux immenses puissances hostiles à l''idée européenne.
  Donc tout ça mis bout à bout fait qu''en effet, on est un peu assiégés et on se
  dit, rien ne va. C''est très dur. Et il y a cette fatigue démocratique qui s''est
  installée. Alors elle fait émerger ce que vous avez appelé des national-populismes.
  Pourquoi ? Parce que quand il y a une angoisse qui monte face à cette multicrise,
  les extrêmes sont beaucoup plus à même d''attraper l''angoisse et la colère. C''est
  plus efficace. Donc vous avez des montées d''extrêmes partout en Europe, c''est
  clair, avec des réponses simplistes, mais des réponses, en disant : avec moi, ça
  ira beaucoup plus vite, ce sera beaucoup plus radical. Ça correspond à la polarisation
  des sociétés et ça correspond aux conséquences de ces crises multiples qui ont émergé.
  Est-ce que je pense qu''on va les arrêter du jour au lendemain ? Je ne crois pas.
  Je pense que c''est là, ça s''installe, ça va aux extrêmes. La question, c''est
  quelles réponses on peut apporter et comment agir pour traiter en profondeur ce
  que nos sociétés vivent. La première réponse, je pense qu''elle est de réhumaniser
  ces réseaux sociaux. Là, je pourrais développer si vous voulez, si ça vous intéresse.
  Il faut reprendre le contrôle, et des réseaux sociaux comme de l''intelligence artificielle
  qui arrive. Je ne veux pas être plus long, je le suis déjà, mais ça, c''est clé.
  C''est une bataille européenne. C''est celle qu''on mène d''ailleurs avec l''Espagne,
  et maintenant on a gagné, on a européanisé pour dire qu''il faut protéger nos jeunes
  de moins de 15 ans des réseaux sociaux. Mais donc moi, j''appelle ça réhumaniser,
  c''est reprendre le contrôle pour remettre tout ça au bon rythme et refaire démocratie.
  La deuxième chose, c''est de retrouver de l''efficacité collective. Certains appellent
  ça de la dérégulation, d''autres de la simplification. Ça veut dire qu''il faut
  qu''on aille un peu plus vite par rapport à la pulsation du monde. On a une Europe
  qui s''est désynchronisée et qui est trop lente par rapport à la Chine, aux États-Unis.
  Donc on doit retrouver de la vitalité de décision. La troisième chose par rapport
  à la crise économique, c''est de retrouver de la capacité à innover. Et pour moi,
  c''est très complémentaire avec les équilibres européens qu''on a toujours connus.
  On est les seuls à savoir faire ça. Réhumaniser la technologie et donc la maîtriser
  par de la régulation intelligente, mais en même temps être dans la technologie.
  Donc la bataille européenne des prochaines années, c''est vraiment d''innover beaucoup
  plus vite et beaucoup plus fort. Ces 20 dernières années, en produit intérieur brut
  par habitant, on a décroché par rapport aux États-Unis. Plus des deux tiers de l''explication
  de ça, c''est qu''on innove moins. Donc on doit réinnover beaucoup plus fort si
  on veut recréer du consensus dans nos démocraties. Et à cet égard, l''innovation
  qui va à travers l''IA, la robotique, il faut la voir aussi comme une opportunité
  si on sait bien l''organiser, parce qu''elle va redonner, elle peut redonner des
  marges de manœuvre à nos sociétés pour nos modèles sociaux et pour permettre justement
  de les financer et retrouver ce compromis avec les classes moyennes et leur permettre
  de réavancer. Tout ça suppose de renforcer et réadapter nos modèles éducatifs parce
  qu''il n''y a pas de progrès social sans modèle éducatif adapté à ces évolutions
  technologiques. Mon dernier point auquel je crois beaucoup aussi, et j''arrêterai
  là, c''est que dans ce contexte-là, pour réussir cet agenda, il faut une Europe
  plus indépendante. Parce que si cette Europe, elle est faible face au retour des
  empires, elle va perdre sa souveraineté. Si elle n''achète que de la technologie
  américaine, elle ne pourra rien réguler. Et si elle est simplement consommatrice
  de ce qui est fait ailleurs, elle ne réglera pas le problème de croissance qu''elle
  a avec ses classes moyennes et de modèle économique. C''est pour ça que l''agenda
  d''autonomie stratégique, de la défense à la technologie, en passant par tous les
  domaines de la chaîne de valeur, est clé, parce que c''est ce qui nous permet de
  décider pour nous-mêmes. Voilà un peu comment, à mes yeux, j''essaie de répondre,
  de réagir à votre point, comment on caractérise le moment qu''on vit et quelles
  sont les pistes pour avancer. Moi, je ne suis pas pessimiste du tout. Ça prendra
  des années. Mais à côté de tout ça, je pense que si l''Europe arrive à rester solidaire
  et unie, et à jouer aussi sur ce que sont ses éléments de stabilité, de décence,
  de respect, d''équilibre, de respect de la personne humaine et de sa dignité, ce
  qui est le cœur de notre philosophie politique, on a un énorme avantage parce que
  je pense qu''on attirera les talents du monde entier qui vont nous aider, et on
  gardera, et on va vous former, pour nous aider à faire cette transition. Parce qu''en
  vrai, quand on regarde la Chine ou les États-Unis, la violence qui est en train
  de monter et les sous-jacents qu''il y a dans ces sociétés, l''Europe est désirable.
  Oui, Monsieur le Président, merci. Je veux revenir à quelque chose que vous avez
