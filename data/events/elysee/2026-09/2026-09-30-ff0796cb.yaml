  notre coordination entre pays européens et au sein de l''Union européenne, en particulier
  de l''espace Schengen, pour nous améliorer collectivement. Mais c''est vraiment
  la seule réponse que j''en tire et je trouve que les propos simplistes ou les mises
  au pilori ne sont pas efficaces et sont un peu indignes. Voilà. On a plutôt du soutien
  avec ce que vous vivez, de la considération pour chaque personne humaine et la volonté
  d''avoir une politique efficace et d''aller jusqu''au bout parce qu''on veut protéger
  aussi notre espace et nos frontières, on y tient. C''est le sens du pacte asile-immigration,
  la politique de retour qu''on défend, mais on le fait en étant fidèles à nos valeurs
  et à nos principes. Pour terminer cette visite d''État, le Président Emmanuel Macron
  s''est exprimé lors de la cérémonie de dévolution avec le couple royal espagnol.'
