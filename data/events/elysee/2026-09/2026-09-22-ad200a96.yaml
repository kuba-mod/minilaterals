date: '2026-09-22'
type: press_release
source_name: elysee
title: '81ᵉ session de l’Assemblée générale des Nations unies à New York : deuxième
  journée.'
text: 'Le Président Emmanuel Macron se rend à New York du 21 au 23 septembre 2026
  pour participer à la 81ᵉ session de l’Assemblée générale des Nations unies. Lors
  de cette deuxième journée, le chef de l’État a exposé à la tribune de l’Assemblée
  générale les priorités et objectifs de son action diplomatique qui vise à construire
  une réponse multilatérale efficace aux crises et grands enjeux internationaux avec
  les partenaires qui partagent nos valeurs et nos objectifs. Il a attaché une attention
  particulière à la situation en Ukraine et au Moyen-Orient , dont les répercussions
  sur les cours mondiaux du pétrole et du gaz constituent un enjeu majeur. 22 septembre
  2026 - Seul le prononcé fait foi Madame la Présidente, Madame la Secrétaire générale
  adjointe, Mesdames et Majestés, Mesdames et Messieurs les Chefs d''État et de Gouvernement,
  Mesdames et Messieurs les Ministres, Mesdames et Messieurs les Ambassadrices, Ambassadeurs
  et délégués, chers amis. Depuis ce matin, ici se succèdent les discours qui disent
  l''état du monde. Et j''ai peur de manquer d''originalité en le décrivant. Chacun
  décrit en effet le retour de l''impérialisme, de l''arrogance, du retour à la force
  sans règle ni retenue. Un monde au fond de concentration du pouvoir où quelques-uns
  pensent qu''on peut battre en brèche l''ordre international pour élargir ses frontières,
  où d''autres pensent qu''on peut fouler au pied la souveraineté des peuples pour
  en disposer soi-même, et où quelques-uns pensent pouvoir décider de l''avenir de
  la planète, qu''il s''agisse du climat ou de l''intelligence artificielle. Au fond,
  la question qui nous est posée de manière très simple consiste à savoir si nous
  voulons vivre dans cet état de nature, avec une forme de retour de la loi de la
  jungle ou dans une société internationale civilisée. Notre devoir, plus que jamais,
  est de nous tenir droit aux côtés des Nations unies pour décider précisément ensemble
  de l''intérêt commun, c''est-à-dire du côté de ceux qui veulent choisir librement
  leur destin, leurs alliances, leurs modèles de développement, leur avenir, du côté
  de ceux qui refusent que leur souveraineté soit confisquée par la force injuste
  ou par la peur, et du côté de l''espoir. C''est la raison d''être de notre organisation,
  cette maison commune qui réunit les peuples libres, égaux, qui est fondée sur l''égalité
  souveraine de chacun de ses membres. C''est notre charte qui empêche que la puissance
  des uns leur permette de décider pour les autres. C''est elle surtout qui nous oblige
  à faire ensemble la démonstration de notre engagement et de notre capacité d''agir
  utilement. Vous savez, l''attachement de la France aux Nations unies et sa volonté
  d''assumer pleinement les responsabilités particulières que la charte lui confie.
  Je veux vous dire aussi l''engagement de mon pays à agir avec chacun d''entre vous
  pour renouveler les conditions de l''action multilatérale et faire la démonstration
  que nous sommes plus forts, plus efficaces, mieux capables de faire face ensemble
  aux défis communs. Ceux d''aujourd''hui et ceux qui viennent, qui nous échappent
  encore alors même que tout change autour de nous, j''évoquais le climat et l''environnement,
  c''est vrai aussi pour la guerre et la paix, c''est vrai évidemment pour les technologies
  comme pour le développement. Au fond, dans chacun de ces domaines, là où la loi
  du plus fort tente de s''imposer, il nous faut défendre la justice, l''intérêt commun
  et il faut le faire dans notre intérêt même à chacun, car c''est notre charte qui
  protège cette possibilité de vivre ensemble. Alors, face au cours du monde et au
  fait que ce que nous sommes en train de vivre aujourd''hui, c''est l''accumulation
  de guerres que nous n''arrivons pas à résoudre, de crises qui se multiplient et
  de défis contemporains qui viennent porter une ombre nouvelle sur les générations
  nouvelles, je crois que notre devoir, c''est de ne pas céder. Au fond, le message
  que je suis venu porter aujourd''hui, comme je le fais depuis neuf ans, c''est celui
  d''une détermination, d''un optimisme de l''action, mais c''est de vous dire ne
  cédons pas à l''esprit de défaite, à la fatalité, au fond à ce qui est à la mode,
  qui serait de nous résoudre à dire cette organisation, nous y venons pour faire
  des discours mais elle ne sert plus à grand-chose, mettons en place d''autres organisations
  où la loi du plus fort peut réussir et on peut peut-être imposer une autre paix.
  Mais ne cédons pas à cela, encore moins aujourd''hui qu''hier. N''y cédons pas à
  cinq égards. Ce sont les cinq remarques que je voudrais faire. La première, ne cédons
  pas à une forme de fatalité face à la guerre et au malheur des peuples. Nous devons
  nous réengager pour trouver des solutions concrètes et bâtir la paix. Le droit international
  n''a jamais prétendu décrire la réalité. Il dit les limites que des puissances souveraines
  se sont volontairement fixées. Pour que la force ne soit pas le seul recours en
  cas de désaccord, pour que même dans le face-à-face de la guerre, l''ennemi demeure
  un être humain. Ce sont les leçons du XXe siècle. Ceux qui veulent les oublier aujourd''hui
  commettent tout à la fois une faute morale et une erreur politique. Mais la réalité
  est là. Au Moyen-Orient, en Ukraine, en Afrique, l''industrialisation des crimes
  de guerre, des violations du droit et de la destruction des infrastructures civiles
  ouvrent un nouvel âge de la barbarie. Aucun d''entre nous ne peut vouloir être celui
  qui démantèle le cadre protecteur des conventions de Genève, alors que les attaques
  se multiplient de Dnipro à Gaza, de Bukavu à El Fasher, avec la Jordanie et le CICR.
  La France poursuivra donc ses efforts pour que l''initiative mondiale en faveur
  du droit international humanitaire, déjà rejointe par plus de 116 États, nous amène
  à renouveler ensemble nos engagements. Nous devons nous remobiliser pour défendre
  nos humanitaires, défendre le droit international humanitaire dans cette période.
  Comme nombre d''entre nous l''avons dit souvent, c''est aussi parce qu''il n''y
  a pas de paix sans justice que la France continue d''apporter un soutien à la fois
  politique et opérationnel aux mécanismes internationaux de justice, d''enquête,
  de collecte des preuves, notamment les missions d''établissement des faits, et que
  nous continuons et continuerons d''appuyer la Cour internationale de justice et
  son rôle central. Nous ne pouvons pas accepter le nouvel ordre de l''impunité que
  certains voudraient bâtir. C''est aussi pour cela qu''au Conseil de sécurité, la
  France soutient les réformes qui garantissent son efficacité. Sur le format, bien
  sûr, nous devons l''ouvrir à de nouveaux membres, à de nouvelles régions du monde,
  à commencer par l''Afrique, mais aussi sur le fond, le Conseil de sécurité doit
  pouvoir agir face à des violations massives du droit international. Qui peut se
  satisfaire d''une impasse procédurale face à la barbarie ? L''initiative franco-mexicaine
  d''encadrement du droit de véto en cas d''atrocité de masse est plus que jamais
  nécessaire, et je me félicite que 128 États membres la soutiennent désormais. La
  campagne doit continuer et permettre de l''emporter, donc obtenir l''engagement
  de chacun des membres permanents du Conseil de sécurité. Mais il ne suffit pas de
  convoquer le droit et d''invoquer nos valeurs pour satisfaire les obligations auxquelles
  nous avons chacun consenti en rejoignant les Nations unies. Notre devoir, c''est
  l''action. La France y est prête, en coalition avec tous ceux qui veulent agir dans
  le respect des principes de la Charte et qui n''acceptent pas l''impuissance. Ainsi,
  en Ukraine, la coalition des volontaires que nous avons formée avec le Royaume-Uni
  et l''Allemagne rassemble l''ensemble de ceux qui sont prêts à garantir la paix
  et la stabilité au cœur de l''Europe, là où deux guerres mondiales ont commencé
  et dont personne ne peut se désintéresser. Beaucoup ici savent mieux que quiconque
  ce que le retour de la guerre en Europe peut signifier. Nous n''y cèderons rien.
  La coalition des volontaires porte ce combat. Au Moyen-Orient, nous avons mis sur
  pied une coalition indépendante et multinationale pour restaurer la liberté de navigation
  dans le détroit d''Ormuz. Celle-ci ne doit pas être un objet de chantage. C''est
  un principe cardinal du droit international et il est dans l''intérêt de tous que
  les navires passent le détroit en toute sécurité et que l''approvisionnement énergétique
  de nos pays soit assuré. La réouverture du détroit d''Ormuz est une priorité. Le
  respect du droit international y est une priorité, c''est dans l''intérêt de tous
  et la France s''y engagera. En Afrique, nous portons une responsabilité collective
  face aux crises qui s''accumulent et aux réponses qui ne viennent pas. Au cœur des
  conflits, les opérations de paix doivent être plus efficaces et, pour cela, elles
  doivent disposer des moyens adéquats et s''inscrire dans une meilleure coordination
  entre les Nations unies et les États hôtes. J''évoquais déjà en 2018 le rôle des
  organisations régionales et l''organisation d''une meilleure coordination entre
  celles-ci et les Nations unies. Lors du sommet Africa Forward à Nairobi, avec plus
  de 30 chefs d''État africains, puis au siège de l''Union africaine à Addis-Abeba,
  aux côtés de l''ONU, nous l''avons dit clairement, l''Union africaine et les organisations
  régionales doivent être en capacité de jouer pleinement leur rôle en matière de
  paix et de sécurité sur le continent. Nous organiserons à Paris en novembre une
  réunion de reconstitution du fonds de paix de l''Union africaine, en marge du Forum
  de Paris sur la paix, et j''appelle tous les contributeurs potentiels à y prendre
  des engagements forts et concrets. Ne pas céder donc face aux guerres, nous réengager,
  chercher à bâtir dans le respect de la charte des solutions. Le deuxième principe,
  c''est de ne pas céder à la tentation permanente du double standard, car c''est
  celui qui divise notre planète et qui décrédibilise la cohérence de notre ordre
  international et de notre charte. Combien de fois avons-nous entendu que la souveraineté
  des peuples était valable en Europe, mais que, quand il s''agissait de regarder
  le Moyen-Orient ou l''Afrique, on pouvait bien s''en passer ? Non, nous devons défendre
  partout les mêmes principes et le faire dans le respect de la charte, c''est-à-dire
  de la souveraineté de ces mêmes peuples, jamais en nous substituant à eux. À chaque
  fois que quelques États, parfois au nom même de l''ordre international, ont voulu
  se substituer au peuple pour changer tel régime ou changer tel système, ils ont
  plongé ces États dans des chaos plus grands encore. Aucun double standard, une vie
  égale une vie, la paix et la sécurité sont indivisibles et tous y ont droit. En
  Ukraine, depuis près de cinq ans, la Russie poursuit une guerre cruelle contre les
  civils et occupe le territoire d''un pays souverain. La France continuera d''apporter
  un soutien sans faille aux aspirations légitimes du peuple ukrainien à la paix,
  à la sécurité et à l''avenir. Dans le même temps, elle ne ménagera aucun effort
  pour que s''engage au plus vite une négociation utile entre l''Ukraine et la Russie.
  Nous devons défendre les Ukrainiens et les défendre plus que jamais avant l''hiver
  qui s''annonce, les défendre en matière d''énergie, les défendre pour avoir davantage
  d''intercepteurs et protéger leur population civile. C''est aussi pour cela que
  nous soutenons l''initiative d''un double moratoire, un moratoire sur l''énergie
  et les infrastructures civiles de part et d''autre et un moratoire sur la mer Noire
  qui permettra de libérer les céréales et d''apporter une réponse à la question de
  sécurité alimentaire ô combien cruciale pour tant de pays émergents et en développement.
  Ce double moratoire est une nécessité. Proposons-le et mettons la Russie face à
  ses propres discours. Au Proche et Moyen-Orient, c''est encore le respect de la
  souveraineté de chacun qui peut seul amener la paix et la sécurité à tous et c''est
  ce que nous défendons. Respect de la souveraineté pour les Libanais déplacés et
  dont les villages sont détruits les uns après les autres dans le sud. Seul un Liban
  pleinement souverain pourra conduire à faire rendre les armes au Hezbollah et à
  rétablir la sécurité pour les Libanais et tous les voisins. Souveraineté du Liban
  et de son peuple. Souveraineté pour les Palestiniens dont les droits les plus élémentaires
  sont encore aujourd''hui bafoués. Il y a un an, ici même, nous étions une douzaine
  d''États à reconnaître la Palestine. J''entends le cynisme de certains « reconnaissance
  de papier, regardez la réalité ». Mais quelle est notre crédibilité si nous continuons
  de rester inactifs face à Gaza ? Certains se flattent d''une paix prétendue. Mais
  cette paix n''a pas rouvert une seule seconde les voies humanitaires. Devons-nous
  contempler ce spectacle qui nous fait honte à tous ? Jamais. Regardez ce qui se
  passe en Cisjordanie où chaque jour, des violations sont faites au nom de quoi ?
  Le Hamas n''a jamais sévi en Cisjordanie. C''est construire chaque jour l''impossibilité
  d''un projet qui est le respect des droits légitimes du peuple palestinien à exister.
  Mais c''est en même temps les conditions mêmes de la sécurité d''aujourd''hui et
  de demain pour Israël et son peuple. Sécurité à laquelle nous sommes attachés, existence
  à laquelle nous sommes attachés. Mais tous ceux qui prétendent que la sécurité d''Israël
  passe par la violation de la souveraineté de tous ses voisins font une erreur funeste,
  affaiblissent la sécurité d''Israël pour aujourd''hui et pour demain et la menace.
  Souveraineté aussi pour la Syrie dont la révolution ne doit pas être déçue. J’étais
  il y a quelques mois à Damas pour apporter le soutien de la France à la construction
  de la Syrie libre. Et nous devons poursuivre ces efforts et là aussi permettre à
  la Syrie de restaurer pleinement sa souveraineté et son unité. La France est engagée
  dans chacun de ces combats. Comme nous sommes engagés avec l’Italie, avec l’aide
  de la Jordanie et de quelques autres, et de tous les amis du Liban, pour trouver
  une suite efficace à notre engagement d’un demi-siècle au sein de la FINUL, au service
  de tous les Libanais et de la souveraineté de leur pays. Pas de double standard,
  donc. Souveraineté des peuples partout. Ma troisième conviction, c’est que nous
  ne devons pas céder à la division du monde et à cette fracture que beaucoup décrivent,
  que certains utilisent, entre le Nord et le Sud. Nous ne réglerons aucun des défis
  de la planète si nous laissons cette division s’installer. Alors, elle s’installe,
  elle se nourrit du double standard quand il est pratiqué par certains, mais nous
  avons besoin de réconcilier le Nord et le Sud pour répondre aux défis, qu’il s’agisse
  du climat, de la santé, du développement. C’est à ce titre que nous avons, ces dernières
  années, multiplié les initiatives face au Covid, avec les initiatives ACT-A et COVAX,
  en partenariat avec l’Organisation mondiale de la santé et l’Union africaine, lorsqu’il
  s’agit de relancer les économies avec le Fonds monétaire international pour réallouer
  des droits de tirage spéciaux et permettre de mieux financer les économies africaines.
  Et nous avons tenu parole en réallouant plus de 100 milliards de dollars de droits
  de tirage pour aider les pays africains. Mais nous devons constamment veiller à
  garder l’unité et ne pas opposer les blocs. C’est pourquoi il est si important de
  ne pas laisser se fracturer l’architecture mondiale de la santé. Nous devons continuer
  d’avancer sur sa réforme, mais en n’affaiblissant jamais l’Organisation mondiale
  de la santé, en permettant de finaliser le traité pandémie et en soutenant l’OMS
  et Africa CDC pour lutter encore plus efficacement contre Ebola. Nous devons aussi
  savoir lucidement réformer notre aide publique au développement et bâtir un investissement
  solidaire beaucoup plus efficace. C’est le sens de ce que nous avons fait en 2023
  avec le Pacte pour la prospérité, les peuples et la planète. C’est le sens de l’initiative
  prise à Nairobi il y a quelques mois lors du sommet Africa Forward : bâtir un nouveau
  consensus de l’investissement solidaire. Là où tant de pays sont en train de réduire
  leurs transferts et pourtant où les besoins de nombre de pays du Sud augmentent,
  nous devons aller plus vite et plus fort pour aider le FMI et la Banque mondiale
  à avoir plus d’efficacité, à améliorer l’efficacité de leurs instruments, à mieux
  mobiliser le secteur privé, à bâtir des mécanismes de garantie pour que, dans les
  pays émergents, les pays à revenus intermédiaires et les pays en développement,
  nous puissions apporter une réponse plus efficace. C’est ce partenariat nouveau
  financier qu’il nous faut bâtir pour éviter la fracture entre le Nord et le Sud.
  De la même manière, ce partenariat Nord-Sud passe et passera par notre capacité
  à réouvrir des dialogues sur nos histoires communes, nos mémoires et nos relations
  culturelles. C’est ce que la France a cherché à faire ces dernières années par un
  travail de connaissance et de reconnaissance sur la base de travaux scientifiques
  conjoints, en lançant un processus législatif qui nous a permis d’enclencher la
  restitution des biens culturels, d’avoir là aussi, en quelque sorte, un partenariat
  de mémoire, de culture, d’histoire avec nombre des pays du Sud. Et nous poursuivons,
  avec le Ghana notamment, mais aussi avec tous les partenaires qui le souhaitent,
  le travail pour répondre aux besoins de justice réparatrice qui a été formulé. C’est
  une question de respect et c’est sur ce respect aussi que se bâtit la réunion du
  Nord et du Sud. Au-delà des politiques de développement et de mémoire, de nouveaux
  partenariats impliquent aussi d’avoir une mondialisation, un commerce mondial plus
  efficace et plus équitable. C’est ce que nous avons cherché à faire lors du G7,
  organisé par la France, en associant plusieurs pays du Sud, en bâtissant à travers
  le sommet des convergences un dialogue au-delà du G7 avec la Chine, l’Inde, le Brésil,
  la Corée, le Kenya et j’en passe, pour permettre d’améliorer notre organisation
  collective, d’éviter l’accumulation par quelques-uns des minerais critiques et des
  terres rares, et de permettre une coopération plus efficace en matière de commerce
  qu’en matière monétaire. Au fond, vous le comprenez, nous avons une responsabilité
  pour ne pas laisser s’installer cette fracture entre deux blocs. Le quatrième principe,
  c’est de ne pas céder à la fatalité en matière de climat et de biodiversité. Nous
  avons beaucoup fait ces dernières années, depuis les accords de Paris, il y a onze
  ans, dont les principes restent valables, dont les accords sont à défendre et dont
  nous ne devons pas dévier. Mais j’entends comme vous le doute qui naît chez certains,
  la remise en cause de la science chez d’autres, et donc, là aussi, ne cédons rien.
  Si nous voulons répondre aux défis de la planète, ceux du climat, de la biodiversité,
  nous avons besoin du multilatéralisme d’action. C’est ce que nous avons cherché
  à faire à travers les One Planet Summit. C’est ce que nous avons aussi cherché à
  faire collectivement, et réussi, si on regarde la question des océans. Il y a quelques
  années, tout le monde nous disait qu’il était impossible de bâtir des accords pour
  protéger nos aires marines, nos océans. Regardez ce que nous avons fait il y a quelques
  années : protéger 30% de notre espace terrestre et de nos mers. Nous avons bâti
  cet accord, nous améliorons chaque année sa mise en œuvre. Et puis, beaucoup nous
  disaient que nous n’arrivions jamais, au fond, à préserver ce qui représente plus
  des deux tiers de nos océans, la haute mer, au-delà de nos zones économiques exclusives.
  Nous avons réussi à mener cette négociation en engageant, là aussi, les grandes
  puissances. Ce fut l’accord BBNJ, et en quelques mois, nous avons finalisé les plus
  de 60 ratifications, ce qui fait que cet accord, aujourd’hui, est en œuvre. Le sommet
  de Nice, rassemblant les nations pour l’UNOC 3 en juin de l’année dernière, a permis
  d’accélérer ce travail, plus quelques autres réalisations, et la première COP sur
  les océans se tiendra dans quelques mois, en janvier. C’est une formidable preuve
  de notre capacité à avoir des résultats concrets lorsque nous nous mobilisons et
  agissons ensemble. Et donc, ne cédons rien à la fatalité du moment. Défendons nos
  acquis, mais défendons aussi nos principes. Nous devons défendre la science indépendante
  et libre. Protégeons le GIEC, l’IPBES, nos scientifiques qui nous alertent, qui
  mesurent, qui évaluent. Restons attachés aux accords de Paris, à nos trajectoires
  nationales, à notre décarbonation et à l’objectif de neutralité carbone à 2050.
  Prenons nos responsabilités, accélérons les coopérations, l’innovation, relançons
  le travail sur le crédit biodiversité et mettons en œuvre nos objectifs sur la protection
  des forêts et des océans. Il n’y a aucune fatalité que des décisions à prendre pour
  nous, dès aujourd’hui, qui sommes déjà les victimes du dérèglement climatique, et
  plus encore pour nos enfants. Enfin, ne cédons rien à l’état du monde qui est en
  train d’émerger sur l’intelligence artificielle, et par lequel quelques-uns voudraient
  nous faire croire que seules deux puissances, les États-Unis et la Chine, pourraient
  décider, ou plus exactement que quelques acteurs économiques pourraient décider
  de tout : décider des innovations qu’ils veulent faire, décider les uns de faire
  une pause, les autres non, décider de savoir si les innovations qu’ils feront viendront
  attenter à la sécurité nationale de nos États, pourront demain permettre d’attaquer
  nos hôpitaux ou nos banques, et décider aussi de ce que sera l’avenir de nos sociétés.
  Non, non. Et nous ne découvrons pas cela. Dès 2018, au sein du G7, avec nos amis
  canadiens, nous avons lancé le Partenariat mondial pour l’intelligence artificielle,
  adossant cette structure à l’OCDE pour commencer la discussion et la nécessité de
  régulation. Lors du Sommet pour l’action sur l’intelligence artificielle organisé
  à Paris en 2025, poursuivi par l’Inde en 2026, et qui se tiendra en Suisse l’année
  prochaine, nous avons plaidé pour deux éléments très simples. Que chaque région
  du monde puisse se doter de ses capacités propres, de calculs, de modèles LLM, d’écosystèmes
  d’intelligence artificielle, et pour que nous puissions développer la possibilité
  d’auditer ces modèles et de ne pas être dépendants simplement de quelques acteurs
  privés. L’Europe, d’ailleurs, a été la première, avec l’AI Act, à bâtir ses principes
  et en particulier la capacité à auditer ces modèles. Nous devons poursuivre sur
  cette voie. Et à cet égard, je veux ici insister sur un point. Notre jeunesse et
  nos enfants. Nous avons trop tardé à protéger nos enfants et nos adolescents des
  réseaux sociaux. Partout dans nos sociétés, nous voyons les conséquences. Baisse
  de la capacité à apprendre, épidémie d’obésité chez les uns, de troubles de la santé
  mentale chez les autres. Les constats sont là et les éléments de corrélation sont
  bien établis. C’est pourquoi nous avons lancé à quelques-uns une grande initiative
  pour protéger nos enfants et nos adolescents de l’accès aux réseaux sociaux avant
  15 ans ou 16 ans, selon les pays. Et l’Europe a suivi maintenant ce pas, qui a décidé
  de lancer une régulation. Et je veux saluer ici le caractère pionnier des Australiens
  qui ont été les premiers à légiférer en la matière. Nous allons poursuivre jusqu’au
  bout ce combat. Mais n’attendons pas les mêmes conséquences quand il s’agira de
  l’intelligence artificielle. Dès maintenant, nous devons protéger nos enfants et
  nos adolescents à cet égard. Regardez l’impact des chatbots sur nos enfants. C’est
  pourquoi nous avons réuni avec le Kenya, l’Espagne, l’Australie, la Coalition pour
  les droits et la protection des enfants à l’ère de l’intelligence artificielle.
  Dès cet après-midi, nous la mobilisons. Et le Forum de Paris sur la paix sera le
  lieu où, les 10 et 11 novembre prochains, nous voulons réunir l’ensemble des gouvernements,
  l’ensemble des organisations, l’ensemble des acteurs publics, privés, des entreprises
  et des académiques qui veulent accélérer cet agenda de protection de nos enfants.
