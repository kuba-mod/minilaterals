  acquis, mais défendons aussi nos principes. Nous devons défendre la science indépendante
  et libre. Protégeons le GIEC, l’IPBES, nos scientifiques qui nous alertent, qui
  mesurent, qui évaluent. Restons attachés aux accords de Paris, à nos trajectoires
  nationales, à notre décarbonation et à l’objectif de neutralité carbone à 2050.
  Prenons nos responsabilités, accélérons les coopérations, l’innovation, relançons
  le travail sur le crédit biodiversité et mettons en œuvre nos objectifs sur la protection
  des forêts et des océans. Il n’y a aucune fatalité que des décisions à prendre pour
  nous, dès aujourd’hui, qui sommes déjà les victimes du dérèglement climatique, et
  plus encore pour nos enfants. Enfin, ne cédons rien à l’état du monde qui est en
  train d’émerger sur l’intelligence artificielle, et par lequel quelques-uns voudraient
  nous faire croire que seules deux puissances, les États-Unis et la Chine, pourraient
  décider, ou plus exactement que quelques acteurs économiques pourraient décider
  de tout : décider des innovations qu’ils veulent faire, décider les uns de faire
  une pause, les autres non, décider de savoir si les innovations qu’ils feront viendront
  attenter à la sécurité nationale de nos États, pourront demain permettre d’attaquer
  nos hôpitaux ou nos banques, et décider aussi de ce que sera l’avenir de nos sociétés.
  Non, non. Et nous ne découvrons pas cela. Dès 2018, au sein du G7, avec nos amis
  canadiens, nous avons lancé le Partenariat mondial pour l’intelligence artificielle,
  adossant cette structure à l’OCDE pour commencer la discussion et la nécessité de
  régulation. Lors du Sommet pour l’action sur l’intelligence artificielle organisé
  à Paris en 2025, poursuivi par l’Inde en 2026, et qui se tiendra en Suisse l’année
  prochaine, nous avons plaidé pour deux éléments très simples. Que chaque région
  du monde puisse se doter de ses capacités propres, de calculs, de modèles LLM, d’écosystèmes
  d’intelligence artificielle, et pour que nous puissions développer la possibilité
  d’auditer ces modèles et de ne pas être dépendants simplement de quelques acteurs
  privés. L’Europe, d’ailleurs, a été la première, avec l’AI Act, à bâtir ses principes
  et en particulier la capacité à auditer ces modèles. Nous devons poursuivre sur
  cette voie. Et à cet égard, je veux ici insister sur un point. Notre jeunesse et
  nos enfants. Nous avons trop tardé à protéger nos enfants et nos adolescents des
  réseaux sociaux. Partout dans nos sociétés, nous voyons les conséquences. Baisse
  de la capacité à apprendre, épidémie d’obésité chez les uns, de troubles de la santé
  mentale chez les autres. Les constats sont là et les éléments de corrélation sont
  bien établis. C’est pourquoi nous avons lancé à quelques-uns une grande initiative
  pour protéger nos enfants et nos adolescents de l’accès aux réseaux sociaux avant
  15 ans ou 16 ans, selon les pays. Et l’Europe a suivi maintenant ce pas, qui a décidé
  de lancer une régulation. Et je veux saluer ici le caractère pionnier des Australiens
  qui ont été les premiers à légiférer en la matière. Nous allons poursuivre jusqu’au
  bout ce combat. Mais n’attendons pas les mêmes conséquences quand il s’agira de
  l’intelligence artificielle. Dès maintenant, nous devons protéger nos enfants et
  nos adolescents à cet égard. Regardez l’impact des chatbots sur nos enfants. C’est
  pourquoi nous avons réuni avec le Kenya, l’Espagne, l’Australie, la Coalition pour
  les droits et la protection des enfants à l’ère de l’intelligence artificielle.
  Dès cet après-midi, nous la mobilisons. Et le Forum de Paris sur la paix sera le
  lieu où, les 10 et 11 novembre prochains, nous voulons réunir l’ensemble des gouvernements,
  l’ensemble des organisations, l’ensemble des acteurs publics, privés, des entreprises
  et des académiques qui veulent accélérer cet agenda de protection de nos enfants.
  Et je vous donne rendez-vous le 10 et 11 novembre prochain à Paris à cet égard.
  Au-delà de cela, nous voyons bien la course au modèle frontière qui est lancée.
  Nous devons continuer d’investir, chacun dans nos géographies, pour y participer,
  et la France est fière d’avoir un acteur qui est dans la compétition des modèles
  frontières, et nous allons continuer d’investir, d’accompagner Mistral AI pour pouvoir
  tenir notre rang et essayer d’avoir un tel modèle. Mais nous devons aussi bâtir
  des coopérations nouvelles. Et je souhaite très profondément que tous les États
  souverains attachés à leur indépendance, européens, canadiens, brésiliens, indiens,
  indonésiens, africains, États du Golfe, Singapour et j’en passe, cette coalition
  des indépendants que j’ai plusieurs fois évoquée, ceux au fond qui ne veulent pas
  devenir les vassaux de l’un ou l’autre des deux grandes puissances mondiales, se
  mettent ensemble pour développer un modèle frontière open source, en mutualisant
  les capacités de calcul qui sont à leur disposition, en mutualisant leurs capacités
  d’investissement pour bâtir un modèle frontière d’intelligence artificielle en open
  source que nous partagerions. Nous ne devons pas dépendre de l’un ou de l’autre
  et nous devons réussir à pousser justement un tel agenda par la coopération. Enfin,
  il est des domaines sur lesquels nous devons clairement établir les nouvelles règles
  du jeu. L’intelligence artificielle dans le spatial, dans la défense, dans la cybersécurité,
  comme je l’évoquais, a des conséquences profondes qui touchent notre sécurité nationale.
  Nous avons lancé ce dialogue lors du G7 de juin dernier à Évian. Plusieurs se sont
  aujourd’hui mobilisés, et nous soutenons l’appel qui a été lancé par nos amis norvégiens
  et finlandais, et nous voulons continuer, dans le cadre du G7, en lien aussi étroit
  avec nos amis britanniques qui auront l’année prochaine la responsabilité du G20,
  à bâtir justement un agenda de coopération en matière d’intelligence artificielle,
  pour protéger les éléments les plus sensibles qui touchent notre sécurité nationale.
  Comme nous avons, par le passé, su nous mettre d’accord pour bâtir une architecture
  internationale nouvelle, quand il s’agissait des armes chimiques ou d’autres risques,
  nous devons acter qu’émergent aujourd’hui des sujets, quand il s’agit du spatial,
  de la défense, de la cybersécurité, sur lesquels nous devons reprendre le contrôle,
  qui imposent des coopérations spécifiques et un cadre spécifique entre États membres,
  et nous devons bâtir cette coopération et ce cadre. Là-dessus, nous ne devons rien
  céder. Voilà les cinq principes d’action, et je ne suis à cet égard pas exhaustif,
  mais je vais m’arrêter là, auxquels la France croit et que je voulais aujourd’hui
  défendre devant vous. Et au fond, sur ces cinq points, mon message est de ne rien
  céder. Ne rien céder à ce qui est en train de s’installer, qui est, au fond, une
  lente division du monde, un esprit de défaite qui s’installe et qui laisserait quelques-uns
  dans l’abus de pouvoir : abus de pouvoir des empires qui menacent la souveraineté
  des uns ou des autres, abus de pouvoir de quelques-uns qui concentrent les capacités
  capitalistiques et qui auraient le droit ou de polluer ou d’agréger les capacités
  de calcul pour tous, abus de pouvoir de quelques-uns qui voudraient concentrer les
  richesses. Face aux abus de pouvoir, nous devons retrouver ce qu’est la vitalité
  de notre organisation, ce multilatéralisme qui est la défense d’un intérêt commun,
  d’une justice pour tous, et qui est, au fond, par l’unité, la justice et la coopération,
  de retrouver la seule efficacité, celle qui permet de rétablir une paix juste et
  durable dans nos pays, celle qui permet de retrouver l’unité entre le Nord et le
  Sud, celle qui permet de rebâtir un agenda d’action en matière de climat comme en
  matière technologique. Ne cédons rien. Plus que jamais, nous avons besoin de nos
  Nations unies. Et à l’heure où nous procédons au choix de notre secrétaire général,
  et je veux rendre ici hommage à l’action d’António Guterres durant toutes ces années,
  dans ce climat si dur, il n’a jamais rien cédé. À cette heure où nous avons à affronter
  des crises anciennes et des défis nouveaux, nous devons, en effet, continuer d’agir.
  Aujourd’hui plus que jamais. Nous devons avoir le courage d’être optimistes, de
  nous mobiliser et d’être utiles, de ne rien céder à l’esprit du temps pour toutes
  et pour tous. Le chef de l''État a ensuite participé à une réunion de haut niveau
  de la coalition pour les droits et la protection de l’enfance à l’ère de l’IA .
  La France, l''Espagne, le Kenya et l''Australie, en tant que coprésidents, ont présenté
  une feuille de route soutenue par 26 États et huit entités des Nations unies. Lancement
  de la feuille de route de la coalition pour les droits et la protection de l’enfance
  à l’ère de l’intelligence artificielle.'
