title: Déclaration internationale sur les données scientifiques spatiales.
text: 'Signatures : Allemagne, Angola, Arabie saoudite, Arménie, Australie, Autriche,
  Bahreïn, Belgique, Brésil, Bulgarie, Cambodge, Chili, Chypre, Costa Rica, Croatie,
  Danemark, Équateur, Espagne, Estonie, Géorgie, Grèce, Hongrie, Irlande, Islande,
  Israël, Italie, Kazakhstan, Lettonie, Lituanie, Luxembourg, Madagascar, Malte, Maurice,
  Mexique, Monaco, Norvège, Nouvelle-Zélande, Pays-Bas, Philippines, Pologne, République
  de Corée, Roumanie, Royaume-Uni, Rwanda, Serbie, Slovaquie, Slovénie, Suède, Suisse,
  Tunisie, Turquie, Agence spatiale européenne. Les données scientifiques spatiales,
  provenant de satellites d’observation de la Terre ou de l’Univers, revêtent aujourd’hui
  une importance capitale. Qu’il s’agisse d’explorer l’Univers ou de surveiller la
  Terre, ces données contribuent au progrès des connaissances humaines et donnent
  aux scientifiques ainsi qu’aux responsables politiques et aux citoyens une perspective
  inédite sur notre monde et une compréhension sans précédent de celui-ci. Pour produire
  des informations et des connaissances pertinentes et les transmettre, les scientifiques
  ont besoin de données scientifiques spatiales de grande qualité et à long terme
  qui soient accessibles et disponibles partout dans le monde, aussi ouvertes que
  possibles afin d’être utilisables par toute personne compétente, et dignes de confiance
  (c’est-à-dire fiables et résilientes) grâce à la garantie de leur intégrité. La
  présente déclaration vise à affirmer la nécessité de données scientifiques spatiales
  qui pourront être utilisées partout dans le monde et à sensibiliser à cette nécessité,
  à l’heure où la collaboration dans le domaine des sciences est essentielle pour
  comprendre notre planète et notre Univers. Réunis pour réaffirmer que l’utilisation
  scientifique des données spatiales, à un moment de profonde transformation des secteurs
  de l’espace et des données, est une priorité commune ; Reconnaissant l’importance
  croissante des données spatiales dans les domaines des sciences et des connaissances,
  la gestion des ressources naturelles, la gestion des catastrophes et les réactions
  d’urgence, la sécurité, ainsi que pour le développement humain durable et les objectifs
  internationaux qui y sont liés ; Reconnaissant le rôle crucial de l’accessibilité,
  de l’ouverture, de l’interopérabilité et de l’intégrité des données dans la promotion
  de l’innovation, de la transparence et d’une coopération internationale équilibrée ;
  Affirmant notre soutien aux principes selon lesquels les données doivent être faciles
  à trouver, accessibles, interopérables et réutilisables (principes FAIR) ainsi qu’à
  l’intégrité des données ; Soulignant que la recherche, l’innovation et l’éducation
  constituent des vecteurs essentiels de progrès dans les domaines exploitant des
  données scientifiques spatiales, indispensables pour nous permettre de répondre
  aux problématiques mondiales, que le déploiement stratégique de la science de l’espace
  et des données qui en sont issues dépendent d’écosystèmes de recherche solides,
  soutenus par le développement de capacités appropriées et la formation de scientifiques,
  d’ingénieurs et d’opérateurs très qualifiés, capables de faire progresser les connaissances
  et de développer des solutions durables ; Sommes convenus des valeurs et des priorités
  communes ci-après. Nous affirmons que les données scientifiques spatiales seront
  accessibles à tous, sans discrimination, sauf exception justifiée (par exemple pour
  des raisons de sécurité nationale, de sûreté publique, de défense ou de protection
  des données à caractère personnel). À cette fin, et en tant que de besoin, nous
  encourageons l’élaboration de normes ouvertes et de formats communs pour faciliter
  l’échange et la réutilisation de données, ainsi que le développement de plateformes
  internationales ouvertes pour l’accès aux données, leur stockage et leur diffusion.
  Nous soulignons qu’il est nécessaire d’utiliser des licences ouvertes pour encourager
  la réutilisation et la diffusion. Les données seront par conséquent publiées conformément
  aux principes susmentionnés et, lorsque cela est possible et approprié, sous forme
  de données ouvertes pour encourager leur réutilisation et leur diffusion. Cela suppose
  également de consigner de manière détaillée les méthodes de collecte, de traitement
  et de validation des données, avec des métadonnées complètes, exactes et accompagnées
  d’une licence claire définissant les dispositions s’appliquant à la réutilisation
  des données. Nous soulignons que les données scientifiques spatiales doivent être
  intègres, ce qui suppose de mettre en place, en tant que de besoin, des systèmes
  de traçabilité et de gestion de versions pour garantir l’authenticité et l’intégrité
  des données, leur protection contre la falsification grâce à l’utilisation de technologies
  de vérification et de protocoles de validation indépendants, ainsi que leur gestion
  responsable. Les utilisateurs sont encouragés à ne pas modifier les ensembles de
  données originaux sans préserver leur provenance ou la déclaration de leur propriété.
  Nous reconnaissons que fournir toutes les données appropriées à la communauté scientifique
  est une responsabilité collective et que tous les acteurs doivent produire, acquérir
  et partager des données sur la base de la réciprocité. Nous nous engageons à renforcer
  la collaboration multilatérale, la réciprocité, la transparence et la diffusion
  des informations qui en découlent en harmonisant les normes, les formats et les
  protocoles d’échange et de partage de données. Les initiatives et les programmes
  de recherche existants doivent être soutenus et élargis pour tirer le meilleur parti
  des données scientifiques spatiales et améliorer le développement des capacités
  et des compétences. Nous affirmons par conséquent notre détermination collective
  à promouvoir des données scientifiques spatiales accessibles et ouvertes, dont l’intégrité
  est protégée, tout en reconnaissant que ces données doivent être utilisées dans
  des conditions adaptées. Nous invitons tous les acteurs (États, institutions, entreprises,
  chercheurs) à signer la présente déclaration. Nous proposons des révisions périodiques
  pour adapter la présente déclaration aux évolutions sociétales, technologiques et
  scientifiques.'
