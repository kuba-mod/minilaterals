date: '2026-09-10'
type: press_release
source_name: elysee
title: Visite officielle de Tô Lâm, Président de la République socialiste du Vietnam.
text: Le Président de la République a reçu Tô Lâm, Président de la République socialiste
  du Vietnam, le jeudi 10 septembre 2026 au Palais de l’Élysée, à l’occasion de sa
  visite officielle en France et de sa participation au Sommet international sur l’Espace.
  Dans la continuité de la visite d’État du Président de la République à Hanoï en
  mai 2025, cette rencontre a permis d’accélérer la mise en œuvre du partenariat stratégique
  global et de développer les coopérations entre la France et le Vietnam, dans l’objectif
  de renforcer nos autonomies stratégiques respective s. Les deux dirigeants ont abordé
  la situation internationale, en Ukraine, au Proche et au Moyen-Orient, ainsi que
  les enjeux régionaux, notamment en mer de Chine méridionale et au sein de l’ASEAN.
  10 septembre 2026 - Seul le prononcé fait foi Monsieur le Secrétaire général, cher
  président Tô Lâm, Mesdames, Messieurs les ministres, Messieurs les ambassadeurs,
  Mesdames, Messieurs en vos grades et qualités, chers amis. Bravo pour ces signatures
  d'accords qui montrent la vitalité de la relation bilatérale et, au-delà de celle-ci,
  des discussions que nous allons avoir, je voulais vous dire, Monsieur le secrétaire
  général du Parti communiste vietnamien, président de la République socialiste du
  Vietnam, cher Tô Lâm, la joie que nous avons de vous accueillir à Paris pour cette
  visite d'État. Le président Tô Lâm a participé au Sommet international sur l'espace
  ce matin, effectue son deuxième déplacement en France en deux ans. En octobre 2024,
  nous avions rehaussé les relations entre la France et le Vietnam au niveau d'un
  partenariat stratégique global. Puis, en mai 2025, ma propre visite d'État à Hanoï
  avait soutenu son approfondissement autour des principes de souveraineté, d'autonomie,
  de confiance stratégique. Et, Président, vous voilà aujourd'hui en France pour cette
  visite d'État qui nous permet de consolider des résultats nouveaux, dans tous les
  domaines. Ce rythme soutenu dans nos échanges est inédit et témoigne de la dynamique
  de ce partenariat qui est aussi un levier pour accompagner les objectifs ambitieux
  que le Vietnam s'est fixés pour sa nouvelle ère de développement et contribuer à
  nos autonomies stratégiques respectives. Nous avons décidé de faire de la défense
  un pilier de ce partenariat. Notre relation est en plein essor. Je pourrais ici
  multiplier les exemples, mais je n'en citerai que quelques-uns. La sécurité maritime
  d'abord. La Marine nationale a multiplié ces derniers mois les escales dans les
  ports vietnamiens et nous agissons ensemble pour réaffirmer l'importance de la liberté
  de navigation dans l'Indopacifique. Le rapprochement aussi entre nos industriels,
  étroitement associés à cette visite, va donner une base solide au développement
  de nos bases industrielles et technologiques de défense et contribuer à la sécurité
  des frontières maritimes vietnamiennes. À cet égard, nous nous réjouissons de l'aboutissement
  prochain de la lettre d'intention de 2025 portant sur l'achat de trois hélicoptères
  NH90 à Airbus Helicopters. Nos liens économiques sont aussi dynamiques. Nous venons
  de le voir tout à l'heure, nous conclurons ensemble les travaux du deuxième Haut
  Conseil d'affaires franco-vietnamien, qui se tient en ce moment même. Et face à
  la remise en question du commerce international, fondé sur des règles, nous nous
  engageons résolument en faveur de la mise en œuvre de l'accord de libre-échange
  entre l'Union européenne et le Vietnam. Et la ratification prochaine de l'accord
  de protection des investissements entre l'Union européenne et le Vietnam ouvrira
  justement de nouvelles perspectives. Les coopérations industrielles entre nos entreprises
  sont multiples et dans tous les secteurs clés pour construire cette autonomie stratégique.
  C'est le cas dans le secteur spatial, et je vous remercie d'avoir fait confiance
  à la France pour l'acquisition d'un satellite d'observation terrestre qui contribuera
  à la souveraineté du Vietnam. C'est vrai en matière d'aéronautique, avec d'importants
  accords signés aujourd'hui par Airbus et par Thales avec leurs partenaires vietnamiens,
  qui démontrent l'approfondissement de cette coopération. C'est aussi vrai en matière
  de minerais critiques, où nous signons un accord sur les terres rares et minerais
  critiques, et une coopération en la matière, secteur où la France a une expertise
  mondialement reconnue et où nous voulons avancer avec vous. Dans le domaine énergétique,
  nous avons confirmé notre souhait que la France soit un partenaire de référence
  de la décarbonation et en particulier du programme électronucléaire vietnamien,
  nous y reviendrons, tant sur le volet industriel que sur la sûreté et la formation.
  En matière d'infrastructures de transport, nous coopérons déjà sur le métro de Hanoï,
  et sommes prêts à contribuer au grand programme de mobilité urbaine de votre pays
  ainsi qu'à la modernisation du réseau ferroviaire, en particulier au projet structurant
  de ligne à grande vitesse reliant le nord et le sud du pays. Et à cet égard, je
  me réjouis de la conclusion d'un accord entre Alstom et Vingroup. Nous nous engageons
  aussi, via, nous l'avons vu, le soutien important de l'AFD, à la création d'un institut
  ferroviaire, entre autres missions. Nous nous projetons également, nous l'avons
  évoqué à l'instant ensemble, dans le futur à travers les technologies de rupture,
  notamment en matière d'intelligence artificielle et de quantique, à l'image de l'accord
  stratégique entre Thales et Gtel. Et je sais à quel point, M. le Président, vous
  accordez de l'importance aux sciences et à l'innovation. Et je me réjouis d'ailleurs
  demain de votre visite à Saclay, dans l'une des meilleures universités du monde,
  et un pôle de recherche et d'excellence et d'enseignement supérieur en France. Et
  l'adoption durant votre visite d'un programme de recherche scientifique conjointe,
  Hubert Curien, s'inscrit dans cette logique. Je salue enfin le rôle de Paris Europlace
  pour accompagner le développement du Centre financier international de Da Nang,
  qui bénéficiera ainsi d'une expertise et des standards de haut niveau. Nous voyons,
  en matière bilatérale, tous les domaines sont couverts, et je n'ai pas été exhaustif,
  qui montrent la vitalité de ces accords. Notre coopération se traduit également
  à travers l'engagement de l'Agence française de développement dans la mise en œuvre
  du partenariat pour une transition énergétique juste et la mise en œuvre de cette
  décarbonation que j'évoquais. Et en matière de santé, l'accord qui a été signé par
  nos ministres le montre, nous renforçons, nous formalisons un partenariat, mais
  si je puis dire, la santé est sans doute l'un des domaines emblématiques de l'amitié
  franco-vietnamienne. Et depuis des décennies, nous opérons, nous aidons, nous formons,
  et c'est une grande fierté pour notre pays. Nous devons aussi porter la plus grande
  attention à la reprise de la mobilité étudiante entre nos deux pays. Cela passe
  notamment par un soutien à l'enseignement du français au Vietnam dans un contexte
  où le sommet de la francophonie se tiendra à nouveau en Asie du Sud-Est pour la
  première fois depuis 20 ans, en novembre 2026. Et nous nous y reverrons. Et naturellement,
  nous accueillerons aussi, avec plaisir, les jeunes Vietnamiens non francophones,
  pour des cursus en anglais, qui seront l'occasion pour eux d'apprendre en plus le
  français, mais j'ai eu l'occasion de le rappeler à vos étudiants dans ma visite
  d'État il y a un peu plus d'un an. Vous le voyez, le partenariat que nous avons
  impulsé est fructueux pour nos deux pays. Et au fond, il s'appuie sur une même vision
  du monde. En 2025, j'ai pu m'exprimer au dialogue de Shangri-La. Vous vous êtes
  exprimé il y a quelques mois là-bas aussi. Je crois que nous avons, ensemble, affirmé
  une même vision. Nous ne voulons être les vassaux de qui que ce soit. Nous voulons
  rester des nations indépendantes, défendre notre autonomie stratégique et, ce faisant,
  avoir des partenaires de confiance, prévisibles, stables, loyaux. C'est ce que la
  France veut être pour le Vietnam et c'est ce que nous voulons faire avec vous. C'est
  ce que j'avais pu nommer, cette coalition des indépendants entre l'Europe et l'Asie.
  Et c'est exactement ce que nous voulons faire, précisément avec votre aide et notre
  travail conjoint, par la résolution, justement, par l'amélioration et l'approfondissement
  de nos liens, entre l'Europe et l'ASEAN, mais également entre l'Union européenne
  et le partenariat transpacifique CPTPP dont le Vietnam assure la présidence. Nous
  souhaitons renforcer ces liens économiques, technologiques, sécuriser la souveraineté
  de nos chaînes de production et, ce faisant, acter le fait que cette convergence
  de vues est la clé pour défendre nos indépendances face aux velléités impérialistes
  ou hégémoniques. Et puis nos convergences de vues, notre conviction partagée de
  l'existence d'une troisième voie animeront les échanges que nous aurons aussi sur
  les crises internationales où nos deux pays veulent œuvrer pour plus de stabilité
  et de sécurité collective. C'est exactement ce que nous défendons ensemble, au Proche
  et Moyen-Orient, restaurer la liberté de navigation, retrouver un cadre de stabilité ;
  c'est ce qui est aussi défendu en Ukraine, retrouver le respect de la souveraineté,
  de la stabilité et ne céder à aucune velléité impérialiste. Évidemment, sur tous
  ces sujets, nous aurons l'occasion de revenir dans nos échanges et nos réunions
  avec Monsieur le secrétaire général, Monsieur le président. La montée des tensions
  également en mer de Chine méridionale, la guerre civile birmane, le conflit frontalier
  entre le Cambodge et la Thaïlande sont autant de menaces en Asie du Sud-Est qui
  appellent notre vigilance. Et nous évoquerons ensemble les moyens de travailler
  conjointement à ces crises dans le cadre du dialogue soutenu que nous entretenons
  entre nos deux pays, mais aussi avec l'ASEAN et ses États membres. Voilà, Mesdames
  et Messieurs, ce que je voulais, à l'issue de ces échanges, d'accords et de signatures,
  ici rappeler. C'est l'intensité de notre relation historique, mais l'accélération
  de ce lien depuis deux ans et votre visite en octobre 2024 à Paris. Et nous n'avons
  pas simplement mis des mots et signé des accords stratégiques, nous avons donné
  du concret en allant plus vite encore. Et votre visite d'État, Monsieur le secrétaire
  général, cher président, cher Tô Lâm, est là pour nous permettre d'accélérer encore,
  mais elle est aussi là et surtout pour vous dire l'amitié et l'estime de la France
  à votre endroit et à l'égard du Vietnam. Et vous avoir avec votre épouse, vos ministres
  et votre délégation, c'est aussi une manière de vous dire que notre pays a admiration
  et estime pour vous et que nous souhaitons faire encore davantage ensemble. Merci
  beaucoup. 10 septembre 2026 - Seul le prononcé fait foi Monsieur le Secrétaire général,
