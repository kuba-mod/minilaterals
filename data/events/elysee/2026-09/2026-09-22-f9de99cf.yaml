type: press_release
source_name: elysee
title: '81ᵉ session de l’Assemblée générale des Nations unies à New York : première
  journée.'
text: 'Le Président Emmanuel Macron se rend à New York du 21 au 23 septembre 2026
  pour participer à la 81ᵉ session de l’Assemblée générale des Nations unies. Lors
  de cette première journée, le chef de l''État s''est d''abord entretenu avec le
  Président des États-Unis, Donald Trump sur la guerre en Ukraine et au Moyen-Orient.
  Ils ont notamment décidé d’agir ensemble pour résorber les tensions sur les marchés
  de l’énergie . En Ukraine, ils mettrons également leurs efforts en commun pour obtenir
  un moratoire sur les frappes contre les infrastructures énergétiques et contre les
  infrastructures civiles ukrainiennes . 21 septembre 2026 - Seul le prononcé fait
  foi Comment c’est passé votre entretien avec le président Trump ? Très bien. Écoutez,
  merci beaucoup. J’aurai l’occasion d’y revenir. Je ne vais pas faire attendre plus
  longtemps nos amis, mais on a eu une très bonne discussion, qui a permis d’aborder
  à la fois la crise au Proche et au Moyen-Orient et notre volonté d’essayer de tout
  faire pour rouvrir, justement, Ormuz et permettre de libérer les volumes. Plusieurs
  solutions ont été évoquées. Des solutions diplomatiques sur lesquelles on va travailler
  dans les prochaines heures, qui permettraient, sans avoir un accord global, de trouver
  les voies et moyens de faire passer davantage de porte-conteneurs et de tankers.
  L’autre chose dont nous avons parlé, c’est aussi la situation en mer Rouge et, là-dessus,
  sans entrer dans une confrontation et une escalade, la manière de mieux sécuriser
  les sites de sortie du pétrole en mer Rouge, qui sont aussi importants pour les
  cours mondiaux. Puis, on a eu une longue discussion sur l’Ukraine et la Russie,
  sur la nécessité d’aider encore plus vite et plus fort nos amis ukrainiens en matière
  d’intercepteurs, parce que c’est aujourd’hui le point clé sur le plan défensif.
  Également, nous sommes revenus, évidemment, sur les initiatives qu’on pourrait prendre
  pour trouver un moratoire sur les questions énergétiques. Je verrai tout à l’heure
  le président Zelensky. C’est avec lui que je vais en parler aussi. On se recalera.
  Donc, voilà, il y aura des discussions dans les prochaines heures. Sur les frappes
  des deux côtés contre les infrastructures énergétiques, c’est cela ? Je vais tout
  à l’heure en reparler avec le président Zelensky. Mais, en tout cas, on voit bien
  qu’aujourd’hui, il faut aider le système énergétique ukrainien et la situation dans
  toute la région. Vous le sentez juste dans quel état d’esprit, Donald Trump, quand
  il échange avec vous ? On a eu une très bonne discussion. Elle a été très constructive.
  Il y avait une grande disponibilité et on a pu entrer dans le détail sur ces deux
  conflits qui, évidemment, sont importants pour la paix dans le monde et pour notre
  sécurité, et qui ont un impact direct sur le pouvoir d’achat des Français. Cela
  veut dire que vous espérez, avant votre départ de New York, avoir d’autres avancées ?
  On va continuer dans les prochaines heures et l’objectif, c’est que, dans les jours
  à venir, en effet, on ait des avancées. On continuera même en dehors de New York.
  Ici, cela peut accélérer certaines discussions, mais elles ont commencé avant et
  elles continueront. En tout cas, je veux des résultats. Un moratoire énergétique,
  cela veut dire un moratoire sur les frappes contre les infrastructures énergétiques ?
  Si on peut l’obtenir, je pense que c’est un bon objectif. Mais je veux d’abord en
  parler avec le président Zelensky. Il y aura des discussions demain aussi, à nouveau,
  avec les Américains et les Ukrainiens, et c’est ce qui sera proposé. Mais voilà,
  les choses avancent. Je vous dis en toute transparence tous les sujets dont on a
  parlé et, en tout cas, on s’engage pour avoir le maximum de résultats et faire œuvre
  utile. Vous avez parlé de ce projet d’acheter de la potasse au Canada ? Non, nous
  n’avons pas évoqué ce sujet. On n’a pas évoqué ce sujet. Monsieur le Président,
  en quelques mots, pour les Français qui nous écoutent : vous attendez des annonces
  du Gouvernement. Vous avez demandé au Gouvernement de faire des annonces rapides.
  C’est pour quand, précisément ? Justement, c’est au Gouvernement de le faire et
  de le dire. Ce n’est pas à moi. 21 septembre 2026 - Seul le prononcé fait foi Comment
