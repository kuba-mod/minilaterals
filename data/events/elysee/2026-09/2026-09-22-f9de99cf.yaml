  Secrétaire général des Nations unies, le Président de la République s''est entretenu
  avec Volodymyr Zelensky, Président de l''Ukraine, pour réaffirmer le soutien de
  la France à l''Ukraine , notamment face aux frappes russes sur les infrastructures
  énergétiques.'
