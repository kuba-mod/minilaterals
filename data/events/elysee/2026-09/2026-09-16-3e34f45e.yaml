title: Disparition de Catherine Ringer.
text: 'Célèbre voix des Rita Mitsouko, Catherine Ringer avait fait de sa voix un théâtre,
  de chaque chanson une liberté. Avec elle, c’est une grande figure de notre vie musicale
  qui s’éteint – créative, irrévérencieuse, profondément française. Elle vit le jour
  en 1957 à Suresnes, auprès d’une mère architecte et d’un père peintre, qui avait
  connu l’exil et la déportation. Elle grandit dans les arts – langage familial, langage
  universel, qui berça son enfance. Inspirée par les voix d’Oum Kalthoum et de Maria
  Callas, par Brassens et les Rolling Stones, elle se mit à chanter. Artiste totale,
  elle s’essaya aussi à l’écriture, à la danse et au théâtre. À 15 ans, elle quitta
  les bancs de l’école pour commencer une carrière artistique. Dans les années 1970,
  elle dansa au Café de la Gare puis au Palace, fit résonner sa voix dans les théâtres,
  mais aussi à la télévision, prêtant son talent à des films d’animation et à des
  dessins animés. Ces années furent aussi traversées par des expériences plus troubles
  et douloureuses. De l’emprise et des violences auxquelles elle fut exposée, elle
  se libéra, refusant que ce passé enferme son corps ou son nom. En 1979, une audition
  pour une comédie musicale changea sa vie : elle y rencontra Fred Chichin. Ce fut
  un coup de foudre musical, sentimental, artistique. Ensemble, ils partagèrent le
  goût de la provocation, des pas de côté et de l’imprévu. En 1980, au Gibus, leur
  duo prit forme : Les Rita Mitsouko. Un nom qui mariait les consonances latines et
  asiatiques, à l’image de leur art – libre et inclassable. En 1984 sortit leur premier
  album, qui rencontra le succès lorsque le single « Marcia Baïla » s’imposa sur les
  ondes, porté par son clip signé Philippe Gautier. Les Rita Mitsouko avaient inventé
  une signature reconnaissable entre toutes. Ils mêlaient le punk, la new wave, le
  funk, les musiques latines, l’électro, le théâtre et la chanson française. Pendant
  près de trente ans, ils enregistrèrent sept albums studio originaux, multiplièrent
  les tournées internationales et collaborèrent avec de nombreux artistes, de Sparks
  à Iggy Pop, de Richard Galliano à Jean Néplin. Après la disparition de son compagnon
  en 2007, Catherine Ringer, avec une dignité bouleversante, poursuivit la tournée,
  porta seule une part de leur répertoire, puis ouvrit une nouvelle aventure musicale
  en solo. Il y eut Ring n’Roll, en 2011, puis Chroniques et Fantaisies, en 2017,
  album qu’elle porta avec la même énergie et le même goût de l’innovation. En 2019,
  elle fit renaître sur scène les titres cultes des Rita Mitsouko. Il suffisait de
  quelques mots – « Marcia », « Andy », « C’est comme ça » – pour raviver quelques-uns
  des plus beaux souvenirs musicaux de son public. Catherine Ringer fut tout à la
  fois diva, chanteuse populaire et avant-gardiste. Elle laisse derrière elle un héritage
  artistique singulier et flamboyant. Le Président de la République et son épouse
  saluent sa mémoire et adressent leurs condoléances à sa famille, à ses proches,
  ainsi qu’à toutes celles et ceux que ses chansons auront touchés.'
