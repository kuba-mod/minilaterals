title: Déclaration internationale sur le programme Copernicus.
text: 'Signatures : Allemagne, Arabie saoudite, Arménie, Australie, Autriche, Bahreïn,
  Belgique, Brésil, Bulgarie, Cambodge, Canada, Chili, Chypre, Corée du Sud, Costa
  Rica, Croatie, Danemark, Émirats arabes unis, Équateur, Espagne, Estonie, Finlande,
  Géorgie, Grèce, Hongrie, Irlande, Islande, Israël, Italie,  Japon, Kazakhstan, Lettonie,
  Luxembourg, Malte, Maroc, Maurice, Mexique, Norvège, Nouvelle-Zélande, Pays-Bas,
  Philippines, Pologne, République de Corée, République tchèque, Roumanie, Royaume-Uni,
  Rwanda, Serbie, Singapour, Slovaquie, Slovénie, Suède, Suisse, Turquie, Agence spatiale
  européenne, Bureau des affaires spatiales des Nations Unies. Nous, représentants
  des États membres de l’Union européenne (UE), des États participant au programme
  Copernicus, des organisations intergouvernementales, des agences spatiales, des
  institutions scientifiques et des partenaires internationaux, réunis à Paris à l’occasion
  du Sommet international sur l’espace, les 9 et 10 septembre 2026, Rappelant les
  engagements pris au titre de l’Accord de Paris sur le climat, du Cadre de Sendai
  pour la réduction des risques de catastrophe et des objectifs de développement durable
  des Nations Unies ; Reconnaissant le rôle crucial de l’observation de la Terre pour
  mieux connaître notre planète, protéger l’environnement, assurer la gestion durable
  des ressources naturelles, prévoir les catastrophes naturelles et y répondre, et
  accroître la résilience face aux enjeux mondiaux ; Soulignant que les données et
  services liés à l’observation de la Terre sont devenus des outils indispensables
  pour l’élaboration de mesures reposant sur des éléments probants, le développement
  économique durable, la protection civile, la sécurité, la recherche scientifique,
  l’innovation et la coopération internationale ; Rappelant que Copernicus, programme
  d’observation de la Terre de l’UE, mis en œuvre depuis 2014 en partenariat avec
  l’Agence spatiale européenne, d’autres institutions européennes et des États participants,
  constitue le programme civil d’observation de la Terre le plus complet et avancé
  au monde et fournit des données et services gratuits, ouvertes et pleinement accessibles,
  au service des populations, des autorités publiques et de la communauté scientifique ;
  Réaffirmant que l’accès gratuit, plein et ouvert aux données sur l’observation de
  la Terre soutient l’innovation, la coopération scientifique, la transparence et
  la prise de décisions éclairées dans la réponse apportée aux enjeux climatiques,
  environnementaux et sociétaux, et fournit un soutien crucial dans les situations
  de crise ; Reconnaissant la valeur ajoutée considérable du programme Copernicus
  pour les sociétés du monde entier au cours de la décennie écoulée ; saluant la contribution
  de ses missions Sentinel et de ses services opérationnels dont les activités de
  surveillance, de cartographie et de prévision permettent de réagir de manière plus
  efficace et plus rapide face aux catastrophes naturelles et d’appuyer la prise de
  décisions éclairées sur tous les continents dans des domaines tels que l’énergie,
  la gestion de l’environnement et des ressources hydriques, l’agriculture, la santé
  publique, le patrimoine culturel et la réponse aux crises ; Soulignant la contribution
  essentielle à la recherche scientifique du programme Copernicus et de sa politique
  de gratuité et de pleine ouverture des données ; rappelant l’importance de disposer
  d’un programme reposant sur la continuité, la fiabilité et l’uniformité à long terme
  afin de fournir les ensembles de données de référence qui sont indispensables aux
  rapports d’évaluation mondiaux, notamment ceux du Groupe d’experts intergouvernemental
  sur l’évolution du climat ainsi que pour le suivi de la mise en œuvre des accords
  multilatéraux sur l’environnement et des stratégies de préservation de la biodiversité ;
  Reconnaissant que le programme Copernicus permet effectivement d’accroître les avantages
  économiques, socioéconomiques et en matière de sécurité, notamment pour les écosystèmes
  sanitaires et urbains, les écosystèmes marins et terrestres, la gestion des risques,
  la résilience des populations civiles, la sécurité alimentaire, l’agriculture et
  la gestion hydrique ; Reconnaissant que la réussite attestée et la valeur globale
  du programme Copernicus rendent nécessaire de préserver sa gouvernance existante,
  sa continuité opérationnelle et son approche axée sur les utilisateurs, tout en
  renforçant encore les mécanismes existants en matière de dialogue et de cocréation,
  notamment le forum des utilisateurs de Copernicus et ses programmes de coopération
  nationale ; Reconnaissant la dimension éminemment internationale du programme Copernicus,
  en lien avec les pays partenaires et les principales organisations multilatérales,
  notamment l’Organisation météorologique mondiale, l’Organisation des Nations Unies
  pour l’éducation, la science et la culture, le Programme des Nations Unies pour
  l’environnement ; rappelant la contribution essentielle de Copernicus aux objectifs
  du Groupe sur l’observation de la Terre, notamment à ses activités dans les domaines
  de la sécurité alimentaire, de la neutralité en matière de dégradation des terres
  et de la gestion des feux de forêt ; Considérant que seule une coopération interinstitutionnelle
  peut permettre de développer des solutions adaptées aux besoins spécifiques des
  utilisateurs du programme Copernicus dans les pays partenaires et les pays en développement,
  tout en remédiant aux obstacles d’ordre linguistique, technique ou institutionnel
  qu’ils rencontrent ; soulignant que pour que le programme Copernicus réalise son
  plein potentiel, il convient de faciliter l’accès aux données, aux services et aux
  connaissances et de promouvoir leur utilisation à grande échelle. Rappelant la nécessité
  de protéger le spectre des fréquences radioélectriques des ressources essentielles
  au fonctionnement du programme Copernicus et de ses services d’observation de la
  Terre afin d’assurer la continuité et la fiabilité des observations menées ; Convaincus
  que le programme Copernicus constitue un bien public mondial dont la continuité
  est essentielle pour faire face aux enjeux mondiaux actuels, nous affirmons notre
  ferme soutien à ce programme. Nous appelons l’UE, les États participant au programme
  Copernicus et ses partenaires à : -  inscrire ce programme parmi les principales
  priorités du programme spatial européen et international ; - appuyer l’extension
  des missions et des services du programme Copernicus, la mise au point et le lancement
  de ses prochaines générations de satellites afin d’assurer sa continuité durable,
  sa fiabilité et l’applicabilité scientifique des données et informations essentielles
  à l’analyse des tendances climatiques à long terme ainsi que pour garantir une surveillance
  pointue de l’environnement et appuyer la sécurité civile ; - accélérer les efforts
  visant à promouvoir l’échange de données et le partage de connaissances entre les
  partenaires de Copernicus en mettant pleinement à profit les infrastructures et
  plateformes de données existantes et à venir ; - œuvrer pour faire reconnaître le
  programme Copernicus, dans l’ensemble des enceintes multilatérales concernées, comme
  un élément essentiel du système mondial sur l’observation de la Terre ; - veiller
  à ce que le programme Copernicus demeure ouvert à la participation de pays partenaires
  dans des conditions équitables. La présente Déclaration ne crée aucune nouvelle
  obligation financière pour les États signataires.'
