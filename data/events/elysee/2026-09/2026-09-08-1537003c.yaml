title: Visite d'État de Lee Jae Myung, Président de la République de Corée.
text: 'Le Président de la République et Brigitte Macron ont accueilli le Président
  de la République de Corée, Lee Jae Myung, et son épouse Kim Hea Kyung pour une visite
  d''État en France du 8 au 9 septembre 2026. Cette année marque les 140 ans des relations
  diplomatiques entre la France et la Corée . Après la visite d’État en Corée du Président
  de la République en avril dernier, les deux dirigeants se sont retrouvés pour approfondir
  leurs convergences dans un contexte international instable et renforceront leur
  partenariat stratégique. Les échanges ont permis de réaffirmer l’ambition des deux
  pays pour mettre pleinement en œuvre leur partenariat stratégique global , de faire
  le point sur les coopérations engagées en avril et d’ouvrir de nouvelles perspectives
  bilatérales. Des résultats significatifs sont attendus dans les domaines de la sécurité
  et de la défense, des technologies de pointe, de l’énergie et de la culture. Les
  deux dirigeants ont évoqué également les crises internationales , notamment la situation
  dans la péninsule coréenne, la guerre d’agression russe en Ukraine et la situation
  au Moyen-Orient, dans l’objectif d''œuvrer à la stabilité, à la sécurité et au respect
  du droit international. Une table-ronde économique a réuni ensuite des dirigeants
  d’entreprises françaises et coréennes autour de quatre grands axes :'
