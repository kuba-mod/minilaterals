title: Sommet international sur l'espace à Paris.
text: 'Le sommet international sur l’espace se tiendra au Grand Palais à Paris les
  9 et 10 septembre 2026. Désormais indispensables à la vie quotidienne de nos sociétés,
  les activités spatiales font face à des défis qu’il convient de relever collectivement
  afin de préserver un usage sûr et durable de l’espace extra-atmosphérique. Ce sommet
  rassemblera environ 2 000 participants : États, organisations internationales, industriels,
  investisseurs, chercheurs et syndicats, sous l’égide de deux envoyés spéciaux, Hélène
  Huby (The Exploration Company) et Thomas Pesquet (ESA). Ce sommet doit être l’occasion
  de favoriser une appréhension large des enjeux spatiaux en intégrant à ces discussions
  sur la gouvernance les thématiques industrielles, scientifiques et de défense tout
  en associant l’ensemble des acteurs de la communauté spatiale. Ce décloisonnement
  doit ainsi permettre de donner une nouvelle impulsion à la gouvernance multilatérale
  .'
