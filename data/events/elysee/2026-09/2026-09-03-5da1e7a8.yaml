title: Les journées européennes du patrimoine 2026 au Palais de l’Élysée.
text: 'Que faites-vous le week-end du 19 et 20 septembre 2026 ? À l’occasion des Journées
  Européennes du Patrimoine, vous êtes invité(e) à venir découvrir le Palais de l’Élysée
  qui a vu et fait l’histoire : le bureau du Président de la République, la salle
  des fêtes où ont lieu les réceptions et dîners d’État, la cour d’honneur où le Président
  accueille ses homologues étrangers, ou encore le parc. Cette année, comme l’an passé
  et afin de rendre votre parcours plus fluide, nous mettons en place une plateforme
  d’inscription pour vous permettre de préparer votre visite et de choisir un horaire
  de passage. Elle sera disponible très prochainement sur cette page et nos réseaux
  sociaux. Trois étapes pour visiter le Palais de l’Élysée : Étape 1 : vous inscrire
  sur notre site internet avant votre visite. Choisissez un jour, le 20 ou le 21 septembre,
  puis choisissez un créneau horaire et préinscrivez-vous vite (le nombre de places
  est limité !). Il est possible d’inscrire jusqu’à six personnes sur la même adresse
  mail unique. La personne qui inscrit les invités recevra l’ensemble des invitations
  sur cette même adresse mail (dans la limite des places disponibles). Munissez-vous
  bien au préalable de toutes les informations demandées pour les participants, il
  ne sera pas possible de les modifier. Pour celles et ceux qui se sont déjà préinscrits
  et attendent leur carton d''invitation : En fonction des places disponibles, vous
  recevrez votre carton d’invitation par e-mail. Seules les personnes munies de cette
  invitation pourront visiter l’Élysée. Étape 2 : Vous présenter au Palais au jour,
  à l’heure, et au point d’accès indiqués, muni(e) de votre invitation, et de votre
  pièce d’identité (obligatoire). Des distributeurs de gel hydroalcoolique seront
  mis à votre disposition tout au long du parcours, n’hésitez pas à vous en servir !
  Un guide au format papier sera également disponible à la vente au prix de 7,00€.
  Vous voyez souvent leurs photographies dans vos journaux et magazines, cette fois
  elles seront exposées dans les jardins de l’Élysée … Douze photographes des principaux
  médias ou agences photographiques suivant le Président de la République exposeront
  leur travail autour de la thématique « Regards sur l’Élysée ». Désignée lauréate
  par le public en 2025, Jeanne Accorsini, photographe pour l’agence Sipa Press, exposera
  une sélection de son travail. Embarquez aux côtés du Président de la République
  pour assister aux temps forts de la cérémonie du 14 juillet, du Palais de l’Élysée
  jusqu’à la place de la Concorde, en passant par la descente des Champs-Élysées à
  bord du Command-car. Une exposition photo inédite mettra en lumière les importants
  travaux de restauration entrepris au Palais de l’Élysée depuis une décennie, soulignant
  l''engagement continu en faveur de la conservation de ce lieu emblématique. À travers
  une sélection de clichés capturant les transformations ainsi que les étapes clés
  des chantiers, vous serez invités à découvrir l''évolution de l’hôtel d’Évreux.
  Par ailleurs, il sera possible d'' échanger avec les personnels de la Présidence
  de la République , qui œuvrent au rayonnement de nos savoir-faire. Enfin, la visite
  se fera au son de la musique de l’Orchestre de la Garde républicaine. Boules de
  pétanque, marinière, porte-clés, bols bretons et bien plus encore, en soutenant
  nos produits 100% fabriqués en France, vous permettez au Palais de l''Élysée de
  vivre une seconde jeunesse 300 ans après sa construction. Chaque achat contribue
  au financement de la valorisation du patrimoine de l''Élysée (rénovations, ouverture
  au public), à la promotion des savoir-faire nationaux et au soutien du Fabriqué
  en France. Située au 88 rue du Faubourg Saint-Honoré , juste en face du palais,
  la Maison Élysée restera ouverte tout le week-end de 10h à 19h (le samedi) et de
  10h à 18h (le dimanche) . Venez découvrir de nombreux autres produits fabriqués
  en France à la boutique, venez déguster une pâtisserie réalisée dans les cuisines
  du Palais au café et découvrez la suite des coulisses du Palais dans le musée accessible
  gratuitement et sans réservation. On ne vous en dit pas plus et on vous laisse vous
  inscrire pour découvrir tout ce qui vous attend lors de votre visite . On compte
  sur vous pour partager vos plus belles photos sur les réseaux sociaux, en mentionnant
  le compte @Elysee. Les meilleures publications sur Instagram seront relayées.'
