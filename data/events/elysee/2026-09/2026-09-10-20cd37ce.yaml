title: Compte rendu du Conseil des ministres du 10 septembre 2026.
text: 'Transposition de la directive (UE) 2023/970 du Parlement européen et du Conseil
  du 10 mai 2023 relative à l’égalité des rémunérations entre les femmes et les hommes
  par la transparence des rémunérations. Retrouvez le compte rendu du Conseil des
  ministres du jeudi10 septembre 2026. Le ministre du travail et des solidarités et
  le ministre de l’action et des comptes publics ont présenté un projet de loi portant
  transposition de la directive (UE) 2023/970 du Parlement européen et du Conseil
  du 10 mai 2023 relative à l’égalité des rémunérations entre les femmes et les hommes
  par la transparence des rémunérations. Après plusieurs mois de concertation avec
  les employeurs et l’ensemble des organisations syndicales du secteur privé et de
  la fonction publique, le projet de loi transpose les nouvelles obligations imposées
  par cette directive, portée sous la Présidence française de l’Union européenne,
  qui a été adoptée par le Parlement européen et le Conseil de l’Union européenne,
  le 10 mai 2023. Dans le secteur privé, temps partiels compris, le revenu salarial
  moyen des femmes reste inférieur de 21,8 % à celui des hommes (INSEE, 2024). La
  répartition genrée des professions et la différence de temps de travail peuvent
  expliquer en partie certaines différences de salaire constatées. Pourtant, à poste
  et temps de travail comparable, l’écart de salaire constaté en équivalent temps
  plein est de 3,6 %. Dans la fonction publique également, en 2024, à profil et temps
  de travail identique, les femmes perçoivent un salaire net inférieur en moyenne
  à celui des hommes de 2,9 % dans la FPE, de 4,2 % dans la FPT et de 4,7 % dans la
  FPH (INSEE, 2026). Ces chiffres révèlent la persistance de discriminations salariales
  en raison du sexe. Le projet de loi vise à renforcer le cadre juridique en faveur
  de l’égalité professionnelle et réduire les écarts de rémunération injustifiés entre
  les femmes et les hommes. Il prévoit notamment une réforme du droit national pour
  le rendre conforme aux nouvelles règles européennes : code du travail, code général
  de la fonction publique et code de la commande publique. Il prévoit notamment pour
  l’employeur une obligation, proportionnée à la taille des effectifs, de déclarer
  sept indicateurs relatifs aux écarts salariaux entre les femmes et les hommes. A
  des fins de simplification administrative et d’opérationnalité pour les employeurs
  privés, les six premiers indicateurs seront automatiquement précalculés à partir
  des données issues de la déclaration sociale nominative (DSN) tandis que, dans la
  fonction publique, les modalités de calcul tiendront compte des spécificités des
  systèmes d’information des employeurs publics. Le septième indicateur traduira les
  éventuels écarts de rémunération entre les femmes et les hommes par catégories de
  travailleurs exerçant un « travail de même valeur », notion dont le projet de loi
  vient renforcer l’encadrement. Dans le privé comme dans le public, le Gouvernement
  a retenu un déploiement progressif avec des échéances différenciées selon la taille
  des organisations, afin de les accompagner dans l’appropriation du nouveau dispositif.
  L’adoption de ce projet de loi fera franchir une étape supplémentaire en matière
  de transparence salariale par rapport à l’Index de l’égalité professionnelle issu
  de la loi du 5 septembre 2018 pour la liberté de choisir son avenir professionnel
  et de la loi du 19 juillet 2023 visant à renforcer l’accès des femmes aux responsabilités
  dans la fonction publique, en lui substituant les nouvelles exigences en matière
  d’indicateurs prévus par la directive, qui diffèrent par leur précision et par leur
  ambition de ceux en vigueur actuellement. S’agissant du septième indicateur portant
  sur l’écart de rémunération entre les femmes et les hommes par catégorie de travailleurs
  exerçant un travail de même valeur, les écarts salariaux, supérieurs à un seuil
  déterminé par décret et qui ne pourra être supérieur à 5 %, devront faire l’objet
  d’actions correctrices reposant sur le dialogue social dès lors que l’employeur
  ne pourra pas les justifier par des critères objectifs non fondés sur le sexe. En
  application du principe de non-régression prévu par la directive qui ne doit pas
  conduire à réduire le niveau de protection garanti aujourd’hui par l’index de l’égalité
  professionnelle, les employeurs d’au moins 50 travailleurs, actuellement assujettis
  à l’index, calculeront sept indicateurs relatifs aux écarts de rémunération entre
  les femmes et les hommes. Les obligations sont néanmoins simplifiées pour les employeurs
  entre 50 et 99 salariés ou agents publics. Dans le secteur privé et afin de laisser
  un temps d’adaptation suffisant aux différents acteurs dans la mise en œuvre de
  ce texte, la déclaration actuelle de l’index de l’égalité professionnelle issu de
  la loi pour la liberté de choisir son avenir professionnel sera maintenue en 2027.
  Ceci permettra d’assurer aux employeurs de la visibilité pour le bon déroulement
  de la déclaration 2027 et d’anticiper le passage au nouvel index à partir de 2028.
  Cette période intermédiaire permettra aux entreprises de débuter les travaux préalables
  aux négociations relatives à la catégorisation des travailleurs exerçant un travail
  égal ou de valeur égale, en s’appropriant la boite à outils mise à disposition par
  l’agence européenne de l’égalité entre les femmes et les hommes dont la traduction
  française sera mise en ligne courant octobre 2026. Dans la fonction publique, les
  nouveaux indicateurs s’appliqueront à compter de 2028 pour les employeurs gérant
  au moins 150 agents publics et du 1er juin 2030 pour les autres employeurs concernés.
  Ce calendrier permettra de préparer les évolutions organisationnelles et techniques
  nécessaires, tout en garantissant la continuité de la mesure des écarts de rémunération
  grâce au maintien de l’index actuel dans l’intervalle. Le projet de loi crée des
  nouveaux droits instaurant plus de transparence sur les politiques salariales :
  interdiction pour l’employeur de prévoir une clause contractuelle empêchant les
  salariés ou agents publics de divulguer des informations relatives à leur rémunération,
  obligation d’informer sur la fourchette de rémunération et les dispositions conventionnelles
  applicables avant l’embauche, droit à l’information concernant le niveau de rémunération
  moyen des salariés et agents publics appartenant à une même catégorie, et renversement
  de la charge de la preuve lorsque naît un litige en matière de discrimination fondée
  sur les nouvelles obligations de l’employeur en matière de rémunération. Enfin,
  le texte précise les sanctions effectives, proportionnées et dissuasives qu’encourent
  les employeurs en cas de manquement, ainsi que les voies de recours relatives aux
  nouveaux droits et obligations reconnus par la directive sur le principe d’égalité
  des rémunérations. Le conseil des ministres a adopté les mesures individuelles suivantes
  : Sur proposition du ministre de l’intérieur : Sur proposition de la ministre des
  armées et des anciens combattants : Sur proposition du garde des sceaux, ministre
  de la justice : Sur proposition de la ministre de l''agriculture, de l''agro-alimentaire
  et de la souveraineté alimentaire : Sur proposition de la ministre de la santé,
  des familles, de l’autonomie et des personnes handicapées : Le ministre du travail
