title: Cérémonie de ravivage de la Flamme à l’occasion de la Journée nationale d’hommage
  aux Harkis, aux Moghaznis et aux personnels des formations supplétives et assimilés.
text: Le chef de l’État a présidé une cérémonie de ravivage de la flamme à l’Arc de
  Triomphe ce vendredi 25 septembre, à l’occasion de la Journée nationale d’hommage
  aux Harkis, aux Moghaznis et aux personnels des diverses formations supplétives
  et assimilés. À cette occasion, le Président de la République a décoré dans les
  ordres nationaux douze Harkis , membres de leurs familles et acteurs engagés dans
  la préservation et la transmission de leur mémoire, issus de la promotion spéciale
  de reconnaissance aux Harkis et à leurs familles du 14 juillet 2026. Vingt-cinq
  ans après l’hommage national du 25 septembre 2001, cette cérémonie s’inscrit dans
  le chemin de reconnaissance, de mémoire et de transmission engagé par la France
  envers les Harkis et leurs familles. Dans le prolongement du rapport de Benjamin
  Stora, le Président de la République a souhaité approfondir ce travail en reconnaissant,
  le 20 septembre 2021, la dette de l’État français et en demandant pardon aux Harkis
  et à leurs enfants . La loi du 23 février 2022 a donné une traduction concrète à
  cet engagement en reconnaissant et en ouvrant à réparation les préjudices subis
  par les Harkis et leurs familles. La promotion spéciale dans les ordres nationaux
  du 14 juillet vient consacrer ce travail de reconnaissance de la République.
