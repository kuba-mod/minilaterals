date: '2026-09-04'
type: press_release
source_name: elysee
title: Conférence nationale du handicap 2026.
text: 'Le Président de la République a conclu la Conférence nationale du handicap
  , au « Prisme » à Bobigny, le vendredi 4 septembre 2026. Cette conférence s’inscrit
  dans la continuité de l’ action engagée depuis 2017 pour faire du handicap une priorité
  de l’ensemble de l’action publique . Elle a permis de dresser le bilan des avancées
  obtenues ces dernières années, notamment avec la mise en œuvre, depuis le 1er décembre
  2025, de la prise en charge intégrale des fauteuils roulants , engagement pris par
  le Président de la République lors de la dernière CNH. À cette occasion, Emmanuel
  Macron a présenté un ensemble de mesures destiné à poursuivre l’ amélioration concrète
  de la vie quotidienne des personnes en situation de handicap et de leurs familles
  . Vingt ans après la loi du 11 février 2005, cette conférence marque une nouvelle
  étape de la mobilisation de la Nation en faveur de l’égalité des droits, de l’autonomie
  et de la pleine participation des personnes en situation de handicap à la société.
  4 septembre 2026 - Seul le prononcé fait foi Bonjour, Mesdames et Messieurs. Et
  en effet, je veux saluer les premiers rangs. Merci d''avoir mis des mots sur ce
  silence. Mesdames, Messieurs les ministres, merci à nos ministres d''être présents
  en nombre ce matin, je sais, pour les tables rondes successives, et ce qui montre
  l''engagement du Gouvernement. Je vous en remercie. Mesdames, messieurs les parlementaires
  ici présents, monsieur le préfet, monsieur le président du Conseil départemental,
  merci de nous accueillir et merci aussi de vos mots ce matin et de votre engagement.
  Monsieur le maire, merci pour votre accueil dans ce magnifique lieu. Mesdames, messieurs
  les élus, mesdames et messieurs les représentantes et représentants d''associations,
  présidentes et présidents, monsieur le président du CNCPH, cher Jérémy et tous les
  membres, mesdames et messieurs en vos grades et qualités, comme on dit, pour ne
  pas poursuivre plus longuement les présentations, mais je suis très heureux d''être
  parmi vous aujourd''hui et très heureux d''être là pour cette nouvelle Conférence
  nationale du handicap, ici au PRISM, qui est un lieu emblématique de l''héritage
  des Jeux olympiques et paralympiques de Paris 2024, conçu comme un espace de rencontres,
  de sport, de citoyenneté accessible à tous. Alors je veux vous remercier d''abord
  d''avoir collectivement décalé de quelques semaines cette conférence. Je pense qu''on
  a eu collectivement raison parce que les chaleurs du mois de juillet à la date qui
  était initialement prévue nous auraient conduits à beaucoup plus souffrir et donc
  la sagesse l''a emporté et la cohérence. Et je veux remercier toutes celles et tous
  ceux qui ont contribué à la préparation de ce rendez-vous, les associations, les
  collectivités, les professionnels, les administrations et surtout, si je puis dire,
  les personnes en situation de handicap et leurs proches qui ont conçu ce travail
  comme celui que nous avons fait toutes ces dernières années. Avant de regarder l''avenir,
  je veux revenir quelques instants sur le chemin que nous avons parcouru que vous
  avez collectivement effectué ces dernières années avec des résultats qui comptent.
  L''école pour tous, d''abord, a continué de progresser durant ces dernières années.
  En 2025, je parle sous le contrôle de Monsieur le Ministre et les chiffres doivent
  encore augmenter en cette rentrée 2026, il y a eu plus de 550 000 élèves en situation
  de handicap qui ont été scolarisés. Il y en avait en 2017, 321 000. Soit une hausse
  donc de 62 %. Pour les accompagner, nous avons, la Nation a triplé le nombre d''AESH,
  passé de 43 000 à plus de 140 000 sur le territoire, avec un travail aussi qui continue
  pour améliorer leurs conditions de travail, de rémunération, leur statut. Les pôles
  d''appui à la scolarité sont en cours de déploiement pour améliorer concrètement
  l''accompagnement des élèves en situation de handicap. On a 1 500 pôles qui sont
  déployés en 2026. C''est la moitié du maillage cible qu''on vise. Au total, durant
  les 9 dernières années, les moyens consacrés à l''école inclusive ont ainsi plus
  que doublé et la nation est passée d''un investissement de 2,1 milliards par an
  à 4,8 milliards par an. Je le dis parce que c''est souvent oublié dans les débats
  publics et c''est légitime, fort, important, mais nous avons en 8 ans mobilisé 40
  milliards d''euros pour l''école inclusive et nous devons continuer. Dans l''enseignement
  supérieur aussi, nous avons agi sans relâche grâce aux interpellations nombreuses
  que j''avais eues dès le début. Des dizaines de milliers d''étudiants en situation
  de handicap accèdent désormais plus facilement aux bourses sur critères sociaux
  grâce à 4 points de charge supplémentaires selon les situations, ce qui peut représenter
  plus de 2 000 euros d''aide en plus chaque année. Et parce que l''inclusion ne s''arrête
  pas aux portes de l''école et de l''université, nous avons également poursuivi les
  efforts en matière d''insertion professionnelle. Le chômage des personnes en situation
  de handicap est ainsi passé de 17,6 % en 2017 à 11,5 % en 2025. C''est son plus
  bas niveau historique. Dans le même temps, nous avons renforcé l''accompagnement
  vers l''emploi, fait progresser les droits des travailleurs en ESAT, l''ESAT de
  Dole était là d''ailleurs à l''accueil et je vous remercie pour le travail fait.
  Et puis nous avons voulu engager des réformes nécessaires qui avaient été longtemps
  laissées de côté sur beaucoup d''autres sujets essentiels pour les personnes en
  situation de handicap. Je pense à la déconjugalisation de l''allocation adulte handicapé,
  mesure de justice sociale et d''indépendance. C''est là aussi le fruit de la mobilisation
  de plusieurs associations et de l''interpellation de plusieurs d''entre vous durant
  la campagne de 2022, qui a conduit à cette décision, puis cette mesure législative.
  Et je remercie les ministres et les parlementaires qui l''ont votée. Et depuis 2017,
  le montant de l''allocation adulte handicapé a été revalorisé, passant de 810 euros
  par mois à plus de 1 040 euros par mois en 2026, soit une hausse de 29 %. Je pense
  aussi à la simplification des démarches administratives et à la question récurrente
  des délais de traitement des dossiers, dans les MDPH. Nous avons collectivement
  simplifié les procédures, mis en place depuis 2019 les droits à vie pour les personnes
  présentant un handicap irréversible, et là, nous continuons le travail pour que
  l''application se fasse partout de manière plus homogène sur le territoire, parce
  que j''ai, par les remontées, des situations qui encore ne sont pas normales, mais
  on a beaucoup progressé sur ce terrain. Il faut aller au bout de sa mise en œuvre,
  et je remercie tous les acteurs, là aussi, qui se sont beaucoup mobilisés. Je pense
  également aux avancées concrètes engagées ces dernières années pour renforcer la
  pleine citoyenneté des personnes en situation de handicap : rétablissement du droit
  de vote des majeurs sous tutelle, accessibilité accrue des campagnes électorales,
  généralisation des professions de foi en format facile à lire et à comprendre pour
  les élections législatives, régionales et présidentielles. Enfin, pour m''arrêter
  là, je pense à l''avancée majeure en matière de compensation et d''autonomie, fruit
  de la conférence précédente de 2023, la prise en charge intégrale des fauteuils
  roulants dont bénéficient depuis le 1er décembre 2025 plus de 280 000 de nos compatriotes.
  Toutes ces avancées sont réelles, elles changent des vies et elles sont le fruit
  de notre travail collectif des dernières années. C''est-à-dire souvent de mobilisation,
  de dénonciation de situations qui étaient insoutenables, d''un travail en profondeur,
  associations, collectivités, administrations, puis d''un accompagnement par la ministre
  et les parlementaires qui ont permis toutes ces avancées. Pour autant, beaucoup
  reste à faire et nous le savons, et c''est l''objet de cette conférence. Trop de
  personnes se heurtent encore à des obstacles qui limitent leur autonomie, compliquent
  leur quotidien et c''est pourquoi nous avons voulu que cette Conférence nationale
  du handicap marque une nouvelle étape, la construction d''une société pensée pour
  tous où chacun peut exercer ses droits, choisir librement son destin, prendre part
  à la vie de la cité avec évidemment toutes vos mesures orchestrées, articulées autour
  de l''accessibilité universelle. Si les droits ont progressé, s''il y a eu toutes
  ces mesures concrètes, l''accessibilité reste en effet aujourd''hui un frein majeur
  à l''autonomie. Et maintenant, je veux regarder devant et donner les grandes lignes
  de ce qui a commencé à être travaillé ce matin et qui sera décliné dans les prochaines
  semaines. En effet, trop souvent encore, se loger, se déplacer, accéder à un service
  public, accomplir une démarche en ligne relève du parcours d''obstacles. Et l''accessibilité
  a quand même été longtemps une forme de promesse, d''horizon qui avait vocation
  à reculer à mesure qu''on avançait. Et puis, tout le monde s''en accommodait. Ce
  que vous voulez à juste titre, ce que nous voulons, c''est que ça devienne une réalité
  dans la vie de chacun. Et c''est tout le sens de la stratégie nationale de l''accessibilité
  élaborée avec l''ensemble des acteurs d''ici l''automne pour la période 2026-2029.
  Et donc, au-delà des tables rondes que vous avez lors de cette conférence, les groupes
  de travail sont lancés, beaucoup ont déjà commencé en vrai le travail et je vous
  en remercie, et ont vocation à finaliser cette stratégie qui sera déclinée sur la
  période 2026-2029. Alors, je ne vais pas préempter ce travail. Je veux simplement
  m''engager sur quelques points, donner quelques axes. Je souhaite en effet des objectifs
  clairs pour simplifier tous les gestes du quotidien : pouvoir payer seul, traverser
  la rue en sécurité, accomplir ses démarches en ligne sans assistance, ce qui passera
  notamment par des terminaux de paiement accessibles, la généralisation des télécommandes
  vocales pour les feux sonores, des sites Internet pleinement accessibles. Et dans
  les dizaines de mesures qu''il y a dans cette stratégie et de groupes de travail
  qui sont lancés, c''est cet esprit de concret qui, je pense, est très important
  pour qu''on ait à chaque fois des gens responsables et des dates précises de mise
  en œuvre et pour qu''on puisse rendre compte. L''accessibilité, c''est aussi le
  logement, nous ne l''oublions pas, vivre chez soi, dans des conditions adaptées,
  c''est une première garantie d''autonomie. Et on a encore des situations qui sont
  aujourd''hui inacceptables et parmi tous les travaux qui vont se finaliser dans
  les prochaines semaines, je souhaite vivement que soit créé d''ici le début de l''année
  prochaine ce répertoire national des logements sociaux accessibles pour que les
  personnes en situation de handicap puissent trouver des logements pré-identifiés
  de manière simple et selon les mêmes critères sur l''ensemble du territoire, parce
  qu''on a encore aujourd''hui beaucoup de situations hétérogènes et parfois trop
  peu de visibilité sur ces logements. Une société inclusive, c''est aussi une société
  qui permet de choisir librement sa vie, d''être accompagné dans ses transitions
  et de ne jamais voir son parcours interrompu, faute de solutions. Et dans les choses
  à améliorer, cette perspective d''accessibilité universelle, de manière très concrète,
  c''est tous les éléments de continuité. Ça, vous le savez trop bien. Une partie
  de ce que j''évoquais allait dans ce sens, les droits à vie, nos dispositifs, mais
  on a encore énormément, au fond, de ruptures dans le parcours des enfants, des adolescents,
  puis des adultes et des familles. L''accompagnement doit commencer dès l''enfance.
  On a, ces dernières années, tous ensemble, ça fait partie du bilan, je ne l''ai
  pas évoqué tout à l''heure, mais on a beaucoup amélioré le repérage précoce et l''accompagnement
  adapté. Depuis 2019, plus de 180 000 enfants ont bénéficié d''un repérage précoce
  et d''un accompagnement adapté dans le cadre de la stratégie nationale pour les
  troubles du neurodéveloppement. C''est une formidable avancée qui est le fruit vraiment
  de votre travail, de toutes les équipes syndicales partout sur le territoire. Cet
  effort doit être poursuivi en renforçant l''accès au diagnostic et à l''accompagnement
  précoce. Et là, de manière très universelle, jusqu''à 6 ans, pour qu''on ait des
  familles, des jeunes qui soient pris en charge. Et on sait aussi que pour les enfants
  atteints de paralysie cérébrale ou de polyhandicap, les nouveaux parcours doivent
  pouvoir se poursuivre plus tard et jusqu''à 20 ans afin de mieux préparer le passage
  vers l''âge adulte et ne pas subir ces ruptures. Et ça, ce sont des éléments clés
  qui doivent être finalisés dans les prochaines semaines. S''il existe un lieu où
  la République doit aussi être pleinement accessible, c''est l''école. Je l''ai évoqué
  à l''instant. Là aussi, nous savons ce que nous devons continuer d''améliorer. L''école
  accessible, c''est une école qui s''adapte aux façons d''apprendre de chaque élève.
  La formation des enseignants à des pédagogies qui peuvent profiter à tous sera renforcée
  dès cette année. D''ailleurs, nous l''avons vu en voyant l''INSPÉ il y a quelques
  jours avec le ministre en Lozère. Les pôles d''appui à la scolarité continueront
  d''être déployés sur l''ensemble du territoire et la cible des 3 000 pôles sera
  tenue à la rentrée prochaine, permettant d''offrir une couverture nationale du dispositif.
  À force d''empiler les dispositifs, les parcours sont parfois aussi devenus trop
  complexes. Aussi, nous souhaitons que dès la rentrée 2027, l''Éducation nationale,
  partout sur le territoire, nos rectorats engagent, et le travail a commencé dès
  maintenant, pour pouvoir y parvenir, un rapprochement progressif des dispositifs
  autour d''un projet de réussite unique de la maternelle au lycée pour simplifier
  la vie des familles, garantir la scolarisation de chaque enfant au sein de l''école.
  Et au fond, c''est de pouvoir accompagner les élèves et les familles tout au long
  de leur parcours et ne pas leur faire subir les changements de classes, d''établissements
  ou de cycles, mais que tout ça soit piloté de manière continue pour être ciblé sur
  l''élève. Et de l''école à l''université, notre ambition doit être la même. L''accès
  aux études supérieures s''est développé, mais on a encore des obstacles logement,
  démarches administratives, sur lesquels nous devons poursuivre les efforts engagés.
  À ce titre, je veux ici remercier évidemment le ministère et aussi le réseau des
  Crous qui met à disposition plus de 8 350 places de logements adaptés. Quant aux
  démarches essentielles de la vie étudiante, de Parcoursup à Mon Master, en passant
  par les demandes de bourses ou de logement, elles devront être accessibles à tous
  d''ici la fin de l''année 2026. Et là aussi, ça fait partie de cette stratégie avec
  un élément de temporalité très clair. Le ministre chargé de l''Enseignement supérieur
  et le CNOUS y consacreront tous les efforts nécessaires et c''est un axe important
  d''efforts. Disant cela, je n''oublie pas le remarquable travail qui est fait par
  le programme Atypie friendly, que nous continuerons à développer pour les étudiants
  concernés par les troubles du neurodéveloppement. Et j''ai pu à plusieurs occasions
  admirer la qualité de ce travail, son engagement et sa démultiplication ces dernières
  années. Notre objectif est clair : le handicap ne doit contraindre aucun jeune à
  renoncer à ses études, à ses projets ou au libre choix de son avenir professionnel.
  Nous devons aussi à cet égard poursuivre la transformation du monde du travail.
  Et l''objectif de cette stratégie sur les 4 années à venir, eh bien, c''est de renforcer
  l''emploi accompagné avec un objectif de 20 000 bénéficiaires d''ici 2028, d''ouvrir
  une concertation nationale sur l''avenir de l''obligation d''emploi des travailleurs
  handicapés, 40 ans après la loi de 1987, et d''engager la suppression des restrictions
  d''accès à certaines professions dans le cadre de cette stratégie, car elles existent
  encore. Et dans cette stratégie 26-30, il y a l''objectif de les lever, c''est l''objet
  d''un des groupes de travail. Une société pleinement accessible, et c''est évidemment
  une société qui protège, qui accompagne, qui forme, qui permet d''accéder au travail,
  mais c''est aussi une société qui permet à chacun de participer pleinement à la
  vie sociale, culturelle, sportive et citoyenne de notre pays. Les Jeux olympiques
  et paralympiques de Paris 2024 ont profondément changé le regard sur le handicap
  dans notre pays. Et je veux remercier celles et ceux qui ont permis ce succès, qui
  se sont engagés dès les premiers jours de notre campagne. Ça a été une mobilisation.
  On a pensé ces Jeux olympiques et paralympiques comme un tout et on a réussi cela,
  vous avez réussi cela. Ils ont montré les performances, les talents, les réussites
  de milliers d''athlètes. Ils ont aussi créé une attente et cette dynamique ne doit
  pas retomber. Ça doit nous pousser à développer le sport inclusif sur l''ensemble
  du territoire pour que chacun puisse pratiquer quel que soit son âge, son lieu de
  vie ou son handicap. Les fédérations sportives ont désormais un rôle majeur à jouer
  pour faire toute leur place aux sportifs, nous y tenons avec la ministre, et le
  faire justement pour tous les sportifs en situation de handicap dans leurs instances,
  dans leurs compétitions, et dans leurs projets. Cette démarche ne s''oppose en rien
  au rôle essentiel du mouvement handisport, bien au contraire. L''objectif est de
  pouvoir concilier ces efforts. Nous souhaitons également que la France soutienne
  dans les prochains mois auprès du Comité international olympique une meilleure représentation
  de toutes les personnes handicapées aux grandes compétitions sportives dont les
  Jeux paralympiques et plus particulièrement la participation des personnes avec
  un trouble du neurodéveloppement, du développement intellectuel, dont la trisomie
  21. L''exposition d''ailleurs qui nous guidait sur ces lieux montrait l''importance
  de ce combat et nous ne le lâchons pas, c''est un des objectifs là aussi des prochains
  mois. Prendre pleinement part à la vie de la nation, c''est aussi pouvoir accéder
  à la culture. Là encore, nous devons aller au-delà des progrès accomplis. Avec la
  ministre, nous portons le fait que l''édition accessible et adaptée doit désormais
  changer d''échelle pour que chacun puisse accéder à la lecture dans des conditions
  équivalentes. Le portail national de l''édition adaptée sera finalisé, les bibliothèques
  seront accompagnées pour élargir leur offre de livres adaptés. Même exigence pour
  les lieux culturels. Musées, sites patrimoniaux doivent continuer à mieux accueillir
  tous les publics et à faire de l''art un espace d''inclusion, à l''image, par exemple,
  du Hamo au palais de Tokyo. La culture, c''est aussi le cinéma. Personne ne doit
  être forcé d''aller voir un film le mardi matin à 8h30 parce que ce serait la seule
  séance sous-titrée et audiodécrite de la semaine. Et je salue à cet égard l''engagement
  du ministère, les travaux conduits par le Centre national du cinéma avec les associations
  et les gestionnaires de salles pour augmenter dès 2027 le nombre de séances accessibles
  partout sur le territoire et mieux les faire connaître. Prendre pleinement part
  à la société, c''est enfin une question de citoyenneté. En 2019, comme je le rappelais,
  notre pays a franchi une étape importante en rétablissant le droit de vote de l''ensemble
  des majeurs protégés. Cette décision portait une conviction profonde, il ne peut
  pas y avoir d''égalité réelle s''il n''y a pas de pleine citoyenneté. Nous devons
  continuer à lever les obstacles qui empêchent encore certains de nos concitoyens
  de faire entendre leur voix et de prendre toute leur place dans la vie démocratique
  de la nation de manière très concrète, c’est là aussi l''un des groupes de travail.
  Et puis, au-delà de tous ces chantiers que j''évoque ici, mais pour montrer qu''au
  fond le travail que nous engageons avec cette stratégie d''accessibilité 2026-2030
  couvre tous les départements ministériels, et c''était très important que les ministres
  soient tous là, de l''Emploi aux Transports, de la Santé à l''Éducation nationale,
  le Sport, l''Enseignement supérieur, l''Apprentissage, le Logement, la Culture.
  Ça vous montre qu''aucun de ces ministères ne lâche le combat. Eh bien, on veut
  aussi préparer l''avenir et dans tout le travail qui est engagé, nous voulons, et
  je veux revenir sur quelques points, continuer d''accélérer des efforts des dernières
  années. L''avenir du handicap se jouera en partie dans notre capacité à mettre l''innovation
  au service de l''autonomie : Technologies d''assistance, numérique, intelligence
  artificielle peuvent transformer l''accès à la communication, aux apprentissages,
  à l''emploi et aux soins. Alors, nous avons déjà des acteurs de premier plan. Je
  ne pourrai pas citer tout le monde, mais les lunettes intelligentes de Pulse Audition,
  les bras robotiques d''Orthopus, l''exosquelette de Wandercraft, qui sont de vraies
  innovations qui changent la vie de centaines de milliers de personnes en situation
  de handicap et de leurs familles. Notre enjeu désormais est de faire passer ces
  innovations de l''expérimentation à la vie quotidienne, de continuer de les accompagner,
  d''accélérer, mais de beaucoup plus travailler sur leur démocratisation et leur
  diffusion. Pour y parvenir, l''État accompagnera dans les prochains mois la structuration
  d''une véritable filière française des technologies d''assistance associant chercheurs,
  industriels, professionnels du secteur, utilisateurs et financeurs. Son objectif
  sera clair : accélérer le développement, l''évaluation, la production et la diffusion
  de solutions innovantes pour les personnes qui en ont besoin. Cette ambition vaut
  aussi pour la déficience visuelle. Avec la création de l''Institut national Louis
  Braille, nous réunirons enfin dans un même lieu recherche, innovation, formation,
  expertise et accompagnement pour créer un pôle national de référence, c''est aussi
  un des axes de la stratégie. Préparer l''avenir, c''est aussi répondre aux besoins
  des personnes autistes et plus largement de toutes celles concernées par un trouble
  du neurodéveloppement. Beaucoup a été fait ces dernières années. Je veux remercier
  toutes les équipes qui se sont mobilisées. J''évoquais quelques-unes des avancées,
  mais les besoins restent immenses, notamment pour les adultes et pour les situations
  les plus complexes. Dès la fin de cette année, nous lancerons donc les travaux d''une
  nouvelle stratégie nationale pour l''autisme et les troubles du neurodéveloppement
  pour la période 2027-2032, avec 3 priorités : mieux repérer et accompagner dès le
  plus jeune âge. Ça, c''est la poursuite de l''effort déjà fait, et j''insiste sur
  le mieux accompagner qui est un point clé pour que la prise en charge se fasse au
  plus tôt, dès le diagnostic fait, qui est le point où on s''est beaucoup amélioré.
  Deuxièmement, c''est renforcer les réponses pour les adolescents et les adultes.
  Et troisièmement, c''est apporter davantage de solutions aux situations complexes.
  Cette stratégie sera construite avec les personnes concernées, leurs familles, les
  associations, les professionnels et les chercheurs. Au-delà de cette stratégie,
  toutes les actions que j''ai présentées ce matin poursuivent une même ambition :
  construire une société pleinement accessible. Et avant de conclure, permettez-moi
  de saluer justement les proches aidants. Parents, conjoints, frères, sœurs, enfants,
  amis, ils accompagnent chaque jour les personnes en situation de handicap avec un
  engagement, une générosité souvent discrète. Cette ambition d''une société pleinement
  accessible leur doit beaucoup et nous devons continuer à mieux les reconnaître,
  à les soutenir et à les accompagner, et c''est aussi un des axes d''efforts et de
  groupes de travail. Voilà, Mesdames et Messieurs, ce que je souhaitais partager
  avec vous ce matin, à la fois la consolidation de tout ce que nous avons fait ensemble
  ces dernières années, mais les axes d''efforts de ce que nous devons ensemble faire
  pour cette stratégie qui va être finalisée par les groupes de travail sur les prochains
  mois et qui rassemble 65 mesures pour les années à venir. Les feuilles de route
  qui seront désormais mises en œuvre sous l''autorité du Gouvernement en assureront
  la traduction concrète engagement par engagement. Les ministres auront l''occasion
  d''y revenir et dans les prochaines semaines, la ministre déléguée chargée de l''autonomie
  et des personnes handicapées, chère Camille, que je remercie pour la préparation
