  je veux revenir sur quelques points, continuer d''accélérer des efforts des dernières
  années. L''avenir du handicap se jouera en partie dans notre capacité à mettre l''innovation
  au service de l''autonomie : Technologies d''assistance, numérique, intelligence
  artificielle peuvent transformer l''accès à la communication, aux apprentissages,
  à l''emploi et aux soins. Alors, nous avons déjà des acteurs de premier plan. Je
  ne pourrai pas citer tout le monde, mais les lunettes intelligentes de Pulse Audition,
  les bras robotiques d''Orthopus, l''exosquelette de Wandercraft, qui sont de vraies
  innovations qui changent la vie de centaines de milliers de personnes en situation
  de handicap et de leurs familles. Notre enjeu désormais est de faire passer ces
  innovations de l''expérimentation à la vie quotidienne, de continuer de les accompagner,
  d''accélérer, mais de beaucoup plus travailler sur leur démocratisation et leur
  diffusion. Pour y parvenir, l''État accompagnera dans les prochains mois la structuration
  d''une véritable filière française des technologies d''assistance associant chercheurs,
  industriels, professionnels du secteur, utilisateurs et financeurs. Son objectif
  sera clair : accélérer le développement, l''évaluation, la production et la diffusion
  de solutions innovantes pour les personnes qui en ont besoin. Cette ambition vaut
  aussi pour la déficience visuelle. Avec la création de l''Institut national Louis
  Braille, nous réunirons enfin dans un même lieu recherche, innovation, formation,
  expertise et accompagnement pour créer un pôle national de référence, c''est aussi
  un des axes de la stratégie. Préparer l''avenir, c''est aussi répondre aux besoins
  des personnes autistes et plus largement de toutes celles concernées par un trouble
  du neurodéveloppement. Beaucoup a été fait ces dernières années. Je veux remercier
  toutes les équipes qui se sont mobilisées. J''évoquais quelques-unes des avancées,
  mais les besoins restent immenses, notamment pour les adultes et pour les situations
  les plus complexes. Dès la fin de cette année, nous lancerons donc les travaux d''une
  nouvelle stratégie nationale pour l''autisme et les troubles du neurodéveloppement
  pour la période 2027-2032, avec 3 priorités : mieux repérer et accompagner dès le
  plus jeune âge. Ça, c''est la poursuite de l''effort déjà fait, et j''insiste sur
  le mieux accompagner qui est un point clé pour que la prise en charge se fasse au
  plus tôt, dès le diagnostic fait, qui est le point où on s''est beaucoup amélioré.
  Deuxièmement, c''est renforcer les réponses pour les adolescents et les adultes.
  Et troisièmement, c''est apporter davantage de solutions aux situations complexes.
  Cette stratégie sera construite avec les personnes concernées, leurs familles, les
  associations, les professionnels et les chercheurs. Au-delà de cette stratégie,
  toutes les actions que j''ai présentées ce matin poursuivent une même ambition :
  construire une société pleinement accessible. Et avant de conclure, permettez-moi
  de saluer justement les proches aidants. Parents, conjoints, frères, sœurs, enfants,
  amis, ils accompagnent chaque jour les personnes en situation de handicap avec un
  engagement, une générosité souvent discrète. Cette ambition d''une société pleinement
  accessible leur doit beaucoup et nous devons continuer à mieux les reconnaître,
  à les soutenir et à les accompagner, et c''est aussi un des axes d''efforts et de
  groupes de travail. Voilà, Mesdames et Messieurs, ce que je souhaitais partager
  avec vous ce matin, à la fois la consolidation de tout ce que nous avons fait ensemble
  ces dernières années, mais les axes d''efforts de ce que nous devons ensemble faire
  pour cette stratégie qui va être finalisée par les groupes de travail sur les prochains
  mois et qui rassemble 65 mesures pour les années à venir. Les feuilles de route
  qui seront désormais mises en œuvre sous l''autorité du Gouvernement en assureront
  la traduction concrète engagement par engagement. Les ministres auront l''occasion
  d''y revenir et dans les prochaines semaines, la ministre déléguée chargée de l''autonomie
  et des personnes handicapées, chère Camille, que je remercie pour la préparation
  de cette CNH, réunira un comité de pilotage réunissant les associations, les collectivités,
  les professionnels et l''ensemble des acteurs concernés. La méthode est claire :
  faire avec et non pour, faire avec les personnes concernées, avec les associations,
  avec les collectivités et tous les acteurs engagés. Et c''est aussi pour cela que,
  parmi ce travail, je sais que c''est une demande importante de l''APF, et nous l''avons
  entendu, l''APF France, que dans les groupes de travail sur l''aide humaine, nous
  puissions avoir un axe de travail important et il sera également engagé. Au fond,
  le sujet qui nous réunit aujourd''hui, dépasse la seule question du handicap. Il
  nous renvoie à une exigence fondamentale de notre République qui est de faire vivre
  l''égalité dans la réalité quotidienne de chacun. L''accessibilité n''est pas une
  politique pour quelques-uns, elle est une condition de l''égalité. Et une société
  pleinement accessible est plus juste pour les personnes en situation de handicap,
  mais elle est aussi plus simple pour les familles, plus protectrice pour chacune
  et chacun. Et au fond, elle est essentielle pour la nation tout entière. Alors au
  moment où je m''exprime devant vous, j''ai conscience du défi du temps. Nous avons
  ensemble fait durant un peu plus de 9 ans et demi, je crois, beaucoup. Je l''évoquais
  tout à l''heure. En tout cas, on l''a fait avec sincérité, avec cette volonté d''associer,
  de faire avec et d''améliorer de manière très concrète les choses, y compris quand
  on nous disait que ça n''était pas possible. Sur les troubles du neurodéveloppement,
  il y avait eu longtemps des conflits, des combats pour que le dépistage précoce
  ne puisse pas se faire. Vous l''avez fait. Sur la déconjugalisation de l''AAH, il
  y avait beaucoup de gens pour dire que ce n''était pas possible, beaucoup trop cher.
  Vous l''avez fait. Pour l''école inclusive, il y avait beaucoup de gens pour dire
  que c''était terrible, qu''il ne fallait surtout pas le faire. Vous l''avez fait.
  Et moi, je suis très fier de ce qu''on a fait ensemble ces dernières années. Je
  viens ici de donner quelques axes d''efforts de ce qui va être travaillé dans les
  prochains mois. Et jusqu''au dernier quart d''heure, vous pouvez compter sur moi
  pour le faire de là où je serai. J''ai conscience aussi que je parle de prochaines
  années où je ne serai pas là dans cette fonction. Je pense essentiel que tout ce
  qu''on a fait ces dernières années et que la philosophie du travail que vous avez
  conduit, de ce que cette stratégie va déployer, de ce que nous portons tous ensemble
  perdure et que quels que soient les débats démocratiques essentiels que nous allons
  avoir dans les prochains mois, sur lesquels je l''espère très fortement, la question
  du handicap, de l''accessibilité universelle, de l''inclusivité doit être au cœur
  de cette campagne. Je souhaite et je ferai tout pour que nous ne puissions pas reculer
  et qu''au contraire nous puissions accélérer sur ces axes d''efforts. Parce que
  ma conviction profonde, c''est qu''on ne parle pas simplement des personnes en situation
  de handicap, on parle de ce que nous sommes très profondément. On parle de ce qu''est
  la République et on parle de ce qu''est une nation qui fait confiance à tous ses
  citoyens et qui veut leur donner la possibilité de donner le meilleur d''eux-mêmes.
  C''est ça, ce qu''on a essayé de faire : faire confiance et de dire que le rôle
  de l''État, de la République, c''est de mettre chacune et chacun en capacité de
  faire le mieux possible. Partout où on le peut, de corriger toutes les inégalités
  qu''on peut corriger, les injustices ou les morsures du destin. Et de se dire que
  chacune et chacun est nécessaire et chacune et chacun est capable. Et cette confiance-là,
  elle dit beaucoup de ce qu''est notre nation, de ce qu''est notre République. Et
  quand je vois notre école, par exemple, telle qu''on l''a transformée ces dernières
  années, j''ai toujours été frappé de voir combien ce qu''on a fait pour l''école
  inclusive a transformé la vie de beaucoup d''élèves qui n''étaient pas en situation
  de handicap, et de leurs familles et d''enseignants, parce qu''ils ont compris,
  parce qu''ils ont eux-mêmes changé leur regard, leurs pratiques, et ils ont appris
  d''un autre ou d''une autre. Et c''est vrai pour le travail, et c''est vrai pour
  le reste de la société. Et donc je souhaite plus que tout que le mouvement enclenché
  ces dernières années soit inarrêtable, et que cette promesse d''universalité, qui
  est juste et qui est au cœur de la promesse républicaine, nous redoublions d''efforts
  tous ensemble pour qu''elle soit pleinement partout à chaque instant réel, car nous
  n''y sommes pas encore. Merci à chacune et chacun d''entre vous pour votre engagement
  et ne lâchez rien de ces combats. Ils sont justes et ils sont beaux.'
