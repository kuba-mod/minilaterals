  pour la qualité du débat démocratique ou pour la bonne conduite et l'intérêt des
  Français. Je crois que c'est le rôle de garant qui est celui du Président de la
  République. Ce rôle de garant n'appelle pas de moi d'être un commentateur de notre
  vie publique, et donc je ne vais pas vous dire si je pense que ceci ou cela est
  au niveau. Ce n'est absolument pas ce que doit faire le président. Je suis à la
  fois le garant, j’oriente, j'accompagne les travaux que le gouvernement conduit
  chaque jour, et Monsieur le Premier ministre, sur tous ces sujets, et puis j'agis
  dans la compétence qui est la mienne au niveau européen et international, pour protéger
  les Français et nous aider à faire face à cette situation. Je dirais que je me tiendrai
  à ce rôle et qu'il est déjà bien rempli. Sur la crise sociale, d'abord, je veux
  ici redire que nos compatriotes vivent dans leur chair les conséquences de cette
  situation. D'une part, les conséquences d'une guerre lancée par la Russie contre
  l'Ukraine, qui crée ces tensions multiples, et d'autre part, les conséquences de
  la guerre lancée par d'autres en Iran. Nous sommes actifs, diplomatiquement, et
  très actifs, depuis plusieurs années, pour essayer de les résoudre, et nous continuerons
  de le faire. Mais je suis solidaire à l'égard de nos compatriotes, mobilisés, mais
  je les appelle aussi à rester unis, et nous devons tous rester unis, parce que dans
  cette situation, la division nous rendra moins forts pour affronter ces crises.
  Les mobilisations sociales sont toujours légitimes, mais elles sont efficaces lorsqu'elles
  ont un débouché qui est à la main du gouvernement. Lorsqu'elles protestent contre
  les conséquences de phénomènes qui ne sont pas le résultat d'actions gouvernementales,
  elles disent une souffrance, mais elles produisent moins une solution. Donc restons
  unis, concentrés. Vous avez un gouvernement qui est à la tâche, conscient de ce
  que vit le pays, qui prendra les meilleures décisions possibles avec les contraintes
  qui sont les nôtres. Je crois qu'il y a des forces politiques qui ont compris cela,
  et j'espère toutes, et il y aura ensuite le débat parlementaire qui se doit. Je
  pense qu'on a aujourd'hui besoin de rester très unis et d'avoir conscience que la
  situation que nous vivons, elle est la conséquence des crises internationales. Journaliste
  Le Premier ministre polonais, Donald Tusk, met en garde hier contre des frappes
  hybrides russes qui pourraient viser des pays qui soutiennent Kiev. Il parle de
  frappes de drones notamment. Est-ce que vous partagez cette crainte-là ? Est-ce
  que vous avez des informations en ce sens ? Et surtout, quelle serait la réponse
  des Européens si cela venait à être le cas ? Emmanuel MACRON Merci beaucoup. Les
  propos du Premier ministre Donald Tusk sont solides, documentés, et c'est un Premier
  ministre qui a toujours été responsable, et je crois qu'il tire les conséquences
  légitimes de ce qui s'est passé ces dernières semaines et que je rappelais. Ce qui
  s'est passé en Allemagne à Leipzig, ne le sous-estimez pas, a échoué parce que le
  dispositif prévu par le GRU n'a pas fonctionné. Mais les conséquences auraient été
  tragiques avec des pertes humaines, des conséquences matérielles massives. Donc
  ça veut dire que l'intention des services secrets militaires russes était celle-là.
  Si ce qui se passe à Leipzig peut se passer dans toute autre ville européenne, les
  intrusions de drones dans l'espace aérien de plusieurs pays, d'ailleurs avec une
  réelle profondeur dans l'action russe, nous montrent que nul n'est à l'abri. Donc
  face à cela, on agit. On agit à travers la mobilisation que nous avons décidée,
  mobilisation de nos préfets de zone, mobilisation de l'ensemble du dispositif français
  pour mieux protéger nos emprises les plus stratégiques et notre base industrielle
  et technologique de défense, et posture collective de grande vigilance. Nous sommes
  dans un moment de vigilance. Nos amis suédois ont appelé ça la défense totale pour
  appeler aussi leur peuple à la vigilance. C'est très cohérent avec ce que nous avons
  bâti tous ensemble et la stratégie nationale de résilience qui a été présentée par
  le SGDSN il y a plusieurs mois. C'est aujourd'hui une réalité et donc nous devons
  tous être vigilants, en action, conscients que de telles manœuvres et de telles
  attaques sont possibles dans nos villes et nos capitales et sur les emprises les
  plus sensibles, et donc tout faire pour prévoir, planifier, nous protéger et rester
  extrêmement vigilants. Et c'est en européen que nous allons continuer de le faire.
  Ensuite, sur la riposte, le propre de la dissuasion, c'est de ne pas donner de la
  visibilité sur ce qu'on fera, mais ça ne restera pas sans réponse. Je pense que
  ce serait une erreur de la part de la Russie de continuer d'agir à l'égard des Européens
  de cette manière. La volonté qu'il y a derrière, c'est de nous intimider et c'est
  de casser l'effort de soutien aux Ukrainiens. La conséquence sera le contraire.
  Nous ne sommes pas intimidés parce que nous savons que se joue en Ukraine notre
  sécurité d'aujourd'hui et de demain. Et tous ceux qui pensaient que la Russie était
  prête à trouver des compromis faciles et de court terme, savent très clairement
  ce que c'est que d'avoir une puissance désinhibée à nos frontières. Donc si on veut
  une paix et une sécurité durable, il faut faire ce qu'on est en train de faire en
  Ukraine, continuer nos efforts de défense et de sécurité comme nous l'avons fait
  avec nos lois de programmation militaire successives, et accroître notre résilience
  nationale, y compris civile, sur nos emprises. Je vais prendre une dernière question.
  Journaliste Lorsqu'on vous écoute, il y a un grand sentiment d'impuissance, notamment
  pour le quotidien des Français. Est-ce que vous diriez quand même qu'il y a de l'espoir,
  en quelque sorte, pour tous nos compatriotes ? Et puis vous évoquiez un instant
  cette guerre menée par la Russie. Est-ce qu'il y a eu jusqu'ici des menaces très
  concrètes sur notre territoire français ? Et comment envisagez-vous d'éventuelles
  futures discussions avec Vladimir Poutine, par exemple ? Emmanuel MACRON Les contacts
  avec la Russie ont toujours été maintenus au niveau des services. Tout ce qui s'est
  passé et les attaques hybrides des dernières semaines n'ont jamais donné lieu à
  des messages de prévention ou d'alerte. Donc, ce que je veux dire par là, c'est
  que nous avons subi des attaques informationnelles, nous avons subi des attaques
  cyber, elles ont été documentées, attribuées et nous savons, là aussi, elles ont
