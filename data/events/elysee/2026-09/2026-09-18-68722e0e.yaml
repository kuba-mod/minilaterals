  eux. Nous avons énormément protégé les Français, beaucoup plus qu'ailleurs en Europe,
  face à la crise du Covid, comme face à la crise énergétique que nous avons subie
  et qui, elle, était aussi importée, qui étaient les conséquences de la guerre russe
