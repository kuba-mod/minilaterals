  Donc on a des voies et moyens diplomatiques de le faire. Deuxièmement, nous mobiliser
  pour sécuriser les approvisionnements, comme je l'ai rappelé. C'est très important
  parce qu'on doit, face à ces situations risquées, la vérité et donc c'est par cette
  action diplomatique qu'on pourra pleinement sécuriser ces volumes pour nos compatriotes.
  Et puis c'est la mobilisation européenne pour agir ensemble et faire baisser ces
  prix. Au-delà de ça, une fois qu'on a activé tous ces leviers, une fois qu'on a
  été au maximum, il y aura en effet des mesures d'accompagnement et il y en a déjà.
  Donc ces mesures d'accompagnement, ce sera le fruit du travail du gouvernement,
  soit pour des secteurs qui sont très dépendants, qui ne peuvent pas faire autrement,
  et qui, à court terme, ne peuvent pas subir, malgré tous nos efforts, toute notre
  action, l'évolution de ces prix, soit auprès de nos compatriotes. On connaît les
  mesures, elles sont en cours, ce qu'on appelle la mesure gros rouleur, qui touche
  environ 3 millions de nos compatriotes. Donc tout ça fera l'objet d'une analyse
  et d'une action. Nous agirons sur l'ensemble de ces leviers. Mais on agira en étant
  lucides. Cette flambée des prix n'est pas la conséquence de décisions gouvernementales
  ou de mesures nationales, mais de la situation géopolitique. Nous avons des contraintes
  de finances publiques et nous sommes mobilisés pour être aux côtés des Français.
  Journaliste Plusieurs candidats ont évoqué une situation sociale explosive en France.
  Vous-même, vous avez souligné la gravité de la situation. Les appels plus ou moins
  formels à la mobilisation se multiplient et on voit que les réponses gouvernementales
  sont forcément limitées aussi par la situation des finances publiques. Quelle est
  votre analyse de la situation sociale du pays et redoutez-vous des mouvements du
  type gilet jaune ou d'autres types de mouvements dans les semaines et les mois qui
  viennent ? Et par ailleurs, permettez-moi, nous sommes en pleine campagne pour une
  élection présidentielle à laquelle vous ne pouvez pas être candidat. Est-ce que
  la réunion d'aujourd'hui correspond au rôle que vous vous assignez pendant cette
  campagne ? Est-ce que vous allez intervenir régulièrement pour dire ce que sont,
  selon vous, les enjeux et le contexte ? Et pour compléter, est-ce que vous trouvez
  que la campagne est aujourd'hui à la hauteur de ces enjeux ? Emmanuel MACRON Merci.
  Je pense que la réunion d'aujourd'hui, et merci pour votre question, était importante.
  J'ai eu l'occasion d'ailleurs ces dernières années de procéder à de telles réunions
  et d'en organiser en 2024, en 2025, en janvier dernier, ici même, pour rendre compte
  de la situation, souvent des crises internationales, et de l'impact sur nos vies.
  Monsieur le Premier ministre lui-même a eu l'occasion aussi de faire plusieurs réunions
  sur les risques cyber, les risques d'ingérence avec les forces politiques. Je considère
  en effet que c'est notre devoir de procéder à ces exercices de transparence, pour
  que les forces politiques, qui ont un rôle au Parlement par les textes qu'elles
  vont voter ou les initiatives qu'elles ont à prendre, et évidemment par les candidats
