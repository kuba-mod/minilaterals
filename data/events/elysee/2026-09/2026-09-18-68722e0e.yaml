  en ai déjà rendu compte, plusieurs d'entre elles ont été attribuées et oui, ce risque,
  il existe, il est réel. Et la menace a été rehaussée. Donc, face à ça, on agit.
  Pour ce qui est des prix, nous sommes mobilisés et nous agissons. Vraiment, c'est
  l'inverse qu'il faut comprendre de ce que j'ai dit. On agit, ces derniers mois,
  par les actions diplomatiques qu'on conduit pour pouvoir rouvrir. Nous ne sommes
  pas des parties prenantes à ce conflit. Ce n'est pas une action française ou européenne
