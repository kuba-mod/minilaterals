  accords de sécurisation et ça, c'est très important, parce qu'il y a des pays, cet
  été, l'été dernier qui ont manqué de jet fuel et qui ont dû réguler leur trafic
  aérien. Nous, nous arrivons à les sécuriser et donc cette action, elle est très
  importante pour que, justement, tout au long de l'hiver, on ait une sécurité d'approvisionnement.
  Cette sécurité d'approvisionnement ne se fera pas toute seule sur les produits les
  plus sensibles. Donc là, on agit. Ensuite, on agit en européen pour pouvoir produire
  plus, sécuriser davantage et trouver les flexibilités. Ça, c'est de l'action avec,
  là aussi, un impact qui aura sur les prix. Et ce qu'on est en train de faire, à
  la fois à Ormuz et aux côtés de nos partenaires saoudiens, sur Yanbou, pour aider
  à ce que ça rouvre, ça a un impact. Parce que, comme je le disais, la guerre a commencé
  fin février dernier, il y a eu tout de suite un impact sur les prix. Mais on a réussi,
  quand le trafic avait repris ou qu'on avait trouvé des voies de contournement, à
  ce que les prix soient plus bas qu'aujourd'hui. Donc c'est ces efforts-là qui ne
  sont pas le règlement complet de la guerre, mais l'accompagnement de ces efforts
  qui vont nous permettre de faire rebaisser les prix à la pompe. Donc ce qui est
  important de comprendre, c'est que nous sommes mobilisés, on aura des résultats
  sur la sécurité d'approvisionnement, comme les prix dans les semaines et les mois
  qui viennent, mais on n'a pas la totalité du problème en main, parce que ce n'est
  pas nous qui détenons la clé d'Ormuz. Mais là-dessus, on agit. La France et l'Europe
  sont à la manœuvre et nous pouvons faire des choses, et nous en avons fait ces dernières
  semaines. Parce qu'aussi, on est plutôt des vecteurs de paix et qu'on a des partenaires
  qu'on a beaucoup engagés ces dernières années, qui sont aussi nos fournisseurs.
  Et comment on peut sécuriser les approvisionnements ? C'est parce qu'on a été aux
  côtés de l'Irak dès qu'il est sortie de la guerre, en étant les premiers à faire
  la conférence de Bagdad. C'est parce que nous, on a mis des systèmes et qu'on a
  défendu les Émirats et le Qatar quand ils ont été attaqués il y a quelques mois.
  C'est parce qu'on avait ici l'Arabie saoudite et qu'on est aussi des partenaires.
  C'est grâce à ça qu'on sécurise nos approvisionnements. Donc ça, c'est notre action
  internationale et européenne. Et puis le gouvernement, il agit aujourd'hui aussi
  pour accompagner les filières et les ménages, et il continuera de le faire dans
  les semaines et les mois qui viennent, mais en analysant la situation. Mais il ne
  faut pas que le débat public vienne tout de suite se concentrer en quelque sorte
  comme si la flambée des prix n'était que le résultat de décisions intérieures nationales.
  Ce n'est pas vrai. Si on fait ça, on fera des erreurs extrêmement importantes et
  on va dépenser énormément d'argent public que nous n'avons pas pour régler une situation
  que nous subissons et que nous importons. Donc vous voyez bien que ce n'est pas
  la meilleure réponse. Donc, face à cette émotion, face à la colère, face parfois
  au désespoir qu'ont certaines familles et que je ressens avec eux parce que cette
  situation est intenable, je veux leur dire qu'on agit et qu'on peut avoir des résultats.
  Mais on agit avec méthode, en analysant la situation et en le faisant de la manière
  la plus efficace possible. Voilà. Je vous remercie beaucoup, Mesdames et Messieurs.
  J'aurai l'occasion, comme je l'ai dit, de revenir auprès de vous à l'issue des initiatives
  des prochains jours, sans doute en deuxième partie de semaine prochaine. Merci beaucoup.
  Merci à toutes et tous.
