  à la fois pour accroître la coopération et éviter des tensions inutiles entre les
  pays du G7 et nos principaux partenaires, pour aussi considérer les options de libération
  potentielle de stocks stratégiques ou de déblocage, comme nous l'avions fait d'ailleurs
  il y a quelques mois avec nos partenaires, en lien étroit avec l'Agence internationale
  de l'énergie. À période exceptionnelle, mesures exceptionnelles, nous voulons aussi
  agir au niveau européen. C'est pourquoi, dès aujourd'hui, je vais saisir la présidente
  de la Commission européenne, d'abord pour accélérer les travaux sur les stockages
  de gaz au niveau européen, ensuite pour pouvoir accélérer toutes les flexibilités
  possibles pour baisser nos prix et la structure de nos prix de l'énergie, et tout
  faire pour évidemment maintenir nos capacités et d'importation et de raffinerie.
  À cet égard, j'adresserai donc dans cette saisine plusieurs axes d'efforts pour
  libérer nos capacités de production, travailler sur toutes les flexibilités possibles,
  faciliter le recours au biocarburant lorsque c'est techniquement possible, une série
  de mesures très concrètes et activables rapidement qui doivent nous permettre de
  raffiner plus vite et davantage, en européen de consolider davantage de volume et
  d'activer des flexibilités qui nous permettront de réduire à très court terme nos
  dépendances aux hydrocarbures devenues plus chères et faire baisser les prix pour
  l'ensemble de nos compatriotes. Cette action européenne est urgente et, dans les
  prochaines semaines, elle sera au cœur de notre travail avec nos partenaires européens.
  Enfin, au niveau national, nous voulons, avec Monsieur le Premier ministre, évidemment
  nous assurer de l'ensemble de nos capacités à la fois d'apport, d'import et de production.
  Le Premier ministre, dans les prochaines heures et en particulier lundi, à travers
  une série de réunions et un séminaire gouvernemental, aura à coordonner les actions
  nationales au-delà de ce qui a déjà été fait sur plusieurs domaines. Sécuriser tous
  nos approvisionnements sur la base des efforts diplomatiques que nous venons de
  construire, donner de la visibilité sur les semaines et les mois qui viennent à
  toutes les mesures justement de gestion de nos stocks et de fluidité pour éviter
