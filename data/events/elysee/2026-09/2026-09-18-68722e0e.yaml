date: '2026-09-18'
type: press_release
source_name: elysee
title: Situation internationale.
text: Le Président Emmanuel Macron a réuni ce vendredi les chefs des partis représentés
  au Parlement afin d’évoquer les conséquences de la situation internationale sur
  la sécurité et le quotidien des Français. Les responsables de la DGSI, de la DGSE,
  de la DRM, de la DGEC et du SGDSN ont présenté un point de situation sur la guerre
  en Ukraine et au Moyen-Orient . Face à l’intensification des menaces hybrides russes
  , le Président de la République a réaffirmé le soutien de la France à l’Ukraine
  et sa politique de sanctions contre la Russie . La France a également renforcer
  sa posture de vigilance, notamment pour protéger ses infrastructures critiques et
  ses sites sensibles face aux risques d’attaques cyber et de drones , et accélérer
  la lutte contre les ingérences étrangères. La guerre au Moyen-Orient a également
  des conséquences directes sur les Français, notamment avec la hausse des prix de
  l’énergie. Au niveau international , la France œuvre à faciliter la réouverture
  pacifique du détroit d’Ormuz et à sécuriser les approvisionnements énergétiques
  . Le G7 se réunira dans les prochaines semaines afin de renforcer la coordination
  entre partenaires sur les niveaux de stocks d’énergie . La France poursuit également
  ses échanges avec ses partenaires, notamment en matière d’approvisionnement en hydrocarbures
  et de gaz naturel liquéfié. Le Premier ministre coordonnera les travaux pour sécuriser
  les capacités d’importation et de production, renforcer les chaînes logistiques,
  poursuivre l’électrification du pays et accompagner les Français ainsi que les filières
  économiques face à la hausse des prix de l’énergie. 18 septembre 2026 - Seul le
  prononcé fait foi Emmanuel MACRON Monsieur le Premier ministre, mesdames, messieurs,
  merci beaucoup d'être là. Je souhaitais vous rendre compte et répondre à vos questions
  à l'issue de cette réunion que nous avons souhaitée faire avec Monsieur le Premier
  ministre, en invitant l'ensemble des forces politiques représentées à l'Assemblée
  nationale et au Sénat et leurs candidats, pour évoquer la situation aujourd'hui
  que vit notre pays et les conséquences très directes sur la vie de nos compatriotes
  de la situation internationale. A ce titre, le directeur général de la Sécurité
  extérieure, la directrice générale de la Sécurité intérieure, le directeur du Renseignement
  militaire et le secrétaire général de la Défense et de la Sécurité nationale, ainsi
  que le directeur général de l'Énergie ont pu faire un point détaillé sur les deux
  grandes crises qui bousculent notre pays et l'ensemble des nations du monde. La
  première crise, les conséquences premières sont celles de la guerre d'agression
  russe en Ukraine. Nous connaissons cette situation dans sa phase la plus intense
  depuis février 2022, mais ces dernières semaines, la menace en particulier, la menace
  hybride russe à l'égard des Européens et de la France s'est intensifiée. En Ukraine,
  vous le savez, la guerre est, chaque mois, très meurtrière, avec des pertes de part
  et d'autre qui sont considérables et avec aucun équivalent contemporain. Vous connaissez
  évidemment, je n'y reviens pas, la position de la France et des Européens en soutien
  à l'Ukraine, sanctionnant la Russie. Mais depuis cet été, la Russie a multiplié
  les attaques contre les intérêts européens. J'ai pu ici, à plusieurs reprises, rappelez-vous
  l'alerte sonnée en février 2024 en appelant les Européens à gagner en ambiguïté
  stratégique, annonçant ce que nous allions faire un an plus tard avec la coalition
  des volontaires. Je veux ici dire que la nature de l'agressivité russe et de ces
  menaces en Europe change. L'attaque de drones sur un train de passagers depuis Kiev,
  il y a quelques jours, la tentative d'attaque à l'aéroport de Leipzig, qui a échoué,
  mais c'est parce qu'elle a échoué qu'il y a eu si peu de conséquences, attribuée
  par les services allemands aux GRU, le tir de fusée éclairante à proximité d'une
  frégate danoise, des incursions dans l'espace aérien dans plusieurs pays européens
  et la multiplication d'actes hostiles dans la plupart de nos pays. Le DRM et le
  SGDSN ainsi que la DGSI ont pu faire l'état des attaques hybrides dont notre pays
  a fait l'objet ces dernières semaines face à ces situations. Notre position est
  claire, le soutien à l'Ukraine est plus que jamais indispensable parce qu'il est
  la condition de notre sécurité et d'un retour à une paix juste et durable. C'est
  la position qui demeure, c'est celle aussi qui nous conduit avec le Royaume-Uni
  à piloter cette coalition des volontaires, et d'ailleurs à avoir dans quelques semaines
  des exercices qui seront menés sur le sol européen pour consolider celle-ci. C'est
  aussi ce qui a justifié la réunion du 13 juillet dernier, la coalition nouvelle
  et les composantes nouvelles que la France livre, comme d'autres pays, aux Ukrainiens.
  Sur la menace intérieure, nous avons tenu un Conseil de Défense et de Sécurité nationale
  mercredi dernier, à l'issue duquel le Premier ministre a pu donner un ensemble d'instructions
  à ses ministres et ses services. À notre demande, le ministre de l'Intérieur a réuni
  hier l'ensemble des préfets de zone pour monter la posture et la vigilance à l'égard
  des attaques hybrides russes, et a demandé au gouvernement de préparer un plan de
  protection de nos infrastructures critiques, ainsi que des sites les plus sensibles
  de notre base industrielle et technologique de défense, contre les attaques de drones
  et les attaques cyber. Au-delà de ce rehaussement légitime de notre posture, sur
  lequel nous avons informé les forces politiques et donné les détails, nous poursuivons
  aussi le travail enclenché depuis plusieurs mois afin d'améliorer notre protection
  contre les ingérences étrangères et les attaques cyber. La France a été l'un des
  premiers pays d'Europe à s'organiser en la matière, créant VIGINUM il y a maintenant
  cinq ans, développant ses pratiques, venant en aide à la Roumanie ou la Moldavie,
  pour ne citer que quelques exemples lorsqu’elles furent attaquées. Nous avons bâti
  de nouveaux textes sur les ingérences étrangères comme le cyber, qui continueront
  aussi vite que nous le pouvons leur chemin législatif pour pouvoir être pleinement
  applicables dans les semaines qui viennent. Au-delà de ça, plusieurs mesures réglementaires
  ont été prises et continueront d'être prises en la matière. Il y a eu un long débat
  et beaucoup de questions et réponses sur la question des ingérences lors de l'échange
  avec les forces politiques. La deuxième crise que nous vivons, ce sont les conséquences
  de la guerre au Proche et Moyen-Orient et, en particulier, les conséquences sur
  le prix de l'énergie et sur la vie de nos compatriotes. Nul n'ignore ici ce que
  vivent tant et tant de nos compatriotes, de familles, depuis ces dernières semaines,
  où le prix des carburants a fortement augmenté. Les prix à la pompe atteignent des
  niveaux historiques qui font aujourd'hui beaucoup souffrir, qui accroissent les
  problèmes de pouvoir d'achat, l'inquiétude monte sur les prix du gaz et la situation
  énergétique. Cette situation est due intégralement aux guerres et à la situation
  internationale. C'est aussi l'objectif de cette réunion. Et elle est en particulier
  due, puisque la guerre en Ukraine dure depuis quatre ans, à la fermeture du détroit
  d'Ormuz et aux conséquences des attaques qui ont été lancées par les États-Unis
  d'Amérique et Israël en Iran. Vous le savez, cette guerre, la France ne l'a pas
  choisie. Elle n'y a d'ailleurs pas participé. Mais, comme beaucoup d'autres pays,
  nous vivons les conséquences de ce qu'elle a déclenché. Le détroit d'Ormuz reste
  quasiment bloqué. En tout cas, il n'y a pas d'accord qui permettent de réouvrir
  les choses et, aujourd'hui, le transit s'est dégradé par rapport à ce qui était
  la situation il y a quelques semaines. Des voies de contournement avaient pu être
  trouvées, comme le pipeline en Arabie saoudite débouchant sur Yanbou, en mer Rouge,
  qui avait permis de transférer plusieurs millions de barils par jour, l'équivalent.
  Aujourd'hui, après les attaques des houthis sur Yanbou, ces volumes ont aussi fortement
  diminué. Cette situation, à laquelle s'ajoute la destruction des infrastructures
  énergétiques en Russie et en Ukraine, conséquence de la guerre d'agression russe,
  a conduit à une explosion des prix de l'énergie partout dans le monde. Le brut,
  le diesel, l'ensemble des produits raffinés et transformés, donc diesel ou jet fuel,
  mais aussi une tension sur le gaz pour aujourd'hui et pour demain. Cette situation
  est évidemment celle que nous connaissons et que connaissent nos compatriotes, mais
  celle aussi qui va continuer dans les prochaines semaines de rythmer la vie du pays.
  Donc, nous avons pu partager notre analyse, mais aussi les actions que nous menons.
  Aujourd'hui, la France fait tout pour faciliter la réouverture pacifique du détroit
  d'Ormuz. C'est l'action que, dès le mois d'avril dernier, nous avons conduite ici
  même, en réunissant pour la première fois cette mission internationale défensive
  avec l'Organisation internationale maritime, pour permettre, dès qu'un accord serait
  trouvé, d'escorter les tankers et les porte-conteneurs, qui permettraient de réouvrir
  de manière pacifique Ormuz. Ceci dépend de la capacité à finaliser un accord qui
  nous paraît peu probable entre l'Iran et les États-Unis d'Amérique à court terme.
  Néanmoins, des discussions que nous accompagnons existent entre Oman et l'Iran,
  et il existe là aussi des chemins diplomatiques qui permettraient la réouverture
  de ce détroit, et nous sommes donc disposés à accompagner celle-ci et à sécuriser
  le trafic. Deuxième action que nous sommes en train de mener, c'est de sécuriser
  nos volumes et nos approvisionnements sur les catégories les plus sensibles, où
  il y a pu y avoir des tensions dès cet été, je pense au jet fuel qui a touché beaucoup
  de pays dépendants, et le gaz qui peut toucher les Européens cet hiver, même si
  la France, elle, est au bon niveau de stockage attendu et obtiendra pour cet hiver
  le remplissage des cuves comme nous devons le faire selon les critères européens,
  c'est-à-dire nous serons à 80 %, mais l'Europe en tant que telle reste dépendante
  du gaz plus que la France elle-même, et donc nous devons agir pour qu'il n'y ait
  pas de tensions sur ce marché. Et donc diesel, jet fuel et gaz sont notre priorité.
  À ce titre, ça a été le cœur de l'action diplomatique que j'ai pu conduire ces dernières
  semaines, en recevant ici le Premier ministre d'Arabie saoudite, le Prince héritier,
  Mohamed Ben Salmane, qui est évidemment un grand fournisseur, en travaillant ensemble
  sur les solutions pour sécuriser extraction, production et sortie des hydrocarbures
  fossiles et notre approvisionnement. C'est aussi à ce titre que j'ai reçu il y a
  quelques jours le Premier ministre irakien, avec lequel nous avons signé des accords
  pour sécuriser nos volumes et nos approvisionnements pour aujourd'hui et pour les
  années à venir, et avec lesquels aussi nous avons travaillé sur plusieurs projets
  de pétrole et de gaz. C'est ce qui a été au cœur de mes échanges avec l'émir du
  Qatar ou avec le président des Émirats arabes unis, deux grands fournisseurs. C'est
  aussi ce dont j'ai pu parler hier avec le président du Nigeria, qui est également
  un de nos grands fournisseurs sur les hydrocarbures. Toutes ces initiatives ayant
  vocation à sécuriser à court terme nos approvisionnements dans les catégories les
  plus critiques que j'évoquais. À côté de cela, nous avons accéléré les travaux lancés
  par la France avec quelques autres depuis plusieurs mois, même plusieurs années,
  pour multiplier les corridors énergétiques et réduire nos dépendances. C'est ce
  que nous avions lancé avec l'Inde dès son G20 et ce que nous avons accéléré ces
  derniers mois, en particulier dans le cadre du G7 que la France a organisé, en invitant
  les pays qui étaient concernés. Donc nous avons des travaux qui sont en cours pour
  organiser des pipelines depuis l'Irak jusqu'à la Méditerranée orientale, afin de
  sécuriser la sortie de ce gaz. Nos acteurs énergétiques font partie de ces coalitions
  et nous avons pu y revenir avec le Premier ministre irakien lundi, et hier avec
  le roi de Jordanie et avec le président Aoun, la Jordanie et le Liban faisant partie,
  aux côtés de la Syrie, des pays critiques pour sécuriser cette sortie du gaz irakien.
  C'est aussi ce qui nous conduit à travailler avec l'Arabie saoudite et l'Égypte
  pour permettre l'acheminement d'autres capacités de gaz ou de produits raffinés
  depuis les pays du Golfe vers la Méditerranée orientale. L'ensemble de ces projets,
  nous continuerons évidemment de les accélérer, mais ça a été aussi au cœur de notre
  action diplomatique des derniers jours et des dernières semaines. Dès dimanche,
  je rencontrerai aussi le Premier ministre du Canada, Marc Carney à Saint-Pierre-et-Miquelon,
  pour renforcer nos échanges commerciaux en matière de produits pétroliers et de
  gaz naturels liquéfiés. Vous le voyez donc, au-delà de tout faire pour rouvrir Hormuz
  et participer aux efforts diplomatiques, le deuxième axe d'effort international,
  c'est sécuriser nos approvisionnements pour préparer les semaines et les mois qui
  viennent, faire le maximum pour essayer de faire baisser les prix et travailler
  à des voies alternatives pour réduire notre dépendance à Ormuz. Au-delà de ces travaux,
  la France, présidant le G7, aura à prendre plusieurs initiatives et je convoquerai
  un G7 pour avancer sur une meilleure coordination sur les niveaux de stock, avec
  une plus grande coopération aussi sur les exportations et les capacités de production.
  Nous aurons dans les prochaines semaines un G7 qui sera consacré à ces sujets énergétiques,
  à la fois pour accroître la coopération et éviter des tensions inutiles entre les
  pays du G7 et nos principaux partenaires, pour aussi considérer les options de libération
  potentielle de stocks stratégiques ou de déblocage, comme nous l'avions fait d'ailleurs
  il y a quelques mois avec nos partenaires, en lien étroit avec l'Agence internationale
  de l'énergie. À période exceptionnelle, mesures exceptionnelles, nous voulons aussi
  agir au niveau européen. C'est pourquoi, dès aujourd'hui, je vais saisir la présidente
  de la Commission européenne, d'abord pour accélérer les travaux sur les stockages
  de gaz au niveau européen, ensuite pour pouvoir accélérer toutes les flexibilités
  possibles pour baisser nos prix et la structure de nos prix de l'énergie, et tout
  faire pour évidemment maintenir nos capacités et d'importation et de raffinerie.
  À cet égard, j'adresserai donc dans cette saisine plusieurs axes d'efforts pour
  libérer nos capacités de production, travailler sur toutes les flexibilités possibles,
  faciliter le recours au biocarburant lorsque c'est techniquement possible, une série
  de mesures très concrètes et activables rapidement qui doivent nous permettre de
  raffiner plus vite et davantage, en européen de consolider davantage de volume et
  d'activer des flexibilités qui nous permettront de réduire à très court terme nos
  dépendances aux hydrocarbures devenues plus chères et faire baisser les prix pour
  l'ensemble de nos compatriotes. Cette action européenne est urgente et, dans les
  prochaines semaines, elle sera au cœur de notre travail avec nos partenaires européens.
  Enfin, au niveau national, nous voulons, avec Monsieur le Premier ministre, évidemment
  nous assurer de l'ensemble de nos capacités à la fois d'apport, d'import et de production.
  Le Premier ministre, dans les prochaines heures et en particulier lundi, à travers
  une série de réunions et un séminaire gouvernemental, aura à coordonner les actions
  nationales au-delà de ce qui a déjà été fait sur plusieurs domaines. Sécuriser tous
  nos approvisionnements sur la base des efforts diplomatiques que nous venons de
  construire, donner de la visibilité sur les semaines et les mois qui viennent à
  toutes les mesures justement de gestion de nos stocks et de fluidité pour éviter
  les ruptures de charges, qu'il s'agisse à la fois du pétrole, des produits raffinés
  ou du gaz, et donc sécuriser nos chaînes logistiques et nos approvisionnements.
  Le deuxième axe d'effort, ce sera aussi d'accélérer et d'optimiser tous les efforts
  en matière d'électrification et de réduction de nos dépendances à ces hydrocarbures.
  Le troisième axe d'effort, ce sera de consolider nos mesures d'accompagnement de
  nos compatriotes et des grandes filières économiques. Comme vous le savez, il y
  a déjà eu des plans de filières qui ont été pris pour nos pêcheurs, nos agriculteurs
  et plusieurs autres. Ceux-ci seront évalués, si nécessaire, adaptés. Ils pourront
  aussi être, dans cette évaluation, modulés sur leurs composantes et la rapidité
  des aides données. Le Premier ministre évaluera avec ses ministres cela, ainsi que
  les mesures d'accompagnement de nos compatriotes. Là aussi, vous avez plusieurs
  mécanismes qui existent, mais ces travaux permettront d'en tirer des conclusions
  provisoires et de pouvoir les adapter et d'en tirer les conséquences pour la vie
  de nos compatriotes, pour les accompagner dans cette période. Voilà, Mesdames et
  Messieurs, ce que je souhaitais vous dire pour rendre compte de cette réunion. Elle
  était importante parce que la situation que nous traversons est grave. Elle est
  grave du fait de la situation internationale et des conséquences des guerres que
  nous subissons. Et dans un tel contexte, nous devons d'abord rester unis, mobilisés.
  Nous devons essayer de traiter les problèmes à leur racine, c'est-à-dire tout faire
  pour que les causes premières soient résolues et donc essayer de bâtir la paix,
  réduire nos dépendances et nous protéger et protéger nos compatriotes pour l'hiver.
  C'est exactement ce que nous faisons. Et puis, nous avons les mesures d'accompagnement
  parce que la situation est dure pour beaucoup de familles françaises et pour aussi
  beaucoup de professions. Et donc, le gouvernement et moi-même, avons à cœur d'accompagner
  nos compatriotes dans cette période que je sais si dure. Je veux leur dire ici que
  nous sommes à leurs côtés et que nous nous mobiliserons. Je l'ai dit, le Premier
  ministre, dans les heures et jours à venir aura à mener ses travaux. Pour ma part,
  dès dimanche, je verrai le Premier ministre du Canada, je verrai plusieurs autres
  dirigeants à New York lundi et mardi et j'aurai l'occasion de revenir à l'issue
  de ces déplacements devant les Françaises et les Français, à la fois pour leur rendre
  compte de nos actions et revenir aussi sur les prochains mois. Je vais maintenant
  répondre à vos questions. Journaliste Vous avez parlé de prix historiques qui font
  souffrir les Français pour vous citer. Le prix du gazole vient de battre aujourd'hui
  2,39 euros le litre en moyenne. Est-ce que très concrètement, les Français doivent
  se préparer à un prix qui pourrait aller d'ici la fin de l'année vers 2,50 euros,
  vers 3 euros ? Dans cette perspective, est-ce que les mesures portées par le Premier
  ministre ici présent sont suffisantes et vers où aller ? Vous avez dit que lundi,
  il y aurait des réunions, quelles pistes ont votre assentiment ? Et puis enfin,
  vous avez reçu des personnalités politiques ce matin nombreuses. Certaines vous
  demandent un blocage des prix, d'autres une baisse de la taxation sur les carburants.
  Est-ce que ce sont des pistes sérieuses, crédibles qui méritent d'être expérimentées ?
  Emmanuel MACRON Merci. Merci beaucoup. D'abord, tout mérite d'être analysé, tout
  doit être analysé et expérimenté parce que c'est ce que nous devons faire pour accompagner
  nos compatriotes. La situation est très dure. Vous avez rappelé les prix. Elle est
  angoissante pour beaucoup de familles et elle impose que nous soyons pleinement
  mobilisés. Donc, évidemment, tous les efforts sont faits, on ira au bout. Sur les
  réponses nationales, le Premier ministre y reviendra. J'appelle simplement l'attention
  collective sur plusieurs éléments. Le premier, j'entends beaucoup de gens qui nous
  disent faites ceci, faites cela, bloquez les prix, dépensez plus. Ce sont les mêmes
  qui, il y a 15 jours, nous disaient vous avez beaucoup trop fait de manière irresponsable
  ces dernières années, entre 2022 et 2024, ou pendant le Covid, pour nous mettre
  dans ces situations de finances publiques. Donc, il y a un moment donné, il faut
  juste être cohérent et honnête avec les Français. Moi, je veux être honnête avec
  eux. Nous avons énormément protégé les Français, beaucoup plus qu'ailleurs en Europe,
  face à la crise du Covid, comme face à la crise énergétique que nous avons subie
  et qui, elle, était aussi importée, qui étaient les conséquences de la guerre russe
  en Ukraine. Aujourd'hui, on a une responsabilité aussi de finances publiques. Vous
  avez, à juste titre, largement relayé. Donc, il ne faut pas que les mêmes qui ont
  déploré les conséquences de mesures naguère viennent nous redemander de faire la
  même chose. Ensuite, je veux attirer l'attention collective. La France a parfois
  été en colère face à des décisions prises par nous ou nos prédécesseurs, qui avaient
  eu vocation à monter les prix du carburant. J'en ai quelques souvenirs. J'étais
  au contact des Français, on a pris des mesures. La situation que nous vivons aujourd'hui
  sur les prix à la pompe, comme sur l'ensemble des prix des hydrocarbures fossiles,
  n'est pas la conséquence de décisions gouvernementales, elle est la conséquence
  de la situation géopolitique. Il faut avoir l'honnêteté de le rappeler. Face à ça,
  avant de dépenser le maximum d'argent, qui est l'argent des Français, et qui se
  traduira soit en déficit accru, soit en impôts, il faut surtout que nous soyons
  mobilisés pour essayer d'en traiter les causes. C'est ce que nous faisons. Dans
  l'ordre que je viens de rappeler, nous mobiliser pour obtenir la paix et la réouverture
  des voies. C'est ce qu'on veut faire sur Ormuz, y compris en facilitant ce petit
  accord et en ressortant des volumes. C'est aussi pour ça que ce travail, y compris
  ce qu'on veut faire pour aider à sécuriser la sortie en mer rouge du pipeline de
  Yanbou, est très important parce qu'il y a un mois, la situation était moins tendue.
  Donc on a des voies et moyens diplomatiques de le faire. Deuxièmement, nous mobiliser
  pour sécuriser les approvisionnements, comme je l'ai rappelé. C'est très important
  parce qu'on doit, face à ces situations risquées, la vérité et donc c'est par cette
  action diplomatique qu'on pourra pleinement sécuriser ces volumes pour nos compatriotes.
  Et puis c'est la mobilisation européenne pour agir ensemble et faire baisser ces
  prix. Au-delà de ça, une fois qu'on a activé tous ces leviers, une fois qu'on a
  été au maximum, il y aura en effet des mesures d'accompagnement et il y en a déjà.
  Donc ces mesures d'accompagnement, ce sera le fruit du travail du gouvernement,
  soit pour des secteurs qui sont très dépendants, qui ne peuvent pas faire autrement,
  et qui, à court terme, ne peuvent pas subir, malgré tous nos efforts, toute notre
  action, l'évolution de ces prix, soit auprès de nos compatriotes. On connaît les
  mesures, elles sont en cours, ce qu'on appelle la mesure gros rouleur, qui touche
  environ 3 millions de nos compatriotes. Donc tout ça fera l'objet d'une analyse
  et d'une action. Nous agirons sur l'ensemble de ces leviers. Mais on agira en étant
  lucides. Cette flambée des prix n'est pas la conséquence de décisions gouvernementales
  ou de mesures nationales, mais de la situation géopolitique. Nous avons des contraintes
  de finances publiques et nous sommes mobilisés pour être aux côtés des Français.
  Journaliste Plusieurs candidats ont évoqué une situation sociale explosive en France.
  Vous-même, vous avez souligné la gravité de la situation. Les appels plus ou moins
  formels à la mobilisation se multiplient et on voit que les réponses gouvernementales
  sont forcément limitées aussi par la situation des finances publiques. Quelle est
  votre analyse de la situation sociale du pays et redoutez-vous des mouvements du
  type gilet jaune ou d'autres types de mouvements dans les semaines et les mois qui
  viennent ? Et par ailleurs, permettez-moi, nous sommes en pleine campagne pour une
  élection présidentielle à laquelle vous ne pouvez pas être candidat. Est-ce que
  la réunion d'aujourd'hui correspond au rôle que vous vous assignez pendant cette
  campagne ? Est-ce que vous allez intervenir régulièrement pour dire ce que sont,
  selon vous, les enjeux et le contexte ? Et pour compléter, est-ce que vous trouvez
  que la campagne est aujourd'hui à la hauteur de ces enjeux ? Emmanuel MACRON Merci.
  Je pense que la réunion d'aujourd'hui, et merci pour votre question, était importante.
  J'ai eu l'occasion d'ailleurs ces dernières années de procéder à de telles réunions
