title: Déclaration conjointe franco-jordanienne.
text: 1. Sa Majesté le Roi Abdallah II Ibn Hussein, Roi du Royaume hachémite de Jordanie,
  a effectué le 17 septembre une visite officielle en France, à l’invitation du Président
  de la République française, Emmanuel Macron. Les deux chefs d’État se sont entretenus
  de manière détaillée sur les moyens de renforcer les relations historiques d’amitié
  entre les deux pays et ont échangé sur la situation régionale et les questions internationales
  d'intérêt commun. 2. Ils ont confirmé les liens profonds unissant la France et la
  Jordanie, qui reposent sur une amitié solide, la confiance et le respect mutuel,
  et ils ont souligné l’importance de poursuivre la coordination de leurs efforts
  et leur concertation, ainsi que de rapprocher leurs points de vue sur plusieurs
  dossiers régionaux et internationaux d'intérêt commun. 3. Les deux chefs d’État
  ont souligné que le partenariat franco-jordanien en matière de défense et de sécurité
  était essentiel, tout comme la concertation entre les deux pays en appui aux efforts
  de désescalade régionale. Le Président de la République française a affirmé l’engagement
  de la France à soutenir la sécurité et la stabilité de la Jordanie, pierre angulaire
  de la sécurité et de la stabilité au Proche et au Moyen-Orient. 4. Les deux chefs
  d’État ont estimé que la signature, pendant la visite, d’un Accord relatif à la
  coopération en matière de défense, représente une étape importante pour consolider
  le partenariat de défense franco-jordanien. Ils ont affirmé que cet accord traduit
  l’engagement des deux pays à continuer à approfondir leur partenariat en matière
  de défense, et fournit un cadre global pour organiser les différents aspects de
  la coopération en matière de défense et de sécurité, au service de leurs intérêts
  communs. Cet accord renforce également leur capacité à faire face aux nouveaux enjeux
  et menaces en pleine évolution, soutient les efforts de renforcement des capacités
  de défense jordaniennes et permet à la France et à la Jordanie de contribuer ensemble
  encore davantage à asseoir la sécurité et la stabilité au Proche et au Moyen-Orient.
  5. Les deux chefs d’État ont réitéré la volonté des deux pays d’étendre la coopération
  économique et de développer des partenariats mutuellement avantageux dans ce domaine.
  Ils ont souligné l’implication financière de la France et la mobilisation des entreprises
  françaises en soutien au projet National Conveyor, qui constitue un projet stratégique
  vital pour la Jordanie pour faire face au stress hydrique. Ils ont également affirmé
  leur volonté de coopérer en vue de renforcer et de diversifier les chaînes d’approvisionnement
  entre le Moyen-Orient et le Proche-Orient d'une part, et entre le Moyen-Orient et
  l’Europe d’autre part, afin d’accroître le commerce, la connectivité, la prospérité
  et l’intégration régionale. 6. Les deux chefs d’État ont examiné la situation au
  Proche et au Moyen-Orient et ils ont affirmé leur préoccupation face à la persistance
  des tensions. Ils ont estimé qu'il était nécessaire que tous les acteurs concernés
  redoublent d’efforts pour mettre fin à l’escalade en recourant à la diplomatie et
  au dialogue. 7. La France a condamné avec la plus grande fermeté les attaques iraniennes
  qui ont visé la Jordanie et elle a affirmé sa solidarité avec le Royaume hachémite
  de Jordanie ainsi que la poursuite de ses efforts en vue de garantir la sécurité
  de tous ses partenaires au Moyen-Orient. Les deux pays ont indiqué appuyer l’ensemble
  des efforts visant à parvenir à une solution diplomatique qui permette de mettre
  fin à la crise, de régler ses causes et d’ancrer la sécurité et la stabilité de
  manière durable. 8. Les deux pays ont réaffirmé la nécessité de garantir la liberté
  de navigation dans le détroit d’Ormuz conformément au droit international, notamment
  à la Convention des Nations Unies sur le droit de la mer. Ils ont aussi affirmé
  la nécessité de garantir la sûreté maritime et la liberté de navigation en mer Rouge
  et dans le détroit de Bab-el-Mandeb. 9. Les deux chefs d’État ont ouvert, aux côtés
  du président de la République libanaise, le général Joseph Aoun, une réunion organisée
  dans le cadre de l’initiative d’Aqaba afin de mobiliser les efforts en soutien aux
  forces armées libanaises, de déterminer leurs besoins et de renforcer la coopération
  entre l’ensemble des parties qui leur apportent un soutien. Ils ont affirmé le soutien
  de la France et de la Jordanie aux efforts de l’État libanais pour garantir la sécurité
  du Liban, accroître sa souveraineté sur l’ensemble de son territoire et assurer
  le monopole de l’État sur les armes, ainsi que la nécessité pour toutes les parties
  de se conformer à la résolution 1701 du Conseil de sécurité. 10. Ils ont réaffirmé
  qu’il était indispensable de prendre des mesures concrètes, selon un calendrier
  clair, pour mettre en place un État palestinien indépendant et souverain dans les
  frontières du 4 juin 1967 avec pour capitale Jérusalem-Est, vivant côte-à-côte avec
  Israël en paix et en sécurité, sur la base de la solution des deux États, qui constitue
  le seul moyen de parvenir à une paix juste et durable. Ils ont également affirmé
  la nécessité de mettre pleinement en œuvre la Déclaration de New York du 29 juillet
  2025. 11. Les deux chefs d’État ont réaffirmé leur opposition à toute tentative
  d’annexion de la Cisjordanie et à toute tentative d’Israël de déplacer le peuple
  palestinien, et ils ont réaffirmé leur condamnation du projet de colonisation illégale
  E1. Ils ont réaffirmé la nécessité de préserver le statut historique et juridique
  actuel des lieux saints musulmans et chrétiens à Jérusalem. Le Président de la République
  française a affirmé le rôle essentiel de la monarchie hachémite en tant que gardienne
  de ces lieux saints. 12. Les deux chefs d’État ont affirmé qu’il était important
  de mettre en œuvre le plan de paix en 20 points du Président des États-Unis pour
  assurer la stabilité dans la bande de Gaza, et la résolution 2803 (2025) du Conseil
  de sécurité, ainsi que de garantir la protection des civils et l’accès de l’aide
  humanitaire sans entrave et en quantité suffisante. 13. Ils ont affirmé le soutien
  des deux pays à l’unité, à la sécurité, à la stabilité et à la souveraineté de la
  Syrie et leur appui au gouvernement syrien dans ses efforts de reconstruction, en
  se fondant sur les aspirations du peuple syrien et les droits de toutes ses composantes.
  Ils ont souligné la nécessité de mettre en œuvre la feuille de route adoptée par
  la Jordanie, la Syrie et les États-Unis le 16 septembre 2025 pour mettre fin à la
  crise à Souweïda et assurer la stabilité du Sud de la Syrie. 14. Ils ont aussi affirmé
  qu’il était nécessaire qu’Israël cesse ses attaques contre la Syrie, en mettant
  en garde contre les répercussions sur la sécurité et la stabilité de ces deux régions
  que pourrait avoir leur poursuite, au moment où le gouvernement syrien s’attache
  à reconstruire la Syrie et à garantir sa sécurité et sa stabilité, et privilégie
  la voie diplomatique pour régler les questions en suspens et parvenir à un accord
  de sécurité qui pourrait servir de base à un futur accord plus global. Ils ont appelé
  Israël à se retirer des territoires syriens occupés et à respecter l’accord de désengagement
  de 1974. 15. Les deux chefs d’État ont affirmé leur engagement commun de renforcer
  le respect du droit international humanitaire et de garantir son application, qui
  doit constituer une priorité politique internationale, face aux enjeux sans précédent
  auxquels est confrontée la protection des civils dans les conflits armés. Dans ce
  contexte, ils ont attiré l’attention sur les progrès remarquables de l’Initiative
  mondiale visant à revitaliser l’engagement politique en faveur du droit international
  humanitaire lancée en juillet 2024 par la Jordanie, la France, le Brésil, la Chine,
  le Kazakhstan et l’Afrique du Sud, en partenariat avec le Comité international de
  la Croix-Rouge, qui compte actuellement 118 États. Ils ont salué l’accueil par le
  Royaume hachémite de Jordanie d’une conférence internationale de haut niveau le
  7 décembre 2026, en estimant que cet événement représente une étape essentielle
  pour traduire l’élan politique suscité par cette initiative en un engagement renouvelé
  et des travaux concrets afin de mieux faire respecter le droit international humanitaire.
  Ils ont appelé les États à participer à cette conférence au niveau le plus élevé
  possible et à contribuer activement à son succès.
