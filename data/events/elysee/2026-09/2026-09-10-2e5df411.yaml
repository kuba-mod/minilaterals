title: 'L''Europe puissance spatiale : du XXIe siècle : pour une politique spatiale
  européenne compétitive, autonome et ambitieuse.'
text: 'Signatures : ALLEMAGNE, BELGIQUE, BULGARIE, CHYPRE, CROATIE, DANEMARK, ESPAGNE,
  FRANCE, GRÈCE, HONGRIE, IRLANDE, ITALIE, LETTONIE, LITUANIE, LUXEMBOURG, MALTE,
  PAYS-BAS, POLOGNE, PORTUGAL, SLOVAQUIE, SLOVÉNIE, SUÈDE. Grâce à des décennies de
  recherche, d’investissement, de coopération et d’excellence industrielle, l’Europe
  a construit un écosystème spatial complet, compétitif et innovant, qui maîtrise
  toutes les capacités critiques : lanceurs, satellites, navigation, observation de
  la Terre, connectivité, exploration, gestion de la circulation spatiale, sûreté
  spatiale, développement durable, résilience et science de l’espace. Toutefois, le
  secteur spatial mondial connaît aujourd’hui une transformation profonde. L’espace
  est devenu une infrastructure critique et un facteur essentiel pour répondre à la
  demande dans différents domaines stratégiques, une plateforme pour générer de la
  valeur ajoutée commerciale, et un domaine clé en matière de concurrence économique,
  de dynamisme technologique, de sécurité et d’influence géopolitique, les capacités
  spatiales soutenant de plus en plus des infrastructures critiques et des services
  publics essentiels. Comme l’ont clairement montré la guerre d’agression de la Russie
  contre l’Ukraine, les évolutions rapides du contexte géopolitique et d’autres événements
  mondiaux, l’autonomie stratégique dans le domaine de l’espace, notamment l’accès
  autonome à l’espace et à la connectivité spatiale, est cruciale pour la défense
  européenne et notre sécurité collective. Dans ce contexte, les capacités de soutien
  stratégique, y compris en lien avec le domaine spatial, sont un des domaines prioritaires
  clés recensés par le Conseil européen en mars 2025, ainsi que dans la déclaration
  conjointe de l’Union européenne (UE) et de l’Agence spatiale européenne (ESA) sur
  une vision à long terme pour le transport spatial. Dans le même temps, nous sommes
  confrontés à un changement climatique mondial aux répercussions graves, qui aura
  un effet à long terme à la fois sur la santé publique et sur le développement économique.
  L’Europe doit intensifier ses efforts pour répondre rapidement et efficacement à
  ces enjeux. Elle a besoin d’investissements publics et privés plus importants et
  d’un cadre réglementaire flexible et transparent qui facilite les activités privées
  et la commercialisation. Cela favorisera la croissance sur le marché et dans l’écosystème
  industriel européens, renforcera la position de l’Europe face à ces principaux concurrents,
  soutiendra la compétitivité à long terme et réduira les dépendances excessives à
  l’égard des technologies, des infrastructures, des opérateurs commerciaux et des
  services non européens dans les domaines critiques. Afin de renforcer la commercialisation,
  la compétitivité et l’autonomie stratégique et de protéger ses intérêts, l’UE doit
  pleinement adopter une véritable politique spatiale européenne cohérente et ambitieuse,
  axée sur la souveraineté technologique, la sécurité, la recherche et la capacité
  industrielle. L’Europe doit également continuer à rechercher des partenariats intelligents
  et solides et des possibilités de coopération avec des partenaires partageant ses
  valeurs, notamment des États membres de l’ESA, pour faire progresser et renforcer
  nos objectifs stratégiques dans le domaine spatial. L’échelon européen constitue
  un échelon stratégique permettant de définir un cadre commun capable de produire
  des capacités compétitives au niveau mondial et résilientes qui génèrent une valeur
  ajoutée européenne claire, notamment en mobilisant les forces du marché intérieur
  et en en tirant parti. Il doit être soutenu par des mesures rentables, fiables et
  appropriées tout en respectant pleinement le principe de subsidiarité et les rôles,
  les responsabilités et les compétences des États membres, notamment dans le domaine
  de la sécurité et de la défense. L’Europe doit par conséquent renforcer sa résilience
  et sa sécurité économique, notamment en matière d’accès autonome à l’espace ; de
  chaînes d’approvisionnement stratégiques et sécurisées ; de technologies et d’infrastructures
  critiques ; de données stratégiques ; et de santé, d’eau et de sécurité alimentaire,
  pour réduire ses dépendances dans des domaines présentant des points uniques de
  défaillance. Pour parvenir à cet objectif, nous devons agir de manière résolue pour :
  L’accès à l’espace est au cœur de notre autonomie. Les États membres de l’UE, la
  Commission, l’Agence spatiale européenne et ses États membres, l’industrie et les
  agences spatiales doivent parvenir à une compréhension commune, fondée sur le rôle
  de chacun, pour créer et mettre en œuvre une vision à long terme garantissant à
  l’Europe un accès à l’espace indépendant, fiable, durable, sûr et concurrentiel.
  Sur la base d’une concurrence renforcée en Europe, stimulée par le European Launcher
  Challenge, d’une compréhension partagée de nos besoins communs et d’une vision stratégique
  globale concertée, nous pouvons mettre en œuvre une politique industrielle et coordonner
  des actions qui favoriseront les investissements privés et publics à long terme.
  Cela renforcera la compétitivité de l’écosystème relatif à l’accès à l’espace, en
  créant un nouveau réseau de lanceurs européen qui soit concurrentiel et adapté à
  toutes les catégories de charge utile, à tous les cas d’usage et à tous les centres
  spatiaux situés sur différents territoires européens. Cet objectif doit être soutenu
  par une demande institutionnelle européenne prévisible et agrégée, une concurrence
  équitable et l’accès aux mêmes possibilités pour les acteurs européens établis et
  émergents. Dans un contexte marqué par la montée des rivalités géopolitiques, l’Europe
  ne peut plus se permettre de fragilités stratégiques en matière de connectivité,
  de positionnement, de navigation et de synchronisation (PNS), d’observation de la
  Terre, de services spatiaux ou de capacités de lancement. En conséquence, les États
  membres de l’UE continuent d’investir massivement dans leurs capacités spatiales
  respectives et de créer les conditions propices aux investissements du secteur privé.
  Pour compléter les activités des États membres en étroite coopération avec l’ESA
  et en s’appuyant sur le savoir-faire opérationnel de l’Agence de l’Union européenne
  pour le programme spatial (EUSPA), le programme spatial civil de l’UE et ses composantes
  actuelles et envisageables, comme Copernicus, Galileo, le système européen de navigation
  par recouvrement géostationnaire (EGNOS), le service 2 gouvernemental d’observation
  de la Terre (EOGS), IRIS2, les télécommunications gouvernementales par satellite
  (Govsatcom), la connaissance de la situation spatiale, l’accès à l’espace et le
  retour depuis l’espace, constituent un pilier essentiel de la souveraineté et de
  l’autonomie stratégique de l’Europe. Ces programmes civils ne sont pas simplement
  des points forts industriels et technologiques. Ils permettent également de créer
  des infrastructures stratégiques qui soutiennent la résilience et la compétitivité
  économiques de l’Europe, la gestion des crises, la sécurité, les capacités de défense
  et l’indépendance politique. À cet égard, les capacités spatiales européennes et
  nationales doivent être renforcées et doivent être gérées comme un système de systèmes
  cohérent et interopérable. L’UE doit également établir des mécanismes de mutualisation
  et de partage des capacités commerciales nationales existantes et émergentes, afin
  d’exploiter les synergies, d’éviter les doubles emplois inutiles et de répondre
  à nos besoins collectifs en matière de souveraineté nationale. IRIS² est la prochaine
  constellation de satellites de l’UE pour une connectivité sécurisée. Elle constitue
  une composante stratégique de la résilience. Elle fournira aux utilisateurs étatiques
  des services souverains, sécurisés et garantis ainsi que des applications commerciales.
  À cet effet, nous continuons de soutenir l’accélération d’IRIS² pour assurer la
  connectivité en accordant une attention particulière aux besoins exprimés par les
  États membres en tant qu’utilisateurs. Cela doit inclure des solutions commerciales
  proposées par des entreprises émergentes et d’autres entreprises, notamment des
  services de connectivité directe à l’appareil et des services relatifs à l’internet
  des objets, fondés sur la bande de fréquences MSS 2 GHz, avec le soutien politique
  de l’ensemble des États membres et le plein engagement de notre secteur industriel
  spatial. Les éventuelles strates architecturales complémentaires doivent reposer
  sur une évaluation conjointe des besoins étatiques et commerciaux ainsi que sur
  des modalités de mise en œuvre transparentes et concurrentielles, sans compromettre
  la mise en œuvre en temps voulu du programme actuel. Compte tenu de l’environnement
  géopolitique actuel, l’Europe doit pouvoir accéder rapidement aux données liées
  à l’observation de la Terre et aux images satellitaires et bénéficier de délais
  de réponse plus courts, d’une fréquence de réexamen accrue, d’une meilleure résolution
  spatiale et d’une souveraineté renforcée concernant les résultats issus de renseignements,
  afin de réduire ses dépendances. Aussi, l’UE et ses États membres doivent mettre
  au point un système étatique d’observation de la Terre qui soit une composante du
  programme spatial de l’UE à la fois souveraine, à double usage et tourné vers les
  utilisateurs, clairement distincte de Copernicus et placée sous contrôle civil et
  étatique. Il convient dans un premier temps d’instaurer un système de systèmes de
  mutualisation et de partage pour mobiliser les capacités existantes et émergentes
  des États membres et du secteur commercial en matière d’observation de la Terre.
  Ensuite, sous réserve du plein respect des prérogatives souveraines des États membres,
  il convient de mettre en œuvre, si nécessaire, une surveillance spatiale pilotée
  par l’UE en se fondant sur une analyse des défaillances et sur une décision du Conseil
  pour soutenir l’autonomie de l’UE et de ses États membres dans leur prise de décision
  et leurs actions. L’UE doit fournir un cadre encourageant, en Europe et dans l’écosystème
  industriel européen, une croissance qui améliorerait la compétitivité mondiale de
  l’écosystème spatial européen. Il est donc nécessaire de garantir des politiques
  qui soient favorables ainsi qu’un cadre réglementaire et financier qui soutienne
  l’intensification des investissements publics et privés, la mise à l’échelle des
  acteurs émergents européens et le développement de l’ensemble de la chaîne de valeur
  industrielle européenne dans l’écosystème spatial tout entier, exploitant et renforçant
  le potentiel et les capacités de tous les États membres. L’UE doit élaborer un cadre
  réglementaire clair, proportionné et transparent, qui servira d’instrument du marché
  interne et garantira des exigences communes adaptées à l’objectif s’agissant de
  la sûreté, de la résilience et de la durabilité des activités spatiales, permettant
  l’efficacité du marché unique européen en ce qui concerne l’espace, dans le but
  de promouvoir la compétitivité des organismes européens et d’assurer l’égalité des
  conditions de concurrence. Ce cadre réglementaire devra être compatible avec la
  législation de l’Union et les législations nationales et éviter de créer des lourdeurs
  administratives disproportionnées pour l’industrie européenne en s’appuyant sur
  les stratégies, pratiques et normes internationalement reconnues afin de ne pas
  compromettre son potentiel de croissance et sa compétitivité à l’échelle mondiale,
  notamment pour les petites et moyennes entreprises et les jeunes entreprises. En
  parallèle, l’UE et ses États membres devront jouer un rôle actif dans la promotion
  des principes clés du droit international, qui est la pierre angulaire du régime
  juridique régissant les activités spatiales et le fondement d’un secteur spatial
  florissant et résilient. À cet effet, les valeurs et les normes européennes ayant
  trait à l’espace doivent être mises en avant, pour promouvoir une offre européenne
  et attirer des partenaires et des talents issus de régions où émergent de nouvelles
  industries spatiales. L’UE et ses États membres devront en outre stimuler la demande
  de services fondés sur l’espace qui soient européens grâce des commandes publiques
  coordonnées, à des garanties de marché et à l’intégration des données et des services
  spatiaux à la protection civile, à la surveillance environnementale, aux transports,
  à l’agriculture, à l’énergie et à d’autres secteurs stratégiques. Une certaine attention
  devra être accordée à l’accès sécurisé aux données, à l’intelligence artificielle,
  à l’interopérabilité et au développement des entreprises du segment aval du secteur
  spatial européen. Bien que des modèles économiques compétitifs, des investissements
  en faveur de l’innovation technologique et l’excellence industrielle soient des
  éléments essentiels à l’obtention de résultats durables, les activités spatiales
  dépendent toujours largement des financements publics et contribuent directement
  à la sécurité et à la souveraineté nationales. Dans ce contexte, il est souhaitable
  que les investissements financés par l’UE bénéficient principalement à l’industrie
  européenne, notamment aux petites et moyennes entreprises et aux jeunes entreprises,
  sur la base de critères d’éligibilité transparents, clairs et objectifs. L’Europe
  doit construire un écosystème spatial axé sur le marché, en croissance et compétitif
  portant sur toute la chaîne de valeur, et le renforcer, avec des mesures appropriées,
  notamment en contribuant à la coopération internationale dans le secteur de l’espace
  grâce aux solutions européennes innovantes d’excellence. Dans ce contexte, il est
  essentiel qu’une demande forte complète l’offre de technologies existantes pour
  répondre de manière adaptée aux besoins en capacités que définiront les États membres,
  notamment en s’appuyant sur l’observatoire européen des technologies critiques dans
  les secteurs de l’espace et de la défense ainsi que sur le groupe de travail conjoint
  sur la non-dépendance européenne dans le but de garantir l’autonomie stratégique
  de l’UE et de permettre une coopération étroite entre l’UE et l’Agence spatiale
  européenne (ESA). Cela permettra de renforcer la résilience des chaînes d’approvisionnement
  pertinentes et de garantir des synergies et des complémentarités concertées avec
  les initiatives industrielles et de recherche et innovation au niveau européen et
  au niveau national. Cette approche devra permettre et garantir un accès approprié
  à la propriété intellectuelle résultant des investissements publics et tenir compte
  des dépendances en matière d’équipement, de logiciels, de données, de systèmes terrestres
  et de services. En parallèle, des partenariats avec l’industrie, notamment avec
  les petites et moyennes entreprises et les nouveaux acteurs, ainsi qu’avec les organismes
  de recherche, devront être envisagés en vue de renforcer la compétitivité industrielle
  de l’UE. L’objectif devra être de générer un impact plus important en définissant
  conjointement les priorités de la recherche et innovation avec les acteurs concernés,
  notamment en faveur d’un haut niveau de maturité technologique et grâce à des initiatives
  de recherche et innovation pour garantir la mobilisation des investissements privés.
  Pour appuyer la poursuite de cette ambition, l’Europe a besoin d’efforts ciblés,
  notamment des investissements au profit des talents, des compétences et de l’enseignement
  pour encourager l’innovation et renforcer le rôle des universités, des organismes
  de recherche et des programmes d’entrepreneuriat, qui sont les facteurs clés de
  l’innovation ainsi que de la résilience et de l’attractivité à long terme de son
  écosystème spatial. Dans les marchés émergents comme le secteur des opérations et
  services dans l’espace, la Commission, les États membres et l’ESA doivent agir en
  étroite coopération pour promouvoir de nouvelles capacités compétitives, préparer
  les infrastructures et les services spatiaux, notamment grâce à l’extension de la
  vie des satellites, à la surveillance, à la maintenance et à la logistique associées
  et au retrait actif de débris, et changer d’échelle afin de répondre aux futurs
  besoins des gouvernements et des institutions et de soutenir la compétitivité de
  l’écosystème en cohérence avec les perspectives commerciales. La demande institutionnelle
  devra être utilisée, en tant que de besoin, pour atténuer les risques associés à
  ces capacités et la transformation de ces dernières en marchés commerciaux durables.
  En parallèle, l’Europe reconnaît le potentiel double usage de nombreuses technologies
  du secteur des opérations et services dans l’espace, en raison duquel toute application
  militaire est soumise à la décision nationale souveraine. Le développement rapide
  de l’économie spatiale, associée aux problématiques mondiales en évolution rapide
  et aux profonds bouleversements géopolitiques, accélérera les transformations dans
  le secteur spatial. Pour demeurer une grande puissance spatiale dans les décennies
  à venir, l’Europe doit être résiliente, unie au niveau politique et forte sur le
  plan de la compétitivité économique. De fait, une stratégie est nécessaire en matière
  de concurrence juste et libre et d’innovation, afin de permettre une croissance
  rapide et durable au sein du marché européen. L’Europe doit donc continuer de renforcer
  la cohérence et l’efficacité de sa gouvernance spatiale, fondée sur un partenariat
  UE-ESA solide et s’appuyant sur le savoir-faire technique et programmatique de l’ESA
  ainsi que sur le rôle crucial de l’Agence de l’Union européenne pour le programme
  spatial, dans le respect de son mandat. Il est nécessaire de maintenir une répartition
  claire des responsabilités de l’UE et de l’ESA et de leurs États membres respectifs
  grâce à la création de valeur ajoutée, en évitant les redondances, en créant des
  normes communes et en renforçant encore la coopération entre les acteurs institutionnels,
  notamment au moyen d’un partenariat solide entre l’UE et l’ESA. Le centre satellitaire
  de l’Union européenne, les agences spatiales nationales et les autres acteurs concernés
  devront également faire leur part, dans le cadre de mandats clairement définis et
  complémentaires, en évitant les redondances institutionnelles. Les États membres
  devront affirmer une volonté politique, définir des priorités stratégiques et mobiliser
  les instruments nécessaires au profit des programmes spatiaux de l’UE et des initiatives
  avec une valeur ajoutée européenne. L’ESA, s’appuyant sur son formidable savoir-faire
  technique et son expérience programmatique, devra continuer de contribuer aux ambitions
  spatiales à long terme de l’Europe en sa qualité de partenaire de confiance pour
  la mise en œuvre des activités spatiales de l’UE. Les États membres de l’UE, la
  Commission et l’ESA ont une ambition commune : que l’Europe demeure une grande puissance
  spatiale. Cette ambition a reçu le soutien du Conseil au niveau ministériel de l’ESA
  en novembre 2025 et devrait, sans préjuger des échanges qui auront lieu en lien
  avec le prochain cadre financier pluriannuel de l’UE, être appuyée par le Fonds
  européen pour la compétitivité et par le programme-cadre pour la recherche et l’innovation
  « Horizon Europe ». Elle devra compléter, sans les remplacer, les ressources nationales
  ainsi que les ressources de l’ESA, et en tirer parti, et devrait être gérée de manière
  transparente, en préservant complètement les compétences souveraines des États membres
  et avec un accès juste aux industries et aux acteurs de la recherche européens.
  L’Europe a les talents, les industries, les technologies et les savoir-faire nécessaires
  pour être un chef de file du secteur spatial à l’échelle mondiale.'
