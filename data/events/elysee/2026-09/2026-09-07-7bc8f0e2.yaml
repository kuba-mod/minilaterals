title: Sommet Lumière pour un nouveau multilatéralisme du cinéma et de l’image animée.
text: 'Le Président de la République française, Emmanuel Macron, et son homologue
  de la République de Corée, Lee Jae-Myung, ont présidé le Sommet Lumière, réunissant
  plus de 200 talents, créateurs, dirigeants d''entreprises et décideurs publics,
  représentant 60 pays, régions et organisations internationales. Pour la première
  fois de son histoire, la communauté mondiale du cinéma et de l''image animée s''est
  rassemblée afin de répondre collectivement aux profondes mutations qui transforment
  le secteur, mais aussi d’en saisir les opportunités. Fruit des échanges engagés
  à Saint-Paul-de-Vence, la Déclaration Lumière, entérinée par plus de 120 signataires,
  fixe les grands principes d''un nouveau multilatéralisme du cinéma et de l’image
  animée. Face aux bouleversements créatifs, technologiques, économiques et géopolitiques
  que connaissent les secteurs du cinéma, de l’audiovisuel et du jeu vidéo, le Sommet
  Lumière avait pour ambition de dépasser le constat pour faire émerger des solutions
  concrètes. Les engagements annoncés témoignent de la capacité de la communauté internationale
  à s''organiser collectivement autour d''une vision commune : défendre la valeur
  irremplaçable de l’œuvre, de la création et de ses auteurs, soutenir la diversité
  culturelle, favoriser l''innovation dans le cadre d’un partage de la valeur qui
  assure la juste rémunération des auteurs et créateurs et garantir la place centrale
  de l''humain dans l''avenir de l''image. Le Sommet Lumière s''inscrit dans une dynamique
  plus large de renforcement de l''attractivité de la France pour les industries du
  cinéma, de l''audiovisuel et du jeu vidéo. Lors de l’édition 2025 de Choose France
  , un dialogue renforcé avec les grands studios, plateformes et producteurs internationaux,
  a initié une évolution du crédit d''impôt international, dont bénéficient les productions
  d’initiative étrangère en France, afin de répondre aux nouveaux enjeux de compétitivité
  du secteur. Cette réforme, adoptée dans la loi de finances pour 2026, produit déjà
  des résultats significatifs : depuis le début de l''année, les productions internationales
  ont ainsi généré plus de 600 millions d''euros de dépenses sur le territoire national,
  avec une trajectoire permettant d''approcher un milliard d''euros d''investissements
  d''ici la fin de l''année 2026. Cette nouvelle dynamique se traduit par l''accueil
  en France de plusieurs productions d''envergure internationale, qui mobilisent les
  savoir-faire français, soutiennent l''emploi dans l''ensemble des territoires et
  renforcent le rayonnement culturel de la France. Elles témoignent de la capacité
  du pays à conjuguer excellence créative, compétitivité internationale et diversité
  culturelle. En réunissant à Saint-Paul-de-Vence les principaux acteurs mondiaux
  de l''image animée, le Sommet Lumière prolonge cette dynamique et affirme l''ambition
  de la France de demeurer à la fois une terre de création, une destination de référence
  pour les tournages internationaux et un lieu de réflexion sur l''avenir mondial
  du cinéma. Le Sommet a permis le lancement du Partenariat Lumière, initiative portée
  par la France et la République de Corée pour soutenir le développement des industries
  du cinéma, de l''audiovisuel et de l''image animée avec un investissement à ce jour
  d’un milliard d’euros. Dans ce cadre, la France mobilisera 500 millions d''euros
  via Bpifrance entre 2027 et 2031, tandis que la République de Corée a annoncé un
  engagement d''ampleur équivalente. Ouvert à d''autres États, le Partenariat vise
  à accompagner la croissance des entreprises du secteur tout en promouvant les principes
  adoptés à Saint-Paul-de-Vence : primauté de la création humaine, respect du droit
  d''auteur et diversité culturelle. Le Sommet a acté la création d''IRIS – International
  Resilience Initiative for Independent Screens – une initiative internationale inédite
  en partenariat avec le Maroc, la Corée du Sud, le Portugal ou encore la Grèce, destinée
  à soutenir les salles indépendantes, les distributeurs et les réseaux qui assurent
  la circulation des œuvres à travers le monde. Face aux fragilités croissantes de
  cet écosystème essentiel à la diversité culturelle, IRIS mobilisera financement,
  expertise et coopération internationale afin de renforcer durablement le cinéma
  indépendant et sa diffusion auprès des publics. Portée par un Conseil international
  réunissant plus de quarante cinéastes et artistes de premier plan, parmi lesquels
  Martin Scorsese, Juliette Binoche, Jane Campion, Sofia Coppola, Costa-Gavras, les
  frères Dardenne, Isabelle Huppert, Jim Jarmusch, Hirokazu Kore-eda, Nanni Moretti,
  Jafar Panahi, Tilda Swinton, Denis Villeneuve ou encore Wim Wenders, l''initiative
  a vocation à constituer un réseau mondial permanent de solidarité et de soutien
  au service du cinéma indépendant. Le Sommet a lancé Audiovisual Next Gen , un programme
  international porté par le CNC en partenariat avec Netflix, RTL Group et Mediawan.
  Destiné à vingt professionnels de moins de 35 ans issus de l''ensemble des industries
  créatives, il leur offrira pendant dix-huit mois un parcours de mentorat et d''immersion
  internationale dans les écosystèmes créatifs les plus emblématiques. La première
  promotion, dévoilée en janvier 2027, sera composée exclusivement de femmes afin
  de favoriser leur meilleure représentation aux plus hauts niveaux de responsabilité.
  Le Sommet a donné naissance à l''Alliance Lumière, premier réseau mondial réunissant
  les institutions publiques chargées du cinéma et de l''audiovisuel. Ouverte à toutes
  les agences nationales du secteur, elle favorisera les échanges d''expertise, le
  développement d''initiatives communes et la coordination des positions sur les grands
  enjeux internationaux. Ses membres se réuniront chaque année à Cannes ainsi qu''à
  l''occasion d''un congrès annuel organisé par un État membre. 54 agences ont déjà
  adhéré à ce réseau. En accueillant le Sommet Lumière, la France confirme son rôle
  moteur dans l''écosystème mondial de l''image animée. Forte de 260 000 emplois,
  du troisième box-office mondial et d''un modèle unique fondé sur l''exception culturelle.'
