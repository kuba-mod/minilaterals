title: Déclaration conjointe sur la participation de la Finlande à la dissuasion avancée
  française.
text: Dans son discours sur la doctrine de dissuasion nucléaire, prononcé le 2 mars
  à l’Île Longue, le président de la République française a réaffirmé la dimension
  européenne des intérêts vitaux de la France, articulant à cet effet le concept de
  dissuasion avancée. Plusieurs pays ont décidé d’en faire partie. Aujourd’hui, la
  Finlande a décidé à son tour de rejoindre la dissuasion avancée. Cette décision,
  en conformité avec les obligations internationales respectives des deux pays, constitue
  une étape importante pour la sécurité européenne et pour la coopération bilatérale.
  Elle renforcera leur partenariat et offrira des opportunités pour le signalement
  stratégique ainsi que pour la capacité à gérer l’escalade sous le seuil nucléaire.
  Un groupe de pilotage nucléaire sera établi dans les prochains mois pour commencer
  la mise en œuvre de cette coopération. Les deux pays réaffirment leur ambition pour
  une Europe plus forte, plus sûre et mieux défendue.
