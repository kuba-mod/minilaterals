date: '2026-09-03'
type: press_release
source_name: elysee
title: Déplacement au Royaume-Uni.
text: Le Président Emmanuel Macron s'est rendu au Royaume-Uni les mercredi 2 et jeudi
  3 septembre 2026. Ce mercredi, le chef de l’État a inauguré l’exposition de la Tapisserie
  de Bayeux au British Museum aux côtés de Leurs Majestés le Roi Charles III et la
  Reine Camilla, souverains du Royaume-Uni de Grande-Bretagne et d’Irlande du Nord.
  Annoncé par le Président de la République lors de sa visite d’État au Royaume-Uni
  en juillet 2025, le prêt exceptionnel de ce chef-d’œuvre par la France au Royaume-Uni
  constitue un moment fort de la relation entre nos deux pays . En retour, plusieurs
  trésors britanniques ont été prêtés aux musées de Caen et de Rouen, illustrant la
  richesse des liens entre les deux pays. À la suite de la visite, le Président de
  la République s'est exprimé sur les liens forts entre le Royaume-Uni et la France
  symbolisés par ce prêt. 2 septembre 2026 - Seul le prononcé fait foi Your Majesties,
  Prime Minister, Dear Andy, Madame, Mister Chairman, Dear George, Mister Director
  of the British Museum, Dear Trustees, Ministers, Members of Parliament, Monsieur
  le Maire de Bayeux, Curators, Conservators, Scientists, Historians, whose work has
  made this moment possible, Ladies and gentlemen. It is a great honour to be here
  today, with you. In 2018, at Sandhurst, Theresa, you probably remember, like me,
  I announced that we would work together towards bringing the Bayeux tapestry to
  the United Kingdom. It has required a little patience. Then again, one does not
  move an artwork nearly 1 000 years old lightly. But since the first British request
  dates back to 1931, I choose to regard eight years as something of a speed record.
  Last year, during my state visit, I promised that it would be here in September
  2026, and today, here it is, at the British Museum. This exceptional place where
  artworks tell the stories of civilizations and humanity, the tapestry fits right
  in. For it is much more than just a linen canvas embroidered with wool. It represents
  a whole chapter of French, British and European history. As you know, it tells the
  story of the feud between William and Harold, comrades in arms before they became
  enemies, and the Norman army crossing this channel, and then the Battle of Hastings,
  fought by William and his troops, which was, of course, preceded by a great banquet.
  With the wine barrels they had previously loaded on the ships, the French having
  always had a certain sense of priorities. We do not know for certain where this
  masterpiece was embroidered. And some of the rather quirky creatures in its borders
  still leave us scratching our heads. But what we do know is that the epic it tells
  bound our cultures, our histories and our destinies together. We also know that
  they knew how to celebrate a victory at that time. 70 meters, 350 kilograms of panels,
  623 men, 200 horses and mules, dozens of dogs, 40 sheep, 37 buildings and castles,
  more than you would ever fit in one Tweet. 1066 was just the start. Marriages, alliances,
  inheritances and successions then intertwined the dynasties that ruled our two countries
  during centuries. There are so many names that resonate in both our countries. Henry
  II, Eleanor of Aquitaine, Richard the Lionheart and King John, to name a few. The
  legend even says that centuries before William the Conqueror, another legendary
  knight, Lancelot du Lac, crossed the seas from the current French Bretagne to join
  King Arthur's round table in Camelot. William the Conqueror belongs fully to both
  our histories. He was Duke of Normandy, became King of England and nearly a thousand
  years later, your majesty, your heir bears the same name, William, Guillaume, in
  our language. And beyond names, marriages and disputes over succession, deeper ties
  were forged between people, ideas and words. Following the Norman conquest, Norman
  French and later Anglo-Norman became the languages of the courts, the aristocracy
  and much of English literature. This is why we could probably argue that when you
  liberated the United States from the French language, probably it remained a few
  of these words, even for the Americans themselves. This is a private joke, not totally
  private. The English language spoken around the world today still bears the imprint
  of that Norman French heritage in words such as government, justice, parliament,
  liberty, beauty or gardens. And when it comes to gardens, we may have given you
  the world, but we still envy what you do with them. Both you, English people, and
  you personally, your majesty. And I have to say, even the Elysee garden is in the
  English style, but it will remain between us. Permettez-moi de dire quelques mots
  en français aussi. Je veux en effet remercier toutes celles et ceux qui ont permis
  et rendu possible ce moment exceptionnel. Vous le savez, on nous a longtemps expliqué,
  pour des raisons parfaitement valables, que la tapisserie ne pouvait pas voyager.
  La tapisserie est fragile, irremplaçable, elle fait partie des trésors de notre
  patrimoine. Pourtant, nous avons choisi, ensemble, de pratiquer ce que Coleridge
  appelait this willing suspension of disbelief. Non pas renoncer à la raison, mais
  consentir un instant à croire que la confiance peut l'emporter sur l'habitude, sur
  les hésitations et sur les frontières. C'est ce que le Royaume-Uni et la France
  ont choisi de faire ensemble pour rendre possible ce moment. Et rien de cela n'aurait
  été possible sans ce travail commun exceptionnel qui a permis à cette œuvre fragile
  de voyager, d'être présentée dans les meilleures conditions de sécurité. Pour cette
  odyssée logistique, diplomatique et culturelle, je veux vous dire à toutes et tous
  merci. Merci aux ministres de la Culture, aux services de vos ministères, aux équipes
  aussi de Bayeux et du British Museum, à Delphine Christophe et ses équipes, aux
  conservateurs, restaurateurs, scientifiques, ingénieurs français et britanniques,
  ainsi qu'à la Fabrique du patrimoine de Normandie, aux forces de l'ordre qui ont
  sécurisé le transport. Merci à nos élus, au maire de Bayeux, monsieur le maire aujourd'hui
  et votre prédécesseur, ainsi que vos équipes. Merci à nos envoyés spéciaux français
  et britanniques, cher Philippe Belaval et cher Lord Peter Ricketts, et merci à nos
  ambassadrices et à nos ambassadeurs et à l'équipe qui l'ont rendu possible, et merci
  à nos mécènes qui ont rendu cette exposition aussi possible aujourd'hui. Merci enfin
  à toutes celles et ceux qui, loin de la lumière, qui, comme chacun sait, est l'ennemi
  de cette tapisserie si fragile, ont contribué à cette prouesse et à ce geste d'amitié
  entre nos peuples. Pour reprendre un mot issu du vieux normand et pleinement anglais
  désormais, vous avez relevé ce challenge. Le déplacement de la tapisserie permettra
  aussi d'autres découvertes en France, car ce prêt est aussi un échange. Pendant
  que la tapisserie sera ici, vous l'avez rappelé, cher George, les trésors britanniques
  vont aller au musée de Caen et de Rouen. Le trésor de Sutton Hoo, l'échiquier de
  Lewis et d'autres œuvres encore, nous en remercions sincèrement le gouvernement,
  le peuple britannique et le British Museum. Nous serons heureux de retrouver la
  tapisserie millénaire de la naissance de Guillaume dans un musée de Bayeux rénové
  et agrandi. C'est cela, la puissance extraordinaire des musées, faire franchir aux
  œuvres les frontières et les siècles, donner à voir ce qui nous rapproche, s’ouvrir
  à la découverte des autres. C'est pour ça que je suis très heureux, dans quelques
  semaines, dans le cadre du G7, d'accueillir le premier G7 des musées où le British
  Museum sera aux côtés de vos amis du Louvre et de plusieurs collègues, et nous serons
  ensemble à Paris au mois d'octobre prochain. Mais permettez-moi de revenir un instant
  sur cette manche, notre manche, votre channel. Parce que son histoire, racontée
  à travers la tapisserie, ici exposée, qui nous est familière, est une très belle
  métaphore de notre relation. Pendant des siècles, cette mer fut une frontière, parfois
  un obstacle. Franchie ponctuellement par des armées, des marchands, des artistes.
  La tapisserie que nous regardons aujourd'hui raconte elle-même l'une de ces traversées
  qui est sans doute l'une des scènes les plus vivantes et spectaculaires à l'image
  de l'exploit qu'elle représentait. La manche fut aussi franchie, de façon décisive,
  pour la libération à partir du 6 juin 1944. Au fil du temps, d'une rive à l'autre,
  s'est nouée entre nos pays plus qu'une entente cordiale, une entente désormais amicale,
  pour reprendre vos propres mots, Sir. De cette entente franco-britannique, l'un
  des premiers signes fut peut-être de persister ensemble contre toute rigueur textile
  et scientifique à désigner la tapisserie de Bayeux comme une tapisserie, puisqu'elle
  est en réalité une broderie. Français et Britanniques partagent un certain sens
  de l'esprit de contradiction et nous ne sommes pas prêts à en changer de nom, je
  crois. Aujourd'hui, notre histoire commune continue de s'écrire, toujours inachevée,
  à l'image de celle de la tapisserie comme un récit extraordinaire, mais récit incomplet,
  car la fin de la tapisserie nous manque, a sort of medieval cliffhanger that has
  kept historians on the edge of their seats ever since. Alors oui, la tapisserie
  inspire encore des enquêtes, elle nous invite surtout à écrire la suite, moins par
  une dernière scène brodée que par des moments de partage, d'ouverture, de création
  comme celui qui nous réunit aujourd'hui. Dans les temps troublés que nous traversons,
  tout cela n'a rien de secondaire. Quand nos sociétés doutent, nous avons besoin
  de lieux et d'œuvres où regarder ensemble ce que l'humanité sait créer et transmettre.
  Ce que vous continuez de faire ici, y compris avec la formidable réinvention et
  restauration du British Museum que vous avez décidé, que vous nous avez présenté
  avec votre architecte il y a quelques mois. Your Majesty, Prime Minister, what binds
  us is not only what we see in our museums, our libraries, our theatres and our cinemas.
  It is also the principles we defend and the responsibilities we shoulder together
  at the United Nations, the G7, the G20, NATO, or within the European political community.
  Today, our two countries are playing a full part in ensuring the security of the
  European continent. Mister Prime Minister, your first foreign trip was for Ukraine.
  That mattered. Just as our joint action within the Coalition of the Willing for
  Ukraine matters, including our decision to make our Scalp and Storm Shadow capabilities
  available to Ukraine together, we are united, as we are in the Middle East, for
  the stability and peace for this region. We are united by our commitment to multilateralism,
  rule of law, respect for sovereignty, and our freedom to make our own decisions.
  We also share a passion for liberty and collaborate in areas such as defence, nuclear
  energy, space, artificial intelligence. While we do not always see eye to eye, we
  respect one another, remain open to discussing everything, including advancing the
  UK reset with the European Union. Always closer and together. This is why I really
  do hope that this Entente Amicale you announced will inspire this new path forward.
  And so today, as we stand before this tapestry in the heart of London, I would like
  to conclude with this thought. A thousand years ago, this work depicted a crossing
  that changed history. And today it crosses a channel through a tunnel that we built
  together, a reminder of what our two countries can achieve when they join forces.
  If anyone remembers what we did here today decades or even centuries from now, I
  would like to believe that they will remember not only the story told by your tapestry,
  but also the tale of two countries which, after centuries of shared history, choose
  to forge a bond as close as the thread of this thousand-year-old embroidery. Long
  live culture. Long live the friendship between France and the United Kingdom. Longue
  vie à l’entente cordiale et longue vie à l’attente amicale. 2 septembre 2026 - Seul
