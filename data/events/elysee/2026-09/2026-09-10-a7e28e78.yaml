title: Statement on support for ITU's regulatory framework for frequency management.
text: 'Signatures : Angola, Armenia, Australia, Austria, Bahrain, Belgium, Brazil,
  Bulgaria, Cambodia, Chile, Costa Rica, Croatia, Cyprus, Denmark, Djibouti, Estonie,
  Georgia, Germany, Greece, Hungary, Iceland, Ireland, Israel, Italy, Japan, Kazakhstan,
  Korea, Latvia, Lithuania, Luxembourg, Madagascar, Malta, Mauritius, Mexico, Monaco,
  Netherlands, New Zealand, Norway, Philippines, Poland, Romania, Rwanda, Serbia,
  Slovakia, Slovenia, Spain, Sweden, Switzerland, Tunisia, Türkiye, United Kingdom,
  European Space Agency. The International Telecommunications Union (ITU) plays a
  fundamental role in maintaining the international framework for the use of the radio
  frequency spectrum and associated satellite orbits. It supports interference-managed
  environment for radiocommunication systems worldwide - a crucial issue for space
  services. This ITU framework is based on the Radio Regulations, a binding international
  treaty, revised every four years at World Radiocommunication Conferences (WRC),
  which set out rules and procedures governing the registration, coordination and
  protection of ITU Member States’ rights of use, in particular for space assignments.
  We support the role of ITU as the primary global entity responsible for the efficient
  and sustainable use of the radio frequency spectrum and associated orbit. We acknowledge
  that the ITU has successfully accommodated and facilitated the development of satellite
  systems including large constellations and a wide range of new-space applications.
  We are confident that the Radio Regulations will continue to evolve to adapt to
  new scientific and technological development and that the ITU will continue to implement
  this framework in a fair, transparent and effective manner. In an evolving geopolitical
  context, we firmly believe that adherence to the ITU global governance of radio
  frequency spectrum and satellite orbits, rooted in a multilateralism based on international
  Law and the ITU constitution and convention, is the essential foundation for nations
  for the coordination of radiocommunication systems to prevent harmful interference
  between satellite systems and for the development of their space radiocommunication
  policy while avoiding harmful interference between satellites. The frequency registration
  procedures managed by the ITU foster equitable access to spectrum and associated
  orbits, with, today, all 194 ITU Member States having national resources in the
  ITU Space Plan and more than 100 administrations having additional satellite assignments,
  including 56 for geostationary orbit. The ITU allows many developing countries to
  develop their own satellite capabilities free from harmful radio interference, in
  order to meet the connectivity needs of their populations. This equitable access
  to spectrum and orbit resources, particularly to developing countries, supports
  the broader goal of reducing the digital divide, as pursued through the ITU’s development
  mandate. We note that studies relating to the framework established in the Radio
  Regulations for the protection of geostationary networks (GSO) from non-geostationary
  (NGSO) constellations will be reported to WRC-27. In this context, it will be important
  to ensure conducive environment for both technologies and to maintain a reliable
  protection of geostationary networks with clear, measurable and predictable interference
  environment, particularly in the Ku and Ka bands, while ensuring that NGSO systems
  are not unduly constrained. Any future evolution of the radio regulation should
  remain proportionate, evidence-based and technology-neutral, ensuring effective
  protection of GSO networks while facilitating the development and deployment of
  NGSO systems. WRC-27 will also consider the topic of satellite Direct-to-Device
  communications, taking into account aspects such as supporting innovation and resilient
  coverage, protecting terrestrial networks, and preserving technology neutrality
  and spectrum efficiency. We stress the importance for any satellite system to strictly
  comply with Radio Regulations rules governing the protection of GSO networks as
  well as with the coordination procedures applicable to constellations using the
  same frequency bands. This is essential to ensure the continuity of satellite services
  that support public space services and governmental satellite services, while also
  enabling the efficient deployment and operation of NGSO constellations within a
  technology neutral framework that fosters innovation and access to spectrum. Based
  on ITU rules and procedures, we remain firmly committed to protecting our satellite
  systems from harmful interference. This statement is not a legally binding document
  and does not create legal rights or obligations under domestic or international
  law.'
