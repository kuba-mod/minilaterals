title: Compte rendu du Conseil des ministres du 16 septembre 2026.
text: 'Retrouvez le compte rendu du Conseil des ministres du jeudi 16 septembre 2026.
  Le garde des sceaux, ministre de la justice, la ministre de la santé, des familles,
  de l’autonomie et des personnes handicapées et le ministre délégué auprès du ministre
  de l’intérieur, ont présenté un projet de loi relatif à la réparation des dommages
  résultant de violences ou de dégradations commises dans l’espace public et au recouvrement
  des dommages et intérêts. En mai 2026, la finale de la Ligue des champions a donné
  lieu à des violences d’une particulière gravité qui ont profondément choqué nos
  concitoyens. Ces violences sont loin de constituer un épisode isolé. Depuis plusieurs
  années, des individus mal intentionnés profitent de manifestations ou de rassemblements
  sportifs pour commettre des actes de pillage, dégrader sciemment l’espace public,
  incendier volontairement du mobilier urbain ou des véhicules, ou encore s’en prendre
  directement aux forces de l’ordre au moyen de tirs de mortiers. Depuis 2017, le
  législateur a doté l’autorité judiciaire et les forces de sécurité intérieure de
  moyens nouveaux pour mieux détecter, interpeller et sanctionner les auteurs de ces
  dégradations et violences. Toutefois, la réponse à ces agissements ne saurait se
  limiter à la seule sanction pénale. Ceux qui dégradent et détruisent doivent également
  réparer pécuniairement. Depuis la loi n° 2019-290 du 10 avril 2019, l’État peut
  agir contre les auteurs de dégâts, même en l’absence de condamnation pénale, pour
  recouvrer les coûts des dommages causés lors d’attroupements, selon le principe
  « casseur-payeur ». Cette action récursoire est toutefois limitée à raison des difficultés
  d’identification des mis en cause et des montants modestes récupérés. Le Gouvernement
  souhaite désormais faire évoluer significativement le droit de la responsabilité
  civile en créant dans le code de sécurité intérieure un nouveau régime permettant
  de tenir solidairement responsables les personnes ayant participé à une action collective
  violente dans le cadre de laquelle ont été commis des dommages, en vue de la réparation
  effective de ceux ci. Le projet de loi qui comprend cinq articles vise d’abord à
  créer à l’article 1 ce régime de responsabilité extracontractuelle pour faute qui
  a vocation à s’appliquer aux actes de violences, dégradations et destructions commises
  dans le cadre de rassemblements illicites. Ce mécanisme permet non seulement de
  tenir les participants responsables des dommages causés par l’action collective
  à laquelle ils ont pris part mais également d’instaurer entre eux une responsabilité
  solidaire les obligeant à répondre individuellement, du tout, dans la limite de
  10 000 euros, à l’égard de la victime, de son assureur ou de l’Etat. Le projet de
  loi étend et aménage ensuite les conditions dans lesquelles l’Etat peut engager
  une action récursoire à l’encontre des auteurs et des responsables solidaires de
  ces dommages en facilitant l’intervention de l’agent judiciaire de l’Etat. Le projet
  de loi facilite aussi le recouvrement de la créance de l’Etat sur les auteurs de
  ces violences et dégradations lorsqu’ils sont traduits devant le juge pénal, en
  rendant recevable la constitution de partie civile de l’Etat faite lors d’une audience
  de renvoi sur intérêts civils. Lorsqu’un casseur est condamné à indemniser l’Etat,
  les dommages et intérêts doivent pouvoir être effectivement recouvrés. Si le Gouvernement
  n’est pas favorable à la suspension des prestations sociales, celles-ci doivent
  contribuer au financement des réparations, dans des conditions encadrées, et sans
  porter atteinte au reste à vivre. Ainsi, le projet de loi prévoit une dérogation
  supplémentaire à la règle d’insaisissabilité des allocations familiales et des aides
  personnelles au logement en vue de pouvoir mobiliser ces prestations pour le paiement
  des dommages et intérêts auquel une personne est définitivement condamnée. Le Gouvernement
  entend ainsi garantir l’effectivité du droit à réparation, sans remettre en cause
  les garanties indispensables à la préservation de conditions de vie dignes pour
  les familles. Le ministre de l’Europe et des affaires étrangères a présenté un projet
  de loi autorisant l’approbation de l’avenant à la convention entre le Gouvernement
  de la République française et le Gouvernement de la République de l’Inde du 29 septembre
  1992 en vue d’éviter les doubles impositions et de prévenir l’évasion fiscale en
  matière d’impôts sur le revenu et sur la fortune. Cet avenant, signé à New Delhi
  le 18 février 2026, vise à renforcer les investissements et les liens économiques
  déjà existants entre la France et l’Inde en modernisant le cadre juridique applicable.
  Il s’inscrit ainsi pleinement dans la dynamique renforcée que connait la relation
  bilatérale, qui a été réhaussée au niveau d’un « partenariat stratégique global
  spécial » à l’occasion de la visite en Inde du Président de la République, du 17
  au 19 février 2026. Cet avenant vise notamment à apporter une plus grande sécurité
  juridique aux particuliers et aux entreprises en révisant les clauses qui faisaient
  l’objet de divergences d’interprétation entre les deux Etats. Les nouvelles clauses
  garantissent ainsi aux entreprises françaises un traitement fiscal au moins aussi
  favorable que leurs concurrentes des autres pays de l’Organisation de coopération
  et de développement économiques (OCDE). Cet avenant intègre enfin les dernières
  normes internationales de l’OCDE en matière de lutte contre l’évasion et la fraude
  fiscales. La ministre des outre-mer a présenté un projet de loi qui vise à donner
  force législative aux dispositions de l’ordonnance n° 2026-438 du 3 juin 2026 portant
  adaptation et modernisation des dispositions du code général des collectivités territoriales
  applicables en Polynésie française. Par ce projet de loi, le Gouvernement ratifie
  l’ordonnance du 3 juin 2026, prise en application de l’article 74-1 de la Constitution
  et publiée au Journal officiel de la République française du 4 juin 2026. Fruit
  d’un important travail associant les instances locales, l’ordonnance reprend et
  adapte la majorité des dispositions inscrites dans la proposition de loi portant
  adaptation et modernisation des dispositions du code général des collectivités territoriales
  applicables en Polynésie française déposée par les sénateurs. L’ambition est de
  répondre à la volonté manifestée par de nombreux élus polynésiens du bloc communal
  de clarifier, d’adapter et de compléter les dispositions du code général des collectivités
  territoriales applicables localement. L’ordonnance permet ainsi d’intervenir en
  matière de finances et budget, de pouvoir de police du maire, de droit funéraire
  et de services publics environnementaux. Elle permettra notamment d’adapter les
  règles de fonctionnements des conseils municipaux aux contraintes géographiques
  locales et de résoudre une problématique tant organisationnelle que financière pour
  les communes dispersées sur plusieurs îles. Le report de délais concernant certaines
  obligations d’exercice des compétences en matière de services publics permettra
  également aux collectivités de se mettre en conformité dans des délais adaptés à
  leurs capacités. Enfin, l’élargissement des prérogatives du maire constituera un
  levier pour garantir la continuité du service public. Le ministre de l''enseignement
  supérieur, de la recherche et de l’espace a présenté une communication relative
  au Sommet spatial, qui s’est tenu au Grand Palais les 9 et 10 septembre. Annoncé
  par le Président de la République en octobre 2025 lors de la présentation de la
  Stratégie nationale spatiale et co-présidé avec l’Allemagne, ce rendez-vous inédit
  a rassemblé plus de 2 000 participants, près d’une centaine de pays et organisations
  internationales, une soixantaine de chefs d’Etat et de Gouvernement et de ministres,
  ainsi que de très nombreuses entreprises, chercheurs, scientifiques, représentants
  du monde de la défense et étudiants venus de tous les continents. Avec plus 1 000
  entreprises et une cinquantaine d’annonces pour un montant de plus de 20 milliards
  d’euros d’investissements et de contrats, le Sommet a témoigné du potentiel croissant
  de la nouvelle économie spatiale, tirée à la fois par les grands acteurs établis
  et les startups du secteur. Le Sommet a permis de réaffirmer la place cruciale que
  doit occuper le multilatéralisme pour répondre aux défis de demain, s’assurer que
  l’espace reste un bien commun et ne devienne pas une zone de non-droit. A cet égard,
  plusieurs déclarations multilatérales proposées par la France ont été endossées
  avec le soutien de près d’une quarantaine de pays. Elles portent sur : Le Sommet
  a également été l’occasion de mettre en avant les enjeux liés au développement et
  à l''innovation du secteur spatial : Le Sommet spatial a enfin été l’occasion d’affirmer
  l’importance de l’espace comme levier d’inspiration, de mobilisation et d’attraction
  pour les carrières scientifiques pour la jeunesse. Avec plus de 200 étudiants présents,
  le Sommet a donné la parole aux nouvelles générations qui dessineront l’avenir du
  spatial des prochaines décennies. Le conseil des ministres a adopté les mesures
  individuelles suivantes : * En outre, le conseil des ministres a prononcé, sur proposition
  du ministre de l’intérieur, la dissolution de l’association dénommée « Association
  culturelle d’Aulnay Sud ». * * * Le garde des sceaux, ministre de la justice, la
