title: Déclaration Lumière sur l'avenir du cinéma et de l'image animée.
text: 'Nous, représentants de pays, de régions et d’organisations internationales,
  dirigeants des industries du cinéma, de l''audiovisuel et du jeu vidéo, créateurs,
  talents, festivals et institutions culturelles du monde entier, réunis à Saint-Paul-de-Vence
  le 7 septembre 2026 à l’occasion du Sommet Lumière, sous la coprésidence du Président
  de la République française et du Président de la République de Corée, nous trouvons
  à un moment décisif pour l’avenir du cinéma et de l’image animée. Alors que l’intelligence
  artificielle transforme les conditions de la création, que les publics découvrent
  de nouvelles façons de vivre les récits et que les expériences audiovisuelles occupent
  une place toujours plus importante dans nos vies, les choix que nous faisons aujourd’hui
  contribueront à garantir que la valeur du cinéma et de l’image animée tant sur le
  plan culturel qu’économique, continue de progresser. Nous reconnaissons que cette
  valeur engage aussi bien l’avenir de nos industries que celui de nos sociétés. À
  ces opportunités s’attache également une responsabilité partagée. Malgré la diversité
  de nos rôles, de nos marchés et de nos cultures, nous sommes unis par un intérêt
  commun : celui d’un écosystème dynamique et diversifié. En nous appuyant sur ce
  qui nous rassemble, nous posons aujourd’hui les fondements d’un multilatéralisme
  du cinéma et de l’image animée. Celui-ci repose sur deux convictions : premièrement,
  que les enjeux qui nous concernent tous trouvent leur réponse la plus efficace dans
  la coopération ; deuxièmement, que chacune des parties prenantes, États, entreprises,
  créateurs et institutions, a un rôle légitime et essentiel à jouer dans cette entreprise
  commune. À cette fin, nous adoptons les principes suivants et nous engageons, chacun
  dans le cadre de ses responsabilités et de ses compétences, à les mettre en œuvre.
  1. Nous plaçons les œuvres au centre. Le cinéma et l’image animée constituent un
  bien commun : un vecteur d’émotion, de mémoire et de connaissance, un instrument
  d’émancipation individuelle, de transformation collective et de culture partagée.
  À une époque où l’offre d’images n’a jamais été aussi abondante, les œuvres ambitieuses
  et porteuses d’une intention propre demeurent irremplaçables. Elles façonnent les
  imaginaires, véhiculent des récits communs, ouvrent de nouvelles perspectives sur
  le monde, font émerger les propriétés intellectuelles de demain et créent une valeur
  culturelle et économique durable. L’avenir de nos industries sera déterminé par
  les œuvres que nous choisirons de créer et de soutenir. 2. Nous refusons de réduire
  les images à l’attention qu’elles captent. La manière dont les sociétés, et les
  jeunes en premier lieu, interagissent avec les écrans constitue une question fondamentale,
  tant pour la vitalité de nos secteurs que pour le développement et le bien-être
  des générations futures. Les créateurs professionnels, producteurs, distributeurs
  et diffuseurs investissent dans le développement, la production et l’accompagnement
  des œuvres avec une exigence de qualité, de responsabilité et d’accessibilité aux
  publics. Là où les images sont créées, éditorialisées et diffusées par des acteurs
  qui en assument la responsabilité, les publics trouvent non seulement des récits
  marquants, mais aussi des espaces de confiance. Alors que les technologies numériques
  évoluent, nous réaffirmons que l’attention des publics n’est pas une ressource à
  capter, mais une confiance à honorer. 3. Nous investissons dans la création et son
  renouvellement. La vitalité du cinéma et de l’image animée dépend de sa capacité
  à se renouveler : nouvelles voix, nouveaux talents, nouveaux récits, nouvelles propriétés
  intellectuelles, nouvelles technologies et nouveaux modèles économiques. Cela suppose
  des environnements favorisant l’expérimentation et la prise de risque créative.
  Le soutien public peut jouer un rôle essentiel en permettant la prise de risque
  et le développement en amont des projets, en complément des engagements des diffuseurs,
  des plateformes, des distributeurs et des autres partenaires privés. La capacité
  des créateurs et des producteurs à développer leurs œuvres dans la durée constitue
  une condition de ce renouvellement, tout comme l’émergence de la prochaine génération
  de professionnels. Ceux qui tirent bénéfice de la diffusion, de la distribution
  et de l’exploitation des œuvres ont à la fois une responsabilité et un intérêt direct
  à soutenir la création de demain. 4. Nous défendons la diversité des œuvres. La
  diversité des œuvres, quels que soient leurs budgets, leurs langues, leurs genres,
  leurs formats et leurs origines géographiques n’est pas une contrainte pour la compétitivité ;
  elle en est le fondement. La diversité culturelle permet l’épanouissement d’une
  pluralité de récits, de cultures et de points de vue, et renforce la vitalité, la
  résilience et l’attractivité de nos écosystèmes créatifs. 5. Nous reconnaissons
  l’industrie audiovisuelle comme un moteur de croissance économique. Au-delà de sa
  valeur essentielle pour notre culture et notre société, l’industrie du cinéma et
  de l’image animée constitue un puissant moteur de croissance économique. Elle stimule
  l’investissement dans un large éventail d’activités, crée des emplois, développe
  des compétences hautement qualifiées, favorise l’innovation et génère une activité
  économique significative. Nous nous engageons à promouvoir un écosystème compétitif
  et pérenne. 6. Nous œuvrons à renforcer la découvrabilité des œuvres. Dans un environnement
  caractérisé par l’abondance des images, permettre aux œuvres d’être découvertes,
  de circuler de manière équilibrée entre les différents lieux de diffusion et les
  plateformes, et de rencontrer leurs publics, est devenu aussi essentiel que leur
  création. Nous sommes également conscients des nouvelles opportunités et des nouveaux
  défis liés aux intelligences artificielles agentiques, ainsi qu’à la possible émergence
  d’un monde où l’accès aux œuvres serait de plus en plus médié par des agents automatisés.
  Nous reconnaissons l’importance de garantir la visibilité et l’accessibilité des
  œuvres singulières aux publics. 7. Nous réaffirmons la valeur pérenne de l’expérience
  en salle. Le cinéma offre une manière unique de transformer une œuvre en expérience
  collective, en faisant de sa découverte un événement partagé qui nourrit le lien
  social, renforce le sentiment d’appartenance et crée une valeur culturelle et économique
  durable. Le maintien de l’exploitation en salle constitue un intérêt commun pour
  l’ensemble du secteur. La diversité a besoin des salles de cinéma pour prospérer ;
  les salles de cinéma ont besoin de la diversité pour remplir pleinement leur rôle
  culturel, économique et social. 8. Nous construisons des œuvres et des univers créatifs
  qui voyagent. Les récits circulent désormais entre les formats et au-delà des frontières.
  La coproduction internationale permet de diversifier les risques, d’enrichir les
  œuvres et de rapprocher nos écosystèmes ; la création transmédia prolonge les univers
  narratifs et les ouvre à de nouveaux publics. Nous renforcerons la coopération et
  les échanges entre marchés établis et émergents, partagerons les expertises et soutiendrons
  les capacités créatives de chaque territoire afin que la diversité des récits trouve
  sa place sur les écrans du monde entier. 9. Nous protégeons les œuvres contre le
  piratage. Le piratage porte atteinte à la valeur de la création, à la rémunération
  des créateurs et au financement des œuvres futures. Lorsque la création n’est pas
  justement rémunérée, elle ne peut se renouveler. Nous nous engageons à renforcer
  la coopération internationale pour lutter contre le piratage sous toutes ses formes.
  10. Nous nous approprions le progrès technologique tout en protégeant la propriété
  intellectuelle. Le cinéma est né de la rencontre entre la technologie et l’art,
  et l’intelligence artificielle peut renforcer la créativité, l’innovation et la
  circulation des œuvres, à condition qu’elle demeure un outil au service de la création.
  Les œuvres créées par l’être humain restent le fondement de nos industries créatives
  et la source des récits, personnages et expériences culturelles qui inspirent et
  éduquent les publics à travers le monde. La création humaine doit toujours demeurer
  au cœur et au fondement des œuvres. Le respect de la propriété intellectuelle constitue
  une condition essentielle à la viabilité de l’industrie de l’image animée. 11. Nous
  défendons la liberté de création. La liberté de création est une condition de la
  vitalité et de la diversité du cinéma et de l’image animée. Dans de nombreuses régions
  du monde, les créateurs continuent de faire face à des pressions politiques, économiques
  ou sociales qui menacent leur capacité à créer et à être entendus. Nous soutenons
  le développement de réseaux internationaux de solidarité destinés à protéger les
  voix menacées et à préserver les conditions nécessaires à l’expression artistique.
  12. Nous promouvons dans l’industrie l’égalité entre les femmes et les hommes, la
  sûreté et l’inclusion. Parce que le secteur de l’image animée dispose d’un pouvoir
  unique pour façonner et transformer les représentations, notre industrie doit être
  exemplaire dans l’exercice de cette responsabilité. Le secteur joue un rôle déterminant
  dans le regard que nous portons sur nous-même et sur le monde. La richesse des récits
  dépend de la diversité de celles et ceux qui les créent. Nous œuvrerons afin que
  chacun puisse contribuer pleinement à nos industries dans des environnements sûrs,
  équitables et inclusifs. 13. Nous reconnaissons l’urgence de préserver le patrimoine
  mondial du cinéma et de l’image animée. À ce jour, seule une partie de notre héritage
  commun a été préservée et nous sommes entrés dans une phase critique pour la conservation
  des archives physiques, dont les supports se dégradent inexorablement avec le temps.
  Ce patrimoine constitue un héritage irremplaçable dans lequel s’inscrivent nos récits,
  nos langues et nos identités collectives. Sa sauvegarde exige des investissements
  pérennes et une solidarité internationale entre gouvernements, centres d’archives,
  fondations et mécènes, afin que chaque pays puisse transmettre sa mémoire, vivante
  et accessible, aux générations futures. 14. Nous soutenons des modes de production
  plus durables. Nous œuvrerons à l’élaboration de bonnes pratiques, de référentiels
  souples et d’outils opérationnels favorisant la conception et la mise en œuvre de
  modes de production, de distribution et de diffusion plus durables. 15. Nous faisons
  de l’éducation à l’image un apprentissage fondamental du XXIe siècle. De même que
  les siècles passés ont porté l’ambition de l’accès universel à la lecture et à l’écriture,
  l’ère de l’image appelle aujourd’hui un engagement d’égale ambition en faveur de
  l’éducation à l’image. Celle-ci développe l’esprit critique, favorise une relation
  plus équilibrée et plus active aux écrans, ouvre la voie à la découverte d’œuvres
  exigeantes et prépare le renouvellement des publics dont dépend notre avenir commun.
  Elle trouve un lieu privilégié dans la salle de cinéma - l’un des derniers espaces
  où les écrans individuels s’éteignent et où nous apprenons de nouveau à regarder
  ensemble. Nous soutenons le lancement, avec l’UNESCO et les pays partenaires, d’une
  initiative internationale visant à faire reconnaître l’éducation à l’image comme
  une ambition universelle et à la promouvoir dans le monde entier, dès le début de
  la scolarité. Nous convenons de poursuivre collectivement notre engagement sur ces
  questions et d’examiner ensemble les progrès accomplis. Deux cents ans après la
  première photographie et cent trente ans après la première projection publique du
  Cinématographe des frères Lumière, le Sommet Lumière ouvre un nouveau chapitre :
  le cinéma et l’image animée disposent désormais des prémices d’une gouvernance mondiale,
  un multilatéralisme appelé à se développer au travers de nouvelles initiatives,
  de nouveaux partenaires et de futures rencontres internationales. Fait à Saint-Paul-de-Vence,
  le 7 septembre 2026.'
