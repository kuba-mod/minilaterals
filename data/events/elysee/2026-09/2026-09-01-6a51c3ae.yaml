title: Déplacement  en Lozère à l'occasion de la rentrée scolaire.
text: Le Président de la République s'est rendu au lycée Chaptal de Mende, le 1 er
  septembre 2026, à l’occasion de la rentrée scolaire. Dans la suite de son engagement
  pour renforcer la protection des mineurs face aux expositions permanentes aux écrans
  , le chef de l’État a échangé avec les élèves et les enseignants sur la généralisation
  de l’interdiction des téléphones portables au lycée, dans la continuité de ce qui
  est mis en place au collège depuis 2018. À l’issue, le Président de la République
  s'est rendu à la faculté d’éducation de l’université de Montpellier sur le site
  de Mende . La rentrée 2026 marque une nouvelle étape dans la transformation de l’école,
  avec la mise en œuvre de la réforme de la formation initiale des enseignants , grand
  engagement du second quinquennat. Cette dernière permet de préparer plus tôt et
  plus progressivement les futurs enseignants à leur métier , grâce à des programmes
  rénovés, une formation renforcée et mieux répartie sur le territoire. Elle doit
  renforcer durablement l’attractivité du métier et élargir le vivier de candidats
  qui seront rémunérés pendants leurs années de master. Le chef de l’État a échangé
  avec des étudiants se préparant au professorat des écoles , dont notamment les premiers
  lauréats du nouveau concours. 2 septembre 2026 - Seul le prononcé fait foi Merci
  beaucoup d'avoir pris le temps. D'abord, vraiment, je voulais vous remercier pour
  ce moment, Monsieur le Président, Madame la doyenne, et l'ensemble des enseignants
  qui sont là, pour dire que je crois aussi beaucoup à ce que vous faites ici. Ce
  que je veux dire par là, c'est qu'on l'évoquait rapidement en arrivant, mais on
  a beaucoup de nos cycles de formation universitaire qui sont à bâtir, comme vous
  le faites, des villes qui ne sont pas forcément la ville-cœur de l'université. Et
  d'avoir, justement, ce site de l'université de Montpellier, à Mende, ça a beaucoup
  de sens. Ça en a, à mes yeux, beaucoup de disciplines et pour beaucoup de nos villes.
  Et je pense que c'est aussi un outil d'aménagement du territoire au bon sens du
  terme, parce que ça permet d'avoir dans nos villes, et pas simplement dans quelques
  métropoles, des enseignants de grande qualité, de la matière grise, des femmes et
  des hommes de talent qui se dédient à telle ou telle mission dans la société. Et
  c'est très important qu'on démétropolise justement un petit peu les choses à travers
  ces sites. Et quand on voit tous les défis que nous avons par ailleurs sur le logement
  étudiant ou autre, ça a beaucoup de sens. Donc je veux défendre le modèle qu'il
  y a derrière, aussi, ce qui est fait ici de manière plus locale, et je le dis en
  complicité avec les élus qui sont là à mes côtés. Et je sais que je n'ai pas à les
  convaincre. Donc merci à tous. Eux, ils ont raison de vous aider, parce que c'est
  vraiment un partenariat qui est gagnant-gagnant, au sens propre du terme. Donc merci
  pour ça. Et c'est un modèle qu'on veut continuer de faire avancer. Moi, je voulais
  vous remercier vraiment d'avoir pris ce temps pour faire ce retour d'expérience
  dans des journées qui, je le sais, sont toujours particulières, qui sont ces journées
  de rentrée, parfois, en effet, comme le disait le ministre, de double rentrée des
  classes, pour certaines et certains. Et donc merci d'avoir accepté ce temps-là.
  Et notre présence avec le ministre est là pour vous dire d'abord qu'on croit beaucoup
  à ce qui est en train d'être fait et à ce que vous êtes en train de faire, et donc
  à la confiance dans cette réforme et sa consolidation, en tout cas cette nouvelle
  formation, mais vous dire aussi que les missions qui sont et qui seront les vôtres
  sont, à nos yeux, les plus importantes de la vie de la nation. C'est aussi une marque
  de reconnaissance. La reconnaissance, elle est symbolique. On a aussi fait ces revalorisations,
  fait ces décisions, elles sont pécuniaires et le travail est encore à poursuivre,
  même s'il y a eu là-dessus des décisions historiques. Mais nous avons besoin, pour
  notre jeunesse et le futur de la nation, d'avoir des compatriotes qui décident de
  s'engager pour transmettre. Et c'est vraiment l'une des plus belles missions. Donc
  je voulais vous remercier de l'avoir choisie, de vous donner tant de mal pour vous
  former. Et je sais parce que c'est à la fois, il y a cette liberté pédagogique qu'on
  chérit, il y a en même temps une responsabilité pédagogique qui va avec cette liberté.
  Je sais à quel point c'est intimidant chaque année ou parfois chaque jour quand
  on rentre dans la classe de se dire à quoi on veut arriver avec nos élèves. C'est
  ça que vous aurez à faire, mais c'est en même temps magnifique parce qu'on les amène
  d'un point à l'autre et on les aide à, justement, construire sa vie, acquérir des
  connaissances, un esprit critique, une confiance en soi, à tous les niveaux. Et
  donc merci d'avoir embrassé ces métiers et ces vocations. 2 septembre 2026 - Seul
