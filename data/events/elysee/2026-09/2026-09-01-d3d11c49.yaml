title: Disparition d'Édouard Balladur.
text: 'Homme d’État toujours soucieux de raison et de mesure, Édouard Balladur croyait
  en la France. Il incarnait une certaine idée de l’Etat : tout à la fois gaulliste,
  libéral et européen, attaché à la continuité de nos institutions autant qu’à la
  nécessité de les réformer. Avec sa disparition, la République perd l’un de ses grands
  serviteurs. Né en 1929 à Smyrne, dans une famille française établie de longue date
  en Orient, Édouard Balladur grandit à Marseille. Après Sciences Po puis l’École
  nationale d’administration, il entra au Conseil d’État. Il appartenait ainsi à cette
  première génération de hauts fonctionnaires formés après-guerre, appelée à accompagner
  la reconstruction du pays, puis la naissance et l’affermissement de nouvelles institutions.
  Sa rencontre avec Georges Pompidou détermina la suite de son parcours. En 1964,
  il rejoignit son cabinet à Matignon. Il y connut les grandes heures et les grandes
  crises des années 1960, jusqu’à Mai 68 et aux négociations de Grenelle. Lorsque
  Georges Pompidou fut élu Président de la République en 1969, Édouard Balladur le
  suivit à l’Élysée, d’abord comme secrétaire général adjoint, puis comme secrétaire
  général de la présidence. Il se trouva ainsi, pendant près de dix années, au cœur
  de l’exercice du pouvoir, auprès d’un Président dont il demeura l’un des héritiers
  politiques. Après plusieurs années consacrées au Conseil d’État et à l’entreprise,
  il entra à son tour dans l’arène électorale. En 1986, député de Paris, il devint
  ministre d’État, ministre de l’Économie, des Finances et de la Privatisation dans
  le gouvernement de Jacques Chirac. Dans la première cohabitation de la Ve République,
  il engagea une profonde transformation de l’économie française : privatisations,
  libération des prix, modernisation du droit de la concurrence, encouragement de
  l’épargne et de l’actionnariat populaire. À rebours des facilités partisanes, il
  soutint quelques années plus tard le traité de Maastricht, considérant que l’engagement
  européen de la France devait dépasser les clivages. En mars 1993, après la victoire
  de la droite aux élections législatives, le Président François Mitterrand l’appela
  à Matignon. Édouard Balladur devint ainsi le Premier ministre de la deuxième cohabitation.
  Dans une France frappée par la récession et le chômage, il voulut conjuguer redressement
  économique, cohésion sociale et autorité de l’État. Son gouvernement réforma les
  retraites, relança les privatisations, engagea une ambitieuse politique d’aménagement
  du territoire et de soutien à l’emploi, tout en poursuivant la construction européenne.
  Avec François Mitterrand, malgré leurs différences, il fit vivre pendant deux années
  une cohabitation empreinte de respect institutionnel. L’élection présidentielle
  de 1995 constitua l’épreuve politique majeure de sa vie. Candidat à la présidence
  de la République, longtemps donné favori, Édouard Balladur fut finalement devancé
  au premier tour par Lionel Jospin et Jacques Chirac. Cette campagne divisa durablement
  une famille politique et mit à l’épreuve des fidélités anciennes. Après sa défaite,
  il retrouva son mandat de député de Paris et continua de participer à la vie publique,
  avec une présence plus distante mais une même passion des institutions. Car Édouard
  Balladur ne cessa jamais de réfléchir à la France et à son gouvernement. Auteur
  de nombreux essais, il demeura jusqu’au soir de sa vie un observateur attentif de
  la démocratie française, de l’Europe et du monde. En 2007, le Président Nicolas
  Sarkozy lui confia la présidence du comité chargé de réfléchir à la modernisation
  et au rééquilibrage des institutions de la Ve République. Plus d’un demi-siècle
  après son entrée au Conseil d’État, il continuait ainsi de servir cette République
  dont il connaissait les rouages, les forces et les fragilités. Sa distinction, sa
  courtoisie parfois teintée d’ironie, son phrasé reconnaissable entre tous appartenaient
  au personnage. Mais derrière cette distance demeurait une conviction profonde :
  la politique ne vaut que par le service de l’État, et l’État que par le service
  de la France. De Georges Pompidou à François Mitterrand, de Jacques Chirac à Nicolas
  Sarkozy, Édouard Balladur traversa plus d’un demi-siècle de notre vie publique sans
  jamais cesser de penser que gouverner exigeait d’abord de décider et de transmettre.
  Le Président de la République et son épouse saluent la mémoire d’un homme d’État
  qui servit la France au plus haut niveau et marqua durablement la Ve République.
  Ils adressent à ses enfants, à toute sa famille, à ses proches ainsi qu’à toutes
  celles et ceux qui l’ont accompagné leurs condoléances les plus sincères et l’hommage
  reconnaissant de la Nation.'
