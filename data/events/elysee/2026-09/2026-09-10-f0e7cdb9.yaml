title: Declaration for a sustainable use of outer space for all.
text: 'Signature : Armenia, Australia, Austria, Bahrein, Belgium, Brazil, Bulgaria,
  Cambodia, Canada, Chile, Costa Rica, Croatia, Cyprus, Czech Republic, Denmark, Djibouti,
  Ecuador, Estonia, Finland, Georgia, Germany, Greece, Hungary, Iceland, Ireland,
  Israel, Italy, Japan, Jordan, Kazakhstan, Latvia, Luxembourg, Malta, Mauritius,
  Mexico, Morocco, Netherlands, New Zealand, Norway, Philippines, Poland, Romania,
  Rwanda, Saudi Arabia, Serbia, Singapore, Slovakia, Slovenia, South Korea, Spain,
  Sweden, Switzerland, Türkiye, United Arab Emirates, United Kingdom, European Space
  Agency, UN Office of Outer Space Affairs (UNOOSA) We, participants of the International
  Space Summit held in Paris in September 2026 : -    Affirm our common and overarching
  goal to ensure a peaceful, secure, safe, stable and sustainable use of outer space,
  for all humanity. -    Reaffirm the importance of the widest possible adherence
  to and full compliance with the 1967 Outer Space Treaty. -    Note that the United
  Nations Committee on the Peaceful Uses of Outer Space (COPUOS) and its subcommittees
  retain an important role in fostering discussions related to current and emerging
  issues related to the safe and sustainable use of space and promoting consensus
  on effective and practical international cooperation in the peaceful exploration
  and use of outer space. -    Reaffirm that there is a need for international coordination
  to foster transparency, clarity and consistency of relevant policies, guidelines
  and recommendations across the various existing fora and initiatives, in order to
  effectively address and promote the safety and sustainability of space activities
  at large. -    Support a gradual and pragmatic approach to international space issues,
  based on dialogue, transparency and reciprocity. -    Underline the necessity of
  ensuring long-term sustainability of outer space activities. Therefore, we : -  
   Call on all nations to join and participate actively in the work of COPUOS and
  its subcommittees. -    Support consideration by COPUOS, on the basis of consensus,
  of the organization of a UNISPACE IV conference. -    Encourage the implementation
  of best practices and guidelines to encourage the safe and transparent use of outer
  space activities, emphasizing that such measures are complementary to, and not a
  substitute for, efforts to negotiate legally binding instruments in this regard.
  -    Advocate for the continued implementation of the Guidelines for the long-term
  sustainability of outer space activities adopted by COPUOS in 2019. -    Welcome
  the creation of the Expert Group on Space Situational Awareness (SSA) under the
  COPUOS as the most appropriate international forum to address this key issue ; and
  support its work in accordance with its agreed mandate, terms of reference and work
  plan. Call on the Expert Group on SSA to study measures for enhanced international
  coordination and report to COPUOS for consideration and decision by consensus. -  
   Call for the adoption by COPUOS of the voluntary recommendations of the Expert
  Group on SSA, advancing a shared understanding of information important for timely
  and effective coordination ; with consideration of the possible establishment of
  an information sharing and international coordination framework under COPUOS on
  SSA enabling spacecraft operators to share, maintain and make available up-to-date
  points of contact without prejudice to respective national regulatory framework,
  whose secretariat could be assured by UNOOSA.'
