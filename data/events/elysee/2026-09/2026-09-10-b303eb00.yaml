title: Appel à renforcer l’exploration spatiale européenne.
text: 'Autriche, Belgique, République tchèque, Danemark, Estonie, Finlande, France,
  Allemagne, Grèce, Hongrie, Irlande, Italie, Luxembourg, Pays-Bas, Norvège, Pologne,
  Portugal, Roumanie, Slovénie, Espagne, Suède, Suisse, Royaume-Uni, avec le soutien
  du Canada. Nous, ministres des États membres de l’Agence spatiale européenne, réunis
  ici ce jour à l’occasion du Sommet international sur l’espace à Paris et souhaitant
  voir l’Europe devenir un partenaire plus puissant dans le cadre des efforts internationaux
  visant à explorer l’espace extra-atmosphérique, déclarent ce qui suit : 1. L’espace
  est un domaine stratégique en matière de prospérité économique, de dynamisme technologique
  et d’influence mondiale. Il est source de découvertes scientifiques, améliore la
  compétitivité industrielle, accélère l’innovation, ouvre des possibilités commerciales
  et renforce les interactions diplomatiques. Ceux qui investissent et sont en tête
  aujourd’hui influenceront les partenariats et les possibilités de demain. 2. Alors
  que la concurrence géopolitique s’intensifie et que l’espace continue de gagner
  en importance, l’exploration spatiale devient une source d’autonomie stratégique.
  Par conséquent, l’Europe doit renforcer sa capacité à définir des priorités et à
  rechercher des partenariats à la pointe du vol spatial. La réalisation de cette
  ambition nécessite un engagement politique durable, des investissements coordonnés
  et une vision à long terme pour développer, maintenir et faire progresser des capacités
  d’exploration critiques. 3. Une ambition européenne plus forte en matière d’exploration
  spatiale n’est pas une alternative à la coopération internationale, mais sert justement
  de socle à celle-ci pour renforcer les partenariats existants et en nouer de nouveaux.
  En maîtrisant les technologies clés, en développant des atouts stratégiques et en
  réalisant des missions ambitieuses, l’Europe sera en mesure de poursuivre des objectifs
  communs en tant que partenaire fiable et indispensable. L’orbite terrestre basse
  et la Lune serviront de terrains d’essai lors de la prochaine étape de l’exploration
  spatiale, ouvrant la voie à des missions de plus en complexes vers Mars. 4. L’orbite
  terrestre basse est un vecteur pour la science, l’exploration, l’innovation et l’activité
  économique. Alors que la fin de l’exploitation de la Station spatiale internationale
  approche, un nouvel écosystème collaboratif, mais aussi commercial et concurrentiel,
  émerge. L’Europe doit avoir un accès durable à cet écosystème. Le développement
  d’une capacité européenne compétitive dans le domaine du transport d’astronautes
  serait une nouvelle étape décisive pour renforcer notre base technologique et industrielle,
  garantir notre accès et positionner l’Europe comme un acteur central développant
  des possibilités en orbite. 5. Le retour sur la Lune ouvre le prochain grand chapitre
  de l’exploration spatiale. La Lune est le terrain d’essai par excellence pour les
  technologies, les partenariats et les normes qui accompagneront la présence continue
  de l’humanité dans l’espace et nous permettront de progresser vers Mars, et dans
  ce contexte, l’arrivée d’un robot à sa surface marque une étape importante. L’Europe
  doit prendre sa place en trouvant un équilibre entre les partenariats et une autonomie
  ciblée. En fournissant des systèmes critiques tout en développant ses propres capacités
  robotiques, l’Europe peut coopérer en étant en position de force. 6. Pour assurer
  son avenir dans le domaine de l’exploration spatiale, l’Europe doit traduire ses
  ambitions en perspectives économiques durables. Des approches compétitives et commercialement
  viables accélèreront l’innovation, optimiseront la valeur des investissements publics
  et généreront de la croissance dans l’ensemble du secteur. Un écosystème d’exploration
  dynamique et concurrentiel renforcera la base industrielle et technologique de l’Europe
  et lui permettra de rester à la pointe de l’innovation dans un secteur en rapide
  évolution. 7. L’Europe dispose des moyens, des talents et des partenariats nécessaires
  pour revoir à la hausse son ambition collective en matière d’exploration spatiale.
  En s’appuyant sur son excellence scientifique, son innovation technologique, son
  esprit d’entreprenariat et sa tradition de coopération, l’Europe doit maintenant
  transformer ses points forts en capacités autonomes pour l’orbite terrestre basse
  et en importantes contributions à l’exploration de la Lune. Cela nécessite de prendre
  en temps voulu des mesures cohérentes et coordonnées qui tiennent compte du rythme
  des évolutions mondiales. Le temps est venu de définir une orientation politique
  claire. I. à renforcer l’autonomie de l’Europe en matière d’exploration spatiale
  dans les secteurs où cela compte le plus, tout en renforçant la coopération internationale ;
  II. à développer des capacités essentielles pour assurer la présence de l’Europe
  en orbite basse et renforcer la participation de l’Europe aux projets sur et autour
  de la Lune ; III. à promouvoir des approches commercialement viables, compétitives
  et rentables qui renforcent la base industrielle de l’Europe et élargissent les
  possibilités d’innovation et de croissance ; et IV. à veiller à ce que l’Europe
  reste un partenaire fiable et indispensable pour la prochaine grande entreprise
  de l’humanité dans l’espace, nous demandons à l’Agence spatiale européenne de préparer
  rapidement les propositions nécessaires pour traduire cette ambition en mesures
  concrètes et durables, afin que nous prenions une décision lors de la réunion ministérielle
  intermédiaire qui aura lieu en décembre de cette année.'
