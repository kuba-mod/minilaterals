title: Avec la première promotion des appelés au Service national sur la base aérienne
  115 d'Orange.
text: Le Président de la République s'est rendu sur la base aérienne 115 d’Orange,
  le mardi 15 septembre 2026, à la rencontre de la première promotion des appelés
  au Service national. Annoncé par le chef de l’État en novembre 2025 à Varces, le
  Service national traduit la volonté du Président de la République de consolider
  le lien entre les armées et la Nation, de renforcer la capacité de résistance de
  la Nation, et de consolider la formation des jeunes Français. Il a annoncé que cette
  première promotion porterait le nom de Henri Fertet , jeune résistant fusillé par
  les Allemands en 1943 alors qu'il n'avait que 16 ans. 15 septembre 2026 - Seul le
  prononcé fait foi Officiers, sous-officiers, officiers mariniers, soldats, marins
  et aviateurs et parmi vous appelés du Service National, personnel civil de la Défense,
  il y a un peu moins d'un an, à Varces, j'annonçais la création d'un nouveau Service
  National, exclusivement militaire, fondé sur le volontariat. Ce Service ational
  poursuit trois objectifs. Renforcer le lien entre la nation et son armée, renforcer
  la résistance de notre pays et consolider la formation de la jeunesse de France.
  L'ambition est de monter en puissance progressivement avec 3 000 appelés cette année,
  10 000 en 2030. Nous y sommes. Le Parlement a voté la loi de programmation militaire,
  le Conseil constitutionnel l'a validée, elle a été promulguée il y a quelques semaines,
  c'est maintenant une réalité. Je me trouve donc aujourd'hui devant vous, à Orange,
  pour baptiser la première promotion 2026 des appelés du Service national. Oui, vous
  êtes les premiers, les premiers à avoir répondu volontairement à l'appel de la nation
  dans ce nouveau cadre, les premiers à avoir ainsi choisi de consacrer dix mois de
  votre vie au service de la France, les premiers aussi à tracer une voie que d'autres
  emprunteront après vous. Vous n'êtes pas ici par hasard, vous avez choisi de vous
  engager, vous avez été sélectionnés et vous recevez la confiance des armées, et
  cette confiance vous oblige, cette confiance vous confère la mission d'apprendre
  avec humilité et servir avec discipline. Vous allez vous former à un métier, acquérir
  des compétences, découvrir la vie d'une unité militaire et contribuer à ses missions.
  Vous allez aussi apprendre quelque chose de bien plus précieux encore, le sens du
  collectif, c'est-à-dire compter sur les autres, s'appuyer sur eux, être dignes de
  leur confiance. L'esprit d'engagement, ce n'est jamais servir seul, c'est aussi
  cela que nous voulons vous transmettre avec le Service national. Vous allez prendre
  la mesure du premier des enseignements de cet engagement, la vie des autres est
  aussi la vôtre. À Varces, je vous disais que j'avais confiance en votre soif d'engagement
  et que l'armée de la République était le cadre naturel pour exprimer cette volonté
  de servir. Ce qui vous rassemble aujourd'hui, c'est ce désir de servir, plus grand
  que soi, et de se rendre utile à la France. Il faut désormais à votre promotion
  un nom, un nom qui parle à votre génération, un nom qui rappelle ce que la France
  doit à sa jeunesse, un nom qui porte une certaine idée de l'engagement et de la
  liberté. Ce nom sera celui d'Henri Fertet. Henri Fertet est né le 27 octobre 1926.
  Il était lycéen à Besançon. C'était un élève intelligent et appliqué, passionné
  d'histoire et d'archéologie. Et dès l'été 1942, il rejoignit la Résistance. Il avait
  16 ans, un peu moins que votre âge, lorsqu'il choisit de ne pas rester spectateur
  de son temps. Il participa comme chef d'équipe à trois opérations, s'illustra par
  son courage, son esprit d'initiative, sa détermination, mais arrêté par les Allemands,
  emprisonné et torturé durant 87 jours, condamné à mort, il fut fusillé le 26 septembre
  1943 à la citadelle de Besançon avec ses camarades. Henri Fertet combattit au péril
  de sa vie pour que la France puisse redevenir libre. Vous, héritiers de ce combat
  qui fut celui de tant d'autres, avez aujourd'hui la chance de vivre dans la France
  libre. Votre époque n'est pas la sienne, votre mission ne sera pas la sienne, mais
  le choix qu'il fit, celui de servir la France et de défendre sa liberté, fait écho
  à votre engagement. Parce que la vie d'Henri Fertet est une leçon d'engagement,
  la France reconnut ce jeune homme qui devint compagnon de la libération après sa
  mort. Il fut décoré de la Légion d'honneur, de la croix de guerre 1939-1945 et de
  la médaille de la résistance française, de la croix du combattant volontaire 1939-1945,
  de la médaille des déportés et internés résistants. Il reçut, à titre posthume,
  le grade d'aspirant des forces françaises de l'intérieur. Oui, compagnon de la libération,
  c'est aussi à ce titre que le nom d'Henri Fertet doit être connu de votre génération.
  Les 1038 compagnons de la libération, dont une centaine n'avaient pas 20 ans au
  début de la Seconde Guerre mondiale, demeurent un exemple pour la jeunesse française.
  Militaires, civils, venus de tous les horizons, illustres comme anonymes, ils avaient
  fait le choix de la France et de la liberté, le choix de servir plutôt que subir.
  C'est pourquoi j'ai décidé qu'à l'avenir chaque promotion du Service national portera
  le nom d'un compagnon de la libération, afin de rendre hommage à ces héros qui ont
  contribué à sauver la France et que leurs histoires de Français deviennent histoire
  de France. Dans sa dernière lettre à ses parents, Henri Fertet écrivait « Je veux
  une France libre et des Français heureux ». Des mots simples qui nous rappellent
  que si la liberté est le legs des générations qui nous ont précédées, il nous revient
  de la préserver, cultiver et propager. La liberté n'a de sens que dans la mesure
  où elle offre à chacun de vivre, d'espérer, de construire son avenir. Cet idéal,
  celui d'Henri Fertet, vous accompagnera désormais. Il donnera une profondeur supplémentaire
  à ce que vous allez vivre ces prochains mois, la découverte du métier des armes,
  les traditions, la camaraderie, le goût de l'effort, l'obéissance choisie, parfois
  aussi l'inconfort et l'incertitude qui cultivent le caractère. Vous allez aussi
  découvrir la richesse de nos armées, de leurs missions, les nombreux métiers qu'elles
  offrent et les talents qu'elles font fructifier. Vous y apporterez votre jeunesse,
  vos compétences, votre enthousiasme et votre énergie. En retour, les armées vous
  transmettront le culte du dépassement de soi, le sens de la mission et la fraternité
  d'armes. Ces vertus, je le sais, vous accompagneront tout au long de votre vie.
  Dans quelques mois, votre Service national prendra fin. Certains d'entre vous poursuivront
  leur chemin dans nos armées d'actives ou de réserves. Mais chacun, quel que soit
  son choix, demeurera un acteur de la cohésion nationale et emportera avec lui cette
  conviction. Servir la France est une fierté et un honneur. Alors, appelés de la
  première promotion du Service national, vous qui portez désormais le nom d'Henri
  Fertet, portez-le avec fierté. Soyez digne de la confiance qui vous est faite. Soyez
  fidèle à l'engagement que vous avez choisi. Vive la promotion Henri Fertet du Service
  national. Vive la République. Vive la France. 15 septembre 2026 - Seul le prononcé
