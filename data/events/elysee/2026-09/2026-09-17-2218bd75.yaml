title: Réunion entre le Président de la République, le Roi Abdallah II de Jordanie
  et Joseph Aoun, Président de la République libanaise.
text: Le Président Emmanuel Macron a reçu ce jeudi le Roi Abdallah II de Jordanie
  et Joseph Aoun, Président de la République libanaise à Paris. Les trois dirigeants
  ont travaillé à renforcer la souveraineté et la sécurité du Liban , essentielles
  à la stabilité de toute la région. Ils ont ouvert ensemble une réunion d’experts
  militaires de haut niveau dans le cadre du processus d’Aqaba, destinée à soutenir
  les Forces armées libanaises , pilier de la souveraineté du pays et indispensable
  pour permettre à l’État d’assurer pleinement la sécurité de son territoire et l’exercice
  du monopole de l’Etat sur les armes. Le chef de l’État s'est entretenu dans un premier
  temps avec le Président Joseph Aoun, auprès duquel il a réaffirmé l’engagement durable
  de la France aux côtés du peuple libanais. Puis, avec le Roi Abdallah II, il a abordé
  le soutien de la France à la sécurité et la stabilité de la Jordanie, ainsi que
  l’action conjointe de nos deux pays en réponse aux crises régionales. Agir pour
  la stabilité du Moyen-Orient, c’est aussi agir directement dans l’intérêt des Français
  . En contribuant à réduire les tensions dans une région essentielle aux échanges
  et aux approvisionnements énergétiques mondiaux, et en préservant la diversité de
  nos voies d’approvisionnement, la France agit pour protéger notre économie des crises
  et limiter leurs conséquences sur les prix de l’énergie.
