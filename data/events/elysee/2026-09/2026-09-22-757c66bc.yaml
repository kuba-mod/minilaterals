title: Lancement de la feuille de route de la coalition pour les droits et la protection
  de l’enfance à l’ère de l’intelligence artificielle.
text: 'La France, l''Espagne, le Kenya et l''Australie, en tant que coprésidents,
  ont présenté une feuille de route soutenue par 26 États et huit entités des Nations
  unies. Dans le cadre de la Semaine de haut niveau de la 81e session de l''Assemblée
  générale des Nations Unies, la Coalition pour les droits et la protection de l''enfance
  à l''ère de l''IA a présenté aujourd''hui son plan d''action pour la période 2026-2027,
  lors d''un événement de haut niveau réunissant des chefs d''État et de gouvernement,
  des organismes des Nations Unies, la société civile et des partenaires du secteur
  privé. Lancée le 7 juillet 2026 par la France, l''Espagne et le Kenya lors du premier
  dialogue mondial des Nations unies sur la gouvernance de l''IA, la coalition a ensuite
  été rejointe par l''Australie. Elle regroupe désormais 23 États et huit entités
  du système des Nations unies : l''Union internationale des télécommunications (UIT),
  l''UNESCO, l''UNICEF, le Haut-Commissariat aux droits de l''homme (HCDH), le Bureau
  du représentant spécial du Secrétaire général pour les questions technologiques
  (ODET), le Département de la communication mondiale des Nations unies, le Représentant
  spécial du Secrétaire général pour la lutte contre la violence à l''égard des enfants
  (SRSG-VAC) et le Comité des droits de l''enfant. Cette coalition réunit des organisations
  de la société civile, des entreprises technologiques, des éducateurs, des chercheurs
  et des experts en matière de droits et de sécurité de l''enfance, tous unis par
  une conviction commune : chaque enfant doit pouvoir bénéficier de l''intelligence
  artificielle dans des conditions qui protègent sa sécurité, ses droits et son développement.
  Ce travail s''appuie notamment sur les engagements pris dans le cadre de l''Appel
  d''Évian du G7 pour un espace numérique plus sûr pour les mineurs, et s''inspire
  des approches nationales émergentes en matière de responsabilité des plateformes,
  notamment le cadre australien de « devoir de diligence », comme références pour
  une approche cohérente et fondée sur la science en matière de sécurité des enfants
  dans l''environnement numérique et de l''IA. Les systèmes d''intelligence artificielle
  qui prétendent apporter des avantages aux enfants devraient, à terme, être soumis
  à des procédures d''autorisation préalable avant de parvenir sur le marché. Le but
  précis des travaux lancés aujourd''hui est de développer les bases de données et
  les méthodes d''évaluation partagées qui rendent cela possible. Dans l''intervalle,
  la coalition appelle à une action rapide et volontaire, notamment par le biais d''un
  accès ouvert aux modèles et aux données des développeurs d''IA pour les chercheurs
  indépendants, ainsi qu''à des engagements de la part des entreprises. La coalition
  poursuivra son action autour de trois axes : maintenir un niveau d''ambition politique
  élevé grâce à un calendrier d''étapes internationales jusqu''en 2027 ; concrétiser
  des résultats tangibles, en parallèle du travail de groupes de travail thématiques,
  notamment sur la sécurité et la confidentialité dès la conception, les indicateurs
  de référence et la responsabilisation, la lutte contre les contenus pédopornographiques
  générés par l''IA et les deepfakes, et l''éducation à l''IA ; et renforcer l''action
  du système des Nations unies grâce à une base de données opérationnelle commune
  recensant les initiatives et les données probantes. Afin de soutenir ces objectifs,
  la Coalition poursuivra son travail sur un réseau mondial de centres de recherche
  issus des secteurs public, académique et privé, et invitera les entreprises, les
  fondations et d''autres partenaires à financer des recherches indépendantes sur
  l''impact de l''IA sur les enfants, et à rendre leurs modèles accessibles pour une
  évaluation indépendante. La Coalition prévoit de présenter ses premiers engagements
  volontaires dans le cadre de cette initiative lors du Forum de Paris pour la paix,
  les 10 et 11 novembre 2026. France – Le Président Emmanuel Macron : « Protéger les
  enfants en ligne est une priorité de santé publique majeure, une réalité prouvée
  et documentée par des scientifiques du monde entier. C''est pourquoi la France en
  a fait une priorité, notamment en interdisant l''utilisation des réseaux sociaux
  pour les mineurs de moins de 15 ans. Nous défendons et partageons cette priorité
  avec le même niveau d''engagement en ce qui concerne l''intelligence artificielle.
  Nous ne devons pas répéter les erreurs du passé et attendre vingt ans pour constater
  l''impact des chatbots sur les mineurs. Nous devons agir maintenant. Ensemble avec
  la Coalition pour les droits et la protection de l''enfance à l''ère de l''IA, nous
  envoyons un message clair : l''IA ne doit pas être mise à la disposition des enfants
  sans avoir été préalablement testée, évaluée et, par conséquent, autorisée. Cet
  effort doit impliquer toutes les parties prenantes : nous nous retrouverons en novembre
  au Forum de Paris pour la prochaine étape. » Espagne – Le Premier ministre Pedro
  Sánchez : « Il est possible de restaurer l''espoir quant à l''avenir de la technologie.
  Mais cela exige des limites claires, une responsabilisation et une coopération :
  l''intelligence artificielle doit servir l''humanité, et non l''inverse. » Kenya
  – Le Président William Ruto : « Les enfants perçoivent la technologie différemment
  selon les régions du monde. Pour de nombreux enfants africains, l’accès à la technologie
  est synonyme d’accès à l’éducation, au savoir, aux soins de santé et à de nouvelles
  opportunités. Notre réaction ne peut pas être de leur refuser cet accès. Nous devons
  élargir cet accès tout en rendant la technologie plus sûre dès sa conception, afin
  que chaque enfant puisse apprendre, créer et participer tout en étant protégé contre
  tout danger » Australie – Le Premier ministre Anthony Albanese : « Pour assurer
  la sécurité des enfants, nous devons unir nos forces et mettre à profit notre pouvoir
  et notre capacité d’action pour façonner l’avenir du numérique. Je suis très fier
  du travail accompli par l’Australie, sous l’impulsion des parents, pour interdire
  les réseaux sociaux aux moins de 16 ans et offrir ainsi aux enfants un précieux
  répit. L’Australie poursuit sur cette lancée, notamment avec de nouveaux projets
  de loi – « My Feed, My Way » – visant à redonner aux Australiens le choix face aux
  algorithmes. À mesure que les capacités de l’IA progressent, les risques s’accroissent
  également, tout comme la nécessité de collaborer au-delà des frontières pour façonner
  l’IA, plutôt que de la laisser nous façonner. Aucun pays ne peut gérer ces risques
  seul, nous devons travailler ensemble. »'
