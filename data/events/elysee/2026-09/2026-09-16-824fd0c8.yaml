title: Cérémonie de prise d'armes à l'Hôtel national des Invalides.
text: Le Président de la République a présidé la prise d’armes qui s'est déroulé le
  mercredi 16 septembre dans la cour d’honneur de l’Hôtel national des Invalides.
  À cette occasion, le chef de l’État a procédé à une remise de décorations à des
  militaires et civils des Armées et de la Gendarmerie particulièrement méritants.
  À quelques jours des Journées européennes du patrimoine, cette cérémonie marque
  également l’achèvement de la rénovation complète de la cour d’honneur des Invalides,
  classée au titre des monuments historiques et rouvrira au public.
