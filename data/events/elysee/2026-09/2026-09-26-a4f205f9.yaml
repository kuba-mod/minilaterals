title: Disparition de Marina Vlady.
text: 'Elle fut princesse, héroïne de Madame de La Fayette, actrice de Godard, figure
  du cinéma populaire et muse des plus grands auteurs. Mais aucun rôle, aucune image,
  aucun film ne pouvait tout à fait contenir Marina Vlady. Marina Vlady s’est éteinte
  à l’âge de 88 ans. Avec elle disparaît l’une des grandes figures du cinéma français,
  une actrice qui traversa plus d’un demi-siècle de création sans jamais se laisser
  enfermer dans un rôle, une époque ou une image. Née Catherine Marina de Poliakoff-Baïdaroff
  en 1938 à Clichy, elle grandit dans une famille d’artistes russes exilés en France.
  Son père, Vladimir, était chanteur d’opéra ; sa mère, Militza, danseuse. Tous deux
  transmirent à leurs quatre filles la passion des arts, l’amour de la culture russe
  et une certaine manière de ne rien céder de leur liberté. Marina choisit son nom
  de scène en hommage à son père : Vlady, pour Vladimir. Elle n’avait pas onze ans
  lorsqu’elle apparut pour la première fois à l’écran. Très vite, le cinéma reconnut
  en elle plus qu’une beauté : une présence. Robert Hossein la dirigea dans Les Salauds
  vont en enfer. L’Italie l’adopta. La France la consacra. Puis vint, en 1961, La
  Princesse de Clèves de Jean Delannoy. Marina Vlady y prêta son visage à l’une des
  héroïnes les plus célèbres de notre littérature. Elle lui donna sa retenue, sa gravité,
  cette tension entre le devoir et le désir qui faisait du personnage de Madame de
  La Fayette une femme déjà moderne. Le rôle aurait pu l’enfermer pour toujours dans
  l’image d’une princesse hiératique. Elle passa sa vie à s’en échapper. Car Marina
  Vlady avait le goût de l’inattendu et du risque. Avec Marco Ferreri, dans Le Lit
  conjugal, elle reçut en 1963 le prix d’interprétation féminine au Festival de Cannes.
  Avec Orson Welles, elle entra dans Shakespeare. Avec Jean-Luc Godard, dans Deux
  ou trois choses que je sais d’elle, elle devint le visage d’une époque qui interrogeait
  ses propres métamorphoses. Avec Bertrand Tavernier, dans Que la fête commence, elle
  retrouva l’Histoire française du côté de l’insolence et de la liberté. Près d’une
  centaine de films, le théâtre, la télévision : Marina Vlady aura tout joué parce
  qu’elle refusait précisément de rejouer. Princesse ou femme du peuple, tragique
  ou légère, classique ou moderne, elle pouvait passer du cinéma populaire aux œuvres
  les plus audacieuses, de la France à l’Italie, de la scène à l’écran. Elle ne cherchait
  pas à construire une image : elle cherchait des personnages, des auteurs, des aventures.
  Cette liberté, elle la porta aussi dans sa vie. La Russie demeura jusqu’au bout
  l’une de ses patries intimes. Celle de ses parents, de son enfance, de la langue
  parlée avec ses sœurs. Celle aussi de Vladimir Vyssotski, poète, chanteur et comédien
  qu’elle épousa en 1970. Leur histoire fut une histoire d’amour, mais aussi de frontières
  franchies, d’absences et de combats. Après sa mort, en 1980, elle lui consacra Vladimir
  ou le vol arrêté, transformant le deuil en littérature et la mémoire en œuvre. Car
  Marina Vlady écrivit aussi, comme si le cinéma n’avait jamais suffi à tout ce qu’elle
  voulait dire. Cette indépendance était enfin celle d’une citoyenne. Elle s’engagea
  contre la guerre d’Algérie, signa le Manifeste des 343 pour le droit à l’avortement
  et soutint les combats en faveur des sans-logis et des sans-papiers. Libre dans
  ses rôles, libre dans ses choix, libre dans ses amours comme dans ses engagements,
  Marina Vlady aura traversé le siècle avec ce mélange rare d’élégance et d’insoumission.
  Le Président de la République et son épouse saluent la mémoire d’une immense comédienne,
  d’une écrivaine et d’une femme de convictions qui aura fait de chaque rôle une aventure
  et de sa vie un chemin de liberté. Ils adressent à ses enfants, à ses proches, à
  ses amis, à ses compagnons de scène et d’écran, ainsi qu’à tous ceux qui l’ont admirée
  et aimée, leurs condoléances les plus sincères.'
