title: Dialogue franco-néerlandais sur la tech.
text: 'L’Europe comblera le fossé technologique . Le leadership technologique se traduit
  directement en puissance économique, en influence politique et en capacités militaires.
  Dans un contexte de concurrence géopolitique croissante, les capacités technologiques
  constituent des atouts stratégiques et des sources de puissance. Pour renforcer
  la prospérité et la sécurité de l’Europe, nous devons œuvrer ensemble au renforcement
  et à la mise à l’échelle de son écosystème technologique. L’Europe possède les capacités
  nécessaires pour être à la pointe des technologies qui façonneront sa souveraineté,
  sa résilience et sa compétitivité futures . Elle abrite des entreprises, des talents,
  une recherche, des technologies et des capacités industrielles de premier plan à
  l’échelle mondiale. Le défi consiste désormais à connecter ces atouts tout au long
  des chaînes de valeur des technologies critiques et à traduire l’excellence en production
  industrielle à grande échelle et en sécurité économique. Cela exige une approche
  européenne globale des technologies critiques, tout en concentrant nos efforts sur
  la réduction des dépendances stratégiques, le développement capacités européennes
  dans les différents domaines technologiques et la saisie des opportunités de marché
  actuelles et futures. L’Europe doit déployer l’innovation à grande échelle, en commençant
  par le marché unique européen . Nous devons continuer à mener des activités de recherche,
  de développement, de construction, de déploiement et d’intégration des technologies
  en Europe, tout en créant des modèles économiques durables capables d’être compétitifs
  et moteurs au niveau mondial. Cela nécessite une base européenne solide, qui ne
  peut être constituée que par des investissements stratégiques et des conditions-cadres
  favorables (notamment une réglementation simplifiée, des infrastructures informatiques
  et énergétiques, des capitaux, des marchés publics, des talents et des partenariats
  internationaux), ainsi que des instruments politiques conçus pour permettre aux
  entreprises européennes de passer à l’échelle et de devenir des champions mondiaux.
  En matière de capital, l’Europe doit garantir un financement sans rupture « du laboratoire
  à l’usine », y compris le déploiement industriel . En complément des capitaux privés,
  qui doivent être mobilisés par l’achèvement de l’Union de l’Epargne et de l’Investissement
  (UEI), et le soutien des États membres, le Fonds européen pour la compétitivité
  (FEC) doit assurer un continuum d’opportunités et d’instruments de financement au
  service de la compétitivité européenne et de l’autonomie stratégique dans les technologies
  critiques. Dans l’intervalle, le Fonds « Scaleup Europe » et un potentiel futur
  Fonds européen de capital-investissement pour les technologies stratégiques (STEF)
  doivent apporter un niveau important de fonds propres à des entreprises européennes
  prometteuses, favorisant leur ancrage en Europe. Parmi les différentes technologies
  critiques, l’IA et la puissance de calcul sont fondamentales pour l’avenir de l’Europe
  . Ces technologies critiques détermineront de façon croissante notre prospérité,
  notre sécurité et notre autonomie stratégique. L’Europe doit rester incontournable
  dans le domaine de l’IA et des technologies de calcul. Ces technologies sont de
  plus en plus interdépendantes : l’IA (de frontière) stimule la demande en puissance
  de calcul ; la puissance de calcul dépend des semi-conducteurs (avancés et efficaces) ;
  les semi-conducteurs dépendent des minerais, matériaux et équipements critiques ;
  et la photonique et les technologies quantiques sous-tendent l’avenir de la puissance
  de calcul et permettent des avancées décisives dans de nombreuses technologies critiques.
  L’UE dispose déjà d’un avantage mondial dans la production de machines de lithographie
  et d’une position forte dans le domaine de l’IA embarquée. En mettant à profit ses
  propres atouts, l’Europe doit mener un programme ambitieux de leadership technologique
  et de souveraineté à l’ère de l’IA. À cette fin, nous soutenons la nouvelle orientation
  de la Commission européenne visant à mieux connecter l’offre et la demande européennes
  . Le paquet « Souveraineté technologique de l’UE », qui comprend le réglement sur
  les puces 2.0 (Chips Act 2.0) et le réglement sur le développement du cloud et de
  l’IA (Cloud and AI Development Act), fournit un cadre et un point de départ importants
  pour atteindre ces objectifs. En ce sens, nous soutenons l’introduction de critères
  de contenu européen, ciblés et proportionnés, dans les marchés publics et les aides
  publiques destinées au secteur numérique et aux infrastructures numériques. Nous
  appelons également de nos vœux un cadre européen ambitieux et protecteur pour la
  souveraineté du cloud, qui garantisse un niveau de protection élevé des données
  sensibles, en particulier contre les risques découlant de législations extraterritoriales,
  dans le Paquet « Souveraineté technologique » et la révision de la loi sur la cybersécurité
  (Cybersecurity Act). De manière plus générale, l’Europe doit développer des capacités
  essentielles dans les technologies numériques de pointe, dans des domaines où la
  demande est forte et où il existe un besoin de capacités souveraines, tels que l’IA,
  la défense et l’espace, l’énergie et l’électrification, les véhicules connectés/automatisés
  et les télécommunications . Le paquet « Souveraineté technologique » devrait donc
  associer une politique d’approvisionnement davantage fondée sur les risques à des
  instruments qui créent une demande européenne prévisible et récompensent la création
  de valeur au sein du marché unique. La France et les Pays-Bas souhaitent renforcer
  l’action européenne ciblée sur le développement et l’accès aux modèles d’IA de frontière
  et se réjouissent de poursuivre les discussions à ce sujet lors du prochain Conseil
  européen consacré à l’IA et avec l''Envoyé spécial de l''UE pour l''IA industrielle.
  En ce qui concerne l’avenir du calcul, l’Europe doit consolider son leadership technologique
  dans les technologies quantiques et la photonique . Nous appelons à ce que la future
  loi sur le quantique (Quantum Act) garantisse ce leadership européen en soutenant
  une approche européenne coordonnée des activités quantiques. Pour cela, il est essentiel
  de s’assurer que nous construisions des écosystèmes quantiques et photoniques complémentaires
  entre Etats membres de l’Union européenne, qui, ensemble, formeront une filière
  quantique européenne intégrée. Les marchés publics doivent constituer un levier
  important du développement de l’écosystème quantique européen. Il sera essentiel
  de garantir une chaîne de valeur européenne du quantique qui ne soit pas soumise
  à des lois et réglementations extraterritoriales non-européennes. Les pouvoirs publics
  et l’industrie doivent agir de concert . En capitalisant sur une recherche publique
  et privée solide, l’industrie jouera un rôle moteur dans l’identification de projets
  stratégiques concrets et d’opportunités d’investissement, tandis que les gouvernements
  et la Commission européenne contribueront à lever les obstacles et à créer les conditions
  propices à une mise en œuvre rapide et à l’échelle, tout en récompensant la création
  de valeur au sein de l’UE. Nous nous concentrerons sur des résultats concrets :
  des projets rentables, des engagements d’investissement et des liens plus solides
  entre l’offre et la demande européennes. En outre, l’encouragement des transferts
  de technologies doit faire partie de nos options politiques. L’Europe comblera ce
  fossé en renforçant sa résilience face aux chocs et crises futurs. La coopération
  public-privé entre les pays volontaires sera essentielle. La France et les Pays-Bas
  travailleront ensemble pour y parvenir en Europe . Les discussions qui se sont tenues
  ce jour constituent une nouvelle étape vers un effort européen plus large. La France
  et les Pays-Bas coopèrent déjà avec succès dans le cadre du pacte franco-néerlandais
  pour l’innovation, mis en place il y a trois ans. Nos deux pays souhaitent vivement
  intensifier leurs efforts pour porter cette ambition au niveau européen, avec la
  Commission européenne, d’autres États membres et les principales entreprises technologiques
  européennes de la Coalition des Créateurs européens de la Tech (European Tech Creators
  Coalition), afin de renforcer la position de l’Europe dans les chaînes de valeur
  technologiques critiques et de combler le fossé entre l’excellence technologique
  européenne et la production à l’échelle industrielle.'
