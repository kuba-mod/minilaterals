type: press_release
source_name: elysee
title: 'Allocutions à Metz : Aux racines de l''Europe pour la paix et l''unité.'
text: 'Le Président de la République s''est rendu à Metz, le lundi 28 septembre 2026,
  dans le cadre du voyage apostolique de Sa Sainteté le Pape Léon XIV en France. À
  cette occasion, le chef de l’État a participé à la rencontre « Aux racines de l’Europe
  pour la paix et l’unité », au centre des congrès de Metz, en présence du Saint-Père
  et de chefs d’État et de gouvernement européens. 28 septembre 2026 - Seul le prononcé
  fait foi Très Saint-Père, Messeigneurs, Mesdames, Messieurs, en vos grades et qualités.
  Très Saint-Père, soyez le bienvenu à Metz. Conclure votre visite apostolique en
  France, ici, en Lorraine, deux sur trois pour y évoquer notre Europe, est riche
  en symboles. A Metz, Berceau des Carolingiens et l''un des trois Évêchés, à Metz,
  ville authentiquement européenne par sa géographie et sa mémoire, à Metz, sur cette
  terre de Lorraine, meurtrie par l''Histoire, disputée, conquise et reconquise, où
  s''est bâtie la réconciliation franco-allemande, devenue la pierre d''angle de la
  construction européenne. Un des grands architectes de cette Concorde et de cette
  renaissance, Robert Schuman, repose à quelques kilomètres d''ici, à Scy-Chazelles.
  Né à Luxembourg, formé au droit en Allemagne, député de la Moselle, il fut déclaré
  vénérable par l''Église. Sa foi éclairait son action, comme nombre de bâtisseurs
  de notre Europe, de Adenauer à De Gasperi. En mai 1950, il proposa une méthode,
  faire du charbon et de l''acier, hier instrument de guerre, le bien commun de six
  nations fondatrices, créant ainsi cette solidarité de fait entre nos nations qu''il
  appelait de ses vœux. À sa suite viendront le général de Gaulle et Konrad Adenauer,
  visages de la réconciliation franco-allemande à la Messe de Reims, qui scelleront
  l''amitié entre nos peuples par le traité de l''Élysée de 1963. Mais ne déduisons
  pas de cette histoire magnifique que la construction européenne appartient aux seuls
  Français et Allemands. Pierre après pierre, elle fut aussi bâtie par la volonté
  des peuples sortis des dictatures, puis avec ceux qui, après la chute du rideau
  de fer, permirent à l''Europe de retrouver son unité. D''autres veulent encore aujourd''hui
  nous rejoindre, des Balkans jusqu''à l''Ukraine, et il n''est sans doute pas de
  plus beau plébiscite pour notre Union européenne que cette volonté d''appartenir
  à un même espace de paix, de sécurité, de démocratie et de prospérité. Mais notre
  Europe vient de plus loin et est avant tout une civilisation, certes une géographie
  dont les confins de la Baltique à la Méditerranée et de l''océan au Caucase ont
  toujours été questionnés. Elle est surtout le palimpseste de la Grèce antique, de
  Rome, de la chrétienté, des empires successifs et de siècles de guerre. Oui, cette
  Europe de nos villes et de nos villages, des écoles et des universités, de nos cafés
  et de nos places publiques s''est construite sur un socle gréco-romain et judéo-chrétien.
  Notre héritage européen, de ses fondations à notre temps, à travers la Renaissance,
  le Grand siècle et nos Lumières, de Montaigne, à Erasme, à La Fontaine ou Voltaire,
  a cristallisé le primat de la personne, puis de l''individu libre et rationnel,
  inséparable de la dignité humaine. La liberté, l''esprit critique, l''attachement
  à la science, la démocratie libérale, l''égalité entre les femmes et les hommes,
  inséparable de l''égalité et de la fraternité. Le capitalisme et le libre commerce,
  inséparable de l''État-providence et de la démocratie sociale. Elle a traversé les
  nationalismes et les totalitarismes du XXème siècle jusqu''à l''effondrement moral
  de l''Holocauste pour consolider son attachement aux droits de l''homme, au respect
  des droits des personnes et de toutes les minorités. Alors oui, notre Europe est
  enracinée dans cet héritage. Elle s''est consolidée à travers ses épreuves jusqu''à
  la construction européenne. Celle-ci s''est appuyée sur un autre principe cher à
  la tradition de l''Église, le principe de subsidiarité. Un principe de liberté qui
  protège la capacité d''agir du plus petit et oblige le plus grand à respecter son
  autonomie et à lui apporter soutien lorsque ses forces ne suffisent plus. Un principe
  qui dit ce qu''est notre Europe. Non pas une puissance qui efface les nations, mais
  une force qui prolonge et augmente leur capacité d''agir et de maîtriser leur destin.
  Oui, là où l''Europe, durant deux millénaires, avait rêvé l''unité par les empires
  et les guerres civiles, l''Union européenne est une invention inédite fondée sur
  le respect, la paix, l''égalité entre ses États membres. Plus que jamais, cela est
  essentiel. 75 ans après la déclaration Schuman, le monde a changé, la guerre est
  revenue sur notre continent et notre Europe est bousculée par le retour des empires.
  Schuman l''avait écrit, la paix mondiale ne saurait être sauvegardée sans des efforts
  créateurs à la mesure des dangers qui la menacent. Alors que les dangers ont changé
  d''ampleur, nos efforts pour la paix doivent être à la hauteur des enjeux. Pour
  assurer une souveraineté réelle, il nous faut donc agir. Agir d''abord pour assurer
  notre sécurité et préserver nos valeurs, car la paix ne se décrète pas, elle se
  construit patiemment par des artisans de bonne volonté, lucides et constants. C''est
  précisément le sens de notre engagement indéfectible aux côtés de l''Ukraine, face
  à l''agression militaire de la Russie et aux côtés du droit international, en bâtissant
  une Europe de la défense et de la paix. Agir aussi pour se projeter pleinement dans
  la prochaine décennie en répondant aux défis de compétitivité, impératifs pour rester
  dans la course et maîtriser souverainement nos technologies et nos données, produire,
  innover et investir en Europe pour rester libre, défendre nos intérêts et préserver
  notre modèle social, parce qu''en Europe, croissance économique et justice sociale
  sont indissociables. Agir pour le climat et bâtir en responsabilité l''avenir que
  nos enfants méritent et dont la neutralité carbone au milieu de ce siècle est le
  juste cap. Agir pour nous protéger contre l''épidémie de désinformation et d''ingérence
  qui veulent saper nos démocraties et nous diviser, porter atteinte aux projets européens.
  La vérité vous rendra libres, nous rappelle Jean. La vérité, très Saint-Père, vous
  l''avez rappelée dans votre encyclique Magnifica Humanitas, est un bien commun.
  Le mensonge, lui, change l''adversaire en ennemi, le débat en procès, le doute en
  trahison et l''algorithme en amplificateur d''émotions négatives. Les écrans nous
  habituent à vivre côte à côte, certes, mais reclus. Une démocratie ne s''éteint
  pas seulement sous les obus, elle s''éteint quand le dialogue cesse, quand les existences
  se délient, quand la solitude s''installe et qu''on ne s''entend plus. Dès 1947,
  dans la France contre les robots, Georges Bernanos, que vous évoquiez vendredi à
  l''Elysée, mettait en garde contre la tentation de soumettre l''homme aux instruments
  qu''il crée lui-même, au risque que le progrès technique ne devienne une dépossession
  humaine. Aujourd''hui, l''Europe, la première, a souhaité y répondre en se dotant
  d''un cadre de régulation. L''innovation doit servir la dignité humaine, non la
  puissance de quelques-uns. C''est également le sens de la gouvernance mondiale que
  nous appelons de nos vœux, une technologie qui doit rester un serviteur de l''homme,
  jamais son maître. Je pense enfin à notre jeunesse, son attention, sa liberté, son
  jugement doivent être protégés des poisons de l''addiction et de la prédation. Les
  Évangiles nous rappellent l''attention due aux plus fragiles d''entre nous. Il en
  va de notre responsabilité collective. C''est pourquoi la France porte ce combat
  de la majorité numérique en Europe. Agir, oui. Ici, à Metz, nous sommes heureux
  de vous recevoir, très Saint-Père, pour vous entendre, pour apprendre de vous. Car
  ici bat le cœur millénaire de l''Europe, une Europe qui protège, unit et agit. Une
  Europe souveraine et démocratique, habitée par ce projet de paix et de prospérité.
  Une Europe qui doit retrouver le courage de ses fondateurs, oui, le courage, pour
  devenir la puissance de paix, d''indépendance et de démocratie qu''elle a à être.
  Le courage pour ne pas céder au repli, à la haine de l''autre, au retour des nationalismes
  qui divisent. Très Saint-Père, permettez-moi d''achever mes propos puisque c''est
  la dernière fois que j''ai l''occasion de m''exprimer publiquement devant vous,
  en vous réexprimant notre gratitude et notre joie. Quatre jours en France. Vous
  avez senti, je l''espère, une nation fervente, unie et heureuse. Je vous en remercie
  infiniment. Et nous avons voulu vous voir heureux aussi. Une formule ashkénaze de
  la fin du XVIIIe siècle, ensuite reprise par nos amis allemands, pour signifier
  le bonheur tranquille, dit : heureux comme Dieu en France. Alors nous dirons désormais,
  en mémoire de ces quatre jours, heureux comme Léon XIV chez nous. Alors merci pour
  cela. 28 septembre 2026 - Seul le prononcé fait foi Très Saint-Père, Messeigneurs,
