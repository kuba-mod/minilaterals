date: '2026-09-07'
type: press_release
source_name: elysee
title: Sommet Lumière à Saint-Paul-de-Vence.
text: 'Le Président de la République et le Président de la République de Corée, LEE
  Jae-Myung, ont coprésidé le Sommet Lumière, le lundi 7 septembre 2026 à Saint-Paul
  de Vence. Premier sommet international consacré à l’avenir du cinéma et de l’image
  animée, cet événement a réuni plus de 200 invités de haut niveau en provenance de
  plus de 65 pays des cinq continents , parmi lesquels les principaux dirigeants et
  décideurs internationaux des secteurs du cinéma, de l’audiovisuel et du jeu vidéo,
  ainsi que des personnalités politiques et des talents portant les engagements du
  Sommet. Ensemble, ils ont échangé sur les défis et les opportunités pour l’avenir
  du cinéma et de l’image animée , et se sont engagés sur des actions concrètes pour
  le secteur , s’agissant notamment des impacts de l’intelligence artificielle, de
  l’éducation aux images dès le plus jeune âge, ou encore de son modèle économique.
  Le Sommet Lumière offre ainsi une plateforme stratégique pour forger de nouvelles
  alliances pour le cinéma et l’image animée. Il est aussi l’occasion d’illustrer
  en actes l’ attractivité toujours renouvelée de la France dans les domaines du cinéma,
  des séries, de l’animation et du jeu vidéo, au bénéfice des Français et de nos territoires,
  et de valoriser les atouts, aussi bien industriels que culturels, que la France
  a à offrir pour bâtir l’avenir du cinéma et de l’image animée. 7 septembre 2026
  - Seul le prononcé fait foi Monsieur le président de la République de Corée, Madame
  la vice-présidente de la Commission européenne, Mesdames, Messieurs les ministres,
  Mesdames, Messieurs les ambassadrices, ambassadeurs, Monsieur le préfet, Mesdames,
  Messieurs les parlementaires, Monsieur le maire, Mesdames, Messieurs les élus, Mesdames,
  Messieurs les directrices, Monsieur le président du Centre national du cinéma et
  de l''image animée, Mesdames et Messieurs les acteurs du monde de la culture et
  du cinéma, Mesdames et Messieurs en vos grades et qualités, c''est un très grand
  honneur de vous accueillir ici, toutes et tous, pour ce moment important, comme
  vous venez de le dire à l''instant. Il y a un peu plus de 130 ans, les frères Lumière
  faisaient jaillir sur un écran les premières images animées. Flot de récits, d''émotions
  qui allaient gagner le monde entier. Et plus qu''une invention technique, c''était
  une nouvelle manière de voir, de représenter le monde, de le raconter qui commençait.
  Et de cette petite salle parisienne où s''émerveillèrent quelques dizaines de spectateurs
  en 1895 jusqu''à ce sommet qui nous réunit aujourd''hui à la Fondation Maeght, les
  images animées n''ont cessé de peupler les vies, nos vies, nos imaginaires, tout
  en changeant de forme, de support, d''échelle. Elles ont connu énormément de bouleversements
  et elles connaissent sans doute les bouleversements les plus importants aujourd''hui.
  Et c''est le sens de notre présence ici, prendre la mesure de ce qui est en train
  de se passer pour y apporter une réponse collective et mondiale. Je veux avant toute
  chose remercier Monsieur le président, cher Lee Jae Myung, d''avoir accepté de coprésider
  ce sommet. Nous l''avons évoqué il y a quelques mois, vous n''avez pas hésité une
  seconde. Et si nos histoires et nos langues diffèrent, nos deux pays partagent tout
  de même beaucoup, à commencer par un certain art de l''image animée enraciné dans
  la culture propre de nos pays et capable, par cette singularité, de toucher les
  cœurs du monde entier. Et donc merci pour cela. Et en effet, comme nos créations
  françaises, le cinéma et les séries coréennes rayonnent par-delà les frontières.
  Et de « Parasite » à « Squid Game », en passant par « Dernier train pour Busan »
  et tant d''autres, nous savons en France combien vous avez cette capacité à nous
  émerveiller. J''en veux pour preuve le fait que le Festival de Cannes ait d''ailleurs
  confié cette année la présidence du jury à Park Chan-wook, l''un des grands maîtres
  du cinéma coréen. Nous avons avec nous, vous l''avez dit, une soixantaine de nations,
  d''organisations régionales, d''organisations internationales qui se sont mobilisées
  et qui participent de l''initiative d''aujourd''hui. Et ce qui montre que depuis
  l''Europe comme depuis l''Asie, ce qui nous importe, c''est que nos œuvres montrent
  qu''une culture peut devenir mondiale tout en restant fidèle à elle-même. Ce qui
  ne revient pas à dominer ou uniformiser, mais plutôt à participer à un foisonnement
  créatif international, à un élan auquel chaque pays, chaque acteur peut aujourd''hui
  prendre part. Je veux aussi remercier ceux qui, à nos côtés, ont contribué à ce
  sommet. Le CNC, qui en a organisé l’organisation, le ministère de la Culture, le
  ministère de l''Europe et des Affaires étrangères, qui l''ont porté, et la Fondation
  Maeght, bien sûr, qui nous accueille aujourd''hui. Notre rendez-vous est nécessaire,
  je le crois très profondément, parce que le cinéma et les images animées, comme
  je le disais, connaissent des mutations radicales que personne ne peut ignorer.
  C''est pourquoi je suis heureux de voir ici tout le monde rassemblé, responsables
  publics, grands acteurs de l''industrie, chaînes, plateformes, producteurs indépendants,
  auteurs, talents du cinéma, de l''audiovisuel et du jeu vidéo venus du monde entier.
  Si l''invention du cinéma fut le Big Bang de ce que l''on pourrait appeler une civilisation
  des images, celle dans laquelle nous vivons depuis 130 ans, l''intelligence artificielle
  et la captation de notre attention par les réseaux sociaux annoncent quant à elles
  un véritable changement d''ère. Et je voudrais dire quelques mots de ces deux révolutions
  à la fois technologiques, d''usage, qui sont très profondes et qui viennent bousculer
  ce que nous vivons depuis 130 ans. Oui, notre ère est celle de l''accélération,
  de la propagation quasi infinie des images. Elles défilent sur nos écrans de cinéma,
  sur nos téléviseurs, sur nos consoles, sur nos smartphones. C''est une profusion
  qui n''est pas sans conséquence sur notre rapport à la culture, au savoir et à l''art.
  Il faut d''abord rappeler avec force que jamais autant d''êtres humains n''ont eu
  accès à tant d''informations, à tant de contenus, à tant d''œuvres. Jamais un jeune
  créateur n''a pu aussi facilement créer une image et la partager avec le monde entier.
  Jamais les œuvres n''ont circulé aussi vite. Alors condamner les écrans sans nuance,
  ce serait fermer les portes de cette bibliothèque d''Alexandrie à laquelle ils nous
  donnent accès. Ce serait se priver des possibles qu''ils ouvrent à nos artistes,
  à nos créateurs, à tous ceux qui inventent de nouvelles manières de raconter. Mais
  cette réalité ne doit pas nous empêcher de voir le grand paradoxe de notre temps.
  Nous n''avons jamais autant regardé les écrans et pourtant, à force de tout regarder,
  nous courons le risque de finir par ne plus rien voir. Nous cliquons, nous passons,
  nous scrollons, comme on dit maintenant, et ce que nous voyons est moins, en quelque
  sorte, conçu pour surprendre, émouvoir, faire réfléchir que pour retenir notre attention
  quelques secondes et créer une excitation permanente. Le modèle dans lequel nous
  vivons, dans lequel aujourd''hui nous sommes projetés dans ces contenus, c''est
  un modèle qui a un modèle économique, celui des plateformes, qui crée l''excitation
  et qui vient en fait capter ce qui est un trésor bien identifié, notre attention,
  l''attention de nos enfants, de nos adolescents, des adultes que nous sommes, pour
  pouvoir la monétiser. Alors, il est de plus en plus difficile aujourd''hui pour
  beaucoup dans nos sociétés de passer du temps pour lire, c''est essentiel, de passer
  du temps pour accepter de regarder pendant une heure, une heure et demie, deux heures,
  trois heures, une série, un film, une création. Et le risque, c''est que ce flux
  permanent finisse par digérer les œuvres. Mais ce flux n''apporte rien, il capte
  simplement notre attention. Et cette révolution est à l''œuvre depuis plusieurs
  années et elle bouscule à la fois la création, la capacité à se confronter à un
  public, à le faire réfléchir, et évidemment aussi l''industrie qu''il y a derrière.
  Notre attention est devenue une ressource économique disputée de toutes parts et
  les conséquences, nous les connaissons. Elles sont pour les enfants : leur sommeil,
  leur capacité à apprendre, à se forger, il faut les en protéger, mais aussi notre
  rapport aux autres, le rapport à soi. Et donc c''est en quelque sorte une crise
  tout à la fois de la création, du rapport à l''image animée au cinéma, mais également
  une crise démocratique qui se joue derrière. L''autre implication, moins souvent
  évoquée et pourtant décisive, c''est que cette économie de l''attention est en passe
  de transformer la nature de ce que nous regardons. Dans un monde où chaque image
  dispute aux autres quelques secondes de notre temps, la tentation devient très grande
  de ne produire que ce qui frappe, que ce qui capte immédiatement, au détriment de
  la nuance, de l''exigence. Or, les images conçues pour obtenir un clic n''ont ni
  la même force, ni la même valeur que celles conçues pour laisser une trace. Alors,
  chers réalisateurs, auteurs, producteurs, que vos œuvres soient destinées aux salles,
  aux plateformes, aux consoles, vous le savez bien, créer exige la réflexion, suscite
  des émotions, impose une attention, et une intention et du temps. Et tout cela compte.
  C''est aussi cela dont nous devons parler aujourd''hui et dont nous devons reprendre
  en quelque sorte le contrôle, la maîtrise pour que ce soit une transformation technologique,
  ces plateformes, ces usages, qui aident à diffuser, mais pas quelque chose qui change
  la nature des créations et des possibles que vous proposez. L''intelligence artificielle
  est l''autre grande révolution technologique. J''en parlerai longuement aujourd''hui.
  Je ne veux pas être trop long, mais là aussi, c''est une transformation formidable
  qui peut réduire les coûts, donner la capacité à produire une œuvre si elle est
  au service de celle-ci et de la création. Mais si elle devient un instrument qui
  se substitue ou prétendrait se substituer aux auteurs, aux créateurs, aux doubleurs,
  quand on parle de la voix, alors nous ferions une erreur formidable, parce qu''on
  laisserait croire que la capacité de calcul peut devenir une capacité à créer. Elle
  peut mimer ce qu''est une création, mais elle ne pourra jamais transformer la singularité
  absolue de ce qu''est la création humaine. Elle en a les apparences, elle peut même
  mimer nos émotions, elle développe des langages, mais elle ne fait que singer en
  quelque sorte l''émotion qui est la nôtre. Et notre capacité à humaniser, donc à
  mettre au service de la création qui est la nôtre collectivement, cette intelligence
  artificielle est un autre des défis du temps. Alors pour notre culture et notre
  histoire, parce que nos œuvres capturent quelque chose de notre époque aussi, de
  ce que nous sommes, pour notre économie aussi, parce que derrière chaque œuvre,
  il y a des créateurs, des techniciens, des entreprises, des emplois, une chaîne
  de valeur, nous devons reprendre le contrôle justement de ces grandes transformations
  technologiques, comme on a su le faire à chaque étape importante. Et je le dis ici
  dans un pays qui a reconnu, grâce à l''initiative de Beaumarchais il y a quelques
  siècles, à la persévérance d''un Genevois puis d''un Malraux ensuite, ce qu''on
  a appelé le droit d''auteur, qui est une création, reconnaître qu''il y a quelque
  chose d''unique dans le fait de créer, que nous avons ensuite défendu en Européens
  dans les droits voisins et les droits d''auteur européanisés, ce qui est un trésor.
  Et c''est encore plus à défendre aujourd''hui. Cela compte aussi, je le disais,
  pour nos démocraties qui ont besoin que chacun puisse se confronter à l''altérité,
  à d''autres vies, d''autres convictions, et qui ont besoin aussi de pouvoir démêler
  le vrai du faux. Alors, aujourd''hui, il ne s''agit pas de revenir au monde d''avant
  ou de tenir ces bouleversements à distance, mais d''affirmer que nous ne sommes
  pas condamnés à les subir. Et cette civilisation des images, nous l''avons construite,
  c''est à nous de décider ce que nous voulons en faire et comment, au fond, la réinventer
  en réussissant à domestiquer ces transformations. Parce qu''aucun studio, aucune
  plateforme, aucun artiste, aucun réseau de salles de cinéma, pas même un pays, aussi
  puissant soit-il, ne peut répondre à ce défi tout seul. Les technologies, les capitaux,
  les images ne connaissent plus de frontières, c''est pourquoi ce défi est mondial.
  Et c''est ce qui impose ce que nous sommes en train de faire aujourd''hui, qui est
  au fond l''invention d''un multilatéralisme de l''image qui soutient la créativité,
  qui se bat pour un monde dans lequel un auteur peut encore consacrer des années
  à une idée incertaine, un producteur miser sur un réalisateur inconnu, un studio
  de jeux inventer un nouvel univers plutôt que reproduire indéfiniment ce qui a déjà
  marché. C''est ça, ce que nous défendons. C''est ça, ce qui fait que nous sommes
  là. C''est ça, ce qui a animé les artistes qui vous entourent aujourd''hui quand
  on parle de peinture et ce qui fait le travail, l''œuvre, la vie de beaucoup d''entre
  vous et qui a créé tant d''émotions à travers nos pays. Ça implique d''investir
  dans la création, de rémunérer justement les créateurs, de protéger la propriété
  intellectuelle, de lutter contre le piratage, de penser la révolution de l''intelligence
  artificielle et les enjeux de découvrabilité, pour parler, inspiré par nos amis
  québécois, qu''elle pose. C''est aussi assurer la transparence des contenus produits
  avec l''intelligence artificielle pour ne pas la confondre avec les productions
  humaines. Et dans une époque où l''offre devient infinie, financer une œuvre ne
  suffit plus, la produire ne suffit plus, même la distribuer ne suffit plus. Encore
  faut-il la trouver et que l''intelligence artificielle agentique la suggère, la
  mette en avant, y compris lorsqu''on ne la cherche pas. Et donc on a également ce
  défi qui est sur la table. Et ces mutations ont une vitesse telle que ce sommet
  ne peut se permettre d''en rester aux principes ou aux grandes déclarations d''intention.
  Aujourd''hui, nous lançons des initiatives concrètes. Alors je ne vais pas ici lister
  tout ce qui sortira de ce sommet. Il y a plusieurs déclarations, plusieurs grands
  chantiers, je voudrais insister sur 4 d''entre eux. La première concerne notre patrimoine.
  Une part considérable de la mémoire audiovisuelle mondiale est aujourd''hui menacée
  et c''est un peu un paradoxe. Avec cette transformation, les pellicules se dégradent,
  les archives disparaissent, de nombreux pays n''ont pas les moyens de les préserver.
  On estime que seulement 20 % du patrimoine cinématographique mondial serait sauvegardé.
  Et avec ALIPH et nos partenaires, nous engageons donc un effort international pour
  sauvegarder ce patrimoine, les films mais aussi les archives audiovisuelles, partout
  où il est en danger. C''est un geste essentiel pour que cette histoire soit sauvée,
  qui est aussi celle de la diversité et de la créativité de nos pays et de nos artistes.
  La deuxième initiative, c''est l''éducation à l''image. En effet, nous voulons protéger
  nos enfants des écrans trop précoces, les protéger aussi des réseaux sociaux, et
  nous pensons que c''est indispensable, mais ça ne suffit pas. Ce que nous devons
  faire dans le même temps, c''est leur apprendre à mieux regarder, comprendre comment
  une image est fabriquée, distinguer le réel et sa manipulation, sortir aussi des
  seules recommandations algorithmiques, apprendre à nos enfants à créer eux-mêmes.
  Cette éducation à l''image est fondamentale aussi avec l''UNESCO et nos partenaires.
  Nous voulons faire de cette éducation une ambition universelle, bâtir des programmes
  adaptés à tous les âges et déclinables dans tous les pays. Ce partenariat mondial
  à l''éducation aux images, la Corée, le Nigeria et la France en prennent l''initiative
  en rassemblant tous les pays qui sont prêts à le rejoindre et les organisations.
  Parce que de même qu''on apprend à lire par la fréquentation des livres, le regard
  se forme au contact de films, de séries, d''œuvres audiovisuelles de qualité. La
  troisième initiative concerne les salles indépendantes. En effet, nous avons dans
  nos pays, je pense à ce que la Corée et la France ont fait en particulier, beaucoup
  défendu la création indépendante. Nous tenons à nos modèles, ils sont essentiels.
  Ils s''inscrivent dans une histoire longue. Ils ne sont jamais à négliger et ils
  peuvent toujours être menacés. J''entends les voix qui s''élèvent, mais nous avons
  su protéger cette création indépendante et c''est un trésor. Mais l''indépendance,
  la diversité de ces créations passent aussi par la capacité à avoir un réseau de
  salles indépendantes, une pluralité de distribution. La diversité des œuvres ne
  vaut que si elle peut rencontrer un public. Aussi, nous montons sur pied ce que
  nous avons appelé IRIS, International Resilience Initiative for Independent Screens.
  C''est au fond une nouvelle organisation internationale qui va rassembler l''ensemble
  des salles de cinéma indépendantes et préserver la diversité de ce modèle et même
  l''encourager. Projet international soutenu par des talents des quatre coins du
  monde, quatorze lauréats de la Palme d''or, seize Oscars et beaucoup de partenaires.
  Le modèle des salles indépendantes, essentiel au rayonnement des films, au pluralisme
  cinématographique, est en effet aujourd''hui menacé. Il nous appartient de le préserver
  et de lui permettre de se développer. Enfin, la quatrième initiative, sans être
  exhaustive, que je veux ici citer est celle qui est dédiée aux jeux vidéo. Il est
  devenu en effet l''une des grandes formes créatives de notre temps, au croisement
  de l''image, de l''écriture, de la musique, du design, de la technologie. Je considère
  très profondément que le jeu vidéo fait partie de notre culture et doit faire partie
  d''ailleurs de l''exception culturelle française, comme nous avons su le faire pour
  le cinéma et toutes les créations. Alors nous créerons un Festival international
  du jeu vidéo pensé dès l''origine comme un grand rendez-vous mondial de la création,
  de l''innovation, des joueurs et de l''industrie. Les grands succès mondiaux français
  de jeux vidéo rappellent cette fécondité de cette création, de cette créativité,
  ce qui est aussi une industrie. Il nous faut davantage le mettre à l''honneur et
  réussir à emporter justement l''adhésion de tous. Voilà ce que je souhaitais vous
  présenter, quatre initiatives qui sont un point de départ, un motif d''espérance,
  qui rappellent ce que nous sommes capables de bâtir ensemble, non plus dans un dialogue
  entre quelques pays, mais à l''échelle des cinq continents. Je veux à cet égard
  saluer l''engagement de la Corée, qui entend prendre toute sa part dans ce multilatéralisme
  et nous permet d''investir conjointement. Nous allons chacun investir, en effet,
  et nous mettons ensemble un milliard d''euros sur cinq ans pour la création de ce
  qu''on a appelé le Partenariat Lumière, initiative dédiée au soutien de la filière
  de l''image et de la souveraineté culturelle qui, et je lance ici un appel, doit
  permettre à d''autres alliances et soutiens matériels de se nouer. Mais ce milliard
  d''euros sur les cinq années qui viennent que la Corée et la France mettent ensemble
  pour ce Partenariat Lumière, c''est la création d''un mouvement pour soutenir justement
  cette filière de l''image et de la souveraineté culturelle essentielle. Je veux
  aussi remercier la Corée pour son soutien aux différents dispositifs que je viens
  d''évoquer et que nous créons ensemble aujourd''hui, qu''il s''agisse d''IRIS ou
  de l''éducation aux images. Maintenant, si vous me le permettez, pour conclure,
  j''aimerais adresser quelques mots à mes compatriotes qui sont nombreux à avoir
  répondu présents aujourd''hui. Je les en remercie. La France est une grande puissance
  de l''image. C''est aussi pourquoi nous avons voulu inventer et accueillir ce premier
  sommet international consacré à l''avenir du cinéma et des images animées. Le cinéma
  fait partie de notre culture. Nous tenons à cette diversité, à ce pluralisme. Nous
  tenons à ce modèle singulier que nous avons su inventer, où les grands succès internationaux
  ou français servent à financer le cinéma d''auteur et la création indépendante.
  Et nous tenons aussi au modèle de salles indépendantes que nous avons. Et nous sommes
  fiers d''avoir cette créativité, cette diversité de créativité, et en même temps,
  cette capacité aussi de nous projeter à travers le monde. Nous sommes un pays qui
  sait accueillir la grande création coréenne, américaine, africaine, et qui prétend
  aussi s''exporter et rayonner. Notre histoire est celle d''un berceau du cinéma
  qui ne s''est pas arrêté aux frères Lumière ou à Méliès. Nous avons depuis sans
  relâche réussi à créer un modèle unique de protection des créateurs, des auteurs,
  de leur propriété intellectuelle de créer un financement de la diversité qui est
  un trésor qu''il faut absolument préserver, d''inventer cette exception culturelle
  française, devenue européenne, je l''évoquais, et je remercie infiniment Costa-Gavras
  qui, pendant tant d''années, a présidé notre Cinémathèque française et s''est beaucoup
  battu sur cela. Et nous allons continuer ce combat. Il est, au fond, plus essentiel
  que jamais. Ces engagements historiques nous permettent justement de continuer à
  créer, inventer. Ils ne sont pas devenus caducs. Ils sont plus nécessaires encore
  aujourd''hui qu''hier. Et dans le même temps, nous avons su créer une vraie diversité
  des films documentaires, de l''animation, du cinéma d''auteur, et en même temps,
  des producteurs indépendants et des grandes maisons de production devenues européennes
  et mondiales. Nous avons réussi à produire Bureau des légendes, 10 %, HPI ou The
  Artist . Notre puissance culturelle est ainsi devenue une puissance économique.
  Le cinéma, l''audiovisuel, le jeu vidéo représentent 30 milliards d''euros de chiffre
  d''affaires en France. Des tournages qui, à eux seuls, injectent près de 3 milliards
  d''euros chaque année dans notre économie parce qu''ils font travailler l''hôtellerie,
  la restauration, les artisans, les entreprises, des territoires. Emily in Paris
  et ses tournages en sont le parfait exemple. C''est aussi pour ça qu''il y a maintenant
  10 ans, nous avons stabilisé un crédit d''impôt international qu''il faut lui aussi
  préserver parce qu''il permet d''attirer ces tournages et qui est important. Et
  c''est pour ça aussi que ces dernières années, avec France 2030 et la Grande Fabrique
  de l''image, nous avons profondément renforcé nos capacités de production en France
  avec de nouveaux studios, de nouveaux plateaux, de nouvelles écoles, tant et si
  bien que nous sommes l''un des grands pays où le monde vient fabriquer ses images,
  ce qui fait aussi notre fierté. Je le dis ici parce qu''au fond, on a trop souvent
  tendance à opposer ces mondes et c''est une erreur. Le cinéma, l''image animée,
  c''est tout à la fois la création, la singularité, la créativité, cette diversité
  et aussi une économie importante et une capacité à produire, à créer de la richesse
  dans notre pays et à l''exporter. Et nous avons besoin de réconcilier tous ces univers,
  celui des grands studios qui font notre fierté et qui ont su produire à travers
  le monde, parfois, consolider cette industrie en France, en Europe, aux États-Unis,
  et des créateurs très indépendants. Cet « en même temps » auquel je crois, c''est
  aussi la force du modèle français, de savoir être compétitif à l''international,
  mais de préserver la diversité de son écosystème. Et c''est ce que nous cherchons
  à faire, au fond, à travers ce sommet. Je remercie Monsieur le président de la Corée,
  cher président, merci infiniment d''être là et je vous remercie toutes et tous pour
  les travaux, les partenariats qui seront noués aujourd''hui. Je veux vous dire en
  tout cas ma conviction que ce qui se joue dans vos travaux, dans les déclarations
  d''aujourd''hui, mais surtout les actions qui en découleront, c''est tout à la fois
  notre conviction que la culture est au cœur de la civilisation qui est la nôtre.
  Cette civilisation de l''image que j''évoquais, c''est au fond nos capacités dans
  nos pays, de la Corée à la Mauritanie en passant par la France, à raconter des histoires
