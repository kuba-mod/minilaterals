  nos pays, de la Corée à la Mauritanie en passant par la France, à raconter des histoires
  et à dire ce que nous sommes. Tous nos pays confrontés à une modernité qui galope
  s''interrogent sur leur identité. Nos identités, ce sont des récits, des récits
  passés, ceux que nous sommes prêts à écrire. C''est ça, ce qui nous unit. Et c''est
  notre capacité à écrire des histoires qui disent ce que nous sommes profondément
  et à faire vibrer d''autres qui viennent d''horizons totalement différents à ces
  histoires. C''est ce qui permet à notre identité d''avoir des traditions qui perdurent
  et d''embrasser une modernité sans angoisse. C''est à cet égard que le cinéma, les
  images animées jouent un rôle essentiel. Et c''est pour ça que nous défendons ici
  la culture, nous défendons ici une économie culturelle, mais nous défendons aussi
  ce qui tient nos démocraties ensemble. Comprendre l''autre, comprendre qui nous
  sommes et d''où nous venons, et réussir à nouer ce dialogue respectueux qui nous
  permet de mesurer que nous pouvons partager des émotions avec un créateur à l''autre
  bout du monde. Ça suppose de reconquérir l''attention, de remettre l''œuvre avant
  le flux et de protéger celles et ceux qui créent, inventent et prennent ce risque
  infini, vous qui êtes là aujourd''hui, d''être des artistes, de créer une œuvre
  d''art et d''être ce faisant essentiels à nos démocraties. Sommet Lumière pour un
  nouveau multilatéralisme du cinéma et de l’image animée. Déclaration Lumière sur
  l''avenir du cinéma et de l''image animée. Les engagements du Sommet Lumière : forger
  de nouvelles alliances pour le cinéma et l''image animée.'
