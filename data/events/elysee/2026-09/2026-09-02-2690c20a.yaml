title: Déplacement au Royaume des Pays-Bas.
text: Le Président Emmanuel Macron s'est rendu à Eindhoven, aux Pays-Bas, ce mercredi
  2 septembre 2026. Ce déplacement était l’occasion pour le chef de l’État et le Premier
  ministre du Royaume des Pays-Bas, Rob Jetten, d’échanger sur le renforcement de
  la relation entre la France et les Pays-Bas et sur leurs priorités communes pour
  renforcer la souveraineté européenne , dans un contexte international marqué par
  d’importants déséquilibres et de profondes transformations économiques et technologiques.
  Le Président de la République s'est rendu notamment avec une délégation d’entreprises
  françaises parmi lesquelles Mistral AI au siège d’ASML , acteur majeur de l’industrie
  européenne des semi-conducteurs. Il a échangé avec des dirigeants d’entreprises
  technologiques européennes (notamment les entreprises de l’initiative Tech Creators
  ) sur les conditions permettant de soutenir l’innovation, de consolider les capacités
  industrielles européennes, de mettre en place une préférence européenne dans les
  domaines technologiques et de réduire les dépendances dans les technologies critiques,
  afin de renforcer l’autonomie stratégique de l’Europe.
