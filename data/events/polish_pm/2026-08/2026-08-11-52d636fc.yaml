title: 'Premier: Gorącym żelazem wypalimy każdy przypadek nieuczciwego rozdysponowania
  pieniędzy dla powodzian'
text: Premier Donald Tusk odniósł się do możliwych nieprawidłowości przy przyznawaniu
  pomocy finansowej na usuwanie skutków powodzi z września 2024 r. z Karkonoskiej
  Agencji Rozwoju Regionalnego (KARR). Istnieje podejrzenie, że osoby odpowiedzialne
  za przyznawanie środków faworyzowały wybranych beneficjentów, w tym osoby, które
  – według dotychczasowych ustaleń – mogły nie ucierpieć w wyniku powodzi. To nie
  jest pierwsza powódź, nie pierwsza klęska żywiołowa, w czasie której musiałem nadzorować
  operację szybkiej pomocy.  Zawsze wiedzieliśmy, że w sytuacji, w której podejmiemy
  decyzję o wydaniu 8 mld złotych w ciągu 2 lat na rozmaitego typu formy pomocy powodzianom,
  firmom, samorządom przy wydawaniu dziesiątków tysięcy decyzji personalnych będziemy
  mieli do czynienia z jakimiś próbami nadużyć - powiedział Premier Donald Tusk przed
  posiedzeniem Rady Ministrów. Przyjęto zasadę, że pomoc dla osób poszkodowanych ma
  być przede wszystkim szybka i łatwo dostępna – tak, aby środki trafiały do potrzebujących
  możliwie szybko, gdy skutki powodzi są najbardziej dotkliwe. Chcieliśmy szybkiej
  i łatwej pomocy dla osób, które ucierpiały w trakcie powodzi. Wydano 62 tys. indywidualnych
  zasiłków dla powodzian, aby nie musieli czekać miesiącami na środki Szef rządu podkreślił,
  że kluczowe znaczenie ma zarówno skala ewentualnych nadużyć, jak i sprawne działanie
  państwa. Ktoś, kto miał władzę w ręku, żeby wydać publiczne pieniądze polskich podatników
  na pomoc ludziom, którzy ucierpieli, jeśli wydaje w sposób niewłaściwy, poniesie
  naprawdę bardzo surowe konsekwencje W sprawie nieprawidłowości wokół KARR od miesięcy
  działania prowadzą Centralne Biuro Antykorupcyjne i Ministerstwo Rozwoju i Technologii.
  Wczoraj z urzędu czynności w tej sprawie wszczęła również Prokuratura Regionalna
  w Jeleniej Górze. Proszę przyjąć do wiadomości, że w każdej sytuacji, w której doszło
  do nadużycia, państwo będzie działało bezwzględnie Większość osób, firm i samorządów
  otrzymała już wsparcie, a państwo będzie kontynuować zarówno wypłatę pomocy, jak
  i kontrole dotyczące prawidłowości jej przyznawania. Działania będą prowadzone przez
  właściwe ministerstwa, CBA, policję czy prokuraturę. Premier Donald Tusk ogłosił
  też, że Minister Maciej Berek przestaje pełnić funkcję Ministra ds. Nadzoru nad
  Wdrażaniem Polityki Rządu. Jego obowiązki przejmie Joanna Knapińska, szefowa Rządowego
  Centrum Legislacji. Wspólnie z Ministrem Berkiem ustaliliśmy, że przejdzie do wykonywania
  innych zadań. Jak wiecie, był moją prawą ręką, jeśli chodzi o egzekwowanie priorytetów
  rządowych. Bardzo doceniamy jego działania Dzięki pracy i koordynacji Ministra Berka
  wprowadzono dziesiątki zmian, które przełożyły się na poprawę funkcjonowania państwa
  i życia obywateli. Wśród najważniejszych działań jest deregulacja, która polega
  nie tylko na usuwaniu zbędnych przepisów i upraszczaniu procedur, ale też zmianie
  sposobu przygotowywania regulacji. Pamiętacie Państwo ten wielki ruch przedsiębiorców,
  prawników, menedżerów, którzy zdecydowali się na współpracę. A to oznaczało także
  ogrom roboty. I to na swoje barki wziął też Minister Berek. Także jeszcze raz, Panie
  Ministrze, bardzo serdecznie dziękuję Od grudnia 2023 roku Maciej Berek był Ministrem-Członkiem
  Rady Ministrów oraz Szefem Stałego Komitetu Rady Ministrów. Od lipca 2025 roku pełni
  funkcję Ministra Nadzoru nad Wdrażaniem Polityki Rządu i szefa SKRM.
