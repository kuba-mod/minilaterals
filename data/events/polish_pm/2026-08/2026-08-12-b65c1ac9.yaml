title: 'Premier w Gdyni: Polska stanie się morską potęgą'
text: 'Projekty fregat typu „Miecznik” powstawały w latach 2013–2014. Na chrzest pierwszego
  okrętu tego typu trzeba było jednak czekać ponad 10 lat. Dziś pierwsza fregata jest
  już gotowa, a wkrótce rozpoczną się prace nad kolejnymi jednostkami. To są wielkie
  inwestycje, jak statki Wicher, Burza i Huragan. W sumie program „Miecznik” to 15
  mld zł. Wszystko z udziałem polskich firm i polskich technologii. […] Dziś mówimy
  nie tylko święte słowa – niech żyje Polska, ale również: niech żyje Gdynia! – podkreślił
  szef rządu podczas uroczystego chrztu fregaty Wicher. Uroczystość chrztu pierwszej
  fregaty w ramach programu „Miecznik” odbyła się w Stoczni Wojennej w Gdyni. Matką
  chrzestną okrętu została Agata Ziemiańska, żona wiceadmirała Jarosława Ziemiańskiego,
  Inspektora Marynarki Wojennej, która nadała jednostce imię Wicher. Polski przemysł
  stoczniowy – zarówno cywilny, jak i wojskowy – jest dziś powodem do dumy. Za granicą
  z zazdrością patrzą na to, jak wygląda polska wersja fregaty – rozwiązanie nowocześniejsze
  i efektywniejsze niż zachodnie prototypy jednostek. Z wielką satysfakcją mogę ogłosić,
  że mamy polski sukces Program „Miecznik” to nie tylko znaczący skok technologiczny,
  ale przede wszystkim realne wzmocnienie bezpieczeństwa Bałtyku. Polska otworzyła
  się twarzą i sercem w kierunku morza. Będziemy morską potęgą i to w wymiarze militarnym
  Fregaty „Miecznik”, obok przyszłych okrętów podwodnych programu „Orka”, będą stanowić
  główną siłę bojową polskiej Marynarki Wojennej i ważny element odstraszania potencjalnego
  agresora. Ewentualny napastnik zastanowi się wiele razy, zanim podejmie wrogie działania,
  wiedząc jakie mamy możliwości. […] Będziemy krajem, który będzie rozstrzygał o przyszłości
  regionu i całej Europy W kwestii bezpieczeństwa Polski nie może być jednak sporów
  i kłótni politycznych. Żaden wróg nie ośmieli się pomyśleć o ataku na Polskę, jeśli
  jako naród wytrzymamy wysiłek finansowy, a jako władze polityczne pozostaniemy zjednoczeni
  wokół sprawy bezpieczeństwa Polska strategia zakłada maksymalne zacieśnienie współpracy
  militarnej i politycznej m.in. ze Szwecją, Finlandią, Norwegią oraz państwami bałtyckimi.
  Tarcza Wschód i wspólna kontrola Bałtyku przez państwa NATO to kluczowe elementy
  wzmacniania bezpieczeństwa naszego kraju. Minister Aktywów Państwowych Wojciech
  Balczun zwrócił uwagę, że rządowa strategia local content, czyli jak największego
  udziału krajowych firm, produktów i technologii w realizowanych inwestycjach, staje
  się fundamentem rozwoju polskiej gospodarki. Tworzymy podstawy własnych kompetencji
  na przyszłość oraz odbudowujemy to, co wydawało się niemożliwe. Mamy największe
  inwestycje w historii Polski we wszystkich obszarach Pełnomocnik Rządu do spraw
  wzmocnienia odporności państwa, Wiceminister Obrony Narodowej  Magdalena Sobkowiak-Czarnecka
  podkreśliła, że w historii Polski nie było dotąd tak dużych inwestycji i zakupów
  dla Marynarki Wojennej. Współpraca ponad podziałami to też wspólne działanie, aby
  funduszy na bezpieczeństwo było jak najwięcej. Cieszę się, że inny budowany w Gdyni
  okręt Ratownik finansujemy z mechanizmu SAFE – zaznaczyła Magdalena Sobkowiak-Czarnecka.
  Polska będzie dalej rozwijać swój przemysł stoczniowy. Po zbudowaniu zamówionych
  dla Marynarki Wojennej okrętów gdyńska stocznia będzie mogła rozpocząć budowę podobnych
  jednostek dla państw sojuszniczych – na eksport. Cały czas konsekwentnie odbudowujemy
  także swoją pozycję nad Bałtykiem, tak aby stać się potęgą morską - rozwijamy porty,
  energetykę wiatrową, przemysł stoczniowy, gazoporty i terminale, a także realizujemy
  strategiczne inwestycje, takie jak elektrownia jądrowa.'
