title: Polska buduje najnowocześniejszą armię w Europie. Centrum serwisowe Apache
  powstanie w Łodzi
text: Inwestycja w amerykańskie śmigłowce Apache to nie tylko wzmocnienie naszego
  bezpieczeństwa, ale również impuls dla rozwoju gospodarczego Łodzi. Z osobistą satysfakcją
  podkreślę, że po objęciu rządów sfinalizowaliśmy marzenie, aby w Łodzi powstało
  takie realne, prawdziwe centrum śmigłowcowe i to w skali nie tylko polskiej, ale
  europejskiej W związku z podpisaniem umów offsetowych zatrudnienie w Wojskowych
  Zakładach Lotniczych zostanie podwojone. Łódzkie centrum serwisowe będzie mogło
  obsługiwać co najmniej 96 śmigłowców, które Polska zamówiła w USA za ok. 10 mld
  dolarów. Istotą tych wielkich projektów jest przede wszystkim bezpieczeństwo i rozwój
  polskiego przemysłu zbrojeniowego, ale także wielki skok technologiczny Umowa z
  firmą Boeing umacnia także sojusz Polski ze Stanami Zjednoczonymi. Bardzo dziękuję
  amerykańskim przyjaciołom za wsparcie oraz istotę naszych relacji – zaufanie i przyjaźń.
  To jest kluczem dla naszego bezpieczeństwa Inwestycje w nowoczesne technologie i
  rozwój polskiego wojska mają fundamentalne znaczenie dla wzmocnienia naszego bezpieczeństwa.
  Naprawdę budujemy najnowocześniejszą armię w Europie, zdolną do obrony naszych granic.
  To jest bezcenne i warte wszystkich pieniędzy oraz naszych wysiłków Realizowane
  inwestycje są częścią największego w historii Polski procesu modernizacji i wzmacniania
  Sił Zbrojnych RP.
