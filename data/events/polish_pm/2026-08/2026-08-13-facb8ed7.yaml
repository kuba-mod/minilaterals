title: Wraca rządowy program CPN, czyli „Ceny Paliwa Niżej”
text: Przedłużająca się wojna na Bliskim Wschodzie powoduje wzrost cen paliw na całym
  świecie, w tym w Polsce. W tej sytuacji rząd przywraca do 31 sierpnia rozwiązanie,
  które ograniczy skutki kryzysu paliwowego i obniży ceny na stacjach benzynowych.
  Dzięki ponowieniu programu CPN paliwo będzie tańsze o ok. 1 zł. To będzie oznaczało,
  że Polska będzie w europejskiej czołówce, jeśli chodzi o najniższe ceny paliw –
  wyjaśnił podczas konferencji prasowej Donald Tusk. Spadek cen na stacjach benzynowych
  będzie możliwy dzięki obniżeniu podatku VAT od paliw z 23% do 8%. Minister Energii
  każdego dnia będzie informował o maksymalnych możliwych cenach na stacjach benzynowych,
  aby koncerny paliwowe nie wykorzystywały obniżenia VAT dla siebie, lecz aby korzyści
  z tej skromnej, ale jednak dość wyraźnej obniżki trafiły do ludzi Ulga dla kierowców
  mogłaby być jeszcze większa, gdyby nie decyzja Prezydenta o zawetowaniu ustawy umożliwiającej
  nałożenie na koncerny paliwowe specjalnego podatku od nadzwyczajnych zysków. Premier
  poinformował, że wyraził warunkową zgodę na odejście z rządu Ministra ds. Nadzoru
  nad Wdrażaniem Polityki Rządu, Macieja Berka i na kandydowanie przez niego do Trybunału
  Konstytucyjnego. Dlatego, że jest osobą, która może naprawić sytuację w TK. To,
  co najważniejsze dzisiaj, to jest praca ludzi maksymalnie kompetentnych, odważnych.
  Minister Berek jest mistrzem, jeśli chodzi o koordynację działań różnych osób i
  egzekwowanie tego, do czego się zobowiązujemy. (…)To jeden z najwybitniejszych polskich
  prawników praktyków, który ze swojej apolityczności i niepartyjności uczynił znak
  rozpoznawczy. Nie znam osoby lepiej przygotowanej, która może pomóc naprawić sytuację
  w wadliwym Trybunale Konstytucyjnym Trybunał musi zostać uzdrowiony, aby mógł ponownie
  pełnić swoją konstytucyjną funkcję. Nie mamy żadnych innych interesów w tej sprawie.
  Zależy nam na naprawieniu TK, żeby nie był na smyczy Prezydenta i PiS-u, tylko wykonywał
  swoją robotę Obowiązki Macieja Berka przejmie Joanna Knapińska, Prezes Rządowego
  Centrum Legislacji. Premier poinformował o zatrzymaniu przez ABW i Policję Rosjanina
  podejrzanego o przygotowywanie zamachu na obywatela USA ukraińskiego pochodzenia.
  7 sierpnia zatrzymaliśmy Rosjanina, zwerbowanego przez rosyjskie służby, który miał
  dokonać w Warszawie egzekucji na obywatelu USA i Ukrainy, posiadającym podwójne
  obywatelstwo To pierwszy przypadek rosyjskiego zlecenia zamachu na obywatela amerykańskiego
  na terenie innego państwa NATO, w tym przypadku Polski. Reżim Putina może podejmować
  kolejne próby likwidowania osób uznawanych za niewygodne, dlatego nasze służby będą
  intensyfikować działania, aby zapobiegać takim zagrożeniom Operacja zatrzymania
  obywatela Rosji w Warszawie była realizowana we współpracy ze służbami USA.
