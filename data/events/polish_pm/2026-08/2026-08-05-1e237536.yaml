title: Nominacje asesorskie podpisane - nie ma zgody na obchodzenie Konstytucji przez
  Prezydenta
text: Premier Donald Tusk podpisał w środę 200 dokumentów dotyczących nominacji asesorskich.
  Prezydent Nawrocki wręczył nominacje asesorom, ale wcześniej nie dopełnił konstytucyjnego
  obowiązku uzyskania kontrasygnaty Premiera. Ta grupa 200 asesorów, gdyby została
  legalnie nominowana, mogłaby rozpatrywać miesięcznie od 10 do 11 tys. spraw, ponieważ
  asesorzy mogą orzekać, zanim zostaną sędziami. To orzekanie ma sens tylko wtedy,
  gdy jest legalne W przeciwnym razie wydane przez nich orzeczenia mogą zostać uznane
  za nieważne. Dramat tej sytuacji polega na tym, że dwie instytucje – Prezydent RP
  i Trybunał Konstytucyjny – odpowiedzialne za ochronę i przestrzeganie Konstytucji,
  zawiązały coś na kształt politycznego spisku, aby tę Konstytucję złamać Krajowa
  Rada Sądownictwa w stanowisku z 29 lipca wskazała, że zgodnie z artykułem 144 Konstytucji
  akty urzędowe Prezydenta niewymienione w tym przepisie wymagają kontrasygnaty Prezesa
  Rady Ministrów. Prezesi sądów odesłali więc do KRS nominacje, które nie zostały
  nią opatrzone, aby mogły zostać przekazane Premierowi. Nieuzyskanie kontrasygnaty
  Premiera to kolejna próba złamania Konstytucji na rzecz zmiany ustroju bez zmiany
  Konstytucji Premier podpisał dokumenty nominacyjne asesorów, na których znajduje
  się podpis Prezydenta Nawrockiego. Tym samym, zgodnie ze stanowiskiem Krajowej Rady
  Sądownictwa, został spełniony konstytucyjny wymóg kontrasygnaty. Staram się bez
  emocji rozwiązywać problemy wynikające z niekonstytucyjnych działań, w tym przypadku
  działań Prezydenta Nawrockiego Przypomniał też, że jako Prezes Rady Ministrów otrzymywał
  do kontrasygnaty tego typu dokumenty od wszystkich prezydentów, w tym od Andrzeja
  Dudy. Premier Donald Tusk odniósł się również do fali upałów w Polsce i funkcjonowania
  infrastruktury energetycznej w tej sytuacji pogodowej. Mieliśmy dziś spotkanie,
  aby ocenić, czy istnieje ryzyko wystąpienia jakiejkolwiek formy blackoutu. Mimo
  rekordowych temperatur, których się spodziewamy, nie ma dziś zagrożenia blackoutem.
  Sytuacja jest pod kontrolą Pomimo ograniczenia pracy części bloków w elektrowniach
  w Kozienicach i Połańcu z powodu niewystarczającej ilości wody do chłodzenia, sytuacja
  jest stabilna. Polskie Sieci Elektroenergetyczne nie planują uruchomienia okresu
  przywołania na rynku mocy, czyli sięgania po dodatkowe jednostki pozostające w rezerwie.
  Mamy za sobą bardzo trudny okres dla polskiej elektroenergetyki, dla elektrociepłowni
  i systemu ciepłownictwa. Była długa i ostrzejsza niż przez ostatnie lata zima. Były
  już dwie fale upałów. Z kilku powodów mogę jednak zapewnić o bezpieczeństwie systemu
  energetycznego Polska rozwija zdywersyfikowany model energetyczny, oparty na różnych
  źródłach energii, w tym OZE. W czasie upałów, gdy część elektrowni musi ograniczać
  produkcję z powodu problemów z chłodzeniem, fotowoltaika dostarcza rekordowe ilości
  energii, zwiększając bezpieczeństwo systemu. Dalsze inwestycje – zdaniem Premiera
  – powinny koncentrować się przede wszystkim na rozwoju lądowej energetyki wiatrowej,
  przy jednoczesnym rozwoju morskich farm wiatrowych. To właśnie rozbudowa różnych
  źródeł energii pozwoli utrzymać stabilność i bezpieczeństwo systemu elektroenergetycznego.
  Dobrze byłoby, aby wreszcie moi oponenci poszli po rozum do głowy i zrozumieli,
  że potrzeby energetyczne wymagają jeszcze doinwestowania. Stabilność sieci wymaga
  zrównoważonego i zróżnicowanego rynku energii Polska korzysta też z zalet europejskiego
  rynku energii. Eksportuje i importuje energię, m.in. z Niemiec, Szwecji i Czech.
  Współpraca z innymi państwami zapewnia ciągłość dostaw energii. Donald Tusk zwrócił
  uwagę na zagrożenie dla zdrowia i życia związane z wysokimi temperaturami - szczególnie
  osób pracujących w ciężkich warunkach. Już rano Premier apelował do pracodawców
  o szczególną ostrożność i zadbanie o bezpieczeństwo pracowników. Ten dzień jest
  szczególny. Prognozy wskazują, żeby być bardzo ostrożnym, uważnym i reagować na
  wszystkie zagrożenia związane ze zbyt wysoką temperaturą. Praca w tych warunkach
  w niektórych miejscach jest po prostu nie do zniesienia Premier przypomniał również
  o rozporządzeniu MRPiPS, które określa maksymalną dopuszczalną temperaturę w miejscu
  pracy. To nie są żarty. Mieliśmy do czynienia ze zgonem w czasie ostatniej fali
  upałów w lipcu w jednym z zakładów. Sprawa dotyczy prawie wszystkich w Polsce. My
  nie mamy za dużo doświadczeń z takimi temperaturami. To rozporządzenie będzie instruktażem,
  ale też zobowiązaniem dla pracodawców Premier zwrócił się z apelem do pracodawców
  o zapoznanie się z nowymi przepisami i wykorzystanie ich jako wskazówek do zapewnienia
  bezpiecznych warunków pracy swoim pracownikom i sobie samym.
