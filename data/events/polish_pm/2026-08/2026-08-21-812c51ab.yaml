title: Budżetowe priorytety rządu - bezpieczeństwo, ochrona zdrowia oraz inwestycje
text: Dziś odbyło się robocze posiedzenie rządu poświęcone przyszłorocznemu budżetowi
  państwa. W tym tygodniu przedstawiliśmy z ministrem finansów i gospodarki Andrzejem
  Domańskim propozycję efektywnego obniżenia podatku przez podniesienie progów PIT,
  na czym skorzysta 3,5 mln Polek i Polaków. Wiem, że chcielibyśmy więcej, ale działamy
  w sposób odpowiedzialny Propozycja zmian w skali podatkowej PIT zakłada funkcjonowanie
  trzech progów podatkowych. Pierwszy próg zostanie podniesiony do 130 tys. zł, przy
  zachowaniu stawki podatkowej 12%. Wprowadzona zostanie nowa, pośrednia stawka 24%
  dla dochodów od 130 tys. zł do 150 tys. zł. Trzecia, najwyższa stawka 32% będzie
  dotyczyć dochodów powyżej 150 tys. zł. Jednocześnie znaczną część kosztów reformy
  poniosą największe firmy, dzięki czemu będą to pierwsze od wielu lat zmiany w systemie
  podatkowym, które nie kosztują budżetu państwa, ale są dla niego neutralne. Ta zmiana
  jest masywna i na granicy możliwości. Apeluję do wszystkich państwa, żebyście pamiętali,
  że jesteście tak samo odpowiedzialni za swoje dziedziny życia, jak za całość kraju,
  a więc także za bezpieczeństwo finansów Jeszcze dziś pojawią się informacje dotyczące
  ratingu Polski, które będą obiektywnym obrazem tego, jak polską gospodarkę postrzegają
  światowe rynki. Premier wyraził nadzieję, że po raz kolejny potwierdzą one zaufanie
  do stabilności Polski, mimo obecnej, obiektywnie trudnej sytuacji. Szef rządu wskazał
  najważniejsze priorytety przyszłorocznego budżetu, wśród których na pierwszym miejscu
  znalazło się bezpieczeństwo, wymagające znaczących nakładów finansowych. Polska
  wydaje najwięcej na bezpieczeństwo i ochronę granicy w Europie. Nasze 5% PKB na
  obronność, to średnio dwa razy więcej niż inni członkowie NATO. Bezpieczeństwo Polek
  i Polaków jest naszym priorytetem, dlatego musimy tyle wydawać Drugim priorytetem
  jest reforma ochrony zdrowia. W tym przypadku kluczowe jest efektywne wykorzystanie
  środków pochodzących ze składek i budżetu państwa. Przekażemy o 17 mld zł więcej
  z budżetu na ochronę zdrowia. Dlatego ważne jest, żeby pojawiły się przepisy, które
  uniemożliwią nadużycia w ochronie zdrowia Środki na ochronę zdrowia muszą trafiać
  przede wszystkim tam, gdzie służą pacjentom. Wraz ze zwiększaniem nakładów potrzebne
  są przepisy ograniczające nadużycia i nieprawidłowości. Trzecim priorytetem budżetu
  są inwestycje, w tym strategiczne projekty, które mają przyczynić się do poprawy
  jakości życia Polek i Polaków. Nasze decyzje muszą łączyć dwa podejścia - odpowiedzialność
  za stan finansów państwa, ale równocześnie nie możemy hamować rozwoju kraju przez
  brak dużych inwestycji Efekty części realizowanych inwestycji nie będą odczuwalne
  od razu, ale w przyszłości przełożą się na konkretne korzyści dla obywateli. Inwestycje
  w energetykę przyczynią się także do obniżenia kosztów energii. Innym przykładem
  są inwestycje w infrastrukturę kolejową i drogową, które bezpośrednio poprawiają
  jakość życia użytkowników dróg i kolei. Rząd przyjmie projekt budżetu na 2027 rok
  na posiedzeniu w przyszły piątek, 28 sierpnia. Utrzymanie wysokiego ratingu Polski
  oraz odpowiedzialny balans między deficytem a koniecznymi wydatkami zależą nie tylko
  od działań rządu i parlamentu, ale także odpowiedzialnej postawy Prezydenta. Każde
  weto prezydenckie podważa jakiś element zaufania do Polski. Jeśli my dzisiaj planujemy
  takie wydatki, taki deficyt, takie inwestycje, to wszyscy chcielibyśmy wiedzieć,
  że nie będą one zablokowane. A więc to także zależy od zachowania i decyzji pana
  Prezydenta Szef rządu wyraził nadzieję, że decyzje Prezydenta przestaną być niemal
  wyłącznie negatywne, ponieważ ich konsekwencje ponoszą wszyscy Polacy.
