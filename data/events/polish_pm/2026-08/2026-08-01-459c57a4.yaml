title: Walczyli, żebyśmy mogli cieszyć się wolnością, która nie jest dana raz na zawsze
text: Jest tylko jedno takie miasto na świecie, które raz w roku i każdego roku zatrzymuje
  się na minutę. Powietrze wypełnia dźwięk syren i przejmująca, wymowna cisza, która
  mówi więcej, niż jakiekolwiek słowa. W tej ciszy wciąż pada pytanie, czy było warto?
  Tyle śmierci, miasto zmiecione z powierzchni ziemi. Czy dowódcy nie popełnili jakiegoś
  straszliwego błędu? Ale ci, którzy powstali, nie kalkulowali. Odpowiedzieli bohaterstwem
  i swoją walką na niemiecką okupację, na łapanki, na rozstrzeliwania, na pogardę
  i nagą  przemoc. Powstali do walki, żebyśmy dziś mogli cieszyć się wolnością. Wolnością,
  która nigdy nie jest dana raz na zawsze, o którą w jakiś sposób zawsze trzeba walczyć.
  Po 82. latach od tej walki patrzymy na jej bohaterów i ich biało-czerwone opaski.
  To prawdziwe zobowiązanie, by dbać o siłę Polski w tym trudnym czasie, gdy tuż przy
  naszej granicy trwa brutalna wojna. Gdy zagraża nam wróg, gdy atakuje nasze wartości
  i robi wszystko, żeby nas podzielić. Właśnie teraz szczególnie nie mamy prawa zapomnieć
  o lekcji, którą dali nam Powstańcy. Tylko wspólnie jesteśmy siłą, która pokona każde
  zło. Powstańcy szli do walki śpiewając „jeszcze Polska nie zginęła”. I tak się stało.
  Dziś, najsilniejsza w historii, jest wzorem dla całej Europy. W godzinę „W” przystańmy,
  pochylmy głowy, pomyślmy o tych wszystkich, którzy przelali krew za wolną Polskę.
