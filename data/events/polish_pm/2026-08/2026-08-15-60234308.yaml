title: 'Cztery filary bezpieczeństwa: szczelne granice, realne sojusze, nowoczesna
  armia i mocna gospodarka'
text: Rząd konsekwentnie wzmacnia bezpieczeństwo naszego kraju, aby zapobiec wojnie
  oraz chronić niepodległość i suwerenność państwa. Bezpieczeństwo Polski jest wspólnym
  wysiłkiem całego narodu i opiera się na czterech filarach. Pierwszy filar to bezpieczne
  i szczelne granice. Dzisiaj z dumą możemy powiedzieć całemu światu, że osoby, które
  próbują nielegalnie przekroczyć naszą granicę, zostaną skutecznie powstrzymane –
  podkreślił Premier podczas uroczystości Święta Wojska Polskiego i parady morskiej
  w Gdyni. Drugim filarem polskiego bezpieczeństwa są realne sojusze i mądra polityka
  zagraniczna. To nowe traktaty o bezpieczeństwie i wzajemnej pomocy – z Francją traktat
  w Nancy i z Wielką Brytanią, traktat z Nordholt. To także rozszerzone umowy o bezpieczeństwie
  i współpracy w dziedzinie militarnej, m.in. z Holandią czy Niemcami Odpowiedzialna
  polityka zagraniczna to także wsparcie Ukrainy w wojnie z Rosją, które jest inwestycją
  w bezpieczeństwo Polski, oraz dbałość o jedność wspólnoty transatlantyckiej i NATO.
  Trzecim, chyba najważniejszym filarem naszego bezpieczeństwa są wielkie inwestycje
  w armię i marynarkę wojenną. Polskie wojsko będzie już wkrótce największe w Europie.
  Już dziś budujemy siłę, która dzięki swojej nowoczesności i liczebności będzie miała
  decydujące znaczenie dla bezpieczeństwa naszego regionu Czwartym filarem polskiego
  bezpieczeństwa jest silna i dynamicznie rozwijająca się gospodarka. Polska, z prawie
  4% PKB, rozwija się cztery razy szybciej niż gospodarka niemiecka i pięć razy szybciej
  niż francuska Nasz kraj osiąga bardzo dobre wyniki gospodarcze mimo przeznaczania
  rekordowych wydatków na bezpieczeństwo i obronność. Warunkiem naszego bezpieczeństwa
  jest także odpowiedzialność polskiej klasy politycznej. W Polsce nie może być miejsca
  na zdradę, skrajną głupotę czy nieodpowiedzialność. Nie można dopuścić do blokowania
  projektu SAFE wartego 180 mld zł, dzielenia Polski z najbliższymi sąsiadami ani
  wmawiania społeczeństwu, że głównym wrogiem staje się Unia Europejska czy Niemcy,
  zamiast Rosji Historia Polski pokazuje, że deklaracje patriotyzmu nie zawsze szły
  w parze z odpowiedzialnymi decyzjami, a ich konsekwencją bywały poważne problemy
  polityczne, a nawet narodowe porażki. Szef rządu podkreślił, że największym prezentem
  dla przyszłych pokoleń jest bezpieczny dom dla każdego i możliwość życia w suwerennym
  kraju. Zaapelował także, aby z dumą patrzeć na polskie morze i flotę oraz pamiętać
  o żołnierzach i wszystkich, którzy każdego dnia pracują na rzecz bezpieczeństwa
  Polski. Święto Wojska Polskiego obchodzone jest w rocznicę Bitwy Warszawskiej z
  1920 r., jednego z najważniejszych zwycięstw w historii naszego kraju, które wpłynęło
  na losy Europy i świata.
