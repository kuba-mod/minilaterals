title: 'Premier: To budżet narodowego optymizmu i energii, a nie marazmu i pesymizmu'
text: Rząd przyjął dziś wstępny projekt ustawy budżetowej na 2027 rok. Został on przygotowany
  z uwzględnieniem obecnych uwarunkowań gospodarczych oraz wymagającej sytuacji geopolitycznej.
  Nie zawsze o tym głośno mówimy i nie wszyscy zdają sobie z sprawę w jakich warunkach
  przyszło, szczególnie Polsce, zarządzać własną gospodarką i finansami. W sytuacji,
  kiedy mamy wojnę za naszą granicą i inne konflikty, które wpływają na naszą sytuację
  finansową. Konsekwencje tego globalnego zamieszania są liczone w miliardach złotych
  - powiedział Premier Donald Tusk przed posiedzeniem Rady Ministrów. Pomimo trudnej
  i napiętej sytuacji geopolitycznej rząd przygotował odpowiedzialny projekt budżetu.
  Jak uprzedzaliśmy, chcemy, by ten budżet był elementarnie odpowiedzialny. Chcemy,
  żeby wskaźniki, takie jak dług czy deficyt, były najniższe, ale nie pozwolimy, by
  polska gospodarka stanęła lub aby zatrzymać jakiekolwiek pieniądze, które mogłyby
  trafić do ludzi Szef rządu podziękował ministrom za zdyscyplinowane podejście podczas
  prac nad przygotowaniem ustawy budżetowej. Projekt przyszłorocznego budżetu odzwierciedla
  najważniejsze priorytety rządu Koalicji 15 października. Pierwszym z nich jest bezpieczeństwo.
  Znaleźliśmy środki m.in. na bezpieczeństwo. Chcemy, by ludzie w Polsce czuli się
  bezpiecznie i mimo trudnych okoliczności, uzyskaliśmy ten efekt Rząd przeznacza
  rekordowe środki na obronność i rozwój polskiego przemysłu zbrojeniowego. Wzmacnia
  polskie wojsko i służby mundurowe podległe MSWiA oraz ochronę granicy, bezpieczeństwo
  w przestrzeni powietrznej i zdolności wywiadowcze. Projekt budżetu zakłada także
  dalszy wzrost wydatków na ochronę zdrowia. Chcę bardzo podziękować za ten wysiłek
  zwiększenia środków na zdrowie. To jest o 26 mld zł więcej niż w 2026 roku. Pracujemy,
  by wyraźnie większe pieniądze na zdrowie nie zostały w żaden sposób zmarnowane,
  by służyły pacjentom i poprawie w ochronie zdrowia Polska staje się coraz bardziej
  atrakcyjnym i bezpiecznym miejscem – zarówno do inwestowania, jak i do życia i pracy.
  Po raz pierwszy w powojennej historii do naszego kraju przyjeżdża więcej osób niż
  z niej wyjeżdża. Jakość życia to także dostęp do żłobków i przedszkoli oraz wsparcie
  dla rodzin. Wprowadzone transfery społeczne przyczyniły się do korekty niekorzystnego
  trendu demograficznego. Niektórzy już naprawdę rwali włosy z głowy, że mimo wielkich
  inwestycji w polską rodzinę, żłobki, przedszkola, babciowe, ta dzietność w Polsce
  jest ciągle bardzo słaba. Coś drgnęło, więc cieszę się i będziemy dalej to robić.
  Tutaj też mówimy o miliardach złotych. Na sam program „Aktywny rodzic”, czyli tak
  zwane „babciowe” mamy miliard złotych więcej niż w zeszłym roku Ważną częścią budżetu
  są także inwestycje, m.in. w energetykę. Rząd przeznacza środki m.in. na rozwój
  energetyki jądrowej, modernizację sieci energetycznych i całego systemu. Inwestuje
  także w strategiczne projekty infrastrukturalne. Poprawa jakości życia to także
  wzrost inwestycji kolejowych. Przywrócenie połączeń kolejowych w miejscach, które
  przez lata były wykluczone, a także coraz wygodniejsze i szybsze pociągi. Przed
  nami także kolejne wielkie decyzje inwestycyjne – Port Polska Szef rządu wyraził
  nadzieję, że w tym roku budżetowym uda się ostatecznie rozstrzygnąć, z kim i w jaki
  sposób będziemy budować w Polsce najszybsze koleje w Europie. Premier Donald Tusk
  odniósł się także do sprawy upadłej giełdy kryptowalut Zondacrypto. Prokuratura
  prowadzi w tej sprawie postępowanie dotyczące podejrzenia oszustw znacznej wartości
  oraz prania brudnych pieniędzy. Sprawa Zondacrypto nabiera kształtów, które naprawdę
  budzą grozę. To już nie jest zwykła łapówka, jeden przekupiony polityk. To wygląda
  na dobrze zorganizowany system, w którym pojawiają się nazwiska znane od dawna.
  Ten bardzo ponury serial będzie wyjaśniany i dowiemy się niestety wielu przykrych
  rzeczy Cała sprawa jest w bardzo mocny sposób powiązana ze środowiskiem polityków
  Prawa i Sprawiedliwości. Ślady finansowania, dziwnych przepływów pieniędzy między
  mediami i politykami stają się coraz bardziej wyraźne. Nie będziemy wtrącać się
  w działania prokuratury, ale jako szef rządu w parlamencie będę proponował ponowne
  głosowanie nad wetem prezydenckim w sprawie ustawy o kryptowalutach Przypomnijmy,
  Prezydent Karol Nawrocki już trzykrotnie zawetował rządową ustawę o rynku kryptoaktywów.
  Zwracam się z oczekiwaniem do Prezydenta i opozycji, żebyście pokazali, że przynajmniej
  dla lepszej przyszłości jesteście w stanie zerwać więzi z brudnym biznesem i wreszcie
  przyjmiemy ustawę o kryptowalutach. By takie przestępstwa i sensacje nie miały miejsca
  w Polsce. Pokażcie, że macie resztki wstydu, panowie z opozycji i Pałacu Prezydenckiego
  Ustawa ma uporządkować rynek, lepiej chronić jego uczestników oraz wyposażyć państwo
  w skuteczniejsze narzędzia do przeciwdziałania nadużyciom, wyłudzeniom i oszustwom.
