title: Walczymy o pierwsze miejsce Polski na Bałtyku. Przyspieszamy strategiczne inwestycje
  na rzecz obronności i gospodarki
text: 'Kilka dni temu w Gdyni odbyła się uroczystość chrztu Wichra, pierwszej fregaty
  budowanej w ramach programu Miecznik. Dwa dni później, podczas obchodów Święta Wojska
  Polskiego, tysiące Polaków mogły obserwować paradę morską. Oba wydarzenia były symbolicznym,
  ale także konkretnym potwierdzeniem, że Polska konsekwentnie wzmacnia swoje zdolności
  na morzu. Dzisiaj przyjmiemy projekt ustawy, zgodnie z którym radykalnie przyspieszymy
  proces przygotowania i realizacji kluczowych inwestycji infrastrukturalnych, które
  mają wpływ na obronność i gospodarkę Polski - powiedział Premier Donald Tusk przed
  Radą Ministrów. Przygotowana przez Ministerstwo Infrastruktury ustawa precyzyjnie
  wskazuje kluczowe z narodowego punktu widzenia inwestycje, które będą można szybciej
  realizować. Budowa drogi krajowej nr 7 do Portu Morskiego w Gdyni, budowa portu
  zewnętrznego w Gdyni, rozbudowa portu zewnętrznego w Świnoujściu, budowa Przylądka
  Pomerania, rozbudowa sieci kolejowej wokół portów – to niektóre z inwestycji, które
  radykalnie przyspieszą Innymi przykładami inwestycji są: m.in. budowa infrastruktury
  stacji przeładunkowej na Wyspie Portowej wraz z przeprawą kolejowo-drogową przez
  Martwą Wisłę. Przyspieszą również inwestycje kolejowe związane z gospodarką morską
  na trasach: Szczecin - Świnoujście, Wrocław - Szczecin, Chorzów-Batory - Tczew,
  Warszawa - Gdańsk, Nowa Wieś Wielka – Gdynia. Przyspieszone zostaną także inwestycje
  związane z programem jądrowym i budową elektrowni jądrowej na Pomorzu. Obejmą one
  m.in. infrastrukturę na obszarze gmin Choczewo i Krokowa oraz na obszarach morskich
  Polski. Tworzymy cały system, który da Polsce absolutnie wiodącą i kluczową rolę
  na Bałtyku. (…) Po wykonaniu tych inwestycji będę mógł z czystym sumieniem Państwu
  zameldować, że Polska po kilku latach naszej pracy stała się bałtycką potęgą i że
  Bałtyk stał się naprawdę polskim morzem Dziś statystyki są jednoznaczne. Gdańsk
  jest największym portem na Bałtyku, w ciągu ostatnich dwóch lat wyprzedził porty
  w Amsterdamie i Marsylii i jest już 6. w Europie. Gdański port osiągnął rekordowy
  wynik w swojej historii - w lipcu przeładowano 7,9 mln ton ładunków. Mam nadzieję,
  że Prezydentowi nie przyjdzie do głowy wetowanie ustawy, dzięki której kluczowe
  inwestycje przyspieszą. Chyba już wszyscy mamy dość blokad, które paraliżują przedsięwzięcia
  dla dobra Polski. To jest wyścig z czasem i o pierwsze miejsce dla Polski Obecnie
  przygotowanie dużych inwestycji może trwać wiele lat, m.in. ze względu na liczne
  uzgodnienia, decyzje i procedury administracyjne. Premier Donald Tusk odniósł się
  do pojawiających się spekulacji na temat miejsca pobytu byłego wiceministra sprawiedliwości
  w rządzie PiS Marcina Romanowskiego. Służby innych państw z regionu, z którymi współpracujemy,
  potwierdziły nam informacje, że pan Romanowski znajduje się na 99% w Naddniestrzu,
  w Tyraspolu Tyraspol jest stolicą prorosyjskiego, separatystycznego Naddniestrza.
  M. Romanowski jest podejrzany w śledztwie dotyczącym Funduszu Sprawiedliwości. Śledczy
  zarzucają mu m.in. ustawianie konkursów oraz udział w zorganizowanej grupie przestępczej.
  Warszawski sąd wydał za byłym wiceministrem Europejski Nakaz Aresztowania oraz list
  gończy. Prezes Rady Ministrów skomentował incydent, do którego doszło 14 sierpnia
  w Bydgoszczy. Mężczyzna i kobieta zaatakowali 12-letniego chłopca i 14-letnią dziewczynkę,
  ponieważ rozmawiali po ukraińsku. Atakowanie dzieci ze względu na ich narodowość
  jest antypolskim działaniem. To niedopuszczalne rzeczy, które szkodzą Polsce i będą
  ścigane Policjanci zatrzymali dziś dwie osoby, które mogą mieć związek z tym zdarzeniem.
  Obecnie trwają czynności procesowe z udziałem zatrzymanych w jednym z bydgoskich
  komisariatów.'
