title: Sprawiedliwsze podatki i więcej w portfelach Polek i Polaków
text: Polska gospodarka jest najszybciej rosnącą dużą gospodarką Unii Europejskiej.
  Wraz z jej rozwojem dynamicznie rosną także wynagrodzenia – od początku rządów Koalicji
  15 października wzrosły one o ponad 30%. Rząd przygotował więc zmiany, które mają
  ulżyć rosnącej klasie średniej. To właśnie ta grupa mierzy się z dotkliwymi obciążeniami
  podatkowymi. Postanowiliśmy wspólnie z Ministrem Domańskim, aby w dwóch wymiarach
  ulżyć i pomóc rosnącej klasie średniej - powiedział Premier Donald Tusk podczas
  konferencji prasowej. Propozycja zmian w skali podatkowej PIT zakłada funkcjonowanie
  trzech progów podatkowych. Pierwszy próg zostanie podniesiony do 130 tys. zł, przy
  zachowaniu stawki podatkowej 12%. Wprowadzona zostanie nowa, pośrednia stawka 24%.
  dla dochodów od 130 tys. zł do 150 tys. zł. Trzecia, najwyższa stawka 32%. będzie
  dotyczyć dochodów powyżej 150 tys. zł. 3,5 mln podatników skorzysta na tej zmianie
  w przyszłym roku. Roczny zysk z tej reformy może wynieść do 3600 złotych, które
  zostaną w portfelach Polaków – mówił Minister Finansów i Gospodarki Andrzej Domański.
  Wprowadzenie nowych parametrów skali podatkowej od 2027 r. sprawi, że spadnie odsetek
  osób płacących podatek według stawki 32%. Wyniesie on 7,2%., zamiast przewidywanych
  14%. Proponowane zmiany niosą za sobą wielomiliardowe potrzeby finansowe. Nie będziemy
  obciążali wszystkich podatników tymi kosztami. W związku z tym podwyższymy podatki
  w sposób sprawiedliwy i uczciwy. Zaproponujemy podniesienie podatku CIT z 19% do
  22% dla podmiotów osiągających roczne przychody przekraczające 50 mln euro, czyli
  200 mln złotych oraz dla podatkowych grup kapitałowych Reforma zakłada również podwyższenie
  o jeden punkt procentowy – do 5%. – stawki daniny solidarnościowej, która dotyczy
  dochodów przekraczających 1 mln zł. Planowane jest także przywrócenie wcześniejszego
  limitu przychodów warunkującego możliwość wyboru ryczałtu od przychodów ewidencjonowanych
  – do równowartości 250 tys. euro. Chcemy przywrócić próg do równowartości 250 tys.
  euro. Często osoby, które mają bardzo podobne dochody, płacą zupełnie różne podatki,
  w zależności od wybranej formy rozliczenia. System musi być bardziej sprawiedliwy
  Korzyści z obniżenia obciążeń dla klasy średniej zostaną sfinansowane m.in. przez
  największe firmy i osoby osiągające najwyższe dochody. Jestem przekonany, że po
  zmianach system podatkowy będzie sprawiedliwszy, a korzyści będą dotyczyły ludzi,
  którzy dziś ponoszą najcięższe daniny - nie mówimy o bogaczach, tylko klasie średniej,
  na której barkach w dużej mierze spoczywa finansowanie państwa i wydatków na obronność.
  Chcemy zrównoważyć wysiłek finansowy wszystkich obywateli i obciążyć największe
  firmy Rząd prowadzi odpowiedzialną politykę fiskalną i budżetową – przedstawione
  dziś propozycje są pierwszymi od wielu lat zmianami w systemie podatkowym, które
  nie kosztują budżetu państwa, ale są dla niego neutralne. Jeśli Prezydent przyjmie
  logikę z kwestii paliw, to może próbować zawetować projekt. Ochroni wielkie firmy
  i koncerny, ale zarabiającym pielęgniarkom, urzędnikom, nauczycielom zabierze te
  pieniądze. Mam nadzieję, że presja milionów ludzi, którzy czekają na tę decyzję,
  wywoła impuls w sumieniu pana Prezydenta Zmiany w systemie podatkowym mają obowiązywać
  od 2027 r.
