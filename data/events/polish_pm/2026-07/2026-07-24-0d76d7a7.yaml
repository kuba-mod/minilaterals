title: Polska jednym z najbezpieczniejszych miejsc na świecie dzięki służbom mundurowym
text: 'Premier Donald Tusk wziął udział w Centralnych Obchodach Święta Policji. W
  tym roku przypada 107. rocznica powstania Policji Państwowej. Policjantki i Policjanci,
  pracownice i pracownicy polskiej Policji – dziś każdy w Polsce chce Wam z całego
  serca powiedzieć: „Dziękuję”. To słowo ma dziś szczególny wymiar. Naprawdę jest
  za co dziękować polskiej Policji - powiedział Premier Donald Tusk w swoim wystąpieniu.
  Podczas uroczystości na Placu Marszałka Józefa Piłsudskiego wręczone zostały odznaczenia
  państwowe, medale i odznaki resortowe. Odbyła się także promocja oficerska, ślubowanie
  nowo przyjętych policjantów oraz wręczenie nagród laureatom konkursu „Policjant,
  który mi pomógł”. Większą nagrodą niż przemówienia polityków są słowa zwykłych ludzi.
  Także te, które usłyszeliśmy przed chwilą – od osoby, która dzięki pomocy policjanta
  uwolniła się od przemocy domowej, od małżeństwa, które straciło wszystko w pożarze
  i nagle zobaczyło człowieka w policyjnym mundurze, który przywrócił im nadzieję
  i wiarę w człowieczeństwo. To są największe nagrody Premier podziękował także rodzinom
  i bliskim funkcjonariuszy i pracowników Policji. Każdego dnia wspierają oni swoich
  bliskich i żyją z niepewnością o ich bezpieczny powrót ze służby. Ich wytrwałość
  również zasługuje na wdzięczność. Dziś przed polską Policją stoją zadania trudniejsze
  niż kiedykolwiek wcześniej. Oprócz zapewniania bezpieczeństwa na ulicach funkcjonariusze
  wspierają także ochronę wschodniej granicy. Bez wsparcia polskich policjantek i
  policjantów na wschodniej granicy niemożliwe byłoby to, z czego Polska jest dziś
  dumna – mamy najbezpieczniejszą, szczelną granicę, przez którą nikt nieproszony
  nie może się już przemknąć. To wyjątkowe osiągnięcie, doceniane na całym świecie
  Polska cieszy się dziś opinią jednego z najbezpieczniejszych miejsc na świecie –
  pomimo że geograficzne położenie nie uległo zmianie. To wszystko dzięki wysiłkowi
  wojska, Straży Granicznej, jak i Policji. Dzisiaj, patrząc na bilans Waszych działań
  możemy z pełną odpowiedzialnością powiedzieć – Państwo działa. Świetnie działa polska
  Policja i robi wszystko by w sposób właściwy chronić polskich obywateli - podkreślił
  Minister Spraw Wewnętrznych i Administracji Marcin Kierwiński. Bezpieczeństwo w
  Polsce dostrzegają osoby odwiedzające nasz kraj. Spójrzcie zresztą choćby w media
  społecznościowe. Tam codziennie są setki filmików, wypowiedzi cudzoziemców, którzy
  trafiają do Polski i przecierają oczy ze zdumienia. Bezpieczne metro, bezpieczny
  tramwaj, bezpieczne ulice. Można w nocy iść bez niepokoju. To W asze wielkie zwycięstwo.
  To Wasz wielki sukces Szef rządu zaapelował o szacunek i wsparcie dla funkcjonariuszy,
  którzy mierzą się z nowymi zagrożeniami, takimi jak motywowana politycznie przemoc.
  Dziś w imieniu wszystkich Polaków apeluję bez wyjątku do każdego, kto ma jakąś władzę
  w ręku - chrońcie polską Policję przed atakami i przed hejtem Donald Tusk zapewnił
  funkcjonariuszy o pełnym wsparciu rządu. Chcę Was zapewnić o pełnym wsparciu rządu
  i moim osobistym, gdy musicie podjąć kontrowersyjną decyzję. Kiedy w obronie życia
  obywateli lub swojego życia, będziecie czasem musieli użyć broni – będę zawsze z
  Wami, będę zawsze Was bronił – waszej godności, bronił przed nieuzasadnionymi oskarżeniami
  Premier wyraził uznanie dla policjantek i policjantów za ich profesjonalizm oraz
  postawę wobec nowych wyzwań. Podkreślił, że funkcjonariusze pełnią służbę z honorem,
  godnością i cierpliwością, a gdy sytuacja tego wymaga – także ze stanowczością.
  Jak zaznaczył, taka postawa budzi szacunek i wdzięczność Polaków. Według badania
  CBOS z 2026 r. Policji ufa 71% Polek i Polaków, co plasuje ją na drugim miejscu
  pod względem zaufania społecznego – tuż za Wojskiem Polskim. Szef rządu podziękował
  również Ministrowi Spraw wewnętrznych i Administracji Marcinowi Kierwińskiemu za
  działania na rzecz pozyskania dodatkowego finansowania dla służb. Włożył [on] bardzo
  dużo wysiłku w to, aby 3 miliardy złotych zablokowanych różnymi okolicznościami,
  które mogły trafić do Was dzięki programowi SAFE, co wymagało to wielu manewrów,
  trafiło do Policji Po wecie Prezydenta do ustawy SAFE, w maju br. rząd przedstawił
  plan B – alternatywny mechanizm zapewniający dodatkowe finansowanie dla Policji,
  Straży Granicznej i Służby Ochrony Państwa. Ponadto w 2025 r. rząd przeznaczył 13
  mld zł na program modernizacji służb podległych MSWiA (Policja, Straż Graniczna,
  Państwowa Straż Pożarna, Służba Ochrony Państwa) w latach 2026-2029. Z tej puli
  do Policji trafi ponad 7 mld zł. Przeznaczamy rekordowe środki na modernizację polskiej
  Policji. To ponad 7 mld na lepsze warunki pracy, na nowsze posterunki, komisariaty,
  na bliższą obecność polskiej Policji przy obywatelu. Ale to także pieniądze na wyposażenie
  i na Wasze codzienne bezpieczeństwo Dziś skuteczna walka z przestępczością i nowymi
  zagrożeniami wymaga nowoczesnego wyposażenia oraz odpowiednich narzędzi dla Policji.
  A inwestycje w modernizację służb, w połączeniu z profesjonalizmem funkcjonariuszy,
  przekładają się na wyższy poziom bezpieczeństwa w Polsce.'
