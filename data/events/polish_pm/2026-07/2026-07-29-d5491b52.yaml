title: Czas na silną markę narodową! Prof. Barbara Mróz-Gorgoń mianowana Pełnomocniczką
  Rządu ds. promocji marki Polski
text: Wczoraj Rada Ministrów przyjęła rozporządzenie ustanawiające Pełnomocnika Rządu
  do spraw promocji marki Polski. Dzisiaj Premier przedstawił osobę, która będzie
  pełniła tę funkcję. Najwybitniejsza w Polsce specjalistka do kształtowania marki,
  prof. Barbara Mróz-Gorgoń, współpracuje z nami od dłuższego czasu i zostaje Pełnomocniczką
  Rządu ds. Marki Polska - powiedział Premier Donald Tusk podczas konferencji prasowej.
  Nowa Pełnomocniczka będzie koordynować działania administracji rządowej związane
  z budową, wdrażaniem i rozwojem spójnej marki narodowej. Marka Polska nie jest własnością
  rządu. Tworzą ją przedsiębiorcy, artyści, sportowcy, samorządy oraz miliony Polek
  i Polaków w kraju i za granicą. Silna marka narodowa oznacza więcej inwestycji,
  większe korzyści, większą rozpoznawalność i silniejszą pozycję w relacjach międzynarodowych
  - podkreśliła Pełnomocniczka Marki Polska, prof. Barbara Mróz-Gorgoń. Do jej zadań
  będzie należało m.in. przygotowanie projektu strategii budowy i promocji marki Polski,
  planu jej wdrożenia, opracowanie standardów komunikacyjnych i wizualnych oraz prowadzenie
  działań zwiększających rozpoznawalność Polski i wzmacniających jej pozytywny wizerunek.
  Ta wielka zmiana nie będzie dotyczyć wyłącznie promocji czy kampanii. Będzie polegała
  na przejściu od działań promocyjnych do zarządzania reputacją naszego wspaniałego
  kraju. Jestem wdzięczna za powierzenie mi tego zadania Budowa naszej narodowej marki
  wymaga długofalowego zarządzania, strategicznej komunikacji, badań i skutecznej
  koordynacji. Jest rzeczą absolutnie konieczną, aby skupić w jedną wiązkę starania
  różnych instytucji rządowych i resortów, aby promować Polskę. Mówimy o promocji
  na rzecz turystyki, wizerunku Polski i jej marek, historii To odpowiedź na wieloletni
  problem rozproszenia działań promujących Polskę. Dotychczas brakowało wspólnego
  koordynatora, jednolitej strategii i standardów, a poszczególne instytucje realizowały
  własne działania, przez co nie powstawał spójny przekaz o Polsce. Polska cieszy
  się rosnącym uznaniem na świecie, jednak do tej pory brakowało spójnego sposobu
  prezentowania jej największych atutów. Stworzymy jeden program, z którego wyniknie
  wspólna promocja marki naszego kraju. Myślimy nie tylko o tym, aby Polska stała
  się jeszcze bardziej atrakcyjnym kierunkiem turystycznym, lecz także o projekcie
  local content – zaangażowaniu przedsiębiorstw i inwestorów zagranicznych w działania
  realizowane w naszym kraju Reforma nie wiąże się z dodatkowymi wydatkami. Zakłada
  lepszą koordynację i integrację już prowadzonych działań promocyjnych, tak aby środki
  przeznaczane na promocję Polski były wykorzystywane w sposób bardziej spójny i efektywny.
  Jedno słowo, które trafnie opisuje to, czym jest Polska, to „cud”. Polska jest cudem,
  jest czymś wyjątkowym. Warto umieć nazwać to, że rozwijamy się najszybciej w Europie
  i że jesteśmy absolutnym fenomenem wśród wszystkich państw, które po 1989 roku przystąpiły
  do Unii Europejskiej. To znak rozpoznawczy Polski, który warto dobrze przedstawić
  Polska już dziś jest wysoko oceniana przez zagranicznych gości m.in. za poziom bezpieczeństwa,
  czystość, sprawnie funkcjonującą infrastrukturę. To była jedna z moich osobistych
  ambicji, aby o Polsce mówiono jak najlepiej. Codziennie sprawia mi radość, gdy słyszę
  od partnerów z całego świata, że Polska jest kapitalna. Bo jest Spójna strategia
  promocji pozwoli skuteczniej eksponować atuty Polski i wzmacniać jej pozytywny wizerunek
  na arenie międzynarodowej. Polska jest państwem silnym. Nie tylko liczy się na arenie
  międzynarodowej, ale także nadaje ton wielu sprawom. Polski nikt nie ma prawa lekceważyć.
  To nie jest nasz cel, lecz fakt W świecie rosnącej konkurencji między państwami
  wiarygodna i rozpoznawalna marka narodowa jest jednym z kluczowych elementów budowania
  siły oraz znaczenia kraju.
