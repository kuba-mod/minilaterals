title: 'Premier: Bandyci nie mogą dyktować zasad na polskich ulicach'
text: Premier Donald Tusk odniósł się do niedzielnego zdarzenia we Wrocławiu, podczas
  którego trzech mężczyzn brutalnie zaatakowało obywatela Ukrainy oraz jego partnerkę,
  która próbowała obronić go przed agresorami. Wszyscy jesteśmy zszokowani kolejnym
  aktem przemocy, tym razem na ukraińską parę. Dziękuję za sprawną pracę policji -
  dwóch sprawców jest zatrzymanych, trzeci też zaraz zostanie ujęty - powiedział Premier
  Donald Tusk przed posiedzeniem Rady Ministrów. Podkreślił, że powtarzające się przypadki
  przemocy spotkają się ze stanowczą reakcją państwa. Wielkim dziedzictwem narodowym
  Polski jest solidarność i jej niezwykły wymiar w pierwszych dniach rosyjskiej wojny.
  W tej chwili to dziedzictwo jest grzebane przez bandytów, kiboli, zwykłych przestępców,
  którzy biją i poniżają ludzi, ponieważ mówią z nieco innym akcentem Polska zbudowała
  swoją pozycję na świecie dzięki Solidarności – ruchowi, który w latach 80. walczył
  z przemocą metodami pokojowymi. Świat ponownie docenił solidarność Polaków po rosyjskiej
  agresji na Ukrainę. Obserwowany jest wzrost aktów przemocy, także wobec Polek i
  Polaków. Napięcia społeczne nie mogą być żadnym usprawiedliwieniem dla chamstwa,
  bandytyzmu i przemocy. Zwracam się bezpośrednio do Pana Prezydenta, żeby przestał
  milczeć w tej sprawie. Bardzo chwalił ustawki jako męskie walki, wręcz szlachetne.
  To proszę zobaczyć, jak wygląda ta szlachetna walka wręcz w wykonaniu ludzi z GROMD-y.
  Premier Donald Tusk zaapelował również do Jarosława Kaczyńskiego o zaprzestanie
  apeli dotyczących tworzenia bojówek. Podkreślił, że politycy ponoszą odpowiedzialność
  za słowa i działania, które mogą przyczyniać się do wzrostu przemocy oraz dawać
  przyzwolenie na agresję. Donald Tusk zapowiedział pełne wsparcie dla Policji w walce
  z przemocą i przestępczością. Premier zaapelował do Ministra M. Kierwińskiego i
  Ministra W. Żurka o skuteczne działania służb i wymiaru sprawiedliwości wobec sprawców
  przemocy, którzy powinni być nie tylko szybko zatrzymywani, ale także skutecznie
  karani. Przez ostatnie lata Polska była postrzegana jako kraj bezpieczny, spokojny
  i przyjazny, a akty przemocy godzą nie tylko w ofiary, ale także w interes narodowy
  i reputację Polski. Premier Donald Tusk odniósł się również do piątkowej decyzji
  Prezydenta Karola Nawrockiego o skierowaniu do Trybunału Konstytucyjnego, w trybie
  kontroli prewencyjnej, ustawy o podatku od nadzwyczajnych zysków osiągniętych ze
  zbycia paliw ciekłych w okresie od marca do grudnia 2026 r. Uderzył mnie zalew kłamstw
  ze strony otoczenia Prezydenta na temat cen paliw. Kiedy wybuchła wojna na Bliskim
  Wschodzie zareagowaliśmy szybko i stanowczo - obniżka VAT, akcyzy, regulowane ceny
  i pełna dyscyplina spółek skarbu państwa Decyzja Prezydenta oznacza opowiedzenie
  się po stronie koncernów paliwowych osiągających nadzwyczajne zyski z obecnej sytuacji
  na rynku. A skutki tej decyzji odczują zarówno budżet państwa, jak i polscy kierowcy.
  Premier poinformował, że jeśli w związku z niestabilną sytuacją na Bliskim Wschodzie
  ceny ropy na światowych rynkach ponownie wzrosną, rząd rozważy wprowadzenie regulowanych
  cen paliw przynajmniej na dwa ostatnie tygodnie wakacji. Podkreślił, że środki na
  ten cel miały pochodzić z podatku od nadzwyczajnych zysków koncernów paliwowych,
  w tym zagranicznych, a nie z budżetu państwa. Mieliśmy Ceny Paliwa Niżej, czyli
  program CPN, a mamy PKN, czyli Ceny Karola Nawrockiego, bo wysokie ceny paliw w
  najbliższych dniach i tygodniach będą konkretnie jego zasługą W okresach kryzysów,
  gdy ceny paliw na światowych rynkach rosną, koncerny paliwowe osiągają nadzwyczajne
  zyski. Rząd zaproponował objęcie tych zysków podatkiem, aby sfinansować obniżenie
  cen paliw dla kierowców. Brak wejścia w życie tych przepisów może oznaczać dla budżetu
  państwa stratę sięgającą nawet 4 mld zł. Celem projektu nowelizacji ustawy o usługach
  hotelarskich oraz usługach pilotów wycieczek i przewodników turystycznych było zapewnienie
  równowagi między wolnością prowadzenia działalności gospodarczej a ochroną praw
  mieszkańców, tak aby mogli spokojnie funkcjonować w swoich domach. Sugerowałem,
  aby szukać rozwiązania, które nie zrujnuje możliwości korzystania z mieszkań jako
  miejsca docelowego turystów. Ale równocześnie, żeby skutecznie zadbać o prawa lokatorów.
  Okazało się to trudne Projekt realizuje przepisy prawa Unii Europejskiej zgodnie
  z zasadą ograniczenia regulacji do niezbędnego minimum, bez wprowadzania dodatkowych
  krajowych wymogów. Oczekiwaniem społecznym było jednak umożliwienie samorządom i
  lokatorom skuteczniejszej ochrony swoich praw. Będę prosił, aby jeszcze raz znaleźć
  takie rozwiązania (jak będzie trzeba to zrobić autopoprawkę do projektu rządowego),
  żebyśmy mieli poczucie, że skutecznie chronimy prawa turystów do taniego i fajnego
  miejsca oraz chronimy prawa lokatorów wtedy, kiedy najem krótkoterminowy zamienia
  ich życie w koszmar Szef rządu zapowiedział również dokładne wyjaśnienie doniesień
  dotyczących możliwego osobistego zaangażowania wiceministrów w proces legislacyjny.
  Pojawiające się w przestrzeni publicznej spekulacje na ten temat wymagają rzetelnego
  sprawdzenia.
