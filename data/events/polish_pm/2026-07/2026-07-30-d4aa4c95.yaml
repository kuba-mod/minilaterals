title: Wojsko w każdej chwili było gotowe do zestrzelenia pocisku
text: Podczas zmasowanego rosyjskiego ataku na zachodnią Ukrainę doszło do naruszenia
  polskiej przestrzeni powietrznej. Pocisk spadł w pobliżu miejscowości Tarnawa-Kolonia
  w województwie lubelskim. W związku z incydentem Premier Donald Tusk przewodniczył
  odprawie z udziałem przedstawicieli wojska i służb. Po jej zakończeniu udał się
  na miejsce zdarzenia wraz z ministrami Władysławem Kosiniakiem-Kamyszem i Marcinem
  Kierwińskim. Pierwsze informacje jednoznacznie wskazują, że odpowiednie służby,
  przede wszystkim wojsko i nasi piloci, zadziałały bardzo szybko i sprawnie. Nie
  było bezpośredniego zagrożenia w związku z tym, że rakieta spadła w terenie niezabudowanym
  Polskie wojsko było gotowe do zestrzelenia pocisku, gdyby stanowił zagrożenie dla
  obszarów zamieszkanych. Rakieta spadła jednak na teren niezabudowany, nie stwarzając
  bezpośredniego zagrożenia dla mieszkańców. Wstępne ustalenia wskazują, że był to
  rosyjski pocisk manewrujący Ch-101. Rosja będzie stawać na głowie, żeby oczyścić
  się z odpowiedzialności. Szanujemy decyzję prokuratury i nie rozstrzygamy ostatecznie
  tej sprawy, ale według oceny wojskowych dotyczącej szczątków pocisku wszystko wskazuje
  na to, że był to rosyjski pocisk Ch-101 Ostateczna identyfikacja nastąpi po zakończeniu
  szczegółowych badań. Od godzin późnowieczornych generał Ireneusz Nowak postawił
  w stan gotowości wszystkie systemy obrony powietrznej, uruchamiając krajowe i sojusznicze
  służby związane z ochroną przestrzeni lotniczej - mówił Minister Obrony Narodowej
  Władysław Kosiniak-Kamysz. Rosja przeprowadziła tej nocy jeden z największych ataków
  na Ukrainę od początku pełnoskalowej wojny. Nie ma żadnych powodów sądzić, że celem
  była Polska, ale dwa z tych obiektów naruszyły przestrzeń powietrzną Polski. Jeden
  na pewno, bo tutaj mamy jego ślady, a drugi w pobliżu polskiej granicy - to był
  bardzo krótki sygnał, więc z nim nie było związanych żadnych konsekwencji Wszystkie
  zaangażowane instytucje – Siły Zbrojne RP, Policja, straż pożarna i służby wywiadowcze
  – działają w pełnej koordynacji. W takich sytuacjach ma ona kluczowe znaczenie.
  Na miejscu zdarzenia pracują również prokuratorzy. Wszystkie służby są skoordynowane.
  Badanie tego zdarzenia odbywa się pod nadzorem prokuratury i przy udziale służb
  MON oraz MSWiA. Współpraca i wymiana informacji są na najwyższym poziomie. Nie ma
  żadnej rywalizacji – każdy wie, jakie jest jego zadanie - potwierdził szef resortu
  obrony narodowej. Dowódcy NATO są na bieżąco informowani o sytuacji, a Premier i
  Prezydent otrzymują regularne meldunki od służb. Premier Donald Tusk przypomniał,
  że dzień wcześniej spotkał się w Lublinie z Prezydentem Ukrainy, z którym rozmawiał
  o współpracy w zakresie obrony przeciwlotniczej i przeciwrakietowej. Po tym zdarzeniu
  będziemy rozważali dalsze wsparcie dla Ukrainy, żeby Ukraina nie przegrała tej wojny.
  Po mojej rozmowie z Wołodymyrem Zełenskim sprawa jest ewidentna – najbliższe 100
  dni mogą rozstrzygnąć o wyniku tej wojny. Wielkie znaczenie ma więc także to, co
  Polska będzie robiła w tej sprawie Polska będzie nadal ściśle współpracować z Ukrainą
  w kwestiach bezpieczeństwa, ponieważ skuteczna obrona przed rosyjskimi atakami już
  na terytorium Ukrainy bezpośrednio zwiększa bezpieczeństwo Polski. W naszym narodowym
  interesie jest wspieranie Ukrainy w tych działaniach. Pan generał Nowak poinformował
  mnie o tym, że myśliwce ukraińskie do samej polskiej granicy starały się przechwycić
  i zatrzymać pociski, które zmierzały w polską stronę. To pokazuje, jak ważna jest
  nasza współpraca z naszymi sojusznikami Premier poinformował również, że pozostaje
  w kontakcie z liderami państw europejskich, którzy zadeklarowali pełną solidarność
  i gotowość do wsparcia Polski. Stany Zjednoczone zadeklarowały zainteresowanie udziałem
  w postępowaniu wyjaśniającym. Dowództwo Operacyjne RSZ przekazało informacje do
  Rządowego Centrum Bezpieczeństwa, które uruchomiło system ostrzegania ludności.
  Mieszkańcy wielu miejscowości w województwach lubelskim i podkarpackim usłyszeli
  w nocy syreny alarmowe. Oznacza to, że w czasie około 13 minut zagrożenia wykorzystano
  najszybszy dostępny system ostrzegania. Ludność cywilna została ostrzeżona syrenami.
  Wiem, że ciągle jako społeczeństwo uczymy się sytuacji, w której musimy każdy na
  swój sposób reagować na ostrzeżenia, sygnały, syreny alarmowe Uruchomienie syreny
  alarmowej oznacza zagrożenie i konieczność stosowania się do obowiązujących procedur,
  opisanych m.in. w specjalnym „Poradniku bezpieczeństwa”. Już dwukrotnie aktualizowaliśmy
  procedury dotyczące informowania społeczeństwa i tym razem pewnie też zdecydujemy
  się na taki krok, by być jeszcze lepiej przygotowanym. Tego typu sytuacje będą się
  zdarzały i musimy być na nie przygotowani Od wielu miesięcy prowadzone są również
  szkolenia dla ludności dotyczące właściwego reagowania w takich sytuacjach. Wprowadziliśmy
  wiele zmian w systemie informacji, zabezpieczenia i podnoszenia poziomu alarmowego.
  Najpierw pojawiła się informacja o uruchomieniu systemów ochrony powietrznej. Tego
  nie było, dopóki nasz rząd nie wprowadził takich zmian - mówił Minister Władysław
  Kosiniak-Kamysz. W trakcie incydentu nie zostały wysłane SMS-y z alertem RCB – systemy
  alarmowe są szybsze. Rzeczywiście trzeba SMS-y wykorzystywać nie tylko do informowania,
  że jest zagrożenie, ale musimy wprowadzić bezwzględnie zasady, że po odwołaniu zagrożenia
  trzeba wysłać uspokajające SMS-y do ludzi System komunikacji za pośrednictwem RCB
  jest stale udoskonalany. Procedury są na bieżąco aktualizowane, a po każdej takiej
  sytuacji wyciągane są wnioski. Rząd będzie pracował nad ich dalszym usprawnianiem.
