title: Most w Głuchołazach otwarty!
text: Dziś w Głuchołazach został otwarty nowy most, który zastąpi przeprawę zniszczoną
  podczas powodzi we wrześniu 2024 r. Na stałe połączy on dwie części miasta i przywróci
  ciągłość drogi krajowej nr 40. Głuchołazy były w centrum zainteresowania całej Polski.
  Walka o most – wtedy przegrana, bo woda okazała się silniejsza – ale też dramat
  setek mieszkańców – to wszystko kazało nam jeszcze poważniej podejść do kwestii
  pomocy dla terenów popowodziowych - powiedział Premier Donald Tusk podczas otwarcia
  mostu w Głuchołazach. Dzięki zasobom Rządowej Agencji Rezerw Materiałowych oraz
  zaangażowaniu wojska bardzo szybko został wybudowany most tymczasowy. Wyzwaniem
  było wybudowanie go na nowo. Most, który dziś otwieramy jest przykładem odbudowy
  plus. Jest nowoczesny i odporny na wielką wodę - powiedział Minister Spraw Wewnętrznych
  i Administracji Marcin Kierwiński. Nowa przeprawa mostowa jest dużo lepiej przygotowana
  na ewentualną powódź. Powstał nowoczesny obiekt, zaprojektowany z uwzględnieniem
  doświadczeń z katastrofalnej powodzi, dzięki czemu jest znacznie bardziej odporny
  na ekstremalne zjawiska hydrologiczne. Usprawni nie tylko codzienne podróże i ruch
  transgraniczny z Czechami, ale także zwiększy bezpieczeństwo mieszkańców oraz stworzy
  lepsze warunki dla rozwoju gospodarczego i turystycznego całego regionu - powiedział
  Minister Infrastruktury Dariusz Klimczak. Konstrukcja obiektu jest położona o niemal
  metr wyżej w porównaniu do starego „mostu Andrzeja”. Oba końce przęsła opierają
  się na masywnych przyczółkach, które przenoszą ciężar na podłoże za umocnieniem
  wałów koryta rzeki. Budowa mostu oraz całej infrastruktury technicznej kosztowała
  łącznie 65 mln zł. Takie miejscowości, jak Głuchołazy zasługują na dobrą infrastrukturę,
  by przyciągały ludzi, turystów i dawały poczucie bezpieczeństwa - powiedział Minister
  Koordynator Służb Specjalnych Tomasz Siemoniak. Prace w Głuchołazach będą jeszcze
  trwały. W planach jest m.in. remont mostu Świętego Wojciecha i prace na terenach
  rekreacyjnych oraz w kompleksie sportowym opiewające na prawie 50 mln złotych. W
  sumie na pomoc po powodzi rząd przeznaczył 11 mld zł – najwięcej w historii. Ponad
  miliard złotych z tej kwoty trafił w formie bezpośrednich zasiłków do 62 tys. rodzin. 
  Wsparcie państwa objęło prawie 30 różnych instrumentów – od dotacji na infrastrukturę
  po zasiłki bezpośrednie dla mieszkańców. Uparliśmy się, żeby przekazać maksymalną
  możliwą kwotę pieniędzy na pomoc w Głuchołazach. To jest ponad 360 mln złotych tylko
  w tym mieście – na pomoc doraźną, jak i budowę mostu, szkoły, żłobka czy pływalni
  miejskiej. Nie mam żadnych wątpliwości, że szkody jeszcze są widoczne. My na tym
  nie kończymy pomocy Rządowe wsparcie w związku z powodzią popłynęło też do innych
  miejscowości, m.in. Lądka Zdroju, Stronia Śląskiego czy Barda. Ponad 6 mld zł z
  całej kwoty pomocy stanowią środki pozyskane z Funduszy Europejskich.
