title: Przeciwdziałanie przemocy wymaga współpracy państwa, szkół i rodziców
text: 'Premier Donald Tusk już w czwartek podjął decyzję o zwiększeniu liczby patroli
  Policji i wprowadzeniu kontroli na terenie placówek oświatowych. Głównym celem było,
  aby w każdej szkole mieli świadomość tego, że reakcja będzie szybka, natychmiastowa.
  Dzięki temu zaangażowaniu w piątek 40 tys. policjantów dbało o bezpieczeństwo –
  powiedział szef rządu podczas odprawy z ministrami i przedstawicielami służb. Przeprowadzono
  ok. 65 tys. kontroli, zatrzymano 117 osób, głównie w wieku 13-19 lat, m.in. za groźby
  karalne i posiadanie niebezpiecznych narzędzi. Dziś bezpieczeństwa w szkołach pilnuje
  10 tys. policjantów. Kontrole będą prowadzone tak długo, jak będzie to konieczne.
  Nie odnotowujemy wzrostu ryzyk, ale zdajemy sobie sprawę, że w takiej atmosferze
  komuś może przyjść do głowy spontanicznie jakiś niebezpieczny pomysł. Będziemy jeszcze
  w najbliższych dniach intensywnie monitorować zarówno sieć, jak i szkoły pod tym
  kątem Od czwartku służby odpowiedzialne za bezpieczeństwo w internecie działają
  w trybie alarmowym. Monitorują publikowane treści dotyczące m.in. naśladownictwa
  ataków i zainteresowania subkulturami związanymi z grupami zbrodniczymi. Niepokojące
  komunikaty zgłaszane są bezpośrednio Policji. Natychmiast zablokowane zostały konta
  gloryfikujące sprawcę ataku na szkołę podstawową w powiecie wyszkowskim. Możemy
  wyodrębnić trzy grupy osób, które obserwujmy. Pierwsza grupa to osoby o wyraźniej
  fascynacji przemocą, także ideologią faszystowską. Druga grupa to osoby zafascynowane
  światem gier komputerowych i czerpiące z tego świata inspiracje do tego co robią.
  Trzecia grupa to osoby, które zostały „uruchomione” w związku z tym, że o temacie
  jest głośno - mówił Minister Spraw Wewnętrznych i Administracji Marcin Kierwiński.
  W ostatnich dniach doszło do kilku niebezpiecznych zdarzeń w szkołach: w Leszczydole-Nowinach
  w powiecie wyszkowskim 15-latek śmiertelnie ranił pracownicę szkoły i zranił trzy
  inne osoby, w Ostrołęce 19-letni uczeń przyniósł do placówki ostre przedmioty i
  zaatakował osiem osób, a w Sierpcu zatrzymano 17-latka podejrzewanego o grożenie
  atakiem na szkołę. Premier Donald Tusk poinformował, że ostatnie zdarzenia w szkołach
  nie są elementem zorganizowanej akcji na dużą skalę, lecz wynikają ze spontanicznych
  działań inspirowanych aktywnością w internecie. Odnotowujemy w ostatnim czasie zarówno
  w Polsce, jak i na całym świecie, wzrost fascynacji przemocą. To już ma nawet swój
  termin w służbach w Stanach Zjednoczonych i w Europie – „przemoc dla przemocy”,
  czyli nihilistyczna przemoc, niezwiązana z poglądami czy politycznymi zamiarami.
  Mamy do czynienia z bardzo ponurą modą na przemoc Niepokojącym zjawiskiem jest rosnąca
  fascynacja młodych ludzi przemocą, ideologią nazistowską oraz postaciami masowych
  zabójców, którzy stają się internetowymi idolami. Współpraca międzynarodowa, współpraca
  z innymi służbami, kwestie radykalizacji, w różnych państwach są przedmiotem współpracy,
  wymiany doświadczeń, wymiany informacji. To jest niestety, jeśli chodzi o kult przemocy,
  tendencja światowa - mówił Koordynator Służb Specjalnych, Minister Tomasz Siemoniak.
  Państwo podejmuje bieżące działania, ale kluczowe jest także uświadamianie młodym
  ludziom zagrożeń związanych z aktywnością w internecie. Chcę powiedzieć, że jest
  pozytywny aspekt tego wzmożenia niektórych młodych ludzi fascynacją przemocą i tych
  zdarzeń, które mieliśmy w ostatnich dniach w Polsce. Pozytywny, dlatego, że w bardzo
  wielu miejscach mamy sygnały, że rodzicie włączają się w akcje kontrolowania tego,
  czym interesują się ich dzieci w sieci Dziś potrzebne są wspólne działania całego
  społeczeństwa, by pokazać młodym ludziom, że uczestnictwo w tego rodzaju internetowych
  społecznościach może prowadzić do poważnych konsekwencji. Dobrze sobie zdać sprawę,
  że nawet wygłupy, straszenie się dla zabawy, ono też powoduje realne zagrożenie.
  Angażuje nas wszystkich niepotrzebnie w przeciwdziałanie. Szerzenie tego typu informacji
  i fascynacji prędzej czy później zawsze trafia na podatny grunt. Dla 99% to są tylko
  dowcipy, ale zawsze na końcu gdzieś może trafić się ktoś, kto wyciągnie z tego najgorsze
  wnioski i będzie autorem jakiejś przemocy Premier zapowiedział stałe i skoordynowane
  działania rządu oraz służb, podkreślając, że nie mogą one ograniczać się do reakcji
  na pojedyncze incydenty. W czwartek Sejm przyjął rządową ustawę o bezpieczeństwie
  w internecie, która umożliwia m.in. blokowanie treści promujących śmierć lub samobójstwo.
  Ustawa będzie procedowana w trybie nadzwyczajnym, a jej przyjęcie przez Senat planowane
  jest jeszcze w tym tygodniu. Do końca tego tygodnia [ustawa] będzie na biurku u
  pana Prezydenta z jasnym oczekiwaniem, że ustawa o bezpieczeństwie w internecie,
  całość przepisów, które dają szansę, że możemy walczyć z mową nienawiści, różnego
  rodzaju treściami patologicznymi, zostanie szybko przyjęta i będziemy mogli ją wdrażać
  - powiedział Minister Cyfryzacji Krzysztof Gawkowski. Platformy społecznościowe
  muszą szybciej usuwać niebezpieczne treści. Bez zdecydowanych działań trudno będzie
  skutecznie wspierać rodziców w całej Polsce. Zdaniem krytyków jest to cenzurowanie
  internetu. Mam gorący apel do wszystkich zaangażowanych w debatę publiczną, żeby
  nie mieszać dwóch porządków. Wolność słowa nie ma nic wspólnego z szerzeniem agresji,
  pogardy, nienawiści. Wolność słowa musi też mieć swoje granice Premier przestrzegł
  również przed debatą o swobodnym dostępie do broni. Połączenie fascynacji przemocą
  i gotowości do gróźb lub popełniania przestępstw z łatwym dostępem do broni prowadzi
  do masowych tragedii na świecie. Polska nie mierzy się z takim zjawiskiem na podobną
  skalę – ważne jest, by ten stan utrzymać. W czwartek wydano rekomendacje dotyczące
  edukacji i szkoleń w zakresie bezpieczeństwa w sieci. W najbliższych tygodniach
  NASK dwukrotnie zwiększy liczbę edukatorów zajmujących się tą tematyką. Wsparciem
  państwa objęci są również nauczyciele i dyrektorzy szkół. W ramach naszych działań
  w poniedziałek zostanie upowszechniona instrukcja reagowania na atak z użyciem niebezpiecznego
  narzędzia. Te materiały zostały przygotowane we współpracy z MSWiA, MON, RCB oraz
  ABW. To jest instrukcja dla dyrektorów i nauczycieli - zapowiedziała Wiceminister
  Edukacji Paulina Piechna-Więckiewicz. Ministerstwo Zdrowia uruchamia z kolei program
  webinarów dla dzieci i młodzieży, nauczycieli oraz rodziców, przygotowany wspólnie
  przez konsultantów krajowych i wojewódzkich w dziedzinie psychiatrii dorosłych oraz
  psychiatrii dzieci i młodzieży. Od piątku rozszerzona również została działalność
  telefonu 800 100 100, dającego wsparcie nauczycielom i rodzicom. Przypominam również
  o telefonie zaufania dla dzieci i młodzieży, który jest dostępny całodobowo - mówił
  Tomasz Maciejewski, Wiceminister Zdrowia. Z kolei ABW analizuje możliwe obce wpływy
  i próby wykorzystania wojny informacyjnej przeciwko Polsce. Dotychczasowa analiza
  wydarzeń z ubiegłego tygodnia nie potwierdziła inspiracji ze strony obcego państwa.
  Nie można jednak wykluczyć, że narastające napięcia społeczne zostaną wykorzystane
  do destabilizacji państwa.'
