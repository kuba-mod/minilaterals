title: Bezpieczeństwo Polski zależy od siły armii i sprawności państwa
text: Akademia Sztuki Wojennej kształci przyszłych dowódców, oficerów i specjalistów
  oraz przygotowuje wojsko i administrację publiczną do skutecznego działania w sytuacjach
  zagrożenia, kryzysu i wojny. Polska patrzy dziś na ludzi w mundurach – tych, którzy
  przygotowują się do obrony Ojczyzny i tych, którzy już teraz jej bronią. Ja patrzę
  na was z nadzieją i pewnością, bo wiem, że nasz dom jest bezpieczny – podkreślił
  Donald Tusk podczas uroczystości w Akademii Sztuki Wojennej. Uczelnia przygotowuje
  kadry, których wiedza, umiejętności i doświadczenie mają kluczowe znaczenie dla
  przyszłości Polski. W Akademii Sztuki Wojennej krzyżują się sposoby myślenia i innowacje,
  które mają fundamentalne znaczenie dla naszego bezpieczeństwa. Już dawno wasze umiejętności
  przestały być abstrakcyjne, ponieważ zagrożenie ze Wschodu jest realne i namacalne
  Od siły polskiej armii, sprawności państwa i jedności społeczeństwa zależą bezpieczeństwo,
  wolność i przyszłość naszego kraju. Akademia uczy, jak współpracować i budować solidarność
  między ludźmi a instytucjami. Bardzo bym chciał, aby stało się to cechą całego polskiego
  państwa Bezpieczeństwo kraju opiera się nie tylko na sile militarnej, ale także
  na zdolności państwa i jego instytucji do sprawnego funkcjonowania w warunkach poważnego
  zagrożenia. Temu służy m.in. wspólny projekt badawczo-wdrożeniowy rządu i Akademii
  Sztuki Wojennej „Kierowanie państwem w warunkach narastania konfliktu zbrojnego
  i wojny”. Bardzo mi zależało na tym, aby cywile, którzy ponoszą odpowiedzialność
  za sprawnie działające państwo w rządzie, brali udział w tym programie. To od Was
  mogą uczyć się praktycznych rozwiązań organizacyjnych i legislacyjnych, które pomogą
  w kierowaniu państwem, szczególnie w chwili zagrożenia Odpowiedzialność za bezpieczeństwo
  naszego kraju spoczywa także na polskiej klasie politycznej. Kieruję te słowa do
  wszystkich polityków w Polsce – chodzi o wypracowanie rozwiązań, które w chwili
  zagrożenia pozwolą wszystkim instytucjom RP działać, jak sprawny i odpowiedzialny
  mechanizm. Polska oczekuje od was odwagi w myśleniu, stawianiu problemów, takich,
  jakimi są Wspólne działanie wojska, administracji i instytucji państwa jest dziś
  jednym z najważniejszych warunków skutecznego reagowania na zagrożenia. Premier
  uczcił także minutą ciszy pamięć o niedawno zmarłym gen. Mirosławie Różańskim, byłym
  Dowódcy Generalnym Rodzajów Sił Zbrojnych i senatorze, który był absolwentem uczelni.
