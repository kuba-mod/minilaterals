title: 'Premier podsumowuje wizytę w Indiach: Polska jest stabilnym i przewidywalnym
  partnerem'
text: Rozmowy z Premierem Narendrą Modim oraz władzami stanowymi jednoznacznie wykazały,
  że dotychczasowy poziom wzajemnych relacji handlowych nie odzwierciedlał potencjału
  obu gospodarek. Zakładane podwojenie wymiany handlowej do 2030 roku, może być dużo
  większe. Zapowiadaliśmy, że naszym ambitnym zamiarem jest podwojenie wymiany handlowej
  z Indiami do 2030 roku. Po moich rozmowach z władzami indyjskimi potwierdzili, że
  to za mało i możemy potroić tę wymianę – podkreślał Premier Donald Tusk podczas
  spotkania z mediami. Rozwój relacji gospodarczych ma opierać się przede wszystkim
  na tworzeniu i realizacji inwestycji w branżach wysokich technologii. Umowy, które
  dzisiaj podpisujemy w Indiach, już niedługo przełożą się na bardzo konkretne wpływy
  eksportowe dla Polski. Jednocześnie budujemy trwałe relacje gospodarcze. Inwestujemy
  i wspólnie się rozwijamy – zaznaczał Minister Finansów i Gospodarki Andrzej Domański.
  Polska jest postrzegana przez władze w Nowym Delhi jako kluczowy, stabilny i w pełni
  przewidywalny partner Unii Europejskiej, zdolny budować mosty technologiczne i gospodarcze
  między Europą a Azją.
