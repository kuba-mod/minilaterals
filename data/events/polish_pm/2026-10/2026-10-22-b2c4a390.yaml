title: Polska i Indie rozwijają współpracę gospodarczą
text: Polska i Indie należą do najszybciej rozwijających się gospodarek Europy i Azji.
  Oba kraje dostrzegają potencjał dalszego zacieśniania współpracy, szczególnie w
  obszarze inwestycji, badań, produkcji i zaawansowanych technologii. Wartość partnerstwa
  strategicznego jest mierzona nie deklaracjami, ale inwestycjami, nowymi technologiami
  oraz stworzonymi miejscami pracy Współpraca Polski i Indii ma przekładać się na
  konkretne korzyści gospodarcze, wzmacniać odporność łańcuchów dostaw, zwiększać
  bezpieczeństwo ekonomiczne oraz wspierać rozwój rynku pracy. Polska jest atrakcyjnym
  partnerem dla indyjskiego biznesu. Nasz kraj oferuje nowoczesną infrastrukturę transportową
  i logistyczną, rozwinięty przemysł oraz wysoko wykwalifikowane kadry. Dodatkowym
  atutem jest także położenie Polski. Polska leży w centrum szlaków transportowych
  Europy. Mamy odpowiednią logistykę, infrastrukturę i możemy być atrakcyjnym kierunkiem
  inwestycji dla firm z Indii oraz miejscem, gdzie można rozwijać europejskie łańcuchy
  dostaw W 2025 r. wartość wymiany handlowej między Polską a Indiami wyniosła 6,3
  mld euro. Obie strony dążą do co najmniej podwojenia tego wyniku do 2030 r. Nowe
  możliwości rozwoju współpracy handlowej między Polską a Indiami może otworzyć porozumienie
  o strefie wolnego handlu między Unią Europejską a Indiami. Współpraca z Indiami
  stwarza polskim przedsiębiorcom nowe możliwości rozwoju i wejścia na jeden z największych
  rynków świata. Współpraca naszych krajów powinna koncentrować się na najbardziej
  zaawansowanych sektorach gospodarki. I nieprzypadkowo dzisiaj towarzyszą nam liderzy
  i liderki branży kosmicznej w Polsce, przedsiębiorstwa sektora IT, sektora sztucznej
  inteligencji farmaceutycznego. W tych właśnie sektorach widzimy ogromny potencjał
  współpracy – podkreślił Minister Andrzej Domański, który wziął udział w jednym z
  paneli. Forum gospodarcze w Nowym Delhi, z udziałem Premiera Donalda Tuska, ma sprzyjać
  nawiązywaniu kontaktów i rozwijaniu współpracy między firmami, startupami, instytucjami
  badawczymi i ośrodkami innowacji. Nie obawiajmy się ambitnych celów. Polska i Indie
  mają niezbędne kompetencje, aby współpracować w najbardziej zaawansowanych aspektach
  nowoczesnej gospodarki - od obronności po produkty podwójnego zastosowania i sztuczną
  inteligencję oraz przemysł kosmiczny Polska i Indie dostrzegają duży potencjał współpracy
  w obszarze nowoczesnego przemysłu, technologii cyfrowych, sztucznej inteligencji,
  energetyki, farmacji, sprzętu medycznego, obronności, technologii podwójnego zastosowania
  oraz sektora kosmicznego. Rozwój współpracy w tych dziedzinach może przyczynić się
  do wzrostu wzajemnych inwestycji, zwiększenia eksportu polskich firm oraz rozwoju
  innowacyjnej gospodarki. Dziś w New Dehli Premier Donald Tusk odbył także spotkania
  bilateralne z Premierem Indii Narendrą Modim oraz Ministrem Spraw Zagranicznych
  tego kraju Subrahmanyamem Jaishankarem.
