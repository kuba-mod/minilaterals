title: 'Premier w Wietnamie: Jesteśmy równoprawnymi, zaprzyjaźnionymi partnerami gospodarczymi'
text: 'Premier Donald Tusk i premier Wietnamu Lê Minh Hưng wzięli udział w polsko-wietnamskim
  okrągłym stole biznesowym. W spotkaniu uczestniczyli przedstawiciele administracji
  i przedsiębiorcy z obu krajów, którzy rozmawiali o możliwościach rozwoju wzajemnych
  relacji gospodarczych i skutecznym wykorzystaniu potencjału obu rynków. Nasze partnerstwo
  może przynosić obustronne korzyści, tworzyć miejsca pracy, wzmacniać lokalny przemysł
  i zwiększać dostęp do nowoczesnych technologii - powiedział Donald Tusk podczas
  obrad okrągłego stołu polsko-wietnamskiego biznesu. Wietnam jest obecnie największym
  partnerem handlowym Polski w Azji Południowo-Wschodniej. W 2025 r. wartość wymiany
  handlowej między państwami przekroczyła 8 mld dolarów. Dla polskich przedsiębiorstw
  Wietnam może być bramą do dynamicznie rozwijającego się rynku państw ASEAN (Stowarzyszenia
  Narodów Azji Południowo-Wschodniej), natomiast Polska pozostaje atrakcyjnym miejscem
  do lokowania inwestycji w Unii Europejskiej. Polskę i Wietnam łączy ponad 75 lat
  stosunków dyplomatycznych. Przez dziesięciolecia rozwijaliśmy współpracę naukową,
  edukacyjną i gospodarczą. Wielu wietnamskich specjalistów zdobywało wykształcenie
  na polskich uczelniach, budując trwałe więzi między naszymi społeczeństwami Teraz
  oba kraje wchodzą na nowy poziom relacji. Naszą wspólną ambicją powinno być przejście
  od tradycyjnej wymiany handlowej do głębszej współpracy inwestycyjnej i przemysłowej.
  Polskie firmy mogą wnosić technologie, doświadczenie i kapitał. Wietnamscy partnerzy:
  rozwinięte zaplecze produkcyjne, znajomość rynku oraz możliwości ekspansji regionalnej
  Oba kraje chcą rozwijać współpracę przede wszystkim w obszarze farmacji i ochrony
  zdrowia, sektora obronnego, technologii podwójnego zastosowania oraz nowoczesnych
  technologii, w tym sektora kosmicznego. Dzisiaj Wietnam i Polska chcą współpracować.
  Żadne z naszych państw nie chce zdominować partnera, ani wykorzystać drugiej strony.
  Budujemy synergię, wzajemny szacunek. Jesteśmy równoprawnymi, zaprzyjaźnionymi partnerami
  gospodarczymi Przykładem udanego partnerstwa jest współpraca w branży farmaceutycznej
  oparta na połączeniu polskiego kapitału, technologii i doświadczenia z potencjałem
  wietnamskiego rynku i lokalnych specjalistów. Z kolei współpraca w sektorze obronnym
  może obejmować nie tylko dostawy nowoczesnych rozwiązań, ale też wspólne długoterminowe
  projekty produkcyjne, szkoleniowe i technologiczne. Chciałbym, aby kontakty polityczne
  i wojskowe pomagały tworzyć warunki dla długoterminowych partnerstw między przedsiębiorstwami
  obu państw. Kluczowym słowem jest tu zaufanie. Dobrze wiemy, że nasza broń, infrastruktura
  i narzędzia nigdy nie będą wykorzystane przez Wietnam wobec Polski i przez Polskę
  wobec Wietnamu Coraz większe możliwości otwiera również sektor kosmiczny. Nasze
  przedsiębiorstwa i instytuty badawcze uczestniczą w europejskich projektach kosmicznych,
  dostarczając specjalistyczne komponenty i najlepsze rozwiązania technologiczne Polska
  wspólnie z Wietnamem może też rozwijać rozwiązania w zakresie obserwacji Ziemi,
  analizy danych satelitarnych oraz ich wykorzystania w rolnictwie, gospodarce wodnej,
  ochronie środowiska i zarządzaniu infrastrukturą. Premier Donald Tusk zwrócił uwagę,
  że rozwój współpracy gospodarczej wymaga jednak spełnienia pewnych warunków. Polska
  może być naprawdę szeroko otwartą bramą dla Wietnamu na teren całej Unii Europejskiej.
  Osiągnięcie tych celów wymaga jednak odpowiednich warunków prowadzenia biznesu.
  Duże przedsięwzięcia przemysłowe i technologiczne potrzebują przewidywalnych regulacji,
  przejrzystych procedur, sprawnej certyfikacji oraz dostępu do odpowiednich instrumentów
  finansowania Dzięki dialogowi między rządami Polski i Wietnamu identyfikowane są
  i rozwiązywane obszary utrudniające rozwój inwestycji i wymiany handlowej. Po stronie
  polskiej przedsiębiorców wspierają m.in. instytucje skupione w ramach Team Poland:
  Polska Agencja Inwestycji i Handlu, Bank Gospodarstwa Krajowego, KUKE oraz polskie
  placówki dyplomatyczne.'
