title: 'Premier: Wzajemny szacunek powinien być fundamentem dobrego sojuszu'
text: Premier Donald Tusk odniósł się do słów Sekretarza Wojny USA Pete’a Hegsetha,
  który zakwestionował wkład państw NATO w działania bojowe w Afganistanie. Hegseth
  stwierdził, że realny udział w misji miało pięć państw, a faktycznie walczyły tylko
  dwa, w tym Stany Zjednoczone. Chciałbym, żeby już nigdy więcej nikt nie lekceważył
  wysiłku naszych żołnierzy. Wszędzie tam, gdzie nasi sojusznicy, w tym najbliższy
  sojusznik - Amerykanie, potrzebowali naszego udziału, wszędzie tam polscy żołnierze
  stawali ramię w ramię z nimi. Tak rozumiemy lojalność i zobowiązania sojusznicze
  - powiedział Premier przed posiedzeniem Rady Ministrów. Wzajemny szacunek, niezależnie
  od wielkości, znaczenia i siły państwa, jest fundamentem sojuszu. Polacy zawsze
  pokazywali, że kiedy się na coś umawiamy, to jesteśmy zdolni poświęcić to, co jest
  najcenniejsze Premier zwrócił również uwagę na brak komentarza Prezydenta Karola
  Nawrockiego w sprawie wypowiedzi amerykańskiego wojny USA. W niedzielę ukraiński
  dron przekroczył granicę Litwy i eksplodował w pobliżu granicy litewsko-łotewskiej.
  Rząd Litwy wydał w tej sprawie oświadczenie, a Ukraina przeprosiła za incydent.
  Od wczesnych godzin porannych jestem w stałym kontakcie z Wicepremierem Kosiniakiem-Kamyszem
  ws. incydnetu z dronem. Będę dzisiaj rozmawiał o tej sprawie z Prezydentem Litwy.
  Liczymy na współpracę strony ukraińskiej, aby wyjaśnić, co się stało Szef rządu
  zapowiedział ścisłą współpracę ze stroną litewską w celu wyjaśnienia wszystkich
  okoliczności incydentu. Niezależnie od wyników wyjaśnień, chcę podkreślić bardzo
  mocno, że Polska nie zezwala na prowadzenie operacji na naszym terytorium czy nad
  nim bez wyraźnej zgody państwa polskiego. To się nie zmieni, niezależnie od tego,
  kto te operacje miałby przeprowadzać Wczoraj szef MON polecił Dowódcy Operacyjnemu
  Rodzajów Sił Zbrojnych szczegółową analizę zdarzeń z nocy 17/18 października w rejonie
  granicy z Litwą i granicy polsko-ukraińskiej, z uwzględnieniem danych z systemów
  radarowych w Polsce i krajach sąsiednich. Działania są prowadzone we współpracy
  ze stroną litewską. Premier zdementował również doniesienia medialne o rozmowach
  pokojowych w Oslo z udziałem Polski. To jest jakieś nieporozumienie. W Oslo spotykają
  się „negocjatorzy” ze strony amerykańskiej z Prezydentem Zełenskim. Gospodarzem
  spotkania będzie Premier Norwegii, któremu będzie towarzyszył Prezydent Finlandii.
  Jestem w stałym kontakcie z oboma panami. Jestem też na bieżąco informowany o sytuacji
  Szef rządu zaznaczył, że spotkanie będzie miało charakter konsultacyjny i posłuży
  ocenie możliwości stworzenia warunków do zawarcia rozejmu lub zawieszenia broni.
  Niektóre propozycje i komunikaty z różnych stolic budzą czasami niepokój. Chcielibyśmy,
  żeby cały świat Zachodu był bardziej solidarny i jednolity we wsparciu Ukrainy oraz
  dążył do jak najszybszego rozpoczęcia rozmów pokojowych Szef rządu zapewnił, że
  Polska i Europa będą dążyć do skutecznej ochrony Ukrainy przed rosyjską agresją
  oraz ewentualnymi żądaniami, które mogłyby zagrozić także bezpieczeństwu Polski.
  Rząd na bieżąco monitoruje rozwój sytuacji. Premier Donald Tusk odniósł się również
  do jednego z projektów przyjętych dziś przez Radę Ministrów. Chodzi o nowelizację
  ustawy o pomocy państwa w wychowywaniu dzieci, która dereguluje obecne przepisy.
  Do tej pory trzeba było co roku składać ponowne wnioski o 800+. W tej chwili upraszczamy
  radykalnie tę procedurę – wystarczy jeden wniosek – ten pierwszy, po narodzinach
  dziecka – i automatycznie do 18. roku życia 800+ będzie trafiało na konto rodziny,
  bez potrzeby ponawiania wniosku Obecnie rodzice i opiekunowie muszą co roku składać
  wniosek o świadczenie 800+. Po wejściu w życie nowych przepisów ZUS będzie ustalał
  prawo do świadczenia automatycznie, na podstawie wcześniej przekazanych danych.
  Donald Tusk przypomniał także, że to właśnie rząd Koalicji 15 października zagwarantował
  działanie programu 800+. Nasi poprzednicy wpadli na ideę, żeby zaproponować podwyższenie
  500+ na 800+, ale nie zapewnili finansowania tego projektu. Dlatego zdecydowali
  o tym, że 800+ będzie płacone dopiero od czasu, kiedy my sprawujemy rząd Dzięki
  skutecznym działaniom rządu, w szczególności Ministra Finansów i Gospodarki Andrzeja
  Domańskiego, 800+ stało się faktem.
