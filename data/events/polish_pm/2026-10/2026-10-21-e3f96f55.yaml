title: Nowe możliwości dla krajowego biznesu. Polska wzmacnia relacje z Azją
text: W obliczu dynamicznych zmian geopolitycznych i kształtowania się nowego ładu
  międzynarodowego kluczowe znaczenie ma utrzymywanie stałych relacji z krajami, które
  będą współdecydować o przyszłości globalnego porządku. Bardzo zależy mi na tym,
  żeby Polska była w nieustannym kontakcie z państwami, od których będzie zależała
  przyszłość świata Wizyta w Indiach i Wietnamie wpisuje się w działania na rzecz
  wzmacniania pozycji Polski na arenie międzynarodowej, rozwijania współpracy gospodarczej
  oraz otwierania nowych możliwości dla naszych przedsiębiorców na perspektywicznych
  rynkach azjatyckich. Do Indii i Wietnamu lecimy z przedstawicielami prawie 100 polskich
  firm. Przed nami dwa szczyty gospodarcze oraz spotkania poświęcone przyszłym sukcesom
  polskich firm i szansom naszego eksportu Polska stawia sobie ambitny, a zarazem
  realistyczny cel – podwojenie wymiany handlowej z Indiami do 2030 r. Ważną rolę
  mają tu odegrać polscy przedsiębiorcy, w tym przedstawiciele sektora obronnego.
  Polskie firmy lecą ze mną, by zdobywać rynek indyjski. Nieprzypadkowo stawiamy na
  nasze firmy zbrojeniowe Minister Finansów i Gospodarki Andrzej Domański poinformował,
  że polska delegacja weźmie udział w dwóch forach biznesowych w Indiach – w Nowym
  Delhi oraz Bengaluru, nazywanym indyjską Doliną Krzemową. Wizyta w Indiach wpisuje
  się w pozytywną dynamikę relacji między naszymi krajami. Jedziemy z konkretną misją
  – załatwiać sprawy polskiego biznesu. Na miejscu podpiszemy umowy z indyjskimi partnerami
  Ważnym kierunkiem współpracy pozostaje również Wietnam, z którym Polskę łączą wieloletnie,
  dobre relacje. Kraj ten należy do najbardziej rozwijających się rynków azjatyckich
  i istotnych partnerów gospodarczych Polski w regionie. Wizyta w Hanoi będzie okazją
  do zacieśnienia współpracy, rozwijania relacji handlowych oraz otwierania nowych
  możliwości dla polskich przedsiębiorców.
