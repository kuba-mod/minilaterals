title: Szybka reakcja rządu na przemoc w szkołach. Więcej patroli Policji i ochrona
  młodzieży przed nielegalnymi treściami w internecie
text: W ostatnich dniach doszło do kilku poważnych zdarzeń w szkołach na Mazowszu.
  Wczoraj w Ostrołęce 19-letni uczeń zaatakował osiem osób. Dziś w okolicach Wyszkowa
  15-latek ranił trzech pracowników placówki – jedna osoba zmarła. Wczoraj Policja
  zatrzymała w Sierpcu 17-latka, który groził przeprowadzeniem ataku w szkole. W Sierpcu
  dzięki działaniom policjantów udało się zapobiec nieszczęściu, ale niestety Ostrołęka
  i Wyszków stały się symbolami dramatu i znakami ostrzegawczymi. Do tej pory Polska
  była państwem bardzo bezpiecznym, jeśli chodzi o tego typu akty terroru w szkołach
  Ostatnie wydarzenia wymagają zdecydowanej reakcji państwa. Bez odpowiednich działań
  podobne sytuacje mogą się powtarzać. Obawiamy się ponurego fenomenu naśladownictwa.
  Wpływ na to ma fala przemocy w internecie, ale też różnego rodzaju chellenge oraz
  niezwykła aktywność niektórych mediów w promowaniu przemocy Szef rządu zdecydował
  o zwiększeniu liczby patroli Policji w rejonie wszystkich szkół w Polsce oraz wzmożeniu
  kontroli wewnątrz placówek, aby wzmocnić bezpieczeństwo uczniów i pracowników. Ewentualni
  naśladowcy muszą widzieć, że Policja jest w zasięgu ręki. Nie zapobiegniemy wszystkim
  złym intencjom, ale świadomość, że policjanci w każdej chwili mogą pojawić się w
  placówce, powinna skutecznie odstraszać potencjalnych sprawców Ważne jest także,
  aby w każdej szkole łatwo dostępna była informacja o numerze alarmowym 112 oraz
  telefonie wsparcia dla dzieci i młodzieży – 116 111. Mamy powody sądzić, że agresorzy
  – w tym dzisiejszy zabójca – to także ofiary przemocy psychicznej. Czasami są to
  przypadki przemocy w domu, czasami w szkole. Informacja o dostępnej pomocy psychologa
  pod numerem 116 111 jest bardzo istotna W 2024 r. rząd przywrócił finansowanie telefonu
  wsparcia 116 111. Premier zapowiedział, że w razie potrzeby środki na poprawę funkcjonowania
  tej linii zostaną zwiększone. Negatywne treści publikowane w sieci szczególnie silnie
  oddziałują na osoby młode. Dlatego rząd od dawna działał na rzecz skutecznego ograniczania
  dostępu do nielegalnych materiałów, w tym związanych z przemocą oraz nawołujących
  do nienawiści. Takie rozwiązania przewidywała ustawa wdrażająca unijny akt o usługach
  cyfrowych (DSA), jednak została ona zawetowana przez Prezydenta. Mieliśmy ambitną
  ustawę, która przeszła przez Sejm i Senat. To były twarde przepisy, które miały
  chronić przede wszystkim dzieci i młodzież przed agresją i próbami wykorzystywania
  w internecie. One zostały zablokowane, przez co my dziś nie możemy usuwać takich
  materiałów Chodziło o treści opisane w Kodeksie karnym, takie jak materiały przedstawiające
  przemoc, groźby i nękanie w mediach społecznościowych, treści związane z handlem
  ludźmi, zachęcanie do samobójstw czy samoookaleczenia. Chcieliśmy to wszystko blokować
  jako państwo. Nie możemy tego zrobić, bo mieliśmy weto w imię wolności słowa Dlatego
  obecnie konieczne jest jak najszybsze przyjęcie rozwiązań, które pozwolą państwu
  szybko reagować na zagrożenia i chronić dzieci, uczniów oraz nauczycieli. Jeszcze
  dziś Sejm zajmie się przepisami umożliwiającymi szybkie blokowanie nielegalnych
  treści w internecie.
