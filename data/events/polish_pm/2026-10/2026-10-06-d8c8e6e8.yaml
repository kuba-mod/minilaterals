title: Ponad 100 mld zł na ochronę ludności i obronę cywilną
text: Rada Ministrów przyjęła Program Ochrony Ludności i Obrony Cywilnej na lata 2027–2031.
  Ponad 102,4 mld zł w formie inwestycji trafi m.in. na miejsca schronienia, budowę
  systemów ostrzegania i bezpiecznej łączności, zapewnienie ciągłości dostaw wody
  i energii, a także na zakup sprzętu ratowniczego i medycznego. To wszystko w ciągu
  5 lat. Jestem przekonany, że w trakcie realizowania tych projektów wszyscy Polacy
  poczują, że stajemy się z miesiąca na miesiąc miejscem bezpieczniejszym, nawet w
  sytuacjach krytycznych – powiedział Premier Donald Tusk przed posiedzeniem Rady
  Ministrów. Jednym z kluczowych obszarów programu będą inwestycje w systemy ostrzegania,
  bezpieczną łączność i cyberbezpieczeństwo. Chodzi m.in. o zapewnienie sprawnej komunikacji
  między państwem, samorządami, służbami i innymi podmiotami odpowiedzialnymi za bezpieczeństwo.
  Program zakłada także rozwój systemów wykrywania, ostrzegania i alarmowania oraz
  wymiany informacji. Szczególnie za wschodnią granicą widać, jak we współczesnych
  konfliktach kluczową rolę odgrywa informacja i łączność. Bez tego nie ma się szans
  w konfrontacji z agresją W ramach programu ok. 30 mld zł zostanie przeznaczone do
  dyspozycji samorządów. Pozwoli to dostosować inwestycje do potrzeb konkretnych regionów
  i lokalnych zagrożeń. Samorządy będą miały głos współdecydujący o tym, jakiego typu
  inwestycje - czy to jest schron, czy to jest remiza czy to kwestia telekomunikacji
  - są najbardziej potrzebne Nowy Program jest kontynuacją działań prowadzonych w
  latach 2025–2026. Ma przede wszystkim rozwijać infrastrukturę i zasoby, które pozwolą
  zapewnić ciągłość działania i podstawowych usług w sytuacjach kryzysowych, w tym
  podczas konfliktu zbrojnego. Rząd przyjął także uchwałę w sprawie ustanowienia wieloletniego
  programu, dzięki któremu powstanie nowy odcinek Pomorskiej Kolei Metropolitalnej
  między Gdańskiem Śródmieściem a węzłem Kowale. Inwestycja poprawi połączenia południowych
  dzielnic Gdańska z centrum miasta. Cieszę się z podjęcia decyzji o rozbudowie kolei
  metropolitalnej w Trójmieście. Długo nad tym pracowaliśmy, ale byliśmy zdeterminowani,
  żeby umożliwić połączenie dalszych dzielnic ze śródmieściem Szacunkowy koszt inwestycji
  to ok. 2,3 mld zł. Nowa linia będzie połączona z innymi środkami transportu. Węzły
  przesiadkowe umożliwią wygodne przesiadki między pociągami, tramwajami i autobusami.
  Planowany termin uruchomienia trasy to 2030 r.
