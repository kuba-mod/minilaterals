title: Bezpieczeństwo dzieci bez kompromisów. Policja, szkoły i administracja kontynuują
  działania
text: Od czterech dni policjanci patrolują szkoły i ich okolice, zwiększając poczucie
  bezpieczeństwa wśród rodziców, uczniów i nauczycieli. Zwróciłem się do Ministra
  Spraw Wewnętrznych i Administracji o kontynuowanie działań Policji, które będą trwały,
  dopóki będziemy obserwować sytuacje budzące niepokój Szkoły pozostaną objęte szczególnym
  nadzorem, aby zapewnić bezpieczeństwo uczniom i pracownikom. W kwestii bezpieczeństwa
  dzieci w Polsce nie ma kompromisów ani żadnych negocjacji. Będziemy podejmować wszystkie
  niezbędne działania, aby zapewnić im bezpieczeństwo Minister Spraw Wewnętrznych
  i Administracji poinformował, że w patrolowaniu szkół i ich okolic uczestniczy ok.
  20 tys. funkcjonariuszy. W ostatnich dniach Policja skontrolowała ok. 80 tys. placówek.
  Dziś zatrzymano kolejnych 18 osób. Łącznie jest to już 135 osób Rząd jest także
  gotowy do wprowadzenia przepisów zwiększających bezpieczeństwo w szkołach. Rozszerzymy
  uprawnienia dyrektorów szkół i placówek w sytuacjach zagrażających bezpieczeństwu
  oraz wzmocnimy kontrolę dostępu do budynków szkolnych. Przepisy muszą być twarde,
  bo szkoły muszą być bezpieczne – wyjaśniła Minister Edukacji Barbara Nowacka. Działania
  rządu doprowadziły również do znacznego ograniczenia liczby ryzykownych sytuacji
  w sieci. Na piątek zwołałem nadzwyczajne spotkanie z przedstawicielami największych
  platform cyfrowych, podczas którego przedstawię wyniki naszego monitoringu i poproszę
  o wdrożenie działań oraz jak najszybsze usuwanie niebezpiecznych treści – poinformował
  Minister Cyfryzacji Krzysztof Gawkowski. Monitoring sieci trwa 24 godziny na dobę.
  W ostatnich godzinach obserwowane było szerzenie dezinformacji i aktywność rosyjskich
  botów. Wczoraj uruchomiliśmy specjalne działania mające na celu przeciwdziałanie
  i usuwanie takich materiałów Minister zdrowia Jolanta Sobierańska-Grenda poinformowała,
  że cały czas działają dwie infolinie wsparcia – dla dzieci i młodzieży oraz dla
  dorosłych. Od piątku liczba zgłoszeń wzrosła o 40%, jednak obecnie sytuacja zaczyna
  się stabilizować. Jak dodała, konsultanci specjalizujący się w psychiatrii będą
  prowadzić webinary dla nauczycieli, aby zapewnić im merytoryczne wsparcie w reagowaniu
  w sytuacjach zagrożenia.
