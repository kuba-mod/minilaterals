title: Polska i Litwa mówią jednym głosem w sprawie bezpieczeństwa Europy
text: Polska i Litwa opowiadają się za zdecydowaną odpowiedzią na rosyjskie zagrożenie
  i dalszym wzmacnianiem bezpieczeństwa Europy. Nasze rozmowy potwierdzają, że w najważniejszych
  kwestiach geopolitycznych – dotyczących wojny w Ukrainie, jedności UE i NATO, a
  także dobrych relacji transatlantyckich – nasze kraje mają wspólne stanowiska –
  podkreślił Donald Tusk po spotkaniu z Mindaugasem Sinkevičiusem. Współpraca Warszawy
  i Wilna ma kluczowe znaczenie dla wzmacniania wschodniej flanki NATO i UE. Litwa,
  podobnie jak Łotwa, Estonia, Finlandia i Polska, odgrywa decydującą rolę w zapewnianiu
  bezpieczeństwa regionu, szczególnie w obliczu zagrożenia ze strony Moskwy. Litwa
  okazała się państwem, które natychmiast zareagowało na polską propozycję wspólnego
  budowania bezpiecznej granicy. Nie może być ona dziurawą flanką. Zainwestowaliśmy
  miliardy w bezpieczną granicę z Rosją i Białorusią, ale nie przyniosłoby to efektów,
  gdyby nie wysiłek Wilna Polska i Litwa opowiadają się również za zaostrzeniem sankcji
  wobec Rosji, podkreślając znaczenie utrzymania presji na Moskwę w odpowiedzi na
  jej agresję przeciwko Ukrainie. Jestem przekonany, że w Brukseli będziemy prezentowali
  wspólne stanowisko, jeśli chodzi o kwestie sankcji wobec Rosji. Będę proponował,
  aby w żadnym wypadku Europa nie rezygnowała ze swoich narzędzi nacisku. To jest
  moment, kiedy powinniśmy się zastanowić nad wzmocnieniem, a nie osłabieniem sankcji
  Ważnym obszarem współpracy Warszawy i Wilna pozostaje bezpieczeństwo energetyczne.
  Wspólne działania w tym zakresie wzmacniają odporność naszych państw i przyczyniają
  się do stabilności regionu. Mamy bardzo dobrą współpracę energetyczną, co potwierdziliśmy
  ostatnio konkretnymi działaniami i odpowiednimi decyzjami naszych ministrów. Wiemy,
  jak ważne jest dziś zabezpieczenie naszych narodów, państw, miast i fabryk pod względem
  energetycznym. Współpraca polsko-litewska jest w tym zakresie wzorcowa Na bardzo
  dobre stosunki polsko-litewskie zwrócił uwagę Premier Litwy Mindaugas Sinkevičius.
  Litwę i Polskę łączą nie tylko sąsiedztwo czy wspólne interesy. Łączy nas strategiczne
  partnerstwo, które jest dziś ważniejsze niż kiedykolwiek wcześniej Mindaugas Sinkevičius
  poinformował, że tematem rozmów były także kwestie gospodarcze. Polska i Litwa wspólnie
  realizują projekty infrastrukturalne, które będą korzystne dla naszych przedsiębiorców
  i państw. Podczas konferencji prasowej Premier Donald Tusk poinformował o kolejnych
  zatrzymaniach będących efektem współpracy polskich i niemieckich służb. Zatrzymano
  dwóch obywateli Turcji, którzy – jak wskazują dotychczasowe ustalenia – mieli na
  zlecenie Rosji dokonać podpalenia stacji Starlink na Mazowszu. Stacja odgrywa istotną
  rolę w zapewnianiu łączności, również na potrzeby Ukrainy. Polska współfinansuje
  utrzymanie dostępu Kijowa do usług Starlink. Zatrzymani zostaną przekazani do naszego
  kraju, gdzie odpowiedzą przed polskim wymiarem sprawiedliwości.
