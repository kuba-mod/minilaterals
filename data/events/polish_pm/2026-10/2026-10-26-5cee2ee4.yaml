title: Nowy rozdział w relacjach Polski i Wietnamu. Szanse dla biznesu, obronności
  i eksportu
text: Wietnam jest dla Polski jednym z głównych partnerów gospodarczych na kontynencie
  azjatyckim. Dlatego Warszawa i Hanoi podjęły decyzję o podniesieniu wzajemnych relacji
  do rangi partnerstwa strategicznego. Premier Wietnamu zapewnił mnie, że realizacja
  tego partnerstwa będzie pod jego osobistą opieką oraz zagwarantował, że rynek wietnamski
  będzie możliwie szeroko otwarty dla polskich firm – poinformował Donald Tusk po
  spotkaniu z szefem wietnamskiego rządu Lê Minh Hưngiem. Nasze kraje mają potencjał,
  by rozwijać wzajemne relacje z korzyścią dla obu narodów i gospodarek. W historii
  naszych stosunków z Wietnamem jest wiele pięknych kart oraz wzajemnej sympatii,
  którą zachowujemy niezależnie od zmieniających się uwarunkowań w naszych krajach
  i na świecie Ważnym elementem łączącym oba kraje jest również liczna społeczność
  wietnamska mieszkająca w Polsce. Podniesienie relacji polsko-wietnamskich do rangi
  partnerstwa strategicznego ma przełożyć się na konkretne wspólne inicjatywy i nowe
  możliwości gospodarcze. Sektory, którymi najbardziej zainteresowana jest strona
  wietnamska, a w których my mamy naprawdę coś do zaoferowania, to przemysł zbrojeniowy,
  współpraca satelitarna i kosmiczna, farmaceutyki oraz żywność, w tym przede wszystkim
  nabiał Dotychczasowa obecność polskiego kapitału w Wietnamie pokazuje, że oba kraje
  mają potencjał do budowania długoterminowych, wzajemnie korzystnych partnerstw gospodarczych.
  Nowe możliwości dla polskich przedsiębiorców stwarza także umowa o wolnym handlu
  między Unią Europejską a Wietnamem. Podczas moich rozmów padły słowa, że Polska
  jest Wietnamem Europy, a Wietnam Polską Azji Szczególne wrażenie na wietnamskich
  partnerach robi skala naszej gospodarki. Dzisiejsze PKB Polski dorównuje łącznej
  wartości PKB Rumunii, Bułgarii, Mołdawii, Ukrainy, Białorusi, Litwy, Łotwy i Estonii.
  Podczas wizyty szefa polskiego rządu w Wietnamie podpisane zostały umowy sektorowe,
  w tym dotyczące współpracy stypendialnej oraz turystycznej. Omówiliśmy perspektywę
  wprowadzenia dalszych ułatwień wizowych dla obywateli Polski, po tym, jak rok temu
  zniesiono obowiązek wizowy dla polskich turystów Wietnam, jako jeden z naszych najważniejszych
  partnerów w Azji, przyciąga także coraz większe zainteresowanie polskich przedsiębiorców
  i przedstawicieli środowisk naukowych.  Dlatego dodatkowym impulsem do rozwoju wzajemnych
  kontaktów będzie planowane na pierwszy kwartał 2027 roku uruchomienie bezpośredniego
  połączenia lotniczego Warszawa-Hanoi przez PLL LOT. Jednocześnie Premier Donald
  Tusk ponowił apel do Prezydenta Karola Nawrockiego w sprawie nominacji ambasadorskich.
  Polska odgrywa istotną rolę w relacjach z Wietnamem, a brak formalnego zatwierdzenia
  nominacji utrudnia pracę polskiej ambasador w porównaniu z jej europejskimi odpowiednikami.
  W Hanoi podpisane zostało porozumienie między Ministrem Nauki i Szkolnictwa Wyższego
  a Ministerstwem Edukacji i Kształcenia Wietnamu o współpracy w dziedzinie szkolnictwa
  wyższego i badań naukowych oraz Memorandum o porozumieniu między Ministerstwem Sportu
  i Turystyki a Ministerstwem Kultury, Sportu i Turystyki Wietnamu o współpracy w
  dziedzinie turystyki. Wspólne oświadczenie w sprawie ustanowienia partnerstwa strategicznego
