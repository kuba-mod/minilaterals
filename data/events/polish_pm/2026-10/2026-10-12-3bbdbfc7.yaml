title: 'Premier: Nie ma Kaszub bez Polski, nie ma Polski bez Kaszub'
text: Język kaszubski dzięki zaangażowaniu nauczycieli, rodzin, samorządów, organizacji
  społecznych oraz środowisk akademickich nie tylko przetrwał, ale stał się trwałym
  elementem życia społecznego, kulturalnego i edukacyjnego Pomorza i Polski. To, że
  udało nam się zachować język kaszubski jest wielkim wydarzeniem. Chroniąc język,
  chronimy kulturę i tożsamość i bardzo Wam za to dziękuję - powiedział Premier Donald
  Tusk zwracając się do uczestników II Kongresu Nauczycieli Języka Kaszubskiego. Przez
  wiele lat język kaszubski i tożsamość regionalna wymagały szczególnej troski oraz
  zaangażowania wielu środowisk. Dzięki ich determinacji i odwadze nie tylko udało
  się ocalić język przed zapomnieniem, ale stworzyć warunki do jego rozwoju. Regionalizm
  to wielka sprawa. To nie jest tylko na pokaz, tylko głęboka forma patriotyzmu, która
  wynika ze świadomego przywiązania do naszej ziemi i historii Edukacja regionalna
  pomaga młodym ludziom lepiej rozumieć własną historię, tradycję oraz budować poczucie
  zakorzenienia i odpowiedzialności za wspólnotę. Hasło „Moc w języku, siła w ludziach"
  trafia w samo sedno sensu nauczania, sensu dbania o tożsamość, budowania kultury
  i tradycji Kaszub, tak by żyły w sercach młodego pokolenia – powiedziała Ministra
  Edukacji Barbara Nowacka. Rozwój edukacji kaszubskiej jest efektem współpracy nauczycieli,
  samorządów, organizacji społecznych oraz administracji publicznej. Dzięki wspólnym
  działaniom nauczanie języka kaszubskiego stało się trwałym elementem polskiego systemu
  edukacji. Historia Kaszub pokazuje, że przywiązanie do lokalnej tradycji nie stoi
  w sprzeczności z poczuciem odpowiedzialności za państwo. Wręcz przeciwnie – wzmacnia
  je i stanowi ważny fundament nowoczesnego patriotyzmu. Nie ma żadnego konfliktu
  między byciem Kaszëbą, Polakiem i Europejczykiem. To właśnie jest nowoczesny i głęboki
  patriotyzm Łączy on przywiązanie do małych ojczyzn, troskę o własny język, kulturę
  i historię z aktywnym zaangażowaniem na rzecz Polski i Europy. To właśnie takie
  doświadczenie, obecne od pokoleń na Kaszubach, buduje silne wspólnoty i wzmacnia
  państwo. W II Kongresie Nauczycieli Języka Kaszubskiego uczestniczyło około 260
  nauczycieli, samorządowców, przedstawicieli organizacji społecznych oraz środowiska
  akademickiego. Uczestnicy rozmawiali o rozwoju edukacji kaszubskiej, roli samorządów
  w nauczaniu języka regionalnego oraz wymianie dobrych praktyk.
