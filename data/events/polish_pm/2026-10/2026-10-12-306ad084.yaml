title: Polska i Norwegia wzmacniają partnerstwo oparte na wspólnych wartościach
text: Podczas spotkania dwustronnego szefowie rządów podpisali deklarację o strategicznym
  partnerstwie między Rzeczpospolitą Polską a Królestwem Norwegii. To potwierdzenie
  wieloletnich działań na rzecz rozwoju i zacieśniania wzajemnych relacji. Ta deklaracja
  to potwierdzenie naszej ciężkiej pracy na rzecz budowy relacji polsko-norweskich
  – dzisiaj lepszych niż kiedykolwiek w historii. One nigdy nie były złe, ale dzisiaj
  są świadectwem, jak można budować prawdziwą przyjaźń między narodami, państwami
  i rządami na gruncie zarówno wspólnych interesów, jak i wspólnych wartości - powiedział
  Premier Donald Tusk podczas wspólnej konferencji prasowej. Zdaniem Premiera Støre
  współpraca polsko-norweska jest obecnie najbardziej obiecującym kierunkiem norweskiej
  polityki zagranicznej. Miło mi było słyszeć, kiedy powiedziałeś, że relacje polsko-norweskie
  to jest najbardziej obiecujący proces w polityce norweskiej zagranicznej od wielu
  lat i że z nikim tak bardzo nie udało się zintensyfikować współpracy i relacji,
  jak właśnie między Norwegią a Polską. To są ważne słowa - zwrócił się do norweskiego
  Premiera Donald Tusk. Podpisana dziś w Warszawie deklaracja obejmuje ponad 20 obszarów
  współpracy, w tym bezpieczeństwo i obronność, mobilność wojskową, ochronę infrastruktury
  krytycznej, bezpieczeństwo energetyczne, wsparcie dla Ukrainy oraz zacieśnianie
  współpracy między przedsiębiorstwami sektora obronnego. Ważnym elementem deklaracji
  są również relacje gospodarcze i kontakty między społeczeństwami obu państw. Kwestie
  bezpieczeństwa były jednym z najważniejszych tematów rozmów liderów obu państw.
  Mamy wspólny pogląd na sytuację geopolityczną, solidarność między państwami NATO,
  konieczność utrzymania jak najbliższych relacji euroatlantyckich. Europa potrzebuje
  Ameryki, Ameryka potrzebuje Europy Polska i Norwegia, jako państwa sąsiadujące z
  Rosją, dobrze wiedzą, jak ważne jest bezpieczeństwo wschodniej i północnej flanki
  NATO. Premier Norwegii podkreślił szczególne znaczenie inwestycji Europejczyków
  we własne bezpieczeństwo. Chodzi o to, żeby Europa przejmowała większą odpowiedzialność
  za bezpieczeństwo. Musimy inwestować w nie więcej w sposób spójny i konsekwentny,
  by się nie duplikować, ale inwestować w taki sposób, żeby regionalne systemy obronne
  były silniejsze Polskę i Norwegię łączy również to samo stanowisko w kwestii dalszego
  udzielania pomocy Ukrainie. Potrzebujemy dalszych starań dyplomatycznych o natychmiastowe
  przerwanie ognia w Ukrainie. W żadnym wypadku Zachód nie może pokazać słabości w
  relacji z Putinem, ponieważ bezwzględnie to wykorzysta Szef polskiego rządu wskazał,
  że sankcje wobec Rosji powinny być zaostrzane, a nie łagodzone – tak długo, jak
  Moskwa udaremnia próby osiągnięcia pokoju i atakuje ukraińską infrastrukturę energetyczną,
  domy, szkoły i szpitale. Premier Donald Tusk przypomniał również o wsparciu, jakiego
  Norwegia udziela Polsce w ramach Funduszy Norweskich. Jako mieszkaniec Gdańska będę
  miał zawsze w pamięci pomoc norweską. Fundusz Norweski trafia w różne miejsca w
  Polsce, ale w województwie pomorskim i w Gdańsku efekty waszego wsparcia są szczególnie
  widoczne. Cieszę się, że zarówno Ty, jak i Twoi poprzednicy z wielką satysfakcją
  oceniali, jak w Polsce umiemy dobrze wykorzystać te środki i jak bardzo widoczny
  jest ten sukces Polska jest największym beneficjentem norweskich grantów – do naszego
  kraju trafia ok. 25% całej puli środków. W ramach grantów norweskich realizujemy
  wyjątkową współpracę, która różni się od innego rodzaju podobnych programów, gdyż
  oparta jest na ideach wypływających ze strony społeczeństwa obywatelskiego w Polsce.
  (…) Widziałem przykłady, które obejmują dziedzictwo kulturowe, transformację w kierunku
  gospodarki zielonej, sprzęt medyczny Premierzy rozmawiali również o dalszym rozwoju
  współpracy dwustronnej. Mamy ok. 130 tysięcy Polek i Polaków w Norwegii. Pan Premier
  zapewnił mnie, że w tym trudnym czasie, gdzie migracja budzi tak wiele emocji, ich
  obecność jest przez Norwegów jak najlepiej widziana. To jest też ważny znak. My
  również zapraszamy wszystkich Norwegów, którzy dostrzegają, że Polska staje się
  jednym z najbezpieczniejszych i najbogatszych państw w regionie W Polsce działa
  już ponad 400 norweskich firm. Mimo że Norwegia nie należy do Unii Europejskiej,
  oba państwa są zintegrowane w ramach wspólnego rynku.
