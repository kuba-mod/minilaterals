title: 'Premier: Jesteśmy gospodarką, która imponuje światu'
text: Dzisiejsze głosowanie w Sejmie potwierdziło spójność Koalicji 15 października.
  Andrzej Domański nie wymaga obrony. To wyjątkowe wotum nieufności, ponieważ rzadko
  kiedy Polska tak bardzo wyróżniała się na tle wszystkich państw europejskich pod
  względem wskaźników wzrostu gospodarczego – powiedział Premier Donald Tusk w Sejmie.
  Polska nie tylko odnotowuje największy wzrost gospodarczy w Unii Europejskiej, niskie
  bezrobocie i jedną z najniższych inflacji, ale również mimo trudnej sytuacji na
  świecie ceny paliw na polskich stacjach benzynowych należą obecnie do najniższych
  w całej Wspólnocie. Premier podkreślił, że dopóki Koalicja 15 października będzie
  sprawować władzę, dług publiczny będzie utrzymywany pod kontrolą. Obecnie zadłużenie
  Polski pozostaje na poziomie średniej europejskiej, a dług wszystkich dużych europejskich
  gospodarek jest wyższy niż polski – zarówno kwotowo, jak i procentowo. Andrzej Domański
  jest dobrym, wybitnym ministrem, bo udaje mu się – balansując na pewnych ryzykach
  – utrzymywać państwo polskie i stan finansów, jednocześnie wydając dużo pieniędzy
  tam, gdzie jest to potrzebne, czyli dla ludzi potrzebujących i na bezpieczeństwo
  Polski Donald Tusk odniósł się również do raportu Krajowej Administracji Skarbowej,
  który wskazuje na 120 mld zł nieprawidłowości w okresie poprzednich rządów. Podkreślił,
  że Andrzej Domański zastał państwo wymagające pilnej naprawy. Po Waszych rządach
  Andrzej Domański zobaczył Polskę tak, jak mieszkanie po włamaniu złodziei. Czego
  nie ukradli, to zniszczyli Mimo wielu miesięcy pracy nad przywracaniem prawidłowego
  funkcjonowania państwa, Polska jest dziś gospodarką, która imponuje światu. Wiedzieliśmy,
  że ten rok będzie rokiem przełomu, rokiem inwestycji. Obserwatorzy w UE są czasem
  w szoku, jak Polska, taka duża gospodarka, ma ponad 4% wzrostu Sukces gospodarczy
  Polski dostrzegają zarówno jej partnerzy, jak i media zagraniczne i polskie, również
  te na co dzień krytyczne wobec działań rządu. Rząd konsekwentnie wzmacnia bezpieczeństwo
  Polski i podejmuje działania na rzecz wspierania polskich rodzin. Polska jest krajem
  frontowym, a sytuacja geopolityczna pozostaje skomplikowana. Decyzja o przeznaczaniu
  rekordowych środków na obronność była jedną z nielicznych, które zapadły ponad podziałami
  politycznymi. Jeśli dodamy wydatki pośrednio związane z bezpieczeństwem Polski,
  to na obronność de facto wydajemy 7%. Dokładnie tyle, ile wynosi deficyt Rada Ministrów
  przyjęła dziś nowelizację ustawy o pomocy państwa w wychowywaniu dzieci, która dereguluje
  procedurę przyznawania świadczenia 800+. Dziś bardzo uprościliśmy procedurę wniosków
  o 800+. Środki będą przyznawane automatycznie, po złożeniu pierwszego wniosku na
  dziecko i aż do osiągnięcia przez nie 18. roku życia Donald Tusk przypomniał, że
  w 2023 r., będąc jeszcze w opozycji, zapowiedział podniesienie świadczenia 500+
  do 800 zł i apelował do ówczesnego rządu o niezwłoczne zwiększenie wsparcia dla
  polskich rodzin. Zjednoczona Prawicy nie chciała się na to zgodzić. Zmiana nastąpiła
  po objęciu władzy przez Koalicję 15 października. Naszą pierwszą decyzją było zabezpieczenie
  środków finansowych, aby od 1 stycznia 2024 r. 800+ stało się faktem Koalicja 15
  października zrealizowała również m.in. zobowiązanie dotyczące podwyżek wynagrodzeń
  nauczycieli, zwiększając je o 30% w 2024 r. Premier Donald Tusk zwrócił się również
  z apelem do opozycji o współpracę na rzecz rozwoju gospodarczego Polski. Skoro sami
  wiecie, że dostrzegany na całym świecie sukces gospodarczy to nie jest sukces mój
  i nie Domańskiego, tylko Polski – i jeśli on ma być trwały, to wymaga inteligentnej
  i pełnej empatii wobec Polski i Polaków współpracy Premier wezwał również posłów
  opozycji o poparcie rozwiązań ograniczających deficyt i obniżających dług publiczny.
  Nie bawcie się w tę infantylną grę - obniżyć dług, obniżyć deficyt i wydać dwa razy
  więcej. Nie gniewajcie się, ale trzeba być niespełna rozumu albo mieć bardzo złą
  wolę, żeby proponować tego typu recepty Szef rządu zapowiedział również, że złoży
  wniosek do Prezydenta Karola Nawrockiego o powołanie Ministra Andrzeja Domańskiego
  na stanowisko wicepremiera.
