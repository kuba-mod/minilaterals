title: 'Premier po szczycie Rady Europejskiej: Nigdy nie było tak jednolitej postawy
  całej UE w sprawie Ukrainy'
text: 'Jednym z najważniejszych rezultatów szczytu było utrzymanie silnego poparcia
  Unii Europejskiej dla Ukrainy oraz dalszej presji na Rosję. Jeszcze nigdy nie było
  tak jednolitej postawy wszystkich państw Unii Europejskiej w sprawie Ukrainy. Wiele
  państw zdaje sobie sprawę, że jeśli Ukraina upadnie, to wszyscy będziemy mieli poważne
  problemy – powiedział Premier Donald Tusk podczas briefingu prasowego. Przywódcy
  rozmawiali również o zagrożeniach związanych z rosyjskimi działaniami hybrydowymi
  i aktami sabotażu. Najbliższe miesiące mogą być kluczowe nie tylko dla przyszłości
  Ukrainy, ale też całej Europy. Dlatego konieczne jest dalsze wzmacnianie europejskich
  zdolności obronnych, zamiast ograniczania wydatków na bezpieczeństwo, czego chciały
  niektóre z krajów. To najgorszy czas, żeby oszczędzać na bezpieczeństwie Europy
  i wierzę, że dotarło to do wielu liderów Polska na co dzień angażuje służby odpowiedzialne
  za bezpieczeństwo granic i przestrzeni powietrznej, a mieszkańcy regionów przygranicznych
  regularnie odczuwają skutki rosyjskich ataków. Polskiemu rządowi udało się też zbudować
  szeroką koalicję państw, dzięki której środki na rolnictwo i politykę spójności
  nie zostaną ograniczone. Pozwoli to na kontynuację ważnych dla obywateli i gospodarki
  inwestycji m.in. rozbudowę dróg, kolei czy rozwój nowych technologii. Rozmawialiśmy
  o europejskim budżecie i cieszę, że utrwaliliśmy to, na czym nam zależy i zbudowaliśmy
  dużą grupę poparcia. Polityka spójności i rolnictwo nie będą zagrożone cięciami
  środków To ważny sygnał dla dalszego finansowania inwestycji rozwojowych oraz wsparcia
  polskiego rolnictwa w kolejnej perspektywie budżetowej. Premier podczas dyskusji
  na temat nowego europejskiego budżetu zapowiedział, że Polska nie zgodzi się na
  zmniejszenie środków na bezpieczeństwo i obronność. Dzięki działaniom Polski rozpoczęty
  zostanie przegląd skutków społecznych i gospodarczych systemu ETS2, w szczególności
  ich wpływu na ceny energii, koszty ogrzewania oraz sytuację gospodarstw domowych
  i przedsiębiorstw. Nie pozwolę, żeby w jakimkolwiek stopniu Polska płaciła za ETS
  2 Przegląd systemu otwiera drogę do dalszych zmian, w tym przesunięcia lub głębokiej
  rewizji rozwiązań, które mogłyby prowadzić do wzrostu kosztów ponoszonych przez
  Polaków. System ETS to „dziedzictwo” po rządzie Mateusza Morawieckiego, który nie
  zablokował niekorzystnych dla Polski rozwiązań. Działania obecnego rządu od początku
  mają na celu przesunięcie i zrewidowanie ETS 2. Coraz więcej państw członkowskich
  wdraża rozwiązania od lat proponowane przez Polskę w zakresie ochrony granic i przeciwdziałania
  nielegalnej migracji. To, co robimy, a więc twarda polityka azylowa, pilnowanie
  granicy, powstrzymywanie nielegalnych imigrantów, staje się powoli, taką - może
  jeszcze nie doktryną europejską - ale większość chciałaby nas naśladować, a część
  naśladuje Polska, obok Danii i Włoch, należy dziś do grona państw opowiadających
  się za skuteczną ochroną granic i wywierających największy wpływ na kształt europejskiej
  polityki migracyjnej. W Brukseli Premier Donald Tusk odbył także szereg spotkań,
  m.in. z Prezydentem Ukrainy Wołodymyrem Zełeńskim oraz z członkami grupy Przyjaciół
  Spójności, którą tworzą: Premierzy Włoch, Łotwy, Słowenii, Grecji, Węgier, Bułgarii,
  Czech, Malty, Portugalii, Estonia oraz Prezydenci Litwy i Rumunii. Uczestniczył
  też w spotkaniu Grupy Wyszehradzkiej.'
