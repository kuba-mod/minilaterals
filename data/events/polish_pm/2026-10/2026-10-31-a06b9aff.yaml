title: 'Orędzie Premiera Donalda Tuska: W Polsce prawo wygra z przemocą'
text: Szanowni Państwo, byliśmy wczoraj świadkami gorszących zdarzeń pod budynkiem
  Trybunału Konstytucyjnego. Bardzo chciałbym, abyśmy podobnych scen nie musieli nigdy
  w Polsce oglądać. Sposobem na spokój nie może być jednak ustępowanie przed bezprawiem
  i przemocą. Demokratyczne państwo musi być silne i zdolne do egzekwowania sprawiedliwości.
  Od wielu godzin obserwujemy z niepokojem tę sytuację. Trudno nam wszystkim zrozumieć,
  o co chodzi przepychającym się grupom polityków i aktywistów z PiS-u i Konfederacji,
  od Brauna po Bąkiewicza. Policja bardzo spokojnie, ale stanowczo reaguje na wszelkie
  przejawy agresji. Atak na Trybunał i jego sędziów jest kolejną odsłoną procesu niszczenia
  rządów prawa w Polsce przez PiS i prezydentów Dudę i Nawrockiego. Podejmowałem wspólnie
  z większością parlamentarną próby naprawienia Trybunału. Nikt nie miał wątpliwości,
  że Trybunał w kształcie, jaki narzucił PiS, nie jest prawdziwym sądem. Tak oceniały
  to instytucje międzynarodowe, polskie autorytety prawnicze, opinia publiczna. Proponowaliśmy
  wszystkim siłom politycznym i obu prezydentom uchwały i ustawy, które umożliwiłyby
  wspólną odbudowę praworządności. Wszystko na nic. Wszystko zablokowane przez prezydenta
  i PiS. Czekaliśmy spokojnie w takim razie na wybór nowych sędziów, aż wygaśnie kadencja
  poprzedników mianowanych przez PiS. Sejm dokonał wyboru. Sędziowie złożyli ślubowanie,
  ale prezydent nie raczył tych ślubowań odebrać. Legalnie wybrani sędziowie byli
  blokowani przez prezesa Święczkowskiego i nie mogli podjąć pracy. A kiedy po wielu
  tygodniach cierpliwego wyczekiwania postanowili podjąć swoje obowiązki, nie czekając
  już dłużej na zmianę stanowiska pana Święczkowskiego, zostali zaatakowani. Chcę
  to bardzo wyraźnie podkreślić. Legalnie wybrani członkowie Trybunału zostali zaatakowani,
  a policja na miejscu chroniła Trybunał przed napastnikami. Żeby rzecz uprościć,
  posłużę się porównaniem. Wyobraźmy sobie sytuację, w której złodziej wydziera starszej
  pani torebkę i ucieka. Kiedy zostaje zatrzymany, zaczyna wrzeszczeć, że stosuje
  się wobec niego przemoc i kradzieżą nazywa to, że próbuje się odebrać mu łup. Z
  kolei niektórzy gapie, symetryści, proponują, aby dla załagodzenia sprawy złodziej
  i ofiara podzielili się po równo zawartością torebki. W pewnych sprawach nie może
  być kompromisu. Wrzask, kłamstwo i bijatyka nie mogą być źródłem prawa w Polsce
  i nie będą. Demokratyczne państwo to najlepszy i najtrudniejszy do utrzymania, niestety,
  system, jaki wymyśliła ludzkość. Jest naszą polską dumą, że demokracja była tym
  pierwszym polskim suwerennym wyborem po odzyskaniu niepodległości. Demokracja jest
  naszą tradycją i źródłem głośnego już na cały świat sukcesu. Dzięki niej rośniemy
  w siłę. Państwo prawa tym różni się od prawa dżungli, że o racji nie decydują mięśnie
  i chamstwo. W państwie prawa sędzia, choćby była to filigranowa kobieta, nie ustępuje
  przed agresywnym osiłkiem. Państwo prawa dba o słabych tak samo jak o silnych. W
  państwie prawa polityk nie może wchodzić na teren sądu czy trybunału i wydawać poleceń
  czy zastraszać sędziów, nawet jeśli jest prezydentem. Państwo prawa nie widzi barw
  partyjnych i nie zna pojęcia bezkarności. Nazywajmy rzeczy po imieniu. Od lat istnieją
  w Polsce organizacje i politycy, którzy demokrację i praworządność chcą zniszczyć.
  Nie jest dzisiaj moim zadaniem oceniać, z jakich powodów to robią. Czy to jest chciwość,
  głupota czy zdrada? W końcu efekt jest ten sam i nie przez przypadek znajdują na
  świecie poparcie wśród sił prorosyjskich, a dzisiaj w tym konflikcie korzystają
  ze wsparcia armii rosyjskich botów w internecie. Ba, doczekali się nawet publicznych
  komplementów od głównego ideologa Kremla. Zbyt długo czekaliśmy na skarb, jakim
  jest niepodległa, demokratyczna Polska, żeby się przestraszyć i ustąpić. Zbyt dobrze
  nam, Polakom, udało się budowanie silnego państwa, żebyśmy mieli je poddać. Jestem
  pewien, że Trybunał Konstytucyjny zacznie działać tak, jak powinien. Niezależnie
  także ode mnie, samorządnie i zgodnie z konstytucją. Zadaniem władzy wykonawczej,
  a więc moim, jest zapewnienie mu bezpieczeństwa i warunków do pracy. I ze swojego
  zadania zamierzam się wywiązać. Polska jest silna, demokratyczna i zdeterminowana.
  Nie zginęła i nie zginie. Dziękuję bardzo.
