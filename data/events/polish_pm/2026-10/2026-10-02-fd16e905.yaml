title: 2. urodziny „babciowego”. Wsparcie dla prawie 680 tys. dzieci
text: 'Program Aktywny Rodzic to pomoc dla rodziców i opiekunów dzieci do ukończenia
  3. roku życia. Został uruchomiony 1 października 2024 r. i obejmuje trzy formy świadczenia,
  które odpowiadają na różne potrzeby rodzin – związane z aktywnością zawodową rodziców,
  opieką żłobkową oraz opieką nad dzieckiem w domu. Jesteśmy bardzo dumni z tego programu.
  W sumie już 680 tys. dzieci w Polsce korzysta z „babciowego”. Mam nadzieję, że dzięki
  temu życie jest trochę lżejsze W ramach programu rodzice mogą skorzystać z jednego
  z trzech świadczeń: „Aktywni rodzice w pracy” – 1500 zł miesięcznie, „Aktywnie w
  żłobku” – do 1500 zł miesięcznie oraz „Aktywnie w domu” – 500 zł miesięcznie. Dzięki
  temu rodziny mogą wybrać formę wsparcia najlepiej odpowiadającą ich sytuacji. Program
  Aktywny Rodzic to także wyraz szacunku i uznania dla roli babć i dziadków w opiece
  nad najmłodszymi. Babciowe” jest metodą podkreślenia, jak ważna jest dla nas rodzina.
  Wszyscy, którzy pomagają w opiece nad najmłodszymi wiedzą, że ten pogram jest próbą
  uhonorowania setek tysięcy babć i dziadków W ramach świadczenia „Aktywni rodzice
  w pracy”, rodzice mogą zawrzeć m.in. z babcią lub dziadkiem umowę uaktywniającą
  dotyczącą opieki nad dzieckiem. W takim przypadku państwo pokrywa część kosztów
  składek na ubezpieczenia społeczne, co pozwala zwiększyć świadczenie emerytalne
  opiekuna. Wiceminister Rodziny, Pracy o Polityki Społecznej Aleksandra Gajewska
  poinformowała, że w ciągu dwóch lat funkcjonowania programu, do rodzin trafiło już
  ponad 11 mld zł. Babciowe” to poczucie bezpieczeństwa i historie osób, które nie
  musiały wybierać między dzieckiem a pracą Program realnie zwiększył dostępność opieki
  nad dziećmi do lat 3. Liczba tzw. białych plam, czyli gmin, w których nie funkcjonuje
  żłobek, zmniejszyła się o połowę. Aktywny Rodzic ma wymiar ogólnokrajowy – stworzyliśmy
  miejsca opieki tam, gdzie nigdy ich nie było. Jesteśmy dumni, że nie tylko w dużych
  miastach, ale także w najmniejszych miejscowościach rodzice i dziadkowie mogą korzystać
  z programu – zaznaczyła Wiceminister Rodziny, Pracy o Polityki Społecznej. Więcej
  miejsc opieki to również większy wybór i łatwiejszy powrót rodziców do aktywności
  zawodowej. W ciągu dwóch lat powstało prawie 67 tys. nowych miejsc opieki dla dzieci
  do lat 3.'
