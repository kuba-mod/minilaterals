title: 'Premier do nauczycieli: Pokazaliście, jak bardzo jesteście oddani swojej misji'
text: 14 października obchodzimy Dzień Edukacji Narodowej, będący wyrazem uznania
  dla pracy nauczycieli i wszystkich osób zaangażowanych w rozwój polskiej oświaty.
  Codzienna praca i profesjonalizm pedagogów mają kluczowe znaczenie dla kształtowania
  kolejnych pokoleń Polaków i budowania przyszłości naszego kraju. Wasz wysiłek przynosi
  kapitalne efekty. Coraz częściej mówi się o Polsce jako miejscu, gdzie rodzą się
  talenty, a poziom wykształcenia młodych ludzi zaskakuje dzisiaj świat. Bardzo młodzi
  Polacy nie tylko wygrywają olimpiady, ale stają się na przykład czołowymi kreatorami
  najnowocześniejszych przestrzeni życia i technologii – to wszystko jest głównie
  Waszą zasługą – zwrócił się Premier do nauczycieli i nauczycielek z okazji Dnia
  Edukacji Narodowej. W ostatnim czasie coraz większym wyzwaniem dla polskich szkół
  staje się wzrost agresji wśród młodych ludzi, choć dzięki zaangażowaniu i poświęceniu
  pedagogów skala tego zjawiska w naszym kraju pozostaje mniejsza niż w większości
  państw. Nauczyciele na co dzień mierzą się z tym problemem, bezpośrednio doświadczając
  jego konsekwencji w pracy z uczniami. Chciałem Wam bardzo podziękować, że to wytrzymujecie
  nerwowo. Tylko dzięki świetnej współpracy pedagogów i policjantów udało się tę sytuację
  bardzo szybko opanować. Co nie znaczy zakończyć, bo nie mamy pełnego wpływu na cywilizacyjne,
  ponure zmiany. W tych krytycznych dniach pokazaliście, jak bardzo jesteście oddani
  swojej misji W obecnej, wymagającej sytuacji geopolitycznej szczególnego znaczenia
  nabiera kształtowanie od najmłodszych lat przywiązania do państwa, języka i tradycji
  oraz budowanie postaw opartych na wzajemnym szacunku, w czym kluczową rolę odgrywają
  nauczyciele. W uroczystości wzięli udział odznaczeni nauczyciele, a także posłowie,
  senatorowie, kuratorzy oświaty, dyrekcja jednostek podległych i nadzorowanych przez
  MEN oraz przedstawiciele oświatowych związków zawodowych. Nauczycielom zasłużonym
  dla polskiej oświaty zostały wręczone odznaczenia państwowe, medale Komisji Edukacji
  Narodowej, nagrody Ministra Edukacji, a także tytuły honorowe Profesora Oświaty.
