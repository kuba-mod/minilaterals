title: Nowe perspektywy dla polsko-indyjskiego partnerstwa technologicznego
text: Premier Donald Tusk wziął udział w polsko-indyjskim forum biznesowym w Bengaluru
  – indyjskiej „Dolinie Krzemowej”. W centrum rozmów znalazły się perspektywiczne
  obszary współpracy gospodarczej, w tym technologie cyfrowe, sztuczna inteligencja
  oraz sektor lotniczo-kosmiczny. Bengaluru to globalny hub dla technologii obliczeniowych,
  badań, innowacji. Mieści się tutaj wiele firm technologicznych, dynamiczne startupy
  oraz Indyjska Organizacja Badań Kosmicznych. To miejsce pokazuje, jak inwestycje
  w ludzi, w wiedzę, w przedsiębiorczość mogą zmienić sytuację całej gospodarki -
  powiedział Premier Donald Tusk w wystąpieniu otwierającym część plenarną seminarium.
  Wielką transformację gospodarczą przeszła również Polska. Dzisiaj jesteśmy nowoczesną,
  uprzemysłowioną gospodarką, ale również ważnym europejskim centrum dla technologii
  teleinformatycznych, inżynierii oraz innowacji. Jestem przekonany, że połączenie
  potencjału obu naszych krajów może przynieść sukcesy nie tylko w ramach tradycyjnego
  handlu Polska i Indie chcą przełożyć partnerstwo strategiczne na konkretne przedsięwzięcia
  biznesowe w obszarze nowych technologii, cyberbezpieczeństwa i sektora lotniczo-kosmicznego.
  Współpraca w tych dziedzinach została uwzględniona w planie działań uzgodnionym
  w sierpniu 2024 r., podczas wizyty Premiera Narendry Modiego w Warszawie. Sektor
  informatyczny to jeden z głównych obszarów współpracy polsko-indyjskiej. Indie stworzyły
  jeden z największych sektorów w ramach usług IT. Polska ma z kolei mocne środowisko
  programistyczne. Dostrzegamy szanse na partnerstwo, w ramach którego firmy polskie
  i indyjskie będą współpracować w zakresie badań i rozwoju, technologii i połączą
  kapitał, aby wspólnie tworzyć nowe produkty cyfrowe i wprowadzać je na rynek Premier
  wskazał również na możliwości współpracy w zakresie usług cyfrowych. Indie rozwijają
  płatności elektroniczne, m.in. dzięki systemowi UPI, a Polska – e-usługi publiczne
  i narzędzia tożsamości cyfrowej, takie jak mObywatel. Wymiana doświadczeń może pomóc
  w tworzeniu bezpiecznych rozwiązań dla obywateli i przedsiębiorstw. Najważniejszą
  miarą cyfryzacji nie jest jednak liczba nowych systemów, ale to, czy zwiększają
  one produktywność, ograniczają koszty i poprawiają jakość usług Sztuczna inteligencja
  to kolejny obszar współpracy polsko-indyjskiej. Już dziś sztuczna inteligencja zmienia
  przemysł i sektor usług, stając się kluczowym czynnikiem konkurencyjności firm.
  Polska oraz Indie mają kompetencje, aby wspólnie tworzyć systemy AI wykorzystywane
  w produkcji, automatyzacji, analityce danych, diagnostyce oraz zarządzaniu infrastrukturą.
  Możemy również tworzyć narzędzia dostępne dla małych i średnich przedsiębiorstw,
  którym często brakuje własnych zdolności badawczych Cyberbezpieczeństwo, ochrona
  informacji i odporność infrastruktury cyfrowej pozostają wspólnymi wyzwaniami Polski
  i Indii. Są też szansą na rozwój nowych obszarów współpracy biznesowej. Sektor lotniczo-kosmiczny
  to kolejny obszar współpracy polsko-indyjskiej. Indie mają znaczące osiągnięcia
  w eksploracji kosmosu, a Polska rozwija swoje kompetencje dzięki członkostwu w Europejskiej
  Agencji Kosmicznej. W roku 2025 polski astronauta Sławosz Uznański-Wiśniewski oraz
  indyjski astronauta Shubhanshu Shukla wspólnie uczestniczyli w misji międzynarodowej
  do Międzynarodowej Stacji Kosmicznej Wspólna misja astronautów z Polski i Indii
  pokazała, że specjaliści obu państw mogą współpracować przy najbardziej zaawansowanych
  projektach technologicznych. Skoro możemy wspólnie uczestniczyć w międzynarodowej
  misji kosmicznej, to możemy też współpracować przy konkretnych projektach przemysłowych
  tutaj, na Ziemi Polskie firmy kosmiczne nawiązują już współpracę z indyjskimi partnerami
  przy rozwoju technologii satelitarnych, nawigacyjnych, analityki danych i rozwiązań
  podwójnego zastosowania (dual-use).
