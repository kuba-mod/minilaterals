title: 'Premier: Nikt i nic nie zdejmie z Rosji pełnej odpowiedzialności za wojnę
  w Ukrainie'
text: Rosja dąży do podporządkowania sobie Ukrainy i nie zamierza na tym poprzestać.
  Polska i Europa muszą zachować pełną świadomość zagrożenia i stanowczo przeciwstawiać
  się wszelkim próbom zniekształcania rzeczywistości. To konfrontacja dobra ze złem,
  w której wina Rosji za wywołanie wojny nie może być relatywizowana. W Polsce i Europie
  nie możemy sobie pozwolić na żadną iluzję. Nikt i nic nie zdejmie z Rosji pełnej
  odpowiedzialności za wojnę w Ukrainie. Każdy, kto próbuje wprowadzać tu symetrię,
  daje cenny prezent agresorowi – ocenił Donald Tusk podczas konferencji Warsaw Security
  Forum. Atakując Ukrainę, Rosja dąży do przebudowy dotychczasowej architektury bezpieczeństwa
  i przywrócenia swojej pozycji w Europie do poziomu sprzed 1989 r. Dla Polaków, Europy
  i całego Zachodu kwestia bezpieczeństwa przestała być abstrakcyjnym przedmiotem
  debat naukowych. To bardzo realne zagrożenia wynikające z agresji Rosji na Ukrainę
  Droga do pokoju wiedzie przez skuteczne powstrzymanie rosyjskiej agresji, a nie
  ustępstwa wobec agresora. Nie chcemy wojny. Nikt nie jest bardziej zainteresowany
  pokojem i deeskalacją niż Ukraina i naród ukraiński oraz Polska i naród polski.
  Ukraina walczy o przetrwanie, Rosja – o dominację Wspieranie Ukrainy ma kluczowe
  znaczenie dla bezpieczeństwa Polski. Jeśli leży nam na sercu interes narodowy, bezpieczeństwo
  obywateli i suwerenność państwa, naszym patriotycznym obowiązkiem jest pomoc Ukrainie
  w obronie przed Rosją Rosja nie jest zainteresowana przerwaniem ognia, ani deeskalacją.
  Dlatego można ją zatrzymać tylko zdecydowanymi działaniami. Za kilka dni odbędzie
  się szczyt Unii Europejskiej. Pojadę do Brukseli przekonywać wszystkich partnerów,
  aby na serio rozważyć zwiększenie sankcji wobec Rosji Ukrainy, Polski, Europy i
  NATO nie da się złamać ani zastraszyć, a odpowiedzią na rosyjskie zagrożenie musi
  być pełna solidarność i determinacja całego wolnego świata – od Warszawy po Waszyngton.
  Przed rozpoczęciem konferencji Warsaw Security Forum Premier Donald Tusk spotkał
  się z Naczelnym Dowódcą Sił Sojuszniczych w Europie i Szefem Dowództwa Europejskiego
  Sił Zbrojnych USA gen. Alexusem Grynkewichem.
