title: Więcej Polski, więcej mocy. Terminal T5 oficjalnie oddany do użytku
text: Dziś w Porcie Gdańsk oficjalnie oddano do użytku Terminal T5 – strategiczną
  inwestycję infrastrukturalną, która będzie wspierać budowę morskich farm wiatrowych
  na Bałtyku. Więcej Polski, więcej mocy - to nie jest pusty slogan. Terminal T-5
  powstał w miejscu, gdzie jeszcze niedawno była woda. Polska jest więc większa o
  21 hektarów - symbolicznie możemy powiedzieć, że mamy więcej Polski - powiedział
  Premier Donald Tusk podczas uroczystości otwarcia inwestycji. Terminal T5 to nie
  tylko nowa infrastruktura, ale także rozwój polskich kompetencji w sektorze offshore.
  Inwestycja pozwoli zwiększyć udział krajowych przedsiębiorstw w realizacji morskich
  farm wiatrowych, rozwijać ich zaplecze technologiczne i wzmacniać krajowy łańcuch
  dostaw. Więcej Polski to zdecydowanie większe kompetencje, jeśli chodzi o farmy
  wiatrowe na morzu. My de facto zaczynaliśmy w tej jakże istotnej przestrzeni gospodarczo-technologicznej.
  A dziś Polska staje się także energetyczną potęgą na Bałtyku Terminal T5 zaprojektowano
  z myślą o obsłudze największych komponentów morskich farm wiatrowych dostępnych
  na rynku europejskim. Dzięki temu może stać się ważnym portem instalacyjnym dla
  projektów realizowanych w południowej części Bałtyku. Z Terminala T5 będą prowadzone
  prace związane z realizacją farmy wiatrowej Baltica 2. Stąd, z Gdańska, już niedługo
  ponad 107 turbin będzie transportowanych na farmę Baltica 2. To oznacza 1,5 GW mocy
  i prąd dla 2,5 mln gospodarstw domowych - podkreślił Minister Finansów i Gospodarki
  Andrzej Domański. Rozwój morskiej energetyki wiatrowej pozwala zwiększać krajowe
  moce wytwórcze i dywersyfikować źródła energii. Pierwszy prąd z morskich turbin
  wiatrowych już popłynął (10 lipca br.). Z kolei uruchomienie farmy Baltica 2 planowane
  jest w 2027 r. Do 2040 roku możliwa jest instalacja nawet 18 GW mocy na Bałtyku
  (w ramach różnych projektów).
