title: 'Premier: Przywracamy w Polsce praworządność. Nie cofniemy się o krok'
text: Trzy lata temu Polki i Polacy zdecydowali o zmianie władzy, sprzeciwiając się
  łamaniu Konstytucji, naruszaniu prawa oraz praw obywatelskich. Wiedzieliśmy, że
  wygrana w 2023 r. sama z siebie nie załatwi narastającego problemu łamania praworządności.
  Od pierwszych dni podejmowaliśmy działania na rzecz przywrócenia ładu prawnego w
  Polsce i będziemy je stanowczo kontynuować – oświadczył Donald Tusk w nagraniu w
  mediach społecznościowych. Nowi sędziowie TK zostali wybrani zgodnie z prawem, jednak
  Prezydent odmawia odebrania od nich ślubowania, uchylając się tym samym od obowiązków
  wynikających z Konstytucji. Państwo zbyt długo działa bez prawidłowo wybranego Trybunału
  Konstytucyjnego. Nikt w Polsce, nawet Prezydent, nie ma prawa, aby narażać interes
  obywateli na szwank, szczególnie w tak trudnych czasach, w jakich żyjemy. To jest
  absolutny brak odpowiedzialności za własną ojczyznę Rolą państwa jest utrzymanie
  ładu prawnego, porządku publicznego oraz przywracanie praworządności. Będziemy to
  – bez niepotrzebnych gestów i dramatów – konsekwentnie przeprowadzać. Spokój na
  ulicach i bezpieczeństwo naszej ojczyzny nie podlegają żadnym negocjacjom. Dlatego
  będziemy bezwzględnie egzekwować przepisy prawa i Konstytucję Jak wyjaśnił, państwo
  zapewni ochronę nowo wybranym sędziom Trybunału Konstytucyjnego, aby mogli przystąpić
  do regularnej pracy. Premier Donald Tusk odniósł się także do incydentów przed Trybunałem
  Konstytucyjnym. Usłyszeliśmy dziś pod bramą TK z ust działaczy PiS-u hasła pełne
  wulgaryzmów i agresywnych gróźb pod adresem niezależnych mediów, policjantów, służb
  miejskich i innych obywateli – obywateli, którzy mają inne poglądy niż prezes Kaczyński.
  To on nazwał funkcjonariuszy „barbarzyńską dziczą” w towarzystwie panów Bąkiewicza
  i Macierewicza. Ten jeden obraz wystarczy za cały komentarz Prezydent przyjął ślubowanie
  tylko od trzech z ośmiu prawidłowo wybranych sędziów TK. Dziś w Sejmie, w obecności
  Marszałka Sejmu Włodzimierza Czarzastego i Marszałek Senatu Małgorzaty Kidawy-Błońskiej,
  Maciej Berek złożył ślubowanie sędziego Trybunału Konstytucyjnego z formułą, że
  robi to „wobec Prezydenta”. Wcześniej marszałek Włodzimierz Czarzasty wręczył Maciejowi
  Berkowi uchwałę Sejmu o wyborze na stanowisko sędziego TK. Maciej Berek po ślubowaniu
  wszedł do TK jednak nie został dopuszczony do orzekania. Wczoraj Komisja Wenecka
  opublikowała opinię w sprawie odebrania ślubowania od sędziów Trybunału Konstytucyjnego.
  Komisja potwierdziła, że uprawnione jest złożenie ślubowania przez sędziego TK w
  „zastępczej” formie – bez fizycznej obecności Prezydenta, ale z zachowaniem wszystkich
  wymaganych elementów przysięgi.
