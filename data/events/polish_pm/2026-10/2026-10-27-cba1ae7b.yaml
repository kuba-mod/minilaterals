title: Polska wspiera działania na rzecz przerwania ognia i zakończenia wojny
text: Premier Donald Tusk odniósł się do rozmów Prezydenta Finlandii i Premiera Norwegii
  z Prezydentem Rosji, które odbyły się w formie półtoragodzinnej rozmowy telefonicznej.
  Konsultacje, które przeprowadzili między innymi ze mną, ale przede wszystkim z Prezydentem
  Zełenskim i stroną amerykańską, doprowadziły do konkluzji, że warto, aby politycy
  europejscy w jakikolwiek sposób mieli roboczy kontakt w związku z planowanymi negocjacjami
  na temat przerwania ognia i pokoju - powiedział Premier Donald Tusk przed posiedzeniem
  Rady Ministrów. Do rozmów ma dojść po 4 listopada, prawdopodobnie w Abu Zabi (Zjednoczone
  Emiraty Arabskie), w trójkącie Ukraina-Rosja-Stany Zjednoczone. Szef rządu poinformował,
  że Premier Norwegii zapewnił go o lojalnym przedstawieniu ustaleń poczynionych w
  ramach Koalicji Chętnych i rozmów dwustronnych. Prezydent Finlandii przekazał z
  kolei relację z rozmowy z Władimirem Putinem. Choć obie strony podtrzymały swoje
  stanowiska, europejska ocena spotkania była umiarkowanie optymistyczna w kontekście
  możliwości przeprowadzenia konstruktywnych rozmów w Abu Zabi. Konieczna jest absolutna
  ostrożność i czujność w tego typu kontaktach. Agenda i interesy Rosji są dość precyzyjnie
  zdefiniowane i nie ma się co oszukiwać, że łatwo będzie osiągnąć porozumienie. Dla
  nas najważniejsze jest to, że rozmowy nabierają trochę bardziej konkretnego kształtu,
  przynajmniej, jeśli chodzi o logistykę Premier Donald Tusk zadeklarował dalsze wsparcie
  dla działań na rzecz pokoju, zgodnie z ustaleniami z Premierem Norwegii i Prezydentem
  Finlandii. Niezmiennym priorytetem pozostaje pełne wsparcie dla Ukrainy. Europa
  nie dąży do eskalacji napięć ani nie planuje wrogich działań wobec Rosji. Ważne
  jest, by jak najszybciej zawarto sprawiedliwy pokój i na warunkach do zaakceptowania
  przez obie strony konfliktu oraz przez Europę, a szczególnie państwa, których ten
  konflikt dotyczy w największym stopniu. Kwestia bezpieczeństwa północnej i wschodniej
  flanki Unii Europejskiej jest absolutnie kluczowa i jest nie do negocjacji. Tutaj
  stanowisko europejskie się na pewno nie zmieni Premier Donald Tusk pozostaje w stałym
  kontakcie ze wszystkimi liderami, którzy wierzą w możliwość osiągnięcia porozumienia
  i przerwania ognia przed rozpoczęciem zimy. Najważniejszym celem z humanitarnego
  punktu widzenia jest uniknięcie kolejnych tysięcy ofiar. Jedynym rezultatem tej
  wojny są setki tysięcy zabitych po obu stronach. Powoli staje się ona jedną z najbardziej
  bezsensownych i najkrwawszych wojen we współczesnej historii świata Kilka dni temu
  Rosjanie stracili 2,5 tys. ludzi w ciągu zaledwie 12 godzin. Skala strat obrazuje
  możliwe dalsze konsekwencje wojny. Premier Donald Tusk odniósł się do rezygnacji
  Katarzyny Pełczyńskiej-Nałęcz ze stanowiska Minister Funduszy i Polityki Regionalnej
  i wskazał nazwisko jej następczyni. Zaproponuję na stanowisko Ministra Funduszy
  i Polityki Regionalnej panią Agnieszkę Bartol, stałą przedstawicielkę Polski przy
  Unii Europejskiej. Jest to nie tylko w Polsce, ale być może w Europie, jeden z najwybitniejszych
  specjalistów w kwestiach europejskich, w tym także funduszy europejskich Decyzja
  była konsultowana z wszystkimi koalicjantami. Szef rządu odniósł się do wyzwań stojących
  przed kierownictwem resortu. Sprawa tego ministerstwa jest bardzo szczególna. Potrzebujemy
  ciągłej pracy 24 godziny na dobę, aby nie stracić ani jednego euro z wielkich pieniędzy,
  jakie udało się naszemu rządowi odblokować po fatalnej blokadzie PiS-u na miliardy
  euro Najważniejszym zadaniem osoby, która pokieruje pracami resortu będzie skuteczne
  rozliczenie środków unijnych, w tym KPO. Polska została wybrana jako lokalizacja
  centrum serwisowania pocisków PAC-3 do systemów Patriot. Wiele na to wskazuje, że
  mniej więcej po zakończeniu posiedzenia rządu dojdzie do nas dobra informacja, że
  to właśnie Polska została wybrana jako partner do tego nadzwyczaj istotnego z punktu
  widzenia obronności projektu - mówił Prezes Rady Ministrów przed ogłoszeniem decyzji.
  Polska od początku zabiegała o ulokowanie w kraju infrastruktury i kompetencji związanych
  z serwisowaniem pocisków do systemów Patriot. O realizację projektu rywalizowała
  Niemcami, Holandią i Norwegią. Już na etapie składania wniosków polska oferta została
  oceniona najwyżej.
