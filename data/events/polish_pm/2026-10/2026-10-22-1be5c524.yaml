title: 'Premier: Świat patrzy z zazdrością na to, jak rozwijają się Indie i Polska'
text: Podczas spotkania liderzy państw podsumowali pierwsze efekty współpracy w ramach
  partnerstwa strategicznego zawartego w sierpniu 2024 r. przy okazji wizyty Premiera
  Narendry Modiego w Warszawie. Polska i Indie, to kraje, które łączy wiele, a nic
  nie dzieli. Synergia między naszymi państwami jest prosta - nie mamy sprzecznych
  interesów czy historycznych zaszłości. Budujemy naszą przyjaźń na zaufaniu i wspólnych
  wartościach - oświadczył Premier Donald Tusk po spotkaniu z Narendrą Modim. Podstawą
  polsko-indyjskiego partnerstwa strategicznego są dziś relacje gospodarcze. Wizycie
  Premiera Tuska w Indiach towarzyszy delegacja prawie 100 polskich przedsiębiorców
  i przedstawicieli spółek. Spotykają się oni z reprezentantami indyjskiego biznesu,
  aby poszukiwać nowych możliwości wspólnych przedsięwzięć. Jest to największa tego
  typu wizyta w historii polsko-indyjskich relacji. Mamy ambitne plany współpracy,
  nie tylko w tradycyjnych gałęziach przemysłu, ale też w sektorze kosmicznym, cyfryzacji
  i dronowym Ostatnie 35 lat to okres bezprecedensowego sukcesu gospodarczego i dynamicznego
  rozwoju obu państw. Świat patrzy z zazdrością na to, jak rozwijają się Indie i Polska.
  Będziemy rozmawiać z naszymi partnerami, wspólnie siedząc na szczycie G20 Polska
  i Indie mogą liczyć na wzajemne wsparcie w różnych formatach międzynarodowych. Polska
  ma uzasadnione ambicje, żeby pełnić wiodącą rolę w Europie i dziękuję Premierowi
  Modiemu za zapewnienie, że możemy być bramą Indii do Europy Umowa o wolnym handlu
  między Indiami a Unią Europejską stworzy nowe możliwości dla polskiej i europejskiej
  gospodarki. Może sprzyjać zwiększeniu polskich inwestycji w Indiach, szczególnie
  w sektorach zaawansowanej produkcji, przetwórstwa żywności, biotechnologii i mobilności.
