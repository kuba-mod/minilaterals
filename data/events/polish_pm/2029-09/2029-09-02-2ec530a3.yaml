title: Rządowa ustawa o kryptowalutach utrudnia finansowanie aktów sabotażu - apel
  o odrzucenie trzeciego weta
text: 'W ostatnich dniach doszło do niepokojących incydentów w Polsce i w Niemczech.
  To kontynuacja działań eskalacyjnych ze strony Rosji. Jestem w stałym kontakcie
  z przywódcami państw naszego regionu. Najbliższe tygodnie i miesiące będą krytyczne
  nie tylko w odniesieniu do całej wojny rosyjsko-ukraińskiej, ale będą też wyzwaniem
  dla wszystkich państw tej części Europy - powiedział Premier Donald Tusk przed Radą
  Ministrów. W Polsce doszło ostatnio do dwóch pożarów: w zakładzie Grupy WB produkującym
  systemy bezzałogowe w Skarżysku-Kamiennej oraz w hali produkcyjno-magazynowej firmy
  JFG Composites w Lublinie. W przypadku Skarżyska-Kamiennej nie ma żadnych wątpliwości,
  że doszło do celowego podpalenia, czyli do aktu sabotażu. W przypadku Lublina nie
  mamy tego typu dowodów, ale nie można tego wykluczyć Kryptowaluty są wykorzystywane
  do rozliczania i opłacania sprawców takich działań, a brak regulacji tego rynku
  uniemożliwia ich kontrolę.'
