title: Kryptowaluty, brudne interesy na paliwach, PiS i weta Prezydenta - to układa
  się w „ponurą całość”
text: Afera opisana przez Financial Times dotyczy nieudanej transakcji zakupu wenezuelskiej
  ropy przez spółkę Orlen Trading Switzerland, zawartej w czasie, gdy prezesem Orlenu
  był Daniel Obajtek. Spółka wypłaciła pośrednikowi około 230 mln dolarów zaliczki
  na dostawy ropy, które ostatecznie w dużej mierze nie zostały zrealizowane. Financial
  Times pisze o jednym z największych skandali w historii naszego kraju, a cały świat
  dowiaduje się o aferze Orlenu za czasów pana Obajtka. Straty państwa polskiego tylko
  w tej jednej sprawie to 1,6 mld zł. Okazuje się, że to właśnie kryptowaluty pomogły
  w realizacji brudnego interesu z paliwem. Dziwni pośrednicy, przekazanie pieniędzy
  bez gwarancji uzyskania paliwa – mówił przed posiedzeniem Rady Ministrów Premier
  Donald Tusk. Nad śledztwami dotyczącymi Orlenu osobisty nadzór sprawuje Prokurator
  Generalny Waldemar Żurek. Część osób usłyszała już zarzuty, niektórzy ukrywają się
  przed wymiarem sprawiedliwości m.in. w Dubaju. Teraz rozumiem nerwowe zachowania
  urzędników Prezydenta i polityków opozycji. Dzisiaj łatwiej jest zrozumieć ich strach,
  bo wygląda na to, że w aferze Zondakrypto i tej paliwowej, możemy mieć do czynienia
  z siecią brudnych interesów, która ich przerosła Polacy mają prawo znać prawdę o
  tej sprawie, dlatego informacje śledztwie i o postępach będą sukcesywnie przekazywane
  opinii publicznej. Rząd po raz drugi przyjął projekt ustawy przewidującej opodatkowanie
  nadzwyczajnych zysków przedsiębiorstw paliwowych. Ma to umożliwić finansowanie działań
  osłonowych dla kierowców i ograniczenie skutków wzrostu cen paliw. Gwarantuję, że
  jeśli Prezydent wreszcie podpisze ponownie złożoną ustawę o nadzwyczajnych zyskach,
  natychmiast zrealizujemy kolejny etap CPN Pierwszy projekt został zablokowany przez
  Prezydenta Karola Nawrockiego, który nie złożył pod nim podpisu i skierował go do
  Trybunału Konstytucyjnego. Nikt już nie powinien mieć wątpliwości, że tę ustawę
  trzeba podpisać. To nie ludzie mają płacić za kryzys paliwowy, nie Polacy odpowiadają
  za wojnę na Bliskim Wschodzie. Nie mamy wpływu na politykę Donalda Trumpa, czy Putina
  Środki pozyskane z podatku pozwolą po raz kolejny w tym roku obniżyć VAT i akcyzę
  na paliwa. Orlen osiągnął w pierwszym półroczu 2026 r. niemal 16 mld zł zysku netto,
  wobec niespełna 6 mld zł rok wcześniej. Rada Ministrów  przyjęła projekt zaostrzającym
  sankcje za wjazd na przejazdy kolejowe mimo czerwonego światła lub opuszczających
  się zapór lub rogatek. Zdaję sobie sprawę, że praca kierowców, szczególnie ciężarówek,
  jest bardzo wymagająca i trudna, ale nie możemy ryzykować ludzkim życiem, więc będę
  apelował o szybkie przyjęcie także tego zaostrzenia przepisów. I mam nadzieję, że
  wszyscy rozumieją potrzebę tych przepisów Kierowcy, którzy nie będą stosować się
  do przepisów, mają m.in. automatycznie tracić prawo jazdy na trzy miesiące. W najpoważniejszych
  przypadkach takie zachowania będą mogły zostać zakwalifikowane jako przestępstwo.
  Zmiany w prawie są odpowiedzią na narastający problem bezpieczeństwa na przejazdach
  kolejowych oraz apele środowiska kolejowego. To także reakcja na niedawną katastrofę
  w Sokolnikach Suchych na Mazowszu, gdzie pociąg Intercity zderzył się z ciężarówką.
  W wypadku zginęła jedna osoba, a wiele zostało rannych.
