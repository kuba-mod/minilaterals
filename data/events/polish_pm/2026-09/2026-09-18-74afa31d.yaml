title: 'Premier: Dzisiaj w Ukrainie okazujemy naszą solidarność'
text: 'Dziś to Ukraina mierzy się z rosyjską agresją. Musimy być jednak przygotowani
  na inne możliwości rozwoju tej sytuacji. Polska i inne państwa muszą być przygotowane
  na różne scenariusze. Ostatnie zdarzenia pokazują, że następuje koncentracja ataków
  w pobliżu granicy z Polską, co jest niepokojącą wiadomością, dlatego będziemy działali
  ostrożnie Solidarność i współpraca państw regionu oraz wspólna obecność ich przywódców
  w Ukrainie mają szczególne znaczenie – zarówno dla wsparcia walczącej Ukrainy, jak
  i dla bezpieczeństwa naszego regionu. Przeciwko wszystkim negatywnym trendom będę
  zawsze wspierał Ukrainę w walce z rosyjską agresją, ponieważ jestem głęboko przekonany,
  że suwerenność i bezpieczeństwo Ukrainy oznacza suwerenność i bezpieczeństwo Polski
  Rosja prowadzi intensywne ataki na Ukrainę, wymierzone m.in. w infrastrukturę energetyczną
  oraz ukraiński przemysł. Zdaniem szefa rządu wojna na wyniszczenie ukraińskiej gospodarki
  wkracza w decydującą fazę. Premier na razie nie ma wątpliwości, że Stany Zjednoczone
  będą z nami w obliczu takich zagrożeń jak eskalacja ze strony Rosji. Podczas szczytu
  Karpackiej Inicjatywy Integracyjnej organizowanego w Ukrainie Premier Donald Tusk
  spotkał się także z Prezydentem Wołodymyrem Zełenskim, aby omówić najważniejsze
  kwestie w relacjach dwustronnych – wśród nich był udział Polski w koalicji antybalistycznej.
  Liderzy ustalili formy i ramy tej współpracy. Polska od dziś jest częścią tego wielkiego
  projektu. (…) To w przyszłości - może nie dziś, ale na pewno jutro - będzie oznaczało
  dużo bezpieczniejsze europejskie, a więc także polskie niebo Koalicja Antybalistyczna
  to grupa państw i przedsiębiorstw, które razem będą pracowały na rzecz ochrony przed
  pociskami balistycznymi.  To oznacza ściślejszą współpracę przy rozwoju nowych technologii
  obronnych i wzmacnianie bezpieczeństwa Polski oraz całego kontynentu. Premier odniósł
  się również do tematów dzielących oba narody. Jestem przekonany, że możemy pracować
  na rzecz przyszłości dla Polski i Ukrainy z przeświadczeniem, że prawda zawsze jest
  lepsza niż kłamstwo, nawet ta bardzo bolesna Wołodymyr Zełenski podkreślił, że oba
  państwa są silnymi partnerami i potrafią otwarcie rozmawiać o wrażliwych kwestiach.
  Jesteśmy przyjaciółmi, a Rosja jest wrogiem. Jeżeli zaczniemy dowolnego rodzaju
  dialog, wychodząc z tego samego wspólnego zrozumienia, to myślę, że poradzimy sobie
  ze wszystkim Premier podziękował za gotowość Ukrainy do próby zrozumienia polskiej
  wrażliwości. Karpacka Inicjatywa Integracyjna została zapoczątkowana w 2025 r. Obejmuje
  swoim zasięgiem 8 krajów (Austrię, Czechy, Polskę, Rumunię, Serbię, Słowację, Ukrainę
  oraz Węgry), w tym 43 regiony administracyjne. Z Polski są to województwa: podkarpackie,
  małopolskie i śląskie. Format karpacki może być pomocny w ścieżce Ukrainy do Unii
  Europejskiej. Nasze polskie doświadczenie jest jasne – współpraca międzyregionalna
  jest najlepszym sposobem wdrażania europejskich reguł i współpracy Premier zapowiedział,
  że jako zdecydowany zwolennik rozszerzenia Unii Europejskiej będzie traktował tę
  inicjatywę bardzo poważnie. Szczyt z udziałem przywódców inauguruje również forum
  z udziałem przedstawicieli biznesu, samorządów lokalnych oraz organizacji społeczeństwa
  obywatelskiego z różnych krajów.'
