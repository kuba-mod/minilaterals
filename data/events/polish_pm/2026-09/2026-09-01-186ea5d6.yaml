title: 'Premier: Niech ten rok szkolny będzie rokiem wrażliwości, szacunku i walki
  z pogardą'
text: Atak III Rzeszy na uśpiony i bezbronny Wieluń uznaje się za jeden z symbolicznych
  początków II wojny światowej, obok utrwalonego w świadomości zbiorowej ostrzału
  Westerplatte. Niemieckie naloty na miasto pochłonęły co najmniej 1200 ofiar, a centrum
  miejscowości zniszczono w 90 procentach. Spór o to, gdzie dokładnie rozpoczęła się
  wojna ma jednak drugorzędne znaczenie. Ważne jest, aby wszędzie na świecie, tak
  jak jest tutaj w Wieluniu, pamiętać o tym, co do tej wojny doprowadziło, jak straszliwym
  nieszczęściem jest wojna i jak wielkim zadaniem każdego pokolenia jest wojny uniknąć
  Pamięć o II wojnie światowej jest niezbędna. Daje szansę, że kolejne pokolenia nie
  będą musiały jej doświadczyć. Nie oznacza to jednak wyłącznie znajomości historii,
  ale refleksję o jej znaczeniu. To kształtuje moralny kompas – pozwala odróżniać
  dobro od zła i rozpoznawać zagrożenia, zanim doprowadzą do tragedii. Dzisiaj, 1
  września, w każdej polskiej szkole powinniśmy pamiętać, że nienawiść, pogarda, przemoc,
  agresja prowadzą wyłącznie do zła. To, w jaki sposób traktujecie swoich rówieśników,
  to, jak reagujecie na przemoc, na agresywną głupotę ma wielkie znaczenie Młode pokolenia
  nie są dziś narażone na dramaty i ofiary, których doświadczali ich przodkowie. Ale
  to także od młodych ludzi zależy, czy Polska pozostanie bezpieczna, będzie krajem
  wolnym. Ta odpowiedzialność zaczyna się od codziennych postaw – wzajemnego szacunku,
  respektowania odmiennych opinii, reagowania na przemoc oraz pomocy słabszym. W polskich
  szkołach coraz częściej zdarzają się akty przemocy, również o podłożu narodowościowym.
  Bardzo Was proszę, szanujcie się nawzajem, respektujcie swoje opinie, szanujcie
  nauczycieli, kłóćcie się z nimi, kiedy czujecie, że macie rację. Pomyślcie przynajmniej
  raz w tygodniu o tych, którzy potrzebują Waszej pomocy i postarajcie się im pomóc.
  To jest najpiękniejsza lekcja wychowania obywatelskiego Wcześniej Prezes Rady Ministrów
  zapalił także znicz przy pomniku ofiar września 1939 roku w Wieluniu. Rozmawiał
  tam również z Panią Anielą i Panem Eugeniuszem, świadkami bombardowania miasta.
