title: Machina rozliczeń w sprawie afery Zondacrypto ruszyła i nic jej nie zatrzyma
text: 'Premier Donald Tusk odniósł się do złożonego dziś przez Prezydenta drugiego
  projektu ustawy o rynku kryptoaktywów. Według słów prezydenckiego ministra Z. Boguckiego
  nowy projekt jest bliźniaczo podobny do poprzedniej prezydenckiej propozycji. Kilka
  słów prawdy o tym, co działo się wokół ustawy o kryptowalutach. Najwyższy czas dokładnie
  powiedzieć, co środowisko Prezydenta robiło, żeby zablokować na każdym etapie regulacje,
  które mogły dać państwu narzędzia ochrony Polaków przed stratami - powiedział Premier
  Donald Tusk przed posiedzeniem Rady Ministrów. Trzykrotnie zawetowana przez Prezydenta
  rządowa ustawa o kryptoaktywach miała uporządkować i uregulować ten rynek, chronić
  jego uczestników oraz wyposażyć państwo w narzędzia do skutecznej walki z naruszeniami,
  wyłudzeniami i oszustwami. Przepisy miały dawać państwu i służbom możliwość skutecznego
  nadzoru nad rynkiem, na którym dochodzi do nadużyć, a swoją działalność prowadzą
  grupy przestępcze i obce służby. Kiedy proponowaliśmy pierwszą ustawę, wpłynęła
  poprawka forsowana przez Zondacrypto, która dotyczyła przepisu umożliwiającego państwu
  blokowanie stron internetowych, których działanie narażało obywateli na szkody.
  Poprawka podpisana przez Min. Boguckiego próbowała zablokować to i uniemożliwić
  działanie państwa Donald Tusk przypomniał również, że po odrzuceniu tej poprawki
  pojawił się kolejny argument przeciwko rządowej ustawie. Przedstawiciele środowiska
  prezydenckiego oraz politycy Konfederacji i PiS krytykowali projekt za jego objętość.
  Liderzy opozycji i Prezydent odrzucali rządową ustawę, ponieważ uważali, że jest
  za długa. Tymczasem projekt rządowy miał 106 stron i 168 artykułów, a projekt autoryzowany
  przez Prezydenta Nawrockiego – 108 stron i 170 artykułów Zdaniem Premiera była to
  groteskowa próba zablokowania przepisów, które miały umożliwić państwu skuteczny
  nadzór nad działalnością na rynku kryptoaktywów, w tym nad takimi podmiotami jak
  upadła giełda kryptowalut Zondacrypto. Niestety, to, co miało się stać zgodnie z
  interesami, stało się. Kto miał zniknąć – zniknął. Komu miano wypłacić pieniądze
  – wypłacono. Jaką ustawę trzeba było zablokować – zablokowano. Maszyna rozliczeń
  tej afery ruszyła i nikt jej nie zatrzyma, nawet pseudo-inicjatywy Prezydenta Nawrockiego.
  Skończyło się mataczenie i bezkarna ochrona brudnych interesów Premier zapewnił,
  że sprawa Zondacrypto zostanie wyjaśniona do końca. Śledztwo, które prowadzi prokuratura
  jest rozwojowe, możliwe są kolejne aresztowania. Premier Donald Tusk pogratulował
  również polskim nauczycielom, uczniom, rodzicom i Minister Edukacji B. Nowackiej.
  Polscy uczniowie ponownie znaleźli się wśród najlepszych w Unii Europejskiej – wynika
  z badania PISA, czyli Programu Międzynarodowej Oceny Umiejętności Uczniów. Z matematyki
  jesteśmy drudzy w Unii Europejskiej. W naukach przyrodniczych jesteśmy na trzecim
  miejscu w całej Unii Europejskiej, w rozumieniu tekstu również W matematyce Polska
  znalazła się w europejskiej czołówce obok Estonii, Finlandii i Irlandii – krajów,
  które od lat osiągają bardzo dobre wyniki w edukacji. Bardzo się cieszę, że dzisiaj
  polscy uczniowie są najlepszymi na kontynencie. To jest naprawdę powód do wielkiej
  satysfakcji. Takie rzeczy jak tysiące urodzeń z in vitro czy nadzieje naszych uczniów,
  że będą przygotowani do życia najlepiej w Europie to są te zdarzenia, które cieszą
  mnie najbardziej Badanie PISA pokazuje poziom i zróżnicowanie umiejętności piętnastolatków
  w trzech dziedzinach: umiejętności matematycznych, rozumienia czytanego tekstu i
  rozumowania w naukach przyrodniczych, które rozwijane są w trakcie edukacji szkolnej
  i poza szkołą.'
