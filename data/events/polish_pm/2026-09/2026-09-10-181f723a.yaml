title: Grupa Wyszehradzka wraca do wspólnego działania
text: W szczycie V4, zorganizowanym na zaproszenie premiera Słowacji Roberta Fico,
  obok Donalda Tuska uczestniczyli premierzy Czech – Andrej Babiš, Węgier – Péter
  Magyar oraz Irlandii – Micheál Martin. Dublin sprawuje obecnie prezydencję w Radzie
  UE. To ważne, żebyśmy w tych trudnych czasach konsultowali się w grupach, które
  mają ambitne cele, zdefiniowane interesy i intencje budowania europejskiej jedności
  Polska, Czechy, Słowacja i Węgry wzmacniają pozycję i skuteczność Grupy Wyszehradzkiej,
  nadając jej nową dynamikę i zwiększając jej znaczenie z korzyścią dla naszych państw
  oraz całej UE. Dzięki V4 ten region Europy stał się częścią UE. Osiągnęliśmy to
  dzięki temu, że umieliśmy precyzować nasze interesy i je tłumaczyć, a kiedy trzeba
  – walczyć o nie Polska płaci obecnie setki milionów złotych, żeby utrzymać szczelność
  wschodniej granicy. Dlatego przyszły budżet i polityka UE muszą brać pod uwagę wysiłek
  państw, które chronią zewnętrzną granicę Wspólnoty. Dzisiaj już nikt nie mówi o
  nielegalnej migracji na wschodniej granicy. Wiecie dlaczego? Ponieważ z blisko 20
  tys. nielegalnych przejść miesięcznie ograniczyliśmy je prawie do zera Polska i
  V4 nie pozwolą też na propozycje instytucji europejskich oraz innych państw, które
  mogłyby wpłynąć na pogorszenie sytuacji energetycznej. Priorytetem pozostaje obniżenie
  cen energii w regionie. Zablokujemy wszystko, co sprowadzi na nas ryzyko droższej
  energii. To kwestia być albo nie być całej Unii Europejskiej UE musi prowadzić politykę
  w sposób odpowiedzialny, uwzględniając jej wpływ na europejską gospodarkę i bezpieczeństwo.
  Ochrona klimatu pozostaje ważnym celem, jednak równie istotna jest ochrona unijnego
  przemysłu i granic. Tylko takie podejście pozwoli nam zachować konkurencyjność gospodarki
  UE. Między bajki możemy włożyć marzenia o konkurowaniu z Chinami czy Stanami Zjednoczonymi,
  jeśli ceny energii będą u nas wyglądały tak, jak w tej chwili Premier wyraził nadzieję,
  że rozwiązania wypracowane w Polsce i w całym regionie staną się przykładem, z którego
  będą mogły czerpać również inne państwa europejskie. Dotyczy to m.in. polityki migracyjnej,
  ale także wielu innych obszarów, w których doświadczenia V4 mogą stanowić punkt
  odniesienia dla całej UE. Premier Irlandii Micheal Martin podkreślił, że w najbliższych
  miesiącach Unię Europejską czeka trudny okres, dlatego jednym z najważniejszych
  zadań jest jak najszybsze uzgodnienie unijnego budżetu. Europa potrzebuje budżetu,
  który patrzy w przód – żebyśmy mogli rozwiązywać wyzwania, które stoją przed nami
  i żeby ta polityka zakończyła się sukcesem Premier Słowacji Robert Fico zapowiedział,
  że w ramach prac nad budżetem UE państwa V4 będą zabiegać o utrzymanie odpowiedniego
  poziomu finansowania polityki spójności i wspólnej polityki rolnej. Grupa Wyszehradzka
  znowu żyje i znowu jest zdolna do wyrażania wspólnego stanowiska W kontekście walki
  z nielegalną migracją Premier Czech Andrej Babiš ocenił, że region V4 jest najbardziej
  perspektywiczny ze wszystkich regionów Europy, a bezpieczeństwo odgrywa w nim kluczową
  rolę. Każde nasze państwo samo decyduje o tym, kto u nas będzie żyć i kto u nas
  będzie pracować Premier Węgier Péter Magyar podkreślił, że siłą Grupy Wyszehradzkiej
  jest koncentrowanie się na tym, co łączy jej państwa oraz na obszarach, w których
  mogą one wspólnie reprezentować swoje interesy. Jestem przekonany, że wzmocniona
  V4 będzie ponownie skutecznie działać, a korzyści z tej współpracy odczuje również
  cała Europa Spotkanie szefów rządów państw V4 w Bratysławie potwierdziło, że Grupa
  Wyszehradzka chce wspólnie zabiegać o swoje interesy w kwestiach kluczowych dla
  regionu i całej Unii Europejskiej.
