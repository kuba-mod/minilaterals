title: Większy budżet UE leży w interesie Polski i całej Europy
text: Przewodniczący Rady Europejskiej odwiedza unijne stolice, aby poznać stanowiska
  poszczególnych państw wobec projektu kolejnego budżetu UE. W interesie Polski jest
  jak najwyższy poziom finansowania Wspólnoty, ponieważ nasz kraj jest największym
  beneficjentem środków europejskich. Przyszłe ramy finansowe Unii Europejskiej to
  dla Polski kwestia kluczowa. Rozmawiamy o tym, jak zbudować synergię między specyfiką
  państw członkowskich a wzmacnianiem UE, jako całości – wyjaśnił Donald Tusk podczas
  oświadczenia po spotkaniu z António Costą. W czasach geopolitycznej niepewności
  UE potrzebuje decyzji, które potwierdzą jej pozycję na świecie. Naszym zadaniem
  jest takie działanie, aby państwa członkowskie i UE stawały się coraz silniejsze
  i bardziej odporne na potencjalne zagrożenia Interesy Polski i Europy są w tej kwestii
  tożsame. Wspólnym obowiązkiem Unii Europejskiej i polskim jest być dobrze przygotowanym
  na różne scenariusze. I to wymaga wysiłku, także finansowego Europejski budżet przechodzi
  obecnie głęboką zmianę filozofii. Polska wskazuje, że obok inwestycji w bezpieczeństwo
  i konkurencyjność UE musi jednocześnie pamiętać o wspieraniu rozwoju oraz rolnictwa.
  Niezależne europejskie rolnictwo to także aspekt bezpieczeństwa, autonomii i prawdziwej
  suwerenności UE. Będziemy szukali różnych sposobów na nowe środki. Większy budżet
  europejski leży w interesie każdego kraju członkowskiego, na pewno Polski Przewodniczący
  Rady Europejskiej podkreślił, że Polska, jako kraj wschodniej flanki UE, stoi w
  obliczu szczególnych wyzwań i odgrywa kluczową rolę w kształtowaniu europejskiej
  odpowiedzi na nie. Drogi Donaldzie, twoje doświadczenie, wiedza i mądrość dają Ci
  unikalny, wyjątkowy głos w Unii Europejskiej. Wszyscy nasi koledzy ufają Tobie,
  a pozycja Polski i jej inicjatywy są bardzo doceniane Jak dodał, UE potrzebuje budżetu,
  który pozwoli realizować najważniejsze unijne priorytety UE – wzmacniać obronność
  i bezpieczeństwo, konkurencyjność, innowacyjność oraz strategiczną odporność. Jednocześnie
  musi on nadal wspierać rolnictwo i polityki rozwoju, które są kluczowe dla dobrobytu
  Europy. Premier odniósł się do dzisiejszego zderzenia pociągu Intercity z samochodem
  ciężarowym na przejeździe kolejowym w Sokolnikach. Zapowiedział radykalne zaostrzenie
  przepisów wobec kierowców, którzy ignorują sygnalizację świetlną i opuszczone zapory.
  Niestety jest to kolejny przypadek, kiedy katastrofa ma miejsce na przejeździe kolejowym.
  Dlatego musimy rozpocząć pilne prace nad zaostrzeniem przepisów dla tych, którzy
  systematycznie wjeżdżają na przejazdy mimo zapór czy czerwonego światła Jak wyjaśnił,
  dotychczasowe działania i apele nie przyniosły oczekiwanych rezultatów, dlatego
  nowe przepisy będą bardzo rygorystyczne.
