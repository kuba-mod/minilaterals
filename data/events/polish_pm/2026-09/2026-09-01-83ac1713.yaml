title: 'Najważniejsza lekcja z Westerplatte: Nigdy więcej sytuacji, w której napadnięty
  kraj zostaje sam'
text: 'Każdego roku na Westerplatte Polacy oddają hołd ofiarom II wojny światowej
  oraz przypominają o odpowiedzialności za jej wybuch. To właśnie tutaj, 1 września
  1939 roku, rozpoczęła się niemiecka agresja na Polskę. Ostrzał polskiej składnicy
  wojskowej stał się symbolem wybuchu II wojny światowej – największego konfliktu
  zbrojnego w historii. Zawsze mówiliśmy o tym, że odpowiedzialność za koszmar II
  wojny światowej spada na hitlerowskie Niemcy, a także na sowiecką Rosję. Tu nie
  ma żadnych dwuznaczności. To było, jest i będzie oczywiste dla każdego przyzwoitego
  człowieka, niezależnie od tego, gdzie się urodził i jakiej jest narodowości W przededniu
  wybuchu II wojny światowej załoga Wojskowej Składnicy Tranzytowej liczyła około
  20 razy mniej żołnierzy niż siły niemieckie. Ale nawet większa liczba obrońców Westerplatte
  nie dawałaby Polsce szans na zwycięstwo, ponieważ świat pozwolił Hitlerowi i faszystowskim
  Niemcom na rozpętanie wojny i bezkarną agresję. Dzisiaj naszym zadaniem jest przede
  wszystkim wyciągnąć lekcję, wyciągnąć mądre wnioski, tak, aby nie musieć nigdy więcej
  polegać na bohaterstwie żołnierzy osamotnionych, na bohaterstwie tych, którzy czekali
  na reakcję sojuszników Przed wybuchem wojny świat bagatelizował zagrożenie, powtarzając:
  „to tylko Czechy”, „nie będziemy umierać za Gdańsk”, „może uda się uniknąć wielkiej
  wojny”. Polska nigdy więcej nie może znaleźć się w podobnej sytuacji. Jeśli my dzisiaj
  powiemy “to tylko Ukraina”, to ktoś za kilka miesięcy, za rok, za dwa powie znowu
  “to tylko Polska”. (…) Dzisiaj musimy polegać na własnej sile i na realnych sojuszach,
  nie na zaklęciach, nie na mitach, ale na prawdziwej sile państwa polskiego, prawdziwej
  sile, odporności i solidarności sojuszu, w którym Polska odgrywa tak istotną rolę
  Historia Westerplatte przypomina, że bohaterstwo żołnierzy jest bezcenne, ale nie
  może zastępować siły państwa i solidarności sojuszników. 87 lat po wybuchu II wojny
  światowej ponownie trwa wojna, tym razem za polską granicą. Tysiące ludzi, w tym
  dzieci, giną pod bombami w Ukrainie. Dlatego tak ważne stają się doświadczenia przeszłości,
  które powinny być przestrogą dla całego wolnego świata. Z ponurej lekcji II wojny
  światowej musimy wyciągnąć wniosek o solidarności, jedności zarówno narodu polskiego,
  jak i całego wolnego świata – Europy i Ameryki, Sojuszu Północnoatlantyckiego. To
  nie może być sojusz na papierze Bohaterstwo polskich żołnierzy podczas II wojny
  światowej nie może zostać zmarnowane przez powrót do polityki ustępstw wobec agresora.
  To Rosja rozpoczęła kolejną wojnę, a odpowiedzialnością całego świata Zachodu jest
  twarda postawa wobec niej. Mając w pamięci 80 mln ofiar II wojny światowej, w tym
  6 mln obywateli Polski, dziś głośno z Westerplatte krzyczymy do całego świata: bądźcie
  solidarni! Musimy pomóc Ukrainie przetrwać. Nie możemy powtórzyć tamtych błędów.
  Nie może powtórzyć się Monachium, nie może powtórzyć się polityka ustępowania złu
  Najbliższe miesiące mogą być kluczowe nie tylko dla niepodległości Ukrainy, ale
  również dla bezpieczeństwa Polski i całego wolnego świata. Już teraz Polska jest
  ofiarą prowokacji, aktów dywersji. Podobne agresywne działania dotknęły Finlandię,
  Łotwę, Litwę, Estonię, Rumunię, Danię, a ostatnio także Niemcy. Za chwilę się dowiemy,
  że to rosyjskie służby zorganizowały prowokację dronową w Lipsku. To może także
  i Niemcy, i Francuzi, i Włosi, i Hiszpanie, wszyscy bez wyjątku, wszystkie narody
  i wszyscy przywódcy wolnego świata zrozumieją, że w obliczu zła nikt nie może zostać
  sam. Wiem - za dużo słów, za mało czynów - wielokrotnie słyszałem te słowa także
  od tych, którzy dzisiaj cierpią wskutek agresywnej postawy sąsiadów i wojny To pokazuje,
  jak ważna jest dziś solidarność i wspólna odpowiedź państw europejskich na zagrożenia
  dla europejskiego i światowego bezpieczeństwa.'
