title: Szybko i skutecznie naprawimy system ochrony zdrowia - rząd przyjął pakiet
  ustaw zdrowotnych
text: Rada Ministrów przyjęła dziś ustawy wchodzące w skład pakietu zmian w ochronie
  zdrowia – w tym kluczowe zmiany w zakresie przejrzystości wynagrodzeń i zatrudnienia.
  Szybko i skutecznie naprawimy system zdrowia, szczególnie tam, gdzie dochodziło
  do nadużyć. Ludzie oczekują szybkich zmian. Dziękuję pani Minister Zdrowia za szybkie
  przygotowania projektów zmian - powiedział Premier Donald Tusk przed posiedzeniem
  Rady Ministrów. Polacy chcą, by lekarze byli dobrze wynagradzani, a jednocześnie
  oczekują przejrzystego systemu, w którym nie dochodzi do nadużyć w zakresie wynagrodzeń
  czy czasu pracy. Dlatego rząd wprowadza rozwiązania, które mają wyeliminować możliwość
  wykorzystywania publicznych środków oraz zapewnią jasne zasady wynagradzania i zatrudnienia
  w ochronie zdrowia. Polacy chcą mieć dostęp do dobrych i szybkich usług zdrowotnych,
  a przeważająca większość lekarzy chce systemu, w którym nikt nie będzie podejrzewał
  medyków o jego nadużywanie Najważniejsze zmiany proponowane przez rząd mają uniemożliwić 
  wykorzystywanie systemu NFZ i co za tym idzie publicznych pieniędzy. Ortopeda w
  Grójcu - 3 miliony 200 tysięcy za rok. Rekordowy szpital wydawał na wypłaty 115%
  ze swoich środków budżetowych. Rekordzista, lekarz z Braniewa, wg danych NFZ-u,
  pracował 72 godziny na dobę. Dlatego podjęliśmy decyzję, żeby ograniczyć kominy
  płacowe, które nie będą dotkliwe dla pracujących publicznie Lekarz pracujący w publicznej
  ochronie zdrowia będzie mógł pracować maksymalnie na dwóch etatach. Łączne wynagrodzenie
  z tego tytułu nie przekroczy około 900 tys. zł rocznie, czyli ponad 70 tys. zł miesięcznie.
  To wciąż jedna z najwyższych stawek w Europie. Ustawa wprowadzająca przejrzyste
  zasady wynagradzania i zatrudnienia w publicznej ochronie zdrowia zakłada, że okres
  przygotowania placówek do nowych zasad zostanie skrócony do maksymalnie 6 miesięcy.
  To czas, jaki placówki będą miały na dostosowanie umów i kontraktów do nowych przepisów.
  Przyjęty pakiet ustaw reformujących ochronę zdrowia jeszcze dziś trafi do Sejmu.
  Rząd przyjął dziś również nowelizację ustawy o podatku akcyzowym. Projekt przewiduje
  podwyższenie stawek akcyzy na napoje alkoholowe. Nowością jest skierowanie tych
  środków do NFZ. Proponujemy ustawę, w której wprost zapisane jest, że wpływ to będzie
  1,4 miliarda złotych, że 100% z tego, z tych pieniędzy trafi na zdrowie. Nie na
  inne wydatki, ale konkretnie na zdrowie. Taka zresztą była zawsze nasza intencja
  Szef rządu przypomniał, że Prezydent zawetował poprzednią rządową ustawę o podwyżce
  akcyzy. W grudniu 2025 r. Karol Nawrocki tłumaczył, że nie pozwoli na podwyższenie
  akcyzy na alkohol tylko po to, żeby budżet miał więcej pieniędzy. Panie Prezydencie,
  proszę nie ulegać lobbingowi w sprawie akcyzy. Wiemy, kto jest zainteresowany tym,
  żeby nie było tej podwyżki, ale nawet jeśli ktoś zaproponuje 200 tys. dolarów za
  spotkanie - proszę ich nie słuchać. Proszę podpisać coś, co będzie sprzyjało pacjentom
  i ochronie zdrowia. To pieniądze na zdrowie Dodatkowe środki będą przeznaczone na
  finansowanie świadczeń opieki zdrowotnej, w tym leczenie, skutków spożywania alkoholu,
  który w ostatnich latach stał się relatywnie tani w stosunku przeciętnych miesięcznych
  wynagrodzeń Polaków.
