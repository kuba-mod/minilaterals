title: 'Premier po spotkaniu z premierem Bułgarii: Europejskie serce bije w naszym
  regionie'
text: Szefowie rządów omówili kwestie bezpieczeństwa w regionie, w tym rosyjską agresję
  na Ukrainę i związane z nią zagrożenia dla Polski i Europy. Podczas mojej rozmowy
  z Premierem Radewem Rosja znowu zaatakowała Ukrainę w pobliżu polskiej granicy.
  Ewakuowaliśmy przejścia graniczne w Hrubieszowie i Dorohusku. Ta sytuacja każe nam
  bardzo konsekwentnie działać i ostrzegać naszych europejskich partnerów, że ten
  czas jest trudny i musimy dobrze przygotować się na najbliższe miesiące - powiedział
  Premier Donald Tusk podczas konferencji prasowej. Premier podkreślił, że nie jest
  to pierwsza sytuacja, w której Rosja eskaluje działania właśnie w czasie rozmów
  Polski z partnerami na temat rosyjskiej agresji i zagrożenia dla naszego kraju.
  Zdaję sprawę ze wszystkich różnic, także między Polską a Bułgarią, ale w jednej
  sprawie mamy – jeśli chodzi o Ukrainę i Rosję – oczywisty i wspólny pogląd, że ta
  wojna powinna się jak najszybciej zakończyć i to nie na warunkach agresora, tylko
  na uczciwych, sprawiedliwych warunkach, tak aby pokój był trwały Donald Tusk poinformował
  także Premiera Radewa o powtarzających się w Polsce aktach sabotażu i innych niepokojących
  zdarzeniach dotyczących infrastruktury kolejowej. W środę wieczorem doszło również
  do pożaru w pobliżu naziemnej stacji Starlinków w powiecie grójeckim na Mazowszu.
  Szef rządu przypomniał, że Polska współpracuje z firmą SpaceX przy zapewnianiu Ukrainie
  dostępu do usług Starlink.
