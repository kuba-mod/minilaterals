title: Noblista prof. Victor Ambros z polskim obywatelstwem
text: Prof. Victor Ambros od zawsze pamiętał o swoich polskich korzeniach. Starania
  o przywrócenie mu polskiego obywatelstwa rozpoczęły się na początku 2026 r. Wtedy
  w Warszawie noblista spotkał się osobiście z Premierem Donaldem Tuskiem. Decyzję
  potwierdzającą, że prof. Victor Ambros jest Polakiem od urodzenia wydał 14 września
  wojewoda mazowiecki. Mam dla ciebie świetną wiadomość. Jesteś Polakiem z polskim
  paszportem. Jesteś obywatelem kraju, który jest najlepszym miejscem na Ziemi – pogratulował
  prof. Victorowi Ambrosowi Premier Donald Tusk. Wspólnym celem Premiera D. Tuska
  i prof. V. Ambrosa jest przyciągnięcie do naszego kraju najzdolniejszych młodych
  naukowców z całego świata. Premier Donald Tusk zadeklarował pełną pomoc państwa
  w realizacji tego projektu. Spotkamy się w maju, w Warszawie, w Krakowie, w Gdańsku.
  Wszystko zorganizuję W maju 2027 r. prof. Victor Ambros ma ponownie odwiedzić Polskę,
  gdzie spotka się ze środowiskiem akademickim i weźmie udział w oficjalnych wydarzeniach.
  Prof. Victor Ambros w 2024 r. otrzymał, wspólnie z Garym Ruvkunem, Nagrodę Nobla
  w dziedzinie medycyny i fizjologii za odkrycie mikroRNA i jego roli w regulacji
  genów. Ich badania zmieniły rozumienie tego, jak organizm kontroluje swoje funkcje,
  a także mechanizmów powstawania wielu chorób, w tym chorób rzadkich i onkologicznych.
  Niewielkie cząsteczki RNA, które regulują aktywność genów prof. Victor Ambros wraz
  z zespołem odkrył na początku lat 90. XX w. Odkrycie początkowo spotkało się z niewielkim
  zainteresowaniem środowiska naukowego. Sytuacja zmieniła się w 2000 r., gdy Gary
  Ruvkun odkrył kolejne mikroRNA, występujące również u myszy, innych zwierząt i ludzi.
  Dziś wiadomo, że u ludzi zidentyfikowano około 1000 mikroRNA. Cząsteczki te uczestniczą
  w wielu ważnych procesach biologicznych, m.in. w rozwoju organizmu i podstawowych
  funkcjach komórkowych. Część z nich jest powiązana z chorobami, w tym nowotworami.
  Lepsze poznanie mechanizmów działania mikroRNA otworzyło drogę do nowych metod diagnostyki
  i terapii, ponieważ mikroRNA można wykorzystać do wykrywania chorób oraz do projektowania
  leków wpływających na aktywność genów. Prof. Victor Ambros jest potomkiem polskiego
  emigranta. Jego ojciec, Longin Ambros, urodził się w 1923 r. na Wileńszczyźnie.
  W czasie II wojny światowej jako robotnik przymusowy trafił do III Rzeszy. Po wojnie,
  w 1946 r., wyjechał do USA, gdzie założył rodzinę. Byłem pierwszym naukowcem w mojej
  rodzinie. Mój tata był imigrantem z Polski. Przybył do Stanów Zjednoczonych tuż
  po drugiej wojnie światowej i spotkał moją mamę. Pobrali się, przeprowadzili na
  farmę w Vermont i zaczęli uprawiać ziemię – wspominał prof. Victor Ambros w wywiadzie
  dla czasopisma „Journal of Cell Biology”. Z Polską łączy go nie tylko pochodzenie,
  ale także współpraca naukowa. Podczas swojej niedawnej wizyty w Warszawie gościł
  w Akademii High School w ramach Tygodnia Świadomości Chorób Rzadkich. Jako przewodniczący
  Rady Naukowej Międzynarodowego Instytutu Mechanizmów i Maszyn Molekularnych (IMol
  PAN) wziął udział w posiedzeniu Rady oraz wygłosił wykład naukowy pt. „Rola mikroRNA
  w posttranskrypcyjnej regulacji genów”.
