title: Premier z apelem do Prezydenta o podpisanie korzystnych dla obywateli ustaw
text: Rada Ministrów przyjęła dziś projekt ustawy budżetowej oraz przepisy przewidujące
  obniżkę podatków dla "klasy średniej". Warto sobie uświadomić, że w budżecie, nad
  którym pracujemy, jest zawarty projekt, na który czekało kilka milionów Polek i
  Polaków – zmiana skali podatkowej PIT Pierwszy próg podatkowy zostanie podniesiony
  ze 120 tys. do 130 tys. zł rocznie. Wprowadzona zostanie także nowa, pośrednia stawka
  24% dla dochodów od 130 tys. do 150 tys. zł. Dochody powyżej tej kwoty będą opodatkowane
  stawką 32%. Osoby, które zyskają najwięcej, będą mogły zaoszczędzić w skali roku
  nawet do 3600 zł. Proponowane przez nas zmiany oznaczają, że liczba podatników płaczących
  32% podatku PIT, spadnie z 14% do 7%. Na tych zmianach skorzysta 3,5 mln Polek i
  Polaków Przygotowana propozycja łączy obniżenie obciążeń podatkowych z odpowiedzialnością
  za finanse publiczne. Zmiany mają być jednak neutralne dla budżetu państwa dzięki
  m.in. podwyższeniu stawki CIT z 19 do 22% dla podmiotów osiągających roczne przychody
  przekraczające 50 mln euro oraz dla podatkowych grup kapitałowych. Biorąc pod uwagę
  obowiązki państwa w obronności i rosnących wydatków na zdrowie, szukaliśmy odpowiedzialnych
  rozwiązań i to co proponujemy jest możliwe na ten czas Jednocześnie szef rządu zaapelował
  do Prezydenta Karola Nawrockiego o podpisanie ustawy budżetowej. Nie mam złudzeń,
  co do stosunku Prezydenta wobec rządu, ale ludzie nie mogą za to płacić. Dlatego
  mam nadzieję, że efektywne obniżenie podatków dla aż 3,5 mln Polek i Polaków, jest
  wystarczającym argumentem, aby jego podpis znalazł się pod tą ustawą Premier przypomniał,
  że weto Karola Nawrockiego do ustawy o podatku od nadzwyczajnych zysków koncernów
  paliwowych uniemożliwiło kontynuowanie rządowego programu Ceny Paliwa Niżej. Jak
  podkreślił, skutki tej decyzji Polacy odczuwają każdego dnia, płacąc wysokie ceny
  za paliwo na stacjach benzynowych. Nie chcę się znęcać nad decyzjami Pana Prezydenta
  każdego dnia, chociaż powodów jest aż nadto, ale nie mogę nie zauważyć, że tak jak
  w przypadku CPN-u, a więc tańszych paliw, gdzie upór ze strony Pałacu Prezydenckiego
  będzie kosztował ludzi kolejne tygodnie bardzo wysokich cen na stacjach benzynowych,
  jeśli nie dostaniemy tego podpisu. I słyszę też sygnały, że nie wszystkim tam podoba
  się idea, aby ludzie płacili trochę niższe podatki Druga już ustawa o podatku od
  nadzwyczajnych zysków firm paliwowych czeka na podpis Prezydenta. Wpływy z podatku
  sfinansują obniżki rekordowo wysokich cen paliw. Poprzednia ustawa została zablokowana
  przez Prezydenta, który skierował ją do Trybunału Konstytucyjnego. Premier Donald
  Tusk odniósł się również do kwestii bezpieczeństwa w regionie. Najbliższe tygodnie
  i miesiące będą dla Polski wymagające w związku z nasilającą się agresywną postawą
  Rosji wobec Ukrainy. Rosyjskie działania coraz bardziej zbliżają się do polskiej
  granicy. Wczoraj rosyjskie drony uderzyły zaledwie 1000 m od polskiej granicy. Każdego
  dnia polskie lotnictwo jest w powietrzu. Na szczęście możemy liczyć na dobrą współpracę
  ze stroną ukraińską i szybkie przekazywanie nam informacji Rosyjskie ataki w pobliżu
  polskiej granicy nabrały permanentnego charakteru, co wiąże się z koniecznością
  wielokrotnego podrywania samolotów w ciągu doby. Wojsko i służby są szczególnie
  skoncentrowane na zapewnieniu bezpieczeństwa po polskiej stronie. Współpraca ze
  stroną ukraińską w ostatnich dniach układa się wzorowo – Ukraina na bieżąco informuje
  Polskę o zagrożeniach i podejmowanych działaniach.
