title: 'Premier do opozycji: Wszystko wskazuje na to, że za gardło trzymają was bardzo
  źli ludzie'
text: Ze względu na bezpieczeństwo i ważny interes państwa, działając na podstawie
  ustawy o prokuraturze, Donald Tusk przedstawił w Sejmie informacje dotyczące śledztwa
  prowadzonego w sprawie Zondacrypto przez Prokuraturę Krajową w Katowicach. Ze śledztwa
  wynika, że osoby ze środowiska giełdy kryptoaktywów wpływały lub próbowały wpływać
  na działania rządu PiS. Jedno z pierwszych spotkań w tej sprawie – 28 kwietnia 2018
  roku – miało miejsce w Ministerstwie Finansów. Na spotkanie przybyli panowie Sylwester
  Suszek – zaginiony, prawdopodobnie zamordowany przez swoich następców,  inwestor
  Rafał Zaorski – dzisiaj sąd potwierdził zasadność jego aresztowania oraz Krzysztof
  Piecha – autor koncepcji Konfederacji, jeśli chodzi o ustawę kryptowalut. Zaproszenie
  było wystosowane na wiceministra finansów, pana Gruzę, dzisiaj doradcę Prezydenta
  Nawrockiego – poinformował Premier podczas wystąpienia w Sejmie. Szef rządu zacytował
  też protokoły z przesłuchania kluczowej osoby zeznającej w sprawie afery Zondacrypto.
  Zbyszek zapoznał się z aktami. Mówi, że gdyby wiedział, że taka sprawa się toczy,
  to natychmiast by interweniował. Obiecał, że jak wróci do władzy w Ministerstwie
  Sprawiedliwości, czego jest pewien, to ukręci łeb wszystkim tym sprawom i żebym
  się nie martwił Jak wynika z tych zeznań, rekompensata za „usługę” miała zostać
  wypłacona Zbigniewowi Ziobro za pośrednictwem fundacji Suwerennej Polski. Umówiliśmy
  się na łączną kwotę 2 mln zł. Wypłaciłem 500 tys. zł ze swojego rachunku bankowego.
  Dalsze wpłaty były niemożliwe, ponieważ bank zadawał setki pytań i finalnie wypowiedział
  mi umowę rachunku bankowego. Ziobro przestraszył się i podobno chciał zwracać pieniądze,
  ale w ostatnim czasie sam publicznie przyznał, że wypłacił sobie z fundacji te pieniądze
  i przeznaczył na swoje potrzeby Główną rolę w procederze miała odegrać Patrycja
  Kotecka, żona Zbigniewa Ziobro. Zapłaciłem za to, bo miałem być czystym człowiekiem.
  Najważniejsze w tej współpracy było to, że pan X obiecywał mi, że jak Nawrocki zostanie
  prezydentem, to on załatwi mi ułaskawienie, gdybym został skazany w tej sprawie. 
  Ta obietnica ułaskawienia była za te wszystkie płatności, tj. CPAC, reklamy i kongres
  organizowany w Stanach Zjednoczonych – cytował głównego zeznającego szef rządu.
  W interesie Polski było więc odrzucenie prezydenckiego weta, które zablokowało przepisy
  mające wprowadzić zasady nadzoru nad rynkiem kryptoaktywów. Elementarny instynkt
  powinien kazać wam zagłosować za tą ustawą, bo taki jest oczywisty interes Polski
  i jej obywateli. Wszystko wskazuje na to, że za gardło trzymają was bardzo źli ludzie
  – zwrócił się posłów opozycji Prezes Rady Ministrów. Premier nie ma wątpliwości,
  że są dodatkowe materiały obciążające polityków PiS i Konfederacji w tej sprawie.
  Chcecie ostrzeżeń, więc ostrzegam was – żaden przyzwoity człowiek i polityk nie
  powinien brać pieniędzy od przestępców. Żadna partia polityczna nie powinna obiecywać
  ułaskawienia przestępcom Ujawnione informacje pokazują skalę infiltracji środowiska
  politycznego PiS przez osoby związane z Zondacrypto. Dotyczy to także działań instytucji
  państwa, w tym trzykrotnego umorzenia przez prokuraturę – w okresie rządów Zbigniewa
  Ziobry – śledztwa w sprawie zaginięcia Sylwestra Suszka, pomimo wniosku Komisji
  Nadzoru Finansowego o jego podjęcie. Miało to miejsce w 2019, 2020 i 2022 roku.
  Zawetowana przez Prezydenta ustawa miała wprowadzić zasady nadzoru nad rynkiem kryptoaktywów
  oraz utrudnić sposób finansowania aktów terrorystycznych i innych działań przestępczych.
  Nieuregulowanie rynku kryptowalut sprawia, że jako państwo nie mamy możliwości prześwietlać
  takich transakcji. Są więc wykorzystywane jako główne źródło finansowania akcji
  sabotażowych – prym wiedzie tutaj Rosja Takie samo stanowisko w tej sprawie przedstawiają
  polskie służby specjalne. Informacje na ten temat były przekazywane obu izbom parlamentu.
  Blokowanie ustawy przeszkadza i utrudnia pracę Agencji Bezpieczeństwa Wewnętrznego
  oraz Agencji Wywiadu, kiedy chcemy śledzić przepływy kryptowalut oraz finansowania
  aktów sabotażu, także tych na terenie Polski Brak odpowiednich przepisów naraża
  także tysiące osób na poważne straty. Dlatego konieczne jest stworzenie systemu,
  który skutecznie utrudni funkcjonowanie piramid finansowych i ograniczy możliwość
  nadużyć na rynku kryptowalut.
