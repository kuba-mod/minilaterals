title: Lekcja z 17 września 1939 roku nie pójdzie na marne
text: '87 lat temu, 17 września 1939 roku, o świcie, gdy polscy żołnierze od dwóch
  tygodni bronili Ojczyzny przed niemieckim najeźdźcą, ze wschodu uderzyła Armia Czerwona.
  Stalin zadał nam cios w plecy. Łamiąc pakt o nieagresji. Totalitaryzmy podzieliły
  między sobą wolny kraj, naszą Ojczyznę. Pamiętamy obrońców Grodna, Lwowa, żołnierzy
  Korpusu Ochrony Pogranicza, harcerzy, partyzantów i cywilów, którzy stanęli naprzeciw
  przeważającej siły. Pamiętamy ofiary Katynia, Miednoje i Charkowa. Pamiętamy setki
  tysięcy rodzin wywiezionych na Syberię, dzieci, które nigdy nie zobaczyły swoich
  ojców, i matki, które do końca życia czekały na wieść, jakąkolwiek, o swoich bliskich.
  Jako historyk doskonale wiem, że metody rosyjskich działań od stuleci pozostają
  bez zmian: napaść na sąsiadów pod pretekstem wyzwolenia. W dniu takim jak ten, wolałbym
  mówić tylko o bohaterskich czynach zapisanych na kartach historii. Niestety, eskalująca
  agresja ze strony Rosji nie pozwala mi na to. Historia jak wiemy, się nie powtarza,
  ale się rymuje i te rymy historii musimy dzisiaj odczytywać z należytą powagą. W
  niedzielę w Dorohusku zawyły syreny, a szyby drżały od wybuchów w oknach. Kilkaset
  metrów od przejścia granicznego z Polską rosyjski dron uderzył w stację benzynową.
  Inny trafił w lokomotywę ukraińskiego pociągu dwa kilometry od naszej granicy. Noc
  wcześniej rosyjskie drony uszkodziły fabrykę polskiej firmy na Ukrainie. W lipcu
  uzbrojona rosyjska rakieta spadła w pole na Lubelszczyźnie. To nie były przypadki.
  Dziś mówię z całą mocą - Nie damy się zastraszyć. Rosja wcale nie musi przekraczać
  naszej granicy. Ona już prowadzi z nami wojnę hybrydową, za pomocą dronów, aktów
  sabotażu i dezinformacji w internecie. Od naszych sojuszników wiemy, że najbliższe
  miesiące mogą przynieść kolejne prowokacje. Nie boimy się. Nie jesteśmy też naiwni.
  Jestem z Gdańska. W maju 1939 roku pewien francuski polityk, przyszły nazistowski
  kolaborant, pytał na łamach francuskiej prasy: po co umierać za Gdańsk? Kilka miesięcy
  później umierała cała Europa. Tym, którzy dziś mówią, że to nie nasza wojna, przypominam
  tę lekcję historii. W 1939 roku sojuszników mieliśmy właściwie tylko na papierze.
  Zostaliśmy sami. Dziś jesteśmy w NATO i w Unii Europejskiej. Wydajemy na obronę
  prawie 5 % PKB. To niemal dwa razy więcej niż Niemcy i ponad dwa razy więcej niż
  Francja. Budujemy jedną z najsilniejszych armii w Europie. Z unijnego programu SAFE
  pozyskaliśmy 44 miliardy euro, najwięcej ze wszystkich państw Unii, a polskie granice
  są dzisiaj najlepiej strzeżonymi granicami na całym kontynencie. Europa, która w
  1939 roku nie chciała umierać za Gdańsk, dziś finansuje polskie zbrojenia. Jesteśmy
  świadomi, że nawet największa armia nie wystarczy, jeśli naród nie będzie gotowy.
  Dlatego zwracam się do wszystkich, którzy z niepokojem patrzą w przyszłość: Nie
  szukamy wojny, ale jeśli ktokolwiek odważy się nas zaatakować, spotka się ze stanowczą
  odpowiedzią naszą i naszych sojuszników. Niech żyje wolna i bezpieczna Rzeczpospolita!'
