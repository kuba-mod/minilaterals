title: Eskalacja rosyjskich działań staje się faktem
text: W ostatnim czasie rosyjskie ataki na Ukrainę przybierają na sile, a działania
  Rosji prowadzone są coraz bliżej polskiej granicy. Tak, jak się spodziewaliśmy,
  o czym wielokrotnie informowałem, eskalacja działań Federacji Rosyjskiej staje się
  faktem, a przykłady tego są coraz bliżej naszej granicy – zaznaczył Premier podczas
  odprawy w RCB. Atak lub próba sparaliżowania przejść granicznych nie jest pierwszym
  tego typu zdarzeniem. Wiedzieliśmy, że w rosyjskim planie będzie próba dezorganizacji,
  paraliżu, a być może zniszczenia przejść granicznych z Ukrainą Od dziś właściwe
  służby będą działać w trybie wzmocnionym. Najbliższe tygodnie i miesiące będą czasem
  bardzo wzmożonych działań ze strony rosyjskiej i niestety nie możemy wykluczyć,
  że ta eskalacja będzie dotyczyła także naszego terytorium Dzisiejszy atak Rosji
  pokazuje, że Moskwa jest gotowa użyć groźniejszego niż do tej pory sprzętu – dronów
  odrzutowych. Będziemy analizować, w jaki sposób mobilizować naszych sojuszników.
  Nie ulega wątpliwości, że wspólnie z nimi musimy być przygotowani na skoordynowaną
  reakcję, jeśli zajdzie taka potrzeba Donald Tusk przekazał też, że będzie oczekiwał
  od służb pełnej zdolności do bieżącej weryfikacji wszystkich informacji, szczególnie
  w trybie alarmowym. Każda informacja pojawiająca się w przestrzeni publicznej, powinna
  być możliwie szybko potwierdzona, aby w sytuacji wymagającej pilnej reakcji nie
  popełnić błędu. Ważna jest precyzyjna informacja. Jesteśmy pewni, że 2 kilometry
  od naszej granicy została zaatakowana stacja benzynowa lub jej pobliże i skład pociągu
  towarowego na bocznicy. Informacje o zaatakowaniu kolumny ciężarówek lub lokomotywy
  z pociągu pasażerskiego na trasie Kijów-Warszawa, które się pojawiały nie tylko
  u nas w mediach, ale też w niektórych relacjach ze strony ukraińskiej – nie mogę
  powiedzieć, że one są nieprawdziwe, ale my nie potwierdzamy takich zdarzeń Jak dodał,
  w najbliższych miesiącach funkcjonowanie przejść granicznych będzie miało szczególny
  charakter. W poniedziałek w tej sprawie odbędą się rozmowy z Ministerstwem Finansów.
  Podczas odprawy w RCB, Szef Sztabu Dowództwa Operacyjnego Rodzajów Sił Zbrojnych
  gen. bryg. Jarosław Chojnacki przekazał, że w rosyjskich atakach na Ukrainę użyto
  najprawdopodobniej ponad 700 dronów oraz 40 pocisków balistycznych. Dowódca operacyjny
  uruchomił lądową obronę powietrzną oraz lotnictwo, czyli F-16 oraz śmigłowce M-17
  i Black Hawki Polska przestrzeń powietrzna nie została naruszona. Komendant Główny
  Straży Granicznej gen. dyw. Robert Bagan zapewnił, że sytuacja na przejściach granicznych
  z Ukrainą jest obecnie opanowana, a ruch odbywa się normalnie.
