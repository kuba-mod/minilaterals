title: Każdy, kto podważa dziś nasze sojusze szkodzi Polsce. Musimy być gotowi na
  każdy scenariusz
text: W związku z intensyfikacją rosyjskich uderzeń na zachodnią Ukrainę, w rejonie
  wschodniej granicy Polski coraz częściej uruchamiane są alarmy. Do kolejnego ataku
  doszło również dzisiaj. Rosjanie wprowadzają na masową skalę nowy typ broni uderzeniowej
  – drony odrzutowe. Poruszają się z dużo większą prędkością i działają na większych
  wysokościach, zanim spadną na cel Według źródeł późna jesień i zima będą najbardziej
  krytycznym momentem w dotychczasowej wojnie rosyjsko-ukraińskiej. Rosja zdecydowała
  się na nową strategię prowadzenia wojny. Jej celem jest zniszczenie, w możliwie
  dużej skali, gospodarki i logistyki Ukrainy. Spodziewane są też ciągłe uderzenia
  na główne ukraińskie miasta Szef rządu poinformował, że jeszcze dziś udaje się na
  Ukrainę, gdzie będzie rozmawiał z Prezydentem Wołodymyrem Zełenskim na temat współdziałania
  naszego kraju w ramach koalicji antybalistycznej. Musimy zdać sobie sprawę z tego,
  że zapowiedzi niektórych światowych liderów o tym, że Rosja jest gotowa do pewnego
  rozejmu, żeby nie niszczyć infrastruktury energetycznej – nie spełniły się Celem
  Rosji jest osłabienie integralności NATO i podważanie wiarygodności art. 5 Traktatu
  Północnoatlantyckiego. Rosyjski plan się powiedzie, kiedy polityczne zmiany w niektórych
  państwach europejskich dadzą władzę lub donośny głos tym, którzy pod płaszczem pokoju
  i pacyfizmu będą nawoływali do pokoju, czyli kapitulacji Ukrainy Z punktu widzenia
  każdego niepodległego państwa obecne warunki stawiane przez Rosję Ukrainie byłyby
  nie do przyjęcia. Ich zaakceptowanie oznaczałoby wzrost bezpośredniego zagrożenia
  dla Polski i innych państw europejskich. W związku z nasileniem rosyjskich działań
  na zachodniej Ukrainie nasz kraj wzmacnia wojskową infrastrukturę przejść granicznych,
  aby zwiększyć bezpieczeństwo funkcjonariuszy i żołnierzy. Rozwinęliśmy obronę przeciwlotniczą
  na 6 przejściach granicznych oraz uzupełniliśmy nasze możliwości o kolejne stanowisko
  dowodzenia oraz radiolokacyjne Wojska inżynieryjne pozostają w gotowości do wsparcia
  grup ewakuacyjno-poszukiwawczo-rozpoznawczych. W odwodzie pozostaje również 16.
  Batalion Remontu Lotnisk, który może zostać wykorzystany w przypadku ataku na infrastrukturę
  w rejonie granicy. Donald Tusk zaapelował także do polskiej klasy politycznej o
  odpowiedzialność i powstrzymanie się od kwestionowania lojalności Polski wobec sojuszników.
  Art. 5 i sojusznicza lojalność musi stać się naszym markowym znakiem. Wszyscy nasi
  partnerzy muszą wiedzieć, że na Polskę można zawsze liczyć. Wtedy i my nie zostaniemy
  sami Nie należy także promować przekazów zgodnych z interesem rosyjskiej propagandy.
  Przestrzegam, żeby w żadnym wypadku nie uczestniczyć, intencyjne lub nie, w promowaniu
  treści, na których zależy Rosjanom – szczucie na Unię Europejską, naszych sojuszników
  czy Ukraińców jest wykonywaniem strategii rosyjskiej W kwestiach bezpieczeństwa
  polskich granic potrzebna jest wspólna odpowiedzialność i współpraca ponad podziałami
  politycznymi. W obliczu zagrożenia Polska musi mówić jednym głosem.
