title: 50 lat KOR. Wspólne działanie ponad podziałami zmienia historię
text: Dokładnie 50 lat temu – 23 września 1976 r. – powołany został Komitet Obrony
  Robotników (KOR). Jestem tutaj w imieniu wszystkich, a więc milionów Polek i Polaków.
  Miałem niebywały zaszczyt brać udział w działaniach, które podjęliście wtedy, kiedy
  to było naprawdę trudne. Do dziś, przez te 50 lat, nic nie jest w stanie przesłonić
  ani być czymś bardziej wartościowym niż tamto doświadczenie – tajne spotkania, nadzwyczajna,
  pisana jeszcze małą literą, Solidarność – powiedział Premier Donald Tusk podczas
  uroczystości jubileuszowych na Zamku Królewskim. Komitet Obrony Robotników powstał,
  aby udzielać pomocy – w tym materialnej, prawnej i medycznej – ludziom brutalnie
  represjonowanym przez władze po robotniczych protestach w czerwcu 1976 r. oraz ich
  rodzinom. Była to pierwsza po II wojnie światowej otwarcie działająca organizacja
  sprzeciwu wobec komunistycznej władzy. Kiedy dotarła do Gdańska informacja o tym,
  że powstał KOR, to nawet jeśli ta misja wydawała się trochę romantyczna, trochę
  beznadziejna, może dlatego była tak pociągająca dla ludzi z mojego pokolenia. To
  było coś nieprawdopodobnego. I to zanim powstała Solidarność można było dotknąć
  rzeczywistości niezakłamanej, tworzonej przez ludzi uczciwych i odważnych Premier
  Donald Tusk wspominał również gdańskie środowisko współpracujące z KOR-em, podkreślając
  jego różnorodność oraz znaczenie dla późniejszej działalności opozycyjnej. Był taki
  moment i to był moment, który nazywają szczęściem publicznym. Taki moment, kiedy
  wszyscy czuli, że słowo Polska jest słowem tak samo pięknym i ważnym dla każdego
  z nas Prezes Rady Ministrów podziękował również uczestnikom wydarzeń sprzed 50 lat
  za ich niezłomną postawę. Dawaliście świadectwo odwagi i prawdziwego patriotyzmu
  - bez wielkich okrzyków, wzniosłych przemówień, częściej w więzieniu niż na wolności.
  Chcę, żebyście wiedzieli, że nadal jesteście skarbem dla naszego narodu. Nawet jeśli
  nie wszyscy to rozumieją KOR skupiał przedstawicieli różnych pokoleń, często o odmiennych
  przekonaniach. Połączył przedstawicieli inteligencji i robotników we wspólnym działaniu
  i sprzeciwie wobec łamania prawa przez ówczesną władzę. Dziś pamięć o ludziach KOR
  powinna pozostać inspiracją dla kolejnych pokoleń. Zrobię wszystko, co w mojej mocy,
  żeby ten wielki skarb, pamięć o wspaniałych ludziach, zawsze była inspiracją dla
  tych, dla których takie słowa, jak Ojczyzna, wolność i patriotyzm, oznaczają coś
  świętego. I nigdy nie kojarzą się z pogardą, nienawiścią czy lekceważeniem Premier
  podkreślił, że wartości, którymi kierowali się działacze KOR, pozostają aktualne
  także dziś – odwaga, przyzwoitość i sprzeciw wobec oportunizmu oraz gotowość do
  zabierania głosu w obronie fundamentalnych wartości.
