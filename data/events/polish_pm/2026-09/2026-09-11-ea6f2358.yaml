title: Polski przemysł obronny przyspiesza dzięki SAFE
text: Realizacja programu SAFE przebiega bardzo dynamicznie. Podpisana umowa wykonawcza
  na dostawę przeciwlotniczych zestawów rakietowych Piorun to kolejny krok w kierunku
  wzmocnienia bezpieczeństwa Polski i rozwoju krajowego przemysłu obronnego. Dziś z
  wielką dumą mówimy o tym, co dzieje się w polskim przemyśle zbrojeniowym. Dzięki
  programowi SAFE miliardy euro, dolarów i złotych płyną do polskiego przemysłu – powiedział Donald
  Tusk podczas Międzynarodowego Salonu Przemysłu Obronnego w Kielcach. Dzięki programowi
  SAFE polski Piorun stał się także ważnym towarem eksportowym. Norwegia, Łotwa i Litwa
  zdecydowały się na zakup naszych zestawów rakietowych, wzmacniając tym samym pozycję Pioruna
  na międzynarodowych rynkach obronnych. Kielce nie są tylko przykładem, tego, że
  mądrze i intensywnie się zbroimy. To także dowód wielkiego gospodarczego sukcesu
  polskich firm, talentów i wynalazców Dzięki współpracy wojska, przedsiębiorców i
  menedżerów tempo rozwoju polskiego przemysłu obronnego znacząco przyspieszyło, czego
  przykładem jest również powstanie nowego ciężkiego bojowego wozu piechoty Niedźwiedź.
  Stworzenie wozu Borsuk wymagało siedmiu lat, a nowy polski Niedźwiedź powstał w
  ciągu 12 miesięcy. To pokazuje skalę postępu, jaki wykonaliśmy w ostatnim czasie
  Ważnym wydarzeniem podczas kieleckich targów było podpisanie przez Polską Grupę Zbrojeniową i
  ICEYE listu intencyjnego dotyczącego współpracy przy budowie polskiego wojskowego
  systemu łączności satelitarnej MILSATCOM. Do końca roku będziemy mieli 9 satelitów,
  które zapewnią wojsku obrazowanie całej planety w ciągu kilku minut Naszą ambicją jest także stworzenie
  „polskiego Starlinka” – suwerennego systemu łączności satelitarnej, który wzmocni
  bezpieczeństwo i niezależność państwa. Doświadczenia wojny rosyjsko-ukraińskiej pokazują,
  że niezawodna łączność ma dziś kluczowe znaczenie na współczesnym polu walki. Polska ma
  potencjał, aby rozwijać w tym obszarze własne zdolności, wzmacniając tym samym bezpieczeństwo
  całej Europy. 11 września 2001 r. w Nowym Jorku doszło do zamachów terrorystycznych na
  World Trade Center, w których zginęło blisko 3 tys. osób, w tym 6 obywateli Polski.
  Atak na USA zapoczątkował tzw. globalną wojnę z terroryzmem. Po raz pierwszy w historii
  NATO uruchomiło art. 5 Traktatu Północnoatlantyckiego, zgodnie z którym zbrojna
  napaść na jednego z członków Sojuszu jest traktowana jako napaść na wszystkich.
  Atak na World Trade Center był testem dla całej zachodniej wspólnoty. Polska w tej
  tragicznej godzinie i później pokazała, że jest sojusznikiem stabilnym i lojalnym. W akcji wymierzonej w
  światowy terroryzm zginęło 43 polskich żołnierzy Nasz kraj zawsze poważnie traktuje
  swoje zobowiązania międzynarodowe i tego samego oczekuje od swoich sojuszników.
  Zasada "jeden za wszystkich, wszyscy za jednego" musi pozostać fundamentem naszej
  wspólnoty. Dziś jest to ważniejsze niż kiedykolwiek wcześniej Przykładem działań
  sojuszniczych jest współpraca Warszawy z Ottawą. Kanada, której reprezentacja gości w
  Kielcach, jest jedynym państwem spoza Unii Europejskiej uczestniczącym w mechanizmie
  SAFE.
