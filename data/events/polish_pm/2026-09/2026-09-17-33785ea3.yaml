title: Polska i Austria razem na rzecz bezpieczeństwa Europy
text: 17 września 1939 r. Armia Czerwona zaatakowała walczącą z Niemcami Polskę, łamiąc
  pakt o nieagresji. Dzisiaj nie wystarczy wspominać tamten czas i czcić pamięć ofiar.
  Razem z naszymi sojusznikami musimy myśleć o tym, jak zabezpieczyć nasze państwa
  i Unię Europejską przed atakami ze strony Rosji – powiedział Premier po spotkaniu
  z Kanclerzem Austrii Christianem Stockerem. W ostatnim czasie wojna rosyjsko-ukraińska
  znacznie przybliżyła się do wschodniej granicy Polski. Dziś odebrałem kolejny komunikat
  – przed chwilą zakończył się masywny i brutalny atak na zachodnią część Ukrainy,
  blisko polskiej granicy. Nasze samoloty były poderwane do akcji i w gotowości W
  obliczu rosyjskiego zagrożenia szczególnego znaczenia nabiera współpraca z partnerami.
  Mam wielką satysfakcję z tego, w jaki sposób pracujemy z Kanclerzem Austrii na rzecz
  bezpieczeństwa Europy i naszych państw. Cieszę się, że przywódca Austrii jest zadeklarowanym
  przyjacielem Polski. W tych trudnych dniach to bardzo dużo znaczy Współpraca i solidarność
  państw europejskich są dziś kluczowe dla bezpieczeństwa naszego kontynentu.
