title: 'Premier: W obliczu tragedii w Krakowie zobaczyliśmy to, co w ludziach najlepsze
  - odwagę policjantów, poświęcenie ratowników i bezinteresowną pomoc ludzi'
text: Sprawca, 24-letni obywatel Polski z województwa świętokrzyskiego, został postrzelony
  przez policjantów i zatrzymany. Poszkodowani trafili pod opiekę lekarzy w krakowskich
  placówkach medycznych. Wśród rannych są również obcokrajowcy. To smutne, że musimy
  spotkać się w tak tragicznym dniu. Przeżywamy to w wielu wymiarach - ludzkim i społecznym.
  Do tej pory w Polsce nie mieliśmy tak drastycznych przypadków terroryzmu – powiedział
  Premier Donald Tusk podczas odprawy w Urzędzie Wojewódzkim w Krakowie. Pierwsi policjanci
  podjęli interwencję niemal natychmiast po zgłoszeniu. Podczas wymiany ognia ze sprawcą
  dwóch funkcjonariuszy odniosło ciężkie obrażenia. Jest to dwóch młodych policjantów
  pracujących w komisariacie Policji w Krakowie. Obydwaj są w stanie ciężkim, mają
  rodziny, są po operacji. Mam nadzieję, że wszystko będzie dobrze – powiedział komendant
  Główny Policji gen. insp. Marek Boroń. Służby rozpoczęły równolegle działania ratownicze
  i zabezpieczanie terenu. 15:00 i 15 sekund – dostajemy pierwszą informację o strzelaninie.
  Do WCPR-u wpływa około 40 zgłoszeń. 15:03 następuje wymiana ognia między sprawcą
  a policjantami – poinformował Komendant Główny Policji gen. insp. Marek Boroń. Policja
  skierowała do działań 30 załóg. Funkcjonariusze zabezpieczyli miejsce tragedii i
  rozpoczęli czynności wspólnie z prokuraturą. Wśród sześciu ofiar śmiertelnych są
  cztery kobiety i dwóch mężczyzn. Potwierdzono śmierć trzech Polek i obywatela Wielkiej
  Brytanii. Tożsamość dwóch osób nie została jeszcze ustalona.
