title: Rosyjskie obiekty naruszyły polską przestrzeń powietrzną. Kolejna odsłona rosyjskiej
  eskalacji
text: 'Podczas nocnych ataków Rosji na Ukrainę doszło do naruszenia polskiej przestrzeni
  powietrznej. W okolicach miejscowości Nowy Lipowiec w powiecie biłgorajskim spadła
  rakieta manewrująca Ch-101. Kolejną ujawniono na terenie zalesionym w powiecie niżańskim,
  w rejonie Rudnika nad Sanem. Z kolei w miejscowości Mołodycz w powiecie jarosławskim
  odnaleziono, według wstępnych ustaleń, elementy drona odrzutowego, rozrzucone na
  rozległym obszarze nieużytków rolnych. Dziś mamy kolejną odsłonę rosyjskiej eskalacji.
  Rosyjskie obiekty naruszyły polską przestrzeń powietrzną, spadły na polską ziemię.
  Nie ma żadnych zniszczeń i ofiar, ale pokazuje to wyraźnie skalę ataku Rosji na
  Ukrainę i to, że najbliższe miesiące będą miesiącami dużych wyzwań - powiedział
  Donald Tusk podczas konferencji prasowej. Szef rządu zaznaczył, że od wczesnych
  godzin porannych pozostaje w stałym kontakcie z Ministrem Obrony Narodowej Władysławem
  Kosiniakiem-Kamyszem, dowództwem Sił Zbrojnych oraz przedstawicielami służb. O sprawie
  jest również na bieżąco informowany Prezydent. Nasza współpraca z Kancelarią Prezydenta
  w kwestiach bezpieczeństwa jest bez zarzutu. Możemy się spierać i będziemy się spierać
  o różne rzeczy, ale w sprawach bezpieczeństwa działamy razem. To wygląda tak, jak
  powinno wyglądać Donald Tusk rozmawiał z Sekretarzem Generalnym NATO Markiem Rutte
  oraz europejskimi liderami. Potwierdził, że obiekty, które spadły na terytorium
  Polski, są rosyjskie. To nie tylko jest moja ocena, ale także moich partnerów zagranicznych,
  że ostatni incydent nie wygląda na przypadek. Wydaje się, że jednak mamy do czynienia
  z intencjonalną prowokacją Rosji Rosyjskie obiekty spadły niedaleko miejsc, w których
  odbywają się ćwiczenia wojsk Koalicji Chętnych, które są wspomagane przez polskich
  żołnierzy. Możliwy związek incydentu z ćwiczeniami pozostaje na tym etapie hipotezą.
  Szef rządu zapowiedział rozmowy z sekretarzem generalnym NATO i przywódcami sojuszniczych
  państw na temat konkretnych działań wzmacniających bezpieczeństwo wschodniej flanki.
  Dzisiejsze zdarzenia potwierdzają naszą trafną diagnozę, że agresywna polityka Rosji
  nie jest problemem tylko Ukrainy, ale też Europy - w tym przede wszystkim państw
  wschodniej flanki. Niezależnie od dzisiejszych zdarzeń wszyscy liderzy regionu –
  od Finlandii, przez państwa bałtyckie i Grupę Wyszehradzką – mają jednoznaczne przekonanie,
  że Polska to właściwy kraj, by kompetentnie rozmawiać o bezpieczeństwie Europy Środkowej
  i Wschodniej Premier podkreślił, że Polska ze względu na swoje położenie i doświadczenia
  historyczne odgrywa istotną rolę w rozmowach dotyczących bezpieczeństwa regionu
  i przyszłości Ukrainy. Dziś na wniosek Premiera Donalda Tuska Prezydent Karol Nawrocki
  dokonał zmian w składzie Rady Ministrów. Bardzo się cieszę, że zakończył się czas
  wyczekiwania na podpis Prezydenta pod nominacjami dla Wicepremiera Andrzeja Domańskiego
  i nowej Minister Funduszy i Polityki Regionalnej Agnieszki Bartol Minister Finansów
  i Gospodarki Andrzej Domański został tym samym czwartym wicepremierem w rządzie
  Donalda Tuska. Myślę, że ta nominacja to kolejny dowód na to, że dla rządu Premiera
  Donalda Tuska gospodarka Polski jest priorytetem. Przez trzy lata udało nam się
  osiągnąć bardzo dużo – Polska to najszybciej rosnąca gospodarka w Unii Europejskiej,
  bierzemy udział w pracach G20, nasze PKB przekroczyło magiczny poziom biliona dolarów
  Wśród kluczowych kierunków dalszego rozwoju wskazał transformację energetyczną i
  cyfrową. Zapowiedział koordynację działań w tych obszarach, rozwój inwestycji w
  odnawialne źródła energii, magazyny energii, sieci przesyłowe i energetykę jądrową,
  a także wspieranie rozwoju sztucznej inteligencji. W styczniu w Warszawie odbędzie
  się szczyt liderów AI z udziałem naukowców, przedsiębiorców i polityków. Dla mnie
  jest niezwykle istotne, aby nasze działania były zawsze w pełni skoordynowane z
  przedsiębiorcami. To oni odpowiadają za tworzenie miejsc pracy, za nasz wzrost gospodarczy.
  W najbliższych dniach spotkam się z liderami wszystkich organizacji polskich pracodawców,
  aby raz jeszcze porozmawiać o priorytetach Kolejnym zadaniem będzie kontynuacja
  procesu deregulacji w ramach inicjatywy Deregulacja 2.0. Andrzej Domański wskazał
  także na potrzebę wzmacniania finansów publicznych przy jednoczesnym utrzymaniu
  wysokich nakładów na bezpieczeństwo. Minister Funduszy i Polityki Regionalnej Agnieszka
  Bartol dotychczas pełniła funkcję stałej przedstawicielki RP przy Unii Europejskiej
  Od wielu miesięcy Agnieszka Bartol dźwigała na swoich barkach współodpowiedzialność
  za naszą pracę w Brukseli, w tym za negocjacje dotyczące Funduszy Europejskich,
  KPO - wszystko, co dla Polski oznacza miliardy euro, a co wymaga nieprzeciętnego
  profesjonalizmu Nowa Minister wskazała trzy główne priorytety swojej pracy: finalizację
  KPO, przyspieszenie wdrażania funduszy strukturalnych oraz przygotowanie planu dalszego
  rozwoju Polski w oparciu o środki europejskie. Pierwszym zadaniem będzie skończenie
  KPO. Dziś Komisja Europejska powinna przyjąć pierwszą pozytywną ocenę wniosku o
  płatność z KPO, nad którym pracowaliśmy od kilku tygodni. Wygląda na to, że wszystko
  będzie dobrze Zapowiedziała również, że jeszcze przed świętami odwiedzi wszystkie
  16 regionów, aby w dialogu z ich przedstawicielami wspólnie wypracować priorytety
  rozwojowe i kierunki wykorzystania funduszy europejskich. Plan wydatkowania środków
  ma powstać w ciągu najbliższych miesięcy.'
