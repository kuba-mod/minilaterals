title: 'Premier po szczycie w Dublinie: Polska będzie odgrywała kluczową rolę w negocjacjach
  w sprawie Ukrainy'
text: Rozwój sztucznej inteligencji i pozycja Europy w globalnym wyścigu technologicznym
  wobec Stanów Zjednoczonych i Chin były jednym z głównych tematów spotkania w Dublinie.
  Przedstawiłem propozycję, żeby Polska koordynowała działania państw członkowskich
  nad stworzeniem jednolitej europejskiej polityki AI, w tym inwestycji, badań i łączenia
  ich z przedsiębiorstwami. Europa potrzebuje w tej sprawie jednolitego rynku – poinformował
  Premier Donald Tusk podczas spotkania z dziennikarzami. Polska dysponuje wybitnymi
  kadrami naukowymi i ekspertami, którzy tworzą przełomowe rozwiązania i odnoszą sukcesy
  na światowych rynkach technologicznych. Znamy sukcesy Matiego Staniszewskiego i
  ElevenLabs, oczywiście ICEYE i Rafał Modrzewski – to jest to pokolenie ludzi, którzy
  stali się prawdziwymi gwiazdami takich firm jak OpenAI, czyli wiodącej firmy, jeśli
  chodzi o sztuczną inteligencję Jednocześnie rozwój nowych technologii wiąże się
  z globalnymi wyzwaniami dla bezpieczeństwa. Naszym celem jest ogólnoświatowa decyzja,
  która ograniczyłaby rozwój AI do bezpiecznego poziomu, tak, jak w przypadku broni
  jądrowej Drugim kluczowym tematem obrad była rola Europy w rozmowach pokojowych
  dotyczących zakończenia wojny w Ukrainie. Liderzy państw członkowskich zgodzili
  się, że decyzje o bezpieczeństwie kontynentu nie mogą zapadać bez udziału kluczowych
  państw europejskich, w tym Polski. Na szczycie rozmawialiśmy o tym, kto ma rozmawiać
  przy stole z Ukrainą, USA i Rosją, w imieniu Europy. Format E5, czyli Wielka Brytania,
  Francja, Polska, Niemcy i Włochy oraz przedstawiciele unijnych instytucji uzyskał
  największe poparcie dla wypełnienia tej roli Europejscy przywódcy zgodzili się że
  reprezentantem na zewnątrz – zgodnie z traktatami – powinien być Przewodniczący
  Rady Europejskiej António Costa. Stanowisko Polski, odrzucające jakiekolwiek ustępstwa
  podważające fundamenty bezpieczeństwa kontynentu, zyskało akceptację przywódców
  zgromadzonych na rozmowach Dublinie. Szef rządu zaznaczył również, że Unia Europejska
  zachowuje jedność wobec rosyjskich żądań. Podczas wizyty w Dublinie Premier spotkał
  się m.in. z Prezydentem Ukrainy Wołodymyrem Zełenskim, Sekretarzem Generalnym NATO
  Markiem Rutte, Kanclerzem Niemiec Friedrichem Merzem oraz gospodarzem szczytu, Premierem
  Irlandii Micheálem Martinem.
