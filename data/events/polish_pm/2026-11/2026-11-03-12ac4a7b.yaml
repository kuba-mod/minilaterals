title: 'Premier po RBN: Była zgoda, że musimy konsolidować władze polityczne i całe
  społeczeństwo wokół kwestii bezpieczeństwa'
text: Jednym z tematów spotkania była budowa stałej bazy wojsk amerykańskich w Polsce.
  Uczestnicy posiedzenia zgodzili się, że realizacja tego projektu wymaga współpracy
  najważniejszych ośrodków władzy. W sprawie bazy amerykańskiej po długiej dyskusji
  uznaliśmy, że główne ośrodki władzy, w tym Prezydent i rząd współpracują i naszym
  zadaniem jest doprowadzenie do szczęśliwego końca tego projektu, a więc stałej obecności
  żołnierzy amerykańskich w Polsce – powiedział Premier Donald Tusk na konferencji
  prasowej po posiedzeniu Rady Bezpieczeństwa Narodowego. Szef rządu zaznaczył, że
  podstawą bezpieczeństwa Polski musi być sprawna i skuteczna polska armia. Jednocześnie
  podkreślił, że utrzymanie i wzmocnienie obecności wojsk amerykańskich w tej części
  Europy, szczególnie w Polsce, znacząco zwiększyłoby nasze bezpieczeństwo. Polska
  mierzy się z ryzykiem zagrożenia ze strony Rosji. Obecna sytuacja geopolityczna
  i ostrzeżenia przekazywane przez służby wymagają, aby bezpieczeństwo obywateli i
  państwa stało się priorytetem – wspólnym dla wszystkich i niezależnym od preferencji
  politycznych. Dzisiaj na sali wszyscy bez wyjątku uznali, że rzeczywiście sytuacja
  geopolityczna i agresywne zachowania ze strony Rosji, także sygnały ostrzegawcze
  ze strony służb różnych państw, w tym też oczywiście naszych służb, to wszystko
  każe nam konsolidować i władze polityczne, i całe społeczeństwo, wokół kwestii bezpieczeństwa
  i tutaj też na szczęście nie ma sporu Premier zaznaczył, że Polska musi być przygotowana
  na różne scenariusze. Nie można z całą pewnością przewidzieć, czy i jakie działania
  wobec państw NATO może podjąć Rosja. Potencjalne zagrożenie jest oczywiste, dotyczące
  jakichś prowokacji i aktów dywersji i dlatego cieszę się, że wszyscy bez wyjątku
  – od Prezydenta po parlamentarzystów tam obecnych – zgodzili się też z naszą filozofią,
  że musimy być przygotowani na różne scenariusze biorąc pod uwagę sytuację na wschodzie
  W posiedzeniu uczestniczyli przedstawiciele wszystkich klubów parlamentarnych, Prezydium
  Sejmu, Kancelarii Prezydenta oraz rządu. Premier podkreślił znaczenie stabilnej
  sytuacji w kraju dla bezpieczeństwa Polski. Kwestia ewentualnych niepokojów społecznych,
  manifestacji to jest coś, na co bardzo liczą państwa nam nieprzychylne. Taka destabilizacja
  polityczna w Polsce, podobnie jak w innych krajach europejskich, jest zawsze na
  rękę i jest wykorzystywana i podsycana przede wszystkim przez rosyjskie służby W
  tym kontekście znaczenie ma również sytuacja wokół Trybunału Konstytucyjnego. Mamy
  różne oceny tego jak wygląda sytuacja w Trybunale Konstytucyjnym, stoimy na stanowisku
  zgodnie z Konstytucją, że sędziowie wybrani przez Sejm są legalnie wybranymi sędziami,
  bo tak stanowi Konstytucja – powinni móc pracować i orzekać, bo to jest ich obowiązek
  i prawo Szef rządu pozytywnie ocenił rozpoczęcie prac przez Zgromadzenie Ogólne
  Sędziów Trybunału Konstytucyjnego. Zwrócił też uwagę, że emocje wokół TK są silniejsze
  wśród polityków niż w społeczeństwie. Zadeklarował również gotowość do bezpośredniej
  rozmowy z Prezydentem. Odczuwamy obaj wspólną odpowiedzialność, żeby w sytuacji
  tego narastającego zagrożenia ze wschodu, w sprawach bezpieczeństwa i ładu wewnętrznego
  starać się szukać tam, gdzie to jest tylko możliwe porozumienia, i żeby łagodzić
  te emocje Szef Rządu zapewnił, że podejmie wszystkie możliwe działania na rzecz
  stabilności w kraju i zapewnienia Trybunałowi Konstytucyjnemu warunków do pracy.
  Mimo utrzymujących się różnic w ocenie sytuacji prawnej Premier zadeklarował gotowość
  do rozmów z Prezydentem Karolem Nawrockim. Zaproponował spotkanie w cztery oczy
  jeszcze w tym tygodniu, aby poszukać sposobów na trwałe ograniczenie napięć.
