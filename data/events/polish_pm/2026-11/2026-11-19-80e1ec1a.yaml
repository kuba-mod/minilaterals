title: Premier zaprasza na Warszawski Szczyt Wysokiego Szczebla w sprawie AI
text: 'Zaproszenie na szczyt jest odpowiedzią na apel 59 czołowych naukowców i przedstawicieli
  biznesu z całej Unii Europejskiej. Naszym celem nie jest przyjęcie kolejnego zestawu
  deklaracji, lecz skoordynowanie wspólnych europejskich działań na rzecz suwerenności
  technologicznej Szczyt w Warszawie będzie okazją do wypracowania konkretnych ram
  współpracy w dwóch obszarach kluczowych dla technologicznej przyszłości Europy.
  Pierwszym filarem inicjatywy jest „EMBL dla AI”, czyli koncepcja stworzenia światowej
  klasy ośrodka łączącego potencjał europejskich badań i doskonałości naukowej z dostępem
  do mocy obliczeniowej, kapitału oraz najwybitniejszych talentów. Jego celem będzie
  rozwój suwerennych modeli sztucznej inteligencji. Drugim filarem jest „Airbus dla
  AI”, czyli strategia utworzenia ogólnoeuropejskiego konsorcjum rozwijającego sztuczną
  inteligencję w świecie fizycznym i w przemyśle ( Physical AI i Industrial AI ).
  Współpraca na poziomie europejskim pozwoli osiągnąć odpowiednią skalę działania
  i wzmocnić pozycję Europy w obszarze technologii autonomicznych. Europa powinna
  zmienić podejście do rozwoju nowych technologii . Jak wielokrotnie podkreślaliśmy
  w rozmowach z naszymi europejskimi partnerami, w tym z Prezydentem Emmanuelem Macronem
  i Premierem Ulfem Kristerssonem, kluczem do konkurencyjności Europy jest odejście
  od czysto defensywnego podejścia regulacyjnego na rzecz aktywnego kreowania rynku
  i rozbudowy infrastruktury technologicznej Szef rządu będzie zachęca przywódców
  państw Unii Europejskiej do poparcia inicjatywy i wspólnego zaangażowania w organizację
  szczytu w Warszawie. 59 europejskich naukowców, ekspertów i przedstawicieli biznesu
  w liście otwartym zaapelowało do przywódców UE o pilne działania na rzecz wzmocnienia
  europejskiej konkurencyjności w obszarze sztucznej inteligencji. Sygnatariusze wskazali
  pięć priorytetów: uproszczenie regulacji, wsparcie rozwoju europejskich firm technologicznych,
  zwiększenie inwestycji publicznych i prywatnych, utworzenie wiodących ośrodków badawczych
  AI oraz przyjęcie wspólnej strategii konkurencyjności. Ich zdaniem kluczowe decyzje
  muszą zapaść już teraz, zwłaszcza podczas negocjacji budżetu UE na lata 2028–2034,
  aby Europa nie utraciła suwerenności technologicznej i zdolności do konkurowania
  z USA i Chinami.'
