title: 'Premier w Sejmie: Marcin Kierwiński będzie dalej szefem MSWiA, bo ściga bandytów,
  chroni bezpieczeństwo Polaków i polskie granice'
text: Sejm odrzucił wniosek o wotum nieufności wobec szefa MSWiA Marcina Kierwińskiego.
  To już trzecie takie głosowanie przegrane przez opozycję. Chcę, Panie Ministrze,
  drogi Marcinie, bardzo ci podziękować za te trzy lata, tak z głębi serca. Bo pracujesz
  w warunkach, kiedy największe partie opozycyjne każdego praktycznie dnia atakują
  nie tylko ciebie, ale przede wszystkim atakują interweniujących dla dobra i bezpieczeństwa
  Polaków policjantów, Straż Pożarną czy Straż Graniczną – powiedział Premier Donald
  Tusk podczas wystąpienia z mównicy sejmowej. Polska to dziś europejski lider - skutecznie
  chronimy swoje granice, mimo trwającej wojny w Ukrainie oraz aktów sabotażu i dywersji.
  W pierwszej połowie 2026 r. funkcjonariusze Straży Granicznej udaremnili każdą próbę
  nielegalnego przekroczenia granicy. Nasze granice są uznawane dzisiaj za najbezpieczniejsze
  w Europie w czasie, kiedy trwa gorąca wojna, dywersja na granicy organizowana przez
  Łukaszenkę i próby dywersji bardzo niepokojące na granicy polsko-rosyjskiej. A mimo
  to, za rządów Koalicji 15 Października, gdzie Ministrem Spraw Wewnętrznych jest
  Marcin Kierwiński, polskie granice – które są także granicami europejskimi – są
  w całej Europie uznawane za najlepiej strzeżone Liczba prób nielegalnego przekroczenia
  granicy zmniejszyła się 65-krotnie. Jednocześnie trzykrotnie wzrosła liczba osób
  deportowanych z kraju. Nielegalne przejścia przez polsko-białoruską granicę za waszych
  czasów to było nawet 20–25 tysięcy miesięcznie. To jest w ogóle coś nieporównywalnego
  – dodał Donald Tusk, zwracając się do posłów PiS. Wizy wydawane przez Polskę przestały
  być też – jak to miało miejsce za czasów poprzedniego rządu – najłatwiejszym sposobem
  na organizowanie nielegalnej migracji do naszego kraju. Ograniczenie nielegalnej
  migracji wymagało również zdecydowanych działań. Wam się w głowie nie mieści, że
  można w sprawie nielegalnej migracji podjąć cykl bardzo ważnych decyzji, które tę
  nielegalną migrację powstrzymają – bez używania ksenofobicznych, rasistowskich i
  ohydnych ataków na ludzi z różnych stron świata Jednym z nich jest czasowe ograniczenie
  prawa do azylu, które było instrumentalnie wykorzystywane przez nieprzychylne Polsce
  państwa, głównie białoruski reżim. I to jest zasługa Marcina Kierwińskiego. Mieliście
  gęby pełne frazesów na ten temat, od rana do wieczora opowiadaliście najrozmaitsze
  bzdury, szermowaliście agresywnymi sloganami, ale byliście kompletnie bezradni w
  tych sprawach Rozwiązania stosowane w Polsce zyskują poparcie państw europejskich,
  które mierzą się z podobnymi wyzwaniami. Dzięki temu polskie stanowisko w kwestii
  bezpieczeństwa i migracji jest coraz lepiej słyszalne w Unii Europejskiej. Po ataku
  Rosji na Ukrainę, Polska przyjęła miliony uchodźców, jednak nie spowodowało to wzrostu
  przestępczości. Przeciwnie – liczba przestępstw kryminalnych i drogowych zmniejszyła
  się. My przyjęliśmy uchodźców z Ukrainy w związku z wojną, a Marcin Kierwiński jako
  minister spowodował, że przestępstwa kryminalne, drogowe zmalały. Ta ilość przestępstw
  jest dzisiaj mniejsza niż za waszych czasów, chociaż on pracuje w nieporównywalnie
  trudniejszych warunkach Mimo intensywnych prób destabilizacji sytuacji akty sabotażu
  i dywersji w Polsce zdarzają się relatywnie rzadko. To dzięki działaniom służb,
  które realizują swoje zadania pomimo ograniczeń wynikających z prób blokowania przez
  opozycję i Prezydenta środków z SAFE przeznaczonych na ich nowoczesne wyposażenie.
  Niestety jesteście przeciwko nam wtedy, gdy chcemy, by polska Policja i Straż Graniczna
  były lepiej wyposażone. Ciągle nie wszyscy to rozumieją, na czym polegała blokada
  SAFE przez Prezydenta Nawrockiego i PiS. Ta blokada uniemożliwiła przekazanie miliardów
  złotych do Policji i Straży Granicznej, ale znaleźliśmy sposoby, by naprawić ten
  sabotaż W 2026 r. budżet Policji wyniósł rekordowe 20,1 mld zł. To o 5,9 mld zł
  więcej niż w 2023 r., kiedy na funkcjonowanie największej formacji mundurowej w
  Polsce przeznaczono 14,2 mld zł.
