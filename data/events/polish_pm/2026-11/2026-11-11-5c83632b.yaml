title: Każdy, kto ma Polskę w sercu, musi zrozumieć, że niepodległość to dobro wspólne
text: 'Niepodległość i wolność wymagają stałej troski i odpowiedzialności obywateli.
  Wolność, niepodległość, bezpieczeństwo wymagają stałego wysiłku. Wszyscy bez wyjątku,
  niezależnie od poglądów, pochodzenia, wiary, wszyscy bez wyjątku jesteśmy odpowiedzialni
  za to, żeby Polska była już zawsze silna, bezpieczna, wolna i niepodległa – mówił
  w Szczecinie Premier Donald Tusk. Premier nawiązał również do historii Polski, w
  tym ostatnich wydarzeń, które miały miejsce w Krakowie. Za nami trudne dni. Cała
  nasza historia składa się z dni radosnych i trudnych, z czasów pokoju i walki. Ale
  zawsze tego dnia, 11 listopada, wszystkie nasze serca są biało-czerwone Szef rządu
  zaapelował o dialog i solidarność ponad podziałami. Każdy, kto ma Polskę w sercu,
  musi zrozumieć, że niepodległość, wolność i bezpieczna Rzeczpospolita, to jest dobro
  wspólne. Musimy umieć o tym rozmawiać razem, bez zaciekłości, bez nienawiści. Umiejmy
  dzisiaj, 11 listopada, wyciągnąć do siebie nasze dłonie, niezależnie od tego, z
  jakich miejsc przychodzimy Szef rządu zaprosił do swojego domu w Sopocie Prezydenta
  Karola Nawrockiego. Podzielmy się opłatkiem przed Wigilią, porozmawiajmy. Moje mieszkanie
  nieduże, ale znajdzie się dla nas miejsce w kuchni przy stole i porozmawiamy, jak
  to się kiedyś mówiło, jak Polak z Polakiem. Polska warta jest naszej rozmowy. Polska
  warta jest solidarności Polek i Polaków. Nie zmarnujmy tego wielkiego wysiłku. Nie
  zmarnujmy tego cudu, jaki się nam zdarzył ponownie w naszej historii To drugie zaproszenie
  na spotkanie skierowane przez Premiera do Karola Nawrockiego. Pierwsze było związane
  z próbą złagodzenia napięć politycznych w związku z sytuacją wokół Trybunału Konstytucyjnego
  i zapewnienia stabilności wewnętrznej państwa. Polska, zgodnie z przesłaniem Marszałka
  Józefa Piłsudskiego, konsekwentnie stara się odsuwać zagrożenia dla swojej wolności
  jak najdalej od granic. Równie ważne jest, aby dostrzegać niebezpieczeństwo, które
  pochodzi z wewnątrz kraju. Musimy uporać się z tym, co wewnątrz może zagrażać polskiej
  wolności i niepodległości. Dosyć tej wielkiej szkody, jaką była Targowica. Polska
  dzisiaj musi być zjednoczona wokół spraw najważniejszych Jest to także nauka dla
  wszystkich - współczesna Polska musi być zjednoczona wokół spraw fundamentalnych,
  aby nie dopuścić do powtórzenia błędów z przeszłości. Musimy sobie to wziąć wszyscy
  do serca, niezależnie od poglądów – jesteśmy odpowiedzialni za to, aby nigdy z polskiej
  przyczyny polska krew się nie rozlała. Polak nie może podnosić ręki na drugiego
  Polaka. Nasze spory szczególnie dziś nie mogą być ważniejsze niż bezpieczeństwo
  i jedność Ojczyzny Wydarzenia w Krakowie przypomniały, jak ważne są odwaga, solidarność
  i poświęcenie w obronie ludzkiego życia. Premier podkreślił bohaterstwo dwóch policjantów:
  Artura Morańskiego i Jakuba Kulika, którzy, ratując innych, sami narazili się na
  niebezpieczeństwo. Dlatego z takim pełnym przekonaniem dzisiaj, pamiętając o naszych
  bohaterskich policjantach, chcę powiedzieć, że zrobimy wszystko, aby Polska była
  nadal tym najbezpieczniejszym miejscem w Europie Premier wyraził również solidarność
  z mieszkańcami Krakowa oraz Ostrowca Świętokrzyskiego, miasta skąd pochodził zamachowiec.
  Ponownie podziękował także wszystkim funkcjonariuszom, przedstawicielom służb oraz
  mieszkańcom za ich postawę i heroizm. Polska jest dziś 20. gospodarką świata, a
  przykładem ambicji i kompetencji naszego kraju jest nowy polski prom „Bursztyn”.
  To pierwszy od 22 lat prom towarowo-pasażerski, który będzie pływał pod polską banderą.
  Ten prom, który dzisiaj stoi tu jako znak dumy, zdolności, kompetencji, wizji Polek
  i Polaków pokazuje, że nie zmarnowaliśmy tego czasu, że potrafimy budować rzeczy
  wielkie i ważne. Dziś to symbol tego, co potrafimy robić. Aby ta duma stała się
  czymś trwałym Prom „Bursztyn” to drugi z trzech statków budowanych dla Polskiej
  Żeglugi Morskiej w ramach programu „Polskie Morze”. Nowoczesna flota to silna Polska
  na Bałtyku i w nią inwestujemy. 22 lata temu zdjęto polską banderę z ostatniego
  statku należącego do Polskiej Żeglugi Morskiej. Dziś z wielką dumą mogę powiedzieć:
  polska bandera powraca! Niech żyje niepodległa Polska, niech żyje polska bandera,
  niech żyje morski Szczecin! – mówił Sekretarz Stanu w Ministerstwie Infrastruktury
  Arkadiusz Marchewka. Prom „Bursztyn” i jego bliźniaczy „Jantar” należą do „Unity
  Line”, jednego z największych bałtyckich armatorów, wchodzącego w skład Polskiej
  Żeglugi Morskiej. Jesteśmy dumni z Polski, a wielkie inwestycje infrastrukturalne
  nabierają tempa w każdej części naszego kraju. Nasi przodkowie wywalczyli dla nas
  niepodległość. My Polskę musimy bronić, musimy o nią dbać i zostawić ją jeszcze
  lepszą dla przyszłych pokoleń – podkreślił Minister Infrastruktury Dariusz Klimczak.
  Program „Polskie Morze” zakłada m.in. rozwój sektora stoczniowego i przywrócenie
  polskiej bandery na statkach handlowych należących do polskich armatorów.'
