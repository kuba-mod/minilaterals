title: Rosyjska agresja przekroczyła granice Ukrainy. Premier z apelem o solidarność
  z Polską
text: Szczyt liderów Grupy Wyszehradzkiej (V4) z udziałem kanclerza Austrii poświęcony
  był najważniejszym kwestiom unijnym. Premier Donald Tusk podkreślił zgodność państw
  regionu w sprawie przyszłego budżetu UE, cen energii, ETS, polityki spójności i
  rolnej, mimo różnic niektórych kwestiach. Dla mnie jest bardzo ważne, że nasi partnerzy
  z Grupy Wyszehradzkiej potwierdzili, że są gotowi na najbliższej Radzie Europejskiej
  postawić bardzo twardo sprawy, które nas łączą. Ja jako premier polskiego rządu
  nie zaakceptuję propozycji, które zostały przedstawione przez UE - powiedział Donald
  Tusk na konferencji prasowej w Bratysławie. Przewodniczący Rady Europejskiej Antonio
  Costa zaproponował w sobotę, by nowy budżet UE na lata 2028-34 był o 10 proc. mniejszy
  w stosunku do pierwotnego projektu. Sytuacja geopolityczna, rosyjska agresja na
  Ukrainę oraz wysokie ceny energii uzasadniają zwiększenie, a nie ograniczanie nakładów
  europejskich na państwa Europy Środkowej. Będę bardzo stanowczy i nie zaakceptuję
  takiej wersji unijnego budżetu, która miałaby oznaczać wyższe ceny energii, dotkliwe
  koszty społeczne albo osłabienie obronności Polski i innych krajów flanki wschodniej
  Zapowiedział, że będzie przekonywał unijnych partnerów podczas najbliższej Rady
  Europejskiej do uwzględnienia tych argumentów. Liderzy V4 uzgodnili również wystosowanie
  wspólnego listu do kierownictwa UE ws. systemów ETS 1 i ETS 2. Państwa Grupy Wyszehradzkiej
  postulują odłożenie wdrożenia systemu ETS2 dla sektora mieszkalnictwa i transportu
  co najmniej do 2030 roku. Wskazują również na konieczność dalszych zmian w ETS1,
  ponieważ wydłużenie okresu przydziału bezpłatnych uprawnień dla przedsiębiorstw
  nie wystarczy, by ograniczyć wpływ systemu na ceny energii.
