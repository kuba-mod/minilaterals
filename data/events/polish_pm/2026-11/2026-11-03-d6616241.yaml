title: Bezpieczeństwo Polski nie może być przedmiotem politycznej gry
text: Polskie służby udaremniły możliwą prowokację na granicy z Rosją w rejonie Obwodu
  Królewieckiego. W związku z ostrzeżeniami o możliwych działaniach dywersyjnych i
  destabilizacyjnych służby pozostają w stanie podwyższonej gotowości. Tuż po północy
  otrzymałem meldunki od Straży Granicznej o zaobserwowaniu niepokojącego ruchu na
  granicy polsko-rosyjskiej. Zmobilizowaliśmy siły i skutecznie zapobiegliśmy próbie
  prowokacji Sprawne współdziałanie funkcjonariuszy Policji, Straży Granicznej i jednostek
  kontrterrorystycznych zapobiegło eskalacji incydentu. Napięcie i eskalacja ze strony
  Rosji mogą potrwać i dalej musimy być skupieni oraz gotowi, żeby zapobiegać ewentualnym
  prowokacjom Sygnały o możliwych prowokacjach inspirowanych przez Rosję, Polski rząd
  otrzymywał zarówno od polskich jak i sojuszniczych służb, w tym NATO. Dlatego na
  terenie województwa warmińsko-mazurskiego i Podlasia działa specjalna grupa operacyjna,
  którą tworzą m.in. policjanci, funkcjonariusze Straży Granicznej, kontrterroryści
  oraz żołnierze jednostki GROM.
