title: 'Premier: Będziemy pamiętać o wszystkich bohaterach tragicznych wydarzeń w
  Krakowie'
text: Premier Donald Tusk i Rada Ministrów uczcili minutą ciszy pamięć ofiar sobotniej
  strzelaniny w Krakowie. W imieniu własnym i całego polskiego narodu dziękuję wszystkim,
  którzy natychmiast zareagowali na tragiczne zdarzenia w Krakowie - powiedział Premier
  Donald Tusk przed posiedzeniem rządu. Działania służb, a także odwaga i poświęcenie
  osób zaangażowanych w interwencję spotkały się z uznaniem na całym świecie. Dzięki
  wszystkim zaangażowanym w tę akcję, którą podjęto błyskawicznie, uratowano wiele
  istnień ludzkich. To, co odkryto w samochodzie zamachowca, daje wyobrażenie o możliwej
  skali tragedii W samochodzie zamachowca znaleziono 500 sztuk amunicji, broń i tłumik,
  przygotowane do kontynuowania ataku. Bardzo szybko, nieodpowiedzialni ludzie, ruszyli
  do sugestii dotyczących narodowości, języka i koloru skóry sprawcy. Na szczęście
  dzięki sprawnej pracy służb mamy coraz więcej dowodów, które pozwolą wyjaśnić tę
  tragedię Przekazywanie opinii publicznej informacji przez służby i prokuraturę pozwoliło
  również ograniczyć niepotrzebne spekulacje i emocje dotyczące okoliczności zamachu.
  Premier podziękował osobom i instytucjom, które spontanicznie rozpoczęły zbiórki
  pieniędzy dla rodzin ofiar i poszkodowanych.  Zapewnił jednocześnie, że państwo
  weźmie odpowiedzialność za pełną pomoc rodzinom zabitych, rannym policjantom, ich
  bliskim oraz wszystkim osobom poszkodowanym w ataku. Nie będziemy tutaj wahać się
  ani chwili. Wszyscy poszkodowani w tym strasznym ataku otrzymają ponadstandardową
  pomoc ze strony państwa Zaapelował również do ministrów o gromadzenie informacji
  o potrzebach poszkodowanych i niezwłoczne ich przekazywanie. Donald Tusk zapowiedział
  pilny przegląd wszystkich przepisów dotyczących dostępu do broni. Szef rządu przypomniał,
  że sprawca zamachu w Krakowie przeszedł badania psychologiczne niespełna rok temu
  Proszę Ministra Kierwińskiego, Ministra Siemoniaka i Minister Knapińską o pilny
  przegląd wszystkich przepisów dotyczących posiadania broni. Musimy mieć pewność,
  że Polska wciąż będzie najbezpieczniejszym krajem Ewentualne zmiany muszą być poprzedzone
  rzetelną analizą, a nie podejmowane pod wpływem emocji. Choć nie da się całkowicie
  wyeliminować ryzyka, państwo powinno wykorzystać wszystkie dostępne możliwości,
  by zapobiegać podobnym tragediom. Premier poinformował, że wypracowano mechanizm
  przekazania dodatkowych środków służbom odpowiedzialnym za bezpieczeństwo wewnętrzne.
  Pomimo pierwotnej prezydenckiej blokady SAFE, ponad 6 mld zł dodatkowo trafi do
  Policji, Straży Pożarnej, Straży Granicznej, do SOP Wkrótce przyjęte zostanie w
  tej sprawie rozporządzenie. Dodatkowo Rada Ministrów przyjęła dziś projekt ustawy
  zaostrzającej odpowiedzialność karną za ataki na funkcjonariuszy Policji. Po wprowadzeniu
  tych przepisów, każdy atak na funkcjonariusza z przedmiotem, który może zagrażać
  jego życiu i zdrowiu, będzie zagrożony karą do 10 lat więzienia Obecnie surowsza
  odpowiedzialność grozi m.in. za napaść z użyciem broni palnej, noża lub innego podobnie
  niebezpiecznego przedmiotu. Przepisy nie określają jednak jasno, jak traktować inne
  niebezpieczne zachowania, np. celowe skierowanie samochodu na funkcjonariusza. Premier
  zwrócił uwagę na konieczność skuteczniejszego przeciwdziałania nielegalnym i szkodliwym
  treściom w internecie, w szczególności materiałom propagującym nienawiść i zagrażającym
  bezpieczeństwu dzieci oraz młodzieży. Wciąż czekamy na podpis Prezydenta pod DSA.
  Pora, żeby przestrzeń wirtualna była traktowana z całą powagą. Nie mówimy o cenzurze,
  ale o traktowaniu tego, co dzieje się w internecie, tak samo jak tego, co dzieje
  się w przestrzeni realnej Zapowiedział również dalsze prace nad rozwiązaniami ograniczającymi
  nadużywanie wizerunku osób znanych i prywatnych w celach reklamowych oraz innych,
  szczególnie z wykorzystaniem sztucznej inteligencji. Rząd ma zająć się społecznym
  projektem ustawy w tej sprawie. Premier poinformował także, że otrzymał z Trybunału
  Konstytucyjnego uchwałę Zgromadzenia Ogólnego Sędziów dotyczącą zmiany regulaminu
  Trybunału, przeznaczoną do publikacji w Dzienniku Urzędowym. Dzisiaj mogę ogłosić
  początek nowej ery - prawidłowo wybrany i obsadzony Trybunał Konstytucyjny zaczął
  działać Jak podkreślił, będzie to pierwsza od lat publikacja rozstrzygnięcia tego
  organu, który uznał za prawidłowo obsadzony. 11 listopada w Szczecinie odbędzie
  się uroczystość chrztu oraz podniesienia polskiej bandery na promie „Bursztyn”.
  To druga z trzech jednostek samochodowo-pasażerskich budowanych w ramach programu
  „Polskie Morze” dla Polskiej Żeglugi Morskiej. Polska stocznia zbudowała ten prom,
  robi gigantyczne wrażenie. Jutro biało-czerwona [bandera] będzie nad tym promem
  sygnałem dla Polski i całego świata, że wracamy na morza i na Bałtyk naprawdę na
  dużą skalę Jutrzejsza uroczystość będzie symbolicznym prezentem dla wszystkich Polaków
  z okazji Narodowego Święta Niepodległości.
