title: Kolej jest ponownie powodem do dumy
text: W pierwszej kadencji rządu Premiera Donalda Tuska priorytetem była rozbudowa
  nowoczesnej infrastruktury drogowej. Rząd równie duży nacisk kładzie dziś na rozwój
  kolei. Modernizacja linii, zakup nowoczesnego taboru i rozwój połączeń kolejowych
  poprawiają dostępność transportu, skracają czas podróży i podnoszą komfort pasażerów.
  Zależało mi na odblokowaniu środków unijnych, ponieważ wiedziałem, że te miliardy
  euro pozwolą unowocześnić polską kolej na niespotykaną dotąd skalę Z Krajowego Planu
  Odbudowy rząd przeznaczył na rozwój kolei 18 mld zł, a z Funduszu Spójności – 24
  mld zł. Łącznie to ponad 42 mld zł na modernizację linii kolejowych, zakup nowoczesnego
  taboru i poprawę komfortu podróżowania. Dziś symbolem zmian na polskiej kolei jest
  fakt, że pociągi w Polsce są bardziej punktualne niż w Niemczech Roczna liczba pasażerów
  polskich kolei jest porównywalna z liczbą mieszkańców całej Unii Europejskiej. Rozwijana
  jest także sieć połączeń, dzięki którym pociągi docierają do kolejnych miejscowości,
  w tym wielu miast powiatowych. Realizujemy także ambitny program „100 minut”, dzięki
  któremu już w przyszłym roku podróż z Warszawy do Krakowa czy Katowic zajmie mniej
  niż dwie godziny Rząd rozwija również projekt Port Polska – jedną z największych
  inwestycji infrastrukturalnych w kraju. Kluczowym elementem przedsięwzięcia będzie
  budowa połączeń kolejowych, które zapewnią szybki i wygodny dojazd do nowego lotniska
  z różnych części Polski. To także ogromny wysiłek kolejarzy, dzięki któremu nasz
  kraj ma szansę stać się ważnym hubem komunikacyjnym, łączącym nie tylko polskie
  miasta, ale również znaczną część Europy Donald Tusk podziękował również wszystkim
  kolejarzom za ich codzienną pracę i wkład w rozwój polskiej kolei. Nawiązał do przedwojennej
  tradycji, kiedy zawód kolejarza cieszył się dużym prestiżem społecznym. Dziś, po
  latach zapaści, kolej ponownie jest powodem do dumy, a jej pracownicy odgrywają
  ważną rolę w modernizacji kraju i jego rozwoju.
