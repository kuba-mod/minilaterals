title: 'Premier o wotum nieufności: To polityczna hucpa'
text: 'W trakcie debaty sejmowej Premier Donald Tusk zwrócił uwagę na niską frekwencję
  wnioskodawców podczas uzasadniania wniosku o wotum nieufności. Zakwestionował także
  wiarygodność zarzutów formułowanych przez ugrupowania, które wcześniej sprawowały
  władzę. Szczególnie, powiem szczerze, rozbawiła mnie fraza, w której pan Mateusz
  Morawiecki z autentyczną emocją potępił rządy PiS-u i PiS jako taki. To jest już
  naprawdę mistrzostwo świata – powiedział Premier podczas wystąpienia w trakcie debaty
  sejmowej. Były szef rządu sam odpowiadał za politykę PiS przez znaczną część ośmiu
  lat jego rządów, które teraz krytykował. Premier nawiązał także do kampanii z 2023
  roku, podczas której Mateusz Morawiecki również mijał się z prawdą. Powiedziałem:
  „Mateusz, ale z ciebie bambik". Nie doszacowałem wtedy. Jak dzisiaj słuchałem pańskiego
  wystąpienia, to muszę powiedzieć, że przekroczył pan samego siebie Premier zakwestionował
  także wiarygodność zarzutów formułowanych przez ugrupowania, które wcześniej sprawowały
  władzę. Dobrze wiem, dlaczego w ławach opozycji widać taką nerwowość i tyle złych
  emocji. Nie ma dnia, żeby Polska nie dowiadywała się, dlaczego tak bardzo zależy
  im na powrocie do władzy. Chodzi o pieniądze, bezkarność, brak poszanowania praw
  człowieka i wszechobecne kłamstwo Szef rządu odniósł się również do kandydatury
  Marka Jurka jako premiera. Przypomniał jego wcześniejsze wypowiedzi dotyczące kar
  cielesnych wobec dzieci, przemocy domowej, osób homoseksualnych oraz zapłodnienia
  in vitro. Pan Marek Jurek o in vitro: „To ustawa o selekcji dzieci do urodzenia.
  Nie można poczynać dzieci jako produktu, jako materiału, żadnego dziecka nie można
  wylewać do zlewu" Dzisiaj przedstawiono statystykę urodzeń in vitro. Ponad 18 tysięcy
  dzieci urodziło się w Polsce dzięki in vitro. 18 tysięcy szczęść, radości i szczęśliwych
  par rodzicielskich Szef rządu zapytał posłów opozycji, czy podzielają skrajne poglądy
  swojego kandydata, który kwestionował prawo tysięcy polskich rodzin do posiadania
  dzieci. Donald Tusk ostrzegł także przed konsekwencjami ewentualnego powrotu do
  władzy środowisk zjednoczonych wokół haseł ograniczających prawa obywatelskie oraz
  bezpieczeństwo najsłabszych grup społecznych. Można się dziś śmiać z tego nieudolnie
  sformułowanego wniosku ws. wotum nieufności, ale nie ma co się śmiać z tego, co
  grozi Polsce, jeśli ta prawica, zjednoczona wokół takich idei, dojdzie do władzy
  Szef rządu zapewnił, że Rada Ministrów będzie z pełną determinacją bronić praw kobiet,
  dzieci oraz osób bezbronnych i słabszych. Jednocześnie podkreślił, że rząd ochroni
  demokratyczne fundamenty państwa i nie dopuści do powrotu praktyk z czasów poprzednich
  rządów.'
