title: Bliskie relacje, wspólne cele. Polska i Czechy rozwijają współpracę w Europie
text: Polskę i Czechy łączą bliskie relacje oraz wspólne cele, które sprzyjają dalszemu
  rozwijaniu współpracy między oboma państwami. Wspólne interesy naszych krajów, a
  także nasza osobista przyjaźń, to jest bardzo solidny fundament na przyszłość. Staliście
  się dla Polaków najbardziej popularnymi sąsiadami – ocenił Donald Tusk po spotkaniu
  z Andrejem Babišem. Nasza współpraca z Czechami jest ważnym elementem stabilizującym
  region Europy Środkowo-Wschodniej. Udało nam się ożywić działalność Grupy Wyszehradzkiej,
  która ponownie odgrywa kluczową rolę Unii Europejskiej Warszawa i Praga rozwijają
  także bliską współpracę gospodarczą. Czechy są drugim najważniejszym partnerem handlowym
  Polski. Wartość naszego eksportu na czeski rynek sięga prawie 100 mld zł. Biorąc
  pod uwagę wielkość obu państw, jest to imponująca skala współpracy. W ciągu ostatnich
  5 lat wartość eksportu wzrosła o ponad 60% Na bliskie relacje polsko-czeskie oraz
  wspólne priorytety obu państw zwrócił uwagę także Premier Andrej Babiš. Polska jest
  jednym z najbliższych partnerów Czech w Europie. Mamy nie tylko dobre stosunki sąsiedzkie,
  ale także wspólne interesy, jeżeli chodzi o bezpieczeństwo, obronę, energetykę Polska
  i Czechy współpracują także w zakresie infrastruktury i wspólnie realizują inwestycje
  wzmacniające połączenia w regionie. Polska inwestuje w rozbudowę portów bałtyckich
  i rozwija połączenia na osi północ–południe. Czechy również inwestują w infrastrukturę
  łączącą Polskę z innymi krajami Europy Środkowej i Południowej Z naszym południowym
  sąsiadem łączy nas również podobna ocena wyzwań i zagrożeń dla bezpieczeństwa regionu.
  Polska i Czechy zacieśniają współpracę w tym obszarze, rozwijając partnerstwo przemysłów
  zbrojeniowych oraz wspólne działania na rzecz cyberbezpieczeństwa i przeciwdziałania
  aktom dywersji i sabotażu. Warszawa i Praga będą ściśle współpracować na forum UE
  w sprawach dotyczących budżetu, funduszy europejskich oraz systemów ETS i ETS2.
  Oba państwa chcą uwzględnienia specyfiki swoich gospodarek i kosztów transformacji
  energetycznej. Polska i Czechy nie mogą być skazane na straty związane z kosztami
  ochrony klimatu. Nie może się to odbywać kosztem naszych państw. Będziemy blisko
  współpracować w kwestii ETS i ETS2, aby uwzględniono uwarunkowania naszych gospodarek,
  ich historię i strukturę energetyczną Warszawa i Praga mają także podobną ocenę
  kwestii odporności europejskiego przemysłu. Nie może być tak, że takie projekty
  jak Zielony Ład będą osłabiać naszą konkurencyjność. Nie możemy znaleźć się w gorszej
  sytuacji niż inne państwa europejskie Polska i Czechy mają ponadto zbieżne stanowiska
  w sprawie przeciwdziałania nielegalnej migracji. Oba państwa opowiadają się za skuteczną
  ochroną europejskich granic. W kwestii nielegalnej migracji mamy w 100% wspólne
  poglądy. Europa powinna chronić swoje terytorium. Polska pokazuje, że można działać
  stanowczo, a jednocześnie z poszanowaniem godności ludzkiej Podczas spotkania w
  Warszawie Donald Tusk i Andrej Babiš uzgodnili również, że podejmą starania, aby
  jeszcze w tym roku odbyły się polsko-czeskie konsultacje międzyrządowe.
