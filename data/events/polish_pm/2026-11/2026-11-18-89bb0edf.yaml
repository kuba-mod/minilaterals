title: Budujemy bezpieczeństwo energetyczne razem z sojusznikami. Inwestycje, dywersyfikacja
  i współpraca transatlantycka
text: Kryzys energetyczny wywołany wojną na Bliskim Wschodzie i blokadą Cieśniny Ormuz
  sprawił, że bezpieczeństwo energetyczne przestało być wyłącznie tematem debat ekspertów
  i polityków. Dziś to kwestia, która bezpośrednio dotyczy każdego obywatela. Energia
  stała się fundamentem najbardziej konkretnego, fizycznego bezpieczeństwa Polski
  i całego naszego kontynentu – powiedział Premier Donald Tusk podczas otwarcia spotkania
  poświęconego transatlantyckiej współpracy energetycznej. W obliczu wojny w Ukrainie,
  napięć geopolitycznych i niepewności na światowych rynkach ważna jest ścisła współpraca
  Polski, Europy i USA. Zawsze miałem głębokie przekonanie, że przyjaźń i wzajemna
  lojalność między Stanami Zjednoczonymi a Europą, a także między Polską a USA, to
  nie tylko fundament bezpieczeństwa oraz stabilności gospodarczej i energetycznej,
  ale również fundament naszej cywilizacji Znaczenie współpracy transatlantyckiej
  jest szczególnie istotne w czasie rosyjskiej agresji na Ukrainę. W czasie globalnego
  zamieszania i wojny za naszą granicą, musimy mieć świadomość, że przyszłość Zachodu
  jest bezpośrednio związana ze współpracą i lojalnością między Polską, Europą a Stanami
  Zjednoczonymi. Kwestia sojuszu w tej sprawie to nie jest coś, co powinniśmy negocjować
  W ramach współpracy transatlantyckiej istotne jest również kontynuowanie dziedzictwa
  Prezydenta USA Ronalda Reagana, opartego na obronie wolności, jedności świata zachodniego
  i wspólnym przeciwstawianiu się współczesnym zagrożeniom. Nasz kraj realizuje jeden
  z największych programów inwestycyjnych w sektorze energetycznym w Europie. Inwestujemy
  miliardy euro w rozwój sieci energetycznych, terminali oraz budowę pierwszej elektrowni
  jądrowej. Rozmawiamy także o perspektywie powstania drugiej elektrowni i poszukujemy
  innowacyjnych metod wytwarzania energii. Dywersyfikacja, nowoczesność, innowacyjność,
  różne źródła energii i współpraca oparta na wzajemnym zaufaniu i przyjaźni – to
  przyszłość energetyki nie tylko w Polsce. Żyjemy w trudnych czasach, ale żyjemy
  też w najlepszym miejscu na Ziemi Dzięki konsekwentnym inwestycjom w infrastrukturę
  energetyczną Polska dysponuje dziś zdywersyfikowanym systemem dostaw gazu i jest
  niezależna od surowca sprowadzanego z Rosji. Zdecydowaliśmy się w Polsce, a potem
  przekonaliśmy do tego Europę, by uniezależnić się od jednego źródła energii. Lata,
  kiedy budowano zależność od Rosji, są już za nami Polityka energetyczna wymaga także
  racjonalnego podejścia, uwzględniającego bezpieczeństwo, stabilność dostaw i potrzeby
  gospodarki. Bardzo byśmy chcieli, aby w UE zaczęto myśleć o energii w sposób pragmatyczny,
  bez ideologicznego zadęcia. Polska będzie przykładem mądrej, bezpiecznej i racjonalnej
  polityki energetycznej dla całej Europy Jednym z tematów Spotkania Partnerstwa na
  rzecz Transatlantyckiej Współpracy Energetycznej było również dalsze wsparcie Ukrainy,
  szczególnie w okresie zimowym, kiedy rosyjskie ataki na infrastrukturę energetyczną
  poważnie zagrażają bezpieczeństwu i utrudniają codzienne życie mieszkańców.
