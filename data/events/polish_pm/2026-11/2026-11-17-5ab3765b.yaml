title: 'Premier: Zdecydowaliśmy o zamrożeniu cen gazu'
text: Ceny gazu na europejskich rynkach systematycznie rosną w związku z wojną i kryzysem
  w cieśninie Ormuz. Notowania osiągnęły poziom około 100 euro za megawatogodzinę,
  czyli ponad 450 zł. To najwyższa cena od ponad roku. Mam dobrą wiadomość dla polskich
  rodzin - zdecydowaliśmy o zamrożeniu cen gazu dla odbiorców indywidualnych i gospodarstw
  rodzinnych - powiedział Donald Tusk przed posiedzeniem Rady Ministrów. Dzięki przyjętym
  dziś przez Radę Ministrów przepisom dotychczasowe ceny gazu dla odbiorców indywidualnych
  pozostaną w 2027 roku bez zmian. Polacy nadal będą płacić nie więcej niż 197,29
  zł za megawatogodzinę. Ochrona obejmie m.in. gospodarstwa domowe, wspólnoty i spółdzielnie
  mieszkaniowe oraz podmioty świadczące ważne usługi publiczne, np. szkoły i szpitale.
  Działania rządu obejmują nie tylko ochronę odbiorców przed wzrostem cen gazu, ale
  również ograniczanie presji inflacyjnej związanej z kosztami energii. Dokładnie
  pamiętamy, co oznaczała inflacja na poziomie 16% - 17% za czasu naszych poprzedników.
  Naszymi działaniami doprowadziliśmy do tego, że inflacja przestała być problemem
  Kontynuowany jest program CPN, dzięki któremu Polska ma – poza Maltą – najniższe
  ceny paliw w Unii Europejskiej. Rząd pracuje także nad rozwiązaniami dotyczącymi
  cen energii elektrycznej, aby uchronić gospodarstwa domowe przed gwałtownym wzrostem
  rachunków w sezonie jesienno-zimowym. Budujemy naszą strategię w ramach fundamentalnej
  odpowiedzialności. Mamy niską inflację, duży wzrost gospodarczy i wystarczająco
  dużo środków, aby kontrolować ceny energii. Dzięki temu możemy utrzymać pozytywne
  prognozy na przyszły rok Chodzi o utrzymanie niskiej inflacji i wysokiego wzrostu
  gospodarczego również w 2027 r. Celem rządu jest, by Polska pozostała wśród najszybciej
  rozwijających się gospodarek Unii Europejskiej. Rada Ministrów przyjęła dziś również
  projekt, który umożliwi uruchomienie w Polsce europejskiego portfela tożsamości
  cyfrowej. Zajmujemy się dzisiaj projektem, który może pozytywnie zmienić życie milionów
  ludzi w Polsce i całej Europie. Dzięki europejskiemu portfelowi tożsamości cyfrowej
  będzie można na terenie całej Unii bezpiecznie potwierdzać tożsamość w portalach
  publicznych, otwierać konto bankowe, wykupić receptę czy potwierdzić tożsamość na
  granicy W pierwszym etapie portfel będzie działał jako osobna aplikacja, dostępna
  również z poziomu mObywatela. Docelowo oba rozwiązania zostaną połączone w jednej
  aplikacji. Europejski portfel tożsamości cyfrowej będzie miał również istotne znaczenie
  dla wzrostu bezpieczeństwa najmłodszych użytkowników internetu. Dzięki elektronicznej
  tożsamości będzie można ustalać szybko i bezproblemowo wiek użytkownika. W nieodległej
  przyszłości da nam to możliwość kontrolowania tej sfery, która dzisiaj jest kompletnie
  bezkarna, poza kontrolą i naraża nasze dzieci, młode Polki i Polaków na olbrzymie
  ryzyka i zagrożenia, które czają się w sieci Polska, korzystając z doświadczeń zdobytych
  przy rozwoju aplikacji mObywatel, jest dobrze przygotowana do wdrożenia europejskiego
  rozwiązania. Już teraz nasz kraj umacnia pozycję cyfrowego lidera w wielu obszarach.
