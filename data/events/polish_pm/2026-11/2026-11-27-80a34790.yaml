title: Przyszły budżet UE – Polska zabezpiecza swoje interesy w negocjacjach
text: W Brukseli zakończyły się obrady nieformalnego posiedzenia Rady Europejskiej
  na temat unijnego budżetu na lata 2028–2034. Ostateczne porozumienie w sprawie wieloletnich
  ram finansowych UE ma zostać wypracowane w grudniu. Wstępny finał nie jest najgorszy.
  Punkt wyjścia był trudny, a z polskiego punktu widzenia jest obiecujący – co nie
  znaczy, że łatwy do pełnego sfinalizowania Jednym z kluczowych tematów rozmów była
  przyszłość dochodów z systemu ETS. W negocjacjach pojawiła się propozycja, aby środki
  te trafiały do budżetu UE, a nie – jak dotychczas – pozostawały w budżetach państw
  członkowskich. Myśmy od początku tłumaczyli, że z polskiego punktu widzenia to jest
  absolutnie nieakceptowalne. Dla mnie szczególnie ważne było spotkanie tzw. Wielkiej
  Szóstki, a więc największych państw. Wszyscy zrozumieli i zobowiązali się, aby nasz
  kraj był tutaj traktowany odrębnie, czyli żeby pieniądze z ETS zostawały w Polsce.
  Osiągnęliśmy 100% tego, co chcieliśmy na tym etapie Nasz kraj utrzyma również pozycję
  największego beneficjenta unijnych środków na politykę rolną i spójności. W ramach
  tych funduszy będziemy mieli ok. 2 mld euro więcej niż w obecnej perspektywie budżetowej
  W sprawie utrzymania finansowania polityki spójności zawiązała się szeroka koalicja
  państw, w tym z udziałem Polski. Mieliśmy wspólne stanowisko, co wbrew pozorom nie
  jest łatwe do uzyskania. Zostało nam właściwie zagwarantowane, że nie będzie żadnych
  nowych cięć w alokacji spójności – przekazała Minister Funduszy i Polityki Regionalnej
  Agnieszka Bartol. Ostateczne decyzje dotyczące unijnego budżetu na lata 2028–2034
  zapadną na następnym posiedzeniu Rady Europejskiej, a nasz kraj będzie kontynuować
  działania na rzecz zabezpieczenia swoich interesów w negocjacjach. Podczas szczytu
  w Brukseli przywódcy rozmawiali także o opodatkowaniu największych firm z sektora
  cyfrowego. Polska opowiada się za zasadą równego traktowania wszystkich przedsiębiorstw,
  niezależnie od kraju ich pochodzenia. Nie miałbym nic przeciwko temu, żeby Unia
  Europejska obłożyła podatkiem największe korporacje. Nie ma to nic wspólnego ze
  stosunkiem do Stanów Zjednoczonych, ale chcielibyśmy, aby wszystkie firmy – europejskie,
  amerykańskie, chińskie – były traktowane tak, jak pozostałe biznesy Wprowadzenie
  podatku cyfrowego wymaga ratyfikacji przez państwa członkowskie, co w Polsce wiąże
  się z uzyskaniem zgody parlamentu oraz podpisu Prezydenta. Od pewnego czasu mam
  wrażenie, że pan Prezydent jest członkiem silnej grupy politycznej, która odczuwa
  lęk przed największymi biznesami cyfrowymi, głównie amerykańskimi, ale nie tylko.
  Ja tego lęku nie podzielam Szef rządu podkreślił, że będzie przekonywał do wprowadzenia
  podatku cyfrowego, wskazując na korzyści, jakie może przynieść Polsce i pozostałym
  państwom europejskim. Ostateczne decyzje w tej sprawie będą przedmiotem dalszych
  rozmów.
