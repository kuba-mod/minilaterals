title: Sprawiedliwy pokój dla Ukrainy fundamentem bezpieczeństwa Europy
text: Premier Donald Tusk uczestniczy dziś w Berlinie w spotkaniu Koalicji Chętnych,
  w którym biorą udział przedstawiciele około 40 państw. Jest to najliczniejsze dotychczas
  spotkanie w tym formacie. Konsultacje liderów państw wspierających Ukrainę dotyczą
  niedawnych rozmów o zakończeniu wojny oraz aktualnych priorytetów Koalicji. Koalicja
  Chętnych obejmuje między innymi państwa, które zadeklarowały gotowość wysłania swoich
  żołnierzy do Ukrainy po zawarciu pokoju, w ramach gwarancji bezpieczeństwa. Polska
  nie uczestniczy w tej koalicji w takim wymiarze. Od początku informowaliśmy, że
  polscy żołnierze nie pojawią się w Ukrainie - przypomniał Donald Tusk podczas konferencji
  prasowej przed wylotem do Berlina. Polska odgrywa jednak kluczową rolę w działaniach
  na rzecz wsparcia Ukrainy, przede wszystkim ze względu na swoje położenie geograficzne
  i znaczenie logistyczne. Bez Polski żadna realna akcja pomocy dla Ukrainy nie może
  się odbyć – ze względów geograficznych, ale też ze względu na pozycję Polski. Będziemy
  oczywiście kontynuowali tę politykę Polska będzie również wspierać działania Koalicji
  Chętnych związane z przygotowaniem przyszłych gwarancji bezpieczeństwa dla Ukrainy.
  Służą temu między innymi ćwiczenia organizowane w Polsce, które mają przygotować
  państwa do ewentualnego udziału w realizacji tych gwarancji.
