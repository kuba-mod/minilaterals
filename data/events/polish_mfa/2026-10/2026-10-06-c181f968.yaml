title: Rada Praw Człowieka ONZ przyjęła polską rezolucję dotyczącą sztucznej inteligencji
  w administracji publicznej
text: Sztuczna inteligencja jest coraz powszechniej stosowana w urzędach, sądownictwie
  i usługach publicznych na całym świecie. Technologie te zwiększają skuteczność działania
  instytucji, lecz niewłaściwie stosowane mogą prowadzić do błędnych lub dyskryminujących
  rozstrzygnięć. Rezolucja wzywa państwa do oceny skutków takich systemów przed ich
  wdrożeniem, zapewnienia przejrzystości i nadzoru człowieka nad podejmowanymi decyzjami
  oraz zagwarantowania możliwości ich zaskarżenia. Dokument podkreśla również konieczność
  zachowania dostępu do usług publicznych dla osób, które nie korzystają z kanałów
  cyfrowych. Rezolucja przewiduje opracowanie przez ONZ praktycznych wytycznych dla
  administracji publicznej w zakresie odpowiedzialnego wdrażania sztucznej inteligencji.
  Będą one wsparciem dla wszystkich państw, w tym tych, które dopiero rozwijają cyfrowe
  usługi publiczne. Polska zainicjowała rezolucję o dobrym rządzeniu w 2008 r. i od
  tego czasu przewodzi pracom nad nią na forum Rady. Tegoroczny tekst przygotowała
  wspólnie z Australią, Chile, Republiką Korei i Republiką Południowej Afryki, a jego
  współautorami zostało 58 państw ze wszystkich regionów świata. Przyjęcie rezolucji
  bez głosowania potwierdza skuteczność polskiej dyplomacji w budowaniu porozumienia
  ponad podziałami oraz rolę Polski w kształtowaniu międzynarodowych standardów dotyczących
  nowych technologii. Rada Praw Człowieka, w której zasiada 47 państw wybieranych
  przez Zgromadzenie Ogólne ONZ, jest najważniejszym forum Narodów Zjednoczonych poświęconym
  ochronie praw człowieka na świecie – Polska ubiega się o miejsce w jej gronie na
  lata 2029–2031.
