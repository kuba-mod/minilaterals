title: Spotkanie Przewodniczącej Rady ds. Współpracy z RFN Henryki Mościckiej-Dendys
  z koordynatorem rządu Niemiec ds. współpracy z Polską
text: 'Spotkanie miało miejsce 2 października. Równolegle odbyła się dyskusja w szerszym
  gronie z udziałem przedstawicieli resortów: spraw wewnętrznych i administracji,
  kultury i dziedzictwa narodowego, infrastruktury, energii, klimatu i środowiska
  oraz edukacji. Rozmówcy zgodzili się co do konieczności konsekwentnej realizacji
  ustaleń przyjętych podczas polsko-niemieckich konsultacji międzyrządowych, które
  miały miejsce 1 grudnia 2025 r. w Berlinie. Podkreślono znaczenie wspólnych działań
  na rzecz wzmocnienia bezpieczeństwa wschodniej flanki NATO oraz pilną potrzebę rozbudowy
  połączeń transportowych w kierunku Polski. – Potrzebujemy połączeń drogowych i kolejowych
  na miarę XXI wieku. Jest to istotne nie tylko w kontekście kontaktów międzyludzkich
  czy współpracy gospodarczej, ale także zwiększania mobilności wojskowej – zaznaczyła
  Henryka Mościcka-Dendys, Przewodnicząca Rady ds. Współpracy z RFN. Istotnym tematem
  były także kwestie historyczne, w tym upamiętnienie polskich ofiar II wojny światowej
  oraz zwrot zagrabionych dóbr kultury. Poruszono również problematykę nauczania języka
  polskiego w Niemczech. *** Rada do spraw współpracy z Republiką Federalną Niemiec
  jako organ pomocniczy o charakterze opiniodawczym przy Radzie Ministrów została
  powołana zarządzeniem nr 6 Prezesa Rady Ministrów z dnia 23 stycznia br. (M.P z
  2026 r. poz. 136). W dniu 30 stycznia br. na stanowisko Przewodniczącej Rady wyznaczona
  została Henryka Mościcka-Dendys. W skład weszli przedstawiciele wybranych resortów:
  Ministerstwa: Rozwoju i Technologii; Kultury i Dziedzictwa Narodowego; Spraw Zagranicznych;
  Spraw Wewnętrznych i Administracji; Klimatu i Środowiska; Edukacji Narodowej; Infrastruktury;
  Nauki i Szkolnictwa Wyższego. W pracach Rady uczestniczy również Przewodniczący
  polskiej części Polsko-Niemieckiej Komisji Międzyrządowej do spraw Współpracy Regionalnej
  i Przygranicznej oraz opcjonalnie Przewodniczący Polsko-Niemieckiej Grupy Parlamentarnej.'
