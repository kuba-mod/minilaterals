title: Wiceminister Marcin Bosacki na Radzie FAC w Luksemburgu
text: W dyskusji ministrów spraw zagranicznych poświęconej agresji Rosji wobec Ukrainy,
  wiceminister Bosacki podkreślił, że presja na Rosję powinna być kontynuowana. Wiceszef
  polskiej dyplomacji podziękował za przyjęcie, z polskiej inicjatywy, największego
  - od czasu rozpoczęcia agresji rosyjskiej - pakietu sankcji indywidualnych. Dotyczyły
  one prawie 1600 firm i osób z rosyjskiego kompleksu wojskowo-przemysłowego, osób
  zaangażowanych w nielegalne wybory do rosyjskiej Dumy na okupowanych terytoriach
  ukraińskich, a także podmiotów ułatwiających obchodzenie sankcji. Wiceminister podkreślił,
  że przyjęcie przez Radę tego pakietu 12 października 2026 r. dowodzi naszej determinacji
  we wspieraniu Ukrainy. Wiceminister Bosacki zaapelował o ponowne przeanalizowanie
  przez UE kwestii wykorzystania na rzecz Ukrainy unieruchomionych aktywów rosyjskich.
  Ponadto wiceszef MSZ wezwał państwa członkowskie do zaostrzenia polityki wizowej
  wobec Rosji. Wiceminister przypominał, że Polska nie wydaje wiz turystycznych obywatelom
  rosyjskim. Wiceszef polskiej dyplomacji wyraził niezrozumienie wobec swobodnego
  podróżowania po strefie Schengen rosyjskich turystów, podczas gdy Rosja bombarduje
  ludność cywilną i infrastrukturę Ukrainy. W dyskusji w sprawie europejskiego bezpieczeństwa
  wiceminister Bosacki pokreślił, że rozszerzenie UE jest jego istotnym elementem.
  Wiceszef MSZ podał przykład krajów kandydujących, które wnoszą swoje doświadczenia
  w tej kwestii. Wiceminister Bosacki wskazał przy tym Ukrainę, która dysponuje nowymi
  zdolnościami obronnymi, przemysłowymi, a przede wszystkim doświadczeniem operacyjnym
  w konflikcie konwencjonalnym, hybrydowym oraz cybernetycznym. Wiceminister Bosacki
  zwrócił uwagę na możliwość wykorzystywania doświadczenia wojskowego Ukrainy w zapewnianiu
  szerszego bezpieczeństwa europejskiego, w tym w misjach Unii Europejskiej na obszarze
  sąsiedztwa europejskiego. Ponadto, wiceszef MSZ zapewnił o gotowości Polski do pomocy
  państwom Bałkanów Zachodnich, kandydujących do UE, w zwalczaniu rosyjskiej dezinformacji.
  Podczas nieformalnej dyskusji Rady o zwalczaniu FIMI (en. Foreign Information Manipulations
  and Iinterference; zagraniczne manipulacje informacjami i ingerencje w informacje) 
  oraz komunikacji strategicznej, wiceminister Bosacki z zadowoleniem przyjął bardziej
  ofensywne podejście na ten temat zaproponowane przez Wysoką Przedstawiciel Unii
  do spraw Zagranicznych i Polityki Bezpieczeństwa Kaję Kallas. Wiceszef polskiej
  dyplomacji wyraził gotowość dzielenia się polskimi doświadczeniami i wiedzą specjalistyczną
  w celu wzmacniania komunikacji strategicznej UE. Wiceminister podkreślił także kluczową
  rolę sankcji w zwalczaniu rosyjskiego ekosystemu FIMI i zaapelował o wzmocnienie
  pionów unijnych odpowiedzialnych za procedowanie propozycji sankcyjnych. Zwrócił
  uwagę na konieczność komunikowania przekazów unijnych również dla odbiorców rosyjskojęzycznych.
