title: Komunikat MSZ w sprawie incydentu w Taybeh
text: Napaść do jakiej doszło podczas wizyty solidarnościowej w miejscowości znanej
  z wielowiekowej obecności chrześcijańskiej, jest kolejnym dowodem na istnienie przemocy
  osadniczej, z którą ludność palestyńska na Zachodnim Brzegu mierzy się na co dzień.
  Atak powinien spotkać się ze stanowczą reakcją władz Izraela. Solidaryzujemy się
  z oświadczeniami Ministrów Spraw Zagranicznych Francji i Belgii. Apelujemy o powtrzymanie
  spirali przemocy na Zachodnim Brzegu i działanie w duchu poszanowania prawa międzynarodowego.
