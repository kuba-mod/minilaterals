title: Wiceminister Artur Harazim otworzył XVII Warszawskie Seminarium Praw Człowieka
text: 'Rozwój sztucznej inteligencji zwiększa efektywność wymiaru sprawiedliwości
  i ułatwia dostęp do informacji prawnej. Jednocześnie rodzi jednak istotne wyzwania,
  które dotyczą m.in. przejrzystości algorytmów, ochrony danych, niedyskryminacji,
  odpowiedzialności i ochrony praw procesowych. Podczas seminarium eksperci szukali
  odpowiedzi na pytanie, jak pogodzić wykorzystanie nowych technologii ze standardami
  Konwencji o ochronie praw człowieka i podstawowych wolności oraz zasadami praworządności.
  Seminarium otworzył wiceszef polskiej dyplomacji Artur Harazim i podkreślił: Zasadnicze
  pytanie nie brzmi, czy sztuczna inteligencja stanie się częścią naszego systemu
  wymiaru sprawiedliwości. Pod wieloma względami proces ten już się rozpoczął. Naszym
  celem powinno być zapewnienie, aby innowacje służyły wymiarowi sprawiedliwości.
  Wykład inauguracyjny pt. „Sztuczna inteligencja a przyszłość ochrony praw człowieka”
  wygłosił Robert Spano, były prezes Europejskiego Trybunału Praw Człowieka. Z kolei
  o wykorzystaniu nowych technologii w sądownictwie administracyjnym mówił prezes
  Naczelnego Sądu Administracyjnego Jacek Chlebny. W dalszej części seminarium, o
  przyszłości praw człowieka w erze cyfrowej dyskutowały Rzecznik Praw Obywatelskich
  Sylwia Gregorczyk-Abram oraz sędzia Europejskiego Trybunału Praw Człowieka Úna Ní
  Raifeartaigh. Poruszono również rolę Trybunału w ochronie praw człowieka w erze
  sztucznej inteligencji oraz wpływ technologii na praktykę prawniczą i reprezentację
  przed sądami. W seminarium uczestniczyli sędziowie i przedstawiciele Europejskiego
  Trybunału Praw Człowieka, Rady Europy oraz Trybunału Sprawiedliwości Unii Europejskiej,
  a także przedstawiciele krajowych instytucji ochrony praw człowieka, sądownictwa,
  administracji publicznej, środowiska adwokackiego i naukowego. Całość podsumowała
  sesja poświęcona przyszłości praw człowieka i sprawiedliwości w erze sztucznej inteligencji,
  z udziałem komisarza praw człowieka Rady Europy Michaela O’Flaherty’ego.'
