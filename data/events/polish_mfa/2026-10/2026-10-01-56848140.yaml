title: Spotkanie współprzewodniczących polsko-niemieckiego Okrągłego Stołu z udziałem
  wiceministra Władysława Teofila Bartoszewskiego
text: Gospodarzy reprezentowali sekretarz stanu w Federalnym Ministerstwie Spraw Wewnętrznych
  Christoph de Vries oraz pełnomocnik rządu federalnego ds. przesiedleńców i mniejszości
  narodowych dr Bernd Fabritius. Stronę polską reprezentowali sekretarz stanu w Ministerstwie
  Spraw Zagranicznych Władysław Teofil Bartoszewski oraz sekretarz stanu w Ministerstwie
  Spraw Wewnętrznych i Administracji Tomasz Szymański. W spotkaniu uczestniczyli także
  ambasador Niemiec w Polsce Miguel Berger oraz kierujący ambasadą RP w Berlinie chargé
  d'affaires a.i. Jan Tombiński. Głównym celem spotkania było przygotowanie kolejnego
  posiedzenia polsko-niemieckiego Okrągłego Stołu, które odbędzie się 20 stycznia
  2027 r. w Warszawie. W przyjaznej i konstruktywnej atmosferze podsumowano postulaty
  zebrane podczas konsultacji ze środowiskami polonijnymi w Niemczech oraz z przedstawicielami
  mniejszości niemieckiej w Polsce. *** Polsko-niemiecki Okrągły Stół to powołane
  w 2010 roku dwustronne gremium dialogu, którego celem jest omówienie i realizacja
  postanowień Polsko-Niemieckiego Traktatu o dobrym sąsiedztwie i przyjaznej współpracy
  z 1991 roku. Jego celem jest wspieranie obywateli niemieckich polskiego pochodzenia
  oraz Polaków w Niemczech, a także mniejszości niemieckiej w Polsce w zachowaniu
  i rozwijaniu ich tożsamości kulturowej, językowej oraz edukacyjnej.
