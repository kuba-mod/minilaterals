title: Polsko-kenijskie konsultacje polityczne
text: Kenia jest dla Polski kluczowym partnerem politycznym i gospodarczym w Afryce
  Wschodniej. Głównym tematem konsultacji z sekretarz stanu ds. diaspory Roseline
  Kathure Njogu było podtrzymanie dynamiki relacji politycznych oraz identyfikacja
  potencjalnych obszarów pogłębiającej się współpracy bilateralnej. Wiceminister Zajączkowski
  i wiceminister Njogu omówili problematykę bezpieczeństwa regionalnego, sytuację
  w regionie Rogu Afryki i Wielkich Jezior oraz wojny w Ukrainie, a także problematykę
  dezinformacji rosyjskiej. W Ministerstwie Skarbu podsekretarz stanu Wojciech Zajączkowski
  i minister skarbu Kenii John Mbadi Ng’ongo podpisali umowę o kredycie wiązanym,
  która zakłada udzielenie Kenii kredytu na modernizację sektora mleczarskiego. Większość
  środków kredytu będzie wydatkowana na zakup polskich usług i towarów. Umożliwi to
  zwiększenie obecności polskich firm z obszaru rolnictwa i przetwórstwa spożywczego
  na rynku kenijskim. Polska jest zainteresowana bliższą współpracą z Kenią, tak w
  obszarze politycznym, jak i ekonomicznym. Wychodzimy do partnerów kenijskich z propozycją
  rozwoju relacji długofalowych, bez obciążeń z przeszłości i bez ukrytej agendy politycznej.
  Takie podejście spotyka się z pozytywnym odbiorem moich kenijskich rozmówców, zainteresowanych
  modelem polskiej transformacji ekonomicznej i ofertą sektorową. Zakładamy, że podpisany
  właśnie kredyt pomocy wiązanej to nie tylko impuls rozwojowy dla Kenii, ale też
  wzmocnienie, bądź wprowadzenie na miejscowy rynek polskich przedsiębiorstw, specjalizujących
  się w technologii dla rolnictwa – podkreślił wiceszef MSZ Wojciech Zajączkowski.
  Ponadto wiceminister Zajączkowski uroczyście otworzył Forum Banków Spółdzielczych
  Polska - Kenia „Connected by Trust”, odwiedził projekty finansowane z środków polskiej
  pomocy rozwojowej, a także spotkał się z przedstawicielami polonijnych środowisk
  gospodarczych i ośrodków opiniotwórczych. Wizyta stanowiła okazję do zaprezentowania
  polskich rozwiązań IT dla sektora bankowego, w tym popularnej w Kenii bankowości
  spółdzielczej. Polska delegacja na czele z podsekretarzem stanu Wojciechem Zajączkowskim
  odwiedziła projekty edukacyjne realizowane w Nairobi i Kiambu przy udziale środków
  polskiej pomocy rozwojowej lub wykorzystaniu polskich technologii edukacyjnych.
  Spotkania z kierownictwem uczelni Międzynarodowego Uniwersytety Stanów Zjednoczonych
  (USIU) oraz ośrodków specjalizujących się w ocenach bezpieczeństwa regionalnego
  i środowisk dziennikarzy pozwoliły na identyfikacje konkretnych obszarów współpracy,
  dając impuls do planowania wspólnych projektów.
