title: Wicepremier, minister spraw zagranicznych Radosław Sikorski na konferencji
  „Sprawcze państwo. Jak skutecznie realizować inwestycje strategiczne dla rozwoju
  Polski”
text: W wystąpieniu w Krajowej Szkole Administracji Publicznej, zatytułowanym „Strategia
  na czas rozpadu”, szef polskiej dyplomacji Radosław Sikorski postawił przed publicznością
  ważne i trudne pytania, podkreślając konieczność zmiany perspektywy w obliczu rosnącego
  zagrożenia. „Elementem kultury strategicznej i strategicznego planowania jest świadomość
  własnych zasobów i własnych ograniczeń - materialnych, technologicznych i ludzkich”
  - zaznaczył minister spraw zagranicznych.
