title: Spotkanie szefów dyplomacji Polski i Armenii
text: Minister Sikorski zapewnił, że Polska niezmiennie wspiera Armenię w pogłębianiu
  relacji z Unią Europejską. Szef polskiej dyplomacji zadeklarował gotowość do dzielenia
  się polskim doświadczeniem we wzmacnianiu kompetencji administracji publicznej,
  m.in. poprzez szkolenia dla armeńskich instytucji. Ważnym wątkiem rozmów była współpraca
  gospodarcza. Wicepremier Sikorski przypomniał o Polsko-Armeńskim Forum Biznesowo-Inwestycyjnym,
  które we wrześniu br. odbyło się w Erywaniu. Jak zaznaczył, wydarzenie to pokazało
  rosnące zainteresowanie polskich przedsiębiorców rynkiem armeńskim. Polska z zadowoleniem
  odnotowuje także postępy w procesie pokojowym między Armenią a Azerbejdżanem oraz
  w normalizacji stosunków między Armenią a Turcją – zaznaczył szef polskiej dyplomacji.
