title: 35. Konferencja Utrechcka z udziałem szefów dyplomacji Polski i Niderlandów
text: 'Konsultacje polityczne wicepremiera Sikorskiego z ministrem spraw zagranicznych
  Tomem Berendsenem dotyczyły współpracy wojskowej i bezpieczeństwa, działań w wymiarze
  wielostronnym, w tym w ramach Unii Europejskiej i NATO, kwestii międzynarodowych
  – w tym agresji na Ukrainę i sankcji wobec Rosji. Szefowie dyplomacji Polski i Niderlandów
  Sikorski i Berendsen wspólnie zainaugurowali 35. edycję Konferencji Utrechckiej.
  W wystąpieniu otwierającym tegoroczną Konferencję, minister Sikorski podkreślił
  bardzo dobrą współpracę dwustronną z Niderlandami, również w ramach Unii Europejskiej
  oraz NATO. Jako sojusznicy w NATO i partnerzy w UE ściśle współpracujemy, aby wzmacniać
  wspólną obronę, zapewniać skuteczniejszą ochronę infrastruktury krytycznej i zwiększyć
  naszą odporność na zagrożenia hybrydowe. Nasza współpraca pokazuje, że solidarność
  – słowo, które jest szczególnie bliskie nam, Polakom, to nie tylko zasada, którą
  wyznajemy, ale przede wszystkim zobowiązanie, które przekładamy na konkretne działania.
  – podkreślił szef polskiej dyplomacji podczas otwarcia konferencji. Minister Sikorski
  wyraził także wdzięczność za wsparcie okazywane Polsce w zakresie działań na rzecz
  właściwego upamiętnienia polskich bohaterów II wojny światowej, w tym generała Maczka.
  Podczas wizyty w Hadze, minister Sikorski spotkał się również z dyrektor generalną
  Organizacji ds. Zakazu Broni Chemicznej (OPCW), Sabriną Dallafior Matter. Rozmowa
  dotyczyła znaczenia przestrzegania zakazu użycia broni chemicznej, skutecznego egzekwowania
  międzynarodowych zobowiązań, roli OPCW w przeciwdziałaniu takim naruszeniom, również
  w kontekście doniesień o stosowaniu broni chemicznej przez Rosję przeciwko Ukrainie.
  Wicepremier Sikorski wygłosił również wykład w Instytucie Clingendael [więcej o
  Instytucie poniżej]. Przez stulecia narody naszego regionu doświadczały konsekwencji
  rosyjskiej żądzy ziemi. Za carów, za komunizmu i teraz, za Władimira Putina, zmieniały
  się reżimy, ale imperializm przetrwał. (…) Ale nadzieja nie jest strategią. Dlatego
  większość państw postsowieckich skorzystała z okazji, by dołączyć do zachodnich
  instytucji bezpieczeństwa. Wbrew temu, co chciałaby wam wmówić rosyjska propaganda,
  NATO nie rozszerzyło się na Wschód samo. Zostało zaproszone. - powiedział wicepremier
  Radosław Sikorski. Ponadto szef polskiej dyplomacji złożył wizytę w Agencji Komunikacji
  i Informacji NATO, a także spotkał się z przedstawicielami Polonii i zainaugurował
  działalność Młodzieżowej Rady Konsultacyjnej przy Ambasadzie RP w Hadze. Holandia
  to jeden z największych ośrodków polskiej społeczności w Europie. Ponad 450 tysięcy
  Polaków. Stanowi ogromny kapitał wiedzy, doświadczenia i energii. Dlatego z radością
  przyjąłem zaproszenie do powołania Młodzieżowej Rady Konsultacyjnej. Ta inicjatywa
  powstała oddolnie. To była Wasza inicjatywa. Konferencja Utrechcka to cykliczne
  spotkania polsko-niderlandzkie organizowane od 1999 roku. Ich celem jest wzmocnienie
  współpracy: politycznej, gospodarczej i społecznej pomiędzy Polską a Królestwem
  Niderlandów. W tegorocznej Konferencji, będącej kluczową platformą dialogu na szczeblu
  ekspertów rządowych, uczestniczyło kilkudziesięciu polskich i niderlandzkich przedstawicieli resortów
  spraw zagranicznych, obrony narodowej, rolnictwa, rozwoju i technologii, klimatu
  i środowiska, energii, spraw wewnętrznych i administracji, sprawiedliwości oraz
  rodziny, pracy i polityki społecznej. Instytut Clingendael (Niderlandzki Instytut
  Stosunków Międzynarodowych) to niezależny holenderski think tank oraz akademia dyplomatyczna
  z siedzibą w Hadze. Instytucja ta zajmuje się badaniem globalnych trendów politycznych,
  analizą bezpieczeństwa międzynarodowego oraz prowadzeniem szkoleń dla dyplomatów
  i ekspertów z całego świata.'
