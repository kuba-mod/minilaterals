title: Polsko-tureckie konsultacje konsularne
text: Wiceminister spraw zagranicznych Artur Harazim wskazał, że w ostatnich latach
  priorytetem dla Ministerstwa Spraw Zagranicznych było stworzenie sprawniejszego
  systemu wizowego. Zaznaczył, że było to możliwe dzięki poprawie prawa i praktyki
  jego stosowania, a także poprzez wprowadzenie lepszych rozwiązań organizacyjnych,
  informatycznych i legislacyjnych. Wiceszef polskiej dyplomacji podkreślił, że usprawnieniu
  systemu służył m.in. pakiet tzw. ustaw naprawczych z 2025 r. Wprowadzone zmiany
  już przynoszą pozytywne efekty, odczuwalne przede wszystkim dla osób aplikujących
  o wizy. W temacie dostępu do wiz dla obywateli Turcji wiceminister Hacım Ali Özel
  przedstawił najważniejsze wyzwania i działania podejmowane przez stronę turecką.
  Obie strony zauważyły potrzebę dalszej współpracy i wymiany informacji, tak aby
  wypracować rozwiązania odpowiadające bieżącym potrzebom. W kontekście współpracy
  konsularnej wiceminister Harazim podkreślił, że jednym z najważniejszych zadań polskich
  konsulów jest zapewnienie obywatelom skutecznej pomocy i ochrony konsularnej, szczególnie
  w sytuacjach wymagających pilnego wsparcia w państwie przyjmującym. W tym zakresie
  kluczowe znaczenie ma sprawna współpraca pomiędzy Polską a Turcją, oparta na dwustronnej
  konwencji konsularnej z 1987 r., Wiceministrowie podkreślili doskonałe stosunki
  między obu krajami oraz gotowość do dalszego ich rozwijania.
