title: Spotkanie Podsekretarza Stanu Wojciecha Zajączkowskiego z Ministrem Stanu Kataru
text: 'Rozmowy wiceministrów skupiły się przede wszystkim na kwestiach trwających
  konfliktów regionalnych, współpracy dwustronnej oraz relacji Unia Europejska - Rada
  Współpracy Państw Zatoki. *** Polska nawiązała stosunki dyplomatyczne z Katarem
  16 października 1989 r. Pierwsza wizyta głowy państwa Kataru w Polsce – i zarazem
  pierwsza wizyta głowy państwa z regionu Zatoki Perskiej w Polsce – miała miejsce
  w czerwcu 2002 r., kiedy Warszawę odwiedził emir Hamad bin Khalifa Al Thani. W 2017
  roku Polska i Katar podpisały cztery umowy dotyczące współpracy gospodarczej, kulturalnej,
  ochrony zdrowia i nauk medycznych oraz zniesienia obowiązku wizowego dla posiadaczy
  paszportów dyplomatycznych i specjalnych. A w 2024 r.  współpracę rozszerzono m.in.
  o szkolnictwo wyższe i badania naukowe. Umowa ta stała się podstawą intensyfikacji
  kontaktów akademickich w latach 2025–2026. Więcej o relacjach polsko-katarskich:
  TUTAJ'
