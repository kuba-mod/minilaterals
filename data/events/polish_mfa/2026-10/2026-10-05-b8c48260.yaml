title: Wystąpienie wicepremiera Radosława Sikorskiego podczas sesji inauguracyjnej
  Warszawskiej Konferencji Wymiaru Ludzkiego OBWE
text: 'Minister spraw zagranicznych Radosław Sikorski podkreślił, że erozja porządku
  opartego na prawie międzynarodowym oraz pogłębiający się deficyt demokracji w wielu
  państwach Organizacji Bezpieczeństwa i Współpracy w Europie (OBWE) wymagają skutecznych
  mechanizmów pociągania do odpowiedzialności za łamanie praw człowieka i standardów
  demokratycznych. W kontekście rosyjskiej agresji na Ukrainę przypomniał, że nie
  może być trwałego pokoju między państwami i społeczeństwami, jeśli zbrodnie są przemilczane,
  ofiary uciszane, a sprawcy unikają odpowiedzialności. Sprawiedliwy i trwały pokój
  w Europie wymaga, aby Rosja zakończyła swoją politykę neoimperialną, zaprzestała
  agresji wobec Ukrainy oraz powstrzymała się od agresywnych i destabilizujących działań
  w regionie. – podkreślił minister spraw zagranicznych. W sesji otwarcia, obok przedstawicieli
  szwajcarskiego przewodnictwa w OBWE, udział wzięli także wysocy rangą przedstawiciele
  Sekretariatu OBWE i instytucji autonomicznych: Sekretarz Generalny OBWE Feridun
  H. Sinirlioğlu; Dyrektor Biura Instytucji Demokratycznych i Praw Człowieka [ODIHR]
  Maria Telalian; Wysoki Komisarz OBWE ds. Mniejszości Narodowych Christophe Kamp
  oraz Jan Braathu, Przedstawiciel OBWE ds. Wolności Mediów. Konferencja potrwa od
  5 do 15 października. Jej uczestnicy wezmą udział w sesjach poświęconych prawom
  człowieka, międzynarodowemu prawu humanitarnemu, podstawowym wolnościom, praworządności
  i instytucjom demokratycznym. Warszawska Konferencja Wymiaru Ludzkiego OBWE to 10-dniowe
  wydarzenie organizowane przez państwo sprawujące przewodnictwo w OBWE – obecnie
  jest to Szwajcaria – oraz Biuro Instytucji Demokratycznych i Praw Człowieka (ODIHR)
  z siedzibą w Warszawie. Jest to jedno z najważniejszych wydarzeń poświęconych prawom
  człowieka. W tym roku w konferencji zgłosiło udział około 1900 osób – przedstawicieli
  rządów i organizacji społeczeństwa obywatelskiego.'
