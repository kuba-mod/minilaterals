title: Wicepremier Radosław Sikorski na Warsaw Security Forum 2026
text: 'W panelu wspólnie z ministrem Radosławem Sikorskim dyskutowali: Minister Spraw
  Zagranicznych Norwegii Espen Barth Eide, Minister Spraw Zagranicznych Wielkiej Brytanii
  Ed Miliband, Minister Spraw Zagranicznych Niemiec Johann Wadephul. Minister Sikorski
  podkreślał, że Europa jest w stanie pełnić rolę globalnego gracza nawet w sytuacji,
  w której zamiast preferowanego przez nas porządku opartego na prawie międzynarodowym,
  będziemy zmierzać w kierunku mniejszej przewidywalności. Sikorski w swoich wypowiedziach
  zwrócił również uwagę na ogromny potencjał ekonomiczny Europy, który obecnie Polska
  stara się przekuć w określone zdolności obronne, mające zapewnić bezpieczeństwo
  poprzez odstraszanie potencjalnych agresorów. Szef MSZ przypominał także o niezmiennej
  atrakcyjności kulturowej i inwestycyjnej UE. Nie wystarczy tylko posiadać kulturę
  i mieć rację w obliczu zła. Strona, która ma rację, musi dysponować siłą, by jej
  bronić. Wiecie, w 1939 roku mieliśmy wszelkie racje świata. Nie mieliśmy jednak
  siły. Musieliśmy ją stworzyć Minister Sikorski zauważył też nieustanną determinację
  regionu w odpowiedzialności za bezpieczeństwo Europy. Jako przykład tego podejścia
  wskazał między innymi rozwijającą się współpracę bałtycko-nordycką, która ilustruje
  zaangażowanie tych państw w budowanie silnego, regionalnego skrzydła NATO. Była
  to szczególnie istotna kwestia, gdyż Norwegia jest w tym roku Partnerem Strategicznym
  Warsaw Security Forum. Panel ministerialny pozwolił na wymianę perspektyw pomiędzy
  reprezentantami państw o kluczowym znaczeniu dla europejskiego bezpieczeństwa. Takie
  spotkania służą też lepszej koordynacji działań zmierzających do wzmacniania europejskiej
  obronności i pozycji Europy na świecie. Link do transmisji: WSF2026 (DAY2) 13.10:
  The Return of Power Politics: Europe Between War and Rivalry Na marginesie konferencji,
  polski minister spraw zagraniczny odbył spotkania bilateralne z Ministrem Spraw
  Zagranicznych Niemiec Johannem Wadephulem, Ministrem Spraw Zagranicznych Hiszpanii
  José Manuelem Albaresem oraz Ministrem Spraw Zagranicznych Norwegii Espenem Barthem
  Eidem. Konferencja Warsaw Security Forum przyciąga wielu uznanych, międzynarodowych
  gości z administracji, środowiska akademickiego, think-tanków, biznesu i organizacji
  pozarządowych szukających okazji do rozmowy o aktualnych wyzwaniach w tym obszarze.'
