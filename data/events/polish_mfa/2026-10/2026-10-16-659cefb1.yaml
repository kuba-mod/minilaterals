title: Konsultacje polsko-francuskie
text: Wiceminister Harazim i Sekretarz Generalny Briens wyrazili satysfakcję z intensywnego
  polsko-francuskiego dialogu politycznego i eksperckiego, wpisującego się w postanowienia
  szczytu międzyrządowego Polska-Francja zorganizowanego w Gdańsku 20 kwietnia br.
  Wiceministrowie zadeklarowali chęć do pogłębiania partnerstwa strategicznego m.in.
  poprzez rozwój wspólnych projektów gospodarczych, obronnych, energetycznych i społeczno-kulturalnych.
  Wiceszef polskiej dyplomacji zachęcał partnerów do zapoznania się m.in. z ofertą
  polskiego przemysłu zbrojeniowego, rozwiązań w obszarze cyfryzacji i udziału w inwestycjach
  w Polsce oraz podkreślił dążenia Polski do uzyskania członkostwa w Grupie G20. Kluczowym
  elementem konsultacji było omówienie aktualnej sytuacji bezpieczeństwa, szczególnie
  w Ukrainie. Rozmówcy zgodnie podkreślili niezachwiane poparcie dla niezależności,
  suwerenności i integralności terytorialnej Ukrainy w jej granicach uznanych przez
  społeczność międzynarodową. Podsekretarz Artur Harazim i Martin Briens pokładają
  nadzieję na utrzymanie jedności transatlantyckiej w tym obszarze. Ponadto strony
  wyraziły zadowolenie z planowanego w 2027 r. wspólnego, polsko-francuskiego sezonu
  kulturalnego. Wiceministrowie z satysfakcją odnotowali zacieśnianie współpracy pomiędzy
  resortami spraw zagranicznych Polski i Francji.
