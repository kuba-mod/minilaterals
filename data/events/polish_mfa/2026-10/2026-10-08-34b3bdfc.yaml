title: Wicepremier Radosław Sikorski na GZERO Summit w Londynie
text: Podczas tegorocznej edycji konferencji GZERO rozmowy panelistów zdominowały
  relacje pomiędzy USA a Europą w kontekście m.in. sprawiedliwszego podziału obciążeń
  między partnerami w ramach NATO. Szef polskiej dyplomacji podkreślał, że większa
  odpowiedzialność Europy za własne bezpieczeństwo nie oznacza mniejszej roli Stanów
  Zjednoczonych. Przeciwnie – silniejsza Europa może być warunkiem utrzymania trwałego
  i politycznie zrównoważonego zaangażowania USA w bezpieczeństwo europejskie. Dosłownie
  kilkanaście dni temu w Nowym Jorku przed Radą Bezpieczeństwa opisywałem tę hybrydową
  wojnę rosyjską przeciwko wolnemu światu (...) Amerykański sąd w Nowym Jorku oskarżył
  sprawców o organizowanie morderstw na zlecenie. Rosjanie robią to wobec całego wolnego
  świata i musimy dawać temu odpór, czemu Polska daje dobry przykład. Równie ważna
  była kwestia relacji ukraińsko-rosyjskich oraz perspektywy rozpoczęcia realnych
  rozmów pokojowych. Minister spraw zagranicznych zaznaczył, że silniejsza i bardziej
  odporna Ukraina to bezpieczna Europa. Mam nadzieję, że ci, którzy krytykują pomaganie
  Ukrainie, oglądają te straszne sceny ataków na cywilów, ataków na obiekty cywilne,
  takie jak mosty, ataków na zwykłe domy mieszkalne. I to nie tylko w Kijowie, ale
  w różnych innych miastach. Spekuluje się, że Władimir Putin zdjął wszelkie ograniczenia
  dla wojska, dla lotnictwa rosyjskiego i że idą w kierunku takiej taktyki, która
  dokonała straszliwych zniszczeń w Syrii. Wśród omawianych tematów znalazła się przyszłość
  Unii Europejskiej, a także wyzwania i szanse rysujące się dla Unii z perspektywy
  Warszawy. Omawiano także problem bezpieczeństwa w kontekście zagrożeń hybrydowych
  oraz wyzwań nowej generacji w postaci ataków dronowych, cyberataków czy powszechnych
  kampanii dezinformacyjnych. Podjęto także zagadnienie wzrostu znaczenia tzw. „średnich
  potęg” oraz pozycji Polski w nowej sytuacji geopolitycznej. Uczestnictwo polskiego
  przedstawiciela w tym prestiżowym wydarzeniu dowodzi, że głos Polski ma znaczenie
  na arenie międzynarodowej. Nasze doświadczenie i pogłębiona wiedza o geopolityce
  to cenny kapitał, którym chętnie dzielimy się z partnerami w Europie i na świecie.
  *** GZERO Summit to flagowy cykl konferencji, które tradycyjnie gromadzą czołowych
  światowych liderów sektora publicznego i prywatnego. Na wysokim szczeblu analizowane
  i omawiane są globalne zjawiska geopolityczne, kształtujące ład międzynarodowy oraz
  rynki.
