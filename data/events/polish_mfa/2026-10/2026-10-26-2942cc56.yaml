title: Polska i Wietnam podnoszą relacje dwustronne do rangi partnerstwa strategicznego
text: Ustanowienie partnerstwa strategicznego potwierdza rosnące znaczenie Wietnamu
  jako partnera Polski w Azji Południowo-Wschodniej oraz regionu Indo-Pacyfiku w polskiej
  polityce zagranicznej. Nowa formuła stosunków dwustronnych ma nadać impuls współpracy
  politycznej i gospodarczej, a także wzmocnić dialog dotyczący bezpieczeństwa oraz
  najważniejszych wyzwań międzynarodowych. Istotnym elementem rozmów było zacieśnienie
  polsko-wietnamskiej współpracy w dziedzinie bezpieczeństwa i obronności. Wiceminister
  Robert Kupiecki uczestniczył w rozmowach dotyczących rozwoju partnerstwa wojskowego,
  w tym współpracy przemysłów obronnych. Obie strony zadeklarowały również wolę pogłębienia
  współpracy w ramach operacji pokojowych ONZ. Ważnym obszarem uzgodnień było przeciwdziałanie
  współczesnym zagrożeniom dla bezpieczeństwa. Polska i Wietnam zapowiedziały zacieśnienie
  współpracy w zwalczaniu cyberprzestępczości, przestępczości transgranicznej, handlu
  ludźmi i nielegalnej migracji, a także w zakresie ochrony infrastruktury krytycznej
  oraz wymiany informacji i doświadczeń. Jednym z priorytetów partnerstwa strategicznego
  jest zwiększenie wymiany handlowej i wzajemnych inwestycji oraz tworzenie korzystniejszych
  warunków dla przedsiębiorców. Polska i Wietnam potwierdziły znaczenie pełnego wykorzystania
  umowy o wolnym handlu UE–Wietnam (EVFTA), ograniczania barier pozataryfowych oraz
  ułatwiania dostępu do rynków obu państw. Szczególne znaczenie ma rozwój polskiego
  eksportu rolno-spożywczego, współpracy przemysłowej i sektora nowoczesnych technologii.
  Dalszemu rozwojowi współpracy gospodarczej służyć będą regularne spotkania Polsko-Wietnamskiej
  Grupy Roboczej ds. Współpracy w Rolnictwie, której kolejne posiedzenie powinno odbyć
  się do kwietnia 2027 r. Nowe możliwości dla przedsiębiorców i turystów stworzy również
  planowane na pierwszy kwartał 2027 r. uruchomienie bezpośredniego połączenia lotniczego
  PLL LOT na trasie Warszawa–Hanoi. Współpraca regionalna i sprawy międzynarodowe
  Podczas rozmów obie strony potwierdziły przywiązanie do zasad Karty Narodów Zjednoczonych,
  prawa międzynarodowego oraz poszanowania suwerenności i integralności terytorialnej
  państw. Polska i Wietnam podkreśliły konieczność osiągnięcia kompleksowego, sprawiedliwego
  i trwałego pokoju w Ukrainie, zgodnego z prawem międzynarodowym oraz zasadami Karty
  ONZ, w tym zakazem użycia siły lub groźby jej użycia. Strony potwierdziły także
  znaczenie pokoju, stabilności oraz swobody żeglugi i przelotu na Morzu Południowochińskim.
  Opowiedziały się za pokojowym rozwiązywaniem sporów zgodnie z prawem międzynarodowym,
  w szczególności Konwencją Narodów Zjednoczonych o prawie morza (UNCLOS). Uzgodniono
  również pogłębienie współpracy na forach wielostronnych, w tym w ramach relacji
  Polski i Unii Europejskiej ze Stowarzyszeniem Narodów Azji Południowo-Wschodniej
  (ASEAN). Wietnam wyraził poparcie dla działań Polski na rzecz zacieśniania współpracy
  z państwami tego regionu. Nauka, nowe technologie i kontakty międzyludzkie Partnerstwo
  strategiczne obejmie także rozwój współpracy w dziedzinie cyfryzacji, innowacji,
  badań naukowych oraz przemysłu medycznego i farmaceutycznego. Obie strony zapowiedziały
  rozszerzenie współpracy między uczelniami i instytutami badawczymi, wymiany studentów
  i ekspertów oraz wspieranie nauczania języka polskiego i wietnamskiego. Ważnym elementem
  relacji pozostają kontakty międzyludzkie, w tym rola społeczności wietnamskiej w
  Polsce, stanowiącej istotny pomost między oboma państwami. Realizacji uzgodnionych
  priorytetów służyć będzie Wspólny Plan Działania na lata 2026–2030, który ma przełożyć
  partnerstwo strategiczne na konkretne przedsięwzięcia polityczne, gospodarcze i
  społeczne. Na zakończenie wizyty premier Donald Tusk zaprosił premiera Lê Minh Hưnga
  do złożenia oficjalnej wizyty w Polsce.
