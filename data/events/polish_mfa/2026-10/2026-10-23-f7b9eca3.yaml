title: Oświadczenie MSZ ws. ataku terrorystycznego w Jordanii
text: Składamy kondolencje rodzinom ofiar. Solidaryzujemy się z władzami Jordanii
  oraz chrześcijańską społecznością w prowincji Kerak. Wyrazy współczucia kierujemy
  także do polsko - jordańskiej rodziny, która również ucierpiała w zamachu. Jordania
  jest ważnym partnerem Polski, z którym od wielu lat angażujemy się w walkę z terroryzmem
  i ekstremizmem. Doceniamy szczególną rolę Jordanii w dialogu międzyreligijnym, jako
  strażnika chrześcijańskich i muzułmańskich miejsc świętych.
