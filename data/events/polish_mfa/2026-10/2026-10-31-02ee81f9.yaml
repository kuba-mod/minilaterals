title: Wicepremier Radosław Sikorski wziął udział w spotkaniu ministrów spraw zagranicznych
  G20 w Atlancie
text: Polska uczestniczy w pracach G20 w 2026 roku na zaproszenie Stanów Zjednoczonych,
  które sprawują tegoroczną prezydencję w tym formacie. W trakcie trzech sesji plenarnych
  uczestnicy omówili wpływ napięć geopolitycznych na światową gospodarkę, w tym kwestie
  wolności żeglugi oraz bezpieczeństwa żywnościowego, energetycznego i łańcuchów dostaw.
  Spotkanie w Atlancie było okazją do intensywnych rozmów dwustronnych z partnerami
  z innych kontynentów, z którymi z uwagi na geografię, rzadziej dochodzi do bezpośrednich
  spotkań bilateralnych. Szef polskiej dyplomacji odbył około 10 spotkań dwustronnych.
  Szef MSZ spotkał się, m.in. z ze swoimi odpowiednikami z Indonezji, Indii, Argentyny,
  Brazylii, Meksyku, Kanady, Arabii Saudyjskiej i Republiki Korei. Minister Radosław
  Sikorski spotkał się również z delegacją Unii Afrykańskiej, której przewodniczył
  minister spraw zagranicznych Burundi i przewodniczący Rady Wykonawczej Unii Afrykańskiej
  Edouard Bizimana. Polska – dobry reprezentant CEE i przykład dla Globalnego Południa
  Udział w spotkaniu to dla Polski szansa, by głos naszej części Europy był lepiej
  słyszalny w globalnej debacie gospodarczej. Sympatia Stanów Zjednoczonych dla pełnego
  członkostwa Polski w G20 jest ewidentna. Mówił zresztą o tym Sekretarz Stanu Marco
  Rubio we wczorajszej wieczornej wypowiedzi. Spotkanie G20 jest też okazją do wielu
  rozmów dwustronnych i myślę, że w wyniku tych dwóch dni spotkań na pewno mamy lepsze
  poczucie, gdzie jeszcze trzeba przekonywać, a gdzie już mamy solidne poparcie dla
  naszej stałej obecności w tym forum. – zaznaczył szef polskiej dyplomacji Radosław
  Sikorski. Minister Sikorski w swoich wypowiedziach na Forum G20 podkreślał, że Polska
  reprezentuje region obejmujący Skandynawię, Bałtyk, Adriatyk i Morze Czarne. To
  obszar obejmujący blisko 150 milionów mieszkańców, którego znaczenie gospodarcze
  i strategiczne systematycznie rośnie. W 1990 roku byliśmy najbiedniejszym krajem
  naszego regionu, a PKB Polski wynosił niewiele ponad 65 mld dolarów amerykańskich,
  co plasowało nas w połowie piątej dziesiątki gospodarek świata. Po 35 latach nieprzerwanego
  wzrostu awansowaliśmy na dwudzieste miejsce, z gospodarką o wartości 1 biliona dolarów.
  Przez trzydzieści pięć lat nasze PKB na mieszkańca wzrosło o 266%, a dziś przeciętny
  Polak jest zamożniejszy niż około 85% mieszkańców świata. Szef polskiej dyplomacji
  zauważył, że opowiadamy historię nie tylko sukcesu gospodarczego, ale też siły demokracji
  i wolnego rynku, jako alternatywie dla autorytaryzmu. Nasza opowieść o tym, jak
  można się wybić na nowoczesność i zamożność nie w systemie jednopartyjnym i systemie
  gospodarki sterowanej, a w systemie demokratycznym z gospodarką otwartą, jest warta
  powtarzania. Myślę, że ten alternatywny model, szczególnie dla krajów, które jeszcze
  marzą o takim sukcesie jak Polska, powinien być widoczny jako alternatywa. – powiedział
  wicepremier, minister spraw zagranicznych Radosław Sikorski. Jak wielokrotnie podkreślał
  szef MSZ, Polska chce dzielić się tym doświadczeniem z partnerami z Afryki, Azji
  i Ameryki Łacińskiej (tzw. Globalne Południe). W przeciwieństwie do wielu państw
  zachodnich - Polska nie ma kolonialnej przeszłości. Polska dąży do tego, by uczestniczyć
  w kolejnych szczytach G20. Obecność w G20 możemy wykorzystać do promowania kwestii
  kluczowych dla naszego kraju i całej Europy Środkowo-Wschodniej oraz do dzielenia
  się doświadczeniami regionu, dotąd niereprezentowanego w G20. W październiku 2026
  r. Premier Donald Tusk poinformował o otrzymaniu od Premiera Andy’ego Burnhama zaproszenia
  do udziału w pracach G20 w przyszłym roku podczas prezydencji brytyjskiej. Nad koordynacją
  działań rządu w tym zakresie czuwa Pełnomocnik Rządu ds. polskiego udziału w G20
  powołany Rozporządzeniem Rady Ministrów z grudnia ubiegłego roku. Funkcję tę pełni
  Sekretarz Stanu w MSZ, Marcin Bosacki.
