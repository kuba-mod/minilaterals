title: Oświadczenie MSZ dot. ataków dronowych i rakietowych na obiekty cywilne w Arabii
  Saudyjskiej
text: Za niedopuszczalne uznajemy działania wymierzone na ludność cywilną i cywilną
  infrastrukturę państw, które nie znajdują się w stanie wojny. Wzywamy do poszanowania
  prawa międzynarodowego i powstrzymania się od aktów agresji, które zwiększają liczbę
  niewinnych ofiar i pogarszają skomplikowaną sytuacją zagrażającą międzynarodowemu
  ładowi stabilności regionalnej na Półwyspie Arabskim i regionie Morza Czerwonego.
