title: Szczyt Procesu Berlińskiego w Czarnogórze
text: Wiceszef polskiej dyplomacji zwrócił uwagę na utrzymujące się zagrożenie dla
  europejskiego bezpieczeństwa ze strony Rosji, która od kilku lat w sposób skoordynowany
  prowadzi działania destabilizujące w całej Europie. Bałkany Zachodnie są ważnym
  elementem europejskiego bezpieczeństwa. Dlatego powinniśmy ściślej współpracować
  w walce z zagrożeniami hybrydowymi, ponieważ wrogowie łączą agresywne działania
  z narzędziami FIMI, by podsycać polaryzację i szerzyć dezinformację - podkreślił
  wiceminister Bosacki, wyrażając przy tym gotowość do wsparcia krajów regionu w walce
  z tymi zagrożeniami. Jednym z kluczowych obszarów współpracy z krajami Bałkanów
  Zachodnich może być też wymiana wiedzy i dobrych praktyk w obszarze skutecznego
  wykorzystywania funduszy unijnych. Reforma samorządu lokalnego w Polsce i efektywne
  wykorzystywanie funduszy UE na inwestycje lokalne i regionalne doprowadziło do przyśpieszenia
  rozwoju Polski. Wierzymy, że budowanie silnego samorządu lokalnego może być drogą
  także dla państw bałkańskich. Polska jest gotowa dzielić się naszym doświadczeniem
  w tej sprawie Wiceminister Bosacki odniósł się też szeroko do korzyści płynących
  ze współpracy regionalnej, dzięki której kraje Bałkanów Zachodnich mogą pokonać
  wiele strukturalnych słabości. Jako przykład takich działań wskazał połączenie sieci
  energetycznej Włoch i Czarnogóry podmorskim kablem czy działania na rzecz połączenie
  rynku energii elektrycznej w Albanii i Kosowie. Inicjatywy te pokazują, że regionalna
  integracja energetyczna może się rozwijać przed członkostwem w UE, wzmacniać bezpieczeństwo
  energetyczne i bliżej łączyć Bałkany Zachodnie Polska pozostaje konsekwentnym zwolennikiem ​polityki
  rozszerzenia UE o państwa Bałkanów Zachodnich. Polityka rozszerzania UE zostaje
  najskuteczniejszym elementem budowania obszaru stabilności i dobrobytu na naszym
  kontynencie.
