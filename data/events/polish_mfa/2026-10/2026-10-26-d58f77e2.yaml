title: Laureaci Polskiej Nagrody im. Sérgio Vieira de Mello 2026
text: Laureat Maksim Znak to białoruski prawnik, pisarz i były więzień polityczny,
  działający na rzecz praworządności i pokojowych przemian demokratycznych na Białorusi.
  Nagrodzona organizacja Abuelas de Plaza de Mayo (Babcie z Placu Majowego) to organizacja
  argentyńska poszukująca dzieci odebranych rodzicom podczas dyktatury wojskowej i
  przywracająca im tożsamość. Nagrodę honorową otrzymał norweski działacz kulturalny
  Helge Lunde, współtwórca i dyrektor wykonawczy Międzynarodowej Sieci Miast Schronienia
  (ICORN), wspierającej prześladowanych twórców i broniącej wolności słowa. Podczas
  tegorocznej uroczystości dyrektor Departamentu Spraw Globalnych Adam Krzywosądzki
  wygłosił laudację poświęconą organizacji Abuelas de Plaza de Mayo (Babcie z Plaza
  de Mayo), której kandydaturę do Nagrody zgłosiło Ministerstwo Spraw Zagranicznych.
  Polska Nagroda im. Sérgio Vieira de Mello została ustanowiona w 2003 roku z inicjatywy
  Stowarzyszenia Willa Decjusza. Przyznawana jest corocznie wybitnym osobom i organizacjom
  pozarządowym z całego świata za działania na rzecz pokojowego współistnienia i współdziałania
  społeczeństw, religii i kultur. Upamiętnia ona brazylijskiego dyplomatę i Wysokiego
  Komisarza Narodów Zjednoczonych ds. Praw Człowieka, który zginął tragicznie w Iraku,
  w 2003 r. MSZ wspiera Polską Nagrodę im. Sérgio Vieira de Mello jako partner przedsięwzięcia
  oraz poprzez udział przedstawiciela Departamentu Spraw Globalnych w pracach Kapituły
  Nagrody
