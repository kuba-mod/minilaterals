title: Wiceminister Artur Harazim wziął udział w posiedzeniu Doradczego Komitetu Prawnego
text: W trakcie posiedzenia z udziałem wiceministra Artura Harazima Członkowie Komitetu
  omówili wybrane zagadnienia z tegorocznego Raportu Komisji Prawa Międzynarodowego.
  Omawiano zarówno zapobieganie i zwalczanie piractwa i rozboju na morzu, odszkodowanie
  za szkody wyrządzone aktami międzynarodowo bezprawnymi, a także rozwiązywanie sporów,
  w których stroną są organizacje międzynarodowe. Komitet przeanalizował również projekt
  artykułów Komisji Prawa Międzynarodowego dotyczących odpowiedzialności państw za
  akty międzynarodowo bezprawne. Opinia Doradczego Komitetu Prawnego zaprezentowana
  podczas posiedzenia będzie pomocna przy wypracowywaniu stanowiska Polski prezentowanego
  na forach międzynarodowych. Doradczy Komitet Prawny przy Ministrze Spraw Zagranicznych
  (DKP) jest zespołem eksperckim, który zajmuje się istotnymi zagadnieniami prawa
  międzynarodowego, prawa unijnego oraz prawa wewnętrznego i na podstawie ich analizy
  sporządza ekspertyzy prawne - zgodnie z potrzebami Ministra Spraw Zagranicznych.
  Prace Komitetu koordynuje Sekretarz Stanu lub Podsekretarz Stanu.
