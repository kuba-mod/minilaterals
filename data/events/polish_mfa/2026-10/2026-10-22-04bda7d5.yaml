title: Spotkanie wiceministrów Polski i Litwy
text: Wiceministrowie omówili szereg spraw bieżących w zakresie relacji dwustronnych.
  Istotnym tematem były kwestie praw mniejszości narodowych, w szczególności w obszarze
  szkolnictwa i stosowania języka polskiego. Wiceszefowie dyplomacji zgodzili się,
  że społeczność polska na Litwie i litewska w Polsce przyczyniają się do zacieśnienia
  więzi między naszymi krajami. Szczera i otwarta rozmowa, w tym wspólne poszukiwanie
  konstruktywnych rozwiązań, są fundamentalne dla pogłębiania więzi strategicznych
  obu państw. Zdaniem rozmówców podobna percepcja szans i zagrożeń w regionie stanowią
  doskonałą bazę dla współpracy polsko-litewskiej – zwłaszcza w obszarze budowania
  odporności regionalnej wobec coraz bardziej wymagającej sytuacji geopolitycznej.
