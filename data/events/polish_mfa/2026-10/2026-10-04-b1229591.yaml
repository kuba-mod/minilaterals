title: Oświadczenie MSZ w odpowiedzi na groźby i apele Rosji
text: Takie działania, sprzeczne z zasadami prawa międzynarodowego, nie przyniosą
  jednak oczekiwanego skutku. Rosja nie złamie Ukrainy ani nie podważy europejskiej
  solidarności z narodem ukraińskim. Polska niezachwianie wspiera Ukrainę, jej prawo
  do samostanowienia i integralności terytorialnej. Będziemy nadal stanowczo reagować
  na nieodpowiedzialne i niebezpieczne działania Rosji oraz wraz z sojusznikami zwiększać
  presję na Kreml. Nie przewidujemy zmian w funkcjonowaniu Ambasady RP w Kijowie.
