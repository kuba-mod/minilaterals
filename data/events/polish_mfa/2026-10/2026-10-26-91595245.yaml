title: Wiceministrowie ds. Europejskich Trójkąta Weimarskiego w Giżycku
text: Wiceministrowie Polski, Francji i Niemiec omówili trudną sytuację Ukrainy w
  związku z trwającą rosyjską agresją i zbliżającą się zimą. Zgodnie ocenili, że Rosja
  nie wykazuje gotowości do podjęcia konstruktywnych rozmów pokojowych. Potwierdzili
  konieczność kontynuowania i wzmacniania europejskiego wsparcia dla Ukrainy, zaostrzenia
  sankcji wobec Rosji oraz przyspieszenia wypłat transz unijnej pożyczki w ramach
  Ukraine Support Loan (USL). Wskazali także na potrzebę udziału przedstawicieli Europy
  w ewentualnych rokowaniach pokojowych. W kontekście bezpieczeństwa regionalnego
  partnerzy podkreślili, że rosyjskie ataki na czarnomorski szlak eksportu zboża mają
  na celu nie tylko pozbawienie Ukrainy źródeł dochodu, ale także wywołanie kryzysu
  żywnościowego na świecie oraz zwiększenie presji migracyjnej na UE. Spotkanie w
  ramach Trójkąta Weimarskiego było okazją do wymiany poglądów na temat przyszłych
  Wieloletnich Ram Finansowych Unii Europejskiej na lata 2028–2034, w przededniu decydującej
  fazy negocjacji budżetowych. Rozmowy dotyczyły znaczenia przyszłego budżetu UE dla
  realizacji wspólnych priorytetów europejskich oraz odpowiedzi na wyzwania stojące
  przed państwami członkowskimi i ich regionami. Ministrowie z Francji i Niemiec zapoznali
  się również ze specyfiką oraz wyzwaniami województwa warmińsko-mazurskiego jako
  wschodniego regionu granicznego. Rozmowy koncentrowały się także na potrzebie uproszczenia
  unijnych regulacji i ograniczenia obciążeń administracyjnych nakładanych na przedsiębiorstwa
  oraz rolników. Wiceszefowie dyplomacji Polski, Francji i Niemiec zwracali uwagę
  na nadmierne obowiązki sprawozdawcze, liczbę aktów delegowanych oraz konieczność
  dostosowania wymogów do wielkości podmiotów i ich rzeczywistego wpływu na środowisko.
  Podkreślono również znaczenie poprawy procesu stanowienia prawa w UE oraz zapewnienia
  europejskim przedsiębiorstwom warunków sprzyjających konkurencyjności i dostępowi
  do jednolitego rynku. W dyskusji o transformacji klimatycznej wskazali na potrzebę
  pogodzenia celów środowiskowych z ochroną konkurencyjności europejskiej gospodarki
  i utrzymaniem jej potencjału przemysłowego. Omówili również różnice w podejściu
  do wdrażania rozwiązań klimatycznych, w szczególności systemu ETS. Osobnym tematem
  było bezpieczeństwo gospodarcze UE w wymiarze zewnętrznym. Wiceministrowie podkreślili
  potrzebę wypracowania rozwiązań pozwalających pogodzić suwerenność gospodarczą,
  dekarbonizację i konkurencyjność Unii, przy jednoczesnym zapewnieniu równych warunków
  działania wobec partnerów międzynarodowych. Omówili prace nad Instrumentem na rzecz
  Przyspieszenia Przemysłowego (en. Industrial Accelerator Act, IAA). Wskazali również
  na potrzebę skuteczniejszego wykorzystywania instrumentów polityki gospodarczej
  UE w relacjach z partnerami zewnętrznymi oraz tworzenia warunków sprzyjających rozwojowi
  produkcji przemysłowej w Europie. Wiceministrowie Trójkąta Weimarskiego rozmawiali
  także o aktualnych wyzwaniach z zakresu polityki rozszerzenia UE. Odnotowali z zadowoleniem
  ostatnie postępy, tj. otwarcie klastrów 2. oraz 3. dla Ukrainy i Mołdawii i zamknięcie
  kolejnych rozdziałów przez Czarnogórę i Albanię. Wiceszefowie dyplomacji Polski,
  Francji i Niemiec podkreślili, że rozszerzenie jest geopolityczną koniecznością
  wskazując jednocześnie, że proces ten pozostaje oparty na konkretnych postępach
  (merit-based) i wymaga określonych działań po stronie państw kandydujących. Podczas
  spotkania przyjęto wspólną deklarację, w której uczestnicy potwierdzili wolę dalszej
  współpracy w ramach Trójkąta Weimarskiego na rzecz silnej i bezpiecznej Europy.
  Podkreślili w niej zaangażowanie we wzmacnianie wschodniej flanki UE i NATO oraz
  europejskich zdolności obronnych i przemysłu obronnego. Spotkanie w Giżycku było
  okazją do zaprezentowania francuskim i niemieckim partnerom specyfiki granicznego
  regionu Unii Europejskiej, który mierzy się z poważnymi wyzwaniami w zakresie bezpieczeństwa
  oraz gospodarki, wynikającymi z wrogiej polityki Rosji.
