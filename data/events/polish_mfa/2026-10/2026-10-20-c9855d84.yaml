title: Konsultacje polsko-cypryjskie
text: W kontekście bezpieczeństwa regionalnego rozmówcy jednoznacznie potępili rosyjską
  agresję wobec Ukrainy i zadeklarowali dalsze wsparcie dla Kijowa. Tematem dyskusji
  była również narastająca presja migracyjna, którą uznano za wspólne, strukturalne
  wyzwanie wymagające stanowczej odpowiedzi na poziomie unijnym. Podczas rozmów wiceminister
  Harazim podkreślił bezprecedensową skalę zagrożeń hybrydowych oraz ataków sabotażowych
  na wschodniej granicy UE i NATO. Ważnym elementem agendy była sytuacja wewnętrzna
  na Cyprze. Konsultacje objęły również strategiczne tematy unijne oraz bieżącą sytuację
  na Bliskim Wschodzie. Wiceszefowie dyplomacji Polski i Cypru wymienili opinie na
  temat przyszłego kształtu Wieloletnich Ram Finansowych (WRF) i podkreślili fundamentalne
  znaczenie relacji transatlantyckich. Ministrowie ocenili proces rozszerzenia UE
  jako kluczowe narzędzie stabilizacji geopolitycznej Europy. Potwierdzono także wysoki
  potencjał współpracy gospodarczej, której głównym filarem pozostaje sektor turystyki.
