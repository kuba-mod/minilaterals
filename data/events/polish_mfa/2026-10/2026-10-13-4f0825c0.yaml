title: Spotkanie szefów dyplomacji Polski i Wielkiej Brytanii w Warszawie
text: 'Szefowie dyplomacji podkreślili, że Polskę i Zjednoczone Królestwo łączy strategiczne
  partnerstwo oraz wielowymiarowa współpraca polityczna. Przekładają się one na wspólne
  interesy w obszarze bezpieczeństwa, obronności i gospodarcze. Minister Sikorski
  zwrócił uwagę na zaangażowanie brytyjskiego przemysłu obronnego w modernizację polskich
  sił zbrojnych i zapewnił o chęci rozwoju tej współpracy, m.in. w programach Narew
  i Miecznik, a także w obszarze produkcji amunicji, w tym we współpracy BAE Systems
  z PGZ. Warszawa i Londyn jednoznacznie popierają suwerenność i integralność terytorialną
  Ukrainy. Strony zgodziły się, że agresja Rosji na Ukrainę powinna zakończyć się
  jak najszybciej. Polska i Zjednoczone Królestwo niezmiennie popierają również utrzymanie
  presji międzynarodowej na Rosję oraz zdecydowaną pomoc dla Kijowa – aż do zakończenia
  wojny. W tym kontekście szefowie dyplomacji Polski i Wielkiej Brytanii omówili także
  nadchodzące międzynarodowe ćwiczenia Koalicji Chętnych, w których udział wezmą także
  żołnierze brytyjscy, a których gospodarzem będzie Polska. Ukraina może liczyć nieprzerwanie
  na wsparcie polityczne, wojskowe, finansowe i humanitarne, co jest szczególnie ważne
  wobec nadciągającej zimy i bestialskich rosyjskich ataków na cele cywilne. Trwały
  i sprawiedliwy pokój musi gwarantować poszanowanie suwerenności Ukrainy oraz pociągnięcie
  Rosji do odpowiedzialności. Będziemy ściśle koordynować działania na rzecz bezpieczeństwa
  Europy, w szczególności w ramach Koalicji Chętnych oraz w ramach Grupy E5. Po spotkaniu
  bilateralnym, Ministrowie, razem z szefami dyplomacji Norwegii i Niemiec, wzięli
  udział w panelu „The Return of Power Politics: Europe Between War and Rivalry”,
  organizowanym w ramach konferencji „Warsaw Security Forum”.'
