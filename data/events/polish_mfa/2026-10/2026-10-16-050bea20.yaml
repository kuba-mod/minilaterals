title: Polsko-czeskie konsultacje w Pradze
text: 'W obszarze współpracy wielostronnej wiceministrowie wyrazili przekonanie, że
  odnowione partnerstwo wyszehradzkie jest dowodem na potrzebę i rosnącą skuteczność
  wspólnego działania państw naszego regionu. Podkreślili gotowość do koordynacji
  stanowisk i otwartość na kontynuowanie dialogu w formule „V4 plus”. Ważnym wątkiem
  konsultacji były priorytety Polski i Czech w licznych formatach wielostronnych,
  takich jak: Inicjatywa Trójmorza, Rada Państw Morza Bałtyckiego czy Trójkąt Sławkowski.
  Rozmowy objęły również kwestie agendy unijnej, w kontekście przygotowań do październikowej
  Rady Europejskiej oraz współpracy na rzecz Ukrainy (również z wykorzystaniem instrumentu
  Ukraine Facility). Podsekretarz Stanu Artur Harazim pogratulował gospodarzowi objęcia
  roli Przewodniczącego czeskiej Rady Programowej Forum. Wyraził nadzieję na zorganizowanie
  kolejnego posiedzenia gremium wspólnie z polskim przewodniczącym, dyrektorem Ośrodka
  Studiów Wschodnich Wojciechem Konończukiem. Podczas wizyty w stolicy Czech wiceminister
  Harazim wziął również udział w zorganizowanej przez Ambasadę RP w Pradze piątej
  edycji konferencji „Dzień Polskiej Logistyki”. Jej głównym tematem było wzmocnienie
  powiązań transportowych i logistycznych między Polską a Czechami, w szczególności
  możliwości związane z wykorzystaniem polskich portów przez czeskie przedsiębiorstwa.
  Wiceszef polskiej dyplomacji spotkał się także z Danielem Štechem, dyrektorem Departamentu
  Zagranicznego Kancelarii Prezydenta Republiki Czeskiej. Rozmowa dotyczyła planów
  przyszłej wizyty prezydenta Czech w Polsce, możliwości wzmocnienia współpracy w obszarze
  bezpieczeństwa i lepszego wykorzystania formatów regionalnych.'
