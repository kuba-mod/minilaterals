title: Wicepremier Radosław Sikorski w Senacie RP o priorytetach polityki polonijnej
text: 'Szef polskiej dyplomacji podziękował Marszałek Senatu Małgorzacie Kidawie-Błońskiej
  za możliwość powrotu do dobrej tradycji wygłaszania exposé polonijnego na forum
  Senatu, który od przedwojennych czasów patronuje Polakom za granicą. Minister Sikorski
  przypomniał, że wg szacunków poza granicami kraju żyje ponad 20 milionów osób związanych
  z Polską. Polska i jej diaspora są partnerami, a nie tylko adresatami wzajemnych
  oczekiwań – podkreślił minister, wskazując na potrzebę konsekwentnego działania
  w oparciu o Rządową strategię współpracy z Polonią i Polakami za granicą na lata
  2025–2030. Na realizację jej założeń w 2026 r., z uwzględnieniem środków Senatu
  RP, przeznaczono 544,6 mln zł. Minister Sikorski wskazał priorytety wynikające z
  Rządowej strategii: Wśród widocznych efektów dotychczasowych działań minister wymienił
  modernizację systemu edukacji polonijnej, a także wsparcie nauczania języka polskiego.
  Kontynuujemy dialog w sprawie wprowadzenia nauczania języka polskiego do systemów
  oświatowych państw o dużych skupiskach polonijnych. Wzorem takiego rozwiązania jest
  Irlandia, gdzie język polski jest nauczany jako język obcy i jest jednym z przedmiotów
  do wyboru zdawanym w ramach irlandzkiego odpowiednika egzaminu maturalnego. Zabiegamy
  o wprowadzenie analogicznego rozwiązania w Wielkiej Brytanii Szef polskiej dyplomacji
  zapewnił, że polskie instytucje starają się rozwijać ofertę stypendialną i programów
  dla młodej Polonii, a także wprowadzać rozwiązania ułatwiające powroty do Polski.
  Wicepremier Sikorski podkreślił, że z ulgi podatkowej na powrót do Polski, w 2022
  r. skorzystało 8 tys. Polaków, a w 2025 r. było to już 38 tys. osób – niemal pięciokrotnie
  więcej. Według raportu GUS z sierpnia tego roku aktualnie więcej osób wraca do Polski
  niż z niej wyjeżdża. Polacy głosują nogami za Polską, bo w Polsce jest lepiej Szczególne
  miejsce w polityce polonijnej pozostaje dla Polaków na Wschodzie. Minister Sikorski
  zaznaczył również rosnącą rolę polonijnych liderów w życiu publicznym państw zamieszkania.
  Po raz pierwszy w historii, polityk pochodzący z polskiej rodziny – Bronek Masojada
  został burmistrzem historycznej dzielnicy City w Londynie, a Amerykanin o polskich
  korzeniach Josh Turek z Iowa został senatorem. Przedstawiając priorytety na 2027
  r., minister Sikorski zwrócił uwagę na konieczność dalszego wzmacniania podmiotowości
  organizacji polonijnych tak, aby były nie tylko odbiorcami wsparcia, lecz także
  inicjatorami przedsięwzięć, partnerami i ambasadorami polskich interesów. Polska
  diaspora nie jest jednolita. Cechuje ją różnorodność historii, potrzeb i możliwości
  działania. Łączy ją jednak więź z Polską. Naszym celem jest silna Rzeczpospolita,
  która potrafi utrzymywać żywą, wzajemnie korzystną relację z Rodakami na całym świecie.
  Taka jest nasza misja. Taką misję będziemy realizować Pełny tekst wystąpienia wicepremiera,
  ministra spraw zagranicznych Radosława Sikorskiego można znaleźć tutaj . Zapis konferencji
  prasowej: https://www.youtube.com/live/Ev5tk1k-8nM?si=s5ZbUua9k9eWBW4a'
