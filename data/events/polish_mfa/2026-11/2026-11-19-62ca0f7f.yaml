title: Wicepremier Radosław Sikorski z wizytą w Budapeszcie
text: Szef polskiej dyplomacji odwiedził Budapeszt 19 listopada na zaproszenie węgierskiej
  minister spraw zagranicznych. Wspólnie z wicepremier Orban, szef polskiej dyplomacji
  złożył kwiaty pod pomnikiem Józefa Bema oraz przy Pomniku polskiej solidarności
  i pomocy dla Węgier podczas rewolucji 1956 roku. Warszawa i Budapeszt już nieraz
  stały ramię w ramię. Jestem przekonany, że łączy nas nie tylko wspólna przeszłość,
  ale także przyszłość w wolnej i bezpiecznej Europie. – powiedział wicepremier, minister
  spraw zagranicznych Radosław Sikorski. Minister Radosław Sikorski wygłosił w stolicy
  Węgier wykład na Budapesztańskim Forum Bezpieczeństwa na temat „European security
  and defence autonomy” oraz wziął udział w seminarium „Oferta polskiego przemysłu
  obronnego oraz sektora technologii podwójnego zastosowania (dual-use)”. Szef polskiej
  dyplomacji uczestniczył także w spotkaniu z przedstawicielami węgierskich ośrodków
  analitycznych w Instytucie Polskim w Budapeszcie. Nowy etap współpracy dwustronnej
  i dialogu Pobyt szefa polskiej dyplomacji w Budapeszcie wpisuje się w intensyfikację
  polsko-węgierskiego dialogu politycznego na najwyższym szczeblu po objęciu władzy
  przez rząd Petera Magyara w maju tego roku. Spotykamy się w Budapeszcie po 12 latach.
  To symboliczny wyraz odnowienia 1000-letniej przyjaźni polsko-węgierskiej - powiedziała
  wicepremier, minister spraw zagranicznych Węgier Anita Orban. Dzisiejsze rozmowy
  potwierdziły nasze wspólne zaangażowanie na rzecz zacieśniania stosunków dwustronnych,
  ożywienia współpracy w ramach Grupy Wyszehradzkiej (V4) oraz wspólnych działań na
  rzecz bezpieczniejszej i bardziej konkurencyjnej Europy Środkowej. Rozmawialiśmy
  również o możliwościach zacieśnienia współpracy w zakresie przeciwdziałania zagrożeniom
  hybrydowym i wzmacniania bezpieczeństwa energetycznego, w tym o potencjalnym dostępie
  do globalnych rynków gazu za pośrednictwem polskich terminali LNG. Wizyta polskiego
  ministra spraw zagranicznych jest szansą na intensyfikację dwustronnej współpracy
  ekonomicznej i regionalnej (zwłaszcza w ramach Grupy Wyszegradzkiej - V4 - i Inicjatywy
  Trójmorza) oraz na forum UE – w tym współpracy przemysłu zbrojeniowego i energetycznego.
  Podczas konsultacji z szefową węgierskiej dyplomacji Minister Sikorski podkreślił,
  że Polska jest gotowa wspierać proces modernizacji węgierskiej armii. Omówiliśmy
  możliwości rozwoju współpracy dwustronnej, w tym zacieśnienia więzi gospodarczych
  między Polską a Węgrami. Przywiozłem grupę poważnego polskiego biznesu. Polski przemysł
  obronny ma wiele do zaoferowania w ramach modernizacji sił zbrojnych. Węgry są dla
  Polski ważnym partnerem handlowym. Nasze obroty w zeszłym roku to 15 miliardów euro.
  Rozmowy dotyczyły także planów intensyfikacji współpracy resortów dyplomacji, wzmocnienia
  dialogu think-tanków czy instytucji kultury, do czego doskonałym narzędziem może
  być Dzień przyjaźni polsko-węgierskiej, obchodzony 23 marca. W odniesieniu do współpracy
  regionalnej, ministrowie rozmawiali o tym, jak przełożyć rewitalizację dialogu politycznego
  w ramach V4 na wymierne korzyści dla mieszkańców regionu Europy Środkowej. Służyć
  temu może chociażby intensyfikacja wysiłków naszych krajów w rozwoju regionalnej
  infrastruktury transportowej, przede wszystkim kolejowej. Rozmawiano o kluczowych
  tematach z europejskiej agendy politycznej, m.in. negocjacjach na temat wieloletnich
  ram finansowych UE na lata 2028–2034, polityce rozszerzenia UE oraz unijnej polityce
  energetycznej. Współpraca regionalna w sektorze energetycznym ma ogromny potencjał,
  a Polska może odgrywać w tej nowej energetycznej układance istotną rolę. Minister Sikorski
  podkreślił, że Polska, która w ramach E5 dołącza do rozmów pokojowych mających zakończyć
  inwazję Rosji na Ukrainę, prezentować będzie uzgodnione wcześniej stanowisko państw
  regionu Europy Środkowej, mając na uwadze wrażliwość Flanki Wschodniej. Odnosząc
  się do roli relacji transatlantyckich dla zapewniania bezpieczeństwa Polski czy
  Węgier zgodzono się, że silna obecność sił amerykańskich na flance wschodniej ma
  kluczowe znaczenie dla utrzymania odpowiedniego poziomu odstraszania wobec Rosji.
  Szef polskiej dyplomacji zaznaczył, że zagrożenie ze strony Rosji musi stanowić
  główny punkt odniesienia w działaniach na rzecz wzmocnienia bezpieczeństwa w Europie.
  Wyraził przy tym zadowolenie, że Węgry ponownie wykazują determinację do współpracy
  w tym obszarze i zaapelował, by istotną częścią kontaktów bilateralnych w tym zakresie
  było zacieśnianie współpracy w walce z zagrożeniami hybrydowymi, w tym dezinformacją.
