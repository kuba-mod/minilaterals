title: Dzień Otwarty w Ministerstwie Spraw Zagranicznych 21 listopada 2026 r.
text: Hasło tegorocznego Dnia Otwartego to „Historia fundamentem współczesnej profesjonalnej
  dyplomacji” . Podczas wydarzenia zaprezentujemy historyczne dziedzictwo kształtujące
  dzisiejszą służbę zagraniczną. Skupimy się na ludziach reprezentujących nasz kraj
  na świecie, budujących mosty między narodami, wspierających rodaków za granicą oraz
  dbających o dobre imię Rzeczypospolitej. W tym roku szczególną uwagę poświęcimy
  postaci ministra Krzysztofa Skubiszewskiego w 100. rocznicę jego urodzin. Podczas
  Dnia Otwartego spotkają Państwo pracowników Ministerstwa, którzy zarówno w centrali
  w Warszawie, jak i w ponad 160 placówkach na sześciu kontynentach, codziennie służą
  Polsce i jej obywatelom. Będzie to stanowiło doskonałą okazję do odsłonięcia kulis
  dyplomacji i poznanie realiów pracy w służbie zagranicznej oraz wyzwań z jakimi
  mierzymy się na co dzień. Serdecznie zapraszamy wszystkich Państwa do odwiedzenia
  gmachu Ministerstwa Spraw Zagranicznych i wspólnego świętowania tego wyjątkowego
  dnia z polskimi dyplomatami! Prosimy pamiętać o zabraniu ze sobą w dniu wizyty dokumentu
  tożsamości wskazanego podczas rejestracji.
