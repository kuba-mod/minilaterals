date: '2026-11-26'
type: press_release
source_name: polish_mfa
title: Exposé polonijne ministra spraw zagranicznych Radosława Sikorskiego
text: 'Drodzy przedstawiciele polskich środowisk za granicą, Dziękuję Wysokiemu Senatowi
  za możliwość przedstawienia po raz kolejny głównych założeń polityki polonijnej.
  Coroczne exposé Ministra Spraw Zagranicznych na forum Senatu stało się już dobrą
  tradycją, która będzie – mam nadzieję – kontynuowana. Polityka wobec Polonii i Polaków
  za granicą wymaga określenia celów oraz konsekwencji w działaniu. To długofalowy
  proces budowania relacji, w którym Polska i jej diaspora są partnerami, a nie tylko
  adresatami wzajemnych oczekiwań. Takie podejście stanowi fundament „Rządowej strategii
  współpracy z Polonią i Polakami za granicą na lata 2025–2030”.  Przyjęcie tego dokumentu
  stworzyło ramy dla lepszej koordynacji działań państwa i określiło ich najważniejsze
  cele. Przypominam, że należą do nich: Po pierwsze, aktywna polityka powrotowa, czyli
  odejście od biernego oczekiwania na powroty na rzecz systemowego wsparcia mobilności
  edukacyjnej i zawodowej. Po drugie, nowoczesne nauczanie języka polskiego. Ze względu
  na rosnącą liczbę osób, które nie znają języka przodków, stawiamy na cyfryzację
  edukacji, rozwój szkół polskich za granicą oraz wsparcie dla lektorów i polonistów.
  Po trzecie, dwukierunkowa integracja i edukacja obywatelska. Należy włączać Polaków
  w życie społeczne i polityczne krajów zamieszkania, aby stawali się wpływowymi ambasadorami
  polskich interesów. Po czwarte, uszczelnienie przepisów o Karcie Polaka i repatriacji.
  Musimy wyeliminować nadużycia polegające na wykorzystywaniu Karty jako szybkiej
  ścieżki do uzyskania pobytu stałego lub świadczeń mimo braku związków z polskością.
  Po piąte, włączanie polskiej diaspory w budowanie marki naszego kraju za granicą.
  Kto dokładnie jest naszym partnerem w tej współpracy? Według Głównego Urzędu Statystycznego
  na świecie działa blisko dziewięć tysięcy organizacji polonijnych, które służą 22
  milionom Polaków i przedstawicielom Polonii w 138 krajach. Są wśród nich organizacje
  o długiej tradycji, jak Ośrodek Duszpasterstwa Polskiego działający w Adelajdzie
  od 1856 roku czy funkcjonujący od ponad stu lat Związek Polaków w Niemczech. Są
  powstałe w okresie PRL, jak Biblioteka Polska im. Ignacego Domejki w Buenos Aires.
  Są też stosunkowo młode organizacje, założone już w XXI wieku, jak Centrum Rozwoju
  i Partnerstwa „Polonia” w Winnicy. Coraz częściej mamy do czynienia również z aktywnymi,
  lecz niezrzeszonymi przedstawicielami młodej Polonii. Razem pracujemy na sukces
  Polski i jej pozytywny obraz na arenie międzynarodowej. Nasi Rodacy wnoszą do tej
  współpracy wiedzę, doświadczenie, kompetencje zawodowe i znajomość społeczeństw,
  w których żyją. Wspierają polską kulturę, rozwijają organizacje społeczne, prowadzą
  działalność edukacyjną, tworzą media i budują relacje gospodarcze. Ich aktywność
  wzmacnia pozycję Polski. Z kolei sukcesy gospodarcze i dyplomatyczne naszego kraju
  podnoszą możliwości działania polskich środowisk za granicą. W tegorocznej informacji
  dla Sejmu o zadaniach polskiej polityki zagranicznej powiedziałem, że promowanie
  naszej gospodarki jest jednym z priorytetów polityki zagranicznej naszego rządu,
  a obrona polskiego interesu narodowego zaczyna się nierzadko tysiące kilometrów
  od naszych granic. Istotną rolę w realizacji tych zadań powinna odgrywać diaspora.
  W 2026 roku środki budżetowe przeznaczone przez poszczególne resorty i instytucje
  na współpracę z Polonią i Polakami za granicą wyniosły w sumie ponad pół miliarda
  złotych! To więcej niż przeznaczamy na przykład na realizację programu umocnień
  granicznych Tarcza Wschód. Wydatkowanie tak dużych kwot wymaga dobrej koordynacji.
  Zadanie to realizuje powołany przez Premiera Międzyresortowy Zespół do spraw Polonii
  i Polaków za Granicą. Na posiedzenia Zespołu zapraszani są przedstawiciele Senatu,
  z którymi uzgadniane są planowane działania. Skuteczność polityki polonijnej należy
  oceniać nie przez szlachetność zamierzeń, ale przez trwałość osiąganych rezultatów.
  Do najważniejszych należą: dostęp do nauki języka polskiego, zdolność środowisk
  polonijnych do samodzielnego działania, zaangażowanie kolejnych generacji w sprawy
  polonijne oraz aktywność liderów polskiego pochodzenia w krajach zamieszkania. W
  2027 roku zostanie przygotowany raport śródokresowy, który oceni efekty polityki
  polonijnej wdrażanej od 2025 roku zgodnie z tymi wytycznymi. Istotna będzie ocena
  systemu finansowania, współpracy między instytucjami i koordynacji przedsięwzięć.
  Niezmiennie poszukujemy dodatkowych form finansowania, które pozwoliłyby organizacjom
  polonijnym uzyskać większą samodzielność i utrwalić efekty ich pracy. Staramy się
  w większym stopniu wykorzystywać możliwości kooperacji z administracją poszczególnych
  państw, lokalnymi instytucjami, czy też organizacjami społecznymi. Dotyczy to przede
  wszystkim krajów wysoko rozwiniętych o dużych skupiskach Polonii, gdzie funkcjonuje
  także polski biznes gotowy do wspierania działań polonijnych. Na przykład w Królestwie
  Niderlandów firmy takie jak Styl Meble, FireStop Holland, czy e-Faktura.nl angażują
  się w ambitne projekty polonijne, a także dzielą doświadczeniami z przedsiębiorcami,
  którzy dopiero wchodzą na rynek holenderski. Zachęcam polskie firmy działające za
  granicą i zainteresowane współpracą z Polonią do kontaktów z naszymi placówkami
  dyplomatycznymi. Ułatwimy Państwu nawiązanie relacji z odpowiednimi partnerami polonijnymi.
  W przyszłym roku planujemy również organizację narady konsulów z całego świata zajmujących
  się sprawami polonijnymi. Będzie to kolejna okazja do oceny postępów w realizacji
  Strategii i określenia kierunków dalszej współpracy. Wnioski z analizy śródokresowej
  oczywiście zostaną przedstawione Prezesowi Rady Ministrów przez Międzyresortowy
  Zespół. Szczególnym wymiarem polityki polonijnej pozostaje podtrzymanie relacji
  z Polakami na Wschodzie, którzy poza Ojczyzną znaleźli się wbrew swej woli. Źródłem
  poważnej troski jest niestety niezmiennie sytuacja Polaków na Litwie. Ponad trzy
  dekady minęły od podpisania traktatu o przyjaznych stosunkach i dobrosąsiedzkiej
  współpracy – gwarantującego poszanowanie praw mniejszości narodowych. Mimo to główne
  postulaty litewskich Polaków pozostają niezrealizowane. Dostrzegamy nierówne traktowanie
  przez władze – zarówno centralne, jak i samorządowe – polskojęzycznych szkół oraz
  dążenie do ograniczania ich statusu i liczby. Nadal nie jest możliwy zapis nazwiska
  w oryginalnej formie, czy umieszczanie tablic z nazwami topograficznymi w języku
  polskim w rejonie, gdzie Polacy stanowią znaczny odsetek mieszkańców. Tak jak przewiduje
  to Konwencja Rady Europy o prawach mniejszości narodowych. Mieszkający w Polsce
  Litwini cieszą się wszystkimi tymi należnymi im prawami mniejszości narodowych,
  a szkoły z językiem litewskim jako wykładowym funkcjonują bez przeszkód. Relacje
  sąsiedzkie z Litwą – naszym sojusznikiem w NATO i Unii Europejskiej – nie mogą opierać
  się na przemilczaniu tych trudnych kwestii. Nie poprawią się, dopóki nie znajdziemy
  rozwiązania uwzględniającego prawa i interesy obu stron. Powtarzam to moim litewskim
  partnerom i wszystkich Państwa zachęcam do tego samego. Z podobną sytuacją mamy
  niestety do czynienia także na Łotwie. Rozumiemy działania władz w Rydze na rzecz
  ograniczenia wpływów rosyjskich. Ale nie mogą się one negatywnie odbijać na sytuacji
  polskich placówek edukacyjnych. Popieramy postulaty łotewskich Polaków w zakresie
  przywrócenia państwowych egzaminów z języka polskiego w ostatnich klasach szkół
  podstawowych i średnich. W szczególnie trudnym położeniu znajdują się Polacy mieszkający
  w Ukrainie. Doceniamy, że kultywują swoją tożsamość także w warunkach wojny. Nasi
  dyplomaci są na miejscu i mimo zagrożenia – gdy rosyjskie pociski spadają w odległości
  kilkuset metrów od naszej ambasady – świadczą pomoc wszędzie tam, gdzie jest to
  możliwe. Z jeszcze inną sytuacją mamy do czynienia na Białorusi. Konsekwentnie upominamy
  się o respektowanie praw Polaków w tym kraju, zwłaszcza do swobodnego zrzeszania
  się i nauczania języka ojczystego. Doceniamy fakt uwolnienia przez władze w Mińsku
  wielu więźniów politycznych, w tym Andrzeja Poczobuta. Jednocześnie nie zapominamy o
  tych rodakach, którzy wciąż nie odzyskali wolności. Wspieramy dążenia Związku Polaków
  na Białorusi do jego ponownej legalizacji przez władze w Mińsku. Negatywnie oceniamy
  dyskryminacyjne traktowanie posiadaczy Karty Polaka, zwłaszcza w sektorze publicznym.
  Uspokajam białoruskie władze – Karta potwierdza przynależność do Narodu Polskiego,
  ale nie przeszkadza w byciu lojalnym obywatelem Białorusi czy jakiegokolwiek innego
  kraju. Oczekujemy również, że białoruskie władze zaprzestaną nacisków na polskich
  księży, umożliwią im swobodną posługę i nie będą stawiały przed alternatywą: zrzeczenie się
  polskiego obywatelstwa na rzecz białoruskiego albo przymusowy wyjazd z kraju. Polityka
  wobec Polaków w Rosji jest dalece ograniczona ze względu na wojnę Kremla przeciwko
  Ukrainie i agresywną politykę wobec całego Zachodu. Polskie konsulaty w Sankt Petersburgu,
  Królewcu oraz Irkucku zostały zamknięte z powodu decyzji władz rosyjskich. W rezultacie
  na terytorium Rosji działa tylko jeden urząd konsularny w Moskwie. W tej trudnej
  sytuacji wsparcie dla Polaków przebywających poza Moskwą jest realizowane zdalnie
  przez dyżurnego konsula w stolicy. Wspomniałem już o Karcie Polaka. Ten dokument,
  podobnie jak proces repatriacji ma służyć zbliżaniu Polaków ze Wschodu do Ojczyzny.
  Dane liczbowe z ostatnich 3 lat pokazują zwiększenie odsetka Kart Polaka wydawanych
  na podstawie zaświadczenia organizacji polskiej lub polonijnej. Niestety, część
  tych dokumentów budzi wątpliwości pod kątem wiarygodności zawartych w nich informacji.
  Zgodnie z intencją ustawodawcy, jak i ze Strategią migracyjną Polski, dokument ten
  powinien być wydawany w celu podtrzymania związków z Polską cudzoziemców o polskich
  korzeniach zamieszkałych za granicą. Tymczasem o Kartę ubiega się coraz więcej osób
  zamieszkałych w Polsce w celu legalizacji pobytu i uzyskania obywatelstwa. Zjawiska
  te skłoniły Ministerstwo Spraw Zagranicznych do podjęcia prac nad nowelizacją ustawy
  o Karcie Polaka w celu uszczelnienia systemu jej przyznawania. Likwidujemy możliwości
  otrzymania Karty Polaka na podstawie zaświadczenia organizacji polonijnych oraz
  rozszerzamy zakres danych i dokumentów wymaganych do dołączenia do wniosku. Aby
  uzyskać Kartę konieczna jest znajomość języka polskiego oraz polskiej historii i
  tradycji. Ten warunek zostanie podtrzymany. Z oczywistych powodów. Znajomość języka
  ułatwia dostęp do polskiej kultury i ułatwia uczestnictwo w życiu wspólnoty. Jest
  także praktyczną kompetencją, która może otwierać młodym ludziom drogę do studiów,
  rozwoju zawodowego w Polce. Instytut Rozwoju Języka Polskiego opracował ramy programowe
  nauczania języka polskiego poza granicami kraju, z których korzystają społeczne
  szkoły polonijne na całym świecie. To ważny krok w kierunku ujednolicenia standardów
  nauczania i dostosowania materiałów dydaktycznych do potrzeb młodego pokolenia Polaków.
  W sierpniu 2026 roku Instytut przyznał prawie 1,2 miliona złotych na 27 ofert w
  konkursie „Polski bez granic”, wspierającym pozaszkolne formy nauczania polskiego
  za granicą. Kontynuujemy dialog w sprawie wprowadzenia nauczania języka polskiego do
  systemów oświatowych państw o dużych skupiskach polonijnych. Wzorem takiego rozwiązania
  jest Irlandia, gdzie język polski jest nauczany jako język obcy i jest jednym z
  przedmiotów do wyboru zdawanym w ramach irlandzkiego odpowiednika egzaminu maturalnego.
  Zabiegamy o wprowadzenie analogicznego rozwiązania w Wielkiej Brytanii. Nie widzimy
  powodu, dla którego język polski miałby być traktowany inaczej niż na przykład hiszpański
  lub francuski. Zachęcając młode pokolenie Polonii i Polaków za granicą do nauki
  języka polskiego należy pokazać wynikające z tego korzyści. W tym kontekście ważną
  kwestią pozostaje umożliwienie im dostępu do polskich uczelni. Procedury rekrutacyjne
  powinny być lepiej dostosowane do różnych ścieżek kształcenia. I żeby było jasne,
  nie chodzi o obniżanie wymagań akademickich. Chodzi o to, aby różnice proceduralne
  – na przykład terminy rekrutacji na studia w Polsce wcześniejsze niż terminy uzyskania
  świadectwa maturalnego w niektórych państwach – nie stanowiły bariery dla polonijnych
  kandydatów, bo niestety dzisiaj czasami tak jest. Chętnych nie brakuje. Dowodem
  jest popularność programu stypendialnego im. generała Władysława Andersa, który
  realizuje Narodowa Agencja Wymiany Akademickiej. Od jego utworzenia w 2018 roku
  stypendium otrzymało już prawie pięć i pół tysiąca osób. Tylko w zeszłym roku wsparcie
  przyznano 565 osobom z 26. krajów. Wciąż dominują stypendyści z Białorusi, Ukrainy
  i Litwy, ale rozszerza się liczba państw, z których pochodzą beneficjenci tego programu.
  Takie programy są również elementem polityki powrotowej. Wspieramy ją, wprowadzając
  rozmaite rozwiązania ułatwiające podejmowanie decyzji o zamieszkaniu w Polsce. Według
  raportu GUS z sierpnia tego roku aktualnie więcej osób wraca do Polski niż z niej
  wyjeżdża. Polacy głosują nogami za Polską, bo w Polsce jest lepiej. Szczególnie
  uderzające są dane zza naszej zachodniej granicy. Dane za 2021 rok pokazują wyraźne
  zmniejszenie się liczby Polaków przebywających przez co najmniej 12 miesięcy w Niemczech.
  W ciągu roku szacowana liczebność tej społeczności spadła o około 21 tysięcy osób.
  Podobnie jest w Wielkiej Brytanii. W 2025 roku około 25 tysięcy naszych rodaków
  opuściło Wielką Brytanię, a osiedliło się tam zaledwie 7 tysięcy. W tym samym roku
  po raz pierwszy odnotowano dodatnie saldo migracyjne w grupie obywateli naszego
  kraju wyjeżdżających do pracy w Holandii. Rosnącą chęć powrotu widzimy też w liczbie
  beneficjentów ulgi podatkowej na powrót – w 2022 roku było to 8 tysięcy osób, a
  w 2025 roku 38 tysięcy osób. Wzrost o 375 procent. Powrót do Polski nie zaczyna
  się od przekroczenia granicy. Może rozpocząć się od nauki języka, kontaktu z polską
  uczelnią, stażu w polskiej firmie, zdobywania informacji o rynku pracy czy budowania
  relacji z polskimi instytucjami. pragnę podziękować za rozwijanie senackiego projektu
  Polonia Camp skierowanego do młodzieży polonijnej. Celem jest budowanie globalnej
  wspólnoty opartej na polskiej tożsamości oraz rozwijanie międzynarodowej współpracy
  w ramach młodzieżowych środowisk polonijnych. To bardzo dobra inicjatywa. Wiem,
  co mówię. Uczestniczyłem w obu edycjach tego wydarzenia. W tegorocznej wzięło udział
  1500 uczestników z 50 krajów. Do osób związanych akademią skierowane są „Polskie
  Powroty”, czyli flagowy program Narodowej Agencji Wymiany Akademickiej. Wspiera
  naukowców polskiego pochodzenia, którzy zdobyli doświadczenie badawcze za granicą,
  a teraz chcą wrócić, aby tu kontynuować karierę. Służy to transferowi wiedzy i sieci
  współpracy międzynarodowej do polskich instytucji naukowych. Łączy finansowanie
  wynagrodzeń z możliwością uzyskania środków na badania lub prace rozwojowe. Od jego
  uruchomienia w 2018 roku finansowanie w ramach „Polskich powrotów” otrzymało łącznie
  109 naukowców, na co przeznaczono dotychczas prawie 180 milionów złotych. Wnioski
  w obecnej – dziesiątej – edycji są przyjmowane do 22 grudnia. Serdecznie zachęcam
  do aplikowania. Kolejną ścieżką do nawiązania przez młodzież polonijną relacji z
  Polską jest program staży zawodowych o nazwie „Poland. Business Adventure”. Realizuje
  go Ministerstwo Spraw Zagranicznych we współpracy z Polską Agencją Inwestycji i
  Handlu. Pozdrawiam obecnych na sali uczestników drugiej edycji. Bardzo się cieszę,
  że jesteście Państwo z nami. Jak dotąd ze stażów skorzystało blisko 200 osób. Wiemy,
  że nie wszyscy uczestnicy zostaną w kraju. Jednak dzięki programowi otwierają się
  przed nimi także inne możliwości współpracy z Polską. Oto przykład. Uczestniczką
  programu była pani Katarzyna Krawczyk, absolwentka studiów doktoranckich z zakresu
  biologii molekularnej w Düsseldorfie. Co dał jej udział w programie Poland. Business
  Adventure? Cytuję: „Dzięki programowi mogłam odbyć staż w polskiej firmie zajmującej
  się rozwiązaniami mikrobiologicznymi dla rolnictwa i środowiska. […] Program pokazał
  mi, że mogę wykorzystać swoje międzynarodowe doświadczenie, a jednocześnie budować
  coś w Polsce i dla Polski. Chcę być częścią Polski, niezależnie od tego, gdzie zaprowadzi
  mnie życie, bo Polska jest częścią mnie”. I oto właśnie chodzi! Takich osób jak
  Pani Katarzyna jest na świecie znacznie więcej. Podczas wizyt za granicą staram
  się znaleźć czas na spotkania z młodymi rodakami. I wiem, że nawet kiedy uczą się
  lub pracują za granicą – chcą zachować związki z Ojczyzną. W San Francisco rozmawiałem
  zarówno z pracownikami dużych firm technologicznych, jak i założycielami start-upów.
  Dolina Krzemowa oferuje im ogromne możliwości zdobycia doświadczenia, pozyskania
  partnerów biznesowych i kapitału. Ale wielu z nich chce te zasoby wykorzystać do
  rozwoju firm w Polsce oraz do promocji wizerunku Polaków za granicą. Podobne zapewnienia
  słyszałem w innych miejscach – Los Angeles, Nowym Jorku, Hadze i Londynie. Tysiące
  utalentowanych i przedsiębiorczych Polaków zakładających firmy na zagranicznych
  rynkach to szansa na szybsze wejście polskich naukowców i jednostek badawczych w
  interakcje zagranicznymi partnerami oraz na wspólne inwestycje. Kolejny przykład.
  Pani Zuzanna Stamirowska wyjechała z Katowic w 2008 roku po ukończeniu liceum. Dostała
  się do elitarnej paryskiej Politechniki, a następnie zrobiła doktorat na Sorbonie.
  Po latach ciężkiej pracy, w 2020 roku założyła Pathway – start-up podziwiany za
  nowatorskie podejście do rozwoju sztucznej inteligencji. Firma została zarejestrowana
  w Kalifornii, ale tworzy ją grono Polaków, a wśród inwestorów jest współtwórca ChataGPT
  Łukasz Kaiser. Mówiąc o rozpoznawalnych na całym świecie polskich firmach nie można
  nie wspomnieć o Mateuszu Staniszewskim i Rafale Modrzewskim. Znani są jako założyciele
  przełomowych start-upów w swoich dziedzinach: sztucznej inteligencji w branży audio
  – firma ElevenLabs – oraz nowatorskich rozwiązaniach na rynku usług satelitarnych
  – firma ICEYE. Na współpracy z nimi Polska już korzysta – i to w sposób całkiem
  wymierny. Tacy ludzie są inspiracją i przyszłością Polonii, a zadaniem państwa jest
  wspieranie ich działalności i ułatwianie dostępu do lokalnych decydentów. Pomagają
  w tym także konsulowie honorowi. Obecnie jest ich już ponad 200 i pracują na wszystkich
  sześciu kontynentach. Także w Dolinie Krzemowej. Wszystkie wyżej wymienione działania
  skierowane do młodego pokolenia służą jednemu celowi: stwarzaniu okazji do kontaktów
  z Polską, niezależnie od tego, czy ostateczną decyzją młodego człowieka będzie powrót
  na stałe, studia, praca czy po prostu podtrzymanie więzi z krajem pochodzenia. Zwracamy
  coraz większą uwagę na potrzebę angażowania polonijnych liderów w lokalne życie
  polityczne. Namawiamy do kandydowania w wyborach, zacieśniamy współpracę z aktywnymi
  politykami polskiego pochodzenia, organizujemy kampanie informacyjne o prawach wyborczych
  przysługujących migrantom. Cieszymy się, że Polacy lub osoby polskiego pochodzenia
  obejmują wysokie stanowiska w krajach zamieszkania. Trzy tygodnie temu w wyborach
  do Senatu Stanów Zjednoczonych w stanie Iowa zwyciężył mający polskie korzenie Josh
  Turek - niegdyś koszykarz, który przed rozpoczęciem kariery politycznej zdobywał
  złote medale na Letnich Igrzyskach Paraolimpijskich w Rio de Janeiro i w Tokio.
  Do Stanów Zjednoczonych wyjechał pradziadek senatora-elekta. Ale związki rodziny
  z Polską są znacznie bliższe. Jego młodszy brat, również koszykarz, John Turek,
  przez kilka lat reprezentował barwy polskich klubów – PGE Turowa Zgorzelec, Rosy
  Radom i Trefla Sopot. W 2012 roku znalazł się nawet w gronie gwiazd polskiej ligi.
  29 września lordem majorem – czyli burmistrzem historycznej londyńskiej dzielnicy
  City – został pochodzący z polskiej rodziny Bronek Masojada. To ogromny sukces.
  Stanowisko zostało utworzone w XII wieku i po raz pierwszy w historii przypadło
  osobie polskiego pochodzenia. Na zaproszenie nowego burmistrza polska społeczność
  dołączyła do londyńskiej parady organizowanej w dniu objęcia przez niego urzędu.
  Podczas Lord Mayor’s Show liczne polskie flagi powiewały obok brytyjskich. Ważnym
  celem polityki polonijnej są działania skierowane na rozwijanie zdolności przywódczych
  i organizacyjnych wśród Polaków mieszkających za granicą. Wzmacniamy kompetencje
  liderów w zakresie prowadzenia działalności społecznej oraz integrowania i wzmacniania
  środowisk polonijnych. W konkursie Ministra Spraw Zagranicznych „Polonia i Polacy
  za Granicą 2026”, dofinansowanie otrzymało ponad 40 projektów szkolących liderów
  polonijnych i organizujących dla tej grupy wizyty studyjne. Łączna kwota dofinansowania
  to prawie 11 milionów złotych. W projektach liderskich realizowanych przez MSZ tylko
  w tym roku wzięło udział prawie 500 przedstawicieli Polonii, między innymi z Wielkiej
  Brytanii, Niemiec, Argentyny, Brazylii i Australii. Tworzymy korpus aktywnych liderów
  polonijnych, którzy będą dzielili się dobrymi praktykami i współpracowali z placówkami
  dyplomatyczno-konsularnymi na całym świecie. Konsulat Generalny RP w Nowym Jorku
  stworzył Polish Young Professionals – cykl spotkań networkingowych dla młodych specjalistów,
  studentów i twórców polskiego pochodzenia mieszkających lub pracujących na wschodnim
  wybrzeżu USA. W Brazylii z inicjatywy uczestników programów liderskich MSZ powstał
  Instytut Pamięci Polskiego Imigranta im. Św. Zygmunta Felińskiego w Áurea. To ośrodek
  edukacyjny działający na rzecz promowania polszczyzny oraz wspierania polskiej społeczności
  w utrzymaniu dziedzictwa językowego i kulturowego. Instytutem kieruje dr Fabricio
  Vicroski – jeden z autorów wielkiego sukcesu, jakim było doprowadzenie do uznania
  języka polskiego za współurzędowy w 23 brazylijskich gminach zamieszkanych przez
  społeczność polskiego pochodzenia. Dążąc do budowania kompetencji młodego pokolenia
  i umacniania pozycji Polaków mieszkających za granicą, jednocześnie wspieramy także
  grupy najwrażliwsze. Odpowiadamy na potrzeby związane z doradztwem prawnym, administracyjnym,
  zawodowym i socjalnym. Udzielamy wsparcia językowego, czasami psychologicznego.
  Służy temu konkurs pod nazwą „Wsparcie organizacji działających na rzecz Polaków w
  kryzysie na świecie”. W bieżącym roku MSZ przeznaczyło na ten cel prawie 6 milionów
  złotych. Jego adresatem są organizacje polonijne niosące pomoc Polonii i Polakom
  za granicą w sytuacjach kryzysowych. Tylko w tym roku wsparcie otrzymało 26 projektów
  realizowanych między innymi w Wielkiej Brytanii, Irlandii, Belgii, Norwegii i Holandii.
  Poprawa sytuacji najsłabszych grup migrantów jest nie tylko słuszna moralnie. Leży
  także w interesie Polski, ponieważ wpływa na wizerunek naszego kraju i naszych Rodaków.
  MSZ – jako jedyna polska instytucja – prowadzi działania związane z infrastrukturą
  polonijną. Odeszliśmy od kosztownych inwestycji na rzecz modernizacji i remontów.
  Daje to możliwość realizacji większej liczby projektów na mniejszą skalę. Dzięki
  naszemu finansowaniu będą możliwe między innymi remont Biblioteki w Instytucie Literackim
  Kultury w Maisons-Lafitte oraz modernizacja szeregu ośrodków polskich w Wielkiej
  Brytanii, które służą praktycznej realizacji celów Strategii – od nauczania języka
  polskiego, poprzez aktywizację lokalnych liderów polonijnych, aż po pomoc naszym
  rodakom w kryzysach. Mimo toczącej się wojny, przy aktywnym wsparciu naszych placówek,
  działamy również na Ukrainie – modernizując Dom Polski w Pance oraz remontując Liceum
  im. Marii Magdaleny we Lwowie. Wyrazem szczególnej troski o przyszłość polskich
  szkół i przedszkoli na Litwie oraz Łotwie są środki w skali około 3 milionów zł
  rocznie, przeznaczane na ich modernizację. Celem jest podnoszenie konkurencyjności
  tych placówek, aby polskie przedszkole, a później szkoła czy liceum - były pierwszym
  wyborem wśród rodzin mniejszości polskiej. Wsparcie dla takich jednostek daje nam
  też konkretne argumenty w dialogu z władzami tych państw w kwestii egzekwowania
  ich własnych zobowiązań wobec mniejszości polskiej. Skuteczna polityka wymaga rzetelnej
  wiedzy o społecznościach, którym służy. Ważnym rezultatem działań Ministerstwa Spraw
  Zagranicznych jest w tym kontekście „Atlas Polonii i Polaków za granicą” , który
  powstał na podstawie informacji zgromadzonych przez placówki. Pozwala zrozumieć
  zróżnicowanie polskiej diaspory, zidentyfikować jej potrzeby i planować działania
  na podstawie konkretnych danych, a nie ogólnych szacunków. Informacje zawarte w
  „Atlasie” będą systematycznie aktualizowane, a zakres merytoryczny narzędzia rozwijany.
  Wiedza ta powinna się przełożyć na lepsze decyzje dotyczące finansowania, edukacji,
  współpracy organizacyjnej i ochrony polskiej tożsamości. „Atlas” w wersji online
  dostępny jest w na stronach MSZ, a w wersji drukowanej jest dostępny dzisiaj na
  sali dla wszystkich zainteresowanych. Nośnikiem informacji na tematy polonijne są
  dziś nie tylko rządowe portale i publikacje. To także media lokalne tworzone przez
  środowiska polonijne. O ile tradycyjne media – które wspieramy finansowo – wciąż
  odgrywają istotną rolę, to skuteczna komunikacja wymaga dywersyfikacji kanałów i
  sposobu dotarcia. W erze sztucznej inteligencji rośnie znaczenie autentycznych historii
  opowiadanych przez wiarygodnych ludzi. Nowoczesny Ośrodek Mediów dla Zagranicy TVP
  oraz Polskie Radio dla Zagranicy umożliwią obecność na wielu platformach jednocześnie.
  W warunkach rosnącej skali manipulacji informacyjnych szczególnego znaczenia nabierają
  kompetencje dziennikarskie, umiejętność weryfikacji informacji oraz znajomość współczesnych
  narzędzi komunikacji. Dlatego we współpracy z Wydziałem Dziennikarstwa, Informacji
  i Bibliologii Uniwersytetu Warszawskiego zaoferowaliśmy dziennikarzom polonijnym
  studium podyplomowe „Nowe media w organizacjach polonijnych”. W tym roku, po ponad
  200 godzinach zajęć, 23 absolwentów reprezentujących 15 krajów odebrało dyplomy
  podczas uroczystości na Uniwersytecie Warszawskim. Polityka wobec Polonii i Polaków
  za granicą wymaga perspektywy wykraczającej poza jeden rok budżetowy i doraźne działania.
  Jej rezultaty mierzymy tym, czy młodzi ludzie chcą uczyć się języka polskiego, czy
  mogą studiować w Polsce, czy organizacje polonijne rozwijają swoją działalność,
  czy prawa naszych Rodaków są respektowane, czy Polska pozostaje dla nich ważnym
  punktem odniesienia i czy chcą wracać do Polski. Wymaga to konsekwencji, ale także
  gotowości do zmian. Szacunku dla dorobku poprzednich pokoleń, ale i przestrzeni
  dla nowych liderów. Polska diaspora nie jest jednolita. Cechuje ją różnorodność
  historii, potrzeb i możliwości działania. Łączy ją jednak więź z Polską. Naszym
  celem jest silna Rzeczpospolita, która potrafi utrzymywać żywą, wzajemnie korzystną
  relację z Rodakami na całym świecie. Taka jest nasza misja. Taką misję będziemy
  realizować.'
