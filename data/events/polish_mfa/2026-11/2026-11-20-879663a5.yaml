title: Oświadczenia MSZ w związku z atrybucją przez Danię rosyjskim służbom specjalnym
  próby zamachu na obywatela Stanów Zjednoczonych i Ukrainy na terenie Danii
text: Jest to kolejna próba zamachu na tę osobę – pierwsza miała miejsce na terytorium
  RP w sierpniu 2026 r., jednakże została udaremniona dzięki zaangażowaniu polskich
  służb, zaś niedoszły sprawca, obywatel Rosji, został zatrzymany. Wydarzenia w Danii
  stanowią kolejny przykład kryminalnego działania Rosji na terenie państwa UE, którego
  celem jest zastraszenie oraz destabilizacja naszych społeczeństw. Polska popiera
  zaproponowane przez władze Danii środki ograniczające możliwość wjazdu i swobodnego
  podróżowania obywateli Rosji na teren UE. Są to kroki, które Polska, ze względu
  na potrzebę zapewnienia ochrony własnego kraju i jego obywateli, już zaimplementowała.
  Widzimy potrzebę stanowczego i skoordynowanego reagowania państw UE i NATO na wszelkie
  przypadki prowokacji i działań o znamionach terroryzmu państwowego ze strony Rosji.
