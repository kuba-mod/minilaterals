title: Umowa między Polską a Stałym Trybunałem Arbitrażowym podpisana
text: Umowa pozwoli na prowadzenie w Polsce postępowań arbitrażowych, koncyliacyjnych
  i mediacyjnych, a także korzystanie z innych alternatywnych metod rozwiązywania
  sporów. Z uwagi na brak stałego biura Trybunału w regionie, zawarcie umowy z STA
  jest dobrym sygnałem dla polskich przedsiębiorców. Ewentualne spory o charakterze
  ponadnarodowym będą mogli rozwiązywać w ramach międzynarodowej procedury arbitrażowej
  w Polsce. - Polska dąży do umocnienia swojej pozycji jako miejsca rozstrzygania
  sporów międzynarodowych o istotnym znaczeniu dla interesu publicznego – zarówno
  Polski, jak i państw regionu. Liczymy, że Warszawa stanie się regionalnym centrum
  arbitrażu międzynarodowego, przyczyniając się tym samym do zwiększenia atrakcyjności
  polskiego rynku usług prawnych – powiedział szef polskiej dyplomacji Radosław Sikorski.
  Dotychczas STA podpisał umowy z państwami goszczącymi, przewidującymi możliwość
  świadczenia usług arbitrażowych. Mowa o Brazylii, Bahrajnie, Hiszpanii, Argentynie,
  Austrii, Chile, Chinach, Dżibuti, Ekwadorze, Indiach, Irlandii, Kostaryce, Malezji,
  Mauritiusie, Paragwaju, Portugalii, RPA, Singapurze, Wietnamie i Urugwaju. W odniesieniu
  do państw regionu Europy Środkowo-Wschodniej, Polska jest drugim takim państwem
  obok Słowacji. Sekretarzem Generalnym organizacji jest Polak, dr hab. Marcin Czepelak,
  który pełni tę funkcję od 2022 roku. To pierwszy przypadek w historii STA, kiedy
  Sekretarz Generalny nie pochodzi z Niderlandów. Z uwagi na kończącą się właśnie
  kadencję profesora Czepelaka, Polska zgłosiła ponownie jego kandydaturę na kadencję
  na lata 2027-2032. Stały Trybunał Arbitrażowy (en. Permanent Court of Arbitration,
  PCA) to organizacja międzyrządowa z siedzibą w Hadze, utworzona w 1899 r. na mocy
  I konwencji haskiej o pokojowym rozstrzyganiu sporów międzynarodowych. STA zapewnia
  państwom, organizacjom międzynarodowym oraz podmiotom prywatnym wsparcie administracyjne
  i organizacyjne w prowadzeniu postępowań arbitrażowych, koncyliacyjnych i innych
  pokojowych metod rozstrzygania sporów. Oferuje również zaplecze instytucjonalne,
  w tym pomoc w organizacji postępowań i wyznaczaniu arbitrów. Obecnie członkami STA
  jest 129 państw.
