title: 35 lat Polski w Radzie Europy
text: Przystąpienie Polski do Rady Europy zbiegło się z pierwszym posiedzeniem Sejmu
  wybranego w pełni w wolnych i demokratycznych wyborach. Była to pierwsza organizacja,
  do której Polska dołączyła po transformacji ustrojowej. Członkostwo w niej odegrało
  istotną rolę w budowie instytucji demokratycznych i integracji Polski z Unią Europejską.
  Nasze państwo konsekwentnie wspiera współpracę Rady Europy z Unią Europejską, ONZ
  i OBWE, a także działania na rzecz państw Partnerstwa Wschodniego. Jednym z najważniejszych
  wydarzeń w historii polskiego członkostwa w Radzie Europy był III Szczyt Rady Europy
  w Warszawie w 2025 r., który wyznaczył kierunki dalszego rozwoju tej organizacji.
  Przyjęto wówczas m.in. konwencję w sprawie działań przeciwko handlowi ludźmi – jeden
  z kluczowych międzynarodowych instrumentów ochrony ofiar tego procederu. W obliczu
  rosyjskiej agresji na Ukrainę, Rada Europy stoi na straży fundamentalnych wartości
  i porządku międzynarodowego opartego na zasadach. Już w marcu 2022 r. Rada Europy
  wykluczyła Rosję ze swego grona. Polska odegrała aktywną rolę w wypracowywaniu postanowień
  IV Szczytu Rady Europy w Reykjaviku w 2023 r., w szczególności dotyczących wsparcia
  dla Ukrainy oraz pociągnięcia Rosji do odpowiedzialności. Polska wspiera tworzenie
  międzynarodowego mechanizmu kompensacyjnego dla Ukrainy, w tym działanie Rejestru
  Szkód, w którego zarządzie zasiada przedstawicielka Polski. Wśród wyzwań stojących
  przed Radą Europy szczególne miejsce zajmuje przeciwdziałanie dezinformacji i zagranicznym
  manipulacjom i ingerencji w informacje (FIMI, en. Foreign Information Manipulation
  and Interference). Rada Europy podjęła już prace nad przygotowaniem konwencji w
  tej dziedzinie, aby móc skutecznie walczyć z zagrożeniami dla funkcjonowania demokratycznych
  społeczeństw. W listopadzie 2028 r. Polska ponownie obejmie przewodnictwo w Komitecie
  Ministrów Rady Europy, czyli w głównym organie decyzyjnym tej organizacji. Będzie
  to kolejna okazja do umocnienia wkładu Polski w rozwój Rady Europy. Po 35 latach
  Polska pozostaje zaangażowana w budowę Europy, w której prawa człowieka, demokracja
  i praworządność są nie tylko wspólnymi wartościami, lecz także fundamentem jej bezpieczeństwa
  i stabilności. Rada Europy , powstała w 1949 r., jest organizacją międzynarodową
  z siedzibą w Strasburgu, zrzeszającą 46 państw. Jej najważniejszym instrumentem
  jest Europejska Konwencja Praw Człowieka, której przestrzegania strzeże Europejski
  Trybunał Praw Człowieka. Dzięki niej obywatele mogą dochodzić obrony swoich praw
  również na poziomie międzynarodowym. Komitet Ministrów Rady Europy - ciało decyzyjne
  Rady złożone z ministrów spraw zagranicznych każdego państwa członkowskiego lub
  stałych przedstawicieli dyplomatycznych w Strasburgu. Komitet Ministrów decyduje
  o polityce Rady Europy i zatwierdza jej budżet oraz program działań.
