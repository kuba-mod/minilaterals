title: Wicepremier Radosław Sikorski otworzył XIV edycję Warszawskiego Dialogu na
  rzecz Demokracji
text: 'W Warszawie odbyła się XIV Warszawskiego Dialogu na rzecz Demokracji. Wydarzenie,
  powstałe we współpracy MSZ z Uniwersytetem Warszawskim i Europejskim Funduszem na
  rzecz Demokracji, otworzył minister Radosław Sikorski. Szef polskiej dyplomacji
  podkreślił w wystąpieniu znaczenie dialogu międzynarodowego w obliczu postępującego
  regresu demokracji, ograniczania praw człowieka oraz rosnących napięć geopolitycznych. Minister
  Sikorski podkreślił duże zaangażowanie Polski na rzecz międzynarodowego systemu
  ochrony praw człowieka, czego wyrazem jest kandydatura do Rady Praw Człowieka ONZ
  na kadencję 2029–2031. W 20. rocznicę powołania Rady Praw Człowieka ONZ szef polskiej
  dyplomacji wskazał potrzebę wzmocnienia jej skuteczności, wiarygodności, a także
  przezwyciężenia politycznej selektywności i podwójnych standardów. Minister zaznaczył,
  jak ważne jest zapewnienie funkcjonowania niezależnych mechanizmów monitorowania
  naruszeń oraz pociąganie sprawców do odpowiedzialności. Podczas spotkania omówiono
  nowe wyzwania, takie jak dezinformacja i wykorzystywanie technologii cyfrowych jako
  narzędzia represji. Minister Sikorski zaznaczył, że w tej nierównej walce należy
  szukać nowych rozwiązań. Porządek międzynarodowy, który został ustanowiony po II
  wojnie światowej, po upadku komunizmu, to jest coś, na czym Polska skorzystała i
  jesteśmy zdeterminowani, aby go bronić, nawet wtedy, gdy inni są mniej zdeterminowani.
  Minister Sikorski przywołał postawę Tadeusza Mazowieckiego po tragedii w Srebrenicy,
  akcentując znaczenie odwagi, solidarności i woli politycznej w obronie uniwersalnych
  wartości. Zacytował też wymowne słowa byłego premiera: Światu nie brakuje deklaracji
  dotyczących praw człowieka. Brakuje mu determinacji, by ich przestrzegać. Dyskusje
  panelowe poświęcono dorobkowi Rady Praw Człowieka ONZ w ciągu dwudziestu lat jej
  działalności, jak również roli specjalnych sprawozdawców i powszechnego przeglądu
  okresowego w ochronie praw człowieka. Uczestnicy omówili wpływ dezinformacji i tendencji
  autorytarnych na debatę publiczną. Paneliści dyskutowali również o tym, w jaki sposób
  młodzi ludzie wykorzystują media społecznościowe do działań obywatelskich, a także
  jakie szanse i zagrożenia wiążą się z rozwojem sztucznej inteligencji. Wśród uczestników
  konferencji znaleźli się liczni przedstawiciele warszawskiego korpusu dyplomatycznego,
  reprezentanci społeczeństwa obywatelskiego, eksperci oraz młodzież akademicka. Warszawski
  Dialog na rzecz Demokracji został zainicjowany przez Ministerstwo Spraw Zagranicznych
  w 2012 r. jako międzynarodowe forum wymiany doświadczeń w zakresie demokracji, praw
  człowieka i wspierania społeczeństwa obywatelskiego. Od początku Dialog gromadzi
  przedstawicieli rządów, organizacji międzynarodowych, środowisk akademickich i społeczeństwa
  obywatelskiego, umożliwiając wymianę doświadczeń między uczestnikami z różnych regionów
  świata.'
