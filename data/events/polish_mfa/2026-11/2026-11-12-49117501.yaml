title: Polsko-tunezyjskie konsultacje w Warszawie
text: Rozmówcy pozytywnie ocenili rozwój relacji politycznych oraz współpracy gospodarczej.
  Odnotowano potencjał do zacieśnienia współpracy w takich dziedzinach jak cyfryzacja,
  rolnictwo i przetwórstwo. Polska jest siódmym, spośród państw UE, partnerem handlowym
  Tunezji, która jest otwarta na polskie inwestycje i wymianę doświadczeń. Rozmówcy
  zadeklarowali także chęć pogłębiania współpracy naukowej i kulturalnej. Uczestnicy
  rozmów dokonali przeglądu relacji Unia Europejska-Tunezja, sytuacji w Sahelu i na
  Bliskim Wschodzie. Wiceminister Zajączkowski przedstawił rozwój wydarzeń w Europie
  Wschodniej, w tym hybrydowych działań rosyjskich przeciw Ukrainie i pozostałym państwom
  europejskim. Relacje bilateralne rozwijają się korzystnie m.in. dzięki systematycznemu
  dialogowi politycznemu. W grudniu 2024 r. minister Radosław Sikorski gościł w Warszawie
  swojego tunezyjskiego odpowiednika, Mohameda Alego Naftiego. Wcześniej, w czerwcu
  2024 r. miały miejsce konsultacje polityczne w Tunisie. Ministrowie rozmawiali również
  w styczniu 2025 r. na marginesie Światowego Forum Ekonomicznego w Davos. Następne
  konsultacje na poziomie wiceministrów spraw zagranicznych zaplanowano na 2027 rok
  w Tunisie.
