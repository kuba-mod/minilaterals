title: Polsko-włoskie konsultacje w Rzymie
text: Wiceszefowie dyplomacji Artur Harazim i Edmono Cirielli omówili prace nad nowym
  Traktatem oraz możliwości rozwoju relacji partnerstwa gospodarczego, w tym między
  przemysłami obronnymi obu państw. Podkreślili również bardzo dobry stan relacji
  dwustronnych i wolę ich dalszego pogłębiania. Wiceministrowie wskazali na konieczność
  dalszego wspierania Ukrainy w obliczu rosyjskiej agresji i zapewnienia Europie udziału
  w rozmowach pokojowych. Potwierdzili poparcie dla rozszerzenia UE o państwa Bałkanów
  Zachodnich, Ukrainę i Mołdawię, z zachowaniem jakości tego procesu. Poruszyli także
  kwestie regionalne i międzynarodowe, w tym sytuację w Azji Centralnej oraz polskie
  ambicje związane z członkostwem w G20.
