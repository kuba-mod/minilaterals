title: Spotkanie szefów dyplomacji Polski i Ukrainy
text: Ministrowie Sikorski i Sybiha omówili bieżące kwestie dwustronne, w tym zagadnienia
  związane z polityką pamięci. Strona polska podkreśliła swoje konsekwentne stanowisko,
  wyrażające sprzeciw wobec wszelkich przejawów gloryfikacji osób i formacji odpowiedzialnych
  za zbrodnie popełnione na ludności polskiej, w tym działań prowadzonych na poziomie
  lokalnym. Rozmówcy potwierdzili wolę kontynuowania dialogu oraz poszukiwania rozwiązań
  służących dalszemu rozwojowi relacji polsko-ukraińskich. Spotkanie poświęcono także
  aktualnej sytuacji bezpieczeństwa na Ukrainie, w tym wyzwaniom związanym ze zbliżającym
  się okresem zimowym i utrzymującymi się rosyjskimi atakami na infrastrukturę cywilną
  oraz energetyczną. Polska zadeklarowała dalsze wsparcie dla Ukrainy, w szczególności
  dla ukraińskiego systemu energetycznego. Ministrowie wymienili również opinie na
  temat perspektyw pokojowych – podkreślono znaczenie działań na rzecz osiągnięcia
  sprawiedliwego i trwałego pokoju, opartego na prawie międzynarodowym oraz poszanowaniu
  suwerenności i integralności terytorialnej Ukrainy, a także uwzględniającego stanowisko
  najbliższych sojuszników, w tym Polski. Ważnym elementem rozmów były także kwestie
  współpracy wojskowej oraz dalszego wzmacniania zdolności obronnych Ukrainy. Ministrowie
  zgodzili się, że ścisła współpraca w obszarze bezpieczeństwa pozostaje istotnym
  elementem stabilności regionu oraz odpowiedzi na trwającą agresję Rosji. Konsultacje
  odbyły się na marginesie nieformalnego spotkania w Warszawie Ministrów Spraw Zagranicznych
  Rady Państw Morza Bałtyckiego z udziałem Wysokiej Przedstawiciel UE do Spraw Zagranicznych
  i Polityki Bezpieczeństwa oraz Ministra Spraw Zagranicznych Ukrainy.
