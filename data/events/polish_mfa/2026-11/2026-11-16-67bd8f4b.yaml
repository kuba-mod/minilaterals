title: Wicepremier Radosław Sikorski na Radzie FAC
text: 'W dyskusji poświęconej sytuacji na Bliskim Wschodzie, szefowie europejskich
  dyplomacji skoncentrowali się na dostępnych możliwościach wsparcia stabilizacji
  i odbudowy Syrii. Minister Sikorski opowiedział się za kontynuowaniem jej politycznego
  i gospodarczego wsparcia ze strony Unii Europejskiej. Minister Sikorski ogłosił,
  że Polska planuje ponownie otworzyć jeszcze w tym kwartale, zamkniętą od 2012 roku,
  Ambasadę RP w Damaszku. Sankcje wymierzone w Rosję i wsparcie dla Ukrainy Unijni
  ministrowie spraw zagranicznych rozmawiali również o zakończeniu wojny Rosji wobec
  Ukrainy i konieczności nakładania nowych sankcji na agresora. Minister Sikorski
  zauważył, że Rosjanie oczekują, że dyskusje na temat długoterminowego bezpieczeństwa
  w Europie rozpoczną się już teraz, ale należy zachować właściwą kolejność wydarzeń:
  najpierw zawieszenie broni, potem pokój, a dopiero potem dyskusja na temat europejskiej
  architektury bezpieczeństwa. Największą sankcją jaką nałożyliśmy na Rosję jest to,
  że straciła swój najbardziej lukratywny rynek na węglowodory. Z każdym rokiem Europa
  importuje mniej rosyjskiej ropy i gazu, a alternatywy dla nich są po pierwsze trudne
  logistycznie, po drugie ceny są o co najmniej 30% niższe. Rosja sprzedaje mniej
  ropy za mniejsze pieniądze. To wpływa na jej zdolność do finansowania wojny Szef
  polskiej dyplomacji wezwał do kontynuowania wsparcia UE dla Ukrainy. Podstawą architektury
  bezpieczeństwa europejskiego są istniejące instytucje i mechanizmy, w tym standardy
  Organizacji Bezpieczeństwa i Współpracy w Europie, której zasady Rosja wielokrotnie
  naruszyła. Na Radzie FAC przyjęto nowe sankcje wobec Rosji, obejmujące ponad 100
  podmiotów związanych z rosyjskim sektorem energetycznym, systemem finansowym, ekosystemem
  floty cienia i działaniami hybrydowymi. Szef polskiej dyplomacji zaapelował o uzgodnienie
  22. pakietu sankcji przed kolejnym posiedzeniem Rady do Spraw Zagranicznych, które
  będzie miało miejsce w połowie grudnia. W kwestii wsparcia finansowego dla Ukrainy,
  minister Sikorski podkreślił konieczność rozwiązania kwestii unieruchomionych aktywów
  rosyjskich – agresor musi ponieść konsekwencje swoich działań. Polska będzie w dalszym
  ciągu zapewniać pomoc humanitarną dla Ukrainy oraz wspierać ją przy odbudowie infrastruktury
  energetycznej. Polskie przedsiębiorstwa państwowe już aktywnie angażują się we wspieranie
  Ukrainy poprzez dostarczanie kluczowego sprzętu, m.in. transformatorów średniego
  i wysokiego napięcia. Na marginesie Rady FAC minister Sikorski rozmawiał z szefem
  rumuńskiej dyplomacji Danem Neculaescu. Spotkanie dotyczyło aktualnych wyzwań dla
  bezpieczeństwa europejskiego. Szczególną uwagę poświęcono sytuacji na wschodniej
  flance NATO oraz rozwoju relacji dwustronnych, także w dziedzinie obronności.'
