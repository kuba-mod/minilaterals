title: Polsko - austriackie rozmowy o współpracy
text: Strony zgodziły się, że Polskę i Austrię łączą bardzo dobre relacje oraz omówiły
  możliwości rozwoju dalszej współpracy. Minister Bauer doceniła osiągnięcia gospodarcze
  Polski oraz zwróciła uwagę na znaczącą skalę polskich inwestycji w Austrii, w tym
  związanych z ORLEN i Autopay. Rozmowa koncentrowała się również wokół negocjacji
  budżetu UE na lata 2028–2034, wskazując na różnice w stanowiskach państw członkowskich.
  Jednocześnie przedstawiciele dyplomacji Polski i Austrii opowiedzieli się za dalszym
  upraszczaniem unijnego prawa. Rozmówcy pozytywnie ocenili kierunek zmian w polityce
  migracyjnej UE. Zgodzili się również, że Unia Europejska powinna kontynuować proces
  rozszerzenia, a jego tempo powinno zależeć od postępów państw kandydujących w spełnianiu
  kryteriów członkostwa. Strony zgodziły się, że Polskę i Austrię łączą bardzo dobre
