title: Dr Elżbieta Mikos-Skuza ponownie wybrana do Międzynarodowej Komisji Humanitarnej
  do spraw Ustalania Faktów
text: 'Mandat członkini Komisji uzyskała ponownie dr Elżbieta Mikos-Skuza, potwierdzając
  tym samym uznanie dla jej wieloletniego zaangażowania i dorobku w dziedzinie międzynarodowego
  prawa humanitarnego. Wybory członków Międzynarodowej Komisji Humanitarnej do spraw
  Ustalania Faktów przeprowadzono 20 listopada 2026 r. w Bernie. Dr Elżbieta Mikos-Skuza
  jest wybitną ekspertką w dziedzinie międzynarodowego prawa humanitarnego. Od ponad
  30 lat prowadzi działalność akademicką, doradczą i praktyczną, wnosząc istotny wkład
  w rozwój i kształtowanie polityki humanitarnej. Jej zaangażowanie obejmuje działalność
  naukową, pracę na forum międzynarodowym oraz wieloletnią aktywność w Komisji. Od
  2002 r. jest jej członkinią, a od 2017 r. pełni funkcję pierwszej wiceprzewodniczącej.
  2 października 1992 r. Polska uznała a priori kompetencje Międzynarodowej Komisji
  Humanitarnej do spraw Ustalania Faktów. Dotychczas w jej skład weszło dwoje polskich
  przedstawicieli: prof. Roman Jasica, który pełnił funkcję członka Komisji w latach
  1996–1999 oraz dr Elżbieta Mikos-Skuza, członkini Komisji od 2002 r. Międzynarodowa
  Komisja Humanitarna do spraw Ustalania Faktów (International Humanitarian Fact-Finding
  Commission, IHFFC) z siedzibą w Bernie została ustanowiona na podstawie art. 90
  I Protokołu dodatkowego do Konwencji genewskich z 12 sierpnia 1949 r., dotyczącego
  ochrony ofiar międzynarodowych konfliktów zbrojnych, sporządzonego w Genewie 8 czerwca
  1977 r. Komisja rozpoczęła działalność 25 czerwca 1991 r. Komisja składa się z 15
  członków, którzy – zgodnie z postanowieniami Protokołu – powinni wyróżniać się wysoką
  moralnością i uznaną bezstronnością. Pełnią oni swoje funkcje we własnym imieniu.
  Do kompetencji Komisji należy badanie faktów dotyczących domniemanych poważnych
  naruszeń Konwencji genewskich i I Protokołu dodatkowego, a także świadczenie dobrych
  usług w celu przywrócenia przestrzegania tych aktów prawa międzynarodowego.'
