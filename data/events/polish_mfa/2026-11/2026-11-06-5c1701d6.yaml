title: Nieformalne spotkanie szefów dyplomacji Rady Państw Morza Bałtyckiego, UE i
  Ukrainy
text: 'Po nieformalnym spotkaniu Rady Państw Morza Bałtyckiego i Ukrainy ministrowie
  spraw zagranicznych wydali wspólne oświadczenie , które określa działania przyczyniające
  się do powstrzymania rosyjskiej agresji przeciwko Ukrainie oraz rosyjskich działań
  hybrydowych skierowanych przeciwkopaństwom europejskim. Spotkanie, które miało miejsce
  6 listopada w Warszawie, zorganizowano we współpracy z islandzką prezydencją w Radzie
  Państw Morza Bałtyckiego. Na zaproszenie wicepremiera, ministra spraw zagranicznych
  Radosława Sikorskiego do Polski przyjechali szefowie dyplomacji państw członkowskich
  Rady Państw Morza Bałtyckiego, a także Wysoka Przedstawiciel UE ds. Zagranicznych
  i Polityki Bezpieczeństwa Kaja Kallas oraz Minister Spraw Zagranicznych Ukrainy
  Andrij Sybiha. Uczestnicy spotkania zaznaczali, że konieczne jest dalsze wsparcie
  Ukrainy wobec eskalacji rosyjskich ataków powietrznych na ukraińską infrastrukturę
  krytyczną. Flanka Wschodnia NATO o bezpieczeństwie Europy Ministrowie potwierdzili,
  że Europa powinna pełnić znaczącą rolę w procesie rozmów pokojowych. W rozmowach
  podkreślano, że kwestie dotyczące podstawowych interesów bezpieczeństwa Europy wymagają
  obecności przy stole  przedstawicieli Flanki Wschodniej. Minister Sikorski ocenił,
  że spotkanie potwierdziło jedność państw naszego regionu wobec trwającej rosyjskiej
  agresji oraz gotowość wzmacniania wsparcia wojskowego i finansowego dla Ukrainy.
  Niezbędne jest zachowanie odpowiedniej kolejności. To mocno wybrzmiało podczas dzisiejszych
  rozmów. Mianowicie, najpierw zawieszenie ognia, a następnie rozmowy o trwałym pokoju
  i dopiero potem ewentualne rozmowy o tym, jak przywrócić funkcjonowanie europejskiej
  architektury bezpieczeństwa i być może, jak przywrócić reżimy kontroli zbrojeń.
  Z kolei szefowa unijnej dyplomacji Kaja Kallas wskazała: Putin nie ma prawa weta
  w kwestiach bezpieczeństwa europejskiego. Każde porozumienie mające na celu zakończenie
  wojny musi uniemożliwić Rosji ponowne uzbrojenie się i ponowny atak. (…) Ustępstwa
  powinny dotyczyć agresora, a nie ofiary. Minister spraw zagranicznych Ukrainy Andrij
  Sybiha dodał: Rosja nie jest i nie może być gwarantem europejskiego bezpieczeństwa. Wzór
  bezpieczeństwa Europy oznacza niezawodną ochronę przed Rosją, a nie dyskusję z Rosją
  na temat stref wpływów. Nie będzie drugiej Jałty ani Monachium. Dyplomaci zwrócili
  uwagę na potrzebę skutecznej reakcji na rosyjską presję hybrydową, w szczególności
  poprzez zdecydowaną politykę sankcyjną, w tym: dalsze ograniczanie działalności
  floty złomu i objęcie sankcjami podmiotów ją obsługujących, dodatkowe restrykcje
  wizowe, sprzeciw wobec udziału Rosji w wydarzeniach sportowych i kulturalnych. Uczestnicy
  zgodzili się również, że zasadne jest poszukiwanie możliwości wykorzystania zamrożonych
  rosyjskich aktywów jako źródła finansowania obrony i odbudowy Ukrainy. Minister
  Sikorski stwierdził, że wzmacnianie zdolności odstraszania nie służy prowokowaniu
  Rosji. Kreml powinien zrozumieć, że dalsza agresja będzie wiązała się wyłącznie
  z rosnącymi kosztami i konsekwencjami. Szef polskiej dyplomacji przypomniał gotowość
  Polski jako wiodącego państwaFlanki Wschodniej do udziału w ewentualnym procesie
  pokojowym. Przedstawił także dotychczasową skalę wsparcia Warszawy dla Ukrainy,
  w szczególności w zakresie środków obrony powietrznej i energetyki. Priorytetem
  jest wsparcie Ukrainy w przygotowaniach do nadchodzącego okresu zimowego i zwiększenie
  odporności jej sektora energetycznego. Polska przeznaczy dodatkowe 8 mln zł na wspólnotę
  energetyczną. Z tych funduszy zakupione będą generatory dla Ukrainy. Łączny koszt
  polskich darowizn wojskowych dla Ukrainy wynosi prawie 4 miliardy EUR (2022-2026). W
  styczniu, kiedy prawie 60% mieszkańców Kijowa nie miało prądu, Polska natychmiast
  podjęła decyzję o przekazaniu Ukrainie sprzętu – Rządowa Agencja Rezerw Strategicznych
  wydzieliła ze swoich rezerw 379 generatorów prądu oraz 18 nagrzewnic. 90 agregatów
  przekazało miasto st. Warszawa. Dodatkowo Polacy pomagali oddolnie, m.in. poprzez
  akcję „Ciepło z Polski dla Kijowa”. Minister Sikorski zaznaczył również znaczenie
  organizowanych w Polsce w listopadzie wielonarodowych ćwiczeń wojsk Koalicji Chętnych,
  w które zaangażowanych jest niemal 2000 polskich żołnierzy. Mają one zademonstrować
  gotowość Europejczyków do dalszego wspierania Ukrainy i odegrania ważnej roli w
  okresie powojennym. Rada Państw Morza Bałtyckiego (RPMB) powstała w 1992 r., a Polska
  znalazła się w gronie współzałożycieli organizacji. Aktualnie RPMB przewodniczy
  Islandia. Państwami członkowskimi są obecnie Dania, Estonia, Finlandia, Islandia,
  Litwa, Łotwa, Niemcy, Norwegia, Polska i Szwecja, a także UE. Głównym zadaniem Rady
  jest wspieranie dialogu politycznego i współpracy, ustalanie priorytetów strategicznych
  i kierunków inicjatyw regionalnych zgodnych z długoterminowymi priorytetami organizacji,
  do których należą: Tożsamość regionalna, Zrównoważony i dobrze prosperujący region,
  Bezpieczny i stabilny region. Obecnie funkcjonują cztery grupy: ds. zrównoważonej
  gospodarki morskiej, ds. zwalczania handlu ludźmi, ds. współpracy na rzecz dzieci
  zagrożonych oraz ds. obrony cywilnej.'
