title: Polska w Radzie Wykonawczej Organizacji ds. Zakazu Broni Chemicznej
text: Decyzja zapadła w drodze głosowania podczas 31. Konferencji Państw-Stron Konwencji
  o Zakazie Broni Chemicznej (CWC), która miała miejsce 23-27 listopada 2026 r. w
  Hadze. Polska wraz z Estonią i Rosją ubiegała się o dwa miejsca w Radzie dostępne
  dla państw z Grupy Europy Wschodniej (EEG).  Kandydatury Warszawy i Tallina zostały
  zaakceptowane zdecydowaną większością głosów Konferencji Państw stron. Zdecydowane
  poparcie uzyskane przez Polskę jest wyrazem uznania dla zaangażowania naszego państwa
  na rzecz uwolnienia świata od broni chemicznej. Polska należy do najbardziej aktywnych
  państw członkowskich Organizacji ds. Zakazu Broni Chemicznej. Angażuje się w prace
  organizacji OPCW oraz wspiera ją finansowo - między innymi poprzez współrealizowanie
  projektów w Syrii, Ukrainie oraz wsparcie budowy nowoczesnego laboratorium i centrum
  szkoleniowego OPCW. Polska ma również znaczący dorobek międzynarodowy, przedstawiając
  jako wyłączny autor, coroczną rezolucję Zgromadzenia Ogólnego Narodów Zjednoczonych
  o wdrażaniu CWC. Rada Wykonawcza działa na rzecz skutecznej realizacji i przestrzegania
  CWC oraz nadzoruje działalność Sekretariatu Technicznego OPCW. Od czasu powstania
  organizacji w 1997 roku Polska zasiadała w Radzie już ośmiokrotnie.
