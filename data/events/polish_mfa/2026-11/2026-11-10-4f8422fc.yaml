title: Jakub Józef Orliński odznaczony „Bene Merito'' przez szefa dyplomacji Radosława
  Sikorskiego
text: W laudacji szef dyplomacji Radosław Sikorski podkreślił sukcesy międzynarodowe
  w karierze artysty, m.in. występ podczas ceremonii otwarcia Letnich Igrzysk Olimpijskich
  w Paryżu w 2024 r. Jakub Józef Orliński dotarł do wielu milionów osób na świecie,
  wnosząc cenny wkład w wzmacnianie pozytywnego wizerunku Polski za granicą. Występując
  na najsłynniejszych scenach operowych świata, Pan Jakub Józef Orliński prezentuje
  się nie tylko jako wybitny kontratenor, lecz także prawdziwy ambasador polskiej
  kultury. Podczas zagranicznych recitali przybliża międzynarodowej publiczności polską
  muzykę i twórczość rodzimych kompozytorów. – podkreślił wicepremier, minister spraw
  zagranicznych Radosław Sikorski. Myślę, że pierwszym impulsem było zaszczepienie
  we mnie miłości do podróży. Kiedy wykreowałem w sobie ciekawość, dzielenie się sztuką
  i pięknem, szczególnie tym, które mamy w Polsce – to jest coś niezwykłego. Muszę
  przyznać, że jestem szalenie dumny, że jestem Polakiem (…) Jest to niesamowite -
  widzieć jak zagraniczna publiczność odbiera naszą Polskę. Kontratenor Jakub Józef
  Orliński zdobył szereg nagród i wyróżnień oraz występował na najbardziej renomowanych
  scenach Europy, Ameryki Północnej i Azji, w tym w nowojorskiej Metropolitan Opera
  i mediolańskiej La Scali. Polski artysta, dzięki niezwykłemu głosowi i charyzmie
  scenicznej, należy dziś do grona najbardziej cenionych głosów operowych na świecie.
  Znakiem rozpoznawczym artysty jest łączenie śpiewu operowego z pasją do breakdance’u,
  co nadaje jego działalności artystycznej wyjątkowy i nowoczesny charakter. *** Honorowe
  odznaczenie Bene Merito, ustanowione w 2009 r., przyznawane jest przez Ministra
  Spraw Zagranicznych w uznaniu zasług na rzecz działalności wzmacniającej pozycję
  Polski na arenie międzynarodowej.
