title: Polska i Grecja o priorytetach UE
text: Sekretarz Stanu w MSZ Ignacy Niemczycki spotkał się z wiceministrem spraw zagranicznych
  Grecji Tasosem Chatzivasileiou. Rozmowa wiceszefów dyplomacji dotyczyła priorytetów
  greckiej prezydencji w Radzie Unii Europejskiej oraz możliwości zacieśnienia współpracy
  obu państw na forum unijnym. Grecja obejmie przewodnictwo w Radzie UE w lipcu 2027
  roku Wiceszef greckiej dyplomacji Tasos Chatzivasileiou zaprezentował plan na grecką
  prezydencję w Radzie UE podkreślając znaczenie działań na rzecz bezpieczeństwa Europy.
  Wiceminister Ignacy Niemczycki pogratulował Grecji inicjatyw podejmowanych w tym
  obszarze. Ponadto wiceszef polskiego MSZ podzielił się doświadczeniami z prezydencji,
  którą Polska sprawowała w 2025 roku. Jednym z głównych tematów spotkania wiceministrów
  były negocjacje dotyczące budżetu UE na lata 2028-2034. Polskę i Grecję łączy przekonanie,
  że Unia powinna wzmacniać konkurencyjność swojej gospodarki, a jednocześnie prowadzić
  politykę spójności, która pomaga zmniejszać różnice w poziomie rozwoju regionów.
  Wiceszefowie dyplomacji rozmawiali o dalszym rozszerzeniu UE i zgodzili się, że
  tempo negocjacji z państwami kandydującymi powinno zależeć od postępów w spełnianiu
  kryteriów członkostwa. Poruszono także kwestię wsparcia dla Ukrainy w obliczu rosyjskiej
  agresji, w tym zapewnienia jej bezpieczeństwa energetycznego.
