title: Wicepremier Radosław Sikorski na konferencji w Sejmie poświęconej ochronie
  niematerialnego dziedzictwa kulturowego
text: Minister spraw zagranicznych Radosław Sikorski podkreślił, że niematerialne
  dziedzictwo kulturowe to nie tylko ważny element polskiej tożsamości, lecz także
  istotne narzędzie budowania więzi społecznych, dialogu między narodami oraz promocji
  Polski na świecie. Wskazał również na znaczenie działań prowadzonych w ramach UNESCO
  na rzecz rozwoju międzynarodowego systemu ochrony niematerialnego dziedzictwa kulturowego,
  w które Polska jest aktywnie zaangażowana. Dzięki staraniom Polski na Listę Reprezentatywną
  Niematerialnego Dziedzictwa Kulturowego Ludzkości wpisane zostały już m.in. polonez,
  szopkarstwo krakowskie, kultura bartnicza, flisactwo oraz tradycje plecionkarskie.
  W grudniu br. Międzyrządowy Komitet ds. Ochrony Niematerialnego Dziedzictwa Kulturowego
  UNESCO rozpatrzy kolejne nominacje dotyczące obchodów Wigilii Bożego Narodzenia
  oraz Barbórki i tradycji górniczych. W latach 2018-2022 Polska zasiadała w składzie
  tego Komitetu. Dzięki tym działaniom polskie tradycje i praktyki kulturowe są coraz
  lepiej rozpoznawalne na arenie międzynarodowej. Ochrona niematerialnego dziedzictwa
  kulturowego pozostaje nie tylko zadaniem polityki kulturalnej, lecz także istotnym
  elementem polityki zagranicznej Rzeczypospolitej Polskiej W swoim wystąpieniu wicepremier
  Sikorski przypomniał również, że z inicjatywy Polski UNESCO ustanowiło Międzynarodowy
  Dzień Niematerialnego Dziedzictwa Kulturowego, obchodzony corocznie 17 października.
  Zwrócił także uwagę na znaczenie żywego dziedzictwa dla Polonii i Polaków mieszkających
  za granicą, wskazując, że stanowi ono ważny element podtrzymywania więzi z krajem
  oraz budowania pozytywnego wizerunku Polski na świecie. Minister podkreślił również
  potrzebę dalszego wzmacniania krajowych instrumentów służących ochronie niematerialnego
  dziedzictwa kulturowego.
