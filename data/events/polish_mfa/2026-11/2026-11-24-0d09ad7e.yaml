title: 'Ponad podziałami i dezinformacją: kampania „Resilient Together” o polsko-ukraińskiej
  solidarności'
text: 'Od pierwszych dni pełnoskalowej rosyjskiej inwazji na Ukrainę Polki i Polacy
  angażują się w pomoc swoim ukraińskim sąsiadom. To, co zaczęło się od spontanicznej
  mobilizacji milionów ludzi, przerodziło się w wieloletnią współpracę, setki inicjatyw
  i tysiące osobistych historii. Dziś, gdy rosyjska propaganda i dezinformacja próbują
  podważać zaufanie między naszymi społeczeństwami, warto przypominać o tym, co naprawdę
  łączy Polaków i Ukraińców: konkretnych ludziach, ich działaniach i wzajemnej solidarności.
  Właśnie temu służy „Resilient Together” – kampania informacyjna Ministerstwa Spraw
  Zagranicznych ukazująca twarze i historie osób zaangażowanych w pomoc Ukrainie.
  Inicjatywa, realizowana we współpracy z polskimi placówkami dyplomatycznymi, mediami
  i partnerami społecznymi, wchodzi obecnie w swoją finałową odsłonę obejmując przestrzeń
  miejską w ukraińskich miastach. Dezinformacja próbuje sprowadzić relacje polsko-ukraińskie
  wyłącznie do konfliktów, uprzedzeń i wzajemnych pretensji. My pokazujemy rzeczywistość:
  ludzi, którzy od lat pomagają sobie nawzajem, często z narażeniem własnego bezpieczeństwa,
  i wspólnie budują odporność naszych społeczeństw. Te historie mówią o polsko-ukraińskiej
  solidarności więcej niż jakakolwiek deklaracja. Pokazują jak ważne są prawdziwe
  doświadczenia milionów ludzi po obu stronach granicy – mówi Marcin Bosacki, podsekretarz
  stanu w Ministerstwie Spraw Zagranicznych RP. Bohaterowie solidarności na ulicach
  ukraińskich miast W ośmiu ukraińskich miastach – Kijowie, Lwowie, Odessie, Łucku,
  Dnieprze, Zaporożu, Charkowie i Winnicy – na przystankach autobusowych oraz dworcach
  kolejowych pojawiły się plakaty prezentujące bohaterów polsko-ukraińskiej solidarności.
  Kampania obejmuje ponad 200 nośników reklamowych, a szacowany zasięg ekspozycji
  to blisko cztery miliony kontaktów dziennie. Outdoorowa odsłona potrwa do 20 grudnia
  2026 r. Wśród bohaterów kampanii znaleźli się m.in. polscy medycy bojowi, psychoterapeuci
  wspierający ukraińskie rodziny, wolontariusze i aktywiści organizujący pomoc. Kampania
  przypomina o inicjatywach, które stały się symbolami polskiego wsparcia: zbiórce
  „Ciepło z Polski dla Kijowa”, dzięki której zakupiono generatory prądu, oraz MEDEVAC
  HUB Jasionka – międzynarodowym hubie medycznym dla pacjentów ewakuowanych z Ukrainy,
  prowadzonym przez Polskie Centrum Pomocy Międzynarodowej we współpracy z europejskimi
  partnerami. Projekt outdoorowy jest realizowany przez Ambasadę RP w Kijowie. Elementem
  działań jest także inicjatywa Instytutu Polskiego w Kijowie, w ramach której w kijowskiem
  metrze odbiorcy mogli obejrzeć krótkie formy wideo przedstawiające Polaków zaangażowanych
  w pomoc. Kampania widoczna na świecie – dzięki mediom i polskim placówkom Resilient
  Together to nie tylko kampania outdoorowa w Ukrainie. Od maja 2026 r. MSZ i polskie
  placówki zagraniczne publikują w mediach społecznościowych polskie historie osób
  i organizacji niosących wsparcie. Część placówek przygotowuje również drukowane
  wersje historii – w różnych językach i z myślą o ekspozycji w przestrzeniach ambasad,
  konsulatów, ośrodków kultury, organizacjach społecznych i innych lokalizacjach.
  Historie polskich bohaterów pojawiły się także antenach Ośrodka Mediów dla Zagranicy
  TVP, Polskiego Radia dla Zagranicy oraz Polskiego Radia dla Ukrainy. Prawdziwe historie
  silniejsze niż dezinformacja Kampania „Resilient Together” pokazuje, że solidarność
  polsko-ukraińska nie jest abstrakcyjnym hasłem ani jednorazowym zrywem. W świecie,
  w którym dezinformacja wykorzystuje pojedyncze napięcia i incydenty, by budować
  obraz nieuchronnego konfliktu między społeczeństwami, warto pokazywać pełniejszy
  obraz rzeczywistości. Miliony gestów solidarności, tysiące wspólnych działań i historie
  ludzi po obu stronach granicy są odpowiedzią na próby skłócenia Polaków i Ukraińców,
  które regularnie wykorzystuje w swoich działaniach także rosyjska propaganda.'
