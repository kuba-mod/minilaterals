title: Wizyta wiceministra Artura Harazima w Watykanie
text: Ponadto przedmiotem rozmów w Watykanie były najważniejsze kwestie międzynarodowe,
  ze szczególnym uwzględnieniem sytuacji w regionie Europy Środkowo-Wschodniej. Wiceminister
  Harazim nawiązał do zaproszenia ​dla Ojca Świętego w sprawie pielgrzymki do Polski
  w 2028 r. oraz przedstawił działania polskiego rządu związane z organizacją tego
  wydarzenia. Wiceministrowi towarzyszył Ambasador Witold Sobków, Pełnomocnik Ministra
  Spraw Zagranicznych ds. organizacji wizyty Jego Świątobliwości Papieża Leona XIV
  w Polsce. W programie wizyty znalazły się m.in. upamiętnienie św. Jana Pawła II
  poprzez złożenie kwiatów na grobie w Bazylice św. Piotra, odwiedziny w polskiej
  sekcji Radia Watykańskiego i Vatican News, a także spotkanie z przedstawicielami
  polskiego duchowieństwa oraz rozmowa z abp. Salvatore Pennacchio, Przewodniczącym
  Papieskiej Akademii Kościelnej i byłym nuncjuszem apostolskim w Polsce.
