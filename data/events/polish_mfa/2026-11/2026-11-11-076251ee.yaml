title: Polska dołącza do Wspólnej Jednostki Kontrolnej ONZ
text: Wybór Polski do JIU kończy trwającą kilkadziesiąt lat obecność przedstawicieli
  Federacji Rosyjskiej w tym organie. Jednocześnie stanowi wyraz zaufania państw członkowskich
  do kompetencji polskiego eksperta oraz potwierdza zaangażowanie Polski na rzecz
  wzmacniania przejrzystości, rozliczalności i efektywności funkcjonowania Organizacji
  Narodów Zjednoczonych. Dzięki skoordynowanym wysiłkom służby zagranicznej oraz partnerów
  europejskich, Polska uzyskała szerokie poparcie społeczności międzynarodowej, doprowadzając
  do obecności Polski w tej prestiżowej instytucji. Wcześniej w latach 1991-2002 funkcję
  inspektora z regionu Europy Środkowo-Wschodniej pełnił Andrzej Abraszewski. Sukces
  polskiego kandydata na forum ONZ jest efektem szeroko zakrojonej kampanii i skuteczności
  działań prowadzonych przez polską dyplomację na arenie międzynarodowej. Poza Stałymi
  Przedstawicielstwami RP przy ONZ w Nowym Jorku i Genewie w inicjatywę z zaangażowaniem
  włączyły się również polskie ambasady i konsulaty na całym świecie. Istotne wsparcie
  zapewniły także delegatury i przedstawicielstwa Unii Europejskiej, które wspierały
  działania promujące polską kandydaturę. JIU jest organem kontrolno-doradczym obejmującym
  swoim mandatem cały system Narodów Zjednoczonych, jako jedyny niezależny zewnętrzny
  organ nadzoru w systemie ONZ. JIU odpowiada za prowadzenie inspekcji, ewaluacji
  i dochodzeń służących poprawie efektywności działania, zarządzania oraz koordynacji
  między organizacjami Narodów Zjednoczonych. Organ JIU składa się z 11 inspektorów.
  Członkowie JIU posiadają znaczną niezależność w określaniu obszarów prowadzonych
  analiz i kontroli, co stwarza realną możliwość wpływania na sposób funkcjonowania
  całego systemu ONZ.
