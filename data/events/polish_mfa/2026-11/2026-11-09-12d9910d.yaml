title: Polsko-honduraskie konsultacje polityczne
text: Wiceszefowie dyplomacji Wojciech Zajączkowski i Pamela Handal Rivera wyrazili
  wolę intensyfikowania dialogu politycznego pomiędzy Polską i Hondurasem. Istotną
  część konsultacji poświęcono współpracy na forach wielostronnych oraz analizie bieżącej
  sytuacji regionalnej – w Ameryce Środkowej i Europie, ze szczególnym uwzględnieniem
  relacji z sąsiadami. Wiceministrowie rozmawiali także o możliwości nawiązania współpracy
  między Akademiami Dyplomatycznymi obu państw. Wiceminister Wojciech Zajączkowski
  przedstawił także problematykę dezinformacji rosyjskiej. Wiceszef polskiego MSZ
  zaznaczył, że Rosja prowadzi rekrutację wśród żołnierzy z państw latynoamerykańskich,
  prowadzoną pod fałszywymi obietnicami legalnej pracy w Federacji Rosyjskiej przy
  użyciu pełnego wachlarza technik dezinformacyjnych. Stosunki dyplomatyczne między
  Polską a Hondurasem zostały nawiązane w 1934 r. Kształt stosunków gospodarczych
  określa Układ Stowarzyszeniowy między Unią Europejską i Ameryką Środkową z 2012
  r. Honduras jest ważnym partnerem Polski w regionie. Oba państwa utrzymują relacje
  polityczne i gospodarcze oparte na wzajemnym szacunku i korzyściach. Przywrócenie
  pracy Ambasady RP w Panamie w 2017 r. poszerzyło możliwości współpracy między obu
  państwami. Więcej na temat relacji dwustronnych.
