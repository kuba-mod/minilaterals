title: Komunikat ws. wezwania Ambasadora Federacji Rosyjskiej do MSZ
text: Polska kategorycznie potępia kolejne w ostatnich miesiącach naruszenie polskiej
  przestrzeni powietrznej, w tym przypadku przez rosyjskie trzy pociski manewrujące,
  które stworzyły realne zagrożenie dla bezpieczeństwa mieszkańców Polski. Strona
  Polska stanowczo żąda od władz Federacji Rosyjskiej natychmiastowego zaprzestania
  działań, które stwarzają zagrożenie dla życia i bezpieczeństwa Polek i Polaków oraz
  niosą realne ryzyko sprowadzenia katastrofy w ruchu lotniczym. Dalsze próby eskalacji
  napięcia na granicy unijnej i sojuszu transatlantyckiego są całkowicie niedopuszczalne.
  Władze Rzeczypospolitej Polskiej nieustanie podejmują wysiłki, działając w pełnej
  koordynacji z sojusznikami i partnerami, w celu zabezpieczenia naszej granicy, w
  tym polskiego nieba. Polska dziękuje sojusznikom za wyrażenie solidarności oraz
  podjęcie szybkich działań dotyczących dalszego wzmacniania wschodniej flanki NATO.
  Polska po raz kolejny wzywa także Rosję do natychmiastowego zaprzestawania bezprawnej
  agresji wobec Ukrainy, która niesie ze sobą ogromne ofiary także wśród ludności
  cywilnej.
