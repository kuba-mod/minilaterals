title: Wicepremier Sikorski wziął udział w wideokonferencji Koalicji Chętnych na rzecz
  Ukrainy
text: Członkowie Koalicji potwierdzili swoje niezachwiane wsparcie dla wysiłków obronnych
  Ukrainy, od 2014 roku broniącej się przez rosyjską agresją. Po raz kolejny wezwali
  Rosję do zakończenia działań wojennych i przestrzegania zasad prawa międzynarodowego.
  Zgodzili się, że kolejne sygnały o słabnięciu rosyjskiej gospodarki, stanowią potwierdzenie,
  że polityka presji międzynarodowej na Rosję przynosi efekty i powinna być kontynuowana.
  W ocenie uczestników, utrzymanie zdolności Ukrainy do obrony przed zagrożeniem rakietowym
  nad własnym terytorium, pozostaje szczególnie krytycznym wyzwaniem dla bezpieczeństwa
  kraju. Zapewnili o gotowości wsparcia również w zakresie zapewnienia ciągłości dostaw
  energii wobec nadchodzącego sezonu zimowego
