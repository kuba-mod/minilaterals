title: Pomoc dla poszkodowanych w wypadku autokaru na Węgrzech
text: 'Po niedzielnym wypadku ranni otrzymali pomoc w szpitalach w miejscowościach:
  Miszkolc, Eger, Nyíregyháza i Debreczyn. Polscy medycy, przy wsparciu przedstawicieli
  Ministerstwa Spraw Zagranicznych i Ministerstwa Zdrowia, ocenili stan zdrowia wszystkich
  poszkodowanych obywateli. Na poniedziałkowy lot samolotem rządowym zostało zakwalifikowanych
  21 osób. - Większość osób przebywających w szpitalu w Nyíregyháza będziemy mogli
  zabrać dzisiaj wieczorem samolotem do Polski, do Rzeszowa. Są dwie osoby, które
  będą musiały pozostać na miejscu, pod obserwacją. Tym osobom transport do Polski
  zostanie zapewniony w późniejszym terminie, w zależności od rekomendacji lekarzy
  – powiedział na konferencji prasowej wiceminister Wojciech Zajączkowski i dodał,
  że samolot wystartuje z lotniska w Budapeszcie lub Debreczynie. Lot planowany jest
  na poniedziałek 17.08. W Polskich szpitalach zostały przygotowane miejsca dla poszkodowanych
  w wypadku. Sytuację koordynuje wojewoda podkarpacka Teresa Kubas-Hul. Przedstawiciele
  Ministerstwa Spraw Zagranicznych i Ministerstwa Zdrowia razem z zespołem medycznym
  polecieli na Węgry w niedzielę wieczorem. Poszkodowani mogą liczyć zarówno na pomoc
  konsularną, jak i medyczną. Rodziny poszkodowanych nadal mogą korzystać z infolinii
  uruchomionej przez Ambasadę RP w Budapeszcie ( +36 20 472 95 02 ). Do wypadku doszło
  w niedzielę około godz. 1 na autostradzie M3 w Mezőkeresztes na północnym wschodzie
  Węgier. Autokarem podróżowało 59 osób. 12 pasażerów zginęło. Kilkadziesiąt osób
  zostało rannych.'
