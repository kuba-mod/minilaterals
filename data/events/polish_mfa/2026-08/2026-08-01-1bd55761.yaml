title: Spotkanie wiceministra Marcina Bosackiego z zastępczynią szefa Biura Prezydenta
  Ukrainy Iryną Wereszczuk
text: Podczas spotkania omówiono pełen zakres spraw bilateralnych, w tym kwestie historyczne,
  otwarcie archiwów oraz postęp prac poszukiwawczych i ekshumacyjnych. Zgodzono się,
  że trwające polskie wsparcie dla Ukrainy w wojnie z Rosją pozostaje w interesie
  obu naszych państw. Dzisiejsza dyskusja była kolejnym elementem dialogu dwustronnego,
  jako konsekwencja spotkania premiera Donalda Tuska i prezydenta Wołodymyra Zełenskiego
  oraz rozmów telefonicznych szefów dyplomacji Polski i Ukrainy Radosława Sikorskiego
  i Andrija Sybihy. Rozmówcy podnieśli też temat potencjału intensyfikacji współpracy
  przemysłowej i obronnej. Poruszono także kwestie gospodarcze, w tym możliwości inwestycyjnych
  dla polskich przedsiębiorców. Obie strony zwróciły uwagę na społeczny wymiar relacji
  polsko‑ukraińskich, podkreślając znaczenie odpowiedzialnej komunikacji i utrzymania
  wyważonego tonu w debacie publicznej.
