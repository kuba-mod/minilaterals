title: Wizyta Atlantic Council Eurasia Congressional Fellowship w Warszawie
text: Spotkanie delegacji z USA z przedstawicielami Departamentów Strategii, Ameryki
  Północnej oraz Polityki Bezpieczeństwa - stanowiło okazję do przedstawienia gościom
  najważniejszych priorytetów polskiej polityki zagranicznej oraz zaproszenia ich
  do zapoznania się ze Strategią Polskiej Polityki Zagranicznej na lata 2026–2030.
