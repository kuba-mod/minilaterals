title: Kondolencje MSZ w związku ze śmiercią Jego Królewskiej Mości Króla Haralda
  V
text: Z największym smutkiem przyjęliśmy wiadomość o śmierci Jego Królewskiej Mości
  Króla Haralda V - monarchy oddanego krajowi i obywatelom Norwegii, powszechnie szanowanego
  władcy. Jego dwie wizyty w Polsce, w latach 1996 i 2012, podczas których towarzyszyła
  Mu Jej Królewska Mość Królowa Sonja, pozostaną w naszej pamięci jako przejaw przyjaźni
  i szacunku, co jest podstawą silnych więzi polsko-norweskich. Podczas swojego panowania
  Król uosabiał wartości, które są bliskie Polakom – lojalność wobec obowiązku, wiary
  i ojczyzny. Nasze myśli i modlitwy są z Rodziną Królewską.
