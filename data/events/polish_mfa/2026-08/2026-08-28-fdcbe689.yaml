title: Od Bejrutu po Damaszek - rozmowy o bezpieczeństwie, stabilności i przyszłości
  regionu
text: 'W Bejrucie rozmowy koncentrowały się na złożonej sytuacji politycznej i bezpieczeństwa
  w Libanie, w szczególności na działalności paramilitarnej Hezbollahu i perspektywie
  jego rozbrojenia. Rozmówcy omówili przyszłość międzynarodowego zaangażowania w Libanie
  - w związku z wygaszaniem mandatu misji pokojowej ONZ (UNIFIL), w której skład wchodzi
  Polski Kontyngent Wojskowy. Ważnym tematem była również sytuacja na południu Libanu
  oraz związane z nią wyzwania dla bezpieczeństwa i stabilności regionu. Polska pomoc
  – konkretne wsparcie dla mieszkańców Libanu Polska od lat aktywnie angażuje się
  w działania na rzecz bezpieczeństwa i rozwoju Libanu. Skala tego zaangażowania wzrosła
  z 24,1 mln PLN w latach 2019–2020 do 32,5 mln PLN w latach 2024–2025. W czasie wizyty
  wiceminister SZ odwiedził wybrane miejsca realizacji projektów Polskiej pomocy.
  Projekty obejmują m.in. ochronę ludności i ratownictwo, ochronę zdrowia, pomoc humanitarną
  oraz aktywizację zawodową. 26 sierpnia odbyło się uroczyste otwarcie wystawy „Neighbours
  Under the Same Sky – Polish Aid in Lebanon in 2025”, zorganizowanej przez Ambasadę
  RP w Bejrucie. Ekspozycja prezentuje efekty polskiego zaangażowania i współpracy
  z lokalnymi partnerami. Damaszek: pierwsze od ponad 15 lat konsultacje polityczne
  Drugim etapem wizyty był wyjazd do Damaszku, gdzie minister W. Zajączkowski przeprowadził
  pierwsze od ponad 15 lat konsultacje polityczne z Syrią. W rozmowach podkreślił,
  że Polsce zależy na stabilizacji Syrii, co stworzy warunki do szybkiej odbudowy
  kraju i jego zrównoważonego rozwoju. Potwierdził, że Polska jest gotowa do ponownego
  rozwijania wielopłaszczyznowej współpracy z Syrią, m.in. w dziedzinie archeologii,
  a także do wspierania tego kraju w procesie transformacji poprzez realizację projektów
  Polskiej pomocy.'
