title: Oświadczenie Mechanizmu Szybkiego Reagowania G7 w sprawie zagranicznych operacji
  informacyjnych, jakie miały miejsce po naruszeniu polskiej przestrzeni powietrznej
text: Mechanizm Szybkiego Reagowania G7 stanowczo potępia operacje informacyjne, które
  według doniesień prowadzono w celu manipulowania odbiorem społecznym dotyczącym
  wykrycia początkowo niemożliwego do zidentyfikowania obiektu powietrznego w polskiej
  przestrzeni powietrznej po rosyjskiej aktywności wojskowej nad zachodnią Ukrainą
  30 lipca we wczesnych godzinach porannych. Jak ustalono w dochodzeniach prowadzonych
  przez rząd polski, te operacje informacyjne były wzmacniane przez sieć kont internetowych
  o nazwie "sieć Pravda" (lub "Portal Kombat"), która jest znana z szerzenia zmanipulowanych
  treści sprzyjających celom politycznym Rosji. Tempo rozpowszechniania informacji
  świadczy o wysokim poziomie przygotowania do wykorzystania tego zdarzenia zagrażającego
  bezpieczeństwu. Choć skuteczność tych operacji informacyjnych była ograniczona,
  obejmowały one sfabrykowane «wycieki» wewnętrznych informacji mające podważać zaufanie
  przez podszywanie się pod zaufane lokalne źródła. Według doniesień główne wątki
  tych operacji informacyjnych dotyczą spekulacji na temat roli Polski w prowadzonej
  przez Rosję wojnie napastniczej przeciwko Ukrainie, prób rozmywania odpowiedzialności
  Rosji za zdarzenie, podważania zaufania do polskich instytucji i NATO, a także wywoływania
  poczucia niepewności, aby zmniejszyć poparcie opinii publicznej dla Ukrainy. Oficjalne
  dochodzenia prowadzone przez miejscowe władze potwierdziły później, że obiektem
  tym był pocisk manewrujący wyprodukowany pod Moskwą. Wrogie podmioty dążą do wykorzystywania
  okresów niepewności, rozpowszechniając niepotwierdzone wyjaśnienia i przedstawiając
  domysły jako ustalone fakty. Mechanizm Szybkiego Reagowania G7 będzie nadal monitorował
  środowisko informacyjne i eksponował zagraniczne zagrożenia dla demokracji, aby
  uniemożliwiać wykorzystywanie niepewności spowodowanej transgranicznymi zdarzeniami
  zagrażającymi bezpieczeństwu.
