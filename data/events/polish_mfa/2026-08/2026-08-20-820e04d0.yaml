title: Oświadczenie MSZ
text: W związku z tą decyzją do Ministerstwa został wezwany Ambasador Izraela w Warszawie.
  Strona polska przekazała krytyczną ocenę dotychczasowego działań mających wyjaśnić
  przyczyny i przebieg tragedii, poinformowała, że śledztwo w tej sprawie prowadzone
  jest równolegle przez Prokuraturę Okręgową w Przemyślu oraz wyraziła oczekiwanie,
  że strona izraelska przekaże właściwym organom polskim wszystkie niezbędne wyjaśnienia
  i materiały, o które wnioskowali polscy śledczy. Ministerstwo Spraw Zagranicznych
  stoi na stanowisku, że okoliczności, w których doszło do tragedii w 2024 r., powinny
  być wyjaśnione do końca i nie akceptuje unikania przez sprawców prawnej i moralnej
  odpowiedzialności. Rodzinom należy się adekwatne zadośćuczynienie.
