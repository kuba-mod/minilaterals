title: Oświadczenie MSZ
text: Podzielamy stanowisko ONZ, iż wtargnięcie izraelskich sił bezpieczeństwa na
  teren Centrum Szkoleniowego Kalandia (UNRWA) we Wschodniej Jerozolimie 25 bm. stanowi
  złamanie zasady nietykalności obiektów ONZ, co wynika z Karty Narodów Zjednoczonych,
  Konwencji dotyczącej przywilejów i immunitetów Narodów Zjednoczonych oraz opinii
  doradczej Międzynarodowego Trybunału Sprawiedliwości. Przyłączamy się do apelu Sekretarza
  Generalnego do władz Izraela w sprawie natychmiastowego zaprzestania ingerencji
  wobec obiektów UNRWA, opuszczenia ich terenów oraz zwrotu zajętych nieruchomości
  Organizacji Narodów Zjednoczonych na Palestyńskich Terytoriach Okupowanych.
