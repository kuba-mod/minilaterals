title: Odpowiedź na interpelację nr 18049 w sprawie pożaru przy ul. Marywilskiej 44
text: Jednym z kluczowych zadań Ministra Spraw Zagranicznych pozostaje informowanie
  naszych międzynarodowych sojuszników o wszelkich przejawach wrogich działań hybrydowych,
  które godzą w bezpieczeństwo Rzeczypospolitej Polskiej. W związku z tym resort stanowczo
  podkreśla, że fakty dotyczące bezpieczeństwa państwa nie powinny być przedmiotem
  bieżącej polemiki politycznej. W obliczu zagrożeń wynikających z działań Federacji
  Rosyjskiej MSZ apeluje do wszystkich parlamentarzystów o solidarność z polskimi
  służbami oraz o sprzeciw wobec jakichkolwiek prób relatywizowania wrogich działań
  ze strony Federacji Rosyjskiej.
