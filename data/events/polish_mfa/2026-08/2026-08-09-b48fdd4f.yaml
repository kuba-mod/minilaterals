title: Oświadczenie Ministerstwa Spraw Zagranicznych w związku z rocznicą wyborów
  prezydenckich na Białorusi
text: Ministerstwo Spraw Zagranicznych Rzeczypospolitej Polskiej wyraża swoją solidarność
  i wsparcie dla białoruskiego społeczeństwa obywatelskiego. Otwarty dialog z własnymi
  obywatelami, pełne poszanowanie ich praw, uwolnienie i rehabilitacja wszystkich
  więźniów sumienia są normą demokratycznego państwa. Rzeczypospolita Polska opowiada
  się za dobrosąsiedzkimi stosunkami z suwerenną i demokratyczną Republiką Białorusi
  i wolnym Narodem Białoruskim.
