title: Polska wzmacnia obecność dyplomatyczną nad Bosforem
text: Instytut Polski w Stambule wzmocni realizację działań z obszaru dyplomacji publicznej
  i kulturalnej na terenie Turcji, która jest jednym z najważniejszych partnerów Polski
  spośród państw pozaunijnych. Relacje polsko-tureckie mają niezwykle bogatą historię,
  sięgającą XV wieku. Obecnie konsekwentnie rozwijamy współpracę dwustronną w obszarach
  gospodarki i bezpieczeństwa, a Turcja pozostaje jednym z naszych kluczowych partnerów
  na południowo-wschodniej flance NATO. Polska niezmiennie wspiera również europejską
  perspektywę Turcji. Stambuł jest uważany nie tylko za główne centrum gospodarcze
  i kulturalne Turcji, ale również za miejsce intensywnej wymiany idei, kontaktów
  akademickich i działalności artystycznej. Obecność Instytutu Polskiego w takim ośrodku
  pozwoli znacząco zwiększyć widoczność Polski w regionie oraz dotrzeć do szerokiego
  i zróżnicowanego grona odbiorców – od studentów i naukowców po przedstawicieli świata
  kultury i biznesu. Otwarcie Instytutu Polskiego w Stambule to inwestycja w dialog
  i wzajemne poznanie. To nowa przestrzeń promocji polskiej kultury, sztuki, nauki
  i współpracy między Polską a Turcją. Inauguracja działalności Instytutu Polskiego
  stanowi ważny krok w dalszym umacnianiu relacji polsko-tureckich oraz tworzenia
  nowych możliwości dialogu między społeczeństwami obu krajów. Instytuty Polskie,
  nadzorowane przez Ministerstwo Spraw Zagranicznych, informują o Polsce oraz promują
  m.in. dziedzictwo narodowe, kulturę, historię, naukę i język polski. Dbają o wymianę
  kulturalną oraz o obecność polskiej kultury w życiu społecznym państw, w których
  działają. Docierają one do szerokich, zagranicznych środowisk artystycznych, eksperckich,
  naukowych i opiniotwórczych. Dbają również o realizację międzynarodowych zobowiązań,
  wynikających z umów i programów kulturalnych zawartych przez Polskę z innymi państwami.
  Zadaniem Instytutów Polskich jest także działanie na rzecz nawiązywania trwałych
  kontaktów z zagranicznymi partnerami, aktywnymi w sferze międzynarodowej wymiany
  kulturalnej np. w ramach współpracy ze Stowarzyszeniem Narodowych Instytutów Kultury
  Unii Europejskiej (EUNIC). Pierwszy Instytut Polski powstał w 1937 roku w Bukareszcie
  (Rumunia). W ostatnich latach, poza Stambułem, Polska otworzyła tego typu placówkę
  w 2023 roku w stolicy Serbii – Belgradzie oraz 2018 roku w stolicy Gruzji – Tbilisi.
