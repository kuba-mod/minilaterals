title: Ostatnie dni naboru na aplikację dyplomatyczno-konsularną
text: 'Aplikacja dyplomatyczno-konsularna przygotowuje do pracy w Ministerstwie Spraw
  Zagranicznych oraz na placówkach zagranicznych. O przyjęcie mogą ubiegać się obywatele
  polscy znający biegle angielski i drugi język obcy oraz posiadający tytuł magistra
  lub równorzędny, niezależnie od ukończonego kierunku studiów, a także posiadanego
  doświadczenia zawodowego. Szczegółowe informacje dotyczące warunków udziału, wymaganych
  dokumentów oraz przebiegu postępowania znajdują się w zakładce poświęconej ADK 2027:
  https://www.gov.pl/web/dyplomacja/nabor-na-aplikacje-dyplomatyczno-konsularna-2027-adk-2027
  Odpowiedzi na najczęściej zadawane pytania znajdują się: https://www.gov.pl/web/dyplomacja/najczesciej-zadawane-pytania-faq
  Jeśli rozważasz karierę w polskiej służbie zagranicznej, to ostatni moment na złożenie
  zgłoszenia.'
