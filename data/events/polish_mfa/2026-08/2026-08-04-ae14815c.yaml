title: Rada Ministrów przyjęła Krajowy Plan Działania na rzecz wdrażania Wytycznych
  ONZ dotyczących biznesu i praw człowieka na lata 2026-2029
text: Przyjęcie trzeciej edycji Krajowego Planu Działania stanowi kontynuację działań
  Rzeczypospolitej Polskiej na rzecz wdrażania Wytycznych ONZ dotyczących biznesu
  i praw człowieka (UN Guiding Principles on Business and Human Rights), przyjętych
  przez Radę Praw Człowieka ONZ w 2011 r. Dokument uwzględnia również rekomendacje
  Organizacji w realizację rekomendacji Organizacji Narodów Zjednoczonych, Unii Europejskiej
  oraz Rady Europy dotyczące opracowywania i wdrażania krajowych planów działania
  w tym obszarze. Krajowy Plan Działania określa działania administracji publicznej
  służące wzmacnianiu ochrony praw człowieka w kontekście działalności gospodarczej
  oraz wspieraniu odpowiedzialnego prowadzenia działalności przez przedsiębiorstwa.
  Obejmuje zarówno działania o charakterze ciągłym jak i nowe inicjatywy zaplanowane
  do realizacji przez właściwe ministerstwa i instytucje publiczne w latach 2026-2029.
  Prace nad dokumentem były koordynowane przez Ministerstwo Spraw Zagranicznych we
  współpracy z właściwymi ministerstwami i instytucjami publicznymi. Projekt został
  również poddany konsultacjom z partnerami społecznymi. Nowy Krajowy Plan Działania
  uwzględnia doświadczenia z realizacji poprzednich edycji oraz aktualne wyzwania
  związane z poszanowaniem praw człowieka w działalności gospodarczej. Obejmuje m.in.
  rozwój międzynarodowych i europejskich standardów w zakresie odpowiedzialnego prowadzenia
  działalności gospodarczej i należytej staranności. Ministerstwo Spraw Zagranicznych,
  jako koordynator Krajowego Planu Działania, będzie monitorowało jego realizację
  we współpracy z właściwymi resortami i instytucjami. Będzie również prowadziło dialog
  z przedstawicielami biznesu, organizacji społecznych i środowiska akademickiego.
