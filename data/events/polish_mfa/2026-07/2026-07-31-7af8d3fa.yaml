title: Komunikat ws. wezwania Ambasadora Federacji Rosyjskiej do MSZ
text: Polska kategorycznie potępia kolejne nieprzyjazne działanie wymierzone w bezpieczeństwo
  suwerennego państwa i jego obywateli. Strona polska stanowczo żąda od władz Federacji
  Rosyjskiej natychmiastowego zaprzestania działań, które stwarzają zagrożenie dla
  życia i bezpieczeństwa Polek i Polaków oraz niosą realne ryzyko sprowadzenia katastrofy
  w ruchu lotniczym. Wszelkie próby eskalacji napięcia na granicy unijnej i sojuszu
  transatlantyckiego są całkowicie niedopuszczalne. Władze Rzeczypospolitej Polskiej,
  działając w pełnej koordynacji z sojusznikami i partnerami, podejmują wszelkie niezbędne
  kroki w celu zabezpieczenia naszej granicy, w tym polskiego nieba. Polska po raz
  kolejny wzywa także Rosję do natychmiastowego zaprzestania bezprawnej agresji wobec
  Ukrainy, która niesie ze sobą ogromne ofiary także wśród ludności cywilnej.
