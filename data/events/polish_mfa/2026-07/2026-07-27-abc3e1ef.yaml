title: Polska jednoznacznie odrzuca spekulacje prezydenta Władimira Putina dotyczące
  integralności terytorialnej Ukrainy
text: Rzeczpospolita Polska nie wysuwała, nie wysuwa i nie zamierza w przyszłości
  wysuwać roszczeń terytorialnych wobec Ukrainy. Polska w pełni uznaje, szanuje oraz
  niezmiennie wspiera integralność terytorialną i suwerenność Ukrainy w jej prawnie
  ustanowionych, międzynarodowo uznanych granicach, w tym w dwustronnym Traktacie
  między Ukrainą i Federacją Rosyjską o granicy państwowej z 2003 roku. Sugestie Moskwy
  o rzekomych planach aneksji zachodnich ziem Ukrainy między innymi przez Polskę stanowią
  prymitywną próbę dezinformacji i są stałym elementem wojny informacyjnej. Cel tych
  działań jest jasny i polega na próbie skłócenia narodów europejskich oraz odwrócenia
  uwagi międzynarodowej od brutalnej, nielegalnej agresji wojskowej prowadzonej przez
  Federację Rosyjską. Wzywamy władze Federacji Rosyjskiej do zaprzestania wysuwania
  roszczeń terytorialnych wobec swoich sąsiadów.
