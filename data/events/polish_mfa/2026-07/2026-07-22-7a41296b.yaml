title: Polska i Wielka Brytania zacieśniają współpracę w walce z dezinformacją
text: Przedstawiciele Ministerstwa Spraw Zagranicznych, Ministerstwa Cyfryzacji, NASK
  oraz brytyjskiego biura FCDO (Foreign, Commonwealth and Development Office) podpisali
  dokument określający kierunki współpracy w obszarze zwalczania FIMI (Foreign Information
  Manipulation and Interference – zagranicznej manipulacji i ingerencji w środowisku
  informacyjnym). Mapa drogowa wyznacza kluczowe obszary oraz metody pogłębionej współpracy
  analitycznej w zakresie wykrywania, analizowania i raportowania przypadków dezinformacji.
  Dokument przewiduje także wymianę danych i informacji, doskonalenie procedur, a
  także wzajemne wizyty ekspertów obu stron. Jest to pierwszy dokument, jaki został
  podpisany w następstwie zawarcia polsko-brytyjskiego traktatu o współpracy w dziedzinie
  bezpieczeństwa i obronności. Polska i Zjednoczone Królestwo od lat współpracują
  w zakresie przeciwdziałania zagranicznej dezinformacji w ramach różnych formatów
  międzynarodowych, przede wszystkim NATO oraz Mechanizmu Szybkiego Reagowania Państw
  G7.  Bezpośrednia współpraca zespołów analitycznych obu krajów otwiera nowe możliwości
  wymiany wiedzy, najlepszych praktyk i doświadczeń z jednym z najważniejszych sojuszników
  Polski.
