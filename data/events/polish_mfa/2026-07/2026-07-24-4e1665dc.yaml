title: Polska dołącza do Traktatu o Przyjaźni i Współpracy w Azji Południowo-Wschodniej
text: Polska dołączyła do TAC razem z Litwą, Rumunią i Szwecją. Tym samym grono stron
  traktatu wzrosło do 62 członków. Przedstawiciele nowych państw członkowskich TAC
  złożyli podpisy pod instrumentem akcesyjnym podczas 59. Spotkania Ministrów Spraw
  Zagranicznych ASEAN w Manili. W ceremonii uczestniczyli minister spraw zagranicznych
  Filipin Theresy Lazaro oraz sekretarz generalny ASEAN Kao Kim Hourn. Tego samego
  dnia zorganizowano konferencję wysokiego szczebla państw-stron TAC z okazji 50.
  rocznicy podpisania traktatu. Akcesja Polski wzmacnia naszą obecność w regionie
  Indo-Pacyfiku, wpisuje się w realizację unijnej strategii wobec tego obszaru oraz
  tworzy nowe możliwości rozwoju współpracy z państwami ASEAN, zwłaszcza w wymiarze
  gospodarczym i sektorowym.  To element dywersyfikacji polskiej polityki zagranicznej
  oraz rozwijania relacji z państwami o rosnącym znaczeniu dla światowej gospodarki
  i bezpieczeństwa.
