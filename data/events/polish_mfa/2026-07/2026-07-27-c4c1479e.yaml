title: Modernistyczne Centrum Gdyni wpisane na Listę Światowego Dziedzictwa UNESCO
text: 'Komitet Światowego Dziedzictwa uznał Śródmieście Gdyni za wybitny przykład
  zespołu urbanistycznego, odzwierciedlającego kompleksowe wykorzystanie zasad architektury
  modernistycznej w procesie planowania i budowy miasta. Decyzję o wpisie poparło
  aż 18 członków Komitetu: Armenia, Azerbejdżan, Bangladesz, Grenada, Jamajka, Kazachstan,
  Kenia, Korea, Kuwejt, Liban, Mongolia, Peru, Senegal, Ukraina, Tanzania, Togo, Turcja,
  Wietnam. Wpis jest zwieńczeniem wieloletnich starań miasta, służb konserwatorskich
  i administracji państwowej oraz efekt intensywnych i skoordynowanych działań dyplomatycznych.
  Modernistyczne Centrum Gdyni zostało wpisane na Listę Światowego Dziedzictwa jako
  dobro o wyjątkowej uniwersalnej wartości dla całej ludzkości. Przekształcenie niewielkiej
  nadbałtyckiej wsi w nowoczesne miasto portowe w latach 1926–1939 uznano za imponujący
  przykład transformacji urbanistycznej. Zaprojektowana z myślą o dynamicznym rozwoju
  strategicznego portu morskiego, Gdynia stała się symbolem nowoczesności, postępu
  oraz ambicji odrodzonego państwa polskiego. Jej układ urbanistyczny i zabudowa z
  okresu międzywojennego są świadectwem konsekwentnego zastosowania zasad modernizmu
  oraz współpracy władz publicznych, prywatnych inwestorów i architektów. Historia
  powstania i rozwoju Gdyni pokazuje, w jaki sposób idee międzynarodowego ruchu modernistycznego
  zostały twórczo zaadaptowane do lokalnych uwarunkowań miasta portowego. Zachowany
  do dziś układ urbanistyczny oraz liczne modernistyczne budynki stanowią wyjątkowe
  świadectwo przemian geopolitycznych i społecznych, jakie zaszły w Europie Środkowo-Wschodniej
  po I wojnie światowej. Dyskusja poprzedzająca przyjęcie decyzji zwróciła również
  uwagę na szczególne zaangażowanie mieszkańców w ochronę lokalnego dziedzictwa. Podkreślono,
  że liczne oddolne inicjatywy oraz aktywny udział społeczności lokalnej w procesie
  przygotowania nominacji świadczą o silnym poczuciu tożsamości związanym z modernistycznym
  charakterem miasta. W latach 2025–2029 Polska po raz trzeci w historii zasiada w
  Komitecie Światowego Dziedzictwa UNESCO. Członkostwo to potwierdza wysoką pozycję
  naszego kraju w międzynarodowym systemie ochrony dziedzictwa kulturowego i jest
  wyrazem uznania dla wieloletniego dorobku polskich ekspertów w tej dziedzinie. Wpis
  Modernistycznego Centrum Gdyni na Listę Światowego Dziedzictwa UNESCO jest efektem
  wieloletnich starań władz miasta, służb konserwatorskich, krajowych instytucji oraz
  administracji państwowej, wspieranych przez działania polskiej dyplomacji. Dzięki
  tej decyzji Gdynia dołączyła do grona najcenniejszych miejsc świata o wyjątkowej
  wartości kulturowej, uznanych za wspólne dziedzictwo całej ludzkości.'
