title: Spotkanie wiceministra Wojciecha Zajączkowskiego z przedsiębiorcami działającymi
  w Afryce i na Bliskim Wschodzie
text: 'W spotkaniu, które miało miejsce 22 lipca w Warszawie, udział wzięli przedstawiciele
  polskich firm prowadzący biznes w regionie, jak również zainteresowani rynkami pozaeuropejskimi
  oraz przedstawiciele instytucji otoczenia biznesu, w tym Team Poland . Uczestnicy
  spotkania zastanawiali się, w jaki sposób można synergicznie łączyć działania dyplomatyczne,
  ekonomiczne i te związane z pomocą rozwojową w krajach Afryki i Bliskiego Wschodu.
  Wyjątkowo interesującym wątkiem dyskusji były uwarunkowania i specyfika współpracy
  z partnerami w krajach Afryki i Bliskiego Wschodu. Minister Zajączkowski omówił
  najistotniejsze trendy kształtujące środowisko międzynarodowe oraz wyzwania stojące
  przed Afryką w związku szybkim przyrostem ludności, za którym nie nadąża tempo wzrostu
  gospodarczego. Wskazał na atuty wizerunkowe Polski – brak przeszłości kolonialnej
  i sukces gospodarczy oraz na działania dyplomatyczne polegające na ostatnich wizytach
  kierownictwa MSZ  w Afryce i intensyfikacji dialogu prowadzonego z partnerami z
  państw Globalnego Południa. Podkreślił potrzebę budowania partnerstw rozwojowych,
  którym powinna towarzyszyć współpraca gospodarcza. Urzędnicy MSZ przedstawili podstawowe
  założenia i kierunki bieżącego zaangażowania projektowego programu Polskiej pomocy
  oraz narzędzia oferowane przez MSZ w ramach dyplomacji ekonomicznej i rozwojowej.
  Tu szczególnie cenne było wystąpienie Roberta Zduńczyka, prezesa Fundacji Ekonomicznej
  Polska-Afryka-Wschodnia. Przedstawił on realizowany w Tanzanii projekt wspierający
  spółdzielnię mleczarską Kondiki Dairy w Tanzanii, który - dzięki finansowaniu MSZ
  - rozwija się i odnosi sukces rynkowy. Spotkanie umożliwiło wymianę doświadczeń
  i opinii na temat polskiej obecności gospodarczej oraz pomocy rozwojowej w regionie
  Afryki i Bliskiego Wschodu. Uczestnicy byli zgodni, że pomoc rozwojowa może być
  instrumentem wspierającym polski biznes w ekspansji na rynki afrykańskie i bliskowschodnie.
  Dla wsparcia sukcesu przedsiębiorstw kluczowa jest koordynacja działań instytucji,
  a także dostęp do środków promujących zrównoważone inwestycje, takich jak Global
  Gateway . Polska pomoc to marka działań rozwojowych i humanitarnych Polski podejmowanych
  w krajach rozwijających się, finansowanych z budżetu państwa. Obecnie obowiązującym
  dokumentem strategicznym określającym cele i priorytety Polskiej pomocy jest Wieloletni
  program współpracy rozwojowej na lata 2021-2030. Solidarność dla rozwoju . Dokumentami
  operacyjnymi są roczne plany współpracy rozwojowej, wskazujące szczegółowe formy
  współpracy i działania w zakresie pomocy rozwojowej, pomocy humanitarnej oraz edukacji
  globalnej, a także  wysokość środków finansowych przeznaczonych na te działania
  w danym roku budżetowym. Polska współpraca rozwojowa w 2026 roku obejmuje przede
  wszystkim działania na rzecz: Ukrainy, Mołdawii, Palestyny, Libanu, Kenii oraz Tanzanii.'
