title: Wizyta wiceministra Artura Harazima w Królestwie Tajlandii
text: W przyszłym roku Polska i Tajlandia będą obchodziły 55-lecie nawiązania relacji
  dyplomatycznych. Trwają przygotowania do pierwszego spotkania w ramach Dialogu Strategicznego
  w Tajlandii. Podczas wizyty wiceminister Harazim spotkał się z przewodniczącym Senatu
  Mongkolem Surasatchą, wiceprzewodniczącym Izby Reprezentantów Lertsakiem Pattanachaikulem,
  sekretarzem generalnym Narodowej Rady Bezpieczeństwa Chadchaiem Bangchaudem, sekretarzem
  generalnym Komisji ds. Zwalczania Korupcji Publicznej w Tajlandii Bhumivisanem Kasemsookiem,
  a także przedstawicielami Tajlandzko-Polskiej Parlamentarnej Grupy Przyjaźni. Podsekretarz
  stanu Artur Harazim odwiedził również szkołę im. Janusza Korczaka w Bangkoku dla
  dzieci migrantów z Mjanmy, Kambodży i Laosu, wspieranej w ramach projektów Polskiej
  pomocy. Podczas konsultacji wiceministrowi Harazimowi towarzyszyły dyrektor Departamentu
  Współpracy Międzynarodowej Ministerstwa Rolnictwa i Rozwoju Wsi Blanka Gołębiowska
  oraz dyrektor Biura ds. Unii Europejskiej i Współpracy z Zagranicą Głównej Inspektoratu
  Weterynarii Jolanta Orlińska-Krupa. W ramach wizyty polska delegacja spotkała się
  z przedstawicielami Ministerstwa Rolnictwa oraz Departamentu Rozwoju Hodowli Zwierząt
  Gospodarskich Tajlandii. Polska pomoc to nazwa programu polskiej współpracy rozwojowej
  realizowanego na mocy Ustawy z dnia 16 września 2011 r. o współpracy rozwojowej,
  który obejmuje działania podejmowane przez organy administracji rządowej w celu
  udzielania pomocy państwom rozwijającym się lub ich społeczeństwom.
