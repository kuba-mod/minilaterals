title: Oświadczenie MSZ RP w związku z ofiarami cywilnymi w Iranie
text: W związku z rosnącą liczbą ofiar cywilnych w Iranie wzywamy do znalezienia rozwiązania
  dyplomatycznego. Apelujemy do wszystkich stron o powrót do negocjacji międzynarodowych,
  które doprowadzą do trwałego pokoju w regionie, w ramach procesu zapoczątkowanego
  przez Pakistan, Oman, Katar oraz innych partnerów.
