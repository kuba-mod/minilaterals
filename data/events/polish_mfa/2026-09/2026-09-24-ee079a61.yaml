title: Wicepremier Radosław Sikorski na tygodniu wysokiego szczebla 81. sesji Zgromadzenia
  Ogólnego ONZ
text: '„Przywracanie zaufania, zarządzanie transformacją: ONZ, która skutecznie działa”
  – to hasło przewodnie 81. Sesji Zgromadzenia Ogólnego ONZ. Temat zmian, przede wszystkim
  w kontekście rozwoju sztucznej inteligencji oraz bezpieczeństwa był poruszany nie
  tylko podczas debaty generalnej, ale także spotkań dwustronnych. Wicepremier Sikorski
  realizował w Nowym Jorku intensywny program spotkań, w trakcie których prezentował
  polskie stanowisko wobec najważniejszych wyzwań dla bezpieczeństwa międzynarodowego
  oraz przyszłości współpracy wielostronnej. Minister konsekwentnie podkreślał znaczenie
  obrony zasad Karty Narodów Zjednoczonych i prawa międzynarodowego, potrzebę skutecznego
  multilateralizmu oraz konieczność dalszego wsparcia Ukrainy w obliczu rosyjskiej
  agresji. W polskim przekazie szczególne miejsce zajmowała kwestia poszanowania suwerenności
  i integralności terytorialnej państw oraz odpowiedzialności za naruszenia prawa
  międzynarodowego – zasad, które są fundamentem stabilnego ładu międzynarodowego.
  Ważnym elementem polskiej aktywności był także dialog z państwami Globalnego Południa
  i przedstawianie konsekwencji rosyjskiej agresji przeciwko Ukrainie. Podczas sesji
  Rady Bezpieczeństwa ONZ na temat Ukrainy Minister Sikorski zwrócił się bezpośrednio
  do Ministra Spraw Zagranicznych Rosji Sergieja Ławrowa, prostując kłamstwa szefa
  rosyjskiego MSZ i wyjaśniając powody rosyjskiej eskalacji. Szef polskiej dyplomacji
  podkreślił: Po ponad czterech latach bezsensownej, kolonialnej wojny Władimir Putin
  niczego nie osiągnął. Kończą mu się zasoby, brakuje mu rekrutów. Potrzebuje pretekstu
  do kolejnej mobilizacji. Ta niepotrzebna wojna kosztowała życie lub zdrowie półtora
  miliona Rosjan. Rośnie zagrożenie dla milionów Ukraińców i innych Europejczyków.
  W każdej chwili Putin może spróbować sprowokować państwo członkowskie NATO i rozszerzyć
  obszar objęty wojną, jak słyszymy od innych Szef polskiego MSZ zwrócił się do rosyjskich
  polityków: Przedstawicielom Federacji Rosyjskiej chcę powiedzieć: od ponad dwunastu
  lat próbujecie podbić Donbas, a od ponad czterech lat — Kijów. Zostaliście powstrzymani
  przez bohaterską Ukrainę — kraj o gospodarce dziesięciokrotnie mniejszej od waszej.
  Ale gospodarka Polski jest już tylko o połowę mniejsza od waszej. Gospodarka Europy
  jest dziesięciokrotnie większa, a krajów NATO — dwudziestopięciokrotnie większa.
  Wciąż możecie zabić znacznie więcej ludzi. Ale nie jesteście w stanie wygrać. Możecie
  w każdej chwili zakończyć tę imperialną wojnę z wyboru W ramach spotkań tygodnia
  wysokiego szczebla ONZ minister Sikorski rozmawiał z Sekretarzem NATO Markiem Rutte,
  a także wziął udział w spotkaniu ministrów spraw zagranicznych Polski, Niemiec,
  Francji i Wielkiej Brytanii z ministrami spraw zagranicznych Australii, Japonii,
  Nowej Zelandii i Korei Południowej , które poświęcone było bezpieczeństwu Europy
  i Indo-Pacyfiku. Ponadto uczestniczył w spotkaniu ministrów spraw zagranicznych
  Grupy Wyszehradzkiej z Ministrem Spraw Zagranicznych Indii. Tradycyjnym punktem
  programu było nieformalne spotkanie szefów dyplomacji państw UE (FAC). Szef polskiego
  MSZ odbył również spotkania z senatorami USA Jeanne Shaheen i Rubenem Gallego, a
  także uczestniczył w spotkaniu ministerialnym nt. zapewnienia odpowiedzialności
  w sprawie Ukrainy. Program szefa MSZ wypełniony był także szeregiem spotkań dwustronnych
  z przedstawicielami innych państw, wysokimi urzędnikami ONZ oraz przedstawicielami
  różnych środowisk, w tym polonijnych start-upów i inwestorów venture capital. Wicepremier
  Sikorski spotkał się z szefami dyplomacji: Peru, Nepalu, Grenlandii, Indii, Kazachstanu,
  Egiptu, Mauretanii, Zjednoczonych Emiratów Arabskich, Jordanii. Dodatkowo, w imieniu
  Wysokiej Przedstawiciel UE Kai Kallas, szef polskiej dyplomacji przeprowadził konsultacje
  z Ministrem Spraw Zagranicznych Kamerunu. W trakcie spotkań szef polskiej dyplomacji
  podkreślał, że konieczne jest dalsze zwiększanie międzynarodowego wsparcia dla Ukrainy.
  Wskazywał również na znaczenie wypracowania wspólnej wizji ładu międzynarodowego,
  opartego na poszanowaniu praw wszystkich państw i zdolnego odpowiadać na zagrożenia
  ze strony Rosji. Dowiedz się więcej o wizycie wicepremiera, ministra spraw zagranicznych
  Radosława Sikorskiego w Nowym Jorku:'
