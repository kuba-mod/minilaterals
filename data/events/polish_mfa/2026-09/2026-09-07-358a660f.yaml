title: Polsko-indonezyjskie konsultacje polityczne
text: 'Rozmówcy podkreślili znaczenie regularnego dialogu politycznego dla dalszego
  pogłębiania relacji polsko-indonezyjskich. Omówili możliwości intensyfikacji współpracy
  gospodarczej, w tym w sektorach: rolno-spożywczym, energetycznym, nowych technologii
  oraz zielonych technologii. Wskazali również, że konieczne jest dalsze wspieranie
  współpracy pomiędzy przedsiębiorcami z Polski i Indonezji. Wiceminister Władysław
  Teofil Bartoszewski podkreślił znaczenie przystąpienia Polski do Traktatu o Przyjaźni
  i Współpracy w Azji Południowo-Wschodniej (TAC) w lipcu 2026 r. Akcesja jest wyrazem
  rosnącego zaangażowania Polski w regionie Indo-Pacyfiku oraz stwarza dodatkowe możliwości
  rozwijania współpracy z państwami Stowarzyszenia Narodów Azji Południowo-Wschodniej 
  (ASEAN). Polska postrzega Indonezję jako ważnego partnera w regionie i jest zainteresowana
  dalszym pogłębianiem relacji zarówno w wymiarze bilateralnym, jak i w ramach współpracy
  UE–ASEAN. Strona indonezyjska zwróciła uwagę na sukces polskiej transformacji gospodarczej.
  Podkreślała, że jest zainteresowana polskimi doświadczeniami, które stanowią istotny
  punkt odniesienia dla współpracy obu państw, również w ramach G20. Ważnym elementem
  rozmów była wymiana poglądów na temat sytuacji międzynarodowej i bezpieczeństwa.
  Wiceminister Władysław Teofil Bartoszewski i Dyrektor Generalna Grata Endah Werdaningtyas
  omówili m.in. sytuację w Europie i Indo-Pacyfiku, rosyjską agresję przeciwko Ukrainie
  oraz najważniejsze wyzwania dla porządku międzynarodowego. Podkreślili znaczenie
  poszanowania prawa międzynarodowego, zasad Karty Narodów Zjednoczonych oraz skutecznego
  multilateralizmu. Rozmowy potwierdziły szeroki potencjał zacieśniania relacji Polski
  i Indonezji, zarówno w wymiarze dwustronnym, jak i w kontekście współpracy z ASEAN.
  Stowarzyszenie Narodów Azji Południowo-Wschodniej (ASEAN) powstało w Bangkoku w
  1967 r. Siedzibą tej organizacji polityczno-gospodarczej jest Dżakarta.'
