title: Inauguracja debaty generalnej 81. sesji Zgromadzenia Ogólnego ONZ w Nowym Jorku
  z udziałem wicepremiera Radosława Sikorskiego
text: 'Światowi liderzy wzięli udział w inauguracji 81. Sesji Zgromadzenia Ogólnego
  Organizacji Narodowych Zjednoczonych (ONZ) w Nowym Jorku. W spotkaniu uczestniczyli
  wicepremier Radosław Sikorski oraz przewodniczący polskiej delegacji prezydent Karol
  Nawrocki. Po raz ostatni na stanowisku sekretarza generalnego liderów powitał António
  Guterres, którego kadencja upływa 31 grudnia. Sekretarz generalny mówił między innymi
  o zmianach, które zaszły na świecie w ostatnich latach. W ciągu ostatnich dekad
  wojny wybuchały z niszczycielskimi konsekwencjami i ciągnęły się z nikczemnym okrucieństwem.
  Cywile byli celem ataków, prawa człowieka były łamane, gniew zamieniany w broń,
  pracownicy humanitarni zabijani, prawo międzynarodowe lekceważone, a podziały geopolityczne
  i nierówności narastały – mówił sekretarz generalny António Guterres i dodał, że
  głównymi kryzysami i wyzwaniami stojącymi przed światem są konflikty, nierówności,
  zmiany klimatu i zmiany technologiczne. Większość wyzwań, o których mówił sekretarz
  generalny była także tematem rozmów dwustronnych, w których uczestniczył wicepremier
  Radosław Sikorski. W drugim dniu tygodnia wysokiego szczebla szef polskiej dyplomacji
  wziął udział w spotkaniu na temat bezpieczeństwa morskiego, które zorganizował Minister
  Spraw Zagranicznych Niemiec. Minister Sikorski razem z szefami dyplomacji: Australii,
  Francji, Japonii, Korei Południowej, Niemiec, Nowej Zelandii i Wielkiej Brytanii
  rozmawiali m.in. o wzmacnianiu partnerstw z państwami Indo-Pacyfiku, w tym strategicznych
  relacji z Japonią i Koreą Południową w dalszym dialogu na rzecz porządku międzynarodowego
  opartego na zasadach oraz na ograniczaniu wpływów Rosji w regionie. Szef MSZ spotkał
  się także z senatorami USA Jeanne Shaheen oraz Rubenem Gallego. W rozmowach podkreślał
  znaczenie obecności wojsk amerykańskich w Polsce i współpracy wojskowej między naszymi
  państwami, szczególnie w kontekście wojny za wschodnią flanką NATO. Politycy zapewnili
  o trwałości gwarancji artykułu 5. Traktatu Północnoatlantyckiego. W trakcie wysokiego
  tygodnia ONZ Minister Sikorski zwracał uwagę na rosyjskie prowokacje: Putin próbuje
  prowokować NATO, aby uzasadnić przed własną opinią publiczną, dlaczego wysyła kolejne
  pół miliona młodych Rosjan na wojnę w Ukrainie. Rosja wysyła żołnierzy, wysyła pociski
  manewrujące, drony, wysadza jadące pociągi, próbuje podkładać bomby zapalające na
  samolotach pasażerskich, podpala centra handlowe – mógłbym tak wymieniać dalej.
  (…)  Rosja może podjąć jakieś lekkomyślne i prowokacyjne działania poniżej poziomu
  pełnoskalowej wojny. Dlatego gwarancje naszych sojuszników są dla nas tak ważne”
  Temat bezpieczeństwa dominował także podczas spotkań dwustronnych, w których uczestniczył
  wicepremier Sikorski. W rozmowie z Ministrem Spraw Zagranicznych Kazachstanu Muchtarem
  Tleuberdim szef polskiego MSZ podkreślał, że agresja Rosji na Ukrainę niesie zagrożenie
  nie tylko dla Polski, ale też całego regionu. Z kolei podczas rozmów z partnerami
  z regionu Afryki szef polskiej dyplomacji wymienił się spostrzeżeniami m.in. na
  temat konfliktu na Bliskim Wschodzie i sytuacji w Zatoce Perskiej. Podczas spotkania
  ze swoim odpowiednikiem z Egiptu, minister Sikorski rozmawiał m.in. o rozwoju relacji
  polsko-egipskich, w tym współpracy gospodarczej, rolnej i naukowej, a także współpracy
  Uniwersytetu Warszawskiego z partnerami w Egipcie, jak również o sytuacji w Jemenie
  i bezpieczeństwie morskim w cieśninach Ormuz i Bab al-Mandab. W rozmowie z Ministrem
  Spraw Zagranicznych Mauretanii Mohamedem Salemem Ould Merzougiem minister Sikorski
  poruszył temat stabilności i bezpieczeństwa Sahelu, przeciwdziałania nielegalnej
  migracji oraz współpracy z Unią Europejską. Minister Sikorski, w imieniu Unii Europejskiej,
  spotkał się także z Ministrem Spraw Zagranicznych Kamerunu Lejeune Mbella Mbella.
  Podczas rozmowy przedstawił stanowisko państw członkowskich względem wojny Rosji
  przeciwko Ukrainie, a także odnotował rolę Kamerunu dla zapewnienia regionalnej
  stabilności w pobliżu Kotliny Czadu i Zatoki Gwinejskiej. Szef polskiej dyplomacji
  będzie w Nowym Jorku do 24 września. Łącznie odbędzie ponad 30 spotkań w różnych
  formatach, rozmawiając m.in. o przyszłości współpracy wielostronnej oraz konieczności
  reformy ONZ. W środę 23 września wicepremier zabierze głos podczas debaty Rady Bezpieczeństwa
  ONZ, podczas której przedstawi stanowisko Polski dotyczące rosyjskiej agresji przeciwko
  Ukrainie. Informacje na temat pierwszego dnia wizyty wicepremiera Radosława Sikorskiego
  w USA: LINK'
