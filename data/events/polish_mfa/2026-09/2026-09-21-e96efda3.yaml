title: Wicepremier Radosław Sikorski bierze udział w tygodniu wysokiego szczebla 81.
  sesji Zgromadzenia Ogólnego ONZ w Nowym Jorku
text: '81. sesja Zgromadzenia Ogólnego ONZ odbywa się pod hasłem „Przywracanie zaufania,
  zarządzanie transformacją: ONZ, która skutecznie działa dla wszystkich” („Restoring
  Trust, Managing Transformation: A United Nations That Delivers for All”). Minister
  Sikorski rozpoczął serię ponad 30 spotkań w różnych formatach, podczas których przedstawia
  polskie stanowisko wobec najważniejszych wyzwań dla bezpieczeństwa międzynarodowego,
  przyszłości współpracy wielostronnej oraz konieczności reformy ONZ. Pierwszego dnia
  wizyty minister Sikorski rozpoczął serię rozmów bilateralnych ze swoimi odpowiednikami
  z różnych regionów świata. Jednym z tematów poruszanych przez wicepremiera Radosława
  Sikorskiego podczas spotkań jest dalszy udział Polski w pracach Grupy G20. Tak jak
  w tym roku jesteśmy pełnym uczestnikiem, tak przypominam, następne prezydencje w
  G20 to prezydencja brytyjska, a później południowokoreańska. Jesteśmy w intensywnym
  dialogu ze stroną brytyjską w tej sprawie. G20 będzie lepsze z Polską jako członkiem
  – powiedział minister spraw zagranicznych. Podczas rozmów wicepremier podkreślał
  również, że rosyjska agresja przeciwko Ukrainie niesie negatywne konsekwencje także
  dla państw spoza Europy, m.in. dla bezpieczeństwa żywnościowego. Szef polskiej dyplomacji
  przypomniał również, kto jest agresorem, a kto ofiarą w tej wojnie. To Ukraina jest
  przedmiotem bombardowań, także bombami szybującymi, także nowymi typami dronów.
  Więc jeśli Ukraina znalazła czuły punkt Rosji, no to trzeba by powiedzieć, co Rosja
  byłaby gotowa w zamian za takie domniemane, czy formalne, czy częściowe zawieszenie
  broni zrobić – powiedział minister Radosław Sikorski podczas briefingu prasowego.
  W rozmowach ze swoimi odpowiednikami, m.in. z Peru i Nepalu, minister Sikorski poruszał
  kwestie przestrzegania zasad Karty Narodów Zjednoczonych i prawa międzynarodowego,
  rosyjskiej agresji przeciwko Ukrainie oraz potrzeby wzmacniania skutecznego multilateralizmu.
  Wicepremier spotkał się także z Ministrem Spraw Zagranicznych, Biznesu i Zasobów
  Mineralnych Rządu Grenlandii. Rozmowa dotyczyła m.in. współpracy naukowej w Arktyce,
  jedności transatlantyckiej oraz wzmacniania roli NATO w regionie. Wicepremier wyraził
  niezachwiane poparcie Polski dla suwerenności i integralności terytorialnej Królestwa
  Danii. Z kolei na spotkaniu z szefem dyplomacji Peru, ministrowie podpisali dwustronną
  umowę o ekstradycji. Spotkania na marginesie tygodnia wysokiego szczebla Zgromadzenia
  Ogólnego ONZ są również okazją do rozmów w formatach wielostronnych. Na zaproszenie
  słowackiej prezydencji w Grupie Wyszehradzkiej minister Sikorski wziął udział w
  lunchu roboczym V4 z Ministrem Spraw Zagranicznych Indii. Rozmowy dotyczyły współpracy
  gospodarczej Europy Środkowej z Indiami, a także współpracy na rzecz bezpieczeństwa
  i pokoju. W Nowym Jorku szef polskiej dyplomacji uczestniczył również w nieformalnym
  posiedzeniu Rady do Spraw Zagranicznych UE (FAC), któremu przewodniczyła Wysoka
  Przedstawiciel Unii do Spraw Zagranicznych i Polityki Bezpieczeństwa Kaja Kallas.
  W kolejnych dniach minister Sikorski będzie kontynuował spotkania bilateralne i
  wielostronne. W środę podczas debaty Rady Bezpieczeństwa ONZ wicepremier przedstawi
  stanowisko Polski dotyczące rosyjskiej agresji przeciwko Ukrainie.'
