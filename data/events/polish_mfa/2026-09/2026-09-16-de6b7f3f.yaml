title: Wręczenie nominacji Młodzieżowym Delegatom RP przy ONZ
text: Młodzieżowi Delegaci RP wchodzą w skład oficjalnej delegacji Polski na Zgromadzenie
  Ogólne ONZ w Nowym Jorku.  Będą reprezentować głos młodego pokolenia w debacie międzynarodowej
  oraz uczestniczyć w działaniach na rzecz wzmacniania udziału młodzieży w życiu społecznym
  i publicznym. Ich zadaniem jest także prowadzenie dialogu z młodymi ludźmi i przedstawianie
  ich perspektywy na forum Narodów Zjednoczonych. To część globalnego Global Youth
  Delegate Programme. Karolina Fabirkiewicz i Michał Wyrębkowski zwyciężyli w konkursie
  , w którym przedstawili projekty wystąpienia na temat roli młodych we wzmacnianiu
  odporności i skutecznym reagowaniu na kryzysy oraz wykazali się doświadczeniem zgodnym
  z priorytetami ONZ. Gratulujemy nominowanym i życzymy sukcesów w realizacji zadań!
