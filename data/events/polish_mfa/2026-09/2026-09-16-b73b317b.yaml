title: Oświadczenie MSZ RP dot. ataku dronowego wymierzonego w Mekkę
text: Za niedopuszczalny uznajemy atak dronowy ruchu Huti wymierzony w Mekkę. Wpisuje
  się on w ciąg działań prowadzących do chaosu i niestabilności na Bliskim Wschodzie,
  zagrażających ludności cywilnej i cywilnym obiektom oraz morskim szlakom transportowym.
  Wzywamy do poszanowania szczególnego statusu i nieatakowania miejsc i symboli religijnych
  zwłaszcza w obliczu tak poważnych wyzwań dla globalnego bezpieczeństwa i gospodarki,
  z jakimi mamy obecnie do czynienia.
