title: Wiceminister Artur Harazim otworzył spotkanie Rady Arktycznej
text: Otwierając spotkanie w Warszawie wiceminister Artur Harazim podkreślił stale
  rosnące znaczenie Arktyki dla bieżącej sytuacji geopolitycznej. Zwrócił również
  uwagę na fakt, że procesy zachodzące na Dalekiej Północy wpływają także na inne
  regiony świata. Przypomniał, że Polska dysponuje istotnym potencjałem naukowym,
  dzięki któremu wspiera działania zmierzające do lepszej ochrony środowiska naturalnego
  Arktyki. Współprowadzący spotkanie ambasador ds. Arktyki Kenneth Høegh z Grenlandii
  przedstawił dotychczasowe działania duńskiego przewodnictwa, dla którego priorytetem
  pozostaje m.in. zrównoważony rozwój Arktyki oraz wsparcie ludności zamieszkującej
  Daleką Północ. Uczestnicy wysłuchali również prezentacji ambasador ds. Arktyki Helen
  Eduards ze Szwecji, która przejmie przewodnictwo w Radzie Arktycznej w maju 2027
  roku. Obserwatorzy z państw i organizacji opisali swoje zaangażowanie w działania
  grup roboczych Rady Arktycznej, m.in. poświęcone sytuacjom nadzwyczajnym, a także
  ochronie arktycznej flory i fauny oraz środowiska morskiego Arktyki. Przedstawiono
  także najnowsze informacje dotyczące inwestycji w infrastrukturę służącą badaniu
  regionów arktycznych. Rada Arktyczna została powołana w 1996 r. na mocy Deklaracji
  z Ottawy. Polska była jednym z pierwszych państw, które uzyskało status obserwatora,
  a stało się to już w 1998 r. W tegorocznym spotkaniu udział wzięło ponad 80 uczestników.
