title: Polsko-maltańskie konsultacje polityczne i debata o przyszłości Europy
text: 'Wicepremier Radosław Sikorski 14 września spotkał się w Warszawie z szefem
  maltańskiego MSZ Chrisem Fearnem. Ministrowie omówili najważniejsze wyzwania dla
  bezpieczeństwa Europy, w tym konsekwencje rosyjskiej agresji na Ukrainę. Wicepremier
  Sikorski podkreślił, że Malta, chociaż jest konstytucyjnie neutralna, wspierała
  kolejne pakiety UE wymierzone w Rosję za agresję wobec Ukrainy.  Szef polskiego
  MSZ przypomniał, że Malta odegrała kluczową rolę w ustanowieniu Specjalnego Trybunału
  ds. Zbrodni Agresji przeciwko Ukrainie W tych burzliwych czasach Europa potrzebuje
  nie tylko większych zdolności obronnych, ale także moralnego kręgosłupa, by bronić
  tego, co słuszne Szefowie dyplomacji Rozmawiali również o sytuacji na Bliskim Wschodzie
  oraz wyzwaniach związanych z bezpieczeństwem i stabilnością regionu Morza Śródziemnego.
  Istotnym elementem rozmów były kwestie ochrony infrastruktury krytycznej, w szczególności
  morskiej. Polska i Malta wykorzystują swoje doświadczenia i położenie geostrategiczne
  do rozwoju współpracy w zakresie wzmacniania bezpieczeństwa i odporności infrastruktury
  o znaczeniu strategicznym. Ministrowie rozmawiali także o relacjach polsko-maltańskich.
  Od akcesji naszych krajów do UE wzajemna wymiana handlowa znacząco wzrosła. Suma
  obrotów handlowych w 2005 r. wynosiła 13,6 mln EUR, z kolei w okresie styczeń –
  listopad 2024 r. – 182,7 mln EUR. Szefowie dyplomacji wskazywali na obszary, w których
  współpraca państw może być w kolejnych latach ściślejsza. W drugim dniu wizyty szefa
  maltańskiego MSZ ministrowie wzięli udział w panelu „Nationhood and Bilateral Relations:
  Malta and Poland in Europe”/”Państwowość i Relacje Dwustronne: Malta i Polska w
  Europie”, zorganizowanym w Fabryce Norblina przez Ambasadę Republiki Malty w Warszawie.
  Debata była poświęcona znaczeniu tożsamości narodowej i suwerenności oraz relacjom
  między interesami państw członkowskich a procesem integracji europejskiej. Uczestnicy
  dyskutowali również o doświadczeniach Polski i Malty po ponad dwóch dekadach członkostwa
  w Unii Europejskiej oraz o możliwościach dalszego pogłębiania współpracy między
  obu państwami. Ważnym wątkiem dyskusji były odmienne perspektywy regionalne Polski
  i Malty. Polska zwracała uwagę na wyzwania związane z bezpieczeństwem Europy i jej
  wschodnią flanką, podczas gdy Malta podkreślała znaczenie południowego sąsiedztwa
  Unii Europejskiej oraz wyzwań dotyczących regionu Morza Śródziemnego. Obie perspektywy
  pokazują znaczenie dialogu i współpracy państw członkowskich dla budowania silniejszej
  i bardziej odpornej Unii Europejskiej. W panelu moderowanym przez Ambasadora Malty
  w Warszawie Gavina Gulię obok ministrów spraw zagranicznych Polski i Malty wzięli
  udział były komisarz europejski dr Tonio Borg oraz były minister spraw zagranicznych
  Malty dr Alex Sceberras Trigona. Uczestnicy debaty mogli zobaczyć także specjalną
  wystawę poświęconą Malcie w ArtBox Experience. Ekspozycja przybliżyła zwiedzającym,
  m.in.: historię, kulturę, dziedzictwo i kuchnię Malty.'
