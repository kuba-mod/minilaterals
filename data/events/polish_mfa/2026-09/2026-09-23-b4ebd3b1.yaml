title: Wystąpienie wicepremiera, ministra spraw zagranicznych Radosława Sikorskiego
  podczas posiedzenia Rady Bezpieczeństwa ONZ
text: 'Panie Przewodniczący, proszę pozwolić mi na kilka dodatkowych zdań, jako że
  zostałem wymieniony z nazwiska przez ministra spraw zagranicznych Federacji Rosyjskiej
  i mam poczucie, że powinienem odpowiedzieć. Po pierwsze, nazywa on wydarzenia z
  2014 r. w Kijowie, w Ukrainie, „krwawym przewrotem”. Byłem tam z ministrami spraw
  zagranicznych Niemiec i Francji i nie było przewrotu. Prezydent Ukrainy, pan Janukowycz,
  został odwołany z urzędu przez demokratycznie wybrany ukraiński parlament, w tym
  przez jego własną Partię Regionów, ponieważ dokonał masakry, w której zginęło co
  najmniej 100 ukraińskich cywilów. Pan Ławrow twierdzi też – cytuję z protokołu –
  że „na terytorium Ukrainy jest całkowity zakaz używania języka rosyjskiego w każdym
  obszarze”. Byłem w Kijowie dziesięć dni temu, pod rosyjskimi bombami, i mogę go
  zapewnić, że powszechnie mówi się tam po rosyjsku. Oczywiście ma on rację, że mniejszości
  narodowe mają prawo mówić w swoim języku w urzędach, w sądach, w szkołach. Jeśli
  tego się domaga, potrzebne mu jest stosowanie Konwencji Rady Europy o ochronie mniejszości
  narodowych. Nie sądzę, by Ukraina sprzeciwiła się temu, a społeczność międzynarodowa,
  w tym Polska, poparłaby takie rozwiązanie. Pan Ławrow ma prawo domagać się stosowania
  tej Konwencji. Nie ma prawa wysyłać czołgów i pocisków balistycznych do Ukrainy.
  Po trzecie, pan Ławrow nazywa rząd i prezydenta Ukrainy „nazistami”. Rosyjskie wybory
  do Dumy też krytykuje się jako niewystarczająco demokratyczne. Jest na to sposób.
  Moja propozycja jest taka, aby przeprowadzić demokratyczne wybory prezydenckie pod
  nadzorem międzynarodowym zarówno w Rosji, jak i w Ukrainie tego samego dnia. Panie
  Przewodniczący, tak jak Pan powiedział i tak jak powiedziała Pani Podsekretarz DiCarlo
  i inni, Rosja eskaluje wojnę. Nie mogąc przełamać frontu, Rosja z premedytacją uderza
  w ukraińskich cywilów. W pasażerów kolei, ulicznych sprzedawców, nawet rowerzystów.
  W elektrownie, fabryki i centra handlowe. W port w Odessie, przez który, jak już
  powiedziano, normalnie wysyła się 50 milionów ton zboża rocznie do krajów Afryki
  i Azji. Dziś Rosja przenosi te same metody działania do Europy. 13 września rosyjski
  dron odrzutowy uderzył w ukraiński pociąg, zaledwie dwa kilometry od przejścia granicznego
  z Polską. 17 września doszło do kolejnego ataku. Drony i pociski uderzały również
  w przejścia graniczne z Mołdawią i Rumunią. Rosja umieściła uzbrojonego drona na
  lotnisku w Lipsku w Niemczech. Rosyjskie drony regularnie naruszają przestrzeń powietrzną
  między innymi Litwy, Estonii, Norwegii i Finlandii. Z rąk rosyjskich zabójców zginęli
  ludzie w Hiszpanii, Wielkiej Brytanii, Polsce i Niemczech. Obecnie sięgają za Atlantyk.
  15 września Prokuratura Federalna Stanów Zjednoczonych dla Południowego Okręgu Nowego
  Jorku postawiła członkom rosyjskiej siatki wywiadowczej zarzuty „spiskowania w celu
  finansowania terroryzmu i dokonywania zabójstw na zlecenie na terytorium Stanów
  Zjednoczonych”. Cyberataki, sabotaż, tajne operacje, presja militarna. To nie są
  odosobnione incydenty. To model działania. Rosja eskaluje, ponieważ jej przywódcy
  się boją. Po ponad czterech latach bezsensownej, kolonialnej wojny Władimir Putin
  niczego nie osiągnął. Kończą mu się zasoby, brakuje mu rekrutów. Potrzebuje pretekstu
  do kolejnej mobilizacji. Ta niepotrzebna wojna kosztowała życie lub zdrowie półtora
  miliona Rosjan. Rośnie zagrożenie dla milionów Ukraińców i innych Europejczyków.
  W każdej chwili Putin może spróbować sprowokować państwo członkowskie NATO i rozszerzyć
  obszar objęty wojną, jak słyszymy od innych. Przedstawicielom Federacji Rosyjskiej
  chcę powiedzieć: od ponad dwunastu lat próbujecie podbić Donbas, a od ponad czterech
  lat — Kijów. Zostaliście powstrzymani przez bohaterską Ukrainę — kraj o gospodarce
  dziesięciokrotnie mniejszej od waszej. Ale gospodarka Polski jest już tylko o połowę
  mniejsza od waszej. Gospodarka Europy jest dziesięciokrotnie większa, a krajów NATO
  — dwudziestopięciokrotnie większa. Wciąż możecie zabić znacznie więcej ludzi. Ale
  nie jesteście w stanie wygrać. Możecie w każdej chwili zakończyć tę imperialną wojnę
  z wyboru. Nie wystawiajcie Europy i świata na jeszcze większe niebezpieczeństwo.
  Przestańcie niszczyć przyszłość Rosji. Siergieju, wiem, że słuchasz. Powiedz swojemu
  szefowi: wystarczy. Dziękuję.'
