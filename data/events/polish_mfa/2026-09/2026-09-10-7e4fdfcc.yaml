title: Spotkanie wicepremiera Radosława Sikorskiego z delegacją Senatu USA
text: Wicepremier Sikorski i amerykańscy senatorowie omówili aktualną sytuację bezpieczeństwa,
  w tym zagrożenia dla wschodniej flanki NATO oraz znaczenie utrzymania silnej obecności
  i zaangażowania Stanów Zjednoczonych w Europie. Podkreślili kluczową rolę współpracy
  sojuszniczej i jedności transatlantyckiej w obliczu obecnych wyzwań. Rozmowy objęły
  również najważniejsze kwestie w relacjach polsko-amerykańskich, w szczególności
  współpracę w dziedzinie bezpieczeństwa i obronności. Minister Sikorski podkreślił
  strategiczne znaczenie partnerstwa Polski i Stanów Zjednoczonych oraz rolę dialogu
  z Kongresem USA w jego dalszym wzmacnianiu. Członkowie delegacji zasiadają w komisjach
  Senatu USA istotnych z punktu widzenia bezpieczeństwa, polityki zagranicznej i współpracy
  gospodarczej. Senator Elissa Slotkin jest między innymi członkinią Senackiej Komisji
  Sił Zbrojnych, a senator John Curtis zasiada między innymi w Senackiej Komisji Spraw
  Zagranicznych. Senator Thom Tillis jest współprzewodniczącym Senackiej Grupy Obserwatorów
  NATO, która wspiera dialog między Senatem USA, administracją amerykańską i Sojuszem
  Północnoatlantyckim.
