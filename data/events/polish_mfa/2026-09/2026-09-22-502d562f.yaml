title: Wspólne oświadczenie ministrów spraw zagranicznych i wysokich przedstawicieli
  Australii, Francji, Japonii, Korei Południowej, Niemiec, Nowej Zelandii, Polski
  oraz Zjednoczonego Królestwa
text: Odnotowujemy, że nasza współpraca opiera się na wspólnych zasadach i interesach,
  obejmujących demokrację, praworządność, prawa człowieka oraz prawo międzynarodowe.
  Potwierdzamy nasze przekonanie, że działając razem możemy skutecznie wspierać pokój,
  stabilność, zrównoważony rozwój i dobrobyt w regionach Indo-Pacyfiku i Europy, a
  także że państwa członkowskie ONZ mogą i powinny przyczyniać się do realizacji tych
  celów. Pozostajemy konsekwentni w naszym dążeniu do ochrony i wzmacniania systemu
  multilateralnego opartego na prawie międzynarodowym, którego fundamentem jest Karta
  Narodów Zjednoczonych, w tym międzynarodowy system wymiaru sprawiedliwości. Będziemy
  współpracować na rzecz reform ONZ, aby ją wzmocnić oraz zwiększyć jej efektywność
  i odporność. Uznając, że bezpieczeństwo i dobrobyt w Europie oraz regionie Indo-Pacyfiku
  są coraz bardziej ze sobą powiązane, zobowiązujemy się do pogłębiania współpracy
  w stawianiu czoła wspólnym wyzwaniom. Potwierdzamy potrzebę przeciwdziałania zagrożeniom
  hybrydowym we wszystkich domenach oraz zapewnienia odporności naszych społeczeństw.
  Potwierdzamy nasze poparcie dla suwerenności i integralności terytorialnej wszystkich
  państw. W odniesieniu do rosyjskiej wojny napastniczej przeciwko Ukrainie podkreślamy
  znaczenie pełnego zawieszenia broni oraz potwierdzamy potrzebę osiągnięcia sprawiedliwego
  i trwałego pokoju, zgodnie z zasadami Karty Narodów Zjednoczonych i prawa międzynarodowego,
  w tym zasadami niezależności, suwerenności i integralności terytorialnej. Podkreślamy
  znaczenie utrzymania pokoju i stabilności w regionie Indo-Pacyfiku. Zachęcamy do
  dialogu i sprzeciwiamy się wszelkim jednostronnym próbom zmiany status quo w Cieśninie
  Tajwańskiej. Solidarnie podtrzymujemy nasze zobowiązanie do przestrzegania Konwencji
  Narodów Zjednoczonych o prawie morza (UNCLOS). Zakłócanie żeglugi na szlakach morskich,
  w tym w cieśninie Ormuz oraz cieśninie Bab al-Mandab, poprzez użycie siły, groźby
  lub nakładanie bezprawnych opłat bądź warunków tranzytu, zagraża bezpieczeństwu
  i dobrobytowi wszystkich państw, w szczególności najbardziej narażonych społeczności
  świata, i jest nie do zaakceptowania. Wzywamy wszystkie kraje do zabierania głosu
  wszędzie tam, gdzie takie działania mają miejsce.
