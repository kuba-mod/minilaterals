title: Eksport uzbrojenia i sprzętu wojskowego z Polski. Raport za rok 2025
text: Zeszłoroczna wartość wywozów oraz transferów wewnątrzunijnych uzbrojenia i sprzętu
  wojskowego osiągnęła wartość 2,48 mld euro i należy nadal do rekordowych w historii.
  Jednocześnie widoczne są przesłanki świadczące o trendzie spadkowym. W zestawieniu
  z rokiem 2024 r. wyniki te są słabsze o ok. 28%, co może wynikać ze zmiany charakteru
  działań wojennych na Ukrainie. Nadal jednak wartość wywozu uzbrojenia z Polski stanowi
  dwukrotność wartości faktycznego eksportu specjalnego z roku 2022. Wśród najważniejszych
  zagranicznych odbiorców nalazły się podmioty z Ukrainy (ok. 67 % wartości eksportu),
  Filipin (10%) oraz USA (7%). Większą część eksportowanego uzbrojenia stanowiła amunicja
  oraz jej elementy składowe (o wartości ok 1,03 mld euro) wyprzedzając w tym zestawieniu
  produkty lotnicze (o wartości ok. 815 mln euro). Ze względu na ograniczenia prawne,
  dane za rok 2025 nie zawierają informacji objętych klauzulami niejawności w zakresie
  wydanych zezwoleń, ich wartości oraz faktycznym wywozie uzbrojenia i sprzętu wojskowego
  przekazywanego przez polskie władze w ramach donacji na rzecz Ukrainy. Zapraszamy
  do zapoznania się z zawartością raportu. Dokument stanowi kompendium wiedzy na temat
  genezy powstania i funkcjonowania polskiego systemu kontroli obrotu towarami, usługami
  i technologiami o znaczeniu strategicznym dla bezpieczeństwa państwa. Informacje
  zawarte w raporcie, udostępnianie wcześniej przez organy administracji publicznej
  oraz podmioty prowadzące działalność gospodarczą, pozwalają na ocenę obecnej kondycji
  polskiego przemysłu obronnego w kontekście jego potencjalnej ekspansji na rynkach
  zagranicznych.
