title: Działania na rzecz Polonii i Polaków za granicą tematem międzyresortowego posiedzenia
text: 'W posiedzeniu, które miało miejsce 8 września, uczestniczyli przedstawiciele
  resortów, Urzędu do spraw Kombatantów i Osób Represjonowanych, Głównego Urzędu Statystycznego
  oraz Senatu RP – przewodniczący senackiej Komisji Spraw Emigracji i Łączności z
  Polakami za Granicą, senator Bogdan Borusewicz oraz Szef Kancelarii Senatu, minister
  Ewa Polkowska. Była to okazja do podsumowania realizacji priorytetów polityki polonijnej
  przyjętych przez rząd w kwietniu 2025 r. Uczestnicy podkreślili , że potrzebna jest
  dalsza współpraca i koordynowanie działań z osobami korzystającymi z programów i konkursów
  dla Polaków mieszkających za granicą. Ważny jest także system dotacji konkursowych.
  Przedstawiono także plany budżetowe instytucji zaangażowanych we współpracę z Polonią
  i Polakami za granicą na 2027 r. oraz uzgodniono kierunki dalszych prac w ramach
  Rządowej strategii współpracy z Polonią i Polakami za Granicą na lata 2025–2030.
  W najbliższych miesiącach kluczowym zadaniem będzie przygotowanie analizy i oceny
  realizacji priorytetów oraz celów strategicznych Strategii za lata 2025–2027. Ocena
  ta będzie stanowić ważny etap w realizacji Strategii i podsumowanie pierwszych trzech
  lat jego obowiązywania. Podczas spotkania omówiono założenia raportu śródokresowego.
  W posiedzeniu Międzyresortowego Zespołu wzięły udział resorty: Ministerstwo Spraw
  Zagranicznych, Ministerstwo Edukacji Narodowej, Ministerstwo Nauki i Szkolnictwa
  Wyższego, Ministerstwo Kultury i Dziedzictwa Narodowego, Ministerstwo Rodziny, Pracy
  i Polityki Społecznej, Ministerstwo Rozwoju i Technologii, Ministerstwo Obrony Narodowej,
  Ministerstwo Infrastruktury, Ministerstwo Sprawiedliwości, Ministerstwo Spraw Wewnętrznych
  i Administracji.'
