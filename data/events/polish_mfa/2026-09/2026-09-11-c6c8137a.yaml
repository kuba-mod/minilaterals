title: Polsko-saudyjskie konsultacje polityczne
text: Wiceministrowie omówili obecny stan relacji dwustronnych i potencjał do ich
  dalszego rozwoju, dokonali wymiany opinii nt. sytuacji bezpieczeństwa w regionie
  Zatoki Perskiej i w Europie Środkowo-Wschodniej. Strony odnotowały wpływ konfliktu
  pomiędzy Iranem a Stanami Zjednoczonymi na międzynarodową gospodarkę, ze szczególnym
  uwzględnieniem rynku paliw. Odnieśli się do zagrożeń dla infrastruktury krytycznej
  wynikłych z eskalacji działań Huti. Wiceministrowie podkreślili konieczność zachowania
  ciągłości dialogu dyplomatycznego nawet w  sytuacji eskalacji działań zbrojnych,
  a także potrzebę ścisłego przestrzegania zasad prawa międzynarodowego i Karty Narodów
  Zjednoczonych.
