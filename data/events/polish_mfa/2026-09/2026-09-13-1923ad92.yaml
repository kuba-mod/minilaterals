title: Wicepremier Radosław Sikorski z wizytą w Kijowie
text: 'Wizyta wicepremiera Radosława Sikorskiego odbywała się w czasie kolejnych intensywnych
  rosyjskich ataków na Ukrainę, także na jej zachodnią część. Rosyjski dron uderzył
  w lokomotywę pociągu pasażerskiego relacji Kijów-Warszawa Zachodnia. Wcześniej dron
  uderzył w pobliżu przejścia granicznego w Dorohusku, w okolice stacji benzynowej,
  niszcząc ciężarówki.  W nocy z 11 na 12 września w zmasowanych rosyjskich atakach
  ucierpiała jedna z największych polskich inwestycji zagranicznych na Ukrainie. Konieczna
  wspólna europejska odpowiedź i sankcje Spotykamy się w dniu, w którym Rosja zaatakowała
  punkty tuż przy granicy Polski, która jest granicą także Unii Europejskiej i Sojuszu
  Północnoatlantyckiego. Rosja zaatakowała zmodernizowanymi dronami, które mają silniki
  odrzutowe i usprawnione elementy naprowadzania. To jest eskalacja - powiedział minister
  spraw zagranicznych Radosław Sikorski podkreślając, że powinniśmy zdwoić nasze wysiłki
  we wspieraniu ofiary agresji. W obliczu niepowodzeń na froncie Moskwa nasila brutalne
  ataki na cywilów oraz działania sabotażowe wymierzone w państwa wspierające Ukrainę
  — czego doświadczają m.in. Polska, Niemcy, państwa bałtyckie i Rumunia. Minister
  Sikorski zaznaczył, że te ataki nie mogą stać się nową normą i konieczna jest wspólna
  europejska odpowiedź, obejmująca wsparcie dla Ukrainy, skuteczną politykę sankcyjną,
  izolację Rosji oraz wzmacnianie zdolności obronnych NATO. W podobnym tonie wypowiedział
  się Minister Spraw Zagranicznych Ukrainy Andrij Sybiha: Europa może uważać, czy
  też uspokajać samą siebie, że nie jest w stanie wojny z Rosją, ale Rosja tak nie
  uważa. De facto jest już w stanie wojny ze strefą euroatlantycką, podejmując różnego
  rodzaju wrogie działania. Dlatego jeszcze raz podkreślam, jak ważne jest wprowadzenie
  zakazu wjazdu dla rosyjskich kombatantów, ponieważ stanowią oni zagrożenie Z kolei
  minister spraw zagranicznych Radosław Sikorski dodał, że będziemy wspólnie naciskać
  na tych, którzy jeszcze mają rosyjskie aktywa, aby one nigdy nie wróciły do agresora.
  Podczas wizyty wicepremier Sikorski wskazywał, że odporność Ukrainy, jedność i solidarność
  jej partnerów są kluczowe dla powstrzymania rosyjskiej agresji. Podkreślił, że Rosja
  nie wygrywa tej wojny dzięki profesjonalizmowi ukraińskiej armii oraz odporności
  i odwadze ukraińskiego społeczeństwa. Wicepremier zaznaczył także, że Ukraina według
  opinii Komisji Europejskiej jest już gotowa do negocjacji w kwestii wejścia do Unii
  Europejskiej. Chcę potwierdzić, że negocjacje o wejściu Ukrainy do Unii Europejskiej
  nie będą łatwymi negocjacjami, tak jak nasze nie były wtedy, gdy my wchodziliśmy.
  Ale Polska nie będzie blokowała otwierania klastrów negocjacyjnych Ukraina też,
  mamy nadzieję, zakończy proces wdrażania umowy stowarzyszeniowej, w tym umowy o
  pogłębionej strefie wolnego handlu. Możecie być w jednolitym rynku, zanim jeszcze
  nawet wstąpicie do Unii Europejskiej - zwrócił się do szefa ukraińskiej dyplomacji.
  Konferencja YES i spotkania dwustronne Wicepremier podczas wizyty w Kijowie wziął
  także udział w konferencji YES i panelu „Co musimy zrobić, aby zakończyć wojnę –
  perspektywa europejska”. Podczas panelu podkreślił, że klucz do zakończenia wojny
  leży w rękach Władimira Putina: Rosja musi wycofać swoje wojska z Ukrainy i zaprzestać
  ataków na ukraińskie miasta. Europa musi pozostać konsekwentna i zdecydowana w dalszym
  wspieraniu Ukrainy – zarówno militarnie, jak i gospodarczo. Potrzebujemy „spokoju,
  sankcji i solidarności. W rozmowach z ukraińskimi partnerami wicepremier Sikorski
  poruszył również kluczowe tematy dla relacji dwustronnych, w tym m.in. konieczność
  respektowania polskiej wrażliwości historycznej oraz sprawy gospodarcze. Minister
  spraw zagranicznych spotkał się z Tarasem Czmutem - szefem fundacji charytatywnej
  „Come Back Alive” wspierającej ukraińskich weteranów wojennych. Rozmowa skupiła
  się wokół działań MSZ na rzecz 🇺🇦 weteranów w ramach programu Polska Pomoc.'
