title: Wicepremier Radosław Sikorski na nieformalnym spotkaniu unijnych szefów dyplomacji
  - Gymnich w Irlandii
text: Minister Radosław Sikorski wyraził solidarność z Ukrainą, a także z Niemcami
  - w związku z ostatnimi aktami sabotażu kierowanymi przeciwko nim . Szef polskiej
  dyplomacji potępił bombardowanie przez Rosję miast i infrastruktury cywilnej w Ukrainie,
  w których ginie ludność cywilna. Wszystkie ataki na miasta, na infrastrukturę cywilną,
  to zbrodnie wojenne Według szefa polskiej dyplomacji ostatnie ataki wobec Niemiec
  są poważnymi aktami terroryzmu państwowego. Minister Sikorski zadeklarował, że Polska
  zrobi wszystko, co trzeba, aby - wraz z innymi sojusznikami - wesprzeć każdego sojusznika,
  który zostanie zaatakowany. Polska stosuje zasadę „jeden za wszystkich, wszyscy
  za jednego”. Powinniśmy pokazać, że nie damy się zastraszyć. Nie dążymy do konfliktu
  z Rosją, ale wygląda na to, że to Rosja prowadzi z nami wojnę hybrydową W dyskusji
  na temat agresji Rosji wobec Ukrainy uczestniczyli ministrowie spraw zagranicznych
  Ukrainy, Kanady, Islandii, Norwegii, Szwajcarii oraz Zjednoczonego Królestwa Wielkiej
  Brytanii i Irlandii Północnej, zaproszeni na Gymnich przez prezydencję irlandzką
  oraz wysoką przedstawiciel UE ds. polityki zagranicznej i bezpieczeństwa Kai Kallas.
  Na marginesie spotkania minister Radosław Sikorski spotkał się z ministrem spraw
  zagranicznych Szwajcarii Ignazio Cassisem, minister spraw zagranicznych Kanady Anitą
  Anand, ministrem spraw zagranicznych Zjednoczonego Królestwa Wielkiej Brytanii i
  Irlandii Północnej Edem Milibandem oraz ministrem spraw zagranicznych Ukrainy Andrijem
  Sybihą.
