title: Ogłoszenie o naborze kandydatów w wyborach do Komitetu ds. Likwidacji Dyskryminacji
  Kobiet
text: 'Komitet ds. Likwidacji Dyskryminacji Kobiet to organ traktatowy ONZ, który
  monitoruje wdrażanie Konwencji o likwidacji wszelkich form dyskryminacji kobiet.
  Składa się z 23 członków – niezależnych ekspertów nominowanych przez państwa będące
  stronami Konwencji, których kadencja trwa 4 lata (z możliwością ponownego wyboru
  jeden raz). Regularne sesje Komitetu odbywają się przynajmniej raz do roku w Nowym
  Jorku, istnieje także możliwość zwołania sesji specjalnych. Koszty związane z udziałem
  w posiedzeniach komitetu pokrywane są przez ONZ. Wybory nowych członków Komitetu
  planowane są na czerwiec 2028 r. w Nowym Jorku. Do obsadzenia w wyborach będzie
  11 miejsc w miejsce członków, których kadencja upłynie w dniu 31 grudnia 2028 r.
  Członkowie Komitetu ds. Likwidacji Dyskryminacji Kobiet wybierani są spośród zgłoszonych
  przez państwa kandydatów posiadających wysokie kwalifikacje moralne i znaczące doświadczenie
  zawodowe w obszarze ochrony praw człowieka, aktywności akademickiej, w tym publikacji
  naukowe związanych z zakresem prac Komitetu. W sprawowaniu swojej funkcji są niezależni
  i bezstronni, nie reprezentują państwa pochodzenia ani regionu, do którego państwo
  to należy. - osoby zatrudnione w organach władzy wykonawczej, - osoby zajmujące
  stanowiska decyzyjne w instytucjach i organizacjach podległych organom władzy wykonawczej.
  Wymogi osoby kandydującej do organu traktatowego: Kandydatury osób spełniających
  wyżej przedstawione kryteria wraz z: należy przesłać pocztą na adres Ministerstwa
  Spraw Zagranicznych, Departament Spraw Globalnych (al. Szucha 23, 00-580 Warszawa)
  oraz pocztą elektroniczną na adres: dsg.sekretariat@msz.gov.pl do 23 października
  2026 r. (data wpłynięcia korespondencji do MSZ) Ministerstwo Spraw Zagranicznych
  po wytypowaniu kandydata Polski do Komitetu ds. Likwidacji Dyskryminacji Kobiet
  przeprowadzi międzynarodową kampanię promującą daną osobę. Dalsze informacje dotyczące
  działalności komitetu oraz wyborów można uzyskać pod adresami internetowymi: Więcej
  informacji nt. zakresu zadań ciał traktatowych systemu NZ i sposobu ich wykonywania,
  a także kwestii praktycznych związanych z udziałem w pracach komitetów dostępny
  jest na stronach OHCHR (Handbook for Human Rights Treaty Body Members - https://www.ohchr.org/en/publications/policy-and-methodological-publications/handbook-human-rights-treaty-body-members
  ). W razie pytań dot. wyborów do ciał traktatowych, prośba o kontakt z Departamentem
  Spraw Globalnych MSZ pod adresem poczty elektronicznej: dsg.sekretariat@msz.gov.pl
