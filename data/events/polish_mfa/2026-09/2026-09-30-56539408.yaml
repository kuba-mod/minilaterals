title: Mzia Amaglobeli laureatką tegorocznej Nagrody Solidarności im. Lecha Wałęsy
text: 'W uroczystości udział wzięli przedstawiciele władz RP, goście zagraniczni oraz
  przedstawiciele społeczeństwa obywatelskiego. Ceremonię otworzył przewodniczący
  Kapituły Nagrody, były Prezydent Rzeczypospolitej Polskiej Lech Wałęsa. Laudację
  na cześć laureatki wygłosił wicepremier i Minister Spraw Zagranicznych RP Radosław
  Sikorski. Mzia Amaglobeli jest dziennikarką, założycielką i redaktorką naczelną
  założonego w 2010 r. Netgazeti oraz Batumelebi z 2001 r. Oba tytuły są jednymi z
  najstarszych niezależnych mediów w Gruzji. Kierowane przez nią portale informacyjne
  są symbolem niezależnego dziennikarstwa: bronią praw człowieka i sprzeciwiają się
  korupcji oraz samowoli władzy. W sierpniu 2025 r. sąd w Batumi skazał Mzię Amaglobeli
  na 2 lata więzienia. W areszcie doświadczyła psychicznego znęcania się ze strony
  funkcjonariuszy i nie zapewniono jej pomocy prawnej. Wyrok ten to symboliczny wyrok
  przeciwko całemu niezależnemu środowisku dziennikarskiemu w Gruzji. Odbierając nagrodę
  w imieniu Mzii Amaglobeli, Irma Dimitradze powiedziała: Wiele lat temu prezydent
  Wałęsa i Polacy walczyli przeciwko sowietom. Wiele lat później Mzia i Gruzini walczą
  o demokrację. Teraz ten potwór nazywa się Federacją Rosyjską. Jej propaganda krzywdzi
  również w sposób niewidzialny. Jednak są ludzie jak my - Polacy i Gruzini, którzy
  potrafią ją rozpoznać. Polska rozumie nas bez słów. Jestem wdzięczna za to porozumienie.
  W swoim wystąpieniu minister spraw zagranicznych Radosław Sikorski podkreślił, że
  historia Mzii Amaglobeli przypomina nam, iż obrona wolności i godności ludzkiej
  nie jest zadaniem wyłącznie państw czy organizacji międzynarodowych – to zadanie
  każdego z nas. Autorytaryzm nie zaczyna się, kiedy ludzie trafiają do więzień, zaczyna
  się, kiedy strach wywołuje apatię. Szef polskiej dyplomacji przypomniał też, że
  wolność słowa wymaga ochrony zwłaszcza wtedy, gdy wypowiadane słowa są niewygodne.
  Dziś, w obliczu rosnących tendencji autorytarnych, szczególnie ważna jest solidarność
  z tymi, którzy odważnie stają w obronie demokracji. Nasze zadanie zburzenia porządku
  dokonaliśmy Solidarnością. Dziś dajemy nagrodę, by następne pokolenie zatwierdziło
  nasze zwycięstwo. Tylko wtedy wygramy. Wręczając tę nagrodę dzisiaj, mam nadzieję
  na więcej. Mam nadzieję, że następne pokolenie pójdzie w tym kierunku i zaproponuje
  rozwiązania na problemy tych czasów. – powiedział były Prezydent RP Lech Wałęsa.
  Nagrodę Solidarności im. Lecha Wałęsy ustanowiono w 2014 r. dla uczczenia 25. rocznicy
  odzyskania wolności przez Polskę. W 2024 r. minister Radosław Sikorski podjął decyzję
  o reaktywacji tej inicjatywy. Nagroda jest przyznawana za szczególne działania na
  rzecz promocji i ochrony demokracji oraz wolności obywatelskich. Laureatami byli
  m.in. Mustafa Dżemilew, wieloletni przewodniczący Medżlisu Tatarów Krymskich, który
  walczył o prawa Tatarów na okupowanym Krymie; Żanna Niemcowa, córka Borysa Niemcowa,
  która kontynuuje dzieło ojca; Paweł Łatuszka, jeden z liderów białoruskiej opozycji
  demokratycznej; oraz kubańska dysydentka Berta Soler Fernández. Nagroda, organizowana
  przez Ministerstwo Spraw Zagranicznych we współpracy z Fundacją Instytut Lecha Wałęsy,
  odzwierciedla zaangażowanie Polski w ochronę wartości demokratycznych.'
