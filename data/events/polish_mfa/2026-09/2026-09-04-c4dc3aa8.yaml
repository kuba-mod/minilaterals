title: Spotkanie szefów dyplomacji Polski i Indii
text: Podczas spotkania ministrowie szczególną uwagę poświęcili możliwościom dalszego
  wykorzystania potencjału gospodarczego Polski i Indii. W 2025 r. wartość polsko-indyjskiej
  wymiany handlowej osiągnęła 5,6 mld EUR. W strukturze handlu znaczącą pozycję zajmują maszyny
  i urządzenia (28,5%) oraz produkty chemiczne (18,6%).  Szefowie dyplomacji zwrócili
  uwagę na to, że sfinalizowanie w styczniu negocjacji w sprawie umowy o wolnym handlu
  UE–Indie otwiera nowe perspektywy dla przedsiębiorców. Szczególny potencjał widzimy
  we współpracy przemysłów obronnych i nowych technologiach, m.in. w sektorze kosmicznym.
  Fundamentem naszej współpracy będą doświadczenia polskich i indyjskich firm oraz
  historyczna misja Ax-4 na Międzynarodową Stację Kosmiczną, w której brali udział
  nasi Rodacy – Sławosz Uznański-Wiśniewski i Shubhanshu Shukla Ministrowie rozmawiali
  również o możliwościach rozwoju powiązań transportowych, infrastrukturalnych, energetycznych
  i cyfrowych między Indiami a Polską i Europą. Zwrócili uwagę na możliwe synergie
  między projektem India–Middle East–Europe Economic Corridor (IMEC) a Inicjatywą
  Trójmorza. Podczas spotkania szefowie dyplomacji Polski i Indii omówili także bieżącą
  sytuację bezpieczeństwa w Europie. Minister Jaishankar przedstawił wnioski ze swoich
  ostatnich rozmów w Kijowie, natomiast wicepremier Sikorski zaprezentował polską
  ocenę sytuacji w Ukrainie i jej szerszych konsekwencji dla bezpieczeństwa europejskiego
  i globalnego. Ministrowie zgodzili się, że konieczne są dalsze wysiłki zmierzające
  do zakończenia wojny i osiągnięcia trwałego pokoju. Wojny nie mają zwycięzców. Każdy
  dodatkowy dzień to więcej zniszczeń, więcej śmierci, więcej strachu dla uczestników.
  Niesie to również koszty dla reszty świata. Nasze wysiłki muszą skupić się na promowaniu
  dialogu i dyplomacji. Musimy robić co w naszej mocy, w taki sposób, który naszym
  zdaniem będzie maksymalnie skuteczny - mówił minister Subrahmanyam Jaishankar. Szefowie
  dyplomacji rozmawiali także o sytuacji na Bliskim Wschodzie. Ministrowie porównali
  polskie i indyjskie podejście do najważniejszych wyzwań dla bezpieczeństwa i stabilności
  międzynarodowej. Wicepremier Radosław Sikorski poinformował również o rezultatach
  ostatniego spotkania Grupy Wyszehradzkiej w Bratysławie. Ministrowie omówili możliwości
  rozwijania dialogu polsko-indyjskiego także z wykorzystaniem szerszych formatów
  regionalnych i wielostronnych. Szczególną uwagę zwrócili na współpracę w ramach
  G20, w tym perspektywę większego i długofalowego zaangażowania Polski w prace tego
  forum. Wizyta Ministra Jaishankara w Warszawie potwierdza wyraźną intensyfikację
  współpracy między Polską a Indiami. Na początku 2026 roku wicepremier Radosław Sikorski
  był z wizytą w Indiach. Odbyły się także wizyty na szczeblu wiceministrów, w tym
  India-EU Forum (6-7 lutego), AI Impact Summit (19-20 lutego), Raisina Dialogue (5-7
  marca), Wspólna Komisja Gospodarcza (13-14 lipca), konsultacje sektorowe (27-28
  sierpnia). Na koniec września planowana jest oficjalna wizyta w Polsce przewodniczącego
  Lok Sabha, czyli niższej izby indyjskiego parlamentu. Ta regularność spotkań na
  najwyższym szczeblu pokazuje wagę, jaką obie strony przykładają do budowania silnych
  relacji i wspólnego reagowania na wyzwania współczesnego świata.
