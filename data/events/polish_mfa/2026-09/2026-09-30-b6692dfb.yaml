title: Ogłoszenie konkursu na stanowisko Dyrektora Polskiego Instytutu Spraw Międzynarodowych
text: 'O stanowisko dyrektora może ubiegać się osoba spełniająca następujące kryteria:
  Kandydaci zobowiązani są do złożenia następujących dokumentów i oświadczeń: Kandydaci
  mogą dołączyć do zgłoszenia (aplikacji) listy rekomendacyjne. Kryteria oceny predyspozycji
  i umiejętności kandydatów: Dokumenty należy składać w Ministerstwie Spraw Zagranicznych
  w zamkniętej kopercie (Dziennik Podawczy czynny w godzinach poniedziałek 08:00 –
  18:00, przerwa 12:00-12:30, oraz wtorek-piątek 8:30 – 16:00, przerwa 12:00-12:30)
  lub przesłać pocztą w terminie do 21 października 2026 r. (decyduje data wpływu)
  na adres: z dopiskiem: Konkurs Dyrektor PISM 2026/1 Dodatkowe informacje dotyczące
  zatrudnienia i wynagrodzenia można uzyskać: [1]  Osoba, która zostanie wyłoniona
  w drodze konkursu na stanowisko dyrektora Polskiego Instytutu Spraw Międzynarodowych
  będzie zobowiązana dostarczyć przed zatrudnieniem zaświadczenie o niekaralności
  za przestępstwa popełnione umyślnie lub za przestępstwa skarbowe popełnione umyślnie
  oraz zaświadczenie lekarskie o stanie zdrowia stwierdzające brak przeciwwskazań
  do zatrudnienia. Informacja dotycząca przetwarzania przez MSZ danych osobowych kandydatów
  biorących udział w konkursie na stanowisko Dyrektora Polskiego Instytutu Spraw Międzynarodowych
  (PISM), stanowiąca realizację obowiązku określonego w art. 13 rozporządzenia Parlamentu
  Europejskiego i Rady (UE) 2016/679 z dnia 27 kwietnia 2016 r. w sprawie ochrony
  osób fizycznych w związku z przetwarzaniem danych osobowych i w sprawie swobodnego
  przepływu takich danych oraz uchylenia dyrektywy 95/46/WE (RODO) (Dz. Urz. UE L
  119 z 4.05.2016 r., s. 1 oraz Dz. Urz. UE L 127 z 23.05.2018 r., s. 2). a) w Ministerstwie
  Spraw Zagranicznych i placówkach zagranicznych, Al. J. Ch. Szucha 23, 00-580 Warszawa,
  adres e-mail: iod@msz.gov.pl . b) w Polskim Instytucie Spraw Międzynarodowych iodo@pism.pl
  , Warszawa Szańcowa 74/1, 01-458 Warszawa Odrębną kategorię odbiorców mogą stanowić
  podmioty przetwarzające dane osobowe na zlecenie Administratora, w szczególności
  dostawcy usług IT.'
