title: Wiceminister Ignacy Niemczycki uczestniczył w posiedzeniu Rady do Spraw Ogólnych
  w Brukseli
text: 'W dyskusji o Wieloletnich Ramach Finansowych wiceszef wskazał najważniejsze
  dla Polski kwestie dotyczące wydatków, zwracając szczególną uwagę na wysokość środków
  przeznaczonych dla Polski na politykę spójności i Wspólną Politykę Rolną. Podkreślił
  także, że nowy budżet UE musi odpowiadać na aktualną sytuację bezpieczeństwa i zagrożenia
  ze strony Rosji. „Polityka spójności i Wspólna Polityka Rolna pozostają kluczowymi
  instrumentami realizacji celów UE. Jednocześnie przyczyniają się do wzmacniania
  europejskiej konkurencyjności, odporności oraz bezpieczeństwa żywnościowego" - 
  podkreślił wiceminister Ignacy Niemczycki. W rozmowie o dochodach budżetu UE sekretarz
  stanu w MSZ powiedział, że Polska jest gotowa kontynuować rozmowy na temat nowych
  źródeł finansowania budżetu UE. Zauważył przy tym, że nie powinny one prowadzić
  do większych obciążeń finansowych dla słabiej rozwiniętych państw członkowskich.
  Ministrowie omówili także agendę październikowego posiedzenia Rady Europejskiej.
  Wiceminister Ignacy Niemczycki podkreślił niezmienność stanowiska Polski wobec rosyjskiej
  agresji na Ukrainę, solidarność z Ukrainą oraz konieczność powrotu do dyskusji o
  wykorzystaniu zamrożonych rosyjskich aktywów. Ponadto, opowiedział się za potrzebą
  wypracowania innowacyjnych rozwiązań wobec działań hybrydowych Rosji oraz presji
  migracyjnej. Podczas rozmów o praworządności sekretarz stanu wskazał, że Polska
  popiera cele Dialogu w Radzie UE takie jak: promowanie i ochronę praworządności
  oraz wymianę najlepszych praktyk w duchu wzajemnego szacunku. Podkreślił także znaczenie
  praworządności dla rozwoju gospodarczego słowami: „Szersze uwzględnienie głosu biznesu
  oraz pogłębiona analiza działalności organów regulacyjnych, w tym organów zamówień
  publicznych i ochrony konkurencji, powinny przyczynić się do zwiększenia pewności
  prawa dla małych i średnich przedsiębiorstw, wzmocnić konkurencyjność UE oraz poprawić
  funkcjonowanie rynku wewnętrznego". Wystąpienie dla mediów wiceministra Niemczyckiego
  do obejrzenia TUTAJ .'
