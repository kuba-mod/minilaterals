title: Wicepremier Radosław Sikorski wziął udział w spotkaniu Grupy V4+ w Bratysławie
text: Słowacja reaktywuje po dwuletniej przerwie dialog szefów dyplomacji V4 – Polski,
  Słowacji, Czech i Węgier, rozszerzając jednocześnie format współpracy V4+. Gościem
  specjalnym spotkania Grupy Wyszehradzkiej V4+ w słowackim Tomasovie pod Bratysławą
  był szef dyplomacji Japonii Toshimitsu Motegi. Grupa Wyszehradzka jest z powrotem.
  (…) Dzięki temu możemy znowu sobie ufać i ponownie różne rzeczy ustalać. (…) Wspólnie
  znaczymy więcej Rozmowy koncentrowały się na rozwoju potencjału współpracy Japonii
  z Europą Środkową oraz Unią Europejską, a także na globalnych wyzwaniach bezpieczeństwa,
  z którymi mierzy się wschodnia flanka NATO oraz region Indo-Pacyfiku. Dyskusja ministrów
  potwierdziła, że w kontekście bezpieczeństwa obszary euroatlantycki i indopacyficzny
  stają się coraz bardziej powiązane. Z tego względu niezwykle istotne jest zacieśnienie
  współpracy Japonii z NATO i wkład Tokio w programy pomocowe dla Ukrainy. Wicepremier
  Sikorski podkreślił, że Polska przywiązuje dużą wagę do stabilności i bezpieczeństwa
  regionu Indo-Pacyfiku, a współpraca między Europą a państwami tego regionu w kwestiach
  szeroko pojmowanego bezpieczeństwa ma zasadnicze znaczenie. Europa Środkowa może
  osiągnąć więcej wspólnie z Japonią. Szczególne znaczenie ma dla nas współpraca gospodarcza,
  a także współpraca naukowa, w tym w zakresie najnowocześniejszych technologii podkreślił
  po spotkaniach szef polskiej dyplomacji Radosław Sikorski. Ponadto Polska przywiązuje
  również dużą wagę do pełnego wdrożenia Umowy o partnerstwie gospodarczym oraz Umowy
  o partnerstwie strategicznym między Japonią a Unią Europejską. Na marginesie konsultacji
  V4+ minister Sikorski spotkał się z szefem japońskiej dyplomacji Toshimitsu Motegi.
  Wśród głównych tematów rozmowy znalazły się m.in. uruchomienie dialogu bezpieczeństwa
  i obrony w formule „Quadriga”, a także współpraca przemysłów obronnych i w obszarze
  technologii podwójnego zastosowania. Szef polskiej dyplomacji zabiegał również o
  wsparcie Japonii dla dalszego i stałego udziału Polski w pracach G20. Rosnąca dynamika
  współpracy polsko-japońskiej jest konsekwencją wizyty Premiera RP Donalda Tuska
  w Japonii (14–15 kwietnia 2026 r.) oraz podniesienia stosunków bilateralnych do
  rangi wszechstronnego partnerstwa strategicznego. Japonia jest jednym z największych
  inwestorów w Polsce spoza Unii Europejskiej. Polska staje się coraz ważniejszym
  partnerem gospodarczym i inwestycyjnym dla Japonii, nie tylko ze względu na wzrost
  obrotów handlowych i inwestycje bezpośrednie, ale także ze względu na rolę, jaką
  Polska odgrywa w Europie Środkowej i Wschodniej oraz w UE. Grupa Wyszehradzka (V4)
  jest nieformalną regionalną formą współpracy czterech państw Środkowej Europy -
  Polski, Czech, Słowacji i Węgier, które łączy nie tylko sąsiedztwo i podobne uwarunkowania
  geopolityczne, ale przede wszystkim wspólna historia, tradycja, kultura oraz wartości.
