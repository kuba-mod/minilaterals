title: V runda konsultacji politycznych Polski i Kuwejtu
text: Wiceministrowie omówili perspektywy rozwoju relacji dwustronnych, współpracy
  gospodarczej i konsularnej oraz najważniejsze wyzwania dla bezpieczeństwa regionalnego
  i międzynarodowego. Spotkanie było kolejną odsłoną regularnego dialogu politycznego
  Polski i Kuwejtu. Istotną część konsultacji stanowiła dyskusja o sytuacji na Bliskim
  Wschodzie oraz w Europie Wschodniej. Przedyskutowano wpływ trwającego konfliktu
  między Stanami Zjednoczonymi a Iranem na sytuację w Zatoce Perskiej – ze szczególnym
  uwzględnieniem bezpieczeństwa regionalnego, ochrony infrastruktury krytycznej oraz
  stabilności gospodarczej. Szczególną uwagę poświęcono bezpieczeństwu żeglugi przez
  Cieśninę Ormuz i ciągłości dostaw surowców energetycznych. Obie strony podkreśliły
  znaczenie działań dyplomatycznych na rzecz ograniczenia eskalacji i utrzymania stabilności
  międzynarodowego handlu, a także potrzebę przestrzegania zasad prawa międzynarodowego
  i Karty Narodów Zjednoczonych.
