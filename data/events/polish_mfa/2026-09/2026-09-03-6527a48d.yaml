title: 35-lecie powstania Trójkąta Weimarskiego
text: Podczas trójstronnych konsultacji szefowie dyplomacji Radosław Sikorski, Johan
  Wadephul i Jean-Noël Barrot omówili kluczowe kwestie dotyczące polityki europejskiej
  i transatlantyckiej. Ministrowie rozmawiali o współpracy obronnej oraz walce z dezinformacją,
  FIMI (zagranicznej ingerencji i manipulacji w środowisku informacyjnym) i zagrożeniami
  hybrydowymi. Poruszyli także temat sytuacji na Bliskim Wschodzie, przede wszystkim
  w rejonie Cieśniny Ormuz. Szefowie dyplomacji zwrócili też uwagę na znaczącą dynamikę
  spotkań w ramach Trójkąta Weimarskiego. Wskazywali na potencjał relacji trójstronnych,
  zwłaszcza w dziedzinach polityki europejskiej, bezpieczeństwa, współpracy cyfrowej,
  naukowej czy kosmicznej. W przyjętej podczas jubileuszowego spotkania deklaracji
  ministrowie potwierdzili chęć wspólnego przeciwstawiania się zagrożeniom dla bezpieczeństwa
  Europy, które wynikają z agresywnej i imperialistycznej polityki Rosji. Wicepremier
  Sikorski podkreślił, że Polska wspiera reakcję i decyzje Ministra Wadephula w związku
  z agresywnymi działaniami Rosji na terytorium Niemiec, w tym decyzje o zamknięciu
  konsulatu Rosji w Bonn i Rosyjskiego Domu w Berlinie. Nie zgadzamy się na bezkarne
  testowanie naszych granic i wrogie działania na naszych terytoriach. Nie ma zgody
  na podpalenia, ataki na kolei i inne prowokacje, które stwarzają zagrożenia dla
  naszych obywateli. Polska też wezwała ambasadora Rosji po to, aby wyrazić nasze
  stanowcze potępienie dla terroryzmu państwowego autorstwa Federacji Rosyjskiej. Bo
  to, co jest problemem jednego z sojuszników, jest problemem całego sojuszu. Rosja
  Putina pozostaje jednym z najpoważniejszych zagrożeń bezpieczeństwa nie tylko dla
  Europy, ale dla całego Ładu Światowego Szefowie dyplomacji zapewnili, że nadal będą
  wspierać walczącą Ukrainę. Zgodzili się, że bez suwerennej Ukrainy nie będzie bezpiecznej
  Europy. Partnerzy potwierdzili, że popierają stanowisko Polski w kwestii zwiększania
  konkurencyjności Europy m.in. poprzez budowanie niezależności technologicznej i
  ekonomicznej, przy zachowaniu partnerskich relacji z USA. Szefowie dyplomacji zapowiedzieli
  też wspólne przeciwdziałanie dezinformacji oraz zobowiązali się do rozwoju dalszej
  współpracy. Wicepremier Radosław Sikorski zaznaczył, że konieczne są regularne trójstronne
  konsultacje polityczne, dlatego zaprosił swoich odpowiedników z Francji i Niemiec
  na kolejne spotkanie ministrów spraw zagranicznych Trójkąta Weimarskiego w Polsce.
  Format Trójkąta Weimarskiego został zainicjowany w 1991 r. w Weimarze przez ministrów
  spraw zagranicznych Polski, Francji i Niemiec - Krzysztofa Skubiszewskiego, Rolanda
  Dumasa i Hansa-Dietricha Genschera. Jego celem było zacieśnienie współpracy między
  trzema państwami oraz przezwyciężenie linii podziałów w Europie, poprzez integrację
  Polski ze strukturami europejskimi i euroatlantyckimi. Z czasem charakter współpracy
  zmieniał się i dostosowywał do bieżących wyzwań, jednak zapisy Deklaracji Weimarskiej
  w sprawie Przyszłości Europy z 1991 r. nie straciły na aktualności. „Stoimy przed
  niepowtarzalną szansą budowy nowej Europy, za którą wszyscy ponosimy odpowiedzialność,
  w duchu ludzkiej solidarności, świadomi splatania się naszych losów, opierając się
  na dziedzictwie wspólnych wartości “- pisali ministrowie. Od 35 lat Trójkąt Weimarski
  potwierdza swoją skuteczność poprzez przezwyciężanie podziałów, budowę zaufania
  i otwartość na dialog.
