title: Sekretarz stanu Ignacy Niemczycki na nieformalnym posiedzeniu Rady do Spraw
  Ogólnych w Dublinie
text: 'W dyskusji o budżecie wzięli udział posłowie sprawozdawcy Parlamentu Europejskiego.
  Uczestnicy dyskutowali o tym, jak przyszły unijny budżet może wzmacniać konkurencyjność,
  bezpieczeństwo i obronność. Wiceminister Ignacy Niemczycki podkreślił rolę polityki
  spójności oraz Wspólnej Polityki Rolnej w reakcji Unii Europejskiej na współczesne
  wyzwania. Inwestycje finansowane z polityki spójności pomagają odpowiedzieć także
  na nowe wyzwania związane z bezpieczeństwem i obroną np. poprzez inwestycje podwójnego
  zastosowania. Z kolei konkurencyjność i spójność to dwie strony tej samej monety
  i nie powinny być sobie przeciwstawiane. To właśnie polityka spójności przyczyniła
  się do rozwoju polskiej gospodarki i przez to wzmocniła europejską konkurencyjność
  - zaznaczył wiceszef MSZ Ignacy Niemczycki. Sekretarz stanu opowiedział się także
  za szerokim, ogólnoeuropejskim dostępem do tych części przyszłego budżetu UE, w
  których środki mają znacząco wzrosnąć – zwłaszcza do programu Horyzont Europa oraz
  Europejskiego Funduszu Konkurencyjności. Podczas rozmowy z państwami kandydującymi
  do Unii Europejskiej wiceminister Niemczycki przedstawił wspólne stanowisko państw
  Trójkąta Weimarskiego. Rozszerzenie jest geopolityczną koniecznością – wzmocni nasze
  bezpieczeństwo i scali nasz kontynent. Każde dotychczasowe rozszerzenie przynosiło
  korzyści zarówno państwom kandydującym, jak i Unii Europejskiej oraz jej państwom
  członkowskim. Jednocześnie tempo procesu akcesyjnego zależy od woli politycznej
  i wysiłków państw kandydujących w spełnianiu kryteriów członkostwa. Proces ten pozostaje
  oparty na konkretnych postępach Ministrowie Polski, Francji i Niemiec poparli inicjatywy,
  które stopniowo zbliżają państwa kandydujące do UE. Wskazali trzy szczególnie ważne
  obszary: szerszy udział państw kandydujących w unijnych programach z korzyścią dla
  obywateli, wymianę wiedzy oraz wzmacnianie odporności na dezinformację. Zaznaczyli
  jednocześnie, że państwa kandydujące muszą kontynuować reformy, zwłaszcza w tak
  podstawowych obszarach jak: praworządność, walka z korupcją oraz niezależność sądownictwa.
  Ministrowie ds. europejskich rozmawiali także o przyszłych traktatach akcesyjnych.
  Sekretarz stanu Ignacy Niemczycki potwierdził gotowość Polski do rozmów o mechanizmach
  zabezpieczających, zarówno w obszarze ochrony praworządności, jak i integralności
  jednolitego rynku oraz zasad uczciwej konkurencji.'
