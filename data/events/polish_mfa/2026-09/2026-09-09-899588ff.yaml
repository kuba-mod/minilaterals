title: Wizyta wicepremiera Radosława Sikorskiego na Łotwie
text: 'Podczas wizyty na Łotwie wicepremier Radosław Sikorski i Minister Spraw Zagranicznych
  Łotwy Baiba Braže odwiedzili bazę wojskową Ādaži, w której stacjonuje Wielonarodowa
  Brygrada NATO. Podczas spotkania szef polskiej dyplomacji podkreślił, że Polska
  i Łotwa stoją przed podobnymi zagrożeniami i wyzwaniami w dziedzinie bezpieczeństwa:
  Nasze kraje ostatnio doświadczają naruszeń przestrzeni powietrznej spowodowanych
  przez Rosję, presji migracyjnej na naszych granicach oraz innych wrogich działań
  sabotażowych – mówił wicepremier Radosław Sikorski i przypomniał, że Polska i Łotwa
  są liderami w NATO pod względem wydatków na obronność, na którą przeznaczają odpowiednio
  4,8% i 4,7% PKB. Wicepremier Sikorski podkreślił, że baza wojskowa w Ādaži jest
  symbolem polsko-łotewskiej współpracy w dziedzinie obronności. Grupa Bojowa, która
  stacjonuje w bazie jest prowadzona przez Kanadę i razem liczy około 2850 żołnierzy,
  w tym ponad 230 z naszego kraju. Trzon XIX zmiany Polskiego Kontyngentu Wojskowego
  Łotwa stanowią żołnierze XI Lubuskiej Dywizji Kawalerii Pancernej z Żagania. Wicepremier
  Sikorski spotkał się z polskimi żołnierzami i uczestniczył w prezentacji sprzętu
  wojskowego. Podczas wizyty na Łotwie wicepremier Radosław Sikorski wziął również
  udział w spotkaniu z szefami dyplomacji: Łotwy, Finlandii, Irlandii i Węgier. Ministrowie
  rozmawiali o zagrożeniach hybrydowych w Europie. Szef polskiej dyplomacji mówił
  o intensyfikacji wrogich działań hybrydowych Rosji wymierzonych w członków NATO
  i UE, w szczególności państwa wschodniej flanki. Podkreślił konieczność ścisłej
  współpracy na rzecz przeciwdziałania tego typu akcjom. Ministrowie omówili także
  kwestie rozszerzenia Unii Europejskiej, w szczególności dotychczasowe postępy Ukrainy,
  Mołdawii i państw Bałkanów Zachodnich. Wicepremier Sikorski zwrócił uwagę na potrzebę
  przeprowadzenia pogłębionej dyskusji na temat funkcjonowania UE w przyszłym, poszerzonym
  składzie. Rozmowy dotyczyły także sytuacji w rejonie Cieśniny Ormuz. Ministrowie
  zwrócili uwagę na potrzebę wypracowania dyplomatycznego rozwiązania konfliktu i
  przywrócenia wolnego, bezpiecznego przepływu przez Cieśninę Ormuz. Ministrowie złożyli
  także kwiaty pod Pomnikiem Wolności w Rydze, który upamiętnia żołnierzy poległych
  w wojnie o niepodległość Łotwy w latach 1918-1920.'
