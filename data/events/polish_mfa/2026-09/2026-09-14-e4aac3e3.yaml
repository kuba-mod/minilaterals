title: Gala II. edycji programu „Poland. Business Adventure”
text: '94 osoby wzięły udział w tegorocznej edycji „Poland. Business Adventure”. Stworzony
  przez MSZ program 3-miesięcznych staży biznesowych jest skierowany do przedstawicieli
  polskiej diaspory w wieku 21-35 lat. Jest realizowany we współpracy z Polską Agencją
  Inwestycji i Handlu S.A. Podczas gali drugiej edycji programu wicepremier Radosław
  Sikorski podkreślał, że program „Poland. Business Adventure” to coś znacznie więcej
  niż tylko okazja do zdobycia nowych doświadczeń zawodowych. To możliwość nawiązania
  przyjaźni z ciekawymi ludźmi z całego świata. To szansa na odkrycie kraju przodków,
  jego bogatej kultury, fascynującej historii, pięknego języka i jego sukcesów Uczestnicy
  „Poland. Business Adventure” nie tylko realizują staże, ale też poznają polską kulturę
  i uczą się języka polskiego. Podczas tegorocznej edycji razem odwiedzili kilka polskich
  miast, m.in. Kraków i Gdańsk. Szef polskiego MSZ podczas gali zaznaczył, że dla
  części stypendystów „Poland. Business Adventure” to dopiero początek kariery zawodowej
  w Polsce. Cieszy mnie, że niektóre firmy polskie, w których odbywacie staże, potraktowały
  ten 3-miesięczny czas jako okres próbny, którego zwieńczeniem będzie zawarcie umowy
  o pracę Wicepremier Sikorski podziękował także firmom partnerskim, które zdecydowały
  się przyjąć stypendystów z różnych zakątków świata oraz pokazać, jak rozwija się
  biznes w Polsce. Więcej na temat programu „Poland. Business Adventure": LINK'
