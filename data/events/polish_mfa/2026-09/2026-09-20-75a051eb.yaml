title: Oświadczenie MSZ dot. wyborów w Rosji
text: 'Przypominamy, że 12 października 2022 roku Zgromadzenie Ogólne ONZ przyjęło
  rezolucję ES-11/4 „Integralność terytorialna Ukrainy: obrona zasad Karty Narodów
  Zjednoczonych”, w której 143 państwa jednoznacznie potępiły zorganizowane przez
  Rosję nielegalne pseudoreferenda oraz próbę bezprawnej aneksji. Działania Federacji
  Rosyjskiej stanowią naruszenie suwerenności i integralności terytorialnej Ukrainy
  w jej międzynarodowo uznanych granicach oraz pozostają sprzeczne z podstawowymi
  zasadami prawa międzynarodowego i międzynarodowego prawa humanitarnego, w tym z
  obowiązkami wynikającymi z IV Konwencji Genewskiej. Pseudo-wybory organizowane przez
  rosyjskiego okupanta nie wywołują skutków prawnych ani nie mogą stanowić podstawy
  do legitymizowania próby aneksji okupowanych terytoriów. Wzywamy Federację Rosyjską
  do poszanowania prawa międzynarodowego, zaprzestania bezprawnych działań naruszających
  międzynarodowe zobowiązania oraz wycofania sił zbrojnych z terytorium Ukrainy.'
