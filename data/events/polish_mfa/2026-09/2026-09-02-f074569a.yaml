title: Oświadczenie MSZ
text: Stanowczo sprzeciwiamy się aktom sabotażu i próbom ataków hybrydowych na terytorium
  krajów NATO i UE. Wzmacnianie wschodniej flanki Sojuszu Północnoatlantyckiego i
  Unii Europejskiej oraz zapewnienie bezpieczeństwa obywateli i infrastruktury pozostaje
  naszym priorytetem. Działania Rosji nie osłabią naszej determinacji we wspieraniu
  Ukrainy w jej walce z agresorem. Polska nie ustanie w dążeniu, by terrorystyczne
  działania rosyjskie spotkały się z adekwatną odpowiedzią ze strony NATO i UE. Jesteśmy
  zdeterminowani, aby Rosja została objęte nowymi pakietami sankcji szczególnie mającymi
  na celu ograniczenie możliwości sektora obronnego i bezpieczeństwa.
