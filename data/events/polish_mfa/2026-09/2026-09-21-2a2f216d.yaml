title: Ogłoszenie o naborze kandydatów w wyborach do Komitetu Przeciwko Torturom
text: 'Komitet Przeciwko Torturom to organ traktatowy ONZ, który monitoruje wdrażanie
  Konwencji przeciwko torturom oraz innemu okrutnemu, nieludzkiemu lub poniżającemu
  traktowaniu lub karom wykonywanym przez państwa strony. Komitet działa w celu pociągnięcia
  państw do odpowiedzialności za naruszenia praw człowieka, systematycznie badając
  doniesienia o torturach dążąc do powstrzymania i zapobieżenia tym przestępstwom.
  Komitet składa się z 10 członków – niezależnych ekspertów nominowanych przez państwa
  będące stronami Konwencji, których kadencja trwa 4 lata (z możliwością ponownego
  wyboru jeden raz). Regularne sesje komitetu odbywają się zazwyczaj dwa razy do roku
  w Genewie, istnieje także możliwość zwołania sesji specjalnych. Koszty związane
  z udziałem w posiedzeniach komitetu pokrywane są przez ONZ. Wybory nowych członków
  Komitetu planowane są na październik 2027 r. w Genewie. Do obsadzenia w wyborach
  będzie 5 miejsc zwalnianych przez członków, których kadencja upływa w dniu 31 grudnia
  2027 r. Członkowie Komitetu Przeciwko Torturom wybierani są spośród zgłoszonych
  przez państwa kandydatów posiadających wysokie kwalifikacje moralne i znaczące doświadczenie
  zawodowe w obszarze ochrony praw człowieka, aktywności akademickiej, w tym publikacji
  naukowe związanych z zakresem prac Komitetu. W sprawowaniu swojej funkcji są niezależni
  i bezstronni, nie reprezentują państwa pochodzenia ani regionu, do którego państwo
  to należy. - osoby zatrudnione w organach władzy wykonawczej, - zajmujące stanowiska
  decyzyjne w instytucjach i organizacjach podległych organom władzy wykonawczej.
  Wymogi osoby kandydującej do organu traktatowego: Kandydatury osób spełniających
  wyżej przedstawione kryteria wraz z: należy przesłać pocztą na adres Ministerstwa
  Spraw Zagranicznych, Departament Spraw Globalnych (al. Szucha 23, 00-580 Warszawa)
  oraz pocztą elektroniczną na adres: dsg.sekretariat@msz.gov.pl do 23 października
  2026 r. (data wpłynięcia korespondencji do MSZ) Ministerstwo Spraw Zagranicznych
  po wytypowaniu kandydata Polski do Komitetu Przeciwko Torturom przeprowadzi międzynarodową
  kampanię promującą daną osobę. Dalsze informacje dotyczące działalności komitetu
  oraz wyborów można uzyskać pod adresami internetowymi: Więcej informacji nt. zakresu
  zadań ciał traktatowych systemu NZ i sposobu ich wykonywania, a także kwestii praktycznych
  związanych z udziałem w pracach komitetów dostępny jest na stronach OHCHR (Handbook
  for Human Rights Treaty Body Members - https://www.ohchr.org/en/publications/policy-and-methodological-publications/handbook-human-rights-treaty-body-members
  ). W razie pytań dot. wyborów do ciał traktatowych, prośba o kontakt z Departamentem
  Spraw Globalnych MSZ pod adresem poczty elektronicznej: dsg.sekretariat@msz.gov.pl
